uthor": "https://www.bcg.com/about/people/experts/david-parlongue", "word_count": 3223, "paywalled": false}}, {"record_id": "973579a6f2d92d7d", "source_type": "concepts", "source_name": "BCG Henderson Institute", "source_url": "https://www.bcg.com/publications/2026/composable-shelf-agentic-marketing", "title": "How the Composable Shelf Reinvents Marketing", "published_date": "2026-10-20", "language": "en", "processed_at": "2026-10-21T11:12:22Z", "processor": "claude-code-sub-opus", "tags": ["AI", "Tech"], "gist": "BCG proposes a 'Composable Shelf', a virtual reference layer above existing martech that records what each action, offer, and content asset is for, so AI agents can assemble individualized marketing interactions; BCG reports 3x ROI and 10x speed in client work. It argues consolidation alone cannot keep pace with AI-generated content and raises vendor lock-in, and lays out five organizational moves for governing agents.", "themes": [{"theme": "Composable Shelf replaces campaign assembly", "insights": [{"claim": "BCG argues traditional campaign-based marketing is obsolete because applying AI to individual steps (content, audience, offer) leaves the fragmented, manually stitched workflow intact.", "speaker": "BCG Henderson Institute", "type": "thesis", "entities": ["BCG"], "conviction": "high", "so_what": "Point-solution AI marketing tools may deliver limited gains versus workflow-level redesign.", "quote": "Traditional marketing had a good run, but it has long passed its expiration date.", "locator": "Traditional marketing had a good run", "quote_verified": true}, {"claim": "BCG proposes a 'Composable Shelf': a virtual reference layer above existing asset, content, and offer systems that lets AI agents select and assemble approved actions, offers, and content for each customer.", "speaker": "BCG Henderson Institute", "type": "framework", "entities": ["Composable Shelf", "AI agents"], "conviction": "high", "so_what": "Signals demand shifting toward metadata/orchestration layers rather than new monolithic marketing suites.", "quote": "The marketing assets remain where they are; what the shelf adds is a record of what each piece is for and what it can be combined with based on what rules.", "locator": "The Composable Shelf eliminates the shortcomings", "quote_verified": true}, {"claim": "Across BCG clients in retail, travel, banking, and healthcare services, the Composable Shelf approach has consistently delivered three times the ROI and ten times the speed from campaign initiation to implementation.", "speaker": "BCG Henderson Institute", "type": "data_point", "entities": ["BCG", "retail", "travel", "banking", "healthcare services"], "conviction": "high", "so_what": "Claimed 3x ROI / 10x speed (consultant-reported, client work) suggests material marketing-efficiency upside for adopters.", "quote": "BCG has consistently seen three times the ROI and ten times the speed from when the marketing campaign was initiated to implementation.", "locator": "Many companies have tried to solve", "quote_verified": true}, {"claim": "In a bank autopay example, the shelf links the action (activating autopay) to a 1,000-point offer and approved emails and images, letting an agent assemble a customer-tailored interaction instead of choosing from pre-designed campaigns for broad groups.", "speaker": "BCG Henderson Institute", "type": "anecdote", "entities": ["autopay", "bank"], "conviction": "medium", "so_what": "Illustrates how agentic marketing shifts from segment campaigns to individualized interactions in financial services.", "quote": null, "locator": "These links also enable agentic composition", "quote_verified": false}, {"claim": "Under the shelf model, marketers shift from assembling campaigns to curating the shelf, while the agent takes over assembly and deployment; the campaign is no longer the organizing principle of marketing work.", "speaker": "BCG Henderson Institute", "type": "causal", "entities": ["marketers", "AI agents"], "conviction": "high", "so_what": "Implies restructuring of marketing labor and agency/services work toward curation and governance.", "quote": "The campaign is no longer the organizing principle of their work; the shelf is.", "locator": "The change in the marketers", "quote_verified": true}]}, {"theme": "Purpose metadata and the action library", "insights": [{"claim": "Most marketing systems record what an asset is (format, rights, expiration date) but not what customer behavior it is meant to encourage; the shelf adds these missing purpose relationships.", "speaker": "BCG Henderson Institute", "type": "thesis", "entities": ["asset library"], "conviction": "high", "so_what": "The gap is purpose metadata, a wedge for vendors that tag intent rather than store more content.", "quote": "Today’s marketing systems generally record what something is (e.g., a product image) but not what it is for.", "locator": "Today’s marketing systems generally record", "quote_verified": true}, {"claim": "The shelf has three components: actions (what the business wants the customer to do), content (language and visuals), and offers (incentives such as discounts); every action needs content but not necessarily an offer.", "speaker": "BCG Henderson Institute", "type": "framework", "entities": ["actions", "content", "offers"], "conviction": "high", "so_what": "A simple taxonomy for evaluating agentic-marketing platforms and data readiness.", "quote": "Every action needs content, but it may or may not need an offer, and different content can be used with the same offer.", "locator": "These connections are what turn", "quote_verified": true}, {"claim": "Automated pipelines pull references and existing tags from source systems, AI reconciles competing taxonomies into a common model and enriches metadata, and AI proposes action-offer-content relationships that marketers confirm.", "speaker": "BCG Henderson Institute", "type": "framework", "entities": ["AI"], "conviction": "medium", "so_what": "Shows where AI adds value in data plumbing: taxonomy reconciliation and metadata enrichment.", "quote": "AI reconciles competing taxonomies into a common model and enriches incomplete metadata.", "locator": "Stocking the shelf does not mean", "quote_verified": true}, {"claim": "The action library is the one genuinely new asset the shelf requires, because desired customer actions today live in briefs, planning decks, and spreadsheets; BCG says it needs a senior marketing owner and should be treated as a marketing asset, not an IT one.", "speaker": "BCG Henderson Institute", "type": "thesis", "entities": ["action library"], "conviction": "high", "so_what": "Ownership of the action library becomes a strategic control point inside marketing organizations.", "quote": "Treat it as a marketing asset, not an IT one.", "locator": "Give the action library an owner", "quote_verified": true}]}, {"theme": "Why consolidation and platform lock-in fall short", "insights": [{"claim": "BCG says marketing-technology consolidation, the decade-long response to fragmentation, yields only incremental task improvements and suffers three flaws: it can never be finished, never be comprehensive, and can't keep pace with AI-generated content volume.", "speaker": "BCG Henderson Institute", "type": "contrarian", "entities": ["consolidation"], "conviction": "high", "so_what": "Challenges the thesis behind single-suite marketing cloud consolidation strategies.", "quote": "Because AI continuously generates content, the volume of material grows too fast to be effectively migrated and organized.", "locator": "A closer look reveals three shortcomings", "quote_verified": true}, {"claim": "Consolidation was designed to help people manage and retrieve assets, not to give an agent the purpose and relationships it needs; moving a file into a common repository does not record the customer action it is meant to drive.", "speaker": "BCG Henderson Institute", "type": "causal", "entities": ["consolidation", "agentic AI"], "conviction": "high", "so_what": "Existing DAM/repository investments may not translate into agentic readiness.", "quote": "Even with agentic AI, consolidation tells marketers what information they have, not what it is for.", "locator": "Agentic AI introduces yet another challenge", "quote_verified": true}, {"claim": "Concentrating marketing operations in a single platform raises vendor lock-in risk, binding the company to that vendor's roadmap, metadata model, and release schedule.", "speaker": "BCG Henderson Institute", "type": "causal", "entities": ["vendor lock-in"], "conviction": "medium", "so_what": "A headwind narrative for all-in-one marketing platform vendors and a tailwind for interoperable layers.", "quote": "the more the company must work within that vendor's roadmap, metadata model, and release schedule.", "locator": "Consolidation can also increase the risk", "quote_verified": true}, {"claim": "Because the shelf is a common catalog not tied to one platform, companies can swap content, offer, decision, or activation systems without losing accumulated taxonomy and purpose records; BCG calls it the inverse of vendor lock-in.", "speaker": "BCG Henderson Institute", "type": "thesis", "entities": ["Composable Shelf", "vendor lock-in"], "conviction": "high", "so_what": "Value accrues to the reference layer, potentially lowering switching costs and pricing power of underlying platforms.", "quote": "the Composable Shelf is the inverse of vendor lock-in", "locator": "This makes the Composable Shelf", "quote_verified": true}, {"claim": "BCG frames consolidation and the shelf as self-reinforcing rather than competing: consolidation simplifies existing systems while the shelf adds the layer needed for agentic activation, and the shelf need not wait for consolidation to finish.", "speaker": "BCG Henderson Institute", "type": "thesis", "entities": ["consolidation", "Composable Shelf"], "conviction": "medium", "so_what": "Adoption can proceed alongside ongoing martech programs, easing enterprise rollout.", "quote": "A Composable Shelf starts by moving nothing.", "locator": "So far, every fix using consolidation", "quote_verified": true}, {"claim": "The shelf holds ingredients at three levels tagged the same way: individual building blocks (offers, headlines, images), complete touchpoints (an approved email), and designed sequences (launch, onboarding, loyalty milestone), so not every interaction must be decomposed.", "speaker": "BCG Henderson Institute", "type": "framework", "entities": ["Composable Shelf"], "conviction": "medium", "so_what": "Lowers disruption to content teams, who keep their tools, processes, and approval chains.", "quote": null, "locator": "Composability also does not mean", "quote_verified": false}]}, {"theme": "Governing agents: rollout playbook for leaders", "insights": [{"claim": "BCG says building the shelf's technology is the easier part; the harder work is organizational: agreeing on desired customer actions, writing rules upfront, and ceding decisions to agents.", "speaker": "BCG Henderson Institute", "type": "thesis", "entities": ["BCG"], "conviction": "high", "so_what": "Adoption bottlenecks are organizational, favoring consulting and change-management spend over pure software.", "quote": "Building the technology behind the Composable Shelf is the easier part", "locator": "What Using the Composable Shelf Means", "quote_verified": true}, {"claim": "BCG recommends starting with a test on one customer behavior, measuring how long it takes and how many people are needed to find all relevant offers, content, and constraints, then turning that test into the first shelf pilot.", "speaker": "BCG Henderson Institute", "type": "framework", "entities": ["BCG"], "conviction": "medium", "so_what": "Provides a low-cost diagnostic for gauging an organization's agentic-marketing readiness.", "quote": "an agent can only work with what it can find and understand.", "locator": "Run the test, then make it the pilot", "quote_verified": true}, {"claim": "Legal and brand teams should write rules upfront on region, rights, embargoes, and eligibility, so the agent applies them each time it assembles an interaction instead of routing every finished interaction through approval.", "speaker": "BCG Henderson Institute", "type": "causal", "entities": ["legal", "brand"], "conviction": "medium", "so_what": "Shifting compliance to rule-setting removes a key throughput bottleneck in personalized marketing.", "quote": "Bring legal and brand teams in to write the rules, not review the output.", "locator": "Bring legal and brand teams in", "quote_verified": true}, {"claim": "Agent autonomy should widen gradually: let agents compose freely only from preapproved ingredients for always-on, lower-stakes actions, keep designed sequences intact, retain human approval where regulation or brand exposure requires, and expand latitude as results come in.", "speaker": "BCG Henderson Institute", "type": "framework", "entities": ["AI agents"], "conviction": "medium", "so_what": "Expect staged, slow autonomy expansion, especially in regulated sectors like banking and healthcare.", "quote": "Expand the agent’s latitude as the results come in, not before.", "locator": "Decide what the agent may do on its own", "quote_verified": true}, {"claim": "BCG argues marketing performance metrics must shift from campaign counts and campaign performance toward whether the shelf covers priority customer actions with current approved content and offers, and how those ingredients perform when agents use them.", "speaker": "BCG Henderson Institute", "type": "prediction", "entities": ["marketing leaders"], "conviction": "medium", "so_what": "Changing KPIs signal a reorganization of marketing roles and budget allocation.", "quote": null, "locator": "Change the job, then change how success", "quote_verified": false}, {"claim": "BCG advises starting with the shelf rather than the intelligence engine, since engines and vendors may be replaced while the shelf's options, relationships, and rules persist; none of the five moves requires choosing a new platform first.", "speaker": "BCG Henderson Institute", "type": "contrarian", "entities": ["intelligence engine", "Composable Shelf"], "conviction": "high", "so_what": "Suggests durable value sits in proprietary marketing data structures, not in any given AI engine vendor.", "quote": "That is why the place to start is the shelf rather than the engine.", "locator": "That is why the place to start", "quote_verified": true}]}], "insight_total": 21, "top_entities": ["Composable Shelf", "BCG", "AI agents", "action library", "consolidation", "vendor lock-in", "autopay", "banking", "retail", "healthcare services"], "source_meta": {"author": "https://www.bcg.com/about/people/experts/palumbo-silvio", "word_count": 2697, "paywalled": false}}, {"record_id": "e00afd5af3b6a601", "source_type": "concepts", "source_name": "BCG Henderson Institute", "source_url": "https://www.bcg.com/publications/2026/countries-most-ready-for-ai", "title": "AI Is Transforming How Economies Develop and Compete: The AI Maturity Matrix 2026", "published_date": "2026-10-20", "language": "en", "processed_at": "2026-10-21T11:11:43Z", "processor": "claude-code-sub-opus", "tags": ["AI", "Macro", "Geopolitics", "Energy", "Society"], "gist": "BCG's 2026 AI Maturity Matrix (75+ economies, 33 indicators) finds enterprise AI investment doubled in 2026 and that national AI advantage now hinges on how fast exposure is converted into deployed capability, not on having a strategy. Only 8 economies moved up an archetype (Japan and South Korea joined the AI Pioneers), while physical constraints (power, permits, grid interconnection) and a shrinking cross-border AI talent pool are now the binding limits on where AI value gets built.", "themes": [{"theme": "AI shifts from potential to realized economic value", "insights": [{"claim": "Enterprise investment in AI doubled in 2026 versus the previous year, with growth touching every industry, according to BCG.", "speaker": "BCG Henderson Institute", "type": "data_point", "entities": ["BCG"], "conviction": "high", "so_what": "A doubling of enterprise AI spend supports continued demand for compute, cloud and AI-enabling infrastructure across sectors.", "quote": "Enterprise investment in AI doubled in 2026 from the previous year and that growth touches every industry.", "locator": "BCG Answer", "quote_verified": true}, {"claim": "In a recent BCG survey, nearly nine in ten CEOs reported cost or revenue benefits from their AI investments, which BCG reads as an early sign AI is shifting from potential to actual value creation.", "speaker": "BCG Henderson Institute", "type": "data_point", "entities": ["BCG"], "conviction": "high", "so_what": "Reported ROI from CEOs weakens the 'AI capex without returns' bear case and supports sustained enterprise budgets.", "quote": "nearly nine in ten CEOs reported cost or revenue benefits resulting from their AI investment", "locator": "BCG Answer", "quote_verified": true}]}, {"theme": "The AI Maturity Matrix framework: exposure x readiness", "insights": [{"claim": "BCG's 2026 AI Maturity Matrix scores more than 75 economies on AI exposure and AI readiness across 33 indicators, adding three new indicators this year covering compute, domestic model development, and regulation.", "speaker": "BCG Henderson Institute", "type": "framework", "entities": ["AI Maturity Matrix", "BCG"], "conviction": "high", "so_what": "Compute and sovereign model capacity are now formally part of how national AI competitiveness is benchmarked, signalling where governments will direct spending.", "quote": "with three new indicators on compute, domestic model development, and regulation added to our analysis this year", "locator": "BCG Answer", "quote_verified": true}, {"claim": "BCG measures national AI readiness with its ASPIRE framework, covering six dimensions: Ambition, Skills, Policy and regulation, Investment, Research and innovation, and Ecosystem.", "speaker": "BCG Henderson Institute", "type": "framework", "entities": ["ASPIRE framework", "BCG"], "conviction": "high", "so_what": "Gives a checklist for comparing country-level AI policy and investment attractiveness.", "quote": null, "locator": "Readiness, the Matrix’s second measure", "quote_verified": false}, {"claim": "BCG sorts economies into six archetypes from highest to lowest readiness: AI Pioneers, Contenders (Steady and Rising), Practitioners (Exposed and Gradual), and AI Emergents, with subgroups based on exposure.", "speaker": "BCG Henderson Institute", "type": "framework", "entities": ["AI Pioneers", "AI Maturity Matrix"], "conviction": "high", "so_what": "Archetype migration can be tracked as a leading indicator of which countries will attract AI capital and hyperscaler commitments.", "quote": null, "locator": "Within the overall matrix, we classified", "quote_verified": false}]}, {"theme": "Execution speed, not strategy, separates national AI leaders", "insights": [{"claim": "Nearly every economy improved on at least one ASPIRE dimension in 2026, but only eight moved up to a more advanced archetype: Japan, South Korea, Greece, the Czech Republic, Chile, Lithuania, Ecuador, and Nigeria.", "speaker": "BCG Henderson Institute", "type": "data_point", "entities": ["Japan", "South Korea", "Greece", "Czech Republic", "Chile", "Lithuania", "Ecuador", "Nigeria"], "conviction": "high", "so_what": "Identifies the economies with improving AI momentum, including less obvious emerging-market names like Chile, Ecuador and Nigeria.", "quote": null, "locator": "AI Readiness Is Improving Everywhere", "quote_verified": false}, {"claim": "Japan and South Korea joined the AI Pioneers tier alongside established pioneers Canada, Mainland China, Singapore, the United Kingdom, and the United States.", "speaker": "BCG Henderson Institute", "type": "data_point", "entities": ["Japan", "South Korea", "Canada", "Mainland China", "Singapore", "United Kingdom", "United States", "AI Pioneers"], "conviction": "high", "so_what": "The top tier of AI economies is widening in Asia, which matters for regional data center, semiconductor and AI-ecosystem investment flows.", "quote": null, "locator": "AI Readiness Is Improving Everywhere", "quote_verified": false}, {"claim": "Japan rose by using its ability to attract partners and an AI-friendly regulatory framework to build its ecosystem and secure large hyperscaler commitments, while South Korea led on domestic model development and directed large-scale public investment into its ecosystem and compute.", "speaker": "BCG Henderson Institute", "type": "causal", "entities": ["Japan", "South Korea"], "conviction": "high", "so_what": "Two distinct winning playbooks: partner-led hyperscaler attraction (Japan) versus state-funded sovereign models and compute (South Korea).", "quote": "Japan leveraged its ability to attract partners and an AI-friendly regulatory framework to build up its ecosystem and secure large hyperscaler commitments.", "locator": "AI Readiness Is Improving Everywhere", "quote_verified": true}, {"claim": "AI ambition no longer differentiates economies because nearly every one now has a published AI strategy; what sets the fastest improvers apart is the scale and speed at which they built capability.", "speaker": "BCG Henderson Institute", "type": "contrarian", "entities": ["AI Maturity Matrix"], "conviction": "high", "so_what": "Investors should judge countries on deployed compute, capital and partnerships, not on announced AI strategies.", "quote": "Nearly every economy now has a published AI strategy, and what differentiates the economies that made the most progress on the Matrix is the scale and speed at which their capability was built up.", "locator": "AI Readiness Is Improving Everywhere", "quote_verified": true}]}, {"theme": "AI exposure migrates from knowledge work to the physical economy", "insights": [{"claim": "AI exposure is currently greatest in language- and code-intensive knowledge work, but as embodied AI scales across humanoid robotics and industrial automation, manufacturing, logistics, and agriculture are expected to become more exposed.", "speaker": "BCG Henderson Institute", "type": "prediction", "entities": ["embodied AI", "humanoid robotics", "industrial automation"], "conviction": "medium", "so_what": "Points to the next leg of AI disruption and opportunity in robotics, industrial automation and physical-sector incumbents.", "quote": "A shift toward disruption of the physical economy is already underway as embodied AI (physical AI that operates machines, robots, and vehicles) grows in capability and scales.", "locator": "An economy’s AI exposure is largely determined", "quote_verified": true}, {"claim": "The rise of agentic AI, which carries out multistep tasks rather than assisting with a single task, has widened the range of jobs AI can reshape, so BCG now measures exposure at the task level using enterprise data, hiring patterns, and capital flows.", "speaker": "BCG Henderson Institute", "type": "causal", "entities": ["agentic AI"], "conviction": "medium", "so_what": "Labor-market exposure estimates are rising as agents expand scope, raising both productivity upside and displacement risk.", "quote": null, "locator": "Exposure: Which Sectors and Jobs", "quote_verified": false}, {"claim": "Businesses are choosing between workforce augmentation (redesigning roles for human-AI collaboration) and substitution (AI performing tasks previously done by people), and national policy follows those choices.", "speaker": "BCG Henderson Institute", "type": "framework", "entities": [], "conviction": "medium", "so_what": "The augmentation-versus-substitution mix will shape labor costs, margins and the political backlash risk around AI adoption.", "quote": null, "locator": "Business leaders’ workforce strategy choice", "quote_verified": false}, {"claim": "Economies with lower current AI exposure can still benefit through sector spillover, as AI deployed at scale in an anchor industry builds capability in the engineering, logistics, and service suppliers around it.", "speaker": "BCG Henderson Institute", "type": "thesis", "entities": [], "conviction": "medium", "so_what": "Suppliers clustered around AI-adopting anchor industries may see second-order gains that are not captured by direct exposure scores.", "quote": null, "locator": "Lower existing AI exposure still leaves room", "quote_verified": false}]}, {"theme": "Talent scarcity and physical infrastructure as binding constraints", "insights": [{"claim": "Cross-border relocation of AI talent fell 12% in 2025, shrinking the pool of mobile top-tier AI-native professionals and intensifying competition for them.", "speaker": "BCG Henderson Institute", "type": "data_point", "entities": ["BCG Global Talent tracker"], "conviction": "high", "so_what": "Scarcer mobile AI talent implies rising compensation costs and an advantage for countries and firms that already hold talent.", "quote": "cross-border relocation of AI talent fell 12% in 2025, increasing the competition for an even smaller hiring population", "locator": "Skills.", "quote_verified": true}, {"claim": "The constraints on where AI capacity gets built are now physical: power availability, permitting speed, and interconnection ability decide where AI facilities are placed.", "speaker": "BCG Henderson Institute", "type": "thesis", "entities": [], "conviction": "high", "so_what": "Power generation, grid interconnection and fast-permitting jurisdictions become the scarce assets in the AI build-out.", "quote": "Power availability, permitting speed, and interconnection ability are what decide placement of AI facilities.", "locator": "Ecosystem.", "quote_verified": true}, {"claim": "BCG argues an AI ecosystem score gauges institutional agility rather than just installed infrastructure, since chips, compute and cloud are only usable with electricity and connectivity, and partnership selection is part of the equation.", "speaker": "BCG Henderson Institute", "type": "framework", "entities": [], "conviction": "medium", "so_what": "Governance speed on permits and grid access may be a better predictor of AI capex location than current data center stock.", "quote": "The ecosystem is therefore a gauge of institutional agility, not just a measure of installed infrastructure.", "locator": "Ecosystem.", "quote_verified": true}]}, {"theme": "Policy and investment models for capturing AI value", "insights": [{"claim": "Countries now use AI policy to attract investment as much as to constrain risk, but the gap between minimal-constraint regimes and oversight-based regimes is fading as responsible-AI provisions on transparency, redress, and human oversight become a condition of sustained adoption.", "speaker": "BCG Henderson Institute", "type": "thesis", "entities": [], "conviction": "medium", "so_what": "Regulatory convergence reduces regime arbitrage and implies baseline compliance costs for AI deployers everywhere.", "quote": null, "locator": "Policy.", "quote_verified": false}, {"claim": "Economies have pursued three AI investment models (concentrated sovereign capital, multilateral country partnerships, and hyperscaler partnerships) that determine how much AI capability they control.", "speaker": "BCG Henderson Institute", "type": "framework", "entities": ["hyperscalers"], "conviction": "medium", "so_what": "Maps the demand channels for sovereign AI spending and hyperscaler deals that drive compute build-outs outside the US.", "quote": "concentrated sovereign capital, multilateral country partnerships, and hyperscaler partnerships", "locator": "Investment.", "quote_verified": true}, {"claim": "Outside the AI Pioneer tier, research focus has shifted from producing frontier AI capability to absorbing and adapting it locally, through openly published models, regional research consortia, or sovereign fund partnerships.", o far.", "locator": "Our baseline forecast already reflects", "quote_verified": true}]}, {"theme": "Escalation scenario shock calibration", "insights": [{"claim": "Oxford Economics' downside case for a prolonged Iran war points to sustained energy disruption, higher inflation risk premia and increased long-term borrowing costs.", "speaker": "Sally Li", "type": "causal", "entities": ["Oxford Economics", "Iran"], "conviction": "medium", "so_what": "Identifies the channels (energy, inflation premia, term premia) through which escalation hits bonds.", "quote": "sustained energy disruption, higher inflation risk premia and increased long-term borrowing costs", "locator": "The assistant based its calibration", "quote_verified": true}, {"claim": "The escalation scenario assumes Brent crude $37 above baseline, European gas +$5, Asian gas +$10, and supply chain stress +1.0, all from 2026Q4 to 2027Q4.", "speaker": "Sally Li", "type": "data_point", "entities": ["Brent crude", "European gas", "Asian gas", "LNG"], "conviction": "medium", "so_what": "Gives concrete stress-test magnitudes for energy and logistics exposure in a sustained-war case.", "quote": null, "locator": "Table 1: Scenario inputs proposed", "quote_verified": false}, {"claim": "In a prolonged Iran-war disruption, Asian gas prices are assumed to rise twice as much as European gas prices because Asian LNG markets are more exposed to prolonged disruption.", "speaker": "Sally Li", "type": "thesis", "entities": ["Asian gas", "European gas", "LNG"], "conviction": "medium", "so_what": "Suggests Asian LNG importers carry greater energy-shock risk than Europe in a Gulf escalation.", "quote": "Asian LNG markets’ greater exposure to prolonged disruption", "locator": "Table 1: Scenario inputs proposed", "quote_verified": true}]}, {"theme": "Bond yield and Fed outcomes", "insights": [{"claim": "In Oxford Economics' Iran-escalation scenario, US 10-year government bond yields peak 0.78 percentage points above baseline in 2028Q "Sri Lanka"], "conviction": "medium", "so_what": "Sizes the domestic economic stake in tobacco regulation decisions.", "quote": "the legal cigarette industry contributed an estimated Rs 74.0 billion to Sri Lanka’s GDP and supported around 81,400 jobs, equivalent to 1% of national employment", "locator": "In 2025, the legal cigarette industry", "quote_verified": true}, {"claim": "The cigarette industry's economic footprint in Sri Lanka spans the full value chain from tobacco leaf cultivation and manufacturing to distribution and retail, with activity supported directly and via spending with domestic suppliers and employee wages.", "speaker": "Sanele Mjikane", "type": "framework", "entities": ["Sri Lanka", "Ceylon Tobacco Company PLC"], "conviction": "medium", "so_what": "Footprint figures include indirect and induced effects, so headline numbers are broader than the producer's own operations.", "quote": "both directly and through spending with domestic suppliers and employees’ wages", "locator": "CTC is Sri Lanka’s sole legal", "quote_verified": true}]}, {"theme": "Monopoly structure and commissioned research", "insights": [{"claim": "Ceylon Tobacco Company PLC (CTC) is Sri Lanka's sole legal manufacturer of Factory Made Cigarettes.", "speaker": "Sanele Mjikane", "type": "data_point", "entities": ["Ceylon Tobacco Company PLC", "Sri Lanka"], "conviction": "high", "so_what": "The national legal-market tax and GDP figures effectively describe one listed company's value chain.", "quote": "CTC is Sri Lanka’s sole legal manufacturer of Factory Made Cigarettes.", "locator": "CTC is Sri Lanka’s sole legal", "quote_verified": true}, {"claim": "The consulting report on Sri Lanka's cigarette industry was commissioned by Ceylon Tobacco Company PLC, the industry's sole legal manufacturer, so its estimates are sponsor-funded analysis.", "speaker": "Sanele Mjikane", "type": "thesis", "entities": ["Ceylon Tobacco Company PLC"], "conviction": "medium", "so_what": "Sponsor-commissioned impact numbers are typically deployed in tax and regulatory lobbying and warrant independent cross-checks.", "quote": "Commissioned by Ceylon Tobacco Company PLC (CTC)", "locator": "Commissioned by Ceylon Tobacco Company", "quote_verified": true}]}, {"theme": "Illicit trade and revenue leakage", "insights": [{"claim": "Illicit cigarettes accounted for an estimated 20% of Sri Lanka's Factory Made Cigarette market in 2025, resulting in an estimated Rs 29.5 billion in forgone tax revenue.", "speaker": "Sanele Mjikane", "type": "data_point", "entities": ["Sri Lanka"], "conviction": "medium", "so_what": "A one-fifth illicit share is a key argument against further excise hikes and a potential upside lever for enforcement-driven revenue.", "quote": "illicit cigarettes accounted for an estimated 20% of the Factory Made Cigarette market, resulting in an estimated Rs 29.5 billion in forgone tax revenue", "locator": "In 2025, the legal cigarette industry", "quote_verified": true}, {"claim": "Forgone tax from illicit cigarettes in Sri Lanka (about Rs 29.5 billion) equals roughly 16% of the legal industry's Rs 181 billion tax contribution in 2025.", "speaker": "Sanele Mjikane", "type": "causal", "entities": ["Sri Lanka"], "conviction": "medium", "so_what": "Quantifies how much state revenue could be recaptured by curbing smuggling versus raising rates.", "quote": null, "locator": "In 2025, the legal cigarette industry", "quote_verified": false}]}], "insight_total": 8, "top_entities": ["Sri Lanka", "Ceylon Tobacco Company PLC", "CTC", "Factory Made Cigarettes"], "source_meta": {"author": "Sanele Mjikane", "word_count": 229, "paywalled": false}}, {"record_id": "a194e3d1644a9be7", "source_type": "concepts", "source_name": "Oxford Economics", "source_url": "https://www.oxfordeconomics.com/resource/introducing-the-model-assistant-from-what-if-to-modelled-insight/", "title": "Introducing the Model Assistant: from ‘what if’ to modelled insight", "published_date": "2026-10-20", "language": "en", "processed_at": "2026-10-21T11:12:10Z", "processor": "claude-code-sub-opus", "tags": ["AI", "Tech", "Macro"], "gist": "Oxford Economics launched the AskOEAI Model Assistant, a conversational AI add-on to its Global Economic Model (GEM) that turns plain-language 'what if' prompts into research-calibrated shocks and runs full GEM simulations benchmarked to its baseline. The pitch is that, unlike general-purpose chatbots, the numbers come from a validated model rather than LLM narrative, though bespoke stress tests still need human calibration.", "themes": [{"theme": "Scenario-modelling bottleneck", "insights": [{"claim": "Building credible macro scenarios has been bottlenecked by three skills: knowing which of a large model's thousands of variables are the key levers, sizing and timing the shock from historical research, and setting up, solving and interpreting the model.", "speaker": "Sally Li", "type": "framework", "entities": ["Global Economic Model", "Oxford Economics"], "conviction": "high", "so_what": "Explains why investment teams historically ran few scenarios; lowering this barrier raises the volume of stress tests analysts can run.", "quote": "Our Global Economic Model (GEM) contains thousands of variables, but a subset of these are the key ones to generate complete economic scenarios with full transmissions.", "locator": "First, you need to know which", "quote_verified": true}, {"claim": "According to Oxford Economics, even experienced macro modellers spend much of their time identifying indicators and building inputs before analysis starts, which caps the number of scenarios they can explore.", "speaker": "Sally Li", "type": "causal", "entities": ["Oxford Economics"], "conviction": "medium", "so_what": "Automation of input-building is where AI may give the biggest productivity gain in macro research workflows.", "quote": "Even experienced modellers can spend much of their time identifying the right indicators and building inputs before any analysis begins", "locator": "For many of the people who", "quote_verified": true}]}, {"theme": "How the Model Assistant works", "insights": [{"claim": "Oxford Economics' AskOEAI Model Assistant, billed as the world's first AI assistant for scenario modelling, runs a four-step workflow: describe the scenario in plain language, have the assistant research and propose shocks with rationales, review inputs against the baseline, then analyse results and re-solve.", "speaker": "Sally Li", "type": "data_point", "entities": ["AskOEAI Model Assistant", "Oxford Economics", "Global Economic Model"], "conviction": "high", "so_what": "Signals incumbent macro-data vendors embedding agentic AI directly into their proprietary models as a product moat.", "quote": "The Model Assistant is the world’s first AI assistant for scenario modelling.", "locator": "What the Model Assistant does", "quote_verified": true}, {"claim": "Oxford Economics says the Model Assistant calibrates shock size and timing from the firm's own published research, such as an existing downside case for a prolonged conflict or trade war, supplemented by verified external sources.", "speaker": "Sally Li", "type": "thesis", "entities": ["Oxford Economics", "AskOEAI Model Assistant"], "conviction": "high", "so_what": "Scenario outputs will inherit the house view's priors, so users should know they are getting Oxford Economics' calibration, not a neutral one.", "quote": "If our economists have published a downside case for a prolonged conflict or a trade war, that becomes the starting point for the size and timing of the inputs", "locator": "Grounded in our research.", "quote_verified": true}, {"claim": "Oxford Economics says the Model Assistant does not itself generate results; it sends structured inputs to the GEM and runs a full simulation using the same model its economists use for forecasts, benchmarked against the latest baseline.", "speaker": "Sally Li", "type": "framework", "entities": ["Global Economic Model", "Oxford Economics"], "conviction": "high", "so_what": "Separating the LLM interface from the numerical engine is the design pattern that makes AI outputs auditable for investment use.", "quote": "Critically the assistant does not generate the results, it sends structured inputs to the GEM and runs a full simulation", "locator": "Connected to the model itself.", "quote_verified": true}]}, {"theme": "Differentiation versus general-purpose AI", "insights": [{"claim": "Oxford Economics argues general-purpose AI tools give plausible-sounding economic answers, for example on Middle East escalation and bond yields, but their numbers are not produced by a validated model and their assumptions are hard to trace.", "speaker": "Sally Li", "type": "contrarian", "entities": ["Middle East", "bond yields"], "conviction": "high", "so_what": "Cautions investors against relying on chatbot macro estimates; the value of proprietary validated models persists in the AI era.", "quote": "But the numbers are not produced by a validated economic model and the assumptions are hard to trace.", "locator": "Why it is more than a chatbot", "quote_verified": true}, {"claim": "The Model Assistant embeds modellers' knowledge of which GEM indicators actually transmit through the model, steering users away from shocking variables that do not meaningfully feed through.", "speaker": "Sally Li", "type": "data_point", "entities": ["Global Economic Model", "AskOEAI Model Assistant"], "conviction": "medium", "so_what": "Domain-specific guardrails, not raw LLM capability, are the vendor's claimed edge over generic AI.", "quote": "If you try to shock a variable that does not meaningfully feed through the model, it steers you towards a better option.", "locator": "Trained on how the GEM works.", "quote_verified": true}]}, {"theme": "Target users and limits", "insights": [{"claim": "Oxford Economics targets the Model Assistant at non-modellers such as risk managers, investment analysts, portfolio teams and consultants, and at existing GEM users who want a first-draft scenario in minutes.", "speaker": "Sally Li", "type": "thesis", "entities": ["Oxford Economics", "Global Economic Model"], "conviction": "medium", "so_what": "Broadens the addressable user base for macro-model subscriptions beyond specialist economists.", "quote": "the assistant produces a first-draft scenario in minutes, making it easy to test multiple shocks", "locator": "The second is existing GEM users", "quote_verified": true}, {"claim": "Oxford Economics concedes the Model Assistant suits high-level narrative scenarios, while complex bespoke work such as regulatory stress tests or detailed geopolitical scenarios needing client-specific calibration still requires tailored human work.", "speaker": "Sally Li", "type": "thesis", "entities": ["Oxford Economics"], "conviction": "high", "so_what": "AI-driven scenarios are a screening tool, not a substitute for calibrated stress tests in regulated risk processes.", "quote": "Complex bespoke exercises, such as regulatory stress tests or detailed geopolitical scenarios that need client-specific calibration, still benefit from tailored work", "locator": "The assistant is built for high-level", "quote_verified": true}, {"claim": "Oxford Economics notes that a question many of its clients are asking now is what a renewed escalation of the war in Iran would mean for the global economy and government bond yields, which it uses as the showcase for the Model Assistant.", "speaker": "Sally Li", "type": "anecdote", "entities": ["Iran", "government bond yields", "Oxford Economics"], "conviction": "medium", "so_what": "Signals that Iran-war escalation and its rates impact is a top-of-mind client risk scenario.", "quote": "what would a renewed escalation of the war in Iran mean for the global economy and for government bond yields?", "locator": "Next: the Model Assistant in action", "quote_verified": true}]}], "insight_total": 10, "top_entities": ["Oxford Economics", "AskOEAI // ---------- helpers ----------
// YouTube-aligned hex colors for tinted insight chips (bg = color+"1a", text = color, border = color+"55").
const TYPE_HEX = {
  thesis: '#6366f1', prediction: '#0ea5e9', framework: '#8b5cf6',
  data_point: '#059669', causal: '#d97706', contrarian: '#dc2626',
  anecdote: '#64748b',
};
const CONV_HEX = { high: '#16a34a', medium: '#ca8a04', low: '#94a3b8', exploratory: '#94a3b8' };
function typeHex(t) { return TYPE_HEX[String(t || '').toLowerCase()] || '#475569'; }
function convHex(c) { return CONV_HEX[String(c || '').toLowerCase()] || '#64748b'; }

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }

// Tinted chip (YouTube style): faint bg, colored text + border.
function tintChip(text, color) {
  return `<span class="chip" style="background:${color}1a;color:${color};border-color:${color}55">${escapeHtml(text)}</span>`;
}
function tagPills(tags) {
  if (!tags || !tags.length) return '';
  return tags.map(t => `<span class="pill tag">${escapeHtml(t)}</span>`).join(' ');
}

// ---------- rendering ----------
// Insight presentation ported from the YouTube digest: type/conviction tinted
// chips, speaker as a 🗣 chip, and entities as indigo chips — all in the meta row
// directly under the claim. Quote treatment is INTENTIONALLY kept as Concepts'
// verbatim + "✓ verified" (stronger than YouTube's ≈ paraphrase wording).
function renderInsight(ins) {
  if (!ins) return '';
  const cls = 'insight' + (ins.type ? (' ' + String(ins.type).toLowerCase()) : '');
  const meta = [];
  if (ins.type) meta.push(tintChip(ins.type, typeHex(ins.type)));
  if (ins.speaker) meta.push(`<span class="chip chip-spk">🗣 ${escapeHtml(ins.speaker)}</span>`);
  if (ins.conviction) meta.push(tintChip('conviction: ' + ins.conviction, convHex(ins.conviction)));
  (ins.entities || []).slice(0, 12).forEach(e => {
    if (e) meta.push(`<span class="chip chip-ent">${escapeHtml(e)}</span>`);
  });
  let quote = '';
  if (ins.quote) {
    const v = ins.quote_verified
      ? `<span class="vmark">✓ verified</span>`
      : `<span class="vmark no">unverified</span>`;
    quote = `<div class="quote">“${escapeHtml(ins.quote)}”${v}</div>`;
  }
  const so = ins.so_what
    ? `<div class="insight-so"><span class="lbl">so what</span>${escapeHtml(ins.so_what)}</div>` : '';
  return `
    <div class="${cls}">
      <div class="insight-claim">${escapeHtml(ins.claim || '')}</div>
      <div class="insight-meta">${meta.join('')}</div>
      ${so}
      ${quote}
    </div>`;
}

function renderTheme(theme) {
  const insights = (theme.insights || []).map(renderInsight).join('');
  return `
    <div class="theme">
      <div class="theme-title">${escapeHtml(theme.theme || 'Theme')}</div>
      ${insights}
    </div>`;
}

function renderCard(card) {
  if (!card) return '';
  const meta = card.source_meta || {};
  const nameHtml = card.source_url
    ? `<a class="source-name" href="${escapeAttr(card.source_url)}" target="_blank" rel="noopener">${escapeHtml(card.source_name || '')}</a>`
    : `<span class="source-name">${escapeHtml(card.source_name || '')}</span>`;
  const subBits = [];
  if (card.published_date) subBits.push(escapeHtml(card.published_date));
  if (meta.author) subBits.push(escapeHtml(meta.author));
  if (meta.word_count) subBits.push(`${meta.word_count} words`);
  if (meta.paywalled) subBits.push('paywalled');
  const themes = (card.themes || []).map(renderTheme).join('');
  const n = card.insight_total != null ? card.insight_total
            : (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
  return `
    <div class="source">
      <div class="source-head" onclick="toggleSource(this)">
        <div class="source-meta-left">
          <div class="source-name-row">${nameHtml}</div>
          <div class="source-title">${escapeHtml(card.title || '')}</div>
          <div class="source-sub">${subBits.join('  ·  ')}</div>
        </div>
        <span class="source-count">${n} insight${n === 1 ? '' : 's'}</span>
        <span class="source-arrow">▸</span>
      </div>
      <div class="source-body">
        ${card.gist ? `<div class="gist">${escapeHtml(card.gist)}</div>` : ''}
        ${card.tags && card.tags.length ? `<div class="tags">${tagPills(card.tags)}</div>` : ''}
        ${themes || '<div class="empty">No insights.</div>'}
      </div>
    </div>`;
}

function renderTopStats(d) {
  const s = d.stats || {};
  const parts = [];
  if (d.date) parts.push(`date <strong>${escapeHtml(d.date)}</strong>`);
  if (s.lookback_days != null) parts.push(`lookback <strong>${s.lookback_days}d</strong>`);
  if (s.sources != null) parts.push(`sources <strong>${s.sources}</strong>`);
  if (s.cards != null) parts.push(`cards <strong>${s.cards}</strong>`);
  if (s.insights != null) parts.push(`insights <strong>${s.insights}</strong>`);
  if (s.quote_verified_pct != null) parts.push(`quotes verified <strong>${s.quote_verified_pct}%</strong>`);
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSource(headEl) { headEl.parentElement.classList.toggle('open'); }

function insightCount(card) {
  return (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
}

// Build the sort/filter control bar (display only — re-groups REPORT_DATA in place).
function buildControls(d) {
  const cards = d.cards || [];
  const names = [...new Set(cards.map(c => c.source_name || '—'))].sort((a, b) => a.localeCompare(b));
  const opts = names.map(n => `<option value="${escapeAttr(n)}">${escapeHtml(n)}</option>`).join('');
  document.getElementById('controls').innerHTML =
    `<label>Sort
       <select id="sortSel">
         <option value="source">Source A–Z</option>
         <option value="insights">Insight count ▼</option>
       </select></label>
     <label>Source
       <select id="srcSel">
         <option value="__all">All sources (${names.length})</option>
         ${opts}
       </select></label>
     <span class="ctl-btns">
       <button type="button" id="expandAll">Expand all</button>
       <button type="button" id="collapseAll">Collapse all</button>
     </span>`;
  document.getElementById('sortSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('srcSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('expandAll').addEventListener('click', () => setAllGroups(false));
  document.getElementById('collapseAll').addEventListener('click', () => setAllGroups(true));
}

// Group-level collapse: header click toggles one group; the control-bar buttons toggle all.
function toggleGroup(headEl) { headEl.parentElement.classList.toggle('collapsed'); }
function setAllGroups(collapsed) {
  document.querySelectorAll('.group').forEach(g => g.classList.toggle('collapsed', collapsed));
}

// Group cards by source, sort groups (and cards within), optionally filter to one source.
function renderGroups(d) {
  const sortMode = (document.getElementById('sortSel') || {}).value || 'source';
  const srcFilter = (document.getElementById('srcSel') || {}).value || '__all';
  let cards = (d.cards || []).slice();
  if (srcFilter !== '__all') cards = cards.filter(c => (c.source_name || '—') === srcFilter);

  const groups = new Map();
  cards.forEach(c => {
    const k = c.source_name || '—';
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(c);
  });
  let entries = [...groups.entries()].map(([name, cs]) => ({
    name, cards: cs, insights: cs.reduce((a, c) => a + insightCount(c), 0),
  }));
  if (sortMode === 'insights') entries.sort((a, b) => b.insights - a.insights || a.name.localeCompare(b.name));
  else entries.sort((a, b) => a.name.localeCompare(b.name));
  // Within each source group, heaviest cards first.
  entries.forEach(e => e.cards.sort((a, b) => insightCount(b) - insightCount(a)));

  const html = entries.map(e => {
    const head = `<div class="group-head" onclick="toggleGroup(this)">`
      + `<span class="group-name">${escapeHtml(e.name)}</span>`
      + `<span class="group-meta">${e.cards.length} card${e.cards.length === 1 ? '' : 's'} · ${e.insights} insights</span>`
      + `<span class="group-arrow">▾</span></div>`;
    return `<div class="group">${head}<div class="group-body">${e.cards.map(renderCard).join('')}</div></div>`;
  }).join('');

  const app = document.getElementById('app');
  app.innerHTML = html || '<div class="empty">No cards for this source.</div>';
  // Open the first two source cards by default.
  document.querySelectorAll('.source').forEach((sec, i) => { if (i < 2) sec.classList.add('open'); });
}

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  document.getElementById('stats-top').innerHTML = renderTopStats(d);
  buildControls(d);
  renderGroups(d);   // default: grouped, sorted by source A–Z
}

renderReport(REPORT_DATA);
</script>
</body>
