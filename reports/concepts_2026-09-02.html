emain much lower", "quote_verified": true}, {"claim": "Income and spending-power parity is explicitly not the same as full living-standards convergence, since many other components contribute to quality of life beyond incomes and spending power in Warsaw and Prague relative to Western cities.", "speaker": "Duncan Campbell", "type": "thesis", "entities": ["Warsaw", "Prague", "Western Europe"], "conviction": "medium", "so_what": "Caps the convergence trade: PPP parity supports consumer-demand theses but not talent-attraction or premium-services theses in CEE.", "quote": "This isn’t to say that living standards in Warsaw and Prague have fully converged to those of Western cities", "locator": "This isn’t to say that living standards", "quote_verified": true}, {"claim": "A regionally adjusted PPP series is positioned as a commercial market-understanding tool for companies, not merely an academic living-standards metric.", "speaker": "Duncan Campbell", "type": "thesis", "entities": ["Oxford Economics", "Purchasing Power Parity"], "conviction": "medium", "so_what": "Signals a productisation path for city-level price data — an emerging input layer for corporate market sizing and expansion decisions.", "quote": "For companies looking to understand their markets, a regionally adjusted PPP series may offer a more nuanced, and often more useful, picture.", "locator": "But what it does highlight is how economies have evolved", "quote_verified": true}]}], "insight_total": 21, "top_entities": ["Oxford Economics", "Washington, DC", "St. Louis", "Warsaw", "Prague", "London", "Paris", "Eurostat", "OECD", "UK", "Germany", "Netherlands"], "source_meta": {"author": "Duncan Campbell", "word_count": 1134, "paywalled": false}}, {"record_id": "ad1fce9bcee43c9d", "source_type": "concepts", "source_name": "Oxford Economics", "source_url": "https://www.oxfordeconomics.com/resource/australias-fmcg-workforce-challenge-is-becoming-structural/", "title": "Australia’s FMCG workforce challenge is becoming structural", "published_date": "2026-09-02", "language": "en", "processed_at": "2026-09-02T19:17:40Z", "processor": "claude-code-sub-opus", "tags": ["Macro", "Society"], "gist": "Oxford Economics Australia modelling for the Australian Food and Grocery Council finds demand will exceed workforce supply by 2035 in all five critical food-and-grocery manufacturing occupations studied — packers, food and drink factory workers, forklift drivers, purchasing and supply logistics clerks, and manufacturing production managers. The operative finding is that the cause differs by occupation: retention for packers, age-driven attrition (about 60% of forklift drivers leaving by 2035) for others, and demand outrunning supply for production managers, so a generic 'more workers' response misallocates capital.", "themes": [{"theme": "2035 supply-demand gap in Australian food manufacturing", "insights": [{"claim": "Australia's food and grocery manufacturing sector employs nearly 300,000 people and sits inside an historically tight labour market, with shortages concentrated in operational, technical and trade-related roles.", "speaker": "Adric Kam", "type": "data_point", "entities": ["Australia", "food and grocery manufacturing", "FMCG"], "conviction": "high", "so_what": "Sizes the labour exposure behind Australian packaged-food supply chains: a ~300k headcount base whose operational roles are already scarce means unit labour cost and throughput risk are live inputs to FMCG margin forecasts.", "quote": "employs nearly 300,000 people", "locator": "Australia’s food and grocery manufacturing sector employs", "quote_verified": true}, {"claim": "Oxford Economics Australia modelling for the Australian Food and Grocery Council projects that demand will exceed workforce supply in all five studied occupations — packers, food and drink factory workers, forklift drivers, purchasing and supply logistics clerks, and manufacturing production managers — by 2035.", "speaker": "Adric Kam", "type": "prediction", "entities": ["Oxford Economics Australia", "Australian Food and Grocery Council", "packers", "forklift drivers", "manufacturing production managers"], "conviction": "high", "so_what": "A decade-long, five-for-five shortfall is a structural cost floor rather than a cyclical squeeze — watch it as persistent wage pressure and a capex trigger for automation in Australian food processing.", "quote": "demand is projected to exceed workforce supply in all five occupations by 2035", "locator": "The analysis found that demand is projected", "quote_verified": true}, {"claim": "The framing of Australian food-manufacturing labour shortage as 'becoming structural' rests on causes embedded in age profiles and occupational mobility rather than on a temporary demand spike, implying the gap does not self-correct with the cycle.", "speaker": "Adric Kam", "type": "thesis", "entities": ["Australia", "FMCG", "labour market"], "conviction": "high", "so_what": "Structural means unmodelled by cyclical labour forecasts — position for durable wage/throughput pressure in Australian food processing rather than mean reversion.", "quote": null, "locator": "Australia’s FMCG workforce pressures are significant", "quote_verified": false}]}, {"theme": "Diagnose-the-cause framework beats headline shortage number", "insights": [{"claim": "The most decision-relevant result of the five-occupation workforce study is not the aggregate shortfall but that the underlying cause of workforce pressure differs substantially between occupations.", "speaker": "Adric Kam", "type": "framework", "entities": ["Oxford Economics Australia", "workforce modelling"], "conviction": "high", "so_what": "Gives a screening lens for any labour-constrained sector: ask which mechanism (ageing, retention, entry pathway, demand growth) binds before pricing the fix or the policy response.", "quote": "the most important finding is not the aggregate number. It is that the underlying cause of workforce pressure differs substantially between occupations", "locator": "However, the most important finding is not", "quote_verified": true}, {"claim": "Treating a multi-occupation labour gap as a single general shortage of workers risks investing in solutions that do not address the actual binding constraint.", "speaker": "Adric Kam", "type": "contrarian", "entities": ["Australian Food and Grocery Council", "industry policy", "government"], "conviction": "high", "so_what": "A direct warning that headline 'skills shortage' spending — training subsidies, migration quotas — can be wasted capital; scrutinise workforce policy announcements for occupation-level diagnosis before assuming efficacy.", "quote": "Treating the challenge simply as a general shortage of workers risks investing in solutions that do not address the underlying constraint.", "locator": "Australia’s FMCG workforce pressures are significant", "quote_verified": true}, {"claim": "Australian FMCG workforce pressures are characterised as significant but manageable, conditional on industry and government responding to the particular cause affecting each occupation rather than to the aggregate.", "speaker": "Adric Kam", "type": "thesis", "entities": ["Australia", "FMCG", "government", "industry"], "conviction": "medium", "so_what": "The base case is not collapse but dispersion — outcomes split between firms and jurisdictions that diagnose correctly and those that do not, creating relative-performance spread inside the same sector.", "quote": null, "locator": "Australia’s FMCG workforce pressures are significant", "quote_verified": false}]}, {"theme": "Packers: a retention leak, not an intake problem", "insights": [{"claim": "For packers in Australian food and grocery manufacturing, education and migration deliver significant inflows of new workers, but those inflows are more than offset by workers moving into other occupations and industries, making retention rather than intake the central constraint.", "speaker": "Adric Kam", "type": "causal", "entities": ["packers", "migration", "education"], "conviction": "high", "so_what": "Where outflow exceeds inflow, migration and training expansion produce leakage not headcount — a useful test for whether an economy's immigration lever actually reaches the roles it targets.", "quote": null, "locator": "For packers, retention is the central challenge", "quote_verified": false}, {"claim": "Because packer shortages stem from occupational churn, increasing training places alone is insufficient and employers must address job quality, shift design, supervision, working conditions and career progression.", "speaker": "Adric Kam", "type": "causal", "entities": ["packers", "employers", "training"], "conviction": "high", "so_what": "Implies a real cost line item — better shift design and supervision are opex, not a subsidised program — so margin models for low-skill-intensive food processing should carry a rising labour-quality cost.", "quote": "Increasing training places alone will therefore be insufficient", "locator": "For packers, retention is the central challenge", "quote_verified": true}]}, {"theme": "Age-profile cliff in forklift and factory floor roles", "insights": [{"claim": "Around 60% of Australia's current forklift driver workforce is expected to leave through retirement and other natural attrition by 2035.", "speaker": "Adric Kam", "type": "data_point", "entities": ["forklift drivers", "Australia", "retirement"], "conviction": "high", "so_what": "A near-two-thirds turnover of a core materials-handling occupation over a decade is a hard, demography-locked deadline — it strengthens the investment case for warehouse automation and autonomous materials handling in Australian logistics.", "quote": "Around 60% of the current workforce is expected to leave through retirement and other natural attrition by 2035.", "locator": "Forklift drivers face a different problem", "quote_verified": true}, {"claim": "More than 40% of today's food and drink factory workers in Australia are expected to leave the workforce by 2035 due to an ageing age profile.", "speaker": "Adric Kam", "type": "data_point", "entities": ["food and drink factory workers", "Australia"], "conviction": "high", "so_what": "Two of the sector's largest occupations lose 40-60% of incumbents within the decade — quantifies the replacement-hiring burden that will compete for the same shrinking labour pool.", "quote": "more than 40% of today’s workers expected to leave over the same period", "locator": "Forklift drivers face a different problem", "quote_verified": true}, {"claim": "Because forklift-driver and factory-worker attrition is largely embedded in the existing age profile, the effective levers are early recruitment, succession planning, knowledge transfer and retention of experienced workers rather than demand-side management.", "speaker": "Adric Kam", "type": "framework", "entities": ["forklift drivers", "food and drink factory workers", "succession planning"], "conviction": "high", "so_what": "Age-embedded outflows are already determined and cannot be reversed by policy — the only variable is lead time, so firms starting succession pipelines now hold a measurable operational advantage.", "quote": null, "locator": "These pressures are largely embedded in the", "quote_verified": false}]}, {"theme": "Technology raises rather than reduces skilled labour demand", "insights": [{"claim": "Workforce supply for manufacturing production managers in Australian food and grocery is expected to grow, but not quickly enough to meet rising demand, while purchasing and supply logistics clerks face both growing demand and workforce outflows.", "speaker": "Adric Kam", "type": "prediction", "entities": ["manufacturing production managers", "purchasing and supply logistics clerks"], "conviction": "high", "so_what": "Growing-but-lagging supply in supervisory and supply-chain roles is where wage escalation concentrates — a leading indicator for white-collar operational salary inflation inside manufacturing.", "quote": null, "locator": "For manufacturing production managers, workforce supply is", "quote_verified": false}, {"claim": "Technological change in food and grocery manufacturing does not simply reduce labour requirements; it increases demand for people capable of managing production systems, coordinating complex supply chains and integrating new technologies into operations.", "speaker": "Adric Kam", "type": "contrarian", "entities": ["manufacturing production managers", "supply chains", "automation"], "conviction": "high", "so_what": "Cuts against the straightforward automation-displaces-labour narrative: automation capex in manufacturing creates a complementary hiring requirement, so payback models that assume pure headcount savings understate cost.", "quote": "technological change does not simply reduce labour requirements: it can also increase demand for people capable of managing production systems, coordinating complex supply chains", "locator": "These occupations illustrate how technological change does", "quote_verified": true}]}, {"theme": "Workforce capacity planned like production capacity", "insights": [{"claim": "The recommended common priority for food and grocery manufacturers is to plan workforce capacity as deliberately as production capacity — identifying which occupations could constrain growth and diagnosing whether pressure arises from ageing, retention, entry pathways or demand.", "speaker": "Adric Kam", "type": "framework", "entities": ["Oxford Economics", "FMCG", "workforce modelling"], "conviction": "high", "so_what": "Elevates labour from an HR line to a capacity-planning constraint alongside plant and equipment — a diligence question to put to any labour-intensive manufacturer.", "quote": "plan workforce capacity as deliberately as production capacity", "locator": "Individual businesses will experience these pressures differently", "quote_verified": true}, {"claim": "Failure to intervene early on occupation-specific labour constraints translates into lost production, increased operational risk and delayed investment for food and grocery manufacturers.", "speaker": "Adric Kam", "type": "causal", "entities": ["FMCG", "manufacturers", "capex"], "conviction": "medium", "so_what": "Names the transmission channel from labour shortage to financial outcome — delayed capex and lost volume — which is where the shortage shows up in earnings rather than in wage lines alone.", "quote": "before shortages translate into lost production, increased operational risk or delayed investment", "locator": "Individual businesses will experience these pressures differently", "quote_verified": true}, {"claim": "Exposure to these workforce pressures is firm-specific, varying with a business's workforce composition, production processes and location, so sector-level shortage statistics understate the dispersion between individual manufacturers.", "speaker": "Adric Kam", "type": "thesis", "entities": ["FMCG", "manufacturers", "Australia"], "conviction": "medium", "so_what": "Argues against trading the theme at index level — the differentiation is at the single-name and single-site level, favouring bottom-up screening of workforce age profiles and location.", "quote": "Individual businesses will experience these pressures differently depending on their workforce, production processes and location.", "locator": "Individual businesses will experience these pressures differently", "quote_verified": true}]}], "insight_total": 16, "top_entities": ["Oxford Economics Australia", "Australian Food and Grocery Council", "Australia", "forklift drivers", "packers", "food and drink factory workers", "manufacturing production managers", "purchasing and supply logistics clerks", "FMCG", "food and grocery manufacturing"], "source_meta": {"author": "Adric Kam", "word_count": 545, "paywalled": false}}, {"record_id": "541fd3b6d32920b2", "source_type": "concepts", "source_name": "Peterson Institute (PIIE)", "source_url": "https://www.piie.com/blogs/realtime-economics/2026/political-meddling-census-bureau-damages-entire-us-statistical-system", "title": "Political meddling at the Census Bureau damages the entire US statistical system", "published_date": "2026-09-01", "language": "en", "processed_at": "2026-09-02T19:17:59Z", "processor": "claude-code-sub-opus", "tags": ["Macro", "Geopolitics", "Society"], "gist": "Two summer 2026 episodes at the US Census Bureau — an unsigned brief claiming 24,000+ noncitizen votes in 2020, and a Commerce Department order banning 'noise infusion' privacy methods at Census and BEA — mark deliberate political encroachment on decisions historically made by career technical staff. Headline macro data (jobs, CPI, GDP) is not affected, but the American Community Survey has already been delayed and local demographic and economic datasets like County Business Patterns face suppression or coarsening, while the burden of proof rises on every US statistical agency including BEA's PCE methodology changes.", "themes": [{"theme": "The unsigned noncitizen-voting brief", "insights": [{"claim": "The Census Bureau published a brief on August 18, 2026 asserting it had 'readily determined with high confidence' that more than 24,000 voter records from the 2020 election represented noncitizens, but the document named no authors, listed no acknowledgements, and gave no staff contact information — a departure from standard Census practice.", "speaker": "Jed Kolko", "type": "data_point", "entities": ["Census Bureau", "US 2020 election"], "conviction": "high", "so_what": "Anonymous, unattributed output on an official statistical platform is the cleanest observable tell that an agency's publication controls have been captured; treat unsigned releases as a red flag for the whole product line.", "quote": "readily determined with high confidence", "locator": "The noncitizen voting brief", "quote_verified": true}, {"claim": "NPR reported that the Census noncitizen-voting analysis was not conducted by career Census civil servants and that the team producing it included individuals affiliated with the Trump-aligned America First Policy Institute.", "speaker": "Jed Kolko", "type": "data_point", "entities": ["Census Bureau", "America First Policy Institute", "NPR"], "conviction": "high", "so_what": "Outside political-aligned staff generating output under an agency byline is the mechanism of capture to monitor; it can repeat at any agency whose leadership is a political appointee.", "quote": null, "locator": "NPR reported that the analysis was not conducted", "quote_verified": false}, {"claim": "John Abowd, former head of research and methodology at the Census Bureau, argued that prior Census evaluations found record-linkage false-match rates high enough that the true number of noncitizen voters is probably far lower than the 24,000 figure claimed.", "speaker": "Jed Kolko", "type": "causal", "entities": ["John Abowd", "Census Bureau", "record linkage"], "conviction": "high", "so_what": "Known false-match rates in administrative record linkage mean headline counts derived from matched commercial voter files should be discounted heavily before being priced into any policy expectation.", "quote": "[T]he alleged 'noncitizen voters' are therefore much more likely to be data errors than noncitizen voters.", "locator": "The analysis linked a commercial voter file", "quote_verified": true}, {"claim": "Amy O'Hara, who formerly led Census research on administrative data, called for the noncitizen-voting report's results to be discarded outright and for the Census Bureau to answer for the process that allowed an unsigned report to be published.", "speaker": "Jed Kolko", "type": "thesis", "entities": ["Amy O'Hara", "Census Bureau"], "conviction": "high", "so_what": "Rapid, named pushback from former agency methodologists is currently the main external check on statistical integrity — its volume is the leading indicator to track.", "quote": "lacks methodological rigor, transparency, and accountability, and the results should be discarded", "locator": "Amy O'Hara, who formerly led Census research", "quote_verified": true}, {"claim": "Administrations routinely publish data supporting their policy arguments, but the norm is to do so through offices led by political appointees; dressing such analysis as a traditional Census publication does not add credibility and instead undermines confidence in the large majority of Census products that do meet methodological standards.", "speaker": "Jed Kolko", "type": "framework", "entities": ["Census Bureau"], "conviction": "high", "so_what": "The distinction between advocacy-with-a-byline and agency-branded advocacy is the practical test for whether an official data release deserves institutional trust.", "quote": null, "locator": "This looks bad! All administrations publish data", "quote_verified": false}]}, {"theme": "Commerce's noise-infusion ban", "insights": [{"claim": "The Commerce Department issued a department administrative order, surfacing publicly in early June 2026, prohibiting the Census Bureau and the Bureau of Economic Analysis from using 'noise infusion' — adding random perturbations to published data values — as a privacy-protection method, leaving only coarsening and suppression available.", "speaker": "Jed Kolko", "type": "data_point", "entities": ["Commerce Department", "Census Bureau", "Bureau of Economic Analysis", "noise infusion", "differential privacy"], "conviction": "high", "so_what": "A methodological ban imposed from the political layer directly constrains what granular data will exist for local-market and demographic analysis going forward.", "quote": null, "locator": "Ending noise infusion", "quote_verified": false}, {"claim": "Acting Census Director George Cook, a political appointee, justified the noise-infusion ban by saying the method made statistics 'less accurate and less trustworthy' and said the policy was developed by the Commerce Department with technical guidance from Census — an inversion of the usual direction in which methodological authority flows.", "speaker": "Jed Kolko", "type": "data_point", "entities": ["George Cook", "Census Bureau", "Commerce Department"], "conviction": "high", "so_what": "When a department writes the method and the statistical agency merely advises, the agency's technical independence has already been reversed — a structural signal, not a one-off.", "quote": "led to concerns that adding noise made the statistics less accurate and less trustworthy", "locator": "Acting Census Director George Cook", "quote_verified": true}, {"claim": "All disclosure-avoidance methods involve a privacy-versus-accuracy tradeoff, so eliminating noise infusion does not remove the cost — it concentrates it: coarsening merges racial categories, age buckets, and geographies, and suppression withholds small-group data entirely, whereas noise infusion spreads accuracy loss thinly across many cells.", "speaker": "Jed Kolko", "type": "framework", "entities": ["noise infusion", "differential privacy", "Census Bureau"], "conviction": "high", "so_what": "The stated accuracy rationale is analytically empty; the real change is where the data loss lands — on small geographies and narrowly defined groups.", "quote": null, "locator": "Noise infusion has advantages over coarsening", "quote_verified": false}, {"claim": "The Census Bureau delayed the annual American Community Survey release, originally due in September 2026, to rework its privacy protections after the Commerce order, and the substitute methods could mean suppressed statistics or less detailed published data.", "speaker": "Jed Kolko", "type": "data_point", "entities": ["American Community Survey", "Census Bureau", "Commerce Department"], "conviction": "high", "so_what": "A concrete, dated data outage: anyone whose local-market models, site selection, or demographic screens depend on ACS tables needs a fallback for the 2025 vintage.", "quote": null, "locator": "In response to the Commerce Department order", "quote_verified": false}, {"claim": "County Business Patterns and, eventually, Quarterly Workforce Indicators may be cut back or lose granularity because the Census Bureau has relied on noise infusion for those economic datasets for many years.", "speaker": "Jed Kolko", "type": "prediction", "entities": ["County Business Patterns", "Quarterly Workforce Indicators", "Census Bureau"], "conviction": "medium", "so_what": "Named, specific datasets at risk — local employment and business-establishment granularity used in real estate, credit, and regional labor analysis could thin out.", "quote": null, "locator": "Economic data like County Business Patterns", "quote_verified": false}, {"claim": "The correct division of labor is that the balance between privacy protection and data availability is a policy choice for an administration or Congress, but the choice of technical tools to achieve that balance belongs to career civil servants with public consultation — and taking noise infusion off the table by administrative order without notice-and-comment violates that line.", "speaker": "Jed Kolko", "type": "framework", "entities": ["Commerce Department", "Census Bureau", "Joint Statistical Meetings", "American Statistical Association"], "conviction": "high", "so_what": "A usable test for judging future statistical-agency changes: ask whether the political layer set the objective or picked the tool.", "quote": "the choice of tools used to achieve that balance is a technical choice for career civil servants to make, with extensive public consultation", "locator": "A key issue is whether the choice of privacy protection", "quote_verified": true}]}, {"theme": "The 2030 redistricting endgame", "insights": [{"claim": "The Center for Renewing America, the think tank founded by current OMB director Russell Vought, argued in an August 2025 explainer under the heading 'citizenship nullification' that differential privacy would mask citizenship status even if a citizenship question were added to the Census, preventing determination of voter eligibility or the drawing of maps that exclude those populations.", "speaker": "Jed Kolko", "type": "causal", "entities": ["Center for Renewing America", "Russell Vought", "Office of Management and Budget", "differential privacy"], "conviction": "high", "so_what": "This is the documented motive chain linking a technical privacy method to redistricting outcomes — the clearest evidence the noise-infusion ban is not about accuracy.", "quote": "Even if the citizenship question is added to the Census, it will be impossible to ascertain the status of individuals so long as differential privacy is used.", "locator": "There is also a link between the administrative order", "quote_verified": true}, {"claim": "The same think tank's November 2025 redistricting primer explicitly recommended 'eliminating differential privacy' because it undermines the precision needed for drawing citizen-only districts — a recommendation that the Commerce Department order effectively implemented.", "speaker": "Jed Kolko", "type": "causal", "entities": ["Center for Renewing America", "differential privacy", "Commerce Department"], "conviction": "high", "so_what": "A published policy recommendation later enacted by administrative order is a template worth watching: other think-tank primers become forecasting documents for administrative action.", "quote": "undermines the precision necessary for redistricting, especially when drawing citizen-only districts", "locator": "Second, the think tank's November 2025 primer", "quote_verified": true}, {"claim": "A leaked draft regulation circulated by the administration would bar questions about race, ethnicity, and sexual orientation from the 2030 short-form decennial Census, which together with the noise-infusion ban would restrict racial and ethnic data at both the collection and the publication stage.", "speaker": "Jed Kolko", "type": "prediction", "entities": ["2030 Census", "Census Bureau", "Commerce Department"], "conviction": "medium", "so_what": "Two reinforcing mechanisms aimed at the same variable is the pattern to watch; if enacted it removes the baseline data layer that entire compliance, marketing, and public-health analytics stacks are built on.", "quote": null, "locator": "A recently leaked proposal under discussion", "quote_verified": false}, {"claim": "Researcher danah boyd, whose ethnography of the 2020 Census publishes next month, notes that without race and ethnicity data it becomes harder to challenge potentially discriminatory maps given the narrowed scope for Voting Rights Act redistricting challenges.", "speaker": "Jed Kolko", "type": "causal", "entities": ["danah boyd", "Voting Rights Act", "2030 Census"], "conviction": "medium", "so_what": "Data removal functions as legal insulation: fewer measured variables means fewer justiciable claims, a durable shift in the political map beyond any single election.", "quote": null, "locator": "danah boyd, whose ethnography of the 2020 Census", "quote_verified": false}, {"claim": "Trump has repeatedly alleged without credible evidence that widespread noncitizen voting occurred in 2020 — claiming on January 6, 2021 that 'over 36,000 ballots were illegally cast by non-citizens' in Arizona — and on August 18, 2026 posted the Census brief's numbers on Truth Social with the exclamation 'I won the election!'", "speaker": "Jed Kolko", "type": "data_point", "entities": ["Donald Trump", "Census Bureau", "Truth Social", "Arizona"], "conviction": "high", "so_what": "Same-day presidential amplification of an agency release ties the publication directly to a political objective, removing ambiguity about who the output served.", "quote": "I won the election!", "locator": "The events also align with administration political aims", "quote_verified": true}]}, {"theme": "Eroded career capacity to resist pressure", "insights": [{"claim": "Ron Jarmin, w // ---------- helpers ----------
// YouTube-aligned hex colors for tinted insight chips (bg = color+"1a", text = color, border = color+"55").
const TYPE_HEX = {
  thesis: '#6366f1', prediction: '#0ea5e9', framework: '#8b5cf6',
  data_point: '#059669', causal: '#d97706', contrarian: '#dc2626',
  anecdote: '#64748b',
};
const CONV_HEX = { high: '#16a34a', medium: '#ca8a04', low: '#94a3b8', exploratory: '#94a3b8' };
function typeHex(t) { return TYPE_HEX[String(t || '').toLowerCase()] || '#475569'; }
function convHex(c) { return CONV_HEX[String(c || '').toLowerCase()] || '#64748b'; }

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }

// Tinted chip (YouTube style): faint bg, colored text + border.
function tintChip(text, color) {
  return `<span class="chip" style="background:${color}1a;color:${color};border-color:${color}55">${escapeHtml(text)}</span>`;
}
function tagPills(tags) {
  if (!tags || !tags.length) return '';
  return tags.map(t => `<span class="pill tag">${escapeHtml(t)}</span>`).join(' ');
}

// ---------- rendering ----------
// Insight presentation ported from the YouTube digest: type/conviction tinted
// chips, speaker as a 🗣 chip, and entities as indigo chips — all in the meta row
// directly under the claim. Quote treatment is INTENTIONALLY kept as Concepts'
// verbatim + "✓ verified" (stronger than YouTube's ≈ paraphrase wording).
function renderInsight(ins) {
  if (!ins) return '';
  const cls = 'insight' + (ins.type ? (' ' + String(ins.type).toLowerCase()) : '');
  const meta = [];
  if (ins.type) meta.push(tintChip(ins.type, typeHex(ins.type)));
  if (ins.speaker) meta.push(`<span class="chip chip-spk">🗣 ${escapeHtml(ins.speaker)}</span>`);
  if (ins.conviction) meta.push(tintChip('conviction: ' + ins.conviction, convHex(ins.conviction)));
  (ins.entities || []).slice(0, 12).forEach(e => {
    if (e) meta.push(`<span class="chip chip-ent">${escapeHtml(e)}</span>`);
  });
  let quote = '';
  if (ins.quote) {
    const v = ins.quote_verified
      ? `<span class="vmark">✓ verified</span>`
      : `<span class="vmark no">unverified</span>`;
    quote = `<div class="quote">“${escapeHtml(ins.quote)}”${v}</div>`;
  }
  const so = ins.so_what
    ? `<div class="insight-so"><span class="lbl">so what</span>${escapeHtml(ins.so_what)}</div>` : '';
  return `
    <div class="${cls}">
      <div class="insight-claim">${escapeHtml(ins.claim || '')}</div>
      <div class="insight-meta">${meta.join('')}</div>
      ${so}
      ${quote}
    </div>`;
}

function renderTheme(theme) {
  const insights = (theme.insights || []).map(renderInsight).join('');
  return `
    <div class="theme">
      <div class="theme-title">${escapeHtml(theme.theme || 'Theme')}</div>
      ${insights}
    </div>`;
}

function renderCard(card) {
  if (!card) return '';
  const meta = card.source_meta || {};
  const nameHtml = card.source_url
    ? `<a class="source-name" href="${escapeAttr(card.source_url)}" target="_blank" rel="noopener">${escapeHtml(card.source_name || '')}</a>`
    : `<span class="source-name">${escapeHtml(card.source_name || '')}</span>`;
  const subBits = [];
  if (card.published_date) subBits.push(escapeHtml(card.published_date));
  if (meta.author) subBits.push(escapeHtml(meta.author));
  if (meta.word_count) subBits.push(`${meta.word_count} words`);
  if (meta.paywalled) subBits.push('paywalled');
  const themes = (card.themes || []).map(renderTheme).join('');
  const n = card.insight_total != null ? card.insight_total
            : (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
  return `
    <div class="source">
      <div class="source-head" onclick="toggleSource(this)">
        <div class="source-meta-left">
          <div class="source-name-row">${nameHtml}</div>
          <div class="source-title">${escapeHtml(card.title || '')}</div>
          <div class="source-sub">${subBits.join('  ·  ')}</div>
        </div>
        <span class="source-count">${n} insight${n === 1 ? '' : 's'}</span>
        <span class="source-arrow">▸</span>
      </div>
      <div class="source-body">
        ${card.gist ? `<div class="gist">${escapeHtml(card.gist)}</div>` : ''}
        ${card.tags && card.tags.length ? `<div class="tags">${tagPills(card.tags)}</div>` : ''}
        ${themes || '<div class="empty">No insights.</div>'}
      </div>
    </div>`;
}

function renderTopStats(d) {
  const s = d.stats || {};
  const parts = [];
  if (d.date) parts.push(`date <strong>${escapeHtml(d.date)}</strong>`);
  if (s.lookback_days != null) parts.push(`lookback <strong>${s.lookback_days}d</strong>`);
  if (s.sources != null) parts.push(`sources <strong>${s.sources}</strong>`);
  if (s.cards != null) parts.push(`cards <strong>${s.cards}</strong>`);
  if (s.insights != null) parts.push(`insights <strong>${s.insights}</strong>`);
  if (s.quote_verified_pct != null) parts.push(`quotes verified <strong>${s.quote_verified_pct}%</strong>`);
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSource(headEl) { headEl.parentElement.classList.toggle('open'); }

function insightCount(card) {
  return (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
}

// Build the sort/filter control bar (display only — re-groups REPORT_DATA in place).
function buildControls(d) {
  const cards = d.cards || [];
  const names = [...new Set(cards.map(c => c.source_name || '—'))].sort((a, b) => a.localeCompare(b));
  const opts = names.map(n => `<option value="${escapeAttr(n)}">${escapeHtml(n)}</option>`).join('');
  document.getElementById('controls').innerHTML =
    `<label>Sort
       <select id="sortSel">
         <option value="source">Source A–Z</option>
         <option value="insights">Insight count ▼</option>
       </select></label>
     <label>Source
       <select id="srcSel">
         <option value="__all">All sources (${names.length})</option>
         ${opts}
       </select></label>
     <span class="ctl-btns">
       <button type="button" id="expandAll">Expand all</button>
       <button type="button" id="collapseAll">Collapse all</button>
     </span>`;
  document.getElementById('sortSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('srcSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('expandAll').addEventListener('click', () => setAllGroups(false));
  document.getElementById('collapseAll').addEventListener('click', () => setAllGroups(true));
}

// Group-level collapse: header click toggles one group; the control-bar buttons toggle all.
function toggleGroup(headEl) { headEl.parentElement.classList.toggle('collapsed'); }
function setAllGroups(collapsed) {
  document.querySelectorAll('.group').forEach(g => g.classList.toggle('collapsed', collapsed));
}

// Group cards by source, sort groups (and cards within), optionally filter to one source.
function renderGroups(d) {
  const sortMode = (document.getElementById('sortSel') || {}).value || 'source';
  const srcFilter = (document.getElementById('srcSel') || {}).value || '__all';
  let cards = (d.cards || []).slice();
  if (srcFilter !== '__all') cards = cards.filter(c => (c.source_name || '—') === srcFilter);

  const groups = new Map();
  cards.forEach(c => {
    const k = c.source_name || '—';
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(c);
  });
  let entries = [...groups.entries()].map(([name, cs]) => ({
    name, cards: cs, insights: cs.reduce((a, c) => a + insightCount(c), 0),
  }));
  if (sortMode === 'insights') entries.sort((a, b) => b.insights - a.insights || a.name.localeCompare(b.name));
  else entries.sort((a, b) => a.name.localeCompare(b.name));
  // Within each source group, heaviest cards first.
  entries.forEach(e => e.cards.sort((a, b) => insightCount(b) - insightCount(a)));

  const html = entries.map(e => {
    const head = `<div class="group-head" onclick="toggleGroup(this)">`
      + `<span class="group-name">${escapeHtml(e.name)}</span>`
      + `<span class="group-meta">${e.cards.length} card${e.cards.length === 1 ? '' : 's'} · ${e.insights} insights</span>`
      + `<span class="group-arrow">▾</span></div>`;
    return `<div class="group">${head}<div class="group-body">${e.cards.map(renderCard).join('')}</div></div>`;
  }).join('');

  const app = document.getElementById('app');
  app.innerHTML = html || '<div class="empty">No cards for this source.</div>';
  // Open the first two source cards by default.
  document.querySelectorAll('.source').forEach((sec, i) => { if (i < 2) sec.classList.add('open'); });
}

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  document.getElementById('stats-top').innerHTML = renderTopStats(d);
  buildControls(d);
  renderGroups(d);   // default: grouped, sorted by source A–Z
}

renderReport(REPORT_DATA);
</script>
