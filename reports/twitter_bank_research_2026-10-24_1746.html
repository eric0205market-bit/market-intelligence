<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>Twitter Data Intelligence</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root {
  --bg: #faf8f5;
  --surface: #ffffff;
  --border: #e8e4df;
  --border-light: #f0ede4;
  --text: #1a1a1a;
  --text-2: #555;
  --text-3: #8a8a8a;
  --accent: #2563eb;
  --accent-bg: #f0f5ff;
  --accent-2: #1d4ed8;
  --tag-text: #0e7490;
  --tag-bg: #e8f4f8;
  --yellow: #fff5b3;
  --yellow-border: #f0d966;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; line-height: 1.55;
       background: var(--bg); color: var(--text); }
.container { max-width: 960px; margin: 0 auto; padding: 24px 16px 80px; }

/* HEADER */
.header { display: flex; justify-content: space-between; align-items: baseline;
          border-bottom: 2px solid var(--accent); padding-bottom: 12px; margin-bottom: 20px; }
.title { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; color: var(--accent); }
.subtitle { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-3); }

/* FILTER BAR */
.filter-bar { display: none; background: var(--yellow); border: 1px solid var(--yellow-border);
              border-radius: 6px; padding: 8px 12px; margin-bottom: 16px;
              align-items: center; gap: 10px; font-size: 13px; }
.filter-bar.active { display: flex; }
.filter-bar button { font-family: inherit; font-size: 12px; background: transparent;
                     border: 1px solid var(--text); padding: 3px 10px; border-radius: 4px;
                     cursor: pointer; }
.filter-bar button:hover { background: rgba(0,0,0,0.05); }

/* SUMMARY */
.summary { background: var(--surface); border: 1px solid var(--border);
           border-left: 4px solid var(--accent); border-radius: 6px;
           padding: 16px 18px; margin-bottom: 20px; }
.summary p { margin-bottom: 8px; }
.summary p:last-child { margin-bottom: 0; }
.summary strong { font-weight: 600; }

/* SECTIONS (top-level collapsible) */
.section { background: var(--surface); border: 1px solid var(--border);
           border-radius: 6px; margin-bottom: 14px; overflow: hidden; }
.section-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px;
                background: var(--accent-bg); cursor: pointer; user-select: none;
                font-weight: 600; font-size: 13px; color: var(--accent-2); }
.section-head:hover { background: #e1ecff; }
.section-letter { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
                  min-width: 18px; }
.section-name { flex: 1; }
.section-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
                 color: var(--text-3); }
.section-arrow { font-size: 10px; transition: transform .2s; }
.section.open .section-arrow { transform: rotate(90deg); }
.section-body { display: none; padding: 6px 0; }
.section.open .section-body { display: block; }

/* TOPIC (nested collapsible inside Topics section) */
.topic { border-bottom: 1px solid var(--border-light); }
.topic:last-child { border-bottom: none; }
.topic-head { display: flex; align-items: center; gap: 10px; padding: 10px 16px;
              background: var(--accent-bg); cursor: pointer; user-select: none;
              font-size: 13px; font-weight: 600; color: var(--accent-2); }
.topic-head:hover { background: #e1ecff; }
.topic-name { flex: 1; }
.topic-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-3); }
.topic-arrow { font-size: 10px; transition: transform .2s; }
.topic.open .topic-arrow { transform: rotate(90deg); }
.topic-body { display: none; padding: 4px 0 6px; }
.topic.open .topic-body { display: block; }

/* ITEM CARDS */
.item-card { background: var(--surface); border: 1px solid var(--border);
             border-radius: 6px; padding: 12px 14px; margin: 10px 16px; }
.item-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
             flex-wrap: wrap; }
.item-author { font-weight: 600; color: var(--accent); cursor: pointer; }
.item-author:hover { text-decoration: underline; }
.item-time { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-3); }
.item-link { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--accent); text-decoration: none; }
.item-link:hover { text-decoration: underline; }
.item-text { font-size: 13.5px; line-height: 1.6; color: var(--text);
             white-space: pre-wrap; word-wrap: break-word; }

/* DATA POINT TAGS */
.data-points { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.dp-tag { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
          background: var(--tag-bg); color: var(--tag-text);
          padding: 2px 7px; border-radius: 4px; }

/* CHARTS (large, NOT thumbnails) */
.charts { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.chart { width: 100%; max-width: 420px; height: auto;
         border: 1px solid var(--border); border-radius: 4px; cursor: zoom-in;
         background: #f0ede4; }

/* LIGHTBOX */
.lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85);
            align-items: center; justify-content: center; z-index: 100; cursor: zoom-out; }
.lightbox.open { display: flex; }
.lightbox img { max-width: 92vw; max-height: 92vh;
                box-shadow: 0 8px 40px rgba(0,0,0,.6); }

/* LINKS */
.link-row { padding: 8px 16px; border-bottom: 1px solid var(--border-light);
            font-size: 13px; display: flex; gap: 12px; align-items: baseline; }
.link-row:last-child { border-bottom: none; }
.link-author { color: var(--text-3); min-width: 110px; cursor: pointer; }
.link-author:hover { color: var(--accent); }
.link-url { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
            color: var(--accent); text-decoration: none; word-break: break-all; flex: 1; }
.link-url:hover { text-decoration: underline; }
.link-desc { color: var(--text-2); font-size: 12px; }

/* AUTHOR FILTER STATES */
.filterable.match { background: var(--yellow); border-color: var(--yellow-border); }
.filterable.dim { opacity: 0.25; }

/* STATS BAR */
.stats { margin-top: 24px; padding: 10px 14px; background: var(--surface);
         border: 1px solid var(--border); border-radius: 6px;
         font-family: 'IBM Plex Mono', monospace; font-size: 11.5px;
         color: var(--text-2); display: flex; gap: 18px; flex-wrap: wrap; }
.stats strong { color: var(--text); font-weight: 600; }

.empty { color: var(--text-3); font-size: 13px; padding: 14px 18px; font-style: italic; }

@media (max-width: 640px) {
  .container { padding: 16px 12px 60px; }
  .item-card { margin: 8px 10px; }
  .link-row { flex-direction: column; gap: 4px; }
  .link-author { min-width: 0; }
  .header { flex-direction: column; align-items: flex-start; gap: 4px; }
  .chart { max-width: 100%; }
}
</style>
</head>

<script>
const REPORT_DATA = {"report_type": "TWITTER BANK RESEARCH", "collected_at": "2026-10-24T17:23:20Z", "window_days": 4, "input_stats": {"total_tweets": 120, "considered": 120, "kept": 50, "dropped": 70, "deduped": 0}, "summary": "Recurring themes: AI financing/credit worries and a sharp hedge-fund de-grossing week (Goldman, BofA, Nomura, Neil); household equity ownership and retail-trading charts (Goldman); long-horizon return assumptions (JPMAM).\nPer-bank counts: Neil Sethi (unlabelled) 18, Goldman 17, JPM 7, BofA 4, Apollo/Slok 1, Morgan Stanley 1, Nomura 1, UBS 1, Yardeni 1.\nWindow: last 4 days; 50 items kept of 120 considered (70 dropped, 0 deduped).", "by_bank_counts": {"Neil Sethi (unlabelled)": 18, "Goldman": 17, "JPM": 7, "BofA": 4, "Apollo/Slok": 1, "Morgan Stanley": 1, "Nomura": 1, "UBS": 1, "Yardeni": 1}, "banks": [{"bank": "Neil Sethi (unlabelled)", "theme": "Neil Sethi — no bank tag: sector/index breadth, PMIs, sentiment, credit spreads and oil/geopolitics charts", "items": [{"author": "neilsethinew", "text": "Semiconductors didn’t get much bounce Friday with the Philadelphia Semiconductor Index (SOX) adding just 0.4% and finishing the week 3.2% lower, its third straight weekly loss for the first time since November. https://t.co/dpTIlyF6Qb", "tweet_url": "https://x.com/neilsethinew/status/2114039214878965835", "images": ["https://pbs.twimg.com/media/HVXNiJiXUAAntCZ.jpg"], "created_at": "2026-10-24T17:00:00.000Z", "relayers": []}, {"author": "neilsethinew", "text": "Gold futures (/GC) fell further after breaking through support Thursday, now the lowest close since July 15th and before that last November. The daily MACD is tipping negative and the RSI is now at 30. Will it hold $4,000? https://t.co/tNGH4TPF2x", "tweet_url": "https://x.com/neilsethinew/status/2114023863436583299", "images": ["https://pbs.twimg.com/media/HVXLZjyWQAAbUW5.jpg"], "created_at": "2026-10-24T15:59:00.000Z", "relayers": []}, {"author": "neilsethinew", "text": "Profit margins are estimated by Factset to come in at an elevated 14.9%, the second highest on record (since 2009) after 17.0% in Q2, up from 13.0% a year ago, in large part due to Tech's 32.3% margin up from 27.5% a year ago and versus the 25.9% five-year average (due in no small part to the huge increase in semiconductor margins).\n\nAs a side note, FactSet says the 17.0% in Q2 was boosted by the valuation gains in Amazon and Alphabet in their investments in OpenAI, Anthropic, etc.  Still, excluding those it would still have been a record at 15.1%.", "tweet_url": "https://x.com/neilsethinew/status/2114009026417541316", "images": ["https://pbs.twimg.com/media/HVZatRhW8AA46VM.jpg"], "created_at": "2026-10-24T15:00:02.000Z", "relayers": []}, {"author": "neilsethinew", "text": "Ahead of PCE next week, a reminder to keep an eye on the breadth of price increases.\n\nAt Jackson Hole in August, Chair Kevin Warsh said that “over the past 12 months, 54% of goods and services in the PCE basket showed price increases above 3%. This is well below the post-pandemic highs of about 77%, but it remains well above the level of 32% in the two decades that preceded the pandemic.”\n\nRunning the same exercise on the CPI across the roughly 180 item categories the BLS publishes, covering about 98% of the basket, yields mixed results.\n\nWhile 47.2% of categories rose more than 3% from a year earlier in September, the lowest since December and down from 50.6% in August, that compares with an average of 31.7% from 2000 to 2019 although well off the peak of 80.4% in March 2022.\n\nAnd weighted by share of spending, 62.2% of the basket is rising faster than 3%, the most since September 2025, up from 60.0% in August, as the categories that crossed above 3% included larger ones such as college tuition (+4.00%), hotels (+4.27%), cable, satellite and streaming TV (+3.33%) and motor vehicle repair (+3.55%), while eight of the 17 that fell back below 3% were grocery items.\n\nThe share above 5% rose to 23.0% of categories (13.1% of the basket) from 21.0% (11.6%), led by gasoline (+34.17%), hospital services (+5.63%), dental services (+6.02%) and airline fares (+22.45%), while 27.5% of categories are now falling from a year earlier, up from 21.0%.", "tweet_url": "https://x.com/neilsethinew/status/2114001465710886929", "images": ["https://pbs.twimg.com/media/HVZbVp3WUAEyfUD.png"], "created_at": "2026-10-24T14:30:00.000Z", "relayers": []}, {"author": "neilsethinew", "text": "As noted in the article from @C_Barraud, investors were bracing for Moody's ratings review on French debt, but the country got some relief after a brutal week which saw the 10-year yield hitting 5% for the first time since 2002, and widening the most against German yields in records dating to 1990.\n\nHeading into Friday most economists expected Moody's to cut France one notch, from Aa3 to A1.  \n\nBut it didn't. Instead, Moody's took no rating action, leaving France at Aa3 with a negative outlook. It said this wasn't a credit action and seems to be waiting for more clarity on the budget. It also said higher borrowing costs would need to persist for an extended period to seriously hurt debt sustainability.\n\nThe longer view though is sobering. France held AAA ratings from all three major agencies until 2012. Since then it has received 11 downgrades: four from S&P, four from Fitch and three from Moody's. S&P and Fitch now rate France A+, which leaves Moody's as the last of the big three still rating France in the AA tier. \n\nThe negative outlook keeps a downgrade on the table, and S&P reviews France again on Nov 27.", "tweet_url": "https://x.com/neilsethinew/status/2113941069444636996", "images": ["https://pbs.twimg.com/media/HVXICb1XQAAtxzb.jpg"], "created_at": "2026-10-24T10:30:00.000Z", "relayers": []}, {"author": "neilsethinew", "text": "Iran Concerns Weigh on Stocks as Tech Steadies to End a Volatile Week\n\nBrent topped $116 and stocks pulled back on fears of renewed U.S.-Iran hostilities after the midterm elections. For the week, small caps led with the Russell 2000 up 2% while the S&P 500 and Nasdaq slipped.\n\nhttps://t.co/E8H3QeFYIf", "tweet_url": "https://x.com/neilsethinew/status/2113792206930677890", "images": ["https://pbs.twimg.com/media/HVWyvq9X0AAXKrx.jpg"], "created_at": "2026-10-24T00:38:29.000Z", "relayers": []}, {"author": "neilsethinew", "text": "For the week though the RUT dominated the four up 2%.\n\nDJIA was also green +0.4%, but the SPX and Nasdaq finished lower -0.5% and -0.7% respectively.\n\nNotably the Nasdaq was in the lead as of Wednesday's close. https://t.co/DkrW6ZCTKP", "tweet_url": "https://x.com/neilsethinew/status/2113724181770908059", "images": ["https://pbs.twimg.com/media/HVV00ZGWkAAOR5G.png"], "created_at": "2026-10-23T20:08:10.000Z", "relayers": []}, {"author": "neilsethinew", "text": "US equity indices opened lower but rebounded after the first hour led by Tech with the Nasdaq making it into positive territory. \n\nBut indices would mostly drift lower in the afternoon all ending down led by DJIA -1.2%. SPX -0.5%, RUT -0.3%, Nasdaq -0.2%. https://t.co/V8F0GXPtVI", "tweet_url": "https://x.com/neilsethinew/status/2113723211666104480", "images": ["https://pbs.twimg.com/media/HVVz7B1WoAA-1Rl.png"], "created_at": "2026-10-23T20:04:19.000Z", "relayers": []}, {"author": "neilsethinew", "text": "Communications worst week since March and before that April 2025. https://t.co/dBd0a4MqpA", "tweet_url": "https://x.com/neilsethinew/status/2113721765838954807", "images": ["https://pbs.twimg.com/media/HVVyvLvXYAA_ZaY.jpg"], "created_at": "2026-10-23T19:58:34.000Z", "relayers": []}, {"author": "neilsethinew", "text": "Looks like every sector will end the week ahead of the SPX other than Industrials and Communications. https://t.co/AUn77ypX06", "tweet_url": "https://x.com/neilsethinew/status/2113721646398022003", "images": ["https://pbs.twimg.com/media/HVVyOl9W8AAuLKQ.jpg"], "created_at": "2026-10-23T19:58:06.000Z", "relayers": []}, {"author": "neilsethinew", "text": "CNBC: The S&amp;P 500 Excluding AI index closed Thursday up about 6.6% taking its gains to 12.4% this year, now edging out the S&amp;P 500′s roughly 12% gain. https://t.co/VDNZLS3WNT", "tweet_url": "https://x.com/neilsethinew/status/2113698216885833861", "images": ["https://pbs.twimg.com/media/HVVFD1XW0AA3L4h.jpg"], "created_at": "2026-10-23T18:25:00.000Z", "relayers": []}, {"author": "neilsethinew", "text": "Russell 2000 ($RUT) on track to snap its six-week losing streak, which was the longest such streak since the six-week stretch that ended Oct. 26, 2018 according to MarketWatch. https://t.co/kw1kPUQ6F7", "tweet_url": "https://x.com/neilsethinew/status/2113683117491859733", "images": ["https://pbs.twimg.com/media/HVVDycJX0AA_-wv.png"], "created_at": "2026-10-23T17:25:00.000Z", "relayers": []}, {"author": "neilsethinew", "text": "Flash PMI Holds Near 5-Year High But Prices Jump the Most Since 2022\n\nOctober flash composite PMI eased to 57.6 on services deceleration but stayed close to September’s five-year high, with new orders at a 4.5-year high.\n\nhttps://t.co/wrXIx17ZTi https://t.co/k7sU1czm3e", "tweet_url": "https://x.com/neilsethinew/status/2113669380315771347", "images": ["https://pbs.twimg.com/media/HVVC-C8WgAAiUdJ.jpg"], "created_at": "2026-10-23T16:30:25.000Z", "relayers": []}, {"author": "neilsethinew", "text": "#UMich University of Michigan sentiment, October final: 48.0, up from 46.3 prelim (est. 46.3) but still a five-month low\n▪️ Current conditions 46.7, up from a record-low 44.7 prelim, still second-lowest on record\n▪️ Durables buying conditions at a record low on high prices and rates\n▪️ Nearly 70% expect rates to rise, most in 3+ years\n▪️ 1-yr/5-10-yr inflation expectations 4.7%/3.5%, highest since May", "tweet_url": "https://x.com/neilsethinew/status/2113637328270864772", "images": ["https://pbs.twimg.com/media/HVUl6HwXoAAhuk7.jpg"], "created_at": "2026-10-23T14:23:03.000Z", "relayers": []}, {"author": "neilsethinew", "text": "US S&P flash PMI (October):\nComposite 57.6 (prev 58.4)\nManufacturing 56.0 (est 55.5; prev 55.9), a 53-month high\nServices 57.9 (est 58.0; prev 58.8)\n▪️Growth eased but stayed near five-year high\n▪️New orders highest in over 4.5 years; exports strongest since May 2022; exports strongest since May 2022\n▪️Hiring fastest since June 2022 barring September; factory jobs most since March 2012\n▪️Selling prices rose at the sharpest rate since August 2022\n\nS&P’s Williamson: consistent with GDP “growing at a 5% annualized rate” after 4% in Q3.", "tweet_url": "https://x.com/neilsethinew/status/2113635139490115668", "images": ["https://pbs.twimg.com/media/HVUjzF9WAAA06mz.jpg"], "created_at": "2026-10-23T14:14:21.000Z", "relayers": []}, {"author": "neilsethinew", "text": "If you're searching for an explanation on why Tech, particularly semiconductors, have been so volatile, you can in part blame the overall negative gamma regime in the market as Tier1Alpha indicated earlier this week.\n\nBut semis have an added pseudo-negative-gamma source in the huge amount of assets in leveraged ETFs tied to the space, which must rebalance near the close by buying or selling in the direction of each day’s move.\n\nAs Tier1Alpha notes: \"we suspect these funds were the largest non-discretionary agents in the market yesterday, especially tied to $SOXL and $TQQQ, which hold a combined $60B in AUM.\"\n\nThey estimate SOXL’s 20% decline forced a $9.5 billion market-on-close (MOC) sell imbalance, while TQQQ “contributed another $6.5 billion in MOC selling.”", "tweet_url": "https://x.com/neilsethinew/status/2113626998082011554", "images": ["https://pbs.twimg.com/media/HVUaAbiXMAEZkhm.jpg"], "created_at": "2026-10-23T13:42:00.000Z", "relayers": []}, {"author": "neilsethinew", "text": "BBG's Global Corporate Credit Index (aggregate bond spreads) have jumped to 129 basis points, the widest over the risk free rate since May 2025 (when they were recovering from the liberation day spike). https://t.co/E7bIKOS3pd", "tweet_url": "https://x.com/neilsethinew/status/2113619268675797096", "images": ["https://pbs.twimg.com/media/HVUVhgiXcAE5SHL.jpg"], "created_at": "2026-10-23T13:11:17.000Z", "relayers": []}, {"author": "neilsethinew", "text": "From @C_Barraud's Friday Brief were a couple of posts on the Euro area flash PMIs which indicated while most of the \"eurozone economy starts the fourth quarter with  businesses reporting further robust growth... consistent with GDP growing at a 0.3% quarterly cadence,\" France was a key outlier.\n\nAccording to S&P while there was some deceleration in the region in general \"French private sector output moved back into contraction in October, following a first rise in 10 months during September,\" with business confidence \"the lowest since 2012 if the pandemic is excluded.\" \n\nSlowing growth only adds fuel to budget concerns in France, putting further pressure on French yields, which, in another post in the Friday Brief, have not pulled back this week along with other DM markets but instead surged the joint-most since March 2025.\n\nThis puts the ECB in an increasingly tricky situation weighing the tumult in the French bond market vs inflationary pressures which according to S&P are far from extinguished:\n\n\"Key to the broader slowdown is the further escalation of  inflationary pressures seen during the month. Input costs are rising sharply again, the rate of increase surging in manufacturing on the back of higher energy prices, causing firms to push selling prices higher in order to protect margins.\"\n\nClick through for those full posts along with the many others from Christophe.", "tweet_url": "https://x.com/neilsethinew/status/2113616450850091307", "images": ["https://pbs.twimg.com/media/HVUNA9XWcAAHnQ9.jpg"], "created_at": "2026-10-23T13:00:05.000Z", "relayers": []}]}, {"bank": "Goldman", "theme": "Goldman — household equity ownership and retail activity charts; hedge fund de-grossing and risk appetite; flash PMI price data", "items": [{"author": "MikeZaccardi", "text": "GS: P/E ratios have risen alongside household equity allocations\n\nRebalancing is not an American virtue https://t.co/8guvkIAn83", "tweet_url": "https://x.com/MikeZaccardi/status/2113999705772318724", "images": ["https://pbs.twimg.com/media/HVZvh6NWoAA04P4.png"], "created_at": "2026-10-24T14:23:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "The country needs more financial advisors... Wealth management assets over time.... GS https://t.co/sfAx7TVyMi", "tweet_url": "https://x.com/MikeZaccardi/status/2113997943954981108", "images": ["https://pbs.twimg.com/media/HVZt7Y5XQAA2u4o.png"], "created_at": "2026-10-24T14:16:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "Consumers are angry, but they apparently love stocks... record-high equity allocation among households GS https://t.co/epbrDLHqCz", "tweet_url": "https://x.com/MikeZaccardi/status/2113992155635069286", "images": ["https://pbs.twimg.com/media/HVZoqdQXsAAq6ZI.png"], "created_at": "2026-10-24T13:53:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "Corporations are not buying much stock anymore, but households are GS https://t.co/4XIdbN1f9H", "tweet_url": "https://x.com/MikeZaccardi/status/2113990394014790031", "images": ["https://pbs.twimg.com/media/HVZnD6iWUAAcDQx.jpg"], "created_at": "2026-10-24T13:46:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "GS: While retail trading activity has slowed this year, total household demand for US equities has remained strong. \n\nFederal Reserve data show that households bought $840 billion of US equities in H1 2026. https://t.co/Qy7OTcLGBE", "tweet_url": "https://x.com/MikeZaccardi/status/2113984605959111007", "images": ["https://pbs.twimg.com/media/HVZhzADX0AA1YzU.jpg"], "created_at": "2026-10-24T13:23:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "GS: Households are the largest owners of US equities... and an increasing share https://t.co/BteBSKIBPP", "tweet_url": "https://x.com/MikeZaccardi/status/2113980831131681248", "images": ["https://pbs.twimg.com/media/HVZeXRQXIAAhZ_x.jpg"], "created_at": "2026-10-24T13:08:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "GS: Only $12 trillion of the $65 trillion of household equity ownership is higher-risk self-directed https://t.co/6BP85PFAUs", "tweet_url": "https://x.com/MikeZaccardi/status/2113977056283316656", "images": ["https://pbs.twimg.com/media/HVZa7jOW0AAO9QP.jpg"], "created_at": "2026-10-24T12:53:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "GS: Speculative trading is in check... well below year-ago levels and the Jan 2000 &amp; Feb 2021 generational climaxes https://t.co/41yY6cqGhe", "tweet_url": "https://x.com/MikeZaccardi/status/2113973281569021953", "images": ["https://pbs.twimg.com/media/HVZXf1EW8AAeBh8.jpg"], "created_at": "2026-10-24T12:38:00.000Z", "relayers": []}, {"author": "neilsethinew", "text": "Goldman: The GS Risk Appetite Indicator saw one of its largest drops on record, now at its lowest level since April of last year.\n\nChoppy week overall as we saw a true episode of capitulation and de-grossing on Thursday due to AI financing worries and geopolitical escalation. This led to a notable lack of participation during Friday’s session … -21% vs 5d avg and -33% vs 100d avg – a demonstration of investor fatigue and defensive posturing.", "tweet_url": "https://x.com/neilsethinew/status/2113971270307992029", "images": ["https://pbs.twimg.com/media/HVXDhOfXMAA4oy9.jpg"], "created_at": "2026-10-24T12:30:01.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "GS: Weak consumer sentiment and rising energy prices likely explain most of this year’s decline in retail trading activity.\n\nInteresting connection &amp; conclusion https://t.co/CX2Uc8CiiQ", "tweet_url": "https://x.com/MikeZaccardi/status/2113969506271850855", "images": ["https://pbs.twimg.com/media/HVZUEGCW0AAlqkv.png"], "created_at": "2026-10-24T12:23:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "GS: Retail trading volume is down YoY, but leveraged ETF slinging and prediction market betting rates are up big\n\nETFs include $TQQQ, $SOXL, $QLD, $SSO, $SPXL, $TECL, $UPRO, $MUU, $TSLL, and $NVDL https://t.co/ulw3yRJnXe", "tweet_url": "https://x.com/MikeZaccardi/status/2113965731100438673", "images": ["https://pbs.twimg.com/media/HVZQoXSWcAA4LEo.png"], "created_at": "2026-10-24T12:08:00.000Z", "relayers": []}, {"author": "neilsethinew", "text": "Things just got more extreme this week with Goldman seeing hedge fund gross leverage increasing to the 64th 1-year percentile while net leverage fell further (can't get any lower than the 0 five-year percentile though) meaning an even higher net short position.\n\nUnsurprisingly then the long/short ratio remained at the 0 percentile over the 1, 3, and 5-year lookbacks.  Just liberation day has been lower.", "tweet_url": "https://x.com/neilsethinew/status/2113963724650258796", "images": ["https://pbs.twimg.com/media/HVXC4EGXIAAsTJg.png"], "created_at": "2026-10-24T12:00:02.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "GS: Retail trading volume is down sharply from a year ago https://t.co/7UoQGHlOuQ", "tweet_url": "https://x.com/MikeZaccardi/status/2113961957703164093", "images": ["https://pbs.twimg.com/media/HVZNMsEWQAANkay.png"], "created_at": "2026-10-24T11:53:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "GS: Sharp HF derisking drove this week's equity rotations. \n\nOur HF VIP L/S basket fell 4% on Thursday—a drop rivaled only twice in 10 years: DeepSeek Monday (Jan '25) and the COVID crash (Mar '20). https://t.co/WmzGeUBbSL", "tweet_url": "https://x.com/MikeZaccardi/status/2113957869502554348", "images": ["https://pbs.twimg.com/media/HVZJevjXkAA2otp.png"], "created_at": "2026-10-24T11:36:46.000Z", "relayers": []}, {"author": "neilsethinew", "text": "Goldman: Rotations in the equity market this week reflected a sharp hedge fund derisking. \n\nOn Thursday our Hedge Fund VIP long/short basket pair fell by 4%, a decline only rivaled during the past decade on DeepSeek Monday in January 2025 and during the COVID sell-off in March 2020. \n\nLikewise, GS Prime Services data show a large decline in gross leverage that has contributed to an unusually challenging environment for hedge fund returns. Following the unwind of the last two weeks, they estimate that fundamental hedge fund net leverage registers close to 5-year lows while gross leverage remains well above historical averages.", "tweet_url": "https://x.com/neilsethinew/status/2113948631019516411", "images": ["https://pbs.twimg.com/media/HVW7WRbXIAAtjhj.png"], "created_at": "2026-10-24T11:00:03.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "GS: Early US Business Surveys Showed Mixed Signals for Manufacturing and Mixed-to-Negative Signals for Services Activity in October https://t.co/SbAAHfaIWr", "tweet_url": "https://x.com/MikeZaccardi/status/2113700986761957463", "images": ["https://pbs.twimg.com/media/HVVf2NNXIAIB76R.png"], "created_at": "2026-10-23T18:36:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "GS: Manufacturing output prices in the US rose by 7.1pt to 66.1 in October, reaching a post-pandemic high. https://t.co/g9Qsy6kpyw", "tweet_url": "https://x.com/MikeZaccardi/status/2113698495274057876", "images": ["https://pbs.twimg.com/media/HVVdlLhXoAAmglP.png"], "created_at": "2026-10-23T18:26:06.000Z", "relayers": []}]}, {"bank": "JPM", "theme": "JPMAM — long-term capital market return assumptions and key-risk charts", "items": [{"author": "MikeZaccardi", "text": "JPMAM sees global stocks (pick your poison) returning 7-8% on average annually over the next 10-15 years https://t.co/Gv7j6yC34Z", "tweet_url": "https://x.com/MikeZaccardi/status/2114016818129997863", "images": ["https://pbs.twimg.com/media/HVZ_F_-WkAA8o0G.png"], "created_at": "2026-10-24T15:31:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "JPMAM sees 6%-plus returns in US IG credit (including a 0.3% default haircut) https://t.co/oHuY4CtrPv", "tweet_url": "https://x.com/MikeZaccardi/status/2114013043046719805", "images": ["https://pbs.twimg.com/media/HVZ7qRKWQAAD29t.png"], "created_at": "2026-10-24T15:16:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "JPMAM sees US Treasurys as quite cheap in an expensive world https://t.co/yhitZN6xLV", "tweet_url": "https://x.com/MikeZaccardi/status/2114011030267253058", "images": ["https://pbs.twimg.com/media/HVZ51GQWsAAG4Va.png"], "created_at": "2026-10-24T15:08:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "JPMAM: Business &amp; Finance jobs have extremely high AI-displacement risk https://t.co/gXk5sa6EH3", "tweet_url": "https://x.com/MikeZaccardi/status/2114007255183921165", "images": ["https://pbs.twimg.com/media/HVZ2ZXLW4AANYr7.jpg"], "created_at": "2026-10-24T14:53:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "JPMAM sees US nominal GDP growth of 4.5% in CY 2027\n\nMaybe the 10-year yield was over its skis at 5.3% a few weeks ago https://t.co/VW4JCar17g", "tweet_url": "https://x.com/MikeZaccardi/status/2114005494499029195", "images": ["https://pbs.twimg.com/media/HVZ0y01XIAA1Fy3.jpg"], "created_at": "2026-10-24T14:46:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "JPMAM: Key market risks over the next 15 years\n\nU.S. fiscal &amp; institutional erosion, Geopolitical fragmentation &amp; protracted conflict top of the list https://t.co/hJB4v7LoDA", "tweet_url": "https://x.com/MikeZaccardi/status/2114003481107267948", "images": ["https://pbs.twimg.com/media/HVZy9pSXYAAUQMt.jpg"], "created_at": "2026-10-24T14:38:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "JPMAM sees US large caps and ex-US stocks returning 7.5% annually over the next 10-15 years https://t.co/y8D5bHN589", "tweet_url": "https://x.com/MikeZaccardi/status/2114001718916579825", "images": ["https://pbs.twimg.com/media/HVZxXFhXUAAmvLj.jpg"], "created_at": "2026-10-24T14:31:00.000Z", "relayers": []}]}, {"bank": "BofA", "theme": "BofA / Hartnett — AI hyperscaler credit spread, railroad drawdown analog, Flow Show risk-off stance", "items": [{"author": "MikeZaccardi", "text": "AI hyperscaler credit spread is nearly the widest since the bear-market lows of 2022 BofA Hartnett https://t.co/MCxfAJf5VU", "tweet_url": "https://x.com/MikeZaccardi/status/2114020593414676838", "images": ["https://pbs.twimg.com/media/HVaChu3XcAEzWnP.png"], "created_at": "2026-10-24T15:46:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "AI analog... Railroads had three 30-50% drawdowns in late-1800s bull. Hartnett BofA https://t.co/csvxrwsjVx", "tweet_url": "https://x.com/MikeZaccardi/status/2114018579955827032", "images": ["https://pbs.twimg.com/media/HVaAsjUWwAARBys.png"], "created_at": "2026-10-24T15:38:00.000Z", "relayers": []}, {"author": "neilsethinew", "text": "With the action this week, which Nomura's McElligott said resulted in a \"traumatic risk-management unwind\" that saw 124 pair trades stop out on the firm's Long/Short monitor including 47 greater than three standard deviations, 26 greater than four and 6 greater than five.  \n\nAs ZH notes \"a 5-sigma move is supposed to happen roughly once every few thousand years in a normal distribution.\"\n\nMcElligott: To me, a lot of this \"Stop-Out / Capitulation\" is about Crowding in what had been an unusual year of widespread \"High Sharpe Winners\" as the \"Gifts That Kept Giving\" in both -Carry and -Trend....but now, particularly with the abject \"Performance Pain\" now occuring late in the year during Q4... Traders are now simply forced or incentivized to \"Survive Drawdowns\" and avoid having their Capital culled ahead of the new year PNL turn...so it's \"De-risking and Shut-It-Down\" -mode even if some juicy looking trades are there.\n\nZH: as McElligott shows, the \"Reversing\" flag is now lit up across nearly every asset class on Nomura's trend monitor: Treasuries across the curve, EUR rates, JGBs, SOFR futures, the S&P, the Nasdaq 100, copper, cocoa, sugar and half the G10 FX board.\n\nhttps://t.co/WTe249s7D3", "tweet_url": "https://x.com/neilsethinew/status/2113993664150270085", "images": ["https://pbs.twimg.com/media/HVZbbGMXoAEBaGS.jpg"], "created_at": "2026-10-24T13:59:00.000Z", "relayers": []}, {"author": "neilsethinew", "text": "BofA’s Hartnett (Flow Show) says “we stay tactically risk-off until mid-Nov,” expecting a “down-in-yields, down-in-stocks, down-in US dollar” trade. He sees the 30-year Treasury yield heading toward 5% and the Dollar Index dipping below 100.\n\nWhat ends it:\n\n-A Democratic midterm sweep gets “fully priced-in.” Polymarket odds are now 68%, up from 63% a week ago.\n-The ECB and France “stop rout in French bonds.”\n-An “AI capex cut or extreme equity issuance announcement (think Boeing 2024) causes peak in AI hyperscaler debt spreads.”\n\nHe sees a Dem sweep as a negative for earnings. It would bring an “end of lower tax/regulation regime,” and Trump would be “less able to coerce resources & capital into US-China AI priority.”\n\nRisks cut both ways. Peace deals on Russia/Ukraine/Iran could knock $10–20 a barrel off oil. Alternatively hyperscaler bond spreads could surge past 200bps, leaving investors deleveraging on “shadow banking credit event risk.”", "tweet_url": "https://x.com/neilsethinew/status/2113956172369641793", "images": ["https://pbs.twimg.com/media/HVW6n8zWsAA4uST.jpg"], "created_at": "2026-10-24T11:30:01.000Z", "relayers": []}]}, {"bank": "Apollo/Slok", "theme": "Apollo/Slok — S&P 493 vs Tech revenue-per-worker and margin charts", "items": [{"author": "MikeZaccardi", "text": "Is the AI boom a bubble outside Tech?\n\n📉 Rev per worker: S&amp;P 493 flat\n📉 Profit margins: S&amp;P 493 flat\n📉 Productivity boost: None\n\nNon-tech sees AI token spend as a cost center, not growth. The macro AI story will be decided in the S&amp;P 493, not the Mag 7. T at Apollo https://t.co/iV9gULlc8Q", "tweet_url": "https://x.com/MikeZaccardi/status/2113954267778175139", "images": ["https://pbs.twimg.com/media/HVZGMoWWsAAMA7w.jpg", "https://pbs.twimg.com/media/HVZGMy4WgAAN4CI.jpg", "https://pbs.twimg.com/media/HVZGM73XQAA-5SZ.jpg", "https://pbs.twimg.com/media/HVZGNEiWIAEK9fu.jpg"], "created_at": "2026-10-24T11:22:27.000Z", "relayers": []}]}, {"bank": "Morgan Stanley", "theme": "Morgan Stanley — AI basket vs Treasury yields (BBG chart)", "items": [{"author": "neilsethinew", "text": "BBG: In contrast with July when Treasury yields climbed despite a drop in Morgan Stanley's AI basket, Treasuries resumed their more normal safe haven role in October. https://t.co/gmgedlczvo", "tweet_url": "https://x.com/neilsethinew/status/2113978819241472227", "images": ["https://pbs.twimg.com/media/HVZTeqsXUAAihp5.png"], "created_at": "2026-10-24T13:00:00.000Z", "relayers": []}]}, {"bank": "Nomura", "theme": "Nomura — McElligott on pair-trade stop-outs in the week's risk unwind", "items": [{"author": "neilsethinew", "text": "With the action this week, which Nomura's McElligott said resulted in a \"traumatic risk-management unwind\" that saw 124 pair trades stop out on the firm's Long/Short monitor including 47 greater than three standard deviations, 26 greater than four and 6 greater than five.  \n\nAs ZH notes \"a 5-sigma move is supposed to happen roughly once every few thousand years in a normal distribution.\"\n\nMcElligott: To me, a lot of this \"Stop-Out / Capitulation\" is about Crowding in what had been an unusual year of widespread \"High Sharpe Winners\" as the \"Gifts That Kept Giving\" in both -Carry and -Trend....but now, particularly with the abject \"Performance Pain\" now occuring late in the year during Q4... Traders are now simply forced or incentivized to \"Survive Drawdowns\" and avoid having their Capital culled ahead of the new year PNL turn...so it's \"De-risking and Shut-It-Down\" -mode even if some juicy looking trades are there.\n\nZH: as McElligott shows, the \"Reversing\" flag is now lit up across nearly every asset class on Nomura's trend monitor: Treasuries across the curve, EUR rates, JGBs, SOFR futures, the S&P, the Nasdaq 100, copper, cocoa, sugar and half the G10 FX board.\n\nhttps://t.co/WTe249s7D3", "tweet_url": "https://x.com/neilsethinew/status/2113993664150270085", "images": ["https://pbs.twimg.com/media/HVZbbGMXoAEBaGS.jpg"], "created_at": "2026-10-24T13:59:00.000Z", "relayers": []}]}, {"bank": "UBS", "theme": "UBS — GOP midterm basket year-to-date", "items": [{"author": "MikeZaccardi", "text": "UBS GOP midterm basket deeply red YTD https://t.co/ktufsN6gzP", "tweet_url": "https://x.com/MikeZaccardi/status/2113727827472195831", "images": ["https://pbs.twimg.com/media/HVV4Qg0XkAEIc6Z.png"], "created_at": "2026-10-23T20:22:39.000Z", "relayers": []}]}, {"bank": "Yardeni", "theme": "Yardeni — AI investment vs Mag-7 underperformance", "items": [{"author": "neilsethinew", "text": "Ed Yardeni sees AI investment continuing but tempered by market concerns which has seen the Mag-7 underperform the \"other 493\" by almost four percent through Thursday's close:\n\nWe view market-driven tightening access to capital as healthy for the AI boom, resulting in more efficient capital allocation and reducing over-investment risks. Importantly, we expect the key players to retain financing access. The five major hyperscalers (Amazon, Alphabet, Meta, Microsoft, and Oracle) alone are projected to spend almost $780 billion in 2026. Over each of the following four years, from 2027 through 2030, that figure is expected to exceed $1 trillion annually. Their strong cash flows, balance sheets, and market access should allow them to continue investing in AI.", "tweet_url": "https://x.com/neilsethinew/status/2113986368565063944", "images": ["https://pbs.twimg.com/media/HVXLGGnWkAA7Azz.png"], "created_at": "2026-10-24T13:30:00.000Z", "relayers": []}]}], "date": "2026-10-24", "topics": [{"topic": "Neil Sethi — no bank tag: sector/index breadth, PMIs, sentiment, credit spreads and oil/geopolitics charts", "items": [{"author": "neilsethinew", "text": "Semiconductors didn’t get much bounce Friday with the Philadelphia Semiconductor Index (SOX) adding just 0.4% and finishing the week 3.2% lower, its third straight weekly loss for the first time since November. https://t.co/dpTIlyF6Qb", "tweet_url": "https://x.com/neilsethinew/status/2114039214878965835", "images": ["https://pbs.twimg.com/media/HVXNiJiXUAAntCZ.jpg"], "created_at": "2026-10-24T17:00:00.000Z", "relayers": []}, {"author": "neilsethinew", "text": "Gold futures (/GC) fell further after breaking through support Thursday, now the lowest close since July 15th and before that last November. The daily MACD is tipping negative and the RSI is now at 30. Will it hold $4,000? https://t.co/tNGH4TPF2x", "tweet_url": "https://x.com/neilsethinew/status/2114023863436583299", "images": ["https://pbs.twimg.com/media/HVXLZjyWQAAbUW5.jpg"], "created_at": "2026-10-24T15:59:00.000Z", "relayers": []}, {"author": "neilsethinew", "text": "Profit margins are estimated by Factset to come in at an elevated 14.9%, the second highest on record (since 2009) after 17.0% in Q2, up from 13.0% a year ago, in large part due to Tech's 32.3% margin up from 27.5% a year ago and versus the 25.9% five-year average (due in no small part to the huge increase in semiconductor margins).\n\nAs a side note, FactSet says the 17.0% in Q2 was boosted by the valuation gains in Amazon and Alphabet in their investments in OpenAI, Anthropic, etc.  Still, excluding those it would still have been a record at 15.1%.", "tweet_url": "https://x.com/neilsethinew/status/2114009026417541316", "images": ["https://pbs.twimg.com/media/HVZatRhW8AA46VM.jpg"], "created_at": "2026-10-24T15:00:02.000Z", "relayers": []}, {"author": "neilsethinew", "text": "Ahead of PCE next week, a reminder to keep an eye on the breadth of price increases.\n\nAt Jackson Hole in August, Chair Kevin Warsh said that “over the past 12 months, 54% of goods and services in the PCE basket showed price increases above 3%. This is well below the post-pandemic highs of about 77%, but it remains well above the level of 32% in the two decades that preceded the pandemic.”\n\nRunning the same exercise on the CPI across the roughly 180 item categories the BLS publishes, covering about 98% of the basket, yields mixed results.\n\nWhile 47.2% of categories rose more than 3% from a year earlier in September, the lowest since December and down from 50.6% in August, that compares with an average of 31.7% from 2000 to 2019 although well off the peak of 80.4% in March 2022.\n\nAnd weighted by share of spending, 62.2% of the basket is rising faster than 3%, the most since September 2025, up from 60.0% in August, as the categories that crossed above 3% included larger ones such as college tuition (+4.00%), hotels (+4.27%), cable, satellite and streaming TV (+3.33%) and motor vehicle repair (+3.55%), while eight of the 17 that fell back below 3% were grocery items.\n\nThe share above 5% rose to 23.0% of categories (13.1% of the basket) from 21.0% (11.6%), led by gasoline (+34.17%), hospital services (+5.63%), dental services (+6.02%) and airline fares (+22.45%), while 27.5% of categories are now falling from a year earlier, up from 21.0%.", "tweet_url": "https://x.com/neilsethinew/status/2114001465710886929", "images": ["https://pbs.twimg.com/media/HVZbVp3WUAEyfUD.png"], "created_at": "2026-10-24T14:30:00.000Z", "relayers": []}, {"author": "neilsethinew", "text": "As noted in the article from @C_Barraud, investors were bracing for Moody's ratings review on French debt, but the country got some relief after a brutal week which saw the 10-year yield hitting 5% for the first time since 2002, and widening the most against German yields in records dating to 1990.\n\nHeading into Friday most economists expected Moody's to cut France one notch, from Aa3 to A1.  \n\nBut it didn't. Instead, Moody's took no rating action, leaving France at Aa3 with a negative outlook. It said this wasn't a credit action and seems to be waiting for more clarity on the budget. It also said higher borrowing costs would need to persist for an extended period to seriously hurt debt sustainability.\n\nThe longer view though is sobering. France held AAA ratings from all three major agencies until 2012. Since then it has received 11 downgrades: four from S&P, four from Fitch and three from Moody's. S&P and Fitch now rate France A+, which leaves Moody's as the last of the big three still rating France in the AA tier. \n\nThe negative outlook keeps a downgrade on the table, and S&P reviews France again on Nov 27.", "tweet_url": "https://x.com/neilsethinew/status/2113941069444636996", "images": ["https://pbs.twimg.com/media/HVXICb1XQAAtxzb.jpg"], "created_at": "2026-10-24T10:30:00.000Z", "relayers": []}, {"author": "neilsethinew", "text": "Iran Concerns Weigh on Stocks as Tech Steadies to End a Volatile Week\n\nBrent topped $116 and stocks pulled back on fears of renewed U.S.-Iran hostilities after the midterm elections. For the week, small caps led with the Russell 2000 up 2% while the S&P 500 and Nasdaq slipped.\n\nhttps://t.co/E8H3QeFYIf", "tweet_url": "https://x.com/neilsethinew/status/2113792206930677890", "images": ["https://pbs.twimg.com/media/HVWyvq9X0AAXKrx.jpg"], "created_at": "2026-10-24T00:38:29.000Z", "relayers": []}, {"author": "neilsethinew", "text": "For the week though the RUT dominated the four up 2%.\n\nDJIA was also green +0.4%, but the SPX and Nasdaq finished lower -0.5% and -0.7% respectively.\n\nNotably the Nasdaq was in the lead as of Wednesday's close. https://t.co/DkrW6ZCTKP", "tweet_url": "https://x.com/neilsethinew/status/2113724181770908059", "images": ["https://pbs.twimg.com/media/HVV00ZGWkAAOR5G.png"], "created_at": "2026-10-23T20:08:10.000Z", "relayers": []}, {"author": "neilsethinew", "text": "US equity indices opened lower but rebounded after the first hour led by Tech with the Nasdaq making it into positive territory. \n\nBut indices would mostly drift lower in the afternoon all ending down led by DJIA -1.2%. SPX -0.5%, RUT -0.3%, Nasdaq -0.2%. https://t.co/V8F0GXPtVI", "tweet_url": "https://x.com/neilsethinew/status/2113723211666104480", "images": ["https://pbs.twimg.com/media/HVVz7B1WoAA-1Rl.png"], "created_at": "2026-10-23T20:04:19.000Z", "relayers": []}, {"author": "neilsethinew", "text": "Communications worst week since March and before that April 2025. https://t.co/dBd0a4MqpA", "tweet_url": "https://x.com/neilsethinew/status/2113721765838954807", "images": ["https://pbs.twimg.com/media/HVVyvLvXYAA_ZaY.jpg"], "created_at": "2026-10-23T19:58:34.000Z", "relayers": []}, {"author": "neilsethinew", "text": "Looks like every sector will end the week ahead of the SPX other than Industrials and Communications. https://t.co/AUn77ypX06", "tweet_url": "https://x.com/neilsethinew/status/2113721646398022003", "images": ["https://pbs.twimg.com/media/HVVyOl9W8AAuLKQ.jpg"], "created_at": "2026-10-23T19:58:06.000Z", "relayers": []}, {"author": "neilsethinew", "text": "CNBC: The S&amp;P 500 Excluding AI index closed Thursday up about 6.6% taking its gains to 12.4% this year, now edging out the S&amp;P 500′s roughly 12% gain. https://t.co/VDNZLS3WNT", "tweet_url": "https://x.com/neilsethinew/status/2113698216885833861", "images": ["https://pbs.twimg.com/media/HVVFD1XW0AA3L4h.jpg"], "created_at": "2026-10-23T18:25:00.000Z", "relayers": []}, {"author": "neilsethinew", "text": "Russell 2000 ($RUT) on track to snap its six-week losing streak, which was the longest such streak since the six-week stretch that ended Oct. 26, 2018 according to MarketWatch. https://t.co/kw1kPUQ6F7", "tweet_url": "https://x.com/neilsethinew/status/2113683117491859733", "images": ["https://pbs.twimg.com/media/HVVDycJX0AA_-wv.png"], "created_at": "2026-10-23T17:25:00.000Z", "relayers": []}, {"author": "neilsethinew", "text": "Flash PMI Holds Near 5-Year High But Prices Jump the Most Since 2022\n\nOctober flash composite PMI eased to 57.6 on services deceleration but stayed close to September’s five-year high, with new orders at a 4.5-year high.\n\nhttps://t.co/wrXIx17ZTi https://t.co/k7sU1czm3e", "tweet_url": "https://x.com/neilsethinew/status/2113669380315771347", "images": ["https://pbs.twimg.com/media/HVVC-C8WgAAiUdJ.jpg"], "created_at": "2026-10-23T16:30:25.000Z", "relayers": []}, {"author": "neilsethinew", "text": "#UMich University of Michigan sentiment, October final: 48.0, up from 46.3 prelim (est. 46.3) but still a five-month low\n▪️ Current conditions 46.7, up from a record-low 44.7 prelim, still second-lowest on record\n▪️ Durables buying conditions at a record low on high prices and rates\n▪️ Nearly 70% expect rates to rise, most in 3+ years\n▪️ 1-yr/5-10-yr inflation expectations 4.7%/3.5%, highest since May", "tweet_url": "https://x.com/neilsethinew/status/2113637328270864772", "images": ["https://pbs.twimg.com/media/HVUl6HwXoAAhuk7.jpg"], "created_at": "2026-10-23T14:23:03.000Z", "relayers": []}, {"author": "neilsethinew", "text": "US S&P flash PMI (October):\nComposite 57.6 (prev 58.4)\nManufacturing 56.0 (est 55.5; prev 55.9), a 53-month high\nServices 57.9 (est 58.0; prev 58.8)\n▪️Growth eased but stayed near five-year high\n▪️New orders highest in over 4.5 years; exports strongest since May 2022; exports strongest since May 2022\n▪️Hiring fastest since June 2022 barring September; factory jobs most since March 2012\n▪️Selling prices rose at the sharpest rate since August 2022\n\nS&P’s Williamson: consistent with GDP “growing at a 5% annualized rate” after 4% in Q3.", "tweet_url": "https://x.com/neilsethinew/status/2113635139490115668", "images": ["https://pbs.twimg.com/media/HVUjzF9WAAA06mz.jpg"], "created_at": "2026-10-23T14:14:21.000Z", "relayers": []}, {"author": "neilsethinew", "text": "If you're searching for an explanation on why Tech, particularly semiconductors, have been so volatile, you can in part blame the overall negative gamma regime in the market as Tier1Alpha indicated earlier this week.\n\nBut semis have an added pseudo-negative-gamma source in the huge amount of assets in leveraged ETFs tied to the space, which must rebalance near the close by buying or selling in the direction of each day’s move.\n\nAs Tier1Alpha notes: \"we suspect these funds were the largest non-discretionary agents in the market yesterday, especially tied to $SOXL and $TQQQ, which hold a combined $60B in AUM.\"\n\nThey estimate SOXL’s 20% decline forced a $9.5 billion market-on-close (MOC) sell imbalance, while TQQQ “contributed another $6.5 billion in MOC selling.”", "tweet_url": "https://x.com/neilsethinew/status/2113626998082011554", "images": ["https://pbs.twimg.com/media/HVUaAbiXMAEZkhm.jpg"], "created_at": "2026-10-23T13:42:00.000Z", "relayers": []}, {"author": "neilsethinew", "text": "BBG's Global Corporate Credit Index (aggregate bond spreads) have jumped to 129 basis points, the widest over the risk free rate since May 2025 (when they were recovering from the liberation day spike). https://t.co/E7bIKOS3pd", "tweet_url": "https://x.com/neilsethinew/status/2113619268675797096", "images": ["https://pbs.twimg.com/media/HVUVhgiXcAE5SHL.jpg"], "created_at": "2026-10-23T13:11:17.000Z", "relayers": []}, {"author": "neilsethinew", "text": "From @C_Barraud's Friday Brief were a couple of posts on the Euro area flash PMIs which indicated while most of the \"eurozone economy starts the fourth quarter with  businesses reporting further robust growth... consistent with GDP growing at a 0.3% quarterly cadence,\" France was a key outlier.\n\nAccording to S&P while there was some deceleration in the region in general \"French private sector output moved back into contraction in October, following a first rise in 10 months during September,\" with business confidence \"the lowest since 2012 if the pandemic is excluded.\" \n\nSlowing growth only adds fuel to budget concerns in France, putting further pressure on French yields, which, in another post in the Friday Brief, have not pulled back this week along with other DM markets but instead surged the joint-most since March 2025.\n\nThis puts the ECB in an increasingly tricky situation weighing the tumult in the French bond market vs inflationary pressures which according to S&P are far from extinguished:\n\n\"Key to the broader slowdown is the further escalation of  inflationary pressures seen during the month. Input costs are rising sharply again, the rate of increase surging in manufacturing on the back of higher energy prices, causing firms to push selling prices higher in order to protect margins.\"\n\nClick through for those full posts along with the many others from Christophe.", "tweet_url": "https://x.com/neilsethinew/status/2113616450850091307", "images": ["https://pbs.twimg.com/media/HVUNA9XWcAAHnQ9.jpg"], "created_at": "2026-10-23T13:00:05.000Z", "relayers": []}]}, {"topic": "Goldman — household equity ownership and retail activity charts; hedge fund de-grossing and risk appetite; flash PMI price data", "items": [{"author": "MikeZaccardi", "text": "GS: P/E ratios have risen alongside household equity allocations\n\nRebalancing is not an American virtue https://t.co/8guvkIAn83", "tweet_url": "https://x.com/MikeZaccardi/status/2113999705772318724", "images": ["https://pbs.twimg.com/media/HVZvh6NWoAA04P4.png"], "created_at": "2026-10-24T14:23:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "The country needs more financial advisors... Wealth management assets over time.... GS https://t.co/sfAx7TVyMi", "tweet_url": "https://x.com/MikeZaccardi/status/2113997943954981108", "images": ["https://pbs.twimg.com/media/HVZt7Y5XQAA2u4o.png"], "created_at": "2026-10-24T14:16:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "Consumers are angry, but they apparently love stocks... record-high equity allocation among households GS https://t.co/epbrDLHqCz", "tweet_url": "https://x.com/MikeZaccardi/status/2113992155635069286", "images": ["https://pbs.twimg.com/media/HVZoqdQXsAAq6ZI.png"], "created_at": "2026-10-24T13:53:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "Corporations are not buying much stock anymore, but households are GS https://t.co/4XIdbN1f9H", "tweet_url": "https://x.com/MikeZaccardi/status/2113990394014790031", "images": ["https://pbs.twimg.com/media/HVZnD6iWUAAcDQx.jpg"], "created_at": "2026-10-24T13:46:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "GS: While retail trading activity has slowed this year, total household demand for US equities has remained strong. \n\nFederal Reserve data show that households bought $840 billion of US equities in H1 2026. https://t.co/Qy7OTcLGBE", "tweet_url": "https://x.com/MikeZaccardi/status/2113984605959111007", "images": ["https://pbs.twimg.com/media/HVZhzADX0AA1YzU.jpg"], "created_at": "2026-10-24T13:23:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "GS: Households are the largest owners of US equities... and an increasing share https://t.co/BteBSKIBPP", "tweet_url": "https://x.com/MikeZaccardi/status/2113980831131681248", "images": ["https://pbs.twimg.com/media/HVZeXRQXIAAhZ_x.jpg"], "created_at": "2026-10-24T13:08:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "GS: Only $12 trillion of the $65 trillion of household equity ownership is higher-risk self-directed https://t.co/6BP85PFAUs", "tweet_url": "https://x.com/MikeZaccardi/status/2113977056283316656", "images": ["https://pbs.twimg.com/media/HVZa7jOW0AAO9QP.jpg"], "created_at": "2026-10-24T12:53:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "GS: Speculative trading is in check... well below year-ago levels and the Jan 2000 &amp; Feb 2021 generational climaxes https://t.co/41yY6cqGhe", "tweet_url": "https://x.com/MikeZaccardi/status/2113973281569021953", "images": ["https://pbs.twimg.com/media/HVZXf1EW8AAeBh8.jpg"], "created_at": "2026-10-24T12:38:00.000Z", "relayers": []}, {"author": "neilsethinew", "text": "Goldman: The GS Risk Appetite Indicator saw one of its largest drops on record, now at its lowest level since April of last year.\n\nChoppy week overall as we saw a true episode of capitulation and de-grossing on Thursday due to AI financing worries and geopolitical escalation. This led to a notable lack of participation during Friday’s session … -21% vs 5d avg and -33% vs 100d avg – a demonstration of investor fatigue and defensive posturing.", "tweet_url": "https://x.com/neilsethinew/status/2113971270307992029", "images": ["https://pbs.twimg.com/media/HVXDhOfXMAA4oy9.jpg"], "created_at": "2026-10-24T12:30:01.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "GS: Weak consumer sentiment and rising energy prices likely explain most of this year’s decline in retail trading activity.\n\nInteresting connection &amp; conclusion https://t.co/CX2Uc8CiiQ", "tweet_url": "https://x.com/MikeZaccardi/status/2113969506271850855", "images": ["https://pbs.twimg.com/media/HVZUEGCW0AAlqkv.png"], "created_at": "2026-10-24T12:23:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "GS: Retail trading volume is down YoY, but leveraged ETF slinging and prediction market betting rates are up big\n\nETFs include $TQQQ, $SOXL, $QLD, $SSO, $SPXL, $TECL, $UPRO, $MUU, $TSLL, and $NVDL https://t.co/ulw3yRJnXe", "tweet_url": "https://x.com/MikeZaccardi/status/2113965731100438673", "images": ["https://pbs.twimg.com/media/HVZQoXSWcAA4LEo.png"], "created_at": "2026-10-24T12:08:00.000Z", "relayers": []}, {"author": "neilsethinew", "text": "Things just got more extreme this week with Goldman seeing hedge fund gross leverage increasing to the 64th 1-year percentile while net leverage fell further (can't get any lower than the 0 five-year percentile though) meaning an even higher net short position.\n\nUnsurprisingly then the long/short ratio remained at the 0 percentile over the 1, 3, and // ---------- helpers ----------
function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }

function renderBold(text) {
  return escapeHtml(text).replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
}

function relativeTime(iso) {
  if (!iso) return '';
  const dt = new Date(iso);
  if (isNaN(dt.getTime())) return '';
  const secs = Math.max(0, (Date.now() - dt.getTime()) / 1000);
  if (secs < 60)   return Math.floor(secs) + 's ago';
  const mins = secs / 60;
  if (mins < 60)   return Math.floor(mins) + 'm ago';
  const hrs  = mins / 60;
  if (hrs < 48)    return Math.floor(hrs) + 'h ago';
  return Math.floor(hrs / 24) + 'd ago';
}

function authorTag(name, cls = 'item-author') {
  if (!name) return '';
  return `<span class="${cls}" onclick="filterAuthor('${escapeAttr(name)}')">@${escapeHtml(name)}</span>`;
}

// ---------- rendering ----------
function renderCharts(images) {
  if (!images || !images.length) return '';
  return `<div class="charts">` + images.map(u =>
    `<img src="${escapeAttr(u)}" class="chart" loading="lazy" alt="" onclick="openLightbox('${escapeAttr(u)}')">`
  ).join('') + `</div>`;
}

function renderDataPoints(points) {
  if (!points || !points.length) return '';
  return `<div class="data-points">` + points.map(p =>
    `<span class="dp-tag">${escapeHtml(p)}</span>`
  ).join('') + `</div>`;
}

function renderItem(item) {
  const author = item.author || item.author_username || '';
  const time = relativeTime(item.created_at);
  const link = item.tweet_url
    ? `<a class="item-link" href="${escapeAttr(item.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  const body = item.description || item.text || '';
  return `
    <div class="item-card filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${authorTag(author)}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      ${body ? `<div class="item-text">${escapeHtml(body)}</div>` : ''}
      ${renderDataPoints(item.data_points)}
      ${renderCharts(item.images)}
    </div>`;
}

function renderTopic(topic, idx) {
  const items = (topic.items || []).map(renderItem).join('');
  const name = topic.topic || topic.name || `Topic ${idx + 1}`;
  return `
    <div class="topic">
      <div class="topic-head" onclick="toggleTopic(this)">
        <span class="topic-name">${escapeHtml(name)}</span>
        <span class="topic-count">${(topic.items || []).length}</span>
        <span class="topic-arrow">▸</span>
      </div>
      <div class="topic-body">${items || '<div class="empty">No items.</div>'}</div>
    </div>`;
}

function renderLink(l) {
  const author = l.author || l.author_username || '';
  const url = l.url || (l.resolved || l.tco) || '';
  return `
    <div class="link-row filterable" data-author="${escapeAttr(author).toLowerCase()}">
      ${author ? authorTag(author, 'link-author') : '<span class="link-author">—</span>'}
      <a class="link-url" href="${escapeAttr(url)}" target="_blank" rel="noopener">${escapeHtml(url)}</a>
      ${l.description ? `<span class="link-desc">${escapeHtml(l.description)}</span>` : ''}
    </div>`;
}

function renderSection(letter, name, body, count) {
  return `
    <div class="section">
      <div class="section-head" onclick="toggleSection(this)">
        <span class="section-letter">${letter}.</span>
        <span class="section-name">${escapeHtml(name)}</span>
        <span class="section-count">${count}</span>
        <span class="section-arrow">▸</span>
      </div>
      <div class="section-body">${body}</div>
    </div>`;
}

function renderSummary(text) {
  if (!text) return '';
  const paragraphs = String(text).split(/\n\n+/).filter(Boolean)
    .map(p => `<p>${renderBold(p)}</p>`).join('');
  return `<div class="summary">${paragraphs}</div>`;
}

function renderStats(d) {
  const parts = [];
  const cov = d.coverage || {};
  if (cov.authors_covered != null && cov.authors_total != null) {
    const pct = cov.authors_total ? (100 * cov.authors_covered / cov.authors_total) : 0;
    parts.push(`coverage <strong>${cov.authors_covered}/${cov.authors_total}</strong> (${pct.toFixed(0)}%)`);
  }
  const topicCount = (d.topics || []).length;
  const itemCount = (d.topics || []).reduce((n, t) => n + (t.items || []).length, 0);
  parts.push(`topics <strong>${topicCount}</strong>`);
  parts.push(`items <strong>${itemCount}</strong>`);
  if ((d.links || []).length) parts.push(`links <strong>${d.links.length}</strong>`);
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSection(el) { el.parentElement.classList.toggle('open'); }
function toggleTopic(el)   { el.parentElement.classList.toggle('open'); }

function openLightbox(src) {
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-img').src = '';
}

let activeFilter = null;
function filterAuthor(name) {
  if (!name) return;
  activeFilter = String(name).toLowerCase();
  document.querySelectorAll('.filterable').forEach(el => {
    const a = (el.dataset.author || '').toLowerCase();
    if (a === activeFilter) { el.classList.add('match'); el.classList.remove('dim'); }
    else                    { el.classList.add('dim'); el.classList.remove('match'); }
  });
  document.getElementById('filter-name').textContent = '@' + name;
  document.getElementById('filter-bar').classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function clearFilter() {
  activeFilter = null;
  document.querySelectorAll('.filterable').forEach(el => {
    el.classList.remove('match'); el.classList.remove('dim');
  });
  document.getElementById('filter-bar').classList.remove('active');
}
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (document.getElementById('lightbox').classList.contains('open')) closeLightbox();
    else if (activeFilter) clearFilter();
  }
});

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';

  const topicsBody = (d.topics || []).map(renderTopic).join('')
                  || '<div class="empty">No topics.</div>';
  const linksBody = (d.links || []).map(renderLink).join('');

  const sections = [
    renderSummary(d.summary),
    renderSection('A', 'Topics', topicsBody, (d.topics || []).length),
    linksBody ? renderSection('B', 'Link Queue', linksBody, (d.links || []).length) : '',
  ].join('');

  document.getElementById('app').innerHTML = sections || '<div class="empty">No report data.</div>';

  // Auto-open the main section and the first topic.
  document.querySelectorAll('.section').forEach((s, i) => { if (i === 0) s.classList.add('open'); });
  const firstTopic = document.querySelector('.topic');
  if (firstTopic) firstTopic.classList.add('open');

  document.getElementById('stats').innerHTML = renderStats(d);
}

renderReport(REPORT_DATA);
</script>
