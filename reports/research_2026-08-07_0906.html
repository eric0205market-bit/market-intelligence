const META = {
  date: "2026-08-07",
  time: "09:06 CEST",

  ]
};

const CAT_LABELS = {
  macro:"macro", credit:"credit", positioning:"positioning", ai:"AI/infra", crypto:"crypto",
  geopolitics:"geopolitics", energy:"energy", tech:"tech", gold:"gold", culture:"culture",
  labor:"labor", regulation:"regulation", science:"science", venture:"venture"
};
const CAT_COLORS = {
  macro:"#e24b4a", credit:"#378add", positioning:"#ef9f27", ai:"#1d9e75", crypto:"#7f77dd",
  geopolitics:"#d85a30", energy:"#f97316", tech:"#06b6d4", gold:"#d4a017", culture:"#ec4899",
  labor:"#8b5cf6", regulation:"#64748b", science:"#14b8a6", venture:"#84cc16"
};
const URG_LABELS = { act:"🔴 Act Now", deep:"🔵 Deep", watch:"🟡 Watch" };
const URG_EMOJI = { act:"🔴", deep:"🔵", watch:"🟡" };

let activeCat = "all";
let activeUrg = "all";
let activeSrc = null;

function hexToRgba(hex, a){
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return "rgba("+r+","+g+","+b+","+a+")";
}

function buildFilterBars(){
  const catCounts = {};
  ITEMS.forEach(function(i){ catCounts[i.cat] = (catCounts[i.cat]||0)+1; });
  const catBar = document.getElementById("catBar");
  let html = '<button class="pill' + (activeCat==="all"?" active":"") + '" style="' + (activeCat==="all"?"background:#333;":"") + '" onclick="setCat(\'all\')">All (' + ITEMS.length + ')</button>';
  Object.keys(CAT_LABELS).forEach(function(c){
    if(!catCounts[c]) return;
    const isActive = activeCat===c;
    const style = isActive ? ("background:" + CAT_COLORS[c] + ";border-color:" + CAT_COLORS[c] + ";") : "";
    html += '<button class="pill' + (isActive?" active":"") + '" style="' + style + '" onclick="setCat(\'' + c + '\')">' + CAT_LABELS[c] + ' (' + catCounts[c] + ')</button>';
  });
  catBar.innerHTML = html;

  const urgCounts = {};
  ITEMS.forEach(function(i){ urgCounts[i.urgency] = (urgCounts[i.urgency]||0)+1; });
  const urgBar = document.getElementById("urgBar");
  let uhtml = '<button class="pill' + (activeUrg==="all"?" active":"") + '" style="' + (activeUrg==="all"?"background:#333;":"") + '" onclick="setUrg(\'all\')">All</button>';
  ["act","deep","watch"].forEach(function(u){
    if(!urgCounts[u]) return;
    const isActive = activeUrg===u;
    const style = isActive ? "background:#333;border-color:#333;" : "";
    uhtml += '<button class="pill' + (isActive?" active":"") + '" style="' + style + '" onclick="setUrg(\'' + u + '\')">' + URG_LABELS[u] + ' (' + urgCounts[u] + ')</button>';
  });
  urgBar.innerHTML = uhtml;
}

function setCat(c){ activeCat = c; activeSrc = null; render(); }
function setUrg(u){ activeUrg = u; activeSrc = null; render(); }
function filterBySrc(name){
  activeSrc = name;
  activeCat = "all";
  activeUrg = "all";
  render();
  ITEMS.forEach(function(item){
    if(item.source.indexOf(name) !== -1){
      const el = document.getElementById("card-" + item.id);
      if(el) el.classList.add("open");
    }
  });
}

function renderCard(item){
  const color = CAT_COLORS[item.cat];
  const chartFlag = item.charts.hot ? "🔥" : (item.charts.count > 0 ? "📊" : "");
  let html = '<div class="card" id="card-' + item.id + '">';
  html += '<div class="card-header" onclick="document.getElementById(\'card-' + item.id + '\').classList.toggle(\'open\')">';
  html += '<span class="idx">' + String(item.id).padStart(2,"0") + '</span>';
  html += '<span class="urg">' + URG_EMOJI[item.urgency] + '</span>';
  html += '<span class="badge" style="background:' + color + '">' + item.source.split(" (")[0] + '</span>';
  html += '<span class="cattag">' + CAT_LABELS[item.cat] + '</span>';
  if(chartFlag) html += '<span class="chartflag">' + chartFlag + '</span>';
  html += '<span class="card-title">' + item.title + '</span>';
  html += '<span class="caret">▸</span>';
  html += '</div>';

  html += '<div class="card-body">';
  html += '<div class="section-label">The Idea</div>';
  html += '<div class="idea-text">' + item.idea + '</div>';
  html += '<div class="section-label">My Angle</div>';
  html += '<div class="angle-box" style="--accent:' + color + ';--accent-tint:' + hexToRgba(color,0.08) + '">' + item.angle + '</div>';
  html += '<div class="section-label">Tweets</div>';
  html += '<div class="tweets">';
  html += '<div class="tweet-box a"><div class="tlabel">TWEET A</div><div class="tweet-text">' + item.tweetA + '</div><button class="copy-btn" onclick="copyTweet(' + item.id + ",'a')\">📋 Copy</button></div>";
  html += '<div class="tweet-box b"><div class="tlabel">TWEET B</div><div class="tweet-text">' + item.tweetB + '</div><button class="copy-btn" onclick="copyTweet(' + item.id + ",'b')\">📋 Copy</button></div>";
  html += '</div>';
  html += '<div class="chart-box' + (item.charts.hot?" hot":"") + '">' + (item.charts.hot?"🔥 ":"📊 ") + item.charts.desc + '</div>';
  html += '<div class="linkrow"><a href="' + item.link + '" target="_blank" rel="noopener">↗ Read full article</a></div>';
  html += '</div>';
  html += '</div>';
  return html;
}

function render(){
  buildFilterBars();
  let filtered = ITEMS.filter(function(item){
    if(activeSrc && item.source.indexOf(activeSrc) === -1) return false;
    if(activeCat !== "all" && item.cat !== activeCat) return false;
    if(activeUrg !== "all" && item.urgency !== activeUrg) return false;
    return true;
  });
  document.getElementById("items").innerHTML = filtered.map(renderCard).join("");
}

function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}

function buildReport(){
  document.getElementById("metaLine").textContent =
    META.date + " · " + META.time + " · " + META.itemsExtracted + " items from " + META.emailsRead + " emails";

  let html = "";
  html += '<h4>Time Window</h4>';
  html += '<div>' + META.windowStart + ' → ' + META.windowEnd + '. Emails outside this window were not processed.</div>';
  html += '<h4>Included Sources</h4>';
  META.includedSources.forEach(function(s){
    html += '<div><span class="srcline" onclick="filterBySrc(\'' + s.name.replace(/'/g,"\\'") + '\')">' + s.name + '</span> — ' + s.count + ' item' + (s.count===1?"":"s") + '</div>';
  });
  html += '<h4>Skipped Sources</h4>';
  META.skippedSources.forEach(function(s){
    html += '<div class="skipline"><strong>' + s.name + '</strong> — ' + s.reason + '</div>';
  });
  html += '<h4>Totals</h4>';
  html += '<div>Emails in window: ' + META.emailsInWindow + ' &middot; Emails read: ' + META.emailsRead + ' &middot; Items extracted: ' + META.itemsExtracted + '</div>';
  document.getElementById("reportBody").innerHTML = html;
}

buildReport();
render();
</script>
