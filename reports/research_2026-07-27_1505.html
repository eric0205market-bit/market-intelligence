    tweetA: "Trichet has 2 of the top 4 spots on the central-bank 'Death Shot' leaderboard - hikes that ended the cycle because policy had already done the tightening and the last hike just tipped it over. Financial conditions have already tightened hard since mid-June via long rates, FX and widening hyperscaler credit spreads. If Warsh hikes this week to prove his inflation credibility, he's not choosing whether to join the leaderboard - he's choosing which slot.",
    tweetB: "Every 'Death Shot' in history came from a new central banker trying to establish inflation-fighting credentials into conditions that were already tight. Warsh makes $253,100 a year and doesn't need the money - purely reputational incentives are exactly the setup that produced Trichet twice. Worth pricing the tail risk of a hike as ego, not economics.",

const CAT_COLORS = {
  macro: "#e24b4a", credit: "#378add", positioning: "#ef9f27", "AI/infra": "#1d9e75",
  crypto: "#7f77dd", geopolitics: "#d85a30", energy: "#f97316", tech: "#06b6d4",
  gold: "#d4a017", culture: "#ec4899", labor: "#8b5cf6", regulation: "#64748b",
  science: "#14b8a6", venture: "#84cc16", cybersecurity: "#0e7490"
};
const URG_LABEL = { act: "🔴 Act Now", deep: "🔵 Deep", watch: "🟡 Watch" };
const URG_EMOJI = { act: "🔴", deep: "🔵", watch: "🟡" };

let activeCat = "all";
let activeUrg = "all";
let activeSrc = null;

function esc(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function buildFilters() {
  const catCounts = {};
  ITEMS.forEach(i => { catCounts[i.cat] = (catCounts[i.cat]||0) + 1; });
  const cats = Object.keys(catCounts).sort();

  const catWrap = document.getElementById('catFilters');
  let html = '<button class="pill active" data-cat="all" onclick="setCat(\'all\')">All (' + ITEMS.length + ')</button>';
  cats.forEach(function(c) {
    html += '<button class="pill" data-cat="' + c + '" style="--pc:' + CAT_COLORS[c] + '" onclick="setCat(\'' + c + '\')">' + esc(c) + ' (' + catCounts[c] + ')</button>';
  });
  catWrap.innerHTML = html;

  const urgCounts = {};
  ITEMS.forEach(i => { urgCounts[i.urgency] = (urgCounts[i.urgency]||0) + 1; });
  const urgWrap = document.getElementById('urgFilters');
  let uhtml = '<button class="pill active" data-urg="all" onclick="setUrg(\'all\')">All (' + ITEMS.length + ')</button>';
  ['act','deep','watch'].forEach(function(u) {
    if (urgCounts[u]) uhtml += '<button class="pill" data-urg="' + u + '" onclick="setUrg(\'' + u + '\')">' + URG_LABEL[u] + ' (' + urgCounts[u] + ')</button>';
  });
  urgWrap.innerHTML = uhtml;
}

function applyPillStyles() {
  document.querySelectorAll('#catFilters .pill').forEach(function(btn) {
    const c = btn.getAttribute('data-cat');
    if (btn.classList.contains('active') && c !== 'all') {
      btn.style.background = CAT_COLORS[c];
      btn.style.borderColor = CAT_COLORS[c];
    } else if (btn.classList.contains('active')) {
      btn.style.background = '#1c1917';
      btn.style.borderColor = '#1c1917';
    } else {
      btn.style.background = 'transparent';
      btn.style.borderColor = '';
    }
  });
  document.querySelectorAll('#urgFilters .pill').forEach(function(btn) {
    if (btn.classList.contains('active')) {
      btn.style.background = '#1c1917';
      btn.style.borderColor = '#1c1917';
      btn.style.color = '#fff';
    } else {
      btn.style.background = 'transparent';
      btn.style.borderColor = '';
      btn.style.color = '';
    }
  });
}

function setCat(c) {
  activeCat = c;
  activeSrc = null;
  document.querySelectorAll('#catFilters .pill').forEach(function(b) {
    b.classList.toggle('active', b.getAttribute('data-cat') === c);
  });
  applyPillStyles();
  renderCards();
}

function setUrg(u) {
  activeUrg = u;
  activeSrc = null;
  document.querySelectorAll('#urgFilters .pill').forEach(function(b) {
    b.classList.toggle('active', b.getAttribute('data-urg') === u);
  });
  applyPillStyles();
  renderCards();
}

function filterBySrc(name) {
  activeSrc = name;
  activeCat = 'all';
  activeUrg = 'all';
  document.querySelectorAll('#catFilters .pill').forEach(function(b) {
    b.classList.toggle('active', b.getAttribute('data-cat') === 'all');
  });
  document.querySelectorAll('#urgFilters .pill').forEach(function(b) {
    b.classList.toggle('active', b.getAttribute('data-urg') === 'all');
  });
  applyPillStyles();
  renderCards(true);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function cardHtml(item) {
  const c = CAT_COLORS[item.cat] || '#888';
  const chartFlag = item.charts.hot ? '🔥' : (item.charts.count > 0 || item.charts.desc ? '📊' : '');
  let body = '';
  body += '<div class="section-label">The Idea</div><div class="idea-text">' + esc(item.idea) + '</div>';
  body += '<div class="section-label">My Angle</div><div class="angle-box" style="border-left:2px solid ' + c + '; background:' + c + '14;">' + esc(item.angle) + '</div>';
  body += '<div class="tweet-row">';
  body += '<div class="tweet-box"><div class="tweet-label a">TWEET A</div><div class="tweet-text">' + esc(item.tweetA) + '</div><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button></div>';
  body += '<div class="tweet-box"><div class="tweet-label b">TWEET B</div><div class="tweet-text">' + esc(item.tweetB) + '</div><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div>';
  body += '</div>';
  if (item.charts.count > 0 || item.charts.desc) {
    body += '<div class="section-label">Charts</div>';
    body += '<div class="chart-box' + (item.charts.hot ? ' hot' : '') + '">' + (item.charts.hot ? '🔥 ' : '📊 ') + esc(item.charts.desc || 'Charts inside') + (item.charts.count ? ' (' + item.charts.count + ')' : '') + '</div>';
  }
  body += '<div class="link-row"><a href="' + esc(item.link) + '" target="_blank" rel="noopener">↗ Read full article</a></div>';

  let head = '';
  head += '<span class="idx mono">#' + String(item.id).padStart(2,'0') + '</span>';
  head += '<span class="urg">' + URG_EMOJI[item.urgency] + '</span>';
  head += '<span class="src-badge" style="background:' + c + '">' + esc(item.source) + '</span>';
  head += '<span class="cat-tag">' + esc(item.cat) + '</span>';
  if (chartFlag) head += '<span class="chart-flag">' + chartFlag + '</span>';
  head += '<span class="title-text">' + esc(item.title) + '</span>';

  return '<div class="card" id="card-' + item.id + '">' +
    '<div class="card-head" onclick="toggleCard(' + item.id + ')">' + head + '</div>' +
    '<div class="card-body">' + body + '</div>' +
  '</div>';
}

function toggleCard(id) {
  const el = document.getElementById('card-' + id);
  if (el) el.classList.toggle('open');
}

function renderCards(expandAll) {
  const wrap = document.getElementById('cardsWrap');
  const filtered = ITEMS.filter(function(i) {
    if (activeSrc && i.source.indexOf(activeSrc) === -1) return false;
    if (!activeSrc && activeCat !== 'all' && i.cat !== activeCat) return false;
    if (!activeSrc && activeUrg !== 'all' && i.urgency !== activeUrg) return false;
    return true;
  });
  wrap.innerHTML = filtered.map(cardHtml).join('');
  document.getElementById('emptyNote').style.display = filtered.length ? 'none' : 'block';
  if (expandAll) {
    filtered.forEach(function(i) {
      const el = document.getElementById('card-' + i.id);
      if (el) el.classList.add('open');
    });
  }
}

function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}

function buildReport() {
  document.getElementById('metaDate').textContent = META.date;
  document.getElementById('metaTime').textContent = META.time;
  document.getElementById('metaCount').textContent = META.itemsExtracted;

  let html = '<p>Window: <b>' + esc(META.windowStart) + '</b> to <b>' + esc(META.windowEnd) + '</b>. Emails outside this window were not processed.</p>';
  html += '<p style="margin-top:6px;">' + META.emailsRead + ' of ' + META.emailsInWindow + ' emails in window read · ' + META.itemsExtracted + ' items extracted.</p>';
  html += '<h4>Included Sources</h4>';
  META.includedSources.forEach(function(s) {
    html += '<div class="src-line"><span class="src-name" onclick="filterBySrc(\'' + s.name.replace(/'/g, "\\'") + '\')">' + esc(s.name) + '</span><span>' + s.count + ' item' + (s.count>1?'s':'') + '</span></div>';
  });
  html += '<h4>Skipped Sources</h4>';
  META.skippedSources.forEach(function(s) {
    html += '<div class="skip-line"><b>' + esc(s.name) + '</b> — ' + esc(s.reason) + '</div>';
  });
  document.getElementById('reportBody').innerHTML = html;
}

document.getElementById('reportHead').addEventListener('click', function() {
  document.getElementById('reportCard').classList.toggle('open');
  this.textContent = document.getElementById('reportCard').classList.contains('open') ? '📋 Session Report ▾' : '📋 Session Report ▸';
});

buildFilters();
applyPillStyles();
renderCards();
buildReport();
</script>
