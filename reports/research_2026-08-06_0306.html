const META = {
  date: "2026-08-06",
  time: "03:06 CEST",
  windowStart: "2026-08-05 21:06 CEST",
  windowEnd: "2026-08-06 03:06 CEST",
  emailsInWindow: 14,
  emailsRead: 14,
  itemsExtracted: 21,
  includedSources: [
    {name:"Daily Chartbook", count:5},
    {name:"Dark Side of the Boom", count:4},
    {name:"Bespoke Investment Group", count:2},
    {name:"The Bubble Bubble", count:2},
    {name:"The Pressure Point (Fulcrum)", count:2},
    {name:"Bankless", count:2},
    {name:"Neil Sethi — Markets Update", count:2},
    {name:"Unchained Premium / Laura Shin", count:1},
    {name:"McKinsey & Company", count:1}
  ],
  skippedSources: [
    {name:"Substack (Maggie Lake live-stream notice)", reason:"Automated live-video announcement, zero sentences of original content."},
    {name:"Substack (MacroEdge new-chat notice)", reason:"Automated 'new chat thread started' notification, zero content."}
  ]
};

let activeCat = "all";
let activeUrg = "all";
let activeSrc = null;

function esc(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}

function urgLabel(u){
  if(u==="act") return "🔴";
  if(u==="deep") return "🔵";
  return "🟡";
}
function urgFull(u){
  if(u==="act") return "🔴 Act Now";
  if(u==="deep") return "🔵 Deep";
  return "🟡 Watch";
}

function buildFilterBars(){
  const catCounts = {};
  ITEMS.forEach(function(i){ catCounts[i.cat] = (catCounts[i.cat]||0)+1; });
  const catBar = document.getElementById('catBar');
  let html = '<button class="pill" data-cat="all" onclick="setCat(\'all\')">All <span class="cnt">' + ITEMS.length + '</span></button>';
  Object.keys(catCounts).sort().forEach(function(c){
    const color = CATEGORY_COLORS[c] || "#888";
    html += '<button class="pill" data-cat="' + esc(c) + '" style="--pillcolor:' + color + '" onclick="setCat(\'' + c.replace(/'/g,"\\'") + '\')">' + esc(c) + ' <span class="cnt">' + catCounts[c] + '</span></button>';
  });
  catBar.innerHTML = html;

  const urgCounts = {act:0, deep:0, watch:0};
  ITEMS.forEach(function(i){ urgCounts[i.urgency] = (urgCounts[i.urgency]||0)+1; });
  const urgBar = document.getElementById('urgBar');
  let uhtml = '<button class="pill" data-urg="all" onclick="setUrg(\'all\')">All <span class="cnt">' + ITEMS.length + '</span></button>';
  uhtml += '<button class="pill" data-urg="act" onclick="setUrg(\'act\')">🔴 Act Now <span class="cnt">' + urgCounts.act + '</span></button>';
  uhtml += '<button class="pill" data-urg="deep" onclick="setUrg(\'deep\')">🔵 Deep <span class="cnt">' + urgCounts.deep + '</span></button>';
  uhtml += '<button class="pill" data-urg="watch" onclick="setUrg(\'watch\')">🟡 Watch <span class="cnt">' + urgCounts.watch + '</span></button>';
  urgBar.innerHTML = uhtml;
}

function setCat(c){
  activeCat = c;
  activeSrc = null;
  refreshPills();
  renderCards(true);
}
function setUrg(u){
  activeUrg = u;
  activeSrc = null;
  refreshPills();
  renderCards(true);
}
function filterBySrc(name){
  activeCat = "all";
  activeUrg = "all";
  activeSrc = name;
  refreshPills();
  renderCards(false, true);
}

function refreshPills(){
  document.querySelectorAll('#catBar .pill').forEach(function(p){
    const c = p.getAttribute('data-cat');
    if(c === activeCat && !activeSrc){
      p.classList.add('active');
      p.style.background = c === 'all' ? '#333' : (CATEGORY_COLORS[c] || '#888');
    } else {
      p.classList.remove('active');
      p.style.background = 'transparent';
    }
  });
  document.querySelectorAll('#urgBar .pill').forEach(function(p){
    const u = p.getAttribute('data-urg');
    if(u === activeUrg && !activeSrc){
      p.classList.add('active');
      p.style.background = '#333';
    } else {
      p.classList.remove('active');
      p.style.background = 'transparent';
    }
  });
}

function renderCards(collapseAll, expandMatches){
  const container = document.getElementById('cards');
  let list = ITEMS;
  if(activeSrc){
    list = ITEMS.filter(function(i){ return i.source.indexOf(activeSrc) !== -1; });
  } else {
    if(activeCat !== "all") list = list.filter(function(i){ return i.cat === activeCat; });
    if(activeUrg !== "all") list = list.filter(function(i){ return i.urgency === activeUrg; });
  }

  let html = '';
  list.forEach(function(item){
    const color = CATEGORY_COLORS[item.cat] || "#888";
    const chartFlag = item.charts && (item.charts.count > 0 || item.charts.hot) ? (item.charts.hot ? '🔥' : '📊') : '';
    const openClass = expandMatches ? ' open' : '';
    html += '<div class="card' + openClass + '" id="card-' + item.id + '">';
    html += '<div class="card-header" onclick="toggleCard(' + item.id + ')">';
    html += '<span class="idx">' + String(item.id).padStart(2,'0') + '</span>';
    html += '<span class="urg">' + urgLabel(item.urgency) + '</span>';
    html += '<span class="badge" style="background:' + color + '">' + esc(item.source) + '</span>';
    html += '<span class="cattag">' + esc(item.cat) + '</span>';
    if(chartFlag) html += '<span class="flag">' + chartFlag + '</span>';
    html += '<span class="title">' + esc(item.title) + '</span>';
    html += '</div>';

    html += '<div class="card-body">';
    html += '<div class="sec-label">The Idea</div>';
    html += '<div class="idea-text">' + esc(item.idea) + '</div>';
    html += '<div class="sec-label">My Angle</div>';
    html += '<div class="angle-box" style="border-left-color:' + color + ';">' + esc(item.angle) + '</div>';
    html += '<div class="tweets">';
    html += '<div class="tweet"><div class="tweet-label a">TWEET A</div><div class="tweet-text">' + esc(item.tweetA) + '</div><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button></div>';
    html += '<div class="tweet"><div class="tweet-label b">TWEET B</div><div class="tweet-text">' + esc(item.tweetB) + '</div><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div>';
    html += '</div>';

    if(item.charts && (item.charts.count > 0 || item.charts.desc)){
      html += '<div class="charts-row">Charts: ' + item.charts.count + (item.charts.hot ? ' — 🔥 CHART WORTH SAVING' : '');
      html += '<div class="chart-box' + (item.charts.hot ? ' hot' : '') + '">' + esc(item.charts.desc || '') + '</div></div>';
    }

    html += '<div class="link-row"><a href="' + esc(item.link) + '" target="_blank" rel="noopener">↗ Read full article</a></div>';
    html += '</div>'; // card-body
    html += '</div>'; // card
  });

  if(list.length === 0){
    html = '<p style="color:#888;font-size:14px;">No items match this filter.</p>';
  }

  container.innerHTML = html;
}

function toggleCard(id){
  const el = document.getElementById('card-' + id);
  if(el) el.classList.toggle('open');
}

function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}

function buildReport(){
  document.getElementById('metaLine').textContent =
    META.date + ' · ' + META.time + ' · ' + META.itemsExtracted + ' items from ' + META.includedSources.length + ' sources';

  let html = '<h4>Time Window</h4>';
  html += '<div>' + esc(META.windowStart) + ' → ' + esc(META.windowEnd) + '. Emails outside this window were not processed.</div>';

  html += '<h4>Emails</h4>';
  html += '<div>' + META.emailsInWindow + ' emails in window · ' + META.emailsRead + ' read · ' + META.itemsExtracted + ' items extracted.</div>';

  html += '<h4>Included Sources</h4>';
  META.includedSources.forEach(function(s){
    html += '<div><span class="src-link" onclick="filterBySrc(\'' + s.name.replace(/'/g,"\\'") + '\')">' + esc(s.name) + '</span> — ' + s.count + ' item' + (s.count===1?'':'s') + '</div>';
  });

  html += '<h4>Skipped Sources</h4>';
  META.skippedSources.forEach(function(s){
    html += '<div>' + esc(s.name) + ' — ' + esc(s.reason) + '</div>';
  });

  document.getElementById('reportBody').innerHTML = html;
}

buildFilterBars();
refreshPills();
renderCards();
buildReport();
</script>
