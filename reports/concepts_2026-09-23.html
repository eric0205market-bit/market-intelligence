"Denmark", "China"], "conviction": "medium", "so_what": "Watch Nordic export volumes and China-related trade competition (e.g. a Europe-centered 'China shock') as an early-warning proxy for stress in these export-dependent economies.", "quote": null, "locator": "Geopolitical fragmentation, trade wars and Chinese competition should therefore leave them unusually exposed", "quote_verified": false}, {"claim": "The Nordic economies' recent growth weakness could be read as another expression of Germany's broader industrial malaise, though the author frames this as an open question rather than a settled conclusion.", "speaker": "Gavekal Research", "type": "thesis", "entities": ["Sweden", "Finland", "Denmark", "Germany"], "conviction": "exploratory", "so_what": "If confirmed, this framing would extend the 'German industrial malaise' investment narrative to Nordic equities and currencies, widening the set of markets exposed to the same deglobalization trade.", "quote": "the Nordics might seem another expression of Germany’s industrial malaise", "locator": "with four-year growth averaging just 1% in Sweden", "quote_verified": true}]}, {"theme": "Mixed near-term Nordic growth signals", "insights": [{"claim": "Following the struggles that began in 2022, Sweden's economy is now recovering, with domestic demand rebounding and manufacturing proving surprisingly resilient.", "speaker": "Gavekal Research", "type": "data_point", "entities": ["Sweden"], "conviction": "medium", "so_what": "A resilient Swedish manufacturing sector alongside recovering domestic demand is a tentative bullish signal for Swedish domestic-facing assets, contingent on whether deglobalization risks derail the export side.", "quote": null, "locator": "As Sweden moves on from its recent election", "quote_verified": false}, {"claim": "Over the trailing four years, Sweden's economy has grown at an average rate of just 1%, Finland's economy has stagnated, and Denmark's headline growth has been flattered by the boom of a single pharmaceutical company rather than broad-based strength.", "speaker": "Gavekal Research", "type": "data_point", "entities": ["Sweden", "Finland", "Denmark"], "conviction": "high", "so_what": "Denmark's GDP figures should be discounted for concentration risk in one pharma name, while Sweden and Finland's weak multi-year growth trends warrant closer scrutiny of underlying drivers before betting on a durable recovery.", "quote": "four-year growth averaging just 1% in Sweden, stagnating in Finland and flattered by a single pharmaceutical company’s boom in Denmark", "locator": "with four-year growth averaging just 1% in Sweden", "quote_verified": true}]}], "insight_total": 5, "top_entities": ["Sweden", "Finland", "Denmark", "Germany", "Norway", "China"], "source_meta": {"author": "", "word_count": 187, "paywalled": false}}, {"record_id": "3f3f85498cf4f7d8", "source_type": "concepts", "source_name": "Gavekal Research", "source_url": "https://research.gavekal.com/teaser/a-reluctant-rise-in-ev-prices/", "title": "A Reluctant Rise In EV Prices", "published_date": "2026-09-22", "language": "en", "processed_at": "2026-09-23T00:00:00Z", "processor": "claude-code-sub-opus", "tags": ["Macro", "Tech"], "gist": "This is a short teaser/abstract (the full report is paywalled): China's roughly three-year EV price war has paused, with average EV prices rising back to mid-2024 levels, but Gavekal's Ernan Cui argues this reflects rising costs rather than reduced competition, so producer profits aren't actually improving even as the pricing relief risks further denting already-softening EV demand.", "themes": [{"theme": "China's EV price war pauses, but for the wrong reason", "insights": [{"claim": "After nearly three years of steady price declines, all major Chinese EV automakers raised prices in the months leading up to August 2026.", "speaker": "Gavekal Research", "type": "data_point", "entities": ["China", "EV"], "conviction": "high", "so_what": "A multi-year deflationary price war in China's EV sector appears to be pausing, which could ease margin pressure across the value chain if it persists.", "quote": "After nearly three years of steady declines in prices, all major automakers have raised prices in recent months.", "locator": "Is China's legendary price war in electric vehicles finally over?", "quote_verified": true}, {"claim": "The average price of EVs sold in China in August 2026 was around RMB178,000, up from around RMB168,000 a year earlier and roughly back to mid-2024 levels.", "speaker": "Gavekal Research", "type": "data_point", "entities": ["China", "EV"], "conviction": "high", "so_what": "Concrete price levels to track: a ~6% YoY rise erases roughly a year and a half of price declines, a useful benchmark for monitoring whether the trend continues.", "quote": "The average price of EVs sold in August was around RMB178,000, up from around RMB168,000 a year ago and roughly back to where it was in the middle of 2024.", "locator": "The average price of EVs sold in August was around RMB178,000", "quote_verified": true}, {"claim": "Rising EV prices in China are being driven by higher production costs rather than by reduced competition among automakers, so they are not translating into more sustainable profits for EV makers even though this is superficially what Beijing's crackdown on 'involutionary' competition was meant to achieve.", "speaker": "Gavekal Research", "type": "contrarian", "entities": ["China", "EV"], "conviction": "high", "so_what": "Don't read higher EV prices as a margin-recovery signal for Chinese automakers; the profitability thesis behind the price-war-ending narrative looks weaker than it appears on the surface.", "quote": "today's higher prices are not translating into more sustainable profits for EV makers, because they are the result of higher costs rather than reduced competition", "locator": "On the surface, that's exactly what the government has been trying to achieve", "quote_verified": true}, {"claim": "Higher EV prices in China risk becoming a further headwind for vehicle sales at a time when households are already cutting back on EV purchases.", "speaker": "Gavekal Research", "type": "prediction", "entities": ["China", "EV"], "conviction": "medium", "so_what": "Watch Chinese EV volume data for confirmation; a demand slowdown compounded by price increases could pressure both automaker revenues and the broader battery/supply-chain ecosystem.", "quote": "higher prices risk turning into another headwind for sales at a time when households are already reducing purchases of EVs", "locator": "More worryingly, higher prices risk turning into another headwind", "quote_verified": true}, {"claim": "China's EV price war began in early 2023 when Tesla and BYD cut prices sharply to capture market share amid the post-Covid reopening, prompting other automakers to follow; falling battery prices and production-technology gains sustained years of intense feature-for-price competition that squeezed producer margins without triggering industry consolidation.", "speaker": "Gavekal Research", "type": "causal", "entities": ["China", "Tesla", "BYD", "EV"], "conviction": "high", "so_what": "Explains the mechanism behind the price war's persistence: cheap batteries and tech gains let weak-margin players keep competing rather than exit, so any resumption of cost deflation could restart price cuts without the shakeout investors might expect.", "quote": "The falling prices squeezed margins for producers but did not trigger significant consolidation in the industry.", "locator": "EV prices started falling in early 2023, when market leaders Tesla and BYD", "quote_verified": true}]}], "insight_total": 5, "top_entities": ["China", "EV", "Tesla", "BYD", "Gavekal Dragonomics"], "source_meta": {"author": "", "word_count": 244, "paywalled": false}}, {"record_id": "77db4ec45f64d014", "source_type": "concepts", "source_name": "NY Fed — Liberty Street Economics", "source_url": "https://libertystreeteconomics.newyorkfed.org/2026/09/treasury-trading-at-the-close/", "title": "Treasury Trading at the Close - Liberty Street Economics", "published_date": "2026-09-22", "language": "en", "processed_at": "2026-09-23T11:17:54Z", "processor": "claude-code-sub-opus", "tags": ["Macro", "Positioning"], "gist": "New York Fed researchers show that U.S. Treasury trading is increasingly concentrated around fixed-income index 'strike' pricing times, and that when Bloomberg Barclays moved its strike time from 3 p.m. to 4 p.m. ET in January 2021, Treasury market activity abruptly and durably relocated to the new time, especially on month-end index-rebalancing days.", "themes": [{"theme": "Month-End Volume Concentration", "insights": [{"claim": "Overall U.S. Treasury security trading volume is about 58 percent higher on the last trading day of the month than on other days.", "speaker": "Henry Dyer", "type": "data_point", "entities": ["U.S. Treasury market"], "conviction": "high", "so_what": "Month-end is a structurally predictable high-volume, high-liquidity window in Treasuries that large traders and index-tracking funds can plan around for execution.", "quote": "overall Treasury security trading volume is about 58 percent higher on the last trading day of the month than on other days", "locator": "End-of-Month Trading, Index Rebalancing, and Index Strike Times", "quote_verified": true}, {"claim": "The authors conjecture that the sharply increased concentration of Treasury trading on month-end days over the past decade reflects the growth of assets managed relative to fixed-income indexes, most of which are rebalanced at month-end.", "speaker": "Henry Dyer", "type": "causal", "entities": ["fixed-income indexes", "index rebalancing"], "conviction": "medium", "so_what": "As passive and index-benchmarked fixed-income AUM keeps growing, month-end Treasury volume concentration and the associated liquidity dynamics should keep intensifying.", "quote": null, "locator": "End-of-Month Trading, Index Rebalancing, and Index Strike Times", "quote_verified": false}, {"claim": "On the last trading day of the month in 2025, the half-hour window from 3:45 to 4:15 p.m. ET accounts for more than one quarter of that day's total Treasury trading activity on average, with roughly half of that volume packed into just the five minutes from 3:55 to 4:00 p.m.", "speaker": "Henry Dyer", "type": "data_point", "entities": ["U.S. Treasury market", "on-the-run Treasury notes and bonds"], "conviction": "high", "so_what": "A single five-minute window (3:55-4:00 p.m. on month-end days) now absorbs an outsized share of daily Treasury liquidity, raising execution-timing risk and opportunity for traders who must transact near the close on those days.", "quote": "The half-hour interval between 3:45 and 4:15 p.m. thus accounts for more than one quarter of total daily activity on month-end days in 2025, on average, with about half of that between 3:55 and 4:00 p.m. alone.", "locator": "Effects Are Changing the Intraday Pattern of Activity", "quote_verified": true}, {"claim": "On month-end days, the share of Treasury trading volume clustered in the ten minutes around the 4 p.m. strike rose from an average of 11.6 percent in 2021 to 20.4 percent in 2025, meaning roughly one-fifth of a month-end day's entire volume now trades in that single ten-minute window.", "speaker": "Henry Dyer", "type": "data_point", "entities": ["U.S. Treasury market"], "conviction": "high", "so_what": "This concentration level implies material price-impact and slippage risk clustered at a known, recurring instant each month, which could be a source of anomalous volatility or an exploitable liquidity pocket.", "quote": null, "locator": "Effects More Pronounced on the Last Day of the Month", "quote_verified": false}]}, {"theme": "The 2021 Bloomberg Strike-Time Shift", "insights": [{"claim": "On January 14, 2021, Bloomberg Barclays (now called Bloomberg Fixed Income Indices), one of the largest providers of fixed-income indexes, changed the official pricing 'strike' time for its U.S. dollar-denominated indexes from 3 p.m. to 4 p.m. ET.", "speaker": "Henry Dyer", "type": "data_point", "entities": ["Bloomberg Barclays", "Bloomberg Fixed Income Indices"], "conviction": "high", "so_what": "A benchmark administrator's unilateral pricing-convention decision, not an exchange rule, is what actually times a large share of Treasury market activity — a market-structure lever outside issuer or regulator control worth tracking for other asset-class index providers.", "quote": null, "locator": "End-of-Month Trading, Index Rebalancing, and Index Strike Times", "quote_verified": false}, {"claim": "Reports suggest Bloomberg's rationale for moving its index strike time to 4 p.m. was to reduce tracking error for funds that are required to price their portfolios using 4 p.m. prices, such as mutual funds calculating net asset value.", "speaker": "Henry Dyer", "type": "causal", "entities": ["Bloomberg Barclays", "mutual funds"], "conviction": "medium", "so_what": "Fund tracking-error incentives can trigger changes to benchmark mechanics that then reshape market-wide trading patterns, a second-order channel investors don't typically monitor.", "quote": "Some reports suggest that one reason for the change was to reduce tracking error for funds that are required to price portfolios using 4 p.m. prices.", "locator": "End-of-Month Trading, Index Rebalancing, and Index Strike Times", "quote_verified": true}, {"claim": "The authors conclude that index pricing conventions materially shape when U.S. Treasury trading occurs during the day.", "speaker": "Henry Dyer", "type": "thesis", "entities": ["U.S. Treasury market", "fixed-income indexes"], "conviction": "high", "so_what": "Traders, risk managers, and market-structure regulators should treat benchmark strike-time conventions as a primary driver of intraday Treasury liquidity timing, not a footnote.", "quote": "These results provide strong evidence that index pricing conventions materially shape when Treasury trading occurs.", "locator": "Summing Up", "quote_verified": true}, {"claim": "Before 2021, 3 p.m. was the Treasury market's de facto closing convention partly because open-outcry trading in Treasury futures ended at 3 p.m. and because it gave a lead time before mutual funds' 4 p.m. net asset value production.", "speaker": "Henry Dyer", "type": "framework", "entities": ["Treasury futures", "mutual funds"], "conviction": "medium", "so_what": "Legacy market-close conventions rooted in now-defunct trading mechanics (open-outcry futures) can persist for years before being displaced by a benchmark provider's operational decision.", "quote": null, "locator": "End-of-Month Trading, Index Rebalancing, and Index Strike Times", "quote_verified": false}]}, {"theme": "Intraday Trading Pattern Data", "insights": [{"claim": "Across all trading days, the share of daily Treasury volume in the ten minutes around 3 p.m. rose from an average of 2.3 percent in 2016 to 3.4 percent in 2020; after Bloomberg's strike-time change, the share around 4 p.m. instead rose from an average of 2.5 percent in 2021 to 3.5 percent in 2025.", "speaker": "Henry Dyer", "type": "data_point", "entities": ["U.S. Treasury market"], "conviction": "high", "so_what": "The magnitude of the pre/post shift confirms the strike-time change caused a durable, multi-year reallocation of trading activity rather than a temporary blip.", "quote": null, "locator": "Trading Increasingly Concentrates at the Close", "quote_verified": false}, {"claim": "In 2016, intraday Treasury trading volume spiked at the 8:30 a.m. and 10 a.m. release times of macroeconomic announcements, around 1 p.m. when auction results were released, and around the 3 p.m. strike; by 2025 the 4 p.m. spike is far more pronounced and volume shares are higher across essentially the entire 3:10 p.m. to 5:05 p.m. window.", "speaker": "Henry Dyer", "type": "data_point", "entities": ["U.S. Treasury market"], "conviction": "high", "so_what": "Anyone modeling Treasury intraday liquidity or volatility patterns from older (pre-2021) data would be using a stale timing map; the late-afternoon window has become structurally more important.", "quote": null, "locator": "Effects Are Changing the Intraday Pattern of Activity", "quote_verified": false}, {"claim": "Because the U.S. Treasury market is over-the-counter with no exchange-mandated closing time, index providers have sole discretion over what time of day to set closing prices, unlike in the equity market where an exchange fixes the close.", "speaker": "Henry Dyer", "type": "framework", "entities": ["U.S. Treasury market", "index providers"], "conviction": "high", "so_what": "This discretionary close is a structural difference from equities that makes Treasury market timing dynamics vulnerable to being reset by a single administrator's decision, as happened in 2021.", "quote": null, "locator": "End-of-Month Trading, Index Rebalancing, and Index Strike Times", "quote_verified": false}]}, {"theme": "Market Structure Implications", "insights": [{"claim": "The growing, predictable concentration of Treasury trading in narrow windows around index strike times, especially at month-end, creates a recurring, forecastable liquidity event that market participants needing to transact near the close can anticipate and plan execution around.", "speaker": "Henry Dyer", "type": "framework", "entities": ["U.S. Treasury market", "index rebalancing"], "conviction": "medium", "so_what": "Execution desks and liquidity providers can position ahead of the month-end 3:55-4:00 p.m. window, where price impact and volume are both unusually elevated.", "quote": null, "locator": "Summing Up", "quote_verified": false}, {"claim": "Because a single major index provider's strike-time change in 2021 durably 're-timed' a large share of Treasury market activity, a similar decision by another major fixed-income index provider in the future could again abruptly reshape when Treasury liquidity concentrates during the day.", "speaker": "Henry Dyer", "type": "prediction", "entities": ["fixed-income indexes", "index providers"], "conviction": "low", "so_what": "Market-structure watchers should monitor announcements of index strike-time changes from major benchmark providers as a potential catalyst for shifts in intraday Treasury liquidity and volatility timing.", "quote": null, "locator": "Summing Up", "quote_verified": false}]}], "insight_total": 13, "top_entities": ["U.S. Treasury market", "Bloomberg Barclays", "Bloomberg Fixed Income Indices", "BrokerTec", "Federal Reserve Bank of New York", "Treasury futures", "mutual funds", "fixed-income indexes", "on-the-run Treasury notes and bonds", "index rebalancing"], "source_meta": {"author": "Henry Dyer", "word_count": 1863, "paywalled": false}}, {"record_id": "5da408d39b17c1b0", "source_type": "concepts", "source_name": "Oxford Economics", "source_url": "https://www.oxfordeconomics.com/webinar/introduction-to-multi-asset-strategy-asset-allocation-in-5-bond-yield-world/", "title": "Asset Allocation in a new regime for bond yields", "published_date": "2026-09-22", "language": "en", "processed_at": "2026-09-23T11:18:05Z", "processor": "claude-code-sub-opus", "tags": ["Macro", "Positioning", "AI"], "gist": "Ahead of a multi-asset strategy webinar led by Javier Corominas, the promotional text previews the strategist's live positioning: overweight global equities (especially the US) on broadening EPS momentum, a live debate on rotating Japan into Europe, and open questions on whether 5% US 10y yields are durable and whether EM local bonds now beat traditional bonds as portfolio ballast.", "themes": [{"theme": "Equity overweight thesis into year-end", "insights": [{"claim": "Heading into year-end 2026, record EPS momentum broadening across Europe and emerging markets is cited as the basis for staying overweight global equities, with a further overweight to US equities within that allocation.", "speaker": "Oxford Economics", "type": "thesis", "entities": ["US equities", "Europe", "Emerging markets", "Global equities"], "conviction": "high", "so_what": "A broadening (not just US-led) EPS momentum picture is the stated trigger for staying long risk assets going into year end; investors can watch European and EM earnings revisions as a confirming or disconfirming signal.", "quote": "Going into year end, with record EPS momentum broadening across Europe and EM, we stay overweight global equities — and within that, overweight the US.", "locator": "Going into year end, with record EPS momentum", "quote_verified": true}, {"claim": "Financial conditions are judged not yet restrictive because the hurdle rate needed to slow AI-related capital expenditure sits well above prevailing interest rates, implying current rate levels are unlikely to choke off AI capex growth.", "speaker": "Oxford Economics", "type": "causal", "entities": ["AI capex", "interest rates", "financial conditions"], "conviction": "medium", "so_what": "If the rate level needed to actually deter AI capital spending is well above today's rates, the AI infrastructure investment cycle — and equities levered to it — can keep running even as rates stay elevated, reducing near-term downside risk from a higher-for-longer rate backdrop.", "quote": "Financial conditions are not yet restrictive, and the hurdle rate needed to arrest AI capex sits well above prevailing interest rates.", "locator": "Financial conditions are not yet restrictive", "quote_verified": true}, {"claim": "Whether to rotate out of expensive Japanese equities into European equities, where earnings momentum is improving, is being actively weighed as a potential portfolio shift beyond the core US overweight.", "speaker": "Oxford Economics", "type": "contrarian", "entities": ["Japan equities", "Europe equities"], "conviction": "exploratory", "so_what": "Investors overweight Japan on valuation-agnostic momentum should watch for confirmation of improving European earnings as a signal to rotate exposure toward Europe instead.", "quote": "we ask whether it is time to rotate out of expensive Japanese equities into Europe, where earnings momentum is improving", "locator": "Beyond the US, we ask whether", "quote_verified": true}]}, {"theme": "New bond-yield regime and portfolio ballast", "insights": [{"claim": "Whether US 10-year Treasury yields at 5% are durable, rather than a transient spike, is posed as an open and central question for the current bond-yield regime.", "speaker": "Oxford Economics", "type": "prediction", "entities": ["US 10-year Treasury yields"], "conviction": "exploratory", "so_what": "If 5% proves to be a durable floor rather than a peak, duration exposure, equity valuation multiples, and cross-asset hedging strategies all need repricing around a structurally higher long-end yield.", "quote": "are US 10y yields at 5% durable?", "locator": "And, are US 10y yields", "quote_verified": true}, {"claim": "In an environment of positive stock-bond correlations and waning structural demand for developed-market government bonds, emerging-market local-currency bonds are floated as potentially better portfolio ballast than traditional government bonds.", "speaker": "Oxford Economics", "type": "framework", "entities": ["EM local bonds", "stock-bond correlation", "developed-market government bonds"], "conviction": "exploratory", "so_what": "This challenges the standard 60/40 assumption that government bonds reliably hedge equity risk; if stock-bond correlations stay positive, investors may need to shift diversifying fixed-income allocations toward EM local debt instead of DM duration.", "quote": "In a world of positive stock-bond correlations and waning structural demand, are EM local bonds the better portfolio ballast?", "locator": "In a world of positive stock-bond", "quote_verified": true}]}, {"theme": "Multi-asset strategy methodology", "insights": [{"claim": "The multi-asset the soft, relationship-based information SME lending relies on.", "themes": [{"theme": "AI adoption race across bank sizes", "insights": [{"claim": "The share of AI-related job postings in the U.S. banking sector rose from under 0.94% in 2015 to 6.80% by the end of 2025, a far faster increase than in the broader finance, insurance, and real estate (FIRE) sector (3.20%) or the whole economy (2.69%).", "speaker": "Greeshma Avaradi", "type": "data_point", "entities": ["Commercial banks", "FIRE sector", "Lightcast"], "conviction": "high", "so_what": "Banks are the clearest bellwether for how AI adoption is reshaping a knowledge-intensive industry ahead of the rest of the economy.", "quote": "the share of AI job postings in the banking industry surged to 6.80% by the end of 2025, up from less than 0.94% in 2015", "locator": "Figure 1 AI adoption in banking and in other selected sectors", "quote_verified": true}, {"claim": "By the end of 2025, large banks (assets over $100 billion) had an 8.86% share of AI-related job postings versus 4.48% for medium-sized banks and only 1.15% for small banks (assets under $10 billion), and 84% of small banks in the sample had never posted an AI-related job.", "speaker": "Greeshma Avaradi", "type": "data_point", "entities": ["Small banks", "Medium-sized banks", "Large banks"], "conviction": "high", "so_what": "AI capability is concentrating scale advantages further at large banks, widening the competitive gap with community and regional lenders.", "quote": "the share of AI-related job postings by small banks was only 1.15%, far below those for medium-sized banks (4.48%) and for large banks (8.86 %)", "locator": "Figure 2 AI adoption shares by bank size", "quote_verified": true}, {"claim": "Small and medium-sized banks lag in AI adoption because they face financing constraints for AI investment, difficulty attracting AI-skilled workers, limited access to the data needed to train or deploy AI, and reliance on older computing infrastructure poorly suited to AI applications.", "speaker": "Greeshma Avaradi", "type": "causal", "entities": ["Small banks", "Medium-sized banks"], "conviction": "medium", "so_what": "These structural barriers are unlikely to close quickly, implying the AI-driven divergence between large and small banks could persist for years absent third-party AI tools leveling the field.", "quote": null, "locator": "Small and medium-sized banks face greater hurdles", "quote_verified": false}]}, {"theme": "Hard information versus soft information", "insights": [{"claim": "Current AI and information technologies are primarily effective at processing 'hard information' such as credit scores, financial statements, and formal credit histories, but are much less capable of processing 'soft information' such as personal relationships and local market knowledge.", "speaker": "Greeshma Avaradi", "type": "framework", "entities": ["Artificial Intelligence (AI)"], "conviction": "high", "so_what": "This hard-versus-soft information distinction is the core mechanism explaining why AI benefits large-borrower lending more than relationship-based lending, and is a lens investors can apply to other AI-adoption stories in services industries.", "quote": null, "locator": "Studies suggest that AI and other information technologies primarily help", "quote_verified": false}, {"claim": "Because small and medium enterprise (SME) lending relies heavily on soft information like borrower relationships and knowledge of local economic conditions, AI adoption tends to tilt bank lending activity away from SMEs and toward borrowers with more readily digitized hard data.", "speaker": "Greeshma Avaradi", "type": "causal", "entities": ["Small and medium enterprises (SMEs)"], "conviction": "medium", "so_what": "As AI adoption spreads, SMEs may face a structurally shrinking pool of bank credit unless GenAI closes the soft-information gap or alternative lenders step in.", "quote": "Because soft information is harder to process using currently available AI tools, AI adoption might tilt bank lending away from SMEs.", "locator": "Studies suggest that AI and other information technologies primarily help", "quote_verified": true}]}, {"theme": "AI-driven risk-taking: higher returns, more problem loans", "insights": [{"claim": "By enabling banks to more easily manage complex loans, AI adoption encourages banks to take on more risk in lending, which requires higher risk compensation and should raise average bank returns on assets.", "speaker": "Greeshma Avaradi", "type": "thesis", "entities": ["Artificial Intelligence (AI)", "Return on assets (ROA)"], "conviction": "medium", "so_what": "AI adoption is a plausible driver of bank profitability dispersion, useful for evaluating why AI-forward banks report stronger margins.", "quote": null, "locator": "By enhancing how banks gather and process information", "quote_verified": false}, {"claim": "Banks with above-average shares of AI-related job postings ('high-AI' banks) had an average return on assets about 0.38 percentage point higher than 'low-AI' banks between 2021 and 2025, and among large banks specifically the ROA gap widened to 0.61 percentage point.", "speaker": "Greeshma Avaradi", "type": "data_point", "entities": ["Return on assets (ROA)", "Large banks"], "conviction": "high", "so_what": "A quantifiable profitability premium (38-61 bps of ROA) tied to AI intensity gives investors a concrete metric to screen bank stocks on AI adoption proxies like hiring data.", "quote": "The average ROA for high-AI banks is about 0.38 percentage point higher than for low-AI banks.", "locator": "Figure 3 AI adoption impact on ROA, problem loan shares", "quote_verified": true}, {"claim": "High-AI banks also carry higher average shares of problem loans (those rated substandard or with doubtful repayment) than low-AI banks, though the gap is smaller than the ROA gap, consistent with AI-enabled banks taking on riskier, more complex loans in exchange for higher returns.", "speaker": "Greeshma Avaradi", "type": "causal", "entities": ["Problem loans", "Return on assets (ROA)"], "conviction": "medium", "so_what": "The AI profitability premium comes bundled with credit-quality risk, so investors should weight AI-intensive banks' higher ROA against latent asset-quality risk in a downturn.", "quote": null, "locator": "Figure 3 shows that increased AI adoption is associated with higher average ROA", "quote_verified": false}, {"claim": "The authors caution that the AI-ROA and AI-problem-loan correlations are not necessarily causal, because banks that already hold more complex, risky loan portfolios may have greater incentive to invest in AI to manage those loans, creating reverse causality.", "speaker": "Greeshma Avaradi", "type": "contrarian", "entities": ["Artificial Intelligence (AI)"], "conviction": "low", "so_what": "Investors should treat the AI-adoption-to-profitability link as a correlation to monitor, not a proven causal driver to bet on directly.", "quote": "we cannot make causal claims here, as banks with greater shares of complex loans in their portfolios would also have more incentives to invest in AI technology", "locator": "This Economic Letter examines how AI adoption might affect bank lending", "quote_verified": true}]}, {"theme": "SME credit squeeze from AI adoption", "insights": [{"claim": "In the full sample, high-AI banks directed only about 12% of their loans to small and medium enterprises (SMEs), versus 21% for low-AI banks, and this pattern held across small, medium, and large bank size groups.", "speaker": "Greeshma Avaradi", "type": "data_point", "entities": ["Small and medium enterprises (SMEs)"], "conviction": "high", "so_what": "A roughly 9-point gap in SME loan share tied to AI intensity signals a measurable credit-access risk for small business borrowers as bank AI adoption scales up.", "quote": "high-AI banks have a much smaller average share of SME loans than low-AI banks (12% versus 21%)", "locator": "Figure 4 Higher use of AI associated with reduced SME lending", "quote_verified": true}, {"claim": "The gap in SME loan shares between high-AI and low-AI banks is largest among small banks (13.3% versus 21.4%), narrower among medium-sized banks (3.8% versus 7.8%), and smallest among large banks (2.2% versus 3.3%).", "speaker": "Greeshma Avaradi", "type": "data_point", "entities": ["Small banks", "Medium-sized banks", "Large banks", "Small and medium enterprises (SMEs)"], "conviction": "high", "so_what": "The SME lending pullback from AI adoption is most acute exactly where SMEs have traditionally relied most on their banking relationship (small community banks), suggesting the least AI-flexible lenders may be squeezed hardest if forced to compete on AI capability.", "quote": null, "locator": "The difference in the shares of SME loans between high-AI and low-AI banks is most pronounced", "quote_verified": false}, {"claim": "The authors predict that continued growth in bank AI adoption could create more difficulties for SME financing going forward, though they caveat that it is premature to know how AI capabilities will develop and whether AI's current advantage in processing hard information over soft information will persist.", "speaker": "Greeshma Avaradi", "type": "prediction", "entities": ["Small and medium enterprises (SMEs)", "Artificial Intelligence (AI)"], "conviction": "exploratory", "so_what": "A structurally tightening SME credit market is a watch item for small-business lenders, fintech alternative lenders, and policymakers, but the authors' own hedging means it should not be treated as a settled forecast.", "quote": "This may suggest more difficulties for SME financing going forward as AI adoption continues to grow.", "locator": "Our results therefore suggest that increased AI usage by banks", "quote_verified": true}, {"claim": "Generative AI (GenAI) might eventually help banks process soft information as well as hard information, which could narrow or reverse the current AI-driven SME lending gap.", "speaker": "Greeshma Avaradi", "type": "thesis", "entities": ["Generative AI (GenAI)", "Small and medium enterprises (SMEs)"], "conviction": "exploratory", "so_what": "A future GenAI breakthrough in processing relationship and qualitative data would be a bullish catalyst for SME credit access and for banks currently disadvantaged in hard-data-driven AI lending models.", "quote": "GenAI might eventually assist banks in processing soft data, which could bridge the information gap for SME lending.", "locator": "However, the potential impact of AI adoption on SME lending", "quote_verified": true}]}, {"theme": "Measurement approach and its limits", "insights": [{"claim": "Because bank-level AI adoption data is not publicly available, the researchers proxy AI usage intensity using the share of a bank's online job postings requiring AI or generative-AI skills, drawn from Lightcast data and FFIEC Call Report filings, covering 1,006 banks representing over 87% of total U.S. banking system assets.", "speaker": "Greeshma Avaradi", "type": "framework", "entities": ["Lightcast", "FFIEC Call Report"], "conviction": "high", "so_what": "Investors and researchers can replicate or extend this hiring-based AI-adoption proxy methodology to track AI intensity in other industries where direct adoption data is unavailable.", "quote": null, "locator": "Since bank-level AI adoption information is not publicly available", "quote_verified": false}, {"claim": "The job-postings-based AI adoption measure likely overstates the true disparity in AI usage between small and large banks, because small banks lacking in-house resources may instead access AI through third-party vendors, which would not show up as AI-related hiring.", "speaker": "Greeshma Avaradi", "type": "contrarian", "entities": ["Small banks"], "conviction": "medium", "so_what": "The true AI capability gap between small and large banks may be narrower than the headline hiring data suggests, tempering conclusions about how disadvantaged small banks really are.", "quote": "Thus, our measure may overstate the disparities in AI adoption by bank size.", "locator": "One caveat of our measure of AI adoption based on online job postings", "quote_verified": true}]}, {"theme": "Banks as an early signal for AI's economy-wide impact", "insights": [{"claim": "Because commercial banks are among the earliest and most intensive adopters of AI across all sectors of the economy, their observed lending pattern changes may offer an early preview of how AI adoption will affect information processing, risk-taking, and access to credit as AI spreads to other business sectors.", "speaker": "Greeshma Avaradi", "type": "thesis", "entities": ["Commercial banks", "Artificial Intelligence (AI)"], "conviction": "medium", "so_what": "Investors tracking AI's broader economic impact should treat bank lending data as a leading indicator rather than a banking-sector-only story.", "quote": "to the extent that commercial banks are industry leaders in AI adoption, their experiences may shed some light on the broader economic impacts of AI as its adoption spreads to other business sectors", "locator": "Conclusion", "quote_verified": true}]}], "insight_total": 16, "top_entities": ["Commercial banks", "Artificial Intelligence (AI)", "Generative AI (GenAI)", "Small and medium enterprises (SMEs)", "Small banks", "Medium-sized banks", "Large banks", "Lightcast", "FFIEC Call Report", "Return on assets (ROA)", "Problem loans"], "source_meta": {"author": "Greeshma Avaradi", "word_count": 2112, "paywalled": false}}, {"record_id": "21cb1d15f5fe095c", "source_type": "concepts", "source_name": "World Economic Forum", "source_url": "https://www.weforum.org/podcasts/radio-davos/episodes/first-movers-coalition-2026/", "title": "How cutting emissions is future-proofing industries beyond the ‘green premium’", "published_date": "2026-09-22", "language": "en", "processed_at": "2026-09-23T11:19:03Z", "processor": "claude-code-sub-opus", "tags": ["Energy", "Society", "Macro", "Geopolitics", "Positioning"], "gist": "A Radio Davos podcast transcript (one continuous episode, not a hub page) built around three interviews from a First Movers Coalition event: LanzaTech's CEO on carbon-recycling economics, Oberon Fuels' CEO on renewable DME, and a Khosla Ventures partner on cost-driven climate investing — all converging on the idea that the 'green premium' is a temporary deployment problem, now increasingly reframed as a 'security premium' tied to supply-chain resilience and AI-era energy demand.", "themes": [{"theme": "Green premium as a bridge, not a destination", "insights": [{"claim": "The green premium is a temporary bridge that gets eliminated through deployment scale, not a permanent cost that green technologies must carry forever — as seen historically with solar, wind and cellphones.", "speaker": "Jennifer Holmgren", "type": "framework", "entities": ["LanzaTech", "solar", "wind"], "conviction": "high", "so_what": "Investors should value clean-tech bets on their cost-curve trajectory (deployment volume driving cost down) rather than assuming a permanent price gap needs subsidy forever.", "quote": "The more you build, the cheaper it gets, the cheaper it gets, the more you build.", "locator": "To get rid of a green premium, it's just a deployment story", "quote_verified": true}, {"claim": "There is effectively no green premium left for renewable electricity ('green electrons') from solar and wind because deployment drove costs to parity with fossil generation, and the same cost-curve dynamic is expected to eventually apply to 'green molecules' like ethanol and sustainable aviation fuel.", "speaker": "Jennifer Holmgren", "type": "prediction", "entities": ["LanzaTech", "solar", "wind", "sustainable aviation fuel"], "conviction": "high", "so_what": "Signals that green fuels/molecules are several deployment cycles behind renewable power on the cost curve — an early-stage window for investors betting on eventual parity.", "quote": null, "locator": "There is no real green premium for green electrons anymore, is there?", "quote_verified": false}, {"claim": "Financing green fuel plants fails when treated like electron power-purchase agreements: molecules trade on volatile spot markets, so a 10-year fixed-price offtake on a higher-cost molecule (e.g. $5,000/tonne sustainable aviation fuel versus $2,000/tonne conventional jet fuel) is too large and risky a commitment for buyers, unlike the small per-kilowatt-hour commitments that financed solar and wind.", "speaker": "Jennifer Holmgren", "type": "causal", "entities": ["sustainable aviation fuel", "LanzaTech"], "conviction": "high", "so_what": "Explains why molecule-based decarbonization (SAF, green ethanol, green hydrogen) is financing-constrained in a way electron-based renewables were not — a structural bottleneck financiers and policymakers need new instruments to solve.", "quote": "Do they really want to commit to pay $5,000 a tonne when conventional jet fuel is $2,000, a tonne?", "locator": "Why could you not get those long-term contracts now?", "quote_verified": true}, {"claim": "Financing a new green-fuel plant currently takes about five years and needs to shrink to roughly two years for the industry to build enough plants to erode the green premium.", "speaker": "Jennifer Holmgren", "type": "prediction", "entities": ["LanzaTech"], "conviction": "medium", "so_what": "Financing-cycle speed, not just technology cost, is a binding constraint on how fast green-molecule industries can scale — a metric to track for capacity build-out timing.", "quote": "we've got to stop taking five years to finance the plant. We need to take two years.", "locator": "Where do you see your industry in five years time or in 10 years time?", "quote_verified": true}, {"claim": "Corporate buyer conversations about green products have shifted from asking how a product helps decarbonize to asking what it costs, when it can be delivered, and how it scales — a sign the sustainability sector is maturing into an ordinary commercial market rather than a purely values-driven one.", "speaker": "Rebecca Boudreaux", "type": "causal", "entities": ["Oberon Fuels"], "conviction": "medium", "so_what": "A maturing buyer conversation (cost/delivery/scale over pure ESG narrative) is a leading indicator that a green-tech category is nearing commercial viability, useful for timing investment or partnership entry.", "quote": "what does it cost, when can I get it, and how does it scale?", "locator": "You do see that, and there's a shift in the conversation", "quote_verified": true}]}, {"theme": "First Movers Coalition: pooling demand in hard-to-abate sectors", "insights": [{"claim": "The First Movers Coalition, launched around 2021, works by pooling corporate offtake demand signals across seven hard-to-abate sectors — aluminium, steel, cement/concrete, shipping, trucking, aviation and carbon dioxide removal — to give investors and project developers confidence that unscaled clean technologies will have buyers by 2030.", "speaker": "Noam Boussidan", "type": "framework", "entities": ["First Movers Coalition"], "conviction": "high", "so_what": "The Coalition is effectively a demand-aggregation mechanism investors can watch as a proxy for de-risking specific hard-to-abate technology bets.", "quote": null, "locator": "The First Movers Coalition, FMC by its short name, is a collective effort", "quote_verified": false}, {"claim": "The First Movers Coalition has shifted its internal focus over five years from setting ambition and commitments to actually delivering on them, reflecting a broader maturation stage for corporate climate initiatives.", "speaker": "Noam Boussidan", "type": "thesis", "entities": ["First Movers Coalition"], "conviction": "medium", "so_what": "Investors should now judge FMC-aligned companies on delivery/execution metrics rather than pledges, since the coalition itself says the pledge phase is over.", "quote": null, "locator": "FMC Day, five years later, takes you into a place whereby those commitments were made", "quote_verified": false}, {"claim": "Despite political swings against climate action and 'green hushing' (companies quietly downplaying their green efforts publicly), First Movers Coalition leadership and its member-company representatives say the underlying corporate direction of travel toward decarbonization commitments has not reversed.", "speaker": "Noam Boussidan", "type": "contrarian", "entities": ["First Movers Coalition"], "conviction": "medium", "so_what": "Pushes back against a narrative of corporate ESG retreat — worth stress-testing against actual capex/offtake data rather than public messaging, since messaging itself is what's said to be muted.", "quote": null, "locator": "your observation that the pendulum swings is absolutely a right one", "quote_verified": false}, {"claim": "First-mover buyers like airline group IAG and utility Vattenfall have absorbed higher costs to commit to green fuel offtake, but their volume alone is insufficient to reach the scale needed, meaning 'fast follower' buyers must now join to create enough demand.", "speaker": "Jennifer Holmgren", "type": "causal", "entities": ["IAG", "Vattenfall", "First Movers Coalition"], "conviction": "medium", "so_what": "Tracking which large buyers move from pilot/first-mover deals to repeat, larger offtake commitments is a concrete signal of when a green-fuel category is inflecting toward scale.", "quote": null, "locator": "We work with IAG, and they're willing to do that", "quote_verified": false}]}, {"theme": "LanzaTech: carbon-recycling economics already work", "insights": [{"claim": "LanzaTech captures CO2 or CO industrial off-gases directly at emission sites (e.g. steel mills) and uses bacterial fermentation — completed in seconds rather than the long timescales of sugar fermentation — to convert them directly into ethanol, functioning more like a refinery than a traditional fermenter.", "speaker": "Jennifer Holmgren", "type": "framework", "entities": ["LanzaTech"], "conviction": "high", "so_what": "The speed and site-integration of the process is what makes carbon-recycling economically viable at industrial scale rather than a lab curiosity.", "quote": null, "locator": "It looks like a biorefinery connected to the steel mill", "quote_verified": false}, {"claim": "LanzaTech operates four commercial plants in China converting steel and ferroalloy off-gases into ethanol, plus a plant with ArcelorMittal in Ghent, Belgium — proof the carbon-recycling process already runs at commercial scale, not just pilot scale.", "speaker": "Jennifer Holmgren", "type": "data_point", "entities": ["LanzaTech", "ArcelorMittal", "China"], "conviction": "high", "so_what": "Concrete operating asset count/geography for tracking LanzaTech's commercial footprint and expansion into the West.", "quote": null, "locator": "we have four commercial plants operating in China", "quote_verified": false}, {"claim": "LanzaTech's China joint venture went public on the Hong Kong exchange and its plants earn 20–30% operating margins selling ethanol into the ordinary road-transport fuel market — not through carbon credits or a special green premium — demonstrating that carbon-recycled ethanol is commercially profitable on its own merits.", "speaker": "Jennifer Holmgren", "type": "data_point", "entities": ["LanzaTech"], "conviction": "high", "so_what": "A rare case of a decarbonization technology already generating strong margins without subsidy dependence — a template for what 'beyond the green premium' looks like in practice.", "quote": "they have 20 to 30% margins in their operating plants", "locator": "Our JV in China just went public on the Hong Kong exchange", "quote_verified": true}, {"claim": "LanzaTech converts its recycled ethanol into sustainable aviation fuel through LanzaJet (47% owned by LanzaTech), which operates a commercial-scale plant in Georgia, US producing 10 million gallons per year.", "speaker": "Jennifer Holmgren", "type": "data_point", "entities": ["LanzaTech", "LanzaJet"], "conviction": "high", "so_what": "A concrete capacity figure and ownership structure for anyone evaluating LanzaJet/LanzaTech's SAF supply chain economics.", "quote": null, "locator": "a large commercial plant converting ethanol to sustainable aviation fuel in Georgia at a 10 million gallon a year scale", "quote_verified": false}, {"claim": "Ethanol can substitute for methanol in marine engines while carrying about 40% more energy density, letting ships carry more cargo per voyage for the same fuel volume — a 'drop-in' fuel advantage that avoids new engine infrastructure.", "speaker": "Jennifer Holmgren", "type": "data_point", "entities": ["LanzaTech"], "conviction": "medium", "so_what": "A specific technical edge (energy density) that could tilt shipping-fuel buyer preference toward ethanol over methanol independent of any carbon argument.", "quote": "it has 40% more energy density", "locator": "Ethanol can go into marine fuel", "quote_verified": true}, {"claim": "Global fossil carbon consumption is roughly 100 million barrels a day, which is why LanzaTech deliberately built its process around a broad feedstock pool — industrial waste, gasified municipal solid waste, and agricultural/forestry waste — rather than a single input, arguing that only a similarly massive and diverse feedstock base can scale to matter.", "speaker": "Jennifer Holmgren", "type": "data_point", "entities": ["LanzaTech"], "conviction": "high", "so_what": "Feedstock diversity/scale is a screening criterion investors can use to judge whether a carbon-recycling technology can ever reach meaningful global volume.", "quote": "the world uses 100 million barrels a day of fossil carbon", "locator": "finally a technology approach that can scale the way the refining industry scaled", "quote_verified": true}, {"claim": "Feedstock-specific policy design creates barriers for new carbon-recycling technologies — LanzaTech's first industrial carbon-recycling scheme did not qualify for any existing incentive category — so Holmgren argues policy should be made technology-neutral instead.", "speaker": "Jennifer Holmgren", "type": "contrarian", "entities": ["LanzaTech"], "conviction": "high", "so_what": "A concrete policy-design flaw investors and policymakers should watch for when assessing subsidy/regulatory regimes for new decarbonization technologies.", "quote": "The first time we built our first industrial carbon recycling scheme, we didn't qualify for anything.", "locator": "you need technology-neutral standards", "quote_verified": true}, {"claim": "China's advantage in fast building and fast prototyping ('fast fail, fast build') — illustrated by its move to sodium-based batteries while the West stayed focused on lithium — is why LanzaTech's first commercial deployments launched there, and Holmgren pushes back on the idea that China only duplicates rather than innovates.", "speaker": "Jennifer Holmgren", "type": "contrarian", "entities": ["LanzaTech", "China"], "conviction": "medium", "so_what": "Challenges a common Western investor assumption (China = copying, not inventing) that could mean underpricing Chinese-originated clean-tech IP and manufacturing capability.", "quote": "I think the West has fallen into a trap of thinking that China doesn't innovate. I disagree with that.", "locator": "China builds things very, very fast and speed matters", "quote_verified": true}]}, {"theme": "Oberon Fuels: renewable DME and the HFC replacement opportunity", "insights": [{"claim": "Oberon Fuels converts waste methanol byproduct from tree pulp/paper processing, plus other organic waste streams, into renewable dimethyl ether (DME), which is sold as a propane-blend transport fuel and increasingly as an aerosol propellant.", "speaker": "Rebecca Boudreaux", "type": "framework", "entities": ["Oberon Fuels"], "conviction": "high", "so_w // ---------- helpers ----------
// YouTube-aligned hex colors for tinted insight chips (bg = color+"1a", text = color, border = color+"55").
const TYPE_HEX = {
  thesis: '#6366f1', prediction: '#0ea5e9', framework: '#8b5cf6',
  data_point: '#059669', causal: '#d97706', contrarian: '#dc2626',
  anecdote: '#64748b',
};
const CONV_HEX = { high: '#16a34a', medium: '#ca8a04', low: '#94a3b8', exploratory: '#94a3b8' };
function typeHex(t) { return TYPE_HEX[String(t || '').toLowerCase()] || '#475569'; }
function convHex(c) { return CONV_HEX[String(c || '').toLowerCase()] || '#64748b'; }

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }

// Tinted chip (YouTube style): faint bg, colored text + border.
function tintChip(text, color) {
  return `<span class="chip" style="background:${color}1a;color:${color};border-color:${color}55">${escapeHtml(text)}</span>`;
}
function tagPills(tags) {
  if (!tags || !tags.length) return '';
  return tags.map(t => `<span class="pill tag">${escapeHtml(t)}</span>`).join(' ');
}

// ---------- rendering ----------
// Insight presentation ported from the YouTube digest: type/conviction tinted
// chips, speaker as a 🗣 chip, and entities as indigo chips — all in the meta row
// directly under the claim. Quote treatment is INTENTIONALLY kept as Concepts'
// verbatim + "✓ verified" (stronger than YouTube's ≈ paraphrase wording).
function renderInsight(ins) {
  if (!ins) return '';
  const cls = 'insight' + (ins.type ? (' ' + String(ins.type).toLowerCase()) : '');
  const meta = [];
  if (ins.type) meta.push(tintChip(ins.type, typeHex(ins.type)));
  if (ins.speaker) meta.push(`<span class="chip chip-spk">🗣 ${escapeHtml(ins.speaker)}</span>`);
  if (ins.conviction) meta.push(tintChip('conviction: ' + ins.conviction, convHex(ins.conviction)));
  (ins.entities || []).slice(0, 12).forEach(e => {
    if (e) meta.push(`<span class="chip chip-ent">${escapeHtml(e)}</span>`);
  });
  let quote = '';
  if (ins.quote) {
    const v = ins.quote_verified
      ? `<span class="vmark">✓ verified</span>`
      : `<span class="vmark no">unverified</span>`;
    quote = `<div class="quote">“${escapeHtml(ins.quote)}”${v}</div>`;
  }
  const so = ins.so_what
    ? `<div class="insight-so"><span class="lbl">so what</span>${escapeHtml(ins.so_what)}</div>` : '';
  return `
    <div class="${cls}">
      <div class="insight-claim">${escapeHtml(ins.claim || '')}</div>
      <div class="insight-meta">${meta.join('')}</div>
      ${so}
      ${quote}
    </div>`;
}

function renderTheme(theme) {
  const insights = (theme.insights || []).map(renderInsight).join('');
  return `
    <div class="theme">
      <div class="theme-title">${escapeHtml(theme.theme || 'Theme')}</div>
      ${insights}
    </div>`;
}

function renderCard(card) {
  if (!card) return '';
  const meta = card.source_meta || {};
  const nameHtml = card.source_url
    ? `<a class="source-name" href="${escapeAttr(card.source_url)}" target="_blank" rel="noopener">${escapeHtml(card.source_name || '')}</a>`
    : `<span class="source-name">${escapeHtml(card.source_name || '')}</span>`;
  const subBits = [];
  if (card.published_date) subBits.push(escapeHtml(card.published_date));
  if (meta.author) subBits.push(escapeHtml(meta.author));
  if (meta.word_count) subBits.push(`${meta.word_count} words`);
  if (meta.paywalled) subBits.push('paywalled');
  const themes = (card.themes || []).map(renderTheme).join('');
  const n = card.insight_total != null ? card.insight_total
            : (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
  return `
    <div class="source">
      <div class="source-head" onclick="toggleSource(this)">
        <div class="source-meta-left">
          <div class="source-name-row">${nameHtml}</div>
          <div class="source-title">${escapeHtml(card.title || '')}</div>
          <div class="source-sub">${subBits.join('  ·  ')}</div>
        </div>
        <span class="source-count">${n} insight${n === 1 ? '' : 's'}</span>
        <span class="source-arrow">▸</span>
      </div>
      <div class="source-body">
        ${card.gist ? `<div class="gist">${escapeHtml(card.gist)}</div>` : ''}
        ${card.tags && card.tags.length ? `<div class="tags">${tagPills(card.tags)}</div>` : ''}
        ${themes || '<div class="empty">No insights.</div>'}
      </div>
    </div>`;
}

function renderTopStats(d) {
  const s = d.stats || {};
  const parts = [];
  if (d.date) parts.push(`date <strong>${escapeHtml(d.date)}</strong>`);
  if (s.lookback_days != null) parts.push(`lookback <strong>${s.lookback_days}d</strong>`);
  if (s.sources != null) parts.push(`sources <strong>${s.sources}</strong>`);
  if (s.cards != null) parts.push(`cards <strong>${s.cards}</strong>`);
  if (s.insights != null) parts.push(`insights <strong>${s.insights}</strong>`);
  if (s.quote_verified_pct != null) parts.push(`quotes verified <strong>${s.quote_verified_pct}%</strong>`);
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSource(headEl) { headEl.parentElement.classList.toggle('open'); }

function insightCount(card) {
  return (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
}

// Build the sort/filter control bar (display only — re-groups REPORT_DATA in place).
function buildControls(d) {
  const cards = d.cards || [];
  const names = [...new Set(cards.map(c => c.source_name || '—'))].sort((a, b) => a.localeCompare(b));
  const opts = names.map(n => `<option value="${escapeAttr(n)}">${escapeHtml(n)}</option>`).join('');
  document.getElementById('controls').innerHTML =
    `<label>Sort
       <select id="sortSel">
         <option value="source">Source A–Z</option>
         <option value="insights">Insight count ▼</option>
       </select></label>
     <label>Source
       <select id="srcSel">
         <option value="__all">All sources (${names.length})</option>
         ${opts}
       </select></label>
     <span class="ctl-btns">
       <button type="button" id="expandAll">Expand all</button>
       <button type="button" id="collapseAll">Collapse all</button>
     </span>`;
  document.getElementById('sortSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('srcSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('expandAll').addEventListener('click', () => setAllGroups(false));
  document.getElementById('collapseAll').addEventListener('click', () => setAllGroups(true));
}

// Group-level collapse: header click toggles one group; the control-bar buttons toggle all.
function toggleGroup(headEl) { headEl.parentElement.classList.toggle('collapsed'); }
function setAllGroups(collapsed) {
  document.querySelectorAll('.group').forEach(g => g.classList.toggle('collapsed', collapsed));
}

// Group cards by source, sort groups (and cards within), optionally filter to one source.
function renderGroups(d) {
  const sortMode = (document.getElementById('sortSel') || {}).value || 'source';
  const srcFilter = (document.getElementById('srcSel') || {}).value || '__all';
  let cards = (d.cards || []).slice();
  if (srcFilter !== '__all') cards = cards.filter(c => (c.source_name || '—') === srcFilter);

  const groups = new Map();
  cards.forEach(c => {
    const k = c.source_name || '—';
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(c);
  });
  let entries = [...groups.entries()].map(([name, cs]) => ({
    name, cards: cs, insights: cs.reduce((a, c) => a + insightCount(c), 0),
  }));
  if (sortMode === 'insights') entries.sort((a, b) => b.insights - a.insights || a.name.localeCompare(b.name));
  else entries.sort((a, b) => a.name.localeCompare(b.name));
  // Within each source group, heaviest cards first.
  entries.forEach(e => e.cards.sort((a, b) => insightCount(b) - insightCount(a)));

  const html = entries.map(e => {
    const head = `<div class="group-head" onclick="toggleGroup(this)">`
      + `<span class="group-name">${escapeHtml(e.name)}</span>`
      + `<span class="group-meta">${e.cards.length} card${e.cards.length === 1 ? '' : 's'} · ${e.insights} insights</span>`
      + `<span class="group-arrow">▾</span></div>`;
    return `<div class="group">${head}<div class="group-body">${e.cards.map(renderCard).join('')}</div></div>`;
  }).join('');

  const app = document.getElementById('app');
  app.innerHTML = html || '<div class="empty">No cards for this source.</div>';
  // Open the first two source cards by default.
  document.querySelectorAll('.source').forEach((sec, i) => { if (i < 2) sec.classList.add('open'); });
}

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  document.getElementById('stats-top').innerHTML = renderTopStats(d);
  buildControls(d);
  renderGroups(d);   // default: grouped, sorted by source A–Z
}

renderReport(REPORT_DATA);
</script>
