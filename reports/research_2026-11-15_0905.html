<script>
const ITEMS = [{"id": 1, "cat": "macro", "urgency": "deep", "source": "Stephen Innes / Dark Side Of The Boom (Six Ideas)", "title": "S&P +2% in a week when the Treasury market wouldn't fund the deficit at old prices", "idea": "Five sessions brought the Nvidia CEO exit, another inflation surprise, a more hawkish Fed and Treasury buyers who would only take paper at higher yields. The S&P 500 still closed the week up 2%. Innes says that when equities and bonds tell opposite stories, neither should be dismissed.", "angle": "Stocks are reading flows and cleaned-out positioning, while bonds are reading the fiscal and inflation path. When the two disagree, the bond market has usually been right about the next six months.", "tweetA": "S&P +2% in the same week the 10-year went from 4.86% to 5.15%. Equities are trading positioning and bonds are trading the deficit. One of them is wrong by Christmas, and I know which one has the better record. $SPY $TLT", "tweetB": "What closes the gap between a rallying equity market and a Treasury market that wants more yield to fund Washington? Either auctions clear at lower yields, or the S&P has to absorb a higher discount rate. I don't see a third way out.", "charts": {"count": 1, "hot": false, "desc": "One image in the email body; the six trade ideas sit behind the paywall. Charts inside, worth opening"}, "link": "https://thedarksideoftheboom.substack.com/p/after-a-week-of-market-mayhem-six"}, {"id": 2, "cat": "credit", "urgency": "watch", "source": "Stephen Innes / Dark Side Of The Boom (Six Ideas)", "title": "Credit is starting to tell apart owning AI infrastructure and borrowing to build it", "idea": "Innes's takeaway: the credit market now prices a difference between owners of valuable infrastructure and companies that borrow heavily to build it, and the effect reaches beyond tech stocks. He frames Nvidia's leadership change as a spotlight on the financing machinery behind the whole AI capex cycle, not just on chip sales.", "angle": "This is where AI dispersion turns up first: wider spreads for levered neocloud and data-center developer paper while hyperscaler credit holds. Watch HY tech spreads and DC ABS more than NVDA's stock price.", "tweetA": "The AI trade is splitting in credit before it splits in equity. Owning a powered, leased data center is a bond story. Borrowing at 5%+ to build one on a GPU-backed lease is an equity story pretending to be a bond. $CRWV $NBIS", "tweetB": "Everyone watches Nvidia's multiple. I'd watch the spread between hyperscaler bonds and neocloud debt. That gap is the real price of the 'Jensen put' disappearing.", "charts": {"count": 0, "hot": false, "desc": "Charts inside, worth opening"}, "link": "https://thedarksideoftheboom.substack.com/p/after-a-week-of-market-mayhem-six"}, {"id": 3, "cat": "positioning", "urgency": "deep", "source": "Stephen Innes / Dark Side Of The Boom (Six Ideas)", "title": "Goldman, UBS: positioning is clean enough for a year-end rally, but EPS growth is about to slow sharply", "idea": "Goldman Sachs, UBS and other desks argue that positioning has been cleaned out, which leaves room for a rally into year-end. At the same time, AI financing is getting harder, earnings growth is set to slow sharply, and the Fed shows little interest in rescuing overleveraged investors. Innes's trick: tell a profitable trading window apart from a problem that has only been postponed.", "angle": "Trade the window tactically but keep it short-dated: calls or call spreads into December, not a structural re-risk. The slowdown in earnings revisions is the 2027 problem.", "tweetA": "A clean-positioning rally into slowing earnings and a hiking Fed is a rent, not a purchase. I'd own December call spreads and sell them into the Anthropic IPO euphoria. $SPX", "tweetB": "The desks say two things at once: the books are clean, so buy, and earnings are about to slow sharply. Both can be true until January, when 2027 guidance lands and the second point takes over from the first.", "charts": {"count": 0, "hot": false, "desc": "Charts inside, worth opening"}, "link": "https://thedarksideoftheboom.substack.com/p/after-a-week-of-market-mayhem-six"}, {"id": 4, "cat": "macro", "urgency": "deep", "source": "BowTiedBull", "title": "Five sell forces at once: 10Y at 5%, mortgages at 7.5%, CPI at 4%", "idea": "BowTiedBull lists five forces pushing markets down together: a 10-year yield at 5%, mortgage rates that have caught up at 7.5%, an AI trade that has been 'cooked since June 28-30', CPI at 4% eroding paychecks, and double-digit-rate debt on hyperscalers and data centers. The call: we are in full correction mode.", "angle": "A 7.5% mortgage with 4% CPI means real housing finance costs of about 3.5%. That freezes housing turnover and hits Home Depot and Lowe's, which report next week.", "tweetA": "10Y at 5%, mortgages at 7.5%, CPI at 4%. That is a 3.5% real mortgage rate, the tightest housing finance since before 2008. $HD and $LOW report this week. Watch the comps, not the guidance. $XHB", "tweetB": "Most bear cases pick one villain. This one has five, and only one of them (Jensen) is idiosyncratic. The other four are rates. You can't diversify out of the discount rate.", "charts": {"count": 0, "hot": false, "desc": "Preview only, no charts in email"}, "link": "https://bowtiedbull.io/p/q4-puke-is-here-what-were-doing-quick"}, {"id": 5, "cat": "positioning", "urgency": "act", "source": "BowTiedBull", "title": "Jensen's exit plus the Binance hack: two catalysts nobody had modeled", "idea": "The author says the correction had been expected for months, but the Jensen firing and the Binance hack added two negative catalysts that could not have been predicted. Their claim is that Jensen was the 'figure head for the circular deals' and his exit makes the AI problem '10x worse'. The paid section lays out portfolio moves ('time to make some moves').", "angle": "Two unrelated tail events hit two separate risk-asset complexes in the same fortnight, and crypto and semis both held better than expected. That tells me forced sellers are mostly gone.", "tweetA": "Biggest crypto hack ever ($6.3B from Binance) plus the most important CEO in tech gone in the same month. BTC barely moved, and the S&P had an up week. When the worst news can't push prices lower, look at who is left to sell. $BTC $NVDA", "tweetB": "'Jensen was the figurehead for the circular deals.' If that's true, the bear case isn't about chips. It's about who now signs the guarantees. Watch Tuesday's call for one word: commitments. $NVDA", "charts": {"count": 0, "hot": false, "desc": "Preview only"}, "link": "https://bowtiedbull.io/p/q4-puke-is-here-what-were-doing-quick"}, {"id": 6, "cat": "positioning", "urgency": "deep", "source": "Trading Mindset & Data / TMAD Weekly", "title": "SPX levels: resistance 7,620/7,640, support 7,540/7,480, below the 100DMA", "idea": "The S&P 500 rose 2.5% on the week despite Friday's -0.4%. TMAD's trend filter has SPY in a sideways trend and QQQ still in a downtrend. The index is below a trendline and below its 100-day moving average, 'guilty until proven innocent'. Levels: resistance at 7,620/7,640, support at 7,540/7,480.", "angle": "The QQQ downtrend versus a sideways SPY shows that the equal-weight and old-economy parts of the index are carrying it. That matches the MacroEdge '73 Five' rotation thesis.", "tweetA": "SPY sideways, QQQ in a downtrend, 7,620 overhead. A bounce in the index while the Nasdaq stays below trend is rotation, not recovery. Watch $RSP vs $QQQ before calling a bottom.", "tweetB": "Only 80 points separate 7,540 support from 7,620 resistance, about 1%. With NVDA earnings, the Anthropic IPO and Fed minutes in one week, that range breaks by Friday. I'd rather own the straddle than pick the side. $SPX", "charts": {"count": 2, "hot": false, "desc": "Two charts: SPX with trendline and 100DMA, and a dollar/10Y yield chart"}, "link": "https://www.tmad.news/p/tmad-weekly-a-bounce-is-not-the-same"}, {"id": 7, "cat": "macro", "urgency": "deep", "source": "Trading Mindset & Data / TMAD Weekly", "title": "10Y 4.86% → 5.15% in one week, with the dollar rising too, after a 0.4% CPI", "idea": "October CPI rose 0.4% m/m with core at +0.3%, and PPI rose 0.3%. The 10-year Treasury yield climbed 29bp in a week, from 4.86% to 5.15%, while the dollar strengthened. TMAD's point is that higher yields compress growth multiples, raise financing costs and a stronger dollar hits US multinationals' overseas earnings.", "angle": "Yields and the dollar rising together after a CPI print is the 'term premium plus hawkish Fed' combination. That is the worst mix for long-duration tech and for EM.", "tweetA": "29bp on the 10-year in five sessions, and the dollar up at the same time. That isn't a growth scare, it's the bond market asking to be paid for holding US duration. Long-duration tech is the asset most exposed to that bill. $TLT $QQQ $DXY", "tweetB": "Core CPI +0.3% m/m annualizes to about 3.6%. The Fed is hiking into that and the 10-year is already above 5%. The long end isn't pricing a quick win on inflation.", "charts": {"count": 0, "hot": false, "desc": "Yield and dollar charts referenced in the email (counted above)"}, "link": "https://www.tmad.news/p/tmad-weekly-a-bounce-is-not-the-same"}, {"id": 8, "cat": "AI/infra", "urgency": "act", "source": "Stephen Innes / Dark Side Of The Boom (Week Ahead)", "title": "Nvidia lost ~$1.9T in five weeks, more than Anthropic's entire IPO valuation", "idea": "Nvidia's market cap fell from about $5.8T in early October to $3.9T by Friday. That ~$1.9T loss would 'comfortably swallow' Anthropic's proposed ~$1.4T IPO valuation. Even so, the S&P 500 posted its first weekly gain after four declines and is up about 10.5% YTD.", "angle": "Public markets just repriced the chip supplier lower by more than they are about to value the model maker. That is the value-chain migration trade, from picks-and-shovels toward the labs, being priced in real time.", "tweetA": "Nvidia shed $1.9T in five weeks. Anthropic lists Thursday at around $1.4T. Within a month, the market is about to value one AI lab at more than a third of the company that sells everyone the chips. $NVDA", "tweetB": "Value chain check: $NVDA at $3.9T, Anthropic at $1.4T, SpaceX at about $1.75T. In 2024 the debate was whether models would commoditize. In 2026 public markets are paying more per dollar of growth for the model than for the silicon.", "charts": {"count": 3, "hot": false, "desc": "Three images in the email; charts inside, worth opening"}, "link": "https://thedarksideoftheboom.substack.com/p/wall-street-week-ahead-nvidia-faces"}, {"id": 9, "cat": "AI/infra", "urgency": "act", "source": "Stephen Innes / Dark Side Of The Boom (Week Ahead)", "title": "Tuesday: the 'Bank of Nvidia' faces its first audit without its chairman, against consensus of $109B and ~90% growth", "idea": "LSEG consensus has Nvidia's quarterly revenue at around $109B, with ~90% earnings growth. Innes's point is that the number matters less than tone: whether interim CEO Colette Kress signals less enthusiasm for financing commitments to customers and partners. In one example, Nvidia reportedly took on the data-center lease behind Anthropic's $35B compute deal with Lambda.", "angle": "The tradeable read is the guidance on 'strategic investments' and purchase commitments, not revenue. A quieter lending desk is bearish for $CRWV and neocloud debt even if NVDA beats.", "tweetA": "Nvidia can beat $109B and still be a sell on Tuesday. If Kress says 'disciplined' about strategic investments even once, every neocloud with a Nvidia-backed lease reprices on Wednesday. $NVDA $CRWV", "tweetB": "The Lambda detail matters: Anthropic's $35B compute deal works because Nvidia took on the data-center lease. Take Nvidia's balance sheet out of that structure and someone else has to carry a $35B lease. Who? $NVDA", "charts": {"count": 0, "hot": false, "desc": "Charts inside, worth opening"}, "link": "https://thedarksideoftheboom.substack.com/p/wall-street-week-ahead-nvidia-faces"}, {"id": 10, "cat": "venture", "urgency": "act", "source": "Stephen Innes / Dark Side Of The Boom (Week Ahead)", "title": "Anthropic IPO: up to 825M shares, $64.4B, ~$1.4T, Nasdaq debut Thursday", "idea": "The latest prospectus describes up to 825M shares and proceeds of up to $64.4B, at a valuation approaching $1.4T. The order book is reportedly several times oversubscribed, and bankers have discussed raising the price. Innes's frame: if public markets fund the labs directly, the industry no longer needs Nvidia to pass the collection plate, but the financing risk moves to shareholders.", "angle": "Anthropic becomes the new financing node: follow-ons, converts and eventually IG debt. If it trades well, it lowers the cost of capital for every lab and indirectly for compute demand.", "tweetA": "$64.4B raised at $1.4T is a 4.6% float. Thin floats plus oversubscribed books make great first days and hard third months. The lock-up calendar matters more than the opening print.", "tweetB": "The quiet shift: if Anthropic can raise $64B from public investors, the AI capex cycle no longer depends on Nvidia vendor financing. That's bearish for the 'Bank of Nvidia' and bullish for its unit volumes. One IPO takes away one of NVDA's jobs.", "charts": {"count": 0, "hot": false, "desc": "Charts inside, worth opening"}, "link": "https://thedarksideoftheboom.substack.com/p/wall-street-week-ahead-nvidia-faces"}, {"id": 11, "cat": "positioning", "urgency": "deep", "source": "Stephen Innes / Dark Side Of The Boom (Week Ahead)", "title": "SpaceX precedent: $75B IPO at $1.75T, fell from $135 to ~$105, now ~$139", "idea": "SpaceX's June IPO raised about $75B at a valuation approaching $1.75T. The shares then fell from the $135 offering price toward $105 (about -22%) before recovering to roughly $139. Innes uses it as a reminder that a strong business story and a good entry price are not the same thing.", "angle": "This is the template for trading the Anthropic aftermarket: a weak first two months once stabilization ends, then a recovery. I'd wait for the post-stabilization drawdown before buying.", "tweetA": "SpaceX at $135 → $105 → $139. Anyone who bought the IPO waited five months to be up 3%. The template for Anthropic isn't buying day one, it's waiting for the stabilization bid to disappear.", "tweetB": "Two trillion-dollar IPOs in one year, $75B and $64B raised. That's about $140B of supply from two names hitting a market that just watched $NVDA lose $1.9T. Mega-IPOs drain the liquidity that small and mid-cap growth names depend on.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/wall-street-week-ahead-nvidia-faces"}, {"id": 12, "cat": "AI/infra", "urgency": "watch", "source": "Stephen Innes / Dark Side Of The Boom (Week Ahead)", "title": "Asia's AI conveyor belt (TSMC, SK Hynix, Advantest) is exposed to a slower Nvidia lending desk", "idea": "Innes argues that Nvidia's growth gave TSMC, SK Hynix and Advantest earnings visibility, and that each road map drove demand for memory, packaging and test. If Nvidia scales back its strategic financing or the infrastructure buildout struggles to raise capital, suppliers' forecasts built on today's pace become hard to meet. A weak Anthropic debut could mean 'another uncomfortable Asian opening.'", "angle": "Asian semis are the higher-beta expression of Thursday's IPO. Advantest (test) is the purest volume proxy, and SK Hynix carries the most Nvidia concentration.", "tweetA": "If you want to trade the Anthropic IPO without owning the IPO, Monday's Asia open after Thursday is the cleaner expression: $TSM, SK Hynix, Advantest. Test equipment is the purest read on unit volumes.", "tweetB": "Asian suppliers priced in Nvidia's road map. They didn't price in Nvidia's balance sheet becoming more cautious. Those are different risks, and only the second one changed this month.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/wall-street-week-ahead-nvidia-faces"}, {"id": 13, "cat": "credit", "urgency": "deep", "source": "Stephen Innes / Dark Side Of The Boom (Week Ahead)", "title": "US tech raised $220B+ in follow-on equity this year; a 1GW data center costs at least $30B", "idea": "Per Bloomberg, US tech companies raised at least $220B through follow-on equity offerings this year, and convertibles became a major source of capital at modest coupons. Innes notes that a 1GW data center costs at least $30B. A listed Anthropic could use follow-ons, converts, private placements and eventually conventional debt markets.", "angle": "Converts are the instrument of this cycle: cheap coupons for issuers, equity upside for buyers. Expect the convert calendar to grow after the Anthropic listing, which dilutes tech equity supply.", "tweetA": "$220B in tech follow-ons this year funds about seven 1GW data centers at $30B each. Frontier labs talk about tens of gigawatts. The equity market has funded maybe a tenth of the buildout so far. The rest is debt.", "tweetB": "Once Anthropic has a public price, the convert market opens to it. Hiking Fed, 5% 10-year, and the fastest-growing AI lab issuing low-coupon converts: that's the 1999-2000 telecom funding playbook.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/wall-street-week-ahead-nvidia-faces"}, {"id": 14, "cat": "macro", "urgency": "deep", "source": "Stephen Innes / Dark Side Of The Boom (Week Ahead)", "title": "Consumer week: retail sales, Fed minutes, WMT/TGT/HD/LOW, with Waller floating a 50bp December hike", "idea": "Tuesday brings retail sales, Wednesday the FOMC minutes, plus earnings from Walmart, Target, Home Depot and Lowe's. Waller's suggestion that a 50bp December hike deserves consideration rattled Treasuries, while Friday's softer PPI details helped the gradualists. Innes expects 25bp. His point is that neoclouds and young labs, unlike hyperscalers, depend on outside capital and are the most rate-sensitive part of AI.", "angle": "Strong retail sales raise the odds of a 50bp hike. That makes Tuesday's 08:30 print a bigger AI-financing event than Nvidia's after-hours report.", "tweetA": "Tuesday's most important AI number might be retail sales, not Nvidia. A hot print puts 50bp on the table in December, and neocloud funding costs are a function of the Fed, not of GPU demand. $CRWV $XRT", "tweetB": "When a Fed governor floats a 50bp hike, the fight is about the size of the next hike, not its timing. Walmart and Target will show whether consumers can carry that. Watch trade-down commentary, not comps. $WMT $TGT", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/wall-street-week-ahead-nvidia-faces"}, {"id": 15, "cat": "tech", "urgency": "watch", "source": "Exponential View / Azeem Azhar", "title": "1 in 20 UK adults now pays for AI ($1.3B/yr), and Claude's share quadrupled in a year", "idea": "UK paid AI adoption went from 1% of adults two years ago to 2.5% a year ago to 5% now, spending more than $1.3B a year. London is the hotspot, skewed to tech, finance, education and PR. Claude's share of that spend has quadrupled in a year. Azhar asks whether the trigger was the improved Claude Cowork harness.", "angle": "Paid consumer AI is doubling every year, an S-curve still in its early phase. A 4x share gain for Claude in a consumer market fits the Anthropic IPO narrative and gives the roadshow a data point.", "tweetA": "UK paid AI adoption: 1% → 2.5% → 5% in two years. Doubling a year puts it at 20% by 2028, which is Netflix-in-the-UK penetration. Anthropic lists Thursday, and its UK share just 4x'd.", "tweetB": "$1.3B a year from 5% of UK adults works out to about $500 per payer per year. That isn't a $20 hobby subscription, it's professionals on premium tiers. The paying customer here is a white-collar worker, not a consumer.", "charts": {"count": 0, "hot": false, "desc": "Charts inside, worth opening"}, "link": "https://www.exponentialview.co/p/ev-610"}, {"id": 16, "cat": "tech", "urgency": "watch", "source": "Exponential View / Azeem Azhar", "title": "Agentic commerce: 4 Uber rides out of 320 million in Halloween week were booked by AI agents", "idea": "Uber says 4 of 320M rides during Halloween week were booked by agents. Meanwhile, Azhar's Instinct agent secured an iPhone Duo for him by checking Apple's site every few minutes from 7am, and colleagues used agents for sweaters and squash courts. His framing: agents win on finicky, scarce or high-search-cost purchases, not on one-tap apps.", "angle": "Agent commerce will start with scarce drops, comparison shopping and hard-to-specify goods. Apps with one-tap UX, like Uber, are the last to be disrupted. The first losers are search ads and affiliate marketing, not apps.", "tweetA": "4 out of 320,000,000. That's agentic Uber adoption, roughly one in 80 million. The place agents win is the iPhone drop that needs checking every five minutes from 7am. Agents take the search cost first and the convenience apps last. $UBER $GOOGL", "tweetB": "Who loses when an agent buys your sweater? Not the store. It's whoever got paid to show you the ad. Agentic commerce threatens affiliate and search-ad economics long before it threatens any app. $GOOGL $META", "charts": {"count": 0, "hot": false, "desc": "Charts inside, worth opening"}, "link": "https://www.exponentialview.co/p/ev-610"}, {"id": 17, "cat": "energy", "urgency": "deep", "source": "Exponential View / Azeem Azhar", "title": "Adding wind to solar+batteries cuts median cost from $105 to $86/MWh; at the latitude of Milan or Montreal, $164 to $99", "idea": "Kingsmill Bond and Daan Walter's hourly modeling over ten years shows that sun and wind mostly cover for each other, except for a combined lull of about one week in four. Adding wind to solar plus storage lowers the median cost of firm supply from $105 to $86/MWh, and at higher latitudes (Milan and Montreal share one) from $164 to $99.", "angle": "The one-week-in-four combined lull is the market for gas peakers and long-duration storage. The hybrid portfolio cuts cost, but the backup asset becomes the scarce, high-value piece.", "tweetA": "Solar + wind + batteries at $86/MWh, with one problem: a combined lull about one week in four. Whoever owns the backup for that week owns the pricing power of the whole grid. Gas peakers and long-duration storage are the real scarcity trade. $GEV $FLNC", "tweetB": "The surprising number is the latitude one: from $164 to $99/MWh when you add wind. That's a 40% cut for Northern Europe and Canada, the regions solar-only economics left behind.", "charts": {"count": 0, "hot": false, "desc": "Charts inside, worth opening (cost curves by latitude)"}, "link": "https://www.exponentialview.co/p/ev-610"}, {"id": 18, "cat": "energy", "urgency": "watch", "source": "Exponential View / Azeem Azhar", "title": "Ember: 83% of the 750GW of planned fossil plants sit where firm renewables cost under $100/MWh", "idea": "Ember finds that 83% of the 750GW of fossil plants in planning are in places where reliable renewables, with a little gas backup, cost under $100/MWh, roughly the level implied by $60 oil. Azhar's take: costs will keep falling as robotics reach installation, but the grid also needs a better cost of capital (gas plants still borrow more cheaply than solar) and instruments that hedge renewable price volatility.", "angle": "The barrier is now the cost of capital, not technology. With 10-year yields above 5% and a hiking Fed, capital-heavy renewables lose relative to fuel-heavy gas. Rates are an energy-mix policy.", "tweetA": "Renewables are cheaper on 83% of planned fossil capacity, and gas still gets built because it borrows more cheaply. A 5% 10-year is an energy policy, and it currently favors gas.", "tweetB": "Solar is a capex asset and gas is an opex asset. Every 100bp on the 10-year moves the levelized cost toward gas. The Fed's hiking cycle may do more to slow the energy transition than any administration.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.exponentialview.co/p/ev-610"}, {"id": 19, "cat": "AI/infra", "urgency": "watch", "source": "Exponential View / Azeem Azhar", "title": "The $22 billion question: does AI self-improvement come from intelligence or from research budget?", "idea": "The issue's lead essay asks whether AI self-improvement owes more to intelligence or to a massive research budget, framed around a $22B figure. The body is truncated in the email preview, so the full argument and the source of the $22B number are behind the link.", "angle": "If self-improvement scales with research spend rather than with model capability, the recursive-improvement story is a capex story, and the labs with the deepest pockets (and now a public listing) compound the fastest.", "tweetA": "If AI self-improvement is mostly bought with a research budget, the moat isn't the model, it's the balance sheet. That makes Thursday's $64B IPO raise a capability event, not just a financing event.", "tweetB": "Recursive self-improvement sounds like sci-fi until you put a price on it. Exponential View put it at $22B. Most countries don't spend that on all of their R&D.", "charts": {"count": 0, "hot": false, "desc": "Teaser only; full essay at link"}, "link": "https://www.exponentialview.co/p/ev-610"}, {"id": 20, "cat": "crypto", "urgency": "deep", "source": "Unchained / Laura Shin — Jeff Dorman (Arca)", "title": "ETH: $240B market cap on $6M of monthly fees, and ~$200B of 'hopium'", "idea": "Vitalik Buterin argued this week that ETH should be valued as a store of value rather than a fee-burning token. Arca CIO Jeff Dorman calls the pivot 'really misguided.' By his math, ~$6M of monthly revenue plus ETH held in wallets for gas supports about $50B of tangible value, leaving roughly $200B of 'hopium'. Value has gone to applications like Hyperliquid and Pump.fun instead of L1s, and Ethereum would need its own stablecoin and DEX, or would have to tax the apps on it.", "angle": "$6M a month is $72M a year, so ETH trades at about 3,300x revenue. Hyperliquid's fee capture shows value accruing at the app layer. The pair trade is long app tokens versus short the L1.", "tweetA": "$6M of monthly fees annualizes to $72M. At $240B, ETH trades at about 3,300x revenue. Hyperliquid captures more fees in a week. The market isn't paying for a fee chain, it's paying for a brand. $ETH $HYPE", "tweetB": "Vitalik pivoting ETH to 'store of value' is the clearest admission yet that value accrues to the application layer. When the founder changes the valuation model, the old one has failed. $ETH", "charts": {"count": 0, "hot": false, "desc": "Podcast; no charts"}, "link": "https://unchainedcrypto.com/is-ethereums-240-billion-market-cap-justified-with-only-6-million-in-monthly-fees/"}, {"id": 21, "cat": "crypto", "urgency": "watch", "source": "Unchained / Laura Shin — The Chopping Block", "title": "Vitalik's store-of-value call: ETH -4% that day, Zcash as the better SoV, Bitcoin 'way behind on quantum'", "idea": "ETH fell about 4% the day Vitalik made the store-of-value case. Tarun Chitra says it feels like giving up on the 'infinite garden' and argues Zcash has the better SoV story (proof of work, privacy, post-quantum security). Haseeb Qureshi says Bitcoin is way behind on quantum and expects a reshuffling of value within two to three years. His bet is that AIs will choose Ethereum for its predictable governance. Tom Schmidt says a store of value is earned by not changing. Separately, Kain Warwick reads the move as a concession that the EIP-1559 'ultrasound money' burn was a meme.", "angle": "Quantum readiness is becoming a store-of-value competition. A 2-3 year reshuffle thesis from Dragonfly's Haseeb is worth tracking against BIP progress on post-quantum signatures.", "tweetA": "'A store of value has to be earned by not changing.' Ethereum just changed its own story to become one. That's the contradiction the ETH/BTC ratio has priced for two years. $ETH $BTC", "tweetB": "The sleeper idea here isn't ETH, it's quantum. If the next crypto value rotation runs on post-quantum security, Bitcoin's slow governance stops being a feature and becomes a liability. $ZEC $BTC", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://unchainedcrypto.com/the-chopping-block-vitalik-says-eth-is-a-store-of-value-the-efs-seppuku-license-lawsuit-jensen-huang-and-the-alleged-chinese-spy-and-mchenry-blames-coinbase/"}, {"id": 22, "cat": "crypto", "urgency": "deep", "source": "Unchained / Laura Shin — Matt Hougan (Bitwise)", "title": "Biggest hack ever ($6.3B from Binance) plus a blue-wave Congress, and Bitcoin barely flinched", "idea": "Crypto absorbed a $6.3B theft from Binance, the largest hack in its history, along with a Democratic sweep of Congress that dimmed the odds for the Clarity Act. Bitcoin barely moved. Bitwise CIO Matt Hougan argues the market bottomed in June and lays out store-of-value math behind Bitwise's $1.6M BTC by 2036 target.", "angle": "Holding up through two shocks is a positioning tell: leverage was already flushed. The $1.6M target is a store-of-value share call, so the gold comparison and ETF/custody flows are the inputs to watch.", "tweetA": "A $6.3B exchange hack in 2022 would have cut BTC 30%. In 2026 it barely registered. Whether that's because the holder base is now ETFs and treasuries, or because nobody trusts exchanges to begin with, it's bullish either way. $BTC $IBIT", "tweetB": "Bitwise's $1.6M BTC by 2036 is a store-of-value math call. Gold's market cap is the comparison it needs. The question is whether a blue Congress slows ETF and custody rails, because that's the pipe the $1.6M has to flow through.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://unchainedcrypto.com/why-bitwises-cio-says-the-blue-wave-wont-derail-cryptos-bull-market/"}, {"id": 23, "cat": "regulation", "urgency": "deep", "source": "Unchained / Laura Shin — Patrick McHenry (Bits + Bips)", "title": "Democrats flipped both chambers by the widest margin since 1994; McHenry says Congress is still more pro-crypto", "idea": "Democrats took both chambers in the November 3 midterms by one of the widest margins since 1994: a 250+ seat House majority and a 55-56 seat Senate. Patrick McHenry, former House Financial Services chair and now Ondo Finance vice chairman, calls it a 'throw the bums out' election but argues the incoming Congress is more pro-crypto than it was six or eight years ago, even without the Clarity Act.", "angle": "Policy risk shifts from 'no market structure law' to 'stricter consumer protection after the Binance hack'. Tokenization (Ondo, RWA) may be the most bipartisan corner of crypto.", "tweetA": "A 250+ seat Democratic House right after the biggest exchange hack in history. Market structure is now a consumer protection debate. Tokenized Treasuries are the part of crypto that survives that framing. $ONDO $COIN", "tweetB": "1994 was the last wave this big, and it ushered in the Contract with America and a deregulatory decade. Big swings tend to produce bills, not gridlock. The question is whose bill.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://unchainedcrypto.com/bits-bips/why-patrick-mchenry-says-crypto-is-stronger-in-washington-even-after-the-midterms/"}, {"id": 24, "cat": "credit", "urgency": "deep", "source": "Michael Parekh / AI-RTZ", "title": "Nvidia's off-balance-sheet guarantees went from $184B to $530B in one quarter", "idea": "Per SemiAnalysis, Nvidia disclosed $530B of gross off-balance-sheet guarantees as of fiscal Q2, up from $184B the quarter before, including $36B of take-or-pay floors under neocloud capacity, next to a $99B equity book. The FT counts 120+ investments this year and up to $105B of credit support behind OpenAI's Ohio campus. The Information tallies $140B of deals and guarantees in two months.", "angle": "$530B of guarantees against a $99B equity book is about 5.4x leverage on a contingent basis, the structure of a bank, not a chipmaker. Any language on Tuesday about 'reviewing commitments' hits neocloud credit first.", "tweetA": "$530B of off-balance-sheet guarantees against a $99B equity book. That's 5.4x. If a bank did this, you'd call it a leveraged lender. Nvidia did it in a single quarter, up from $184B. $NVDA", "tweetB": "Everyone is debating Nvidia's P/E. The number that matters for Tuesday is $530B of guarantees, about 1.2x a full year of revenue at the $109B quarterly consensus. The 'Jensen put' was a balance sheet, not a personality.", "charts": {"count": 0, "hot": true, "desc": "No charts in the email. 🔥 The $184B → $530B guarantee jump is a chart worth building yourself"}, "link": "https://michaelparekh.substack.com/p/ai-the-world-without-the-kingmaker"}, {"id": 25, "cat": "AI/infra", "urgency": "deep", "source": "Michael Parekh / AI-RTZ", "title": "Interim CEO Kress halved a $250B OpenAI backstop: the start of an AI credit tightening", "idea": "Per The Information, interim CEO Colette Kress has been the voice of caution on Nvidia's riskiest deals, including pushing back on a $250B OpenAI backstop that was cut in two. Parekh's read: signed deals look safe, but new ones will be slower and smaller. For a market that priced in the 'Jensen put', that is a tightening of AI credit even if nobody calls it that.", "angle": "The marginal AI capex dollar was partly Nvidia-financed. A CFO in the CEO chair means less of that. OpenAI's Ohio build and neocloud expansions are the first places to see a slowdown.", "tweetA": "The new head of the 'central bank of AI' is a CFO who already halved a $250B OpenAI backstop. Markets priced a Jensen put. They now hold a Kress collar. $NVDA", "tweetB": "You don't need Nvidia to cut capex to slow the AI buildout. You only need it to stop underwriting other people's capex. That's what the $250B → $125B OpenAI backstop already shows.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/ai-the-world-without-the-kingmaker"}, {"id": 26, "cat": "AI/infra", "urgency": "act", "source": "Michael Parekh / AI-RTZ", "title": "Neoclouds lose their patron: an exec says Jensen's exit has them considering Google and AMD chips", "idea": "Per the FT, Nvidia has done at least 15 deals this year with neoclouds and AI infrastructure companies, in rounds raising $24B, plus $20B of data-center leases it plans to hand to others. SemiAnalysis's mechanism: Nvidia sells GPUs at full margin, then floors the buyer's revenue or guarantees the landlord, so unrated operators can borrow at IG prices. Without it, they see a possible 'large contraction'. One neocloud exec told The Information they are now considering Google and AMD chips, which they held back on for fear of offending Jensen. CoreWeave and IREN fell ~7% Thursday.", "angle": "The 'fear of offending Jensen' quote is the bull case for AMD and TPU-as-a-service. Supplier diversification was being suppressed by relationship risk, which just disappeared.", "tweetA": "'We held back on Google and AMD chips for fear of offending Jensen.' That one quote is worth more than any AMD roadmap slide. Relationship lock-in was Nvidia's hidden moat, and it left with him. $AMD $GOOGL", "tweetB": "Neocloud debt is IG-priced because Nvidia floors the revenue. Remove the floor and these are unrated borrowers in a 5% rate world. $CRWV and $IREN fell 7% on the hint. The bonds haven't moved yet.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/ai-the-world-without-the-kingmaker"}, {"id": 27, "cat": "AI/infra", "urgency": "watch", "source": "Michael Parekh / AI-RTZ", "title": "HBM4: Nvidia pays $3.0-3.3/Gb vs $3.7-4.1 for others; supply commitments jumped from $119B to $279B", "idea": "SemiAnalysis estimates Nvidia's 2027 HBM4 pricing from SK Hynix at roughly $3.0-3.3 per gigabit, versus $3.7-4.1 for other big customers, a ~20% discount. Nvidia's supply and capacity commitments went from $119B to $279B in a single quarter, mostly for memory. Their bet: without Jensen, suppliers prioritize Nvidia less, and more than 70% of total AI capacity could be non-Nvidia by 2028. Parekh is more cautious on that number.", "angle": "If Nvidia's memory discount narrows, SK Hynix's blended HBM ASP rises. That's a quiet positive for memory pricing and a margin headwind for Nvidia in 2027.", "tweetA": "Nvidia pays about 20% less for HBM4 than anyone else. That discount was negotiated CEO to CEO. If it narrows by even half, SK Hynix's margins go up and Nvidia's 2027 gross margin goes down. Memory is the hidden winner of Jensen's exit. $MU", "tweetB": "$119B → $279B in supply commitments in one quarter, mostly memory. Nvidia locked up the HBM supply so others couldn't get it. If the 2028 non-Nvidia share hits 70%, someone has to absorb those commitments.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/ai-the-world-without-the-kingmaker"}, {"id": 28, "cat": "tech", "urgency": "watch", "source": "Michael Parekh / AI-RTZ", "title": "US open-source AI loses its champion, and the DeepGEMM/DeepEP pipeline from Chinese labs may dry up", "idea": "Jensen bought Hugging Face for about $13B, steered Reflection toward open models (its first, Beam, shipped last month), backed Thinking Machines and Poolside, and built Nemotron. SemiAnalysis flags a quieter channel: Nvidia engineers working with Chinese labs that publish Blackwell-tuned software (DeepGEMM, DeepEP), which flows into Western tools like vLLM and SGLang. As China hawks win, that could dry up. Conclusion: good for closed labs, bad for startups. Parekh's counter: open models create Nvidia customers beyond the frontier labs now designing their own chips.", "angle": "Open-weight progress has partly been a China-to-West software transfer mediated by Nvidia. If it slows, inference costs for startups fall more slowly. That's a tailwind for closed-model pricing, and for Anthropic's IPO.", "tweetA": "The least-discussed casualty of Jensen's exit: the pipeline where Chinese labs tune kernels for Blackwell and the code ends up in vLLM. Break that and the open-source cost curve flattens. The closed labs become the winners of a CEO change at their supplier.", "tweetB": "Nvidia owns Hugging Face, a $13B 'home shelf' of open AI. Who decides what stays on that shelf when Washington's China hawks have the momentum? That's a governance question nobody has asked the Nvidia board.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/ai-the-world-without-the-kingmaker"}, {"id": 29, "cat": "geopolitics", "urgency": "watch", "source": "Michael Parekh / AI-RTZ", "title": "Remote Access Security Act passed the House 369-22; the China hawks have momentum", "idea": "Jensen was the industry's most effective advocate against export controls. Without him, the Remote Access Security Act, which would stop Chinese companies renting restricted US chips abroad, passed the House 369-22 in January and awaits the Senate. Commerce is drafting its own remote-access rule, Congress may tighten controls in the defense bill, and the White House is discussing Lutnick's future. Reuters reports Chinese AI firms rushing to secure Nvidia capacity as a spy scandal stirs fear of US curbs. SemiAnalysis takes the contrarian side: remote access lets the US monitor and cut off Chinese labs.", "angle": "A Chinese pull-forward of rented GPU capacity could flatter Nvidia and neocloud near-term demand, ahead of a rule that removes it. Data centers in Malaysia and the Middle East that serve Chinese tenants carry the most policy risk.", "tweetA": "369-22 in the House. That's not a partisan bill, that's a consensus, and it was waiting on the Senate while Jensen was lobbying. Data centers in Malaysia renting GPUs to Chinese labs are the most policy-exposed assets in AI.", "tweetB": "Reuters: Chinese AI firms are rushing to lock up Nvidia capacity before US curbs. That's a pull-forward in demand right before Tuesday's earnings. Strong numbers might partly be China front-running its own ban. $NVDA", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/ai-the-world-without-the-kingmaker"}, {"id": 30, "cat": "culture", "urgency": "deep", "source": "Michael Parekh / AI-RTZ", "title": "Founders become bigger than their companies: Jobs to Cook to Ternus, and now Nvidia, suddenly", "idea": "Parekh's framing: Nvidia the chip company will function fine for a while (products sold out for years, road map set). What doesn't function without Jensen is Nvidia the Kingmaker: the central bank, the neocloud patron, the open-source champion, the supply-chain enforcer and the industry's ambassador. Apple managed the transition from Jobs to Cook and is doing it again with John Ternus. Nvidia has to do it suddenly, under a spy scandal, mid-boom. The WSJ adds that the AI boom lost its best PR asset just as midterm voters pushed back on data centers.", "angle": "Key-man risk was priced at zero for Nvidia's ecosystem role. The 'diversify from key-man risk' pitch is now in every AMD, Google and Broadcom sales deck.", "tweetA": "Apple had years to hand over from Jobs to Cook. Nvidia had two weeks, a spy scandal and earnings in the middle of a boom. The chip business won't notice for a year. The ecosystem it financed noticed on Thursday.", "tweetB": "The WSJ point is underrated: the AI boom lost its best salesman the same month voters punished data centers at the ballot box. Public sentiment, not chips, may be the binding constraint on AI in 2027.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/ai-the-world-without-the-kingmaker"}, {"id": 31, "cat": "positioning", "urgency": "deep", "source": "MacroEdge Research / Redeye Macro Note", "title": "Powell's Valhalla: NDX 10,860 → 31,250, eight 7%+ dips all reclaimed, now -15.2% and still open", "idea": "The Nasdaq 100 went from 10,860 in January 2023 to a 31,250 peak on 6 October 2026 (~2.9x). It closed at 27,836 on 13 November, about 11% below the peak, and is testing its 200-day average for the first time in the Warsh era (sworn in 22 May 2026). There were eight corrections of 7%+ since 2023, including the -22.9% 'Fake Tariff Dip' in April 2025, and every one reclaimed the high. The current drawdown reached -15.2% at its low, the deepest of the Warsh era. 'Recovery speed is the tell.'", "angle": "Use time-to-recover as the regime indicator. If NDX hasn't reclaimed 31,250 within about 8-10 weeks, the 'buy every dip' reflex is broken, and that's the cue to rotate into old-economy assets.", "tweetA": "Eight corrections of 7%+ since 2023, all reclaimed within weeks. Number nine is at -15.2% and 39 days old. The question isn't how deep it goes, it's how long the bid takes to show up. Recovery speed is the regime. $QQQ", "tweetB": "NDX nearly tripled in the Powell era. The first real test under Warsh is the 200-day. A Fed that hikes into a drawdown instead of cutting is the first time since 2022 that the 'put' has been under water.", "charts": {"count": 0, "hot": true, "desc": "17-slide deck referenced; this note includes NDX regime charts. 🔥 'Every dip got bought' drawdown-and-recovery chart is the one to save"}, "link": "https://www.macroedge.world/p/redeye-macro-note-changing-winds"}, {"id": 32, "cat": "macro", "urgency": "deep", "source": "MacroEdge Research / Redeye Macro Note", "title": "1973, not 2000: supply-shock inflation, stop-start hikes, record leverage, and the '73 Five", "idea": "MacroEdge argues that a supply-shock inflation, a stop-start hiking cycle and record leverage line up more closely with 1973 than with any other post-war setup. A December hike looks likely, with up to three hikes between now and March 2027. The positioning answer is the '73 Five', not long-duration growth, under a 'revenge of the old world economy' trade, if the US moves into a '65-'82-style regime. The author cautions it may also be just another broadening pattern.", "angle": "1973 was the start of a decade in which equities fell in real terms and real assets (energy, commodities, gold, value) beat. It's the macro case for the 'old world economy' basket versus NDX.", "tweetA": "1973 had an oil shock, a Fed that hiked, paused and hiked again, and a Nifty Fifty that people said was 'one-decision'. 2026 has the Gulf war, Warsh, and the Mag 7. In 1973-74 the Nifty Fifty fell about 60%. $QQQ", "tweetB": "Three hikes by March 2027 into a supply shock is the 1973 playbook. The 1970s winners weren't growth stocks, they were energy, materials and anything with pricing power. The trade is old economy over new economy. $XLE $XLB", "charts": {"count": 0, "hot": false, "desc": "Full 17-slide deck available on request; slides partly in the paid note"}, "link": "https://www.macroedge.world/p/redeye-macro-note-changing-winds"}, {"id": 33, "cat": "culture", "urgency": "deep", "source": "MacroEdge Research / Redeye Macro Note", "title": "Data centers as America's 'Chinese ghost cities', built during a real estate recession", "idea": "MacroEdge argues that the data-center construction boom started almost at the same time as all-time-low real estate activity and a severe real estate recession. The author calls many of these facilities America's version of China's ghost cities, applauded with little understanding of their benefit at community level. They also describe an 'i-shaped' economy: a narrow stem of asset owners who prospered for 18 years, while the bottom 90% has 'essentially died in real terms'.", "angle": "The ghost-city analogy points to a specific risk: construction employment and local GDP propped up by one asset class. When data-center starts slow, regional construction labor is the first casualty.", "tweetA": "China built ghost cities to keep GDP growing while housing stalled. The US is building data centers while housing turnover sits at record lows. Same reflex, different asset. Ask what the GDP print looks like when the cranes stop.", "tweetB": "'i-shaped economy' is a better metaphor than K-shaped. K implies two directions. i implies a dot of asset owners floating above a stem that's stopped moving. Midterm voters just showed which part of the i they belong to.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.macroedge.world/p/redeye-macro-note-changing-winds"}, {"id": 34, "cat": "labor", "urgency": "watch", "source": "MacroEdge Research / Redeye Macro Note", "title": "The 'demographic endgame': borrowing ever harder against shrinking future generations", "idea": "MacroEdge frames today's fiscal path as accelerating toward a 'demographic endgame': the US borrows more aggressively against future generations that will keep getting smaller. A large and growing older population 'rages every time markets pause', and the system relies on continued nominal gains. The author also notes the very bleak situation facing young people in the West.", "angle": "Aging voters with asset-heavy balance sheets create a political floor under equities and a ceiling on real rates. That tension is what the bond market is testing at a 5% 10-year.", "tweetA": "Debt per future taxpayer rises twice: more debt, and fewer future taxpayers. Fertility is a bond-market variable, and most rate models don't include it.", "tweetB": "A political system run by retirees whose wealth is in stocks will always choose inflation over a bear market. That's the long-term case for real assets, and against long bonds. $GLD $TLT", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.macroedge.world/p/redeye-macro-note-changing-winds"}];

function copyTweet(itemId, which) {

  ta.value = text;

  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
