ts. Strip out the politics: autos, steel and solar profits are collapsing at the same time. That is a margin problem China exports as deflation. $FXI $KWEB", "tweetB": "China is less industrial than South Korea and less than half as rich. A bull case that needs 45% of global manufacturing is dead. A 35% share is still enormous, and the market has priced neither.", "charts": {"count": 5, "hot": true, "desc": "China mfg share vs time, industry share vs Korea, export intensity, infrastructure investment. 🔥 CHART WORTH SAVING"}, "link": "https://www.noahpinion.blog/p/why-im-becoming-a-china-bear", "id": 15}, {"cat": "crypto", "urgency": "watch", "source": "Unchained Premium / Laura", "title": "Coinbase Wallet Solana trades up 12x in three months, with no incentives", "idea": "Ox Bid, who leads trading at Coinbase Wallet, says Solana trading in the wallet is up 12x in three months without Solana-specific incentives. Swap execution is at 99% success including cross-chain, spot volume is 2.5x since July, and perps via a Hyperliquid integration brought new traders instead of cannibalising spot. Prediction markets (Polymarket-powered) rank behind spot and perps. Coming: Coinbase Terminal and AI-agent features by year-end. Video is paywalled.", "angle": "Execution quality is the growth driver, not incentives. It's evidence that distribution plus UX beats yield farming.", "tweetA": "Solana trades up 12x in a Coinbase wallet with zero incentives. Execution at 99% success including cross-chain. The moat in crypto retail is not the chain, it is whether the swap works. $COIN $SOL", "tweetB": "Perps through a Hyperliquid integration added new traders without eating spot. The incumbent exchange is now renting a competitor's perp engine because users want it. $HYPE", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://unchainedcrypto.beehiiv.com/p/why-coinbase-wallet-s-solana-trading-jumped-12x-without-incentives", "id": 16}, {"cat": "geopolitics", "urgency": "act", "s function copyTweet(itemId, which) {
