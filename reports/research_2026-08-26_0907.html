  urgWrap.innerHTML = uhtml;
}

function setCat(c) { activeCat = c; activeSrc = null; buildFilters(); renderCards(); }
function setUrg(u) { activeUrg = u; activeSrc = null; buildFilters(); renderCards(); }
function filterBySrc(name) {
  activeSrc = name; activeCat = "all"; activeUrg = "all";
  buildFilters(); renderCards();
  ITEMS.forEach(item => {
    if (item.source.indexOf(name) !== -1) {
      const body = document.getElementById("body-" + item.id);
      if (body) body.classList.add("open");
    }
  });
}

function renderCards() {
  const wrap = document.getElementById("cards");
  let html = "";
  ITEMS.forEach(item => {
    const matchCat = activeCat === "all" || item.cat === activeCat;
    const matchUrg = activeUrg === "all" || item.urgency === activeUrg;
    const matchSrc = !activeSrc || item.source.indexOf(activeSrc) !== -1;
    const visible = matchCat && matchUrg && matchSrc;
    const color = CAT_COLORS[item.cat] || "#888";
    const chartFlag = item.charts.hot ? "🔥" : (item.charts.count > 0 ? "📊" : "");
    html += '<div class="card' + (visible?"":" hidden") + '" id="card-' + item.id + '">';
    html += '<div class="card-head" onclick="toggleCard(' + item.id + ')">';
    html += '<span class="idx">' + String(item.id).padStart(2,"0") + '</span>';
    html += '<span class="urg">' + URG_EMOJI[item.urgency] + '</span>';
    html += '<span class="badge" style="background:' + color + '">' + esc(item.source) + '</span>';
    html += '<span class="cat-tag">' + esc(item.cat) + '</span>';
    html += '<span class="chart-flags">' + chartFlag + '</span>';
    html += '<span class="card-title">' + esc(item.title) + '</span>';
    html += '</div>';
    html += '<div class="card-body" id="body-' + item.id + '">';
    html += '<div class="section-label">The Idea</div><div class="idea-text">' + esc(item.idea) + '</div>';
    html += '<div class="section-label">My Angle</div><div class="angle-box" style="border-left-color:' + color + ';">' + esc(item.angle) + '</div>';
    html += '<div class="tweets">';
    html += '<div class="tweet-box"><div class="tweet-label a">TWEET A</div><div class="tweet-text">' + esc(item.tweetA) + '</div><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button></div>';
    html += '<div class="tweet-box"><div class="tweet-label b">TWEET B</div><div class="tweet-text">' + esc(item.tweetB) + '</div><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div>';
    html += '</div>';
    html += '<div class="chart-block' + (item.charts.hot?" hot":"") + '">' + (item.charts.hot ? "🔥 CHART WORTH SAVING — " : (item.charts.count>0 ? "📊 " : "")) + esc(item.charts.desc) + '</div>';
    html += '<a class="read-link" href="' + esc(item.link) + '" target="_blank">↗ Read full article</a>';
    html += '</div>';
    html += '</div>';
  });
  wrap.innerHTML = html;
}

function toggleCard(id) {
  const body = document.getElementById("body-" + id);
  body.classList.toggle("open");
}

function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}

function buildReport() {
  const rb = document.getElementById("reportBody");
  let html = "";
  html += '<div class="section-label">Time Window</div>';
  html += '<div>' + META.windowStart + ' to ' + META.windowEnd + '. Emails outside this window were not processed.</div>';
  html += '<div class="section-label">Included Sources</div><ul>';
  META.includedSources.forEach(s => {
    html += '<li><span class="src-link" onclick="filterBySrc(\'' + esc(s.name).replace(/'/g,"\\'") + '\')">' + esc(s.name) + '</span> — ' + s.count + ' item' + (s.count>1?"s":"") + '</li>';
  });
  html += '</ul>';
  html += '<div class="section-label">Skipped Sources</div><ul>';
  META.skippedSources.forEach(s => {
    html += '<li>' + esc(s.name) + ' — ' + esc(s.reason) + '</li>';
  });
  html += '</ul>';
  html += '<div class="totals">Emails in window: ' + META.emailsInWindow + ' &nbsp;·&nbsp; Emails read: ' + META.emailsRead + ' &nbsp;·&nbsp; Items extracted: ' + META.itemsExtracted + '</div>';
  rb.innerHTML = html;
}

document.getElementById("metaLine").textContent = META.date + " · " + META.time + " · " + META.itemsExtracted + " items";
document.getElementById("reportToggle").addEventListener("click", function() {
  document.getElementById("reportBody").classList.toggle("open");
});

buildFilters();
renderCards();
buildReport();
</script>
</body>
</html>
