<script>
const ITEMS = [{"id": 1, "cat": "crypto", "urgency": "act", "source": "Unchained / Laura Shin", "title": "BTC gives back the entire post-midterm rally: $80.4K to $75.6K in 24h, $1.26B liquidated", "idea": "BTC fell ~5.9% to $75,208 at the low, its weakest since Sept 16, as Nasdaq closed -5.52% and S&P -4.36% (worst days since April 2025). CoinGlass counts $1.26B liquidations, 88.6% longs; Fear & Greed 50 -> 28. BTC fell LESS than the Nasdaq 100 (-6.36%). Wintermute eyes $73K then $68K.", "angle": "BTC beta to NDX is now ~0.9, not the 'digital gold' decoupling story. Long-liquidation share of 88.6% says positioning was one-sided into the election.", "tweetA": "BTC -5.9% vs NDX -6.36%. That's a beta of ~0.9 to the thing it was supposed to hedge. Digital gold did not show up; digital Nasdaq did. $BTC $QQQ", "tweetB": "88.6% of $1.26B in liquidations were longs. Nobody was positioned for a Democratic House to be bad news for crypto, and nobody was positioned for it to be bad news for chips either. Crowded in both places.", "charts": {"count": 1, "hot": false, "desc": "Daily market update image (majors table) embedded; article has more."}, "link": "https://unchainedcrypto.beehiiv.com/p/bitcoin-s-midterm-bounce-meets-a-terrible-day-on-wall-street"}, {"id": 2, "cat": "regulation", "urgency": "deep", "source": "Unchained / Laura Shin", "title": "White House OIRA is reviewing an 'economically significant' SEC crypto broker-dealer rule rewrite", "idea": "SEC draft logged Nov 3 targets Rules 15c3-1, 15c3-3, 17a-3 and 17a-4 (net capital, customer protection, recordkeeping). Text not public; SEC agenda had July 2026. It follows the Oct 1 SEC custody proposal for advisers and funds.", "angle": "The plumbing rules decide whether a broker can hold BTC next to AAPL on one balance sheet. Pre-lame-duck timing matters.", "tweetA": "Everyone is watching CLARITY die. The thing that actually moves the needle is SEC rules 15c3-1 and 15c3-3, which decide whether a broker-dealer can carry tokens next to stocks without punitive net capital. That one is already at OIRA.", "tweetB": "If a Democratic House kills legislation, the agencies are the only game left. Rulemaking cleared before January is stickier than anything Congress passes in a lame duck. Watch the SEC calendar, not the Hill.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://unchainedcrypto.beehiiv.com/p/bitcoin-s-midterm-bounce-meets-a-terrible-day-on-wall-street"}, {"id": 3, "cat": "crypto", "urgency": "deep", "source": "Unchained / Laura Shin", "title": "Kalshi launches US stock perps: $300M volume in hours, vs $4.5T/yr offshore", "idea": "Kalshi rolled out perpetuals on 50+ US stocks (PLTR, META, SpaceX, MCD) Nov 5 after CFTC Chair Selig said single-stock perps can trade as security futures. $300M in hours; Kalshi says annual offshore single-stock perp volume is $4.5T+. No PFOF, leverage 'significantly lower than offshore'.", "angle": "$4.5T/yr is ~$12B/day. A US onshore venue did ~2.4% of that in its first few hours. Financial plumbing arbitrage between SEC and CFTC.", "tweetA": "$4.5T a year in single-stock perps, all offshore, until Wednesday. Kalshi did $300M in its first hours. The SEC/CFTC turf war just got decided by the CFTC saying 'security futures' with a straight face. $HOOD $CME $COIN", "tweetB": "Do the math: $4.5T/365 = ~$12B a day offshore. Day one onshore was ~2.4% of that, in hours, with a stealth launch. Which exchange wants to explain to the SEC why it lost this flow?", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://unchainedcrypto.beehiiv.com/p/bitcoin-s-midterm-bounce-meets-a-terrible-day-on-wall-street"}, {"id": 4, "cat": "crypto", "urgency": "deep", "source": "Unchained / Laura Shin", "title": "Binance hack aftermath: wallet borrowed $44.6M ETH on Aave in 3 minutes, freeze came 40 minutes later", "idea": "LlamaRisk wants a borrowing speed limit on Aave after a wallet tied to the Oct 29 Binance hack borrowed $44.6M of ETH in ~3 minutes. Guardians froze markets about 40 minutes after. VerifiedX shipped Mainnet 9.0.0 to block hacked vBTC transfers.", "angle": "DeFi lending as a laundering exit: 3 min to borrow vs 40 min to react is a 13x response gap. Rate-limiting is the new risk parameter.", "tweetA": "3 minutes to borrow $44.6M. 40 minutes to freeze. DeFi's risk engine is built for price shocks, not for an adversary who is faster than governance. Rate limits on borrowing are about to become the standard parameter. $AAVE", "tweetB": "The same week Zcash is being praised for hard-coded rules, Aave is discovering that 'permissionless' means a thief gets the same API as you. Every lending market will end up with a speed limit, and a guardian.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://unchainedcrypto.beehiiv.com/p/bitcoin-s-midterm-bounce-meets-a-terrible-day-on-wall-street"}, {"id": 5, "cat": "regulation", "urgency": "watch", "source": "Unchained / Laura Shin", "title": "CLARITY Act 'dead' in lame duck; Arkansas AG sues Kalshi over Razorbacks bets", "idea": "Paradigm's Justin Slaughter says CLARITY looks dead in the lame duck and a House Democratic draft from Maxine Waters could come. Separately Arkansas AG Tim Griffin sued Kalshi alleging unlicensed gambling, noting 18-year-olds can bet.", "angle": "Kalshi is expanding into perps at the same moment states are attacking its core product. Federal preemption fight is the real risk.", "tweetA": "Kalshi launched stock perps one day before an Arkansas AG sued it for sports contracts. One federal regulator says yes, 50 state AGs say gambling. Whoever wins preemption owns the next decade of retail derivatives.", "tweetB": "CLARITY is dead, a Waters draft is coming, and the CFTC is approving products by statement. Crypto policy is now being written by whichever agency moves first. Boring but true.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://unchainedcrypto.beehiiv.com/p/bitcoin-s-midterm-bounce-meets-a-terrible-day-on-wall-street"}, {"id": 6, "cat": "crypto", "urgency": "watch", "source": "Unchained / Laura Shin", "title": "Base blocks go from 2s to 200ms; Zcash NU7 cuts block time 75s to 25s and burns 60% of fees", "idea": "Base's Denim upgrade makes blocks every 200ms. Zcash NU7 (block 3,543,405) removes 60% of block fees from circulation, miners keep 40%, block time 75s -> 25s, rewards divided by three. ZetaChain votes to shut its chain on Dec 9 and move ZETA to Solana 1:1.", "angle": "L2 latency is converging with CEX matching engines. Meanwhile a whole L1 is being retired into Solana, consolidation tell.", "tweetA": "Base at 200ms blocks. A chain you can use faster than most brokerage UIs refresh. The question stops being 'can L2s compete with CEXs' and becomes 'what is left for the CEX to be good at'. $COIN", "tweetB": "ZetaChain is voting to turn off its own blockchain and migrate to Solana. Not a fork, a shutdown. How many L1s with sub-$1B caps are one board vote from the same decision?", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://unchainedcrypto.beehiiv.com/p/bitcoin-s-midterm-bounce-meets-a-terrible-day-on-wall-street"}, {"id": 7, "cat": "AI/infra", "urgency": "watch", "source": "Unchained / Laura Shin", "title": "IREN mining revenue -58% QoQ to $28M as it pivots to AI cloud with $6B capex still unfinanced", "idea": "IREN's September-quarter BTC mining revenue was $28M, down 58% QoQ. It pushed its $4B AI cloud goal into 2027 with $6B of capex yet to be financed. Mining to be immaterial through 2027.", "angle": "The miner-to-AI-landlord trade now needs capital markets at exactly the moment AI credit spreads are widening.", "tweetA": "IREN: $28M of mining revenue, $6B of capex still to be financed, and a $4B AI target slipping to 2027. The pivot story needed cheap credit. Cheap credit just got repriced. $IREN", "tweetB": "Boockvar notes IREN is up premarket after reporting. Funny: the market pays for the pivot and ignores the financing gap, until it doesn't. Which miners have signed leases vs. slides?", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://unchainedcrypto.beehiiv.com/p/bitcoin-s-midterm-bounce-meets-a-terrible-day-on-wall-street"}, {"id": 8, "cat": "regulation", "urgency": "watch", "source": "Unchained / Laura Shin", "title": "Hong Kong passes CARF tax reporting; Ukraine's central bank opposes its own crypto bill", "idea": "Hong Kong lawmakers passed the OECD Crypto-Asset Reporting Framework into law, with data collection starting 2027 and sharing in 2028. Ukraine's NBU says it can't back the virtual assets bill as drafted, citing regulatory arbitrage and monopolization under a single regulator; plenary vote planned for November.", "angle": "CARF going live in 2027-28 ends the offshore reporting gap for a large part of the world, with the US conspicuously not in it.", "tweetA": "Hong Kong just wired itself into CARF. 2027 collection, 2028 sharing. Every exchange customer in a participating jurisdiction becomes a tax data point. Crypto's privacy premium is about to be priced into jurisdictions, not coins.", "tweetB": "A central bank blocking its own country's crypto law is a better signal than any ETF flow. Ukraine, a country at war that actually uses crypto, is still stuck on who gets to license it.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://unchainedcrypto.beehiiv.com/p/bitcoin-s-midterm-bounce-meets-a-terrible-day-on-wall-street"}, {"id": 9, "cat": "venture", "urgency": "watch", "source": "Unchained / Laura Shin", "title": "Uranium Digital raises $16.5M (Blockchain Capital); Lombard raises $4M for Delivery-versus-Lock collateral", "idea": "Uranium Digital's Series A is $16.5M led by Blockchain Capital to give institutions uranium market access. Lombard Systems raised $4M for a Delivery-versus-Lock standard letting tokenized assets be pledged as collateral while staying in existing securities accounts. Soter Insure added SC Ventures and SBI to its Series B.", "angle": "Two pieces of the tokenization stack at once: a commodity wrapper (uranium) and a collateral mobility layer.", "tweetA": "A crypto VC just put $16.5M behind uranium market access. Nuclear demand is the AI trade's second derivative, and the tokenized wrapper is how funds get exposure without a physical warehouse. $URA $CCJ", "tweetB": "Delivery-versus-Lock is the boring idea that matters: pledge the asset without moving it. Collateral mobility is where tokenization saves real money, not 24/7 trading.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://unchainedcrypto.beehiiv.com/p/bitcoin-s-midterm-bounce-meets-a-terrible-day-on-wall-street"}, {"id": 10, "cat": "AI/infra", "urgency": "act", "source": "Morning Minute / Lucky Trader", "title": "SOXX -12%, worst day since March 2020: MU -17.5%, AMD -17.3%, MRVL -16.4%; Mag 7 shed ~$1T", "idea": "The iShares Semiconductor ETF fell more than 12%. Micron -17.5%, AMD -17.3%, Marvell -16.4%, Nvidia -9.3%. Nasdaq closed in correction, >10% below last month's record. VIX hit 28.09, highest since March. US equities lost ~$3T, more than the entire crypto market cap.", "angle": "A 12% sector day with a political catalyst, not an earnings one. Dispersion inside semis (NVDA -9 vs MU -17) shows memory is the weak hand.", "tweetA": "US stocks lost more in a session than the entire crypto market is worth. The trigger was the pricing of data-center scrutiny, not earnings. I keep thinking about that mismatch. $SOXX $NVDA", "tweetB": "NVDA -9.3%, MU -17.5%. The market sold the cyclical memory first and the monopoly second. That is the order you sell when you think capex growth, not capex level, has peaked.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://luckytrader.substack.com/p/bitcoin-erases-election-rally-as"}, {"id": 11, "cat": "macro", "urgency": "act", "source": "Morning Minute / Lucky Trader", "title": "Same election, two opposite reads in two sessions: December hike odds fall to 70.1% from 82.7%", "idea": "Wednesday: Democratic Congress read as bullish, best stock day in three months, Trump posted 'record high'. Thursday: market flipped on data-center scrutiny. December hike odds dropped to 70.1% from 82.7%. October jobs report Friday is next.", "angle": "The market is trading a Fed that is still hiking while equities fall 4%+. Hike odds at 70% after a six-sigma equity move is the asymmetry.", "tweetA": "A 4.4% S&P drop and the market still gives a December HIKE a 70% probability. Something has to give: either the Fed ignores a six-sigma equity day, or the curve is wrong. Payrolls today is the tiebreaker.", "tweetB": "Wednesday: blue wave is bullish. Thursday: blue wave is bearish. Same fact, 24 hours. If the market can't hold a view for a day, size down and wait for the print.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://luckytrader.substack.com/p/bitcoin-erases-election-rally-as"}, {"id": 12, "cat": "crypto", "urgency": "deep", "source": "Morning Minute / Lucky Trader", "title": "The privacy trade held: ZEC -1.8%, XMR -4% vs ETH -8%; YTD ZEC +148.7% vs BTC -13.4%", "idea": "In the Thursday selloff Zcash fell 1.8% and Monero 4%, both up on the week. YTD: ZEC +148.7%, XMR +42.4%, BTC -13.4%, ETH -24.8%. ZEC trades ~ $1,320. Meanwhile NU7 permanently freezes ~12,224 ZEC in the old Sprout pool.", "angle": "Privacy is the only crypto sector with positive YTD alpha. It is also where CARF and hack-freeze headlines point the other way.", "tweetA": "ETH -24.8% YTD, BTC -13.4%, ZEC +148.7%. The only crypto sector with a bid is the one regulators and CARF are designed to squeeze. Either that is the strongest contrarian signal in the market, or a very crowded one. $ZEC $XMR", "tweetB": "Unchained today: Hong Kong signs up to CARF and 'if crypto can be frozen, is it yours?' is the recommended read. Zcash +149% YTD is the market voting on that question.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://luckytrader.substack.com/p/bitcoin-erases-election-rally-as"}, {"id": 13, "cat": "regulation", "urgency": "deep", "source": "Morning Minute / Lucky Trader", "title": "House Oversight chair-to-be Garcia: Trump family crypto probe starts with WLFI, possibly February", "idea": "Rep. Robert Garcia, expected to chair House Oversight, said the committee will investigate the Trump family's business dealings including crypto ventures, WLFI likely among the first, possibly starting in February. Trump-backed American Bitcoin swung to a $126M Q3 profit on a $197M BTC gain.", "angle": "Political-beta of the trade: WLFI, American Bitcoin and anything Trump-adjacent now has a subpoena clock.", "tweetA": "American Bitcoin: $126M profit, of which $197M was a mark-to-market BTC gain. Strip it out and that's a loss. Now add a House Oversight subpoena in February. That is not a hedge, it is a leveraged BTC position with legal beta. $BTC", "tweetB": "WLFI +5% on the day Democrats announced they will investigate it. Alts that rally on bad political news are telling you who is on the other side of the trade.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://luckytrader.substack.com/p/bitcoin-erases-election-rally-as"}, {"id": 14, "cat": "geopolitics", "urgency": "deep", "source": "Morning Minute / Lucky Trader", "title": "PBoC halts Solana's 'Accelerate China 2026' events in Shanghai, probes domestic advertisers", "idea": "China's central bank said it halted Solana's planned events in Shanghai and other cities and will investigate the domestic entities that placed advertising in the Lujiazui financial district. Solana Labs separately launched Leap, a mobile app for trading tokenized stocks, ETFs, metals, FX and crypto.", "angle": "Beijing is enforcing the crypto ban on foreign marketing in real time. Tokenized-everything apps like Leap are exactly what it fears.", "tweetA": "The PBoC didn't just ban Solana events in Shanghai, it opened a probe into whoever bought the ads in Lujiazui. That's an enforcement signal to every foreign protocol: the domestic partner is the liability. $SOL", "tweetB": "Same day Solana Labs ships a 24/7 trading app for tokenized stocks and metals. Both sides are escalating: US regulators approve perps by statement, China shuts the front door.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://luckytrader.substack.com/p/bitcoin-erases-election-rally-as"}, {"id": 15, "cat": "positioning", "urgency": "act", "source": "Morning Minute / Lucky Trader", "title": "BTC ETFs -$430M, ETH ETFs -$100M; gold -1% at $4,080, oil +2% at $90", "idea": "Bitcoin ETFs saw $430M net outflows Thursday, ETH ETFs $100M. Overnight: BTC $76.1K, ETH $2,240, SOL $90.5, HYPE $78.80; oil +2% at $90; gold -1% at $4,080. Hyperliquid led onchain revenue at $2.72M/day, Pump.fun $1.35M.", "angle": "Gold fell in the risk-off day. That's the margin-call signature: you sell what has gains.", "tweetA": "Gold -1%, BTC -4%, oil +2% at $90 on a day the S&P fell 4.4%. The only thing that went up was the thing tied to the Iran war. That's not a flight to safety, it is a margin call. $GLD $USO", "tweetB": "$430M out of spot BTC ETFs on the worst tape in 18 months is small. The $1.26B that actually got flushed was in perps. Different crowd, different pain, and it is the perp crowd that sets the price.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://luckytrader.substack.com/p/bitcoin-erases-election-rally-as"}, {"id": 16, "cat": "positioning", "urgency": "act", "source": "SixSigma Research / SixSigmaCapital", "title": "Pods and desks shut down after risk limits breached in the largest Nasdaq points drop in history", "idea": "Yesterday triggered aggressive closures and cutbacks across several prominent hedge fund pods and trading desks as strict risk limits were breached. Today is 'largely an expected bounce' after the historic washout. Author promises a near-term game plan for returning volatility (paywalled).", "angle": "Pod risk limits turn a 6-sigma move into forced selling the next day too. Expect forced de-grossing prints in the data.", "tweetA": "Pods get closed at risk limits, not at valuation. A 6-sigma day means a Monday of forced sellers who don't care about the thesis. That is when the bid shows up for people who do. Wait for the flush, not the headline.", "tweetB": "Everyone is asking if the AI trade is over. The better question: how many multi-manager pods own the same 40 chip names, and who is left to cover after the stop-outs?", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://sixsigmaresearch.com/p/markets-in-turmoil"}, {"id": 17, "cat": "credit", "urgency": "deep", "source": "The Dark Side Of The Boom / Stephen Innes (Barclays)", "title": "Barclays: AI capex moves from prisoner's dilemma to war of attrition; ~80% of pipeline under Democratic governors in 2027", "idea": "Barclays credit (Toublan, Ortega): ~80% of the high-probability US data-center pipeline falls under Democratic governors in 2027 vs <30% in 2026. Projects get slower and pricier rather than cancelled. AI has moved from trading inside IG to a substantial spread premium. Pressure on neoclouds, speculative pipelines and parts of semis.", "angle": "80% vs <30% is the number. It converts a political result into a financing-cost shock for development debt.", "tweetA": "30% of the data-center pipeline sits under Democratic governors in 2026. In 2027 it's 80%. That is a permitting-cost curve step function, and the credit market has already started charging for it. $ORCL $CRWV", "tweetB": "Prisoner's dilemma is when everyone must spend. War of attrition is when the one with grid access and a clean balance sheet wins by waiting. That is the best argument for owning the hyperscaler over the neocloud.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/the-ai-war-of-attrition-when-power"}, {"id": 18, "cat": "macro", "urgency": "act", "source": "The Boock Report / Peter Boockvar", "title": "No December hike; peak AI capex likely 2027; 'would investors still pay $1.5T for Anthropic?'", "idea": "Boockvar now believes the Fed will not hike in December (odds 68% vs 84% Monday) even with a bounce, because peak capex comes sooner, likely 2027. Markets respond to rate of change, not level: capex growth next year can exceed this year and still disappoint. He highlights a chart (LSEG) of AI ecosystem interlinks and the wealth effect on consumer spending.", "angle": "The Fed reaction function now has an AI-equity term. Rate-of-change framing is the cleanest way to explain why capex up 20% can still be a short.", "tweetA": "Capex can grow 25% next year and still be the peak of the cycle. Stocks price the second derivative. If hyperscaler guides go from +40% to +25% the AI complex re-rates even as the dollar amount hits a record. $NVDA $AVGO", "tweetB": "A Fed that hikes into a 40% drawdown in the leading sector, at 68% odds? That's a bet that the wealth effect holds. If AI equities are that large a share of household wealth, the Fed is setting policy for Nvidia holders.", "charts": {"count": 1, "hot": true, "desc": "LSEG chart of AI ecosystem interlinks (circular financing web). 🔥 CHART WORTH SAVING"}, "link": "https://peterboockvar.substack.com/p/i-dont-think-they-hiketime-to-revisit"}, {"id": 19, "cat": "venture", "urgency": "watch", "source": "The Boock Report / Peter Boockvar", "title": "Anthropic at $1.5T (down from $2T): the private mark vs the public tape", "idea": "Boockvar asks aloud whether investors are still willing to pay $1.5T for Anthropic, down from $2T, after the tech damage. He also notes neocloud IREN rallying premarket after a drubbing.", "angle": "Private marks lag public tape. A $500B markdown in private AI valuation is bigger than most public AI names.", "tweetA": "A $2T to $1.5T private mark is a $500B hole on a single lab. Public AI stocks are -40% from peak, the private mark is -25%. One of those prices is stale, and it isn't the one that trades daily.", "tweetB": "The test is the next secondary: if it prices below the last round, every AI fund's NAV marks come under pressure at once. Public AI stocks are -40% from peak. Private marks are down 25%. Guess which one converges.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://peterboockvar.substack.com/p/i-dont-think-they-hiketime-to-revisit"}, {"id": 20, "cat": "positioning", "urgency": "watch", "source": "Macro Musings / Danny D", "title": "'Most Important Chart in World' fires its short-term signal again", "idea": "Danny Dayan posts a new reading of his proprietary short-term indicator, with the signal embedded as a chart and links to three prior posts. He stresses it is a short-term signal, not a long-term one. Body text is minimal; chart carries the content.", "angle": "Short-term mean-reversion signal during a capitulation window. Worth opening to see which direction it flags.", "tweetA": "After a 6-sigma day, every short-term signal is saying the same thing. The useful part is how many fire at once. Today's the first day in months where several of them agree. Watch which ones fail on the bounce.", "tweetB": "Reminder to myself: a short-term signal tells you where to look, not what to own. I've been wrong by treating a bounce signal as a bottom call. Size accordingly.", "charts": {"count": 1, "hot": false, "desc": "Indicator chart in article, not shown in email text. Charts inside, worth opening."}, "link": "https://dannydayan.substack.com/p/most-important-chart-in-worldonce"}, {"id": 21, "cat": "macro", "urgency": "act", "source": "Early Morning with Dave / David Rosenberg", "title": "Three bad bets: war is ending, tariffs are done, AI capex cooling means a dovish Fed", "idea": "Rosenberg: the market made three faulty assumptions Wednesday: the President backs off the war and energy relief arrives (but Iran still controls the Strait of Hormuz); no more negative trade actions (but Section 301 is still in his hands); and a cooling of AI capex will soften the Fed's hawkish stance.", "angle": "Disagrees with Boockvar's chain (capex -> no hike). Three catalysts each unresolved.", "tweetA": "Everyone is long the 'peace dividend' trade. Iran still holds the Strait of Hormuz and Section 301 is entirely within executive discretion. Two of three bullish assumptions don't need Congress to reverse. $USO $SPY", "tweetB": "Boockvar says weak AI means no December hike. Rosenberg says don't count on it. Both can't be right and payrolls is the tiebreaker. I'm trading the print, not the narrative.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.earlymorningwithdave.com/p/rotation-morphs-into-capitulation"}, {"id": 22, "cat": "positioning", "urgency": "act", "source": "Early Morning with Dave / David Rosenberg", "title": "VIX 28: 'dial me up at 35'; the average AI stock is now down nearly 40% from peak", "idea": "Rosenberg's headline: rotation morphs into capitulation. VIX surged to 28; he says true capitulation is a 35 reading. The average AI stock is down nearly 40% from its peak.", "angle": "A 40% average drawdown with index only -10% means breadth inside AI is already in bear territory; the index is carried by the few.", "tweetA": "Average AI stock: -40% from peak. Nasdaq: -10%. Same sector, two different markets. Index drawdowns hide what the median holder just lived through.", "tweetB": "VIX at 28 and Dave wants 35. This sell-off has a policy catalyst that does not reset in two weeks. Vol spikes that come from a one-day flush mean-revert; vol from a regime change grinds.", "charts": {"count": 1, "hot": false, "desc": "Charts in article (paywalled)."}, "link": "https://www.earlymorningwithdave.com/p/rotation-morphs-into-capitulation"}, {"id": 23, "cat": "AI/infra", "urgency": "deep", "source": "Exponential View / Azeem Azhar", "title": "43 of 44 local data-center restriction measures passed; $2.5T wiped from the Nasdaq", "idea": "Voters passed 43 of 44 local measures to slow data centers. More than $2.5T came off the Nasdaq as investors fled the picks-and-shovels trade. Azhar's read: the revolt is the 'sanest thing' to happen to the build-out, and data centers were less popular than ICE. Vance says the war and gas prices mattered more than data centers.", "angle": "43/44 is a 98% loss rate for developers at the ballot box. The sector had no political strategy.", "tweetA": "43 of 44. That's the score for data centers at the ballot box. A sector spending hundreds of billions a year had no community-benefit playbook, and now the playbook costs a discount to everyone's multiple. $SMCI $VRT", "tweetB": "Vance says the election was about the war, prices and gas. Data centers were on the ballot and lost almost everywhere anyway. When voters vote on the thing you didn't think they'd vote on, that's a signal for any sector with local externalities: nuclear, solar, LNG.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.exponentialview.co/p/dont-waste-a-good-backlash"}, {"id": 24, "cat": "AI/infra", "urgency": "deep", "source": "Exponential View / Azeem Azhar", "title": "Time to power is the whole game: shell takes 18-24 months, grid connection averages four years", "idea": "A B300 earns ~$8/hr (Silicon Data) and can pay for itself in under a year. A 1GW site holds ~400,000 B300s, costs ~$40B; opex is under 2.5% of capex (~$800M/yr), two-thirds of it electricity. The shell takes 18-24 months, the average US power connection wait is four years. 'Until electrons flow no money can flow.'", "angle": "$8 x 400k x 8,760h = ~$28B/yr gross at full utilization. Every year of queue delay is ~$28B of foregone revenue per GW.", "tweetA": "$8/hr x 400,000 B300s x 8,760 hours = $28B a year per gigawatt. Electricity is two-thirds of a $800M opex bill. Power price is noise; the queue is the cost. $VST $CEG", "tweetB": "A 4-year wait for grid connection vs 18-24 months to build the shell: the scarce asset is a signed interconnection agreement. That's why the AI landlord with power already on is worth more than the one with chips ordered.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.exponentialview.co/p/dont-waste-a-good-backlash"}, {"id": 25, "cat": "regulation", "urgency": "deep", "source": "Exponential View / Azeem Azhar", "title": "Lanarkshire template: $100K per MW per year to the community, 3% of council income", "idea": "DataVita agreed to pay up to $100,000 per MW per year to a local fund; at 500MW it is $50M/yr, a 3% boost on North Lanarkshire's £1.17bn ($1.58bn) income, up to £543m over 15 years. Oracle's New Mexico package totals ~$205m after stripping build costs = ~$84,000 per MW one-off, about 18x stingier. $100m per GW is 0.2% of what a GW can rent for at surge prices.", "angle": "A community-benefits levy at 0.2-1% of revenue is rounding error for hyperscalers, and the cheapest political insurance available.", "tweetA": "$100M per gigawatt to the local community is 0.2% of what that GW rents for at surge prices. The industry just spent 2 years fighting something that costs rounding error. $ORCL $MSFT", "tweetB": "Oracle's New Mexico package works out to ~$84K per MW one-off. Lanarkshire is $100K per MW per year. Over 15 years that is a $3.5B difference. Expect the next ballot measure to cite the Scottish number.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.exponentialview.co/p/dont-waste-a-good-backlash"}, {"id": 26, "cat": "labor", "urgency": "deep", "source": "Exponential View / Azeem Azhar", "title": "Data centers create ~16-20 permanent jobs per $1B; Meta Louisiana: capex 5x, staff 2x to 1,000", "idea": "Meta's Louisiana data-center investment grew five-fold to $50B while permanent staff only doubled to 1,000, about 20 per billion. Anthropic's $50B New York/Texas builds bring 800 permanent jobs, 16 per billion. Lanarkshire plans ~600 jobs for 'AI researchers and coders' on top of ~220 operational. Chart shows jobs-to-capital far below modern manufacturing.", "angle": "This is the political weakness: $50B in capex, 1,000 jobs. Construction crews leave after 2 years.", "tweetA": "$50B of capex, 1,000 permanent jobs. Azhar's chart puts data centers far below modern manufacturing on jobs per dollar. First mega-project class that voters see as pure extraction, and the polling is starting to show it.", "tweetB": "Meta Louisiana: capex 5x, staff 2x. Capital deepening in its purest form, and labor's share shrinks to a rounding error. When the voters notice, they don't vote on productivity, they vote on the water bill.", "charts": {"count": 1, "hot": true, "desc": "Jobs-to-capital chart comparing data centers vs manufacturing. 🔥 CHART WORTH SAVING"}, "link": "https://www.exponentialview.co/p/dont-waste-a-good-backlash"}, {"id": 27, "cat": "AI/infra", "urgency": "watch", "source": "Exponential View / Azeem Azhar", "title": "SpaceX 'surge' compute deals with Anthropic and Google earn nearly $50B per GW per year", "idea": "Infrastructure companies can make $10-40B per gigawatt of energized AI compute; SpaceX's surge deals with Anthropic and Google earn nearly $50B per GW per year. Scarcity pricing means the buyer pays for speed.", "angle": "Spot $28B (from B300 math) vs $50B surge: the premium paid for time-to-power is almost 2x.", "tweetA": "$50B per GW per year at surge pricing vs ~$28B at $8/hr list. The premium for being energized NOW is almost 80%. That's the price of a four-year grid queue, expressed in compute.", "tweetB": "SpaceX renting compute to Anthropic and Google is the strangest line in this week's notes. The AI labs have chips and demand but nowhere energized to put them; whoever has sockets sets the price.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.exponentialview.co/p/dont-waste-a-good-backlash"}, {"id": 28, "cat": "tech", "urgency": "deep", "source": "Market Sentiment", "title": "Alphabet -13% post-earnings, worst day since 2004 IPO: Search slows, AI Mode monetizes worse, Cloud +103%", "idea": "GOOG fell ~13% after earnings, wiping nearly half a trillion. Search growth slowed; CBO Schindler said AI Mode growth carried 'lower monetization'. Cloud grew 103% on a $15B base, with $561B of signed contracts (~90% of next two years' revenue). Base-case SOTP: Search ~$1.7T (50% of $3.5T cap), Cloud ~$1T; ~80% of EV is Search + Cloud.", "angle": "The bear case (AI answers eat ad clicks and can't be monetized) was just confirmed by management in plain language.", "tweetA": "Management said the quiet part: AI Mode queries monetize worse than Search. Cloud doubling on a $15B base is great, but at $561B of backlog it is a utility. The question is whether you pay a utility multiple for the search ad business. $GOOGL", "tweetB": "Search worth $1.7T, Cloud worth $1T. Cloud grows 103% and the stock drops 13%. The market is saying that the ad business was valued as if AI had no cost to it, and now it does.", "charts": {"count": 1, "hot": false, "desc": "DCF/SOTP tables in article (model Excel at the end). Charts inside, worth opening."}, "link": "https://www.marketsentiment.co/p/notes-on-google"}, {"id": 29, "cat": "AI/infra", "urgency": "deep", "source": "Market Sentiment", "title": "Memory contracts rest on 10-30% prepayments; in a 50% price crash, buyers walk and forfeit", "idea": "Memory ETF down 40% in a month. Long-term memory agreements (SK Hynix, Samsung) typically rest on a 10-30% prepayment; if prices crash 50%+ (like 2019, 2022), forfeiting the prepayment and buying on the spot market is more profitable. That is why low forward P/Es don't mean cheap: 'E' is unpredictable.", "angle": "The LTA is a put option the buyer owns. At a 50% price drop the forfeit is 10-30% of contract vs 50% savings.", "tweetA": "A long-term memory contract with a 10-30% prepayment is a put option on memory prices, owned by the customer. If spot falls 50%, walking away and paying the forfeit is the cheaper choice. Forward P/E on memory is built on a contract that isn't binding. $MU $000660.KS", "tweetB": "The memory ETF is -40% in a month and people are buying the low forward P/E. Cyclicals look cheapest at peak earnings. What matters is whether the prepayment holds in a downturn.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.marketsentiment.co/p/notes-on-google"}, {"id": 30, "cat": "positioning", "urgency": "deep", "source": "Market Sentiment", "title": "'The election will curtail AI is pure panic' vs the DeepSeek day; portfolio -17% vs QQQ -15%, SOXX -33%", "idea": "Over a month S&P -5%, Nasdaq -14%, memory ETF -40%. The author calls the 'curtail AI buildout' narrative panic: companies can shift data centers abroad, nobody will hand the lead to China, and it echoes DeepSeek (NVDA -17% next day, forgotten). Rotating to staples at Walmart P/E 46 and Costco 51 is selling low and buying high. Still ~20% memory, 15% advanced packaging, 20% ASICs.", "angle": "The real disagreement with Barclays: delay vs. cancellation.", "tweetA": "Walmart at 46x and Costco at 51x are the 'safe' rotation targets. Selling a beaten-down semi to buy a 50x staple after the crash is not defensive, it is paying the highest multiple on the board for the label. $WMT $COST", "tweetB": "DeepSeek day: NVDA -17%, forgotten in a month. Election day: SOXX -12%. Those two aren't the same shock. One was about demand, this one is about supply, permits and power. Supply shocks last longer.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.marketsentiment.co/p/notes-on-google"}, {"id": 31, "cat": "labor", "urgency": "deep", "source": "The Daily Feather / Danielle DiMartino Booth", "title": "Defense hiring plans >4,000 every month Jul-Oct, unprecedented; layoffs at 51 QTD, lowest since 1993", "idea": "Challenger hiring plans averaged 8,346 in Q4 2026 so far, second only to Q4 2019's 9,111. Aerospace/defense hiring plans exceeded 4,000 in each month from July to October, an unprecedented streak. Job cuts at 51 quarter-to-date would be the lowest run rate since Challenger's 1993 inception (prior low: 70 in Q2 2022).", "angle": "Labor 'low hire, low fire' with defense carrying the hiring. This is the war economy in the data.", "tweetA": "Layoff announcements at 51 for the quarter, a record low since 1993, and aerospace/defense hiring plans above 4,000 every month since July. Equities are in a 6-sigma crash and the labor data says defense is still hiring. $LMT $RTX", "tweetB": "If payrolls are 82k and defense is the marginal hirer, then Boockvar's 'AI peak capex so no hike' needs a second leg: the real economy isn't weakening the way the Nasdaq is.", "charts": {"count": 1, "hot": true, "desc": "Green/red bars: hiring plans vs job cuts (Challenger) by quarter. 🔥 CHART WORTH SAVING"}, "link": "https://dimartinobooth.substack.com/p/the-daily-feather-historic-defense"}, {"id": 32, "cat": "positioning", "urgency": "watch", "source": "Macro Charts", "title": "Capitulation checklist: 'stocks are moving into a classic capitulation'", "idea": "Macro Charts posts a market update on signals for a major bottom: capitulation checklist, 'how markets bottom' playbook, and a signal tracker. Message: noise is at a climax, ignore it, and experience and patience shine. Full signal tables are behind the link.", "angle": "Bottoms don't come with a green light. Checklists work when multiple boxes tick: breadth, vol, put/call, sentiment.", "tweetA": "Capitulation is a process, not a day. First washout, then bounce, then a retest on lower volume. If today's bounce goes straight up, the checklist isn't done. I've been burnt buying the first green day.", "tweetB": "Rosenberg wants VIX at 35. Macro Charts says capitulation is happening now. The gap between those two views is the trade: do you buy 28 or wait for 35 and risk missing it?", "charts": {"count": 1, "hot": false, "desc": "Signal tracking charts in article. Charts inside, worth opening."}, "link": "https://www.macrocharts.com/p/market-update-and-signals-11626"}, {"id": 33, "cat": "macro", "urgency": "deep", "source": "Big Moves / Robert Marsh", "title": "S&P fell >6 standard deviations; a 5-sigma-above-200dma study shows positive six-month returns", "idea": "S&P and Russell 2000 slipped >4% and NDX >6%, taking out its 200-day. The S&P drop was over six standard deviations. A query widening to 5 sigma with the S&P above its 200-day shows positive historical six-month returns. Marsh: baselines, not predictions. Historical lookalikes: 1955, 1986, 1989, 1997, 2018.", "angle": "The study works when the trend backdrop is intact, which is the open question after a Nasdaq 10% correction.", "tweetA": "Six standard deviations. The S&P has had few of those and the six-month forward returns after similar washouts above the 200-day were positive. Positive. Not 'buy everything'. $SPY", "tweetB": "Look at the list of analogs: Eisenhower's heart attack, UAL's failed LBO, Volmageddon, Brexit. All had a clear catalyst that was resolved or digested. This one is a policy regime change that takes 12 months to play out.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://bigmoves.substack.com/p/big-moves-november-5-2026"}, {"id": 34, "cat": "AI/infra", "urgency": "deep", "source": "Big Moves / Robert Marsh", "title": "UBS: ~30% of 2028 data-center power additions face grid and permitting risk; Micron paused a $4.5B Taiwan plant", "idea": "Catalysts cited: UBS warned roughly 30% of projected 2028 data-center power additions face bottlenecks and permitting risk; Qualcomm weak handset forecast; Micron paused a $4.5B Taiwan plant. ADI -11.1%, TSM -10.8%, IRM -11.1% (guidance below estimates despite data-center growth), ROK -14% (FY27 midpoint miss).", "angle": "Supply side: 30% of 2028 power additions at risk is a capex-delay number you can model into 2028 revenue.", "tweetA": "UBS: 30% of 2028 data-center power additions are at risk. If power is the bottleneck, you can't ship chips into empty buildings. The 2028 numbers for every GPU vendor get a haircut before the 2026 numbers do. $NVDA $TSM", "tweetB": "Iron Mountain raised revenue guidance and fell 11% because it was below estimates, and it's a data-center name. The market is asking for acceleration, not growth. Same for Rockwell and ADI.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://bigmoves.substack.com/p/big-moves-november-5-2026"}, {"id": 35, "cat": "culture", "urgency": "watch", "source": "Big Moves / Robert Marsh", "title": "Consumer split: AppLovin +31%, Krispy Kreme +31%, Warby Parker +22.5% vs Dutch Bros -21%, Root -19%", "idea": "AppLovin +31% on faster ads growth from a hybrid RecSys/LLM system. Krispy Kreme +30.7% on turnaround. Warby Parker +22.5%, with smart-glasses pre-orders next week. Dutch Bros -21.4% after narrowing its sales outlook; traffic growth modest, management cited consumer volatility. Root -19%: Direct channel competition.", "angle": "Idiosyncratic beats in the middle of a crash: earnings are being rewarded 20-30% even in a -4% tape.", "tweetA": "On a day the S&P lost 4.4%: AppLovin +31%, Krispy Kreme +31%, Warby Parker +22%. When an earnings beat gets a 30% pop in the middle of a crash, the market isn't indiscriminate, it's rewarding anything not tied to capex. $APP $DNUT", "tweetB": "Dutch Bros -21% citing 'consumer volatility' and modest traffic. Warby Parker is launching smart glasses. One is a $7 coffee, the other a $500 lens. Pick the consumer you think is still spending.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://bigmoves.substack.com/p/big-moves-november-5-2026"}, {"id": 36, "cat": "macro", "urgency": "deep", "source": "The Dark Side Of The Boom / Stephen Innes (Bloomberg's Simon White)", "title": "Curve flattened >40bp since October as excess liquidity shrinks: semis are the most exposed sector", "idea": "Simon White: excess liquidity has been shrinking for three months; the Treasury curve flattened more than 40bp since early October. Semiconductors are the most vulnerable sector to a flatter curve, and despite a 30% drawdown they remain among the most crowded trades. Real estate and consumer durables are the contrarian beneficiaries.", "angle": "Flattener + liquidity drain is a cleaner explanation for the sell-off than the election. Politics was the trigger, liquidity the fuel.", "tweetA": "The curve has flattened 40bp since early October and excess liquidity has been shrinking for 3 months. The election is the headline; liquidity was the loaded gun. Semis were the most crowded thing in the room. $SMH", "tweetB": "Everyone is hunting for the next AI-safe hedge. Simon White says real estate and consumer durables, the sectors that benefit from a flat curve. That's the ugly trade nobody wants: buy homebuilders after the day chips fell 12%. $XHB", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/the-ai-trade-meets-its-next-nemesis"}, {"id": 37, "cat": "macro", "urgency": "act", "source": "The Dark Side Of The Boom / Stephen Innes", "title": "SOX implied vol 60%+ vs USD/JPY 6.5%: chips are a five-alarm fire, FX is waiting for the kettle", "idea": "Philadelphia semiconductor index 1M implied vol is 60%+; USD/JPY is ~6.5%. DXY holding 101.50-102.50. One-week dollar deposits near 4%. Short-dated US rates have fallen close to 50bp since late September. EUR/USD can't catch a bid because European hedge ratios are low and proceeds are left in dollars. Express risk-off through AUD/JPY.", "angle": "A 9x vol gap says FX is not yet pricing recession. The cleanest cross-asset divergence on the screen.", "tweetA": "SOX implied vol 60%. USD/JPY 6.5%. Nine to one. One of those two markets is wrong about the economy, and I know which one has the leverage. $USDJPY $SOXX", "tweetB": "EUR/USD can't rally on the worst US equity day in 18 months. European investors didn't hedge, so they aren't unwinding hedges, and they're leaving cash in dollars. That's not a euro story; it's a 4% T-bill story.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/fx-daily-tech-collapses-and-fx-doesnt"}, {"id": 38, "cat": "labor", "urgency": "act", "source": "The Dark Side Of The Boom / Stephen Innes", "title": "October payrolls whisper 82K vs September's 29K, the data that decides the December hike", "idea": "Whisper for today's October payrolls is ~82,000, up from September's 29,000. A respectable print supports the Fed's 'solid' description and the December hike. Oil's collapse earlier this week improved the inflation outlook, but the Fed won't rewrite its playbook because semi investors got scared. Equity managers short of cash with big YTD gains are selling to lock in profit.", "angle": "82K in a labor market with layoffs at record lows (DiMartino Booth) is plausible. Dollar bears face a payroll problem.", "tweetA": "Whisper 82K vs 29K last month. Layoff announcements are the lowest since 1993. The labor side says hike; the equity side says no. Today's print is the first clean read on which one the Fed believes. $DXY $TLT", "tweetB": "Equity managers are up YTD, light on cash and short on time to year-end. Selling to protect the scoreboard is not a recession signal. If payrolls print 80K+, the bounce is going to be violent in the other direction.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/fx-daily-tech-collapses-and-fx-doesnt"}, {"id": 39, "cat": "positioning", "urgency": "act", "source": "PauloMacro / Paulo", "title": "Retail fire sale at the open, funds blowing up, S&P -6% from the October high", "idea": "Paulo describes the session as the first really interesting day of the year, kicked off by a total fire sale by retail investors, amid a buzz of funds blowing up; S&P -6% from October highs. Sections on retail, equities & vol, liquidity 'twitching', oil divergence, FX. He admits he doesn't know the bottom.", "angle": "Retail selling the open is a classic capitulation tell. Oil divergence: oil +2% while equities -4% is the unusual piece.", "tweetA": "Retail sold at the open. Funds are blowing up. Oil is bid. Forced selling in equities with an energy shock underneath is an unusual combination. Tells you the dip-buyers hit their limit before the sellers did. $SPY $USO", "tweetB": "Retail bought every dip for 18 months and then sold the open on the first real day. If you want a sentiment tell, that's it: it's the first day the dip bid didn't show up.", "charts": {"count": 3, "hot": false, "desc": "'Bunch of charts' on retail, vol, liquidity and oil divergence. Charts inside, worth opening."}, "link": "https://paulomacro.substack.com/p/whos-left-to-kill"}, {"id": 40, "cat": "macro", "urgency": "watch", "source": "PauloMacro / Paulo", "title": "Theory: Trump wants the market to crash for 6-12 months so a recovery lands before 2028", "idea": "Paulo suggests the President almost seems to want a crash over the next 6-12 months in order to blame the Democrats and set up a recovery into the 2028 election that plays to recency bias. Offered as political framing; no data cited in the preview.", "angle": "If true, the policy reaction function changes: no stimulus put, no tariff relief until the crash is attributable to the other party.", "tweetA": "If the White House believes it benefits from a drawdown now and a recovery in 2028, there is no 'Trump put'. The put is on a 2028 date, and in between you hold the bag. That changes how I size.", "tweetB": "Voters blamed the war, gas and cost of living for the midterm. Markets blame the new Congress for the crash. Both narratives are politically useful to somebody. Pay attention to who benefits from each.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://paulomacro.substack.com/p/whos-left-to-kill"}];
