<script>
const ITEMS = [{"id": 1, "cat": "macro", "urgency": "deep", "source": "Stephen Innes / Dark Side of the Boom", "title": "Democrats sweep Washington, oil collapses, Nasdaq rips and dumps - and FX barely moves", "idea": "Innes: between the blue wave, the oil collapse, the AI liquidation and Friday's tech rebound, FX stayed in its ranges. The dollar 'remains the cleanest dirty shirt'. Blue wave gives bears a political argument, but the Fed hasn't given them a rate trade; Friday's jobs report showed no recession bug. Near-term risk still leaves room for a dollar squeeze higher.", "angle": "Politics moved the equity vol surface, not the rates curve. Until front-end pricing breaks, short USD on the election is a narrative trade without a carry engine.", "tweetA": "Nasdaq 100 -6.4% in a day. DXY shrugged. When equity vol and FX vol disagree by this much, one of them is wrong. I know which one I'd bet on - rates haven't moved yet.", "tweetB": "Everyone is long the 'blue wave = weak dollar' headline. Nobody is long the Fed cutting. Those are not the same trade, and only one of them pays you carry.", "charts": {"count": 0, "hot": false, "desc": "No charts in email body (plain text)"}, "link": "https://thedarksideoftheboom.substack.com/p/fx-weekly-after-the-blue-wave-the"}, {"id": 2, "cat": "macro", "urgency": "deep", "source": "Stephen Innes / Dark Side of the Boom", "title": "AI capex was a dollar-support channel, not just an equity story", "idea": "Innes lays out how the AI boom supported USD through more than Nasdaq inflows: it drew global capital, supported US growth/productivity expectations and kept the Fed more hawkish. Threaten the investment engine and you threaten a pillar of dollar demand. He still sees this as a valuation/timing problem, not a collapse in spend; projects already under construction have momentum.", "angle": "If data-center moratoria bite, the second-order hit is to the US-exceptionalism FX bid, not just semis. That is a covariance shift: long USD / long AI stopped being the same trade.", "tweetA": "The AI trade was never just a stock trade. It was the marginal dollar bid, the productivity story AND the reason the Fed couldn't ease. Pull one thread and three positions unwind.", "tweetB": "Watch the sign flip. For two years USD and AI capex moved together. Midterms just introduced a political veto on one of them. Which one breaks first?", "charts": {"count": 0, "hot": false, "desc": "No charts in email body (plain text)"}, "link": "https://thedarksideoftheboom.substack.com/p/fx-weekly-after-the-blue-wave-the"}, {"id": 3, "cat": "positioning", "urgency": "deep", "source": "Stephen Innes / Dark Side of the Boom", "title": "USD/JPY as AI hedge: correlation at the year's high, price response muted", "idea": "Since early October USD/JPY has fallen on days Nasdaq underperformed the S&P, more so when the gap exceeded 1%. Rolling correlation with AI equity returns is the strongest of the year. Yet Thursday's semis liquidation produced a remarkably restrained currency response: semiconductor implied vol going through the roof while major FX pairs barely stir. Innes: panic hasn't migrated from positioning to macro.", "angle": "The vol gap between semis and FX is the tell. Cheap FX optionality if you think the AI shock goes macro; short USDJPY is the clean express.", "tweetA": "Semis implied vol: through the roof. USDJPY implied vol: asleep. One of these markets is mispricing the second derivative of the AI trade. Cheap yen calls are the free option on being wrong about 'it's just positioning'.", "tweetB": "The yen only works as an AI hedge if growth expectations crack. Thursday was a 6.4% Nasdaq drop and the yen yawned. That's not a failed hedge - it's the market saying it doesn't think the house is on fire yet.", "charts": {"count": 0, "hot": false, "desc": "No charts in email body (plain text)"}, "link": "https://thedarksideoftheboom.substack.com/p/fx-weekly-after-the-blue-wave-the"}, {"id": 4, "cat": "macro", "urgency": "watch", "source": "Stephen Innes / Dark Side of the Boom", "title": "Japan's GPIF lifts domestic bonds to 26.5% - but still buys foreign bonds to stay near 25%", "idea": "GPIF's domestic bond allocation rose to 26.5% in Jul-Sep, with foreign bond purchases keeping that allocation near 25%. Innes notes similar Q2 increases have occurred for six years running, so not proof of repatriation, but the fund has room to shift within its mandate and a formal strategy change may not come before spring 2027. Next breadcrumb: Japan's October international securities transactions on Nov 10.", "angle": "The world's largest pension fund drifting domestic is a slow-moving yen / JGB / UST term-premium variable. Mark Nov 10 in the calendar.", "tweetA": "The biggest pension fund on earth is buying more JGBs at 26.5% and still sells the rest abroad. Repatriation never starts with a headline - it starts with a rebalance band nobody reads. Nov 10 data.", "tweetB": "If GPIF eventually lets domestic bonds drift above 26.5% instead of topping up foreign, who is the marginal buyer of USTs? Hint: not the fund with a hard ceiling that just moved.", "charts": {"count": 0, "hot": false, "desc": "No charts in email body (plain text)"}, "link": "https://thedarksideoftheboom.substack.com/p/fx-weekly-after-the-blue-wave-the"}, {"id": 5, "cat": "macro", "urgency": "deep", "source": "Stephen Innes / Dark Side of the Boom", "title": "Peso carry cushion thins as Mexico gets wired into the US AI supply chain", "idea": "Banxico cut 25bp, guided to stability, and flagged depreciation as an inflation risk while arguing pass-through is limited. Innes sees an asymmetry: a stronger peso invites more easing, moderate weakness doesn't stop it. Mexico's US exports are increasingly machinery/equipment tied to AI infrastructure while vehicles stall, so an AI slowdown hits the real economy, not just sentiment.", "angle": "MXN is a hidden AI-capex derivative. Carry plus AI-capex beta is a worse combination than carry plus auto-export beta.", "tweetA": "Mexico's export mix quietly became an AI capex proxy. Machinery up, autos flat. Short the AI trade? Check whether you're already long it through the peso.", "tweetB": "Carry is a fine travelling companion until vol collects the rent. Banxico is cutting into a currency that has become a levered bet on US data-center construction. Nobody priced that correlation.", "charts": {"count": 0, "hot": false, "desc": "No charts in email body (plain text)"}, "link": "https://thedarksideoftheboom.substack.com/p/fx-weekly-after-the-blue-wave-the"}, {"id": 6, "cat": "macro", "urgency": "deep", "source": "Stephen Innes / Dark Side of the Boom", "title": "Hawkish BoE + wobbly ECB: EUR/GBP downside as a low-equity-beta relative-rate trade", "idea": "BoE delivered a hawkish November message; another hike in February is credible, though markets already price an ambitious cycle through end-2027. Euro faces energy vulnerability, softer data, ECB uncertainty and sovereign credit risk. EUR/GBP has shown much less sensitivity to equity swings this year, making it a cleaner vehicle for the UK vs euro-area policy gap.", "angle": "EUR/GBP as a way to short European energy fragility without Nasdaq hijacking P&L. Also a hedge-in-disguise against a Hormuz re-escalation.", "tweetA": "Short EUR/GBP is a Hormuz hedge that doesn't care what Nvidia does. Cross has gone ex-equity beta this year, which is exactly why I'd use it.", "tweetB": "Everyone's crowded into long-dollar vs euro. The relative-rate trade the pound unlocks is BoE hiking into a euro-area that can't afford what the energy shock already did to its spreads.", "charts": {"count": 0, "hot": false, "desc": "No charts in email body (plain text)"}, "link": "https://thedarksideoftheboom.substack.com/p/fx-weekly-after-the-blue-wave-the"}, {"id": 7, "cat": "geopolitics", "urgency": "deep", "source": "Stephen Innes / Dark Side of the Boom", "title": "Market is pricing a clean Iran exit while tankers are still threatened in the Gulf", "idea": "Innes: the physical risks around Hormuz haven't disappeared because Washington changed colour. The market may be ahead of itself pricing a clean geopolitical exit; euro is most exposed to a renewed oil squeeze via import bills and sovereign spreads. Oil collapsed this week on de-escalation hopes.", "angle": "Asymmetry: de-escalation is in the price, re-escalation isn't. Cheap energy upside and EUR downside.", "tweetA": "Oil fell on 'less confrontational Iran policy.' Hormuz is still a long way from normal. Pricing a political outcome into a physical chokepoint is how you get short gamma in the wrong commodity.", "tweetB": "A new Congress doesn't change what a tanker insurer charges to transit the Strait. Watch freight and war-risk premia, not Washington headlines.", "charts": {"count": 0, "hot": false, "desc": "No charts in email body (plain text)"}, "link": "https://thedarksideoftheboom.substack.com/p/fx-weekly-after-the-blue-wave-the"}, {"id": 8, "cat": "regulation", "urgency": "deep", "source": "Michael Parekh / AI-RTZ", "title": "Midterms turn data centers into a ballot issue: bans in 29+ jurisdictions, governors elected on moratoria", "idea": "Bloomberg via Parekh: Democrats won House and Senate; candidates running on tougher data-center rules won governor races from Texas to Ohio, Georgia and Pennsylvania, leaving about half of proposed US data-center additions open to stricter scrutiny. Gina Hinojosa is Texas's first Democratic governor since 1990 on a moratorium pledge. WaPo: voters passed bans/restrictions in at least 29 jurisdictions. Musk's roughly $446M election spend mostly missed.", "angle": "A political veto joins chips, memory and power as a binding constraint on the buildout. Texas moratorium risk hits the single biggest state for planned capacity.", "tweetA": "Chips. Memory. Power. And now: voters. The AI buildout just added a fourth bottleneck and it's the only one you can't solve with capex. Texas electing a moratorium governor is the headline nobody had in their model.", "tweetB": "29 jurisdictions passed data-center restrictions. Half of proposed capacity is now in play. Moratoria don't repeal demand - they move the crunch to whoever already has permits. Who owns permitted land and interconnects?", "charts": {"count": 0, "hot": false, "desc": "No charts in email body (plain text)"}, "link": "https://michaelparekh.substack.com/p/ai-midterms-ai-shift-anthropics-ipo"}, {"id": 9, "cat": "macro", "urgency": "deep", "source": "Michael Parekh / AI-RTZ", "title": "Nasdaq 100 -6.4% Thursday, $2.3T erased: worst day since 2020", "idea": "Per Bloomberg cited by Parekh, the Nasdaq 100 fell 6.4% on Thursday, erasing a record $2.3 trillion; the selloff spread to Asia on Friday. Innes notes Friday brought a technology rebound.", "angle": "$2.3T gone in a session means a lot of positioning, not a lot of changed earnings power. Thursday-down/Friday-up is the signature of a flush.", "tweetA": "$2.3 trillion of market cap vanished in a day and the dollar and yen barely noticed. Either this is a positioning flush or FX is about to catch up. I'm watching the latter.", "tweetB": "6.4% on the Nasdaq 100 is a 2020-class day. The difference: in 2020 the Fed had room to respond. Today it has a tightening bias. That's why Friday's bounce shouldn't be read as 'all clear'.", "charts": {"count": 0, "hot": false, "desc": "No charts in email body (plain text)"}, "link": "https://michaelparekh.substack.com/p/ai-midterms-ai-shift-anthropics-ipo"}, {"id": 10, "cat": "AI/infra", "urgency": "deep", "source": "Michael Parekh / AI-RTZ", "title": "Anthropic's updated S-1: Q3 revenue $17B, compute commitments jump to $895B from $750B", "idea": "Anthropic updated its S-1 with third-quarter revenue of $17B and $895B of compute commitments, up from $750B in the draft. Run rate topped $80B at end-October. Parekh: 'watch the compute bill climb'.", "angle": "Commitments/revenue is the number: $895B of compute against $17B a quarter (about $68B annualised) is roughly 13x annualised revenue. Who is on the other side of that obligation is the hyperscaler/neocloud backlog.", "tweetA": "$895B of compute commitments. $17B of quarterly revenue. That's about 13 years of current revenue already promised to chip and cloud vendors. This is the other side of every backlog number you've seen this earnings season.", "tweetB": "Anthropic raised its compute bill by $145B between the draft S-1 and the update. That's roughly the entire market cap of a Fortune 100 company, added in a drafting cycle. And people ask whether capex is slowing.", "charts": {"count": 0, "hot": false, "desc": "No charts in email body (plain text)"}, "link": "https://michaelparekh.substack.com/p/ai-midterms-ai-shift-anthropics-ipo"}, {"id": 11, "cat": "venture", "urgency": "deep", "source": "Michael Parekh / AI-RTZ", "title": "Wall Street pushes back on Anthropic's $1.5T IPO valuation; raise may shrink to ~$80B", "idea": "Per WSJ via Parekh: after post-midterm volatility, three major investors planning to buy say the price likely needs to come down, one saying closer to $1T. The raise could shrink from up to $100B to about $80B. Parekh calls it bazaar haggling with more zeros; even at lower numbers valuation stays historically high.", "angle": "IPO price discovery as a real-time read on AI risk appetite. A cut from $1.5T to $1T is a -33% haircut on the marquee AI asset before it trades.", "tweetA": "Anthropic IPO: $1.5T ask, buyers say $1T. A 33% haircut before the first print. This is the cleanest mark-to-market on what the AI Nasdaq flush means for private AI valuations.", "tweetB": "Run rate over $80B and investors still want a third off. That's not doubt about growth. It's doubt about the multiple on growth when the cost of capital is going up and the data-center permit map is turning red.", "charts": {"count": 0, "hot": false, "desc": "No charts in email body (plain text)"}, "link": "https://michaelparekh.substack.com/p/ai-midterms-ai-shift-anthropics-ipo"}, {"id": 12, "cat": "tech", "urgency": "deep", "source": "Michael Parekh / AI-RTZ", "title": "Apple's record quarter: memory costs now set the gross margin guide (45-46%), $33B of new purchase obligations", "idea": "Apple: revenue +12% to a Sept-quarter record $114.5B (iPhone +17% to $57.6B, Mac +24%, Services record $31.6B). China grew 21% and still missed estimates by more than $1B. Gross margin guided down to 45-46% on memory costs, with $33B of new purchase obligations to lock supply. Parekh: 'RAMageddon now sets Apple's margins'.", "angle": "Memory is the new tax on every device maker. Apple pre-buying $33B of supply is the consumer-side mirror of the hyperscaler compute commitments.", "tweetA": "Apple locked in $33B of memory purchase obligations. Same week Anthropic added $145B to its compute bill. The AI buildout is a supply-lock arms race and the consumer electronics sector is paying the toll.", "tweetB": "China +21% and still a miss of >$1B. Consensus is built on a version of China that doesn't exist anymore. Meanwhile the margin guide just got decided by someone in Icheon, not Cupertino.", "charts": {"count": 0, "hot": false, "desc": "No charts in email body (plain text)"}, "link": "https://michaelparekh.substack.com/p/ai-midterms-ai-shift-anthropics-ipo"}, {"id": 13, "cat": "tech", "urgency": "deep", "source": "Michael Parekh / AI-RTZ", "title": "Apple's AI bill runs through R&D (+32% to $45.8B), not data centers - capex down 29%", "idea": "Parekh: Apple's AI spending shows in R&D, up 32% to $45.8B, while capex fell 29%. WSJ credits higher prices for much of revenue growth. His take: the most valuable consumer AI device company is the one that didn't build the data centers - but the wave sends Apple a bill anyway via memory prices.", "angle": "Capex-light AI is the one strategy the data-center backlash doesn't touch. Moratoria are an asymmetric positive for device owners who rent compute.", "tweetA": "Apple cut capex 29% and raised R&D 32%. While everyone else fights county boards for permits, Cupertino rents. Midterms just made renting the better strategy.", "tweetB": "Two ways to be an AI winner: own the power plant, or own the pocket. One of them just got a hostile electorate. Apple's capex line is the cleanest expression of that trade.", "charts": {"count": 0, "hot": false, "desc": "No charts in email body (plain text)"}, "link": "https://michaelparekh.substack.com/p/ai-midterms-ai-shift-anthropics-ipo"}, {"id": 14, "cat": "venture", "urgency": "deep", "source": "Michael Parekh / AI-RTZ", "title": "OpenAI's round stalls: ~$11B committed at $1.25T vs $30B target; target cut to ~$20B", "idea": "Per the FT: OpenAI has about $11B of commitments in its private round at a $1.25T valuation, under half the $30B target; it cut the target to roughly $20B. Brockman told WSJ the first half was rough before a coding takeoff. Parekh: still clears his bar of a market value sustained above $1T.", "angle": "Both frontier labs are being haggled by the market in the same week. Private-round demand is the freshest read on AI risk appetite.", "tweetA": "OpenAI: $11B raised of $30B. Anthropic: investors want $1T not $1.5T. Same week, same message. The AI mega-round window didn't close - it repriced.", "tweetB": "Brockman says 'coding takeoff'. DeepSeek just launched an AI coding product. If your growth thesis rests on coding and the incumbent has a cheaper Chinese competitor, the $1.25T number is the one to stress.", "charts": {"count": 0, "hot": false, "desc": "No charts in email body (plain text)"}, "link": "https://michaelparekh.substack.com/p/ai-midterms-ai-shift-anthropics-ipo"}, {"id": 15, "cat": "regulation", "urgency": "deep", "source": "Michael Parekh / AI-RTZ", "title": "OpenAI's post-midterm playbook: 'National Community Compact', no NDAs, no residential power bills, 'compute campuses'", "idea": "OpenAI is adjusting its data-center plans and Washington posture: a National Community Compact with no NDAs, no power-bill impact for residents, and public reporting on water, noise and energy, following a post-election plan that includes renaming data centers 'AI compute campuses'.", "angle": "The industry is conceding on transparency to keep permits. 'No power bills for residents' is a cost the capex models don't carry.", "tweetA": "No NDAs. No resident power bills. Public water and noise reports. OpenAI just wrote the term sheet for the data-center social licence. Now price it into the cost per MW.", "tweetB": "Rebrand data centers as 'compute campuses' is the tell. When the industry changes the word, it has already lost the narrative. Utilities sit across the table from voters and are about to be the biggest winner.", "charts": {"count": 0, "hot": false, "desc": "No charts in email body (plain text)"}, "link": "https://michaelparekh.substack.com/p/ai-midterms-ai-shift-anthropics-ipo"}, {"id": 16, "cat": "tech", "urgency": "watch", "source": "Michael Parekh / AI-RTZ", "title": "Starlink Mobile: Qualcomm to power a nationwide 5G network, $27B+ of spectrum, carriers refused access", "idea": "SpaceX picked Qualcomm to power a nationwide 5G network for Starlink Mobile, with tens of thousands of cell sites from 2027, on top of more than $27B of spectrum bought from EchoStar and Grain. All three big carriers turned down access, so Musk is eyeing Boost Mobile (WaPo). Total bill could top $100B; Amazon Leo and Apple on the horizon. Parekh: likeliest outcome is a deal, with the build as leverage.", "angle": "Fourth US carrier with a space backhaul, financed by the largest IPO ever. Carriers' refusal made the threat credible.", "tweetA": "All three US carriers told Musk no. So he bought $27B of spectrum and hired Qualcomm. That's not a negotiation, that's a counter-offer with a balance sheet. Short the pricing power of the incumbents.", "tweetB": "$100B for a nationwide network, in a week the market is questioning $100B-scale capex everywhere else. The difference: this one has regulatory-friendly spectrum and a captive customer base.", "charts": {"count": 0, "hot": false, "desc": "No charts in email body (plain text)"}, "link": "https://michaelparekh.substack.com/p/ai-midterms-ai-shift-anthropics-ipo"}, {"id": 17, "cat": "geopolitics", "urgency": "watch", "source": "Michael Parekh / AI-RTZ", "title": "DeepSeek launches AI coding product aimed at Claude Code / OpenAI; Samsung swinging at SK Hynix", "idea": "Parekh's additional items: China's DeepSeek launched an AI coding product challenging Anthropic and OpenAI offerings; SK Hynix and Samsung drew different market reactions to strong quarters amid solid memory demand. The podcast blurbs also mention Samsung swinging at SK Hynix and Meta building a humanoid. Short blurbs only - details in linked items.", "angle": "Coding is the revenue engine for both US labs (Brockman's 'coding takeoff'). A cheap Chinese entrant is a price-per-token threat to exactly that line.", "tweetA": "The one market where US labs have real revenue is coding. DeepSeek just aimed at it. Anthropic's IPO price is being negotiated the same week.", "tweetB": "Memory makers had strong quarters and diverging stock reactions. When fundamentals are solid and the stock still falls, positioning is the story. SK Hynix is down 63% from June.", "charts": {"count": 0, "hot": false, "desc": "No charts in email body (plain text)"}, "link": "https://michaelparekh.substack.com/p/ai-midterms-ai-shift-anthropics-ipo"}, {"id": 18, "cat": "positioning", "urgency": "deep", "source": "Stephen Innes / Dark Side of the Boom", "title": "Goldman: SpaceX's index impact is much smaller than feared; bigger S&P 500 event still ahead", "idea": "Nearly five months after the largest US IPO on record, SpaceX is becoming a bigger passive holding as its free float expands. Goldman's Ben Snider and team (US Weekly Kickstart) conclude the effect on index concentration, valuation and fund flows is much smaller than anticipated. The next demand source is a corner of passive investing that has drawn little attention; S&P 500 inclusion timing depends on more than market cap. (Email shows only the opening; full detail behind the link.)", "angle": "The 'mega-IPO crowds out everything' narrative failed. Meanwhile the S&P inclusion is a known, schedulable flow event.", "tweetA": "Everyone feared SpaceX would swamp the indices. Goldman says the impact is small. The actual trade isn't the IPO, it's the S&P inclusion date. That's a calendar, not a thesis.", "tweetB": "Largest IPO in history, five months in, and index concentration barely moved. In a week Nasdaq lost $2.3T in a day, SpaceX's float expansion is the quietest flow in the tape.", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening"}, "link": "https://thedarksideoftheboom.substack.com/p/spacex-joins-the-index-club-goldman"}, {"id": 19, "cat": "energy", "urgency": "deep", "source": "Jon Costello / HFI Research", "title": "Transocean down 25.6% since Oct 30 vs XLE -12.2%: a macro short-oil proxy with ~30% short interest", "idea": "HFI's Jon Costello: RIG is down 25.6% since Oct 30 against XLE's 12.2% decline, due to macro oil angst and weak headline Q3 results reported Nov 2. RIG's shares track WTI closely despite results depending far less on spot crude than E&Ps; large cap plus high leverage makes it macro funds' favourite way to short oil outside futures. Short interest nears 30%. As leverage falls after the Valaris acquisition and debt paydown, he expects macro funds to like it less as a shorting vehicle. Entry for 3+ year holders.", "angle": "Drillers as an oil-short vehicle: crowded at 30% SI with a debt-paydown catalyst. Setup for squeeze if Hormuz re-escalates (Innes's point).", "tweetA": "RIG fell 2x the energy sector in a week. It trades like WTI but earns like a contractor on multi-year day rates. 30% short interest in a stock whose cash flows don't care about spot is a squeeze waiting for a Hormuz headline. $RIG $VAL", "tweetB": "Macro funds short oil via a driller because it's liquid and levered. Fine - until leverage falls post-Valaris and the short loses its whole point. Two unrelated stories: Iran headlines and a balance sheet getting cleaner.", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening"}, "link": "https://www.hfir.com/p/idea-transocean-near-term-results"}, {"id": 20, "cat": "AI/infra", "urgency": "deep", "source": "Stephen Innes / Dark Side of the Boom", "title": "JPMorgan desk: the market is finally pricing AI circularity - stress hits photonics, optics, memory, neoclouds", "idea": "JPM's Market Intelligence desk stays tactically bullish: a sharp flush plus supportive November seasonality could set up a rebound. But Ron Adler (Global Co-Head of Cash Trading) says the issue is the circularity of AI financing, risk-taking and wealth effects, not just circular revenues. Stress is concentrated in photonics, optics, memory, neoclouds. Much of the positioning pain is already taken, but he doesn't expect many investors to rush in and defend it outside defensives.", "angle": "Funding-chain risk, not demand risk. The second-derivative names (optics, neoclouds) carry the most reflexivity.", "tweetA": "JPM's cash trading head says the AI trade depended on capital markets staying permanently friendly. That's not a valuation call, it's a funding call. Neoclouds and optics are the leveraged tail of that chain.", "tweetB": "Seasonality bulls and circularity bears can both be right: the flush ends, nobody defends. The rebound is a trade; the re-rating isn't. Position sizes, not thesis.", "charts": {"count": 0, "hot": false, "desc": "No charts in email body (plain text)"}, "link": "https://thedarksideoftheboom.substack.com/p/jpmorgan-says-the-market-is-finally"}, {"id": 21, "cat": "macro", "urgency": "deep", "source": "Paul Podolsky / Kate Capital", "title": "The deficit math after the midterms: ~6% of GDP now, wider if tariffs fall and data-center spend slows", "idea": "Podolsky: the US deficit is around 6% of GDP. If tariffs are rescinded or reduced, Medicare spending increases, tax increases are proposed but vetoed and data-center spending slows, the deficit widens, driving long-term yields up and pressuring P/Es. The swing back to centre solves rule-of-law risk but creates how-to-turn-hatred-of-inflation-into-a-plan problem.", "angle": "Divided government with gridlock = deficit by default. Tariff relief is a revenue loss the market isn't modelling.", "tweetA": "Tariffs are a revenue line. Rescind them, add Medicare, veto the taxes, slow the data-center capex that's been propping receipts. a 6% deficit has nowhere to go but up. Term premium has been waiting for this.", "tweetB": "Both parties agreed on exactly one thing in the election: inflation is unacceptable. Neither has a plan that doesn't widen the deficit. Long end is the only market that has to clear that.", "charts": {"count": 0, "hot": false, "desc": "No charts in email body (plain text)"}, "link": "https://paulpodolsky.substack.com/p/the-clearing-price"}, {"id": 22, "cat": "credit", "urgency": "deep", "source": "Paul Podolsky / Kate Capital", "title": "Fed needs to tighten independent of oil; money demand is high and investment-grade spreads are widening", "idea": "Podolsky: the economy is strong, unemployment low, inflation high, partly from robust credit creation, so the Fed needs to tighten, mostly independent of oil. Kinetic war may be near over given tepid domestic support. Tightening meets high demand for money, pushing the cost of capital up (see his IG spreads chart) and squeezing the weakest borrowers. Parts of the economy outside the boom face higher inflation and higher borrowing costs - hence the vote.", "angle": "Credit creation is the inflation source, not oil. That argues against reading an oil collapse as dovish. K-shaped credit.", "tweetA": "Everyone's using the oil collapse to argue the Fed gets to relax. Podolsky's point: inflation is credit-driven, and the demand for money is at a high. Oil down, spreads wider, Fed not easing. That's a stagflation-lite tape for the non-boom economy.", "tweetB": "The election was a referendum on the K-shape: borrowers outside the AI boom pay AI-boom rates. IG spreads widening while the Nasdaq makes new lows says the cost of capital, not the multiple, is what's being repriced.", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening"}, "link": "https://paulpodolsky.substack.com/p/the-clearing-price"}, {"id": 23, "cat": "AI/infra", "urgency": "deep", "source": "Paul Podolsky / Kate Capital", "title": "SK Hynix down 63% from June high; forward P/E ~3 vs 1.5 in 2008", "idea": "Podolsky notes that with stocks selling off and the regulatory regime in flux, forward valuations for parts of the boom are at multi-year lows: SK Hynix at a P/E of about 3. In 2008 the P/E fell to 1.5x, 50% lower from here. SK Hynix is down 63% from its June high. Numbers like P/E or FCF yield are only a guide; there is a psychological element when investors 'give up', as with fiber companies or homebuilders after earlier busts. Will investors trained to always buy tech keep doing so?", "angle": "Memory is simultaneously Apple's margin problem (45-46% GM) and Hynix's earnings engine. P/E 3 on peak earnings is a cyclical-peak signal, not a value signal.", "tweetA": "SK Hynix at 3x earnings and -63% from June. The market is saying those earnings are peak. 2008 memory went to 1.5x. Cheap is a feeling, not a catalyst. Memory is the one place where Apple's pain is Hynix's gain, and still the stock falls.", "tweetB": "Fiber in 2002, homebuilders in 2009. Buyers returned only when the last believer gave up. Everyone's asking 'is memory cheap'. The better question: who is the last holder who's trained to buy every dip in tech?", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening"}, "link": "https://paulpodolsky.substack.com/p/the-clearing-price"}, {"id": 24, "cat": "culture", "urgency": "deep", "source": "Paul Podolsky / Kate Capital", "title": "The political paradox: voters hate data centers, but half of them own 401(k)s that depend on them", "idea": "Podolsky: part of the election platform - data centers are bad - hit a reality wall Wednesday when stocks fell sharply on exactly that fear. Around half of voters have 401(k)s and don't want the market to tank, and the data-center build is a key component of stock-market valuation.", "angle": "The wealth effect makes the political economy of AI circular: the same voters who voted for moratoria own the stocks that fall because of them. Policy will bend before the market does.", "tweetA": "Half of voters own 401(k)s. Half of the S&P is the AI build. They voted against data centers on Tuesday and sold their retirement on Wednesday. Politicians will learn this faster than the market does.", "tweetB": "Circularity isn't just revenue. It's electorate to equity to politician. A moratorium that drops the Nasdaq 6% is a moratorium with a short half-life. That's the trade: fade the permanence of the ban.", "charts": {"count": 0, "hot": false, "desc": "No charts in email body (plain text)"}, "link": "https://paulpodolsky.substack.com/p/the-clearing-price"}, {"id": 25, "cat": "credit", "urgency": "deep", "source": "Paul Podolsky / Kate Capital", "title": "The clearing price for capital: stocks and bonds not there yet - higher yields and lower stocks", "idea": "Podolsky's synthesis: 'we are trying to find a price level where stocks and bonds can clear the capital market.' We do not appear to be there yet, though closer, suggesting in the US higher bond yields and lower stock prices.", "angle": "A clear directional view: the adjustment still runs through both prices. Not a buy-the-dip letter.", "tweetA": "Stocks and bonds have to jointly clear the capital market. The market spent two years pretending bonds clear at one price and equities at another. This week they met. Both are lower.", "tweetB": "Rare to get a macro letter that says 'not there yet' after a 6.4% Nasdaq day. When the bounce on Friday shows up in your feed as victory, remember the person actually pricing capital says higher yields, lower stocks.", "charts": {"count": 0, "hot": false, "desc": "No charts in email body (plain text)"}, "link": "https://paulpodolsky.substack.com/p/the-clearing-price"}];
const META = {"date": "2026-11-07", "time": "09:05 CEST", "windowStart": "2026-11-07 03:05 CEST", "windowEnd": "2026-11-07 09:05 CEST", "note": "Cutoff = 07:05 UTC minus 6h = 01:05 UTC. Times shown in CEST (UTC+2) per routine spec.", "emailsInWindow": 6, "emailsRead": 6, "itemsExtracted": 25, "includedSources": [{"name": "Dark Side of the Boom", "detail": "Stephen Innes (3 emails)", "emails": 3, "items": 9}, {"name": "AI-RTZ", "detail": "Michael Parekh (1 email)", "emails": 1, "items": 10}, {"name": "HFI Research", "detail": "Jon Costello (1 email)", "emails": 1, "items": 1}, {"name": "Kate Capital", "detail": "Paul Podolsky (1 email)", "emails": 1, "items": 5}], "skippedSources": [{"name": "(none)", "reason": "All 6 emails in window had analytical content"}]};
var COLORS={macro:"#e24b4a",credit:"#378add",positioning:"#ef9f27","AI/infra":"#1d9e75",crypto:"#7f77dd",geopolitics:"#d85a30",energy:"#f97316",tech:"#06b6d4",gold:"#d4a017",culture:"#ec4899",labor:"#8b5cf6",regulation:"#64748b",science:"#14b8a6",venture:"#84cc16"};
var UEMO={act:"🔴",deep:"🔵",watch:"🟡"};
var fCat="all",fUrg="all",fSrc=null;
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}
function bars(){
  var cats={};ITEMS.forEach(function(i){cats[i.cat]=(cats[i.cat]||0)+1;});
  var h='<span class="pill'+(fCat==="all"?' active':'')+'" style="'+(fCat==="all"?'background:#333':'')+'" data-c="all">All '+ITEMS.length+'</span>';
  Object.keys(cats).forEach(function(c){var a=fCat===c;h+='<span class="pill'+(a?' active':'')+'" style="'+(a?'background:'+COLORS[c]:'')+'" data-c="'+c+'">'+c+' '+cats[c]+'</span>';});
  document.getElementById("catBar").innerHTML=h;
  var u={act:0,deep:0,watch:0};ITEMS.forEach(function(i){u[i.urgency]++;});
  var us=[["all","All "+ITEMS.length],["act","🔴 Act Now "+u.act],["deep","🔵 Deep "+u.deep],["watch","🟡 Watch "+u.watch]];
  h="";us.forEach(function(x){var a=fUrg===x[0];h+='<span class="pill'+(a?' active':'')+'" style="'+(a?'background:#333':'')+'" data-u="'+x[0]+'">'+x[1]+'</span>';});
  document.getElementById("urgBar").innerHTML=h;
}
function render(expandAll){
  var h="";
  ITEMS.forEach(function(it){
    if(fCat!=="all"&&it.cat!==fCat)return;
    if(fUrg!=="all"&&it.urgency!==fUrg)return;
    if(fSrc&&it.source.indexOf(fSrc)<0)return;
    var col=COLORS[it.cat]||"#888";
    var chm=it.charts.hot?" 🔥":(it.charts.count?" 📊":"");
    h+='<div class="card'+(expandAll?' open':'')+'"><div class="hd"><span class="num">#'+it.id+'</span><span>'+UEMO[it.urgency]+'</span><span class="src" style="background:'+col+'">'+esc(it.source)+'</span><span class="tag">'+esc(it.cat)+'</span><span>'+chm+'</span><span class="ttl">'+esc(it.title)+'</span></div>';
    h+='<div class="body"><div class="lbl">The Idea</div><div>'+esc(it.idea)+'</div>';
    h+='<div class="lbl">My Angle</div><div class="angle" style="border-left-color:'+col+';background:'+col+'14">'+esc(it.angle)+'</div>';
    h+='<div class="lbl">Tweets</div><div class="tw"><div><span class="ta">TWEET A</span><button class="copy-btn" onclick="copyTweet(' + it.id + ',\'a\')">📋 Copy</button><div>'+esc(it.tweetA)+'</div></div>';
    h+='<div><span class="tb">TWEET B</span><button class="copy-btn" onclick="copyTweet(' + it.id + ',\'b\')">📋 Copy</button><div>'+esc(it.tweetB)+'</div></div></div>';
    h+='<div class="ch'+(it.charts.hot?' hot':'')+'">'+(it.charts.hot?'🔥 CHART WORTH SAVING - ':'')+esc(it.charts.desc)+'</div>';
    h+='<div style="margin-top:8px"><a href="'+esc(it.link)+'" target="_blank" rel="noopener">↗ Read full article</a></div></div></div>';
  });
  document.getElementById("cards").innerHTML=h||'<div class="sub">No items match.</div>';
}
function filterBySrc(name){fSrc=name;fCat="all";fUrg="all";bars();render(true);}
function init(){
  document.getElementById("sub").textContent=META.date+" · "+META.time+" · "+ITEMS.length+" items";
  bars();render(false);
  document.getElementById("catBar").addEventListener("click",function(e){var c=e.target.getAttribute("data-c");if(!c)return;fCat=c;fSrc=null;bars();render(false);});
  document.getElementById("urgBar").addEventListener("click",function(e){var u=e.target.getAttribute("data-u");if(!u)return;fUrg=u;fSrc=null;bars();render(false);});
  document.getElementById("cards").addEventListener("click",function(e){var n=e.target;if(n.closest&&n.closest(".body"))return;var c=n.closest?n.closest(".card"):null;if(c)c.classList.toggle("open");});
  var r='<p><b>Window:</b> '+esc(META.windowStart)+' to '+esc(META.windowEnd)+'. Emails outside this window were not processed.<br><i>'+esc(META.note)+'</i></p>';
  r+='<p><b>Included sources</b> (click to filter):</p><ul>';
  META.includedSources.forEach(function(s){r+='<li><span class="srcl" data-s="'+esc(s.name)+'">'+esc(s.name)+'</span> - '+esc(s.detail)+', '+s.items+' items</li>';});
  r+='</ul><p><b>Skipped:</b> '+META.skippedSources.map(function(s){return esc(s.name)+' ('+esc(s.reason)+')';}).join("; ")+'</p>';
  r+='<p><b>Totals:</b> '+META.emailsInWindow+' emails in window, '+META.emailsRead+' read, '+META.itemsExtracted+' items.</p>';
  document.getElementById("reportBody").innerHTML=r;
  document.getElementById("reportBody").addEventListener("click",function(e){var s=e.target.getAttribute("data-s");if(s)filterBySrc(s);});
  document.getElementById("repToggle").addEventListener("click",function(){var b=document.getElementById("reportBody");b.style.display=b.style.display==="block"?"none":"block";});
}
init();
</script></body></html>
