var COLORS = {"macro":"#e24b4a","credit":"#378add","positioning":"#ef9f27","AI/infra":"#1d9e75","crypto":"#7f77dd","geopolitics":"#d85a30","energy":"#f97316","tech":"#06b6d4","gold":"#d4a017","culture":"#ec4899","labor":"#8b5cf6","regulation":"#64748b","science":"#14b8a6","venture":"#84cc16","biotech":"#be185d"};
var UEMO = {"act":"🔴","deep":"🔵","watch":"🟡"};
var state = {cat:"All", urg:"All", src:null};
function col(c){ return COLORS[c] || "#888"; }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function hexA(h,a){ var r=parseInt(h.substr(1,2),16),g=parseInt(h.substr(3,2),16),b=parseInt(h.substr(5,2),16); return "rgba("+r+","+g+","+b+","+a+")"; }

function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}

function toggle(id){ var el=document.getElementById("card-"+id); el.classList.toggle("open"); }

function renderBars(){
  var cats = {}; ITEMS.forEach(function(i){ cats[i.cat]=(cats[i.cat]||0)+1; });
  var h = '<span class="pill'+(state.cat==="All"?' active':'')+'" style="'+(state.cat==="All"?'background:#333':'')+'" onclick="setCat(\'All\')">All ('+ITEMS.length+')</span>';
  Object.keys(cats).forEach(function(c){
    var a = state.cat===c;
    h += '<span class="pill'+(a?' active':'')+'" style="'+(a?'background:'+col(c):'')+'" onclick="setCat(\''+c+'\')">'+esc(c)+' ('+cats[c]+')</span>';
  });
  document.getElementById("catbar").innerHTML = h;
  var u = {act:0,deep:0,watch:0}; ITEMS.forEach(function(i){ u[i.urgency]++; });
  var labels = [["All","All ("+ITEMS.length+")"],["act","🔴 Act Now ("+u.act+")"],["deep","🔵 Deep ("+u.deep+")"],["watch","🟡 Watch ("+u.watch+")"]];
  var h2 = "";
  labels.forEach(function(l){
    var a = state.urg===l[0];
    h2 += '<span class="pill'+(a?' active':'')+'" style="'+(a?'background:#333':'')+'" onclick="setUrg(\''+l[0]+'\')">'+l[1]+'</span>';
  });
  document.getElementById("urgbar").innerHTML = h2;
}
function setCat(c){ state.cat=c; state.src=null; render(); }
function setUrg(u){ state.urg=u; state.src=null; render(); }
function filterBySrc(name){
  state.cat="All"; state.urg="All"; render(); state.src=name;
  ITEMS.forEach(function(i){
    var el=document.getElementById("card-"+i.id);
    var m = i.source.indexOf(name) !== -1 || name.indexOf(i.source) !== -1;
    el.style.display = m ? "" : "none";
    if(m) el.classList.add("open"); else el.classList.remove("open");
  });
  window.scrollTo(0,0);
}

function cardHTML(item){
  var c = col(item.cat);
  var ch = item.charts || {count:0,hot:false,desc:""};
  var icon = ch.hot ? " 🔥" : (ch.count>0 ? " 📊" : "");
  var h = '<div class="card'+(ch.hot?' hot':'')+'" id="card-'+item.id+'">';
  h += '<div class="hd" onclick="toggle('+item.id+')">';
  h += '<span class="num">#'+item.id+'</span><span>'+(UEMO[item.urgency]||"")+'</span>';
  h += '<span class="src" style="background:'+c+'">'+esc(item.source)+'</span>';
  h += '<span class="tag">'+esc(item.cat)+'</span><span>'+icon+'</span>';
  h += '<div class="ttl">'+esc(item.title)+'</div></div>';
  h += '<div class="bd">';
  h += '<div class="lbl">the idea</div><div class="idea">'+esc(item.idea)+'</div>';
  h += '<div class="lbl">my angle</div><div class="angle" style="border-color:'+c+';background:'+hexA(c,0.07)+'">'+esc(item.angle)+'</div>';
  h += '<div class="tw">';
  h += '<div class="twb"><div class="twl" style="color:#378add">TWEET A <button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button></div>'+esc(item.tweetA)+'</div>';
  h += '<div class="twb"><div class="twl" style="color:#7f77dd">TWEET B <button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div>'+esc(item.tweetB)+'</div>';
  h += '</div>';
  h += '<div class="chart'+(ch.hot?' hot':'')+'">'+(ch.hot?'🔥 ':'📊 ')+'Charts: '+ch.count+(ch.desc?' — '+esc(ch.desc):'')+'</div>';
  h += '<a class="lnk" href="'+esc(item.link)+'" target="_blank" rel="noopener">↗ Read full article</a>';
  h += '</div></div>';
  return h;
}

function render(){
  renderBars();
  var list = ITEMS.filter(function(i){ return (state.cat==="All"||i.cat===state.cat) && (state.urg==="All"||i.urgency===state.urg); });
  var h = list.map(cardHTML).join("");
  document.getElementById("cards").innerHTML = h || '<div class="empty">No items match this filter.</div>';
}

function renderReport(){
  var h = '<div class="hd" onclick="document.getElementById(\'report\').classList.toggle(\'open\')">📋 Session Report</div><div class="bd">';
  h += '<div class="lbl">time window</div><div class="idea">'+esc(META.windowStart)+' → '+esc(META.windowEnd)+'. '+esc(META.note||"")+'</div>';
  h += '<div class="lbl">totals</div><div class="idea">Emails in window: '+META.emailsInWindow+' · Read: '+META.emailsRead+' · Items extracted: '+META.itemsExtracted+' · Sources included: '+META.includedSources.length+'</div>';
  h += '<div class="lbl">included sources (click to filter)</div><table>';
  META.includedSources.forEach(function(s){ h += '<tr><td><span class="srcl" data-src="'+esc(s.name)+'" onclick="filterBySrc(this.getAttribute(\'data-src\'))">'+esc(s.name)+'</span></td><td>'+s.items+' items</td></tr>'; });
  h += '</table><div class="lbl">skipped</div><table>';
  META.skippedSources.forEach(function(s){ h += '<tr><td>'+esc(s.name)+'</td><td>'+esc(s.reason)+'</td></tr>'; });
  h += '</table></div>';
  document.getElementById("report").innerHTML = h;
}

function init(){
  document.getElementById("sub").textContent = META.date+" · "+META.time+" · "+ITEMS.length+" items · window "+META.windowStart+" → "+META.windowEnd;
  render(); renderReport();
}
