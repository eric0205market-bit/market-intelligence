null, "locator": "The people elevated to these positions", "quote_verified": false}, {"claim": "Breadth of knowledge is no substitute for depth: encyclopedic understanding cannot replace resonance or the shared experience of wonder and despair that comes from being alive.", "speaker": "Garrett W. Ennis", "type": "thesis", "entities": ["AI"], "conviction": "medium", "so_what": "Argues a ceiling on AI as a substitute for human relationships regardless of capability gains.", "quote": "breadth is no substitute for depth", "locator": "Yet breadth is no substitute for depth", "quote_verified": true}]}, {"theme": "Developmental mechanism: containment and co-regulation", "insights": [{"claim": "Selfhood develops through being seen as a minded being by another mind: caregivers reflect an infant's distress back in words, and co-regulation between two nervous systems gradually becomes internal self-regulation.", "speaker": "Garrett W. Ennis", "type": "framework", "entities": ["attachment theory", "mentalization"], "conviction": "high", "so_what": "Gives a mechanistic benchmark for what AI companionship would need to replicate, and for what heavy early use by children might displace.", "quote": "Co-regulation becomes self-regulation", "locator": "The process of being begins before language.", "quote_verified": true}, {"claim": "Bion's container-and-contained model holds that we often cannot name a feeling as it arises and need an Other to receive and transform it; because containers are imperfect, the failure to be perfectly seen is where individuation occurs, and being perfectly understood would make us indistinguishable from the Other.", "speaker": "Garrett W. Ennis", "type": "framework", "entities": ["Wilfred Bion", "container and contained"], "conviction": "high", "so_what": "The contrarian core of the essay: frictionless understanding is a defect, not a feature, of AI companions.", "quote": "To be perfectly understood by the Other is to be rendered indistinguishable from it.", "locator": "The American psychoanalyst Wilfred Bion", "quote_verified": true}, {"claim": "AI already offers many formal properties of containment (receiving disclosures, organizing thoughts, recognizing emotion, tracking themes over time), making it a real reprieve for people with little access to reliable support.", "speaker": "Garrett W. Ennis", "type": "data_point", "entities": ["AI", "LLM"], "conviction": "medium", "so_what": "Acknowledges genuine demand in underserved mental-health access; supports the bull case for AI-mediated support while the author cautions on risks.", "quote": "For someone with little access to reliable support", "locator": "The Seductive Allure of the Machine", "quote_verified": true}]}, {"theme": "Frictionless reflection erodes agency and self-knowledge", "insights": [{"claim": "Human recognition arrives with latency and resistance, and surviving being understood imperfectly is part of the bond; a perfect mirror merely returns us to ourselves, whereas an imperfect one forces acceptance of a shared world we do not control.", "speaker": "Garrett W. Ennis", "type": "thesis", "entities": ["Thomas Ogden", "AI"], "conviction": "medium", "so_what": "Friction in relationships is a feature; products that remove it may optimize short-term satisfaction at the expense of resilience.", "quote": "A perfect mirror merely returns us to ourselves.", "locator": "The smoothness of these interactions", "quote_verified": true}, {"claim": "LLM-provided narratives can alter memories, inner monologue and self-beliefs, and because AI readily admits a user was right to push back and has no life to compare against, users may gradually lose authorship of their lives to an external authority telling them what they feel and should do.", "speaker": "Garrett W. Ennis", "type": "causal", "entities": ["LLM", "Thomas Ogden", "AI"], "conviction": "medium", "so_what": "Sycophancy plus authority creep is a plausible source of future litigation, regulation and brand risk for chatbot providers.", "quote": "lose authorship over their own life", "locator": "A further consequence of using the emotional crutch", "quote_verified": true}, {"claim": "Because most of what binds people is nonverbal (posture, tone, facial expression, faltering speech), self-understanding pursued through a purely verbal medium is inherently limited and stays in the shallow layer of experience.", "speaker": "Garrett W. Ennis", "type": "thesis", "entities": ["AI", "Lacan"], "conviction": "medium", "so_what": "Suggests multimodal and embodied interfaces are a capability gap for AI in therapeutic roles, though not one the author thinks closes the gap.", "quote": "attempts to attain self-understanding while remaining in the shallow realm of the verbal will always fall short", "locator": "Most importantly, so much of what binds us", "quote_verified": true}, {"claim": "A chatbot has no nervous system affected by ours and so can simulate patience indefinitely; a human listener tires and cuts off a neurotic thought loop, forcing self-regulation, while an LLM stays complicit in entertaining excesses no person would tolerate.", "speaker": "Garrett W. Ennis", "type": "contrarian", "entities": ["LLM", "chatbot"], "conviction": "medium", "so_what": "Unlimited patience is a mechanism of harm for rumination, anxiety and compulsive use, and a design problem for retention-maximizing assistants.", "quote": "helplessly complicit in entertaining excesses no person would tolerate", "locator": "A human response bears the mark", "quote_verified": true}]}, {"theme": "Reassurance loops and lost tolerance for uncertainty", "insights": [{"claim": "In anxious attachment, compulsive reassurance-seeking works only briefly; ordinarily the other person runs out of reassurance, forcing the person to tolerate ambiguity. AI never runs out, so each wave of anxiety can summon fresh reassurance and the symptom gets an outlet without friction.", "speaker": "Garrett W. Ennis", "type": "causal", "entities": ["AI", "anxious attachment"], "conviction": "medium", "so_what": "Predicts AI could entrench anxiety and OCD-like loops and drive repeat usage; a measurable behavioral-health risk to watch.", "quote": "The symptom has found an outlet without friction.", "locator": "What We Learn by Not Knowing", "quote_verified": true}, {"claim": "A person can become more sophisticated in explaining their anxiety while becoming no more capable of inhabiting the condition that produces it.", "speaker": "Garrett W. Ennis", "type": "thesis", "entities": ["AI"], "conviction": "low", "so_what": "Insight without tolerance is a plausible failure mode of AI therapy, difficult to catch in satisfaction metrics.", "quote": "becoming no more capable of inhabiting the condition that produces it", "locator": "AI changes this situation", "quote_verified": true}, {"claim": "Per Bion, thought itself grows from tolerating frustration in the gap between desire and satisfaction; a machine that is always present and never withholds collapses that gap and prevents people from discovering what it contained.", "speaker": "Garrett W. Ennis", "type": "causal", "entities": ["Wilfred Bion", "AI"], "conviction": "medium", "so_what": "Positions instant gratification from AI as a cognitive-development risk, not merely a distraction.", "quote": "access to technology that collapses the gap prevents us from discovering what it contained", "locator": "A machine that is always present", "quote_verified": true}, {"claim": "The author likens an always-present AI to a maternal superego that never prohibits, never withholds and whose only imperative is the user's satisfaction.", "speaker": "Garrett W. Ennis", "type": "framework", "entities": ["AI", "superego"], "conviction": "low", "so_what": "A memorable model for sycophancy as a structural feature of consumer-aligned assistants.", "quote": "a presence that never prohibits, never withholds, never goes away", "locator": "A machine that is always present", "quote_verified": true}, {"claim": "Human Others deliver disappointment of a digestible size (distracted friend, late parent, analyst who misses the point), which negotiates and refines needs, whereas digital systems are trivially routed around by regenerating or re-prompting until the answer matches desire.", "speaker": "Garrett W. Ennis", "type": "contrarian", "entities": ["LLM", "AI"], "conviction": "medium", "so_what": "Regenerate and re-prompt make AI feedback controllable in a way human feedback is not, weakening its corrective value.", "quote": "Another person cannot be revised in this way.", "locator": "That is why the failure to be contained is so vital", "quote_verified": true}]}, {"theme": "Societal stakes: atomization and institutional containment", "insights": [{"claim": "AI arrives as institutions that once provided interpretive support are failing: people are atomized, overworked, godless and suspicious, so commodified individualized sense-making at scale becomes a salve while shared meaning systems grow brittle.", "speaker": "Garrett W. Ennis", "type": "causal", "entities": ["AI", "chatbots", "institutions"], "conviction": "medium", "so_what": "Institutional decay is the demand-side condition for AI companionship; expect growth where social capital is weakest.", "quote": "The offering of commodified, individualized sense-making at enormous scale", "locator": "AI arrives just as many of the institutions", "quote_verified": true}, {"claim": "Emotional reliance on chatbots may be a new virtual addiction like video games, offering a simulated environment more psychologically palatable and rewarding where success is less demanding than real life.", "speaker": "Garrett W. Ennis", "type": "thesis", "entities": ["chatbots", "video games"], "conviction": "low", "so_what": "Supports an engagement and addiction framing (and regulatory analogy to gaming) for companion AI.", "quote": "provide an alternate, simulated environment that is more psychologically palatable", "locator": "Perhaps emotional reliance on chatbots", "quote_verified": true}, {"claim": "Bion extended containment to religions, traditions and public institutions (weddings, funerals, legal systems) that turn private experience into socially intelligible form; routing emotion through personal machines first lets suffering be managed privately but lose its capacity to bind people into shared worlds and to mobilize institutions and political movements.", "speaker": "Garrett W. Ennis", "type": "causal", "entities": ["Wilfred Bion", "AI", "institutions"], "conviction": "medium", "so_what": "Second-order implication: privatized emotional processing may dampen collective action and institutional demand; a novel angle on political and social volatility.", "quote": "suffering can become easier to manage privately while simultaneously losing its capacity to bind us", "locator": "Bion eventually extended the idea", "quote_verified": true}, {"claim": "The open question is whether person-machine exchanges stay closed or call users back to other people; AI helps thinking only if it does not capture users in a closed circuit with a poor imitation of a mirror.", "speaker": "Garrett W. Ennis", "type": "prediction", "entities": ["AI"], "conviction": "exploratory", "so_what": "The deciding variable for the societal outcome is whether AI products route users back to human relationships or retain them.", "quote": "the gap that defines our existence as individuals can never be escaped, for it is where we are made", "locator": "The question is what happens next.", "quote_verified": true}]}], "insight_total": 24, "top_entities": ["Jacques Lacan", "Wilfred Bion", "Thomas Ogden", "Gödel", "AI", "LLM", "Aristotle", "Chomsky", "attachment theory", "chatbots"], "source_meta": {"author": "Garrett W. Ennis", "word_count": 3581, "paywalled": false}}, {"record_id": "88c6964b7534360f", "source_type": "concepts", "source_name": "Works in Progress", "source_url": "https://worksinprogress.co/issue/mosqu // ---------- helpers ----------
// YouTube-aligned hex colors for tinted insight chips (bg = color+"1a", text = color, border = color+"55").
const TYPE_HEX = {
  thesis: '#6366f1', prediction: '#0ea5e9', framework: '#8b5cf6',
  data_point: '#059669', causal: '#d97706', contrarian: '#dc2626',
  anecdote: '#64748b',
};
const CONV_HEX = { high: '#16a34a', medium: '#ca8a04', low: '#94a3b8', exploratory: '#94a3b8' };
function typeHex(t) { return TYPE_HEX[String(t || '').toLowerCase()] || '#475569'; }
function convHex(c) { return CONV_HEX[String(c || '').toLowerCase()] || '#64748b'; }

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }

// Tinted chip (YouTube style): faint bg, colored text + border.
function tintChip(text, color) {
  return `<span class="chip" style="background:${color}1a;color:${color};border-color:${color}55">${escapeHtml(text)}</span>`;
}
function tagPills(tags) {
  if (!tags || !tags.length) return '';
  return tags.map(t => `<span class="pill tag">${escapeHtml(t)}</span>`).join(' ');
}

// ---------- rendering ----------
// Insight presentation ported from the YouTube digest: type/conviction tinted
// chips, speaker as a 🗣 chip, and entities as indigo chips — all in the meta row
// directly under the claim. Quote treatment is INTENTIONALLY kept as Concepts'
// verbatim + "✓ verified" (stronger than YouTube's ≈ paraphrase wording).
function renderInsight(ins) {
  if (!ins) return '';
  const cls = 'insight' + (ins.type ? (' ' + String(ins.type).toLowerCase()) : '');
  const meta = [];
  if (ins.type) meta.push(tintChip(ins.type, typeHex(ins.type)));
  if (ins.speaker) meta.push(`<span class="chip chip-spk">🗣 ${escapeHtml(ins.speaker)}</span>`);
  if (ins.conviction) meta.push(tintChip('conviction: ' + ins.conviction, convHex(ins.conviction)));
  (ins.entities || []).slice(0, 12).forEach(e => {
    if (e) meta.push(`<span class="chip chip-ent">${escapeHtml(e)}</span>`);
  });
  let quote = '';
  if (ins.quote) {
    const v = ins.quote_verified
      ? `<span class="vmark">✓ verified</span>`
      : `<span class="vmark no">unverified</span>`;
    quote = `<div class="quote">“${escapeHtml(ins.quote)}”${v}</div>`;
  }
  const so = ins.so_what
    ? `<div class="insight-so"><span class="lbl">so what</span>${escapeHtml(ins.so_what)}</div>` : '';
  return `
    <div class="${cls}">
      <div class="insight-claim">${escapeHtml(ins.claim || '')}</div>
      <div class="insight-meta">${meta.join('')}</div>
      ${so}
      ${quote}
    </div>`;
}

function renderTheme(theme) {
  const insights = (theme.insights || []).map(renderInsight).join('');
  return `
    <div class="theme">
      <div class="theme-title">${escapeHtml(theme.theme || 'Theme')}</div>
      ${insights}
    </div>`;
}

function renderCard(card) {
  if (!card) return '';
  const meta = card.source_meta || {};
  const nameHtml = card.source_url
    ? `<a class="source-name" href="${escapeAttr(card.source_url)}" target="_blank" rel="noopener">${escapeHtml(card.source_name || '')}</a>`
    : `<span class="source-name">${escapeHtml(card.source_name || '')}</span>`;
  const subBits = [];
  if (card.published_date) subBits.push(escapeHtml(card.published_date));
  if (meta.author) subBits.push(escapeHtml(meta.author));
  if (meta.word_count) subBits.push(`${meta.word_count} words`);
  if (meta.paywalled) subBits.push('paywalled');
  const themes = (card.themes || []).map(renderTheme).join('');
  const n = card.insight_total != null ? card.insight_total
            : (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
  return `
    <div class="source">
      <div class="source-head" onclick="toggleSource(this)">
        <div class="source-meta-left">
          <div class="source-name-row">${nameHtml}</div>
          <div class="source-title">${escapeHtml(card.title || '')}</div>
          <div class="source-sub">${subBits.join('  ·  ')}</div>
        </div>
        <span class="source-count">${n} insight${n === 1 ? '' : 's'}</span>
        <span class="source-arrow">▸</span>
      </div>
      <div class="source-body">
        ${card.gist ? `<div class="gist">${escapeHtml(card.gist)}</div>` : ''}
        ${card.tags && card.tags.length ? `<div class="tags">${tagPills(card.tags)}</div>` : ''}
        ${themes || '<div class="empty">No insights.</div>'}
      </div>
    </div>`;
}

function renderTopStats(d) {
  const s = d.stats || {};
  const parts = [];
  if (d.date) parts.push(`date <strong>${escapeHtml(d.date)}</strong>`);
  if (s.lookback_days != null) parts.push(`lookback <strong>${s.lookback_days}d</strong>`);
  if (s.sources != null) parts.push(`sources <strong>${s.sources}</strong>`);
  if (s.cards != null) parts.push(`cards <strong>${s.cards}</strong>`);
  if (s.insights != null) parts.push(`insights <strong>${s.insights}</strong>`);
  if (s.quote_verified_pct != null) parts.push(`quotes verified <strong>${s.quote_verified_pct}%</strong>`);
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSource(headEl) { headEl.parentElement.classList.toggle('open'); }

function insightCount(card) {
  return (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
}

// Build the sort/filter control bar (display only — re-groups REPORT_DATA in place).
function buildControls(d) {
  const cards = d.cards || [];
  const names = [...new Set(cards.map(c => c.source_name || '—'))].sort((a, b) => a.localeCompare(b));
  const opts = names.map(n => `<option value="${escapeAttr(n)}">${escapeHtml(n)}</option>`).join('');
  document.getElementById('controls').innerHTML =
    `<label>Sort
       <select id="sortSel">
         <option value="source">Source A–Z</option>
         <option value="insights">Insight count ▼</option>
       </select></label>
     <label>Source
       <select id="srcSel">
         <option value="__all">All sources (${names.length})</option>
         ${opts}
       </select></label>
     <span class="ctl-btns">
       <button type="button" id="expandAll">Expand all</button>
       <button type="button" id="collapseAll">Collapse all</button>
     </span>`;
  document.getElementById('sortSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('srcSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('expandAll').addEventListener('click', () => setAllGroups(false));
  document.getElementById('collapseAll').addEventListener('click', () => setAllGroups(true));
}

// Group-level collapse: header click toggles one group; the control-bar buttons toggle all.
function toggleGroup(headEl) { headEl.parentElement.classList.toggle('collapsed'); }
function setAllGroups(collapsed) {
  document.querySelectorAll('.group').forEach(g => g.classList.toggle('collapsed', collapsed));
}

// Group cards by source, sort groups (and cards within), optionally filter to one source.
function renderGroups(d) {
  const sortMode = (document.getElementById('sortSel') || {}).value || 'source';
  const srcFilter = (document.getElementById('srcSel') || {}).value || '__all';
  let cards = (d.cards || []).slice();
  if (srcFilter !== '__all') cards = cards.filter(c => (c.source_name || '—') === srcFilter);

  const groups = new Map();
  cards.forEach(c => {
    const k = c.source_name || '—';
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(c);
  });
  let entries = [...groups.entries()].map(([name, cs]) => ({
    name, cards: cs, insights: cs.reduce((a, c) => a + insightCount(c), 0),
  }));
  if (sortMode === 'insights') entries.sort((a, b) => b.insights - a.insights || a.name.localeCompare(b.name));
  else entries.sort((a, b) => a.name.localeCompare(b.name));
  // Within each source group, heaviest cards first.
  entries.forEach(e => e.cards.sort((a, b) => insightCount(b) - insightCount(a)));

  const html = entries.map(e => {
    const head = `<div class="group-head" onclick="toggleGroup(this)">`
      + `<span class="group-name">${escapeHtml(e.name)}</span>`
      + `<span class="group-meta">${e.cards.length} card${e.cards.length === 1 ? '' : 's'} · ${e.insights} insights</span>`
      + `<span class="group-arrow">▾</span></div>`;
    return `<div class="group">${head}<div class="group-body">${e.cards.map(renderCard).join('')}</div></div>`;
  }).join('');

  const app = document.getElementById('app');
  app.innerHTML = html || '<div class="empty">No cards for this source.</div>';
  // Open the first two source cards by default.
  document.querySelectorAll('.source').forEach((sec, i) => { if (i < 2) sec.classList.add('open'); });
}

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  document.getElementById('stats-top').innerHTML = renderTopStats(d);
  buildControls(d);
  renderGroups(d);   // default: grouped, sorted by source A–Z
}

renderReport(REPORT_DATA);
</script>
