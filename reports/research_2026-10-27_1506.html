const META = {"date": "2026-10-27", "time": "15:06 CEST", "windowStart": "2026-10-27 09:06 CEST (07:06 UTC)", "windowEnd": "2026-10-27 15:06 CEST (13:06 UTC)", "emailsInWindow": 21, "emailsRead": 21, "itemsExtracted": 63, "includedSources": [{"name": "Phil Dauber / Morning Musings", "items": 8}, {"name": "Pieter / Compounding Quality", "items": 1}, {"name": "Alfonso De Pablos / All Star Charts", "items": 1}, {"name": "SixSigmaCapital & Krypton Research / SixSigmaResearch", "items": 5}, {"name": "The Dark Side of the Boom", "items": 3}, {"name": "Laura Shin / Unchained Daily", "items": 9}, {"name": "Lucky Trader / Morning Minute", "items": 3}, {"name": "Kevin Muir / The Market House", "items": 4}, {"name": "David Rosenberg / Rosenberg Research", "items": 1}, {"name": "Macro Charts / MacroCharts", "items": 1}, {"name": "Peter Boockvar / Boock Report", "items": 2}, {"name": "Michael Spencer / AI Supremacy", "items": 7}, {"name": "Young & Calculated", "items": 2}, {"name": "Big Moves / Big Price Moves Explained", "items": 5}, {"name": "Doomberg", "items": 1}, {"name": "Hardfork (Yellowstone: Marshals)", "items": 1}, {"name": "Noah Smith / Noahpinion", "items": 9}], "skippedSources": [{"name": "Alan Frei", "reason": "Personal update: backpack launch, event invitations, poker progress, sponsor codes; link list with no analysis"}, {"name": "SixSigmaResearch subscriber chat", "reason": "Automated Substack chat notification pointing at the QCOM post (post itself processed)"}]};
const CATS = {"macro": "#e24b4a", "credit": "#378add", "positioning": "#ef9f27", "AI/infra": "#1d9e75", "crypto": "#7f77dd", "geopolitics": "#d85a30", "energy": "#f97316", "tech": "#06b6d4", "gold": "#d4a017", "culture": "#ec4899", "labor": "#8b5cf6", "regulation": "#64748b", "science": "#14b8a6", "venture": "#84cc16", "equities": "#475569"};
var UE = {act:'🔴',deep:'🔵',watch:'🟡'};
var UL = {act:'🔴 Act Now',deep:'🔵 Deep',watch:'🟡 Watch'};
var fc = 'all', fu = 'all', fs = null;
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}
function cardHtml(item){
  var col = CATS[item.cat] || '#888';
  var h = '<div class="card" data-id="'+item.id+'"><div class="hd" onclick="this.parentNode.classList.toggle(\'open\')">';
  h += '<span class="num">'+item.id+'</span><span>'+UE[item.urgency]+'</span><span class="src" style="background:'+col+'">'+esc(item.source)+'</span><span class="tag">'+esc(item.cat)+'</span>';
  if(item.charts.count>0||item.charts.hot) h += '<span>'+(item.charts.hot?'🔥':'📊')+'</span>';
  h += '<span class="ttl">'+esc(item.title)+'</span></div><div class="bd">';
  h += '<div class="lb">THE IDEA</div><div>'+esc(item.idea)+'</div>';
  h += '<div class="lb">MY ANGLE</div><div class="angle" style="border-color:'+col+';background:'+col+'14">'+esc(item.angle)+'</div>';
  h += '<div class="tw"><div><div class="lb" style="color:#378add;margin-top:0">TWEET A</div>'+esc(item.tweetA)+'<br>'+'<button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button></div>';
  h += '<div><div class="lb" style="color:#7f77dd;margin-top:0">TWEET B</div>'+esc(item.tweetB)+'<br>'+'<button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div></div>';
  h += '<div class="ch'+(item.charts.hot?' hot':'')+'">'+(item.charts.hot?'🔥 CHART WORTH SAVING — ':'📊 ')+esc(item.charts.desc||('Charts: '+item.charts.count))+'</div>';
  h += '<a class="lk" href="'+esc(item.link)+'" target="_blank" rel="noopener">↗ Read full article</a></div></div>';
  return h;
}
function vis(i){return (fc==='all'||i.cat===fc)&&(fu==='all'||i.urgency===fu)&&(!fs||i.source.indexOf(fs)>-1);}
function render(expand){
  var h='';ITEMS.forEach(function(i){if(vis(i))h+=cardHtml(i);});
  document.getElementById('list').innerHTML=h||'<div class="sub">No items.</div>';
  if(expand){var cs=document.querySelectorAll('#list .card');for(var k=0;k<cs.length;k++)cs[k].classList.add('open');}
  bars();
}
function setCat(c){fc=c;fs=null;render(false);}
function setUrg(u){fu=u;fs=null;render(false);}
function filterBySrc(name){fs=name;fc='all';fu='all';render(true);window.scrollTo(0,0);}
function bars(){
  var cnt={};ITEMS.forEach(function(i){cnt[i.cat]=(cnt[i.cat]||0)+1;});
  var h='<span class="pill'+(fc==='all'?' on':'')+'" style="'+(fc==='all'?'background:#333':'')+'" onclick="setCat(\'all\')">All '+ITEMS.length+'</span>';
  Object.keys(cnt).sort(function(a,b){return cnt[b]-cnt[a];}).forEach(function(c){
    var on=fc===c;h+='<span class="pill'+(on?' on':'')+'" style="'+(on?'background:'+CATS[c]:'')+'" onclick="setCat(\''+c+'\')">'+c+' '+cnt[c]+'</span>';});
  document.getElementById('cats').innerHTML=h;
  var uc={act:0,deep:0,watch:0};ITEMS.forEach(function(i){uc[i.urgency]++;});
  var u='<span class="pill'+(fu==='all'?' on':'')+'" style="'+(fu==='all'?'background:#333':'')+'" onclick="setUrg(\'all\')">All</span>';
  ['act','deep','watch'].forEach(function(k){var on=fu===k;u+='<span class="pill'+(on?' on':'')+'" style="'+(on?'background:#333':'')+'" onclick="setUrg(\''+k+'\')">'+UL[k]+' '+uc[k]+'</span>';});
  document.getElementById('urg').innerHTML=u;
}
function init(){
  document.getElementById('sub').textContent=META.date+' · '+META.time+' · '+ITEMS.length+' items';
  var r='<p><b>Window:</b> '+esc(META.windowStart)+' to '+esc(META.windowEnd)+'. Emails outside this window were not processed.</p>';
  r+='<p><b>Emails in window:</b> '+META.emailsInWindow+' · <b>read:</b> '+META.emailsRead+' · <b>items:</b> '+META.itemsExtracted+'</p><p><b>Included sources</b> (click to filter):<br>';
  META.includedSources.forEach(function(s){r+='<span class="sl" onclick="filterBySrc(\''+s.name.replace(/'/g,"\\'")+'\')">'+esc(s.name)+'</span> ('+s.items+')<br>';});
  r+='</p><p><b>Skipped:</b><br>';
  META.skippedSources.forEach(function(s){r+=esc(s.name)+' — '+esc(s.reason)+'<br>';});
  r+='</p>';document.getElementById('repbody').innerHTML=r;
  render(false);
}
init();
</script></body></html>
