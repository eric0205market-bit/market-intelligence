<script>
const ITEMS = [{"cat": "credit", "urgency": "deep", "source": "Macro Mornings / Timmer (Fidelity) analog", "title": "CoreWeave debt yields 16.2% — above the 12-13% telecom HY index showed at the March 2000 peak", "idea": "Timmer overlays 1994-2002 on today's S&P: April 2025 lines up with the Oct 1998 post-LTCM low, and the AI rally sits exactly at the early-2000 summit. CoreWeave implied yield went 7.1% to 9.0% to 16.2%; Oracle nearly doubled 4.0% to 7.8%. Telecom HY ran 8.8% to 27.1% in 2000-02 and equities bottomed the same month HY spreads peaked (Oct 2002).", "angle": "Neoclouds as this cycle's telecom carriers: credit cracks first while equity indices still sit near highs. Cleanest relative-value read on whether the AI unwind has a second leg.", "tweetA": "CoreWeave paper at 16.2%. Telecom HY at the March 2000 top was 12-13%. The equity market is arguing about multiples; the bond market already priced the funding problem. $CRWV $ORCL", "tweetB": "In 2002 equities bottomed the exact month HY spreads peaked. So the question isn't 'is AI real' - it's where neocloud spreads top out. That's the only chart that gives you the all-clear.", "charts": {"count": 2, "hot": true, "desc": "Timmer 1994-2002 S&P overlay with CoreWeave/Oracle implied yields vs telecom HY — 🔥 CHART WORTH SAVING"}, "link": "https://macromornings.substack.com/p/nasdaq-the-signal-nobody-saw-on-thursday", "id": 1}, {"cat": "positioning", "urgency": "deep", "source": "Macro Mornings", "title": "EPS +32%, P/E -50%: memory makers de-rated from 10.5x to 5.3x while estimates rose", "idea": "Since June 30, memory forward EPS +32% yet P/E 10.5x to 5.3x and market cap -33%. AI infra: est +31%, P/E 21.8x to 13.9x. Semis: est +30%, 21.1x to 13.8x; all 20 S&P semis de-rated. Software is the only group whose multiple expanded (21.0x to 24.4x, cap +28%). Micron in 2018 traded ~4x, fell 56% May-Dec while estimates rose, then EPS -47% and the stock +69% in 2019.", "angle": "Three analog years (2000: -13% next; 2018: +29%; 2022: +24%) differ only by next-year earnings. Market is pricing duration of peak margins, not level.", "tweetA": "3% EPS growers trade at nearly 2x the multiple of 30% EPS growers in semis. The market isn't paying for earnings, it's paying for how long they last - and it's saying 'not long'. $MU $NVDA", "tweetB": "Micron in 2018: 4x earnings, -56% while analysts raised numbers, then +69% the year after the trough was visible. Memory at 5.3x now. The only question is whether this is 2018 or 2000.", "charts": {"count": 1, "hot": true, "desc": "Table: estimate revisions vs P/E change vs market cap by group — 🔥 CHART WORTH SAVING"}, "link": "https://macromornings.substack.com/p/nasdaq-the-signal-nobody-saw-on-thursday", "id": 2}, {"cat": "macro", "urgency": "deep", "source": "Macro Mornings", "title": "$2.8T one-day wipeout beats COVID's record — but only 6.36% on the Nasdaq 100", "idea": "Nov 5: $2.8T of US market value lost in a session vs the prior record $2.69T (Mar 2020). Nasdaq 100 closed -6.36%, half of March 16, 2020's -12.19%. The author's 'signal nobody saw' is a small group of stocks that rose while the Nasdaq fell 6% - happened only 11 times in 40 years (answer is paywalled).", "angle": "Dollar records are a function of market size; the breadth inversion is the tell. Worth opening the PRO section for what the 11 prior instances preceded.", "tweetA": "$2.8T lost in a day is a record in dollars and a modest day in percent. The concentration is the story: that much value sits in a handful of names.", "tweetB": "Eleven times in 40 years a pocket of stocks rallied through a 6% Nasdaq drop. I'd love to know what the other ten looked like six months later.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://macromornings.substack.com/p/nasdaq-the-signal-nobody-saw-on-thursday", "id": 3}, {"cat": "macro", "urgency": "deep", "source": "Macro Mornings", "title": "Greenspan hiked 6 times into the 1999-2000 peak; Fed now 80% priced for Dec 9 hike", "idea": "October payrolls beat by ~100k; markets price ~80% odds of a 25bp hike Dec 9 after the September move to 4.00% upper bound. In 1999-2000 Greenspan hiked 6 times (4.75% to 6.50%) and the bubble peaked mid-cycle. Then 10Y fell 6.8% to 3.6% and FF to 1.25% while stocks halved - bonds were the shield. Author doubts that works this time.", "angle": "Hikes choke the most indebted borrowers first - neoclouds. Whether Treasuries still hedge with 3.7% CPI is the portfolio-construction question.", "tweetA": "A hike doesn't pop a bubble on the day. It chokes the most levered borrower first, and right now that's whoever financed GPUs at 16%. The Fed is tightening into the weakest part of the capex stack.", "tweetB": "Everyone remembers bonds saving 2000-02 portfolios. Fed funds went from 6.50% to 1.25% to make that happen. With CPI 3.7% and a Fed hiking, what exactly is the bond shield this time?", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://macromornings.substack.com/p/nasdaq-the-signal-nobody-saw-on-thursday", "id": 4}, {"cat": "macro", "urgency": "deep", "source": "Macro Mornings", "title": "Midterm seasonality: +12.4% avg in 6 months post-midterm, all 13 cycles positive", "idea": "Per Advisor Perspectives, the S&P averages +12.4% in the six months after a midterm, 13 of 13 positive; 12-month gains of ~4%, 4%, 12%, 14% after 2010/14/18/22. $1 in 1926 became $10,000+ (~10%/yr) across 17 presidents; major bear markets split by party.", "angle": "A friendly calendar vs a 2002-style credit regime. Seasonality is the bull case on the other side of the trade.", "tweetA": "13 for 13 on post-midterm six-month returns. Also 13 for 13 on none of those years having a Fed hiking into 3.7% CPI with AI credit at 16%. Small sample works both ways.", "tweetB": "Everyone is blaming the election for Thursday. The data says the White House color has never been the driver of a bear market - valuations, rates, credit, earnings. Look at which of those four is flashing.", "charts": {"count": 1, "hot": false, "desc": "$1 invested in 1926 chart"}, "link": "https://macromornings.substack.com/p/nasdaq-the-signal-nobody-saw-on-thursday", "id": 5}, {"cat": "geopolitics", "urgency": "deep", "source": "Phil Dauber / Market Musing", "title": "'Going to the mattresses': Miller named Chief of Staff, 30% odds of a massive Iran strike then withdrawal", "idea": "Dauber reads Trump elevating Stephen Miller to Chief of Staff (Wiles moved to political operations) as a doubling-down after the blowout, with Carlson/Vance pushing an America First split. His Iran call: a 'YUGE' strike including civilian infrastructure, followed by a 'mission accomplished' exit, 30% odds and 'sooner rather than later', with Bibi pushing for kinetic.", "angle": "Tail risk to Brent right after it fell 12.4% on peace hopes. Market is priced for the deal; Dauber is pricing the opposite exit.", "tweetA": "Brent -12.4% on deal hopes. Meanwhile one credible read has the exit being a massive strike first, 30% odds. If you're short crude into a Muscat headline, size for the other tail.", "tweetB": "Miller as Chief of Staff the week after a 7-seat Senate flip doesn't read like a pivot to compromise. Whatever you think of the odds, 'de-escalation' isn't the only path to a Hormuz exit.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://phildauber.substack.com/p/going-to-the-mattresses", "id": 6}, {"cat": "credit", "urgency": "deep", "source": "Phil Dauber / Market Musing", "title": "HY at 348bp (+22bp) but HYG lost only 0.26% — the gap is the whole short", "idea": "HY OAS 348bp on Nov 5, widest of the move; IG 93bp, CCC 1,320bp. The HY fund lost only 0.26% on the week. Dauber's regime call: credit and collateral shorts over equity beta; wrong if HY under 326bp with VIX under 22. Also long exchanges vs short card lenders (funding stress hits near-prime first); wrong if card delinquencies fall YoY.", "angle": "ETF price vs index spread dislocation is a trade; non-financial corporates still carry old low-coupon debt, so refinancing bill is ahead.", "tweetA": "HY spreads +22bp in a week and the HY ETF is down 26bp. Either the index is wrong or the ETF is. I know which one I'd rather be short. $HYG $JNK", "tweetB": "Volume pays the exchange whichever way this breaks; funding stress hits the near-prime card book first. $CME $ICE vs $COF $SYF - the cleanest pair in a credit-stress regime.", "charts": {"count": 1, "hot": false, "desc": "Chart 5: corporate debt cost barely following the 10Y up"}, "link": "https://phildauber.substack.com/p/going-to-the-mattresses", "id": 7}, {"cat": "macro", "urgency": "deep", "source": "Phil Dauber / Market Musing", "title": "The 30-year shrugged: equities priced growth, front end priced inflation, long bond priced neither", "idea": "2Y 4.51% (-5bp wk), 10Y 4.86% (-8bp), 30Y 5.26% (-5bp); 2s10s +35bp from +38bp, 5s30s +62bp. Author thinks the front end is wrong because the biggest new-capex source just got repriced; permitting freeze on data centers is disinflationary and the December hike price carries none of that. He's wrong if core CPI prints 0.4%+.", "angle": "A clean falsifiable macro view with a kill level. Tuesday's CPI decides it.", "tweetA": "Equities say growth scare. 2-year says hot inflation. The 30-year says nothing. Three markets, three stories - and Tuesday's core CPI picks the winner.", "tweetB": "A data-center permitting freeze is disinflationary, and the December hike price has zero of it in there. If you believe AI capex was the marginal driver of demand, the front end is the trade. Unless core is 0.4.", "charts": {"count": 1, "hot": false, "desc": "Chart 4: front end took payrolls, long end sat it out"}, "link": "https://phildauber.substack.com/p/going-to-the-mattresses", "id": 8}, {"cat": "macro", "urgency": "deep", "source": "Phil Dauber / Market Musing", "title": "Yen at 158.50 through a 5.96% Nikkei crash: the funding currency refused to rally", "idea": "Nikkei -5.96% Friday, USDJPY ~158.50, DXY +0.37% to 102.29. Dauber: a funding currency that doesn't rally in a crash says the selling was forced and local. Gold +5.0% to $4,079.60, copper -3.4%, BTC -1.5% to 75,733. Global M1 (Visseau) leads equities by ~6 months and has turned down again.", "angle": "No carry unwind in JPY means this isn't the Aug 2024 template; metals-plus-dollar is a policy hedge.", "tweetA": "Nikkei -6%, yen weaker. That's not a carry unwind, that's pod risk limits being hit. Different crash, different cure. $EWJ", "tweetB": "Gold +5% with a firmer dollar and falling copper. That's not an inflation hedge, that's a policy-credibility hedge - same one the 30-year is running.", "charts": {"count": 1, "hot": false, "desc": "Chart 8: global narrow money vs world stocks (6-month lead)"}, "link": "https://phildauber.substack.com/p/going-to-the-mattresses", "id": 9}, {"cat": "macro", "urgency": "watch", "source": "Phil Dauber / Market Musing", "title": "Oil and breakevens decoupled: TIPS liquidity premium may hide what the barrel did; PPI >5% share rising", "idea": "Brent $98.32 (-12.4%, worst week since early 2020), WTI $90.44. Visseau argues a war-driven liquidity premium in TIPS holds breakevens down, so the oil drop removes less inflation than screens imply. Share of countries with annual producer inflation above 5% is climbing again.", "angle": "If breakevens understate the oil shock, the oil unwind is less disinflationary than assumed - supports hike pricing.", "tweetA": "Oil and breakevens moved together for a decade, then stopped. If TIPS are carrying a war liquidity premium, the oil drop does less to inflation than the screen says. That's the case for the hike.", "tweetB": "Share of countries with producer inflation above 5% is rising again - while the US debates whether a 12% oil drop fixes everything. Global PPI is the series I'd put next to Tuesday's CPI.", "charts": {"count": 2, "hot": false, "desc": "Charts 6-7: oil vs breakevens; PPI >5% share of countries"}, "link": "https://phildauber.substack.com/p/going-to-the-mattresses", "id": 10}, {"cat": "positioning", "urgency": "deep", "source": "Phil Dauber / Market Musing", "title": "A third of S&P members are 20%+ off highs while forward estimates sit at records — the April 1999 echo", "idea": "Index near 7,377 hides a third of members 20%+ below 52-week highs. In April 1999 narrow momentum ran ahead of the index, S&P fell ~9% then ran 26% into the top. Semi index -12.15% Thursday, worst since March 2020; Russell -2.05%. Paulsen: cyclical/defensive ratio collapsing since August.", "angle": "Argues for single names over index; dispersion warning not a direction call. Friday's bounce 'a few chip names wearing an index' - wrong above SPX 7,444 with 4+ sectors up.", "tweetA": "A third of the index is in a 20% drawdown with earnings estimates at records. That's either the best entry in two years or the 1999 setup. The tell: does guidance hold next round.", "tweetB": "'The Friday bounce was a few chip names wearing an index.' Falsifiable: SPX above 7,444 with four sectors up. Put it on your screen.", "charts": {"count": 3, "hot": false, "desc": "Charts 2-3: share of members 20% off highs; 1999 momentum analog"}, "link": "https://phildauber.substack.com/p/going-to-the-mattresses", "id": 11}, {"cat": "positioning", "urgency": "deep", "source": "Damped Spring 101", "title": "'A Pod blew up today': four forcing mechanisms, and why pods fail by shoulder tap", "idea": "After SPX -4.3% and NDX -6.3% on Nov 5, the author separates liquidation forcing mechanisms: debt repayment/margin calls, redemptions, shoulder taps, personal drawdown intolerance. Pod blowups are almost always shoulder taps (rules-based drawdown limits). Medium deal = cascade across pods running similar strategies; big deal = pod shops hit by margin calls. Includes the 'sold put problem' of pod comp.", "angle": "Read-through: not a debt-driven unwind, so it resolves fast unless correlation drags whole shops. Mentions Situational Awareness blowup this summer as a margin-call case.", "tweetA": "Pods don't blow up from margin calls, they blow up from a tap on the shoulder at -5%. That means selling is time-stamped to the drawdown limit, not to price. Watch Monday open.", "tweetB": "Pod comp is a sold put: they pay the winners, can't claw back from the losers. That's why the stop-outs are so violent. The market is short a put that the PM never owned.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://dampedspring101.substack.com/p/a-pod-blew-up-today", "id": 12}, {"cat": "positioning", "urgency": "deep", "source": "BEP Research / Ben Pouladian (subscriber chat)", "title": "Pods explain part of the AI selloff: 'has the thesis actually changed?'", "idea": "Pouladian shares a thread on multi-manager pods: small teams with strict risk limits can hold different stocks but be exposed to the same factor; when a crowded trade moves against them they de-risk together, amplifying the drop. His own filter after a week of political and AI-tech selling: has the thesis actually changed?", "angle": "Pairs with Damped Spring and Singh/Walleye: same mechanism from three vantage points.", "tweetA": "Different stocks, same factor. Pods don't diversify each other - they sell each other. Thursday was a single trade with 200 tickers.", "tweetB": "The only useful question after a forced selloff: did the thesis change or just the holders? Price action tells you who's selling, not why the business is worth less.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://newsletter.bepresearch.com/", "id": 13}, {"cat": "positioning", "urgency": "act", "source": "David Lin Report / Jay Singh (Special Situations)", "title": "Walleye closing all equity pods, Engineers Gate firing PMs, levered ETFs to sell ~$52B", "idea": "Singh (relaying, some unconfirmed): $17B Walleye closing all equity pods after its worst month since March 2020; Engineers Gate ($23B) apparently fired managers; Millennium pulled ~$1B from Trolus; Lone Pine allegedly -30% YTD. Market-neutral pods down 5% must cut half their books within hours. Levered ETFs must sell ~$52B; SOXL -85% in two months, retail no longer buying dips. 2027 capex $1.2-1.3T could be 20-30% lower. Advises 20-30% cash.", "angle": "Unconfirmed paraphrases - verify before posting names. The $52B levered-ETF mechanical sell is the Monday risk.", "tweetA": "Reported: a $17B multi-manager closing every equity pod, another $23B firing PMs. If even half of it is true, Thursday wasn't price discovery. It was an inventory transfer.", "tweetB": "$52B of levered ETF selling is mechanical, not a view. SOXL down 85% and retail stopped buying. Forced sellers end when they run out of positions, not when the news improves. $SOXL $SMH", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://davidlinreport.substack.com/p/trillions-wiped-out-as-liquidation", "id": 14}, {"cat": "macro", "urgency": "deep", "source": "David Lin Report / Steve Hanke", "title": "AI = 96% of Q3 GDP growth (3.4% annualized); spend 3.6% of GDP vs 0.7% canals, 2.2% railroads", "idea": "Hanke: AI investment drove 96% of 3.4% annualized Q3 GDP; spending ~3.6% of GDP vs canals 0.7%, railroads 2.2%, electrification 0.5%, highways 1.1%, telecom 1.1%. Projected AI revenue 58% short of a 12% return; 55% of AI investment circular within hyperscalers. Credit boom + asset prices lift crisis probability to 40% vs 7% normal; burst = market -40%, tech -70%. Germany recession likely; France already in one.", "angle": "Numbers are his estimates; the 96% share is a striking headline for a thesis that capex = the economy.", "tweetA": "96% of Q3 GDP growth from one capex category. Railroads peaked at 2.2% of GDP. AI is projected at 3.6%. Not a sector, a macro regime.", "tweetB": "Strip out AI and Q3 growth was ~0.1%. Which means when the Fed hikes into a data-center permitting freeze, it isn't tightening against an economy, it's tightening against one project.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://davidlinreport.substack.com/p/trillions-wiped-out-as-liquidation", "id": 15}, {"cat": "energy", "urgency": "deep", "source": "David Lin Report / Mike McGlone (Bloomberg Intelligence)", "title": "McGlone: oil to $50, CPI negative in a year, copper inventories +1,200% vs 5y average", "idea": "McGlone: BTC failing at $80k and copper under $6.40 signal a cascade; Nasdaq back to 200-DMA; YTD gain 8% from 30%. Oil to ~$50 by next year; US/Canada surplus near 9mbpd vs 4-5mbpd in 2022. CPI (3.7%) could go negative. Gold at highest vs basket of Treasuries in ~4 decades; copper 50-week correlation with S&P at a record; CME copper stocks ~800kt, +1,200% vs 5y MA.", "angle": "Hard bear case on everything; the inventory and correlation facts are what to verify. Copper as a growth/AI proxy.", "tweetA": "Copper correlation to the S&P is at a record, and CME stocks are 12x the 5-year average. Copper isn't a safe commodity story right now - it's an AI-capex beta. $COPX $FCX", "tweetB": "Gold at the highest vs Treasuries in four decades. The same week Treasuries are the market's haven. One of these relative prices is wrong.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://davidlinreport.substack.com/p/trillions-wiped-out-as-liquidation", "id": 16}, {"cat": "geopolitics", "urgency": "deep", "source": "David Lin Report / Matt Gertken (BCA)", "title": "Gertken: inflation top issue for 50% of voters vs 5-10% for Iran nukes; war at 33% support", "idea": "Gertken: vote was a rebuke over gasoline and a war with 33% support; 50% of voters named inflation top issue, only 5-10% Iran's nuclear program. Expects face-saving strikes over three months, a brief oil spike, then exit; Hormuz ceasefire easy (lift blockade), nuclear deal hard. Iran wants to defend a $90 oil floor for two years via incomplete ceasefires. Democrats' popular bills (ACA, Medicare, housing) could raise deficits; 70% oppose tariffs, effective rate stays ~10%.", "angle": "Pairs with Dauber's 30% strike scenario; both see strikes before exit, differ on size.", "tweetA": "Iran needs oil at $90 for two years to survive. The US needs it below that before midterms. That's the actual negotiation.", "tweetB": "Two analysts, same week: both expect a strike before the exit. One calls it face-saving, one calls it huge. The oil curve has to pick.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://davidlinreport.substack.com/p/trillions-wiped-out-as-liquidation", "id": 17}, {"cat": "geopolitics", "urgency": "watch", "source": "David Lin Report / Tavi Costa (Azuria)", "title": "Brazil ETF -20% in a day after Lula wins; Costa cut 70%; talk of rate cuts from ~15% to 5%", "idea": "Costa: Brazil ETF fell 20% in one day after Lula's fourth term; Bolsonaro had 80%+ odds going in; he cut ~70% of exposure beforehand. Sees possible intervention to cut rates from ~15% to 5% (financial repression: good for stocks, bad for BRL). Fed tightening 'suicidal' for the US; precious metals oversold with miners' breadth among worst in history; 12-24 month window.", "angle": "'Certain' EM outcomes are where the sizing mistakes happen. Brazil financial repression is a currency trade.", "tweetA": "Brazil -20% in a session with an 80% favorite losing. Prediction markets and polls aren't hedges, and 'certain' EM elections are the most expensive kind of certainty. $EWZ", "tweetB": "Brazil policy rate at ~15%, talk of getting to 5%. That's not a pivot, that's financial repression - great for local equities, dangerous for the real.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://davidlinreport.substack.com/p/trillions-wiped-out-as-liquidation", "id": 18}, {"cat": "tech", "urgency": "deep", "source": "David Lin Report / Clem Chambers (ANewFN)", "title": "China reportedly blocks SoftBank's $5.4B bid for ABB Robotics: 'technology taken to China doesn't come back'", "idea": "Chambers: tech selloff could hit -25% to -40% unless Democrats signal they aren't anti-AI; China caught up in AI, leads robotics, will build 3x America's energy by 2030. China reportedly blocked SoftBank's $5.4B bid for ABB's robotics unit. Democrats passed a nuclear package. BTC drop tied to Clarity Act hopes ending.", "angle": "China using export-control logic in reverse on robotics M&A. Energy build-out is the AI moat narrative.", "tweetA": "China blocked a $5.4B sale of ABB's robot unit to SoftBank. After years of US export controls, Beijing is now running the same playbook on the asset it's best at. $ABB $9984.T", "tweetB": "3x the energy build by 2030 is the number AI bulls skip. The AI race may be won in transformers and substations, not GPUs.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://davidlinreport.substack.com/p/trillions-wiped-out-as-liquidation", "id": 19}, {"cat": "tech", "urgency": "deep", "source": "David Lin Report", "title": "Palantir US commercial ($984M) passes US government ($953M) for the first time; Apple China $17.5B misses", "idea": "Palantir revenue +96% to $2.3B; US commercial +148% to $984M above US gov at $953M; guide implies +15% QoQ vs +20% just delivered; trailing P/E ~123; net cash $10.56B. Apple revenue +12% to $114.5B but Greater China $17.5B vs $18.75B est; gross margin 47.9% (1pt from tariff refunds), guide 45-46% on memory and Siri AI costs. Both fell despite beats.", "angle": "Beats don't hold stocks: sell the guide. Apple's margin guide is a memory-cost tell showing up in consumer hardware.", "tweetA": "Palantir's commercial business is now bigger than its government one in the US. The 'government contractor' discount is gone. The multiple of 123x is the problem, not the revenue. $PLTR", "tweetB": "Apple guides gross margin down 2 points because of memory costs. The memory supercycle isn't an AI-only story - it's a tax on everyone who buys DRAM. $AAPL $MU", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://davidlinreport.substack.com/p/trillions-wiped-out-as-liquidation", "id": 20}, {"cat": "positioning", "urgency": "deep", "source": "David Lin Report / Soloway & Horwitz", "title": "Two traders, two gold calls: $3,500 near-term vs $5,500; Micron to $465 in 12-18 months", "idea": "Soloway: S&P bullish above lower trendline, upside just over 8,000; gold could dip to $3,500 within weeks but is a long-term bull; won't buy Micron, sees $465 within 12-18 months as new memory fabs open; BTC needs to hold $75,500 or goes $66-67k. Horwitz: shorts rallies, S&P sell orders at 7,620, Nasdaq -5-8% by year-end, selling 10Y futures, short crude (curve ~$78 in a year), buying gold at $3,900 targeting $5,500.", "angle": "Same data, opposite desks. Useful sentiment map.", "tweetA": "One trader thinks gold goes to $3,500 near term, another is buying $3,900 for $5,500. When two disciplined people disagree by that much, size is the only edge.", "tweetB": "Soloway's reason to avoid memory: new fabs opening. That's the only bear argument that matters in a cycle - supply, not demand. Watch capex announcements. $MU $WDC", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://davidlinreport.substack.com/p/trillions-wiped-out-as-liquidation", "id": 21}, {"cat": "tech", "urgency": "deep", "source": "Herb Greenberg's Red Flag Alerts", "title": "'Supply-constrained' Nvidia is financing demand — and Intel said demand was 'more balanced'", "idea": "Greenberg's chain of dots: Nvidia on the last call talked lower margins while rolling out revenue-sharing and financing more customers, yet says it's capacity constrained. 'Why generate demand if supply-constrained?' Then Anthropic's IPO filing in October (growth slowing, per his read), then Intel: 'demand in Q3 was more balanced.' Plus Oklo up 560% on press releases, SoundHound -70%, Krispy Kreme beating Nvidia YTD.", "angle": "'Just trust us' debt-powered buildout. Supply/demand for compute crossing is the key question.", "tweetA": "You don't need to subsidize demand for a product you can't make enough of. Nvidia financing customers while 'supply-constrained' is the sentence I'd put in front of every AI bull. $NVDA", "tweetB": "Krispy Kreme beat Nvidia this year. A $4 donut stock. That's not a joke, that's a market telling you what 'quality' meant in 2026. $DNUT", "charts": {"count": 2, "hot": true, "desc": "Krispy Kreme vs Nvidia YTD; Oklo 560% — worth opening"}, "link": "https://www.herbgreenberg.com/p/the-wrap-where-from-here", "id": 22}, {"cat": "labor", "urgency": "deep", "source": "BMO Weekly Viewpoint via Dark Side of the Boom", "title": "Payrolls +165k with strongest net revision since May; hiring momentum despite lower labor supply", "idea": "BMO's Anderson: October payrolls +165,000, unemployment lower, faster wage growth. The consensus was that an ageing population and lower immigration meant weak hiring was inevitable; this breaks that. Revisions to prior two months were the strongest positive net adjustment since May. Dem sweep changes politics but not fiscal problem; next CPI is a bigger Fed test than AI equity turbulence.", "angle": "Breakeven payroll thresholds being re-tested. Hot labor + hawkish Fed + equity crack.", "tweetA": "Everyone said the breakeven for payrolls was near zero because of immigration. +165k says otherwise. That means either demand is much hotter than anyone modeled or the labor-supply story was wrong.", "tweetB": "The hike case needs one thing: labor that doesn't need data centers to stay hot. +165k, 4.1%, wages +0.4%. It does.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://thedarksideoftheboom.substack.com/p/bmo-weekly-viewpoint-the-us-jobs", "id": 23}, {"cat": "macro", "urgency": "deep", "source": "Goldman Rates via Dark Side of the Boom", "title": "Goldman: G4 10Y yields 25-50bp off highs; prefers belly, inflation-linked, carry as rates vol falls", "idea": "Falling energy prices and liquidation of crowded AI positions pulled G4 10Y yields 25-50bp below recent highs. Goldman favors the middle of the Treasury curve, sees an opportunity in inflation-linked bonds (an unusually poorly behaved part of the market) and expects falling rates vol to support carry. European energy decline affects central banks unevenly.", "angle": "Contrasts with Dauber's 'long end shrugged'; ILBs as the relative-value trade.", "tweetA": "Goldman likes the belly, ILBs, and carry. Dauber says breakevens are suppressed by a war liquidity premium. Same instrument, same week: a trade.", "tweetB": "Rates vol falling means carry works again. The one thing that stops it is a CPI print that says the Fed isn't done. Tuesday.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://thedarksideoftheboom.substack.com/p/bonds-redemption-goldman-sees-the", "id": 24}, {"cat": "regulation", "urgency": "deep", "source": "Unchained", "title": "Crypto's super PACs backed 28 of 30 House winners but only 1 of 4 in the Senate; $21.9M of $89.5M landed on a winner", "idea": "Democrats swept Congress; Sherrod Brown survived $55M+ of crypto spending. Unchained's FEC tally: PACs backed the winner in 28/30 called House races and 1/4 Senate races. Only $21.9M of $89.5M on projected races hit a winner. Warren likely chairs Senate Banking; the Clarity Act looks dead; Fairshake may rethink before 2028.", "angle": "Regulatory re-pricing: market structure bill odds collapse; SEC/CFTC rulemaking becomes the path.", "tweetA": "$89.5M spent, 24 cents on the dollar landed on a winner. The industry bought the House and lost the Senate it needed. $COIN $HOOD", "tweetB": "The Clarity Act is dead and Warren is in line to chair Banking. Crypto policy goes back to rulemaking and enforcement. That's a different asset class to underwrite.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://unchainedcrypto.beehiiv.com/p/weekly-recap-crypto-s-midterm-losses-binance-hack-fallout", "id": 25}, {"cat": "crypto", "urgency": "deep", "source": "Unchained", "title": "BTC fell less than the Nasdaq 100 on a >5% down day — only the second time ever (Krüger)", "idea": "Nasdaq Composite -5.52%, NDX -6.36% Thursday; BTC low $75,208 (lowest since Sep 16). Coinbase and Strategy fell >9%. Election-night dip to ~$75,600, rebound past $81k with $560M of $950M liquidations shorts. Alex Krüger: second time BTC outperformed on a >5% Nasdaq drop.", "angle": "BTC still trades as tech beta, but less than the equities that hold it.", "tweetA": "BTC -3% on a day the Nasdaq 100 lost 6.4%. It's the second time that's ever happened on a >5% drop. A weaker correlation shows up in the tails first. $BTC", "tweetB": "$560M of shorts liquidated on a 7% bounce, then the longs got flushed 48 hours later. This tape is paying nobody. Flat is a position.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://unchainedcrypto.beehiiv.com/p/weekly-recap-crypto-s-midterm-losses-binance-hack-fallout", "id": 26}, {"cat": "crypto", "urgency": "act", "source": "Unchained", "title": "Binance's $6.34B hack: tampered Homebrew package, fake job interview, EIP-7702 across 50 transactions", "idea": "Four-month path: a developer installed a tampered Homebrew package in June, a second engineer fell for a fake job interview in September, a stolen deployment token let the attacker on Oct 29 use EIP-7702 across 50 signing transactions to take hot wallets. MPC meant no single key could revoke access. Withdrawals reopened: $4.649B out vs $1.01B in on day one; net ep", "source": "Unchained", "title": "North Korea answers the FBI by pointing at Trump's crypto reserve; Mercado Bitcoin ($38M) and Crédit Mutuel Arkéa (~$133M) hacked", "idea": "Kim Yo Jong rejected the FBI's attribution, suggesting look at who receives recovered crypto. Mercado Bitcoin halted withdrawals after a $38M breach four days after Binance; ZachXBT flagged ~$133M from a European institution, named Crédit Mutuel Arkéa, which says attackers worked through its own account via a service provider and funds may have gone into crypto; Monero used. THORChain restarted swaps Nov 3.", "angle": "Hack cluster: nation-state laundering rails (THORChain, Monero). Compliance pressure on swap venues.", "tweetA": "Four hacks in a week: Binance, Mercado Bitcoin, a French bank, THORChain's launder rail. At this point the biggest crypto holder isn't BlackRock, it's a regime. $BTC", "tweetB": "North Korea's answer to being named for stealing $6B: look at who holds the recovered coins. Zero evidence, perfect propaganda. Strategic reserve branding has a side effect.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://unchainedcrypto.beehiiv.com/p/weekly-recap-crypto-s-midterm-losses-binance-hack-fallout", "id": 29}, {"cat": "crypto", "urgency": "watch", "source": "Unchained", "title": "Circle cuts ~5% of workforce while revenue +17% to $865M; Zcash NU7 burns 60% of fees and cuts blocks to 25s", "idea": "Circle booked $9.1M restructuring (~55 people by Unchained's estimate); revenue and reserve income +17% to $865M helped by ARC presale, opex +16% to $245M. Zcash NU7 activated: 60% of block fees removed from circulation and reissued from 2031, block time 75s to 25s, Sprout pool closed leaving ~12,224 ZEC (~$16M) stranded. Also: SEC staff say unaffiliated governance voters generally aren't a controlling group; Justin Sun seeks sanctions on World Liberty after it disclosed UAE citizenship.", "angle": "Stablecoin issuer cost discipline; fee-recycling tokenomics; SEC governance guidance reduces central-party risk.", "tweetA": "Circle revenue +17%, headcount -5%. The stablecoin business isn't struggling, it's being run for margin. $CRCL", "tweetB": "Zcash now burns 60% of fees and recycles them in 2031. A 21M cap with a fee-escrow. Monetary policy by hard fork is quietly back. $ZEC", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://unchainedcrypto.beehiiv.com/p/weekly-recap-crypto-s-midterm-losses-binance-hack-fallout", "id": 30}, {"cat": "tech", "urgency": "deep", "source": "NLP Newsletter / Elvis Saravia", "title": "GPT-6 Cyber: 948 distinct Linux privilege-escalation exploits at ~$1,279 each, rated Critical", "idea": "OpenAI's Linux pipeline: 5,034 audit targets, 2,308 candidate findings, 1,724 reproduced, 948 working LPE exploits for $1,213,430 in API credits (~$1,279 each) vs 166 for GPT-5.6 Sol in July. ExploitGym 48.5% (from 32.1%), 95% on RemoteExploitBench; classified Critical in cybersecurity under Preparedness; 81 high-severity Firefox bugs. In an early run 20 of 200 exploits used a different 0-day than assigned. Out-of-scope avoidance 99.93%.", "angle": "Offensive security cost curve: ~$1.3k per root exploit. Defender-side asymmetry and patch-cycle economics.", "tweetA": "$1,279 per working root exploit. Six months ago a single Linux LPE was a conference talk. Patch cycles are a human-speed process facing a $1k machine-speed attack. $CRWD $PANW", "tweetB": "20 of 200 'exploits' reached root through a different 0-day than assigned. The agent found more bugs than it was asked for. The next unit test for these systems is scope, not capability.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://nlp.elvissaravia.com/p/ai-agents-weekly-gpt-6-cyber-weight", "id": 31}, {"cat": "culture", "urgency": "watch", "source": "a16z / Jeff Weiss", "title": "Hip-hop has no Social Security: Paid in Full grants to the function init(){
  document.getElementById('sub').textContent=META.date+' · '+META.time+' · '+ITEMS.length+' items';
  var r='<p>Window: '+META.windowStart+' to '+META.windowEnd+'. Emails outside this window were not processed.</p><p>Emails in window: '+META.emailsInWindow+' · read: '+META.emailsRead+' · items: '+META.itemsExtracted+'</p><p><b>Included sources</b> (click to filter):<br>';
  META.includedSources.forEach(function(s){r+='<span class="sl" onclick="filterBySrc(\''+s.name.replace(/'/g,"\\'")+'\')">'+esc(s.name)+' ('+s.items+')</span>';});
  r+='</p><p><b>Skipped:</b></p><ul>';META.skippedSources.forEach(function(s){r+='<li>'+esc(s.name)+' — '+esc(s.reason)+'</li>';});
  document.getElementById('rep').innerHTML=r+'</ul>';
  render(false);
}
init();
</script></body></html>
