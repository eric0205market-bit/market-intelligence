es can still be unlocked opportunistically outside formal development pipelines.", "quote": null, "locator": "Apparently we owe this sequel to Josh Gad", "quote_verified": false}, {"claim": "Spaceballs: The New One's own official synopsis mocks the industry's reliance on legacy IP, describing its villain's threat as \"so completely lacking in any original ideas, that it has vowed to bring back the past... every last bit of it,\" and joking that among threats one can fight, \"the reboot is not one of them.\"", "speaker": "Jennifer Ouellette", "type": "contrarian", "entities": ["Amazon MGM Studios", "Spaceballs"], "conviction": "medium", "so_what": "A studio using its own marketing copy to satirize reboot culture signals audience fatigue with legacy IP has become mainstream enough that studios now lean into the joke rather than hide it, a marketing tactic worth watching as more franchises recycle this self-aware framing.", "quote": "so completely lacking in any original ideas, that it has vowed to bring back the past… every last bit of it", "locator": "Somehow, Dark Helmet has returned!", "quote_verified": true}, {"claim": "Amazon MGM Studios staged an elaborate SDCC panel parodying extravagant Marvel-style panels for Spaceballs: The New One even though the film has no publicly released trailer yet and won't hit theaters for another nine months.", "speaker": "Jennifer Ouellette", "type": "anecdote", "entities": ["Amazon MGM Studios", "Marvel", "Spaceballs"], "conviction": "medium", "so_what": "Studios can generate convention buzz well ahead of having finished marketing assets by substituting comedic self-parody for footage, a lower-cost hype tactic other franchises could copy for early-stage titles.", "quote": null, "locator": "Amazon MGM Studios from putting together an SDCC panel", "quote_verified": false}]}], "insight_total": 8, "top_entities": ["Prime Video", "HBO Max", "Amazon MGM Studios", "Blade Runner 2099", "Rings of Power", "Lanterns", "Spaceballs: The New One", "Josh Gad", "Mel Brooks", "Ridley Scott", "Tolkien estate"], "source_meta": {"author": "Jennifer Ouellette", "word_count": 1477, "paywalled": false}}, {"record_id": "1fba2d69b76df1da", "source_type": "technology", "source_name": "InfoQ", "source_url": "https://www.infoq.com/news/2026/07/eks-version-rollback/", "title": "Amazon EKS Adds Kubernetes Version Rollback Within 7 Days of an Upgrade", "published_date": "2026-07-26", "language": "en", "processed_at": "2026-07-26T12:52:01Z", "processor": "claude-code-sub-opus", "tags": ["Tech", "Positioning"], "gist": "Amazon EKS now lets teams roll back a cluster's Kubernetes control plane to the prior minor version within 7 days of an upgrade, closing a safety gap that had made in-place upgrades a 'one-way door' for regulated enterprises. AWS arrives after GKE (which shipped control-plane rollback with 1.33) but ahead of Azure AKS, which only supports node-pool-level rollback.", "themes": [{"theme": "EKS Rollback Mechanics", "insights": [{"claim": "Amazon EKS now supports reverting a cluster's control plane to its previous Kubernetes version within 7 days of an upgrade, rolling back the API server and control plane components while preserving all etcd data, workloads, and persistent volumes.", "speaker": "Renato Losio", "type": "data_point", "entities": ["Amazon EKS", "Kubernetes", "etcd"], "conviction": "high", "so_what": "A time-boxed, non-destructive undo mechanism directly lowers the perceived operational risk of staying current on Kubernetes versions, a lever AWS can use to increase upgrade compliance across its enterprise EKS base.", "quote": null, "locator": "Amazon EKS has recently introduced support", "quote_verified": false}, {"claim": "Rollbacks proceed one minor version at a time, mirroring EKS's incremental upgrade path, and EKS runs automated 'cluster insights' checks for issues like node version mismatches or add-on dependency conflicts before allowing a rollback, though a --force flag can bypass these checks.", "speaker": "Renato Losio", "type": "data_point", "entities": ["Amazon EKS"], "conviction": "high", "so_what": "Built-in guardrails suggest AWS is trying to prevent rollback from becoming its own source of incidents, but the --force override is a residual risk surface worth watching for misuse in fast-moving incident response.", "quote": null, "locator": "Rollbacks work one minor version at a time", "quote_verified": false}, {"claim": "For clusters running EKS Auto Mode, EKS automatically rolls back worker nodes before reverting the control plane, and a new cancel API lets teams stop a node rollback mid-process and adjust disruption budgets to speed up or change their approach.", "speaker": "Renato Losio", "type": "data_point", "entities": ["Amazon EKS", "EKS Auto Mode"], "conviction": "high", "so_what": "Auto Mode customers get a more automated, hands-off rollback experience than self-managed node groups, giving AWS another reason to steer customers toward its managed node abstraction over DIY node management.", "quote": "we’ve introduced a cancel API that lets you stop a node rollback at any point", "locator": "To give you control over this process", "quote_verified": true}, {"claim": "The rollback feature is available now at no additional cost in every region where EKS operates, applies to Kubernetes versions under both EKS standard and extended support, though node-level rollback is restricted to EKS Auto Mode clusters while control-plane rollback applies to all EKS clusters.", "speaker": "Renato Losio", "type": "data_point", "entities": ["Amazon EKS"], "conviction": "high", "so_what": "A zero-cost safety net removes a common budget objection to upgrading promptly, which should push more of AWS's regulated/conservative customer base toward staying current rather than accumulating version debt.", "quote": null, "locator": "Kubernetes version rollbacks are available now", "quote_verified": false}, {"claim": "Unlike Amazon ECS, AWS's own proprietary container orchestrator, EKS is a managed service where AWS runs and maintains the Kubernetes control plane itself, which is why control-plane upgrade risk is a distinctly EKS/Kubernetes problem that this rollback feature is built to address.", "speaker": "Renato Losio", "type": "framework", "entities": ["Amazon EKS", "Amazon ECS"], "conviction": "medium", "so_what": "By narrowing the operational-safety gap that used to favor ECS's simplicity, AWS reduces one argument enterprises might use to pick ECS over EKS for new container workloads.", "quote": null, "locator": "Unlike Amazon ECS, AWS's proprietary container orchestrator", "quote_verified": false}]}, {"theme": "The One-Way-Door Upgrade Problem", "insights": [{"claim": "AWS solutions architect Micah Walter argues that because Kubernetes ships three minor versions per year, teams operating hundreds of clusters -- especially in regulated environments -- often delay upgrades entirely since they lack confidence they can recover from a failed update, leaving clusters stuck on older versions, missing security patches, and eventually running up against extended support timelines.", "speaker": "Renato Losio", "type": "causal", "entities": ["AWS", "Micah Walter", "Kubernetes"], "conviction": "high", "so_what": "This frames stale, unpatched Kubernetes clusters as a systemic security-exposure risk concentrated in regulated industries; a rollback safety net that measurably raises upgrade frequency would be a leading indicator of reduced enterprise security debt on EKS.", "quote": "With Kubernetes releasing three minor versions per year, teams managing hundreds of clusters, especially in regulated environments, often delay upgrades entirely because they aren’t confident they can recover if something goes wrong.", "locator": "Explaining why upgrading a Kubernetes control plane", "quote_verified": true}, {"claim": "Open source Kubernetes itself has no native control-plane rollback -- KEP-4330 proposes adding emulated versions to enable it -- so organizations running vanilla Kubernetes have instead relied on workarounds like bake periods, staggered rollout groups, automated sign-offs, and drawn-out upgrade cycles to manage the risk.", "speaker": "Renato Losio", "type": "framework", "entities": ["Kubernetes", "KEP-4330", "Amazon EKS"], "conviction": "medium", "so_what": "AWS's rollback is patching a gap in upstream Kubernetes rather than merely simplifying an existing capability, which is a genuine differentiator for managed Kubernetes vendors versus teams self-hosting vanilla Kubernetes.", "quote": null, "locator": "Open source Kubernetes lacked a control plane rollback", "quote_verified": false}]}, {"theme": "Cost of Legacy Workarounds", "insights": [{"claim": "Ismail Baig, a senior cloud and DevOps leader at Uniphore, says that before native rollback, teams had two expensive workarounds: blue/green cluster deployments that doubled infrastructure cost during upgrades, and manual snapshots that consumed significant engineering hours without reliably guaranteeing a clean recovery.", "speaker": "Renato Losio", "type": "data_point", "entities": ["Ismail Baig", "Uniphore", "Amazon EKS"], "conviction": "high", "so_what": "Quantifies a concrete FinOps benefit of native rollback: eliminating the temporary infra-cost doubling from blue/green upgrade patterns is a direct, measurable cloud-spend saving for EKS customers.", "quote": "Before this, teams had two workarounds, both expensive: Blue/green cluster deployments that doubled infra cost during upgrades. Manual snapshots that ate engineering hours and still weren't guaranteed to work cleanly.", "locator": "Ismail Baig, senior cloud & DevOps leader at Uniphore", "quote_verified": true}]}, {"theme": "Hyperscaler Rollback Race", "insights": [{"claim": "AWS is not first to market with this capability: Google's GKE already introduced control-plane minor-version rollback with GKE 1.33, built on an upstream Kubernetes capability Google co-developed with the community, while Azure AKS still offers only partial support limited to node-pool rollbacks.", "speaker": "Renato Losio", "type": "contrarian", "entities": ["GKE", "Google", "Azure AKS", "AWS", "Amazon EKS"], "conviction": "high", "so_what": "EKS is closing a competitive gap versus GKE rather than pioneering the feature, but it leapfrogs Azure on this specific operational-safety axis -- a data point enterprises can use when comparing managed Kubernetes platforms for upgrade risk tolerance.", "quote": null, "locator": "AWS is not the first cloud provider", "quote_verified": false}]}, {"theme": "Practitioner Reaction", "insights": [{"claim": "The rollback capability had been a long-standing request from the AWS community, and practitioner reactions to its release were notably strong: Corey Quinn of The Duckbill Group called it an overdue 'undo button' that arrived only after years of ops teams building bake periods and month-long ceremonies, while DevOps engineer Ashref Gamoudi said AWS 'just solved one of the biggest fears of every Kubernetes engineer.'", "speaker": "Renato Losio", "type": "anecdote", "entities": ["Corey Quinn", "The Duckbill Group", "Ashref Gamoudi", "Tnker", "Amazon EKS"], "conviction": "high", "so_what": "Unprompted, emphatic practitioner endorsement across multiple independent commentators signals this closes a widely-felt operational pain point, which AWS can leverage in enterprise renewal and competitive-sales conversations to reduce EKS objections.", "quote": "An undo button for Kubernetes upgrades, arriving only after years of ops teams building bake periods and month-long ceremonies to avoid the one-way door.", "locator": "Corey Quinn, chief cloud economist at The Duckbill Group", "quote_verified": true}]}], "insight_total": 10, "top_entities": ["Amazon EKS", "AWS", "Kubernetes", "GKE", "Google", "Azure AKS", "Amazon ECS", "Corey Quinn", "Micah Walter", "KEP-4330"], "source_meta": {"author": "Renato Losio", "word_count": 1169, "paywalled": false}}, {"record_id": "c231404812152569", "source_type": "technology", "source_name": "InfoQ", "source_url": "https://www.infoq.com/news/2026/07/pixelsmash-vulnerability/", "title": "AI-Enabled Security Researchers Discover How a Crafted Video Can Provide Attackers Access to Your PC", "published_date": "2026-07-26", "language": "en", "processed_at": "2026-07-26T12:52:01Z", "processor": "claude-code-sub-opus", "tags": ["Tech", "AI"], "gist": "JFrog Security Research disclosed PixelSmash, a 16-year-old heap out-of-bounds write in FFmpeg's MagicYUV decoder (CVE-2026-8461, CVSS 8.8) that lets attackers gain remote code execution via a simple 50KB crafted AVI file with no authentication, and the article frames the find as part of a new wave of bug discovery driven by cybersecurity-focused frontier AI models.", "themes": [{"theme": "AI-driven bug hunting wave", "insights": [{"claim": "The discovery of a 16-year-latent FFmpeg vulnerability, despite the project's extensive automated testing history, is presented as part of a new wave of security flaw discovery enabled by the introduction of cybersecurity-focused frontier AI models.", "speaker": "Olimpiu Pop", "type": "thesis", "entities": ["JFrog Security Research", "FFmpeg", "frontier AI models"], "conviction": "medium", "so_what": "Signals that AI-augmented security research is now surfacing decades-old vulnerabilities in ubiquitous open-source infrastructure faster than traditional fuzzing did, a potential growth driver for AI-enabled security/code-scanning vendors like JFrog and a repricing event for risk in legacy dependencies.", "quote": "is part of the latest wave of security flaw discovery since the introduction of cybersecurity-focused frontier models.", "locator": "The discovery of a bug that has remained latent", "quote_verified": true}]}, {"theme": "PixelSmash vulnerability mechanics", "insights": [{"claim": "PixelSmash is tracked as CVE-2026-8461 with a CVSS score of 8.8 (High), caused by a heap out-of-bounds write in FFmpeg's MagicYUV decoder that can crash any application using FFmpeg or enable remote code execution.", "speaker": "Olimpiu Pop", "type": "data_point", "entities": ["FFmpeg", "MagicYUV", "CVE-2026-8461", "CISA"], "conviction": "high", "so_what": "A high-severity RCE/DoS bug in a near-universal media library creates concrete patch-management and liability exposure for every vendor shipping FFmpeg-based products.", "quote": null, "locator": "Identified by CISA as CVE-2026-8461", "quote_verified": false}, {"claim": "Security researchers demonstrated full remote code execution on both a Jellyfin media server (via its automatic library scan) and a Nextcloud instance (via the video preview provider) simply by uploading a crafted 50 KB AVI file.", "speaker": "Olimpiu Pop", "type": "anecdote", "entities": ["Jellyfin", "Nextcloud", "FFmpeg"], "conviction": "high", "so_what": "Proof-of-concept RCE against two widely deployed self-hosted platforms shows the exploit is trivial to weaponize, raising urgency for self-hosted media/cloud-storage operators to patch immediately.", "quote": null, "locator": "Security researchers demonstrated the full exploit", "quote_verified": false}, {"claim": "No authentication, special privileges, or prior system access is required to exploit PixelSmash beyond the ability to deliver a media file, which the article calls the default attack surface for any media-processing application.", "speaker": "Olimpiu Pop", "type": "causal", "entities": ["FFmpeg", "libavcodec"], "conviction": "high", "so_what": "Zero-auth exploitability massively widens the practical attacker pool, making rapid patching and decoder hardening a near-term priority rather than a theoretical concern.", "quote": "No authentication, special privileges, or prior access to the target system is required beyond the ability to deliver a media file", "locator": "No authentication, special privileges, or prior access", "quote_verified": true}, {"claim": "The vulnerable MagicYUV decoder ships enabled by default in FFmpeg and researchers found it enabled on every major Linux distribution package tested (Ubuntu, Debian, Fedora, Arch, Alpine) prior to FFmpeg version 9.0.", "speaker": "Olimpiu Pop", "type": "data_point", "entities": ["FFmpeg", "MagicYUV", "Ubuntu", "Debian", "Fedora", "Arch", "Alpine"], "conviction": "high", "so_what": "Default-on, distro-wide exposure means the vulnerable configuration is the norm rather than the exception, implying a large unpatched installed base until distros push updated FFmpeg builds.", "quote": null, "locator": "Vulnerable systems have MagicYUV decoder enabled", "quote_verified": false}]}, {"theme": "Systemic supply-chain exposure", "insights": [{"claim": "Because FFmpeg's libavcodec underpins a huge range of software, the article argues a single bug in it does not remain a local issue but propagates across the entire dependent ecosystem.", "speaker": "Olimpiu Pop", "type": "thesis", "entities": ["FFmpeg", "libavcodec"], "conviction": "high", "so_what": "Reinforces the systemic-risk thesis around shared open-source dependencies: a single maintainer-level fix event can move risk across dozens of unrelated commercial products simultaneously.", "quote": "A single bug within a foundational library like FFmpeg's libavcodec does not just remain a local issue.", "locator": "PixelSmash is a reminder that the modern software supply chain", "quote_verified": true}, {"claim": "The exploitable attack surface spans desktop video players (Kodi, mpv), file-manager thumbnail generators, self-hosted media servers (Jellyfin, Emby, Nextcloud, Immich), chat platforms (Slack, Discord, Telegram), cloud transcoding services (AWS MediaConvert, Cloudflare Stream), and embedded/IoT devices such as Synology and QNAP NAS appliances and smart TVs.", "speaker": "Olimpiu Pop", "type": "data_point", "entities": ["Kodi", "mpv", "Jellyfin", "Emby", "Nextcloud", "Immich", "Slack", "Discord", "Telegram", "AWS MediaConvert", "Cloudflare Stream", "Synology", "QNAP"], "conviction": "high", "so_what": "Investors should note that major cloud and collaboration vendors (AWS, Cloudflare, Slack, Discord) are named as part of the exposed surface, meaning patch cadence and incident disclosure from these platforms is worth tracking.", "quote": null, "locator": "Server-side: a user uploads the file to a media server", "quote_verified": false}, {"claim": "On desktop systems the vulnerability can trigger passively: a user merely browsing to a folder containing the malicious file causes the file manager's thumbnail generator to invoke the vulnerable decoder, with no need to open the file.", "speaker": "Olimpiu Pop", "type": "causal", "entities": ["FFmpeg", "MagicYUV"], "conviction": "high", "so_what": "Passive, no-click triggering via thumbnailing undermines conventional user-caution defenses, meaning endpoint security messaging around 'don't open unknown files' is insufficient for this class of bug.", "quote": null, "locator": "Desktop: a user opens the malicious file in a video player", "quote_verified": false}]}, {"theme": "Remediation and memory-safety backlash", "insights": [{"claim": "Mitigation options for PixelSmash are to recompile FFmpeg with the MagicYUV decoder disabled (--disable-decoder=magicyuv) or to apply a minimal 7-line source patch to libavcodec/magicyuv.c that rejects malformed slice_height values causing the out-of-bounds write.", "speaker": "Olimpiu Pop", "type": "data_point", "entities": ["FFmpeg", "MagicYUV", "libavcodec"], "conviction": "high", "so_what": "The fix is cheap and narrow, so vendors with no urgent upgrade path have a low-friction stopgap, lowering the bar for rapid remediation across the affected ecosystem.", "quote": "this fix rejects the malformed slice_height values that trigger the OOB write", "locator": "According to researchers, this fix rejects", "quote_verified": true}, {"claim": "Online developer forum reaction to PixelSmash shows growing frustration that high-stakes, performance-critical components still rely on legacy C-based codebases, with many developers calling for prioritized migration to memory-safe alternatives or more robust automated security auditing of foundational libraries.", "speaker": "Olimpiu Pop", "type": "contrarian", "entities": ["FFmpeg"], "conviction": "medium", "so_what": "A recurring PixelSmash-style incident could accelerate demand for memory-safe (e.g., Rust-based) rewrites of core media/codec infrastructure and for automated composition-analysis and fuzzing tooling vendors positioned to audit legacy C libraries.", "quote": "many developers calling for a prioritised migration toward memory-safe alternatives or, at minimum, more robust automated security auditing for foundational libraries", "locator": "Reflecting on the broader industry discussion", "quote_verified": true}]}], "insight_total": 10, "top_entities": ["FFmpeg", "MagicYUV", "JFrog Security Research", "CVE-2026-8461", "Jellyfin", "Nextcloud", "Kodi", "AWS MediaConvert", "Cloudflare Stream", "Synology", "QNAP"], "source_meta": {"author": "Olimpiu Pop", "word_count": 1297, "paywalled": false}}, {"record_id": "129df55bdfd4c43c", "source_type": "technology", "source_name": "SemiWiki", "source_url": "https://semiwiki.com/forum/threads/25599", "title": "Samsung Wins $200 Billion Order to Supply Chips to Broadcom (The NOT TSMC Market Thrives!)", "published_date": "2026-07-25", "language": "en", "processed_at": "2026-07-26T12:52:01Z", "processor": "claude-code-sub-opus", "tags": ["Tech", "AI", "Positioning", "Geopolitics"], "gist": "Samsung won a five-year, $200-billion-plus deal to fabricate Broadcom's AI chips on 2nm-and-below process nodes, spanning memory, foundry, and advanced packaging, as Samsung and SK Hynix race TSMC for AI infrastructure orders with South Korean state backing.", "themes": [{"theme": "Samsung-Broadcom $200B Foundry Deal", "insights": [{"claim": "Samsung Electronics won a contract worth more than $200 billion to manufacture chips for Broadcom, running five years through 2030.", "speaker": "SemiWiki", "type": "data_point", "entities": ["Samsung Electronics", "Broadcom"], "conviction": "high", "so_what": "One of the largest disclosed foundry contracts to date; track Samsung foundry revenue and utilization as evidence of real leading-edge share gains versus TSMC.", "quote": "Samsung Electronics Co. won a contract worth more than $200 billion to make chips for Broadcom Inc., as the companies race to win a larger share of the AI infrastructure market.", "locator": "(Bloomberg) -- Samsung Electronics Co. won", "quote_verified": true}, {"claim": "The Samsung-Broadcom deal centers on Samsung's 2-nanometer and below process technologies, positioning Samsung as a credible leading-edge alternative to TSMC for custom AI silicon.", "speaker": "SemiWiki", "type": "data_point", "entities": ["Samsung Electronics", "Broadcom", "2nm process"], "conviction": "high", "so_what": "Samsung 2nm yield and capacity ramp becomes a key metric for whether it can retain large-scale hyperscaler/custom-silicon business long term.", "quote": "The pact, to run for five years through 2030, will focus on Samsung's 2-nanometer and below process technologies for Broadcom's products", "locator": "The pact, to run for five years", "quote_verified": true}, {"claim": "The deal expands Samsung and Broadcom's collaboration across both memory and foundry technology, not just wafer fabrication, with Samsung also set to support Broadcom's next-generation AI accelerators on the memory side.", "speaker": "SemiWiki", "type": "causal", "entities": ["Samsung Electronics", "Broadcom", "memory"], "conviction": "medium", "so_what": "Samsung's combined memory-plus-foundry offering is a differentiator TSMC cannot match, potentially locking in stickier, multi-product customer relationships.", "quote": "The deal expands the two companies' strategic collaboration across memory and foundry technology.", "locator": "The pact, to run for five years", " // ---------- helpers ----------
// YouTube-aligned hex colors for tinted insight chips (bg = color+"1a", text = color, border = color+"55").
const TYPE_HEX = {
  thesis: '#6366f1', prediction: '#0ea5e9', framework: '#8b5cf6',
  data_point: '#7c3aed', causal: '#d97706', contrarian: '#dc2626',
  anecdote: '#64748b',
};
const CONV_HEX = { high: '#7c3aed', medium: '#ca8a04', low: '#94a3b8', exploratory: '#94a3b8' };
function typeHex(t) { return TYPE_HEX[String(t || '').toLowerCase()] || '#475569'; }
function convHex(c) { return CONV_HEX[String(c || '').toLowerCase()] || '#64748b'; }

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }

// Tinted chip (YouTube style): faint bg, colored text + border.
function tintChip(text, color) {
  return `<span class="chip" style="background:${color}1a;color:${color};border-color:${color}55">${escapeHtml(text)}</span>`;
}
function tagPills(tags) {
  if (!tags || !tags.length) return '';
  return tags.map(t => `<span class="pill tag">${escapeHtml(t)}</span>`).join(' ');
}

// ---------- rendering ----------
// Insight presentation ported from the YouTube digest: type/conviction tinted
// chips, speaker as a 🗣 chip, and entities as indigo chips — all in the meta row
// directly under the claim. Quote treatment is INTENTIONALLY kept as Concepts'
// verbatim + "✓ verified" (stronger than YouTube's ≈ paraphrase wording).
function renderInsight(ins) {
  if (!ins) return '';
  const cls = 'insight' + (ins.type ? (' ' + String(ins.type).toLowerCase()) : '');
  const meta = [];
  if (ins.type) meta.push(tintChip(ins.type, typeHex(ins.type)));
  if (ins.speaker) meta.push(`<span class="chip chip-spk">🗣 ${escapeHtml(ins.speaker)}</span>`);
  if (ins.conviction) meta.push(tintChip('conviction: ' + ins.conviction, convHex(ins.conviction)));
  (ins.entities || []).slice(0, 12).forEach(e => {
    if (e) meta.push(`<span class="chip chip-ent">${escapeHtml(e)}</span>`);
  });
  let quote = '';
  if (ins.quote) {
    const v = ins.quote_verified
      ? `<span class="vmark">✓ verified</span>`
      : `<span class="vmark no">unverified</span>`;
    quote = `<div class="quote">“${escapeHtml(ins.quote)}”${v}</div>`;
  }
  const so = ins.so_what
    ? `<div class="insight-so"><span class="lbl">so what</span>${escapeHtml(ins.so_what)}</div>` : '';
  return `
    <div class="${cls}">
      <div class="insight-claim">${escapeHtml(ins.claim || '')}</div>
      <div class="insight-meta">${meta.join('')}</div>
      ${so}
      ${quote}
    </div>`;
}

function renderTheme(theme) {
  const insights = (theme.insights || []).map(renderInsight).join('');
  return `
    <div class="theme">
      <div class="theme-title">${escapeHtml(theme.theme || 'Theme')}</div>
      ${insights}
    </div>`;
}

function renderCard(card) {
  if (!card) return '';
  const meta = card.source_meta || {};
  const nameHtml = card.source_url
    ? `<a class="source-name" href="${escapeAttr(card.source_url)}" target="_blank" rel="noopener">${escapeHtml(card.source_name || '')}</a>`
    : `<span class="source-name">${escapeHtml(card.source_name || '')}</span>`;
  const subBits = [];
  if (card.published_date) subBits.push(escapeHtml(card.published_date));
  if (meta.author) subBits.push(escapeHtml(meta.author));
  if (meta.word_count) subBits.push(`${meta.word_count} words`);
  if (meta.paywalled) subBits.push('paywalled');
  const themes = (card.themes || []).map(renderTheme).join('');
  const n = card.insight_total != null ? card.insight_total
            : (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
  return `
    <div class="source">
      <div class="source-head" onclick="toggleSource(this)">
        <div class="source-meta-left">
          <div class="source-name-row">${nameHtml}</div>
          <div class="source-title">${escapeHtml(card.title || '')}</div>
          <div class="source-sub">${subBits.join('  ·  ')}</div>
        </div>
        <span class="source-count">${n} insight${n === 1 ? '' : 's'}</span>
        <span class="source-arrow">▸</span>
      </div>
      <div class="source-body">
        ${card.gist ? `<div class="gist">${escapeHtml(card.gist)}</div>` : ''}
        ${card.tags && card.tags.length ? `<div class="tags">${tagPills(card.tags)}</div>` : ''}
        ${themes || '<div class="empty">No insights.</div>'}
      </div>
    </div>`;
}

function renderTopStats(d) {
  const s = d.stats || {};
  const parts = [];
  if (d.date) parts.push(`date <strong>${escapeHtml(d.date)}</strong>`);
  if (s.lookback_days != null) parts.push(`lookback <strong>${s.lookback_days}d</strong>`);
  if (s.sources != null) parts.push(`sources <strong>${s.sources}</strong>`);
  if (s.cards != null) parts.push(`cards <strong>${s.cards}</strong>`);
  if (s.insights != null) parts.push(`insights <strong>${s.insights}</strong>`);
  if (s.quote_verified_pct != null) parts.push(`quotes verified <strong>${s.quote_verified_pct}%</strong>`);
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSource(headEl) { headEl.parentElement.classList.toggle('open'); }

function insightCount(card) {
  return (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
}

// Build the sort/filter control bar (display only — re-groups REPORT_DATA in place).
function buildControls(d) {
  const cards = d.cards || [];
  const names = [...new Set(cards.map(c => c.source_name || '—'))].sort((a, b) => a.localeCompare(b));
  const opts = names.map(n => `<option value="${escapeAttr(n)}">${escapeHtml(n)}</option>`).join('');
  document.getElementById('controls').innerHTML =
    `<label>Sort
       <select id="sortSel">
         <option value="source">Source A–Z</option>
         <option value="insights">Insight count ▼</option>
       </select></label>
     <label>Source
       <select id="srcSel">
         <option value="__all">All sources (${names.length})</option>
         ${opts}
       </select></label>
     <span class="ctl-btns">
       <button type="button" id="expandAll">Expand all</button>
       <button type="button" id="collapseAll">Collapse all</button>
     </span>`;
  document.getElementById('sortSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('srcSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('expandAll').addEventListener('click', () => setAllGroups(false));
  document.getElementById('collapseAll').addEventListener('click', () => setAllGroups(true));
}

// Group-level collapse: header click toggles one group; the control-bar buttons toggle all.
function toggleGroup(headEl) { headEl.parentElement.classList.toggle('collapsed'); }
function setAllGroups(collapsed) {
  document.querySelectorAll('.group').forEach(g => g.classList.toggle('collapsed', collapsed));
}

// Group cards by source, sort groups (and cards within), optionally filter to one source.
function renderGroups(d) {
  const sortMode = (document.getElementById('sortSel') || {}).value || 'source';
  const srcFilter = (document.getElementById('srcSel') || {}).value || '__all';
  let cards = (d.cards || []).slice();
  if (srcFilter !== '__all') cards = cards.filter(c => (c.source_name || '—') === srcFilter);

  const groups = new Map();
  cards.forEach(c => {
    const k = c.source_name || '—';
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(c);
  });
  let entries = [...groups.entries()].map(([name, cs]) => ({
    name, cards: cs, insights: cs.reduce((a, c) => a + insightCount(c), 0),
  }));
  if (sortMode === 'insights') entries.sort((a, b) => b.insights - a.insights || a.name.localeCompare(b.name));
  else entries.sort((a, b) => a.name.localeCompare(b.name));
  // Within each source group, heaviest cards first.
  entries.forEach(e => e.cards.sort((a, b) => insightCount(b) - insightCount(a)));

  const html = entries.map(e => {
    const head = `<div class="group-head" onclick="toggleGroup(this)">`
      + `<span class="group-name">${escapeHtml(e.name)}</span>`
      + `<span class="group-meta">${e.cards.length} card${e.cards.length === 1 ? '' : 's'} · ${e.insights} insights</span>`
      + `<span class="group-arrow">▾</span></div>`;
    return `<div class="group">${head}<div class="group-body">${e.cards.map(renderCard).join('')}</div></div>`;
  }).join('');

  const app = document.getElementById('app');
  app.innerHTML = html || '<div class="empty">No cards for this source.</div>';
  // Open the first two source cards by default.
  document.querySelectorAll('.source').forEach((sec, i) => { if (i < 2) sec.classList.add('open'); });
}

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  document.getElementById('stats-top').innerHTML = renderTopStats(d);
  buildControls(d);
  renderGroups(d);   // default: grouped, sorted by source A–Z
}

renderReport(REPORT_DATA);
</script>
