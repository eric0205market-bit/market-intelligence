ers spend only ~17% of the purchase journey with suppliers, so each of three vendors gets ~5-6%; sellers face a competitor in 68% of deals and rate themselves 3.8/10", "idea": "Gartner: 17% of the buying journey is spent meeting all suppliers combined. Crayon 2025: head-to-head in 68% of deals, self-rated competitive selling at 3.8/10. Treacy-Wiersema: thresholds get you shortlisted, leads get you chosen. The positioning-shift story: narrowing to a specific buyer doubled revenue in six months.", "angle": "Attention scarcity applies to enterprise software. The corollary is that 'does everything' AI products lose to 'does two things' ones.", "tweetA": "Gartner: buyers spend 17% of their purchase journey with all vendors combined. With three vendors that's 5-6% each. Your pitch has about 5% of the buyer's time. Five advantages won't fit. Two will.", "tweetB": "Sellers meet a competitor in 68% of deals and rate themselves 3.8 out of 10. The product isn't the bottleneck; the position is. In the AI-app wave, 'does everything' has already been done and nobody remembers who.", "charts": {"count": 0, "hot": false, "desc": "No chart in email (radar-chart framework described)"}, "link": "https://www.the-founders-corner.com/p/the-positioning-shift-that-doubled"}, {"id": 62, "cat": "crypto", "urgency": "watch", "source": "Substack Notes digest (0xJeff)", "title": "0xJeff: '9 out of 10 on my timeline say alts go lower' but one protocol's fees are at ATH (~$65-70M), 38% goes to buybacks, emissions vote 2.5% to 1.6%, TVL $579M (from $20-50M)", "idea": "Shielded TVL went from $20M to $135M this year. Protocol is not named in the preview; covered in his October Token Watchlist. Other notes in the digest: Stacy Muur on marketer-rated ROI of socials (Instagram, TikTok, X, YouTube) and a16z Frontier quoting Palmer Luckey on VR.", "angle": "A fundamentals-vs-sentiment divergence in alts: price compressed while revenue is at ATH and buyback share is 38%.", "tweetA": "9 out of 10 people say alts go lower. Fees are at all-time highs. 38% goes to buybacks. TVL is 10x higher than last year. When the consensus and the cash flow disagree, I look at the cash flow.", "tweetB": "Price compressed, fees at ATH, emissions being cut from 2.5% to 1.6%. That's a supply shock to the token coming from the protocol itself. Alt markets are pricing the narrative; the vote is pricing the supply.", "charts": {"count": 0, "hot": false, "desc": "No chart in preview"}, "link": "https://substack.com/@defi0xjeff/note/c-373433838"}];
var META = {"date": "2026-11-05", "time": "15:05 CEST", "windowStart": "2026-11-05 09:05 CEST", "windowEnd": "2026-11-05 15:05 CEST", "emailsInWindow": 18, "emailsRead": 18, "itemsExtracted": 62, "includedSources": [{"key": "Unchained", "name": "Unchained / Laura Shin", "items": 9}, {"key": "Morning Minute", "name": "Morning Minute / Lucky Trader", "items": 4}, {"key": "Phil Dauber", "name": "Phil Dauber / Market Musing", "items": 11}, {"key": "Boockvar", "name": "Peter Boockvar / The Boock Report", "items": 3}, {"key": "ChinaTalk", "name": "ChinaTalk", "items": 3}, {"key": "Young & Calculated", "name": "Young & Calculated", "items": 2}, {"key": "Bulltard", "name": "James Bulltard", "items": 3}, {"key": "Market House", "name": "The Market House (Dale Pinkert)", "items": 5}, {"key": "Stephen Innes", "name": "Stephen Innes / Dark Side of the Boom (2 emails)", "items": 5}, {"key": "AI Supremacy", "name": "AI Supremacy", "items": 3}, {"key": "Big Moves", "name": "Big Moves", "items": 7}, {"key": "Macro Charts", "name": "Macro Charts", "items": 1}, {"key": "Hard Fork", "name": "The Hard Fork", "items": 1}, {"key": "Founders Corner", "name": "The Founders Corner", "items": 1}, {"key": "MacroEdge", "name": "MacroEdge Oil & Gas", "items": 2}, {"key": "Rosenberg", "name": "David Rosenberg", "items": 1}, {"key": "Substack Notes", "name": "Substack Notes digest", "items": 1}], "skippedSources": [{"name": "Substack Notes digest (Stacy Muur, a16z Frontier notes)", "reason": "two of three note previews were a one-line marketing stat and a bare quote with no analysis; 0xJeff note extracted"}]};
var COLORS = {macro:"#e24b4a",credit:"#378add",positioning:"#ef9f27","AI/infra":"#1d9e75",crypto:"#7f77dd",geopolitics:"#d85a30",energy:"#f97316",tech:"#06b6d4",gold:"#d4a017",culture:"#ec4899",labor:"#8b5cf6",regulation:"#64748b",science:"#14b8a6",venture:"#84cc16"};
var UE = {act:"🔴",deep:"🔵",watch:"🟡"};
var UL = {act:"🔴 Act Now",deep:"🔵 Deep",watch:"🟡 Watch"};
var fCat = "all", fUrg = "all", fSrc = null;

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function hexA(h,a){var r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);return "rgba("+r+","+g+","+b+","+a+")";}

function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}

function cardHtml(item){
  var c = COLORS[item.cat] || "#888";
  var ch = item.charts || {};
  var hasCh = ch.count > 0 || (ch.desc && ch.desc.indexOf("Charts inside") === 0);
  var h = '<div class="card" data-id="' + item.id + '">';
  h += '<div class="chead" onclick="toggleCard(' + item.id + ')">';
  h += '<span class="num">' + String(item.id).padStart(2,"0") + '</span><span>' + UE[item.urgency] + '</span>';
  h += '<span class="src" style="background:' + c + '">' + esc(item.source) + '</span>';
  h += '<span class="tag">' + esc(item.cat) + '</span>';
  if (ch.hot) h += '<span>🔥</span>'; else if (hasCh) h += '<span>📊</span>';
  h += '<div class="ttl">' + esc(item.title) + '</div></div>';
  h += '<div class="body">';
  h += '<div class="lbl">The Idea</div><div>' + esc(item.idea) + '</div>';
  h += '<div class="angle" style="border-color:' + c + ';background:' + hexA(c,0.07) + '"><b style="font-style:normal;font-size:10px;letter-spacing:1px">MY ANGLE</b><br>' + esc(item.angle) + '</div>';
  h += '<div class="tweets">';
  h += '<div class="tw"><div class="lbl" style="color:#378add;margin-top:0">TWEET A</div><div class="t">' + esc(item.tweetA) + '</div>';
  h += '<button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button></div>';
  h += '<div class="tw"><div class="lbl" style="color:#7f77dd;margin-top:0">TWEET B</div><div class="t">' + esc(item.tweetB) + '</div>';
  h += '<button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div>';
  h += '</div>';
  h += '<div class="chart' + (ch.hot ? ' hot' : '') + '">' + (ch.hot ? '🔥 CHART WORTH SAVING — ' : '📊 ') + (ch.count ? ch.count + ' chart(s): ' : '') + esc(ch.desc || 'No chart in email') + '</div>';
  h += '<div style="margin-top:10px"><a href="' + esc(item.link) + '" target="_blank" rel="noopener">↗ Read full article</a></div>';
  h += '</div></div>';
  return h;
}

function toggleCard(id){
  var el = document.querySelector('.card[data-id="' + id + '"]');
  if (el) el.classList.toggle('open');
}

function visible(item){
  if (fCat !== "all" && item.cat !== fCat) return false;
  if (fUrg !== "all" && item.urgency !== fUrg) return false;
  if (fSrc && item.source.indexOf(fSrc) === -1) return false;
  return true;
}

function render(expand){
  var list = ITEMS.filter(visible);
  var html = list.map(cardHtml).join("");
  document.getElementById("cards").innerHTML = html || '<div class="empty">No items match.</div>';
  if (expand) {
    var cs = document.querySelectorAll('#cards .card');
    for (var i = 0; i < cs.length; i++) cs[i].classList.add('open');
  }
  renderBars();
}

function renderBars(){
  var cats = {};
  ITEMS.forEach(function(i){cats[i.cat] = (cats[i.cat]||0)+1;});
  var h = '<span class="pill' + (fCat==="all"?' active':'') + '" style="' + (fCat==="all"?'background:#333':'') + '" onclick="setCat(\'all\')">All ' + ITEMS.length + '</span>';
  Object.keys(cats).sort().forEach(function(k){
    var on = fCat === k, c = COLORS[k] || "#888";
    h += '<span class="pill' + (on?' active':'') + '" style="' + (on?'background:'+c:'') + '" onclick="setCat(\'' + k + '\')">' + esc(k) + ' ' + cats[k] + '</span>';
  });
  document.getElementById("catbar").innerHTML = h;
  var u = {act:0,deep:0,watch:0};
  ITEMS.forEach(function(i){u[i.urgency]++;});
  var g = '<span class="pill' + (fUrg==="all"?' active':'') + '" style="' + (fUrg==="all"?'background:#333':'') + '" onclick="setUrg(\'all\')">All</span>';
  ["act","deep","watch"].forEach(function(k){
    var on = fUrg === k;
    g += '<span class="pill' + (on?' active':'') + '" style="' + (on?'background:#333':'') + '" onclick="setUrg(\'' + k + '\')">' + UL[k] + ' ' + u[k] + '</span>';
  });
  document.getElementById("urgbar").innerHTML = g;
}

function setCat(k){fCat = k; fSrc = null; render(false);}
function setUrg(k){fUrg = k; fSrc = null; render(false);}
function filterBySrc(name){fSrc = name; fCat = "all"; fUrg = "all"; render(true); window.scrollTo(0,0);}

function init(){
  document.getElementById("hdr").textContent = META.date + " · " + META.time + " · " + ITEMS.length + " items";
  var r = '<p><b>Window:</b> ' + esc(META.windowStart) + ' to ' + esc(META.windowEnd) + '. Emails outside this window were not processed.</p>';
  r += '<p>Emails in window: ' + META.emailsInWindow + ' · read: ' + META.emailsRead + ' · items extracted: ' + META.itemsExtracted + '</p>';
  r += '<p><b>Included sources</b> (click to filter):<br>';
  META.includedSources.forEach(function(s, idx){
    r += '<span class="sl" data-s="' + idx + '">' + esc(s.name) + '</span> (' + s.items + ')<br>';
  });
  r += '</p><p><b>Skipped:</b><br>';
  META.skippedSources.forEach(function(s){ r += esc(s.name) + ' — ' + esc(s.reason) + '<br>'; });
  r += '</p><p><span class="sl" onclick="fSrc=null;render(false)">Clear source filter</span></p>';
  document.getElementById("rbody").innerHTML = r;
  var sl = document.querySelectorAll('.sl[data-s]');
  for (var i = 0; i < sl.length; i++) {
    sl[i].addEventListener('click', function(){ filterBySrc(META.includedSources[parseInt(this.getAttribute('data-s'),10)].key); });
  }
  render(false);
}
init();
</script>
</body>
</html>
