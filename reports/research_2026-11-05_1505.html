<script>
var ITEMS = [{"id": 1, "cat": "crypto", "urgency": "act", "source": "Unchained / Laura Shin", "title": "Bitcoin dropped to $75.6k on midterm night, then squeezed to $81.1k: 76% of BTC liquidations were shorts", "idea": "BTC bottomed at ~$75,600 in the 10pm ET hour Tuesday and hit $81,130 Wednesday (+7.3%). CoinGlass: $950M liquidated in 24h, $560M (58.9%) shorts; BTC alone $403M, 76% shorts. ETH +6.3% to ~$2,437.", "angle": "The 'Democrats are bad for crypto' positioning got run over inside 12 hours. Another entry for the book on consensus-fade around known binary events.", "tweetA": "Bitcoin sold off into the midterm results and then squeezed 7.3% in under 15 hours. $403M of BTC liquidations, 76% of them shorts. The trade everyone had on was 'Democratic Congress = crypto pain'. The trade that worked was owning the event.", "tweetB": "Crypto positioned for a regulatory disaster and got a rally instead. That's twice this year the 'obvious' policy hedge has been the crowded one. What does the same crowd do when the Clarity Act draft actually lands?", "charts": {"count": 2, "hot": false, "desc": "Charts inside — worth opening: majors price chart + market update image"}, "link": "https://unchainedcrypto.beehiiv.com/p/bitcoin-bounces-back-from-midterm-night-and-the-bears-feel-it"}, {"id": 2, "cat": "crypto", "urgency": "act", "source": "Unchained / Laura Shin", "title": "Crypto PACs went 28/30 in House races but 1 for 4 in the Senate: 72% of the $89.5M went to one Ohio race", "idea": "Of $89.5M spent on projected races, $21.9M (24.4%) landed on winners. Ohio's special Senate race alone drew $64.05M (Defend American Jobs, Digital Freedom Fund) against Sherrod Brown, who won. Fairshake went 4/6, Digital Freedom Fund 0/3; Fairshake-backed Steil and Huizenga lost after ~$1M each in October.", "angle": "The win rate is a headline; the dollar-weighted rate is the real number. $64M spent to oppose the person who now outlasts them — and Brown's committee seat matters in a Democratic Senate.", "tweetA": "$64M of the $89.5M crypto PACs spent went at one man: Sherrod Brown. He won. A 28/30 House scorecard is built from cheap races; the dollar-weighted hit rate is 24%.", "tweetB": "Crypto's political machine bought a lot of House seats nobody was contesting and lost the only race where it spent real money. Now the person it spent $64M against sits on the other side of the Clarity Act table. That is not a lobbying win, it's a hostage situation.", "charts": {"count": 0, "hot": false, "desc": "No chart in email"}, "link": "https://unchainedcrypto.beehiiv.com/p/bitcoin-bounces-back-from-midterm-night-and-the-bears-feel-it"}, {"id": 3, "cat": "crypto", "urgency": "act", "source": "Unchained / Laura Shin", "title": "Crédit Mutuel Arkéa: attackers used the bank's OWN account to send transactions, then may have cashed out via crypto (€118M / $133M)", "idea": "Arkéa confirmed on Nov 4 that fraudulent operations went through after ZachXBT named it. Attackers used the bank's own account (not customers') to send funds to other banks, then potentially converted via specialised platforms. Entry came through a service-provider platform, not Fortuneo. Part of the funds is blocked. Arkéa only 'validates the order of magnitude' of the €118M figure.", "angle": "A TradFi payments-rail breach cashing out through crypto is the opposite of the usual 'crypto is the risky leg' framing. Third-party platform risk is the common thread with Binance's $6.3B hot-wallet loss days ago.", "tweetA": "A French bank lost ~€118M and the exit route was crypto. Not a DeFi exploit — a service-provider platform inside a regulated bank. The 'unsafe' rail was SWIFT-adjacent, the 'safe' one was the cash-out.", "tweetB": "Binance lost ~$6.3B from a hot wallet. A French bank lost $133M through a vendor platform. Same failure mode: the keys sit with a third party and everyone audits the chain. Custody is the product now, and that is bullish for whoever can prove 99% cold.", "charts": {"count": 0, "hot": false, "desc": "No chart in email"}, "link": "https://unchainedcrypto.beehiiv.com/p/bitcoin-bounces-back-from-midterm-night-and-the-bears-feel-it"}, {"id": 4, "cat": "regulation", "urgency": "deep", "source": "Unchained / Laura Shin", "title": "Morgan Stanley is already tokenizing equities and Treasuries on DTCC's service, six days after launch; Schroders puts EM debt on Solana", "idea": "DTCC Tokenization Service launched Oct 28 (Canton Network and DTCC's private Besu chain); Morgan Stanley says it is using it for US equities and Treasuries — no securities, amounts or chain named. Separately Schroders launched a tokenized EM-debt fund with Centrifuge, its first Solana deployment.", "angle": "Settlement plumbing is moving from pilot to production inside a week. The notable detail is that the first big user is on a private chain, not a public L1.", "tweetA": "Six days from DTCC launch to Morgan Stanley live. No size, no securities, no chain disclosed. When the plumbing owner moves this fast, the story is not 'tokenization is coming', it's which ledger the collateral ends up on.", "tweetB": "Tokenized Treasuries were a crypto story last year. This year the clearing house is the distribution channel and the bank is the client. The public chains that win are the ones DTCC chooses to interoperate with — Solana got Schroders, Canton got DTCC.", "charts": {"count": 0, "hot": false, "desc": "No chart in email"}, "link": "https://unchainedcrypto.beehiiv.com/p/bitcoin-bounces-back-from-midterm-night-and-the-bears-feel-it"}, {"id": 5, "cat": "regulation", "urgency": "deep", "source": "Unchained / Laura Shin", "title": "62 issuers have now objected to being tokenized on the ICE/OKX venue (Boeing, ServiceNow, Nebius); SEC staff call Canton Coin a digital commodity", "idea": "Under the SEC's exemptive order a written objection keeps a company's token off the ICE/OKX tokenized-stock venue; the count of objectors is 62. Separately SEC staff issued a no-action letter saying Canton Coin (network rewards) falls in the digital commodity category — a staff position, not Commission action. Second Circuit also refused to pause NY and CT actions against Kalshi and Coinbase.", "angle": "Opt-out regime for tokenized equities is turning into a veto list. Issuers hold the real leverage, which caps the 'every stock on-chain' thesis.", "tweetA": "62 companies have told ICE/OKX not to tokenize their stock. Boeing, ServiceNow, Nebius this week. The bull case for tokenized equities assumed issuers were passive. They have a veto and they're using it.", "tweetB": "Tokenized stocks were pitched as a distribution layer nobody could stop. Turns out the company can opt out in writing. Meanwhile Canton gets a 'digital commodity' letter. Regulators are picking which chains count before issuers decide which stocks do.", "charts": {"count": 0, "hot": false, "desc": "No chart in email"}, "link": "https://unchainedcrypto.beehiiv.com/p/bitcoin-bounces-back-from-midterm-night-and-the-bears-feel-it"}, {"id": 6, "cat": "crypto", "urgency": "deep", "source": "Unchained / Laura Shin", "title": "Circle cut ~5% of staff; $182M of its $865M revenue was the ARC token presale", "idea": "Circle disclosed the ~5% layoff in a Q3 footnote, with $9.1M of restructuring charges. Total revenue and reserve income +17% to $865M — including $182M from the ARC token presale, so core revenue ex-presale is ~$683M.", "angle": "The quality of the beat matters: roughly 21% of the quarter came from selling its own token. Interest-rate-driven reserve income is the engine that cuts both ways.", "tweetA": "Circle laid off 5% of staff in a footnote. Revenue 'grew 17%' to $865M — $182M of it was selling ARC tokens. Strip that out and you're at ~$683M. That's a stablecoin issuer funding itself with its own coin.", "tweetB": "Stablecoin issuer: 79% reserve float, 21% token presale, 5% layoffs. If reserve income is the real business and rates are being priced up (Dec hike ~80%), Circle is a rate-sensitivity trade dressed up as a crypto growth story.", "charts": {"count": 0, "hot": false, "desc": "No chart in email"}, "link": "https://unchainedcrypto.beehiiv.com/p/bitcoin-bounces-back-from-midterm-night-and-the-bears-feel-it"}, {"id": 7, "cat": "crypto", "urgency": "deep", "source": "Unchained / Laura Shin", "title": "American Bitcoin: $126M quarterly profit is a $197.3M mark-to-market gain on 8,427 BTC; operating revenue actually fell", "idea": "Q3 net income $126M vs a $57.2M loss in Q2, driven by a $197.3M digital-asset gain. Revenue fell to $63.4M from $67.0M. Holds ~8,427 BTC at Sept 30.", "angle": "Strip the mark and the miner shrank revenue while BTC went up. Treasury accounting is making miners look like beta vehicles.", "tweetA": "American Bitcoin 'earned' $126M. Revenue fell $3.6M. The profit is a $197M mark on 8,427 BTC. This is a leveraged BTC ETF with a mining cost line.", "tweetB": "BTC fell to $75.6k and ripped to $81k in one session. A company with 8,427 BTC saw ~$47M of treasury value move on a Wednesday. Miners with treasuries are now a volatility product; revenue fell while the mark made the quarter.", "charts": {"count": 0, "hot": false, "desc": "No chart in email"}, "link": "https://unchainedcrypto.beehiiv.com/p/bitcoin-bounces-back-from-midterm-night-and-the-bears-feel-it"}, {"id": 8, "cat": "crypto", "urgency": "watch", "source": "Unchained / Laura Shin", "title": "South Korea delays crypto tax a fourth time, to 2029 — the tax is 22% above 2.5M won (~$1,900)", "idea": "Finance minister Lee Hyeong-il says the Jan 1, 2027 start is pushed to 2029. The government cited US information exchange starting in 2029 as the reason for waiting.", "angle": "Four delays means the tax is effectively political. The 2029 alignment with US info exchange is the actual regime change: cross-border reporting, not the rate.", "tweetA": "South Korea has now postponed its crypto tax four times. The tell is the new date: 2029, the year US information exchange starts. Retail gets a free pass until the reporting pipes are connected.", "tweetB": "A 22% tax on gains above $1,900 would hit the most active retail crypto market in the world. Postponing it again keeps the won-denominated alt bid alive for another cycle. Watch Upbit listings: the Cards +20% on Upbit move this week is the same flow.", "charts": {"count": 0, "hot": false, "desc": "No chart in email"}, "link": "https://unchainedcrypto.beehiiv.com/p/bitcoin-bounces-back-from-midterm-night-and-the-bears-feel-it"}, {"id": 9, "cat": "crypto", "urgency": "watch", "source": "Unchained / Laura Shin", "title": "Two Prime CEO: Babylon and Stacks BTC yields are 'basically VC-funded subsidies'; Zcash Dev Fund funding fight; XRPL burn-permission bug", "idea": "Alexander Blume says Babylon/Stacks yields are subsidies; Two Prime's own WBTC vault on Pareto is funded by borrowers paying for capital. Zcash Community Grants withdrew a proposal to taper its own funding after four days; a rival ZIP would end the 8% block-reward stream. XRPL turned on a fix for a bug where burn-only delegates could also mint.", "angle": "Three different 'who pays for security / yield' stories. Yield that is not borrower-funded is a customer-acquisition cost.", "tweetA": "Where does Bitcoin yield come from? Two Prime says Babylon and Stacks is VC money and its own vault is borrowers paying for capital. One of those has a counterparty on the other side. Pick the one you can explain on a napkin.", "tweetB": "Zcash is arguing about whether to cut the 8% dev reward. XRPL just closed a bug that let burn-only accounts mint. Different chains, same question: who funds the maintainers, and what do they get to touch?", "charts": {"count": 0, "hot": false, "desc": "No chart in email"}, "link": "https://unchainedcrypto.beehiiv.com/p/bitcoin-bounces-back-from-midterm-night-and-the-bears-feel-it"}, {"id": 10, "cat": "regulation", "urgency": "act", "source": "Morning Minute / Lucky Trader", "title": "Waters wants a full market-structure bill next Congress — the Clarity Act is alive 24 hours after consensus declared it dead", "idea": "Per Eleanor Terrett: House Democrats are expanding Maxine Waters' Crypto Investor and Consumer Bill of Rights into a full market-structure bill, folding in rejected Democratic CLARITY provisions plus what Senate Democrats and Republicans agreed pre-September cloture. SEC gets a larger role, CFTC a smaller one, and the draft carries ethics provisions restricting Trump-family crypto activity. Waters is the likely House Financial Services chair.", "angle": "The author's read — 'a very bullish first step' — is not mine to sign: SEC-heavy plus ethics clauses is exactly what Republicans rejected. But 'a bill gets written' beats 'two dead years'.", "tweetA": "Consensus on Tuesday: crypto market-structure is dead for two years. Wednesday: the likely House Financial Services chair is drafting one. SEC-heavy, ethics clauses aimed at the President. Nobody priced this version.", "tweetB": "A Democratic Clarity Act hands the SEC more power and the CFTC less. For perps, prediction markets and tokenized stocks, that moves the whole venue map. The ethics clause is the poison pill or the price of admission — I can't tell yet which, and neither can the market.", "charts": {"count": 0, "hot": false, "desc": "No chart in email"}, "link": "https://luckytrader.substack.com/p/democrat-sweep-pumps-crypto-as-clarity"}, {"id": 11, "cat": "crypto", "urgency": "deep", "source": "Morning Minute / Lucky Trader", "title": "BTC and ETH ETFs flip to inflows ($74M / $53M); Saylor's STRC back at $100 par for the first time since May", "idea": "BTC ETFs +$74M and ETH ETFs +$53M Wednesday, breaking an outflow streak. STRC hit its $100 par value, enabling Strategy to buy 191 BTC. CoinShares' Butterfill: real yields, dollar liquidity and ETP flows still weigh more than the elections.", "angle": "Small numbers, but STRC at par is the better signal: the preferred is the funding gate for the treasury bid.", "tweetA": "$74M into BTC ETFs. $53M into ETH. Tiny. The number to watch is STRC reclaiming $100 par — 191 BTC bought. The flywheel only turns when the preferred trades at par.", "tweetB": "After the biggest short squeeze of the quarter, spot ETF inflows are $127M combined. That's a derivatives rally, not a spot bid. STRC at par is what turns a squeeze into sustained buying.", "charts": {"count": 0, "hot": false, "desc": "No chart in email"}, "link": "https://luckytrader.substack.com/p/democrat-sweep-pumps-crypto-as-clarity"}, {"id": 12, "cat": "regulation", "urgency": "deep", "source": "Morning Minute / Lucky Trader", "title": "Prediction markets under state attack: Arkansas AG sues Kalshi as an unlicensed gambling platform; Second Circuit refuses to pause NY/CT actions", "idea": "Arkansas AG Tim Griffin sued Kalshi over sports event contracts (unlicensed gambling, sidestepping licensing and taxes). Unchained adds the Second Circuit denied injunctions pending appeal for Kalshi and Coinbase in a two-page order, without ruling on federal preemption.", "angle": "Federal preemption is the whole thesis for prediction-market valuation. Courts are declining to protect it while the appeal runs.", "tweetA": "Arkansas just sued Kalshi. The Second Circuit declined to pause New York and Connecticut. Nobody has ruled on preemption yet. That's the entire valuation question, still unanswered, with state AGs stacking up.", "tweetB": "A Democratic Congress is unlikely to rescue federal preemption for sports contracts. Prediction markets are about to be decided by 50 state AGs and one appellate ruling, not by Washington.", "charts": {"count": 0, "hot": false, "desc": "No chart in email"}, "link": "https://luckytrader.substack.com/p/democrat-sweep-pumps-crypto-as-clarity"}, {"id": 13, "cat": "crypto", "urgency": "watch", "source": "Morning Minute / Lucky Trader", "title": "Polygon validator proposes hard fork to move ~70M stolen POL ($6.5M) from Polymarket/Binance hackers to recovery addresses; Binance and Deribit revoke SignalPlus API keys", "idea": "A Polygon Labs validator-support member proposed a hard fork of Polygon PoS to relocate roughly 70.49M POL stolen in the Polymarket and Binance hacks to recovery addresses designated by both companies. Binance and Deribit revoked all API keys linked to SignalPlus after a flagged security issue.", "angle": "Immutability vs recovery, again, at small scale. $6.5M is a tiny test of a very large precedent.", "tweetA": "A hard fork to claw back $6.5M. The size is trivial and the precedent isn't. Once a PoS chain moves stolen funds on request from two named companies, it has a customer list.", "tweetB": "Binance and Deribit nuked every API key tied to SignalPlus at once. The post-hack toolkit is now: revoke keys, fork the chain, freeze the funds. Counterparty risk didn't disappear from crypto; it just got a response playbook.", "charts": {"count": 0, "hot": false, "desc": "No chart in email"}, "link": "https://luckytrader.substack.com/p/democrat-sweep-pumps-crypto-as-clarity"}, {"id": 14, "cat": "geopolitics", "urgency": "act", "source": "Phil Dauber / Market Musing", "title": "Vance: 'the reason we lost is the war' — and that gives Tehran less reason to deal, Dauber argues", "idea": "The size of the GOP loss and the VP publicly naming the war as the cause complicate a negotiated end: 'Iran has the internet and now has less motivation to make any concessions.' Also: Massie plans to trigger a Hegseth impeachment vote next week with GOP sources expecting it to pass; the White House moved the Lisa Cook hearing to Dec 14.", "angle": "The market priced a peace on the logic that domestic political cost restrains Trump. The counter: the same cost removes the adversary's incentive to concede. That asymmetry is the whole trade.", "tweetA": "Oil is pricing 'Trump can't escalate'. Tehran is pricing 'Trump can't negotiate from strength'. Both read the same election result. Only one of them needs a deal.", "tweetB": "When the VP says publicly that the war lost the midterm, the other side stops needing to hurry. A weaker US negotiating hand is a longer war, not a shorter one. Oil at -20% in three sessions has priced the opposite.", "charts": {"count": 0, "hot": false, "desc": "No chart in email"}, "link": "https://phildauber.substack.com/p/thank-you-for-your-attention-to-this"}, {"id": 15, "cat": "energy", "urgency": "act", "source": "Phil Dauber / Market Musing", "title": "Brent -19.6% in three sessions (biggest since Apr 2020) on a sentence, not a tanker — while gasoil still trades $69 over Brent", "idea": "Nothing physical moved: Vance's quote and Trump's 'no immediate plans' to strike Iran took the premium out of the front month. Gulf exports ran 17.1M b/d in October vs 18.9M in September; the strait is still closed to Western-allied shipping. NWE gasoil was ~$69 over Brent (vs $71 Friday). Distillate stocks drew 3.6M bbl, below the 5-year average. Valero fell 5.75% on 1.9x volume on a day feedstock fell 8.67%.", "angle": "Dauber's point is the crude/product divergence: crude priced peace, diesel didn't. At ~$94 crude and +$69, diesel is ~$163/bbl, about $3.88 a gallon wholesale.", "tweetA": "Brent: -19.6% in three days. Diesel crack: $71 to $69. One of those markets is wrong, and the one with the closed strait and drawing inventories isn't the crude screen. Valero sold off like it was long the barrel. It's long the gap. $VLO $MPC", "tweetB": "Crude fell $20+ and the diesel premium over it barely moved. That's a $69 spread on a $94 barrel, nearly 75% of the underlying. If product prices don't follow crude down, voters still pay for diesel — and that's the cost the election was about.", "charts": {"count": 0, "hot": false, "desc": "No chart in email"}, "link": "https://phildauber.substack.com/p/thank-you-for-your-attention-to-this"}, {"id": 16, "cat": "geopolitics", "urgency": "act", "source": "Phil Dauber / Market Musing", "title": "Russia to supply Iran 90 helicopter-mounted launchers; Houthis ask $51B plus Riyadh's recognition to stop hitting Saudi tankers; supreme leader orders retaliation 'without geographic restrictions'", "idea": "FT: production schedule shows 90 launchers for the guided missiles Russian forces use in Ukraine going to Iran. WSJ: Houthis want $51B and formal recognition. Iranian leadership ordered retaliation with a parliamentarian naming US bases in Germany and Italy. Two tankers carrying Russian diesel to the US under last month's Trump-Putin arrangement turned off course; US-Russia-Ukraine meet in Abu Dhabi Nov 10-11.", "angle": "The market took the quiet and ignored the supply pipeline. A Russia-Iran military supply line with a Houthi price tag is not a de-escalation signature.", "tweetA": "The headline says 'peace'. The shipping schedule says Russia is sending Iran 90 launchers and the Houthis are pricing a Saudi tanker ceasefire at $51B. Pick the document you trust.", "tweetB": "A Houthi ask of $51B and Riyadh's recognition is the first time this war has had a visible price tag for a regional ceasefire. Meanwhile Russian diesel tankers headed for the US changed course. Supply chains are quietly voting before diplomats do.", "charts": {"count": 0, "hot": false, "desc": "No chart in email"}, "link": "https://phildauber.substack.com/p/thank-you-for-your-attention-to-this"}, {"id": 17, "cat": "AI/infra", "urgency": "act", "source": "Phil Dauber / Market Musing", "title": "Goldman: up to 45% of planned new US data-center capacity at risk of a pause; Cembalest: 37.5 GW at risk of outright pause plus 15 GW conditional; Mirae: 13 GW (8%)", "idea": "Market sold everything that pours concrete or strings wire and bought the renters: MSFT and AMZN +6% each, Vistra -13.8%, Sterling Infrastructure -21.5%. Mirae's 13 GW is ~8% of expected new US capacity through 2035 (implying ~160 GW). Goldman and Mirae measure different horizons. Meta's Dina Powell McCormick: building gets harder, maybe not as hard as feared.", "angle": "Three estimates with a 4x range. Tape traded the biggest. Dauber's point: a permit changes the address and start date of a megawatt, not the switchgear inside it.", "tweetA": "Goldman says up to 45% of new US capacity could pause. Mirae says 8%. The tape sold the 45%. Somebody is going to be very right about which horizon matters, and it's whoever owns the switchgear order book.", "tweetB": "A moratorium doesn't cancel a transformer order, it moves it. Winners are whoever already has power and a permit; losers are the fund-the-build crowd. That's why Amazon and Microsoft rallied 6% while utilities fell 14%.", "charts": {"count": 0, "hot": false, "desc": "No chart in email"}, "link": "https://phildauber.substack.com/p/thank-you-for-your-attention-to-this"}, {"id": 18, "cat": "credit", "urgency": "deep", "source": "Phil Dauber / Market Musing", "title": "High yield printed 340bp, a fourth observation above the 325bp stress line — while VIX fell to 16.61", "idea": "Equity vol -20% on the day; HY at 340bp (Nov 3) vs a 325bp line; IG at 93bp is still the widest of the year. The Nov 4 HY observation publishes today: back inside the line removes the stress story; over 344bp and 'Wednesday's bank rally was a loan'. Dauber: 'Short lenders, long float.'", "angle": "Credit is the only market that hasn't signed the armistice. Equity holders stopped paying for protection; bondholders did not.", "tweetA": "VIX at 16.61. High yield at 340bp, fourth straight print above the stress line. Equity and credit are looking at the same election and disagree by ~15bp and 20% of vol.", "tweetB": "IG spreads are the widest of the year while the S&P had its best day in months. Someone is wrong about the AI-capex debt wall. I know which crowd I'd follow into a payroll print.", "charts": {"count": 0, "hot": false, "desc": "No chart in email"}, "link": "https://phildauber.substack.com/p/thank-you-for-your-attention-to-this"}, {"id": 19, "cat": "AI/infra", "urgency": "act", "source": "Phil Dauber / Market Musing", "title": "Eaton -9.86% on a record quarter: revenue +28% to $8.95B, data center revenue +65%, third guidance raise — the seller was the ballot measures", "idea": "Fell despite revenue $8.95B (+28%) and DC revenue +65%. More than $1B is committed to 24 new capacity projects (~$42M each) — which a delay turns into underused plant. Rockwell and Parker report this morning as the read for the equipment group.", "angle": "A cost of capital repricing of the supply chain happened with zero change in the filings. An auditor signed the quarter; no filing signed the policy discount.", "tweetA": "Eaton printed +28% revenue, +65% in data centers, and its third raise of the year. Stock -9.86%. Nothing in the 10-Q changed — a ballot box did. Rockwell and Parker report this morning to tell you if it's an Eaton problem or an equipment problem.", "tweetB": "$1B committed across 24 new capacity projects. That's the number that goes from growth capex to stranded capex if the 45% pause estimate is right. The market is not selling Eaton's backlog; it's selling the plants it built for it. $ETN", "charts": {"count": 0, "hot": false, "desc": "No chart in email"}, "link": "https://phildauber.substack.com/p/thank-you-for-your-attention-to-this"}, {"id": 20, "cat": "tech", "urgency": "deep", "source": "Phil Dauber / Market Musing", "title": "Memory is the one AI price still rising — and it's landing on handsets: Qualcomm handset revenue -26%, Micron halts a Taiwan plant, Switch 2 sales -41%", "idea": "Qualcomm fell ~7.7% after hours: handset revenue -26% to $5.13B and chip-design margin guide cut to 20-22% from 24% on memory costs. Micron suspended its Taiwan memory plant over a labor dispute. Nintendo said Switch 2 sales fell 41% after memory costs forced a price increase. KOSPI is falling anyway; Dauber asks whether Seoul knows something about memory pricing rolling over.", "angle": "This is the cleanest 'AI capex is a tax on everyone else' datapoint of the week. Memory scarcity is a transfer from device makers to memory makers.", "tweetA": "Qualcomm -26% handset revenue. Nintendo -41% Switch 2 sales. Both blame memory. Micron just shut a plant. The AI trade didn't end; it moved the bill to your phone and your console.", "tweetB": "KOSPI is down on volume, ignoring price. If DRAM pricing is the one AI input still going up, the winners are memory makers with a plant offline — a squeeze on supply with demand-side damage in handsets. Micron's shutdown and Qualcomm's guide are the same story.", "charts": {"count": 0, "hot": false, "desc": "No chart in email"}, "link": "https://phildauber.substack.com/p/thank-you-for-your-attention-to-this"}, {"id": 21, "cat": "AI/infra", "urgency": "deep", "source": "Phil Dauber / Market Musing", "title": "AI financing is starting to be sold down: Goldman and Apollo offload pieces of SpaceX's $40B Nvidia chip financing; Microsoft declines to double its Nscale Texas lease; Datadog -14.4% on its largest AI customer", "idea": "Bloomberg/FT: banks selling pieces of the $40B chip-financing facility; Microsoft passed on an option to more than double its Texas lease with Nscale. Datadog fell 14.42% on concentration in its top AI customer; Cloudflare reports after the close. AppLovin +18% after hours on revenue +55% to $2.18B.", "angle": "The marginal buyer of AI infra risk is changing. When the arrangers sell down and the anchor tenant passes on an option, the demand side is price-testing the supply side.", "tweetA": "Goldman and Apollo are syndicating SpaceX's $40B Nvidia financing. Microsoft turned down an option to double its Nscale lease. Datadog fell 14% on one AI customer. Nobody is cancelling anything — they're all quietly reducing exposure to the next increment.", "tweetB": "AppLovin +55% revenue is AI turning into ad dollars; Nscale's lease option declined is AI turning into a counterparty problem. Same week, same trade, opposite ends of the stack. The financing end is where the marginal dollar gets repriced first.", "charts": {"count": 0, "hot": false, "desc": "No chart in email"}, "link": "https://phildauber.substack.com/p/thank-you-for-your-attention-to-this"}, {"id": 22, "cat": "macro", "urgency": "deep", "source": "Phil Dauber / Market Musing", "title": "Treasury dropped 'at least' from its auction-size guidance — dealers read it as room to shift issuance shorter from H2 2027", "idea": "Treasury said auction sizes stay unchanged for several quarters and removed the 'at least' language. Dealers interpret that as optionality to move issuance toward bills/short coupons from the second half of 2027.", "angle": "The refunding language is the only fiscal tell that's not about politics. Removing 'at least' is a ceiling on coupon supply, not a floor.", "tweetA": "'At least' is gone from Treasury's auction guidance. Two words. Dealers now read a path to shorter issuance from H2 2027. The long end just lost its worst-case supply scenario.", "tweetB": "Gilts have been the channel into our long end for three weeks. Treasury dropping 'at least' trims long-bond supply fear at the same moment a Democratic Congress makes big deficit expansion harder. That's a term-premium story nobody put on the tape yesterday.", "charts": {"count": 0, "hot": false, "desc": "No chart in email"}, "link": "https://phildauber.substack.com/p/thank-you-for-your-attention-to-this"}, {"id": 23, "cat": "culture", "urgency": "deep", "source": "Phil Dauber / Market Musing", "title": "'The affordability, stupid': Dauber's 1974 parallel — 93 new members of Congress then, a swarm of first-timers now", "idea": "No issue came close to affordability; Dauber calls it far more a vote against Trump than for Democrats and rejects a 'mandate'. Compares scale to 1974 (49 House seats and 5 Senate seats flipped, 93 new members, 76 Democrats) and notes moderates did better than progressives. Hakeem Jeffries can lose DSA votes and still hold a large margin. Markets: divided government usually reduces tail risk.", "angle": "The relevant fact for markets is not the party. It's that both sides now pivot to cost-of-living policy, which is a different policy surface than tariffs and data centers.", "tweetA": "1974: 49 House seats flipped, 93 freshmen, Carter two years later. 2026: same shape, different scandal. The common thread isn't ideology — it's an incumbent party that lost control of the cost-of-living narrative.", "tweetB": "Affordability was the only issue. Now both parties will pivot to it. That means energy prices, rent, and credit-card rates become policy targets in the same year, not the next one. Trade the policy, not the party.", "charts": {"count": 0, "hot": false, "desc": "No chart in email"}, "link": "https://phildauber.substack.com/p/thank-you-for-your-attention-to-this"}, {"id": 24, "cat": "macro", "urgency": "deep", "source": "Phil Dauber / Market Musing", "title": "Dauber's four conditional calls: refiner, equipment, short lenders / long float, and 'one bet on Friday' (2y over 4.65% = he's wrong)", "idea": "Each call has an explicit kill: gasoil premium under $50; semis close under 9,750 with hyperscalers falling; HY spread print under 326bp; payroll beat taking the 2-year over 4.65%. Money-center banks and consumer lenders resolve on the same labor print.", "angle": "The format is the insight — every view with its invalidation level. Worth stealing for the book.", "tweetA": "Dauber's note ends every idea with 'I'M WRONG IF'. gasoil under $50. Semis under 9,750. HY under 326bp. 2-year over 4.65%. Four trades, four numbers. That's more discipline than most funds' risk reports.", "tweetB": "If one payroll print resolves banks, consumer lenders and the 2-year all at once, that isn't diversification, it's one position with four tickers. Friday is the real catalyst.", "charts": {"count": 0, "hot": false, "desc": "No chart in email"}, "link": "https://phildauber.substack.com/p/thank-you-for-your-attention-to-this"}, {"id": 25, "cat": "AI/infra", "urgency": "act", "source": "Peter Boockvar / The Boock Report", "title": "Boockvar: if fewer data centers get built, hyperscalers burn less cash — but a 'huge chunk' of their cloud backlogs is OpenAI and Anthropic", "idea": "Yesterday's action was 'rational': picks-and-shovels sold, consumer-facing bought, rates lower. For hyperscalers, less capex helps cash flow, but they need compute for their own models and much of cloud backlog is OpenAI/Anthropic — if those labs can't get capacity, cloud demand shrinks.", "angle": "The backlog concentration point is underappreciated. The same labs whose growth justifies the capex are the counterparties whose access to compute is being politically limited.", "tweetA": "Hyperscaler backlog is a lot of OpenAI and Anthropic. Those two need compute to grow. A moratorium that slows data centers also slows the backlog conversion. The market gave $MSFT and $AMZN credit for capex discipline without checking the customer list.", "tweetB": "Less capex = better free cash flow. Fewer data centers = less cloud revenue from two customers that make up much of the backlog. Both are true at once. The market picked the first half of the sentence.", "charts": {"count": 0, "hot": false, "desc": "No chart in email"}, "link": "https://peterboockvar.substack.com/p/actually-mostly-rational-actiongreat"}, {"id": 26, "cat": "culture", "urgency": "deep", "source": "Peter Boockvar / The Boock Report", "title": "McDonald's: US comps -0.2%, but turned positive in September after slightly negative July/August — and the stock rose 6%", "idea": "The fix: restoring digital offers to drive frequency with engaged customers, shifting marketing to proven value platforms, restaurant-level execution. International comps +1.4%; France and Ukraine weak. Cava missed on comps and both lines.", "angle": "A negative US comp that is improving month by month is being rewarded as a recovery. The 'value platform' language is the tell for the low-end consumer.", "tweetA": "McDonald's US comps: -0.2%. Stock +6%. September turned positive after a negative July and August. When the market pays for 'less bad' at the biggest fast-food company, the consumer isn't strong — it's just less weak.", "tweetB": "Cava missed, McDonald's 'improved'. Both are the same consumer trading down to value platforms. The restaurant that wins the next two quarters is the one with the cleanest loyalty-offer engine, not the best food.", "charts": {"count": 0, "hot": false, "desc": "No chart in email"}, "link": "https://peterboockvar.substack.com/p/actually-mostly-rational-actiongreat"}, {"id": 27, "cat": "macro", "urgency": "deep", "source": "Peter Boockvar / The Boock Report", "title": "Kraft Heinz: 2027 inflation expectation raised to 'slightly above 5%' from 4-5%; 'you'll see more pricing in '27, not less' — while the consumer is 'fragile'", "idea": "Organic sales -1.1%, driven by US Retail decline; volume trends recovering; meats main volume drag. Inflation from packaging, commodities and logistics. 'The consumer is in a fragile state and we want to take as little price as possible.' Boockvar owns the stock and calls it a favorite.", "angle": "A staples company is guiding to >5% input inflation for next year while the oil price is falling 20%. Packaging and logistics are not oil-only.", "tweetA": "Kraft Heinz now expects input inflation above 5% in 2027 and says more pricing is coming. The same week oil fell 20%. Inflation at the shelf has a longer lag than the headline.", "tweetB": "The CPG company is telling you it will raise price next year and also that the consumer is fragile. Both can't hold. Volume or margin gives. Watch how $KHC's 'recovering volume' holds once the price goes up.", "charts": {"count": 0, "hot": false, "desc": "No chart in email"}, "link": "https://peterboockvar.substack.com/p/actually-mostly-rational-actiongreat"}, {"id": 28, "cat": "AI/infra", "urgency": "deep", "source": "ChinaTalk", "title": "Senator-elect El-Sayed (D-MI) wants a 'full-on AI pause', compute KYC, and an FDA for AI — and dismisses the 'China will win' argument with a water-skier analogy", "idea": "His platform calls for compute controls with know-your-customer requirements for providers and an independent technical agency with enforcement power. On a pause: China's frontier work is mostly 'spoofing our models' (the skier pulled by the boat) — though he concedes 'eventually they'll hop on a jetski'. Also: a $25,000, 300-mile-range EV industrial policy with tariffs, and strategic ambiguity on Taiwan.", "angle": "A sitting senator (from January) holding a pause position changes the legislative surface for AI more than any lab announcement. ChinaTalk notes the distillation framing came from Matt Sheehan.", "tweetA": "A US senator-elect wants a full AI pause and KYC for compute. His answer to 'what if China doesn't pause': the skier is only close because the boat is pulling it. That argument is wrong, but it just got a Senate vote.", "tweetB": "KYC for compute providers is the line item to watch. It would turn every GPU cloud into a regulated financial-style institution. That's a different cost structure for the neoclouds than a permitting delay — it hits the customer onboarding, not the concrete. $CRWV $NBIS", "charts": {"count": 0, "hot": false, "desc": "No chart in email"}, "link": "https://www.chinatalk.media/p/the-new-senators-on-china"}, {"id": 29, "cat": "regulation", "urgency": "deep", "source": "ChinaTalk", "title": "Senator-elect Flanagan (D-MN) calls AI 'an existential threat' and backs shutdown capability; NRSC attacks her as a 'socialist doomer' over donations from AI-firm employees", "idea": "NRSC statement links her to effective altruism and 'giving China the upper hand'. ChinaTalk points out AI safety isn't the same as ceding ground and may help the race. NRSC also tagged her over two $3,500 donations from a Wanxiang executive.", "angle": "AI safety is now a partisan campaign attack line with a named donor class (AI-firm employees). That's new.", "tweetA": "The NRSC attacked a Democratic Senate candidate for taking donations from Anthropic employees. AI lab staff are now a campaign-finance target. The industry just became political.", "tweetB": "A new Senate class is arguing about AI as 'existential threat', 'EA dogma', and 'China edge' at the same time. The lab that survives is the one with the best lobbyists, not the best model. And lobbying budgets just became the AI cost line to watch.", "charts": {"count": 0, "hot": false, "desc": "No chart in email"}, "link": "https://www.chinatalk.media/p/the-new-senators-on-china"}, {"id": 30, "cat": "geopolitics", "urgency": "deep", "source": "ChinaTalk", "title": "The Senate China-hawk bench: Barr is one of two committee votes against the AI Overwatch Act (42-2-1, would ban Blackwell exports to China); Letlow's shrimp 301; Hageman on rare earths; Oklahoma swung 16.2 points", "idea": "Kentucky's Andy Barr voted against AI Overwatch in markup and wrote softer outbound-investment sanctions than Cornyn's sector approach. Letlow (LA) pushed a Section 301 on seafood. Hageman (WY) focuses on critical minerals and permitting. Hern (OK) won by 18.1 vs Trump's +34.3 in 2024, a 16.2-point swing. Talarico opposed Texas anti-China land and divestment bills.", "angle": "China policy in the next Senate is going to be determined by committee fights over Blackwell exports, not rhetoric. The Hern margin shows even safe seats moved 16 points.", "tweetA": "Oklahoma: Trump +34.3 in 2024. Senate-elect Hern +18.1 now. A 16-point swing in a deep-red state. China hawkishness isn't going away, but the votes that decide chip exports just got harder to count.", "tweetB": "Barr voted against a bill that would ban Blackwell exports to China — one of two no votes out of 45. The next Senate's chip-export fight won't be hawks vs doves. It'll be West Virginia shrimp, Wyoming rare earths and Michigan EVs.", "charts": {"count": 0, "hot": false, "desc": "No chart in email"}, "link": "https://www.chinatalk.media/p/the-new-senators-on-china"}, {"id": 31, "cat": "positioning", "urgency": "deep", "source": "Young & Calculated / Quant Enthusiasts", "title": "Multi-manager AUM: Millennium >$95B (from ~$79B), Point72 ~$50B and 3,000+ staff, Balyasny ~$31B; hedge-fund SMAs reached $255B (+20%)", "idea": "Goldman: SMA assets $255B at end-2025, +20% in a year, ~13% annualized over a decade — more than twice the industry's growth. Jain Global, launched 2024 with $5.3B, agreed in April 2026 to return outside capital and manage money exclusively for Millennium.", "angle": "Platforms are becoming allocators of risk, not employers of PMs. That makes factor crowding a platform-level phenomenon, not a PM-level one.", "tweetA": "Millennium is now above $95B, up from $79B. Hedge-fund SMAs are $255B. Jain Global returned outside money to run capital only for Millennium. The 'pod' is now a legal wrapper, not an office.", "tweetB": "If the biggest platforms increasingly run capital through SMAs, the same factor exposure is held by independent firms on one balance sheet. Bulltard says 'more pods than ever' make the unwind violent. This is the structural reason why.", "charts": {"count": 0, "hot": false, "desc": "No chart in email"}, "link": "https://youngandcalculated.substack.com/p/how-multi-manager-hedge-funds-actually-2ef"}, {"id": 32, "cat": "positioning", "urgency": "deep", "source": "Young & Calculated / Quant Enthusiasts", "title": "The mechanics of a pod blow-up: 5% loss cuts allocation by 50%, ~7.5% stops the PM — so drawdown rules force de-risking before the final limit", "idea": "Millennium's often-described rule: an initial 5% drawdown can cut a PM's capital 50%; a further loss to ~7.5% typically means stop-out and review (judgment still applies). A PM can be right on thesis and still lose capital because central risk reduces allocation as vol rises. Fifty equity teams can share the same growth factor.", "angle": "This is the plumbing behind the 2026 AI de-risking episodes — every pod hits the same drawdown rule at the same time.", "tweetA": "A pod down 4% can't add to a position it believes in. A pod down 5% loses half its capital. The rules don't care about thesis — they force selling into drawdowns, simultaneously, across fifty teams. That's how an AI unwind becomes a 'violent' one.", "tweetB": "The article says the effect is deliberate: the platform pays up in missed recoveries to avoid one team creating a firm-level loss. Add the Democratic data-center selloff to this — a policy shock hits fifty correlated books at once and the stop-out rule does the rest.", "charts": {"count": 0, "hot": false, "desc": "No chart in email"}, "link": "https://youngandcalculated.substack.com/p/how-multi-manager-hedge-funds-actually-2ef"}, {"id": 33, "cat": "positioning", "urgency": "deep", "source": "James Bulltard / Running of the Bulltards", "title": "Bulltard: the AI trade has been in 'classic distribution' for 90 days — he compares AI names to Amazon in 2021 and the SaaS charts of that year", "idea": "Nasdaq and SMH are negative over six months, yet S&P and Nasdaq are up double digits YTD. Amazon 2021 flagged sideways for months and then fell to the 100-month average (~50% lower); breaking the 21-month led to a cascade to the 50-month. 'Lots of AI darlings are coming into their 21-month right now.' Micron's low P/E 'all it has done since is go lower.'", "angle": "Technical analog from a trader with a stated book — and Micron's cheapness-as-trap is the same message Dale Pinkert gave in the same morning's email.", "tweetA": "Everyone was posting Micron's low P/E. Micron just kept going down. A cheap multiple on peak earnings isn't a floor; it's what a top looks like on a screener.", "tweetB": "Amazon in 2021 went sideways for months while everyone called it a flag. It lost 50% to the 100-month. The 21-month is the line for AI names now. If you hold them, you should know your exit before the level.", "charts": {"count": 2, "hot": true, "desc": "Charts inside — Amazon 2021 monthly with 21/50/100-month MAs; performance chart"}, "link": "https://www.jamesbulltard.com/p/trading-is-really-really-hard"}, {"id": 34, "cat": "positioning", "urgency": "deep", "source": "James Bulltard / Running of the Bulltards", "title": "Bulltard cashed 4,000 INTC 60/80 call spreads at $19.20 (max $20) with Intel at $125 — it's $57 pre-market today, ~54% lower in five weeks", "idea": "Closed for almost $8M in late September, then rotated into casinos, which outperformed. His book: from ~$1.4M to $13.5M, +45% YTD, only +8% since June 1 vs S&P +2%, Nasdaq -4%. Intel's run: $35-40 to 3x in two months, retail piled in near the top.", "angle": "The single clean lesson: the consensus trade of the year gave back more than half in five weeks, and the exit was before the narrative turned.", "tweetA": "Intel $125 to $57 in five weeks. The 60/80 call spread that was worth $19.20 on a $20 max is worth ~$0 in two more. The best trade of the year can be a six-month position and a five-week round trip.", "tweetB": "He sold the top, bought casinos, and says he hates posters who don't disclose size. Intel's -54% is the best argument for taking the profit. The consensus winner of the year ($INTC) is already the consensus loser.", "charts": {"count": 0, "hot": false, "desc": "No chart in email"}, "link": "https://www.jamesbulltard.com/p/trading-is-really-really-hard"}, {"id": 35, "cat": "positioning", "urgency": "deep", "source": "James Bulltard / Running of the Bulltards", "title": "'Google was the consensus AI winner entering the year and is now the biggest loser; Microsoft fell 30% then rallied 50%' — narrative whiplash in a pod-heavy market", "idea": "Trump 'moonlights as a trader placing thousands of trades YTD'; solar +8% and oil -8% on one day while semis broke the 200-day. Pods pile into factors (AI, oil) because of inertia and the unwind is violent.", "angle": "Pod crowding + presidential headlines = factor moves of 8% in a day in sectors that used to move 1%.", "tweetA": "Solar +8%, oil -8%, semis through the 200-day. All in one day, all on policy narrative. This isn't a bear market; it's what a market looks like when fifty pods trade the same ten factors.", "tweetB": "Google went from AI winner to AI loser in a year. Microsoft -30% then +50%. If narrative half-life is a few months, the edge isn't being right about AI; it's being early on the next factor the pods haven't found yet.", "charts": {"count": 0, "hot": false, "desc": "No chart in email"}, "link": "https://www.jamesbulltard.com/p/trading-is-really-really-hard"}, {"id": 36, "cat": "gold", "urgency": "deep", "source": "Maggie Lake / The Market House (Dale Pinkert)", "title": "Dale Pinkert: palladium +8.3%, platinum +6%, silver +5%, gold +3.4% on Wednesday — 'platinum and palladium lead the next bull move'", "idea": "Gold got to $3,875 against his long-held $3,800 target ('this could be a bottom') but he wants one more low with RSI structure above 30. Silver touched $48.50 in his sub-$50 buy zone, with a possible break to $43. He's 'gently easing in' to PGMs. If the dollar has one more run, gold and silver could come off again.", "angle": "Leadership by the cheaper metals is the standard late-bottom pattern. Note the levels differ from other sources this morning (gold quoted at $4,135-4,140 elsewhere).", "tweetA": "Palladium +8.3%, platinum +6%, silver +5%, gold +3.4%. The ladder goes up as you go down in price. That's how a metals bottom looks — the junior metals lead and gold confirms last.", "tweetB": "Dale wants gold's last low with RSI above 30. Innes has gold at $4,140 on the oil collapse. One of them is about to be early. Platinum and palladium leading means the market is buying cheap beta before it buys the safe haven.", "charts": {"count": 4, "hot": false, "desc": "Charts inside — worth opening: metals charts, S&P, Micron, NVDA, DXY"}, "link": "https://themarkethouse.substack.com/p/dale-pinkert-platinum-and-palladium"}, {"id": 37, "cat": "positioning", "urgency": "deep", "source": "Maggie Lake / The Market House (Dale Pinkert)", "title": "S&P to 8,000 'by next week', Nasdaq needs to close back above 28,800, Micron needs >850, NVDA ~190 — and 'buy VIX calls to March with casino money'", "idea": "'Buy the leaders, sell the laggards.' Russell is a cheap version that doesn't like higher rates — leave it alone. VIX complacency: 'there are guys that say this is being suppressed and we won't have a clearing event until we see a 40 VIX'. Tax-loss harvesting is a risk into year-end after tech drawdowns.", "angle": "Technical map with explicit levels: S&P strong, Nasdaq broken then retested as resistance. Complacency in VIX comes from the person long-biased in S&P.", "tweetA": "S&P 8,000 by next week and VIX calls to March. Same technician, same morning. The index is a leader, vol is a cheap hedge, and Nasdaq is a laggard at 28,800. That's three different regimes at once.", "tweetB": "Tax-loss harvesting is the year-end flow nobody has on their calendar. Tech names with big drawdowns have a seller coming regardless of earnings. Micron below 850 and a tax-loss calendar says December isn't kind to the AI trade.", "charts": {"count": 3, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://themarkethouse.substack.com/p/dale-pinkert-platinum-and-palladium"}, {"id": 38, "cat": "macro", "urgency": "deep", "source": "Maggie Lake / The Market House (Dale Pinkert)", "title": "Dale: the 10-year already fell from his 5.31% high; he expects one more low near 4.85% then a drift up to 5.10% around payrolls; DXY 'bull flag' on the dollar", "idea": "Short DXY from 103 targeting 101, now flat into NFP: 'flagpole, ABC correction, bull flag'. If today's low breaks, the top is in. Two weeks of softer dollar and yields could reverse.", "angle": "The 10-year at ~5% is context: these are 'high-rate regime' levels. Even a call for 5.10% is just a retest.", "tweetA": "The 10-year peaked at 5.31%. The call: one more low at 4.85%, then back to 5.10%. A bond market where a 'dovish' low is still 4.85%.", "tweetB": "Dale is flat the dollar into NFP; Innes's DXY floor is 101-101.50. Two different technicians, one level. Friday's payroll is a binary around 101.", "charts": {"count": 2, "hot": false, "desc": "Charts inside — worth opening: 10-year, DXY"}, "link": "https://themarkethouse.substack.com/p/dale-pinkert-platinum-and-palladium"}, {"id": 39, "cat": "positioning", "urgency": "deep", "source": "Maggie Lake / The Market House (Dale Pinkert)", "title": "XLF made new all-time highs while KRE didn't — Dale lost on XLF puts because 'there are a lot of things in the XLF that are not banks'", "idea": "He bought XLF puts at a 61.8% retrace and the ETF made new highs. Regionals (KRE) 'not making new highs'; downside target 60 possible. His lesson: trade the banks, not the broad ETF.", "angle": "ETF composition risk is the point: an index you think is the bank trade is mostly payments, insurance and asset managers.", "tweetA": "Dale shorted the financials ETF and it went to new highs. His admission: XLF isn't banks. KRE hasn't made a high. The trade was right in the regional banks and wrong in the wrapper.", "tweetB": "Dauber says long money-center banks vs weaker deposit peers; Dale says short regionals. Same sector, same morning, opposite wrappers. The spread is the trade, not the ETF.", "charts": {"count": 0, "hot": false, "desc": "No chart in email"}, "link": "https://themarkethouse.substack.com/p/dale-pinkert-platinum-and-palladium"}, {"id": 40, "cat": "energy", "urgency": "deep", "source": "Maggie Lake / The Market House (Dale Pinkert)", "title": "Dale says the war isn't over because of the election — WTI level to watch is $82; wheat toward $6.87, corn +50 cents", "idea": "He doesn't expect WTI to 'just collapse to $70'; XLE was a crowded trade because of the war. Wheat: diverging, buy new lows, target $6.87 (not $10). Corn: reversal day, overdue correction, not short here.", "angle": "Three oil sources, three levels this morning: $82 (Dale), $98-108 range failure with a gap in the low-to-mid $80s (MacroEdge), Brent ~$94 (Dauber).", "tweetA": "WTI: Dale says watch $82. MacroEdge says the gap is the low-to-mid $80s. Same level, two technicians, no overlap in method. The market's next question is whether $82 holds on a retaliation headline.", "tweetB": "Dale's retail warning: risking 8-10% of an account on a single day in commodities. Oil -9% in a day proved the point. The real hedge isn't the position; it's the size.", "charts": {"count": 0, "hot": false, "desc": "No chart in email"}, "link": "https://themarkethouse.substack.com/p/dale-pinkert-platinum-and-palladium"}, {"id": 41, "cat": "positioning", "urgency": "deep", "source": "Stephen Innes / Dark Side of the Boom (Rubner / Citadel Securities)", "title": "Rubner: Nasdaq 100 fell ~10% in October while the equal-weight S&P rose ~5%; semis' forward EPS +30% since June but multiples -35%; CTAs at -3.3 SD", "idea": "Citadel Securities' Scott Rubner sees retail buying, buyback windows reopening and systematic strategies positioned defensively enough to become buyers. S&P futures recovered 260bp from overnight lows, Nasdaq futures 350bp. 'Post-midterm seasonality is unusually favourable.'", "angle": "Rubner's number: +30% EPS and -35% multiple implies semis' prices are ~15% lower (1.30 x 0.65 = 0.845). Earnings up, price down. That's a de-rating, not an earnings miss.", "tweetA": "Semis: forward EPS +30% since June. Multiples -35%. Do the arithmetic: 1.30 x 0.65 = 0.845, a 15% decline. The sector got better and the price got cheaper. That's what the unwind of a crowded trade looks like.", "tweetB": "Nasdaq 100 -10% in October, equal-weight S&P +5%. That's a 15-point spread inside one index. Rubner sees CTAs at -3.3 SD, which means the sellers are done and the buyers aren't. Setup, not signal.", "charts": {"count": 1, "hot": false, "desc": "Original Citadel Securities charts embedded in the article"}, "link": "https://thedarksideoftheboom.substack.com/p/november-the-setup-improves"}, {"id": 42, "cat": "macro", "urgency": "deep", "source": "Stephen Innes / Dark Side of the Boom (FX Daily)", "title": "The dollar can lose the election and still win the rates argument: US 2y swaps -5bp on the oil collapse vs -8-10bp for Europe, UK and NZ", "idea": "Innes: Brent -~10% Wednesday; US 2y swap rates fell 5bp, matching Canada/Australia/Sweden while EUR/GBP/NZD fell 8-10bp. He expects DXY to find its feet around 101.00-101.50. 'The dollar bears still need the Fed to blink.' He flattened the short-term trade.", "angle": "Relative rates, not politics, drive the dollar. Oil down lowers everyone's yields; the biggest cuts in expectations are outside the US.", "tweetA": "US 2-year swaps fell 5bp on the oil collapse. Europe fell 8-10bp. The dollar's rate advantage widened on the day the dollar was supposed to die.", "tweetB": "The blue wave took the war premium out of oil and the political premium out of the dollar. It didn't touch the Fed. A December hike at ~80% is the dollar's bodyguard. DXY below 101 needs the hike out of the price.", "charts": {"count": 0, "hot": false, "desc": "No chart in email"}, "link": "https://thedarksideoftheboom.substack.com/p/fx-daily-the-dollar-bears-still-need"}, {"id": 43, "cat": "macro", "urgency": "act", "source": "Stephen Innes / Dark Side of the Boom (FX Daily)", "title": "Friday NFP: consensus 65k, whispers ~70k; October ADP 86k vs 67k expected; ISM services employment 51.4, the highest since February; December Fed hike ~80% priced", "idea": "Resilient employment inputs after a firm JOLTS print. Innes: a friendlier inflation outlook and an imminent policy reversal are two different things. The next dollar leg lower needs the hike to come out of the price.", "angle": "Dauber's 4.65% 2-year line and Innes's 80% hike probability describe the same Friday. A payroll beat extends the hike; a miss starts to unwind it.", "tweetA": "ADP 86k vs 67k. ISM employment at a nine-month high. An 80% December hike. And the market just sold the dollar on the election. Friday's payroll is the only print that matters this week.", "tweetB": "Oil down 20% and the Fed still has an 80% hike priced. Either the market believes the energy shock is transitory and wages are the problem, or the hike is a stale price. The labor report decides which.", "charts": {"count": 0, "hot": false, "desc": "No chart in email"}, "link": "https://thedarksideoftheboom.substack.com/p/fx-daily-the-dollar-bears-still-need"}, {"id": 44, "cat": "macro", "urgency": "deep", "source": "Stephen Innes / Dark Side of the Boom (FX Daily)", "title": "Euro-area inflation accelerated to 4.0% in October (core 2.5%); Knot (Netherlands) vs Hernández de Cos for the ECB presidency; another ECB hike in December on the table", "idea": "Headline 4.0% from 3.8%, core steady at 2.5%, so 1.5 points of the headline is energy. Knot believes second-round pressures may need a more forceful response; Hernández de Cos is the dovish alternative. French sovereign risk lingers; 1.130 EUR/USD looks hard to move beyond. Mexico's carry advantage is shrinking.", "angle": "A 1.5-point headline/core gap during an oil collapse is a lag problem. The ECB leadership vote is a rate-path vote.", "tweetA": "Euro-area inflation: 4.0%. Core: 2.5%. The 1.5-point gap is energy, and oil just fell 20% in three days. The ECB's next hike is a decision about whether the energy pass-through is over.", "tweetB": "The ECB president choice between Knot and Hernández de Cos is a hawk/dove vote on a continent running 4% inflation with French sovereign stress. Whoever wins sets the euro's rate path for years. That is a bigger FX event than the Fed.", "charts": {"count": 0, "hot": false, "desc": "No chart in email"}, "link": "https://thedarksideoftheboom.substack.com/p/fx-daily-the-dollar-bears-still-need"}, {"id": 45, "cat": "gold", "urgency": "deep", "source": "Stephen Innes / Dark Side of the Boom (FX Daily)", "title": "Gold's wartime correlation is flipping: it traded inversely to oil because oil kept the Fed hawkish; with crude lower, gold is back at $4,140 (+2%)", "idea": "The Iran war saw higher crude as a millstone on bullion via inflation, hawkish Fed, elevated yields and forced liquidation. Now it runs in reverse: oil down, yields down, less need to sell gold to cover losses. Innes: 'a rally driven less by fear than by the removal of an inflationary obstacle.' Fair value neighbourhood just below $4,050.", "angle": "Counterintuitive regime: gold hasn't been a war hedge, it has been a rates trade. Peace is bullish for gold in this regime.", "tweetA": "Gold didn't rally on the war. It fell on it. Higher oil meant a more hawkish Fed and forced selling. Peace is the bullish catalyst for gold in this regime. That's not what the textbook says.", "tweetB": "If gold trades inverse to oil, then 'hedge your oil exposure with gold' is the wrong pairing. Gold, Treasuries and the dollar all respond to oil via the Fed. The war made gold a duration asset.", "charts": {"count": 0, "hot": false, "desc": "No chart in email"}, "link": "https://thedarksideoftheboom.substack.com/p/fx-daily-the-dollar-bears-still-need"}, {"id": 46, "cat": "AI/infra", "urgency": "deep", "source": "Michael Spencer / AI Supremacy", "title": "Enterprise gen-AI spend: $1.7B (2023) to $8.5B (2024) to $33B (2025) to $176.8B by September 2026 — 5.4x in a year; AI labs capture 69% of every enterprise AI dollar", "idea": "Per Menlo's State of Enterprise AI cited in the piece, deployment spend has grown roughly 100x in three years. Anthropic owns the top end through coding models and agentic use; Spencer says it looks like winner-takes-all leadership, with Google and OpenAI struggling to keep up in 2026.", "angle": "The $176.8B figure is smaller than one hyperscaler's annual capex. Amazon alone guides about $220B of cash capex for 2026.", "tweetA": "Enterprise AI spend: $33B in 2025. $176.8B by September 2026. Amazon alone will spend ~$220B in capex this year. The buyers are spending less than the builders are building.", "tweetB": "69% of every enterprise AI dollar goes to the labs. The infra layer, the apps layer, the services layer share the rest. The model providers are taking more of the economics, not less. Chips and power get paid by the labs, not by enterprises.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening: Menlo enterprise AI spend charts"}, "link": "https://www.ai-supremacy.com/p/is-recursive-self-improvement-the-moat-of-claude-and-anthropic"}, {"id": 47, "cat": "AI/infra", "urgency": "deep", "source": "Michael Spencer / AI Supremacy", "title": "Spencer calls Anthropic's S-1/A language about nearing recursive self-improvement 'a marketing stunt' and argues the real moat is capital, talent retention and Amazon/Alphabet ties", "idea": "Argues true RSI would be general and autonomous, not Claude Code helping build the next model faster; 'agent swarms feel more like cybersecurity threats and layoff pressures'. Gen-AI is 'conspicuously absent' from real-economy productivity. Calls the amended S-1/A warnings an IPO marketing angle and says Claude Code's share of top-end spend 'may only be temporary'.", "angle": "A contrarian read on a key IPO document from an AI-bull newsletter. Worth tracking because it will be the bear framing on the S-1.", "tweetA": "Anthropic's S-1/A warns it is near recursive self-improvement. One newsletter calls it an IPO marketing stunt. Both can be right: the risk factor is real and the timing of the disclosure is convenient.", "tweetB": "The skeptic's list: hyperscaler equity, circular financing, talent retention, coding share. Strip RSI out and you still have a company with the top slice of enterprise spend. The question isn't whether RSI is real; it's whether the coding moat lasts.", "charts": {"count": 0, "hot": false, "desc": "No chart in email"}, "link": "https://www.ai-supremacy.com/p/is-recursive-self-improvement-the-moat-of-claude-and-anthropic"}, {"id": 48, "cat": "regulation", "urgency": "act", "source": "Michael Spencer / AI Supremacy", "title": "Texas, Georgia and Ohio all elected Democratic governors promising pauses or freezes; Jefferies: 13.3 GW at risk under a Texas moratorium", "idea": "Roughly a quarter of US data-center capacity expected by 2030 is in Texas. Talarico made data centers central to his campaign (Senate) and Hinojosa beat three-term Governor Abbott. Local votes against data centers were widespread. Elon Musk and Starlink may face congressional investigations.", "angle": "State governors, not Congress, hold the permits, water, and grid interconnects. The three biggest pipeline states changed hands in one night.", "tweetA": "Texas, Georgia, Ohio. The three biggest data-center pipeline states elected governors who want to pause the build. A quarter of 2030 US capacity is in Texas alone.", "tweetB": "Jefferies has 13.3 GW at risk in Texas. Dauber has Goldman at 45% of new capacity. Every estimate of the permitting hit is a different number, but the geography is the same three states. That's a concentration risk the capex models didn't carry.", "charts": {"count": 0, "hot": false, "desc": "No chart in email"}, "link": "https://www.ai-supremacy.com/p/is-recursive-self-improvement-the-moat-of-claude-and-anthropic"}, {"id": 49, "cat": "positioning", "urgency": "act", "source": "Robert Marsh / Big Moves", "title": "'Consumers voted their book': XLY +4.3% and XLP +3.4% on Wednesday; energy the big loser; 118 names breached the volume/price filter", "idea": "Data center build stocks (Vistra, NRG, Quanta, Everus) fell while those paying for the build (Amazon, Microsoft) rose. Most of the biggest movers were earnings-driven. Brent fell nearly 9% and XLY includes Amazon +7% and Home Depot +5.4%.", "angle": "The author notes fundamentals still mattered despite politics — most big movers had earnings catalysts.", "tweetA": "118 names moved on a day the market called a political rotation. Most of them had earnings that day. The election story is real, but half the tape was just earnings.", "tweetB": "XLY +4.3%, XLP +3.4%. Both consumer ETFs up by a lot on lower oil and 'affordability'. Energy was the loser. If the market is voting on gasoline prices, the next test is how long oil stays down.", "charts": {"count": 1, "hot": false, "desc": "Scatter chart of Wednesday's biggest movers — worth opening"}, "link": "https://bigmoves.substack.com/p/big-moves-november-4-2026"}, {"id": 50, "cat": "AI/infra", "urgency": "deep", "source": "Robert Marsh / Big Moves", "title": "Amazon's scarcity thesis: AWS $46B revenue (+39%), $17.8B operating income (~39% margin), 63% of Amazon's operating profit; TTM free cash flow -$42.4B on ~$220B capex", "idea": "The model: permitting barriers raise the value of installed capacity, and slower competitor build lowers the funding burden. Jassy guided AWS growth above 40% in 2027 and 2028. Operating cash flow +29% to $168.3B, but net PP&E purchases up $94.8B YoY. Piece written by AI (GPT-5.6, Perplexity) per its own disclosure.", "angle": "Winners of a supply constraint need to be able to grow. AWS can only deliver >40% if it can build.", "tweetA": "AWS is 63% of Amazon's operating income, running a ~39% margin, with free cash flow at -$42.4B. A permitting freeze that hurts the competition also caps the segment that makes the company. That's not an obvious win.", "tweetB": "The market bought $AMZN for owning scarce capacity. But Jassy's >40% growth target for 2027-28 requires building more. The moratorium that raises AWS pricing power also limits AWS growth. You can't be long scarcity and long growth at once.", "charts": {"count": 0, "hot": false, "desc": "No chart in email"}, "link": "https://bigmoves.substack.com/p/big-moves-november-4-2026"}, {"id": 51, "cat": "macro", "urgency": "deep", "source": "Robert Marsh / Big Moves", "title": "Stanley Black & Decker's beat included ~$0.67 of tariff refunds — 29% of its $2.31 adjusted EPS", "idea": "Q3 adj EPS $2.31 vs $1.55 expected; organic sales +4%; 2026 EPS guidance raised to $5.95-6.25 from $5.20-5.80; new $1B buyback. The stock rose 13.1% to $118.33. Excluding the refund, EPS would be ~$1.64, still above consensus.", "angle": "Tariff refunds are showing up in earnings. The question is whether it's one-time. Companies reporting this quarter will either book them or hide them.", "tweetA": "Stanley Black & Decker beat at $2.31. $0.67 of it was tariff refunds. Strip that and it's $1.64 vs $1.55 expected. Still a beat, but a different quality of beat.", "tweetB": "Tariff refunds booked as earnings imply the court or Treasury process is paying back duties. Every importer that paid the old tariffs is a potential EPS surprise line. Who else hasn't reported a refund yet?", "charts": {"count": 0, "hot": false, "desc": "No chart in email"}, "link": "https://bigmoves.substack.com/p/big-moves-november-4-2026"}, {"id": 52, "cat": "regulation", "urgency": "deep", "source": "Robert Marsh / Big Moves", "title": "Centene +12.6% on expectations that a Democratic Congress protects Medicaid and ACA subsidies; CVS -12.5% on spin-off despite a beat and raise", "idea": "Health insurers and hospital operators rallied broadly on the election. CVS Q3 adj EPS $2.09 vs $1.65, revenue $108.4B (+5.4%), guidance raised to >$8.20, yet it fell on a plan to separate retail pharmacy from Aetna by H1 2028.", "angle": "Politics is the cleanest healthcare factor: a ballot flipped managed-care multiples without a single earnings change.", "tweetA": "Centene +12.6% with no company news. A Democratic House is worth more to Medicaid insurers than a quarter of earnings. CVS beat by 27% and fell 12.5%. Policy, not P&L.", "tweetB": "CVS beat by 27% on EPS and raised guidance, then fell on the spin plan. The market just repriced the conglomerate discount downward. Retail pharmacy 9,000 stores out; Aetna stays. That's two different multiples being priced as one.", "charts": {"count": 0, "hot": false, "desc": "No chart in email"}, "link": "https://bigmoves.substack.com/p/big-moves-november-4-2026"}, {"id": 53, "cat": "culture", "urgency": "deep", "source": "Robert Marsh / Big Moves", "title": "Duolingo +26%: DAUs +29% to 64.9M, paid subscribers +14% to 13.1M, revenue +12% to $309M — a monetization plan for 2027 while keeping free", "idea": "Revenue beat ($309M vs $303M), FY revenue guide ~$1.22B. Management will increase monetization in 2027 while preserving the free offering.", "angle": "DAU growth is 2.4x revenue growth. The stock is paying for the gap closing.", "tweetA": "Duolingo users +29%. Revenue +12%. The stock +26%. The market is paying for a monetization plan in 2027, not the quarter. DAUs are growing 2.4x faster than revenue — that's the whole bull case.", "tweetB": "Education technology: 64.9M daily users learning languages while AI translation keeps improving. The fear was that AI kills it. DAU +29% says it hasn't — yet. The 2027 monetization raises the real test: do users pay once the free tier shrinks?", "charts": {"count": 0, "hot": false, "desc": "No chart in email"}, "link": "https://bigmoves.substack.com/p/big-moves-november-4-2026"}, {"id": 54, "cat": "credit", "urgency": "deep", "source": "Robert Marsh / Big Moves", "title": "3M +9.6% on a $7.35B PFAS settlement (payments mostly 2028-2033) plus a new $6B buyback; Mosaic +17% on a loss as sulfur contracted at $615/long ton", "idea": "3M's settlement covers current and future AFFF claims. Mosaic: net loss $72M, adjusted EBITDA $324M (vs $806M a year ago), capex cut to $1.2B in 2026 and <$1B in 2027.", "angle": "Both are 'removal of tail' trades. 3M's tail is liability duration; Mosaic's is raw-material cost.", "tweetA": "3M settled $7.35B of PFAS liability, pays mostly in 2028-2033, and authorised a $6B buyback. The buyback is 82% of the settlement. The market read it as removal of the tail.", "tweetB": "Mosaic lost money, earnings fell 60% and the stock rose 17%. Cheap sulfur and capex cuts matter more than the quarter. Cash flow turn beats earnings trough.", "charts": {"count": 0, "hot": false, "desc": "No chart in email"}, "link": "https://bigmoves.substack.com/p/big-moves-november-4-2026"}, {"id": 55, "cat": "AI/infra", "urgency": "deep", "source": "Robert Marsh / Big Moves", "title": "Everus -29% despite revenue +40% and record $5.48B backlog (EBITDA included a $7.6M one-off); FIS -23.7% on guidance cut and CFO exit", "idea": "Everus: revenue +40.3% to $1.38B, EBITDA +57.5% to $140.2M but normalized margin ~9.6% vs reported 10.1%. FIS: cut 2026 EPS to $5.82-5.89 from $6.15-6.24 (about 5%), cut revenue growth to 3.1-3.6%, and lost its CFO.", "angle": "A 5% guidance cut producing a 24% stock drop is a multiple event. Everus is a pure data-center-contractor proxy that got sold before its numbers mattered.", "tweetA": "Everus: +40% revenue, record backlog, stock -29%. The tape isn't reading the numbers; it's reading the zip codes of the projects.", "tweetB": "FIS cut EPS guidance by 5% and lost 24%. The multiple on any bank-tech name with slow conversions just collapsed. Fintech infrastructure is being priced as a melting ice cube.", "charts": {"count": 0, "hot": false, "desc": "No chart in email"}, "link": "https://bigmoves.substack.com/p/big-moves-november-4-2026"}, {"id": 56, "cat": "positioning", "urgency": "deep", "source": "Macro Charts", "title": "Macro Charts: a huge broad rally — precious metals, homebuilders, medical devices, airlines, solar, retail, China, biotech, bitcoin, quality, MAG7, dividends — and 'one KEY scenario for TECH'", "idea": "'Slowly then all at once, a new picture is emerging.' Positioning and flows are priority one. 'Clean signals are setting up for the first time in a while.' Rest of the note (charts and the tech scenario) is behind the cut.", "angle": "Breadth is the story: the list spans cyclicals, defensives and risk assets. A rally that includes homebuilders and airlines is a rates-and-oil rally.", "tweetA": "Homebuilders, airlines, solar, retail, China, biotech, bitcoin and precious metals all rallied on the same day. That's not a sector rotation; it's a rates and oil move.", "tweetB": "Everything that benefits from lower oil and lower yields went up at once. The question is what's missing from the list: semiconductors. Breadth without tech is a different market than the one that spent 2025 on AI.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening: signals, positioning, tech scenario"}, "link": "https://www.macrocharts.com/p/market-update-and-signals-11526"}, {"id": 57, "cat": "macro", "urgency": "act", "source": "David Rosenberg / Early Morning with Dave", "title": "Rosenberg: Wednesday's move matched the first-day surges after Trump's 2016 and 2024 wins — but those came with tax cuts and deregulation; 'don't mistake a short-covering rally for something more significant'", "idea": "The post-election rally is on par with day-one surges after both Trump sweeps. Investors then knew tax cuts and deregulation were coming; this time the future 'will be something a little different...' (the free portion cuts off there).", "angle": "Same-size move, opposite policy. A rally whose scale is justified by a different catalyst is by definition a positioning event.", "tweetA": "Same size rally as November 2016 and November 2024. In those cases a tax-cut and deregulation agenda was coming. This time it's gridlock. A policy-agnostic rally that big is a short squeeze.", "tweetB": "The VIX fell to 16.61 and the S&P had its best day in months with no new fiscal catalyst. The only thing that changed is who is hedged. Rosenberg calls it short covering; the 15-point spread between equity vol and credit says he's probably right.", "charts": {"count": 0, "hot": false, "desc": "No chart in email"}, "link": "https://www.earlymorningwithdave.com/p/blue-wave-in-the-midterms-triggers"}, {"id": 58, "cat": "energy", "urgency": "deep", "source": "MacroEdge Oil & Gas Research", "title": "MacroEdge: 'Coloradofication of Texas' — if another Railroad Commission seat flips in ~3 years, stricter rules push small-operator consolidation (California as the template)", "idea": "Regulation raising costs for small operators accelerates consolidation. California's aggressive plugging-and-abandonment and bonding requirements are the extreme example. The author thinks the onshore panic is overdone but calls the Texas shift 'a fabulous wake-up call'. Frames it as part of a longer 'Project South Africa' trend.", "angle": "The key date is the RRC seat flip, not the governor. A three-year lag for a policy shock the market is pricing today.", "tweetA": "Texas Railroad Commission is the most important energy regulator in the US. One more seat flips in three years and it stops being a producer-friendly body. Bonding and P&A rules push small operators to sell.", "tweetB": "The regulatory shift in Texas is slow; the equity move was a day. If small-cap operators are squeezed out over a decade, the buyers are majors and large private equity. Consolidation is the base case for onshore.", "charts": {"count": 0, "hot": false, "desc": "No chart in email"}, "link": "https://macroedgeenergy.substack.com/p/macroedge-oil-and-gas-research-strategy-b6b"}, {"id": 59, "cat": "energy", "urgency": "deep", "source": "MacroEdge Oil & Gas Research", "title": "Oil broke the $98-108 range after a dozen failed attempts and the October uptrend; MacroEdge sees a gap fill in the low-to-mid $80s and a possible resumption of the war in 6-8 weeks", "idea": "'Patience through October' gains wiped out in three sessions. Sees the war as not over; wants to watch China's involvement in flows out of the Strait and Bab el-Mandeb. A small hedge placed Friday did little to offset big E&P losses. Frames strategy as a 'yacht approach' vs 'speedboat' for November.", "angle": "This is a tactical energy PM's confession. The signal is not the price but the sizing discipline.", "tweetA": "A dozen tests of $98-108, one failure. MacroEdge: 'a flat tire, a run-flat at 50 mph, a clown car on fire.' Unusually honest note from an energy specialist after three sessions erased a month.", "tweetB": "The gap fill into the low-to-mid $80s is the same level Dale Pinkert flagged at $82. If two independent technicians converge on one number, that's where the next oil decision gets made. And the 6-8 week war-resumption window ends right before year-end.", "charts": {"count": 0, "hot": false, "desc": "No chart in email"}, "link": "https://macroedgeenergy.substack.com/p/macroedge-oil-and-gas-research-strategy-b6b"}, {"id": 60, "cat": "venture", "urgency": "deep", "source": "Marvin Liao / The Hard Fork", "title": "Richard Rainwater: grew the Bass family's ~$50M into ~$5B in 16 years; evaluated deals on a one-page thesis plus what percentage of your net worth you'd put in", "idea": "Led the ~$478-500M Disney stake in 1984, bought distressed offshore drilling (Blocker, Penrod), built Columbia/HCA. Five lessons from The Icahnist include: concentrate, ideas are rare and capital isn't, buy control without overpaying, look for forced sellers amid change, and don't fear looking foolish.", "angle": "The one-page thesis plus size test is the filter. Anyone can write a thesis; very few state a number.", "tweetA": "Rainwater's test: write the thesis on one page and tell me what percent of your net worth is in it. $50M to $5B in 16 years is ~33% a year. He never looked at a 400-page deck.", "tweetB": "A 3% position and a long thesis is a hobby. Rainwater's rule made size the argument. In a market where every PM has a position-limited pod, that's a lost skill.", "charts": {"count": 0, "hot": false, "desc": "No chart in email"}, "link": "https://hardfork.substack.com/p/richard-rainwater-the-og-modern-deal"}, {"id": 61, "cat": "venture", "urgency": "watch", "source": "Chris Tottman / The Founders Corner", "title": "B2B buy
