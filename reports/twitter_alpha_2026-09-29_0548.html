<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Twitter Alpha Intelligence</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root {
  --bg: #faf8f5;
  --surface: #ffffff;
  --border: #e8e3da;
  --border-light: #f0ede4;
  --text: #1a1a1a;
  --text-2: #555;
  --text-3: #8a8a8a;
  --accent: #1a8cd8;
  --red: #d94052;
  --yellow: #fff5b3;
  --yellow-border: #f0d966;

  /* category colors (per spec) */
  --cat-macro: #2563eb;        /* blue */
  --cat-crypto: #8b5cf6;       /* purple */
  --cat-energy: #dc2626;       /* red */
  --cat-tech: #0d9488;         /* teal */
  --cat-ai: #4f46e5;           /* indigo */
  --cat-geopolitics: #dc2626;  /* red */
  --cat-positioning: #15803d;  /* green */
  --cat-regulation: #7c3aed;   /* purple */
  --cat-society: #d97706;      /* amber */
  --cat-em: #059669;           /* green */
  --cat-default: #6b7280;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; line-height: 1.55;
       background: var(--bg); color: var(--text); }
.container { max-width: 960px; margin: 0 auto; padding: 24px 16px 80px; }

/* HEADER */
.header { display: flex; justify-content: space-between; align-items: baseline;
          border-bottom: 2px solid var(--text); padding-bottom: 12px; margin-bottom: 20px; }
.title { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
.subtitle { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-3); }

/* FILTER BAR */
.filter-bar { display: none; background: var(--yellow); border: 1px solid var(--yellow-border);
              border-radius: 6px; padding: 8px 12px; margin-bottom: 16px;
              align-items: center; gap: 10px; font-size: 13px; }
.filter-bar.active { display: flex; }
.filter-bar button { font-family: inherit; font-size: 12px; background: transparent;
                     border: 1px solid var(--text); padding: 3px 10px; border-radius: 4px;
                     cursor: pointer; }
.filter-bar button:hover { background: rgba(0,0,0,0.05); }

/* SUMMARY */
.summary { background: var(--surface); border: 1px solid var(--border);
           border-left: 4px solid var(--red); border-radius: 6px;
           padding: 16px 18px; margin-bottom: 20px; }
.summary p { margin-bottom: 8px; }
.summary p:last-child { margin-bottom: 0; }
.summary strong { font-weight: 600; }

/* SECTIONS */
.section { background: var(--surface); border: 1px solid var(--border);
           border-radius: 6px; margin-bottom: 14px; overflow: hidden; }
.section-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px;
                background: #f3efe6; cursor: pointer; user-select: none;
                font-weight: 600; font-size: 13px; }
.section-head:hover { background: #ebe6dc; }
.section-letter { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
                  color: var(--text-3); min-width: 18px; }
.section-name { flex: 1; }
.section-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
                 color: var(--text-3); }
.section-arrow { font-size: 10px; color: var(--text-3); transition: transform .2s; }
.section.open .section-arrow { transform: rotate(90deg); }
.section-body { display: none; padding: 6px 0; }
.section.open .section-body { display: block; }

/* CLUSTER (Section A) */
.cluster { padding: 14px 16px; border-bottom: 1px solid var(--border-light); }
.cluster:last-child { border-bottom: none; }
.cluster-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
                flex-wrap: wrap; }
.cluster-title { font-weight: 600; font-size: 14px; }
.cluster-desc { color: var(--text-2); font-size: 13px; margin: 0 0 10px 0; }
.cluster-items { display: flex; flex-direction: column; gap: 8px; padding-left: 10px;
                 border-left: 2px solid var(--border-light); }
.cluster-item { font-size: 13px; padding: 6px 8px; border-radius: 4px; }
.cluster-item .item-text { font-size: 13px; margin-top: 4px; }
.cluster-item .item-head { font-size: 12px; }

/* ITEM CARDS (Sections B/C/D) */
.item-card { background: var(--surface); border: 1px solid var(--border);
             border-radius: 6px; padding: 12px 14px; margin: 10px 16px; }
.item-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
             flex-wrap: wrap; }
.item-author { font-weight: 600; color: var(--accent); cursor: pointer; }
.item-author:hover { text-decoration: underline; }
.item-time { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--text-3); }
.item-link { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--accent); text-decoration: none; }
.item-link:hover { text-decoration: underline; }
.item-text { font-size: 13.5px; line-height: 1.6; color: var(--text);
             white-space: pre-wrap; word-wrap: break-word; }
.item-thread { display: inline-block; font-size: 10px; font-weight: 600;
               background: var(--border); color: var(--text-2); padding: 1px 6px;
               border-radius: 3px; text-transform: uppercase; letter-spacing: .04em; }

/* CONTRARIAN (Section C) — red left border + soft red bg */
.section-contrarian .item-card {
  border-left: 4px solid var(--red);
  background: #fdf6f7;
}

/* CATEGORY PILLS */
.pill { display: inline-block; font-family: 'IBM Plex Mono', monospace; font-size: 10px;
        font-weight: 500; padding: 2px 7px; border-radius: 3px; color: #fff;
        text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }

/* IMAGES */
.thumbs { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.thumb { height: 100px; border: 1px solid var(--border); border-radius: 4px;
         cursor: zoom-in; background: #f0ede4; }

/* LIGHTBOX */
.lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85);
            align-items: center; justify-content: center; z-index: 100; cursor: zoom-out; }
.lightbox.open { display: flex; }
.lightbox img { max-width: 92vw; max-height: 92vh;
                box-shadow: 0 8px 40px rgba(0,0,0,.6); }

/* LINKS (Section E) */
.link-row { padding: 8px 16px; border-bottom: 1px solid var(--border-light);
            font-size: 13px; display: flex; gap: 12px; align-items: baseline; }
.link-row:last-child { border-bottom: none; }
.link-author { color: var(--text-3); min-width: 110px; cursor: pointer; }
.link-author:hover { color: var(--accent); }
.link-url { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
            color: var(--accent); text-decoration: none; word-break: break-all; flex: 1; }
.link-url:hover { text-decoration: underline; }
.link-desc { color: var(--text-2); font-size: 12px; }

/* AUTHOR FILTER STATES */
.filterable.match { background: var(--yellow); border-color: var(--yellow-border); }
.section-contrarian .item-card.filterable.match { background: var(--yellow); }
.filterable.dim { opacity: 0.25; }

/* STATS BAR */
.stats { margin-top: 24px; padding: 10px 14px; background: var(--surface);
         border: 1px solid var(--border); border-radius: 6px;
         font-family: 'IBM Plex Mono', monospace; font-size: 11.5px;
         color: var(--text-2); display: flex; gap: 18px; flex-wrap: wrap; }
.stats strong { color: var(--text); font-weight: 600; }

/* EMPTY */
.empty { color: var(--text-3); font-size: 13px; padding: 14px 18px; font-style: italic; }

/* RESPONSIVE */
@media (max-width: 640px) {
  .container { padding: 16px 12px 60px; }
  .item-card { margin: 8px 10px; }
  .link-row { flex-direction: column; gap: 4px; }
  .link-author { min-width: 0; }
  .header { flex-direction: column; align-items: flex-start; gap: 4px; }
}
</style>
</head>

<script>
const REPORT_DATA = {"report_type": "TWITTER ALPHA INTELLIGENCE", "collected_at": "2026-09-29T05:20:59Z", "input_stats": {"total_tweets": 213, "unique_authors": 63, "tweets_with_images": 37, "after_noise_filter": 112}, "summary": "**Iran/Hormuz:** Al Hadath reported Iran agreed to halt enrichment for sanctions relief. **@qthomp** called it a 'fake news headline assault' with oil and yields not buying it; **@zriboua** reads it as midterm-driven market management, not a policy shift; **@0xSammy** noted tokenized uranium dumped before the headline.\n\n**Rates:** **@elerianm** shared that the 30Y Treasury price index is down ~**60%** since 2020 to ~107 (its 2000 low); **@pboockvar** stresses the refi wall for pre-2022 debt; **@dampedspring** says stocks are ~**6% richer** over six months after discount-rate effects.\n\n**AI trade:** **@buccocapital** notes agentic losers are down **30 days in a row** while **@RaoulGMI** sees opportunity in AI/bond doom. **@aleabitoreddit** relays checks that Nvidia locked up ~**50%** of Lumentum's Greensboro laser capacity; AMD is buying World Labs for **$8.2B**.\n\n**Agents go mainstream:** Meta Muse, Instinct (~**10%/day** growth, ~**$1B/yr** transaction pace per **@patrick_oshag**) and Grok Bot dominate; OpenAI DevDay and an agent launch land tomorrow. Anthropic released **Sonnet 5.5** and its IPO filing reportedly includes a founder LLC for control.\n\n**Crypto:** **@0xQuit** detailed the PaymentProcessorV2 forged-sender exploit (~**23,000 NFTs / $5.9M** rescued). BTC ~**$82.9K** off $87K; Goldman brings a **$100B** Treasury fund to Avalanche; ZEC is **-25%** from its high.\n\n**Notable:** AI-music debate (**@udiWertheimer** vs **@nic_carter**) over whether streaming is dead.", "sections": {"A_events": [{"cluster": "Iran Uranium-for-Sanctions Headlines — Real Deal or Market Management?", "category": ["geopolitics", "energy", "macro"], "items": [{"author": "0xSammy", "summary": "Noticed tokenized uranium (xU3O8 on Etherlink) dumped twice before the Al Hadath report that Iran agreed to halt enrichment for sanctions relief hit. Flags it as possible correlation only, but worth watching whether 24/7 onchain commodity markets start pricing geopolitical news before traditional venues.", "tweet_url": "https://x.com/0xSammy/status/2104627886049149199", "images": ["https://pbs.twimg.com/media/HTUj5yeXkAAJpWg.jpg"], "type": "thread"}, {"author": "lord_fed", "summary": "Relays the Al Hadath headline: Iran has agreed to halt enrichment in exchange for easing of US sanctions.", "tweet_url": "https://x.com/lord_fed/status/2104621088173162609", "images": [], "type": "tweet"}, {"author": "qthomp", "summary": "Calls it a 'fake news headline assault' from the administration: three headlines in half a day (separate mediator talks Mon/Tue; Trump ready to ease sanctions/release frozen assets; Iran agreeing to halt enrichment). His point: oil and yields are not buying any of it.", "tweet_url": "https://x.com/qthomp/status/2104622228121800742", "images": [], "type": "tweet"}, {"author": "qthomp", "summary": "Questions Bessent's new sanctions action ('Operation Economic Outcast'): why proceed if a truce is supposedly imminent, and will Iran accept a deal while it continues?", "tweet_url": "https://x.com/qthomp/status/2104632871722037508", "images": [], "type": "tweet"}, {"author": "zriboua", "summary": "Responding to the enrichment/sanctions-relief headline: reads MOU and sanctions-relief talk as tactical market management ahead of the midterms to stabilize energy prices, not a strategic shift. While US military assets stay deployed regionally, policy toward Tehran (weaken/destroy the IRGC) is unchanged.", "tweet_url": "https://x.com/zriboua/status/2104688953895047485", "images": [], "type": "tweet"}, {"author": "zriboua", "summary": "Pushes back on 'TACO & panic' replies to her Hormuz call: argues the IRGC began losing the Strait the moment it tried to weaponize it, and that its bet (pressure Hormuz, burn markets, force Trump to withdraw or split the Gulf states) failed. Says people want narratives rather than foreign-policy analysis and links a longer piece on what Europe did and would not do on Iran.", "tweet_url": "https://x.com/zriboua/status/2104690020611178585", "images": [], "type": "thread"}, {"author": "zriboua", "summary": "Predicts the IRGC system is close to imploding — 'it's all fun and games until the praetorian guards need to get paid' — and jokes they should ask for refugee status in Russia or North Korea. Separately mocks the 'Iran's secret weapon' narrative (#122).", "tweet_url": "https://x.com/zriboua/status/2104684989526749580", "images": [], "type": "tweet"}, {"author": "Evan_ss6", "summary": "Trader mood: says his stock bags are under attack, wants a return to the MoU and a 'pink bazooka' intervention in the bond market. Adds that the market is tired of the headlines and needs the Iran issue resolved to break out to 39k (index level unspecified).", "tweet_url": "https://x.com/Evan_ss6/status/2104657500524208193", "images": [], "type": "thread"}, {"author": "lord_fed", "summary": "Poses a what-if: Trump ends both Russia/Ukraine and Iran before the midterms and the midterms still go against consensus. In replies calls it a low-single-digit-probability tail he wouldn't want to sell; argues voters care about petrol prices and the stock market.", "tweet_url": "https://x.com/lord_fed/status/2104624857451200526", "images": [], "type": "thread"}]}, {"cluster": "US Long Bond Rout, Term Premium and Refi Wall", "category": ["macro"], "items": [{"author": "elerianm", "summary": "Shares (HT LS) a chart claim that US Treasuries are in one of history's worst bear markets: the 30Y Treasury price-return index is down ~60% since 2020 to ~107, matching its 2000 low — six years erasing nearly 20 years of gains.", "tweet_url": "https://x.com/elerianm/status/2104649972163477878", "images": [], "type": "tweet"}, {"author": "dampedspring", "summary": "Says single term-premium models make no sense, but comprehensive models capturing term-premium-like factors do. His model today has only been higher at three notable stock market lows. Bull case: high term premium makes holding assets more attractive. Bear case: assets aren't cheap in a longer context and term-premium contractions have only come from TACO-style policy shifts. Framed as 'To V or not to V?' and answers 'Not to V' to super_macro (#19). In replies clarifies his smart-beta is not looking to add assets broadly to leverage up. Two charts attached.", "tweet_url": "https://x.com/dampedspring/status/2104693505314500621", "images": ["https://pbs.twimg.com/media/HTVfYeNXYAAamzX.png", "https://pbs.twimg.com/media/HTVfdRrWcAAEh6f.png"], "type": "thread"}, {"author": "dampedspring", "summary": "Equity valuation arithmetic: at a 25x forward P/E stocks 'correct sideways' ~4% per year if future earnings are fully known, so six months of unchanged prices implies ~2% cheapening. A 75bp change in the discount rate is worth roughly 8-10% on price, so the flat market is part sideways-correction (-2%) and part richening (+8%) — net stocks ~6% richer over six months. He debates the framework with replies (dislikes the 'correction in time' idea; the empirical estimate is 'mostly a guess').", "tweet_url": "https://x.com/dampedspring/status/2104707327941288195", "images": [], "type": "thread"}, {"author": "dampedspring", "summary": "Responding to a bond-allocation debate: calls it recency bias — buying bonds at sub-1% 10Y yields was stupid, but today you WANT price volatility in bonds because it reliably offsets a growth-slowdown equity drawdown.", "tweet_url": "https://x.com/dampedspring/status/2104661375046086867", "images": [], "type": "tweet"}, {"author": "pboockvar", "summary": "Argues 'rates back to long-term normal' misses that it follows 15 years of abnormal, and the pain is in refinancing: debt priced before 2022 is coming due this year and next (e.g. a real estate operator repricing from 3% to 8%, SPAC/LBO-era debt from 2021, any company with a revolver). Also stresses the rate of change and trajectory of the move, not just the level. Adds household mobility has been damaged by 3-4% mortgage lock-in.", "tweet_url": "https://x.com/pboockvar/status/2104607524154396933", "images": [], "type": "thread"}, {"author": "EconguyRosie", "summary": "Promo for tomorrow 2:00PM ET live session with Jeffrey Gundlach on where rates are headed, what the bond market signals, and credit cracks beneath the AI boom.", "tweet_url": "https://x.com/EconguyRosie/status/2104669934705836463", "images": [], "type": "tweet"}]}, {"cluster": "AI Trade Under Pressure — Agentic Losers, Nvidia Supply Lock-Ups, Oracle vs Apple", "category": ["AI", "tech", "positioning"], "items": [{"author": "buccocapital", "summary": "'Agentic losers' baskets are now down 30 days in a row. If software taught anything, such moves can run 180 days or more and logic is out the window — but it's not a bad time to start sharpening the pencil.", "tweet_url": "https://x.com/buccocapital/status/2104609553652293714", "images": [], "type": "tweet"}, {"author": "RaoulGMI", "summary": "Sees 'huge doomspreading' around AI and bond yields and says it's getting close to a lot of interesting opportunities.", "tweet_url": "https://x.com/RaoulGMI/status/2104743193078358260", "images": [], "type": "tweet"}, {"author": "aleabitoreddit", "summary": "Long channel-check dump. (1) ECOC checks: Nvidia reportedly secured ~50% of Lumentum's Greensboro UHP laser capacity (~$5B annual) with possible options on the rest, per Barclays — game-theory bottlenecking of rivals that raises strategic value of other merchant laser suppliers. (2) Nvidia's $150B authorized buyback ('printing too much'). (3) Samsung Electro-Mechanics expanding FC-BGA substrate capacity, funded by customers; Marvell filings cite large substrates as a core bottleneck alongside TSMC sole-source. (4) OpenAI reportedly delaying an October 'Astra-6.1' release over safety concerns while Nvidia launched an AI safety platform — not read as bearish, just models getting too good. Also notes World Labs/AMD ($8.2B) and beamformer technology as more important than he'd credited.", "tweet_url": "https://x.com/aleabitoreddit/status/2104698369591706069", "images": [], "type": "thread"}, {"author": "thedefivillain", "summary": "Quoting a 'long Oracle / short Apple' thesis (ROI on OpenAI/Meta AI products never better, old GPUs ripping, Apple richest ever), says he is long ORCL but doesn't need the AAPL short.", "tweet_url": "https://x.com/thedefivillain/status/2104662864564768805", "images": [], "type": "tweet"}, {"author": "spotgamma", "summary": "Mechanics note: someone holding Oracle bonds who needs to hedge would be a price-insensitive buyer of stock puts — a source of put demand around credit stress.", "tweet_url": "https://x.com/spotgamma/status/2104668274374086993", "images": [], "type": "tweet"}, {"author": "Delphi_Digital", "summary": "Podcast clip: José argues AI model sales alone can't justify frontier-lab valuations; compares the 'everything will run on it, no DCF needed' thinking to L1s at the top of the last cycle.", "tweet_url": "https://x.com/Delphi_Digital/status/2104722830747369536", "images": [], "type": "thread"}, {"author": "ASvanevik", "summary": "Looking for financing to buy or rent Vera Rubin systems; has a few MW of DC capacity to deploy next year and is soliciting neoclouds and chipmakers.", "tweet_url": "https://x.com/ASvanevik/status/2104784317750858162", "images": [], "type": "tweet"}]}, {"cluster": "AMD Buys World Labs for $8.2B — Fei-Fei Li's World-Model Startup", "category": ["AI", "tech"], "items": [{"author": "cryptopunk7213", "summary": "Highlights $0 to an $8.2B exit in two years. Argues AMD gets talent and IP for next-gen models and chip design, and World Labs solves its biggest neolab problem: compute. Notes Fei-Fei Li's standing as a 'godmother of AI'.", "tweet_url": "https://x.com/cryptopunk7213/status/2104672968840187934", "images": ["https://pbs.twimg.com/media/HTVM6RcWkAAMjTc.jpg"], "type": "tweet"}, {"author": "aleabitoreddit", "summary": "Mentions reading about the $8.2B AMD/World Labs deal and recalls calling physical AI + world models a major shift early, wishing he'd owned private exposure.", "tweet_url": "https://x.com/aleabitoreddit/status/2104698369591706069", "images": [], "type": "thread"}, {"author": "jonchu", "summary": "Admits he 'called it wrong' vs a16z/Martin Casado's team: big inception rounds were the right call this cycle. Replies note 2024 saw 2-3x price jumps and that Cognition's A in 2023 (which his firm did) data is misstated.", "tweet_url": "https://x.com/jonchu/status/2104750075754995771", "images": [], "type": "thread"}, {"author": "andrewchen", "summary": "Congratulates the a16z/World Labs team ('what a year so far and we still have q4').", "tweet_url": "https://x.com/andrewchen/status/2104671608459923717", "images": [], "type": "tweet"}]}, {"cluster": "Agent Assistants Go Mainstream — Meta Muse, Instinct, Grok Bot, OpenAI DevDay", "category": ["AI", "tech"], "items": [{"author": "patrick_oshag", "summary": "Personal use case for Instinct (invite-only AI assistant): from one photo and a brief it built a comparison website for gym speaker options, ordered from several vendors, and even ordered a longer 6m subwoofer cable after inferring from the photo that the stock 3m wouldn't reach — 10 minutes end to end.", "tweet_url": "https://x.com/patrick_oshag/status/2104718640893563198", "images": [], "type": "thread"}, {"author": "patrick_oshag", "summary": "From his Noah Shinn (Instinct founder) interview: Instinct is growing ~10% per day and Noah spends 40% of his time on compute. Compute doubles effectively weekly, lead times are months, buying spot costs 3-4x taxed, and even 5-8% daily growth compounds to ~100M users in 3-4 months — buy for that and you are 'very wrong' if it stalls.", "tweet_url": "https://x.com/patrick_oshag/status/2104716455228973414", "images": [], "type": "tweet"}, {"author": "patrick_oshag", "summary": "Instinct is on pace for ~$1B a year in transaction volume, 50% of it travel. Plan: free for users, blanket take rate from merchants (benchmarks: Shopify ~2.5-3%, Amazon up to 10%, Apple 30%; some boutique hotels offer up to 30%). Also shared invites (#118).", "tweet_url": "https://x.com/patrick_oshag/status/2104652976447168787", "images": [], "type": "tweet"}, {"author": "cryptopunk7213", "summary": "Says Meta bringing Muse to enterprises is a genius move because of its base of hundreds of millions of businesses already messaging customers on WhatsApp/Messenger. Model is free — Meta takes a percentage of transactions, so 'if you make money then Meta does'.", "tweet_url": "https://x.com/cryptopunk7213/status/2104624836563878270", "images": ["https://pbs.twimg.com/media/HTUhHtBWoAA-mW6.png"], "type": "tweet"}, {"author": "theallinpod", "summary": "Jason Calacanis: Grok Bot and Meta's Muse are the first agentic AI products a 'normie' can get value from; expects a turn by year-end as ordinary people get a free chief of staff / executive assistant, benefiting the bottom half of America in a K-shaped recovery.", "tweet_url": "https://x.com/theallinpod/status/2104681639204762049", "images": [], "type": "tweet"}, {"author": "cryptopunk7213", "summary": "Hyped for OpenAI's 'Aeon o' agent release tomorrow, positioning it as a Grok-bot/Muse competitor powered by GPT-6 'Astra' and 1B weekly users, and framing last year's OpenClaw purchase as about to pay off. Sam Altman (#167) says DevDay is tomorrow and 'we have found a new thing'.", "tweet_url": "https://x.com/cryptopunk7213/status/2104764665246924908", "images": ["https://pbs.twimg.com/media/HTWgTxAXgAEi5n9.jpg", "https://pbs.twimg.com/media/HTWgTw-XEAA36u6.jpg"], "type": "tweet"}, {"author": "garrytan", "summary": "Says code generation meets WhatsApp 'makes a ton of sense', reacting to the Wabi 2.0 launch (an agent-driven messenger tha // ---------- helpers ----------
const CAT_VARS = {
  macro: 'var(--cat-macro)',
  crypto: 'var(--cat-crypto)',
  energy: 'var(--cat-energy)',
  tech: 'var(--cat-tech)',
  ai: 'var(--cat-ai)',
  'ai/infra': 'var(--cat-ai)',
  geopolitics: 'var(--cat-geopolitics)',
  positioning: 'var(--cat-positioning)',
  regulation: 'var(--cat-regulation)',
  society: 'var(--cat-society)',
  em: 'var(--cat-em)',
};
function catColor(cat) {
  if (!cat) return 'var(--cat-default)';
  return CAT_VARS[String(cat).toLowerCase()] || 'var(--cat-default)';
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function escapeAttr(s) {
  return escapeHtml(s).replace(/`/g, '&#96;');
}

function renderBold(text) {
  return escapeHtml(text).replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
}

function relativeTime(iso) {
  if (!iso) return '';
  const dt = new Date(iso);
  if (isNaN(dt.getTime())) return '';
  const secs = Math.max(0, (Date.now() - dt.getTime()) / 1000);
  if (secs < 60)   return Math.floor(secs) + 's ago';
  const mins = secs / 60;
  if (mins < 60)   return Math.floor(mins) + 'm ago';
  const hrs  = mins / 60;
  if (hrs < 48)    return Math.floor(hrs) + 'h ago';
  return Math.floor(hrs / 24) + 'd ago';
}

function pill(cat) {
  if (!cat) return '';
  return `<span class="pill" style="background:${catColor(cat)}">${escapeHtml(cat)}</span>`;
}

function authorTag(name, cls = 'item-author') {
  if (!name) return '';
  return `<span class="${cls}" onclick="filterAuthor('${escapeAttr(name)}')">@${escapeHtml(name)}</span>`;
}

// ---------- rendering ----------
function renderThumbs(images) {
  if (!images || !images.length) return '';
  return `<div class="thumbs">` + images.map(u =>
    `<img src="${escapeAttr(u)}" class="thumb" loading="lazy" alt="" onclick="openLightbox('${escapeAttr(u)}')">`
  ).join('') + `</div>`;
}

function renderItem(item) {
  const author = item.author || item.author_username || '';
  const time = relativeTime(item.created_at);
  const thread = item.is_thread ? '<span class="item-thread">thread</span>' : '';
  const link = item.tweet_url
    ? `<a class="item-link" href="${escapeAttr(item.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  return `
    <div class="item-card filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${pill(item.category)}
        ${authorTag(author)}
        ${thread}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      <div class="item-text">${escapeHtml(item.text || '')}</div>
      ${renderThumbs(item.images)}
    </div>`;
}

function renderClusterItem(it) {
  const author = it.author || it.author_username || '';
  const time = relativeTime(it.created_at);
  const link = it.tweet_url
    ? `<a class="item-link" href="${escapeAttr(it.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  return `
    <div class="cluster-item filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${authorTag(author)}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      <div class="item-text">${escapeHtml(it.text || '')}</div>
      ${renderThumbs(it.images)}
    </div>`;
}

function renderCluster(cluster) {
  const itemsHtml = (cluster.items || []).map(renderClusterItem).join('');
  return `
    <div class="cluster">
      <div class="cluster-head">
        ${pill(cluster.category)}
        <div class="cluster-title">${escapeHtml(cluster.title || '')}</div>
      </div>
      ${cluster.description ? `<div class="cluster-desc">${escapeHtml(cluster.description)}</div>` : ''}
      ${itemsHtml ? `<div class="cluster-items">${itemsHtml}</div>` : ''}
    </div>`;
}

function renderLink(l) {
  const author = l.author || l.author_username || '';
  const url = l.url || (l.resolved || l.tco) || '';
  return `
    <div class="link-row filterable" data-author="${escapeAttr(author).toLowerCase()}">
      ${author
        ? authorTag(author, 'link-author')
        : '<span class="link-author">—</span>'}
      <a class="link-url" href="${escapeAttr(url)}" target="_blank" rel="noopener">${escapeHtml(url)}</a>
      ${l.description ? `<span class="link-desc">${escapeHtml(l.description)}</span>` : ''}
    </div>`;
}

function renderSection(letter, name, items, type) {
  if (!items || !items.length) return '';
  let body;
  if (type === 'events') {
    body = items.map(renderCluster).join('');
  } else if (type === 'links') {
    body = items.map(renderLink).join('');
  } else {
    body = items.map(renderItem).join('');
  }
  const cls = type === 'contrarian' ? 'section section-contrarian' : 'section';
  return `
    <div class="${cls}">
      <div class="section-head" onclick="toggleSection(this)">
        <span class="section-letter">${letter}.</span>
        <span class="section-name">${escapeHtml(name)}</span>
        <span class="section-count">${items.length}</span>
        <span class="section-arrow">▸</span>
      </div>
      <div class="section-body">${body}</div>
    </div>`;
}

function renderSummary(text) {
  if (!text) return '';
  const paragraphs = String(text).split(/\n\n+/).filter(Boolean)
    .map(p => `<p>${renderBold(p)}</p>`).join('');
  return `<div class="summary">${paragraphs}</div>`;
}

function renderStats(d) {
  const s = (d && d.stats) || d || {};
  const parts = [];
  if (s.received    != null) parts.push(`received <strong>${s.received}</strong>`);
  if (s.after_filter!= null) parts.push(`after filter <strong>${s.after_filter}</strong>`);
  if (s.authors     != null) parts.push(`authors <strong>${s.authors}</strong>`);
  if (s.coverage    != null) {
    const pct = (s.coverage <= 1 ? s.coverage * 100 : s.coverage);
    parts.push(`coverage <strong>${pct.toFixed(0)}%</strong>`);
  }
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSection(headEl) {
  headEl.parentElement.classList.toggle('open');
}

function openLightbox(src) {
  const img = document.getElementById('lightbox-img');
  img.src = src;
  document.getElementById('lightbox').classList.add('open');
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-img').src = '';
}

let activeFilter = null;
function filterAuthor(name) {
  if (!name) return;
  activeFilter = String(name).toLowerCase();
  document.querySelectorAll('.filterable').forEach(el => {
    const a = (el.dataset.author || '').toLowerCase();
    if (a === activeFilter) {
      el.classList.add('match');
      el.classList.remove('dim');
    } else {
      el.classList.add('dim');
      el.classList.remove('match');
    }
  });
  document.getElementById('filter-name').textContent = '@' + name;
  document.getElementById('filter-bar').classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function clearFilter() {
  activeFilter = null;
  document.querySelectorAll('.filterable').forEach(el => {
    el.classList.remove('match');
    el.classList.remove('dim');
  });
  document.getElementById('filter-bar').classList.remove('active');
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (document.getElementById('lightbox').classList.contains('open')) {
      closeLightbox();
    } else if (activeFilter) {
      clearFilter();
    }
  }
});

// ---------- schema normalization ----------
// Some producer runs emit the "sections" schema documented in the routine
// spec (report_type/input_stats/sections.A_events.../coverage) instead of
// the flat schema this renderer reads (date/events/insights/contrarian/
// positioning/links/stats). Normalize so either shape renders correctly.
function firstOf(v) {
  return Array.isArray(v) ? v[0] : v;
}

function normalizeItem(it) {
  if (!it || typeof it !== 'object') return it;
  return {
    author: it.author || it.author_username,
    text: it.text != null ? it.text : it.summary,
    category: firstOf(it.category),
    tweet_url: firstOf(it.tweet_url),
    images: it.images,
    created_at: it.created_at,
    is_thread: it.is_thread != null ? it.is_thread : (it.type === 'thread'),
  };
}

function normalizeData(d) {
  if (!d || typeof d !== 'object') return {};
  const hasFlat = d.events || d.insights || d.contrarian || d.positioning || d.links || d.stats;
  if (hasFlat) return d;

  const s = d.sections;
  if (!s) return d;

  const out = Object.assign({}, d);
  out.date = d.date || (d.collected_at ? String(d.collected_at).replace('T', ' ').replace('Z', ' UTC') : '');
  if (s.A_events) {
    out.events = s.A_events.map(cl => ({
      title: cl.cluster || cl.title,
      category: firstOf(cl.category),
      description: cl.description,
      items: (cl.items || []).map(normalizeItem),
    }));
  }
  if (s.B_insights) out.insights = s.B_insights.map(normalizeItem);
  if (s.C_contrarian) out.contrarian = s.C_contrarian.map(normalizeItem);
  if (s.D_positioning) out.positioning = s.D_positioning.map(normalizeItem);
  if (s.E_links) {
    out.links = s.E_links.map(l => ({
      author: l.author,
      url: l.url,
      tweet_url: firstOf(l.tweet_url),
      description: l.note || l.description,
    }));
  }
  const stats = d.stats || {};
  out.stats = {
    received: stats.received != null ? stats.received : (d.input_stats && d.input_stats.total_tweets),
    after_filter: stats.after_filter != null ? stats.after_filter : (d.input_stats && d.input_stats.after_noise_filter),
    authors: stats.authors != null ? stats.authors : (d.coverage && d.coverage.authors_total),
    coverage: stats.coverage != null ? stats.coverage : (d.coverage && d.coverage.coverage_pct),
  };
  return out;
}

// ---------- main ----------
function renderReport(d) {
  d = normalizeData(d);
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  const sections = [
    renderSummary(d.summary),
    renderSection('A', 'Events & Reactions',      d.events,                                'events'),
    renderSection('B', 'Alpha & Insights',        d.insights || d.alpha,                   'items'),
    renderSection('C', 'Contrarian Views',        d.contrarian,                            'contrarian'),
    renderSection('D', 'Positioning & Trade Ideas', d.positioning,                         'items'),
    renderSection('E', 'Link Queue',              d.links,                                 'links'),
  ].join('');
  const app = document.getElementById('app');
  app.innerHTML = sections || '<div class="empty">No report data.</div>';

  // Auto-open first two sections.
  document.querySelectorAll('.section').forEach((s, i) => {
    if (i < 2) s.classList.add('open');
  });

  document.getElementById('stats').innerHTML = renderStats(d);
}

renderReport(REPORT_DATA);
</script>
