  idea: "Banks including Morgan Stanley and Citi are pressuring law firms to pass along AI-driven cost savings on routine legal work; Citi's Gretta Rusanow expects fixed fees for routine work with billable hours preserved only for complex matters, while Morgan Stanley GC Eric Grossman says law firm compensation models built on associate billable hours are 'now extraordinarily unstable.'",
  angle: "This is the same pattern that hit discount brokerages in the 1990s — technology compresses fees on commoditized execution while the premium shifts to judgment and complexity. Legal-tech tools doing the AI contract review (Harvey and peers, see a16z item below) become the toll-booth on that fee compression, not the law firms themselves.",
  tweetA: "Banks did to law firms in 2026 what E*TRADE did to stockbrokers in the 1990s: AI made the routine work cheap, so the buyer now demands the savings get passed through. Morgan Stanley's own GC says the billable-hour model is 'extraordinarily unstable.' Big Law's margin compression starts with its biggest clients, not with competition from other firms.",
  tweetB: "The interesting trade isn't shorting law firms — it's that whoever owns the AI tool doing the routine legal work captures the spread between what banks used to pay and what firms can now bill. Compression at the client relationship always creates a toll-booth somewhere else in the chain.",
  charts: { count: 0, hot: false, desc: "No chart; reporting piece citing FT." },
  link: "https://www.ai-street.co/p/banks-want-a-cut-of-big-laws-ai-savings" },

{ id: 14, cat: "macro", urgency: "watch", source: "AI Street / Matt Robinson",
  title: "AI agents could learn to predict — and defeat — central bank forward guidance",
  idea: "Princeton economist Markus Brunnermeier, in a paper presented to central bankers at Jackson Hole, argues AI agents trained on central bank speeches and meeting minutes could get very good at predicting policymaker actions, making markets less informative and more erratic, and potentially forcing central banks to communicate less clearly or intervene more directly to avoid being gamed.",
  angle: "If this thesis is right, forward guidance itself becomes a liability once AI agents can systematically front-run it — central banks may need to shift toward rules-based, less-discoverable frameworks, which would be a regime change in how rate-sensitive assets get priced around FOMC dates.",
  tweetA: "A Princeton economist told central bankers at Jackson Hole that AI agents will get so good at predicting Fed/ECB speeches that forward guidance stops working — the bank has to obscure its own reaction function to avoid being gamed. If that's right, every 'the Fed telegraphs its next move' trade you run today has an expiration date.",
  tweetB: "Central banks spent 20 years building credibility through transparent forward guidance. The next threat to that isn't populism, it's an AI agent trained on FOMC transcripts predicting the next move better than the market does. Transparency was the tool. It might become the vulnerability.",
  charts: { count: 0, hot: false, desc: "No chart; academic paper summary." },
  link: "https://www.ai-street.co/p/banks-want-a-cut-of-big-laws-ai-savings" },

{ id: 15, cat: "macro", urgency: "deep", source: "Raoul Pal",
  title: "The real inflation hurdle isn't 2-3%, it's 11%",
  idea: "Raoul Pal frames global liquidity growth (~8%/year) plus CPI inflation (~2-3%) as an ~11% annual 'debasement hurdle' that any asset must clear to build real purchasing power. Over the last decade: gold ~12%, S&P 500 ~13%, Nasdaq 100 ~20%, Bitcoin 58-70% annualized — meaning bonds, most property, and even the S&P (just barely) have been losing to money-supply growth in real terms for years.",
  angle: "This reframes 'beating inflation' as the wrong bar entirely — CPI understates the actual debasement rate by roughly 4x under this math, meaning most professionally-managed diversified portfolios have quietly lost real purchasing power even while beating their own benchmark.",
  tweetA: "Raoul Pal's math: global liquidity grows ~8%/year, CPI adds another 2-3%, so the real hurdle to preserve purchasing power is ~11%, not 2%. Under that bar, bonds lose, most property loses, and even the S&P 500's incredible decade (13%/yr) barely clears it. The 'beat inflation' benchmark everyone uses is off by roughly 4x.",
  tweetB: "If the real debasement rate is 11% and not 2%, then a 'balanced' 60/40 portfolio hasn't been diversifying risk for the last decade — it's been diversifying the SAME risk four different ways, all four of which have been losing to money supply growth. Diversification only works if the things you own aren't secretly the same trade.",
  charts: { count: 0, hot: false, desc: "No embedded chart, but decade-by-asset return comparisons cited throughout — worth opening for the full table." },
  link: "https://raoulpal.substack.com/p/why-traditional-portfolios-stopped" },

{ id: 16, cat: "crypto", urgency: "watch", source: "Raoul Pal",
  title: "AI agents are crypto's next adoption wave — and it's already 80:1",
  idea: "Pal cites forecasts that non-human (AI agent) identities will outnumber human employees inside enterprises by roughly 80:1, arguing these agents need programmable, always-on settlement rails (Anthropic's MCP, Google's Agent2Agent/WebMCP, Coinbase's x402) because they have no legal identity and can't open a bank account or tolerate a settlement system that closes at 5pm.",
  angle: "This turns the crypto-adoption bull case away from human retail speculation entirely and into enterprise infrastructure plumbing — the demand driver becomes machine-to-machine settlement volume, a much less sentiment-dependent thesis than 'more people buy coins.'",
  tweetA: "80 AI agents for every human employee, forecast inside enterprises. None of them can open a bank account. All of them need to pay each other, all day, every day, with no branch to walk into. That's not a crypto bull case about retail adoption — that's a description of mandatory infrastructure demand that doesn't care about sentiment.",
  tweetB: "Anthropic gave away MCP. Google built Agent2Agent. Coinbase built x402 for agents to pay each other over HTTP. Three different labs independently built the same plumbing in the same year. When competitors build identical infrastructure without coordinating, that's not a trend, that's a bottleneck everyone hit at the same time.",
  charts: { count: 0, hot: false, desc: "No chart; framework/thesis piece." },
  link: "https://raoulpal.substack.com/p/why-traditional-portfolios-stopped" },

{ id: 20, cat: "positioning", urgency: "deep", source: "Rupak Ghose",
  title: "Jain Global: 35-40% gross returns, 8.4% net — the real cost of a pod-shop launch",
  idea: "Jain Global generated gross returns of 35-40% over two years, per Bloomberg, but net returns to investors were only 8.4% after buildout and pass-through costs — implying the fund's cost structure consumed roughly three-quarters of its gross alpha during its scale-up phase.",
  angle: "This is the clearest single data point yet on the true economics of the multi-strategy 'pod shop' launch model: even a fund generating genuinely excellent gross performance can deliver mediocre net returns purely from the fixed-cost burden of building out infrastructure, which should make allocators far more skeptical of any new platform launch regardless of the stated gross track record.",
  tweetA: "Jain Global: 35-40% gross returns over two years. Net to investors: 8.4%. That's not a fee, that's an entire fund's worth of alpha getting eaten by buildout costs before a single dollar reaches an LP. Every allocator chasing 'the next Millennium' needs to underwrite this exact gap, not the gross number in the pitch deck.",
  tweetB: "The multi-strat pod shop pitch is 'diversification and downside protection.' The actual product being sold to allocators, once you look at gross-vs-net, is 'pay full freight to fund our infrastructure buildout while we figure out if the strategy works.' Jain's 8.4% net on 35-40% gross is that math laid bare.",
  charts: { count: 0, hot: false, desc: "No chart in this section; charts appear later in the piece on AUM growth." },
  link: "https://rupakghose.substack.com/p/peak-pod-shop-and-balyasny-blues" },

{ id: 21, cat: "positioning", urgency: "deep", source: "Rupak Ghose",
  title: "Balyasny is flat in 2026 across every single book at once — \"peak pod shop\"?",
  idea: "Balyasny is roughly flat for 2026 while the average hedge fund is up strongly and peers Millennium, Citadel and Point72 average over 10% net; its March drawdown was a multiple of peer platforms', and it's underperforming across equities, fixed income AND commodities simultaneously — unlike ExodusPoint, whose weakness was concentrated in fixed income alone.",

  tweetA: "Balyasny is flat in 2026 while Millennium, Citadel and Point72 average 10%+. The tell isn't the underperformance, it's that it's happening in equities, fixed income AND commodities simultaneously. One bad book is a manager problem. Three bad books at once is a 'the diversification stopped working' problem.",
  tweetB: "The pod shop pitch to allocators for a decade has been 'we don't have one bad year because we're diversified across a dozen uncorrelated books.' Balyasny just had a bad year across every single book at the same time. That's the whole value proposition failing its first real test in a tougher-rate environment.",
  charts: { count: 1, hot: false, desc: "Charts showing Balyasny AUM growth since 2018 trough and 2026 monthly net returns vs. the three largest multi-manager peers." },
  link: "https://rupakghose.substack.com/p/peak-pod-shop-and-balyasny-blues" },

{ id: 22, cat: "ai", urgency: "deep", source: "a16z",

{ id: 23, cat: "venture", urgency: "deep", source: "a16z",
  title: "Harvey manufactured 1,750 fake legal cases instead of waiting for real ones",
  idea: "Harvey post-trained an open-weight legal model using roughly 1,750 synthetic 'legal-task environments' — each simulating a partner-assigned matter with documents, tools, and an expert rubric averaging 50 specific grading criteria — rather than waiting years to accumulate enough real customer case history to train on.",
  angle: "This is a repeatable playbook for any vertical AI startup lacking proprietary historical data: manufacture the training curriculum synthetically with domain experts writing the rubrics, then use live customer deployment only to learn firm-specific idiosyncrasies — which lowers the data moat as a barrier to entry for well-capitalized new entrants in adjacent verticals.",
  tweetA: "Harvey didn't wait to accumulate years of real case data. It manufactured 1,750 fake legal matters with expert-written grading rubrics (50 criteria each) and trained on that instead. If 'we lack proprietary data' was your moat thesis against a well-funded vertical AI entrant, this is the counter-argument: they can just synthesize the curriculum with domain experts instead of waiting for you to generate it.",
  tweetB: "The data-moat thesis for vertical AI has a hole in it: Harvey proved you can manufacture a training curriculum synthetically if you can hire the domain experts to write the rubric. That shifts competitive advantage away from 'who has the most historical data' toward 'who can hire the best domain experts to grade synthetic work' — a very different, more purchasable moat.",
  charts: { count: 0, hot: false, desc: "No chart; methodology description." },
  link: "https://www.a16z.news/p/the-incumbents-are-coming" },

{ id: 29, cat: "gold", urgency: "deep", source: "Phil Dauber / Market Musing",
  title: "Gold up $108 while the yield curve didn't move a single basis point",
  idea: "Gold rallied $108 (+2.45%) to 4,522.60 while the Treasury curve printed the identical 4.39/4.79/5.27 (2Y/10Y/30Y) two sessions running, unchanged; the yen strengthened 2% and the dollar was offered broadly. The note flags a Dutch central bank move of roughly 86 metric tons ($12B) of gold out of New York/Ottawa vaults into London since March, explicitly citing 'geopolitical unrest' — evidence this is a custody/counterparty trade, not just a rate-differential trade.",
  angle: "A central bank physically repatriating gold from US vaults is a much stronger signal than any ETF flow data — it's an explicit statement about counterparty and jurisdiction risk with the dollar-based custodial system, and if more central banks follow the Dutch move, that's a structural bid under gold independent of Fed policy path.",
  tweetA: "The Dutch central bank has moved 86 tons of gold — $12B worth — out of New York and Ottawa vaults into London since March, citing 'geopolitical unrest.' That's not a rate trade. That's a sovereign telling you which jurisdictions it no longer trusts to hold its money. Gold up $108 while the yield curve didn't move a single basis point is the market pricing the same thing.",
  tweetB: "Two sessions, identical Treasury curve down to the basis point. Gold up 2.45% in the same window. When the discount-rate trade (curve) says nothing changed but the safe-haven trade (gold) says something did, the something is custody risk, not monetary policy — and custody risk doesn't get priced back out by a rate cut.",
  charts: { count: 0, hot: false, desc: "Full sheet of 29 live trade lines behind the paywall; free section describes gold/curve/oil/FX moves in detail — worth opening." },
  link: "https://phildauber.substack.com/p/apres-moi" },

let activeCat = 'all';
let activeUrg = 'all';
let activeSrc = null;

function countByCat(key) {
  if (key === 'all') return ITEMS.length;
  return ITEMS.filter(function(i){ return i.cat === key; }).length;
}
function countByUrg(key) {
  if (key === 'all') return ITEMS.length;
  return ITEMS.filter(function(i){ return i.urgency === key; }).length;
}

function renderMeta() {
  document.getElementById('header-meta').textContent =
    META.date + '  ·  ' + META.time + '  ·  ' + META.itemsExtracted + ' items from ' + META.emailsRead + ' emails';
}

function renderCatFilter() {
  const el = document.getElementById('cat-filter');
  let html = '';
  html += '<button class="pill' + (activeCat === 'all' ? ' active' : '') + '" style="' + (activeCat === 'all' ? 'background:#333;' : '') + '" onclick="setCat(\'all\')">All <span class="count">' + countByCat('all') + '</span></button>';
  CATS.forEach(function(c) {
    const n = countByCat(c.key);
    if (n === 0) return;
    const isActive = activeCat === c.key;
    html += '<button class="pill' + (isActive ? ' active' : '') + '" style="' + (isActive ? 'background:' + c.color + ';' : '') + '" onclick="setCat(\'' + c.key + '\')">' + c.label + ' <span class="count">' + n + '</span></button>';
  });
  el.innerHTML = html;
}

function renderUrgFilter() {
  const el = document.getElementById('urg-filter');
  let html = '';
  html += '<button class="pill' + (activeUrg === 'all' ? ' active' : '') + '" style="' + (activeUrg === 'all' ? 'background:#333;' : '') + '" onclick="setUrg(\'all\')">All <span class="count">' + countByUrg('all') + '</span></button>';
  URGENCY.forEach(function(u) {
    const n = countByUrg(u.key);
    if (n === 0) return;
    const isActive = activeUrg === u.key;
    html += '<button class="pill' + (isActive ? ' active' : '') + '" style="' + (isActive ? 'background:#333;' : '') + '" onclick="setUrg(\'' + u.key + '\')">' + u.label + ' <span class="count">' + n + '</span></button>';
  });
  el.innerHTML = html;
}

function setCat(key) {
  activeCat = key;
  activeSrc = null;
  renderCatFilter();
  renderUrgFilter();
  renderCards(false);
}
function setUrg(key) {
  activeUrg = key;
  activeSrc = null;
  renderCatFilter();
  renderUrgFilter();
  renderCards(false);
}

function urgencyEmoji(key) {
  if (key === 'act') return '🔴';
  if (key === 'deep') return '🔵';
  return '🟡';
}

function renderCards(preserveExpanded) {
  const el = document.getElementById('cards');
  let html = '';
  ITEMS.forEach(function(item, idx) {
    const catInfo = CAT_MAP[item.cat];
    const visible =
      (activeCat === 'all' || item.cat === activeCat) &&
      (activeUrg === 'all' || item.urgency === activeUrg) &&
      (activeSrc === null || item.source.indexOf(activeSrc) !== -1);
    const expand = activeSrc !== null && item.source.indexOf(activeSrc) !== -1;
    let chartFlag = '';
    if (item.charts.hot) chartFlag = '🔥';
    else if (item.charts.count > 0) chartFlag = '📊';

    html += '<div class="card' + (expand ? ' expanded' : '') + (visible ? '' : ' hidden-card') + '" data-id="' + item.id + '">';
    html += '<div class="card-header" onclick="toggleCard(' + item.id + ')">';
    html += '<span class="idx">' + String(idx + 1).padStart(2, '0') + '</span>';
    html += '<span class="urgency-emoji">' + urgencyEmoji(item.urgency) + '</span>';
    html += '<span class="badge" style="background:' + catInfo.color + '">' + item.source + '</span>';
    html += '<span class="cat-tag">' + catInfo.label + '</span>';
    if (chartFlag) html += '<span class="chart-flag">' + chartFlag + '</span>';
    html += '<span class="card-title">' + item.title + '</span>';
    html += '</div>';

    html += '<div class="card-body">';
    html += '<div class="section-label">The Idea</div>';
    html += '<div class="idea-text">' + item.idea + '</div>';
    html += '<div class="section-label">My Angle</div>';
    html += '<div class="angle-box" style="border-left:2px solid ' + catInfo.color + '; background:' + catInfo.color + '10;">' + item.angle + '</div>';

    html += '<div class="tweets-row">';
    html += '<div class="tweet-box"><div class="tweet-label a">TWEET A</div><div class="tweet-text">' + item.tweetA + '</div><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button></div>';
    html += '<div class="tweet-box"><div class="tweet-label b">TWEET B</div><div class="tweet-text">' + item.tweetB + '</div><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div>';
    html += '</div>';

    if (item.charts.count > 0 || item.charts.desc) {
      html += '<div class="charts-box' + (item.charts.hot ? ' hot' : '') + '">';
      if (item.charts.hot) html += '<strong>🔥 CHART WORTH SAVING</strong><br>';
      if (item.charts.count > 0) html += item.charts.count + ' chart(s): ';
      html += item.charts.desc;
      html += '</div>';
    }

    html += '<a class="read-link" href="' + item.link + '" target="_blank">↗ Read full article</a>';
    html += '</div>'; // card-body
    html += '</div>'; // card
  });
  el.innerHTML = html;
}

function toggleCard(id) {
  const card = document.querySelector('.card[data-id="' + id + '"]');
  if (card) card.classList.toggle('expanded');
}

function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}

function filterBySrc(name) {
  activeCat = 'all';
  activeUrg = 'all';
  activeSrc = name;
  renderCatFilter();
  renderUrgFilter();
  renderCards(true);
  document.getElementById('cards').scrollIntoView({ behavior: 'smooth' });
}

function renderReport() {
  const el = document.getElementById('report-body');
  let html = '';
  html += '<div>Window: <strong>' + META.windowStart + '</strong> → <strong>' + META.windowEnd + '</strong>. Emails outside this window were not processed.</div>';
  html += '<div>' + META.emailsRead + ' of ' + META.emailsInWindow + ' emails in window read in full. ' + META.itemsExtracted + ' items extracted.</div>';

  html += '<div class="report-section-title">Included sources</div>';
  META.includedSources.forEach(function(s) {
    html += '<div><span class="src-link" onclick="filterBySrc(\'' + s.name.replace(/'/g, "\\'") + '\')">' + s.name + '</span> — ' + s.count + ' item(s)</div>';
  });

  html += '<div class="report-section-title">Skipped sources</div>';
  if (META.skippedSources.length === 0) {
    html += '<div>None — every email in the window contained extractable content.</div>';
  } else {
    META.skippedSources.forEach(function(s) {
      html += '<div>' + s.name + ' — ' + s.reason + '</div>';
    });
  }

  html += '<div class="report-section-title">Totals</div>';
  html += '<div>' + META.itemsExtracted + ' items · ' + META.includedSources.length + ' sources · ' + ITEMS.filter(function(i){return i.urgency==='act';}).length + ' Act Now · ' + ITEMS.filter(function(i){return i.urgency==='deep';}).length + ' Deep · ' + ITEMS.filter(function(i){return i.urgency==='watch';}).length + ' Watch</div>';

  el.innerHTML = html;
}

document.getElementById('report-toggle').addEventListener('click', function() {
  const body = document.getElementById('report-body');
  body.classList.toggle('open');
});

renderMeta();
renderCatFilter();
renderUrgFilter();
renderCards(false);
renderReport();
</script>
