<script>
const ITEMS = [{"id": 1, "cat": "gold", "urgency": "act", "source": "The Dark Side of the Boom / Stephen Innes (Gold Weekly)", "title": "Gold lost $600 in nine sessions and broke $3,600. Next support is $3,400", "idea": "Gold fell $600 in nine trading sessions, broke below $3,600 and now sits on the lower edge of a descending channel. The next support is about $3,400. Innes points to three drivers at once: higher real yields, a stronger dollar and a Fed that is hiking. He also sees signs of a liquidity squeeze, with investors selling diversifiers because they are liquid. Daily and weekly RSI are near their most oversold levels in decades.", "angle": "When gold sells off alongside equities and BTC, it is being used to raise cash. It is not acting as a hedge. Real short-covering fuel exists, but the channel of lower highs stays intact until the price holds a level for several sessions.", "tweetA": "Gold down $600 in 9 sessions while the Nasdaq has its worst week since 2020. That is not a hedge failing. It's the most liquid winner being sold to meet margin elsewhere. Forced sellers don't care about RSI. $GLD", "tweetB": "Daily AND weekly RSI on gold at multi-decade oversold, with $3,400 channel support right below. Shorts initiated here are paying for the last $600 of someone else's trade. I'd rather sell vol than sell the metal.", "charts": {"count": 5, "hot": true, "desc": "Five charts: descending channel with $3,400 support, UBS drawdown-from-peak history, daily RSI, weekly RSI, GVZ vs gold price"}, "link": "https://thedarksideoftheboom.substack.com/p/gold-market-weekly-technicals-dare"}, {"id": 2, "cat": "gold", "urgency": "deep", "source": "The Dark Side of the Boom / Stephen Innes (Gold Weekly)", "title": "GVZ rising while gold falls means a disorderly liquidation, not an orderly repricing", "idea": "The Cboe Gold ETF Volatility Index (GVZ) is climbing as the price collapses, so investors are paying up for protection. Innes contrasts two cases. In an orderly repricing, vol stays contained. In a disorderly liquidation, vol spikes. His bottom signal is price stabilising AND vol falling, and that has not happened yet. The UBS drawdown chart (100 = prior peak) shows the 1980 peak was followed by years below the high.", "angle": "Elevated GVZ makes both puts and calls expensive. The cleaner expression is to sell downside vol (put-writing) near $3,400 rather than buy calls.", "tweetA": "Gold falling AND implied vol rising. In a healthy correction vol compresses. When protection gets more expensive as price drops, the marginal holder is scared, not done. The bottom shows up when GVZ rolls over first.", "tweetB": "Everyone wants to buy gold calls after a $600 drop. With GVZ spiking you're paying peak premium for a bounce. If you think $3,400 holds, get paid to wait: write the puts.", "charts": {"count": 1, "hot": true, "desc": "GVZ vs gold price, showing the divergence"}, "link": "https://thedarksideoftheboom.substack.com/p/gold-market-weekly-technicals-dare"}, {"id": 3, "cat": "crypto", "urgency": "act", "source": "Checkonchain / James Check", "title": "Bitcoin undercut the July $58k low, set a new bear low near $55k, and capitulation is bigger than July", "idea": "BTC broke the July cycle low of $58k and set a new bear-market low of about $55k. Check says this capitulation is now larger in magnitude than the July 'time-pain' sell-off. The full on-chain breakdown is paywalled; the team is at the ITC conference in Miami.", "angle": "A failed retest of the July low turns that low into resistance. The useful on-chain question is whether short-term-holder cost basis capitulation has topped out. That is in the paid section.", "tweetA": "BTC undercut $58k, made a new bear low near $55k, and the capitulation is now bigger than July's. Tweet hiding the $58k break as a 'liquidity wick' and you'll be bagholding. Old lows become new ceilings. $BTC", "tweetB": "Same week: Nasdaq -10%, gold -$600, BTC to a new bear low. Three assets that 'don't correlate' all got sold on the same days. That is what a margin call on the whole system looks like.", "charts": {"count": 0, "hot": false, "desc": "Paywalled — on-chain charts inside, worth opening"}, "link": "https://newsletter.checkonchain.com/p/undercut"}, {"id": 4, "cat": "gold", "urgency": "deep", "source": "The Bubble Bubble Report / Jesse Colombo", "title": "Remove five parabolic months and the 2026 metals 'crash' is just a breather", "idea": "Gold peaked at $5,600 and silver at $121 in January 2026. Colombo argues the 10-month correction has only undone five months of parabolic gains, from late 2025 to early 2026. Gold and silver are back to roughly September 2025 levels, about where they were a year ago. His thought experiment cuts out the spike and the crash, and the 2023–25 uptrend is still intact. He compares it to the one big mid-cycle correction in each of the 1970s and 2000s bull markets.", "angle": "This is anchoring psychology. Holders who bought before Q4 2025 are flat to up, and holders who bought in the parabolic window are trapped. That split defines overhead supply.", "tweetA": "Gold at $5,600 in January, back to September 2025 levels now. If you bought before the parabola you're roughly flat over a year. If you bought the parabola, you ARE the overhead supply every rally has to chew through.", "tweetB": "Every secular metals bull has had one gut-check correction: 1974-76, 2008. The question isn't whether the trend survives. It's whether the macro that killed 1980 (real rates rising into a hawkish Fed) is back. With 10Y near 5% and the Fed hiking, that's the real risk.", "charts": {"count": 2, "hot": false, "desc": "Gold and silver charts with the five-month parabolic window highlighted and removed"}, "link": "https://thebubblebubble.substack.com/p/a-better-way-to-view-the-precious-535"}, {"id": 5, "cat": "macro", "urgency": "act", "source": "David Lin Report", "title": "S&P -8.6% on the week, Dow and S&P in correction, Nasdaq negative for 2026", "idea": "The S&P fell 3.7% Friday to 6,910, its 7th straight down day and longest losing streak since Feb 2020. It is now more than 10% below the Oct 6 record. For the week the S&P fell 8.6% (worst since Apr 2025), the Dow 8% and the Nasdaq about 10%, the worst weeks since March 2020. The Nasdaq is now negative YTD. Chips led: NVDA -23%, AMD -20.5%, TSM -20%, MU -23.6%, DELL -19%. Treasuries rallied; the 10Y fell five straight sessions to below 5%.", "angle": "Bonds rallied into the equity crash even with a hawkish Fed. That puts the negative stock-bond correlation back on, which matters for risk-parity re-leveraging.", "tweetA": "S&P -8.6% in a week, NDX negative YTD, 7-day losing streak, longest since Feb 2020. And the 10Y FELL below 5% with the Fed openly hiking. Bonds are calling the Fed's bluff before the Fed has finished bluffing.", "tweetB": "Weekly scorecard: $MU -24%, $NVDA -23%, $DELL -19%. Up: $PANW +6.6%, $CRWD +1%. When the only things green are cyber names during a week of mystery outages, the market is telling you what it's scared of.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://davidlinreport.substack.com/p/markets-spiraling-out-of-control"}, {"id": 6, "cat": "AI/infra", "urgency": "act", "source": "David Lin Report", "title": "Nvidia beat (+103% revenue, $130B guide), then $2.4B of China sales stopped, no 10-Q was filed, and Jensen isn't coming back", "idea": "Under interim CEO Colette Kress, NVDA posted revenue of $115.8B (+103%) and guided Q4 to $130B, above estimates. But it disclosed that $2.4B of China sales had stopped. It did not file its quarterly report with the results. The board chair said Jensen Huang will not return. The stock fell about 23% for the week and about 40% from its peak.", "angle": "A missing 10-Q next to a CEO exit is a governance red flag, not an earnings question. The multiple compresses on the uncertainty no matter what the guide says.", "tweetA": "$NVDA guided $130B and the stock went down. Because the number that mattered wasn't revenue. It was the 10-Q they didn't file. You don't skip a quarterly filing the same week your CEO is confirmed gone unless the lawyers are still reading it.", "tweetB": "A beat-and-raise +103% revenue print with the stock -23% on the week. When a company this big beats and still falls this hard, the market isn't pricing the next quarter. It's pricing the governance discount. Hard to model, slow to unwind.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://davidlinreport.substack.com/p/markets-spiraling-out-of-control"}, {"id": 7, "cat": "venture", "urgency": "act", "source": "David Lin Report", "title": "Anthropic: largest IPO ever ($81.3B), $1.8T at the close, then fell back near its IPO price within 24 hours", "idea": "Anthropic sold shares at $83 (above the $70–78 range) and raised $81.3B, the largest IPO on record. It opened at $111.50 and closed day one at $97.17, about a $1.8T market cap. On Friday it fell about 11% and briefly traded just above $83. Intuit -10.8% on a guide cut. Investors also weighed state-level data-center construction pauses after the midterms.", "angle": "A record IPO that gives back its pop within a day says supply has finally met demand. Watch the IPO price as the line in the sand for the whole AI-listing pipeline (OpenAI next).", "tweetA": "Largest IPO in history, $81.3B raised, priced above range, and 24 hours later it's back near the issue price. When the deal of the decade can't hold its pop, the IPO window isn't closing. It just closed.", "tweetB": "$83 is now the most important number in AI equity. Hold it and the listings pipeline stays open for OpenAI and the neoclouds. Break it and every private-mark AI fund has a valuation problem by Q1.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://davidlinreport.substack.com/p/markets-spiraling-out-of-control"}, {"id": 8, "cat": "macro", "urgency": "act", "source": "David Lin Report", "title": "Fed minutes show near-unanimous support for more tightening; Waller wants 50bp", "idea": "October minutes showed near-unanimous support for further tightening, and a couple of officials were open to more than 25bp in December. Waller said a half-point hike was likely needed. Cook said policy was 'insufficiently restrictive'. Futures price a December 25bp hike as nearly certain. Data softened: jobless claims 203k and Philly Fed 6.3, the lowest since May.", "angle": "A Fed hiking into a 10% equity drawdown with soft data sets up a policy-error trade: bull-steepener risk if they blink, a flattener if they don't.", "tweetA": "Waller wants 50bp. Cook says policy isn't restrictive enough. And the S&P just went into correction. The 'Fed put' isn't gone. It's been moved to a strike nobody wants to find out about.", "tweetB": "Philly Fed collapses to 6.3, claims tick up, Nasdaq down 10% in a week, and the debate at the Fed is 25 vs 50 UP. Not since 2022 has the Fed been this far from the market's pain threshold.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://davidlinreport.substack.com/p/markets-spiraling-out-of-control"}, {"id": 9, "cat": "geopolitics", "urgency": "deep", "source": "David Lin Report", "title": "First-ever Trump-Xi-Putin three-way meeting: a nuclear declaration and nothing on Ukraine or Iran", "idea": "Trump met Xi in Shenzhen on the APEC sidelines, their third one-on-one this year. That was followed by an unprecedented three-way session with Putin. The leaders issued a symbolic peace declaration reaffirming that a nuclear war must never be fought. It announced no arms-control talks and did not mention Ukraine or Iran.", "angle": "Great-power optics with zero substance usually means the hard issues are deadlocked. That keeps the geopolitical risk premium in defense and energy sticky.", "tweetA": "Trump, Xi and Putin in one room for the first time, and the deliverable is 'nuclear war is bad.' No arms control. No Ukraine. No Iran. When the summit communiqué is a press release, the actual negotiations aren't happening.", "tweetB": "The three-way photo-op is the signal, not the text. Shenzhen as venue, Xi as host, Putin at the table. Beijing just showed it can convene Washington and Moscow. That's a status shift the dollar-system bulls should register.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://davidlinreport.substack.com/p/markets-spiraling-out-of-control"}, {"id": 10, "cat": "energy", "urgency": "deep", "source": "David Lin Report", "title": "Oil down a third week as Hormuz flows return to prewar levels; Houthi strikes on Riyadh barely register", "idea": "Crude fell for a third straight week as shipments through the Strait of Hormuz returned to roughly prewar levels. Houthi attacks on Riyadh and reports of a tanker hitting a mine did little to lift prices. Brent ended near $92.50 (-3.4% on the week), WTI fell more than 5%.", "angle": "The market now looks through attacks on Saudi soil. That is risk-premium exhaustion, and it leaves crude exposed to an asymmetric spike if a real disruption hits a complacent tape.", "tweetA": "Houthis hit Riyadh. A tanker hits a mine. Brent goes DOWN 3.4%. Once the market stops reacting to headlines like that, it either knows something or it is about to get caught leaning the wrong way.", "tweetB": "Hormuz flows back to prewar, Brent still $92. Pre-war Brent was nowhere near that. The 'normalisation' is happening at a structurally higher floor. That's the number to remember when people call oil 'cheap'.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://davidlinreport.substack.com/p/markets-spiraling-out-of-control"}, {"id": 11, "cat": "macro", "urgency": "deep", "source": "David Lin Report / Chris Vermeulen (Technical Traders)", "title": "Vermeulen: 10Y bull flag targets 6.5%, the monthly chart points to 8.16%, and DXY could reach 121", "idea": "Vermeulen sees the 10Y in a rising trend forming a bull flag. He expects 5–6% and maybe 6.5%; his monthly chart projects 8.16%, which he says would trigger a financial crisis. He expects DXY to go from 103 to maybe 121, which would mean equities are breaking down. He exited silver at $111 and sees it unwinding to $36–39. Housing -15–25% over 1–2 years. Gold target about 15% lower (~$3,300). Oil $86–108 if it holds, $68 quickly if it breaks.", "angle": "Compare Zulauf in the same newsletter, who says the 10Y peak (5.25–5.5%) is IN. Two veteran technicians on opposite sides of the most important chart in the world.", "tweetA": "One newsletter, two technicians, opposite calls on the 10Y. Vermeulen: bull flag to 6.5%, monthly target 8.16%. Zulauf: the high is already in at 5.25-5.5%, buy duration. One of them is very wrong, and the cost of being wrong is huge either way.", "tweetB": "DXY from 103 to 121 would be a 17% dollar move. The last time the dollar went parabolic like that (2022), EM, gold and long-duration tech all got hit at once. Sound familiar this week?", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://davidlinreport.substack.com/p/markets-spiraling-out-of-control"}, {"id": 12, "cat": "macro", "urgency": "deep", "source": "David Lin Report / Steve Hanke", "title": "Hanke: AI investment was 96% of Q3 GDP growth and 5.2% of GDP, vs 2.2% for railroads at their peak", "idea": "Q3 GDP grew 3.4% annualized and AI investment accounted for 96% of it. The rest of the economy was roughly flat and housing is in recession. AI capex is 5.2% of GDP vs 2.2% for railroads in 1870–1890. A 2022 study of 42 countries puts crisis odds after a boom like this at about 40%. Hanke sees no V-shaped recovery: deficits leave no fiscal room, and easing would reignite inflation. Credit default swap (CDS) spreads on AI-related debt have risen considerably.", "angle": "If AI capex is the entire marginal GDP, any capex cut by a hyperscaler is a macro event, not a sector event. Track AI-debt CDS as the leading indicator.", "tweetA": "Q3 GDP: +3.4%. AI investment's share of that: 96%. Strip it out and the US economy grew 0.1%. We don't have an AI sector inside an economy. We have an economy inside an AI capex budget.", "tweetB": "Railroads peaked at 2.2% of GDP and still produced the Panic of 1873 and 1893. AI capex is at 5.2%. The tech is real, and so was the railroad. The bust came anyway, from the financing.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://davidlinreport.substack.com/p/markets-spiraling-out-of-control"}, {"id": 13, "cat": "macro", "urgency": "deep", "source": "David Lin Report / Steve Hanke", "title": "Hanke: Divisia M4 at 7.4% is too hot for 2%, and Aramco says refilling war-depleted inventories takes two years", "idea": "Divisia M4 money growth is 7.4% vs the 5–6% consistent with the Fed's target. Nominal final sales to domestic purchasers are growing about 7.5%. Hanke expects the 10Y (5.15% at recording) to keep rising because a divided government won't contain deficits. Aramco says refilling inventories drawn down in the war will take two years, so oil stays elevated. He thinks Iran 'basically won' the war, with the US effectively out of the Gulf except for its blockade.", "angle": "Hot money supply and a two-year inventory rebuild together mean structural inflation that rate hikes can't touch quickly. That is a case for real-asset exposure even in a risk-off tape.", "tweetA": "Divisia M4 +7.4%. Nominal final sales +7.5%. The money says inflation; the stock market says recession. And Aramco says inventory rebuild takes TWO years. The Fed is fighting a supply problem with a demand tool.", "tweetB": "Aramco: two years to refill inventories. That's a 24-month bid under crude no matter what Hormuz does. The 'oil goes to $60 on peace' crowd is ignoring the restock math. $XLE", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://davidlinreport.substack.com/p/markets-spiraling-out-of-control"}, {"id": 14, "cat": "credit", "urgency": "deep", "source": "David Lin Report / Jay Singh (Special Situations Report)", "title": "'The Bank of Nvidia': $62B of equity stakes, $118B of guarantees, $28B to neoclouds", "idea": "Singh calls NVDA the bank of AI. It holds about $62B of equity investments and about $118B of guarantees, including about $28B to neoclouds. The buyback was raised about $150B to $377B total. His math: about $700B of obligations (net debt after the full buyback plus an assumed $400B of guarantees) is an 18% loan-to-value (LTV) against a $3.8T market cap. The interim CEO's pledge to be 'disciplined and selective' could leave some neocloud guarantees at risk.", "angle": "If NVDA stops underwriting neocloud credit, the weakest GPU lessors lose their backstop. This is where the AI credit event shows up first: $CRWV and the GPU-ABS market.", "tweetA": "Nvidia has $118B in guarantees outstanding, $28B to neoclouds, and a new interim CEO promising to be 'selective.' Translation for every neocloud CFO: your credit line just got a credit committee. $CRWV", "tweetB": "18% LTV on Nvidia's balance sheet sounds safe until you notice the collateral is Nvidia's own market cap, which fell 40%. Circular collateral is the oldest trap in finance.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://davidlinreport.substack.com/p/markets-spiraling-out-of-control"}, {"id": 15, "cat": "regulation", "urgency": "act", "source": "David Lin Report / Jay Singh (Special Situations Report)", "title": "New export rule: China, Malaysia, Thailand, Singapore, Indonesia and Brazil need US permission to buy advanced Nvidia chips", "idea": "Singh says the new export rule requires companies in China, Malaysia, Thailand, Singapore, Indonesia and Brazil to get US government permission to buy NVDA's advanced AI chips. He ties it to the Jensen Huang scandal. Nvidia raised next year's revenue growth outlook from 70% to 75%. Gross margin is guided to fall from 74.9% to about 71.5% in Q4.", "angle": "Southeast Asia was the transshipment channel and the sovereign-AI growth market. Licensing it adds friction to the fastest-growing non-US demand pool. Watch the Malaysian data-center REITs and the Johor buildout.", "tweetA": "Malaysia, Thailand, Singapore, Indonesia, Brazil now need a US permission slip to buy Nvidia. Those weren't 'China risk.' They were the sovereign-AI growth story. The TAM just got a licensing desk.", "tweetB": "Margins guided from 74.9% to 71.5% the same quarter export licensing expands to SE Asia and Brazil. Lower margin plus a smaller addressable market is not what a 75% growth guide is supposed to look like. $NVDA", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://davidlinreport.substack.com/p/markets-spiraling-out-of-control"}, {"id": 16, "cat": "venture", "urgency": "deep", "source": "David Lin Report / Jay Singh (Special Situations Report)", "title": "Anthropic: $94B of its $104B nine-month loss was non-cash", "idea": "Singh notes that $94B of Anthropic's $104B nine-month loss was non-cash, so the cash burn is about $10B. He names open-source models as the biggest risk to the valuation. The pre-IPO target was about a $1.4T fully diluted valuation with about $90B of proceeds at $70–78.", "angle": "Non-cash losses like these are mostly stock comp and compute-commitment accounting. The real question is gross-margin trajectory as open-weight models compress pricing.", "tweetA": "$104B nine-month loss sounds apocalyptic. $94B of it is non-cash. The actual burn is ~$10B, against a raise of $81B. Read the cash flow statement before you tweet the income statement.", "tweetB": "The bear case on a $1.8T model company isn't the losses. It's that open-weight models make the product a commodity. GPT-6.2 Sol shipped this same week at $2/M tokens. Price compression is happening in real time.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://davidlinreport.substack.com/p/markets-spiraling-out-of-control"}, {"id": 17, "cat": "positioning", "urgency": "deep", "source": "David Lin Report / Jay Singh (Special Situations Report)", "title": "Since October: staples, healthcare and utilities +13% while the Nasdaq 100 fell 13%", "idea": "Singh cites Morgan Stanley data: consumer staples, healthcare and utilities are up an average of 13% since the start of October, while the NDX is down 13%. That is a 26-point rotation. The market priced 3.5 Fed hikes. If that drops to two, a December relief rally is possible if inflation data cools and the war resolves. Vermeulen also says money stayed in equities but moved to dividend payers and staples.", "angle": "A 26-point defensive-vs-growth spread in seven weeks is a crowded rotation. If the relief rally comes, defensives are the funding leg.", "tweetA": "Since Oct 1: staples/healthcare/utes +13%, NDX -13%. A 26-point spread in seven weeks. Money didn't leave stocks. It hid in them. That's why the index looks worse than breadth would say. $XLP $XLU $QQQ", "tweetB": "Market prices 3.5 hikes. Get two and the defensive trade becomes the funding short for the relief rally. The crowded trade right now isn't long tech. It's long utilities.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://davidlinreport.substack.com/p/markets-spiraling-out-of-control"}, {"id": 18, "cat": "cyber", "urgency": "watch", "source": "David Lin Report / Jay Singh (Special Situations Report)", "title": "Unexplained outages at Microsoft, United, Schwab, a major bank, plus an FAA ground stop, and cyber names went green", "idea": "Singh flagged recent outages at Microsoft, United Airlines, a major bank, Schwab, and an FAA ground stop. He has 'no crystal ball' about the cause but finds cybersecurity names interesting in the sell-off. PANW +6.6% and CRWD +1.1% were among the few winners of the week.", "angle": "A cluster of critical-infrastructure outages in the same week as the Optimizely supply-chain hijack (178 sites) supports cyber as a defensive tech allocation.", "tweetA": "Microsoft, United, Schwab, a major bank, an FAA ground stop, all in one week, no official explanation. Meanwhile $PANW was +6.6% while $NVDA fell 23%. The market already decided what it thinks happened.", "tweetB": "Same week: Optimizely's scripts hijacked across 178 sites incl. HSBC, Zoom, BBC. Plus a string of unexplained outages. Cyber isn't a growth trade anymore. It's the defensive sleeve of tech. $CRWD $PANW", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://davidlinreport.substack.com/p/markets-spiraling-out-of-control"}, {"id": 19, "cat": "positioning", "urgency": "watch", "source": "David Lin Report / Will Rhind (GraniteShares)", "title": "2x long and 2x short Anthropic ETFs (AIL/ANS) launch next week, days after the IPO", "idea": "GraniteShares launches 2x long and 2x short Anthropic ETFs, tickers AIL and ANS, at the start of next week. They use swaps with major banks. Rhind calls the drop from the $111.50 open natural price discovery and expects insider overhang at lockups. He puts OpenAI's commitments at about $250B, which forces it toward public markets.", "angle": "Leveraged single-stock ETFs on a week-old IPO add gamma that amplifies moves both ways. Expect the stock's realized vol to rise once AIL/ANS start trading.", "tweetA": "A 2x leveraged Anthropic ETF launches before the stock has a single earnings report as a public company. Herb Greenberg wants levered ETFs banned. This one launches Monday. Both things are true at once.", "tweetB": "AIL and ANS hedge with swaps from the same banks that underwrote the IPO. Daily rebalancing on a stock with 30%+ intraday range means the ETF flows become the price. Watch the last 15 minutes of trading.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://davidlinreport.substack.com/p/markets-spiraling-out-of-control"}, {"id": 20, "cat": "energy", "urgency": "deep", "source": "David Lin Report / Doomberg", "title": "Doomberg: WTI fair value $80–90 in a 'frozen conflict'; diesel cracks still above $100 vs $20–30 a year ago", "idea": "Doomberg's base case is a frozen conflict with Iran: blockade plus occasional strikes, not a third air campaign. That puts WTI fair value at $80–90, with the impeded strait and shipping workarounds adding $10–20. Peace = $60. A catastrophic escalation = $125, then $60 after global demand collapse. Diesel is the real inflation pulse: cracks peaked at $115–116/bbl and are still above $100, vs about $20–30 a year ago.", "angle": "Diesel cracks are the cleanest read on whether the Fed's inflation problem is easing. Refiners with distillate leverage are the trade if cracks stay elevated.", "tweetA": "Everyone watches WTI. The inflation number is diesel. Cracks still above $100/bbl vs $20-30 a year ago. Every truck, train and tractor runs on it. Until that spread breaks, the Fed has no reason to stop hiking. $VLO $MPC", "tweetB": "Doomberg's scenario tree: frozen conflict $80-90, peace $60, escalation $125. WTI at $89 is pricing the base case perfectly. When the price sits right on the base case, the tails are mispriced, and the upside tail is the one that hurts.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://davidlinreport.substack.com/p/markets-spiraling-out-of-control"}, {"id": 21, "cat": "geopolitics", "urgency": "deep", "source": "David Lin Report / Doomberg", "title": "The Russian diesel deal fell apart as Ukraine resumed refinery strikes, and Russia is 11% of seaborne diesel", "idea": "A deal for Russian diesel to reach US and global markets has largely fallen apart since Ukraine resumed attacks on Russian refineries. Russia supplies 800k of the 7M b/d seaborne diesel export market (11%). Doomberg also says the Iran war 'crushed Ukraine': the US is out of Patriot missiles and low on long-range munitions, so limited stocks have to cover two fronts.", "angle": "Ukraine striking refineries is the only lever it has left now that US munitions are diverted. Expect more strikes and tighter distillate markets into winter.", "tweetA": "Ukraine is out of US Patriots because they went to the Gulf, so it hits the one target that works: Russian refineries. 11% of seaborne diesel at risk, heading into winter. The Iran war and the Ukraine war are now one energy trade.", "tweetB": "The US ran out of Patriot interceptors fighting Iran. Defense primes have been talking about munitions backlogs for two years. This is the proof: the stockpile is a binding constraint on foreign policy. $LMT $RTX", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://davidlinreport.substack.com/p/markets-spiraling-out-of-control"}, {"id": 22, "cat": "regulation", "urgency": "watch", "source": "David Lin Report / Doomberg", "title": "Voters rejected data centers in 40 of 41 ballot initiatives; lame-duck permitting reform could override that", "idea": "Doomberg says the lame-duck session could pass permitting reform within six weeks and calls it potentially the most important law of the Trump presidency. Voters sided against data centers in 40 of 41 ballot initiatives. Faster federal permits could still bring more data centers and more drilling. Separately, markets are weighing state-level pauses on data-center construction after the midterms.", "angle": "A federal-vs-local fight over data-center siting is coming. Power-gen and grid names benefit from federal permitting; the risk is state moratoria in the highest-demand regions.", "tweetA": "Data centers lost 40 of 41 ballot initiatives. The local electorate has voted. Now the lame-duck Congress may pass permitting reform that routes around them. AI's biggest bottleneck isn't chips. It's consent.", "tweetB": "If permitting reform passes in the next six weeks, it's the most bullish thing for power infrastructure all year and nobody's pricing it in a week like this. $VST $CEG $GEV", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://davidlinreport.substack.com/p/markets-spiraling-out-of-control"}, {"id": 23, "cat": "AI/infra", "urgency": "watch", "source": "David Lin Report / Ethan Mollick (Wharton)", "title": "Mollick: AI task horizon went from 4 minutes (GPT-4, 2024) to 17 hours to about 17 weeks", "idea": "Mollick says GPT-4 could do about 4 minutes of human-equivalent work at a 50% success rate when his book came out in 2024. That later reached 17 hours and is now about 17 weeks. He puts Fable 5.2 slightly above the trend line. Superforecasters gave 1.7% odds and experts 4.5% odds that AI would solve a Millennium Prize problem within a year, and it did. AI is probably a better analyst than most first-year analysts.", "angle": "A 17-week task horizon means AI can run whole projects, not just tasks. Labor-market implications for junior white-collar roles are now first-order, and they connect to Gerli's housing-demand point.", "tweetA": "Task horizon at 50% success: 4 minutes (2024) → 17 hours → ~17 weeks. That's from 'answers a question' to 'runs a quarter-long project' in about two years. Nobody's comp model for junior analysts survives that curve.", "tweetB": "Superforecasters gave it 1.7%. Domain experts 4.5%. AI solving a Millennium Prize problem within a year. It happened. The people best at predicting the future were off by 60x on the thing that matters most.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://davidlinreport.substack.com/p/markets-spiraling-out-of-control"}, {"id": 24, "cat": "venture", "urgency": "deep", "source": "David Lin Report / Ethan Mollick (Wharton)", "title": "Billion-dollar one-person companies are close, but a fully AI-run business loses its moat", "idea": "Mollick says we're very close to a billion-dollar one-person company, but aiming for one person is probably a bad idea. AI is jagged, and a fully AI-run business looks and sounds like everyone else's. He tested Fable 5.2 on a business making $20k/yr with 20 min/month of work. The idea: file public-records requests and sell $300 reports on upcoming tenders in niches like water and playgrounds. He expects the data-center backlash to slow development (community deals, union labor) but not stop it.", "angle": "The defensible thing in an AI-native business is the human variance, meaning distribution and taste. Pure-AI businesses converge on the same output and compete on price to zero.", "tweetA": "Mollick asked a frontier model for a business that makes $20k/yr with 20 min/month of work. Answer: FOIA public tenders and sell $300 reports. Boring, niche, data-moat. The AI's best business idea was one an AI can't easily copy.", "tweetB": "The billion-dollar one-person company is close, and it's a trap. If AI writes your code, ads and outreach, so does every competitor's AI. The only moat left is the part that isn't AI.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://davidlinreport.substack.com/p/markets-spiraling-out-of-control"}, {"id": 25, "cat": "macro", "urgency": "deep", "source": "David Lin Report / Nick Gerli (Reventure)", "title": "Housing: pending sales at a record low below 2008, closed sales at a 16-year low, buying costs 40% more than renting", "idea": "Pending existing-home sales hit a record low in September, below 2008–09. October closed sales were a 3.75M annualized pace, the lowest in 16 years. Supply is fine: active listings near 1.2M, only 2% below pre-pandemic, with the most supply in the South and West in 10+ years. Buying costs about 40% more per month than renting. Mortgage purchase applications are the lowest since 1994–95. Median prices are held up by mix: $1M+ sales fell 6% while other price points fell 11–12%.", "angle": "The reported median price overstates housing health because of luxury mix. Once mix normalizes, the median drops. That hits HELOC-funded consumption and homebuilder margins.", "tweetA": "Pending home sales: below 2008. Purchase applications: lowest since 1994. Listings: back to pre-pandemic. And the median price is UP, only because the luxury buyer kept buying. Mix shift is hiding a housing recession in plain sight. $XHB", "tweetB": "Buying costs 40% more per month than renting the same house. That isn't a housing market. It's a rental market with some very expensive call options attached.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://davidlinreport.substack.com/p/markets-spiraling-out-of-control"}, {"id": 26, "cat": "macro", "urgency": "deep", "source": "David Lin Report / Nick Gerli (Reventure)", "title": "SF County +15% on AI headquarters while Austin is ~30% off its peak; 33 states face declines", "idea": "Reventure forecasts price declines in about 33 states over the next year. Washington is worst at -6.7% (29k listings vs a normal 18k); Utah, Arizona and Colorado are -5–6%. Almost every tech-driven metro is falling except San Francisco County, up 15% in a year on AI-company headquarters. Austin is Gerli's favourite buy market: down nearly 30% from peak with another 6% drop forecast.", "angle": "SF housing is now a leveraged bet on AI-company equity. With Anthropic near its IPO price and NVDA -40%, the SF premium is the most exposed housing market in the country.", "tweetA": "San Francisco home values +15% in a year on AI HQs. Austin -30% from peak. SF housing is now a derivative on AI equity, and the underlying just had its worst week since 2020. Lockups and RSU vesting are the next chart to watch.", "tweetB": "Washington state: 29,000 homes for sale vs 18,000 normal. Seattle is Microsoft and Amazon. Microsoft is buying out 27% of its workforce. That inventory number isn't a coincidence.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://davidlinreport.substack.com/p/markets-spiraling-out-of-control"}, {"id": 27, "cat": "labor", "urgency": "watch", "source": "David Lin Report / Nick Gerli (Reventure)", "title": "Microsoft plans to buy out 27% of its workforce, and white-collar insecurity is now visible in mortgage data", "idea": "Gerli ties the 1994-low mortgage purchase applications partly to white-collar job insecurity. He cites a Microsoft plan to buy out 27% of its workforce. Mollick, in the same issue, says AI already beats junior employees at many tasks and is probably a better analyst than most first-year analysts.", "angle": "This is the transmission channel from AI capability to macro: white-collar insecurity delays household formation and big-ticket purchases even before layoffs show up in claims.", "tweetA": "Microsoft buying out 27% of its workforce. Mortgage applications at a 1994 low. AI task horizon at ~17 weeks. Jobless claims won't show it yet, because buyouts aren't firings. The housing data shows it first.", "tweetB": "The AI labor shock isn't showing up as unemployment. It's showing up as people who still have jobs not buying houses. Consumer confidence is the lagging indicator here, not the leading one.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://davidlinreport.substack.com/p/markets-spiraling-out-of-control"}, {"id": 28, "cat": "positioning", "urgency": "deep", "source": "David Lin Report / Felix Zulauf", "title": "Zulauf: rally into early 2027, then a panic in which the Nasdaq could fall 50%; the 10Y top is in, buy Treasuries, Bunds and JGBs", "idea": "Zulauf sees this as a shakeout with a medium-term bottom within weeks: S&P 6,900–7,200, Nasdaq below 26,000, NVDA near his 150 target. He expects a rally to new highs that indicators won't confirm, then a panic later in 2027. The trigger could be an AI accident, military action or a big company in trouble. With 10 stocks at 40% of market cap, a 20% S&P drop becomes 30% and the Nasdaq could fall 50%. He thinks the 10Y high (5.25–5.5%) is in and that central-bank buying could cut it 150–200bp. Hyperscalers are running out of free cash flow and are turning to debt and equity issuance.", "angle": "This is a two-phase trade: buy the shakeout, then short the non-confirmed new high. The duration call (long USTs/Bunds/JGBs) is the higher-conviction piece.", "tweetA": "Zulauf's map: bottom in weeks (S&P 6,900-7,200), rally to unconfirmed new highs, then a panic where NDX can fall 50%. S&P closed Friday at 6,910. We're already inside his buy zone. The question is whether you trust the second half of the forecast.", "tweetB": "Hyperscalers 'running out of free cash flow' and funding capex with debt and equity. That's the line that matters. Once the AI build is financed rather than self-funded, it's a credit cycle, and credit cycles end on a schedule.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://davidlinreport.substack.com/p/markets-spiraling-out-of-control"}, {"id": 29, "cat": "macro", "urgency": "deep", "source": "David Lin Report / Frank Giustra", "title": "Giustra: market cap to GDP at 240% vs 150% at the dot-com peak; expects QE3, a dollar crisis and financial repression", "idea": "Market cap/GDP was 240% before the drop, vs 150% at the dot-com peak. Federal debt is above $40T with interest at $1.2–1.3T/yr at an average rate of 3.5%; at 5%, deficits reach $3T. Household debt is a record $19T ($13.5T mortgages). He thinks Warsh can't go full Volcker without the global economy imploding. He expects a third major QE, then a dollar crisis with financial repression: savings-rate caps, capital controls and possible withdrawal limits.", "angle": "The debt-service math (3.5% average cost rolling toward 5%) is the strongest argument that the Fed's hiking cycle is self-limiting. That's long-dated gold and real-asset optionality.", "tweetA": "Average rate on US federal debt: 3.5%. Interest bill: $1.2-1.3T. Every bill rolling at 5% pushes that toward $3T deficits. The Fed isn't choosing between inflation and recession. It's choosing which one the Treasury can afford.", "tweetB": "Buffett indicator at 240% before the selloff. The dot-com peak was 150%. Even after a 10% drop we're 50%+ above the most famous bubble in market history, with ten companies at 40% of the index.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://davidlinreport.substack.com/p/markets-spiraling-out-of-control"}, {"id": 30, "cat": "gold", "urgency": "deep", "source": "David Lin Report / Frank Giustra", "title": "China had a record Q3 for gold buying while its Treasury holdings have halved to about $620B", "idea": "Giustra says central-bank gold buying is long-term and strategic. China had a record Q3 for gold purchases and still holds about $620B of US Treasuries, down by about half. He sees a stronger dollar from higher 10Y yields as only short-term pressure on gold. He expects copper supply deficits within 4–5 years and elevated commodity prices for a long time. He disclosed that he is long oil stocks (bought pre-war) and has mining interests in Colombia.", "angle": "Sovereign buyers are price-insensitive and buy dips. If China is accumulating while hot money liquidates, the $3,400 area could see official-sector support.", "tweetA": "Hot money dumped gold $600 in nine days. China just had its record quarter of gold buying while halving its Treasuries to ~$620B. Two very different time horizons on opposite sides of the same trade.", "tweetB": "Every selloff in gold this cycle has been a transfer from leveraged Western holders to Asian central banks. The People's Bank of China doesn't use stop-losses.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://davidlinreport.substack.com/p/markets-spiraling-out-of-control"}, {"id": 31, "cat": "macro", "urgency": "deep", "source": "Macro Mornings", "title": "NDX -10.43%: a -3.27σ week. Normal math says 1 in 40 years; there have been 11", "idea": "The Nasdaq 100 fell 10.43% in the week to Nov 20. Over 2,133 weeks (about 40 years) the mean is +0.30% and the SD is 3.28%. That makes this week -3.27σ, the 0.5th percentile. A normal distribution gives about 0.054% odds, so one such week in 40 years; there have been 11, roughly one every 8 years. The left tail is about 10x fatter than the models assume. The past episodes (1987, 2000, 2008, 2020, 2022) ended very differently. What decided each ending: valuation, Fed response, and whether bonds moved with or against stocks.", "angle": "The 2022 analog (yields UP during the crash) is the dangerous one. This week the 10Y fell below 5%, which is closer to the 1987, 2008 and 2020 pattern. That is mildly reassuring.", "tweetA": "NDX -10.43% this week. That's a -3.27 sigma event. Under a normal distribution you'd expect ONE in 40 years. There have been ELEVEN. If your risk model says 'once a generation,' it's wrong by 10x. Size accordingly.", "tweetB": "Past -10% NDX weeks: 1987, 2000, 2008, 2020, 2022. Recovery times ranged from 5 months to 7 years. The size of the fall told you nothing. What told you everything: did bonds rally with you or against you? This week they rallied. That's the tell.", "charts": {"count": 3, "hot": true, "desc": "Free section: 40-year NDX weekly return distribution (fat-tail chart), Shiller CAPE history, VIX top-decile forward returns; 5 more charts in PRO"}, "link": "https://macromornings.substack.com/p/fed-the-sentence-no-fed-chair-should"}, {"id": 32, "cat": "macro", "urgency": "deep", "source": "Macro Mornings", "title": "Warsh said the Fed is preparing for an AI-bust scenario. Every Fed put has a strike, and this one is written in inflation", "idea": "Fed Chair Warsh said the Fed is preparing for a scenario in which the AI boom fails, stocks fall and the economy slows. Yet fed funds futures (12th minus 1st contract) price about +90bp of tightening over 12 months, the first real hiking bias since 2022. History of the Fed put: it worked in 1987 (50bp), 1998 (75bp → +35%) and 2020. It failed in 2001 (475bp of cuts, S&P still -40% by Oct 2002) and 2007 (500bp, -21%). The difference was the starting point: low inflation and sane valuations vs cutting into a deflating bubble.", "angle": "Today combines 2000/2007-style valuations with 2022-style inflation. The Fed put is both further away and less effective, so cheap downside protection is better than buying the dip on Fed hope.", "tweetA": "Fed Chair publicly says they're planning for the AI boom failing. A central bank only says that out loud when the internal scenario has moved from 'tail' to 'plausible.' Meanwhile futures still price +90bp of hikes. Both can't be right for long.", "tweetB": "The Fed put worked in 1987, 1998, 2020: low inflation, sane valuations. It failed in 2001 and 2007, when it was cutting into a bubble. Today: 2000-style valuation AND 2022-style inflation. That's the worst possible starting point for a rescue.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://macromornings.substack.com/p/fed-the-sentence-no-fed-chair-should"}, {"id": 33, "cat": "macro", "urgency": "deep", "source": "Macro Mornings", "title": "CAPE fell from 41.0x to 37.9x after the crash and is still the third-highest since the 2000 bubble", "idea": "The Shiller P/E de-rated 7.6%, from 41.0x to 37.9x, which barely registers on the chart. The long-run average is about 17x, the 1929 peak about 32x and the Dec 1999 record 44.2x; the 2020 and 2022 lows were below 30x. Starting points: 1982 (about 7x) → +13%/yr real over the next decade; 2009 (13x) → +14%; 1929 (32x) → about 0; 1999 (44.2x) → -3%/yr. With earnings flat, a return to 30x = -21% and 25x = -34%.", "angle": "The CAPE is a compass, not a clock. At 37.9x the 10-year expected real return is near zero, so the opportunity cost of T-bills at 5% looks very high.", "tweetA": "After the worst NDX week since 2020, CAPE is... 37.9x. Down from 41. Still higher than 1929. A trip back to 2022's 30x is another -21% with earnings flat. One bad week didn't make stocks cheap.", "tweetB": "CAPE 37.9x vs 10Y at ~5%. Bought at 44x in 1999, you lost 3%/yr real for a decade. Today you can lock 5% nominal risk-free. The equity risk premium isn't thin. It's negative.", "charts": {"count": 1, "hot": false, "desc": "Shiller CAPE since 1871 with 1929, 1999, 2022 markers"}, "link": "https://macromornings.substack.com/p/fed-the-sentence-no-fed-chair-should"}, {"id": 34, "cat": "positioning", "urgency": "deep", "source": "Macro Mornings", "title": "VIX above 31 (top decile): buy-the-fear works on average (+22% vs +11% at 1yr), but September 2008 shows it can be early", "idea": "The VIX crossed 31, its highest since March; above 28.5 is the top decile since 1990. Bilello's data (Jan 1990–Nov 2026): buying the S&P in a top-decile VIX gave +22% at 1 year vs +11% at all other times, and 86% vs 74% at 5 years. But on Sept 29, 2008 the VIX closed at 46 and the S&P fell another 39% into March 2009. The author watches the yen: USD/JPY fell 110→87 in late 2008 and 161.9→141.7 in the summer of 2024 as carry unwound.", "angle": "The VIX tells you when; USD/JPY tells you whether it's real. If the yen isn't squeezing, this is still an equity-specific de-rating, not a systemic deleveraging.", "tweetA": "VIX top-decile entries: +22% one year later vs +11% at other times. Great stat. Except September 29, 2008: VIX 46, then another -39%. Fear is a good signal and a terrible timer. Watch the yen, not the VIX.", "tweetB": "If this were a real deleveraging, USD/JPY would be collapsing like 2008 (110→87) or Aug 2024 (162→142). Instead the dollar is breaking OUT. That says equity de-rating, not carry unwind. Different playbook.", "charts": {"count": 1, "hot": false, "desc": "VIX top-decile vs forward S&P returns (Bilello / Creative Planning)"}, "link": "https://macromornings.substack.com/p/fed-the-sentence-no-fed-chair-should"}, {"id": 35, "cat": "gold", "urgency": "watch", "source": "Macro Mornings", "title": "PRO teaser: S&P dispersion seen only twice in 40 years, a dollar breaking out of a 2-year base, and gold 29% undervalued on a liquidity model", "idea": "The paywalled section previews four signals. Bonds 'quietly stopped doing their job' this week. Dispersion inside the S&P 500 is at a level seen only twice in 40 years, and both times it marked the end of one market and the birth of another. The dollar has broken out of a 2-year base. Goldman downgraded gold again while a liquidity model says gold is 29% undervalued.", "angle": "A dollar breakout plus record dispersion is a regime-change signal, consistent with the 26-point defensive-vs-NDX spread Singh cites. Worth opening the PRO charts if you have access.", "tweetA": "Record S&P dispersion. Seen twice in 40 years, both times at a regime change. Combine it with a staples-vs-NDX spread of 26 points since October and the index average is hiding two completely different markets.", "tweetB": "Goldman downgrades gold again. A liquidity model says it's 29% undervalued. When the sell-side and the flow models disagree this much after a $600 drop, one of them is about to be very wrong. My money's on the analyst chasing price.", "charts": {"count": 5, "hot": false, "desc": "PRO section: bond-equity correlation, S&P dispersion (twice in 40 years), DXY 2-year base breakout, gold liquidity-model valuation — paywalled"}, "link": "https://macromornings.substack.com/p/fed-the-sentence-no-fed-chair-should"}, {"id": 36, "cat": "crypto", "urgency": "deep", "source": "Unchained / Laura Shin (Jesse Pollak / Base)", "title": "Base took tokenized stocks from zero to $1B a week in four months and says it has passed Solana in onchain finance", "idea": "Tokenized stocks didn't exist on Base four months ago; they now do more than $1B in weekly volume. Base wants to offer them to US users under the SEC innovation exemption. Pollak says Base has passed Solana to become the second-biggest onchain finance market after Ethereum. Base now has 200ms blocks and a new B20 token standard. A Base token is being explored 'but won't be rushed.' His biggest bet: teams of agents on open models will outpace frontier models, and that market will form onchain.", "angle": "Tokenized equities on an L2 owned by $COIN are a direct bridge from crypto rails to TradFi assets. Watch whether the SEC exemption arrives and whether a Base token becomes a COIN catalyst.", "tweetA": "Tokenized stocks on Base: $0 four months ago, $1B/week now. During a week where crypto is getting crushed. The growth isn't speculation on tokens. It's people wanting 24/7 access to equities. $COIN", "tweetB": "Pollak's bet: swarms of agents on open models beat frontier models, and they'll transact onchain. If AI agents need bank accounts and can't get them, a wallet is the obvious substitute. 'Agent finance' might be crypto's first non-speculative killer app.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://unchainedcrypto.beehiiv.com/p/weekly-recap-ledger-s-implant-problem-spreads-sky-s-stablecoin-shrinks"}, {"id": 37, "cat": "cyber", "urgency": "act", "source": "Unchained / Laura Shin", "title": "Ledger's supply-chain implant spreads to authorized resellers in Berlin and Dubai", "idea": "Ledger confirmed that tampered hardware wallets turned up in Berlin and is investigating two more reports from Dubai. The incident was first tied to one Southeast Asian reseller in October. Every device carries the same physical modification, built to capture the recovery phrase at setup. Losses: about 1,300 SOL from a Ledger Flex bought at a Virgin Megastore in Dubai, 507k USDT from a Stax from the same chain, and over $320k from a Flex bought at MediaMarkt Berlin. Ledger is offering X-ray inspection at its Vierzon factory. CTO Charles Guillemet is leaving at year-end to start a security venture.", "angle": "Authorized big-box retail is the attack surface now. That undermines the whole 'buy from an authorized reseller' advice and favors direct-ship plus anonymous-pickup models.", "tweetA": "Hardware wallets with physical implants found at a Virgin Megastore in Dubai and MediaMarkt in Berlin. Authorized resellers. The advice was always 'only buy from authorized retail.' That advice just broke.", "tweetB": "Ledger's implant problem spreads to two continents, and the CTO announces his exit the same week. His post didn't mention the investigation. Timing is a signal too.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://unchainedcrypto.beehiiv.com/p/weekly-recap-ledger-s-implant-problem-spreads-sky-s-stablecoin-shrinks"}, {"id": 38, "cat": "crypto", "urgency": "act", "source": "Unchained / Laura Shin", "title": "BTC below $59k: IBIT records its biggest-ever daily outflow ($541M), and Strategy buys just 485 BTC while spending $228M on preferred buybacks", "idea": "BTC fell below $59k, its first time under $60k since July, on a sixth straight weekly loss and about -15% on the week. ETH fell about 17% to about $1,600. A weekend flush wiped out about $2B of mostly long leverage. Spot BTC ETFs lost $582.2M Thursday, including a record $541.1M from IBIT; November outflows are about $3.47B. Strategy bought only 485 BTC but spent $228.1M buying back its STRC preferred. Its unrealized loss is $14.3B.", "angle": "Strategy is defending its capital stack instead of adding BTC. When the biggest marginal buyer moves capital into preferred buybacks, it has switched from offense to defense.", "tweetA": "Strategy spent $228M buying back its own preferred stock and $33M buying bitcoin. That ratio is the whole story. The largest corporate bid in crypto just switched from accumulating to defending its balance sheet. $MSTR", "tweetB": "IBIT's biggest outflow ever: $541M in a day. November ETF outflows: $3.47B. The 'ETF holders are sticky long-term money' thesis just got its first real stress test, and it's failing it.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://unchainedcrypto.beehiiv.com/p/weekly-recap-ledger-s-implant-problem-spreads-sky-s-stablecoin-shrinks"}, {"id": 39, "cat": "crypto", "urgency": "act", "source": "Unchained / Laura Shin", "title": "Sky's USDS lost 40% of its supply ($2.07B) in one day after a report traced $518M of illicit swaps", "idea": "USDS supply fell about $2.07B (about 40%) in a single day after a CoinDesk investigation. Inca Digital traced $518M of swaps through Sky's Peg Stability Module (PSM) to illicit actors, about $101.9M of it linked to North Korea. Supply is down about 53% over a month. The PSM's USDC fell from about $2.5B to about $1B. Sky announced a SKY buyback of 750k USDS/day for 7 days. Its risk adviser said two-thirds of the flagged swaps predated mid-2024. PSM USDC is back above $1.1B.", "angle": "This is a freeze-risk run, not a solvency run. Holders fled the risk that USDC in the PSM gets frozen. Decentralized stablecoins backed by centralized collateral carry that collateral's compliance risk.", "tweetA": "USDS lost 40% of its supply in ONE day. Not because it depegged. Because holders feared the USDC backing it could get frozen over North Korea links. Decentralized stablecoin, centralized kill switch.", "tweetB": "A 40% one-day run on a $5B stablecoin, during a week where BTC hit new lows, and it barely made headlines. Stablecoin runs are now routine enough to be a footnote. That should worry regulators more than it does.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://unchainedcrypto.beehiiv.com/p/weekly-recap-ledger-s-implant-problem-spreads-sky-s-stablecoin-shrinks"}, {"id": 40, "cat": "crypto", "urgency": "deep", "source": "Unchained / Laura Shin", "title": "Binance gets an Abu Dhabi court order to claw back $2.85B of frozen hack funds; 18 firms are bound, including Circle and World Liberty", "idea": "Binance won an Abu Dhabi Global Market (ADGM) Courts order to help recover crypto frozen by third parties after the Oct 29 hack of its hot wallets, which it pegged at $6.3B. About $2.85B is frozen or intercepted. 18 companies are bound, including Circle and World Liberty Financial; they can't release, lend, swap or commingle the tokens. Tether, which froze about $1.5B, is not on the list. The court revisits Dec 1. Elliptic found that about 2,310 BTC (about $149M) has gone through mixers, 90% of it since Tuesday.", "angle": "Court-ordered recovery through issuers sets a precedent: stablecoin issuers act as de facto custodians in hacks. That is bullish for the compliance moat of regulated issuers.", "tweetA": "$6.3B Binance hack, $2.85B frozen, and recovery now runs through an Abu Dhabi court binding Circle and World Liberty. Crypto's big hack-recovery mechanism is... centralized issuers plus a judge. Satoshi would like a word.", "tweetB": "Hackers have pushed 2,310 BTC through mixers, 90% of it in the last four days. Laundering speeds up exactly when the court calendar sets a date (Dec 1). The clock is now on-chain and public.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://unchainedcrypto.beehiiv.com/p/weekly-recap-ledger-s-implant-problem-spreads-sky-s-stablecoin-shrinks"}, {"id": 41, "cat": "crypto", "urgency": "deep", "source": "Unchained / Laura Shin", "title": "Crypto pre-IPO markets priced Anthropic's open within 50 cents", "idea": "A minute before Anthropic's first trade, the OKX ANT contract traded at $111.31 and Hyperliquid's trade.xyz market at about $111. The actual open was $111.50. Earlier 2026 listings were missed by crypto markets by 25% on average. Binance Wallet's ANTx subscription hit its 500M USDC cap and Binance admitted the allocation was 'not ideal'. None of these tokens carry shareholder rights. ARK bought about $90M on debut.", "angle": "Onchain pre-IPO perps are becoming real price-discovery venues for private companies. The next step is the SEC asking who is allowed to trade them.", "tweetA": "OKX's pre-IPO contract priced Anthropic at $111.31 one minute before the open. Actual open: $111.50. An offshore perp with no shareholder rights got closer than most sell-side desks. Price discovery for private companies is moving onchain.", "tweetB": "Crypto markets missed earlier 2026 IPOs by 25% on average, then nailed the biggest one to the penny. Either liquidity finally arrived or the insiders did. Possibly both.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://unchainedcrypto.beehiiv.com/p/weekly-recap-ledger-s-implant-problem-spreads-sky-s-stablecoin-shrinks"}, {"id": 42, "cat": "cyber", "urgency": "deep", "source": "Unchained / Laura Shin", "title": "A hijacked Optimizely script hit 178 sites including HSBC, Zoom and the BBC, swapping wallet addresses and then skimming cards", "idea": "Starting late Sunday, an attacker planted a wallet-address swapper in Optimizely's A/B testing scripts, reaching 178 organizations including Ledger, Zoom, HSBC and the BBC. The code replaced crypto addresses on pages and in clipboards. About 9 hours in, it was extended to grab card numbers, expiry dates and CVVs from checkout forms. Entry was a bug in Optimizely's account creation. The haul was about $7,150 in receipts (Galaxy's Thorn estimates about $2,300 from victims). Salesforce switched off Optimizely's scripts.", "angle": "Third-party marketing JavaScript is an unaudited supply chain on every major website. Expect client-side security spending and script-integrity tooling to grow.", "tweetA": "One compromised marketing script. 178 websites. HSBC, Zoom, BBC. A card skimmer live for hours. Haul: $7,150. The attacker was an amateur. The next one won't be. Every A/B testing tag on your site is an unaudited supply chain.", "tweetB": "Ledger got hit by hardware implants AND an Optimizely script hijack in the same news cycle. The weak point in self-custody isn't the cryptography. It's everything around it: retail shelves, marketing tags, shipping partners.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://unchainedcrypto.beehiiv.com/p/weekly-recap-ledger-s-implant-problem-spreads-sky-s-stablecoin-shrinks"}, {"id": 43, "cat": "cyber", "urgency": "deep", "source": "Unchained / Laura Shin", "title": "Trezor's second shipping-partner breach since August exposed 27k orders, and scam calls have started", "idea": "Shipping partner Skladon was breached Nov 7; data on about 27,000 Trezor purchases (Aug 9–Nov 7) was likely exported: names, phones, addresses, emails and order details. It took Skladon eight days to tell Trezor. ShipMonk exposed about 67,000 US customers in August. Trezor's CCO warned that in the worst case 'someone shows up at the door.' Trezor is cutting order-data retention from 90 to 45 days and has launched anonymous pickup in 18 European countries.", "angle": "Physical-security ('wrench attack') risk for crypto holders is now a supply-chain data problem. Anonymous fulfillment is becoming a product feature.", "tweetA": "94,000 Trezor customers have had their home addresses leaked through two shipping partners since August. A hardware wallet protects your keys. It also tells criminals exactly which houses to visit.", "tweetB": "Trezor's fix: delete order data after 45 days and offer anonymous pickup. In 2026, the most important security feature of a hardware wallet company is forgetting who its customers are.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://unchainedcrypto.beehiiv.com/p/weekly-recap-ledger-s-implant-problem-spreads-sky-s-stablecoin-shrinks"}, {"id": 44, "cat": "crypto", "urgency": "watch", "source": "Unchained / Laura Shin", "title": "Lighter: a trader's custom signing code reused nonces, the API key was derived from two public signatures, and about $15.5M was taken", "idea": "Perp DEX Lighter's security council returned about 5M USDC to a drained trader. The trader's custom signing code (outside official tools) reused nonces, which let the attacker derive the API key from two public signatures. Lighter's Guardian froze withdrawals. Researcher 0xTria estimates about $15.5M was taken from two market-maker accounts. Lighter now requires a wallet signature before funds move to public pools and has stopped exposing API-key signatures.", "angle": "Market makers rolling their own crypto on DEXs is a systemic soft spot. A 'security council' that can reverse transfers also shows how centralized these venues really are.", "tweetA": "Nonce reuse: a textbook cryptography mistake from 2010 (see PS3) just cost market makers ~$15.5M on a 2026 perp DEX. The math hasn't changed. The people writing custom signing code still haven't read the textbook.", "tweetB": "Lighter's 'security council' returned $5M to a drained trader. Good outcome. But a DEX that can reverse transfers is just an exchange with extra steps. Every rescue like this is a quiet admission of who's really in control.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://unchainedcrypto.beehiiv.com/p/weekly-recap-ledger-s-implant-problem-spreads-sky-s-stablecoin-shrinks"}, {"id": 45, "cat": "regulation", "urgency": "deep", "source": "Unchained / Laura Shin", "title": "Backpack is the first blockchain-based derivatives exchange with full CFTC/NFA approval, so leveraged perps are coming to the US", "idea": "Backpack says the CFTC approved it to run both an exchange and a clearinghouse, plus NFA approval as a futures commission merchant (FCM). Together that is the full stack to offer US traders 24/7 leveraged perpetual futures in the same order book as its global exchange. No launch date. CFTC Chair Selig wrote that the law sets core principles 'without prescribing a particular technological architecture.'", "angle": "Onchain perps onshoring to the US cuts offshore venues' share and moves competition to $COIN and $HOOD. It also sets a template for vertically integrated onchain clearing.", "tweetA": "First US-licensed onchain exchange + clearinghouse + FCM. US traders get 24/7 leveraged perps in a global order book. The CFTC just said 'technology-neutral' and meant it. Offshore perp venues just lost their main selling point.", "tweetB": "Exchange, clearinghouse and broker, all one entity, on a blockchain. TradFi spent 50 years separating those functions for risk reasons. Onchain finance just reunited them with regulatory blessing. Interesting experiment.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://unchainedcrypto.beehiiv.com/p/weekly-recap-ledger-s-implant-problem-spreads-sky-s-stablecoin-shrinks"}, {"id": 46, "cat": "crypto", "urgency": "watch", "source": "Unchained / Laura Shin", "title": "The World Bank will study USDC development payouts with Citi and Circle", "idea": "The World Bank Group will study whether regulated dollar stablecoins could carry some development project payments, with Citi as banking rail and Circle minting and settling USDC. Nothing is built yet: no timeline, volume or country list. It extends FundsChain, the Bank's ledger already used by 350+ projects in 96 countries; funds currently move through correspondent banks. President Banga framed faster payments as the difference between a clinic built on time or not.", "angle": "A multilateral development bank endorsing a dollar stablecoin as a payment rail extends the dollar's reach in frontier markets. That is a de-dollarization counter-trend.", "tweetA": "The World Bank is studying paying for development projects in USDC. Correspondent banking is getting disintermediated by the institution that props up correspondent banking in 96 countries. $CRCL", "tweetB": "Everyone debates de-dollarization. Meanwhile the World Bank may start distributing dollars as stablecoins straight to frontier economies. Stablecoins aren't a threat to dollar hegemony. They're its next distribution channel.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://unchainedcrypto.beehiiv.com/p/weekly-recap-ledger-s-implant-problem-spreads-sky-s-stablecoin-shrinks"}, {"id": 47, "cat": "regulation", "urgency": "deep", "source": "Unchained / Laura Shin", "title": "The Supreme Court ends Custodia's six-year Fed master-account fight, while Kraken gets a limited-purpose account", "idea": "SCOTUS declined Custodia Bank's case with no dissent, leaving in place the 10th Circuit ruling that the Kansas City Fed could deny the Wyoming crypto bank a master account. Custodia applied in Oct 2020; CEO Caitlin Long argues the rejections were political. Meanwhile Kraken Financial received a limited-purpose Fed account.", "angle": "Master-account access is discretionary and political, not a right. Crypto access to Fed rails will come through negotiated, limited-purpose accounts, which favors large incumbents.", "tweetA": "Custodia waited six years for a Fed master account and lost at the Supreme Court. Kraken got one. The lesson: access to the Fed's payment rails isn't about the law. It's about who you are when you ask.", "tweetB": "Settled now: the Fed has discretion over who touches its payment system. For stablecoin issuers wanting direct reserve access, that's the whole ballgame. The regulatory moat for incumbent banks just got a Supreme Court seal.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://unchainedcrypto.beehiiv.com/p/weekly-recap-ledger-s-implant-problem-spreads-sky-s-stablecoin-shrinks"}, {"id": 48, "cat": "crypto", "urgency": "watch", "source": "Unchained / Laura Shin", "title": "Ethereum devs lean toward shipping Glamsterdam's contested state-creation gas repricing (EIP-8037) as is", "idea": "Core devs leaned toward keeping Glamsterdam's gas repricing unchanged. EIP-8037 raises the cost of creating new state (accounts, storage, contract code). The go/no-go on a mid-December Hoodi testnet fork moves to next week; Dec 16–17 is realistic. Auditors have contacted at least 50 affected companies. The earliest mainnet date is mid-January. The previous Hoodi date (Oct 26) was scrapped after ChainSecurity flagged gas risks.", "angle": "Pricing state growth is Ethereum's answer to the state-bloat problem. It raises costs for apps that create many accounts and pushes activity to L2s.", "tweetA": "Ethereum is about to make it more expensive to create new state: accounts, storage, contracts. 50+ affected companies so far. This is Ethereum charging rent for permanent storage. L2s just got a structural tailwind. $ETH", "tweetB": "ETH at $1,600, down 17% on the week, and core devs are in a heated debate about gas repricing for state creation. Either deeply admirable focus or a perfect picture of why the market has stopped listening.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://unchainedcrypto.beehiiv.com/p/weekly-recap-ledger-s-implant-problem-spreads-sky-s-stablecoin-shrinks"}, {"id": 49, "cat": "venture", "urgency": "deep", "source": "TWiST Newsletter / Jason Calacanis", "title": "Hormozi cut prices 25%, churn didn't move, and it cost about $5M a year in profit", "idea": "Acquisition.com's Alex Hormozi cut prices by 25%, betting that churn would fall enough to make up the difference. Churn didn't budge, and the cut cost about $5M a year in profits. TWiST offers a formula to check the break-even churn reduction before you change price. Separately, Coinbase's Emilie Choi runs complex decisions with the RAPID framework: a defined list of people, a limited scope, and one decider with 48 hours.", "angle": "Churn is usually a product-value problem, not a price problem. The same logic applies to AI-model price wars: cutting price doesn't fix undifferentiated output.", "tweetA": "Hormozi cut prices 25% to stop churn. Churn didn't move. Cost: $5M/yr. Price cuts don't fix churn when the customer leaves because of value, not cost. Every AI lab in a price war should tape this to the wall.", "tweetB": "Coinbase's rule for hard calls: a short list of people, narrow scope, one decider, 48 hours. Most companies fail at the 'one decider' part. Consensus feels safe and produces the worst decisions at the slowest speed.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://twistartups.substack.com/p/saturday-update-stick-to-your-price"}, {"id": 50, "cat": "AI/infra", "urgency": "watch", "source": "TWiST Newsletter / Jason Calacanis", "title": "Ryze AI reached about $10M ARR in about a year, with GEO (generative engine optimization) at the top of its channel mix", "idea": "Ryze AI, an autonomous AI marketing company, reached about $10M ARR in about a year. Its channel mix is led by GEO (generative engine optimization, i.e. getting cited by AI answer engines), then paid ads and partnerships.", "angle": "GEO overtaking SEO as a growth channel reroutes ad budgets from search toward LLM answer surfaces. That is a structural risk to Google's ad funnel.", "tweetA": "A $10M ARR startup says its #1 acquisition channel is getting cited by AI answer engines. Not Google. Not ads. GEO. If that becomes the default playbook, the search-ad funnel is quietly losing its top. $GOOGL", "tweetB": "SEO took a decade to become an industry. GEO went from buzzword to top channel at a $10M ARR company in about a year. Marketing budgets follow attention, and attention is moving into the chatbot.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://twistartups.substack.com/p/saturday-update-stick-to-your-price"}, {"id": 51, "cat": "AI/infra", "urgency": "deep", "source": "TWiST Newsletter / Jason Calacanis", "title": "Parloa prices per minute of conversation, not per token, because customers can't value tokens", "idea": "Parloa co-founder and CEO Malte Kosub explains that the agentic customer-service startup prices per minute of conversation or per chat, not per token. His argument: customers can't understand value in tokens. Separately, Good Culture used only 'true fan' creators, paid in product and VIP kits rather than cash, to win Gen Z on TikTok.", "angle": "Outcome- and time-based pricing lets application-layer AI companies keep margin as token costs collapse. The GPT-6.2 Sol price point this week makes that spread bigger.", "tweetA": "Parloa prices AI agents per minute of conversation, not per token. Brilliant. Token costs fall 50%+ a year. Price per minute doesn't have to. That's where application-layer margin lives.", "tweetB": "Tokens are a cost metric. Minutes are a value metric. The AI companies that win the next three years will be the ones that stop letting customers see the meter.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://twistartups.substack.com/p/saturday-update-stick-to-your-price"}, {"id": 52, "cat": "science", "urgency": "watch", "source": "a16z Frontier", "title": "AI proofs 'presented like severed rhino heads': OpenAI released hundreds of manuscripts, and Alpöge claims a Riemann proof in Lean", "idea": "In October OpenAI released hundreds of mathematical manuscripts. One settled a question Cornell's Justin Moore had worked on for 19 years. He'd bought XO cognac in 2010 to toast the answer, and now expects it to feel 'more like a wake.' Strogatz said the results arrived 'presented like severed rhino heads.' Mathematician Levent Alpöge announced he believes he has proved the Riemann hypothesis with AI help, released in Lean so a machine can check every step. Mathematician Kirwin Hampshire wrote of a 'profound spiritual crisis.'", "angle": "If the Riemann proof holds, it is a Millennium-problem-class proof assisted by AI, and that confirms Mollick's point. Verification and formal-proof tooling (Lean) becomes critical infrastructure.", "tweetA": "A mathematician bought cognac in 2010 to toast the solution to a problem he'd worked on for 19 years. AI solved it in a batch of hundreds. He says the toast will feel 'more like a wake.' The AI disruption story nobody models: meaning.", "tweetB": "Riemann hypothesis, open since 1859, possibly proved with AI help, released in Lean so a machine can check every step. The bottleneck in science just moved from discovery to verification. Whoever owns verification owns the next decade.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://a16zfrontier.substack.com/p/why-do-math-when-ai-can"}, {"id": 53, "cat": "science", "urgency": "deep", "source": "a16z Frontier", "title": "Two frontiers of math: discovery vs human understanding. A billion-page P≠NP proof would need an army to absorb", "idea": "Dan Boneh's thought experiment: a model proves P≠NP, but the proof runs a billion pages. Even if Lean checks every step, making it intelligible would take an 'army of mathematicians and computer scientists' a very long time. Ittai Abraham describes two frontiers, discovery and human understanding, citing Thurston (1994): 'What we are producing is human understanding.' Kim and Lodha posted a simplified version of the AI proof of Moore's problem a week later. Vallentin used an AI argument to settle the complexity of a lattice-covering problem and called himself 'the messenger of the proof.'", "angle": "The scarce resource moves from producing results to understanding them. That has implications for education, research funding and expert labor that parallel the junior-analyst displacement story.", "tweetA": "AI pushes the discovery frontier. Humans own the understanding frontier. The gap between them is the new job market: explaining, verifying, teaching. A billion-page proof nobody understands is worth exactly as much as one nobody's written.", "tweetB": "Thurston, 1994: 'What we are producing is human understanding.' Thirty years later that's the most bullish sentence ever written about mathematicians' job security, and the most bearish about everyone who only produced output.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://a16zfrontier.substack.com/p/why-do-math-when-ai-can"}, {"id": 54, "cat": "cyber", "urgency": "watch", "source": "a16z Frontier", "title": "Thaler: judgments about which problems stay hard are already shaping post-quantum security plans", "idea": "Justin Thaler (Georgetown, a16z Frontier) argues that people will still need to make their own judgment calls however capable machines become, especially when building systems others trust. In cryptography, judgments about which problems will remain hard are already shaping plans to secure the internet against quantum computers. AI that proves or disproves hardness assumptions changes those plans directly.", "angle": "If AI can attack hardness assumptions, the post-quantum migration timeline faces a second threat vector beyond quantum hardware. That is relevant to crypto-asset security and PQC vendors.", "tweetA": "Everyone worries quantum computers will break encryption. The underpriced risk: AI proving that a 'hard' problem isn't hard. Cryptography rests on assumptions, and we just built machines that attack assumptions for a living.", "tweetB": "Post-quantum crypto migration is planned around which math problems stay hard. That list was written by humans. This year, AI started solving problems humans called intractable. Somebody should re-audit the list.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://a16zfrontier.substack.com/p/why-do-math-when-ai-can"}, {"id": 55, "cat": "credit", "urgency": "deep", "source": "Herb Greenberg / Red Flag Alerts", "title": "'We just crammed a year, maybe two, into a week': Anthropic's IPO was the window-closing signal", "idea": "Greenberg argues nobody goes public in a market this volatile unless they see the window closing and want to grab as much as possible. Anthropic was the trigger, not the cause. He points to the flood of data-center debt deals, the 'absurdly speculative, mostly debt-fueled' financing, and asks 'seen CoreWeave lately?' A former fund manager friend: when your investment case depends on the circular financing continuing, 'you have lost the plot.' He adds that the Bank of England can't replace the Fed.", "angle": "The credit side of AI (data-center ABS, neocloud debt, GPU-backed loans) is where losses crystallize. Equity is just the first to reprice.", "tweetA": "When the IPO of the century prices into the most volatile tape since 2020, that's not confidence. That's an issuer racing the window. Smart money sells when buyers are desperate. Anthropic sold $81B of stock to desperate buyers.", "tweetB": "'If your investment case depends on the circular financing continuing, you've lost the plot.' T
