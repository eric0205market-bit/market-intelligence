he AI stack has been paying itself: chip vendor invests in cloud, cloud buys chips, chips back the loan. Once one link pauses, they all do. $CRWV", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.herbgreenberg.com/p/the-wrap-free-market-fallacy"}, {"id": 56, "cat": "regulation", "urgency": "deep", "source": "Herb Greenberg / Red Flag Alerts", "title": "Greenberg's reform list: cap index weights at 1–2%, ban levered ETFs and 0DTEs, GAAP-only reporting, amortize circular financing", "idea": "A former fund manager's wish list, shared by Greenberg: cap any S&P 500 company at 1–2% of the index (equal weight would be 0.2%), because cap-weighting plus passive flows lowers mega-caps' cost of capital and raises everyone else's. Ban levered ETFs. Ban 0DTE options. GAAP-only earnings. Capitalize circular financing and amortize it through P&L at the burn rate. Rein in algos and payment for order flow. Real SEC penalties: 'Jensen was popped 3 prior times.' Make boards stop being CEO sycophants.", "angle": "Not happening, but index-concentration caps are a live debate (UCITS already caps at 10%/40%). Any move toward them would force massive mega-cap selling.", "tweetA": "Proposal: cap any stock at 1-2% of the S&P. Today the top 10 are 40% of the index. Implement that and passive funds would have to sell trillions of mega-cap stock. That's why it'll never pass, and why it should be debated.", "tweetB": "Levered single-stock ETFs on Anthropic launch Monday. The same week, a former fund manager proposes banning levered ETFs entirely. The market's response to fragility is always more leverage, sold as a product.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.herbgreenberg.com/p/the-wrap-free-market-fallacy"}, {"id": 57, "cat": "positioning", "urgency": "deep", "source": "Herb Greenberg / Red Flag Alerts (Harold Bradley)", "title": "Bradley: trading volume collapsed across every major index for two months before the crash", "idea": "Harold Bradley (Racing Sisyphus, former foundation CIO), who lived through late-1980s and late-1990s IPO investing: 'there is nothing surprising here.' Trading volume across all major indexes collapsed over the past two months, so buyers' prices sat far below sellers'. Cap-weighted indexes 'mask and delay penalties for bad corporate governance... and misallocation of capital.' Greenberg also flags Monday and the thin post-Thanksgiving Friday as possible 'smoke-and-mirrors' rally days.", "angle": "Falling volume into a top followed by a volume-spike capitulation is classic distribution. Watch whether the bounce comes on weak volume (bear rally) or strong volume (real bottom).", "tweetA": "Two months of collapsing volume across every major index before this crash. Like housing: buyers bid far below sellers ask, and the market gaps to find them. Thin markets don't fall gradually. They fall in weeks like this one.", "tweetB": "Post-Thanksgiving Friday is historically one of the thinnest sessions of the year. After a -8.6% week, that's exactly when a 'relief rally' can be painted. Don't confuse low-volume green with a bottom.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.herbgreenberg.com/p/the-wrap-free-market-fallacy"}, {"id": 58, "cat": "macro", "urgency": "deep", "source": "The Dark Side of the Boom / Stephen Innes (Goldman Sachs FX Weekly)", "title": "Goldman FX: the dollar is back as a haven, USD/JPY is near intervention, and EM FX is losing its carry cushion", "idea": "Goldman's 'Tightening Tremors' FX weekly: markets had assumed the dollar's next 2027 move would be lower. Instead, a hawkish Fed, tighter financial conditions, struggling commodities and AI fatigue have strengthened it. USD/JPY is approaching familiar intervention territory, an asymmetric risk vs the Fed's tightening. EM FX is squeezed by falling commodities, weaker risk appetite and shrinking carry, though Goldman sees opportunities. INR, AUD/NZD and CAD tell 'three very different stories' about adjusting to the policy shock. Rest paywalled.", "angle": "Dollar strength plus near-intervention USD/JPY is the classic setup for a violent yen squeeze, and Macro Mornings flags the yen as the true-fear gauge. Long yen vol looks cheap relative to the setup.", "tweetA": "Consensus for 2027 was 'dollar lower.' Hawkish Fed + AI selloff + falling commodities = the dollar rallies as a haven. USD/JPY nearing intervention levels. If MoF steps in during an equity panic, the yen squeeze could be violent.", "tweetB": "EM FX is losing on three fronts at once: commodities down, risk appetite down, carry compressing as the Fed hikes. That's the 2013 taper-tantrum recipe. The difference: this time the Fed hikes INTO an equity crash.", "charts": {"count": 0, "hot": false, "desc": "Paywalled — Goldman FX charts inside, worth opening"}, "link": "https://thedarksideoftheboom.substack.com/p/goldman-sachs-fx-weekly-tightening"}, {"id": 59, "cat": "AI/infra", "urgency": "act", "source": "NLP Newsletter / Elvis Saravia (AI Agents Weekly)", "title": "GPT-6.2 Astra beats Claude Fable 5.2 by 5.5 points on Agents' Last Exam at 5% of the cost", "idea": "OpenAI released GPT-6.2 Astra (frontier) and Sol (efficient). On Agents' Last Exam (multistep professional work), Astra scores +5.2 over GPT-6 Astra at under 1/3 the cost, and +5.5 over Claude Fable 5.2 at 5% of the cost. GDPval v2: +6.2 with 22% fewer output tokens. On FrontierCode 2.0, Sol is within 0.5 points of Astra at about 1/5 the cost. Pricing: Astra $8 in / $0.40 cached / $40 out (20% cheaper than GPT-6 Astra); Sol $2 / $0.10 / $10. Live in ChatGPT Work, Codex and the API.", "angle": "This launched the same week as a $1.8T Anthropic IPO, and a frontier competitor claiming equal-or-better results at 5% of the cost is exactly the commoditization risk Singh and Rhind name. Model pricing power is the key variable in the IPO's valuation.", "tweetA": "GPT-6.2 Astra beats Claude Fable 5.2 on agentic work at 5% of the cost, released the week of Anthropic's $1.8T IPO. The bear case for frontier-model valuations isn't open-source. It's the other frontier lab.", "tweetB": "Sol gets within 0.5 points of Astra on coding at 1/5 the price, and OpenAI itself tells devs to start with Sol. When the lab recommends its cheaper model, the price-performance curve has gone vertical. Margins on 'good enough' AI are headed to utility levels.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://nlp.elvissaravia.com/p/ai-agents-weekly-gpt-62-astra-and"}, {"id": 60, "cat": "AI/infra", "urgency": "watch", "source": "NLP Newsletter / Elvis Saravia (AI Agents Weekly)", "title": "GPT-6.2 Astra is OpenAI's first external model to hit 'High' for AI self-improvement, and both models are 'Critical' on cyber", "idea": "Under OpenAI's Preparedness Framework, both GPT-6.2 models meet the Critical cybersecurity threshold and launch with tighter cyber safeguards. Astra is the first externally released OpenAI model to meet the High threshold for AI Self-improvement. It also sets a new high on Terminal-Bench-Science 0.1, 9 points above GPT-6 Astra.", "angle": "A 'High' self-improvement rating on a public model is an AI-safety milestone that regulators will notice, especially with data-center ballot defeats (40 of 41) and state pauses in play.", "tweetA": "First publicly released OpenAI model rated 'High' for AI self-improvement. 'Critical' on cyber. Shipped in a newsletter bullet between pricing and availability. A few years ago this would have been the biggest AI story of the year.", "tweetB": "Critical-level cyber capability in a commercially available model, the same week a hijacked Optimizely script hit 178 sites and unexplained outages hit Microsoft, Schwab and the FAA. The cyber-defense budget conversation just got more urgent. $CRWD $PANW", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://nlp.elvissaravia.com/p/ai-agents-weekly-gpt-62-astra-and"}, {"id": 61, "cat": "AI/infra", "urgency": "watch", "source": "NLP Newsletter / Elvis Saravia (AI Agents Weekly)", "title": "Same week: Gemini 4 Neon, Qwen4-Max, Inkling 2 Mini, and 936 AI agents publishing 936 studies", "idea": "Other headlines this week (bodies paywalled): Google launches Gemini 4 Neon; Thinking Machines releases Inkling 2 Mini; Alibaba releases Qwen4-Max; 'A Society of AI Scientists' where 936 AI agents publish 936 studies; FrontierHarness tests 22 agent harnesses; Meta trains memory skills into model weights; Judgment launches Eval Optimizer; Cognition launches Devin Bots; harnesses help LMs generalize to longer tasks.", "angle": "Four frontier/near-frontier releases in one week (OpenAI, Google, Alibaba, Thinking Machines) is the supply side of the commoditization story. Chinese open-weight Qwen4-Max is the price floor.", "tweetA": "In one week: GPT-6.2, Gemini 4 Neon, Qwen4-Max, Inkling 2 Mini. Four frontier-ish model releases while AI stocks had their worst week since 2020. The tech isn't slowing down. The pricing power is.", "tweetB": "936 AI agents published 936 studies. The research paper used to be the unit of scientific output. Now it's a commodity. Peer review and replication were already strained. This breaks them.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://nlp.elvissaravia.com/p/ai-agents-weekly-gpt-62-astra-and"}, {"id": 62, "cat": "macro", "urgency": "deep", "source": "Tavi Costa / Crescat", "title": "Costa: the Fed is engineering a 2008-style deflationary bust and starving the commodity supply that drives inflation", "idea": "Costa: if you wanted to engineer a deflationary bust like 2008, you'd do exactly what this Fed is doing, accelerating rate hikes into a slowing economy that depends on easy money. The irony: hiking cuts off the investment needed to increase natural-resource supply, which worsens the root cause of the inflation. (Rest of post not in email body.)", "angle": "Higher rates raise the cost of capital for mines and drilling and lock in the next supply deficit. Giustra makes the same point on copper in 4–5 years. That makes resource equities a buy-the-bust trade.", "tweetA": "Hiking rates to fight a supply-driven inflation raises the cost of capital for the mines and wells that would fix the supply. The Fed's cure is the disease's next chapter. Copper deficit in 4-5 years gets locked in today. $COPX $XME", "tweetB": "Costa says 2008-style deflationary bust. Hanke says M4 growing 7.4%, too hot. Both are watching the same Fed. My guess: we get both, deflation in asset prices and inflation in everything you can't print.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://tavicosta.substack.com/p/feds-suicidal-mission"}];

var COLORS={macro:"#e24b4a",credit:"#378add",positioning:"#ef9f27","AI/infra":"#1d9e75",crypto:"#7f77dd",geopolitics:"#d85a30",energy:"#f97316",tech:"#06b6d4",gold:"#d4a017",culture:"#ec4899",labor:"#8b5cf6",regulation:"#64748b",science:"#14b8a6",venture:"#84cc16",cyber:"#be123c",commodities:"#a16207"};

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function col(c){return COLORS[c]||"#888";}
function tint(h){return h+"14";}
function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}
function shortSrc(s){return s.split(" / ")[0].split(" (")[0];}
function card(item){
  var c=col(item.cat), ch=item.charts||{count:0};
  var icon=ch.hot?" 🔥":(ch.count>0?" 📊":"");
  var h='<div class="card'+(ch.hot?' hot':'')+'" id="card'+item.id+'" data-cat="'+esc(item.cat)+'" data-urg="'+item.urgency+'">';
  h+='<div class="ch" onclick="toggle('+item.id+')"><span class="num">'+String(item.id).padStart(2,"0")+'</span><span>'+URG[item.urgency]+'</span>';
  h+='<span class="src" style="background:'+c+'">'+esc(shortSrc(item.source))+'</span><span class="cat">'+esc(item.cat)+'</span><span>'+icon+'</span>';
  h+='<span class="ttl">'+esc(item.title)+'</span></div>';
  h+='<div class="cb"><div class="lbl">the idea</div><div class="idea">'+esc(item.idea)+'</div>';
  h+='<div class="lbl">my angle</div><div class="angle" style="border-color:'+c+';background:'+tint(c)+'">'+esc(item.angle)+'</div>';
  h+='<div class="tw"><div class="tbox"><div class="tl" style="color:#378add">TWEET A '+'<button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button>'+'</div>'+esc(item.tweetA)+'</div>';
  h+='<div class="tbox"><div class="tl" style="color:#7f77dd">TWEET B '+'<button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button>'+'</div>'+esc(item.tweetB)+'</div></div>';
  h+='<div class="chart'+(ch.hot?' hotc':'')+'">📊 Charts: '+ch.count+(ch.desc?' — '+esc(ch.desc):' — no charts in email')+'</div>';
  h+='<div class="lbl" style="margin-top:8px">source</div><div style="font-size:13px;color:#555">'+esc(item.source)+'</div>';
  h+='<a class="lnk" href="'+esc(item.link)+'" target="_blank" rel="noopener">↗ Read full article</a></div></div>';
  return h;
}
function toggle(id){document.getElementById("card"+id).classList.toggle("open");}
function apply(){
  ITEMS.forEach(function(it){
    var el=document.getElementById("card"+it.id);
    var ok=(curCat==="All"||it.cat===curCat)&&(curUrg==="All"||it.urgency===curUrg)&&(!curSrc||it.source.indexOf(curSrc)>=0);
    el.style.display=ok?"":"none";
    if(curSrc&&ok){el.classList.add("open");}else{el.classList.remove("open");}
  });
  document.getElementById("flt").textContent=curSrc?("Source filter: "+curSrc+" (click any filter to reset)"):"";
  renderBars();
}
function setCat(c){curCat=c;curSrc=null;apply();}
function setUrg(u){curUrg=u;curSrc=null;apply();}
function filterBySrc(name){curSrc=name;curCat="All";curUrg="All";apply();window.scrollTo(0,0);}
function renderBars(){
  var cc={};ITEMS.forEach(function(i){cc[i.cat]=(cc[i.cat]||0)+1;});
  var h='<button class="pill'+(curCat==="All"?' active':'')+'" style="'+(curCat==="All"?'background:#333':'')+'" onclick="setCat(\'All\')">All '+ITEMS.length+'</button>';
  Object.keys(cc).sort(function(a,b){return cc[b]-cc[a];}).forEach(function(c){
    var a=curCat===c;
    h+='<button class="pill'+(a?' active':'')+'" style="'+(a?'background:'+col(c):'border-color:#ccc')+'" onclick="setCat(\''+c+'\')">'+esc(c)+' '+cc[c]+'</button>';
  });
  document.getElementById("catbar").innerHTML=h;
  var uc={act:0,deep:0,watch:0};ITEMS.forEach(function(i){uc[i.urgency]++;});
  var u='<button class="pill'+(curUrg==="All"?' active':'')+'" style="'+(curUrg==="All"?'background:#333':'')+'" onclick="setUrg(\'All\')">All</button>';
  ["act","deep","watch"].forEach(function(k){
    var a=curUrg===k;
    u+='<button class="pill'+(a?' active':'')+'" style="'+(a?'background:#555':'')+'" onclick="setUrg(\''+k+'\')">'+URGN[k]+' '+uc[k]+'</button>';
  });
  document.getElementById("urgbar").innerHTML=u;
}
function init(){

  r+='</table><div class="lbl">skipped sources</div>';
  r+=META.skippedSources.length?('<table>'+META.skippedSources.map(function(s){return '<tr><td>'+esc(s.name)+'</td><td>'+esc(s.reason)+'</td></tr>';}).join('')+'</table>'):'<p>None — every email in window had extractable content.</p>';
  r+='<p style="font-size:12px;color:#777">'+esc(META.notes)+'</p>';
  document.getElementById("repbody").innerHTML=r;
  renderBars();
}
