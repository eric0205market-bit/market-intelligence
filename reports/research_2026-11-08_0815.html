<script>
const ITEMS = [{"cat": "AI/infra", "urgency": "deep", "source": "Stephen Innes / The Dark Side Of The Boom", "title": "Too Blue To Build: 9 states with data-center pauses hold 41% of the US pipeline", "idea": "Cleanview counts nine states where the governor or governor-elect promised or imposed a pause on new data centers: 158.6 GW of planned capacity, 41% of the entire US pipeline. 100% of OpenAI's planned capacity and 45% of Microsoft's sits in those states. Texas and New Mexico (Abilene, Shackelford County) delivered the most hostile results, and the $300B Oracle/OpenAI contract is built across Texas, NM, Wisconsin and Michigan.", "angle": "Political risk just became a build-schedule variable for the whole supply chain. The AI complex was priced on permits being a formality.", "tweetA": "100% of OpenAI's planned capacity sits in states that just elected pause-friendly governors. Oracle's $300B backlog is OpenAI's schedule. The market priced a contract, not a permit.", "tweetB": "Everyone modelled the GPU supply curve. Nobody modelled a county commission. 158.6 GW is 41% of the pipeline, and a delayed gigawatt hurts a leveraged developer almost as much as a cancelled one. $ORCL $IREN $CRWV", "charts": {"count": 2, "hot": true, "desc": "Two bar charts: governor pause exposure by state (158.6 GW, 41% of pipeline) and exposure by company (OpenAI 100%, Microsoft 45%)."}, "link": "https://thedarksideoftheboom.substack.com/p/wall-street-week-ahead-blue-screen", "id": 1}, {"cat": "AI/infra", "urgency": "act", "source": "Stephen Innes / The Dark Side Of The Boom", "title": "Microsoft lets Oracle-rented Nvidia capacity expire; $80B+ neocloud book now looks selective", "idea": "Microsoft is letting 2023-era rented capacity from Oracle (older-gen Nvidia chips, originally for Bing AI) lapse. It has committed over $80B to outside clouds including CoreWeave, Nscale and Nebius but is reportedly frustrated by cost and construction delays. Oracle cloud revenue was $18B in the year to May 2026, free cash flow is negative and ORCL is down more than half from its June peak.", "angle": "First visible hyperscaler pushback on rented capacity. Watch neocloud debt spreads and CoreWeave's print next week.", "tweetA": "Microsoft rented Oracle servers in 2023 because compute was scarce. It's letting them lapse in 2026 because the chips aged faster than the contract. Now ask what a 4-year neocloud lease is worth on a 2-year GPU.", "tweetB": "$80B committed to neoclouds, and Microsoft just showed it will say no to one of them. If the marginal buyer gets pickier on price and delivery dates, who is financing the next 10GW? $ORCL $CRWV $NBIS", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/wall-street-week-ahead-blue-screen", "id": 2}, {"cat": "AI/infra", "urgency": "deep", "source": "Stephen Innes / The Dark Side Of The Boom", "title": "Goldman: the 2027-28 build is already under construction — the risk is the 137GW that isn't", "idea": "Goldman (Ng, Shema, Xie): US has ~57GW operational, 9GW more under construction for end-2026, then 78GW gross under construction (33GW 2027, 37GW 2028, 8GW 2029). At PUE 1.5 that is ~22GW and ~24GW IT adds vs Goldman's 20GW/24GW forecasts. A further 137GW of high-likelihood capacity is not yet under construction. Texas is 26% of 2026-30 additions; IREN has 73-87% Texas exposure. Celestica and Arista flagged as delay-vulnerable.", "angle": "Market may be pricing 2029 permitting risk against 2027 earnings. The tell is order cancellations, not headlines.", "tweetA": "Goldman's under-construction pipeline gives ~24GW IT adds in 2028 against a 24GW forecast. The selloff is pricing 2029-30 risk onto 2027 earnings. Show me one cancelled PO and I'll change my mind.", "tweetB": "78GW is already being built. 137GW is a press release. The SOX moved like all of it was the second. $IREN $CLS $ANET", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/wall-street-week-ahead-blue-screen", "id": 3}, {"cat": "AI/infra", "urgency": "deep", "source": "Stephen Innes / The Dark Side Of The Boom", "title": "SOX -12% in one session, worst in 6+ years; tech lags S&P by the widest margin since May 2002", "idea": "S&P -2.7% on the week, Nasdaq -3.4% (correction territory), Nikkei -9.3%. Thursday erased ~$2.9T from the S&P and the Philadelphia Semiconductor Index fell more than 12% in a day, its worst in over six years; all 11 sectors were red. Tech underperformed the S&P over a month by the widest margin since May 2002, yet the S&P is still up ~8% YTD.", "angle": "A forced-selling tape, not an earnings reset. Positioning unwind then second leg is the question for Monday.", "tweetA": "Tech vs S&P is the widest one-month gap since May 2002, while the S&P is still +8% YTD. That isn't the market breaking, that's the crowd leaving one door at once.", "tweetB": "SOX -12% in a day with every S&P sector red means someone had to sell what they could, not what they wanted. Nikkei -9.3% on the week says it wasn't just a US story. $SOXX $NVDA", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/wall-street-week-ahead-blue-screen", "id": 4}, {"cat": "AI/infra", "urgency": "deep", "source": "Stephen Innes / The Dark Side Of The Boom", "title": "Wall Street may start paying hyperscalers to spend less", "idea": "Innes argues a more measured capex programme could lift hyperscaler free cash flow, and after 18 months of rewarding bigger budgets the Street may discover 'a perverse affection' for companies spending less. Real investment in software, computer equipment and data centres grew over 20% YoY in Q3, contributing almost one point to real GDP growth. Suppliers and leveraged infrastructure owners are the losers in that regime.", "angle": "Capex discipline flips from sin to virtue; the pair trade is hyperscaler FCF vs their suppliers.", "tweetA": "Same capex cut, two opposite trades: it raises FCF for the spender and cuts the revenue line of the supplier. Pick which side of the cheque you want to be on. $MSFT $META vs $AMAT $VRT", "tweetB": "One point of Q3 real GDP came from AI capex. If hyperscalers 'discipline' that by even a quarter, it's a macro headwind arriving the same week the Fed prices a December hike.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/wall-street-week-ahead-blue-screen", "id": 5}, {"cat": "macro", "urgency": "deep", "source": "Stephen Innes / The Dark Side Of The Boom", "title": "Fed ~80% priced for a December hike; AI capex is now an inflation input", "idea": "Markets price ~80% odds of a 25bp hike on Dec 8-9, with two more hikes later. October CPI is Tuesday. US 10y is down 40bp+ from its early-October high on equity liquidation and lower oil, but WTI is still ~$90. Innes notes AI build-out is inflationary now (construction, power, equipment) while productivity gains are disinflationary only later; the Fed can't mark future efficiency to market.", "angle": "Bond rally from liquidation is not the same as dovish. Tuesday CPI is the pivot for the AI trade.", "tweetA": "10y -40bp from the high, and the Fed is still ~80% priced to hike in December. That's a flight-to-quality bid, not an easing signal. Don't confuse the two on Tuesday.", "tweetB": "The Fed is being asked to look through AI-driven inflation today for a productivity boom tomorrow. Construction, power gear and electricians don't wait for the boom. $TLT $SPY", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/wall-street-week-ahead-blue-screen", "id": 6}, {"cat": "macro", "urgency": "deep", "source": "Stephen Innes / The Dark Side Of The Boom", "title": "Next week's tell: CoreWeave, Applied Materials, Cisco", "idea": "Innes flags three prints as clean reads on the AI cycle. CoreWeave: can projects still obtain capital, power connections and avoid delays. Applied Materials: whether equipment demand is resilient as customers reassess timing. Cisco: whether networking orders are sustainable or speculative inventory building.", "angle": "Watch language on delays and deferrals, not growth rates.", "tweetA": "CoreWeave, AMAT and Cisco report into a tape where the question has changed from 'how much capex' to 'how much slips'. I'm reading for the word deferral. $CRWV $AMAT $CSCO", "tweetB": "Three prints, three layers of the stack: financing, tools, networking. If all three say 'timing', that's the cycle changing shape, not ending.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/wall-street-week-ahead-blue-screen", "id": 7}, {"cat": "energy", "urgency": "act", "source": "Stephen Innes / The Dark Side Of The Boom", "title": "Hedge funds dump $6.6B of oil as the war trade comes apart", "idea": "Goldman's Robert Quinn documents an unwind of billions in Brent longs after the US midterms changed expectations on the Iran conflict. Innes says the character of the selling matters more than the decline, trend-followers have only just started adjusting, physical signals are mixed, and options traders are already buying upside protection. Full body is paywalled; only the intro and takeaways were in the email.", "angle": "Positioning washed out into skew bid: classic setup for a violent reversal if Hormuz headlines return.", "tweetA": "$6.6B of Brent longs dumped, and options traders are already bidding upside protection. When the sellers buy calls on the way out, they're telling you what they're afraid of. $XLE $USO", "tweetB": "CTAs haven't finished selling, discretionary funds already did. That's the gap the next Iran headline falls into.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/long-and-wrong-hedge-funds-dump-66", "id": 8}, {"cat": "energy", "urgency": "deep", "source": "MacroEdge / Oil and Gas Research", "title": "XOP -15% in a week; WTI ~$91; MacroEdge sees $80-82 as the new baseline", "idea": "XOP fell more than 15%, its largest single-week decline in this higher nominal price environment, giving back April-to-date gains after the election move. WTI settled around $91 with a possible gap-fill lower, but the author expects cycle highs over the coming months absent demand destruction and says $80-82 will not be a 2026-only baseline. Also flags Henry Hub (record production, better asymmetry) and rig/frac discipline.", "angle": "Energy equities trading as a growth-scare beta, not on commodity. Divergence is the trade.", "tweetA": "XOP -15% in a week with WTI still ~$91. Equities priced the macro, the commodity didn't. One of them is wrong. $XOP $OXY", "tweetB": "Record Henry Hub production and a shale sector trading like a tech factor. If gas gets the better asymmetry here, the oil equity washout is a liquidity event, not a thesis change. $UNG $EQT", "charts": {"count": 1, "hot": false, "desc": "Chart of XOP weekly decline (>15%)."}, "link": "https://macroedgeenergy.substack.com/p/oil-and-gas-research-weekly-macro-768", "id": 9}, {"cat": "geopolitics", "urgency": "deep", "source": "MacroEdge / Oil and Gas Research", "title": "Hormuz and Bab-el-Mandeb standoff: a waiting game with limited US airstrikes", "idea": "US continues limited airstrikes on Iran without escalation. The author frames it as the US testing how long Iran's economy holds while Iran tests how long the US will cede control of the Strait of Hormuz and Bab-el-Mandeb. He thinks escalation is 'all but guaranteed' because ceding the waterways would signal weakness globally.", "angle": "Oil is pricing de-escalation; the author is not. Asymmetry is to the upside in tail risk.", "tweetA": "Both sides are waiting. Iran waits to see if the US cedes two straits, the US waits to see how long Iran's economy lasts. Oil is priced as if the waiting ends politely.", "tweetB": "If the author is right that the US can't cede Hormuz, then $91 WTI on 'midterm de-escalation' is the cheapest tail hedge in the market. $CL_F $BNO", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://macroedgeenergy.substack.com/p/oil-and-gas-research-weekly-macro-768", "id": 10}, {"cat": "macro", "urgency": "watch", "source": "MacroEdge / Oil and Gas Research", "title": "Whack-a-mole policymaking: 12-18 months of structural change in markets", "idea": "Author argues previous frameworks assumed central bankers and fiscal policymakers could control every facet of a high-risk market; the emerging framework is whack-a-mole, filling holes before they cave in. He expects a fundamental change in markets and the economy to take 12-18 months to take form with energy as a core part, and says politics will take the blame for changes the market is actually driving.", "angle": "A regime thesis worth tracking: policy reactive, not preemptive.", "tweetA": "The old market framework assumed policymakers could manage every risk. The new one is whack-a-mole, and the market is the mallet.", "tweetB": "If policy is whack-a-mole, correlations break at the worst time. Hedge the thing the last hole was dug in. $VIX", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://macroedgeenergy.substack.com/p/oil-and-gas-research-weekly-macro-768", "id": 11}, {"cat": "gold", "urgency": "act", "source": "Stephen Innes / The Dark Side Of The Boom", "title": "Goldman cuts gold: end-2026 to $4,150 from $4,650; end-2027 to $4,800 from $5,400", "idea": "Goldman lowered its end-2026 gold forecast by $500 and end-2027 by $600 on a more hawkish Fed and expectations that call-option policy hedging demand normalises. Central banks added a net 321 tonnes in Q3, which supports the floor but not a rally. Gold rose ~4.6% on the week before slipping toward $4,065 after strong jobs.", "angle": "The bank that built the bull case is trimming it while CBs still buy. Floor, not launchpad.", "tweetA": "Goldman took $500 off its 2026 gold target and $600 off 2027. Central banks bought 321t in Q3 and it still isn't enough to carry the spec crowd. The floor is official, the ceiling isn't. $GLD", "tweetB": "Gold's 2026 target now sits roughly where spot is. When the street target equals spot, the debate shifts to who still has to buy. Options desks or central banks. $GLD $GDX", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/gold-weekly-the-range-trade-parade", "id": 12}, {"cat": "gold", "urgency": "deep", "source": "Stephen Innes / The Dark Side Of The Boom", "title": "Gold's split personality: positive with equities, inverse with oil", "idea": "Since the Iran war began, gold has traded inversely to oil (higher crude feeds inflation and a hawkish Fed) and with a positive correlation to the Nasdaq (sold for liquidity in margin calls). Retreat in Brent let gold recover from its late-October lows. The dollar and the Fed reaction function dominate.", "angle": "Gold isn't the geopolitical hedge this cycle; it's a liquidity source.", "tweetA": "Iran war, and gold falls when oil rises. Nasdaq drops, and gold gets sold for margin. That's not a safe haven, that's an ATM.", "tweetB": "Gold is trading as a rate asset, not a war asset. Price it off real yields and the dollar, then ask why anyone owns it for Hormuz.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/gold-weekly-the-range-trade-parade", "id": 13}, {"cat": "gold", "urgency": "deep", "source": "Stephen Innes / The Dark Side Of The Boom", "title": "Gold options crowd goes quiet: implied vol is fading, so what is the dealer-gamma fuel?", "idea": "Rising call demand forces dealer hedging that amplifies upside; when speculative calls fade, implied vol retreats and dealers stop chasing. CME's September data showed gold options implied volatility off its earlier peak while volumes recovered from Q2 lows. Innes is pivoting to a range-trade into year-end as liquidity thins.", "angle": "Regime call: mean-reversion beats breakouts until real yields move.", "tweetA": "Gold's last leg up had dealer hedging behind it. Take the call buyers away and the amplifier turns off. Range regime until real yields say otherwise.", "tweetB": "Everyone asks where gold goes. Better question: who's left to buy upside? IV down, CTAs flat, CBs steady. That's a range. $GLD $GC_F", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/gold-weekly-the-range-trade-parade", "id": 14}, {"cat": "gold", "urgency": "deep", "source": "Viktor / Crypto Narratives", "title": "Precious metals: gold $4,200 to $3,900, silver -21% ($62 to $49) in October", "idea": "Viktor frames the August debasement rally as a bounce inside a downtrend running since January's blow-off top. Gold broke below the $4,000 base that had held for months; silver is bleeding after every bounce. (Note: Innes has gold back near $4,065 after a +4.6% week.)", "angle": "Two newsletters, two gold tones: Viktor sees a broken base, Innes a range. The $4,000 level is the arbiter.", "tweetA": "Silver -21% in a month and gold lost a base it held for months. The debasement trade worked for exactly six weeks.", "tweetB": "Gold lost $4,000 in October and got it back in a week. That's not a trend, it's a pivot level everyone is watching. Silver is the weaker tell. $SLV $GLD", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://cryptonarratives.substack.com/p/october-2026-recap-narratives-best", "id": 15}, {"cat": "crypto", "urgency": "deep", "source": "Viktor / Crypto Narratives", "title": "Binance hacked for ~$6B on Oct 29; $3B frozen by Tether and Circle", "idea": "Around $6B was drained, $3B was quickly frozen by Tether and Circle mostly, and Binance said users are unaffected. BTC fell 5.3% from $81k to $76.5k in six hours; ENA and PEPE dumped more because the hacker sold those specific tokens (about $40M of PEPE alone). BTC retested the low next day and held.", "angle": "Stablecoin issuers are now the de facto emergency brake for centralized-exchange hacks.", "tweetA": "$6B stolen, $3B frozen in hours. The biggest hack in crypto history was half-reversed by two companies who can press a button. Decentralization had a good month.", "tweetB": "Hacker dumps $40M of PEPE and it's -24% in a day. Liquidity in alts is thinner than the market caps imply. $PEPE $ENA $BTC", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://cryptonarratives.substack.com/p/october-2026-recap-narratives-best", "id": 16}, {"cat": "crypto", "urgency": "deep", "source": "Viktor / Crypto Narratives", "title": "Alts bled all October after a 6-week melt-up; every risk-on leader was a good short", "idea": "After up-only action mid-Aug to late Sept, OTHERS gained +60% in the risk-on phase then fell 14% in October with no liquidation cascade. ENA, VVV, ZEC, PUMP, HYPE, NEAR and USELESS all fell 20-40%; the whole Robinhood chain narrative basket (PONS, AI, CASHCAT, ARB, UNI) died with on-chain activity. BTC held far better, nearly making new highs above $87k early on, then $80k on Oct 8 on AI cracking cryptography fears.", "angle": "Leaders become laggards: rotation within crypto matters more than direction.", "tweetA": "Every winner from the August risk-on run was a 20-40% short in October. Momentum in alts has a half-life of about six weeks.", "tweetB": "A cryptography scare on Oct 8 knocked BTC from $87k to $80k. 'AI cracks crypto' is the new quantum FUD. $BTC", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://cryptonarratives.substack.com/p/october-2026-recap-narratives-best", "id": 17}, {"cat": "crypto", "urgency": "deep", "source": "Viktor / Crypto Narratives", "title": "MSCI excludes non-operating companies: MSTR final list due Nov 11, effective Nov 30", "idea": "MSCI's Oct 15 rule change excludes non-operating companies from its indexes; $MSTR is at risk and the final list is due Nov 11, with changes effective Nov 30. MSTR/BTC dropped 8% in two days then bounced.", "angle": "Index-deletion flows would land Nov 30; the announcement lands in three days.", "tweetA": "MSCI decides on Nov 11 whether MSTR is an operating company. If not, passive selling lands on Nov 30. The market shrugged off the first headline. Is that wisdom or complacency? $MSTR $BTC", "tweetB": "Strategy was supposed to be the bid under BTC. The exit door is an index committee. $MSTR", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://cryptonarratives.substack.com/p/october-2026-recap-narratives-best", "id": 18}, {"cat": "crypto", "urgency": "deep", "source": "Viktor / Crypto Narratives", "title": "Hyperliquid x ICE: +22% in 6 hours, then ICE deleted its tweet", "idea": "On Oct 29 ICE announced a US market for Hyperliquid perps with tradeXYZ and an investment into it. HYPE rose 22% in 6 hours, helped by Druckenmiller's only tweet about his tradeXYZ investment and an Elon QT. Hours later the Binance hack hit; a day later ICE deleted the tweet and reposted 'subject to approval'. HYPE has bled since.", "angle": "A 'regulated perps' headline needs a regulator; timeline is months.", "tweetA": "ICE tweeted, deleted, and re-tweeted with 'subject to approval' attached. A 22% pump on a headline that needed a regulator. $HYPE", "tweetB": "Druckenmiller's only tweet is about a Hyperliquid front-end. Macro money wants perps. The venue question is who gets the licence. $HYPE $ICE", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://cryptonarratives.substack.com/p/october-2026-recap-narratives-best", "id": 19}, {"cat": "crypto", "urgency": "deep", "source": "Viktor / Crypto Narratives", "title": "Bitmine hits its 5% ETH supply target and stops buying; ETH underperforms BTC", "idea": "ETH underperformed BTC especially after Tom Lee announced on Oct 7 that Bitmine was near its 5% of supply target and would stop buying.", "angle": "A treasury ": "Nvidia asked TSMC to make memory. When the biggest buyer sponsors a new entrant to the scarcest input, the shortage is about to be an arbitrage. $TSM $MU $NVDA", "tweetB": "Memory makers run 75%+ gross margins because there are three of them. Add TSMC and CXMT and that stops being true by 2029.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/ai-tsmc-the-fed-of-ai-eyes-memory", "id": 24}, {"cat": "AI/infra", "urgency": "deep", "source": "Michael Parekh / AI-RTZ", "title": "The memory wall: compute +60,000x since 1996, bandwidth +100x; SK Hynix sold out through 2029", "idea": "From 1996 to 2023 peak server compute grew ~60,000x while memory bandwidth grew ~100x. SK Hynix is sold out through 2029, Samsung through 2027, SK Hynix Q3 operating profit rose ~7x, and the three incumbents earn 75%+ gross margins. Parekh argues AI memory is multi-year contracted rather than spot, and may be less cyclical.", "angle": "The cycle-is-dead call is exactly what Intel and TSMC themselves believed before leaving memory.", "tweetA": "Compute +60,000x, bandwidth +100x. That is the whole memory trade in one ratio. The question is whether contracted pricing survives a capex pause.", "tweetB": "'Memory isn't cyclical this time' is the sentence that has preceded every DRAM glut. Sold out through 2029 is a long time. $MU $HXSCF", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/ai-tsmc-the-fed-of-ai-eyes-memory", "id": 25}, {"cat": "AI/infra", "urgency": "watch", "source": "Michael Parekh / AI-RTZ", "title": "CXMT hits ~10% of global DRAM (from 4%), #4 in HBM, passes Tencent in market cap", "idea": "CXMT reached about 10% of global DRAM in Q2, up from 4%, is now #4 in HBM, and passed Tencent as China's most valuable listed company after its Shanghai IPO. YMTC is doing the same in NAND. Washington keeps them from US buyers, which Parekh says passes the cost to American phone, PC and data-center buyers.", "angle": "China's memory capacity is a pricing cap in waiting.", "tweetA": "CXMT went from 4% to ~10% of global DRAM in a quarter, and is now China's most valuable listed company. Export controls didn't stop it, they gave it a captive market.", "tweetB": "Apple is 'lobbying DC for CXMT' while its margins fall on memory costs. The cost of the chips war lands on the P&L of the company that needed both sides. $AAPL", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/ai-tsmc-the-fed-of-ai-eyes-memory", "id": 26}, {"cat": "culture", "urgency": "deep", "source": "Michael Parekh / AI-RTZ", "title": "History rhymes: Intel exited DRAM at 1% share in 1986; TSMC may re-enter 40 years later", "idea": "Intel's DRAM share fell from about 83% in 1974 to 1% by 1984; Grove and Moore exited memory in 1985-86 and Intel returned to profit with the 386. TSMC made standard memory until 2008 and left for logic. Now it weighs a return as memory becomes the value centre of AI hardware. Parekh calls it 'strategic inflection point' in reverse.", "angle": "Both stories are about where the margin pool sits; it moves.", "tweetA": "Intel left memory when it became a commodity. TSMC left in 2008. The bet now is that AI memory isn't a commodity. History has opinions.", "tweetB": "Intel exits memory in 1985: it saved the company. TSMC enters in 2026: either the best or worst capital allocation call of the decade.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/ai-tsmc-the-fed-of-ai-eyes-memory", "id": 27}, {"cat": "AI/infra", "urgency": "deep", "source": "Michael Parekh / AI-RTZ", "title": "Nvidia overtook Apple as TSMC's biggest customer; HPC is 68% of TSMC revenue", "idea": "Apple was ~25% of TSMC revenue in 2024 and Nvidia ~11%; Nvidia overtook Apple in 2025. HPC (mostly AI) was 68% of TSMC's revenue last quarter, net profit +68.7% in a sixth straight record quarter. Jensen says the Nvidia-TSMC relationship runs without a contract; Apple has $33B in new purchase obligations for memory.", "angle": "Customer concentration flipped in a year: TSMC is now an AI company.", "tweetA": "Nvidia and TSMC have no contract. A $100B+ relationship on a handshake. And now the handshake is about memory.", "tweetB": "68% of TSMC's revenue is HPC. The foundry that used to be an Apple proxy is now the AI capex proxy. Same stock, new beta. $TSM", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/ai-tsmc-the-fed-of-ai-eyes-memory", "id": 28}, {"cat": "geopolitics", "urgency": "deep", "source": "The Blind Squirrel", "title": "Chinese stocks +12% vs S&P in a month: is China the next Great Rotation winner?", "idea": "Chinese equities outperformed the S&P by 12% since the start of November in 'seven candles'. The author, constructive since early 2024, says 2026 has been a struggle after a Middle East hot war cut EM/DM risk, and his best China performers are Cathay Pacific's owner (Swire) and healthcare. He has restructured to a concentrated basket of industrial and technological resilience. Most of the piece is paywalled.", "angle": "Rotation out of US tech meets China's tech-resilience policy: relative value, not absolute.", "tweetA": "China +12% vs the S&P in seven trading days. The last ratio spike like this was October 2024, and most of it happened while China was closed for Golden Week.", "tweetB": "If US tech is the funding currency of every rotation, China is the first place the money goes. The question is whether it stays.", "charts": {"count": 1, "hot": false, "desc": "Chart of China vs S&P relative performance (+12% since start of month)."}, "link": "https://www.blindsquirrelmacro.com/p/confucian-confusion", "id": 29}, {"cat": "venture", "urgency": "deep", "source": "Azeem Azhar / Exponential View", "title": "Productivity +3.6% in the past quarter; A&O Sherman puts 3% of billable time into AI ($1.1B over 5 years)", "idea"
