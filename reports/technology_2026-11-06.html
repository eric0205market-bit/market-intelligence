ker": "Nature Machine Intelligence", "type": "data_point", "entities": ["floating-point"], "conviction": "high", "so_what": "Model variability is insensitive to perturbation size, so tightening numerics yields little reproducibility benefit.", "quote": null, "locator": "Irreducible model variability", "quote_verified": false}, {"claim": "The authors propose the functional uncertainty exponent as a practical, architecture-agnostic diagnostic: a configuration is in a riddling-like regime when the exponent is near zero and nearby initializations still produce substantial functional differences.", "speaker": "Nature Machine Intelligence", "type": "framework", "entities": ["functional uncertainty exponent"], "conviction": "medium", "so_what": "Offers a measurable reproducibility metric that model-risk and AI-assurance tools could adopt.", "quote": null, "locator": "We thus propose functional analysis", "quote_verified": false}, {"claim": "Rigorously characterizing riddling in state-of-the-art architectures at full scale is computationally infeasible because it requires training tens of thousands of networks, so the study used tapered models replicable within one week on an HPC cluster.", "speaker": "Nature Machine Intelligence", "type": "data_point", "entities": ["VGG-12"], "conviction": "high", "so_what": "Extrapolation to frontier LLMs remains unproven, tempering direct conclusions for large-model deployment.", "quote": null, "locator": "Deep neural network training configuration", "quote_verified": false}]}, {"theme": "Practical implications for training and deployment", "insights": [{"claim": "Riddling-like irreproducibility often coincides with the learning rate that gives peak training performance, while smaller learning rates make outcomes reproducible but degrade performance, indicating a performance-reproducibility trade-off in most tested configurations.", "speaker": "Nature Machine Intelligence", "type": "causal", "entities": ["learning rate"], "conviction": "medium", "so_what": "Labs optimizing for benchmark performance may be implicitly accepting irreproducible models.", "quote": null, "locator": "Performance-reproducibility trade-offs", "quote_verified": false}, {"claim": "Within the riddling-like regime, generalization error correlates strongly with the functional difference between networks trained from nearly identical initializations, independent of configuration details, while outside the regime the differences are negligible and uncorrelated.", "speaker": "Nature Machine Intelligence", "type": "data_point", "entities": ["generalization"], "conviction": "medium", "so_what": "Run-to-run disagreement could serve as a cheap proxy signal for generalization quality.", "quote": null, "locator": "We thus propose functional analysis", "quote_verified": false}, {"claim": "The authors say riddling undermines safety-critical applications such as medical diagnostics that require small changes to training not to drastically change the learned model.", "speaker": "Nature Machine Intelligence", "type": "thesis", "entities": ["medical diagnostics"], "conviction": "medium", "so_what": "Adds regulatory and validation risk for AI in healthcare and other safety-critical sectors.", "quote": null, "locator": "Unpredictability beyond chaos", "quote_verified": false}, {"claim": "Because riddling also requires competing attractors in symmetry-induced subspaces, the authors predict that systems with similar edge-of-stability behaviour can differ in reproducibility, motivating interventions such as symmetry-breaking rather than simply reducing the learning rate.", "speaker": "Nature Machine Intelligence", "type": "prediction", "entities": ["edge of stability"], "conviction": "exploratory", "so_what": "Points to architecture-level fixes for reproducibility that could matter for model governance.", "quote": null, "locator": "The riddling framework complements EoS", "quote_verified": false}, {"claim": "The riddling framework offers a geometric explanation for critical learning periods: sensitivity to perturbations diminishes during training but never vanishes because holes of competing basins exist arbitrarily close to the attractor.", "speaker": "Nature Machine Intelligence", "type": "causal", "entities": ["critical learning periods"], "conviction": "exploratory", "so_what": "Implies late-stage fine-tuning remains a source of outcome variability.", "quote": null, "locator": "Critical learning periods", "quote_verified": false}]}], "insight_total": 18, "top_entities": ["riddled basin geometry", "VGGNet", "ResNet", "BERT", "AdamW", "MNIST", "CIFAR-10", "GPU", "edge of stability", "churn"], "source_meta": {"author": "Nature Machine Intelligence", "word_count": 12061, "paywalled": false}}, {"record_id": "c406b4f996019ae9", "source_type": "technology", "source_name": "Quantum Computing Report", "source_url": "https://quantumcomputingreport.com/university-of-cologne-uncovers-spectroscopic-evidence-of-topological-superconductivity-in-ti-josephson-junctions/", "title": "University of Cologne Uncovers Spectroscopic Evidence of Topological Superconductivity in TI Josephson Junctions - Quantum Computing Report", "published_date": "2026-11-05", "language": "en", "processed_at": "2026-11-06T12:00:00Z", "processor": "claude-code-sub-opus", "tags": ["Tech"], "gist": "University of Cologne and RWTH Aachen researchers, publishing in Science Advances, report tunneling-spectroscopy signatures of phase-controlled gap closing in BiSbTeSe2 topological insulator Josephson junctions, supporting the 2008 Fu-Kane route to Majorana modes without the strong magnetic fields that hamper nanowire approaches. The authors caution that limited energy resolution (~30 μeV) and a soft gap mean this is not definitive proof, and propose niobium electrodes and charge-sensing electrometry as next steps toward braiding.", "themes": [{"theme": "Alternative path to Majorana-based topological qubits", "insights": [{"claim": "University of Cologne physicists with RWTH Aachen theorists report in Science Advances tunneling spectroscopy of topological insulator Josephson junctions showing phase-controlled gap closing and reopening, offering local spectroscopic support for the 2008 Fu-Kane model of topological superconductivity.", "speaker": "Mohamed Abdel-Kareem", "type": "data_point", "entities": ["University of Cologne", "RWTH Aachen University", "Science Advances", "Fu-Kane"], "conviction": "medium", "so_what": "Adds credibility to a materials route for topological qubits that competes with nanowire-based efforts.", "quote": null, "locator": "Physicists at the University of Cologne", "quote_verified": false}, {"claim": "Most Majorana efforts have used 1D semiconductor Rashba nanowires, which require intense in-plane magnetic fields that can suppress superconductivity and produce false-positive zero-bias peaks; the Cologne approach instead relies on spin-momentum locking in BiSbTeSe2 surface states to avoid Zeeman fields.", "speaker": "Mohamed Abdel-Kareem", "type": "causal", "entities": ["Rashba nanowires", "BiSbTeSe2", "Majorana zero modes"], "conviction": "medium", "so_what": "If nanowire approaches stay plagued by false positives, alternative platforms could reshape which topological-qubit roadmaps look viable.", "quote": null, "locator": "Topological quantum computation aims to encode", "quote_verified": false}]}, {"theme": "Experimental results", "insights": [{"claim": "The 50 nm junction embedded in an RF-SQUID loop showed an induced superconducting gap of 130 μeV at zero phase that closed into a zero-bias feature as the phase difference approached π, measured at 50 mK with dual Au/Al2O3 tunnel probes.", "speaker": "Mohamed Abdel-Kareem", "type": "data_point", "entities": ["RF-SQUID", "BiSbTeSe2"], "conviction": "medium", "so_what": "Concrete device-level metrics benchmark progress for topological superconductivity research.", "quote": null, "locator": "By embedding the 50 nm planar", "quote_verified": false}, {"claim": "In higher fields (5 to 6 mT) the dual tunnel contacts tracked individual Josephson vortex cores, and back-gate sweeps from −20 V to +20 V showed high-transmission states persisting across chemical potentials, ruling out fine-tuned quantum-dot artifacts.", "speaker": "Mohamed Abdel-Kareem", "type": "data_point", "entities": ["Josephson vortices"], "conviction": "medium", "so_what": "Robustness checks reduce (but do not eliminate) the false-positive risk that has dogged prior Majorana claims.", "quote": null, "locator": "Topological Insulator Josephson Junction Spectroscopy Metrics", "quote_verified": false}]}, {"theme": "Remaining hurdles to topological qubits", "insights": [{"claim": "With an energy resolution of about 30 μeV, the observed gap closing only establishes a transmission lower bound of τ ≥ 0.95 rather than definitive proof of a gapless transition, and long quasi-classical trajectories leave an incompletely proximitized 'soft gap'.", "speaker": "Mohamed Abdel-Kareem", "type": "contrarian", "entities": ["University of Cologne"], "conviction": "high", "so_what": "Topological quantum computing remains early-stage research; commercialization timelines should be discounted accordingly.", "quote": null, "locator": "The authors note critical engineering milestones", "quote_verified": false}, {"claim": "To progress toward braiding, the researchers propose moving to high-critical-field niobium electrodes and using charge-sensing electrometry to verify the 4π-periodic fermion parity flip.", "speaker": "Mohamed Abdel-Kareem", "type": "prediction", "entities": ["niobium", "ML4Q"], "conviction": "medium", "so_what": "Defines the next verifiable milestones to watch on this roadmap.", "quote": null, "locator": "To overcome these challenges on the roadmap", "quote_verified": false}]}], "insight_total": 6, "top_entities": ["University of Cologne", "RWTH Aachen University", "Science Advances", "BiSbTeSe2", "Majorana zero modes", "Fu-Kane", "RF-SQUID", "ML4Q"], "source_meta": {"author": "Mohamed Abdel-Kareem", "word_count": 639, "paywalled": false}}, {"record_id": "425aa7c7202de36e", "source_type": "technology", "source_name": "Semiconductor Engineering", "source_url": "https://semiengineering.com/fitting-ai-models-to-edge-applications/", "title": "Fitting AI Models To Edge Applications", "published_date": "2026-11-05", "language": "en", "processed_at": "2026-11-06T12:00:00Z", "processor": "claude-code-sub-opus", "tags": ["AI", "Tech"], "gist": "Executives from Imagination, Infineon/Imagimob, Rambus, Siemens EDA, Cadence and Synopsys argue that edge AI deployment is a systems problem: designers must define the must-have workload and choose a right-sized architecture first, then combine quantization, distillation, pruning and self-compression to close the gap. Memory capacity and bandwidth, not compute, are the binding constraints, and fragmented edge hardware (MCUs, NPUs, DSPs) makes tooling a key differentiator.", "themes": [{"theme": "Bandwidth and memory as the binding AI constraint", "insights": [{"claim": "Imagination Technologies' CTO Ed Plowman says compute is not the main AI bottleneck today; bandwidth is, which is why RAM has become so expensive and why research has shifted toward quantizing both weights and activations to shrink models.", "speaker": "Liz Allan", "type": "causal", "entities": ["Imagination Technologies", "Ed Plowman", "RAM"], "conviction": "high", "so_what": "Supports a memory-pricing and memory-supplier thesis while signaling demand for model-compression IP that reduces memory needs.", "quote": "compute resources are not the main problem at the moment. It’s bandwidth, and that’s why RAM has gotten so expensive.", "locator": "“This has led to a gold rush", "quote_verified": true}, {"claim": "Rambus' Steve Woo argues edge AI marks a shift from 'largest model wins' to 'experience per watt', with memory capacity and bandwidth remaining the limiting factors even after compression and lower-precision arithmetic.", "speaker": "Liz Allan", "type": "thesis", "entities": ["Rambus", "Steve Woo"], "conviction": "high", "so_what": "Reframes edge AI competition around efficiency metrics, favoring memory-interface and low-power IP vendors.", "quote": "Edge AI is ushering in a shift from ‘largest model wins’ to ‘experience per watt,'", "locator": "Others agree that system-level efficiency", "quote_verified": true}, {"claim": "Plowman says the combination of quantization, self-compression and distillation is making the gold rush for ever-bigger GPUs less prevalent as intelligent models become realistic on truly embedded platforms.", "speaker": "Liz Allan", "type": "contrarian", "entities": ["Imagination Technologies", "Ed Plowman", "GPUs"], "conviction": "medium", "so_what": "An IP vendor's view that compression could temper marginal GPU demand growth and redirect value toward embedded inference silicon.", "quote": "the gold rush for bigger and bigger GPUs is less prevalent", "locator": "The first step in right-sizing", "quote_verified": true}]}, {"theme": "Right-sizing starts with workload definition", "insights": [{"claim": "Infineon/Imagimob CTO Magnus Gedda says an edge model shares memory and compute with the rest of the application, so usable resources are smaller than the spec sheet suggests, and the initial architecture must be sized so its post-pruning/quantization version still fits and meets accuracy targets.", "speaker": "Liz Allan", "type": "framework", "entities": ["Imagimob", "Infineon Technologies", "Magnus Gedda"], "conviction": "high", "so_what": "Raises the value of design-time tooling that co-optimizes model architecture with target hardware.", "quote": "the available resources are smaller than the spec sheet suggests", "locator": "The model size must be considered", "quote_verified": true}, {"claim": "Siemens EDA's Sathish Balasubramanian says a 4-billion-parameter model is huge for a sensor even as cloud models reach 1 trillion parameters, and that baking must-have functions into sub-1-billion-parameter SLMs, ML or neural network models per sensor is doable.", "speaker": "Liz Allan", "type": "data_point", "entities": ["Siemens EDA", "Sathish Balasubramanian", "SLM"], "conviction": "high", "so_what": "Defines the parameter envelope for edge silicon, sizing on-device memory and NPU requirements.", "quote": "A 4-billion [parameter] model on a sensor is huge, even though we’re now talking 1 trillion [in the cloud].", "locator": "Each hardware function and end-device feature", "quote_verified": true}, {"claim": "Balasubramanian describes a three-tier feature framework (must-have, critical, nice-to-have) where must-have functions sit closest to the sensor in a self-contained loop with local compute, memory and backup, plus at least an hour or two of power envelope.", "speaker": "Liz Allan", "type": "framework", "entities": ["Siemens EDA", "Sathish Balasubramanian"], "conviction": "medium", "so_what": "Implies distributed intelligence across many sensors, expanding unit demand for small local compute and memory.", "quote": null, "locator": "“Those are the three categories", "quote_verified": false}, {"claim": "Cadence's Mick Posner notes physical AI has no one-size-fits-all compute profile: some workloads need always-on low-power inference while others need high-performance multimodal processing across cameras, radar, lidar, audio and environmental sensors.", "speaker": "Liz Allan", "type": "thesis", "entities": ["Cadence", "Mick Posner", "physical AI"], "conviction": "medium", "so_what": "Supports a heterogeneous, chiplet-based edge silicon market rather than a single dominant architecture.", "quote": "Right-sized inference for physical AI is critical", "locator": "Functions and workloads determine the correct model", "quote_verified": true}, {"claim": "Synopsys' Licinio Sousa says right-sizing is a systems problem balancing latency, power, cost and functional safety, and because AI models evolve faster than silicon development cycles, edge systems need flexibility to run future models.", "speaker": "Liz Allan", "type": "thesis", "entities": ["Synopsys", "Licinio Sousa"], "conviction": "high", "so_what": "Favors programmable/flexible NPU IP over fixed-function accelerators, a risk for rigid edge ASIC designs.", "quote": "As AI models evolve faster than silicon development cycles, systems also need enough flexibility", "locator": "For right-sizing, each IP block", "quote_verified": true}]}, {"theme": "Compression technique trade-offs", "insights": [{"claim": "Designers typically combine several compression techniques rather than one: distillation trains a smaller student to mimic a teacher, pruning removes low-impact weights or layers, quantization uses fewer bits, and self-compression gradually reduces precision potentially to zero bits.", "speaker": "Liz Allan", "type": "framework", "entities": ["quantization", "distillation", "pruning", "self-compression"], "conviction": "high", "so_what": "Maps the toolchain landscape where edge AI software and IP vendors compete.", "quote": null, "locator": "Fig. 1: Common ways to compress AI model", "quote_verified": false}, {"claim": "Plowman says distillation shrinks models drastically and retains more reasoning capability but carries inherent teacher-student loss, and works better on transformers than on traditional CNNs; beyond a point it must be paired with quantization.", "speaker": "Liz Allan", "type": "causal", "entities": ["Ed Plowman", "Imagination Technologies", "transformers", "CNNs"], "conviction": "medium", "so_what": "Transformer adoption at the edge increases the payoff from distillation tooling.", "quote": null, "locator": "For example, distillation enables drastic shrinking", "quote_verified": false}, {"claim": "Imagination's self-compression approach identifies low-sensitivity pathways during training and quantizes them down to zero bits; if outputs are unchanged, those pathways contributed little, and the method can target proprietary hardware.", "speaker": "Liz Allan", "type": "framework", "entities": ["Imagination Technologies", "self-compression"], "conviction": "medium", "so_what": "A differentiated IP-vendor technique that could lock customers into a specific hardware target.", "quote": "We look for the sensitivity to those pathways, then quantize and quantize and quantize them down to zero bits.", "locator": "A gentler way is self-compression", "quote_verified": true}, {"claim": "In automotive, quantization flows risk discarding long-tail data on rare edge cases needed for autonomous systems to handle unusual road conditions, so training-set data coverage is critical to managing loss.", "speaker": "Liz Allan", "type": "causal", "entities": ["automotive", "quantization"], "conviction": "medium", "so_what": "Safety-critical edge AI faces slower, costlier compression adoption, a headwind for aggressive edge cost-down in ADAS.", "quote": null, "locator": "For example, in automotive, engineers", "quote_verified": false}]}, {"theme": "Deployment fragmentation and automotive lag", "insights": [{"claim": "Gedda says deployment itself (converting to C code, compiling, flashing) is not hard, but edge hardware spanning MCUs, accelerators, NPUs and DSPs lacks standards, so without good tooling deployments are generic and inefficient or require heavy manual work per target.", "speaker": "Liz Allan", "type": "causal", "entities": ["Infineon Technologies", "Magnus Gedda", "MCUs", "NPUs", "DSPs"], "conviction": "high", "so_what": "Hardware fragmentation creates a moat for vendors that bundle silicon with optimization toolchains.", "quote": "Edge hardware is extremely varied — MCUs, accelerators, NPUs, DSPs — and standards are somewhat lacking.", "locator": "Choosing the wrong AI model", "quote_verified": true}, {"claim": "Plowman says much of the automotive industry still uses CNNs from three or four years ago and has not fully moved to transformers or the latest compression techniques.", "speaker": "Liz Allan", "type": "data_point", "entities": ["Ed Plowman", "automotive", "CNNs", "transformers"], "conviction": "medium", "so_what": "Signals a pending automotive architecture upgrade cycle toward transformer-capable inference silicon.", "quote": null, "locator": "In the automotive sector, companies", "quote_verified": false}, {"claim": "Automotive OEMs train their own models and keep them secret for safety, security and IP reasons, so IP providers rarely see full customer models and must optimize using proxies.", "speaker": "Liz Allan", "type": "anecdote", "entities": ["Imagination Technologies", "Ed Plowman", "automotive"], "conviction": "medium", "so_what": "Limits IP vendors' ability to co-optimize, favoring flexible general-purpose accelerator IP in automotive.", "quote": "The automotive guys train their own models, and they’re very secretive about them", "locator": "For IP providers tasked with optimizing", "quote_verified": true}]}], "insight_total": 15, "top_entities": ["Imagination Technologies", "Infineon Technologies", "Imagimob", "Rambus", "Siemens EDA", "Cadence", "Synopsys", "quantization", "distillation", "small language models", "automotive"], "source_meta": {"author": "Liz Allan", "word_count": 2873, "paywalled": false}}, {"record_id": "656ab7f6442f87d3", "source_type": "technology", "source_name": "Semiconductor Engineering", "source_url": "https://semiengineering.com/physical-ai-pushes-the-limits-of-hardware/", "title": "Physical AI Pushes The Limits Of Hardware", "published_date": "2026-11-05", "language": "en", "processed_at": "2026-11-06T12:00:00Z", "processor": "claude-code-sub-opus", "tags": ["AI", "Tech"], "gist": "Physical AI (robots, drones, vehicles), projected by PwC's Strategy& at roughly EUR 430 billion by 2030, is constrained less by compute than by a memory wall, power/thermal limits and safety validation. Industry voices from Synopsys, Arteris, Micron, Siemens EDA, Analog Devices, Imagination and Rambus point to w g in 2027 and datacenter exceeding 80% of revenue.", "themes": [{"theme": "HBM supply caps AMD's GPU share", "insights": [{"claim": "The author argues AMD is hurting Intel far more than Nvidia, mainly because AMD cannot obtain more HBM allocations from Samsung, SK Hynix and Micron to build more Instinct GPUs.", "speaker": "Timothy Prickett Morgan", "type": "thesis", "entities": ["AMD", "Nvidia", "Intel", "Samsung", "SK Hynix", "Micron", "HBM"], "conviction": "high", "so_what": "HBM supply, not demand or architecture, is the gating factor for AMD's AI GPU upside; HBM makers hold pricing power.", "quote": "AMD cannot make more Instinct GPUs because it cannot get more HBM allocations from Samsung, SK Hynix, and Micron", "locator": "But let’s be honest. AMD is hurting", "quote_verified": true}, {"claim": "AMD ships fewer GPUs than it could because the Instinct MI400 series carries much more HBM per GPU than Nvidia's Blackwell B200/B300 and Rubin R200, which the author says are intentionally under-memoried to maximize accelerator volumes.", "speaker": "Timothy Prickett Morgan", "type": "causal", "entities": ["AMD", "Instinct MI400", "Nvidia", "Blackwell", "Rubin"], "conviction": "medium", "so_what": "Memory-per-GPU design choices trade unit volume for performance balance, limiting AMD unit share under fixed HBM supply.", "quote": null, "locator": "But let’s be honest. AMD is hurting", "quote_verified": false}, {"claim": "The author estimates AMD's Q3 2026 Instinct GPU sales at $3.43 billion, up 72.3%, and says AMD could sell 5x, possibly 10x, that amount with more memory allocations and packaging capacity.", "speaker": "Timothy Prickett Morgan", "type": "data_point", "entities": ["AMD", "Instinct", "HBM"], "conviction": "high", "so_what": "Implies large latent AI GPU demand for AMD that is unlocked only by HBM and advanced-packaging supply.", "quote": "If AMD had 5X times the memory allocations and could line up the packaging for more GPUs, do I think it could sell them? Abso-freaking-lutely.", "locator": "If you make some assumptions about", "quote_verified": true}, {"claim": "The author proposes that AMD's Instinct MI500 use optical interposers and disaggregated, composable HBM on trays so memory can be reused as GPUs are swapped, which he says could give AMD an architectural edge over Nvidia's static configurations, though he doubts it will happen.", "speaker": "Timothy Prickett Morgan", "type": "contrarian", "entities": ["AMD", "Instinct MI500", "HBM", "Nvidia", "Florence", "Epyc"], "conviction": "exploratory", "so_what": "Flags memory disaggregation as a possible competitive lever given extreme DRAM costs.", "quote": null, "locator": "I would argue that the Instinct MI500", "quote_verified": false}]}, {"theme": "Widening Nvidia-AMD revenue gap", "insights": [{"claim": "Nvidia's revenue lead over AMD grew from 1.64x in 2021 ($26.9B vs $16.4B) to 2.69x in 2023 ($60.9B vs $22.7B) and an expected 6.79x in 2026 (about $354B vs $52.2B).", "speaker": "Timothy Prickett Morgan", "type": "data_point", "entities": ["Nvidia", "AMD"], "conviction": "high", "so_what": "Quantifies Nvidia's dominance; AMD is not closing the gap despite AI growth.", "quote": null, "locator": "In 2021, a year before the GenAI boom", "quote_verified": false}, {"claim": "One Wall Street consensus estimate, shown in Marvell's charts justifying its $115 billion acquisition of Lumentum, has Nvidia at $1,091 billion revenue in calendar 2029 versus $164 billion for AMD, a 6.65x gap essentially unchanged from 2026.", "speaker": "Timothy Prickett Morgan", "type": "prediction", "entities": ["Nvidia", "AMD", "Marvell", "Lumentum"], "conviction": "medium", "so_what": "Consensus assumes AMD grows in line with Nvidia but never gains relative share; also notes a major Marvell-Lumentum optical deal.", "quote": null, "locator": "In 2021, a year before the GenAI boom", "quote_verified": false}, {"claim": "The author attributes part of Nvidia's lead to AMD not owning the most lucrative AI networking segments (scale-across, scale-out and scale-up).", "speaker": "Timothy Prickett Morgan", "type": "causal", "entities": ["Nvidia", "AMD"], "conviction": "medium", "so_what": "Networking attach is a key Nvidia moat and revenue multiplier AMD lacks.", "quote": null, "locator": "In 2021, a year before the GenAI boom", "quote_verified": false}, {"claim": "The author argues the AI market is underserved rather than truly competitive, giving vendors pricing power and prompting hyperscalers, cloud builders and big model builders to design cheaper, specialized in-house compute engines.", "speaker": "Timothy Prickett Morgan", "type": "thesis", "entities": ["hyperscalers", "AMD", "Nvidia"], "conviction": "high", "so_what": "Supply-constrained AI market supports margins for all vendors while fueling custom-silicon demand.", "quote": "the AI market is not really competitive as much as it is underserved, which always gives pricing power to the vendors", "locator": "Genetics is not destiny", "quote_verified": true}]}, {"theme": "AMD Q3 2026 results", "insights": [{"claim": "AMD's Q3 2026 revenue rose 44.7% to $13.38 billion, operating income rose 2.2x to $2.83 billion, and net income rose 95.3% to $2.43 billion (18.2% of revenue), while cash more than doubled to $15.78 billion.", "speaker": "Timothy Prickett Morgan", "type": "data_point", "entities": ["AMD"], "conviction": "high", "so_what": "Strong margin expansion and balance sheet as Helios rack costs roll off.", "quote": null, "locator": "In Q3, AMD’s revenues were up", "quote_verified": false}, {"claim": "AMD's Data Center group revenue rose 96.9% to $8.55 billion, beating its 'more than 80 percent' growth target, with operating income up 2.7x to $2.88 billion, and datacenter now two-thirds of revenue.", "speaker": "Timothy Prickett Morgan", "type": "data_point", "entities": ["AMD", "Epyc", "Instinct", "Pensando"], "conviction": "high", "so_what": "AMD is now primarily a datacenter company, re-rating its e l, opening the door to both fossil-fuel and renewable buildout, which has produced an unusual coalition of supporters across parties and interest groups.", "speaker": "Casey Crownhart", "type": "framework", "entities": ["BAAJA"], "conviction": "high", "so_what": "Both gas infrastructure and clean-energy developers stand to benefit, rather than a clear sector winner.", "quote": "It opens the doors for the buildout of projects involving both fossil fuels and renewables.", "locator": "So in its 417 pages, BAAJA", "quote_verified": true}, {"claim": "BAAJA has two Republican and two Democratic Senate sponsors and is backed by the White House, whose Council of Economic Advisors found it would reduce review times and boost GDP.", "speaker": "Casey Crownhart", "type": "data_point", "entities": ["White House", "Council of Economic Advisors", "US Senate"], "conviction": "high", "so_what": "Executive support raises the odds of enactment in some form.", "quote": null, "locator": "The bill’s four sponsors in the Senate", "quote_verified": false}, {"claim": "The Senate vote on BAAJA is set for November 9, before the new Congress, but Democrats' midterm wins create uncertainty: the bill was expected to pass with mostly Republican votes plus a few Democrats, and Democrats could instead wait until they control both chambers next year, though any deal still needs Trump's signature.", "speaker": "Casey Crownhart", "type": "prediction", "entities": ["US Senate", "Democrats", "Trump", "BAAJA"], "conviction": "medium", "so_what": "Lame-duck timing is a binary catalyst for permitting-sensitive energy and infrastructure names.", "quote": null, "locator": "This bill is scheduled for a Senate vote", "quote_verified": false}]}, {"theme": "Stakeholder positions", "insights": [{"claim": "The American Clean Power Association largely supports BAAJA, with its analysis finding the bill could unlock 350 gigawatts of new clean energy for the grid.", "speaker": "Casey Crownhart", "type": "data_point", ng build constraints should let them win economically.", "speaker": "Casey Crownhart", "type": "causal", "entities": ["solar", "wind"], "conviction": "medium", "so_what": "Cost-competitiveness thesis underpins renewable developers' support for the bill.", "quote": null, "locator": "Many in the climate world have", "quote_verified": false}]}], "insight_total": 12, "top_entities": ["BAAJA", "Senate", "White House", "American Clean Power Association", "Natural Resources Defense Council", "Rhodium Group", "Resources for the Future", "Kevin Kircher", "Purdue", "Trump", "data centers", "natural gas"], "source_meta": {"author": "Casey Crownhart", "word_count": 963, "paywalled": false}}, {"record_id": "36216401d0aa0382", "source_type": "technology", "source_name": "MIT Technology Review", "source_url": "https://www.technologyreview.com/2026/11/04/1148049/roundtables-inside-the-quest-for-cognitive-immortality/", "title": "Roundtables: Inside the Quest for Cognitive Immortality", "published_date": "2026-11-04", "language": "en", "processed_at": "2026-11-06T12:00:00Z", "processor": "claude-code-sub-opus", "tags": ["Tech", "Society"], "gist": "Promotional listing for a subscriber-only MIT Technology Review Roundtables event on November 17, 2026, in which Mary Beth Griggs and Antonio Regalado discuss technologies aimed at extending the mind beyond death, such as gradual brain replacement and uploading memories to the cloud. Related links note drugmaker claims that GLP-1 weight-loss drugs reduce molecular markers of aging.", "themes": [{"theme": "Mind-preservation technologies", "insights": [{"claim": "Some technologists are pursuing ways to keep a person's mind going even beyond death, including gradual brain replacement and uploading memories to the cloud, which MIT Technology Review will cover in a subscriber-only event on November 17, 2026.", "speaker": "MIT Technology Review", "type": "anecdote", "entities": ["MIT Technology Review", "Antonio Regalado", "Mary Beth Griggs"], ": "Texas was the new epicenter of the AI data center buildout. That might be kaput.", "published_date": "2026-11-04", "language": "en", "processed_at": "2026-11-06T12:00:00Z", "processor": "claude-code-sub-opus", "tags": ["AI", "Energy", "Geopolitics", "Society", "Macro"], "gist": "Democrats won the Texas Senate seat, governorship and state House after campaigning against data centers, threatening the fastest-growing US data center market that hosts giga-projects like Stargate Frontier (1,820 MW) and Nexus Hubbard (6,400 MW). Outgoing Governor Abbott had already halted data center permits on September 21, and the governor-elect backs a moratorium, though fragmented local authority and construction-union ties may blunt follow-through.", "themes": [{"theme": "Texas political shift against data centers", "insights": [{"claim": "In the 2026 midterms Democrat James Talarico beat Ken Paxton for US Senate, Gina Hinojosa unseated Governor Greg Abbott, and Democrats won control of the Texas House for the first time in 24 years, with Talarico and Hinojosa making data centers a central campaign issue.", "speaker": "James O'Donnell", "type": "data_point", "entities": ["James Talarico", "Ken Paxton", "Gina Hinojosa", "Greg Abbott", "Texas"], "conviction": "high", "so_what": "The most build-friendly US data center jurisdiction now has leadership hostile to the sector.", "quote": null, "locator": "Democrat James Talarico won the US", "quote_verified": false}, {"claim": "Governor Greg Abbott reversed course before the election: developers said his office stopped answering emails, and on September 21 he directed a key state regulator to halt data center permits.", "speaker": "James O'Donnell", "type": "data_point", "entities": ["Greg Abbott", "Texas"], "conviction": "high", "so_what": "Permitting freeze is already in effect, threatening timelines for new Texas projects regardless of the transition.", "quote": null, "locator": "Developers said the governor’s office", "quote_verified ngful Texas-specific regulatory risk.", "quote": null, "locator": "Nexus Hubbard, also under construction", "quote_verified": false}]}, {"theme": "Financing and macro spillovers", "insights": [{"claim": "Possible Texas delays and moratoriums add to anxiety that the AI buildout could stall, as banks and lenders are already getting pickier about which data center projects they finance.", "speaker": "James O'Donnell", "type": "causal", "entities": ["banks", "data centers"], "conviction": "medium", "so_what": "Tighter project finance plus policy risk raises cost of capital for AI infrastructure.", "quote": "Banks and lenders are already getting pickier about the projects they back.", "locator": "The potential for Democrats to order", "quote_verified": true}, {"claim": "Because the data center buildout is underpinning US economic growth, a combined policy and financing slowdown could ripple through the broader economy.", "speaker": "James O'Donnell", "type": "thesis", "entities": ["data centers"], "conviction": "medium", "so_what": "AI capex slowdown is a macro growth risk, not just a sector risk.", "quote": null, "locator": "And given the extent to which", "quote_verified": false}]}, {"theme": "National voter backlash", "insights": [{"claim": "US midterm voters nationwide backed measures protecting ratepayers from data-center-driven electricity bill increases and favored some broader bans on new data centers.", "speaker": "James O'Donnell", "type": "data_point", "entities": ["data centers"], "conviction": "high", "so_what": "Ratepayer-protection rules may shift grid-upgrade costs onto hyperscalers.", "quote": null, "locator": "Voters around the country, though", "quote_verified": false}, {"claim": "The midterm results show Big Tech has failed to convince voters that AI-powered abundance will improve health care, lower prices, and speed scientific breakthroughs.", "speaker": "James O'Donnell", "type": "thesis", "entities": ["Big Tech"], "conviction": "high", "so_what": "Social license for AI infrastructure is eroding, raising political risk across jurisdictions.", "quote": "Big Tech has fumbled its effort to sell voters on the idea that AI-powered abundance will make health care better, goods cheaper, and scientific breakthroughs more common", "locator": "If we needed any more convincing", "quote_verified": true}]}, {"theme": "Limits on follow-through", "insights": [{"claim": "County voting did not track data center presence cleanly: Dallas County went blue, but Ellis County, which leads Texas in data center permitting requests, and west Texas hubs Mitchell and Scurry counties voted red, while Cameron County shifted blue.", "speaker": "James O'Donnell", "type": "data_point", "entities": ["Ellis County", "Dallas County", "Cameron County", "Mitchell County", "Scurry County"], "conviction": "medium", "so_what": "Host communities may still favor projects, supporting local resistance to state bans.", "quote": null, "locator": "It’s complicated: The counties where", "quote_verified": false}, {"claim": "Because Texas data center approvals involve city, county, and state offices, and construction unions backed some Democratic campaigns, a statewide moratorium may prove much harder to implement than to campaign on.", "speaker": "James O'Donnell", "type": "contrarian", "entities": ["construction unions", "Texas"], "conviction": "medium", "so_what": "Headline risk may overstate actual project cancellations in Texas.", "quote": "election winners may find that following through on their opposition once in office is much more complicated than campaigning on it", "locator": "Local officials who have some say", "quote_verified": true}]}], "insight_total": 12, "top_entities": ["Texas", "Gina Hinojosa", "Greg Abbott", "James Talarico", "Stargate Frontier", "Nexus Hubbard", "Anthropic", "Meta", "SpaceX", "Big Tech", "Ellis County", "DCD"], "source_meta": {"author": "James O'Donnell", "word_count": 873, "paywalled": false}}, {"record_id": "1ba02a76b85e7658", "source_type": "technology", "source_name": "Wood Mackenzie", "source_url": "https://www.woodmac.com/blogs/the-edge/putting-the-renew-into-renewables/", "title": "Putting the 'renew’ into renewables | Wood Mackenzie", "published_date": "2026-11-05", "language": "en", "processed_at": "2026-11-06T12:00:00Z", "processor": "claude-code-sub-opus", "tags": ["Energy"], "gist": "Wood Mackenzie argues that more than 70% of the world's 3.5 TW of wind and solar capacity will face a decommission, extend or repower decision in the 2040s, and that repowering is economically compelling because it reuses grid connections and permits while capturing large technology gains. Equipment suppliers are the biggest winners, with global equipment sales potentially more than 60% higher in 2050 than today even as net additions slow.", "themes": [{"theme": "Scale of ageing renewable fleet", "insights": [{"claim": "Wood Mackenzie forecasts that over 70% of the more than 3.5 TW of wind and solar capacity operating worldwide by end-2025 will face a decommission, life-extension or repowering decision in the 2040s.", "speaker": "Simon Flowers", "type": "prediction", "entities": ["Wood Mackenzie"], "conviction": "high", "so_what": "Creates a multi-terawatt replacement market independent of new greenfield demand.", "quote": null, "locator": "How big is the decommissioning challenge?", "quote_verified": false}, {"claim": "Almost 50 GW of global wind capacity is now over 20 years old, roughly the design life of early turbines, rising to over 230 GW by 2040, and solar capacity older than 20 years will overtake wind before 2040.", "speaker": "Simon Flowers", "type": "data_point", "entities": ["Wood Mackenzie"], "conviction": "high", "so_what": "Wind repowering is the near-term opportunity; solar follows in the late 2030s.", "quote": null, "locator": "Ageing wind projects are the most pressing", "quote_verified": false}, {"claim": "Decommissioning will drive 44% of wind and almost a quarter of solar buildout worldwide in the 2040s, with even higher shares in established markets across Europe, Asia and the Americas.", "speaker": "Simon Flowers", "type": "prediction", "entities": ["Europe", "Asia", "Americas"], "conviction": "medium", "so_what": "Mature markets' renewable demand will increasingly be replacement-driven.", "quote": null, "locator": "The distribution of repowering opportunities", "quote_verified": false}]}, {"theme": "Repowering economics", "insights": [{"claim": "Repowering has capital and operating costs on par with greenfield projects, so its advantage comes mainly from higher output from newer technology, plus the ability to skip grid-connection queues and often clear permitting faster.", "speaker": "Simon Flowers", "type": "causal", "entities": ["Wood Mackenzie"], "conviction": "high", "so_what": "Existing sites with grid interconnection are valuable assets given connection-queue bottlenecks.", "quote": "Given the site will always outlast the equipment, repowered projects can also skip grid-connection queues and often clear permitting faster.", "locator": "Does repowering make economic sense?", "quote_verified": true}, {"claim": "In Germany, decommissioned wind sites have average wind speeds 4% higher than new greenfield projects, delivering higher capacity factors and lower levelised cost of energy when repowered.", "speaker": "Simon Flowers", "type": "data_point", "entities": ["Germany"], "conviction": "high", "so_what": "Early-deployed sites occupy the best resource, favoring owners of legacy portfolios.", "quote": null, "locator": "Location matters. In Germany", "quote_verified": false}, {"claim": "Without repowering, growth in global annual wind and solar installations risks stalling as policy support softens, requiring more coal and gas to fill the gap.", "speaker": "Simon Flowers", "type": "causal", "entities": ["coal", "gas"], "conviction": "medium", "so_what": "Repowering policy is a swing factor for future thermal generation demand n Flowers", "type": "prediction", "entities": ["Germany", "Wood Mackenzie"], "conviction": "medium", "so_what": "Repowering is a deflationary force on European power prices.", "quote": null, "locator": "Repowering can side-step this", "quote_verified": false}]}, {"theme": "Winners: equipment suppliers", "insights": [{"claim": "Repowering could make global wind and solar equipment sales more than 60% higher in 2050 than today even as annual net capacity additions decline, making equipment suppliers the biggest beneficiaries alongside consumers.", "speaker": "Simon Flowers", "type": "thesis", "entities": ["equipment suppliers"], "conviction": "medium", "so_what": "Supports a long-duration replacement demand thesis for turbine and module OEMs.", "quote": null, "locator": "Who gains most from repowering?", "quote_verified": false}, {"claim": "Wood Mackenzie argues repowering could usher in an era with more wind and solar installations than ever, and that planning for renewal should already be on the agenda amid volatile fossil fuel prices.", "speaker": "Simon Flowers", "type": "thesis", "entities": ["Wood Mackenzie"], "conviction": "medium", "so_what": "Strategic positioning for repowering pipelines is relevant to capital allocation now.", "quote": "Repowering could usher in an era of renewal and lead to more wind and solar installations than ever before.", "locator": "Repowering could usher in an era", "quote_verified": true}]}], "insight_total": 12, "top_entities": ["Wood Mackenzie", "Germany", "European Commission", "Søren Lassen", "Charles Coppins", "wind turbine", "solar modules", "equipment suppliers"], "source_meta": {"author": "Simon Flowers", "word_count": 1204, "paywalled": false}}, {"record_id": "a9bdd120b9049dbc", "source_type": "technology", "source_name": "Wood Mackenzie", "source_url": "https://www.woodmac.com/horizons/why-oil-refineries-must-evolve-to-survive/", "title": "Adapt or die: Why oil refineries must evolve to survive", "published_date": "2026-11-05", "language": "en", "processed_at": "2026-11-06T12:00:00Z", "processor": "claude-code-sub-opus", "tags": ["Energy", "Geopolitics", "Macro"], "gist": "Wood Mackenzie's Horizons report argues that with refined product demand peaking at 108 mb/d in 2032, about 20% of global refining capacity on a falling-margin 'down escalator' faces closure risk, and today's record margins from the Middle East conflict and Russian refinery damage are temporary. It segments the 700-plus refineries into five archetypes with typical capacity, complexity and net cash margin ranges, and maps eight adaptation strategies plus exit routes, concluding that non-first-quartile refiners must plan their pivot away from transport fuels before 2040.", "themes": [{"theme": "Structural demand decline and rationalisation", "insights": [{"claim": "Wood Mackenzie expects slowing population growth, electrification and fuel efficiency gains to make global oil demand peak in the early 2030s, with refined product demand rising from 105 mb/d in 2025 to 108 mb/d in 2032 before declining.", "speaker": "Chris Barry", "type": "prediction", "entities": ["Wood Mackenzie"], "conviction": "high", "so_what": "Defines the terminal-demand horizon for downstream oil valuations.", "quote": null, "locator": "Slowing population growth, electrification and", "quote_verified": false}, {"claim": "Refinery rationalisation will be the defining global feature of the next decade, with an estimated 20% of existing capacity on a 'down escalator' of falling or negative net cash margin and increasingly at risk of closure.", "speaker": "Chris Barry", "type": "prediction", "entities": ["Wood Mackenzie"], "conviction": "high", "so_what": "Closures of a fifth of capacity would reshape regional product balances and support survivors' margins.", "quote": null, "locator": "This, though, is capacity added locally", "quote_verified": false}, {"claim": "Because new refineries target first-quartile margins and major upgrades push sites up the cost curve, refiners that do nothing are pushed down toward lower margins, effectively riding a downward escalator.", "speaker": "Chris Barry", "type": "framework", "entities": ["net cash margin"], "conviction": "high", "so_what": "Under-investing refiners face steady competitive erosion even before demand falls.", "quote": "refiners who do nothing are effectively on a downward escalator", "locator": "Competitive position is a key attribute", "quote_verified": true}, {"claim": "India alone is expected to host 40% of global refining capacity additions to 2030 as part of a self-reliance push, an exception where demand growth and security-of-supply concerns override weak global economics.", "speaker": "Chris Barry", "type": "data_point", "entities": ["India"], "conviction": "high", "so_what": "Indian capacity growth adds export competition in Asian and global product markets.", "quote": null, "locator": "Against a backdrop of declining demand", "quote_verified": false}, {"claim": "Refiners that are not first-quartile performers need to plan a pivot away from transport fuels and decide its timing now, because 2040 is only three to four turnaround cycles away.", "speaker": "Chris Barry", "type": "thesis", "entities": ["Wood Mackenzie"], "conviction": "high", "so_what": "Strategic capex decisions for most refiners must be made within this decade.", "quote": null, "locator": "The broader ecosystem will contain", "quote_verified": false}]}, {"theme": "Margin drivers and current shock", "insights": [{"claim": "Refining is a conversion business whose margins are driven by crack spreads between products and crude rather than the oil price itself, so long-run benchmark margins are thin while structurally advantaged refiners significantly outperform.", "speaker": "Chris Barry", "type": "framework", "entities": ["crack spreads"], "conviction": "high", "so_what": "Refiner equity exposure is to cracks and competitive position, not crude direction.", "quote": null, "locator": "All eyes on refining", "quote_verified": false}, {"claim": "Disruption to Middle Eastern oil supply since the start of the Middle East conflict, compounded by damage to Russian refineries, has pushed benchmark refining margins to record highs and forced many countries to ban product exports, impose commercial curfews or release strategic reserves.", "speaker": "Chris Barry", "type": "data_point", "entities": ["Middle East", "Russia"], "conviction": "high", "so_what": "Refiners are earning windfall margins tied to a geopolitical shock.", "quote": null, "locator": "The spotlight has been on refiners", "quote_verified": false}, {"claim": "Wood Mackenzie expects currently elevated refining margins to return to more modest levels when the Middle East conflict ends, given the sector's highly competitive nature.", "speaker": "Chris Barry", "type": "prediction", "entities": ["Middle East"], "conviction": "medium", "so_what": "Peak-margin earnings should not be capitalised into long-run refiner valuations.", "quote": null, "locator": "The highly competitive nature of the sector", "quote_verified": false}, {"claim": "Refining earns lower returns on capital than upstream, making it harder for downstream companies to access capital for the investments needed to adapt.", "speaker": "Chris Barry", "type": "causal", "entities": ["upstream", "downstream"], "conviction": "high", "so_what": "Integrated majors may deprioritise refining capex in favor of upstream.", "quote": null, "locator": "The highly competitive nature of the sector", "quote_verified": false}]}, {"theme": "Sources of competitive advantage and history", "insights": [{"claim": "Refinery competitive advantage comes from access to lower-cost crude, complex configurations that upgrade cheap crudes, advantaged access to demand centres, upstream or downstream integration, and low energy, labour and emissions costs, many of which are location-dependent and not replicable elsewhere.", "speaker": "Chris Barry", "type": "framework", "entities": ["Wood Mackenzie"], "conviction": "high", "so_what": "Location-based advantages provide durable moats that capex alone cannot copy.", "quote": null, "locator": "Competitive advantage is secured through combinations", "quote_verified": false}, {"claim": "Scale matters for investment economics but affects net cash margin only by lowering per-barrel fixed costs, since it is fixed at construction.", "speaker": "Chris Barry", "type": "framework", "entities": ["net cash margin"], "conviction": "medium", "so_what": "Complexity and location are better margin predictors than size alone.", "quote": null, "locator": "Many of these factors are location/country", "quote_verified": false}, {"claim": "Refining has repeatedly restructured, from vertically integrated majors' assets to a low-margin overcapacity sector after the 1980s rise of commodity markets, to the 2000s Middle East and Asia build-out driven by national goals of energy resilience and industrialisation rather than commercial returns.", "speaker": "Chris Barry", "type": "anecdote", "entities": ["Middle East", "Asia", "oil majors"], "conviction": "medium", "so_what": "State-driven capacity has long suppressed merchant refining returns.", "quote": null, "locator": "A history of adaptation, resilience and", "quote_verified": false}]}, {"theme": "Five refinery archetypes", "insights": [{"claim": "Large-scale, high-complexity refineries typically run 300-600 kb/d of crude capacity with complexity of 12-15 and net cash margins above $10/bbl, exemplified by US Gulf Coast majors, modern Middle East export refineries and Nigeria's Dangote refinery.", "speaker": "Chris Barry", "type": "data_point", "entities": ["US Gulf Coast", "Dangote refinery", "Middle East"], "conviction": "high", "so_what": "These assets are the structural winners best placed to become integrated energy parks.", "quote": null, "locator": "Archetypal refining characteristics", "quote_verified": false}, {"claim": "Complex chemical-integrated refineries typically have 200-400 kb/d capacity, complexity of 8-12 and net cash margins of $5-10/bbl, and can shift output from declining transport fuels into petrochemicals, a model increasingly used by new highly integrated mega-sites in China.", "speaker": "Chris Barry", "type": "data_point", "entities": ["China", "Europe", "Asia"], "conviction": "high", "so_what": "Chinese integrated mega-sites strengthen their position as fuel demand falls.", "quote": null, "locator": "Archetypal refining characteristics", "quote_verified": false}, {"claim": "Coastal cracking refineries, the most common type and the configuration of most OECD refineries, typically have 150-250 kb/d capacity, complexity of 6-10 and net cash margins of $2-5/bbl, and their coastal location exposes them to international competition.", "speaker": "Chris Barry", "type": "data_point", "entities": ["OECD"], "conviction": "high", "so_what": "The bulk of OECD refining sits in a thin-margin, closure-prone archetype.", "quote": null, "locator": "Coastal cracking. The most common", "quote_verified": false}, {"claim": "Small-scale speciality refineries (20-30 kb/d, complexity 1-4, NCM $0-4/bbl) focus on lubricants, bitumen, waxes and solvents with limited transport-fuel exposure, while small low-complexity refineries (20-50 kb/d, NCM below zero), often protected NOC assets in developing countries, keep operating despite losses.", "speaker": "Chris Barry", "type": "data_point", "entities": ["NOCs"], "conviction": "high", "so_what": "Loss-making protected NOC plants depend on state subsidy, a fiscal risk for host governments.", "quote": null, "locator": "Archetypal refining characteristics", "quote_verified": false}]}, {"theme": "Product demand and decarbonisation", "insights": [{"claim": "EV uptake will hit gasoline demand hardest, while diesel/gasoil and jet/kerosene stay comparatively resilient, LPG and naphtha are supported by petrochemical feedstock growth, and speciality products like lubricants, waxes, bitumen and sulphur remain largely unaffected by the transition.", "speaker": "Chris Barry", "type": "causal", "entities": ["gasoline", "diesel", "jet fuel", "LPG", "naphtha"], "conviction": "high", "so_what": "Yield slate determines which refineries lose most from EV adoption.", "quote": null, "locator": "Changes driving adaptation", "quote_verified": false}, {"claim": "European refineries are more likely than Asian or Middle Eastern competitors to invest in operational decarbonisation due to national and EU emissions policy, but because carbon capture and green hydrogen have not scaled, cutting end-use emissions via products such as SAF, which can reduce emissions up to 80% versus jet fuel, may be more viable.", "speaker": "Chris Barry", "type": "causal", "entities": ["EU", "sustainable aviation fuel", "green hydrogen"], "conviction": "medium", "so_what": "European refiners carry higher compliance capex burdens than global peers.", "quote": null, "locator": "The energy transition requires decarbonisation", "quote_verified": false}]}, {"theme": "Adaptation strategies", "insights": [{"claim": "Petrochemical integration is the primary offset to declining road-fuel demand but is attractive mainly at world scale, led by state-backed Asian and Middle Eastern exporters, while smaller EU and US simple and cracking refineries likely lack the scale to compete.", "speaker": "Chris Barry", "type": "framework", "entities": ["Asia", "Middle East", "EU", "US"], "conviction": "high", "so_what": "Western mid-size refiners are unlikely winners in petchem integration.", "quote": null, "locator": "Petrochemical integration", "quote_verified": false}, {"claim": "Bio and circular conversion to renewable diesel and SAF using used cooking oil, pyrolysis oil, recycled plastics and second-generation ethanol is technologically mature, but competition for limited quality renewable feedstocks will constrain it, and it fits best for EU coastal refineries near premium markets.", "speaker": " // ---------- helpers ----------
// YouTube-aligned hex colors for tinted insight chips (bg = color+"1a", text = color, border = color+"55").
const TYPE_HEX = {
  thesis: '#6366f1', prediction: '#0ea5e9', framework: '#8b5cf6',
  data_point: '#7c3aed', causal: '#d97706', contrarian: '#dc2626',
  anecdote: '#64748b',
};
const CONV_HEX = { high: '#7c3aed', medium: '#ca8a04', low: '#94a3b8', exploratory: '#94a3b8' };
function typeHex(t) { return TYPE_HEX[String(t || '').toLowerCase()] || '#475569'; }
function convHex(c) { return CONV_HEX[String(c || '').toLowerCase()] || '#64748b'; }

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }

// Tinted chip (YouTube style): faint bg, colored text + border.
function tintChip(text, color) {
  return `<span class="chip" style="background:${color}1a;color:${color};border-color:${color}55">${escapeHtml(text)}</span>`;
}
function tagPills(tags) {
  if (!tags || !tags.length) return '';
  return tags.map(t => `<span class="pill tag">${escapeHtml(t)}</span>`).join(' ');
}

// ---------- rendering ----------
// Insight presentation ported from the YouTube digest: type/conviction tinted
// chips, speaker as a 🗣 chip, and entities as indigo chips — all in the meta row
// directly under the claim. Quote treatment is INTENTIONALLY kept as Concepts'
// verbatim + "✓ verified" (stronger than YouTube's ≈ paraphrase wording).
function renderInsight(ins) {
  if (!ins) return '';
  const cls = 'insight' + (ins.type ? (' ' + String(ins.type).toLowerCase()) : '');
  const meta = [];
  if (ins.type) meta.push(tintChip(ins.type, typeHex(ins.type)));
  if (ins.speaker) meta.push(`<span class="chip chip-spk">🗣 ${escapeHtml(ins.speaker)}</span>`);
  if (ins.conviction) meta.push(tintChip('conviction: ' + ins.conviction, convHex(ins.conviction)));
  (ins.entities || []).slice(0, 12).forEach(e => {
    if (e) meta.push(`<span class="chip chip-ent">${escapeHtml(e)}</span>`);
  });
  let quote = '';
  if (ins.quote) {
    const v = ins.quote_verified
      ? `<span class="vmark">✓ verified</span>`
      : `<span class="vmark no">unverified</span>`;
    quote = `<div class="quote">“${escapeHtml(ins.quote)}”${v}</div>`;
  }
  const so = ins.so_what
    ? `<div class="insight-so"><span class="lbl">so what</span>${escapeHtml(ins.so_what)}</div>` : '';
  return `
    <div class="${cls}">
      <div class="insight-claim">${escapeHtml(ins.claim || '')}</div>
      <div class="insight-meta">${meta.join('')}</div>
      ${so}
      ${quote}
    </div>`;
}

function renderTheme(theme) {
  const insights = (theme.insights || []).map(renderInsight).join('');
  return `
    <div class="theme">
      <div class="theme-title">${escapeHtml(theme.theme || 'Theme')}</div>
      ${insights}
    </div>`;
}

function renderCard(card) {
  if (!card) return '';
  const meta = card.source_meta || {};
  const nameHtml = card.source_url
    ? `<a class="source-name" href="${escapeAttr(card.source_url)}" target="_blank" rel="noopener">${escapeHtml(card.source_name || '')}</a>`
    : `<span class="source-name">${escapeHtml(card.source_name || '')}</span>`;
  const subBits = [];
  if (card.published_date) subBits.push(escapeHtml(card.published_date));
  if (meta.author) subBits.push(escapeHtml(meta.author));
  if (meta.word_count) subBits.push(`${meta.word_count} words`);
  if (meta.paywalled) subBits.push('paywalled');
  const themes = (card.themes || []).map(renderTheme).join('');
  const n = card.insight_total != null ? card.insight_total
            : (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
  return `
    <div class="source">
      <div class="source-head" onclick="toggleSource(this)">
        <div class="source-meta-left">
          <div class="source-name-row">${nameHtml}</div>
          <div class="source-title">${escapeHtml(card.title || '')}</div>
          <div class="source-sub">${subBits.join('  ·  ')}</div>
        </div>
        <span class="source-count">${n} insight${n === 1 ? '' : 's'}</span>
        <span class="source-arrow">▸</span>
      </div>
      <div class="source-body">
        ${card.gist ? `<div class="gist">${escapeHtml(card.gist)}</div>` : ''}
        ${card.tags && card.tags.length ? `<div class="tags">${tagPills(card.tags)}</div>` : ''}
        ${themes || '<div class="empty">No insights.</div>'}
      </div>
    </div>`;
}

function renderTopStats(d) {
  const s = d.stats || {};
  const parts = [];
  if (d.date) parts.push(`date <strong>${escapeHtml(d.date)}</strong>`);
  if (s.lookback_days != null) parts.push(`lookback <strong>${s.lookback_days}d</strong>`);
  if (s.sources != null) parts.push(`sources <strong>${s.sources}</strong>`);
  if (s.cards != null) parts.push(`cards <strong>${s.cards}</strong>`);
  if (s.insights != null) parts.push(`insights <strong>${s.insights}</strong>`);
  if (s.quote_verified_pct != null) parts.push(`quotes verified <strong>${s.quote_verified_pct}%</strong>`);
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSource(headEl) { headEl.parentElement.classList.toggle('open'); }

function insightCount(card) {
  return (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
}

// Build the sort/filter control bar (display only — re-groups REPORT_DATA in place).
function buildControls(d) {
  const cards = d.cards || [];
  const names = [...new Set(cards.map(c => c.source_name || '—'))].sort((a, b) => a.localeCompare(b));
  const opts = names.map(n => `<option value="${escapeAttr(n)}">${escapeHtml(n)}</option>`).join('');
  document.getElementById('controls').innerHTML =
    `<label>Sort
       <select id="sortSel">
         <option value="source">Source A–Z</option>
         <option value="insights">Insight count ▼</option>
       </select></label>
     <label>Source
       <select id="srcSel">
         <option value="__all">All sources (${names.length})</option>
         ${opts}
       </select></label>
     <span class="ctl-btns">
       <button type="button" id="expandAll">Expand all</button>
       <button type="button" id="collapseAll">Collapse all</button>
     </span>`;
  document.getElementById('sortSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('srcSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('expandAll').addEventListener('click', () => setAllGroups(false));
  document.getElementById('collapseAll').addEventListener('click', () => setAllGroups(true));
}

// Group-level collapse: header click toggles one group; the control-bar buttons toggle all.
function toggleGroup(headEl) { headEl.parentElement.classList.toggle('collapsed'); }
function setAllGroups(collapsed) {
  document.querySelectorAll('.group').forEach(g => g.classList.toggle('collapsed', collapsed));
}

// Group cards by source, sort groups (and cards within), optionally filter to one source.
function renderGroups(d) {
  const sortMode = (document.getElementById('sortSel') || {}).value || 'source';
  const srcFilter = (document.getElementById('srcSel') || {}).value || '__all';
  let cards = (d.cards || []).slice();
  if (srcFilter !== '__all') cards = cards.filter(c => (c.source_name || '—') === srcFilter);

  const groups = new Map();
  cards.forEach(c => {
    const k = c.source_name || '—';
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(c);
  });
  let entries = [...groups.entries()].map(([name, cs]) => ({
    name, cards: cs, insights: cs.reduce((a, c) => a + insightCount(c), 0),
  }));
  if (sortMode === 'insights') entries.sort((a, b) => b.insights - a.insights || a.name.localeCompare(b.name));
  else entries.sort((a, b) => a.name.localeCompare(b.name));
  // Within each source group, heaviest cards first.
  entries.forEach(e => e.cards.sort((a, b) => insightCount(b) - insightCount(a)));

  const html = entries.map(e => {
    const head = `<div class="group-head" onclick="toggleGroup(this)">`
      + `<span class="group-name">${escapeHtml(e.name)}</span>`
      + `<span class="group-meta">${e.cards.length} card${e.cards.length === 1 ? '' : 's'} · ${e.insights} insights</span>`
      + `<span class="group-arrow">▾</span></div>`;
    return `<div class="group">${head}<div class="group-body">${e.cards.map(renderCard).join('')}</div></div>`;
  }).join('');

  const app = document.getElementById('app');
  app.innerHTML = html || '<div class="empty">No cards for this source.</div>';
  // Open the first two source cards by default.
  document.querySelectorAll('.source').forEach((sec, i) => { if (i < 2) sec.classList.add('open'); });
}

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  document.getElementById('stats-top').innerHTML = renderTopStats(d);
  buildControls(d);
  renderGroups(d);   // default: grouped, sorted by source A–Z
}

renderReport(REPORT_DATA);
</script>
