const CAT_COLORS = {
  macro: "#e24b4a", credit: "#378add", positioning: "#ef9f27", "AI/infra": "#1d9e75",
  crypto: "#7f77dd", geopolitics: "#d85a30", energy: "#f97316", tech: "#06b6d4",
  gold: "#d4a017", culture: "#ec4899", labor: "#8b5cf6", regulation: "#64748b",
  science: "#14b8a6", venture: "#84cc16"
};

const URGENCY_META = {
  act: { label: "🔴 Act Now", emoji: "🔴" },
  deep: { label: "🔵 Deep", emoji: "🔵" },
  watch: { label: "🟡 Watch", emoji: "🟡" }
};

let activeCat = "all";
let activeUrg = "all";
let activeSrc = null;

function hexToRgba(hex, a) {
  var r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return "rgba(" + r + "," + g + "," + b + "," + a + ")";
}

function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}

function toggleCard(id) {
  var el = document.getElementById('card-' + id);
  el.classList.toggle('open');
}

function setCatFilter(cat) {
  activeCat = cat;
  activeSrc = null;
  render();
}
function setUrgFilter(urg) {
  activeUrg = urg;
  activeSrc = null;
  render();
}
function filterBySrc(name) {
  activeSrc = name;
  activeCat = "all";
  activeUrg = "all";
  render();
  setTimeout(function() {
    ITEMS.forEach(function(item) {
      if (item.source.indexOf(name) !== -1) {
        var el = document.getElementById('card-' + item.id);
        if (el) el.classList.add('open');
      }
    });
  }, 30);
}

function buildHeader() {
  document.getElementById('headerMeta').textContent =
    META.date + " · " + META.time + " · " + META.itemsExtracted + " items from " + META.emailsRead + " emails";
}

function buildFilters() {
  var catCounts = {};
  ITEMS.forEach(function(i) { catCounts[i.cat] = (catCounts[i.cat] || 0) + 1; });
  var catRow = document.getElementById('catFilters');
  var allPill = document.createElement('div');
  allPill.className = 'pill' + (activeCat === 'all' ? ' active' : '');
  if (activeCat === 'all') allPill.style.background = '#333';
  allPill.textContent = 'All (' + ITEMS.length + ')';
  allPill.onclick = function() { setCatFilter('all'); };
  catRow.appendChild(allPill);
  Object.keys(catCounts).sort().forEach(function(cat) {
    var pill = document.createElement('div');
    var color = CAT_COLORS[cat] || '#888';
    pill.className = 'pill' + (activeCat === cat ? ' active' : '');
    if (activeCat === cat) pill.style.background = color;
    else pill.style.color = color, pill.style.borderColor = color;
    pill.textContent = cat + ' (' + catCounts[cat] + ')';
    pill.onclick = function() { setCatFilter(cat); };
    catRow.appendChild(pill);
  });

  var urgCounts = {};
  ITEMS.forEach(function(i) { urgCounts[i.urgency] = (urgCounts[i.urgency] || 0) + 1; });
  var urgRow = document.getElementById('urgFilters');
  var allUrgPill = document.createElement('div');
  allUrgPill.className = 'pill' + (activeUrg === 'all' ? ' active' : '');
  if (activeUrg === 'all') allUrgPill.style.background = '#333';
  allUrgPill.textContent = 'All (' + ITEMS.length + ')';
  allUrgPill.onclick = function() { setUrgFilter('all'); };
  urgRow.appendChild(allUrgPill);
  ['act','deep','watch'].forEach(function(urg) {
    if (!urgCounts[urg]) return;
    var pill = document.createElement('div');
    pill.className = 'pill' + (activeUrg === urg ? ' active' : '');
    if (activeUrg === urg) pill.style.background = '#555';
    pill.textContent = URGENCY_META[urg].label + ' (' + urgCounts[urg] + ')';
    pill.onclick = function() { setUrgFilter(urg); };
    urgRow.appendChild(pill);
  });
}

function buildCards() {
  var container = document.getElementById('cards');
  container.innerHTML = '';
  ITEMS.forEach(function(item) {
    var visible = (activeCat === 'all' || item.cat === activeCat) &&
                  (activeUrg === 'all' || item.urgency === activeUrg) &&
                  (activeSrc === null || item.source.indexOf(activeSrc) !== -1);
    var color = CAT_COLORS[item.cat] || '#888';
    var card = document.createElement('div');
    card.className = 'card' + (visible ? '' : ' hidden');
    card.id = 'card-' + item.id;

    var chartFlag = '';
    if (item.charts.hot) chartFlag = '🔥';
    else if (item.charts.count > 0) chartFlag = '📊';

    var headerHtml =
      '<span class="idx">' + String(item.id).padStart(2,'0') + '</span>' +
      '<span class="urg">' + URGENCY_META[item.urgency].emoji + '</span>' +
      '<span class="badge-source" style="background:' + color + '">' + item.source.split(' (')[0].split(' —')[0] + '</span>' +
      '<span class="badge-cat">' + item.cat + '</span>' +
      (chartFlag ? '<span class="chart-flag">' + chartFlag + '</span>' : '') +
      '<span class="card-title">' + item.title + '</span>';

    var chartClass = 'chart-placeholder' + (item.charts.hot ? ' hot' : '');
    var chartHtml = item.charts.count > 0 || item.charts.desc
      ? '<div class="' + chartClass + '">' + (item.charts.hot ? '🔥 CHART WORTH SAVING — ' : (item.charts.count > 0 ? '📊 ' : '')) + item.charts.desc + '</div>'
      : '';

    var bodyHtml =
      '<div class="section-label">The Idea</div>' +
      '<div class="idea-text">' + item.idea + '</div>' +
      '<div class="section-label">My Angle</div>' +
      '<div class="angle-box" style="border-left-color:' + color + '; background:' + hexToRgba(color, 0.06) + '">' + item.angle + '</div>' +
      '<div class="section-label">Tweets</div>' +
      '<div class="tweets">' +
        '<div class="tweet-box">' +
          '<div class="tweet-label a">TWEET A</div>' +
          '<div class="tweet-text">' + item.tweetA + '</div>' +
          '<button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button>' +
        '</div>' +
        '<div class="tweet-box">' +
          '<div class="tweet-label b">TWEET B</div>' +
          '<div class="tweet-text">' + item.tweetB + '</div>' +
          '<button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button>' +
        '</div>' +
      '</div>' +
      chartHtml +
      '<a class="read-link" href="' + item.link + '" target="_blank">↗ Read full article</a>';

    var headerEl = document.createElement('div');
    headerEl.className = 'card-header';
    headerEl.innerHTML = headerHtml;
    headerEl.onclick = function() { toggleCard(item.id); };

    var bodyEl = document.createElement('div');
    bodyEl.className = 'card-body';
    bodyEl.innerHTML = bodyHtml;

    card.appendChild(headerEl);
    card.appendChild(bodyEl);
    container.appendChild(card);
  });
}

function buildReport() {
  var incRows = META.includedSources.map(function(s) {
    return '<tr><td><span class="src-link" onclick="filterBySrc(\'' + s.name.replace(/'/g,"\\'") + '\')">' + s.name + '</span></td><td>' + s.items + ' item' + (s.items===1?'':'s') + ' / ' + s.emails + ' email' + (s.emails===1?'':'s') + '</td></tr>';
  }).join('');
  var skipRows = META.skippedSources.map(function(s) {
    return '<li><strong>' + s.name + '</strong> — ' + s.reason + '</li>';
  }).join('');
  document.getElementById('reportBody').innerHTML =
    '<div class="section-label">Time Window</div>' +
    '<div>' + META.windowStart + ' → ' + META.windowEnd + '. Emails outside this window were not processed.</div>' +
    '<div class="section-label">Emails</div>' +
    '<div>' + META.emailsInWindow + ' emails found in window, ' + META.emailsRead + ' read in full, ' + META.itemsExtracted + ' items extracted.</div>' +
    '<div class="section-label">Included Sources (click to filter)</div>' +
    '<table>' + incRows + '</table>' +
    '<div class="section-label">Skipped Sources</div>' +
    '<ul>' + skipRows + '</ul>';
}

document.getElementById('reportHeader').onclick = function() {
  document.getElementById('reportCard').classList.toggle('open');
};

function render() {
  buildFilters_container_reset();
  buildFilters();
  buildCards();
}
function buildFilters_container_reset() {
  document.getElementById('catFilters').innerHTML = '';
  document.getElementById('urgFilters').innerHTML = '';
}

buildHeader();
buildReport();
render();
</script>
