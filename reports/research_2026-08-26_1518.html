function esc(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function buildFilters() {
  const catCounts = {};
  ITEMS.forEach(i => { catCounts[i.cat] = (catCounts[i.cat]||0)+1; });
  const catWrap = document.getElementById("catFilters");
  let html = '<button class="pill' + (activeCat==="all"?" active":"") + '" style="' + (activeCat==="all"?"background:#333;":"") + '" onclick="setCat(\'all\')">All (' + ITEMS.length + ')</button>';
  Object.keys(catCounts).sort().forEach(c => {
    const color = CAT_COLORS[c] || "#888";
    const isActive = activeCat === c;
    html += '<button class="pill' + (isActive?" active":"") + '" style="' + (isActive ? ("background:"+color+";border-color:"+color+";") : ("color:"+color+";border-color:"+color+";")) + '" onclick="setCat(\'' + c + '\')">' + esc(c) + ' (' + catCounts[c] + ')</button>';
  });
  catWrap.innerHTML = html;

  const urgCounts = {};
  ITEMS.forEach(i => { urgCounts[i.urgency] = (urgCounts[i.urgency]||0)+1; });
  const urgWrap = document.getElementById("urgFilters");
  let uhtml = '<button class="pill' + (activeUrg==="all"?" active":"") + '" style="' + (activeUrg==="all"?"background:#333;":"") + '" onclick="setUrg(\'all\')">All (' + ITEMS.length + ')</button>';
  ["act","deep","watch"].forEach(u => {
    if (!urgCounts[u]) return;
    const isActive = activeUrg === u;
    uhtml += '<button class="pill' + (isActive?" active":"") + '" style="' + (isActive ? "background:#555;" : "") + '" onclick="setUrg(\'' + u + '\')">' + URG_LABEL[u] + ' (' + urgCounts[u] + ')</button>';
  });
  urgWrap.innerHTML = uhtml;
}

function setCat(c) { activeCat = c; activeSrc = null; buildFilters(); renderCards(); }
function setUrg(u) { activeUrg = u; activeSrc = null; buildFilters(); renderCards(); }
function filterBySrc(name) {
  activeSrc = name; activeCat = "all"; activeUrg = "all";
  buildFilters(); renderCards();
  ITEMS.forEach(item => {
    if (item.source.indexOf(name) !== -1) {
      const body = document.getElementById("body-" + item.id);
      if (body) body.classList.add("open");
    }
  });
}

function renderCards() {
  const wrap = document.getElementById("cards");
  let html = "";
  ITEMS.forEach(item => {
    const matchCat = activeCat === "all" || item.cat === activeCat;
    const matchUrg = activeUrg === "all" || item.urgency === activeUrg;
    const matchSrc = !activeSrc || item.source.indexOf(activeSrc) !== -1;
    const visible = matchCat && matchUrg && matchSrc;
    const color = CAT_COLORS[item.cat] || "#888";
    const chartFlag = item.charts.hot ? "🔥" : (item.charts.count > 0 ? "📊" : "");
    html += '<div class="card' + (visible?"":" hidden") + '" id="card-' + item.id + '">';
    html += '<div class="card-head" onclick="toggleCard(' + item.id + ')">';
    html += '<span class="idx">' + String(item.id).padStart(2,"0") + '</span>';
    html += '<span class="urg">' + URG_EMOJI[item.urgency] + '</span>';
    html += '<span class="badge" style="background:' + color + '">' + esc(item.source) + '</span>';
    html += '<span class="cat-tag">' + esc(item.cat) + '</span>';
    html += '<span class="chart-flags">' + chartFlag + '</span>';
    html += '<span class="card-title">' + esc(item.title) + '</span>';
    html += '</div>';
    html += '<div class="card-body" id="body-' + item.id + '">';

    html += '<div class="tweets">';
    html += '<div class="tweet-box"><div class="tweet-label a">TWEET A</div><div class="tweet-text">' + esc(item.tweetA) + '</div><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button></div>';
    html += '<div class="tweet-box"><div class="tweet-label b">TWEET B</div><div class="tweet-text">' + esc(item.tweetB) + '</div><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div>';
    html += '</div>';
    html += '<div class="chart-block' + (item.charts.hot?" hot":"") + '">' + (item.charts.hot ? "🔥 CHART WORTH SAVING — " : (item.charts.count>0 ? "📊 " : "")) + esc(item.charts.desc) + '</div>';
    html += '<a class="read-link" href="' + esc(item.link) + '" target="_blank">↗ Read full article</a>';
    html += '</div>';
    html += '</div>';
  });
  wrap.innerHTML = html;
}

function toggleCard(id) {
  const body = document.getElementById("body-" + id);
  body.classList.toggle("open");
}

function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}
