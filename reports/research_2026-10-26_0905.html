<script>
const ITEMS = [{"cat": "geopolitics", "urgency": "act", "source": "Authers / Bloomberg Points of Return", "title": "Lula holds the presidency; Brazil ETFs gap down 16% instantly, Bolsonaro wants the vote annulled", "idea": "Authers leads with 'a huge shock': Lula survived the runoff and Brazil ETFs gave up 16% immediately. Bolsonaro is contesting and asking for annulment, analysis due tomorrow. The market had priced a different outcome.", "angle": "Binary election gap with a contested-result tail. Watch EWZ, Petrobras, BRL on the open and whether annulment noise keeps a risk premium in.", "tweetA": "Brazil ETFs -16% before the first coffee. The tell isn't Lula winning, it's that positioning was so one-sided a normal-ish outcome registers as a crash. Now add a loser calling for annulment: that's a premium that doesn't mean-revert on day one. $EWZ $PBR", "tweetB": "Milei, Trump, now Brazil breaking the other way. Hemisphere-wide 'rightward shift' was a consensus trade, and consensus trades get repriced by one ballot. Which LatAm election is next and who is still long the narrative?", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening"}, "link": "https://www.bloomberg.com/opinion/newsletters/2026-10-26/surfing-the-ai-bond-wave-in-increments-of-fear", "id": 1}, {"cat": "geopolitics", "urgency": "act", "source": "MacroEdge", "title": "Brazil is the first big rejection of the hemisphere's rightward shift: Petrobras -15% overnight, index seen opening ~-20%", "idea": "MacroEdge frames Brazil as the first major Western Hemisphere rejection of the rightward wave (Milei, Trump) and expects it to continue over 2 years as 'populism whack-a-mole'. Markets slated to open down ~20%, Petrobras down ~15% in the overnight session. Notes no candidate can solve the underlying problems.", "angle": "Different framing from Authers: regime/political-cycle read rather than a one-day gap. Note the -20% implied open vs -16% ETF move: sizing the overreaction is the trade.", "tweetA": "If the Brazil open really is -20%, the ETF's -16% overnight print is the soft number. Local-hours liquidity is where positioning gets forced out, not where it gets priced. $EWZ", "tweetB": "Everyone will write 'left beats right' by lunchtime. The investable version: incumbents everywhere are getting punished for the same cost-of-living shock, whatever flag they carry. Oil at these levels is the common factor.", "charts": {"count": 0, "hot": false, "desc": "No chart in email"}, "link": "https://www.macroedge.world/p/weekly-macro-note-99-red-balloons", "id": 2}, {"cat": "energy", "urgency": "deep", "source": "Authers / Bloomberg Points of Return", "title": "Brent 12-month-forward hasn't been this high since 2022; Nov-2027 contract has never been this high", "idea": "Authers says the market has dropped the 'war ends soon' optimism: the rolling 12m-forward Brent is at post-Ukraine-invasion highs and the Nov 2027 contract is at an all-time high. Spot starts the week above $115. The driver is expected re-escalation in the Gulf once US and Israeli elections are over, risking permanent damage to production facilities.", "angle": "The back end moving is the signal: this is a supply-capacity repricing, not a spot spike. It also sets up the Fed dilemma and the AI/bond wave break.", "tweetA": "Spot is noise. The Nov-2027 Brent contract printing an all-time high means the curve is pricing damaged infrastructure, not a delayed ceasefire. That changes capex math for every refiner and every airline CFO. $XOM $VLO $DAL", "tweetB": "Election calendar as an oil model: nobody escalates before the midterms, then the lame-duck window opens. The curve is already trading November. Are you?", "charts": {"count": 1, "hot": true, "desc": "Brent 12m-forward rolling contract and Nov-2027 contract at record - 🔥 CHART WORTH SAVING"}, "link": "https://www.bloomberg.com/opinion/newsletters/2026-10-26/surfing-the-ai-bond-wave-in-increments-of-fear", "id": 3}, {"cat": "energy", "urgency": "deep", "source": "MacroEdge", "title": "Oil enters the $98-108 'fierce battle zone' with the Strait and the Bab effectively closed", "idea": "MacroEdge says oil gapped lower Sunday because neither Trump nor Netanyahu escalated before elections, and that crude is entering its hardest price range since the conflict began, harder than when SPRs were released. Strait and Bab remain effectively closed, 'one side will be forced to blink'. Argues real-terms oil isn't hitting US consumers yet but will hurt the GOP at the polls; jet and diesel are crushing airlines and freight.", "angle": "Note the level disagreement with Authers (>$115 Brent vs a $98-108 zone): worth checking which contract each uses. Three-scenario oil path is paywalled.", "tweetA": "One newsletter has Brent above $115, another has a $98-108 'battle zone'. When two competent desks can't agree on the level, size positions for the range, not the point. Jet and diesel are where the pain shows first. $JETS", "tweetB": "Closed Strait, closed Bab, and the market's biggest oil move of the weekend was 'nobody escalated before the election.' That's not de-escalation, it's a scheduled catalyst.", "charts": {"count": 0, "hot": false, "desc": "Paywalled oil scenarios"}, "link": "https://www.macroedge.world/p/weekly-macro-note-99-red-balloons", "id": 4}, {"cat": "macro", "urgency": "deep", "source": "Authers / Bloomberg Points of Return", "title": "AI up, bonds down: the 'AI/bond wave' is a feedback loop, and oil is the undertow", "idea": "Authers: booming AI raises the case for higher rates, while prohibitive long rates raise doubts over AI groups' financing; NDX vs 20Y+ Treasury ETF shows a spectacular wave that crested in the last month. The pivotal tests this week are Alphabet, Amazon and Microsoft earnings and next month's Anthropic IPO. Higher oil could push money into Treasuries as a haven and crash the wave.", "angle": "It's a covariance story: AI capex and term premium are the same trade. If oil flips Treasuries to a haven, the hedge/risk correlation changes.", "tweetA": "The market's two biggest trends are the same trade in disguise: AI capex needs cheap long money, and AI capex is what's keeping long money expensive. The only thing that breaks the loop is a shock that makes bonds rally for the wrong reason. $QQQ $TLT", "tweetB": "Three things decide this week: hyperscaler capex guides, Wednesday's FOMC and the oil curve. If you only have a view on one, you don't have a view on the wave.", "charts": {"count": 1, "hot": true, "desc": "NDX ETF vs 20Y+ Treasury ETF 'wave' - 🔥 CHART WORTH SAVING"}, "link": "https://www.bloomberg.com/opinion/newsletters/2026-10-26/surfing-the-ai-bond-wave-in-increments-of-fear", "id": 5}, {"cat": "ai/infra", "urgency": "act", "source": "Authers / Bloomberg Points of Return", "title": "SOX down 19% in three weeks; Alphabet, Amazon, Microsoft report and Anthropic IPO next month as swing factors", "idea": "The semiconductor index is down 19% in three weeks. Authers says AI sentiment is in 'an intense bout of skepticism' and that a successful Anthropic IPO could restore confidence while a bad one would do the opposite. Asia's busiest earnings week is also in focus.", "angle": "A -19% SOX move is bear-market-in-a-quarter territory for the highest-beta AI leg. The IPO is now explicitly framed as a market-level sentiment event.", "tweetA": "SOX -19% in three weeks and the market's proposed fix is an IPO. When the supply of AI paper is the cure for the AI selloff, ask who is on the other side of that paper. $SOXX $NVDA", "tweetB": "Hyperscaler prints this week plus a mega-IPO next month: the AI trade has moved from 'does capex pay' to 'who funds the next trillion.' Different question, different winners.", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening"}, "link": "https://www.bloomberg.com/opinion/newsletters/2026-10-26/surfing-the-ai-bond-wave-in-increments-of-fear", "id": 6}, {"cat": "macro", "urgency": "deep", "source": "Authers / Bloomberg Points of Return", "title": "Warsh abandons forward guidance; Fed 'random walk' lets the bond market set policy odds", "idea": "Rate-hike odds swung each time hot September CPI hit and a Fed speaker pulled them back; Williams and Warsh (IMF speech) talked down urgency before the blackout. Authers says Warsh looks forced into retreat already. The 10Y and the market's 1-year-forward fed funds have moved in lockstep; Kaletsky argues the Fed drives bonds because trend-following hedge funds and algos only care about short rates. Bessent's buyback move was aimed at quelling the 'market fever'.", "angle": "If the curve is driven by short-rate expectations and the Fed won't guide, vol sits in the front end. Hold on Wednesday, but the presser is the risk.", "tweetA": "Warsh wanted to scrap forward guidance. Three weeks later the Fed's own officials are guiding the market back down after every CPI print. You can't run a random walk when 10Y yields are what the Treasury is watching. $TLT $ZT", "tweetB": "Kaletsky's point is the one to steal: the long end is dominated by short-horizon money that doesn't care about 10Y fundamentals. Then term premium is a positioning variable, not a macro one. That's a very different hedge.", "charts": {"count": 2, "hot": false, "desc": "Hike-odds swings through blackout; 10Y vs 1y-fwd fed funds"}, "link": "https://www.bloomberg.com/opinion/newsletters/2026-10-26/surfing-the-ai-bond-wave-in-increments-of-fear", "id": 7}, {"cat": "macro", "urgency": "deep", "source": "MacroEdge", "title": "MacroEdge expects a December hike signal after PCE: hot print means ~90% December odds", "idea": "Fed expected to hold Wednesday, but PCE lands after the decision. MacroEdge says a hot PCE would take December hike odds to ~90% and further pressure the AI/data-center financing machine. Claims policymakers' real target is 3-4% CPI. Warsh is 'no Powell' for now; UMich on the Friday before the midterms is likely an all-time low.", "angle": "Sequencing: FOMC hold, then Thursday GDP/PCE, then UMich. The risk is the Fed saying nothing while the data speaks.", "tweetA": "A Fed that holds Wednesday and gets a hot PCE Thursday is a Fed that hikes in December by default, with the press conference as the only chance to say otherwise. The data lands after the guidance. Order of events is the trade.", "tweetB": "UMich at an all-time low, a 3-4% 'real' inflation target and a hike on the table. That's stagflation vocabulary arriving in the same week as hyperscaler earnings. Position for dispersion, not direction.", "charts": {"count": 0, "hot": false, "desc": "No chart in email"}, "link": "https://www.macroedge.world/p/weekly-macro-note-99-red-balloons", "id": 8}, {"cat": "macro", "urgency": "deep", "source": "TMAD (Trading Mindset and Data)", "title": "TMAD Weekly: 'Widest daily drawdown since Covid' going into FOMC and Q3 GDP week", "idea": "Weekly preview: FOMC Wednesday with a 3.75-4.00% hold expected and the Chair's presser, followed by the Q3 GDP advance estimate on Thursday. The author flags the order of the releases as important to how data lands. The email teases weekly top trades and SPX levels, including $CRWD $OKTA $NET $FTNT. Most detail is behind the link.", "angle": "Title implies a Covid-scale daily move: pair it with the SOX -19%.", "tweetA": "'Widest daily drawdown since Covid' and the Fed hold is the consensus. When the biggest down day in years leaves policy unchanged, the level of confidence in the next print becomes the vol surface. $SPX", "tweetB": "Cyber names ($CRWD $OKTA $NET $FTNT) showing up on a weekly trade list the same week an 'energy-related hack' scares the timeline. Is security the AI-adjacent trade that holds up?", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening"}, "link": "https://www.tmad.news/p/tmad-weekly-widest-daily-drawdown", "id": 9}, {"cat": "positioning", "urgency": "deep", "source": "Dark Side of the Boom (Morgan Stanley's Savone)", "title": "Momentum has had nearly as many violent daily moves in ten months as the entire dot-com collapse", "idea": "Morgan Stanley's Nick Savone (via Dark Side of the Boom): technology momentum has seen nearly as many violent daily moves in ten months as during the whole dot-com collapse, while the broader equity market holds up. Hedge funds are scrambling to cut exposure. Strong earnings no longer guarantee positive reactions as investors question AI returns.", "angle": "Crowded-factor unwind with a stable index is the pattern that precedes rotation. Connect to SOX -19%.", "tweetA": "Ten months of momentum daily moves rivals the whole dot-com bust, and the S&P is only wobbling. That's not a crash, it's a factor liquidation. The index is hiding who actually got hurt.", "tweetB": "'Good earnings, stock down' is the signal the cycle has changed from rewarding capex to auditing it. Next hyperscaler print: watch revenue per capex dollar, not the capex headline.", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening"}, "link": "https://thedarksideoftheboom.substack.com/p/the-glass-is-half-full-but-wall-street", "id": 10}, {"cat": "gold", "urgency": "watch", "source": "Dark Side of the Boom (Morgan Stanley's Savone)", "title": "Gold failed to rally even as yields fell; French sovereign stress rising", "idea": "Dark Side of the Boom's takeaway: gold's 'extraordinary failure' to rally alongside falling yields, mounting French sovereign stress and the rotation toward quality suggest the next opportunity may be elsewhere than the old leaders. The email truncates the detail.", "angle": "Gold not responding to lower yields suggests real-rate sensitivity is no longer the driver; oil/term-premium regime competes. French spreads are the stress gauge.", "tweetA": "Yields fall, gold doesn't rally. Either the haven bid moved to the dollar and Treasuries, or real rates stopped being gold's driver. I'm leaning to the second. $GLD $TLT", "tweetB": "France stress plus an oil shock plus a Fed that can't guide. Europe is where the sovereign-risk version of this week lives. Bund-OAT spread is the chart. $FXE", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening"}, "link": "https://thedarksideoftheboom.substack.com/p/the-glass-is-half-full-but-wall-street", "id": 11}, {"cat": "ai/infra", "urgency": "deep", "source": "Michael Parekh / AI: Reset to Zero", "title": "OpenAI's discounts are pulling Replit and Rippling from Anthropic: Rippling's Anthropic coding share went 57% to 18%", "idea": "Per The Information via Parekh: Rippling's engineers went from 57% Anthropic / 16% OpenAI in May to 52% OpenAI / 18% Anthropic now, because OpenAI was cheaper. Replit moved most spend after OpenAI offered 30%+ off a $100M+/yr contract and Anthropic refused to extend a discount unless Replit committed to more. Switching took hours of code changes.", "angle": "Token demand is real but share is renting, not owned. This is the cleanest evidence of low switching costs in frontier models.", "tweetA": "Rippling's AI coding mix flipped from 57% to 18% for one lab in five months. Same engineers, same work, switch took hours. Whatever the moat is in model APIs, it isn't lock-in.", "tweetB": "A US bank doubled its seats to 500 for the same ~$40k a year: under $7 a seat a month vs a typical $20+. That's not a price war, it's a price floor being found in public.", "charts": {"count": 0, "hot": false, "desc": "No chart in email"}, "link": "https://michaelparekh.substack.com/p/ai-anthropics-margin-openais-opportunity", "id": 12}, {"cat": "ai/infra", "urgency": "deep", "source": "Michael Parekh / AI: Reset to Zero", "title": "Anthropic IPO math: ~75% gross margin, $5.6B compute on $11.5B Q2 revenue, but growth slowed from doubling to +45% QoQ", "idea": "Anthropic spent $5.6B on compute (including new model development) on $11.5B Q2 revenue and tells partners ~75% gross margin on existing models. Q2 to Q3 revenue grew 45%, down from more than doubling the prior quarter. It was ~50% larger than OpenAI over the summer; Ramp spend data now shows them neck and neck. OpenAI has projected compute costs above revenue.", "angle": "Prospectus tension: match discounts and dent margins, or hold price and give up share. Bears the IPO sentiment that Authers says could rescue or sink AI trade.", "tweetA": "+45% QoQ is a number most companies would sell a kidney for. But the same IPO had a quarter that more than doubled, and the market prices the second derivative. Growth deceleration at a 75% gross margin is the story the roadshow has to tell.", "tweetB": "OpenAI is buying share with margin it doesn't have yet, Anthropic is defending margin it can't be sure it keeps. One of them is wrong about elasticity, and the IPOs are the tests.", "charts": {"count": 0, "hot": false, "desc": "No chart in email"}, "link": "https://michaelparekh.substack.com/p/ai-anthropics-margin-openais-opportunity", "id": 13}, {"cat": "ai/infra", "urgency": "deep", "source": "Michael Parekh / AI: Reset to Zero", "title": "Wholesale resellers (Replit, Cursor, Cognition) are the canary: SpaceX bought Cursor for $60B+ and is moving it to Grok", "idea": "Parekh: apps that resell model tokens live on the spread, so they move first and fastest. SpaceX bought Cursor for over $60B in June (largest private tech M&A) and Cursor has been shifting away from Anthropic to OpenAI and Grok. Cognition, Meta and Microsoft are building alternatives; Microsoft's Copilot routes to the cheapest adequate model while paying Anthropic over $2B a year. SpaceX has ~$85B committed data-center capacity rented to Anthropic.", "angle": "Vertical integration (compute landlord + model + app) is the real structural risk to independent labs.", "tweetA": "SpaceX is landlord ($85B of capacity to Anthropic), customer, and competitor via Grok and Cursor. Nobody in the 2000s telecom cycle had a counterparty that complicated. Read the lease terms before the S-1 narrative.", "tweetB": "Copilot now routes to the cheapest model that can do the job. That's a commodity market structure forming in real time: a broker in front of the labs. Who earns the spread?", "charts": {"count": 0, "hot": false, "desc": "No chart in email"}, "link": "https://michaelparekh.substack.com/p/ai-anthropics-margin-openais-opportunity", "id": 14}, {"cat": "ai/infra", "urgency": "watch", "source": "Michael Parekh / AI: Reset to Zero", "title": "OpenRouter share flips twice in a month; open models set the floor: DeepSeek ~28 cents vs $25 for comparable coding output", "idea": "OpenAI overtook Anthropic as most-used provider on OpenRouter a month ago; after Opus 5.5 launched late last month Anthropic retook the lead and was twice OpenAI over the past week. DeepSeek charged about 28 cents for coding output that cost $25 on the top Anthropic model. Better models win business back quickly.", "angle": "Leapfrogging is the equilibrium. Pricing power is a function of release cadence, not contracts.", "tweetA": "$25 vs 28 cents is an ~89x gap and the premium lab still took share back in a week by shipping a better model. Pricing power in AI is a cadence business, not a moat business.", "tweetB": "Share on routing marketplaces whipsaws monthly while capex commitments run for years. Match your duration to the thing that's actually sticky.", "charts": {"count": 0, "hot": false, "desc": "No chart in email"}, "link": "https://michaelparekh.substack.com/p/ai-anthropics-margin-openais-opportunity", "id": 15}, {"cat": "ai/infra", "urgency": "act", "source": "BowTiedBull", "title": "Elon calls for a slowdown in AI infrastructure buildout and takes aim at 'neoclouds'", "idea": "BowTiedBull flags a weekend of Elon calling for a slowdown in AI infra build-out; MacroEdge separately says Elon's posts on neoclouds and data centers are bringing lesser-known realities into public view and signal a cycle shift. Two sources, same event.", "angle": "The most prominent AI infra builder questioning the buildout, while his own company rents $85B of capacity to a lab. The neocloud credit complex is the soft spot.", "tweetA": "When one of the largest AI capex spenders starts publicly talking about neocloud economics, read it as credit commentary. The part of the stack levered to GPU collateral values is where the stress shows first. $CRWV $NBIS", "tweetB": "MacroEdge calls the Elon posts a 'cycle shift'. I'd call them an exit signal for marginal financing. Hyperscalers self-fund, neoclouds don't.", "charts": {"count": 0, "hot": false, "desc": "Paywalled"}, "link": "https://bowtiedbull.io/p/cost-cutting-ai-slowdown-and-big", "id": 16}, {"cat": "labor", "urgency": "watch", "source": "BowTiedBull", "title": "Layoff wave at high-headcount large caps: eBay, Netflix, Uber", "idea": "BowTiedBull lists a wave of layoffs at large caps known for high headcounts (eBay, Netflix, Uber among the larger ones this year) alongside expected earnings increases for mega-cap tech.", "angle": "Margin-through-headcount while AI capex rises. Check the ECI Friday for wage pressure vs layoffs.", "tweetA": "Earnings up, headcount down at Netflix, Uber and eBay. That's the AI productivity trade showing up as margin before it shows up in GDP. The labour data Friday (ECI) has to square with it.", "tweetB": "Layoffs at profitable companies are a statement about expected demand or about substitution. Pick one, because they have opposite equity implications.", "charts": {"count": 0, "hot": false, "desc": "Paywalled"}, "link": "https://bowtiedbull.io/p/cost-cutting-ai-slowdown-and-big", "id": 17}, {"cat": "regulation", "urgency": "deep", "source": "Authers / Bloomberg Points of Return", "title": "Treasury proposes curbs on US investment in Chinese biotech under the outbound investment law", "idea": "Treasury's proposed rule under last year's Comprehensive Outbound Investment National Security Act would add biotech to covered sectors and prohibit investments involving small molecules, biologics and formance, healthcare vs tech, deals charts"}, "link": "https://www.bloomberg.com/opinion/newsletters/2026-10-26/surfing-the-ai-bond-wave-in-increments-of-fear", "id": 19}, {"cat": "geopolitics", "urgency": "watch", "source": "Authers / Bloomberg Points of Return", "title": "UK budget Wednesday: first from new chancellor Healey seen pushing 'hard choices to another day'", "idea": "The UK budget lands Wednesday. Authers uses it for a digression on 'purdah', the traditional pre-budget silence, which Fed officials still observe before FOMC meetings.", "angle": "Gilts into FOMC day. Fiscal-event risk stacked on a central bank day.", "tweetA": "UK budget and FOMC on the same day, and one of them is promising to defer difficult decisions. Gilts have been the pressure valve for that before. $EWU", "tweetB": "Purdah, as a tradition, only works when the market believes silence. With everyone leaking and every desk modelling, silence is just a gap in information.", "charts": {"count": 0, "hot": false, "desc": "No chart"}, "link": "https://www.bloomberg.com/opinion/newsletters/2026-10-26/surfing-the-ai-bond-wave-in-increments-of-fear", "id": 20}, {"cat": "crypto", "urgency": "deep", "source": "Checkonchain", "title": "Bitcoin: disbelief rally or bear-market rally? Sentiment indices overlaid on onchain investor profitability", "idea": "Checkonchain's collaboration with Michael Sullivan (Bitcoin Sentiment Weekly) overlays sentiment among plebs, OGs and traders with onchain profitability to find where the herd's emotion diverges from fundamentals. The full analysis is premium; the stated frame is whether this is the 'fabled disbelief rally' or another bear rally.", "angle": "Contrarian read: sentiment fear with profitable holders is bullish; sentiment greed with holders in loss is a trap. Wait for the data in the paywalled piece.", "tweetA": "Disbelief rallies and bear-market rallies look identical on price. The difference is who holds the coins: if profitable long-term holders ar var COLORS={"macro":"#e24b4a","credit":"#378add","positioning":"#ef9f27","ai/infra":"#1d9e75","crypto":"#7f77dd","geopolitics":"#d85a30","energy":"#f97316","tech":"#06b6d4","gold":"#d4a017","culture":"#ec4899","labor":"#8b5cf6","regulation":"#64748b","science":"#14b8a6","venture":"#84cc16"};
var UE={act:"🔴",deep:"🔵",watch:"🟡"};
var fc="all",fu="all",fs=null;
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}
function card(it){
  var c=COLORS[it.cat]||"#888";
  var ch=it.charts.count>0?(it.charts.hot?" 🔥":" 📊"):"";
  var h='<div class="card" id="c'+it.id+'"><div class="hd" onclick="tog('+it.id+')"><span class="num">'+it.id+'</span><span>'+UE[it.urgency]+'</span><span class="badge" style="background:'+c+'">'+esc(it.source)+'</span><span class="tag">'+it.cat+'</span><span>'+ch+'</span><span class="ttl">'+esc(it.title)+'</span></div><div class="body">';
  h+='<div class="lbl">The Idea</div><div>'+esc(it.idea)+'</div>';
  h+='<div class="angle" style="border-color:'+c+';background:'+c+'14"><b>MY ANGLE</b> '+esc(it.angle)+'</div>';
  h+='<div class="tw"><div><div class="lbl" style="color:#378add">Tweet A</div>'+esc(it.tweetA)+'<br><button class="copy-btn" onclick="copyTweet(' + it.id + ',\'a\')">📋 Copy</button></div>';
  h+='<div><div class="lbl" style="color:#7f77dd">Tweet B</div>'+esc(it.tweetB)+'<br><button class="copy-btn" onclick="copyTweet(' + it.id + ',\'b\')">📋 Copy</button></div></div>';
  h+='<div class="chart'+(it.charts.hot?' hot':'')+'">'+(it.charts.count>0?'📊 '+it.charts.count+' chart(s): ':'')+esc(it.charts.desc)+'</div>';
  h+='<div style="margin-top:10px"><a href="'+it.link+'" target="_blank" rel="noopener">↗ Read full article</a></div></div></div>';
  return h;
}
function tog(id){document.getElementById('c'+id).classList.toggle('open');}
function render(){

    if(fs&&it.source.indexOf(fs)<0)return;out+=card(it);});

function bars(){

  var u=[["all","All"],["act","🔴 Act Now"],["deep","🔵 Deep"],["watch","🟡 Watch"]];h="";

function filterBySrc(name){fs=name;fc="all";fu="all";bars();render();}

}
