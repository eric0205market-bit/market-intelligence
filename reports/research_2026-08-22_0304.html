    charts: { count: 0, hot: false, desc: "" },

const META = {
  date: "2026-08-22",
  time: "03:04 CEST",
  windowStart: "2026-08-21 21:04 CEST",
  windowEnd: "2026-08-22 03:04 CEST",
  emailsInWindow: 12,
  emailsRead: 12,
  itemsExtracted: 36,
  includedSources: [
    { name: "Daily Chartbook", count: 5 },
    { name: "Dark Side of the Boom", count: 6 },
    { name: "Zineb Riboua", count: 5 },
    { name: "The Pressure Point", count: 4 },
    { name: "Unshackled VC", count: 6 },
    { name: "Coin Stories", count: 3 },
    { name: "Neil Sethi", count: 2 },
    { name: "A Smarter Yet (secondthoughts.ai)", count: 2 },
    { name: "Commodity Context", count: 3 }
  ],
  skippedSources: [
    { name: "P Equity Research — Portfolio Update", reason: "Paywalled: plaintext body is only the 'Happy Friday!...' teaser line before the subscribe wall — zero sentences of actual content." }
  ]
};

const CAT_COLORS = {
  macro: "#e24b4a", credit: "#378add", positioning: "#ef9f27", "AI/infra": "#1d9e75",
  crypto: "#7f77dd", geopolitics: "#d85a30", energy: "#f97316", tech: "#06b6d4",
  gold: "#d4a017", culture: "#ec4899", labor: "#8b5cf6", regulation: "#64748b",
  science: "#14b8a6", venture: "#84cc16"
};
const URG_META = {
  act: { emoji: "🔴", label: "Act Now" },
  deep: { emoji: "🔵", label: "Deep" },
  watch: { emoji: "🟡", label: "Watch" }
};

let activeCat = "all";
let activeUrg = "all";
let activeSrc = null;

function escHtml(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}

function toggleCard(id) {
  var el = document.getElementById('card-' + id);
  if (el) el.classList.toggle('open');
}

function buildFilters() {
  var catCounts = {};
  var urgCounts = { act: 0, deep: 0, watch: 0 };
  ITEMS.forEach(function(i) {
    catCounts[i.cat] = (catCounts[i.cat] || 0) + 1;
    urgCounts[i.urgency] = (urgCounts[i.urgency] || 0) + 1;
  });

  var catHtml = '<button class="pill" data-cat="all" onclick="setCat(\'all\')">All <span class="count">' + ITEMS.length + '</span></button>';
  Object.keys(catCounts).sort().forEach(function(c) {
    var color = CAT_COLORS[c] || "#999";
    catHtml += '<button class="pill" data-cat="' + escHtml(c) + '" onclick="setCat(\'' + c.replace(/'/g, "\\'") + '\')" style="--accent:' + color + '">' + escHtml(c) + ' <span class="count">' + catCounts[c] + '</span></button>';
  });
  document.getElementById('catFilters').innerHTML = catHtml;

  var urgHtml = '<button class="pill" data-urg="all" onclick="setUrg(\'all\')">All <span class="count">' + ITEMS.length + '</span></button>';
  ['act', 'deep', 'watch'].forEach(function(u) {
    var m = URG_META[u];
    urgHtml += '<button class="pill" data-urg="' + u + '" onclick="setUrg(\'' + u + '\')">' + m.emoji + ' ' + m.label + ' <span class="count">' + (urgCounts[u] || 0) + '</span></button>';
  });
  document.getElementById('urgFilters').innerHTML = urgHtml;

  paintFilterStates();
}

function paintFilterStates() {
  document.querySelectorAll('#catFilters .pill').forEach(function(p) {
    var c = p.getAttribute('data-cat');
    var isActive = c === activeCat;
    p.classList.toggle('active', isActive);
    p.style.background = isActive ? (c === 'all' ? '#333' : (CAT_COLORS[c] || '#333')) : '';
    p.style.borderColor = isActive ? 'transparent' : '';
  });
  document.querySelectorAll('#urgFilters .pill').forEach(function(p) {
    var u = p.getAttribute('data-urg');
    var isActive = u === activeUrg;
    var col = u === 'act' ? '#e24b4a' : (u === 'deep' ? '#378add' : (u === 'watch' ? '#ef9f27' : '#333'));
    p.classList.toggle('active', isActive);
    p.style.background = isActive ? col : '';
    p.style.borderColor = isActive ? 'transparent' : '';
  });
}

function setCat(c) {
  activeCat = c;
  activeSrc = null;
  renderCards();
  paintFilterStates();
}
function setUrg(u) {
  activeUrg = u;
  activeSrc = null;
  renderCards();
  paintFilterStates();
}
function filterBySrc(name) {
  activeCat = "all";
  activeUrg = "all";
  activeSrc = name;
  renderCards();
  paintFilterStates();
  document.getElementById('cardsContainer').scrollIntoView({ behavior: 'smooth' });
}

function cardHtml(item) {
  var color = CAT_COLORS[item.cat] || "#999";
  var urg = URG_META[item.urgency];
  var chartFlag = '';
  if (item.charts.hot) chartFlag = '<span class="chart-flag">🔥</span>';
  else if (item.charts.count > 0) chartFlag = '<span class="chart-flag">📊</span>';

  var chartsBlock = '';
  if (item.charts.desc || item.charts.count > 0) {
    chartsBlock = '<div class="charts-row"><div class="chart-placeholder' + (item.charts.hot ? ' hot' : '') + '">' +
      (item.charts.hot ? '🔥 CHART WORTH SAVING — ' : (item.charts.count > 0 ? '📊 ' : '')) +
      escHtml(item.charts.desc || 'Chart in article') + '</div></div>';
  }

  var html = '';
  html += '<div class="card" id="card-' + item.id + '">';
  html += '  <div class="card-head" onclick="toggleCard(' + item.id + ')">';
  html += '    <span class="idx">' + String(item.id).padStart(2, '0') + '</span>';
  html += '    <span class="urgency-emoji">' + urg.emoji + '</span>';
  html += '    <span class="src-badge" style="background:' + color + '">' + escHtml(item.source.split(' / ')[0].split(', citing')[0].split(' (')[0]) + '</span>';
  html += '    <span class="cat-tag">' + escHtml(item.cat) + '</span>';
  html += '    ' + chartFlag;
  html += '    <span class="card-title">' + escHtml(item.title) + '</span>';
  html += '    <span class="chev">▸</span>';
  html += '  </div>';
  html += '  <div class="card-body">';
  html += '    <div class="section-label">The Idea</div>';
  html += '    <div class="idea-text">' + escHtml(item.idea) + '</div>';
  html += '    <div class="section-label">My Angle</div>';
  html += '    <div class="angle-box" style="--accent:' + color + '; border-left-color:' + color + ';">' + escHtml(item.angle) + '</div>';
  html += '    <div class="section-label">Tweets</div>';
  html += '    <div class="tweets">';
  html += '      <div class="tweet-box a"><div class="tlabel">TWEET A</div><p>' + escHtml(item.tweetA) + '</p><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button></div>';
  html += '      <div class="tweet-box b"><div class="tlabel">TWEET B</div><p>' + escHtml(item.tweetB) + '</p><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div>';
  html += '    </div>';
  html += chartsBlock;
  html += '    <div class="link-row"><a href="' + escHtml(item.link) + '" target="_blank">↗ Read full article</a></div>';
  html += '  </div>';
  html += '</div>';
  return html;
}

function renderCards() {
  var filtered = ITEMS.filter(function(i) {
    if (activeSrc && i.source.indexOf(activeSrc) === -1) return false;
    if (!activeSrc && activeCat !== 'all' && i.cat !== activeCat) return false;
    if (!activeSrc && activeUrg !== 'all' && i.urgency !== activeUrg) return false;
    return true;
  });
  var container = document.getElementById('cardsContainer');
  if (filtered.length === 0) {
    container.innerHTML = '';
    document.getElementById('emptyState').style.display = 'block';
    return;
  }
  document.getElementById('emptyState').style.display = 'none';
  container.innerHTML = filtered.map(cardHtml).join('');
  if (activeSrc) {
    filtered.forEach(function(i) {
      var el = document.getElementById('card-' + i.id);
      if (el) el.classList.add('open');
    });
  }
}

function buildReport() {
  var html = '';
  html += '<h4>Time Window</h4>';
  html += '<div>' + escHtml(META.windowStart) + ' &rarr; ' + escHtml(META.windowEnd) + '. Emails outside this window were not processed.</div>';
  html += '<h4>Coverage</h4>';
  html += '<div>' + META.emailsInWindow + ' emails in window &middot; ' + META.emailsRead + ' read &middot; ' + META.itemsExtracted + ' items extracted</div>';
  html += '<h4>Included Sources</h4>';
  META.includedSources.forEach(function(s) {
    html += '<span class="src-item" onclick="filterBySrc(\'' + s.name.replace(/'/g, "\\'") + '\')">' + escHtml(s.name) + ' (' + s.count + ')</span>';
  });
  html += '<h4>Skipped</h4>';
  META.skippedSources.forEach(function(s) {
    html += '<div class="skip-item">&mdash; <b>' + escHtml(s.name) + '</b>: ' + escHtml(s.reason) + '</div>';
  });
  document.getElementById('reportBody').innerHTML = html;
}

function init() {
  document.getElementById('metaDate').textContent = META.date;
  document.getElementById('metaTime').textContent = META.time;
  document.getElementById('metaCount').textContent = META.itemsExtracted + ' items from ' + META.includedSources.length + ' sources';
  buildFilters();
  renderCards();
  buildReport();
  document.getElementById('reportToggle').addEventListener('click', function() {
    var body = document.getElementById('reportBody');
    var chev = document.getElementById('reportChev');
    body.classList.toggle('open');
    chev.textContent = body.classList.contains('open') ? '▾' : '▸';
  });
}

init();
</script>
