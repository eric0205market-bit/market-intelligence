* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; line-height: 1.55;

/* EMPTY */

first is naturally a funnel. The second is naturally a cycle.", "locator": "Introduction", "quote_verified": true}, {"claim": "Two AI accounts can sign similar contracts and look equally healthy in the pipeline, yet months later one has moved to its third use case while the other still cannot get its first into sustained use; their revenue trajectories diverge long before renewal and a bookings-centric commercial system may not detect it.", "speaker": "Federico Fabbri", "type": "causal", "entities": ["CROs", "AI vendors", "renewal"], "conviction": "high", "so_what": "Expect delayed, lumpy net-revenue-retention surprises at AI vendors whose reporting is bookings-centric; ask managements for cohort consumption data, not just ACV.", "quote": null, "locator": "Introduction", "quote_verified": false}, {"claim": "The commercial shift is not uniform: embedded copilots and task-automation features can still be sold much like SaaS modules, while engineered AI products — configurable agents, workflow-transforming systems and customized deployments — require a go-to-market reset with new structures and roles.", "speaker": "Federico Fabbri", "type": "framework", "entities": ["embedded copilots", "task automation", "configurable agents", "workflow-transforming systems"], "conviction": "high", "so_what": "Segment AI software exposure by product complexity: copilot-style add-ons keep SaaS-like margins and sales efficiency, while agentic/engineered products carry heavier services cost and consumption risk.", "quote": null, "locator": "Introduction", "quote_verified": false}, {"claim": "For engineered AI, the decisive evidence at renewal accumulates over months of usage and realized outcomes, making contract signature merely one moment in the commercial relationship rather than the point where the sale is won.", "speaker": "Federico Fabbri", "type": "thesis", "entities": ["AI vendors", "renewal", "adoption"], "conviction": "high", "so_what": "Closing-velocity metrics overstate AI vendor health; realized-usage and outcome data are the true renewal predictors.", "quote": "Increasingly, signature is merely one moment in the commercial relationship rather than where the sale is won.", "locator": "The Funnel Becomes a Flywheel", "quote_verified": true}, {"claim": "AI account economics should be forecast by workload rather than deal value, using use-case pipeline, consumption velocity and expansion potential, because deal value alone says little about how much of an AI product will ultimately be used.", "speaker": "Federico Fabbri", "type": "framework", "entities": ["AI vendors", "forecasting", "consumption velocity"], "conviction": "high", "so_what": "Look for AI vendors disclosing consumption velocity and use-cases-per-account; those metrics better predict revenue than contract value.", "quote": "Account economics increasingly need to be forecast by workload.", "locator": "The Funnel Becomes a Flywheel", "quote_verified": true}, {"claim": "Complex AI vendors that stop at technical delivery cap their own expansion potential, which is pulling them into work that once sat with the customer or a systems integrator — workflow integration, decision rights, change support and adoption.", "speaker": "Federico Fabbri", "type": "causal", "entities": ["AI vendors", "systems integrator", "change management"], "conviction": "medium", "so_what": "Second-order competitive threat to IT services firms and systems integrators as AI vendors internalize deployment and change work; also a margin headwind for vendors doing it.", "quote": null, "locator": "The Funnel Becomes a Flywheel", "quote_verified": false}]}, {"theme": "Buyer proof demands and pilot attrition", "insights": [{"claim": "A BCG CRO survey found 51% of chief revenue officers report greater demand for customized proof of value reflecting the buyer's own data, processes and environments, pushing the burden of proof earlier in the AI sales process.", "speaker": "Federico Fabbri", "type": "data_point", "entities": ["BCG", "CROs", "proof of value"], "conviction": "high", "so_what": "Longer, costlier pre-sales cycles for AI vendors — a drag on sales efficiency (magic number, CAC payback) that favors vendors with domain-specific proof assets.", "quote": "51% of CROs report greater demand for customized proof of value", "locator": "Six Shifts Are Rewriting the Sale of AI Products", "quote_verified": true}, {"claim": "Gartner found that by the end of 2025 at least half of generative AI projects had been dropped after proof of concept, often due to poor data quality, inadequate risk controls, escalating costs or unclear business value.", "speaker": "Federico Fabbri", "type": "data_point", "entities": ["Gartner", "generative AI", "proof of concept"], "conviction": "high", "so_what": "High POC attrition means AI pipeline conversion assumptions should be haircut; vendors helping clear data-quality and governance hurdles capture disproportionate share.", "quote": "at least half of generative AI projects had been dropped after proof of concept", "locator": "The Funnel Becomes a Flywheel", "quote_verified": true}, {"claim": "A successful AI demo can prove the technology works without creating conviction that it will work in the customer's environment, and production then exposes data, integration, governance and process constraints that a pilot can sidestep.", "speaker": "Federico Fabbri", "type": "causal", "entities": ["AI pilots", "data integration", "AI governance"], "conviction": "high", "so_what": "Pilot counts are a poor proxy for AI revenue; track pilot-to-production conversion as the key signal.", "quote": null, "locator": "The Funnel Becomes a Flywheel", "quote_verified": false}, {"claim": "Because AI products evolve faster than customers can evaluate them, AI sellers must narrow the field in discovery by helping pick a use case worth pursuing and defining sufficient proof, and in complex domains industry credibility becomes the price of admission since the judgment depends on understanding the workflow, not just the product.", "speaker": "Federico Fabbri", "type": "thesis", "entities": ["AI vendors", "vertical AI", "discovery"], "conviction": "medium", "so_what": "Favors vertical, domain-credible AI vendors over horizontal model-centric sellers in complex enterprise workflows.", "quote": null, "locator": "Six Shifts Are Rewriting the Sale of AI Products", "quote_verified": false}, {"claim": "Some enterprises are funding new AI purchases by reallocating budget away from other vendors, so incumbent application providers and AI-native vendors increasingly compete for the same dollar; whether AI budgets stay centralized or migrate back into application budgets is still unclear.", "speaker": "Federico Fabbri", "type": "causal", "entities": ["incumbent application providers", "AI-native vendors", "enterprise AI budgets"], "conviction": "medium", "so_what": "AI spend is partly a zero-sum wallet-share shift, a risk for incumbent application SaaS seat revenue; watch for budget cannibalization commentary in enterprise software earnings.", "quote": "Incumbent application providers and AI-native vendors can therefore find themselves competing for the same dollar.", "locator": "Six Shifts Are Rewriting the Sale of AI Products", "quote_verified": true}, {"claim": "Buyer appetite for open-ended strategy-first AI selling (maturity assessments, broad strategy exercises) is fading in favor of bounded, testable formats such as time-bound bootcamps, value-discovery exercises and pilots that give a clearer path to a product decision.", "speaker": "Federico Fabbri", "type": "thesis", "entities": ["AI advisory", "bootcamps", "pilots", "consulting"], "conviction": "medium", "so_what": "Headwind for pure AI strategy consulting revenue; demand shifts toward execution-linked, outcome-bounded engagements.", "quote": null, "locator": "Six Shifts Are Rewriting the Sale of AI Products", "quote_verified": false}]}, {"theme": "Redesigned sales and deployment roles", "insights": [{"claim": "In AI sales the account executive becomes a value architect who sequences use cases and orchestrates a cross-functional pod, while AI itself absorbs more sourcing, qualification and routine outreach, pushing the role toward judgment-heavy work.", "speaker": "Federico Fabbri", "type": "prediction", "entities": ["account executive", "sales automation", "AI"], "conviction": "medium", "so_what": "Lower-tier SDR/qualification headcount is exposed to automation while senior AE and solution roles gain value; relevant to sales-tech vendors and staffing models.", "quote": "The account executive becomes a value architect.", "locator": "The Commercial Organization Moves Beyond the Close", "quote_verified": true}, {"claim": "The boundary between pre-sales and post-sales engineering is dissolving because proof, deployment and adoption rely on the same accumulated understanding of customer data and workflows, giving rise to roles such as forward-deployed engineers, deployment strategists and AI outcome managers.", "speaker": "Federico Fabbri", "type": "thesis", "entities": ["forward-deployed engineers", "deployment strategists", "AI outcome managers"], "conviction": "high", "so_what": "Forward-deployed engineering headcount is becoming a structural cost line for AI vendors, weighing on gross margins versus classic SaaS.", "quote": null, "locator": "The Commercial Organization Moves Beyond the Close", "quote_verified": false}, {"claim": "A clean handoff between pre-sales and post-sales can discard the context needed to move a promising AI pilot into production, and deployment engineers are often the first to spot the next value-creation opportunity, so continuity of technical ownership matters more than titles.", "speaker": "Federico Fabbri", "type": "causal", "entities": ["AI pilots", "technical ownership", "deployment engineers"], "conviction": "medium", "so_what": "Vendors with continuous engineer-per-account coverage should show better pilot-to-production and expansion rates; handoff-heavy org designs are a red flag.", "quote": null, "locator": "The Commercial Organization Moves Beyond the Close", "quote_verified": false}, {"claim": "Customer success in AI is bifurcating, with generalist coverage supplemented by technical and domain experts, and professional services has become a strategic battleground where many vendors subsidize value discovery, bootcamps and even the first pilot, monetizing later through scaled accelerators, center-of-excellence support or advanced engineering.", "speaker": "Federico Fabbri", "type": "causal", "entities": ["customer success", "professional services", "AI vendors"], "conviction": "high", "so_what": "Subsidized front-end services depress near-term AI vendor margins; scrutinize services gross margin and whether later monetization actually materializes.", "quote": null, "locator": "The Commercial Organization Moves Beyond the Close", "quote_verified": false}, {"claim": "Applying one commercial model across all AI products makes simple products unnecessarily expensive to sell while leaving complex ones without enough support to reach sustained consumption, and a specialist-heavy motion that works for the largest strategic accounts may be unaffordable beyond them.", "speaker": "Federico Fabbri", "type": "causal", "entities": ["AI vendors", "strategic accounts", "go-to-market segmentation"], "conviction": "high", "so_what": "High-touch AI deployment economics may not scale down-market; question mid-market growth assumptions for agentic AI vendors.", "quote": null, "locator": "The Commercial Organization Moves Beyond the Close", "quote_verified": false}]}, {"theme": "Long commitments, underconsumption and incentives", "insights": [{"claim": "Some AI vendors are exploring longer commercial commitments including five-year terms and extended price protection, but fewer renewal decisions do not remove commercial risk; more of it shifts into underconsumption over the life of the contract.", "speaker": "Federico Fabbri", "type": "contrarian", "entities": ["AI vendors", "multi-year contracts", "price protection"], "conviction": "high", "so_what": "Long-dated AI commitments inflate RPO without guaranteeing realized revenue; underconsumption against committed contracts is the hidden risk to model.", "quote": "More of it shifts into underconsumption over the life of the contract.", "locator": "The Commercial Organization Moves Beyond the Close", "quote_verified": true}, {"claim": "In consumption-driven AI sales, AEs need incentives to grow the total customer relationship and technical and product specialists need credit for the adoption, consumption and expansion they materially influence, with consumption signals feeding directly into forecasting, account reviews and resource allocation.", "speaker": "Federico Fabbri", "type": "thesis", "entities": ["sales compensation", "account executive", "consumption signals"], "conviction": "medium", "so_what": "Comp-plan redesign toward consumption credit is an observable indicator that an AI vendor is operationally ready for usage-based revenue.", "quote": null, "locator": "The Commercial Organization Moves Beyond the Close", "quote_verified": false}]}, {"theme": "Early client lessons on operating the flywheel", "insights": [{"claim": "Existing commercial systems cannot reliably measure AI usage or surface it to sellers, so vendors need consumption tracking by customer and use case piped directly into CRM and account-management workflows; without it commercial teams are flying blind.", "speaker": "Federico Fabbri", "type": "causal", "entities": ["CRM", "consumption tracking", "enterprise software companies"], "conviction": "high", "so_what": "Demand signal for usage-metering, billing and revenue-intelligence tooling integrated with CRM as AI vendors retool.", "quote": "Until that capability is in place, commercial teams are effectively flying blind.", "locator": "Four Lessons from Early Client Work", "quote_verified": true}, {"claim": "Sellers at enterprise software companies need a clear reason to prioritize new AI offerings over established products; leading organizations create that conviction by anchoring the pitch in a specific customer problem, arming sellers with measurable-impact evidence and aligning incentives to reward adoption of the new product.", "speaker": "Federico Fabbri", "type": "thesis", "entities": ["enterprise software companies", "AI offerings", "sales incentives"], "conviction": "medium", "so_what": "Slow AI attach at incumbent software firms may reflect seller incentive misalignment rather than weak product; watch for comp changes as a catalyst.", "quote": null, "locator": "Four Lessons from Early Client Work", "quote_verified": false}, {"claim": "No single function owns the AI consumption flywheel; a practical start is mapping stages from deployment through adoption, the capabilities needed at each, clear ownership across sales, customer success, services and technical teams, and where role continuity is critical.", "speaker": "Federico Fabbri", "type": "framework", "entities": ["sales", "customer success", "services", "technical teams"], "conviction": "medium", "so_what": "Diagnostic for judging AI vendor execution: ask who is accountable when contracted capacity fails to become consumption.", "quote": "No one function owns the flywheel", "locator": "Four Lessons from Early Client Work", "quote_verified": true}, {"claim": "The talent gap in selling and activating AI is proving as important as the operating-model gap, forcing explicit build-versus-hire choices against a defined capability map.", "speaker": "Federico Fabbri", "type": "thesis", "entities": ["AI talent", "enterprise software companies"], "conviction": "medium", "so_what": "Scarce AI deployment and domain talent is a binding constraint on AI vendor growth and a source of wage inflation in go-to-market roles.", "quote": "The talent gap is proving as important as the operating-model gap.", "locator": "Four Lessons from Early Client Work", "quote_verified": true}]}, {"theme": "CRO stress test and open questions", "insights": [{"claim": "A CRO can stress-test an AI commercial model by stripping bookings out and asking where revenue would rise or disappear if it reflected only what customers actually consumed, exposing where contracted value is turning into consumption and where it is stalling.", "speaker": "Federico Fabbri", "type": "framework", "entities": ["CROs", "bookings", "consumption"], "conviction": "high", "so_what": "Investors can apply the same lens: re-underwrite AI vendors on consumed revenue rather than bookings to spot where committed value may evaporate.", "quote": "Strip bookings out of the picture.", "locator": "The Hard Questions Come Next", "quote_verified": true}, {"claim": "Deciding which AI products, use cases and segments warrant the intensive flywheel motion versus a conventional sales motion could turn on value at stake, technical complexity, customer readiness, regulatory burden or a combination, and how much high-touch support is affordable for strategic accounts versus the broader enterprise base remains unresolved.", "speaker": "Federico Fabbri", "type": "framework", "entities": ["AI vendors", "strategic accounts", "regulatory burden"], "conviction": "exploratory", "so_what": "Commercial model for agentic AI is not settled; expect experimentation and margin volatility in AI vendor go-to-market spend.", "quote": null, "locator": "The Hard Questions Come Next", "quote_verified": false}, {"claim": "The AI vendors that first master a consumption-based commercial model will set the rules the rest of the market must follow, even though the playbook for selling AI products is still under development.", "speaker": "Federico Fabbri", "type": "prediction", "entities": ["AI vendors", "consumption model"], "conviction": "medium", "so_what": "First-mover advantage in consumption-led go-to-market is a potential durable edge; favor AI vendors already reporting and managing to consumption.", "quote": "The vendors who figure out this consumption model first will force the rest of the market to play by their rules.", "locator": "The Hard Questions Come Next", "quote_verified": true}]}], "insight_total": 26, "top_entities": ["AI products", "CROs", "BCG", "Gartner", "SaaS", "embedded copilots", "configurable agents", "forward-deployed engineers", "account executive", "customer success", "professional services", "systems integrator"], "source_meta": {"author": "https://www.bcg.com/about/people/experts/federico-fabbri", "word_count": 2461, "paywalled": false}}, {"record_id": "813252f3638707b1", "source_type": "concepts", "source_name": "BCG Henderson Institute", "source_url": "https://www.bcg.com/publications/2026/how-cfos-shift-from-reporting-to-value", "title": "What Sets the Best CFOs Apart", "published_date": "2026-09-25", "language": "en", "processed_at": "2026-09-26T12:00:00Z", "processor": "claude-code-sub-opus", "tags": ["Macro", "AI", "Geopolitics", "Energy", "Tech"], "gist": "BCG argues the CFO role is entering a third phase (after 2000s stewardship/control and 2025-era strategic partnering) in which, by 2030, leading CFOs help determine performance rather than just measure it: dynamic portfolio management instead of annual budgets, driver-based AI forecasting that flags misses before quarter-end, and self-generated benchmarks where none exist. It lays out six capability areas, a strict capital-allocation pecking order, and a three-factor lens (capital intensity, payback duration, speed of market change) explaining why oil and gas, financial services and tech CFOs must adapt differently — with investors' scrutiny of AI returns making the CFO the natural owner of measurable AI spend.", "themes": [{"theme": "Three generations of CFO questions", "insights": [{"claim": "BCG frames CFO evolution as a three-step escalation of questions: cost control moves from 'How can we reduce costs?' to 'Which costs should we remove to fund growth?' to 'Which activities should be automated, outsourced, or eliminated entirely?'; budgeting moves from 'Are we meeting budget?' to 'Are we creating value versus plan?' to 'Should we fundamentally change the way we operate?'; and capital moves from annual capital budgets to portfolio optimization to 'How quickly can we reallocate capital as market conditions change?'", "speaker": "Jody Foldesy", "type": "framework", "entities": ["CFO", "capital allocation", "automation", "outsourcing"], "conviction": "high", "so_what": "A ready-made scoring rubric for earnings-call and investor-day language: CFOs still talking about budget adherence and cost cuts are a generation behind peers talking about activity elimination and reallocation speed.", "quote": "Which activities should be automated, outsourced, or eliminated entirely?", "locator": "Opening: questions finance leaders should be asking", "quote_verified": true}, {"claim": "Many CFOs are still asking conventional cost, budget and annual-capital questions and are operating with a definition of their role that is already at least one generation behind what the environment demands.", "speaker": "Jody Foldesy", "type": "contrarian", "entities": ["CFO"], "conviction": "high", "so_what": "Implies a widening dispersion in capital-allocation quality across companies — finance-function maturity becomes a differentiator worth diligencing, not a commodity.", "quote": "operating with a definition of their role that is already falling at least one generation behind", "locator": "Opening: questions finance leaders should be asking", "quote_verified": true}, {"claim": "Four forces are pressuring business models and thus the CFO role: AI changing the economics of work and which activities people should still do, geopolitical volatility suddenly altering supply chains and market attractiveness, new technologies requiring large investments without familiar return benchmarks, and competitive conditions shifting faster than annual planning cycles can accommodate.", "speaker": "Jody Foldesy", "type": "causal", "entities": ["AI", "geopolitics", "supply chains", "annual planning"], "conviction": "high", "so_what": "Companies locked into annual budget cycles are structurally slower to respond to these shocks — favor managements that describe rolling or continuous capital reallocation.", "quote": null, "locator": "Opening: changes impacting the business model", "quote_verified": false}, {"claim": "CFOs who stay focused on controlling costs, allocating annual budgets and reporting results after the fact make their companies slower to redirect capital, capture the value of new technologies and respond to market shifts.", "speaker": "Jody Foldesy", "type": "causal", "entities": ["CFO", "capital allocation"], "conviction": "high", "so_what": "A backward-looking finance function is a hidden drag on adaptability that shows up as late pivots and stranded investment — a qualitative risk factor in management assessment.", "quote": null, "locator": "Opening: changes impacting the business model", "quote_verified": false}, {"claim": "Boards and investors increasingly want CFOs to articulate how the company will create value amid AI disruption, volatility and geopolitical uncertainty, so that in an uncertain environment building confidence in the future may become as important as reporting past results.", "speaker": "Jody Foldesy", "type": "thesis", "entities": ["boards", "investors", "CFO", "AI"], "conviction": "medium", "so_what": "Expect more forward-looking CFO narrative and investment framing in disclosures; investors should weigh the credibility of that narrative against track record of measured returns.", "quote": "building confidence in the company’s future may become as important as reporting its past results", "locator": "Opening: raised expectations of boards and investors", "quote_verified": true}]}, {"theme": "From strategic partner to performance shaper by 2030", "insights": [{"claim": "The CFO role has passed through two phases in 25 years — stewardship and control (cost efficiency, reporting, compliance, ERP, annual budgeting, treasury) through the 2000s and early 2010s, then strategic business partner by 2025 (capital allocation, scenario planning, transformation, risk, board engagement) — and is now entering a third, more demanding stage.", "speaker": "Jody Foldesy", "type": "framework", "entities": ["CFO", "ERP", "treasury"], "conviction": "high", "so_what": "Useful for placing a given company's finance function on a maturity curve when evaluating management quality.", "quote": null, "locator": "The CFO Role Has Already Evolved, and A Larger Shift Is Coming", "quote_verified": false}, {"claim": "By 2030, leading CFOs will not merely measure company performance but increasingly help determine it, moving from periodic resource allocation to dynamic portfolio management, from reporting results to identifying operational drivers early enough to change them, and from approving transformation investments to redesigning the business around them.", "speaker": "Jody Foldesy", "type": "prediction", "entities": ["CFO", "dynamic portfolio management"], "conviction": "high", "so_what": "Signals rising CFO influence over capex, M&A and restructuring decisions — CFO succession becomes a more material event for equity and credit holders.", "quote": "by 2030, leading CFOs will not merely measure their company’s performance but also increasingly help determine it", "locator": "The CFO Role Has Already Evolved, and A Larger Shift Is Coming", "quote_verified": true}, {"claim": "In fast-developing technology areas, established benchmarks and peer experience that CFOs traditionally used to de-risk major investments may not exist, so CFOs must create the benchmark themselves — testing approaches, measuring results, and scaling or stopping based on evidence generated inside the business.", "speaker": "Jody Foldesy", "type": "contrarian", "entities": ["CFO", "new technologies"], "conviction": "high", "so_what": "Favors companies with internal test-measure-scale discipline on AI and new tech; peer-following investors and managements will systematically be late.", "quote": "CFOs will increasingly have to help create the benchmark rather than follow it", "locator": "The CFO Role Has Already Evolved, and A Larger Shift Is Coming", "quote_verified": true}, {"claim": "One insurer mapped a radical redesign of its finance function — eliminating subledgers, creating an immutable data store that automatically reconciles transactions, and moving toward a rolling close — and when executives asked which other insurers had already done it, the answer was none.", "speaker": "Jody Foldesy", "type": "anecdote", "entities": ["insurer", "subledgers", "immutable data store", "rolling close"], "conviction": "medium", "so_what": "Finance-architecture overhauls (continuous close, auto-reconciliation) are moving from theory to first movers in insurance — a demand signal for finance-tech and data-platform vendors.", "quote": "executives asked which other insurers had already done it. The answer was none.", "locator": "This dynamic is already happening.", "quote_verified": true}]}, {"theme": "Six capability areas and AI in finance", "insights": [{"claim": "BCG identifies six capability areas the future CFO must strengthen while preserving financial rigor: finance excellence; capital allocation and portfolio management; scenario planning and adaptability; transformation leadership; board, investor and stakeholder leadership; and risk, resilience and geopolitical navigation.", "speaker": "Jody Foldesy", "type": "framework", "entities": ["CFO", "capital allocation", "scenario planning", "risk management"], "conviction": "high", "so_what": "A checklist for assessing whether a finance leader's remit is expanding in substance or only in title.", "quote": null, "locator": "Practical Moves to Make Today", "quote_verified": false}, {"claim": "In one case an AI-enabled finance insight agent automated more than 90% of business intelligence work within nine months, freeing finance professionals from extracting and cleaning data and preparing reports to spend more time interpreting information and advising the business.", "speaker": "Jody Foldesy", "type": "data_point", "entities": ["AI agents", "business intelligence", "FP&A"], "conviction": "medium", "so_what": "Concrete evidence that finance/BI back-office work is highly automatable by agents — supportive for agentic finance software, negative for labor-heavy BI and reporting services.", "quote": "an AI-enabled finance insight agent automated more than 90% of business intelligence work within nine months", "locator": "Finance Excellence", "quote_verified": true}, {"claim": "Linking AI forecasts to specific operating drivers such as customers covered, average sales per customer, pricing and order sizes lets CFOs identify an impending miss and its causes before the quarter ends, shifting the conversation from explaining what went wrong to what can still be done.", "speaker": "Jody Foldesy", "type": "causal", "entities": ["AI", "driver-based forecasting", "CFO"], "conviction": "high", "so_what": "Firms with driver-based forecasting should show fewer negative earnings surprises and more intra-quarter corrective action — a potential source of lower guidance volatility.", "quote": null, "locator": "Scenario Planning and Adaptability", "quote_verified": false}, {"claim": "CFOs should lead transformation starting with redesigning the finance function itself — operating model, processes, capabilities — and then carry that experience and discipline to change and performance improvement across the wider organization.", "speaker": "Jody Foldesy", "type": "thesis", "entities": ["CFO", "finance function", "transformation"], "conviction": "medium", "so_what": "Finance-function transformations can serve as a leading indicator of broader enterprise restructuring programs.", "quote": null, "locator": "Transformation Leadership", "quote_verified": false}, {"claim": "CFOs must become strategic narrative builders who build credibility around strategic bets whose returns may take time to materialize, engaging the board as a partner in decisions rather than reporting to it afterward.", "speaker": "Jody Foldesy", "type": "thesis", "entities": ["CFO", "boards", "investors"], "conviction": "medium", "so_what": "Long-dated bets (notably AI capex) will increasingly be defended through CFO narrative; investors should demand interim milestones rather than accept the story alone.", "quote": null, "locator": "Board, Investor, and Stakeholder Leadership", "quote_verified": false}, {"claim": "Risk management should become a strategic capability rather than a compliance function, with CFOs stress-testing financial, regulatory, geopolitical, cybersecurity and operational disruptions and using the results to guide capital decisions, supply-chain resilience and financial flexibility.", "speaker": "Jody Foldesy", "type": "thesis", "entities": ["risk management", "geopolitics", "cybersecurity", "supply chains"], "conviction": "medium", "so_what": "Companies that tie geopolitical stress tests to capital decisions should hold more balance-sheet optionality through shocks — relevant for credit and downside-protection screens.", "quote": null, "locator": "Risk, Resilience, and Geopolitical Navigation", "quote_verified": false}]}, {"theme": "Capital allocation pecking order", "insights": [{"claim": "BCG prescribes a strict capital pecking order: first meet fixed commitments (interest, debt maturities, dividends); then rank organic and inorganic investments by strategic value and return; only then consider discretionary uses such as buybacks, early debt repayment or holding cash.", "speaker": "Jody Foldesy", "type": "framework", "entities": ["dividends", "buybacks", "M&A", "debt maturities"], "conviction": "high", "so_what": "Under this framework buybacks are residual, not a priority — companies that buy back stock while underinvesting in high-return projects signal weak allocation discipline.", "quote": null, "locator": "Capital Allocation and Portfolio Management", "quote_verified": false}, {"claim": "Proactive CFOs continually rank investments they would accelerate, maintain, reduce or stop as conditions change, and because AI makes changes in business performance visible sooner, capital allocation can become more continuous rather than annual.", "speaker": "Jody Foldesy", "type": "prediction", "entities": ["AI", "capital allocation", "CFO"], "conviction": "medium", "so_what": "Expect faster mid-year capex and project reallocation at leading companies — guidance on investment mix may change more frequently than the annual cycle.", "quote": null, "locator": "Capital Allocation and Portfolio Management", "quote_verified": false}]}, {"theme": "Industry economics set the CFO's room to move", "insights": [{"claim": "How fast and how radically a CFO can reshape the role depends on three industry factors: capital intensity (how much fixed, long-duration capital the business needs), asset and payback duration (how long investments take to return), and speed of market change in demand, competitive positions and asset values.", "speaker": "Jody Foldesy", "type": "framework", "entities": ["capital intensity", "payback duration", "CFO"], "conviction": "high", "so_what": "A simple lens for which sectors reward reallocation agility (fast-change, short-payback) versus balance-sheet conservatism (capital-heavy, long-duration).", "quote": null, "locator": "How a CFO’s Role Changes Depends in Part on the Industry", "quote_verified": false}, {"claim": "In oil and gas, where investments span decades and bad decisions are hard to reverse, adaptability means staging commitments, preparing for commodity cycles and preserving financial flexibility rather than constantly moving capital; AI can improve forecasting and asset productivity, but long-term capital discipline still takes precedence.", "speaker": "Jody Foldesy", "type": "thesis", "entities": ["oil and gas", "commodity cycles", "AI"], "conviction": "high", "so_what": "Supports rewarding energy companies that stage capex and keep balance-sheet flexibility over those chasing growth — overextension penalties play out over decades.", "quote": "the consequences of overextension can be felt for decades, not quarters", "locator": "Consider oil and gas.", "quote_verified": true}, {"claim": "In financial services, investment cycles run in months and interest-rate, customer-behavior and regulatory shifts quickly alter returns, so speed of capital reallocation is a competitive advantage; for example, AI analysis of how likely deposits are to stay under different economic scenarios lets a bank CFO size liquidity buffers more precisely.", "speaker": "Jody Foldesy", "type": "causal", "entities": ["financial services", "banks", "deposits", "liquidity", "AI"], "conviction": "medium", "so_what": "AI-driven deposit-behavior modeling could let banks run leaner liquidity and deploy more capital — watch for banks citing behavioral deposit analytics in liquidity and NIM discussions.", "quote": "When the economics of an investment can shift in a matter of months, delayed decisions carry real costs", "locator": "Financial services presents a different challenge.", "quote_verified": true}, {"claim": "In technology companies, fixed capital needs may be lower but customer favor is fickle, so when a product gains traction there is only a short window to pour money behind it before competitors respond; CFOs must redirect capital quickly from lagging initiatives to promising ones or cede ground to faster rivals.", "speaker": "Jody Foldesy", "type": "causal", "entities": ["technology companies", "capital reallocation"], "conviction": "medium", "so_what": "In tech, reallocation speed toward winning products is a key driver of share outcomes — reward managements that visibly kill underperforming lines and double down fast.", "quote": "Hesitation can give faster-moving rivals the opportunity to catch up or move ahead.", "locator": "Technology companies provide still another version", "quote_verified": true}]}, {"theme": "CFO as auditor of AI returns", "insights": [{"claim": "Investors are scrutinizing whether companies can turn large AI investments into measurable economic returns, something many businesses are still struggling to demonstrate, and CFOs can supply that evidence by concentrating AI spending where financial impact is measurable and holding those investments accountable.", "speaker": "Jody Foldesy", "type": "thesis", "entities": ["AI investments", "investors", "CFO"], "conviction": "high", "so_what": "Points to a shift from broad AI experimentation toward concentrated, ROI-tracked AI spend — a headwind for diffuse AI budgets and a tailwind for use cases with measurable P&L impact.", "quote": "whether companies can turn large AI investments into measurable economic returns, something many businesses are still struggling to demonstrate", "locator": "No Time to Waste", "quote_verified": true}, {"claim": "Finance leaders focused mainly on closing the books, controlling budgets and evaluating investments conceived elsewhere risk having the most consequential decisions on technology, talent, operations and investment made without them.", "speaker": "Jody Foldesy", "type": "prediction", "entities": ["CFO", "finance leaders"], "conviction": "medium", "so_what": "Where CFOs are sidelined from AI and technology investment decisions, expect weaker return discipline on those investments.", "quote": null, "locator": "No Time to Waste", "quote_verified": false}]}], "insight_total": 23, "top_entities": ["CFO", "AI", "capital allocation", "oil and gas", "financial services", "technology companies", "insurer", "buybacks", "scenario planning", "boards", "investors", "geopolitical volatility"], "source_meta": {"author": "https://www.bcg.com/about/people/experts/jody-foldesy", "word_count": 1854, "paywalled": false}}, {"record_id": "cefe99e4ee1fa773", "source_type": "concepts", "source_name": "BCG Henderson Institute", "source_url": "https://www.bcg.com/publications/2026/llm-search-shapes-asian-consumer-buying", "title": "AI Is Rewriting the Rules of the Consumer Journey in Asia", "published_date": "2026-09-25", "language": "en", "processed_at": "2026-09-26T12:00:00Z", "processor": "claude-code-sub-opus", "tags": ["AI", "Tech", "Society"], "gist": "Using BCG's Global Consumer Radar survey of almost 5,500 consumers in China, India, Japan and South Korea, BCG finds LLM search reaches only 12% of Asian purchase journeys but 64% of its users say it shaped their brand choice, tying it for the second-highest influence behind social media. Contrary to the incumbent-concentration assumption, LLM search widens consideration sets, and with Asia-Pacific CMOs prioritizing agentic commerce more than peers in North America and Europe, BCG urges brands to invest ahead of reach via GEO, machine-readable data and agent-ready checkout.", "themes": [{"theme": "Reach vs influence measurement lens", "insights": [{"claim": "BCG separates marketing touchpoints into two metrics: reach (share of purchase journeys in which consumers used a touchpoint) and influence (share of those users who said the touchpoint stood out in shaping the brand they bought), arguing that the interaction between the two, not either alone, should guide marketing budget allocation.", "speaker": "Parul Bajaj", "type": "framework", "entities": ["BCG Global Consumer Radar", "marketing touchpoints"], "conviction": "high", "so_what": "A reusable lens for judging ad-channel economics: high-reach/low-influence channels (legacy media, some display) are overpriced relative to low-reach/high-influence ones (LLM search).", "quote": null, "locator": "From Discovery to Choice", "quote_verified": false}, {"claim": "Across China, India, Japan and South Korea, which channels consumers use differs sharply by market, but how much a channel matters once used differs far less — influence is far more stable across markets than reach.", "speaker": "Parul Bajaj", "type": "causal", "entities": ["China", "India", "Japan", "South Korea"], "conviction": "high", "so_what": "Influence rates observed in early-adopter markets can be used to forecast channel value in lagging markets once adoption catches up — a template for sizing LLM-search ad/commerce TAM in Japan and Korea.", "quote": "which channels consumers use differs sharply by market, but how much a channel matters once it’s used differs far less", "locator": "Gaining Influence", "quote_verified": true}, {"claim": "Nearly half of Asian consumers are undecided on brand at the start of a purchase journey, meaning brand preference is increasingly formed during the journey rather than before it, and the highest-reach channels are all digital.", "speaker": "Parul Bajaj", "type": "data_point", "entities": ["Asian consumers", "digital channels"], "conviction": "high", "so_what": "Erodes the value of pre-built brand equity for Asian consumer brands and raises the value of in-journey digital presence — favors platforms that own the decision moment.", "quote": "Brand preference is no longer set before the journey begins; it’s formed during it.", "locator": "Introduction", "quote_verified": true}, {"claim": "The BCG analysis draws on almost 5,500 consumers across China, India, Japan and South Korea from its 14-market Global Consumer Radar survey, covering 16 product categories ranging from packaged snacks to cars.", "speaker": "Parul Bajaj", "type": "data_point", "entities": ["BCG Global Consumer Radar", "China", "India", "Japan", "South Korea"], "conviction": "high", "so_what": "Sample breadth across low- and high-involvement categories makes the LLM-influence finding more than a tech-gadget artifact, though category-level splits are not disclosed.", "quote": null, "locator": "About our Research", "quote_verified": false}]}, {"theme": "Social commerce dominance in China and India", "insights": [{"claim": "Social media reaches consumers in 21% of purchase journeys across Asia versus an average of 14% elsewhere in the world, with reach of 31% in China and 29% in India but only 12% in Japan and 14% in South Korea, where internet research is the top reach channel.", "speaker": "Parul Bajaj", "type": "data_point", "entities": ["social media", "China", "India", "Japan", "South Korea"], "conviction": "high", "so_what": "Social-platform ad and commerce monetization in Asia is concentrated in China and India; Japan and Korea remain search-led markets where search incumbents retain the discovery moment.", "quote": null, "locator": "Reaching Out", "quote_verified": false}, {"claim": "In China, social media has moved beyond discovery to become commerce infrastructure itself, with livestream shopping, influencer-curated product lists and in-app shoppable links letting consumers go from inspiration to purchase without leaving the platform.", "speaker": "Parul Bajaj", "type": "thesis", "entities": ["China", "livestream shopping", "social media platforms"], "conviction": "high", "so_what": "Closed-loop social commerce captures both ad and transaction economics — the benchmark model for what integrated platforms elsewhere are chasing.", "quote": "social media has evolved well beyond discovery to become part of the commerce infrastructure itself", "locator": "Reaching Out", "quote_verified": true}, {"claim": "India is following China toward social commerce, driven by rapid growth of the creator economy and deeper links between leading social/video platforms and e-commerce marketplaces that connect creator-led discovery directly with purchase.", "speaker": "Parul Bajaj", "type": "prediction", "entities": ["India", "creator economy", "e-commerce marketplaces", "video sharing platforms"], "conviction": "medium", "so_what": "Watch Indian social-to-marketplace integrations and creator-commerce monetization as the next large social-commerce growth pocket after China.", "quote": null, "locator": "Reaching Out", "quote_verified": false}]}, {"theme": "LLM search punching above its reach", "insights": [{"claim": "LLM search already reaches 12% of purchase journeys across China, India, Japan and South Korea, placing it among the region's top five touchpoints by reach, ahead of TV and radio, print and billboards.", "speaker": "Parul Bajaj", "type": "data_point", "entities": ["LLM search", "TV and radio", "print", "billboards"], "conviction": "high", "so_what": "LLM assistants have already overtaken legacy media as a purchase-discovery channel in Asia — a direct share threat to traditional ad budgets.", "quote": null, "locator": "Reaching Out", "quote_verified": false}, {"claim": "Only 12% of Asian purchase journeys involve LLM search, yet 64% of consumers who use it say it shaped their brand choice, tying LLM search for the second-highest influence of any touchpoint in Asia, just behind social media.", "speaker": "Parul Bajaj", "type": "data_point", "entities": ["LLM search", "social media"], "conviction": "high", "so_what": "Per-use conversion power of AI assistants is already near the top of the stack; as usage scales, the value of being cited by LLMs compounds — bullish for platforms that monetize AI answer surfaces.", "quote": "fully 64% of the consumers who use it say that it shapes their brand choices", "locator": "Gaining Influence", "quote_verified": true}, {"claim": "LLM search reach varies more across Asian markets than almost any other touchpoint — roughly 22-23% of purchase journeys in India versus 5-6% in Japan, more than a fourfold gap — while its influence among users stays in a tight band of roughly 52% to 68% across all four markets.", "speaker": "Parul Bajaj", "type": "data_point", "entities": ["LLM search", "India", "Japan"], "conviction": "high", "so_what": "India is the leading AI-assisted-shopping market in the region; Japan is the laggard with the most headroom — adoption, not efficacy, is the swing variable.", "quote": null, "locator": "Gaining Influence", "quote_verified": false}, {"claim": "Brands should not wait for LLM search reach to scale before investing, because its influence is likely to hold at similarly strong levels as adoption grows; optimizing purely for reach risks under-investing in a channel already punching above its weight.", "speaker": "Parul Bajaj", "type": "thesis", "entities": ["LLM search", "marketing budgets"], "conviction": "high", "so_what": "Implies early budget migration toward LLM visibility/GEO ahead of measurable reach — a leading demand signal for GEO tooling and AI-answer ad products.", "quote": "Optimizing purely for reach risks under-investing in a channel that’s already punching above its weight.", "locator": "Gaining Influence", "quote_verified": true}]}, {"theme": "LLMs widen, not concentrate, brand consideration", "insights": [{"claim": "Contrary to marketers' assumption that LLM search would concentrate influence around a handful of large incumbent brands, in more than half of LLM-assisted purchase journeys consumers end up considering brands they would not otherwise have found.", "speaker": "Parul Bajaj", "type": "contrarian", "entities": ["LLM search", "incumbent brands", "challenger brands"], "conviction": "high", "so_what": "AI discovery weakens scale-based brand moats built on broad reach advertising — a risk to incumbent consumer brands' pricing power and an opening for challengers.", "quote": "So far, marketers have assumed that LLM search will concentrate influence around a handful of large incumbents. But as our recent report on consumer behavior shows, the opposite is happening.", "locator": "LLM Search on the Rise", "quote_verified": true}, {"claim": "Because LLM search can surface brands with low reach through traditional touchpoints, winning the purchase journey no longer depends solely on investing across reach channels before the consumer turns to an LLM — the LLM itself becomes a route into the shortlist.", "speaker": "Parul Bajaj", "type": "causal", "entities": ["LLM search", "smaller brands", "traditional media"], "conviction": "high", "so_what": "Lowers the customer-acquisition barrier for smaller brands and reduces the returns on mass-reach media spend — negative for traditional media ad pools over time.", "quote": null, "locator": "LLM Search on the Rise", "quote_verified": false}, {"claim": "LLM search has rapidly become a trusted consumer source because it cuts through a cluttered, option-crowded marketplace with personalized, direct and transparent recommendations that feel relevant to individual needs.", "speaker": "Parul Bajaj", "type": "causal", "entities": ["LLM search", "consumer trust"], "conviction": "medium", "so_what": "Trust is the precondition for handing over transactions — the trajectory to monitor is whether trust survives the introduction of sponsored placements in AI answers.", "quote": null, "locator": "LLM Search on the Rise", "quote_verified": false}]}, {"theme": "Agentic commerce readiness", "insights": [{"claim": "28% of Asia-Pacific CMOs rank agentic commerce among their top three priorities, versus 23% of CMOs in North America and 13% in Europe, and BCG says the shift from LLMs shaping the shortlist to LLMs initiating transactions is no longer a distant scenario.", "speaker": "Parul Bajaj", "type": "prediction", "entities": ["agentic commerce", "Asia-Pacific CMOs", "North America", "Europe"], "conviction": "medium", "so_what": "Asia-Pacific is positioned as the lead market for agent-completed purchases; Europe lags badly — expect agentic checkout volumes and vendor wins to show first in APAC.", "quote": null, "locator": "LLM Search on the Rise", "quote_verified": false}, {"claim": "Brands should structure product, pricing and availability data so outside AI commerce agents can discover, price and complete purchases directly, while tracking multiple emerging agentic checkout standards such as ChatGPT's Instant Checkout and Amazon's 'Buy for Me' rather than building around just one.", "speaker": "Parul Bajaj", "type": "framework", "entities": ["ChatGPT Instant Checkout", "Amazon Buy for Me", "AI commerce agents"], "conviction": "medium", "so_what": "Agentic checkout standards remain unsettled — a live platform battle between OpenAI and Amazon for the transaction layer; product-data/feed-management vendors benefit regardless of winner.", "quote": null, "locator": "Build for Agentic Commerce", "quote_verified": false}, {"claim": "BCG recommends measuring marketing outcomes with AI agents, not just people, by tracking share of mentions, citations and recommendation rates, and asks leadership whether they would want their own agent to be the one closing a consumer's purchase.", "speaker": "Parul Bajaj", "type": "framework", "entities": ["AI commerce agents", "share of LLM mentions"], "conviction": "medium", "so_what": "New KPI category (AI share-of-voice) is emerging — a budget line that will fund AI-visibility analytics tools.", "quote": null, "locator": "Build for Agentic Commerce", "quote_verified": false}]}, {"theme": "GEO playbook and operating model", "insights": [{"claim": "LLM search draws heavily on sources beyond brand-owned websites — forums, review sites, social content and Wikipedia — so brand discoverability in AI answers depends on managing the brand's broader digital presence through generative engine optimization (GEO).", "speaker": "Parul Bajaj", "type": "causal", "entities": ["generative engine optimization", "Wikipedia", "review sites", "forums"], "conviction": "high", "so_what": "Third-party content hubs (reviews, forums, Wikipedia) gain strategic value as LLM citation sources — raising the value of UGC platforms whose content feeds AI answers.", "quote": null, "locator": "Win in LLM Search and Other LLM Answer Modes", "quote_verified": false}, {"claim": "BCG's GEO playbook: reverse-engineer LLM answers for key category queries to see which sources are cited and where the brand is absent; rewrite content for machines using question-style phrasing, schema markup, clear subheadings and comparison tables; and monitor citation frequency, LLM sentiment on product attributes and citation staleness as a test-and-learn program.", "speaker": "Parul Bajaj", "type": "framework", "entities": ["generative engine optimization", "schema markup", "LLM search"], "conviction": "medium", "so_what": "Defines the concrete scope of a GEO services/software market analogous to early SEO — a consulting and tooling spend category forming now.", "quote": null, "locator": "Win in LLM Search and Other LLM Answer Modes", "quote_verified": false}, {"claim": "Ownership of AI discoverability should move out of a single SEO or marketing team into shared accountability across marketing, product and technology with a named owner and clear decision rights, treating LLM search, agentic commerce and data foundations as one connected system because a gap in any one undercuts the others.", "speaker": "Parul Bajaj", "type": "thesis", "entities": ["SEO", "marketing", "product", "technology"], "conviction": "medium", "so_what": "Signals that AI-commerce readiness is becoming a cross-functional, CTO-involved spend rather than a marketing line item — larger deal sizes for enterprise data/commerce vendors.", "quote": null, "locator": "Establish the Foundations for LLM Search and Agentic Commerce", "quote_verified": false}, {"claim": "Social media, internet research, LLM search, brand websites and LLM agents feed on each other and are converging into a single connected system, so managing them as isolated channels leads to missed influence.", "speaker": "Parul Bajaj", "type": "thesis", "entities": ["social media", "LLM search", "LLM agents", "brand websites"], "conviction": "high", "so_what": "Channel-siloed ad-tech and agency models are exposed; integrated platforms spanning discovery, answers and checkout gain.", "quote": "treating them as isolated levers is a recipe for missed influence", "locator": "Conclusion", "quote_verified": true}]}], "insight_total": 21, "top_entities": ["LLM search", "social media", "agentic commerce", "China", "India", "Japan", "South Korea", "generative engine optimization", "ChatGPT", "Amazon", "Global Consumer Radar", "Wikipedia"], "source_meta": {"author": "https://www.bcg.com/about/people/experts/parul-bajaj", "word_count": 2309, "paywalled": false}}, {"record_id": "01f2bd3a6782a233", "source_type": "concepts", "source_name": "Chatham House", "source_url": "https://www.chathamhouse.org/2026/09/new-energy-and-trade-routes-could-bypass-hormuz-and-change-middle-east-major-challenges", "title": "New energy and trade routes could bypass Hormuz and change the Middle East. But major challenges remain", "published_date": "2026-09-25", "language": "en", "processed_at": "2026-09-26T12:00:00Z", "processor": "claude-code-sub-opus", "tags": ["Energy", "Geopolitics", "Macro"], "gist": "Chatham House argues the war on Iran and the effective closure of the Strait of Hormuz are pushing Iraq, Syria and Lebanon to build Gulf-to-Mediterranean bypass routes, led by a ~$15bn, ~4-year, ~2 million b/d Iraq-Syria pipeline via a Haditha hub to Baniyas, plus Tripoli-Homs rail and fibre corridors. It judges these routes would diversify rather than replace Hormuz (Iraqi crude mostly goes to China and India) and warns that over 100 attacks on energy assets, Israeli and Iran-aligned militia action, and fragmented, corrupt states create a fundamental mismatch between ambition and delivery capacity.", "themes": [{"theme": "Iraqi export shock from Hormuz closure", "insights": [{"claim": "Before the war on Iran, Iraq exported around 3.3 million b/d from its southern oilfields; after the effective closure of the Strait of Hormuz those exports collapsed by the second week of March, then partially recovered from mid-April to 2.3 million b/d in August.", "speaker": "Chatham House", "type": "data_point", "entities": ["Iraq", "Strait of Hormuz", "Iraqi southern oilfields", "Iran"], "conviction": "high", "so_what": "Iraqi southern exports remain roughly 1 million b/d below pre-war levels — a live supply gap that keeps Middle East crude balances tight and supports Gulf-risk premia.", "quote": null, "locator": "Changing energy routes", "quote_verified": false}, {"claim": "Iraq's partial export recovery through Hormuz was aided by Baghdad offering price discounts to buyers and by Iran reportedly permitting Iraqi tankers to transit the Strait — meaning Iraqi flows depend on Tehran's discretion.", "speaker": "Chatham House", "type": "causal", "entities": ["Iraq", "Iran", "Strait of Hormuz", "oil tankers"], "conviction": "medium", "so_what": "Iraqi barrels are both discounted and hostage to Iranian permission — watch Basrah differentials and any reversal of Iranian transit tolerance as a sudden supply-risk trigger.", "quote": "aided by Iraq giving discounts for buyers and by Iran reportedly giving permission for Iraqi oil tankers to pass through the Strait", "locator": "Changing energy routes", "quote_verified": true}, {"claim": "Syria and Lebanon have been less directly hurt by the Hormuz disruption because neither is a major oil exporter and both have Mediterranean access, which instead gives Beirut and Damascus an opportunity to market their ports and transport networks as Gulf-Europe gateways.", "speaker": "Chatham House", "type": "thesis", "entities": ["Syria", "Lebanon", "Beirut", "Damascus", "Mediterranean", "Europe", "Gulf"], "conviction": "medium", "so_what": "The Hormuz shock reprices Levantine geography as a strategic transit asset — an early-stage theme for port, logistics and reconstruction exposure if security allows.", "quote": null, "locator": "Changing energy routes", "quote_verified": false}]}, {"theme": "Iraq-Syria pipeline and Hormuz bypass economics", "insights": [{"claim": "Iraq is diversifying export routes on several fronts: expanding flows through Turkey's Mediterranean port of Ceyhan, discussing revival of a long-stalled pipeline to Jordan's Red Sea port of Aqaba, and pursuing a new westward pipeline through Syria to the Mediterranean.", "speaker": "Chatham House", "type": "data_point", "entities": ["Iraq", "Turkey", "Ceyhan", "Jordan", "Aqaba", "Syria"], "conviction": "high", "so_what": "Multiple bypass options compete for capital and political attention — Ceyhan expansion is the nearest-term, lowest-execution-risk route to monitor for incremental Iraqi volumes.", "quote": null, "locator": "Iraq-Syria pipeline", "quote_verified": false}, {"claim": "The planned Iraq-Syria corridor is framed as a revival of the historic Kirkuk–Baniyas pipeline but actually requires new infrastructure: a network linking Iraq's southern and northern fields to a hub at Haditha in western Iraq, from which oil would flow west through Syria to Baniyas and north towards Turkey.", "speaker": "Chatham House", "type": "framework", "entities": ["Kirkuk–Baniyas pipeline", "Haditha", "Baniyas", "Iraq", "Syria", "Turkey"], "conviction": "high", "so_what": "A hub-and-spoke design at Haditha makes it a greenfield megaproject, not a refurbishment — pricing timelines and costs as a rehab would understate execution risk.", "quote": null, "locator": "Iraq-Syria pipeline", "quote_verified": false}, {"claim": "The proposed Iraq-Syria pipeline network is estimated to cost around $15 billion, take about four years to build, and carry an initial capacity of around two million b/d, and the Trump administration is reportedly backing it as part of a strategy to reduce Iran's regional leverage.", "speaker": "Chatham House", "type": "data_point", "entities": ["Iraq-Syria pipeline", "Trump administration", "Iran", "Strait of Hormuz"], "conviction": "medium", "so_what": "Even on schedule, bypass capacity arrives around 2030 — it does not relieve the current Hormuz supply risk, but US backing could unlock financing and contractor opportunities.", "quote": null, "locator": "Iraq-Syria pipeline", "quote_verified": false}, {"claim": "A Mediterranean pipeline would diversify rather than replace Iraq's reliance on Hormuz, because most Iraqi crude goes to Asian buyers, especially China and India, which are far quicker to reach from the Gulf than from the Mediterranean.", "speaker": "Chatham House", "type": "contrarian", "entities": ["Iraq", "China", "India", "Strait of Hormuz", "Mediterranean"], "conviction": "high", "so_what": "Westward routes structurally favour European/Atlantic buyers; Asian refiners stay exposed to Hormuz, so the bypass reshapes trade flows and differentials rather than eliminating Gulf chokepoint risk.", "quote": "it would diversify rather than replace Hormuz", "locator": "Iraq-Syria pipeline", "quote_verified": true}]}, {"theme": "Levant rail and digital corridors", "insights": [{"claim": "Lebanese and Syrian officials this month inspected a potential rail route from the Lebanese port of Tripoli to Homs in Syria, a possible first step towards re-establishing Syria as a transit state linking the Lebanese coast to Iraq, Turkey and the Gulf.", "speaker": "Chatham House", "type": "anecdote", "entities": ["Tripoli", "Homs", "Lebanon", "Syria", "Iraq", "Turkey", "Gulf"], "conviction": "medium", "so_what": "An early, observable milestone for Levant transit ambitions — track financing announcements, not inspections, as the real signal.", "quote": null, "locator": "New East-West corridors", "quote_verified": false}, {"claim": "A wider Levant rail corridor faces heavy hurdles: Lebanon's earlier plan to revive the same Tripoli railway stalled before work began partly over financing and mismanagement, and Syria's government estimates rehabilitating its war-damaged rail system could cost around $5.5 billion.", "speaker": "Chatham House", "type": "data_point", "entities": ["Lebanon", "Syria", "Tripoli", "Syrian railway system"], "conviction": "high", "so_what": "Prior failure on the identical project is a base-rate warning — discount near-term Levant rail corridor headlines heavily.", "quote": null, "locator": "New East-West corridors", "quote_verified": false}, {"claim": "New fibre-optic networks through Iraq and Syria are intended to give Gulf states alternative overland routes for data that currently travels through vulnerable submarine cables.", "speaker": "Chatham House", "type": "thesis", "entities": ["Iraq", "Syria", "Gulf states", "submarine cables", "fibre-optic networks"], "conviction": "medium", "so_what": "Chokepoint risk is extending to data infrastructure — terrestrial fibre route diversity for Gulf data centres becomes a strategic, investable theme.", "quote": null, "locator": "New East-West corridors", "quote_verified": false}]}, {"theme": "Energy infrastructure as a war target", "insights": [{"claim": "Energy infrastructure across the Middle East has become a primary target, with over 100 attacks on energy assets in the first six months of the war — Iran hitting facilities across the Gulf and Israel striking fuel storage depots and gas infrastructure inside Iran.", "speaker": "Chatham House", "type": "data_point", "entities": ["Iran", "Israel", "Gulf", "energy infrastructure"], "conviction": "high", "so_what": "Physical-asset risk is now systematic, not episodic — insurance costs, risk premia and any new corridor's security budget must price repeated strikes.", "quote": "with over 100 attacks on energy assets in the first six months of the war", "locator": "Energy under attack", "quote_verified": true}, {"claim": "Hormuz-bypass infrastructure is itself vulnerable: attacks launched from Iraqi territory forced a temporary closure of Saudi Arabia's East–West pipeline, which was built to reduce Riyadh's Hormuz dependence, and Iraq's Khor Mor gas field has suffered repeated militia rocket and drone attacks.", "speaker": "Chatham House", "type": "causal", "entities": ["Saudi Arabia", "East–West pipeline", "Khor Mor gas field", "Iraq", "Iran-aligned militias"], "conviction": "high", "so_what": "Bypass routes do not remove Iranian leverage, they relocate it — proxy reach means alternative pipelines carry their own disruption risk and should not be modelled as risk-free capacity.", "quote": null, "locator": "Energy under attack", "quote_verified": false}, {"claim": "The Houthis have attacked Saudi oil tankers and this month seized the Bab al-Mandab Strait coastline, threatening the Red Sea alternative to Hormuz as well.", "speaker": "Chatham House", "type": "data_point", "entities": ["Houthis", "Bab al-Mandab", "Saudi Arabia", "Red Sea", "Mocha"], "conviction": "high", "so_what": "Both Gulf exits (Hormuz and Bab al-Mandab) are now contested — Red Sea routing via Aqaba or Yanbu is not a clean escape, keeping tanker rates and war-risk premia elevated.", "quote": null, "locator": "Energy under attack", "quote_verified": false}, {"claim": "Threats to regional connectivity also come from Israel, which has repeatedly targeted transport infrastructure including in Lebanon, and from ISIS and other armed groups attacking oil wells and tanker trucks in eastern Syria — the very area the proposed Iraqi energy corridor would cross.", "speaker": "Chatham House", "type": "causal", "entities": ["Israel", "Lebanon", "ISIS", "eastern Syria", "Iraq-Syria pipeline"], "conviction": "high", "so_what": "The Iraq-Syria pipeline's route runs through an active insurgent zone — a key reason to assign low probability to on-time, on-budget delivery.", "quote": null, "locator": "Energy under attack", "quote_verified": false}, {"claim": "Iraq, Syria and Lebanon are pursuing corridor projects under foreign occupation: Israeli forces occupy a self-declared security zone in southern Lebanon with more than a million people displaced, and Israel has held Syria's demilitarized buffer zone since seizing it in December 2024.", "speaker": "Chatham House", "type": "data_point", "entities": ["Israel", "Lebanon", "Syria"], "conviction": "high", "so_what": "Ongoing occupations limit these governments' ability to guarantee security for foreign investors in transit infrastructure.", "quote": null, "locator": "Energy under attack", "quote_verified": false}]}, {"theme": "Corruption and state fragmentation as binding constraint", "insights": [{"claim": "Iraq, Lebanon and Syria all rank near the bottom of Transparency International's corruption perceptions index, and in systems where public contracting is a main means of distributing rents, mega-projects become opportunities for political parties to profit from contracts at the expense of delivery.", "speaker": "Chatham House", "type": "causal", "entities": ["Iraq", "Lebanon", "Syria", "Transparency International"], "conviction": "high", "so_what": "Expect cost overruns and delays on regional mega-projects; contractors and lenders should price rent-extraction risk into any exposure.", "quote": null, "locator": "Internal obstacles", "quote_verified": false}, {"claim": "Because authority in Iraq, Syria and Lebanon is fragmented among political factions, competing institutions and armed actors, governments cannot guarantee the security or financing of large projects and multiple actors can obstruct them or extract rents — a fundamental mismatch between ambition and delivery capacity.", "speaker": "Chatham House", "type": "thesis", "entities": ["Iraq", "Syria", "Lebanon", "armed groups"], "conviction": "high", "so_what": "Governance, not engineering, is the critical path — treat corridor announcements as optionality contingent on state reform rather than as committed supply.", "quote": "This creates a fundamental mismatch between the scale of ambition and the capacity to deliver it.", "locator": "Internal obstacles", "quote_verified": true}]}, {"theme": "Post-Iran regional realignment", "insights": [{"claim": "Iraq, Syria and Lebanon, once central to an Iranian regional order, are now seeking greater sovereignty by diversifying their economic ties towards Europe and the Gulf, a shift supported by the Trump administration.", "speaker": "Chatham House", "type": "thesis", "entities": ["Iraq", "Syria", "Lebanon", "Iran", "Trump administration"], "conviction": "medium", "so_what": "Signals a structural erosion of Iran's 'axis' economics — US policy support may channel development finance and sanctions relief towards Levant connectivity.", "quote": null, "locator": "Introduction", "quote_verified": false}, {"claim": "New pipelines, railways and corridors can reduce dependence on the old order but cannot on their own produce sovereignty; whether Iraq, Syria and Lebanon shape the post-war regional order or have it shaped around them depends on building institutions able to deliver and protect these projects and spread benefits beyond elites.", "speaker": "Chatham House", "type": "contrarian", "entities": ["Iraq", "Syria", "Lebanon"], "conviction": "high", "so_what": "Infrastructure-led 'Levant corridor' narratives are premature without visible institutional reform — the reform track is the leading indicator to watch.", "quote": "But connectivity is not the same as sovereignty.", "locator": "Connectivity doesn't guarantee sovereignty", "quote_verified": true}]}], "insight_total": 19, "top_entities": ["Strait of Hormuz", "Iraq", "Syria", "Lebanon", "Iran", "Baniyas", "Haditha", "Ceyhan", "Trump administration", "Houthis", "Israel", "Saudi Arabia"], "source_meta": {"author": "", "word_count": 1506, "paywalled": false}}, {"record_id": "7191544dd1d936fa", "source_type": "concepts", "source_name": "Chatham House", "source_url": "https://www.chathamhouse.org/2026/09/what-can-drcs-national-dialogue-achieve", "title": "What can DRC’s national dialogue achieve?", "published_date": "2026-09-24", "language": "en", "processed_at": "2026-09-26T11:16:04Z", "processor": "claude-code-sub-opus", "tags": ["Geopolitics", "Society"], "gist": "Chatham House argues DRC President Tshisekedi's 27 August national dialogue — pitched as a 26-province process to 're-found' the state — is in practice likely to legitimize a post-2028 transition of three to five years, amid tacit government-opposition agreement that 2028 elections cannot happen and a controversial bill targeting constitutional article 220 on term limits. With a fragmented opposition, US backing after a critical minerals deal and the churches still undecided, Tshisekedi holds the stronger hand, and the main risk is an elite power-sharing deal echoing Kabila's 2016-17 'glissement' while the Washington, Doha and domestic peace tracks remain interdependent.", "themes": [{"theme": "Tshisekedi's re-founding dialogue vs opposition rejection", "insights": [{"claim": "DRC President Félix Tshisekedi announced a 'national dialogue' on 27 August 2026 built on public consultations in all 26 provinces culminating in a Kinshasa convention, with the stated aim not just of addressing insecurity and inequality but of reconstructing or 're-founding' the Congolese state.", "speaker": "Chatham House", "type": "data_point", "entities": ["Félix Tshisekedi", "DRC", "Kinshasa"], "conviction": "high", "so_what": "A state 're-founding' agenda signals potential constitutional and institutional rewrites that could alter the legal framework under which DRC mining contracts and licences operate.", "quote": null, "locator": "Opening", "quote_verified": false}, {"claim": "The DRC opposition C64 coalition (Moïse Katumbi, Martin Fayulu, Delly Sesanga, Jean-Marc Kabund) and exiled ex-president Joseph Kabila's 'Sauvons le Congo' platform both rejected Tshisekedi's national dialogue as a vehicle to legitimize changing the constitution and extending his rule beyond the two-term limit ending in 2028.", "speaker": "Chatham House", "type": "data_point", "entities": ["C64", "Moïse Katumbi", "Martin Fayulu", "Delly Sesanga", "Jean-Marc Kabund", "Joseph Kabila", "Sauvons le Congo", "Félix Tshisekedi"], "conviction": "high", "so_what": "Broad, cross-faction opposition rejection raises the odds of a contested legitimacy crisis around 2028 — a key political-risk input for DRC-exposed copper/cobalt names.", "quote": null, "locator": "Opening", "quote_verified": false}, {"claim": "A controversial DRC bill would pave the way for a referendum to modify article 220 of the constitution, the clause that forbids changing the number or duration of presidential terms.", "speaker": "Chatham House", "type": "data_point", "entities": ["DRC constitution", "article 220", "Félix Tshisekedi"], "conviction": "high", "so_what": "Progress of the article 220 referendum bill is the single clearest trackable milestone for a Tshisekedi term extension.", "quote": "a controversial bill that would pave the way for a referendum allowing the modification of article 220 of the constitution", "locator": "Opening", "quote_verified": true}, {"claim": "Tshisekedi's government and the opposition hold fundamentally incompatible framings: the president blames DRC's crisis mainly on Rwanda's backing of M23, while much of the opposition and the Catholic and Protestant churches see the M23 conflict as a symptom of bad governance and corruption under Tshisekedi.", "speaker": "Chatham House", "type": "thesis", "entities": ["Félix Tshisekedi", "Rwanda", "M23", "Catholic church", "Protestant churches"], "conviction": "high", "so_what": "Without a shared diagnosis, the dialogue is unlikely to yield durable reform — price DRC governance risk as persistent rather than resolving.", "quote": "the conflict is more a symptom of the political crisis than its cause", "locator": "Points of (dis)agreement", "quote_verified": true}, {"claim": "Tshisekedi is using the national dialogue to build a 'united front' under his own control aligned against Rwanda, while refusing to include M23 (reserving that for the Doha Process), ruling out a venue outside the DRC that would let exiled politicians attend, and relegating religious denominations to a secondary or symbolic role.", "speaker": "Chatham House", "type": "thesis", "entities": ["Félix Tshisekedi", "Rwanda", "M23", "Doha Process", "Qatar"], "conviction": "high", "so_what": "Design choices signal a president-controlled process rather than a genuine negotiation, raising the chance of a co-opted rather than consensual outcome.", "quote": null, "locator": "Points of (dis)agreement", "quote_verified": false}]}, {"theme": "Tacit consensus on no 2028 election", "insights": [{"claim": "Behind closed doors, both DRC's government and opposition acknowledge that elections probably cannot be held by the end of Tshisekedi's second term in 2028, creating broad but tacit agreement to delay elections in favour of 'dialogue'.", "speaker": "Chatham House", "type": "prediction", "entities": ["DRC", "Félix Tshisekedi", "2028 elections"], "conviction": "high", "so_what": "Investors should treat a missed 2028 election and an extra-constitutional transition as the base case, not a tail risk, in DRC political-risk models.", "quote": "elections probably cannot be held by the end of Tshisekedi’s second term in 2028", "locator": "Points of (dis)agreement", "quote_verified": true}, {"claim": "Three factors make a 2028 DRC election unlikely: little organizational progress so election quality would be questionable; M23 holding important eastern territories, where excluding those provinces could be read as endorsing secession and country break-up; and some opposition figures seeing dialogue as a route to power without the polls.", "speaker": "Chatham House", "type": "causal", "entities": ["M23", "eastern DRC", "DRC opposition"], "conviction": "high", "so_what": "Territorial control by M23 directly feeds constitutional timelines — escalation in the east lengthens the likely transition period.", "quote": null, "locator": "Points of (dis)agreement", "quote_verified": false}, {"claim": "Those close to Tshisekedi hope for broad agreement on a three-to-five-year post-2028 transition, which would amount to a de facto extension of his tenure beyond constitutional limits if he stayed in office throughout; some opposition figures instead want a shorter transition, possibly without Tshisekedi, via power-sharing, a new electoral commission and fresh elections.", "speaker": "Chatham House", "type": "framework", "entities": ["Félix Tshisekedi", "DRC opposition", "electoral commission"], "conviction": "medium", "so_what": "Scenario tree for DRC to 2031-33: long Tshisekedi-led transition vs short power-sharing transition — the former implies policy continuity for mining partners like the US.", "quote": null, "locator": "Points of (dis)agreement", "quote_verified": false}, {"claim": "The prospective post-2028 transition in DRC echoes the two-year 'glissement' Joseph Kabila negotiated in 2016-17 to stay beyond his second term, and the core risk is that Tshisekedi uses talks to co-opt part of the opposition just as Kabila did.", "speaker": "Chatham House", "type": "thesis", "entities": ["Joseph Kabila", "glissement", "Félix Tshisekedi"], "conviction": "medium", "so_what": "The 2016-17 glissement is the historical template for how DRC term-overruns play out — use it to calibrate duration and unrest risk.", "quote": "The risk is that he intends to use talks as a way of co-opting part of the opposition, just as Kabila did in 2016-17.", "locator": "Points of (dis)agreement", "quote_verified": true}, {"claim": "The DRC opposition wants to wrest power from Tshisekedi but does not necessarily favour elections to resolve the crisis, and may see dialogue as the best means of unseating the president — meaning neither side is genuinely committed to an electoral route.", "speaker": "Chatham House", "type": "contrarian", "entities": ["DRC opposition", "Félix Tshisekedi"], "conviction": "medium", "so_what": "Opposition victory would not necessarily mean a return to constitutional order; elite-bargain outcomes dominate either way.", "quote": null, "locator": "Points of (dis)agreement", "quote_verified": false}]}, {"theme": "Balance of power favours Tshisekedi",
