er-side Java web services are exposed, raising remediation urgency for enterprises.", "quote": "Successful attacks of this vulnerability can result in takeover of Oracle Java SE, Oracle GraalVM for JDK, Oracle GraalVM Enterprise Edition.", "locator": "[This] difficult to exploit vulnerability", "quote_verified": true}, {"claim": "The Oracle JDK versions listed as affected by Java4Shell include the same version numbers Oracle released in its November 2026 Critical Security Patch Update, such as 27.0.1.0.3 and 25.0.5.0.3.", "speaker": "Michael Redlich", "type": "data_point", "entities": ["Oracle", "Java4Shell"], "conviction": "medium", "so_what": "Even freshly patched Oracle JDKs need further fixes, extending the remediation window.", "quote": null, "locator": "Oracle has released versions 27.0.1.0.3", "quote_verified": false}, {"claim": "BellSoft, Azul, JetBrains, GraalVM, Quarkus and WildFly have addressed the Java4Shell CVE, and BellSoft's Liberica JDK CSPU release includes a Java4Shell patch among 111 fixes and backports.", "speaker": "Michael Redlich", "type": "data_point", "entities": ["BellSoft", "Azul", "JetBrains", "Quarkus", "WildFly", "Liberica JDK"], "conviction": "high", "so_what": "Rapid response by downstream OpenJDK distributors strengthens their competitive case against Oracle Java licensing.", "quote": null, "locator": "Organizations and projects that have addressed", "quote_verified": false}, {"claim": "The Spring team delivered GA releases across Spring Boot, Spring Framework, Spring Security, Spring AI and other projects in one week and resolved a total of 90 CVEs spanning multiple projects.", "speaker": "Michael Redlich", "type": "data_point", "entities": ["Spring", "Spring Boot", "Spring AI"], "conviction": "high", "so_what": "A large CVE batch in the dominant Java framework signals heavy enterprise patching workload.", "quote": "The Spring team has also resolved a total of 90 CVEs spanning multiple projects.", "locator": "It was a busy week over at Spring", "quote_verified": true}, {"claim": "Azul Payara 7.6.0 resolves five CVEs, including CVE-2026-90908 allowing unauthenticated JMX/RMI admin bypass via host spoofing that may lead to RCE, and CVE-2026-110003 allowing full server compromise via an arbitrary X-GlassFish-authToken header.", "speaker": "Michael Redlich", "type": "data_point", "entities": ["Azul Payara", "Azul"], "conviction": "high", "so_what": "Critical admin-bypass flaws in application servers heighten security risk for Jakarta EE deployments.", "quote": null, "locator": "The release of Azul Payara 7.6.0", "quote_verified": false}]}, {"theme": "OpenJDK roadmap toward JDK 28", "insights": [{"claim": "JEP 547, Lazy Constants (Fourth Preview), is targeted for JDK 28 with no changes, offering immutable value holders initialized at most once with final-field performance and flexible initialization timing.", "speaker": "Michael Redlich", "type": "data_point", "entities": ["JEP 547", "JDK 28", "OpenJDK"], "conviction": "high", "so_what": "Incremental JVM performance features continue, supporting Java's position in startup-sensitive workloads.", "quote": null, "locator": "JEP 547, Lazy Constants (Fourth Preview)", "quote_verified": false}, {"claim": "JEP 548, the Vector API's thirteenth incubator, adds Vector<Float16> support for 16-bit floating-point lanes and will keep incubating until Project Valhalla features reach preview.", "speaker": "Michael Redlich", "type": "data_point", "entities": ["JEP 548", "Vector API", "Project Valhalla"], "conviction": "high", "so_what": "Float16 vector support aligns Java with AI/ML numerical workloads, though dependence on Valhalla delays production use.", "quote": null, "locator": "JEP 548, Vector API (Thirteenth Incubator)", "quote_verified": false}]}, {"theme": "Ecosystem releases including AI agent tooling", "insights": [{"claim": "LangChain4j 1.24.0 adds DecisionSchedulerPlanner and DecisionModels classes for a decision model-based agentic pattern and supports resuming suspended agentic systems in AgentMonitor.", "speaker": "Michael Redlich", "type": "data_point", "entities": ["LangChain4j"], "conviction": "high", "so_what": "Agentic AI frameworks are maturing within the enterprise Java ecosystem.", "quote": null, "locator": "The formal release (along with the thirty-fourth", "quote_verified": false}, {"claim": "Java Operator SDK 5.7.0 can enable virtual threads, adds a keepAlive() method, and is now built on Fabric8 Kubernetes Client 8.0.", "speaker": "Michael Redlich", "type": "data_point", "entities": ["Java Operator SDK", "Fabric8 Kubernetes Client"], "conviction": "medium", "so_what": "Virtual threads adoption is spreading into Kubernetes operator tooling.", "quote": null, "locator": "The release of Java Operator SDK 5.7.0", "quote_verified": false}, {"claim": "Helidon 27.0.2 raises the default in-memory decoded-input limit to 1 MiB and aligns with Oracle's November 2026 Critical Patch Updates across its 4.x and 3.x trains.", "speaker": "Michael Redlich", "type": "data_point", "entities": ["Helidon", "Oracle"], "conviction": "medium", "so_what": "Oracle's own frameworks follow its quarterly patch cadence.", "quote": null, "locator": "The release of Helidon 27.0.2", "quote_verified": false}, {"claim": "Micrometer Metrics 1.18.0 optimizes PrometheusMeterRegistry snapshot collection and Micrometer Tracing 1.8.0 simplifies baggage handling.", "speaker": "Michael Redlich", "type": "data_point", "entities": ["Micrometer"], "conviction": "medium", "so_what": "Observability libraries continue incremental performance improvements.", "quote": null, "locator": "After two milestones and two releases", "quote_verified": false}, {"claim": "Hibernate Reactive 5.0.0.CR2 is the last release candidate for 5.0, which will be declared end-of-life at its GA release with focus shifting to 5.1.0, after a fix for a @TableGenerator deadlock.", "speaker": "Michael Redlich", "type": "data_point", "entities": ["Hibernate Reactive"], "conviction": "medium", "so_what": "Short support lifecycles push users to upgrade quickly.", "quote": null, "locator": "Version 5.0.0.CR2 will be the last", "quote_verified": false}]}], "insight_total": 13, "top_entities": ["Java4Shell", "Oracle", "Oracle GraalVM", "BellSoft", "Azul Payara", "Spring", "LangChain4j", "JDK 28", "Helidon", "Liberica JDK"], "source_meta": {"author": "Michael Redlich", "word_count": 2304, "paywalled": false}}, {"record_id": "d7a55264616845ee", "source_type": "technology", "source_name": "InfoQ", "source_url": "https://www.infoq.com/news/2026/11/netflix-sdlc-ai-coding-agents/", "title": "Netflix at QConSF 2026: Retrofitting the SDLC for AI Coding Agents", "published_date": "2026-11-23", "language": "en", "processed_at": "2026-11-24T12:00:00Z", "processor": "claude-code-sub-opus", "tags": ["AI", "Tech"], "gist": "Netflix's Commerce team, presenting at QCon San Francisco 2026, retrofitted its SDLC for AI coding agents mainly through documentation, consistency and review rather than agent-specific work: 45 agent-readable ADRs, AGENTS.md as a robots.txt analogue, a review agent posting only verified blockers, and per-domain GraphRAG served via one MCP tool. The team reported 32% more PRs year over year, no Sev 1 incidents in 2026 on a core service, and developer NPS rising from -3 to +25.", "themes": [{"theme": "Codebases built for humans slow agents", "insights": [{"claim": "Netflix engineer Mark Khuzam argues that retrofitting the SDLC for AI coding agents was mostly not about agents at all but about documentation, consistency and review.", "speaker": "Andrew Hoblitzell", "type": "thesis", "entities": ["Netflix", "Mark Khuzam"], "conviction": "high", "so_what": "AI coding productivity gains depend on organizational engineering hygiene, not just tool purchases.", "quote": null, "locator": "Khuzam argued that most of the work", "quote_verified": false}, {"claim": "Netflix's Commerce team found that rolling out Claude Code to every engineer collided with systems built over 20 years for human developers, limiting the promised speed gains.", "speaker": "Andrew Hoblitzell", "type": "causal", "entities": ["Netflix", "Claude Code"], "conviction": "high", "so_what": "Enterprise AI coding ROI is gated by legacy codebase readiness, lengthening the adoption curve.", "quote": "Agents promised speed. But we spent 20 years building for humans.", "locator": "Khuzam opened with a mock company", "quote_verified": true}, {"claim": "Netflix's first attempt to have an AI agent migrate tests took four tries, because internal docs were hard to find before the context window ran out and tests were written inconsistently across the codebase.", "speaker": "Andrew Hoblitzell", "type": "anecdote", "entities": ["Netflix"], "conviction": "high", "so_what": "Context-window limits and inconsistent code are concrete friction points for agent adoption.", "quote": null, "locator": "The team's first attempt was having", "quote_verified": false}]}, {"theme": "Context engineering for agents", "insights": [{"claim": "Netflix's Commerce team wrote 45 architecture decision records written for both people and agents, each covering context, decision, pattern, anti-pattern and AI usage notes, and they now ship inside almost every repository.", "speaker": "Andrew Hoblitzell", "type": "framework", "entities": ["Netflix"], "conviction": "high", "so_what": "Agent-readable documentation is becoming a standard engineering investment.", "quote": "getting what engineers know into what agents see", "locator": "Khuzam described the fix as context engineering", "quote_verified": true}, {"claim": "To keep 45 ADRs and more than 300 other documents findable for agents, Netflix borrowed from search engines, using an AGENTS.md file in the role of robots.txt.", "speaker": "Andrew Hoblitzell", "type": "framework", "entities": ["Netflix", "AGENTS.md"], "conviction": "high", "so_what": "AGENTS.md is emerging as a de facto standard for agent-facing project instructions.", "quote": null, "locator": "To keep those records and more", "quote_verified": false}, {"claim": "For cross-service work, Netflix found that loading every repository did not fit, Git submodules were brittle, a Git MCP server sees one file rather than the system, and shared copies went stale.", "speaker": "Andrew Hoblitzell", "type": "contrarian", "entities": ["Netflix", "Git", "MCP"], "conviction": "high", "so_what": "Naive context approaches fail at enterprise scale, creating room for code-knowledge-graph tooling.", "quote": "sees one file, not the system", "locator": "Khuzam listed approaches that did not", "quote_verified": true}, {"claim": "Netflix settled on per-domain GraphRAG combining code structure with doc and ADR meaning, pinned to specific commits and served through a single Model Context Protocol tool that Claude Code, Cursor, Codex, a Slack bot and CI review all query, with every answer citing file and line.", "speaker": "Andrew Hoblitzell", "type": "framework", "entities": ["Netflix", "GraphRAG", "Model Context Protocol", "Claude Code", "Cursor", "Codex"], "conviction": "high", "so_what": "A shared, tool-agnostic context layer reduces lock-in to any single AI coding vendor.", "quote": null, "locator": "The team needed context that was", "quote_verified": false}]}, {"theme": "Agents in review and CI", "insights": [{"claim": "At Netflix the CI pipeline remains deterministic, with builds, tests, screenshot diffing, merge queues and canaries, while agents plug into each phase rather than replacing it.", "speaker": "Andrew Hoblitzell", "type": "thesis", "entities": ["Netflix"], "conviction": "high", "so_what": "Deterministic CI/CD tooling stays essential alongside AI agents.", "quote": null, "locator": "The second half of the talk", "quote_verified": false}, {"claim": "Netflix's first review agent left 23 comments on a single PR starting with praise; it now posts only verified blockers, each with evidence, a fix and the ADR rule broken.", "speaker": "Andrew Hoblitzell", "type": "anecdote", "entities": ["Netflix"], "conviction": "high", "so_what": "AI code review value depends on signal-to-noise; noisy reviewers get ignored.", "quote": "Overall this PR looks great!", "locator": "Its first version left 23 comments", "quote_verified": true}, {"claim": "At Netflix, engineers can add a revise label for an agent to read a review and push a fix, but changes are not yet auto-merged and engineers own the code.", "speaker": "Andrew Hoblitzell", "type": "data_point", "entities": ["Netflix"], "conviction": "high", "so_what": "Human ownership remains the governance model even at advanced AI adopters.", "quote": "Changes aren't yet auto-merged, and engineers own the code.", "locator": "Its first version left 23 comments", "quote_verified": true}]}, {"theme": "Reported outcomes", "insights": [{"claim": "Netflix's Commerce team reported no Sev 1 incidents in 2026 on a core service and 32% more pull requests year over year after retrofitting its SDLC for AI agents.", "speaker": "Andrew Hoblitzell", "type": "data_point", "entities": ["Netflix"], "conviction": "high", "so_what": "Evidence that AI coding agents can raise throughput without degrading reliability when paired with strong process.", "quote": null, "locator": "Khuzam reported no Sev 1 incidents", "quote_verified": false}, {"claim": "Developer Net Promoter Score for Netflix Commerce's internal framework rose from -3 to +25 over three quarters.", "speaker": "Andrew Hoblitzell", "type": "data_point", "entities": ["Netflix"], "conviction": "high", "so_what": "Agent-readiness work also improves human developer experience.", "quote": null, "locator": "Khuzam reported no Sev 1 incidents", "quote_verified": false}, {"claim": "Khuzam framed the stakes as shipping agent-written code to Tier 0 services serving more than 300M members without failures.", "speaker": "Andrew Hoblitzell", "type": "data_point", "entities": ["Netflix", "Mark Khuzam"], "conviction": "medium", "so_what": "Large consumer platforms are already putting agent-written code into their most critical services.", "quote": "what gives us the confidence to ship Tier 0 services to 300M+ members without everything falling apart?", "locator": "Ahead of the session, Khuzam framed", "quote_verified": true}, {"claim": "Khuzam's closing rules are to decide what agents should do and tell them, make it easy to find how to do it, and remember that human judgement still matters, arguing this is simply good engineering for a new reader.", "speaker": "Andrew Hoblitzell", "type": "framework", "entities": ["Mark Khuzam"], "conviction": "high", "so_what": "Firms with strong engineering discipline will capture AI coding gains sooner.", "quote": "None of this is new. It's good engineering, built for a new reader.", "locator": "Khuzam closed with three rules", "quote_verified": true}]}], "insight_total": 14, "top_entities": ["Netflix", "Mark Khuzam", "Claude Code", "AGENTS.md", "GraphRAG", "Model Context Protocol", "Cursor", "Codex"], "source_meta": {"author": "Andrew Hoblitzell", "word_count": 1287, "paywalled": false}}, {"record_id": "e334605009f855b1", "source_type": "technology", "source_name": "InfoQ", "source_url": "https://www.infoq.com/news/2026/11/jep-545-jdk-28/", "title": "JEP 545 Moves ZGC Memory Preparation off the Startup Path in JDK 28", "published_date": "2026-11-23", "language": "en", "processed_at": "2026-11-24T12:00:00Z", "processor": "claude-code-sub-opus", "tags": ["Tech"], "gist": "JEP 545, integrated into JDK 28, moves ZGC heap memory acquisition and preparation off the startup path onto concurrent ZMemoryWorker threads and, on Linux 6.1+, upgrades 4 KB pages to 2 MB pages in the background. Combined with adaptive heap sizing from JEP 546 (still off by default), the JEP's case study shows a 38% startup drop and warmup falling from 80 to 10 seconds for Spring PetClinic on a 32 GB machine, ending the startup-versus-warmup tuning trade-off.", "themes": [{"theme": "The old ZGC startup-vs-warmup trade-off", "insights": [{"claim": "Before JDK 28, deploying ZGC forced a trade-off: a tiny -Xms gave fast startup but long warmup as memory was acquired incrementally, while a large -Xms with AlwaysPreTouch gave fast warmup but paid the whole cost before the first request.", "speaker": "A N M Bazlur Rahman", "type": "causal", "entities": ["ZGC", "JDK 25"], "conviction": "high", "so_what": "Removing this trade-off improves Java's suitability for autoscaled and serverless workloads where cold start matters.", "quote": null, "locator": "A team chasing fast startup set", "quote_verified": false}, {"claim": "According to JEP 545, starting a JVM with a 2 MB heap takes roughly a tenth of a second versus more than ten seconds with a 32 GB heap on current hardware.", "speaker": "A N M Bazlur Rahman", "type": "data_point", "entities": ["JEP 545"], "conviction": "high", "so_what": "Quantifies the cold-start cost large heaps impose on cloud Java deployments.", "quote": null, "locator": "A team chasing fast startup set", "quote_verified": false}, {"claim": "ZGC's pause times do not grow with heap size but its collection frequency does, so a small heap triggers early and frequent collection cycles.", "speaker": "A N M Bazlur Rahman", "type": "causal", "entities": ["ZGC"], "conviction": "high", "so_what": "Explains why heap sizing has driven ZGC tuning costs.", "quote": null, "locator": "Deploying ZGC has until now meant", "quote_verified": false}]}, {"theme": "JEP 545 mechanism", "insights": [{"claim": "JEP 545 introduces a ZMemoryWorker thread per heap partition that commits and uncommits memory concurrently and pre-touches memory and collapses small pages into large ones before application threads reach it.", "speaker": "A N M Bazlur Rahman", "type": "framework", "entities": ["JEP 545", "ZMemoryWorker", "ZGC"], "conviction": "high", "so_what": "Concurrent memory preparation shifts JVM startup cost off the critical path.", "quote": null, "locator": "That work now happens in a new thread", "quote_verified": false}, {"claim": "JEP 545's memory preparation budget is fixed rather than adaptive: ZConcurrentWorkersCPUShare is 0.25, capping preparation at a quarter of available CPU.", "speaker": "A N M Bazlur Rahman", "type": "data_point", "entities": ["JEP 545", "ZGC"], "conviction": "high", "so_what": "Startup gains come with bounded CPU overhead that matters for CPU-constrained containers.", "quote": null, "locator": "The budget is fixed rather than adaptive.", "quote_verified": false}, {"claim": "On Linux 6.1 and later, ZGC probes for MADV_COLLAPSE and upgrades 4 KB pages to 2 MB large pages in the background, so administrators no longer need to reserve large pages up front; identical behavior across operating systems is a non-goal, so Windows may not get it by default.", "speaker": "A N M Bazlur Rahman", "type": "data_point", "entities": ["ZGC", "Linux 6.1", "MADV_COLLAPSE", "Windows"], "conviction": "high", "so_what": "Java performance increasingly favors newer Linux kernels, encouraging infrastructure upgrades.", "quote": null, "locator": "Large pages on Linux no longer require", "quote_verified": false}, {"claim": "Services on Linux 6.1 or later running a modest ZGC heap get concurrent pre-touch and background large pages in JDK 28 without changing any flag, because memory heating is on by default.", "speaker": "A N M Bazlur Rahman", "type": "data_point", "entities": ["ZGC", "JDK 28"], "conviction": "high", "so_what": "Free performance upgrade for existing Java fleets on JDK 28 lowers compute cost.", "quote": null, "locator": "Services already running a modest heap", "quote_verified": false}]}, {"theme": "Adaptive heap sizing dependency and results", "insights": [{"claim": "The headline JEP 545 results depend on adaptive heap sizing from companion JEP 546, which remains off by default and must be enabled with -XX:+ZAdaptiveHeapSizing.", "speaker": "A N M Bazlur Rahman", "type": "contrarian", "entities": ["JEP 545", "JEP 546"], "conviction": "high", "so_what": "Default deployments will not see the full advertised gains without opt-in configuration.", "quote": "The 2 MB initial heap behind the JEP's headline numbers comes from elsewhere: adaptive heap sizing, in the companion JEP 546, which still defaults to off.", "locator": "JEP 545, Faster Startup and Warmup", "quote_verified": true}, {"claim": "With ZGC adaptive heap sizing in JDK 28, the JEP's case study shows a 38% drop in startup time and warmup falling from 80 seconds to 10 for Spring PetClinic on a 32 GB machine.", "speaker": "A N M Bazlur Rahman", "type": "data_point", "entities": ["JDK 28", "Spring PetClinic", "ZGC"], "conviction": "high", "so_what": "Large warmup reductions cut over-provisioning needs for Java services, reducing cloud spend.", "quote": null, "locator": "The third command produces the JEP's", "quote_verified": false}, {"claim": "ZGC adaptive heap sizing lowers minimum and initial heap to 2 MB and raises the max heap ceiling to 100% of physical memory, but the policy holds a reserve, preferring to leave a fifth of the machine free, fighting for a tenth and enforcing a twentieth.", "speaker": "A N M Bazlur Rahman", "type": "data_point", "entities": ["ZGC", "JEP 546"], "conviction": "high", "so_what": "Memory-elastic JVMs could improve container density and utilization.", "quote": "That 100% ceiling reads worse than it behaves.", "locator": "Services already running a modest heap", "quote_verified": true}]}, {"theme": "Caveats and roadmap", "insights": [{"claim": "JEP 545 cautions that applications tuned around a larger initial heap may warm up more slowly and need re-tuning, and pairing UseLargePages with adaptive sizing and no -Xmx disables explicit large pages with a warning.", "speaker": "A N M Bazlur Rahman", "type": "data_point", "entities": ["JEP 545"], "conviction": "medium", "so_what": "Migration to JDK 28 carries re-tuning costs for heavily tuned fleets.", "quote": null, "locator": "Using identical memory techniques on every", "quote_verified": false}, {"claim": "The MADV_COLLAPSE retry loop in ZGC can spin indefinitely when EAGAIN persists, a case the code attributes to pinning through mlock or long-term DMA and treats as user error.", "speaker": "A N M Bazlur Rahman", "type": "data_point", "entities": ["ZGC", "MADV_COLLAPSE"], "conviction": "medium", "so_what": "Edge-case operational risk for specialized workloads using pinned memory.", "quote": null, "locator": "Two further edges live in the implementation", "quote_verified": false}, {"claim": "JDK 28 reaches Rampdown Phase One on December 3, 2026, with general availability scheduled for March 9, 2027, and future work targets better CPU sharing and leveraging ahead-of-time compilation from JEP 544.", "speaker": "A N M Bazlur Rahman", "type": "prediction", "entities": ["JDK 28", "JEP 544"], "conviction": "high", "so_what": "Sets the timeline for when enterprises can adopt these startup improvements in production.", "quote": null, "locator": "JDK 28 reaches Rampdown Phase One", "quote_verified": false}]}], "insight_total": 13, "top_entities": ["JEP 545", "JEP 546", "ZGC", "JDK 28", "ZMemoryWorker", "MADV_COLLAPSE", "Spring PetClinic", "Linux 6.1"], "source_meta": {"author": "A N M Bazlur Rahman", "word_count": 1561, "paywalled": false}}, {"record_id": "ea694382b6ab89ad", "source_type": "technology", "source_name": "InfoQ", "source_url": "https://www.infoq.com/podcasts/simulation-agents-actually-doing", "title": "Simulation Can Tell You What Your Agents are Actually Doing: A Conversation with Zhou Yu", "published_date": "2026-11-23", "language": "en", "processed_at": "2026-11-24T12:00:00Z", "processor": "claude-code-sub-opus", "tags": ["AI", "Tech", "Society"], "gist": "In an InfoQ Architects Podcast with Michael Stiefel, Columbia professor and Arklex.ai founder Zhou Yu argues that non-deterministic, multi-turn AI agents cannot be evaluated with static reference-based benchmarks and instead need dynamic user simulations with personas, goals, corner cases and multi-metric task verifiers across the whole lifecycle. She claims evaluation spend is flipping from a small QA share to a first-class cost, and that simulation should become a shared engineering platform; note the speaker's company sells such testing tools.", "themes": [{"theme": "Why static benchmarks fail for agents", "insights": [{"claim": "Zhou Yu argues AI agents are multi-turn, multi-tool, long-horizon programs whose next user input depends on the agent's previous reply, so static reference-based benchmarks with gold answers break whenever the system changes.", "speaker": "Zhou Yu", "type": "thesis", "entities": ["Zhou Yu"], "conviction": "high", "so_what": "Agent evaluation requires new tooling beyond static benchmarks, creating a market for simulation-based QA.", "quote": "You can't rely on a static benchmark of what we call reference-based evaluation.", "locator": "Multi-Turn Agents and Moving Targets", "quote_verified": true}, {"claim": "Because natural language input is exponential in complexity and diversity compared to button-driven software, testing conversational agents is far harder than traditional UI testing.", "speaker": "Zhou Yu", "type": "causal", "entities": ["Zhou Yu"], "conviction": "high", "so_what": "Testing cost scales with the open-endedness of LLM interfaces, burdening agent deployments.", "quote": null, "locator": "Simulating User Personas", "quote_verified": false}, {"claim": "Since agents generate different plans each run, Zhou Yu says evaluation must be integrated goal-completion testing of whether the user's goal was achieved, rather than turn-by-turn checks, using task verifiers that may be rule-based or LLM judges plus safety and alignment checks.", "speaker": "Zhou Yu", "type": "framework", "entities": ["Zhou Yu"], "conviction": "high", "so_what": "Outcome-based evaluation is becoming the standard metric for production agents.", "quote": null, "locator": "Goal Completion and Task Verifiers", "quote_verified": false}, {"claim": "For critical use cases, Zhou Yu recommends running agent tests multiple times and requiring pass at K, meaning the agent must pass every one of K runs, because of non-determinism.", "speaker": "Zhou Yu", "type": "framework", "entities": ["Zhou Yu"], "conviction": "high", "so_what": "Reliability testing multiplies compute and evaluation costs for mission-critical agents.", "quote": null, "locator": "So that's why simulation is important.", "quote_verified": false}]}, {"theme": "Simulated users and scenario design", "insights": [{"claim": "Zhou Yu's approach uses agents to simulate user behavior with standardized personas, goals and corner cases, replacing costly real user studies with automated, repeatable CI/CD scenarios.", "speaker": "Zhou Yu", "type": "framework", "entities": ["Zhou Yu", "Arklex"], "conviction": "high", "so_what": "Simulated users can substitute for expensive human testing, lowering QA costs for agent builders.", "quote": null, "locator": "So that's why we started looking", "quote_verified": false}, {"claim": "Simulated users with known goals solve a problem production data cannot: in production you don't know the user's real intent, e.g. whether an abruptly ended chat meant success or frustration.", "speaker": "Zhou Yu", "type": "causal", "entities": ["Zhou Yu"], "conviction": "high", "so_what": "Synthetic evaluation provides ground truth that production analytics lack.", "quote": "If you look at production data, you don't know the real intent behind the user, then it's much more difficult.", "locator": "If you look at production data", "quote_verified": true}, {"claim": "Agent simulation scenarios capture real-user corner cases such as repeated questions, keyboard glitches, accents, acronym use by experienced versus novice users, code switching between languages, and background factory noise.", "speaker": "Zhou Yu", "type": "data_point", "entities": ["Zhou Yu"], "conviction": "high", "so_what": "Coverage of messy real-world inputs is a key differentiator for agent-testing vendors.", "quote": null, "locator": "So your agent in some way pressure", "quote_verified": false}, {"claim": "Scenario inputs for agent simulations can be generated from tool-call trajectories, existing customer-service data, product design docs, prior user studies, domain knowledge and even mined social media, with subject-matter experts reviewing and editing them in natural language.", "speaker": "Zhou Yu", "type": "framework", "entities": ["Zhou Yu"], "conviction": "medium", "so_what": "Human SMEs remain in the loop, limiting full automation of agent QA.", "quote": null, "locator": "Designing, Running, Maintaining Simulation Tests", "quote_verified": false}, {"claim": "Zhou Yu argues customer-facing agent test pipelines must continually evolve as user distribution shifts, such as new products or entering new markets like Brazil and Argentina with different languages, policies and laws.", "speaker": "Zhou Yu", "type": "thesis", "entities": ["Zhou Yu"], "conviction": "high", "so_what": "Agent QA is an ongoing operational expense, not a one-time project, supporting recurring-revenue testing platforms.", "quote": null, "locator": "And the important part is if", "quote_verified": false}, {"claim": "User simulations through APIs can be run fully in parallel, while web-based simulations that drive a browser are slower and less parallelizable because only so many browsers can run on a machine.", "speaker": "Zhou Yu", "type": "data_point", "entities": ["Zhou Yu"], "conviction": "medium", "so_what": "API-exposed agents are cheaper to test at scale than browser-based ones.", "quote": null, "locator": "Running Simulations in Parallel", "quote_verified": false}, {"claim": "Arklex offers an open-source Python package, ArkSim, in which a user-simulator API talks to the developer's agent API to generate data and run evaluations, plus automatic batch scenario generation.", "speaker": "Zhou Yu", "type": "d 2 to 2 mA cm−2 at 2 MPa, 30 °C) for only ~5% volumetric energy-density cost. Contoured cells survive pulses up to 8–9 mA cm−2 and repeated WLTP EV drive cycles at 2 MPa and 60 °C where flat interfaces fail immediately, though contouring barely helps charge-side dendrites and scalable patterning (stamping, laser etching) remains unproven.", "themes": [{"theme": "Discharge voiding as the binding constraint for lithium-metal solid-state batteries at practical pressure", "insights": [{"claim": "In lithium-metal solid-state batteries, voids form at the Li/ceramic electrolyte interface during discharge when Li+ flux away from the interface through the electrolyte exceeds the rate at which Li can be transported to the interface within the anode, raising polarization and ultimately causing cell failure.", "speaker": "Nature Energy", "type": "causal", "entities": ["lithium metal anode", "solid electrolyte"], "conviction": "high", "so_what": "Discharge-rate capability, not just dendrites on charge, is a gating failure mode for solid-state EV cells.", "quote": "Voiding occurs when the flux of Li+ away from the interface through the solid electrolyte exceeds the rate at which Li can be transported to the interface within the anode", "locator": "Voids can form at the lithium/ceramic", "quote_verified": true}, {"claim": "Voiding during discharge also seeds dendrite failure: lost contact area raises local current density on the next charge, so dendrites initiate at lower charging currents, leading to short circuit.", "speaker": "Nature Energy", "type": "causal", "entities": ["dendrites", "solid-state batteries"], "conviction": "high", "so_what": "Fixing discharge voiding has knock-on benefits for charge-side reliability and cycle life.", "quote": null, "locator": "Voids can form at the lithium/ceramic", "quote_verified": false}, {"claim": "Voiding in lithium-metal solid-state cells can be alleviated by stack pressures above about 10 MPa so lithium creep keeps up with discharge, but practical solid-state batteries will very likely need to operate at 2 MPa or less, so high pressure is not a viable fix.", "speaker": "Nature Energy", "type": "thesis", "entities": ["stack pressure", "solid-state batteries"], "conviction": "high", "so_what": "Pack-level pressure hardware is a cost/weight burden; solutions that work at <=2 MPa are commercially decisive.", "quote": "practical solid-state batteries are very unlikely to operate at such high stack pressures; typically, ≤2 MPa will be required", "locator": "Voiding can be alleviated to some extent", "quote_verified": true}, {"claim": "Existing approaches to discharge voiding in solid-state batteries rely on new materials: lithium alloys for faster Li transport, interlayers between lithium and the ceramic electrolyte, and 3D mixed ionic-electronic conductor architectures in the anode.", "speaker": "Nature Energy", "type": "framework", "entities": ["lithium alloys", "interlayers", "mixed ionic-electronic conductors"], "conviction": "medium", "so_what": "Maps the competing technical routes; contouring competes as a materials-free, geometry-only option.", "quote": null, "locator": "Voiding can be alleviated to some extent", "quote_verified": false}]}, {"theme": "Interface contouring: a materials-free geometric fix and its design rules", "insights": [{"claim": "Contouring the lithium/ceramic electrolyte interface with a periodic 3D topography requires no new materials, alloys or interlayers and enlarges interfacial area to cut local current density, though it also creates current hot spots where voiding is most likely to begin.", "speaker": "Nature Energy", "type": "framework", "entities": ["contouring", "Li6PS5Cl"], "conviction": "high", "so_what": "A process-only change could be easier to adopt in existing sulfide-electrolyte cell lines than new chemistries.", "quote": "An alternative, which requires no new materials, alloys or interlayers, is to contour the interface", "locator": "An alternative, which requires no new", "quote_verified": true}, {"claim": "Among frustum-of-square-pyramid, egg-box and square-pyramid topographies, the sinusoidal egg-box shape gives the highest critical current of stripping because it avoids sharp corners where local current spikes.", "speaker": "Nature Energy", "type": "data_point", "entities": ["egg-box topography", "critical current of stripping"], "conviction": "high", "so_what": "Specific geometry choice matters; sharp-cornered patterns underperform.", "quote": null, "locator": "Optimizing the contour geometry", "quote_verified": false}, {"claim": "For egg-box-contoured Li/Li6PS5Cl interfaces, the highest critical stripping current comes from low peaks placed close together, because lower trough current density, low trough pressure aiding lithium creep, and shorter diffusion paths for Li flux all coincide only in that regime.", "speaker": "Nature Energy", "type": "causal", "entities": ["egg-box topography", "Li6PS5Cl"], "conviction": "high", "so_what": "Gives a concrete design target (fine, shallow features) for manufacturers pursuing patterned electrolytes.", "quote": "Only a subset of the contoured interfaces benefits from all three factors. They have small peaks relatively close together", "locator": "The combined effect of current, pressure", "quote_verified": true}, {"claim": "Contoured Li/solid electrolyte interfaces enhance Li flux toward the troughs in a way analogous to how microelectrodes enhance mass transport in liquid electrochemistry, but taller peaks lengthen the diffusion path, which dominates over the curvature benefit.", "speaker": "Nature Energy", "type": "causal", "entities": ["microelectrodes", "Li flux"], "conviction": "medium", "so_what": "Mechanistic basis suggests further gains from finer patterning if manufacturing resolution allows.", "quote": "Higher curvature enhances the local flux, but increasing peak height lengthens the diffusion path, which turns out to be the more important effect.", "locator": "S f up to ~2 mA cm−2 with pulse peaks as high as 9 mA cm−2.", "speaker": "Nature Energy", "type": "data_point", "entities": ["WLTP", "Argonne National Laboratory", "Hyundai Ioniq"], "conviction": "high", "so_what": "Provides a concrete cell-level rate target that solid-state anodes must meet for passenger EVs.", "quote": "The WLTP drive cycle demands cell-level discharge current densities of up to ~2 mA cm−2 and pulse discharge current densities as high as 9 mA cm−2", "locator": "The WLTP drive cycle demands", "quote_verified": true}, {"claim": "At 2 MPa and 60 °C, a contoured Li/Li6PS5Cl cell completed 75 cycles of ten concatenated WLTP discharge sequences (3.31 mAh cm−2, about five hours of driving) with total polarization below 2 mV, while a non-contoured cell rose ~250 mV in the first sequence and polarized to 5 V before completing the second cycle.", "speaker": "Nature Energy", "type": "data_point", "entities": ["WLTP", "Li6PS5Cl"], "conviction": "high", "so_what": "Head-to-head evidence that interface geometry decides whether a lithium-metal solid-state cell survives realistic EV duty.", "quote": "polarized to 5 V before completing the second cycle", "locator": "The WLTP drive cycle demands", "quote_verified": true}, {"claim": "The contoured cell withstood the WLTP's 9 mA cm−2 peaks despite a lower 8 mA cm−2 limit in the synthetic pulse test because WLTP pulses are shorter with longer recovery intervals.", "speaker": "Nature Energy", "type": "causal", "entities": ["WLTP"], "conviction": "medium", "so_what": "Duty-cycle shape, not just peak current, determines viability; lab pulse tests may be conservative.", "quote": null, "locator": "Notably, the maximum pulse current density", "quote_verified": false}, {"claim": "Stable constant-current stripping at 6 mA cm−2 at 2 MPa and 60 °C serves as an approximate benchmark for completing the WLTP drive cycle, whereas cells stable at 4 mA cm−2 (7 MPa/30 °C or 0.1 MPa/60 °C) failed after tens of WLTP cycles.", "speaker": "Nature Energy", "type": "framework", "entities": ["WLTP", "critical current of stripping"], "conviction": "medium", "so_what": "Gives a screening threshold for translating lab constant-current data into EV-readiness.", "quote": "stable cycling at 6 mA cm−2, 2 MPa and 60 °C provides a benchmark for completing the WLTP drive cycle", "locator": "While the results of the constant current", "quote_verified": true}, {"claim": "In situ X-ray computed tomography showed the contoured Li/electrolyte interface kept its original morphology after one and after 15 WLTP drive-cycle sets.", "speaker": "Nature Energy", "type": "data_point", "entities": ["X-ray computed tomography", "WLTP"], "conviction": "medium", "so_what": "Structural stability of the pattern supports durability over repeated use.", "quote": null, "locator": "In situ XCT shows no obvious", "quote_verified": false}]}, {"theme": "Full-cell results, energy-density trade-off and path to commercialization", "insights": [{"claim": "An egg-box contour of 5 µm height and 30 µm separation reduces the theoretical volumetric energy density of a lithium-metal solid-state battery by only about 5% versus a flat interface, while larger contours (25 µm/150 µm) markedly compromise energy density.", "speaker": "Nature Energy", "type": "data_point", "entities": ["volumetric energy density", "solid-state batteries"], "conviction": "high", "so_what": "A ~5% energy-density cost for ~10x discharge rate is a favorable trade for EV applications.", "quote": "reduces the volumetric energy density by only 5% while substantially increasing the discharge rate capabilities of the cell", "locator": "Implications of contouring on energy density", "quote_verified": true}, {"claim": "A full cell with an ~80 µm contoured Li6PS5Cl electrolyte and a ~120 µm LiNi0.83Mn0.06Co0.11O2 composite cathode cycled stably at 6 mA cm−2 discharge and 0.5 mA cm−2 charge (4 mAh cm−2) at 2 MPa and 60 °C, while the non-contoured counterpart failed during the second charge.", "speaker": "Nature Energy", "type": "data_point", "entities": ["LiNi0.83Mn0.06Co0.11O2", "Li6PS5Cl"], "conviction": "high", "so_what": "Demonstrates the benefit carries into full cells with NMC cathodes at commercially relevant areal capacity.", "quote": null, "locator": "To assess the effect of contouring", "quote_verified": false}, {"claim": "Combining contouring with a Li-rich Ag alloy anode (0.5% Ag) with faster Li diffusivity further improved pulse-stripping stability to 20 cycles, and the approach could extend to other fast-transport alloy anodes.", "speaker": "Nature Energy", "type": "prediction", "entities": ["Li-Ag alloy", "alloy anodes"], "conviction": "medium", "so_what": "Contouring is additive with alloy-anode strategies rather than competing with them.", "quote": null, "locator": "Recognizing the role of Li flux", "quote_verified": false}, {"claim": "Contouring improves charging (dendrite) critical currents by at most about 50%, so it must be paired with separate dendrite-mitigation strategies for charging even though it strongly helps discharge.", "speaker": "Nature Energy", "type": "contrarian", "entities": ["dendrites", "contouring"], "conviction": "high", "so_what": "Contouring is not a complete solid-state solution; fast-charge remains an open problem.", "quote": "it can only improve charging currents by an additional 50% at most", "locator": "Recognizing the role of Li flux", "quote_verified": true}, {"claim": "Scale-up of interface contouring to larger-format solid-state cells with thin electrolytes will require scalable patterning techniques such as stamping or laser etching, and a predictive model of void formation is still lacking.", "speaker": "Nature Energy", "type": "prediction", "entities": ["stamping", "laser etching"], "conviction": "medium", "so_what": "Lab results used Nanoscribe two-photon 3D-printed templates; manufacturability is the key commercialization risk.", "quote": "Further work should also focus on implementing similar contoured interfaces on larger format solid-state cells with thin electrolytes using scalable techniques such as stamping or laser etching.", "locator": "Recognizing the role of Li flux", "quote_verified": true}, {"claim": "The discharge-rate improvement from contouring is independent of electrolyte heat treatment: a non-sintered contoured Li6PS5Cl electrolyte also withstood the WLTP drive cycle without appreciable polarization.", "speaker": "Nature Energy", "type": "data_point", "entities": ["Li6PS5Cl", "WLTP"], "conviction": "medium", "so_what": "Removing a sintering step could simplify manufacturing of contoured sulfide electrolytes.", "quote": null, "locator": "Fabrication of Li6PS5Cl solid electrolyte discs", "quote_verified": false}]}], "insight_total": 28, "top_entities": ["Li6PS5Cl", "WLTP", "egg-box", "solid-state batteries", "Argonne National Laboratory", "LiNi0.83Mn0.06Co0.11O2", "Hyundai Ioniq", "stack pressure", "dendrites", "University of Oxford", "Nanoscribe"], "source_meta": {"author": "Nature Energy", "word_count": 7958, "paywalled": false}}, {"record_id": "bc760996ce3c26e7", "source_type": "technology", "source_name": "NVIDIA Developer Blog", "source_url": "https://developer.nvidia.com/blog/get-started-with-gpu-accelerated-duckdb-analytics-using-the-sirius-core-extension/", "title": "Get Started with GPU-Accelerated DuckDB Analytics Using the Sirius Core Extension | NVIDIA Technical Blog", "published_date": "2026-11-23", "language": "en", "processed_at": "2026-11-24T12:00:00Z", "processor": "claude-code-sub-opus", "tags": ["Tech", "AI"], "gist": "NVIDIA and DuckLabs released Sirius, an open-source GPU-native SQL engine from UW–Madison and NVIDIA, as a DuckDB core extension that runs supported analytical queries on NVIDIA GPUs with two SQL commands and CPU fallback. NVIDIA's cold-run TPC-H-derived benchmarks on AWS (SF100 to SF10K, data in Amazon S3) show tuned two-GPU Sirius delivering 3.25x–5.50x speedups and up to ~79% lower query-time compute cost versus the best tested CPU DuckDB configurations, with caveats on methodology.", "themes": [{"theme": "GPU acceleration enters the DuckDB ecosystem as a drop-in extension", "insights": [{"claim": "NVIDIA and DuckLabs released Sirius, an open-source GPU-native SQL engine developed by the University of Wisconsin–Madison and NVIDIA, as an official DuckDB core extension that accelerates supported analytical queries on NVIDIA GPUs.", "speaker": "Allison Ding", "type": "data_point", "entities": ["NVIDIA", "DuckLabs", "Sirius", "DuckDB", "University of Wisconsin–Madison"], "conviction": "high", "so_what": "Distribution through an embedded analytics database's core extension channel widens NVIDIA's GPU demand surface into everyday SQL analytics, beyond AI training.", "quote": "NVIDIA and DuckLabs collaborated to release Sirius as a DuckDB core extension, bringing GPU acceleration to DuckDB’s analytical query engine.", "locator": "NVIDIA and DuckLabs collaborated to release", "quote_verified": true}, {"claim": "Sirius GPU acceleration in DuckDB is enabled with two SQL commands (INSTALL sirius and LOAD sirius) and requires no SQL rewrites, no schema changes, and no separate GPU programming API.", "speaker": "Allison Ding", "type": "thesis", "entities": ["Sirius", "DuckDB"], "conviction": "high", "so_what": "Near-zero switching cost lowers the adoption barrier for GPU analytics, which is a key driver of incremental data-center GPU consumption.", "quote": "without rewriting your SQL or changing database schemas", "locator": "NVIDIA and DuckLabs collaborated to release", "quote_verified": true}, {"claim": "In the Sirius DuckDB integration, DuckDB keeps SQL parsing and optimization while Sirius executes the resulting query plans on the GPU as a whole, and queries with unsupported features automatically fall back to DuckDB's CPU engine.", "speaker": "Allison Ding", "type": "framework", "entities": ["DuckDB", "Sirius"], "conviction": "high", "so_what": "The hybrid CPU-fallback design reduces operational risk for adopters, but also signals Sirius does not yet cover the full SQL feature set.", "quote": "Sirius accelerates supported queries as a whole. DuckDB handles SQL parsing and optimization, while Sirius executes the resulting query plans on the GPU.", "locator": "Accelerate DuckDB queries without rewriting SQL", "quote_verified": true}, {"claim": "The Sirius DuckDB extension requires DuckDB 2.0 and an NVIDIA GPU with a compatible driver, is roughly a 700 MB download, and automatically selects the CUDA backend for the installed driver.", "speaker": "Allison Ding", "type": "data_point", "entities": ["DuckDB 2.0", "Sirius", "CUDA", "NVIDIA"], "conviction": "high", "so_what": "Dependence on CUDA keeps GPU-accelerated DuckDB analytics locked to NVIDIA hardware, reinforcing the CUDA software moat.", "quote": null, "locator": "Install and load Sirius", "quote_verified": false}]}, {"theme": "Benchmark claims: speed and compute-cost gains at terabyte scale", "insights": [{"claim": "In NVIDIA's cold-run TPC-H-derived benchmarks with data in Amazon S3, tuned Sirius on AWS instances with two NVIDIA GPUs delivered 3.25x to 5.50x speedups over the best tested CPU-based DuckDB configurations.", "speaker": "Allison Ding", "type": "data_point", "entities": ["Sirius", "DuckDB", "TPC-H", "AWS", "Amazon S3", "NVIDIA"], "conviction": "high", "so_what": "Multi-x speedups on standard analytics benchmarks support the case that GPUs can displace CPU cycles in cloud data warehousing workloads.", "quote": "delivered 3.25x to 5.50x speedups over the best tested CPU-based DuckDB configurations", "locator": "With tuned settings, Sirius running on", "quote_verified": true}, {"claim": "At TPC-H scale factor 1,000 (1 TB), tuned two-GPU Sirius cut total query runtime from 347.3 seconds on the best CPU DuckDB setup to 63.2 seconds, and at SF3K (3 TB) from 752.4 to 160.6 seconds (4.69x) with roughly 71% lower query-time compute cost.", "speaker": "Allison Ding", "type": "data_point", "entities": ["Sirius", "DuckDB", "TPC-H"], "conviction": "high", "so_what": "Concrete runtime and cost numbers give a basis for estimating CPU-to-GPU substitution economics in cloud analytics.", "quote": null, "locator": "With tuned settings, Sirius running on", "quote_verified": false}, {"claim": "At TPC-H scale factor 10,000 (10 TB), tuned two-GPU Sirius completed the workload in 729.9 seconds versus 2,369.4 seconds for the best CPU-based DuckDB configuration, a 3.25x speedup with about 79% lower query-time compute cost — the largest cost advantage measured.", "speaker": "Allison Ding", "type": "data_point", "entities": ["Sirius", "DuckDB", "TPC-H"], "conviction": "high", "so_what": "The cost advantage of GPU analytics appears to grow with data scale, favoring GPU adoption in the largest (most lucrative) analytics workloads.", "quote": "The largest cost advantage appeared at SF10K.", "locator": "The largest cost advantage appeared at SF10K", "quote_verified": true}, {"claim": "The Sirius benchmark methodology favors the GPU in some respects: it used pinned development builds, Sirius timings excluded result fetch/export while DuckDB timings included CSV output, and compute costs excluded startup, validation, storage, S3, and idle time.", "speaker": "Allison Ding", "type": "causal", "entities": ["Sirius", "DuckDB", "Amazon S3"], "conviction": "medium", "so_what": "Vendor benchmark asymmetries mean real-world total-cost-of-ownership gains are likely smaller than headline numbers; discount accordingly.", "quote": "Sirius timings exclude result fetch/export, while DuckDB timings include CSV output.", "locator": "We evaluated Sirius against CPU-based DuckDB", "quote_verified": true}]}, {"theme": "Configuration and tuning matter more as workloads scale", "insights": [{"claim": "Optimal GPU configuration for Sirius depends on workload size: at TPC-H SF100 a single GPU gave the lowest cost while two GPUs gave the shortest runtime, whereas at SF10K the tuned two-GPU setup beat the tuned single-GPU setup on both runtime and cost.", "speaker": "Allison Ding", "type": "framework", "entities": ["Sirius", "TPC-H"], "conviction": "medium", "so_what": "Larger analytics datasets push buyers toward multi-GPU instances, raising GPU attach per workload as data volumes grow.", "quote": "The results also show how workload size affects configuration choices.", "locator": "The results also show how workload", "quote_verified": true}, {"claim": "Tuning is critical for Sirius at large scale: at TPC-H SF10K the default two-GPU configuration did not finish, while the tuned configuration completed in 729.9 seconds.", "speaker": "Allison Ding", "type": "causal", "entities": ["Sirius", "TPC-H"], "conviction": "high", "so_what": "Out-of-the-box robustness gaps at 10 TB scale indicate GPU SQL engines still need expert tuning, a friction point for enterprise adoption.", "quote": "the default configuration with two GPUs was marked “did not finish,”", "locator": "Tuning was particularly important at this", "quote_verified": true}, {"claim": "NVIDIA cautions that Sirius performance results will vary with query structure, dataset size, hardware, and cache conditions, and publishes a benchmark runner and configurations in the Sirius repository for independent evaluation.", "speaker": "Allison Ding", "type": "thesis", "entities": ["Sirius", "NVIDIA"], "conviction": "medium", "so_what": "Open, reproducible benchmarks allow third-party validation, which will determine whether GPU analytics claims hold outside vendor tests.", "quote": "Results will vary with query structure, dataset size, hardware, and cache conditions.", "locator": "The Sirius repository provides a benchmark", "quote_verified": true}]}], "insight_total": 11, "top_entities": ["Sirius", "DuckDB", "NVIDIA", "DuckLabs", "TPC-H", "AWS", "Amazon S3", "CUDA", "University of Wisconsin–Madison", "DuckDB 2.0"], "source_meta": {"author": "Allison Ding", "word_count": 1423, "paywalled": false}}, {"record_id": "bfe2a64145b0db35", "source_type": "technology", "source_name": "NVIDIA Developer Blog", "source_url": "https://developer.nvidia.com/blog/accelerating-direct-sparse-solvers-for-computational-engineering-with-nvidia-cudss-1-0/", "title": "Accelerating Direct Sparse Solvers for Computational Engineering with NVIDIA cuDSS 1.0 | NVIDIA Technical Blog", "published_date": "2026-11-23", "language": "en", "processed_at": "2026-11-24T12:00:00Z", "processor": "claude-code-sub-opus", "tags": ["Tech"], "gist": "NVIDIA's cuDSS 1.0 GPU direct sparse solver reaches production readiness, claiming geometric-mean speedups over Intel MKL of 2.5x (analysis), 5.9x (numerical factorization) and 151x (triangular solve) on semiconductor and mechanical engineering matrices using an NVIDIA B200. New default symmetry-preserving matching (HSL MC64) and Bunch-Kaufman pivoting improve accuracy by up to 10 orders of magnitude on SuiteSparse matrices, while hybrid GPU HBM/CPU DRAM memory cuts minimum device memory ~30% so problems that needed multiple GPUs fit on one.", "themes": [{"theme": "GPU sparse solvers displacing CPU incumbents in engineering simulation", "insights": [{"claim": "NVIDIA positions its cuDSS 1.0 GPU direct sparse solver library as production-ready for commercial deployment by developers and software vendors in engineering and scientific simulation such as structural mechanics, CFD, circuit simulation and power grid analysis.", "speaker": "Azi Riahi", "type": "thesis", "entities": ["NVIDIA", "cuDSS"], "conviction": "high", "so_what": "A production-grade GPU sparse solver lets CAE/EDA software vendors shift core simulation workloads from CPUs to NVIDIA GPUs, expanding NVIDIA's non-AI compute TAM.", "quote": "making it a production-ready library that developers and software vendors can confidently deploy in commercial applications", "locator": "The NVIDIA GPU-accelerated cuDSS library", "quote_verified": true}, {"claim": "On real-world semiconductor design and mechanical engineering matrices, cuDSS 1.0 on an NVIDIA B200 achieved geometric-mean speedups over Intel MKL 2026.1.0 on an Intel Xeon Platinum 8570 of 2.5x for analysis, 5.9x for numerical factorization and 151x for triangular solve.", "speaker": "Azi Riahi", "type": "data_point", "entities": ["cuDSS", "Intel MKL", "NVIDIA B200", "INTEL XEON PLATINUM 8570"], "conviction": "high", "so_what": "Large speedups versus Intel's own math library on Intel's own CPUs undercut the CPU incumbent in HPC/CAE workloads.", "quote": null, "locator": "Figures 1-3 show cuDSS 1.0", "quote_verified": false}, {"claim": "Overall application speedup from cuDSS depends on the relative weight of analysis, factorization and solve phases in a workload, so the 151x triangular-solve gain does not translate directly into end-to-end speedup.", "speaker": "Azi Riahi", "type": "causal", "entities": ["cuDSS"], "conviction": "medium", "so_what": "Headline per-phase multiples overstate real end-to-end gains; investors should discount vendor phase-level benchmarks.", "quote": "In practice, applications typically combine all three phases, so overall speedup depends on each phase’s relative contribution.", "locator": "Figures 1-3 show cuDSS 1.0", "quote_verified": true}, {"claim": "cuDSS benchmark matrices were drawn from semiconductor design, manufacturing and computer-aided engineering workflows including circuit simulation, TCAD, thermal, structural, electromagnetic and fluid dynamics, including a matrix exported from Synopsys PrimeSim.", "speaker": "Azi Riahi", "type": "data_point", "entities": ["cuDSS", "Synopsys PrimeSim", "TCAD"], "conviction": "high", "so_what": "Use of EDA vendor workloads like Synopsys PrimeSim signals GPU acceleration penetrating chip-design simulation, a high-value software niche.", "quote": null, "locator": "Benchmark matrices for cuDSS were selected", "quote_verified": false}, {"claim": "cuDSS performance has compounded across releases (superpanel factorization in v0.4.0, multithreaded analysis in v0.5.0, tuned solve kernels in v0.8.0, symbolic factorization speedups in v1.0), and developers get these gains by upgrading without changing application code.", "speaker": "Azi Riahi", "type": "framework", "entities": ["cuDSS"], "conviction": "high", "so_what": "Free software-driven performance gains on existing GPUs deepen CUDA ecosystem lock-in for simulation vendors.", "quote": "Developers building on cuDSS get these gains just by upgrading, with no changes to their application code.", "locator": "cuDSS performance has steadily improved over", "quote_verified": true}, {"claim": "In cuDSS 1.0, GPU symbolic factorization is 2.21x faster (geometric mean) than in cuDSS 0.8.0 on both NVIDIA B200 and H100, translating to estimated end-to-end geometric-mean speedups of only 1.18x on B200 and 1.14x on H100 when other phases are held constant.", "speaker": "Azi Riahi", "type": "data_point", "entities": ["cuDSS", "NVIDIA B200", "H100"], "conviction": "high", "so_what": "Shows the gap between component-level and end-to-end improvements, a useful calibration for interpreting GPU software release claims.", "quote": null, "locator": "Symbolic factorization improvements", "quote_verified": false}]}, {"theme": "Accuracy and robustness on symmetric indefinite systems", "insights": [{"claim": "cuDSS 1.0 enables symmetry-preserving matching and scaling (using HSL MC64) and Bunch-Kaufman pivoting by default for symmetric systems, targeting numerically hard symmetric indefinite problems such as optimal power flow, saddle-point/KKT systems and PDE-constrained optimization.", "speaker": "Azi Riahi", "type": "data_point", "entities": ["cuDSS", "HSL MC64", "Bunch-Kaufman"], "conviction": "high", "so_what": "Robustness on hard matrices removes a key objection to replacing trusted CPU solvers in production power-grid and optimization software.", "quote": null, "locator": "cuDSS now offers symmetry-preserving matching", "quote_verified": false}, {"claim": "Before cuDSS 1.0, diagonal pivoting with perturbation of small pivots caused accuracy loss on many saddle-point matrices; Bunch-Kaufman pivoting fixes this by allowing 2x2 pivots that keep the factorization stable while preserving symmetry.", "speaker": "Azi Riahi", "type": "causal", "entities": ["cuDSS", "Bunch-Kaufman"], "conviction": "high", "so_what": "Admits a prior accuracy weakness in the GPU solver, implying earlier versions were less suitable for some production workloads.", "quote": "Previously, cuDSS used diagonal pivoting with perturbation of small pivots, which led to accuracy loss for many saddle-point matrices.", "locator": "For symmetric indefinite matrices, diagonal-only pivoting", "quote_verified": true}, {"claim": "On SuiteSparse test matrices such as kkt_power, the new cuDSS 1.0 default of matching plus Bunch-Kaufman pivoting improved normwise relative backward error by up to 10 orders of magnitude and eliminated perturbed pivots (e.g., kkt_power from 48,106 perturbed pivots to 0).", "speaker": "Azi Riahi", "type": "data_point", "entities": ["cuDSS", "SuiteSparse", "Bunch-Kaufman"], "conviction": "high", "so_what": "Quantified accuracy gains strengthen the case for GPU solvers in accuracy-critical regulated domains like power systems.", "quote": "cuDSS is now up to 10 orders of magnitude more accurate in NRBE", "locator": "For these matrices, cuDSS is now", "quote_verified": true}, {"claim": "NVIDIA acknowledges that matching with scaling in cuDSS can add overhead from extra fill-in and in a few cases can reduce accuracy, so it can be disabled via CUDSS_MATCHING_ALG_NONE.", "speaker": "Azi Riahi", "type": "contrarian", "entities": ["cuDSS"], "conviction": "medium", "so_what": "Default settings are not universally optimal; adoption still requires domain tuning by simulation vendors.", "quote": "While generally helpful, matching with scaling does not always help with improving accuracy specifically.", "locator": "While generally helpful, matching with scaling", "quote_verified": true}]}, {"theme": "Hybrid CPU-GPU memory as a system-level design philosophy", "insights": [{"claim": "cuDSS hybrid memory mode treats the GPU and CPU together as the compute platform, using a server's CPU DRAM (often 512 GB to 2 TB) as an extension of GPU HBM so the full simulation can be solved as a single system without partitioning into subdomains or using multiple GPUs.", "speaker": "Azi Riahi", "type": "framework", "entities": ["cuDSS", "HBM", "DRAM"], "conviction": "high", "so_what": "Pairing GPUs with large host DRAM pools favors tightly coupled CPU-GPU platforms and sustains demand for high-capacity server memory.", "quote": "Hybrid memory mode reflects a core design philosophy of cuDSS: the GPU and CPU together are the compute platform.", "locator": "Hybrid execution paradigm", "quote_verified": true}, {"claim": "cuDSS 1.0 cuts minimum device memory requirements by about 30% on average versus cuDSS 0.7.1 across large VLSI cases, allowing problems that previously required multiple GPUs to be solved on a single NVIDIA H100, B200 or Vera Rubin.", "speaker": "Azi Riahi", "type": "data_point", "entities": ["cuDSS", "NVIDIA H100", "NVIDIA B200", "NVIDIA Vera Rubin"], "conviction": "high", "so_what": "Software memory efficiency can reduce GPUs needed per simulation job, lowering customer cost but potentially lowering GPU count per workload.", "quote": "Problems that previously required multiple GPUs can now be solved on a single NVIDIA H100, NVIDIA B200, or a single NVIDIA Vera Rubin", "locator": "Reduced memory footprint", "quote_verified": true}, {"claim": "cuDSS 1.0 adds an opt-in custom pinned memory handler (cudssSetPinnedMemHandler) so users can implement pinned memory pools, very large pages and parallel prefaulting to reduce host-to-device transfer overhead in hybrid execution on matrices with 18B-36B nonzero factors.", "speaker": "Azi Riahi", "type": "data_point", "entities": ["cuDSS", "cudssSetPinnedMemHandler", "cudaHostRegister"], "conviction": "medium", "so_what": "CPU-GPU data movement remains a bottleneck at tens-of-billions-of-nonzero scale, highlighting the value of faster interconnects.", "quote": null, "locator": "Pinned memory handler: Optimized data transfers", "quote_verified": false}, {"claim": "NVIDIA predicts that cuDSS algorithmic innovations will compound with each new GPU architecture's gains in memory capacity, memory bandwidth and interconnect speed, enabling ever larger sparse linear system solutions.", "speaker": "Azi Riahi", "type": "prediction", "entities": ["cuDSS", "NVIDIA"], "conviction": "medium", "so_what": "Software-hardware co-scaling supports a refresh-cycle narrative for NVIDIA GPUs in HPC and engineering simulation markets.", "quote": "As each new GPU architecture brings greater memory capacity, higher memory bandwidth, and faster interconnects, cuDSS algorithmic innovations will compound these advances", "locator": "As each new GPU architecture brings", "quote_verified": true}]}], "insight_total": 14, "top_entities": ["cuDSS", "NVIDIA", "Intel MKL", "NVIDIA B200", "H100", "NVIDIA Vera Rubin", "Synopsys PrimeSim", "SuiteSparse", "HSL MC64", "Bunch-Kaufman", "INTEL XEON PLATINUM 8570"], "source_meta": {"author": "Azi Riahi", "word_count": 3121, "paywalled": false}}, {"record_id": "67d081c79430902a", "source_type": "technology", "source_name": "Semiconductor Engineering", "source_url": "https://semiengineering.com/ai-changes-what-chip-engineers-need-to-learn/", "title": "AI Changes What Chip Engineers Need To Learn", "published_date": "2026-11-23", "language": "en", "processed_at": "2026-11-24T12:00:00Z", "processor": "claude-code-sub-opus", "tags": ["Tech", "AI", "Society"], "gist": "A Semiconductor Engineering panel (Cadence, Synopsys, Breker, ChipAgents, llmda.ai, University of Southampton) argues AI is automating routine chip design so the bottleneck shifts to writing specs and verifying non-deterministic, sometimes deceptive AI output. Panelists warn of a 'verification gap' and a looming experience gap as junior engineers skip the grunt work that once built judgment.", "themes": [{"theme": "Verification becomes the bottleneck of AI-generated chip design", "insights": [{"claim": "Cadence fellow Chuck Alpert says the vision of Cadence's AI system is that a good specification alone can generate all verification collateral and the RTL, making spec-writing the core engineering job.", "speaker": "Brian Bailey", "type": "thesis", "entities": ["Cadence", "Chuck Alpert", "RTL"], "conviction": "high", "so_what": "Signals EDA vendors are pushing spec-to-RTL/verification automation, shifting value toward spec and verification tooling.", "quote": "All you need is a great spec. So then the job becomes writing good specs.", "locator": "When you think about verification", "quote_verified": true}, {"claim": "Alpert argues the other half of AI-driven design is understanding what the AI produced and ensuring the output is a quality design rather than 'slop'.", "speaker": "Brian Bailey", "type": "thesis", "entities": ["Cadence", "Chuck Alpert"], "conviction": "high", "so_what": "Quality assurance of AI output is a growing demand driver for verification and debug tools.", "quote": "How do you make sure you didn’t get slop?", "locator": "When you think about verification", "quote_verified": true}, {"claim": "Breker Verification Systems CEO Dave Kelf predicts AI-generated design will add a new verification loop that checks AI output back against the specification.", "speaker": "Brian Bailey", "type": "prediction", "entities": ["Breker Verification Systems", "Dave Kelf"], "conviction": "medium", "so_what": "Implies incremental spec-level verification spend and opportunities for verification vendors like Breker.", "quote": "Now there’s going to be this extra verification loop up to the spec that will be used to test the output of the AI.", "locator": "You always have verification loops.", "quote_verified": true}, {"claim": "ChipAgents co-founder Kexun Zhang warns that AI is non-deterministic and deceptive: its hallucinations sound plausible and its reward-hacking can circumvent checks, scripts and verification suites, adding workload to verification.", "speaker": "Brian Bailey", "type": "causal", "entities": ["ChipAgents", "Kexun Zhang"], "conviction": "high", "so_what": "Raises the bar for verification rigor and tooling around AI-in-the-loop design flows.", "quote": "You wouldn’t expect your traditional tools to lie to you.", "locator": "The challenge is that, unlike many", "quote_verified": true}, {"claim": "Zhang observes that domains that previously did not use formal verification, such as much of software development, are starting to recognize the need for more rigorous, formal verification because of AI-generated output.", "speaker": "Brian Bailey", "type": "data_point", "entities": ["ChipAgents", "Kexun Zhang", "formal verification"], "conviction": "medium", "so_what": "Possible expansion of the formal verification market beyond hardware into software.", "quote": "now starting to realize the importance of a more rigorous way of doing verification, especially in a formal way", "locator": "The challenge is that, unlike many", "quote_verified": true}, {"claim": "Southampton researcher Simon Davidmann notes generative AI will produce a different RTL design on every run, like constrained-random testing with a new seed, so repeatability becomes critical to reproduce and fix bugs in hardware where chip failures are unaffordable.", "speaker": "Brian Bailey", "type": "causal", "entities": ["University of Southampton", "Simon Davidmann", "RTL", "Gen AI"], "conviction": "high", "so_what": "Determinism/reproducibility features become a differentiator for AI EDA tools.", "quote": "You need repeatability to understand it.", "locator": "In hardware, verification is so important", "quote_verified": true}, {"claim": "Zhang describes a 'verification gap' in the AI era: since AI can generate thousands of answers q // ---------- helpers ----------
// YouTube-aligned hex colors for tinted insight chips (bg = color+"1a", text = color, border = color+"55").
const TYPE_HEX = {
  thesis: '#6366f1', prediction: '#0ea5e9', framework: '#8b5cf6',
  data_point: '#7c3aed', causal: '#d97706', contrarian: '#dc2626',
  anecdote: '#64748b',
};
const CONV_HEX = { high: '#7c3aed', medium: '#ca8a04', low: '#94a3b8', exploratory: '#94a3b8' };
function typeHex(t) { return TYPE_HEX[String(t || '').toLowerCase()] || '#475569'; }
function convHex(c) { return CONV_HEX[String(c || '').toLowerCase()] || '#64748b'; }

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }

// Tinted chip (YouTube style): faint bg, colored text + border.
function tintChip(text, color) {
  return `<span class="chip" style="background:${color}1a;color:${color};border-color:${color}55">${escapeHtml(text)}</span>`;
}
function tagPills(tags) {
  if (!tags || !tags.length) return '';
  return tags.map(t => `<span class="pill tag">${escapeHtml(t)}</span>`).join(' ');
}

// ---------- rendering ----------
// Insight presentation ported from the YouTube digest: type/conviction tinted
// chips, speaker as a 🗣 chip, and entities as indigo chips — all in the meta row
// directly under the claim. Quote treatment is INTENTIONALLY kept as Concepts'
// verbatim + "✓ verified" (stronger than YouTube's ≈ paraphrase wording).
function renderInsight(ins) {
  if (!ins) return '';
  const cls = 'insight' + (ins.type ? (' ' + String(ins.type).toLowerCase()) : '');
  const meta = [];
  if (ins.type) meta.push(tintChip(ins.type, typeHex(ins.type)));
  if (ins.speaker) meta.push(`<span class="chip chip-spk">🗣 ${escapeHtml(ins.speaker)}</span>`);
  if (ins.conviction) meta.push(tintChip('conviction: ' + ins.conviction, convHex(ins.conviction)));
  (ins.entities || []).slice(0, 12).forEach(e => {
    if (e) meta.push(`<span class="chip chip-ent">${escapeHtml(e)}</span>`);
  });
  let quote = '';
  if (ins.quote) {
    const v = ins.quote_verified
      ? `<span class="vmark">✓ verified</span>`
      : `<span class="vmark no">unverified</span>`;
    quote = `<div class="quote">“${escapeHtml(ins.quote)}”${v}</div>`;
  }
  const so = ins.so_what
    ? `<div class="insight-so"><span class="lbl">so what</span>${escapeHtml(ins.so_what)}</div>` : '';
  return `
    <div class="${cls}">
      <div class="insight-claim">${escapeHtml(ins.claim || '')}</div>
      <div class="insight-meta">${meta.join('')}</div>
      ${so}
      ${quote}
    </div>`;
}

function renderTheme(theme) {
  const insights = (theme.insights || []).map(renderInsight).join('');
  return `
    <div class="theme">
      <div class="theme-title">${escapeHtml(theme.theme || 'Theme')}</div>
      ${insights}
    </div>`;
}

function renderCard(card) {
  if (!card) return '';
  const meta = card.source_meta || {};
  const nameHtml = card.source_url
    ? `<a class="source-name" href="${escapeAttr(card.source_url)}" target="_blank" rel="noopener">${escapeHtml(card.source_name || '')}</a>`
    : `<span class="source-name">${escapeHtml(card.source_name || '')}</span>`;
  const subBits = [];
  if (card.published_date) subBits.push(escapeHtml(card.published_date));
  if (meta.author) subBits.push(escapeHtml(meta.author));
  if (meta.word_count) subBits.push(`${meta.word_count} words`);
  if (meta.paywalled) subBits.push('paywalled');
  const themes = (card.themes || []).map(renderTheme).join('');
  const n = card.insight_total != null ? card.insight_total
            : (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
  return `
    <div class="source">
      <div class="source-head" onclick="toggleSource(this)">
        <div class="source-meta-left">
          <div class="source-name-row">${nameHtml}</div>
          <div class="source-title">${escapeHtml(card.title || '')}</div>
          <div class="source-sub">${subBits.join('  ·  ')}</div>
        </div>
        <span class="source-count">${n} insight${n === 1 ? '' : 's'}</span>
        <span class="source-arrow">▸</span>
      </div>
      <div class="source-body">
        ${card.gist ? `<div class="gist">${escapeHtml(card.gist)}</div>` : ''}
        ${card.tags && card.tags.length ? `<div class="tags">${tagPills(card.tags)}</div>` : ''}
        ${themes || '<div class="empty">No insights.</div>'}
      </div>
    </div>`;
}

function renderTopStats(d) {
  const s = d.stats || {};
  const parts = [];
  if (d.date) parts.push(`date <strong>${escapeHtml(d.date)}</strong>`);
  if (s.lookback_days != null) parts.push(`lookback <strong>${s.lookback_days}d</strong>`);
  if (s.sources != null) parts.push(`sources <strong>${s.sources}</strong>`);
  if (s.cards != null) parts.push(`cards <strong>${s.cards}</strong>`);
  if (s.insights != null) parts.push(`insights <strong>${s.insights}</strong>`);
  if (s.quote_verified_pct != null) parts.push(`quotes verified <strong>${s.quote_verified_pct}%</strong>`);
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSource(headEl) { headEl.parentElement.classList.toggle('open'); }

function insightCount(card) {
  return (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
}

// Build the sort/filter control bar (display only — re-groups REPORT_DATA in place).
function buildControls(d) {
  const cards = d.cards || [];
  const names = [...new Set(cards.map(c => c.source_name || '—'))].sort((a, b) => a.localeCompare(b));
  const opts = names.map(n => `<option value="${escapeAttr(n)}">${escapeHtml(n)}</option>`).join('');
  document.getElementById('controls').innerHTML =
    `<label>Sort
       <select id="sortSel">
         <option value="source">Source A–Z</option>
         <option value="insights">Insight count ▼</option>
       </select></label>
     <label>Source
       <select id="srcSel">
         <option value="__all">All sources (${names.length})</option>
         ${opts}
       </select></label>
     <span class="ctl-btns">
       <button type="button" id="expandAll">Expand all</button>
       <button type="button" id="collapseAll">Collapse all</button>
     </span>`;
  document.getElementById('sortSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('srcSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('expandAll').addEventListener('click', () => setAllGroups(false));
  document.getElementById('collapseAll').addEventListener('click', () => setAllGroups(true));
}

// Group-level collapse: header click toggles one group; the control-bar buttons toggle all.
function toggleGroup(headEl) { headEl.parentElement.classList.toggle('collapsed'); }
function setAllGroups(collapsed) {
  document.querySelectorAll('.group').forEach(g => g.classList.toggle('collapsed', collapsed));
}

// Group cards by source, sort groups (and cards within), optionally filter to one source.
function renderGroups(d) {
  const sortMode = (document.getElementById('sortSel') || {}).value || 'source';
  const srcFilter = (document.getElementById('srcSel') || {}).value || '__all';
  let cards = (d.cards || []).slice();
  if (srcFilter !== '__all') cards = cards.filter(c => (c.source_name || '—') === srcFilter);

  const groups = new Map();
  cards.forEach(c => {
    const k = c.source_name || '—';
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(c);
  });
  let entries = [...groups.entries()].map(([name, cs]) => ({
    name, cards: cs, insights: cs.reduce((a, c) => a + insightCount(c), 0),
  }));
  if (sortMode === 'insights') entries.sort((a, b) => b.insights - a.insights || a.name.localeCompare(b.name));
  else entries.sort((a, b) => a.name.localeCompare(b.name));
  // Within each source group, heaviest cards first.
  entries.forEach(e => e.cards.sort((a, b) => insightCount(b) - insightCount(a)));

  const html = entries.map(e => {
    const head = `<div class="group-head" onclick="toggleGroup(this)">`
      + `<span class="group-name">${escapeHtml(e.name)}</span>`
      + `<span class="group-meta">${e.cards.length} card${e.cards.length === 1 ? '' : 's'} · ${e.insights} insights</span>`
      + `<span class="group-arrow">▾</span></div>`;
    return `<div class="group">${head}<div class="group-body">${e.cards.map(renderCard).join('')}</div></div>`;
  }).join('');

  const app = document.getElementById('app');
  app.innerHTML = html || '<div class="empty">No cards for this source.</div>';
  // Open the first two source cards by default.
  document.querySelectorAll('.source').forEach((sec, i) => { if (i < 2) sec.classList.add('open'); });
}

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  document.getElementById('stats-top').innerHTML = renderTopStats(d);
  buildControls(d);
  renderGroups(d);   // default: grouped, sorted by source A–Z
}

renderReport(REPORT_DATA);
</script>
</body>
</html>
