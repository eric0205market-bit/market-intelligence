{ id:11, cat:"regulation", urgency:"deep", source:"Transformer News (Gabriel Weil, U. Houston Law)",

{ id:22, cat:"venture", urgency:"deep", source:"a16z",
  title:"Lighthouse or Landgrab: the two AI go-to-market playbooks founders keep confusing",
  idea:"a16z frames two distinct AI GTM strategies: Lighthouse (chase marquee logos to prove a brand-new category is real — Harvey needed Allen & Overy and Paul Weiss before law firms trusted AI legal work, Hebbia needed KKR and BlackRock before funds trusted AI on data rooms) versus Landgrab (skip the prestige chase and win purely on cost/speed math against a known incumbent). Lighthouse deals run 3-6 month cycles at 6-7 figure ACVs; Landgrab wins on 'I replace Y at half the cost,' no marquee name required.",
  angle:"The framework is a good filter for which AI startups are wasting runway: any company selling into a category buyers already understand but still chasing logos instead of undercutting on math is running the wrong playbook.",
  tweetA:"Harvey needed Allen & Overy to go first before any law firm trusted AI on legal work. Hebbia needed KKR and BlackRock before hedge funds trusted it on data rooms. That's the Lighthouse play — and it only works when you're inventing a category nobody has a mental model for yet.",
  tweetB:"If your buyer already understands the problem you're solving, chasing a marquee logo is just burning a quarter of runway on prestige instead of revenue. The tell: are you discounting to land a name, or winning because your math beats the incumbent's? Only one of those scales.",
  charts:{count:0, hot:false, desc:"No chart in email"},
  link:"https://www.a16z.news/p/lighthouse-or-landgrab-how-to-pick" },

{ id:28, cat:"tech", urgency:"deep", source:"Import AI (Epoch / METR)",
  title:"Opus 4.7 did a 2-17 week human task in 14 hours for $251",
  idea:"Epoch and METR's new MirrorCode benchmark measures how well AI can reimplement real software programs (tens of thousands of lines) purely from CLI access, with no source code. Claude Opus 4.7 solved one such task in 14 hours for $251 in inference cost — a task METR/Epoch estimate would take a human 2 to 17 weeks. Models from a year ago scored around 30% on the benchmark; current models solved 17 of 25 target programs to a perfect score.",
  angle:"The cost comparison is the number that matters for enterprise software economics: $251 and 14 hours versus weeks of a senior engineer's salary is a unit-economics gap too large for any industry built on custom software development to ignore for long.",
  tweetA:"$251 and 14 hours vs 2-17 weeks of human engineering time, on a task that requires reverse-engineering real software with zero source access. Do the math on what a mid-level engineer costs over even the low end of that range. This isn't a productivity tool anymore, it's a different cost structure for building software entirely.",
  tweetB:"A year ago, models scored ~30% on this benchmark and could only handle something like a calendar utility. Now they're fully reimplementing 60,000+ line programs. That's not incremental progress, that's a step-change in what 'autonomous software engineering' means in twelve months.",
  charts:{count:0, hot:false, desc:"No chart — worth opening for benchmark tables"},

  idea:"In August 2025, Claude Opus 4.1 couldn't perform basic quadruped robot tasks at all, and humans with model assistance took 181 minutes to complete a task set. By May 2026, Opus 4.7 acting fully autonomously completed nearly the entire task set in 9 minutes 35 seconds — a roughly 20x speedup Anthropic says came purely from general model scaling, with no dedicated robotics training effort.",
  angle:"If robot capability is a free byproduct of general LLM scaling rather than something requiring dedicated robotics R&D, that reframes which companies are actually positioned to win in physical AI — the frontier labs, not the robotics-specific startups.",
  tweetA:"9 months ago Anthropic's model literally could not do basic robot tasks. Now it does the same task set 20x faster than the human-assisted record, autonomously, and Anthropic says they didn't even try to make it better at robotics. If general scaling is quietly solving robotics as a side effect, every pure-play robotics startup's moat just got a lot shorter runway.",
  tweetB:"The bitter lesson strikes again: robotics companies spend years building task-specific training pipelines, and a general-purpose model scaled for coding and reasoning ends up beating the human-assisted baseline by 20x anyway. Worth asking why robotics-specific compute spend still gets funded at the valuations it does.",
  charts:{count:0, hot:false, desc:"No chart — link for details"},

    window.__catPills.push(btn);
  });

  const urgBar = document.getElementById('urgFilter');
  const allUrgPill = document.createElement('button');
  allUrgPill.className = 'pill active';
  allUrgPill.textContent = 'All (' + ITEMS.length + ')';
  allUrgPill.onclick = () => setUrgFilter('all', allUrgPill);
  urgBar.appendChild(allUrgPill);
  window.__urgPills = [allUrgPill];

  ['act','deep','watch'].forEach(u => {
    const btn = document.createElement('button');
    btn.className = 'pill';
    btn.textContent = URG_LABEL[u] + ' (' + urgCounts[u] + ')';
    btn.onclick = () => setUrgFilter(u, btn);
    urgBar.appendChild(btn);
    window.__urgPills.push(btn);
  });
}

let currentCat = 'all';
let currentUrg = 'all';
let currentSrc = null;

function setCatFilter(cat, btn){
  currentCat = cat; currentSrc = null;
  window.__catPills.forEach(p => { p.classList.remove('active'); p.style.background=''; p.style.borderColor=''; p.style.color=''; });
  btn.classList.add('active');
  if(cat !== 'all'){ btn.style.background = CAT_COLORS[cat]; btn.style.borderColor = CAT_COLORS[cat]; }
  render();
}
function setUrgFilter(urg, btn){
  currentUrg = urg; currentSrc = null;
  window.__urgPills.forEach(p => { p.classList.remove('active'); p.style.background=''; p.style.borderColor=''; p.style.color=''; });
  btn.classList.add('active');
  if(urg !== 'all'){ btn.style.background = '#3a3a3a'; btn.style.borderColor = '#3a3a3a'; }
  render();
}
function filterBySrc(name){
  currentCat = 'all'; currentUrg = 'all'; currentSrc = name;
  window.__catPills.forEach(p => p.classList.remove('active'));
  window.__urgPills.forEach(p => p.classList.remove('active'));
  window.__catPills[0].classList.add('active');
  window.__urgPills[0].classList.add('active');
  render(true);
  document.getElementById('cards').scrollIntoView({behavior:'smooth'});
}

function render(expandMatches){
  const container = document.getElementById('cards');
  container.innerHTML = '';
  const filtered = ITEMS.filter(i => {
    if(currentCat !== 'all' && i.cat !== currentCat) return false;
    if(currentUrg !== 'all' && i.urgency !== currentUrg) return false;
    if(currentSrc && i.source.indexOf(currentSrc) === -1) return false;
    return true;
  });

  if(filtered.length === 0){
    container.innerHTML = '<div class="empty-state">No items match this filter.</div>';
    return;
  }

  filtered.forEach((item, idx) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.id = 'card-' + item.id;
    if(expandMatches) card.classList.add('open');

    const color = CAT_COLORS[item.cat] || '#888';
    const chartFlag = item.charts.hot ? '🔥' : (item.charts.count > 0 ? '📊' : '');

    const header = document.createElement('div');
    header.className = 'card-header';
    header.innerHTML =
      '<span class="idx">' + String(idx+1).padStart(2,'0') + '</span>' +
      '<span class="urg">' + URG_EMOJI[item.urgency] + '</span>' +
      '<span class="src-badge" style="background:' + color + '">' + item.source + '</span>' +
      '<span class="cat-tag">' + item.cat + '</span>' +
      (chartFlag ? '<span class="chart-flag">' + chartFlag + '</span>' : '') +
      '<span class="card-title">' + item.title + '</span>';
    header.onclick = () => card.classList.toggle('open');
    card.appendChild(header);

    const body = document.createElement('div');
    body.className = 'card-body';

    const chartClass = item.charts.hot ? 'chart-block hot' : 'chart-block';
    const chartLabel = item.charts.hot ? '🔥 ' : '📊 ';

    body.innerHTML =
      '<div class="section-label">The Idea</div>' +
      '<div class="idea-text">' + item.idea + '</div>' +
      '<div class="section-label">My Angle</div>' +
      '<div class="angle-box" style="border-left:2px solid ' + color + '; background:' + color + '18;">' + item.angle + '</div>' +
      '<div class="section-label">Tweets</div>' +
      '<div class="tweets">' +
        '<div class="tweet-box"><div class="tweet-label" style="color:#378add;">TWEET A</div>' +
          '<div class="tweet-text">' + item.tweetA + '</div>' +
          '<button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button></div>' +
        '<div class="tweet-box"><div class="tweet-label" style="color:#7f77dd;">TWEET B</div>' +
          '<div class="tweet-text">' + item.tweetB + '</div>' +
          '<button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div>' +
      '</div>' +
      '<div class="' + chartClass + '">' + chartLabel + item.charts.desc + '</div>' +
      '<a class="read-link" href="' + item.link + '" target="_blank">↗ Read full article</a>';

    card.appendChild(body);
    container.appendChild(card);
  });
}

function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}

function buildReport(){
  const g = document.getElementById('reportGrid');
  let html = '';
  html += '<div><b>Time window:</b> ' + META.windowStart + ' → ' + META.windowEnd + ' (strict 6-hour cutoff)</div>';
  html += '<div><b>Emails in window:</b> ' + META.emailsInWindow + ' &nbsp;|&nbsp; <b>Emails read:</b> ' + META.emailsRead + ' &nbsp;|&nbsp; <b>Items extracted:</b> ' + META.itemsExtracted + '</div>';
  html += '<br><div><b>Included sources:</b></div>';
  META.includedSources.forEach(s => {
    html += '<div>• <span class="src-link" onclick="filterBySrc(\'' + s.name.replace(/'/g,"\\'") + '\')">' + s.name + '</span> — ' + s.count + ' item' + (s.count>1?'s':'') + '</div>';
  });
  html += '<br><div><b>Skipped (empty / paywall teaser, zero content):</b></div>';
  META.skippedSources.forEach(s => {
    html += '<div>• ' + s.name + ' — ' + s.reason + '</div>';
  });
  g.innerHTML = html;
}

document.getElementById('headerMeta').textContent =
  META.date + ' · ' + META.time + ' · ' + META.itemsExtracted + ' items from ' + META.emailsRead + ' emails';

buildFilters();
render();
buildReport();
</script>
</body>
</html>
