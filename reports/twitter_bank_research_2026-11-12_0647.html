@media (max-width: 640px) {

const REPORT_DATA = {"report_type": "TWITTER BANK RESEARCH", "freshness_gate": "OK    data/twitter/latest/tweets_bank_research.json: collected_at 2026-11-12T06:24:26+00:00 (0.4h old), non-empty\nFRESHNESS GATE PASSED.", "collected_at": "2026-11-12T06:24:26Z", "window_days": 4, "input_stats": {"total_tweets": 120, "considered": 120, "kept": 17, "dropped": 103, "deduped": 0}, "summary": "Fed tightening path dominates: Goldman adds a third 25bp hike (March 2027), Bowman commentary (via Neil) leans toward further hikes.\nAI investment cycle sizing recurs across GS (capex share of GDP, ~$1.1tn 2027 hyperscaler capex) and JPMAM ($15T through 2040, productivity, task acceleration).\nPositioning/flows: JPM momentum capitulation checklist, SocGen XMOMO 10th week risk-off, BofA institutions buying while retail sells, RBC on retail put buying.\nEarnings: Citi revision index 20-week average rolling over; GS on China EPS downgrades; BofA memory supercycle through 2028.\nCounts: Goldman 5, BofA 4, JPM 4, SocGen 2, Apollo/Slok 1, Citi 1, RBC 1 — 17 unique items.", "by_bank_counts": {"Goldman": 5, "BofA": 4, "JPM": 4, "SocGen": 2, "Apollo/Slok": 1, "Citi": 1, "RBC": 1}, "banks": [{"bank": "Goldman", "theme": "Goldman — third 25bp hike added for March 2027; AI capex share of GDP; China EPS revisions; Brooks on 50bp", "items": [{"author": "neilsethinew", "text": "Goldman: The October CPI report surprised meaningfully to the upside across several categories and marked a third month of worse inflation news. We continue to expect a second 25bp rate hike in December and are adding a third 25bp hike to our forecast in March 2027. A third hike could come earlier in January, but we think March is a bit more likely because we expect the November and December inflation reports to be softer but then expect larger start-of-the-year price increases amidst ongoing cost pressures to boost inflation in January.\n\nWe remain confident that inflation will be meaningfully lower by the end of 2027 as the effects of tariffs, the energy shock, and AI price pressures diminish. But we suspect that the recent inflation prints will lead most FOMC participants to signal a third hike in the December dot plot and that a firmer January inflation report would make delivering it the path of least resistance even if the energy shock appears over by then.\n\nWe have left our forecast for the eventual terminal fed funds rate unchanged at 3.25-3.5%, but we now expect rate cuts to begin one quarter later in December 2027 (vs. September 2027 previously), followed by additional cuts in March, June, and September 2028.", "tweet_url": "https://x.com/neilsethinew/status/2120506984130613283", "images": ["https://pbs.twimg.com/media/HW2N0vMWgAAgnzp.jpg"], "created_at": "2026-11-11T13:20:36.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "Goldman: Adding a Third Hike in March\n\nWe Now Expect a Third 25bp Rate Hike in March, Followed by Gradual Cuts Back to 3.25-3.5% Starting in December 2027 https://t.co/MeLCgAGOEO", "tweet_url": "https://x.com/MikeZaccardi/status/2120495130893328490", "images": ["https://pbs.twimg.com/media/HW2DFarX0AAAti8.jpg"], "created_at": "2026-11-11T12:33:30.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "GS: The AI investment cycle is on track to reach a larger share of GDP than any previous technological investment cycle…\n\nwith the largest US hyperscalers (AMZN, META, GOOGL, MSFT, and ORCL) expected to spend ~$800bn in capex this year and a further ~$1.1tn in 2027 https://t.co/Jn5KeNkhQG", "tweet_url": "https://x.com/MikeZaccardi/status/2120301984158793780", "images": ["https://pbs.twimg.com/media/HWzTawVWIAEhmmQ.jpg"], "created_at": "2026-11-10T23:46:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "China's EPS for 2026 will likely be the same as 2014's projection 12 years ago (with each CY estimate down down down) GS https://t.co/vrbPLvou5f", "tweet_url": "https://x.com/MikeZaccardi/status/2120294474882392078", "images": ["https://pbs.twimg.com/media/HWzMltjWgAAQQeS.png"], "created_at": "2026-11-10T23:16:10.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "Goldman Sachs’s Robin Brooks: The Fed will not raise interest rates by 50 basis points @seekingalpha https://t.co/qpnFn4TWzr", "tweet_url": "https://x.com/MikeZaccardi/status/2120279333998600509", "images": ["https://pbs.twimg.com/media/HWy-0YuXQAASqvt.png"], "created_at": "2026-11-10T22:16:00.000Z", "relayers": []}]}, {"bank": "BofA", "theme": "BofA — client flows (institutions buy, retail sells); memory supercycle through 2028; Neil commentary on NVDA and Bowman", "items": [{"author": "neilsethinew", "text": "Nvidia ($NVDA) is down nearly 8% after hours after the Wall Street Journal reported the board is preparing to oust CEO Jensen Huang. Multiple outlets report directors are meeting today to decide his future. \n\nThe stock is now down a third from its October 6 record close and at its lowest level since July 2025. Including tonight’s drop, Reuters puts Nvidia’s lost market value at about $600B since the board opened its investigation on Sunday.\n\nKey points:\n\n▪️ This went from a personal scandal to a governance problem in three days. On Sunday Huang admitted an affair with Alice Huang (no relation), a Megaspeed executive US intelligence officials reportedly believe works for China’s Ministry of State Security. On Wednesday the New York Times reported a second relationship, with Kimberly Powell, who runs Nvidia’s healthcare business. \n\n▪️ Further, Bloomberg’s analysis of trade records shows Megaspeed imported over $4.6B of Nvidia products, much of it in a surge ahead of planned US licensing rules in May 2025. Bloomberg also found Megaspeed brought in 50,000 more chips than Nvidia’s audit located in its data centers. The Justice Department is now leading multiple investigations involving Alice Huang, and Commerce has been probing Megaspeed since late 2024.\n\n▪️ There’s no succession plan. Huang has roughly 60 direct reports and has said he doesn’t believe in formal succession planning. Nvidia’s own proxy says it’s “highly dependent” on its longtime executive team. Bloomberg reports the board is working with an outside firm on candidates and weighing an interim CEO while it searches.\n\n▪️ Washington upcoming. Huang is due before a closed-door session of House national security committees on November 18. His relationship with President Trump helped win approval for chip sales to China, and those decisions are now drawing scrutiny from lawmakers.\n\n▪️ This reaches past Nvidia’s own stock. Huang is the AI trade’s chief salesman and dealmaker. Nvidia held about $63B in public stakes as of June 30, plus private bets on OpenAI and Anthropic, and a $500B financing pool with private-capital partners. A leadership change raises questions about those and future commitments and about Nvidia’s China strategy.\n\n▪️ The selloff is spreading to the companies Nvidia has backed. All seven of Nvidia’s major public stakes are down at least 1% after hours. CoreWeave is -6.4%, Nebius -3.9%, Coherent -3.2%, Intel -2.5%, Nokia -1.9%, Synopsys -1.7% and SpaceX -1.2%. Oracle, tied in through OpenAI’s Stargate rather than an Nvidia stake, is -2.8%. Hyperscalers other than Oracle in contrast are little changed (Meta is the worst -0.8%) and competitors are up (AMD +3.2%).", "tweet_url": "https://x.com/neilsethinew/status/2120687163989754025", "images": ["https://pbs.twimg.com/media/HW4xt_EWIAAtv3i.jpg"], "created_at": "2026-11-12T01:16:35.000Z", "relayers": []}, {"author": "neilsethinew", "text": "BofA’s institutional clients bought the dip last week while retail clients sold for a 4th straight week, as the S&P 500 fell 2.7%, its worst week since April 2025.\n\n▪️ Institutions: +$6.1B, about $4B of it via equity ETFs (so broad buying into risk).\n▪️ Retail: -$2.1B, dumping $3.4B of single stocks while still adding $1.4B of ETFs.\n▪️ Hedge funds: small buyers for the 1st time in 4 weeks.\n\nEquity ETFs drew $5.3B, the 4th-largest week in BofA’s data, mostly into broad US large-cap index funds. So clients were buying the market, not picking names, while single stocks saw a 4th straight week of selling.\n\nBut the retail dip-buying that has cushioned sell-offs since the April 2025 tariff shock so far is missing from this data. Per the CNBC article:  \n\nRetail traders “have not been a ballast. We’ve talked a lot about how they do this ‘buy the dip’; they’re the support” for the broader market, Amy Wu Silverman, head of derivatives strategy at RBC Capital Markets, told CNBC’s “Squawk Box.” “Not only was that absent, it was going the other way.”\n\n“When you look at Thursday’s price action, it was kicked off by a lot of retail put buying. It was retail who got nervous and this sort of created a chain reaction with other aspects of the market,” Silverman said.", "tweet_url": "https://x.com/neilsethinew/status/2120547105504895111", "images": ["https://pbs.twimg.com/media/HW2q6_GXwAAPqtJ.jpg"], "created_at": "2026-11-11T16:00:02.000Z", "relayers": []}, {"author": "neilsethinew", "text": "@C_Barraud's Wednesday Brief also included the WSJ’s Nick Timiraos noting that in contrast with what we've heard from other Fed officials of late, Vice Chair for Supervision Bowman struck “a cautious note.” His post has a link to her speech, though, which makes it clear she's likely on board with another hike, but she does provide more caveats and a dose of caution about the AI trade.\n\n▪️ Importantly, she stresses there is more work to do: “Today, I am seeing signs that inflation pressures are persisting, while labor market conditions appear to be firming. This indicates that there is still work to do to bring inflation closer to 2 percent.” She says Tuesday's CPI suggests core PCE “likely moved up further to 3.3 percent in October,” that pressures “may be broadening,” and that she’s “more attentive to the inflation side of our mandate.”\n\n▪️ Her caveats: Financial conditions “have tightened a bit recently,” so “the benefit of additional policy tightening has to be carefully weighed against its costs for interest-rate-sensitive sectors.” Bowman also sees tariffs, energy and AI each driving “roughly one-fourth” of above-target core PCE and says \"my approach is to look through temporary energy-driven inflation, when possible, and to remain alert to signs that it is spreading into broader prices or expectations.\" Currently she mostly views those pressures as“relative price shocks in specific sectors,” and she expects core PCE “to move closer to 2 percent next year.”\n\n▪️ The AI trade: Risks “seem to be concentrated in only a few large firms that provide AI services.” AI-related debt “is on track to exceed $800 billion this year,” and other obligations are “more than three times” that. Equity stakes in customers are “creating the appearance of circular financing.” A shortfall in AI revenues could bring “a sharp correction in equity prices for AI firms, higher financing costs, and reduced access to credit.”\n\nSo she seems in the hike camp, just not the faster-hike camp.", "tweet_url": "https://x.com/neilsethinew/status/2120527218417729717", "images": ["https://pbs.twimg.com/media/HW2gQAyWoAAnZaK.jpg"], "created_at": "2026-11-11T14:41:01.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "BofA sees memory chip supercycle extending through 2028 @seekingalpha https://t.co/q266RqJWsb", "tweet_url": "https://x.com/MikeZaccardi/status/2120286883078873434", "images": ["https://pbs.twimg.com/media/HWzFr0tXwAAb31P.png"], "created_at": "2026-11-10T22:46:00.000Z", "relayers": []}]}, {"bank": "JPM", "theme": "JPM — momentum capitulation checklist (Lakos-Bujas); JPMAM AI productivity and $15T investment-cycle charts", "items": [{"author": "MikeZaccardi", "text": "JPMAM: AI should boost productivity globally, with the U.S. seeing the largest boost of 40bps annually. https://t.co/mdIUMh2WUV", "tweet_url": "https://x.com/MikeZaccardi/status/212067011 // ---------- helpers ----------
function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }

function renderBold(text) {
  return escapeHtml(text).replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
}

function relativeTime(iso) {
  if (!iso) return '';
  const dt = new Date(iso);
  if (isNaN(dt.getTime())) return '';
  const secs = Math.max(0, (Date.now() - dt.getTime()) / 1000);
  if (secs < 60)   return Math.floor(secs) + 's ago';
  const mins = secs / 60;
  if (mins < 60)   return Math.floor(mins) + 'm ago';
  const hrs  = mins / 60;
  if (hrs < 48)    return Math.floor(hrs) + 'h ago';
  return Math.floor(hrs / 24) + 'd ago';
}

function authorTag(name, cls = 'item-author') {
  if (!name) return '';
  return `<span class="${cls}" onclick="filterAuthor('${escapeAttr(name)}')">@${escapeHtml(name)}</span>`;
}

// ---------- rendering ----------
function renderCharts(images) {
  if (!images || !images.length) return '';
  return `<div class="charts">` + images.map(u =>
    `<img src="${escapeAttr(u)}" class="chart" loading="lazy" alt="" onclick="openLightbox('${escapeAttr(u)}')">`
  ).join('') + `</div>`;
}

function renderDataPoints(points) {
  if (!points || !points.length) return '';
  return `<div class="data-points">` + points.map(p =>
    `<span class="dp-tag">${escapeHtml(p)}</span>`
  ).join('') + `</div>`;
}

function renderRelayers(item) {
  const r = item.relayers || [];
  if (!r.length) return '';
  // gen_bank_research_report.py already puts this line into data_points.
  if ((item.data_points || []).some(p => String(p).startsWith('also carried by'))) return '';
  return `<div class="data-points"><span class="dp-tag">also carried by: ${
    r.map(a => '@' + escapeHtml(a)).join(', ')}</span></div>`;
}

function renderItem(item, preferText) {
  const author = item.author || item.author_username || '';
  const time = relativeTime(item.created_at);
  const link = item.tweet_url
    ? `<a class="item-link" href="${escapeAttr(item.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  const body = preferText ? (item.text || item.description || '')
                          : (item.description || item.text || '');
  return `
    <div class="item-card filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${authorTag(author)}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      ${body ? `<div class="item-text">${escapeHtml(body)}</div>` : ''}
      ${renderDataPoints(item.data_points)}
      ${renderRelayers(item)}
      ${renderCharts(item.images)}
    </div>`;
}

function renderTopic(topic, idx) {
  const items = (topic.items || []).map(it => renderItem(it, topic._fromBanks)).join('');
  const name = topic.topic || topic.name || `Topic ${idx + 1}`;
  return `
    <div class="topic">
      <div class="topic-head" onclick="toggleTopic(this)">
        <span class="topic-name">${escapeHtml(name)}</span>
        <span class="topic-count">${(topic.items || []).length}</span>
        <span class="topic-arrow">▸</span>
      </div>
      <div class="topic-body">${items || '<div class="empty">No items.</div>'}</div>
    </div>`;
}

function renderLink(l) {
  const author = l.author || l.author_username || '';
  const url = l.url || (l.resolved || l.tco) || '';
  return `
    <div class="link-row filterable" data-author="${escapeAttr(author).toLowerCase()}">
      ${author ? authorTag(author, 'link-author') : '<span class="link-author">—</span>'}
      <a class="link-url" href="${escapeAttr(url)}" target="_blank" rel="noopener">${escapeHtml(url)}</a>
      ${l.description ? `<span class="link-desc">${escapeHtml(l.description)}</span>` : ''}
    </div>`;
}

function renderSection(letter, name, body, count) {
  return `
    <div class="section">
      <div class="section-head" onclick="toggleSection(this)">
        <span class="section-letter">${letter}.</span>
        <span class="section-name">${escapeHtml(name)}</span>
        <span class="section-count">${count}</span>
        <span class="section-arrow">▸</span>
      </div>
      <div class="section-body">${body}</div>
    </div>`;
}

function renderSummary(text) {
  if (!text) return '';
  const paragraphs = String(text).split(/\n\n+/).filter(Boolean)
    .map(p => `<p>${renderBold(p)}</p>`).join('');
  return `<div class="summary">${paragraphs}</div>`;
}

// The bank-research routine emits `banks` [{bank, theme, items[{text,...}]}];
// older reports (and the Data template's schema) use `topics`. Render `banks`
// directly when present, else fall back to `topics`.
function reportGroups(d) {
  if (Array.isArray(d.banks) && d.banks.length) {
    return { label: 'Banks', unit: 'banks', groups: d.banks.map(b => ({
      topic: b.theme ? `${b.bank} — ${b.theme}` : (b.bank || ''),
      items: b.items || [],
      _fromBanks: true,
    })) };
  }
  return { label: 'Topics', unit: 'topics', groups: d.topics || [] };
}

function renderStats(d) {
  const parts = [];
  const cov = d.coverage || {};
  if (cov.authors_covered != null && cov.authors_total != null) {
    const pct = cov.authors_total ? (100 * cov.authors_covered / cov.authors_total) : 0;
    parts.push(`coverage <strong>${cov.authors_covered}/${cov.authors_total}</strong> (${pct.toFixed(0)}%)`);
  }
  const g = reportGroups(d);
  const topicCount = g.groups.length;
  const itemCount = g.groups.reduce((n, t) => n + (t.items || []).length, 0);
  parts.push(`${g.unit} <strong>${topicCount}</strong>`);
  parts.push(`items <strong>${itemCount}</strong>`);
  if ((d.links || []).length) parts.push(`links <strong>${d.links.length}</strong>`);
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSection(el) { el.parentElement.classList.toggle('open'); }
function toggleTopic(el)   { el.parentElement.classList.toggle('open'); }

function openLightbox(src) {
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-img').src = '';
}

let activeFilter = null;
function filterAuthor(name) {
  if (!name) return;
  activeFilter = String(name).toLowerCase();
  document.querySelectorAll('.filterable').forEach(el => {
    const a = (el.dataset.author || '').toLowerCase();
    if (a === activeFilter) { el.classList.add('match'); el.classList.remove('dim'); }
    else                    { el.classList.add('dim'); el.classList.remove('match'); }
  });
  document.getElementById('filter-name').textContent = '@' + name;
  document.getElementById('filter-bar').classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function clearFilter() {
  activeFilter = null;
  document.querySelectorAll('.filterable').forEach(el => {
    el.classList.remove('match'); el.classList.remove('dim');
  });
  document.getElementById('filter-bar').classList.remove('active');
}
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (document.getElementById('lightbox').classList.contains('open')) closeLightbox();
    else if (activeFilter) clearFilter();
  }
});

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';

  const g = reportGroups(d);
  const topicsBody = g.groups.map(renderTopic).join('')
                  || `<div class="empty">No ${g.unit}.</div>`;
  const linksBody = (d.links || []).map(renderLink).join('');

  const sections = [
    renderSummary(d.summary),
    renderSection('A', g.label, topicsBody, g.groups.length),
    linksBody ? renderSection('B', 'Link Queue', linksBody, (d.links || []).length) : '',
  ].join('');

  document.getElementById('app').innerHTML = sections || '<div class="empty">No report data.</div>';

  // Auto-open the main section and the first topic.
  document.querySelectorAll('.section').forEach((s, i) => { if (i === 0) s.classList.add('open'); });
  const firstTopic = document.querySelector('.topic');
  if (firstTopic) firstTopic.classList.add('open');

  document.getElementById('stats').innerHTML = renderStats(d);
}

renderReport(REPORT_DATA);
</script>
