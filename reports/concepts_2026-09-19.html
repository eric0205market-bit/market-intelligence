y calling the clinical data robust, and approval only followed after Ultragenyx fixed the plants and resubmitted.", "speaker": "Packy McCormick", "type": "causal", "entities": ["FDA", "Ultragenyx", "Fayuvi"], "conviction": "high", "so_what": "Chemistry-manufacturing-controls, not efficacy, is the binding constraint on gene therapy approvals, so CRL headlines on manufacturing should be treated as timing delays rather than thesis breaks.", "quote": "the FDA rejected it over manufacturing issues, even while calling the clinical data robust", "locator": "Then last July, the FDA rejected it", "quote_verified": true}, {"claim": "The therapy was built by Haiyan Fu and Doug McCarty at Nationwide Children's more than a decade ago and licensed to Abeona, which ran out of money despite good data before handing it to Ultragenyx.", "speaker": "Packy McCormick", "type": "anecdote", "entities": ["Haiyan Fu", "Doug McCarty", "Nationwide Children's", "Abeona", "Ultragenyx"], "conviction": "high", "so_what": "Capital exhaustion, not scientific failure, is the common death mode for rare-disease assets, which creates a recurring opportunity to buy orphan programs cheaply from distressed biotechs.", "quote": null, "locator": "Haiyan Fu and Doug McCarty built the therapy", "quote_verified": false}, {"claim": "Because the gene therapy works best when given early, before neurological damage is done, universal newborn screening is the next required step for the treatment to reach its potential.", "speaker": "Packy McCormick", "type": "thesis", "entities": ["newborn screening", "Sanfilippo syndrome type A", "Fayuvi"], "conviction": "high", "so_what": "Screening infrastructure, not drug supply, will gate the commercial ramp of early-intervention gene therapies, making diagnostics an adjacent investable bottleneck.", "quote": "It works best given early, before the damage is done, so the next thing that needs to happen is newborn screening.", "locator": "It works best given early", "quote_verified": true}]}, {"theme": "Natural General Intelligence for the planet", "insights": [{"claim": "Lowercarbon partner Ryan Orbuch argues that we do not know nearly enough about the planet, that the tools to collect that data now exist, and that the data should be gathered and put into a single model he calls Natural General Intelligence.", "speaker": "Packy McCormick", "type": "thesis", "entities": ["Ryan Orbuch", "Lowercarbon", "Natural General Intelligence"], "conviction": "medium", "so_what": "Signals where a leading climate fund is pointing its next wave of capital: planetary sensing and foundation models on environmental data.", "quote": null, "locator": "(3) Natural General Intelligence", "quote_verified": false}, {"claim": "Only 27% of the ocean floor has been mapped with modern sonar, and much of that coverage is coarse and low resolution.", "speaker": "Packy McCormick", "type": "data_point", "entities": ["ocean floor", "sonar", "Will O'Brien"], "conviction": "high", "so_what": "Quantifies the data vacuum that ocean-mapping, sensing and survey companies are being funded to fill.", "quote": "we have mapped only 27% of the ocean floor with modern sonar, and much of that is coarse, low resolution", "locator": "When Will O'Brien and I wrote about The Great Blue Frontier", "quote_verified": true}, {"claim": "Planetary modeling is structurally analogous to biology, where models have proven useful at making sense of enormous amounts of ever-changing data too complex for humans to grasp holistically, and the goal is to intervene in Earth systems the way medicine intervenes in bodies.", "speaker": "Packy McCormick", "type": "framework", "entities": ["biology", "Natural General Intelligence", "Earth systems"], "conviction": "medium", "so_what": "If the bio-model playbook transfers, expect the same value stack to form in climate: proprietary data collection first, then foundation models, then intervention products.", "quote": null, "locator": "this problem is an awful lot like biology", "quote_verified": false}]}, {"theme": "Jev and decision-only AI models", "insights": [{"claim": "Diogo Almeida, who helped develop the research behind ChatGPT and RLHF, spent two years building TypeSafe's model Jev, which takes information plus questions with predefined answer formats and returns decisions and probabilities in parallel rather than generating prose one token at a time.", "speaker": "Packy McCormick", "type": "thesis", "entities": ["Diogo Almeida", "TypeSafe", "Jev", "ChatGPT", "RLHF"], "conviction": "high", "so_what": "A credible founder attacking the classification/decision layer suggests a wedge market that frontier chat models are structurally overpriced for.", "quote": "Jev takes information and questions with predefined answer formats, then returns decisions and probabilities.", "locator": "(4) ChatGPT & RLHF Co-Inventor Releases TypeSafe AI", "quote_verified": true}, {"claim": "TypeSafe claims Jev delivers 20-200x faster responses and 40-400x lower costs than frontier models on the decisions it is designed for, though these are company-reported numbers with third-party benchmarks not yet available.", "speaker": "Packy McCormick", "type": "data_point", "entities": ["TypeSafe", "Jev", "frontier models"], "conviction": "medium", "so_what": "If even directionally true, this compresses the economics of high-volume classification workloads currently billed to frontier-model APIs.", "quote": "Almeida claims Jev produces 20–200× faster responses and 40–400× lower costs than frontier models on the decisions Jev is designed for.", "locator": "Almeida claims Jev produces", "quote_verified": true}, {"claim": "Return on Tokens (ROT) is the right lens for enterprise AI spend, because a model that skips generating long explanatory answers for humans stops burning tokens on output that has no decision value.", "speaker": "Packy McCormick", "type": "framework", "entities": ["Return on Tokens", "Jev", "TypeSafe"], "conviction": "medium", "so_what": "Gives a metric for screening AI vendors and internal deployments: cost per decision, not tokens consumed or benchmark scores.", "quote": "It seems like a smart way to increase companies' Return on Tokens (ROT)", "locator": "It's not burning tokens writing long answers", "quote_verified": true}, {"claim": "If intelligence gets cheap and fast enough, developers will embed it into all the small decisions that previously required brittle rules or human review, such as routing support tickets, flagging suspicious transactions and scoring churn risk, a Jevons-paradox dynamic the company named itself after.", "speaker": "Packy McCormick", "type": "prediction", "entities": ["Jev", "William Stanley Jevons", "Jevons paradox", "TypeSafe"], "conviction": "high", "so_what": "Supports the view that falling inference cost expands total AI spend rather than shrinking it, which is bullish for aggregate compute demand even as per-call prices collapse.", "quote": "As it gets cheaper and more efficient, we'll use more of it. That's why they named it Jev, after William Stanley Jevons, of Jevons paradox fame.", "locator": "The tools keep getting better!", "quote_verified": true}]}, {"theme": "Thatch, ICHRA and healthcare demand aggregation", "insights": [{"claim": "Thatch announced a $108 million Series C at a $1 billion valuation, with ARR growing nearly 7x over the past twelve months and more than 5,000 employers now on the platform.", "speaker": "Packy McCormick", "type": "data_point", "entities": ["Thatch", "ICHRA"], "conviction": "high", "so_what": "Near-7x ARR growth at a $1B mark makes ICHRA administration one of the faster-compounding benefits-fintech categories to track for comparables.", "quote": "Its ARR has grown nearly 7× over the past twelve months, and more than 5,000 employers now use the platform.", "locator": "(5) Thatch Raises $108M Series C at $1B", "quote_verified": true}, {"claim": "Thatch's cap table combines venture investors The General Partnership, Index Ventures, General Catalyst and a16z with strategic investors Eli Lilly, ADP Ventures and Paychex, while Not Boring Capital has been an investor since 2022.", "speaker": "Packy McCormick", "type": "data_point", "entities": ["Thatch", "The General Partnership", "Index Ventures", "General Catalyst", "a16z", "Eli Lilly", "ADP Ventures", "Paychex", "Not Boring Capital"], "conviction": "high", "so_what": "Payroll incumbents ADP and Paychex investing rather than building signals distribution partnerships over competition, and Eli Lilly's participation hints at pharma interest in direct-to-individual benefit dollars; note the author is a disclosed investor.", "quote": null, "locator": "Investors include The General Partnership", "quote_verified": false}, {"claim": "Changing who controls healthcare dollars can change the healthcare system itself, because once individuals choose how to spend, providers and insurers must build offerings that compete for those dollars.", "speaker": "Packy McCormick", "type": "thesis", "entities": ["Thatch", "ICHRA", "health insurers", "healthcare providers"], "conviction": "high", "so_what": "The investable claim is that defined-contribution health benefits force product competition in insurance, favoring carriers that build consumer-facing individual plans.", "quote": "my thesis was that changing who controls healthcare dollars could change the healthcare system", "locator": "When I wrote about Thatch last October", "quote_verified": true}, {"claim": "If someone can keep their insurer when they change jobs, the insurer has more reason to invest in keeping them healthy over time, because the payoff from prevention no longer leaks to a competitor.", "speaker": "Packy McCormick", "type": "causal", "entities": ["ICHRA", "health insurers", "Thatch"], "conviction": "high", "so_what": "Portability changes insurer incentives on preventive care and chronic-disease management, a structural tailwind for prevention and long-horizon care businesses.", "quote": "if someone can keep their insurer when they change jobs, the insurer has more reason to invest in keeping them healthy over time", "locator": "The bet is that insurers and providers behave differently", "quote_verified": true}, {"claim": "Thatch's model only works if it aggregates enough demand to persuade carriers to build better products, which attracts more people and pulls still better products out of the market, so scale rather than product quality is the gating variable.", "speaker": "Packy McCormick", "type": "framework", "entities": ["Thatch", "health insurance carriers", "ICHRA"], "conviction": "medium", "so_what": "Judge ICHRA platforms on covered-lives aggregation and carrier leverage, not ARR alone, since the flywheel does not start until the demand pool is big enough to move insurer product roadmaps.", "quote": "Thatch needs to aggregate enough demand to persuade carriers to build better products, which could attract more people, which would pull still better products out of the market.", "locator": "In order for Thatch to change the big, sclerotic", "quote_verified": true}]}], "insight_total": 21, "top_entities": ["Thatch", "Ultragenyx", "TypeSafe", "Jev", "Amgen", "AstraZeneca", "FDA", "ICHRA", "tarlatamab", "Fayuvi", "Lowercarbon", "a16z"], "source_meta": {"author": "Packy McCormick", "word_count": 1892, "paywalled": false}}, {"record_id": "23bf8a66854bc901", "source_type": "concepts", "source_name": "World Economic Forum", "source_url": "https://www.weforum.org/videos/half-world-leaders-should-be-women/", "title": "Half the world’s leaders should be women, says Iceland’s former PM", "published_date": "2026-09-16", "language": "en", "processed_at": "2026-09-19T11:09:55Z", "processor": "claude-code-sub-opus", "tags": ["Society", "Macro", "AI"], "gist": "A short WEF video blurb in which Iceland's former PM Katrín Jakobsdóttir argues that women are half the global workforce but hold only a third of corporate leadership roles, framing this as a decision-quality problem rather than only an equity one, with childcare, parental leave and board hiring practices as the binding constraints. The same page frames WEF's upcoming editorial month around the claim that scaling, not inventing, is the bottleneck for AI, quantum and biotech.", "themes": [{"theme": "Workforce-to-boardroom gap", "insights": [{"claim": "Women make up half the global workforce but hold only about one third of corporate leadership roles, a gap that persists two decades into systematic gender-parity tracking.", "speaker": "World Economic Forum", "type": "data_point", "entities": ["World Economic Forum", "corporate leadership", "global workforce"], "conviction": "high", "so_what": "The leadership share, not labour-force participation, is the metric that still has room to move — watch board and C-suite composition disclosures rather than headline employment data for signs of change.", "quote": "Women make up half the global workforce, but hold only a third of corporate leadership roles.", "locator": "Women make up half the global workforce", "quote_verified": true}, {"claim": "The World Economic Forum has published a report titled 'Closing the Gender Gap in Senior Leadership' examining how to raise female representation at senior levels, signalling institutional attention on the senior tier specifically rather than overall workforce parity.", "speaker": "World Economic Forum", "type": "data_point", "entities": ["World Economic Forum", "Closing the Gender Gap in Senior Leadership", "Centre for the New Economy and Society"], "conviction": "high", "so_what": "Institutional benchmarking of senior-leadership composition tends to precede investor and regulator pressure on disclosure — useful as a leading indicator for governance-screen mandates.", "quote": null, "locator": "A new World Economic Forum report", "quote_verified": false}]}, {"theme": "Diversity as decision quality, not equity", "insights": [{"claim": "Katrín Jakobsdóttir argues the under-representation of women in leadership is not primarily an equity issue but a missed opportunity for better decision-making, because diverse leadership teams consistently outperform homogeneous ones.", "speaker": "World Economic Forum", "type": "causal", "entities": ["Katrín Jakobsdóttir", "Iceland", "leadership teams"], "conviction": "high", "so_what": "Reframes board diversity from a compliance cost to a performance input — the argument an allocator would need to make diversity a return driver rather than an ESG screen.", "quote": "this isn't just an equity issue: it's a missed opportunity for better decision-making, since diverse leadership teams consistently outperform homogeneous ones", "locator": "Iceland's former PM Katrín Jakobsdóttir argues", "quote_verified": true}, {"claim": "A former head of government of Iceland is the one making the economic-performance case for gender-balanced leadership, tying the argument to a country that has pushed parity policy furthest rather than to corporate advocacy.", "speaker": "World Economic Forum", "type": "anecdote", "entities": ["Katrín Jakobsdóttir", "Iceland"], "conviction": "medium", "so_what": "Policy-side advocates carry more weight than corporate DEI functions in shaping mandatory board rules — relevant to jurisdictions considering quota legislation.", "quote": null, "locator": "Iceland's former PM Katrín Jakobsdóttir argues", "quote_verified": false}]}, {"theme": "Childcare, leave and board hiring as the binding constraints", "insights": [{"claim": "The practical barriers keeping capable people out of leadership are identified as childcare provision, parental leave policy and board hiring practices — concrete policy and process levers rather than attitudes or pipeline supply.", "speaker": "World Economic Forum", "type": "framework", "entities": ["childcare", "parental leave", "board hiring practices", "Katrín Jakobsdóttir"], "conviction": "high", "so_what": "Locates the fix in fiscal and governance policy, so changes in state childcare funding or board-nomination rules are the actionable triggers to watch, not corporate diversity pledges.", "quote": "the practical barriers from childcare and parental leave policy to board hiring practices that keep capable people out of leadership", "locator": "Here, Jakobsdóttir unpacks the practical barriers", "quote_verified": true}]}, {"theme": "Scaling gap in frontier tech", "insights": [{"claim": "Despite an AI boom, accelerating quantum breakthroughs and billions flowing into biotech, the measurable real-world impact of these technologies has not yet arrived — innovation is only the beginning and the real challenge is scaling what works.", "speaker": "World Economic Forum", "type": "thesis", "entities": ["AI", "quantum", "biotech"], "conviction": "medium", "so_what": "Implies the durable value accrues to deployment and scaling capacity rather than to invention — a bias toward adoption-layer and industrial-integration plays over pure research-stage exposure.", "quote": "AI is booming. Quantum breakthroughs are accelerating. Billions are pouring into biotech. So why isn’t the world feeling the impact yet?", "locator": "AI is booming. Quantum breakthroughs are accelerating.", "quote_verified": true}, {"claim": "The leadership-diversity argument is placed inside an editorial programme about turning technological breakthroughs into real-world progress, implicitly connecting who makes decisions to whether new technologies actually get scaled into industries and economies.", "speaker": "World Economic Forum", "type": "thesis", "entities": ["World Economic Forum", "AI", "biotech", "Centre for the New Economy and Society"], "conviction": "exploratory", "so_what": "If leadership composition is being framed as a scaling input for frontier tech, expect diversity metrics to migrate from ESG reporting into operational and talent due diligence.", "quote": null, "locator": "Over the next month, we’ll explore", "quote_verified": false}]}], "insight_total": 7, "top_entities": ["Katrín Jakobsdóttir", "Iceland", "World Economic Forum", "Closing the Gender Gap in Senior Leadership", "Centre for the New Economy and Society", "AI", "biotech", "parental leave", "childcare", "Global Gender Gap Report 2026"], "source_meta": {"author": "", "word_count": 302, "paywalled": false}}, {"record_id": "30c7ae5f57ec6ae3", "source_type": "concepts", "source_name": "World Economic Forum", "source_url": "https://www.weforum.org/stories/equity-diversity-and-inclusion/gender-gap-index-parity-20-years-of-data-progress/", "title": "Here's what twenty years of data on gender parity reveals", "published_date": "2026-09-16", "language": "en", "processed_at": "2026-09-19T11:10:01Z", "processor": "claude-code-sub-opus", "tags": ["Macro", "Society"], "gist": "Twenty years of Global Gender Gap Index data show global progress toward gender parity decelerated in the second decade versus the first, with education on track to close in eight years but economic participation 129 years away and political empowerment 192 years away. Middle-income economies such as Ecuador, Guatemala, Mexico, Namibia and Nepal have improved faster than top-ranked high-income economies, showing that proximity to parity and speed of advance are different things.", "themes": [{"theme": "Decelerating global parity curve", "insights": [{"claim": "Economies tracked by the Global Gender Gap Index made faster collective progress toward gender parity in the first decade after its 2006 launch than in the second decade, implying the easy gains were front-loaded.", "speaker": "World Economic Forum", "type": "data_point", "entities": ["Global Gender Gap Index", "World Economic Forum"], "conviction": "high", "so_what": "Diversity-linked mandates and ESG screens built on an assumption of steady linear improvement are calibrated to a trend that has already slowed; expect targets to be missed rather than beaten.", "quote": "Since the Global Gender Gap Index was launched in 2006, economies made faster collective progress in the first decade than the second.", "locator": "Since the Global Gender Gap Index was launched", "quote_verified": true}, {"claim": "Progress toward gender parity is described as neither linear nor evenly distributed across economies, and is also differentiated across the four index dimensions rather than moving as a single bloc.", "speaker": "World Economic Forum", "type": "framework", "entities": ["Global Gender Gap Index"], "conviction": "high", "so_what": "A single headline parity score is a poor input for country or portfolio screening; dimension-level and trajectory-level data carry the actual signal.", "quote": "global progress towards parity is neither linear nor evenly distributed among the economies measured", "locator": "Analysis of the Index's 20-year-old dataset", "quote_verified": true}, {"claim": "Some economies have held relatively high parity levels for two decades without making substantive further advances, meaning a high absolute score can coexist with zero momentum.", "speaker": "World Economic Forum", "type": "contrarian", "entities": ["Global Gender Gap Index"], "conviction": "high", "so_what": "Ranking leaders may be the weakest source of incremental change; momentum screens should use rate of improvement, not level.", "quote": "Some economies have sustained relatively high levels of parity over time – but made no substantive advances.", "locator": "Economies ranked in the index have all had different starting points", "quote_verified": true}]}, {"theme": "Dimension-by-dimension time horizons", "insights": [{"claim": "The global education gender gap narrowed 6.5 percentage points over two decades and, at current pace, would reach full parity in eight years — the only dimension with a near-term closing date.", "speaker": "World Economic Forum", "type": "prediction", "entities": ["Educational Attainment"], "conviction": "medium", "so_what": "The supply of educated female talent is close to fully unlocked; the binding constraint for economies shifts from schooling to absorption into labour markets and leadership.", "quote": "If every economy continues to advance at its current pace, we would reach parity in eight years.", "locator": "In Educational Attainment for example", "quote_verified": true}, {"claim": "The share of economies that had closed at least 60% of their economic participation gender gap rose from around 57% in 2006 to 84% in 2026, yet the global economic gap narrowed only 6.1 percentage points and full economic parity remains 129 years away at current pace.", "speaker": "World Economic Forum", "type": "data_point", "entities": ["Economic Participation and Opportunity"], "conviction": "high", "so_what": "Broad participation gains mask a long tail: the last third of the economic gap is where labour-supply upside for GDP growth still sits, and it is not arriving within any investment horizon.", "quote": "At the current pace, however, full economic parity remains 129 years away.", "locator": "In Economic Participation and Opportunity", "quote_verified": true}, {"claim": "Political Empowerment remains the widest gender gap worldwide and is 192 years from closing, even though the share of economies scoring above 30% on it rose from under 15% in 2006 to 40% in 2026.", "speaker": "World Economic Forum", "type": "data_point", "entities": ["Political Empowerment"], "conviction": "high", "so_what": "Policy-making bodies will stay male-dominated for the foreseeable future, so parity reform depends on legal and corporate channels rather than on changed political composition.", "quote": "remains the dimension with the widest gender gap to close worldwide and furthest away from closing at 192 years", "locator": "Fewer than 15% of economies had a Political Empowerment score", "quote_verified": true}, {"claim": "Nearly every economy in the index started in 2006 with at least 70% of its education gender gap already closed, so education entered the period as the structurally most advanced of the four subindexes.", "speaker": "World Economic Forum", "type": "data_point", "entities": ["Educational Attainment"], "conviction": "high", "so_what": "Improvement headroom in education was always limited; incremental national parity gains from here must come from economic and political dimensions.", "quote": null, "locator": "In Educational Attainment for example", "quote_verified": false}]}, {"theme": "Middle-income fast movers outrun leaders", "insights": [{"claim": "Ecuador, Guatemala, Mexico, Namibia and Nepal recorded a faster average annual rate of parity improvement relative to their initial levels over the past two decades than the best-performing higher-income economies.", "speaker": "World Economic Forum", "type": "contrarian", "entities": ["Ecuador", "Guatemala", "Mexico", "Namibia", "Nepal"], "conviction": "high", "so_what": "The fastest change in female labour-force participation and economic rights is happening in specific middle-income markets, not in the usual Nordic-led leaderboard — relevant for consumer, banking and financial-inclusion exposure in those countries.", "quote": "several middle-income economies including Ecuador, Guatemala, Mexico, Namibia and Nepal recorded a speed of progress faster than that of best-performing higher-income economies", "locator": "Over the past two decades, several middle-income economies", "quote_verified": true}, {"claim": "Mexico, Ecuador and Namibia drove their gains by removing legal restrictions on women working, opening bank accounts, registering businesses, signing contracts and inheriting or managing property.", "speaker": "World Economic Forum", "type": "causal", "entities": ["Mexico", "Ecuador", "Namibia"], "conviction": "high", "so_what": "Legal access to banking, contracts and property is the transmission channel — a direct read-through to addressable market expansion for retail banks, payments and SME lenders in those economies.", "quote": "removing restrictions that limited women from working, opening bank accounts, registering businesses, signing contracts and inheriting and managing property", "locator": "In the last six decades, Mexico, Ecuador and Namibia", "quote_verified": true}, {"claim": "Ecuador, Namibia and Nepal extended social protection through pension provisions, recognition of childcare-related absences and expanded maternity or paternity leave, layering safety-net reform on top of access rights.", "speaker": "World Economic Forum", "type": "data_point", "entities": ["Ecuador", "Namibia", "Nepal"], "conviction": "high", "so_what": "Rising statutory leave and pension obligations are a forward cost line for employers in these markets and a growth driver for formal pension and insurance providers.", "quote": null, "locator": "Ecuador, Namibia and Nepal further extended social protection", "quote_verified": false}, {"claim": "World Bank Women, Business and the Law 2026 data is cited as evidence that early gender parity reforms have substantially expanded women's economic rights over the following years, making reform effects cumulative rather than one-off.", "speaker": "World Economic Forum", "type": "causal", "entities": ["World Bank", "Women, Business, and the Law"], "conviction": "medium", "so_what": "Countries that passed early legal reforms are compounding the benefit; track Women, Business and the Law scores as a leading indicator of future female labour-force participation.", "quote": null, "locator": "As 2026 data from the World Bank's Women, Business, and the Law project shows", "quote_verified": false}]}, {"theme": "Reform fragility and implementation gap", "insights": [{"claim": "The effectiveness of legal and institutional parity frameworks depends on robust, well-aligned enforcement mechanisms, and without them trajectories can slow, plateau or reverse and undo the foundations already built.", "speaker": "World Economic Forum", "type": "thesis", "entities": ["Global Gender Gap Index"], "conviction": "high", "so_what":  levels, institutions and development pathways.", "speaker": "World Economic Forum", "type": "framework", "entities": ["Global Gender Gap Index"], "conviction": "high", "so_what": "Scores say nothing about absolute living standards or female outcomes in level terms — a high score in a poor economy is not a high outcome, which limits naive cross-country investment inference.", "quote": "The Index measures gender gaps as relative, and not absolute levels of parity between men and women.", "locator": "How the Global Gender Gap Index tracks progress", "quote_verified": true}, {"claim": "Being closest to parity is not the same as advancing toward it fastest, whether compared across economies or across the dimensions of the index.", "speaker": "World Economic Forum", "type": "thesis", "entities": ["Global Gender Gap Index"], "conviction": "high", "so_what": "Separating level from velocity is the core screen: rank tells you where a market is, rate of change tells you where its labour market and consumer base are heading.", "quote": "Two decades of evidence show that being closest to parity is not the same as advancing towards it the fastest", "locator": "Two decades of evidence show that being closest to parity", "quote_verified": true}, {"claim": "Global progress is capped by the slowest-moving economies, so stalled countries are framed as a drag on worldwide parity rather than only on their own development.", "speaker": "World Economic Forum", "type": "causal", "entities": ["Global Gender Gap Index"], "conviction": "medium", "so_what": "Global aggregate parity forecasts are hostage to laggards, meaning the 129- and 192-year horizons will not shorten just because leaders improve.", "quote": "we can only go as fast as those with the slowest rate of advancement", "locator": "The economies that find themselves in a standstill", "quote_verified": true}, {"claim": "Each annual index observation is treated as a point on a longer continuum that captures the interaction of public // YouTube-aligned hex colors for tinted insight chips (bg = color+"1a", text = color, border = color+"55").
const TYPE_HEX = {
  thesis: '#6366f1', prediction: '#0ea5e9', framework: '#8b5cf6',
  data_point: '#059669', causal: '#d97706', contrarian: '#dc2626',
  anecdote: '#64748b',
};
const CONV_HEX = { high: '#16a34a', medium: '#ca8a04', low: '#94a3b8', exploratory: '#94a3b8' };
function typeHex(t) { return TYPE_HEX[String(t || '').toLowerCase()] || '#475569'; }
function convHex(c) { return CONV_HEX[String(c || '').toLowerCase()] || '#64748b'; }

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }

// Tinted chip (YouTube style): faint bg, colored text + border.
function tintChip(text, color) {
  return `<span class="chip" style="background:${color}1a;color:${color};border-color:${color}55">${escapeHtml(text)}</span>`;
}
function tagPills(tags) {
  if (!tags || !tags.length) return '';
  return tags.map(t => `<span class="pill tag">${escapeHtml(t)}</span>`).join(' ');
}

// Insight presentation ported from the YouTube digest: type/conviction tinted
// chips, speaker as a 🗣 chip, and entities as indigo chips — all in the meta row

// verbatim + "✓ verified" (stronger than YouTube's ≈ paraphrase wording).

  if (ins.speaker) meta.push(`<span class="chip chip-spk">🗣 ${escapeHtml(ins.speaker)}</span>`);
  if (ins.conviction) meta.push(tintChip('conviction: ' + ins.conviction, convHex(ins.conviction)));
  (ins.entities || []).slice(0, 12).forEach(e => {
    if (e) meta.push(`<span class="chip chip-ent">${escapeHtml(e)}</span>`);
  });
  let quote = '';
  if (ins.quote) {
    const v = ins.quote_verified
      ? `<span class="vmark">✓ verified</span>`
      : `<span class="vmark no">unverified</span>`;
    quote = `<div class="quote">“${escapeHtml(ins.quote)}”${v}</div>`;
  }
  const so = ins.so_what
    ? `<div class="insight-so"><span class="lbl">so what</span>${escapeHtml(ins.so_what)}</div>` : '';
  return `
    <div class="${cls}">
      <div class="insight-claim">${escapeHtml(ins.claim || '')}</div>
      <div class="insight-meta">${meta.join('')}</div>
      ${so}
      ${quote}
    </div>`;
}

function renderTheme(theme) {
  const insights = (theme.insights || []).map(renderInsight).join('');
  return `
    <div class="theme">
      <div class="theme-title">${escapeHtml(theme.theme || 'Theme')}</div>
      ${insights}
    </div>`;
}

function renderCard(card) {
  if (!card) return '';
  const meta = card.source_meta || {};
  const nameHtml = card.source_url
    ? `<a class="source-name" href="${escapeAttr(card.source_url)}" target="_blank" rel="noopener">${escapeHtml(card.source_name || '')}</a>`
    : `<span class="source-name">${escapeHtml(card.source_name || '')}</span>`;
  const subBits = [];
  if (card.published_date) subBits.push(escapeHtml(card.published_date));
  if (meta.author) subBits.push(escapeHtml(meta.author));
  if (meta.word_count) subBits.push(`${meta.word_count} words`);
  if (meta.paywalled) subBits.push('paywalled');
  const themes = (card.themes || []).map(renderTheme).join('');
  const n = card.insight_total != null ? card.insight_total
            : (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
  return `
    <div class="source">
      <div class="source-head" onclick="toggleSource(this)">
        <div class="source-meta-left">
          <div class="source-name-row">${nameHtml}</div>
          <div class="source-title">${escapeHtml(card.title || '')}</div>
          <div class="source-sub">${subBits.join('  ·  ')}</div>
        </div>
        <span class="source-count">${n} insight${n === 1 ? '' : 's'}</span>
        <span class="source-arrow">▸</span>
      </div>
      <div class="source-body">
        ${card.gist ? `<div class="gist">${escapeHtml(card.gist)}</div>` : ''}
        ${card.tags && card.tags.length ? `<div class="tags">${tagPills(card.tags)}</div>` : ''}
        ${themes || '<div class="empty">No insights.</div>'}
      </div>
    </div>`;
}

function renderTopStats(d) {
  const s = d.stats || {};
  const parts = [];
  if (d.date) parts.push(`date <strong>${escapeHtml(d.date)}</strong>`);
  if (s.lookback_days != null) parts.push(`lookback <strong>${s.lookback_days}d</strong>`);
  if (s.sources != null) parts.push(`sources <strong>${s.sources}</strong>`);
  if (s.cards != null) parts.push(`cards <strong>${s.cards}</strong>`);
  if (s.insights != null) parts.push(`insights <strong>${s.insights}</strong>`);
  if (s.quote_verified_pct != null) parts.push(`quotes verified <strong>${s.quote_verified_pct}%</strong>`);
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSource(headEl) { headEl.parentElement.classList.toggle('open'); }

function insightCount(card) {
  return (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
}

// Build the sort/filter control bar (display only — re-groups REPORT_DATA in place).
function buildControls(d) {
  const cards = d.cards || [];
  const names = [...new Set(cards.map(c => c.source_name || '—'))].sort((a, b) => a.localeCompare(b));
  const opts = names.map(n => `<option value="${escapeAttr(n)}">${escapeHtml(n)}</option>`).join('');
  document.getElementById('controls').innerHTML =
    `<label>Sort
       <select id="sortSel">
         <option value="source">Source A–Z</option>
         <option value="insights">Insight count ▼</option>
       </select></label>
     <label>Source
       <select id="srcSel">
         <option value="__all">All sources (${names.length})</option>
         ${opts}
       </select></label>
     <span class="ctl-btns">
       <button type="button" id="expandAll">Expand all</button>
       <button type="button" id="collapseAll">Collapse all</button>
     </span>`;
  document.getElementById('sortSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('srcSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('expandAll').addEventListener('click', () => setAllGroups(false));
  document.getElementById('collapseAll').addEventListener('click', () => setAllGroups(true));
}

// Group-level collapse: header click toggles one group; the control-bar buttons toggle all.
function toggleGroup(headEl) { headEl.parentElement.classList.toggle('collapsed'); }
function setAllGroups(collapsed) {
  document.querySelectorAll('.group').forEach(g => g.classList.toggle('collapsed', collapsed));
}

// Group cards by source, sort groups (and cards within), optionally filter to one source.
function renderGroups(d) {
  const sortMode = (document.getElementById('sortSel') || {}).value || 'source';
  const srcFilter = (document.getElementById('srcSel') || {}).value || '__all';
  let cards = (d.cards || []).slice();
  if (srcFilter !== '__all') cards = cards.filter(c => (c.source_name || '—') === srcFilter);

  const groups = new Map();
  cards.forEach(c => {
    const k = c.source_name || '—';
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(c);
  });
  let entries = [...groups.entries()].map(([name, cs]) => ({
    name, cards: cs, insights: cs.reduce((a, c) => a + insightCount(c), 0),
  }));
  if (sortMode === 'insights') entries.sort((a, b) => b.insights - a.insights || a.name.localeCompare(b.name));
  else entries.sort((a, b) => a.name.localeCompare(b.name));
  // Within each source group, heaviest cards first.
  entries.forEach(e => e.cards.sort((a, b) => insightCount(b) - insightCount(a)));

  const html = entries.map(e => {
    const head = `<div class="group-head" onclick="toggleGroup(this)">`
      + `<span class="group-name">${escapeHtml(e.name)}</span>`
      + `<span class="group-meta">${e.cards.length} card${e.cards.length === 1 ? '' : 's'} · ${e.insights} insights</span>`
      + `<span class="group-arrow">▾</span></div>`;
    return `<div class="group">${head}<div class="group-body">${e.cards.map(renderCard).join('')}</div></div>`;
  }).join('');

  const app = document.getElementById('app');
  app.innerHTML = html || '<div class="empty">No cards for this source.</div>';
  // Open the first two source cards by default.
  document.querySelectorAll('.source').forEach((sec, i) => { if (i < 2) sec.classList.add('open'); });
}

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  document.getElementById('stats-top').innerHTML = renderTopStats(d);
  buildControls(d);
  renderGroups(d);   // default: grouped, sorted by source A–Z
}

renderReport(REPORT_DATA);
</script>
</body>
</html>
