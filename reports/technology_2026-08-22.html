I lab pausing training over safety concerns and flagging its own next model's offensive cyber capability is a material signal for AI governance and dual-use-risk tracking.", "quote": null, "locator": "OpenAI said this week that it is halting model training runs", "quote_verified": false}, {"claim": "A reverse-lookup facial identification service exposed millions of people's face photos in a database left accessible on the open internet.", "speaker": "Andy Greenberg", "type": "data_point", "entities": [], "conviction": "medium", "so_what": "Another large-scale biometric data exposure adds to the risk profile of facial-recognition data brokers.", "quote": null, "locator": "A reverse-lookup identification service exposed millions of photos", "quote_verified": false}, {"claim": "Meta ran ads for an app promising to 'nudify' female politicians, including one ad featuring a pornographic deepfake resembling a well-known US politician; Apple removed the app from the App Store only after WIRED's inquiry.", "speaker": "Andy Greenberg", "type": "anecdote", "entities": ["Meta", "Apple"], "conviction": "high", "so_what": "Shows a gap in both Meta's ad-review and Apple's App Store review processes for AI-generated non-consensual deepfake content, requiring media scrutiny to trigger takedown.", "quote": null, "locator": "Meta ran advertisements for an app that promised to nudify female politicians", "quote_verified": false}]}], "insight_total": 16, "top_entities": ["Visa", "Apple", "Meta", "OpenAI", "Flock Safety", "Wildberries", "Siemens", "CISA", "Access Now"], "source_meta": {"author": "Andy Greenberg", "word_count": 1124, "paywalled": false}}, {"record_id": "d6d4c0fb79526a39", "source_type": "technology", "source_name": "Wired", "source_url": "https://www.wired.com/story/china-is-strapping-digital-bombs-to-civilian-infrastructure-is-the-us-ready/", "title": "China Is Strapping 'Digital Bombs' to Civilian Infrastructure—Is the US Ready?", "published_date": "2026-08-20", "language": "en", "processed_at": "2026-08-22T12:00:00Z", "processor": "claude-code-sub-opus", "tags": ["Geopolitics", "Tech", "Macro", "Positioning"], "gist": "A WIRED podcast interview with reporter Andy Greenberg recounts a closed-door insurance-industry war game simulating a Chinese cyberattack (tied to the Volt Typhoon hacking group) that knocks out 5,000 US water utilities at once, concluding that the event would be effectively uninsurable, that private cyber-insurers are the de facto first responders in such a crisis, and that Volt Typhoon is still actively embedded in US infrastructure today.", "themes": [{"theme": "Volt Typhoon's threat profile", "insights": [{"claim": "Volt Typhoon is a Chinese state-sponsored hacking group that, unlike most Chinese state hackers, does not focus on espionage but instead has spent roughly three years pre-positioning malware inside US critical infrastructure to enable future disruption of power, telecommunications, and water systems.", "speaker": "Brian Barrett", "type": "thesis", "entities": ["Volt Typhoon"], "conviction": "high", "so_what": "Defines a persistent, dormant nation-state threat embedded in US infrastructure rather than a one-off intrusion, relevant to any risk assessment of utilities, telecom, or critical-infrastructure operators.", "quote": null, "locator": "Well, Volt Typhoon is a hacker group that I think represents some of the worst nightmares", "quote_verified": false}, {"claim": "Volt Typhoon first came to public light in 2023 targeting electric grids and telecom networks in the continental US and Guam, initially interpreted as targeting US military facilities relevant to a possible Taiwan contingency.", "speaker": "Brian Barrett", "type": "data_point", "entities": ["Volt Typhoon"], "conviction": "high", "so_what": "Establishes the original, narrower military-adjacent theory of Volt Typhoon's purpose, later superseded by broader findings.", "quote": null, "locator": "When Volt Typhoon first came to light in 2023", "quote_verified": false}, {"claim": "Volt Typhoon has been found breaching civilian utilities well beyond military-adjacent targets, including the water and electric utility of Littleton, Massachusetts, a town of only 10,000 people with no apparent military significance, suggesting China's goal may be broader societal disruption as a diversion during a Taiwan crisis, not just delaying US military response.", "speaker": "Brian Barrett", "type": "causal", "entities": ["Volt Typhoon"], "conviction": "medium", "so_what": "Widens the threat surface from a narrow military-logistics risk to essentially any US utility, regardless of size, materially expanding which operators should treat this as a live risk.", "quote": null, "locator": "I spoke, in fact, to the chief information security officer of the water and electric utility in Littleton", "quote_verified": false}, {"claim": "Former NSA director of cybersecurity Rob Joyce has described Volt Typhoon's infrastructure implants as 'digital bombs strapped to our infrastructure.'", "speaker": "Brian Barrett", "type": "data_point", "entities": ["Rob Joyce", "Volt Typhoon"], "conviction": "high", "so_what": "A former top US cybersecurity official's framing lends high-credibility urgency to the scale of pre-positioned risk.", "quote": "digital bombs strapped to our infrastructure", "locator": "as Rob Joyce, the former NSA director of cybersecurity, describes", "quote_verified": true}, {"claim": "As of the interview, sources doing incident response confirm Volt Typhoon, or a group it has evolved into, is still actively breaching US networks, though detection and eviction likely covers only a fraction of its total intrusions.", "speaker": "Brian Barrett", "type": "data_point", "entities": ["Volt Typhoon"], "conviction": "high", "so_what": "Confirms the threat is current and unresolved, not a historical episode, and that known intrusions likely understate total exposure.", "quote": null, "locator": "The answer is unequivocally yes", "quote_verified": false}]}, {"theme": "The insurance-industry war game", "insights": [{"claim": "Former CISA strategist Joshua Corman designed and ran a closed-door war game for about 30 insurance executives in Manhattan simulating a Chinese cyberattack that knocks out 5,000 US water utilities simultaneously, set in a fictional near-future backdrop of rising US-China tension over Taiwan in July 2027.", "speaker": "Brian Barrett", "type": "anecdote", "entities": ["Joshua Corman"], "conviction": "high", "so_what": "A rare inside look at how the private sector is privately stress-testing its readiness for a mass-scale infrastructure cyberattack that public agencies haven't publicly war-gamed at this scale.", "quote": null, "locator": "about 30 insurance executives stepped into a conference room high above Times Square", "quote_verified": false}, {"claim": "Insurance executives were chosen as the war-game subjects because, in a real cyberattack, insurers are typically the first call a victim organization makes, and they control access to pre-approved lawyers and incident responders, making them the de facto gatekeepers of national response resources.", "speaker": "Brian Barrett", "type": "framework", "entities": [], "conviction": "high", "so_what": "Identifies private cyber-insurers, not government agencies, as the practical resource-allocation chokepoint in a mass infrastructure cyberattack — a structural dependency worth understanding for anyone assessing systemic cyber risk.", "quote": null, "locator": "cyber insurance actually controls, on this kind of surprising level, our whole national response", "quote_verified": false}, {"claim": "In the exercise, the game master told participants that leading incident-response firms (Dragos, CrowdStrike, and Mandiant) were already at full capacity and unavailable, forcing the insurers to figure out response on their own.", "speaker": "Brian Barrett", "type": "data_point", "entities": ["Dragos", "CrowdStrike", "Mandiant"], "conviction": "medium", "so_what": "Models a realistic supply constraint: the US does not have enough skilled incident responders to service a mass-scale (5,000-utility) attack simultaneously.", "quote": null, "locator": "you all don't get any incident responders", "quote_verified": false}, {"claim": "When first asked how to prioritize which affected water utilities to help, one insurance-executive table's instinctive answer was to prioritize customers by revenue, a response the reporter characterizes as naive and likely disastrous.", "speaker": "Brian Barrett", "type": "contrarian", "entities": [], "conviction": "medium", "so_what": "Reveals that default corporate triage logic (protect the biggest revenue accounts) is poorly suited to a crisis where human life and cascading infrastructure failure are at stake.", "quote": null, "locator": "Let's just say the biggest customers first", "quote_verified": false}, {"claim": "The game's second-day escalation showed cascading second-order effects from the water outages: data centers losing cooling and going offline, water-dependent drug manufacturing (including insulin) disrupted, and thousands of hospitals facing HVAC failures requiring evacuation in the hottest parts of the country.", "speaker": "Brian Barrett", "type": "causal", "entities": [], "conviction": "high", "so_what": "Demonstrates concretely how a water-utility attack cascades into cloud/data-center outages, pharmaceutical supply shortages, and hospital crises — a systemic-risk map spanning multiple sectors far beyond water itself.", "quote": null, "locator": "Data centers can't get water, can't cool their computers", "quote_verified": false}, {"claim": "As the scenario escalated, insurers faced conflicting prioritization demands: the public and media pushed to protect human life, the Treasury pushed to focus on economic concerns, and the US military pushed to prioritize protecting military infrastructure.", "speaker": "Brian Barrett", "type": "framework", " // ---------- helpers ----------
// YouTube-aligned hex colors for tinted insight chips (bg = color+"1a", text = color, border = color+"55").
const TYPE_HEX = {
  thesis: '#6366f1', prediction: '#0ea5e9', framework: '#8b5cf6',
  data_point: '#7c3aed', causal: '#d97706', contrarian: '#dc2626',
  anecdote: '#64748b',
};
const CONV_HEX = { high: '#7c3aed', medium: '#ca8a04', low: '#94a3b8', exploratory: '#94a3b8' };
function typeHex(t) { return TYPE_HEX[String(t || '').toLowerCase()] || '#475569'; }
function convHex(c) { return CONV_HEX[String(c || '').toLowerCase()] || '#64748b'; }

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }

// Tinted chip (YouTube style): faint bg, colored text + border.
function tintChip(text, color) {
  return `<span class="chip" style="background:${color}1a;color:${color};border-color:${color}55">${escapeHtml(text)}</span>`;
}
function tagPills(tags) {
  if (!tags || !tags.length) return '';
  return tags.map(t => `<span class="pill tag">${escapeHtml(t)}</span>`).join(' ');
}

// ---------- rendering ----------
// Insight presentation ported from the YouTube digest: type/conviction tinted
// chips, speaker as a 🗣 chip, and entities as indigo chips — all in the meta row
// directly under the claim. Quote treatment is INTENTIONALLY kept as Concepts'
// verbatim + "✓ verified" (stronger than YouTube's ≈ paraphrase wording).
function renderInsight(ins) {
  if (!ins) return '';
  const cls = 'insight' + (ins.type ? (' ' + String(ins.type).toLowerCase()) : '');
  const meta = [];
  if (ins.type) meta.push(tintChip(ins.type, typeHex(ins.type)));
  if (ins.speaker) meta.push(`<span class="chip chip-spk">🗣 ${escapeHtml(ins.speaker)}</span>`);
  if (ins.conviction) meta.push(tintChip('conviction: ' + ins.conviction, convHex(ins.conviction)));
  (ins.entities || []).slice(0, 12).forEach(e => {
    if (e) meta.push(`<span class="chip chip-ent">${escapeHtml(e)}</span>`);
  });
  let quote = '';
  if (ins.quote) {
    const v = ins.quote_verified
      ? `<span class="vmark">✓ verified</span>`
      : `<span class="vmark no">unverified</span>`;
    quote = `<div class="quote">“${escapeHtml(ins.quote)}”${v}</div>`;
  }
  const so = ins.so_what
    ? `<div class="insight-so"><span class="lbl">so what</span>${escapeHtml(ins.so_what)}</div>` : '';
  return `
    <div class="${cls}">
      <div class="insight-claim">${escapeHtml(ins.claim || '')}</div>
      <div class="insight-meta">${meta.join('')}</div>
      ${so}
      ${quote}
    </div>`;
}

function renderTheme(theme) {
  const insights = (theme.insights || []).map(renderInsight).join('');
  return `
    <div class="theme">
      <div class="theme-title">${escapeHtml(theme.theme || 'Theme')}</div>
      ${insights}
    </div>`;
}

function renderCard(card) {
  if (!card) return '';
  const meta = card.source_meta || {};
  const nameHtml = card.source_url
    ? `<a class="source-name" href="${escapeAttr(card.source_url)}" target="_blank" rel="noopener">${escapeHtml(card.source_name || '')}</a>`
    : `<span class="source-name">${escapeHtml(card.source_name || '')}</span>`;
  const subBits = [];
  if (card.published_date) subBits.push(escapeHtml(card.published_date));
  if (meta.author) subBits.push(escapeHtml(meta.author));
  if (meta.word_count) subBits.push(`${meta.word_count} words`);
  if (meta.paywalled) subBits.push('paywalled');
  const themes = (card.themes || []).map(renderTheme).join('');
  const n = card.insight_total != null ? card.insight_total
            : (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
  return `
    <div class="source">
      <div class="source-head" onclick="toggleSource(this)">
        <div class="source-meta-left">
          <div class="source-name-row">${nameHtml}</div>
          <div class="source-title">${escapeHtml(card.title || '')}</div>
          <div class="source-sub">${subBits.join('  ·  ')}</div>
        </div>
        <span class="source-count">${n} insight${n === 1 ? '' : 's'}</span>
        <span class="source-arrow">▸</span>
      </div>
      <div class="source-body">
        ${card.gist ? `<div class="gist">${escapeHtml(card.gist)}</div>` : ''}
        ${card.tags && card.tags.length ? `<div class="tags">${tagPills(card.tags)}</div>` : ''}
        ${themes || '<div class="empty">No insights.</div>'}
      </div>
    </div>`;
}

function renderTopStats(d) {
  const s = d.stats || {};
  const parts = [];
  if (d.date) parts.push(`date <strong>${escapeHtml(d.date)}</strong>`);
  if (s.lookback_days != null) parts.push(`lookback <strong>${s.lookback_days}d</strong>`);
  if (s.sources != null) parts.push(`sources <strong>${s.sources}</strong>`);
  if (s.cards != null) parts.push(`cards <strong>${s.cards}</strong>`);
  if (s.insights != null) parts.push(`insights <strong>${s.insights}</strong>`);
  if (s.quote_verified_pct != null) parts.push(`quotes verified <strong>${s.quote_verified_pct}%</strong>`);
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSource(headEl) { headEl.parentElement.classList.toggle('open'); }

function insightCount(card) {
  return (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
}

// Build the sort/filter control bar (display only — re-groups REPORT_DATA in place).
function buildControls(d) {
  const cards = d.cards || [];
  const names = [...new Set(cards.map(c => c.source_name || '—'))].sort((a, b) => a.localeCompare(b));
  const opts = names.map(n => `<option value="${escapeAttr(n)}">${escapeHtml(n)}</option>`).join('');
  document.getElementById('controls').innerHTML =
    `<label>Sort
       <select id="sortSel">
         <option value="source">Source A–Z</option>
         <option value="insights">Insight count ▼</option>
       </select></label>
     <label>Source
       <select id="srcSel">
         <option value="__all">All sources (${names.length})</option>
         ${opts}
       </select></label>
     <span class="ctl-btns">
       <button type="button" id="expandAll">Expand all</button>
       <button type="button" id="collapseAll">Collapse all</button>
     </span>`;
  document.getElementById('sortSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('srcSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('expandAll').addEventListener('click', () => setAllGroups(false));
  document.getElementById('collapseAll').addEventListener('click', () => setAllGroups(true));
}

// Group-level collapse: header click toggles one group; the control-bar buttons toggle all.
function toggleGroup(headEl) { headEl.parentElement.classList.toggle('collapsed'); }
function setAllGroups(collapsed) {
  document.querySelectorAll('.group').forEach(g => g.classList.toggle('collapsed', collapsed));
}

// Group cards by source, sort groups (and cards within), optionally filter to one source.
function renderGroups(d) {
  const sortMode = (document.getElementById('sortSel') || {}).value || 'source';
  const srcFilter = (document.getElementById('srcSel') || {}).value || '__all';
  let cards = (d.cards || []).slice();
  if (srcFilter !== '__all') cards = cards.filter(c => (c.source_name || '—') === srcFilter);

  const groups = new Map();
  cards.forEach(c => {
    const k = c.source_name || '—';
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(c);
  });
  let entries = [...groups.entries()].map(([name, cs]) => ({
    name, cards: cs, insights: cs.reduce((a, c) => a + insightCount(c), 0),
  }));
  if (sortMode === 'insights') entries.sort((a, b) => b.insights - a.insights || a.name.localeCompare(b.name));
  else entries.sort((a, b) => a.name.localeCompare(b.name));
  // Within each source group, heaviest cards first.
  entries.forEach(e => e.cards.sort((a, b) => insightCount(b) - insightCount(a)));

  const html = entries.map(e => {
    const head = `<div class="group-head" onclick="toggleGroup(this)">`
      + `<span class="group-name">${escapeHtml(e.name)}</span>`
      + `<span class="group-meta">${e.cards.length} card${e.cards.length === 1 ? '' : 's'} · ${e.insights} insights</span>`
      + `<span class="group-arrow">▾</span></div>`;
    return `<div class="group">${head}<div class="group-body">${e.cards.map(renderCard).join('')}</div></div>`;
  }).join('');

  const app = document.getElementById('app');
  app.innerHTML = html || '<div class="empty">No cards for this source.</div>';
  // Open the first two source cards by default.
  document.querySelectorAll('.source').forEach((sec, i) => { if (i < 2) sec.classList.add('open'); });
}

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  document.getElementById('stats-top').innerHTML = renderTopStats(d);
  buildControls(d);
  renderGroups(d);   // default: grouped, sorted by source A–Z
}

renderReport(REPORT_DATA);
</script>
