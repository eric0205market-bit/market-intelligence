<!DOCTYPE html>

<title>Twitter Alpha Intelligence</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root {
  --bg: #faf8f5;
  --surface: #ffffff;
  --border: #e8e3da;
  --border-light: #f0ede4;
  --text: #1a1a1a;
  --text-2: #555;
  --text-3: #8a8a8a;
  --accent: #1a8cd8;
  --red: #d94052;
  --yellow: #fff5b3;
  --yellow-border: #f0d966;

  /* category colors (per spec) */
  --cat-macro: #2563eb;        /* blue */
  --cat-crypto: #8b5cf6;       /* purple */
  --cat-energy: #dc2626;       /* red */
  --cat-tech: #0d9488;         /* teal */
  --cat-ai: #4f46e5;           /* indigo */
  --cat-geopolitics: #dc2626;  /* red */
  --cat-positioning: #15803d;  /* green */
  --cat-regulation: #7c3aed;   /* purple */
  --cat-society: #d97706;      /* amber */
  --cat-em: #059669;           /* green */
  --cat-default: #6b7280;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; line-height: 1.55;
       background: var(--bg); color: var(--text); }
.container { max-width: 960px; margin: 0 auto; padding: 24px 16px 80px; }

/* HEADER */
.header { display: flex; justify-content: space-between; align-items: baseline;
          border-bottom: 2px solid var(--text); padding-bottom: 12px; margin-bottom: 20px; }
.title { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
.subtitle { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-3); }

/* FILTER BAR */
.filter-bar { display: none; background: var(--yellow); border: 1px solid var(--yellow-border);
              border-radius: 6px; padding: 8px 12px; margin-bottom: 16px;
              align-items: center; gap: 10px; font-size: 13px; }
.filter-bar.active { display: flex; }
.filter-bar button { font-family: inherit; font-size: 12px; background: transparent;
                     border: 1px solid var(--text); padding: 3px 10px; border-radius: 4px;
                     cursor: pointer; }
.filter-bar button:hover { background: rgba(0,0,0,0.05); }

/* SUMMARY */
.summary { background: var(--surface); border: 1px solid var(--border);
           border-left: 4px solid var(--red); border-radius: 6px;
           padding: 16px 18px; margin-bottom: 20px; }
.summary p { margin-bottom: 8px; }
.summary p:last-child { margin-bottom: 0; }
.summary strong { font-weight: 600; }

/* SECTIONS */
.section { background: var(--surface); border: 1px solid var(--border);
           border-radius: 6px; margin-bottom: 14px; overflow: hidden; }
.section-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px;
                background: #f3efe6; cursor: pointer; user-select: none;
                font-weight: 600; font-size: 13px; }
.section-head:hover { background: #ebe6dc; }
.section-letter { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
                  color: var(--text-3); min-width: 18px; }
.section-name { flex: 1; }
.section-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
                 color: var(--text-3); }
.section-arrow { font-size: 10px; color: var(--text-3); transition: transform .2s; }
.section.open .section-arrow { transform: rotate(90deg); }
.section-body { display: none; padding: 6px 0; }
.section.open .section-body { display: block; }

/* CLUSTER (Section A) */
.cluster { padding: 14px 16px; border-bottom: 1px solid var(--border-light); }
.cluster:last-child { border-bottom: none; }
.cluster-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
                flex-wrap: wrap; }
.cluster-title { font-weight: 600; font-size: 14px; }
.cluster-desc { color: var(--text-2); font-size: 13px; margin: 0 0 10px 0; }
.cluster-items { display: flex; flex-direction: column; gap: 8px; padding-left: 10px;
                 border-left: 2px solid var(--border-light); }
.cluster-item { font-size: 13px; padding: 6px 8px; border-radius: 4px; }
.cluster-item .item-text { font-size: 13px; margin-top: 4px; }
.cluster-item .item-head { font-size: 12px; }

/* ITEM CARDS (Sections B/C/D) */
.item-card { background: var(--surface); border: 1px solid var(--border);
             border-radius: 6px; padding: 12px 14px; margin: 10px 16px; }
.item-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
             flex-wrap: wrap; }
.item-author { font-weight: 600; color: var(--accent); cursor: pointer; }
.item-author:hover { text-decoration: underline; }
.item-time { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--text-3); }
.item-link { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--accent); text-decoration: none; }
.item-link:hover { text-decoration: underline; }
.item-text { font-size: 13.5px; line-height: 1.6; color: var(--text);
             white-space: pre-wrap; word-wrap: break-word; }
.item-thread { display: inline-block; font-size: 10px; font-weight: 600;
               background: var(--border); color: var(--text-2); padding: 1px 6px;
               border-radius: 3px; text-transform: uppercase; letter-spacing: .04em; }

/* CONTRARIAN (Section C) — red left border + soft red bg */
.section-contrarian .item-card {
  border-left: 4px solid var(--red);
  background: #fdf6f7;
}

/* CATEGORY PILLS */
.pill { display: inline-block; font-family: 'IBM Plex Mono', monospace; font-size: 10px;
        font-weight: 500; padding: 2px 7px; border-radius: 3px; color: #fff;
        text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }

/* IMAGES */
.thumbs { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.thumb { height: 100px; border: 1px solid var(--border); border-radius: 4px;
         cursor: zoom-in; background: #f0ede4; }

/* LIGHTBOX */
.lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85);
            align-items: center; justify-content: center; z-index: 100; cursor: zoom-out; }
.lightbox.open { display: flex; }
.lightbox img { max-width: 92vw; max-height: 92vh;
                box-shadow: 0 8px 40px rgba(0,0,0,.6); }

/* LINKS (Section E) */
.link-row { padding: 8px 16px; border-bottom: 1px solid var(--border-light);
            font-size: 13px; display: flex; gap: 12px; align-items: baseline; }
.link-row:last-child { border-bottom: none; }
.link-author { color: var(--text-3); min-width: 110px; cursor: pointer; }
.link-author:hover { color: var(--accent); }
.link-url { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
            color: var(--accent); text-decoration: none; word-break: break-all; flex: 1; }
.link-url:hover { text-decoration: underline; }
.link-desc { color: var(--text-2); font-size: 12px; }

/* AUTHOR FILTER STATES */
.filterable.match { background: var(--yellow); border-color: var(--yellow-border); }
.section-contrarian .item-card.filterable.match { background: var(--yellow); }
.filterable.dim { opacity: 0.25; }

/* STATS BAR */
.stats { margin-top: 24px; padding: 10px 14px; background: var(--surface);
         border: 1px solid var(--border); border-radius: 6px;
         font-family: 'IBM Plex Mono', monospace; font-size: 11.5px;
         color: var(--text-2); display: flex; gap: 18px; flex-wrap: wrap; }
.stats strong { color: var(--text); font-weight: 600; }

/* EMPTY */
.empty { color: var(--text-3); font-size: 13px; padding: 14px 18px; font-style: italic; }

/* RESPONSIVE */
@media (max-width: 640px) {
  .container { padding: 16px 12px 60px; }
  .item-card { margin: 8px 10px; }
  .link-row { flex-direction: column; gap: 4px; }
  .link-author { min-width: 0; }
  .header { flex-direction: column; align-items: flex-start; gap: 4px; }
}
</style>

ar narratives (rate hikes, midterms, Hormuz oil crisis, crash calls).", "tweet_url": "https://x.com/cointradernik/status/2107444956147183631", "images": ["https://pbs.twimg.com/media/HT8l0fuXkAALp1S.jpg"], "type": "tweet"}, {"author": "Evan_ss6", "summary": "Responding to Burry's crash warning: 'So NASDAQ doubles in 2-3 quarters, got it' — and elsewhere posts LEAPS call bait ('Do you really want to be sidelined on LEAPS when NQ goes to 20 jaypegs?').", "tweet_url": "https://x.com/Evan_ss6/status/2107461005001564407", "images": [], "type": "tweet"}, {"author": "_tolks", "summary": "Marks the index ATHs with a tongue-in-cheek post.", "tweet_url": "https://x.com/_tolks/status/2107464778486587877", "images": [], "type": "tweet"}, {"author": "AviFelman", "summary": "Replying to a post that the stock market is in 'denial' like 2000/2008: 'Enough.' In a related reply he argues equities are now the base unit of investment, so forward equity return expectations are rising and bonds must yield more — a new equilibrium.", "tweet_url": "https://x.com/AviFelman/status/2107370835468288368", "images": [], "type": "tweet"}, {"author": "lord_fed", "summary": "'Always impressive how quickly the explanations arrive after the move — for those who were wrong.' Earlier flagged he 'can't remember the last time I saw positioning this bearish. Fresh trade on.' and teased dampedspring about the 'pain trade' being up.", "tweet_url": "https://x.com/lord_fed/status/2107512962688676169", "images": [], "type": "tweet"}]}, {"cluster": "Treasury Supply, 3Y Auction and the Global Rates Squeeze", "category": ["macro"], "items": [{"author": "dampedspring", "summary": "Flags **$119B of 3s, 10s and 30s for sale over the next 3 days**; says the supply is widely expected, and that he was long stocks through 9/30.", "tweet_url": "https://x.com/dampedspring/status/2107472807009690072", "images": [], "type": "tweet"}, {"author": "Fullcarry", "summary": "With 1-year-forward 2s north of **5.19%**, expects bids hina bought most of Iran's exported oil and Chinese firm Chang Guang allegedly provided satellite imagery to the Houthis; pressure still not enough to neutralize them.", "tweet_url": "https://x.com/zriboua/status/2107449288498258034", "images": ["https://pbs.twimg.com/media/HT8p9MUWQAAmDVG.jpg"], "type": "tweet"}, {"author": "zriboua", "summary": "Reacting to Germany's arrest of ex-BND chief August Hanning in a suspected espionage/treason case involving classified intel on Iran's nuclear programme and the Russian military: 'This explains a lot.'", "tweet_url": "https://x.com/zriboua/status/2107449105689755954", "images": [], "type": "tweet"}]}, {"cluster": "AI Does Science: OpenAI Math Proofs and Opus 5.5 Materials Discovery", "category": ["AI", "tech"], "items": [{"author": "cryptopunk7213", "summary": "An unreleased OpenAI model trained for just 11 days reportedly solved **100+ open math problems**; humans don't understand the proofs, so 'AI models reviewing other AI models' is the endgame. Quotes a mathematician noting ~400 AI-generated proofs may be posted publicly and experts are still working out the Navier–Stokes example.", "tweet_url": "https://x.com/cryptopunk7213/status/2107491660468740600", "images": [], "type": "tweet"}, {"author": "Crypto_McKenna", "summary": "Agent swarms discovering room-temperature superconductors-type materials 'will put some of the AI doomerism to bed' — reacting to a lab post that 90+ Opus 5.5 agents found two room-temperature magnetic semiconductor candidates (YBaMnFeO₅, KV[Cr(CN)₆]) in simulations in 3 days.", "tweet_url": "https://x.com/Crypto_McKenna/status/2107475020444475538", "images": [], "type": "tweet"}, {"author": "Melt_Dem", "summary": "'Ready to get hurt again' — same Opus 5.5 materials post, in a bullish-AI-stocks tone.", "tweet_url": "https://x.com/Melt_Dem/status/2107464408062738507", "images": ["https://pbs.twimg.com/tweet_video_thumb/HT83sESXIAER51I.jpg"], "type": "tweet"}, {"author": "garrytan", "summary": "Used hows it.", "tweet_url": "https://x.com/dylan522p/status/2107356202384740569", "images": [], "type": "thread"}, {"author": "nic_carter", "summary": "Mocks 'P(doom) guys' who want to be more benign toward China, the source of the open-weight models most likely to cause doom.", "tweet_url": "https://x.com/nic_carter/status/2107513429590520175", "images": [], "type": "tweet"}]}, {"cluster": "Onchain Tokenized Equities & Exchange Moves (OKX/ICE, Coinbase Options)", "category": ["crypto", "regulation"], "items": [{"author": "stacy_muur", "summary": "On OKX–ICE's OKXICE joint venture notifying the SEC that it will launch a Tokenized Securities Venue under the new Innovation Exemption, she lists others bringing stocks onchain: Kraken/xStocks, Robinhood (EU stock tokens), Ondo, Dinari, Gemini, Bybit, Backpack, Bitget.", "tweet_url": "https://x.com/stacy_muur/status/2107506321096634879", "images": [], "type": "tweet"}, {"author": "brian_armstrong", "summary": "**Stock options trading is live on Coinbase for US customers** — calls and puts first, zero commission for the first month; 'over time it's coming onchain.'", "tweet_url": "https://x.com/brian_armstrong/status/2107498253239660884", "images": [], "type": "tweet"}, {"author": "sjdedic", "summary": "**OKX raised at $25B equity valuation while OKB trades at ~$2.8B FDV** — no buybacks, fee sharing or value accrual; says OKX is abandoning token holders to play the compliant institutional game.", "tweet_url": "https://x.com/sjdedic/status/2107452204915335390", "images": ["https://pbs.twimg.com/media/HT8sm7nXwAERbFq.jpg"], "type": "tweet"}, {"author": "Zeneca", "summary": "Positive on Ethena and EtherFi: EtherFi launching its own stablecoin on Ethena Whitelabel (>$300M deposits; Ethena handles reserves, mint/redeem, compliance).", "tweet_url": "https://x.com/Zeneca/status/2107443602825843190", "images": [], "type": "tweet"}, {"author": "laurashin", "summary": "Ripple Prime (ex-Hidden Road) will provide prime brokerage, clearing jau_inc/status/2107380594560897140", "images": [], "type": "tweet"}, {"author": "chameleon_jeff", "summary": "Thanks organisers of Hyperliquid's Singapore event; says momentum in the ecosystem keeps growing.", "tweet_url": "https://x.com/chameleon_jeff/status/2107387650508505343", "images": [], "type": "tweet"}, {"author": "santiagoroel", "summary": "Speaking at Token2049/Blockworks DAS: 'Token Market Outlook: Bull, Bear or Chop?', 'Future of Crypto vs the Future of AI', 'Crypto's Identity Crisis', and moderating 'The End of the Beginning' with Kyle Samani and hosseeb Thursday.", "tweet_url": "https://x.com/santiagoroel/status/2107394825071067178", "images": [], "type": "tweet"}, {"author": "arthur0x", "summary": "Keynote on the case for active management in crypto, Thu 11:40 at OKX Main Stage; also an MEXC panel on investing in the next cycle.", "tweet_url": "https://x.com/arthur0x/status/2107435909171794082", "images": [], "type": "tweet"}]}], "B_insights": [{"author": "andrewchen", "summary": "Long essay **'Do Agents Have Network Effects?'** Premise: new consumer agents (Muse, Town, Instinct, Grokbot, etc.) wrap Openclaw/Hermes-style power in polished UX, forcing thousands of vertical-agent startups to reassess. Against winner-take-all: agents are tools not networks — more like email clients that interoperate via APIs/email, LLMs are swappable, and memory is just portable text files, so where's the moat? He then tests network effects against acquisition, engagement and monetisation. Acquisition: agents can create viral loops (spin up group chats, RSVP microsites, shareable agent-hosted artifacts instead of a Google Doc or Pinterest board), but need contacts/channels and tasteful execution. Engagement: some tasks genuinely benefit from everyone being on the same agent — discovery ('10 people in SF to meet'), trust/reputation, private-plus-public matching, real-time shared context. Counterpoint: centralisation may occur one layer above agents (agent-native eBay/LinkedIn, open identity protocols). Conclusion: agents don't inherently have network effects; the key question is where they live — open protocols and specialised networks (vertical agents can thrive) vs a few horizontal agents hoarding identity, relationships, reputation and context (switching costs rise). Expects a fight at that boundary as agents pull network functions inside their walls.", "tweet_url": "https://x.com/andrewchen/status/2107339817713623253", "images": [], "type": "thread", "category": ["AI", "tech"]}, {"author": "alpha_pls", "summary": "Thread on sizing and discomfort: things that massively outperform feel uncomfortable to hold; if a position isn't uncomfortable it's too small to matter. Sizing should hurt a little if it fails — not leverage, not ignorance of what you hold. Cites Druckenmiller throwing up over positions; admits he no longer lives that way (kids, less anxiety) and that rising net worth over time already beats 99% of people.", "tweet_url": "https://x.com/alpha_pls/status/2107465437864665420", "images": [], "type": "thread", "category": ["positioning"]}, {"author": "alpha_pls", "summary": "BTC daily candles are essentially a coin flip with no alpha; zoom out to weekly/monthly. States BTC, TOTAL2, TOTAL3 and OTHERS are all 'mega bullish' and urges ignoring rage-bait doomer content.", "tweet_url": "https://x.com/alpha_pls/status/2107441953881100575", "images": [], "type": "thread", "category": ["crypto"]}, {"author": "cointradernik", "summary": "Quoting an analysis that **7 consecutive daily closes above the 365d rVWAP after 100+ days below** is a 5th cyclical breakout: 'long path to Valhalla… $200k in 2027.'", "tweet_url": "https://x.com/cointradernik/status/2107478654984802446", "images": [], "type": "tweet", "category": ["crypto"]}, {"author": "cointradernik", "summary": "His 'Regime Rotation Pro' strategy is +31.2% YTD vs SPY +13.4% (excess +17.8%); product promotion with a free-version pitch.", "tweet_url": "https://x.com/cointradernik/status/2107448253255929895", "images": [], "type": "thread", "category": ["positioning"]}, {"author": "lord_fed", "summary": "Alternative view on AI capex: slower hyperscaler capex isn't necessarily bearish if monetisation keeps improving — the same spend that is a supplier's revenue is cash leaving the hyperscaler, so if existing infrastructure earns better returns the payers become more attractive. Slower growth alone won't fix FCF if the absolute bill keeps rising, and returns must still justify obligations. Links to his earlier posts on the idea.", "tweet_url": "https://x.com/lord_fed/status/2107489752463089979", "images": [], "type": "thread", "category": ["AI", "macro"]}, {"author": "abcampbell", "summary": "'We're going to look back on the summer of 26 like the $5 Uber rides with VC payola' — **long compute** — reacting to a brutal AI-pricing post.", "tweet_url": "https://x.com/abcampbell/status/2107484751389163962", "images": ["https://pbs.twimg.com/tweet_video_thumb/HT9KMqXXEAAXwty.jpg"], "type": "thread", "category": ["AI"]}, {"author": "Melt_Dem", "summary": "First day he churned off an AI product: cancelling/consolidating and building custom tools on his own hardware stack; asks whether AI churn will be higher than SaaS since agents sit on existing systems of record and switching costs are low.", "tweet_url": "https://x.com/Melt_Dem/status/2107474093851255118", "images": [], "type": "tweet", "category": ["AI"]}, {"author": "theallinpod", "summary": "David Friedberg: the 'AI wars' are here; Fortune 50 CEOs in DC are worried about cyber defence, which becomes a board-level #1 priority with budgets 'through the roof'; defence will need AI so the US can't pause AI and must keep building data centers for it.", "tweet_url": "https://x.com/theallinpod/status/2107497528350408979", "images": [], "type": "tweet", "category": ["AI", "geopolitics"]}, {"author": "Delphi_Digital", "summary": "Yan on how AI nationalisation could play out for markets: if the state takes equity 'skin in the game' it's bullish; if it runs everything it's a binary risk.", "tweet_url": "https://x.com/Delphi_Digital/status/2107486045063504117", "images": [], "type": "thread", "category": ["AI", "regulation"]}, {"author": "patrick_oshag", "summary": "Huberman's view that Meta, OpenAI and Anthropic are becoming biotech/neuro companies — the goal is non-invasive read/write of the brain, including motivation stimulation; 'the real arms race of AI'.", "tweet_url": "https://x.com/patrick_oshag/status/2107483484491026626", "images": [], "type": "tweet", "category": ["AI", "tech"]}, {"author": "nic_carter", "summary": "Stablecoins are better than cash or bank/hawala networks for illicit-finance enforcement: issuers are instantly legible to law enforcement and can freeze at a distance; practitioners agree 10/10; the IRGC has used them and paid the price, though issuers have been too conservative with seizures.", "tweet_url": "https://x.com/nic_carter/status/2107501801993814294", "images": [], "type": "tweet", "category": ["crypto", "regulation"]}, {"author": "nic_carter", "summary": "AI is better than almost every human at writing in a blind essay contest, but 'good writing' is tied to the parasocial author relationship, so human writers keep a protected status; AI is at parity/superior for technical or academic writing.", "tweet_url": "https://x.com/nic_carter/status/2107453251662582261", "images": [], "type": "thread", "category": ["AI", "society"]}, {"author": "nic_carter", "summary": "His agent saved him $6k on insurance this year, covering the $100/month subscription many times; 'not getting value from a $100/mo sub is a skill issue.'", "tweet_url": "https://x.com/nic_carter/status/2107463680728223807", "images": [], "type": "tweet", "category": ["AI"]}, {"author": "sjdedic", "summary": "Talks daily to non-crypto LPs who haven't heard of stablecoins and still see crypto as scam/darknet; concludes either the industry is delusional or 'way earlier in this // ---------- helpers ----------
const CAT_VARS = {
  macro: 'var(--cat-macro)',
  crypto: 'var(--cat-crypto)',
  energy: 'var(--cat-energy)',
  tech: 'var(--cat-tech)',
  ai: 'var(--cat-ai)',
  'ai/infra': 'var(--cat-ai)',
  geopolitics: 'var(--cat-geopolitics)',
  positioning: 'var(--cat-positioning)',
  regulation: 'var(--cat-regulation)',
  society: 'var(--cat-society)',
  em: 'var(--cat-em)',
};
function catColor(cat) {
  if (!cat) return 'var(--cat-default)';
  return CAT_VARS[String(cat).toLowerCase()] || 'var(--cat-default)';
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function escapeAttr(s) {
  return escapeHtml(s).replace(/`/g, '&#96;');
}

function renderBold(text) {
  return escapeHtml(text).replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
}

function relativeTime(iso) {
  if (!iso) return '';
  const dt = new Date(iso);
  if (isNaN(dt.getTime())) return '';
  const secs = Math.max(0, (Date.now() - dt.getTime()) / 1000);
  if (secs < 60)   return Math.floor(secs) + 's ago';
  const mins = secs / 60;
  if (mins < 60)   return Math.floor(mins) + 'm ago';
  const hrs  = mins / 60;
  if (hrs < 48)    return Math.floor(hrs) + 'h ago';
  return Math.floor(hrs / 24) + 'd ago';
}

function pill(cat) {
  if (!cat) return '';
  return `<span class="pill" style="background:${catColor(cat)}">${escapeHtml(cat)}</span>`;
}

function authorTag(name, cls = 'item-author') {
  if (!name) return '';
  return `<span class="${cls}" onclick="filterAuthor('${escapeAttr(name)}')">@${escapeHtml(name)}</span>`;
}

// ---------- rendering ----------
function renderThumbs(images) {
  if (!images || !images.length) return '';
  return `<div class="thumbs">` + images.map(u =>
    `<img src="${escapeAttr(u)}" class="thumb" loading="lazy" alt="" onclick="openLightbox('${escapeAttr(u)}')">`
  ).join('') + `</div>`;
}

function renderItem(item) {
  const author = item.author || item.author_username || '';
  const time = relativeTime(item.created_at);
  const thread = item.is_thread ? '<span class="item-thread">thread</span>' : '';
  const link = item.tweet_url
    ? `<a class="item-link" href="${escapeAttr(item.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  return `
    <div class="item-card filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${pill(item.category)}
        ${authorTag(author)}
        ${thread}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      <div class="item-text">${escapeHtml(item.text || '')}</div>
      ${renderThumbs(item.images)}
    </div>`;
}

function renderClusterItem(it) {
  const author = it.author || it.author_username || '';
  const time = relativeTime(it.created_at);
  const link = it.tweet_url
    ? `<a class="item-link" href="${escapeAttr(it.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  return `
    <div class="cluster-item filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${authorTag(author)}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      <div class="item-text">${escapeHtml(it.text || '')}</div>
      ${renderThumbs(it.images)}
    </div>`;
}

function renderCluster(cluster) {
  const itemsHtml = (cluster.items || []).map(renderClusterItem).join('');
  return `
    <div class="cluster">
      <div class="cluster-head">
        ${pill(cluster.category)}
        <div class="cluster-title">${escapeHtml(cluster.title || '')}</div>
      </div>
      ${cluster.description ? `<div class="cluster-desc">${escapeHtml(cluster.description)}</div>` : ''}
      ${itemsHtml ? `<div class="cluster-items">${itemsHtml}</div>` : ''}
    </div>`;
}

function renderLink(l) {
  const author = l.author || l.author_username || '';
  const url = l.url || (l.resolved || l.tco) || '';
  return `
    <div class="link-row filterable" data-author="${escapeAttr(author).toLowerCase()}">
      ${author
        ? authorTag(author, 'link-author')
        : '<span class="link-author">—</span>'}
      <a class="link-url" href="${escapeAttr(url)}" target="_blank" rel="noopener">${escapeHtml(url)}</a>
      ${l.description ? `<span class="link-desc">${escapeHtml(l.description)}</span>` : ''}
    </div>`;
}

function renderSection(letter, name, items, type) {
  if (!items || !items.length) return '';
  let body;
  if (type === 'events') {
    body = items.map(renderCluster).join('');
  } else if (type === 'links') {
    body = items.map(renderLink).join('');
  } else {
    body = items.map(renderItem).join('');
  }
  const cls = type === 'contrarian' ? 'section section-contrarian' : 'section';
  return `
    <div class="${cls}">
      <div class="section-head" onclick="toggleSection(this)">
        <span class="section-letter">${letter}.</span>
        <span class="section-name">${escapeHtml(name)}</span>
        <span class="section-count">${items.length}</span>
        <span class="section-arrow">▸</span>
      </div>
      <div class="section-body">${body}</div>
    </div>`;
}

function renderSummary(text) {
  if (!text) return '';
  const paragraphs = String(text).split(/\n\n+/).filter(Boolean)
    .map(p => `<p>${renderBold(p)}</p>`).join('');
  return `<div class="summary">${paragraphs}</div>`;
}

function renderStats(d) {
  const s = (d && d.stats) || d || {};
  const parts = [];
  if (s.received    != null) parts.push(`received <strong>${s.received}</strong>`);
  if (s.after_filter!= null) parts.push(`after filter <strong>${s.after_filter}</strong>`);
  if (s.authors     != null) parts.push(`authors <strong>${s.authors}</strong>`);
  if (s.coverage    != null) {
    const pct = (s.coverage <= 1 ? s.coverage * 100 : s.coverage);
    parts.push(`coverage <strong>${pct.toFixed(0)}%</strong>`);
  }
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSection(headEl) {
  headEl.parentElement.classList.toggle('open');
}

function openLightbox(src) {
  const img = document.getElementById('lightbox-img');
  img.src = src;
  document.getElementById('lightbox').classList.add('open');
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-img').src = '';
}

let activeFilter = null;
function filterAuthor(name) {
  if (!name) return;
  activeFilter = String(name).toLowerCase();
  document.querySelectorAll('.filterable').forEach(el => {
    const a = (el.dataset.author || '').toLowerCase();
    if (a === activeFilter) {
      el.classList.add('match');
      el.classList.remove('dim');
    } else {
      el.classList.add('dim');
      el.classList.remove('match');
    }
  });
  document.getElementById('filter-name').textContent = '@' + name;
  document.getElementById('filter-bar').classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function clearFilter() {
  activeFilter = null;
  document.querySelectorAll('.filterable').forEach(el => {
    el.classList.remove('match');
    el.classList.remove('dim');
  });
  document.getElementById('filter-bar').classList.remove('active');
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (document.getElementById('lightbox').classList.contains('open')) {
      closeLightbox();
    } else if (activeFilter) {
      clearFilter();
    }
  }
});

// ---------- schema normalization ----------
// Some producer runs emit the "sections" schema documented in the routine
// spec (report_type/input_stats/sections.A_events.../coverage) instead of
// the flat schema this renderer reads (date/events/insights/contrarian/
// positioning/links/stats). Normalize so either shape renders correctly.
function firstOf(v) {
  return Array.isArray(v) ? v[0] : v;
}

function normalizeItem(it) {
  if (!it || typeof it !== 'object') return it;
  return {
    author: it.author || it.author_username,
    text: it.text != null ? it.text : it.summary,
    category: firstOf(it.category),
    tweet_url: firstOf(it.tweet_url),
    images: it.images,
    created_at: it.created_at,
    is_thread: it.is_thread != null ? it.is_thread : (it.type === 'thread'),
  };
}

function normalizeData(d) {
  if (!d || typeof d !== 'object') return {};
  const hasFlat = d.events || d.insights || d.contrarian || d.positioning || d.links || d.stats;
  if (hasFlat) return d;

  const s = d.sections;
  if (!s) return d;

  const out = Object.assign({}, d);
  out.date = d.date || (d.collected_at ? String(d.collected_at).replace('T', ' ').replace('Z', ' UTC') : '');
  if (s.A_events) {
    out.events = s.A_events.map(cl => ({
      title: cl.cluster || cl.title,
      category: firstOf(cl.category),
      description: cl.description,
      items: (cl.items || []).map(normalizeItem),
    }));
  }
  if (s.B_insights) out.insights = s.B_insights.map(normalizeItem);
  if (s.C_contrarian) out.contrarian = s.C_contrarian.map(normalizeItem);
  if (s.D_positioning) out.positioning = s.D_positioning.map(normalizeItem);
  if (s.E_links) {
    out.links = s.E_links.map(l => ({
      author: l.author,
      url: l.url,
      tweet_url: firstOf(l.tweet_url),
      description: l.note || l.description,
    }));
  }
  const stats = d.stats || {};
  out.stats = {
    received: stats.received != null ? stats.received : (d.input_stats && d.input_stats.total_tweets),
    after_filter: stats.after_filter != null ? stats.after_filter : (d.input_stats && d.input_stats.after_noise_filter),
    authors: stats.authors != null ? stats.authors : (d.coverage && d.coverage.authors_total),
    coverage: stats.coverage != null ? stats.coverage : (d.coverage && d.coverage.coverage_pct),
  };
  return out;
}

// ---------- main ----------
function renderReport(d) {
  d = normalizeData(d);
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  const sections = [
    renderSummary(d.summary),
    renderSection('A', 'Events & Reactions',      d.events,                                'events'),
    renderSection('B', 'Alpha & Insights',        d.insights || d.alpha,                   'items'),
    renderSection('C', 'Contrarian Views',        d.contrarian,                            'contrarian'),
    renderSection('D', 'Positioning & Trade Ideas', d.positioning,                         'items'),
    renderSection('E', 'Link Queue',              d.links,                                 'links'),
  ].join('');
  const app = document.getElementById('app');
  app.innerHTML = sections || '<div class="empty">No report data.</div>';

  // Auto-open first two sections.
  document.querySelectorAll('.section').forEach((s, i) => {
    if (i < 2) s.classList.add('open');
  });

  document.getElementById('stats').innerHTML = renderStats(d);
}

renderReport(REPORT_DATA);
</script>
