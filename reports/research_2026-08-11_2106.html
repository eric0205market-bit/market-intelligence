const CAT_LABELS = {macro:"macro", credit:"credit", positioning:"positioning", aiinfra:"AI/infra", crypto:"crypto", geopolitics:"geopolitics", energy:"energy", tech:"tech", gold:"gold", culture:"culture", labor:"labor", regulation:"regulation", science:"science", venture:"venture"};
const CAT_VARS = {macro:"--macro", credit:"--credit", positioning:"--positioning", aiinfra:"--aiinfra", crypto:"--crypto", geopolitics:"--geopolitics", energy:"--energy", tech:"--tech", gold:"--gold", culture:"--culture", labor:"--labor", regulation:"--regulation", science:"--science", venture:"--venture"};
const URG_LABELS = {actnow:"🔴 Act Now", deep:"🔵 Deep", watch:"🟡 Watch"};

let activeCat = "all";
let activeUrg = "all";
let activeSrc = null;

function catColor(cat){ return getComputedStyle(document.documentElement).getPropertyValue(CAT_VARS[cat]).trim(); }

function buildFilters(){
  const catCounts = {};
  ITEMS.forEach(function(i){ catCounts[i.cat] = (catCounts[i.cat]||0)+1; });
  const catWrap = document.getElementById('catFilters');
  let html = '<button class="pill active" data-cat="all" onclick="setCat(\'all\')">All (' + ITEMS.length + ')</button>';
  Object.keys(CAT_LABELS).forEach(function(cat){
    if(!catCounts[cat]) return;
    html += '<button class="pill" data-cat="' + cat + '" onclick="setCat(\'' + cat + '\')">' + CAT_LABELS[cat] + ' (' + catCounts[cat] + ')</button>';
  });
  catWrap.innerHTML = html;

  const urgCounts = {};
  ITEMS.forEach(function(i){ urgCounts[i.urgency] = (urgCounts[i.urgency]||0)+1; });
  const urgWrap = document.getElementById('urgFilters');
  let uhtml = '<button class="pill active" data-urg="all" onclick="setUrg(\'all\')">All (' + ITEMS.length + ')</button>';
  Object.keys(URG_LABELS).forEach(function(u){
    if(!urgCounts[u]) return;
    uhtml += '<button class="pill" data-urg="' + u + '" onclick="setUrg(\'' + u + '\')">' + URG_LABELS[u] + ' (' + urgCounts[u] + ')</button>';
  });
  urgWrap.innerHTML = uhtml;
}

function applyPillStyles(){
  document.querySelectorAll('#catFilters .pill').forEach(function(btn){
    const cat = btn.getAttribute('data-cat');
    if(cat === activeCat){
      btn.classList.add('active');
      btn.style.background = cat === 'all' ? '#333' : catColor(cat);
      btn.style.borderColor = cat === 'all' ? '#333' : catColor(cat);
    } else {
      btn.classList.remove('active');
      btn.style.background = 'transparent';
      btn.style.borderColor = '#d8d5d0';
      btn.style.color = 'var(--pill-text)';
    }
  });
  document.querySelectorAll('#urgFilters .pill').forEach(function(btn){
    const u = btn.getAttribute('data-urg');
    if(u === activeUrg){
      btn.classList.add('active');
      const c = u === 'all' ? '#333' : (u === 'actnow' ? getComputedStyle(document.documentElement).getPropertyValue('--actnow').trim() : u === 'deep' ? getComputedStyle(document.documentElement).getPropertyValue('--deep').trim() : getComputedStyle(document.documentElement).getPropertyValue('--watch').trim());
      btn.style.background = c;
      btn.style.borderColor = c;
      btn.style.color = '#fff';
    } else {
      btn.classList.remove('active');
      btn.style.background = 'transparent';
      btn.style.borderColor = '#d8d5d0';
      btn.style.color = 'var(--pill-text)';
    }
  });
}

function setCat(cat){ activeCat = cat; activeSrc = null; applyPillStyles(); renderCards(); }
function setUrg(urg){ activeUrg = urg; activeSrc = null; applyPillStyles(); renderCards(); }

function filterBySrc(name){
  activeCat = 'all'; activeUrg = 'all'; activeSrc = name;
  applyPillStyles();
  renderCards();
  const cardsEl = document.getElementById('cards');
  if(cardsEl) cardsEl.scrollIntoView({behavior:'smooth', block:'start'});
}

function urgEmoji(u){ return u === 'actnow' ? '🔴' : u === 'deep' ? '🔵' : '🟡'; }

function renderCards(){
  const wrap = document.getElementById('cards');
  const empty = document.getElementById('cards-empty');
  let filtered = ITEMS.filter(function(i){
    if(activeSrc){ return i.source.indexOf(activeSrc) !== -1; }
    if(activeCat !== 'all' && i.cat !== activeCat) return false;
    if(activeUrg !== 'all' && i.urgency !== activeUrg) return false;
    return true;
  });
  if(filtered.length === 0){ wrap.innerHTML = ''; empty.style.display = 'block'; return; }
  empty.style.display = 'none';

  let html = '';
  filtered.forEach(function(item){
    const cc = catColor(item.cat);
    const chartFlag = item.charts.hot ? '🔥' : (item.charts.count > 0 ? '📊' : '');
    const openClass = activeSrc ? ' open' : '';
    html += '<div class="card' + openClass + '" id="card-' + item.id + '">';
    html += '<div class="card-header" onclick="toggleCard(' + item.id + ')">';
    html += '<span class="idx">#' + item.id + '</span>';
    html += '<span class="urg">' + urgEmoji(item.urgency) + '</span>';
    html += '<span class="badge" style="background:' + cc + '">' + item.source.split(' (')[0] + '</span>';
    html += '<span class="cattag">' + CAT_LABELS[item.cat] + '</span>';
    if(chartFlag) html += '<span class="chartflag">' + chartFlag + '</span>';
    html += '<span class="title">' + item.title + '</span>';
    html += '</div>';
    html += '<div class="card-body">';
    html += '<div class="section-label">The Idea</div>';
    html += '<div class="idea-text">' + item.idea + '</div>';
    html += '<div class="section-label">My Angle</div>';
    html += '<div class="angle-box" style="border-color:' + cc + '; background:' + cc + '14;">' + item.angle + '</div>';
    html += '<div class="tweets">';
    html += '<div class="tweet"><div class="tweet-label a">TWEET A</div><div class="tweet-text">' + item.tweetA + '</div><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button></div>';
    html += '<div class="tweet"><div class="tweet-label b">TWEET B</div><div class="tweet-text">' + item.tweetB + '</div><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div>';
    html += '</div>';
    if(item.charts.desc){
      html += '<div class="chart-box' + (item.charts.hot ? ' hot' : '') + '">' + item.charts.desc + '</div>';
    }
    html += '<div class="link-row"><a href="' + item.link + '" target="_blank">↗ Read full article</a></div>';
    html += '</div></div>';
  });
  wrap.innerHTML = html;
}

function toggleCard(id){
  const card = document.getElementById('card-' + id);
  card.classList.toggle('open');
}

function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}

function toggleReport(){
  document.getElementById('reportCard').classList.toggle('open');
  document.getElementById('reportChevron').textContent = document.getElementById('reportCard').classList.contains('open') ? '▴' : '▾';
}

function buildReport(){
  let html = '<h4>Time Window</h4>';
  html += '<div>' + META.windowStart + ' &rarr; ' + META.windowEnd + ' (last 6 hours, strict boundary). Emails outside this window were not processed.</div>';
  html += '<h4>Totals</h4>';
  html += '<div>' + META.emailsInWindow + ' emails in window · ' + META.emailsRead + ' read in full · ' + META.itemsExtracted + ' items extracted.</div>';
  html += '<h4>Included Sources</h4>';
  META.includedSources.forEach(function(s){
    html += '<div><span class="src-link" onclick="filterBySrc(\'' + s.name.replace(/'/g, "\\'") + '\')">' + s.name + '</span> — ' + s.count + ' item' + (s.count > 1 ? 's' : '') + '</div>';
  });
  html += '<h4>Skipped Sources</h4>';
  META.skippedSources.forEach(function(s){
    html += '<div class="skip-item">' + s.name + ' — ' + s.reason + '</div>';
  });
  document.getElementById('reportBody').innerHTML = html;
}

document.getElementById('metaLine').textContent = META.date + ' · ' + META.time + ' · ' + META.itemsExtracted + ' items from ' + META.emailsRead + ' emails';

buildFilters();
applyPillStyles();
renderCards();
buildReport();
</script>
