butors and raising prices 3-5% a year because customers never notice", "idea": "Diploma consolidates niche industrial/aerospace/medical parts distributors \u2014 products that are mission-critical (a bolt for a 787, a sterile MRI valve) but represent just 0.2% of the customer's total costs \u2014 and has compounded at 18.9% annually for 34 years buying founder-run businesses at 6-8x earnings and leaving them alone.", "angle": "The 0.2%-of-costs detail is the actual moat: pricing power exists exactly where the line item is too small for anyone to fight over \u2014 a repeatable playbook across any fragmented, mission-critical, low-relative-cost category.", "tweetA": "0.2% of total costs. That's Diploma's whole moat \u2014 sell something so mission-critical and so cheap relative to what it protects that nobody ever pushes back on a price increase. 34 years, 18.9% annual returns, buying tiny distributors at 6-8x earnings.", "tweetB": "Everyone hunts for pricing power in branded consumer goods. The better hunting ground is industrial bolts and MRI valves \u2014 anything critical enough to never get substituted and cheap enough to never get negotiated.", "charts": {"count": 0, "hot": false, "desc": "No charts in this section"}, "link": "https://www.compoundingquality.net/p/how-to-identify-great-compounders"}, {"id": 12, "cat": "crypto", "urgency": "deep", "source": "Lucky Trader (Morning Minute)", "title": "The Coinbase BTC Premium Index just logged its longest negative streak ever \u2014 78 days of missing US retail demand", "idea": "Bitcoin has absorbed the Coldcard hack and Saylor's own selling this week and is still roughly flat, but the Coinbase premium (a proxy for US retail buy pressure vs. offshore) has been negative for 78 straight days, the longest streak on record.", "angle": "Flat price despite terrible news plus a record-long retail-demand drought is either a market that's already de-risked, or a sign that whoever's holding the bid isn't retail at all \u2014 worth checking against ETF flow data.", "tweetA": "78 days of negative Coinbase premium \u2014 the longest streak ever \u2014 while BTC shrugs off a $130M hack and its biggest corporate holder selling at a loss. Either retail is done capitulating or retail was never the bid to begin with.", "tweetB": "Bad news stopped moving the price this week. That's usually called 'exhaustion' at the bottom of a cycle or 'someone bigger than retail is absorbing everything' near the top of one. The premium data rules out retail either way.", "charts": {"count": 0, "hot": false, "desc": "No charts \u2014 numeric data digest"}, "link": "https://luckytrader.substack.com/p/saylor-sells-bitcoin-again"}, {"id": 13, "cat": "crypto", "urgency": "watch", "source": "Lucky Trader (Morning Minute)", "title": "BlackRock put tokenized money market funds on Solana and Ethereum in the same week Solana's fee burn is set to 14x", "idea": "BlackRock's new tokenized MMFs record ownership onchain via Securitize while holding only cash and short-term Treasurys \u2014 a stablecoin-reserve vehicle \u2014 landing the same week Solana's fee-burn proposal (raising daily burns from roughly $47K to $646K equivalent) went to an initial vote.", "angle": "BlackRock choosing Solana as a settlement rail for a TradFi product, not just Ethereum, is the tell that Solana's institutional case has moved past 'meme coin casino' in allocators' heads.", "tweetA": "BlackRock didn't just tokenize a money market fund \u2014 it put one on Solana. Six months ago that sentence would have gotten laughed out of an IC meeting.", "tweetB": "Solana's fee burn is about to 14x (from ~$47K/day to ~$646K/day) the same week BlackRock shows up as a settlement venue. Supply mechanics and institutional adoption moving the same direction rarely stays quiet for long. $SOL", "charts": {"count": 0, "hot": false, "desc": "No charts"}, "link": "https://luckytrader.substack.com/p/saylor-sells-bitcoin-again"}, {"id": 14, "cat": "macro", "urgency": "deep", "source": "David Rosenberg", "title": "WSJ: $7 trillion in AI data center capex over 4 years is enough to damage the economy on its own", "idea": "The Journal's framing, quoted approvingly by Rosenberg, is that the AI buildout doesn't need to be a bubble that pops to hurt the economy \u2014 capital misallocation on that scale, increasingly debt-financed, can drag growth even if productivity gains eventually show up, and the debt-financing angle means a disappointment hits the financial system too.", "angle": "This reframes the AI-bubble debate away from 'will it pay off' toward 'can the economy absorb the spending regardless of the answer' \u2014 a much harder question to dismiss with an ROIC argument alone.", "tweetA": "$7 trillion in data center capex over 4 years. Even if AI eventually pays for itself, that's enough capital misallocation to dent GDP on the way there. The bubble/no-bubble debate is a distraction from the pace-of-spending problem.", "tweetB": "The AI capex debate keeps asking 'will the returns show up.' The better question: does the debt financing behind that $7T care whether the returns show up on time? Financial systems don't get a grace period for productivity to catch up.", "charts": {"count": 0, "hot": false, "desc": "No charts \u2014 short teaser, full piece behind subscription"}, "link": "https://www.earlymorningwithdave.com/p/tech-stocks-rally-further-on-palantirs"}, {"id": 15, "cat": "crypto", "urgency": "watch", "source": "Danny Dayan (Crypto Signals)", "title": "A quant signal service just admitted BTC is in 'no man's land' \u2014 no new trades in weeks", "idea": "No new signals have fired in the model for a couple of weeks as Bitcoin consolidates in a range the author explicitly calls untradeable territory for his system.", "angle": "A systematic model going silent for weeks is itself a data point \u2014 realized-vol and momentum inputs have compressed enough that no rules-based signal is firing, consistent with the Lucky Trader item above on BTC's flat price action despite bad news.", "tweetA": "A quant model going silent for two weeks isn't 'no news' \u2014 it's the model telling you volatility and momentum have both compressed below its trigger threshold. Combine that with the Coinbase premium data and BTC's chart is genuinely asleep right now.", "tweetB": "No man's land is a fine place for a trend-follower to sit out. It's a terrible place for anyone underwriting a directional thesis on either side.", "charts": {"count": 0, "hot": false, "desc": "No charts"}, "link": "https://dannydayan.substack.com/p/crypto-signals-3a9"}, {"id": 16, "cat": "macro", "urgency": "deep", "source": "Capital Wars", "title": "Global liquidity momentum is slowing even as levels hold \u2014 and the rotation is out of Asia tech into Europe", "idea": "Weaker central bank liquidity was offset by low vol, stable collateral values and a softer dollar, keeping investors risk-on overall, but positioning is explicitly rotating away from Asia tech and Japan toward Europe.", "angle": "A liquidity-momentum slowdown combined with an Asia-to-Europe rotation is worth cross-referencing against this morning's Bespoke note on STOXX 600 strength \u2014 two independent sources pointing the same direction.", "tweetA": "Liquidity momentum is rolling over globally, but nobody's de-risking \u2014 they're just moving the risk from Asia tech to Europe. That's not risk-off, that's a rotation trade hiding inside a flat headline number.", "tweetB": "Soft dollar + stable collateral + slowing CB liquidity = risk-on can persist even as the fuel runs low. Watch what breaks first once the dollar stops cooperating.", "charts": {"count": 0, "hot": false, "desc": "No charts \u2014 short teaser, full piece gated"}, "link": "https://capitalwars.substack.com/p/global-liquidity-watch-weekly-update-f2b"}, {"id": 17, "cat": "macro", "urgency": "act", "source": "Peter Boockvar", "title": "Boockvar: the yen rescue is fleeting unless the BoJ actually hikes in September \u2014 JGB 2yr just hit a 31-year high", "idea": "September BoJ hike odds jumped to roughly 50% from 27% right before last week's intervention, the JGB 2yr yield is at a fresh 31-year high and the 10yr is 2bps from a 29-year high \u2014 and Japan used the Fed's FIMA repo facility to fund the intervention, money that has to be paid back from somewhere.", "angle": "The FIMA repo detail is the underrated risk: an intervention funded by a facility that requires repayment creates a second, delayed source of selling pressure down the road, separate from whatever the BoJ decides in September.", "tweetA": "Japan intervened using the Fed's own repo facility. That money doesn't just appear \u2014 it has to be paid back. Everyone's watching the yen level; the real risk is what gets sold later to fund the payback.", "tweetB": "BoJ hike odds for September: 27% a week ago, ~50% now. JGB 2yr at a 31-year high. The bond market is doing what the intervention couldn't \u2014 pricing the actual policy response before the meeting even happens.", "charts": {"count": 1, "hot": true, "desc": "\ud83d\udd25 2yr JGB yield chart \u2014 31-year high, embedded in the note"}, "link": "https://peterboockvar.substack.com/p/there-must-be-follow-thru-for-this"}, {"id": 18, "cat": "macro", "urgency": "deep", "source": "Peter Boockvar", "title": "Boockvar's earnings scorecard: Boise Cascade says housing is 'subdued,' Whirlpool blames tariffs for margin pressure", "idea": "Boise Cascade flags affordability constraints and weak consumer sentiment pressuring new-construction demand despite homebuilder incentives, while Whirlpool's North America EBIT margin fell y/y on the 'unfavorable impact of tariff, raw material inflation and fuel costs' even as pricing actions drove an 8% sequential sales gain.", "angle": "Two unrelated industrials both naming tariffs and rates as the same drag in the same earnings season is a cleaner read on 'uneven economy' than any single data print \u2014 worth tracking against Friday's payrolls for confirmation.", "tweetA": "Boise Cascade: housing demand needs homebuilder incentives just to move. Whirlpool: tariffs are eating the margin gains from price hikes. Two unrelated companies, same earnings season, same two culprits \u2014 rates and tariffs. That's not noise, that's a macro read.", "tweetB": "Whirlpool raised prices 8% sequentially and still lost margin to tariffs and input costs. Pricing power isn't enough when the cost side inflates faster than you can pass it through.", "charts": {"count": 0, "hot": false, "desc": "No additional charts in this section"}, "link": "https://peterboockvar.substack.com/p/there-must-be-follow-thru-for-this"}, {"id": 19, "cat": "AI/infra", "urgency": "deep", "source": "Visser Labs", "title": "Factor volatility hit an all-time high in July. Bitcoin's volatility hit a cycle low. Same month.", "idea": "AI momentum-factor volatility exploded past levels seen in the dot-com bubble and GFC while Bitcoin's 365-day realized vol ended July at 37% (near multi-year lows) despite absorbing a double-digit drawdown that would historically have pushed vol past 60-80%. The thesis: AI is compressing 'moat duration' (the author's 'Intelligence Competition Paradox') faster than DCFs can reprice it, while Bitcoin has no moat to defend and is therefore immune to the same repricing.", "angle": "This is the sharpest 'why is Bitcoin quiet while AI stocks are violent' framework circulating right now \u2014 the trade implication is own physical bottlenecks plus distribution/trust layers plus scarcity assets, and underweight anything whose valuation depends on a moat AI can erode in a quarter.", "tweetA": "Bitcoin's realized vol: 37%, near a multi-year low, after absorbing a double-digit drawdown. AI-stock factor vol: above dot-com and GFC levels. The asset with zero cash flows is now the calm one in the room. Sit with that for a second.", "tweetB": "Every AI moat that took a decade to build can now get pressured in a quarter \u2014 Kimi K3 proved frontier capability spreads in days, not years. The market isn't repricing AI winners because they're losing. It's repricing them because 'winning' stopped meaning anything durable.", "charts": {"count": 2, "hot": true, "desc": "\ud83d\udd25 CHART WORTH SAVING \u2014 factor volatility vs Bitcoin realized volatility crossover chart, the whole essay in one image"}, "link": "https://visserlabs.substack.com/p/the-age-of-abundant-intelligence"}, {"id": 20, "cat": "positioning", "urgency": "deep", "source": "Dark Side of the Boom", "title": "Six AI/semiconductor ETFs now account for 19% of all US ETF trading volume", "idea": "Leveraged and inverse ETF exposure has fallen since June but trading activity and speculative inflows remain elevated, and daily rebalancing means these products can lose value even if the underlying index round-trips back to where it started \u2014 mechanical flows are now dictating market speed and route, not just direction.", "angle": "This explains a lot of the intraday whipsaw in AI names that doesn't map cleanly to news flow \u2014 check options/ETF rebalancing windows into the close before assuming a move is fundamentally driven.", "tweetA": "6 ETFs = 19% of all US ETF volume, all AI/semis. When a sector's daily flow is dominated by mechanical rebalancing, the 'why did it move' question stops being about earnings and starts being about 3:45pm rebalance flow.", "tweetB": "Leveraged ETFs can lose money even if the index they track ends up exactly where it started. Daily rebalancing decay isn't a disclaimer footnote anymore \u2014 it's 19% of market volume.", "charts": {"count": 3, "hot": false, "desc": "Charts inside \u2014 Goldman Sachs ETF volume/leveraged-fund charts via The Market Ear, worth opening"}, "link": "https://thedarksideoftheboom.substack.com/p/everyone-owns-etfs-almost-nobody"}, {"id": 21, "cat": "geopolitics", "urgency": "deep", "source": "Doomberg", "title": "Greece just used a shipping tycoon to kill an EU sanctions package \u2014 and Brussels' fix is to end the veto that let it happen", "idea": "Greece held up the EU's latest Russia sanctions package to protect a domestic shipping tycoon, and the European Commission's response is to start passing sanctions in small thematic batches specifically to reduce members' ability to invoke vetoes \u2014 the same veto power that was sold as the 'ultimate backstop' justifying EU membership in the first place.", "angle": "This connects directly to a winter gas crunch call \u2014 if unanimity is being engineered away right when member-state energy interests diverge most, that's the moment national capitals either accept a weaker veto or start actively resisting Brussels.", "tweetA": "The EU was sold on an inviolable member veto. Twenty-plus sanctions packages later, Brussels' fix for a veto used to protect a shipping tycoon is... removing the veto. The bait-and-switch just got explicit.", "tweetB": "Watch what happens to unanimity requirements right as winter gas math gets ugly. An EU that engineers away vetoes when energy interests diverge is an EU testing how much sovereignty it can quietly delete before someone actually leaves.", "charts": {"count": 0, "hot": false, "desc": "No charts"}, "link": "https://newsletter.doomberg.com/p/passing-gas"}, {"id": 22, "cat": "AI/infra", "urgency": "watch", "source": "Salazar Slytherin (AI News)", "title": "Alibaba's Qwen3.8-Max: a 2.4 trillion parameter model that can code autonomously for 10+ days", "idea": "Open weights are coming, with a smaller Qwen3.8-27B version dropping next week \u2014 a Chinese lab shipping a 2.4T-parameter frontier model with open weights is a direct data point on how fast the US-China model gap is (or isn't) closing.", "angle": "10+ days of autonomous coding endurance is a different capability axis than benchmark scores \u2014 an agents/reliability claim, not a raw-intelligence claim \u2014 worth tracking against Anthropic/OpenAI's own long-horizon-agent roadmaps.", "tweetA": "2.4 trillion parameters, open weights, 10+ days of autonomous coding. Alibaba just shipped a capability the frontier labs talk about as a 2027 milestone \u2014 and they're giving the weights away.", "tweetB": "The AI race metric everyone tracks is benchmark scores. The one that actually matters for enterprise adoption is 'how long can it run unsupervised before it breaks.' Qwen just claimed 10+ days. That's the number to interrogate, not the parameter count.", "charts": {"count": 0, "hot": false, "desc": "No charts \u2014 headline digest"}, "link": "https://www.cryptointegrat.com/p/ai-news-august-4-2026"}, {"id": 23, "cat": "crypto", "urgency": "watch", "source": "Salazar Slytherin (Crypto News)", "title": "BitGo's CEO dared Anthropic's Claude to hack a wallet holding 100 BTC \u2014 to push back on AI hacking-risk claims", "idea": "The challenge is a live, public test of frontier-model offensive-security capability against a real multi-million-dollar bounty, set up specifically to counter growing claims that AI models are becoming dangerous at wallet-draining and exploit development.", "angle": "Whichever way this resolves becomes a citable data point in the AI-safety-for-crypto debate \u2014 a clean pass for Claude undercuts one of the more concrete 'AI is already dangerous' claims currently circulating in security circles.", "tweetA": "A public ~$6M bounty to see if Claude can crack a Bitcoin wallet isn't a stunt, it's the closest thing to a controlled experiment we'll get on 'can frontier AI already drain a wallet today.' Whoever's citing AI hacking risk in vague terms should have to point to this result.", "tweetB": "Notice the frame: BitGo isn't asking 'can AI ever hack a wallet,' it's asking 'can it hack one right now, with no head start.' That's a much narrower and more falsifiable claim than the doom threads assume.", "charts": {"count": 0, "hot": false, "desc": "No charts \u2014 headline digest"}, "link": "https://www.cryptointegrat.com/p/crypto-news-august-4-2026"}, {"id": 24, "cat": "crypto", "urgency": "watch", "source": "Salazar Slytherin (Crypto News)", "title": "Aztec Foundation just laid off 55% of its workforce and split into two entities", "idea": "The privacy/ZK-rollup project cut 18 employees and restructured into Aztec Labs plus a separate foundation \u2014 a concrete data point on funding conditions for zero-knowledge infrastructure projects that raised heavily during the 2021-22 privacy-tech wave.", "angle": "A 55% cut at a well-funded ZK project is a harder signal on privacy-infra funding conditions than any VC survey \u2014 worth checking whether other ZK-rollup teams show similar strain.", "tweetA": "55% layoffs at a ZK-privacy project that was one of the best-funded names in the category two years ago. The zero-knowledge infrastructure bet hasn't died, but the runway math clearly stopped working.", "tweetB": "Everyone's tracking AI layoffs as a bubble signal. Nobody's tracking that crypto infrastructure \u2014 specifically the privacy/ZK corner \u2014 just quietly cut more than half its headcount in the same news cycle.", "charts": {"count": 0, "hot": false, "desc": "No charts \u2014 headline digest"}, "link": "https://www.cryptointegrat.com/p/crypto-news-august-4-2026"}, {"id": 25, "cat": "energy", "urgency": "act", "source": "Dark Side of the Boom / Goldman Sachs", "title": "Goldman: Brent's fair value is ~$80, meaning the market barely has any Middle East risk premium priced in", "idea": "Goldman's fair-value model (OECD inventories, demand estimates, long-term Brent anchor) puts Brent at roughly $80 even as physical flows out of the Persian Gulf and Red Sea are deteriorating sharply and global visible inventories have drawn heavily over the past two weeks.", "angle": "This directly contradicts this morning's 'oil down 4% on Hormuz deal talk' headline \u2014 the physical market is tightening while futures price calm, exactly the setup where a single failed diplomacy headline causes a violent repricing, not a gradual one.", "tweetA": "Futures say the Hormuz risk is basically priced out. Physical flows out of the Persian Gulf say the opposite \u2014 inventories drawing hard for two straight weeks. When paper and physical disagree this much, physical usually wins, and it wins fast.", "tweetB": "Goldman's own fair value for Brent is $80. Spot is trading well below that on 'deal' headlines. If the deal doesn't materialize, this isn't a slow grind back up \u2014 it's a gap, because nobody's holding the risk premium that should be there right now. $USO", "charts": {"count": 1, "hot": false, "desc": "Brent fair-value vs spot chart referenced"}, "link": "https://thedarksideoftheboom.substack.com/p/goldmans-oil-outlook-moderate-risk"}, {"id": 26, "cat": "culture", "urgency": "deep", "source": "Hardfork", "title": "Maxwell Meyer's Frontier-vs-Core framework: DOGE failed for lack of falsifiability, not lack of intent", "idea": "Meyer's thesis is that healthy civilizations balance a 'frontier' (falsifiable, competitive, experimental) against a 'core' (bureaucratic, stabilizing) \u2014 he argues Washington DC's wealth concentration signals America has drifted too far toward an unfalsifiable core, where government programs have no natural churn because they're never forced to compete for survival.", "angle": "A useful lens for reading Gebbia/DOGE-style government-efficiency pushes: they only work when the underlying claim is falsifiable (a website either works or doesn't), and fail wherever the objection is political rather than empirical.", "tweetA": "DC suburbs are now the wealthiest place on earth. Meyer's point: that's not a corruption story, it's a falsifiability story \u2014 bureaucracies grow forever when nothing forces them to prove they still work. Silicon Valley grows because the market does that pruning automatically.", "tweetB": "The DOGE critics weren't wrong that cuts would get attacked. They were wrong about why: it wasn't the partisanship, it was that most government spending has no falsifiable test of whether it's working. You can't A/B test your way out of that fight.", "charts": {"count": 0, "hot": false, "desc": "No charts \u2014 podcast transcript excerpt"}, "link": "https://hardfork.substack.com/p/the-frontier-versus-the-core-a-discussion"}, {"id": 27, "cat": "science", "urgency": "act", "source": "Noahpinion", "title": "OpenAI's Astra just solved 10 outstanding problems in math and theoretical CS \u2014 and a leading skeptic conceded the bet", "idea": "University of Toronto's Daniel Litt, previously one of the most prominent skeptics of AI's math-research potential, now writes he no longer believes there's any important type of math AI won't soon be able to do \u2014 'a matter of not too much time' \u2014 while some mathematicians are reacting with what one calls a 'profound spiritual crisis.'", "angle": "The emotional reaction is itself a leading indicator worth watching across other credentialed-expertise professions as capability crosses the same threshold \u2014 math is just first because proofs are the most legible thing to verify.", "tweetA": "A frontier-math skeptic just conceded his own bet: AI will do essentially all of pure math, 'a matter of not too much time.' A skeptic conceding under evidence is a stronger signal than any benchmark headline this year.", "tweetB": "The mathematician despair here isn't really about job loss \u2014 most working mathematicians aren't paid much regardless. It's about status and meaning. Every credentialed profession hits this exact emotional cliff eventually; math just got there first because proofs are the easiest thing to verify.", "charts": {"count": 0, "hot": false, "desc": "No charts \u2014 essay/commentary piece"}, "link": "https://www.noahpinion.blog/p/the-end-of-the-age-of-heroes"}];

function cardHtml(item) {
  var color = catColor(item.cat);
  var chartFlag = '';
  if (item.charts && item.charts.hot) chartFlag = '<span class="chart-flag">🔥</span>';
  else if (item.charts && item.charts.count > 0) chartFlag = '<span class="chart-flag">📊</span>';

  var chartLabel = (item.charts && item.charts.hot) ? '🔥 CHART WORTH SAVING — ' : (item.charts && item.charts.count > 0 ? '📊 ' + item.charts.count + ' chart(s) — ' : '📊 ');

  var h = '';

  h += '    <span class="chevron">▸</span>';
  h += '  </div>';
  h += '  <div class="card-body">';
  h += '    <div class="section-label">The Idea</div>';
  h += '    <div class="idea-text">' + item.idea + '</div>';
  h += '    <div class="section-label">My Angle</div>';
  h += '    <div class="angle-box" style="border-left:3px solid ' + color + '; background:' + color + '14;">' + item.angle + '</div>';
  h += '    <div class="tweets-row">';
  h += '      <div class="tweet-box">';
  h += '        <div class="tweet-label" style="color:#378add;">TWEET A</div>';
  h += '        <div class="tweet-text">' + item.tweetA + '</div>';
  h += '        <button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button>';
  h += '      </div>';
  h += '      <div class="tweet-box">';
  h += '        <div class="tweet-label" style="color:#7f77dd;">TWEET B</div>';
  h += '        <div class="tweet-text">' + item.tweetB + '</div>';
  h += '        <button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button>';
  h += '      </div>';
  h += '    </div>';
  h += '    <div class="' + chartNoteClass + '">' + chartLabel + (item.charts ? item.charts.desc : '') + '</div>';
  h += '    <a class="read-link" href="' + item.link + '" target="_blank">↗ Read full article</a>';
  h += '  </div>';
  h += '</div>';
  return h;
}

function render() {
  buildFilterBars();
  var filtered = ITEMS.filter(function(i) {
    if (activeSrc && i.source.indexOf(activeSrc) === -1) return false;
    if (activeCat !== 'all' && i.cat !== activeCat) return false;
    if (activeUrg !== 'all' && i.urgency !== activeUrg) return false;
    return true;
  });
  var cardsEl = document.getElementById('cards');
  if (filtered.length === 0) {
    cardsEl.innerHTML = '<div class="empty-state">No items match this filter.</div>';
  } else {
    cardsEl.innerHTML = filtered.map(cardHtml).join('');
    if (activeSrc) {
      filtered.forEach(function(i) {
        var el = document.getElementById('card-' + i.id);
        if (el) el.classList.add('open');
      });
    }
  }
}

function buildReport() {
  var srcHtml = META.includedSources.map(function(s) {
    return '<button class="src-link" onclick="filterBySrc(\'' + s.name.replace(/'/g, "\\'") + '\')">' + s.name + '</button> (' + s.items + ')';
  }).join(', ');
  var skippedHtml = META.skippedSources.length ? META.skippedSources.map(function(s) {
    return '<div class="rline">— <strong>' + s.name + '</strong>: ' + s.reason + '</div>';
  }).join('') : '<div class="rline">None — all emails in the window had extractable content.</div>';

  var body = '';
  body += '<div class="rline"><strong>Time window:</strong> ' + META.windowStart + ' → ' + META.windowEnd + '</div>';
  body += '<div class="rline"><strong>Emails in window:</strong> ' + META.emailsInWindow + ' &nbsp;|&nbsp; <strong>Emails read:</strong> ' + META.emailsRead + ' &nbsp;|&nbsp; <strong>Items extracted:</strong> ' + META.itemsExtracted + '</div>';
  body += '<div class="section-label" style="margin-top:14px;">Included Sources (click to filter)</div>';
  body += '<div class="src-list">' + srcHtml + '</div>';
  body += '<div class="section-label" style="margin-top:14px;">Skipped</div>';
  body += skippedHtml;
  document.getElementById('reportBody').innerHTML = body;
}

document.getElementById('reportToggle').addEventListener('click', function() {
  document.getElementById('reportCard').classList.toggle('open');
});

document.getElementById('headerSub').textContent = META.date + ' · ' + META.time + ' · ' + META.itemsExtracted + ' items from ' + META.includedSources.length + ' sources';

buildReport();
render();
</script>
