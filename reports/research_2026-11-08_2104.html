<script>
const ITEMS = [{"id": 1, "cat": "macro", "urgency": "deep", "source": "Danny Dayan / Macro Musings", "title": "Correl-1 moment: SPX finally 'caught down' to tech, VIX indicator fired Friday", "idea": "Dayan warned for weeks that vol was clustering. Two weeks ago he flagged the alternative to a tech rebound: the rest of the market catching down, with SPX CTA trigger levels the only ones not yet hit. SPX did exactly that with an explosive move Thursday; his VIX indicator triggered Friday morning. He thinks we are in the later innings but 'remains to be seen'.", "angle": "Sequence matters: tech broke, then SPX CTA levels, then vol signal. If the SPX trigger is the last domino, mechanical sellers are largely spent into Monday.", "tweetA": "Tech cracked first, then SPX hit the CTA levels, and only then did the VIX signal fire. The vol indicator confirmed the move after it happened. If the SPX trigger was the last forced seller, Monday is about who's left to sell, not who's forced to.", "tweetB": "Correlation going to 1 isn't a stock-picking event, it's the diversification trade being unwound all at once. -5.5% Nasdaq and -4.4% SPX in one session says the book was one trade. $SPY $QQQ", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening (links to 'Most Important Chart in World')"}, "link": "https://dannydayan.substack.com/p/independence-day-afb"}, {"id": 2, "cat": "macro", "urgency": "deep", "source": "Danny Dayan / Macro Musings", "title": "Midterms + 165k NFP: the Fed 'regained its independence'", "idea": "Dayan argues the midterm result stops Trump appointing anyone else to the Fed board, and the strong NFP gives the Fed a clean runway to focus on inflation. The open question: do they take it or waffle on a minor equity correction? Week ahead: NY Fed inflation expectations Mon, NFIB + CPI Tue, existing home sales Thu, PPI Fri.", "angle": "Political cover to cut vanished the same week as economic cover to hold. CPI Tuesday is the swing print for the AI selloff narrative.", "tweetA": "The Fed lost its reason to cut and gained its cover to hike in the same week. Tuesday's CPI now matters more than the entire earnings calendar. A hot print into a Nasdaq correction is the setup nobody has a hedge for.", "tweetB": "A 10% Nasdaq correction was supposed to be the Fed's excuse to blink. Instead the board can't be restocked and payrolls beat by 100k. What does the put look like when the strike is set by inflation, not by equities? $TLT $QQQ", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://dannydayan.substack.com/p/independence-day-afb"}, {"id": 3, "cat": "positioning", "urgency": "deep", "source": "Compounding Quality", "title": "Quality +10.6% in October while Nasdaq -6.9%: the anti-AI trade works", "idea": "Akre Focus ETF returned +10.6% in October vs S&P 500 -1.1% and Nasdaq -6.9%. Author's portfolio: Fairfax +24.7%, S&P Global +23.0%, Visa +17.7%. His rule of thumb: when the market is euphoric on AI his stocks go down, when it is cautious they go up. Also notes value beat growth by 10% in October.", "angle": "A 17-point spread between quality compounders and Nasdaq in one month is a factor rotation, not stock picking. Question is whether it's a hedge or the new leadership.", "tweetA": "Akre +10.6%. Nasdaq -6.9%. Same month. That's a 17-point gap between owning cash-flow compounders and owning the AI complex. Quality is currently just the short-AI trade with a dividend.", "tweetB": "Visa +17.7% and S&P Global +23% while semis lose 38% from the June peak. The market isn't rotating out of equities, it's rotating out of capex. Different trade, different exit. $V $SPGI $FFH", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://www.compoundingquality.net/p/we-buy-3-more-stocks"}, {"id": 4, "cat": "crypto", "urgency": "deep", "source": "Unchained", "title": "North Korea took $6.3B from Binance in 20 minutes via an EIP-7702 upgrade", "idea": "Binance lost about $6.3B from hot wallets on Oct 29, most in a 20-minute burst, which the FBI attributed to North Korea; one vector was a compromised developer laptop. EIP-7702 let attackers sweep hot wallets. About 43% of the funds were frozen versus under 3% after Bybit. Binance says it covered roughly 95% of the loss, and the shock helped push BTC to its worst October since 2014.", "angle": "Largest hack ever, 43% freeze rate, and BTC still only had its worst October since 2014. Tail risk is being absorbed by a custodian balance sheet, not the protocol.", "tweetA": "$6.3B in 20 minutes and Binance covered 95% of it. That's not crypto security, that's an exchange balance sheet acting as the clearinghouse. TradFi built circuit breakers after 1987. Crypto has a laptop.", "tweetB": "Freeze rate went from under 3% after Bybit to 43% here. Law enforcement and stablecoin issuers got fast. North Korea has now funded itself with the two largest hacks in history. Who's the counterparty on that sanctions trade? $BNB $BTC", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://unchainedcrypto.com/how-north-korea-stole-6-3-billion-from-binance-in-20-minutes/"}, {"id": 5, "cat": "crypto", "urgency": "deep", "source": "Unchained", "title": "Tether and Circle froze stablecoins mid-hack; the Aave route and the one-block borrow question", "idea": "Within minutes of the Binance theft, Tether and Circle froze stablecoins as attackers raced to swap into ETH and routed part of the haul through Aave. LlamaRisk's CEO says nothing was stolen from Aave. The open question from Kain Warwick and Taylor Monahan: should anyone be able to deposit $1B and borrow all the ETH in a single block, and once a protocol can stop a theft, can it choose not to?", "angle": "Stablecoin issuers are now de facto emergency brakes. 'Permissionless' and 'freezable' coexist, and the market is learning to price the second.", "tweetA": "Tether and Circle froze funds within minutes. Aave routed part of the haul and lost nothing. Crypto's first real circuit breaker turned out to be two centralized issuers. Decentralization was never the load-bearing wall.", "tweetB": "Deposit $1B, borrow all the ETH, one block. If a lending protocol can see that and stop it but doesn't, it's making a decision. Regulators will notice that decision. $AAVE $ETH", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://unchainedcrypto.com/uneasy-money-what-the-6b-binance-hack-revealed-about-who-can-freeze-stolen-funds/"}, {"id": 6, "cat": "regulation", "urgency": "deep", "source": "Unchained", "title": "Democratic sweep: Clarity Act looks dead; Warren to Senate Banking", "idea": "Democrats won both chambers, and by Justin Slaughter's count the popular vote by 13 points. Slaughter (Paradigm) and Mike Katz (Manatt) argue the Clarity Act looks dead, discuss what a House Financial Services market structure bill may contain, and whether SEC/CFTC rules survive. Elizabeth Warren at Senate Banking could steer oversight of the Trump family's crypto deals. Fairshake spent $56M against Sherrod Brown, who won anyway.", "angle": "Crypto's political spend bought nothing in Ohio. A $56M miss reframes the 2028 strategy question and raises odds of rule-by-agency being reversed.", "tweetA": "Fairshake spent $56M against Sherrod Brown. Brown won. The crypto lobby's best-funded campaign just failed publicly, and the Senate Banking chair is now Warren. That's the actual market structure bill.", "tweetB": "Everyone is asking whether the Clarity Act survives. Wrong question. The better one: do SEC and CFTC rules survive a Congress whose next two years are about World Liberty Financial? $COIN $HOOD", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://unchainedcrypto.beehiiv.com/p/is-the-clarity-act-dead-after-the-democratic-sweep"}, {"id": 7, "cat": "crypto", "urgency": "deep", "source": "Unchained", "title": "Midterm 'blue mega tsunami': Polymarket at 99% by 7pm, polls underweighted Democrats again", "idea": "Robert Leshner argues polls underweighted Democrats again and markets underpriced the wave because they tracked the polls; Polymarket had 99% on total control of Congress by 7 PM. Haseeb Qureshi cites Stand With Crypto numbers: the new Congress is roughly 2:1 pro-crypto in both House and Senate. Leshner still expects a pragmatic Congress and close to zero chance of crypto legislation as the next two years center on Trump corruption.", "angle": "A prediction market that only hits 99% at 7 PM is a lagging indicator dressed as a forecast. Relevant given DraftKings just burned $650M+ on predictions.", "tweetA": "Polymarket hit 99% on Congress at 7 PM, after the polls closed. Prediction markets didn't price the wave, they tracked the polls and then the count. That's a scoreboard, not an edge.", "tweetB": "New Congress is 2:1 pro-crypto and the chance of crypto legislation is near zero. Both are true. Bullish headcount, bearish calendar: two years of oversight hearings instead of floor votes. $BTC", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://unchainedcrypto.com/the-chopping-block-the-midterm-mega-tsunami-a16z-goes-frontier-the-cftc-clears-equity-perps-and-the-fight-over-abliterated-ai-models/"}, {"id": 8, "cat": "regulation", "urgency": "watch", "source": "Unchained", "title": "CFTC clears equity perps; a16z 'goes frontier'; fight over abliterated AI models", "idea": "Same Chopping Block episode lists topics: the CFTC clearing equity perpetuals, a16z going frontier-tech, and the debate over 'abliterated' AI models (refusal-removed open weights). Only headline-level detail in this email.", "angle": "Equity perps cleared by a US regulator is a plumbing event: 24/7 leveraged equity exposure on crypto rails. Worth opening the episode for detail.", "tweetA": "CFTC cleared equity perps. The same week Nasdaq had its worst session since April 2025. A 24/7 leveraged venue for the thing that just fell 5.5% in a day will get its first real stress test fast. $COIN $HOOD", "tweetB": "Abliterated models: open weights with refusals surgically removed. Every safety debate so far assumed the lab controls the weights. That assumption is gone and the policy conversation hasn't caught up.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://unchainedcrypto.com/the-chopping-block-the-midterm-mega-tsunami-a16z-goes-frontier-the-cftc-clears-equity-perps-and-the-fight-over-abliterated-ai-models/"}, {"id": 9, "cat": "energy", "urgency": "watch", "source": "Unchained", "title": "Texas voted to pause new data centers; which AI-pivot BTC miners are exposed", "idea": "Unchained flags that Texas voted to pause new data centers, with analysis of which AI-pivoting Bitcoin miners are already past the freeze line. Detail is behind the link; the email gives the headline only.", "angle": "If Texas pauses new data centers, miners already energized hold scarce, grandfathered power. The state is the epicenter of both AI and BTC mining load.", "tweetA": "Texas pausing new data centers turns every energized megawatt into a grandfathered asset. Miners that pivoted to AI early just got a moat from a legislature. $IREN $CIFR $WULF", "tweetB": "Democrats win Congress, AI data center scrutiny rises, and now the biggest power market in the US votes to pause build-outs. Capex needs electrons. The political side of the power constraint just got a vote.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://unchainedcrypto.com/texas-voted-to-pause-new-data-centers-which-bitcoin-miners-are-already-past-the-freeze/"}, {"id": 10, "cat": "crypto", "urgency": "watch", "source": "Unchained", "title": "Coinbase Wallet Solana trading up 12x with no incentives; BTC L2 yield drying up", "idea": "Two Unchained Premium headlines: Coinbase Wallet's Solana trading jumped 12x without incentives, and Bitcoin yield on L2s is drying up according to two primes. Details are paywalled.", "angle": "Organic 12x in wallet-native Solana trading while BTC yield dries up: attention and flow are rotating to on-chain trading, away from BTC financialization.", "tweetA": "12x Solana trading volume in Coinbase Wallet with zero incentives. Airdrop farming volume is fake volume; this isn't. Retail is trading on-chain from the same app they buy BTC in. $COIN $SOL", "tweetB": "BTC L2 yield is drying up while Solana wallet trading goes 12x. The BTC-as-collateral-yield narrative lost the same month the Binance hack showed what centralized custody costs.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://unchainedcrypto.com/heres-why-bitcoin-yield-on-l2s-are-drying-up-according-to-two-prime/"}, {"id": 11, "cat": "regulation", "urgency": "deep", "source": "Robert Marsh / Big Moves", "title": "DraftKings: Predictions spend to $650-700M, EBITDA guide cut to $175-275M from $700-900M", "idea": "DKNG -21.3%. Q3 revenue $1.329B vs ~$1.4B consensus; adj. EBITDA loss $317M vs $126M. Predictions investment raised from $200-300M to $650-700M; 1.6M customers engaged, ~$350M annualized gross profit, October annualized volume $10.1B (nearly 3x July), ~20 month payback. UBS questioned ~$1B cumulative Predictions losses over 2026-27. Robins sketched an adverse sports-contract ruling around mid-2028; the Supreme Court has not agreed to hear the cases.", "angle": "A listed incumbent is spending its entire profit pool to build a regulated prediction market on a legal bet. Read-across to HOOD, COIN, and Kalshi/Polymarket valuations.", "tweetA": "DraftKings is burning $650M+ of EBITDA on prediction markets because 'the cohort pays back in 20 months'. That assumes the Supreme Court never hears the sports-contract case. That isn't a business plan, that's a bet on a docket. $DKNG $HOOD", "tweetB": "October prediction volume $10.1B annualized, nearly 3x July. Promotions absorb most of the gross revenue, so net revenue is immaterial. Volume is being bought. The question is what it looks like when the coupons stop.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://bigmoves.substack.com/p/big-moves-november-6-2026"}, {"id": 12, "cat": "tech", "urgency": "deep", "source": "Robert Marsh / Big Moves", "title": "NerdWallet -31%: marketing 72% of revenue, $35M extra spend for $25M extra revenue", "idea": "NRDS -30.97%. Revenue +11% to $239.6M but net income -43%. Sales & marketing +28% to $173.2M (72% of revenue vs 63%). Performance marketing rose ~$35M YoY against ~$25M incremental revenue. Auto insurance revenue fell $17.4M on a narrow carrier network. Q4 revenue guide implies -13% YoY. Morgan Stanley's analyst pressed on AI developers launching personal finance functions.", "angle": "Paying $35M to buy $25M of revenue is the clearest datapoint yet that search-referred affiliate economics are decaying under AI answers.", "tweetA": "NerdWallet spent $35M more on marketing to get $25M more revenue. Negative marginal return on the growth. When your free traffic from Google dies you become a customer of Google, and the customer always pays the rack rate. $NRDS", "tweetB": "Management's defense against AI: 'complex products need inventory, live pricing and underwriting.' That's the moat chatbots lack today. It's also exactly what a chatbot with API access builds next quarter.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://bigmoves.substack.com/p/big-moves-november-6-2026"}, {"id": 13, "cat": "geopolitics", "urgency": "deep", "source": "Robert Marsh / Big Moves", "title": "Axon -18%: three delayed federal Dedrone counter-drone deployments pulled from guide", "idea": "AXON -18.18%. Cut full-year outlook after removing revenue from three delayed Federal Dedrone counter-drone deployments (one expected in Q3, two in Q4). Strong growth in Software & Services and Platform Solutions was overshadowed.", "angle": "Counter-drone demand is real but federal procurement timing is lumpy. Slippage is from government calendar, not demand.", "tweetA": "Axon lost 18% over three federal counter-drone deployments slipping a quarter. Demand intact, procurement late. Defense tech's risk isn't the threat, it's the PO date. $AXON", "tweetB": "Counter-drone is one of the few defense categories where the threat curve is exponential and the buyer's process is linear. That gap is the entire investment case and the entire risk.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://bigmoves.substack.com/p/big-moves-november-6-2026"}, {"id": 14, "cat": "AI/infra", "urgency": "deep", "source": "Robert Marsh / Big Moves", "title": "AI infra snapback: COHR +13.6%, AMD +11%, ANET +7.3%, TSM +6.3% on Nvidia 3D DRAM report", "idea": "After Thursday's steep AI-chip selloff, Coherent (+13.58%), AMD (+11.04%), Arista (+7.31%) and TSMC (+6.33%) rebounded. TSMC rose on reports it may produce Nvidia-requested 3D DRAM chips, plus Taiwan's tighter short-selling rules and a potential market-stabilization fund. LBBW upgraded AMD to Buy.", "angle": "The state is stepping in to defend Taiwan equities (short-selling rules, stabilization fund). That's a policy put under the AI complex.", "tweetA": "Taiwan tightened short-selling rules and floated a stabilization fund and TSMC ripped 6%. When the sovereign backstops the AI trade, you aren't trading earnings, you're trading the put. $TSM $COHR", "tweetB": "TSMC reportedly making 3D DRAM for Nvidia means the foundry is moving into memory, the one layer everyone said was a shortage. Memory sold off 23% in five days. Pick a story. $TSM $NVDA $MU", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://bigmoves.substack.com/p/big-moves-november-6-2026"}, {"id": 15, "cat": "tech", "urgency": "deep", "source": "Robert Marsh / Big Moves", "title": "Atlassian -16%: Data Center revenue decline accelerating as customers forced to cloud", "idea": "TEAM -16.15%. Outlook points to accelerating declines in Data Center revenue as customers migrate to Cloud, dragging growth despite continued Cloud and Marketplace expansion. Full-year revenue outlook modestly reduced after Q1.", "angle": "Forced migration revenue cliff: management is cannibalizing a high-margin on-prem base. Seat-based SaaS also faces AI pressure.", "tweetA": "Atlassian's Data Center decline is accelerating because it's the one forcing the migration. Cannibalizing your own high-margin base into a cloud product that AI agents can undercut is a tough sequence. $TEAM", "tweetB": "Every software company said the cloud shift would be a tailwind. Atlassian is the case study in what happens when the on-prem annuity runs off faster than cloud ramps.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://bigmoves.substack.com/p/big-moves-november-6-2026"}, {"id": 16, "cat": "positioning", "urgency": "deep", "source": "Robert Marsh / Big Moves", "title": "Beats that got sold: Microchip -10%, CarGurus -6.7%, Live Nation target cut", "idea": "MCHP -10% after results exceeded outlook (industrial and data-center demand) as several firms cut price targets. CarGurus -6.7% despite revenue and EPS beats on slow paying-dealer growth and an EBITDA margin decline. JPMorgan cut its Live Nation target despite beats across concerts, ticketing and sponsorship.", "angle": "Good prints penalized: positioning crowded, bar high. Market is paying for forward margin, not backward beats.", "tweetA": "Microchip beat guidance and fell 10%. CarGurus beat on revenue and EPS and fell. When beats stop working, the earnings season is no longer the catalyst, positioning is. $MCHP $CARG $LYV", "tweetB": "Wynn rose with no identified catalyst after weak Macau, Las Vegas and Boston prints. Mirror image of MCHP: bad news bought, good news sold. That's what de-grossing looks like at the tape level. $WYNN", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://bigmoves.substack.com/p/big-moves-november-6-2026"}, {"id": 17, "cat": "macro", "urgency": "deep", "source": "Robert Marsh / Big Moves", "title": "Monster -4.4%: aluminum, freight, digital transformation and a property impairment squeeze gross margin", "idea": "MNST -4.41% after Q3 showed margin pressure despite strong Monster Energy and Strategic Brands sales growth. Higher aluminum, freight and marketing costs, digital-transformation spend and a property impairment weighed on profitability; gross margin fell YoY.", "angle": "With oil at $90 and aluminum up, input-cost inflation is hitting even a premium-pricing consumer brand. Pass-through is the test.", "tweetA": "Monster grew sales and lost gross margin. Aluminum cans and freight. A beverage company with pricing power is getting squeezed by the war premium in energy. Input inflation doesn't show up in CPI first, it shows up in margins. $MNST", "tweetB": "Aluminum and freight hitting Monster's gross margin while WTI just fell 14% in a week. The commodity relief in oil hasn't reached the cost stack yet. Margin lag is a Q1 story. $MNST", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://bigmoves.substack.com/p/big-moves-november-6-2026"}, {"id": 18, "cat": "geopolitics", "urgency": "deep", "source": "Peter Frankopan / Global Threads", "title": "Frankopan: Trump's midterm loss weakens his hand abroad; has China gained leverage?", "idea": "Frankopan argues the defeat, with anger over the Iran war and rising living costs, weakens Trump's hand abroad. China is keen to avoid a new trade war and has built cards it can play, and has played. He asks whether Beijing now holds greater leverage over the US, and what that means for Europe caught between US financial dominance and Chinese industrial might.", "angle": "Midterm outcome as geopolitical event: lame-duck leverage in US-China talks. Europe is the swing region.", "tweetA": "The midterms are a China trade story. The administration that ran on tariffs now has a Congress that owns the cost-of-living politics. Beijing negotiates with a counterparty that can't escalate. $FXI $KWEB", "tweetB": "Frankopan's framing is Europe stuck between the dollar and Chinese industry. The cleaner version: Europe has no Plan B on either. It buys US energy and Chinese inputs. Both are now leverage points. $EZU", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://peterfrankopan.substack.com/p/the-dollars-dominance-is-under-threat"}, {"id": 19, "cat": "geopolitics", "urgency": "deep", "source": "Peter Frankopan / Global Threads", "title": "Dollar dominance under threat: BRICS payments, Lula re-elected, Iran war fallout", "idea": "Frankopan's post covers the dollar's 'extraordinary role' (cheap borrowing, deficit financing, sanctions as a weapon), Beijing's growing control of industrial supply chains, and BRICS efforts to build alternative payment systems. He cites Lula's re-election in Brazil as part of the shifting balance. Only the intro is in the email.", "angle": "Sanctions weaponization plus an Iran war is the accelerant for alternative rails. The dollar's real moat is network plus Treasury depth, not payments tech.", "tweetA": "The dollar's exorbitant privilege is the ability to sanction. Every sanction round teaches a BRICS finance ministry to build an alternative rail. Gold up 4% on a week when everything else sold off says someone already priced it. $GLD", "tweetB": "Lula re-elected, Democrats in Congress, and the Iran war driving BRICS to build their own payment rails. De-dollarization is mostly a slow plumbing project, not a crash. Watch settlement volume, not rhetoric.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://peterfrankopan.substack.com/p/the-dollars-dominance-is-under-threat"}, {"id": 20, "cat": "AI/infra", "urgency": "deep", "source": "Elvis Saravia / NLP Newsletter", "title": "NVIDIA: aggressive context compaction costs nothing on SWE-bench (70.2 vs 70.0), peak context 32K to 8K", "idea": "Later tokens cost up to 7x earlier ones on frontier open-weight models. One action per context with a short natural language state summary scored 70.2 on SWE-bench Verified with Claude Opus 4.5 vs 70.0 with full history; median peak context fell from 32K to 8K tokens. Best end-of-conversation compaction hit 74.8. Selective reading matched or beat full-input baselines on Terminal-Bench, FRAMES, BFCLv3, multilingual SWE-bench.", "angle": "Million-token context is partly a tax on inattention. If agents work as well at 8K, KV-cache and memory demand per task falls 4x.", "tweetA": "An agent given one action at a time and an 8K summary scores the same as one carrying 32K of history. Long-context is a cost the labs are choosing, not a capability the task needs. Somebody is overbuying HBM for the agent era. $MU $NVDA", "tweetB": "If later tokens cost up to 7x and compaction loses nothing, the margin on agent workloads is mostly a harness decision. The AI cost curve falls through software, not silicon.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://nlp.elvissaravia.com/p/top-ai-papers-of-the-week-d3d"}, {"id": 21, "cat": "AI/infra", "urgency": "deep", "source": "Elvis Saravia / NLP Newsletter", "title": "IBM JevAct: a runtime gate lifts agent success from 39.5% to 80.7% with no retraining", "idea": "JevAct sits between the agent and its tools, compiling policy, tool schemas and logs into code checks and yes/no questions. On tau2-bench Telecom, Opus 4.6's all-three-runs success rises from 39.5% to 80.7%; eight agents improve 16.9 points on average, and all nine evaluated on BFCL improve. Airline results are smaller and mixed.", "angle": "Reliability, not capability, is the enterprise adoption bottleneck. Deterministic checks double pass rates without a new model.", "tweetA": "The same model went from 39.5% to 80.7% by adding a gate that checks the tool call before it executes. Enterprise AI isn't waiting on a smarter model, it's waiting on a smarter harness. The value accrues to whoever owns the guardrail. $IBM $NOW", "tweetB": "Doubling success rate with no retraining means a large share of the 'agents don't work' evidence is really 'agents without verification don't work'. The GDP effect of that gap is bigger than the next model release.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://nlp.elvissaravia.com/p/top-ai-papers-of-the-week-d3d"}, {"id": 22, "cat": "AI/infra", "urgency": "deep", "source": "Elvis Saravia / NLP Newsletter", "title": "OpenAI LifeVal: 148 consumer tasks worth over $1.7T/yr; top failure is missed past-chat facts", "idea": "Survey of 3,837 US consumers ranked 148 life tasks (managing finances, finding childcare) by willingness to pay an assistant, together worth over $1.7 trillion a year. 169 agent tasks were written by people using their own ChatGPT history. Most common model failure: wrong answer from a missed fact in past chats, 33% win rate on criteria tied to past conversations vs 48% for saved memories.", "angle": "OpenAI is quantifying the consumer TAM for agents ($1.7T) and admitting memory retrieval is the bottleneck. Memory is the moat.", "tweetA": "OpenAI just put a number on the consumer agent market: $1.7T a year in tasks people would pay to hand off. The failure mode isn't reasoning, it's forgetting what you told it last month. Memory is the product.", "tweetB": "33% win rate using chat history vs 48% using saved memories. The model that remembers you best wins the $1.7T. That's a data-lock-in business wearing an AI costume.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://nlp.elvissaravia.com/p/top-ai-papers-of-the-week-d3d"}, {"id": 23, "cat": "AI/infra", "urgency": "watch", "source": "Elvis Saravia / NLP Newsletter", "title": "Stanford Collaborative Intelligence: frontier models reach best team deal in only 14% of pressured negotiations", "idea": "240 tasks across 8 teamwork skills from aviation accident reports, clinical cases, coding and negotiations. Best of 18 models scores 82.2/100. Frontier models almost always refuse unsafe shortcuts yet reach the best team deal in only 14% of pressured negotiations; pass rate drops from 97% to 81% when taking over a task where a weaker model cheated. Near-equal capability models differ by up to 11 points as teammates.", "angle": "Multi-agent systems are the deployment pattern, and teamwork skill doesn't track solo capability.", "tweetA": "14%. That's how often frontier models find the best deal in a pressured negotiation. Everyone is building multi-agent workflows on models that can't negotiate with each other.", "tweetB": "Two models with the same solo score differ by 11 points as teammates. Benchmarks measure the player, not the team. The orchestration layer is where the variance lives.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://nlp.elvissaravia.com/p/top-ai-papers-of-the-week-d3d"}, {"id": 24, "cat": "AI/infra", "urgency": "watch", "source": "Elvis Saravia / NLP Newsletter", "title": "Nace AI Drex: decision models answer in 183 ms vs ~3.5 s for Opus", "idea": "Drex is a family of four open decision models (8B, 9B, 35B/3B active, 27B) returning option probabilities without generating text. 27B Max scores 67.52 on Decision Index 0.4.1 vs 60.70 for Jev 1.14.0; statistically tied with GPT-6 Sol and d3-turbo on Decision Bench v4 while trailing Claude Opus 5.5 by 1.6 points; 183 ms vs about 3.5 s for Opus.", "angle": "Classification-style decisions at 20x latency advantage with near-frontier accuracy: the economic unit is cost per decision, not per token.", "tweetA": "183 ms vs 3.5 seconds, 1.6 points behind the frontier. A 27B open model that doesn't generate text is an approval gate that runs inline at wire speed. Frontier labs sell the reasoning, the margin is in the decisions.", "tweetB": "Models that return probabilities instead of sentences are a different product category. Credit approvals, compliance flags, routing. The addressable market is every if-statement in enterprise software.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://nlp.elvissaravia.com/p/top-ai-papers-of-the-week-d3d"}, {"id": 25, "cat": "AI/infra", "urgency": "watch", "source": "Elvis Saravia / NLP Newsletter", "title": "RSI-Dojo: models trained to run post-training; a 35B-A3B matches GLM-5.2 and GPT 5.5 on PostTrainBench", "idea": "CUHK, ByteDance, Tsinghua and SJTU built 281 executable seed tasks from top-venue papers across math, writing, code, medical, knowledge and reasoning. Fine-tuning Qwen3.5-9B and Qwen3.6-35B-A3B on filtered frontier trajectories adds 8.74 and 16.87 PostTrainBench points; RSI-Dojo-35B-A3B reaches 29.95 (and 53.29 on Lite), matching GLM-5.2 and GPT 5.5.", "angle": "Recursive self-improvement skill moved into a mid-sized open model's weights. Chinese labs are explicitly training agents to train models.", "tweetA": "A 3B-active open model that learned to run post-training now matches frontier models on the post-training benchmark. Recursive self-improvement is a benchmark now, and the leader is a Chinese open-weight stack.", "tweetB": "RSI-Dojo converts published papers into executable training tasks. Research output is becoming training data for the thing that does research. The loop closes when the papers are written by it.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://nlp.elvissaravia.com/p/top-ai-papers-of-the-week-d3d"}, {"id": 26, "cat": "labor", "urgency": "watch", "source": "Elvis Saravia / NLP Newsletter", "title": "Alibaba SPAR: self-evolving sales agent lifts conversion 15.8% across 200,000 merchants on 1688", "idea": "A/B test on Alibaba's 1688 platform with over 200,000 merchants: SPAR raises conversion 15.8% and grows high-intent merchants 35.8%; domain experts rate it 4.62/5 on sales quality. It treats strategies as testable hypotheses and attributes outcomes to strategy vs external factors before updating memory.", "angle": "B2B sales outreach at 200K-merchant scale in production, not a demo. A sales-labor substitution signal.", "tweetA": "15.8% conversion lift across 200,000 merchants, live on 1688. This isn't a pilot. B2B outbound sales is the first white-collar workflow with a clean A/B test at industrial scale. $BABA", "tweetB": "The clever part: before the agent writes a lesson to memory, it checks whether the loss was its fault. Most human sales teams don't do causal attribution. The agent does it for free.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://nlp.elvissaravia.com/p/top-ai-papers-of-the-week-d3d"}, {"id": 27, "cat": "AI/infra", "urgency": "watch", "source": "Elvis Saravia / NLP Newsletter", "title": "Skill++: rewriting new-skill metadata lifts routing from 36.4% to 76.3% at 731 skills", "idea": "Agent routers pick skills by name and description. As a library grows to 731 skills over ten sessions, Skill++ (rewriting new skill descriptions against the closest predecessor) lifts all-required-skills selection to 76.3% vs 36.4%, and improves final-session routing by 23.1 points on average across five routers.", "angle": "Skill-library sprawl is the next version of dependency hell. Description quality, not model quality, decides routing.", "tweetA": "36.4% to 76.3% by rewriting descriptions. Agent skill marketplaces will have the same SEO problem as app stores: metadata decides who gets called. Someone will build the ranking layer.", "tweetB": "Add a skill, silently break an older one, nobody changed the router. That's a regression pattern with no test suite. Agent platforms need CI for skills.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://nlp.elvissaravia.com/p/top-ai-papers-of-the-week-d3d"}, {"id": 28, "cat": "AI/infra", "urgency": "watch", "source": "Elvis Saravia / NLP Newsletter", "title": "Alibaba Recursa: legal agent all-pass rate 30% to 55% from self-learning, weights frozen", "idea": "Recursa builds a repository of domain skills, instructions, memories and reflections, refined by recursive child learners with validated edits only. On Harvey LAB's Firm Knowledge benchmark all-pass rises 30.0% to 55.0% with DeepSeek-V4.1-Flash and 35.0% to 46.0% with Qwen3.8-Flash, with no human expert or stronger model.", "angle": "Domain adaptation without fine-tuning. Legal, with flash-tier open models, gains 15-25 points from a learned skill repository.", "tweetA": "Flash-tier open model: 30% to 55% on a legal benchmark, no human expert, no fine-tune, weights frozen. Harvey's moat is the workflow data. Alibaba just showed a loop that manufactures it.", "tweetB": "The legal-AI premium is built on proprietary domain knowledge. If a self-built skill repository gets a cheap model most of the way, the premium compresses to distribution. $TRI $RELX", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://nlp.elvissaravia.com/p/top-ai-papers-of-the-week-d3d"}, {"id": 29, "cat": "AI/infra", "urgency": "watch", "source": "Elvis Saravia / NLP Newsletter", "title": "Meta FAIR Routed CL: cluster-based memory cuts agent API cost 65-72%", "idea": "Single global history over a stream of 301 CL-Bench and 97 banking tasks gains only +0.015 normalized reward over no memory. Routed Continual Learning clusters trajectories and routes each to a memory system, raising reward 15-30% of the max attainable and cutting API cost 65% to 72% across four models. Sequential runs only.", "angle": "A global memory is worse than no memory. Memory architecture is routing, not storage.", "tweetA": "One global agent memory improved results by 0.015. Clustering it improved them 15-30% of the maximum and cut cost by 70%. Memory is a database problem, and most people building agents are still using a text file.", "tweetB": "Routing which memory to use per task is the same insight as mixture-of-experts, one layer up. Agent infrastructure is reinventing the database index.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://nlp.elvissaravia.com/p/top-ai-papers-of-the-week-d3d"}, {"id": 30, "cat": "crypto", "urgency": "deep", "source": "On-Chain Insights", "title": "BTC: five straight red weeks, recent buyers sold at a loss two weeks running, STH cost basis $75,659", "idea": "BTC traded $74,888-$81,196, weekly candle at $75,884 (-3.15%), fifth consecutive red week. Short-term-holder realized price is $75,659; Friday's low dipped about 1% below it and price is back 0.3% above. US spot BTC ETFs lost $1.28B this week; total net assets $95.90B. Premium section notes on-chain spot demand at its lowest in more than a year.", "angle": "Price sits exactly on the short-term-holder cost basis: coin flip with a stop. ETF outflows plus the weakest on-chain spot demand in a year lean bad.", "tweetA": "BTC is 0.3% above the average cost of recent buyers. Five red weeks, ETFs out $1.28B, on-chain spot demand at a one-year low. The whole market is standing on a single number, $75,659. $BTC", "tweetB": "Bitcoin fell less than Nasdaq 100 and more than SPX this week. At 95.9B ETF AUM and rate-hike odds at 78%, BTC is a levered long on liquidity. Whoever bought the 'digital gold' pitch should check the gold chart. $IBIT", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://ittechpl.substack.com/p/bitcoin-is-back-above-recent-buyers-202"}, {"id": 31, "cat": "macro", "urgency": "deep", "source": "On-Chain Insights", "title": "Nasdaq -5.5% and SPX -4.4% on Thursday: worst sessions since April 2025; Nasdaq in correction", "idea": "Wall Street rallied on the midterm result, then Thursday reversed on fears of tighter scrutiny of AI data centers under Democrats. Nasdaq Composite -5.5%, S&P 500 -4.4%, both the worst since April 2025; Nasdaq in correction, over 10% below its October record. Nasdaq 100 lost 4.91% for the week to 26,989.99, below its summer lows. S&P 500 -2.68% for the week to 7,376.86.", "angle": "AI trade now has an explicit political risk premium. Democratic Congress = scrutiny of data centers = capex risk.", "tweetA": "Market rallied on the midterms Wednesday and sold off 5.5% Thursday as it read the committee assignments. The AI trade was priced for a regulatory vacuum. Congress just ended it. $QQQ $SMH", "tweetB": "Nasdaq 100 at 26,990 is below its summer lows. Everyone who bought the 'buy the dip' since June is underwater. That's a pain trade with a two-year drawdown target. $NDX", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://ittechpl.substack.com/p/bitcoin-is-back-above-recent-buyers-202"}, {"id": 32, "cat": "macro", "urgency": "deep", "source": "On-Chain Insights", "title": "NFP 165k vs 65k expected; 78% odds of Dec Fed hike; BoE hikes to 4%", "idea": "US employers added 165,000 jobs in October vs about 65,000 expected; unemployment fell to 4.1%. Per Reuters, traders price about a 78% chance of a Fed hike on Dec 8-9, up from about 70% before the release. On Thursday the Bank of England raised to 4%, its first hike in over three years.", "angle": "Rate hike odds rising into an equity correction: central banks are explicitly tightening through a growth scare. Oil's 14% drop is the only relief valve.", "tweetA": "Payrolls beat by 100,000, BoE hiked for the first time in three years, and the market gives the Fed 78% odds of hiking in December. Everyone's been trading the 'AI bubble'. The rate shock is the bigger leverage. $TLT $DXY", "tweetB": "The BoE at 4% and a Fed hike pricing on top of a Nasdaq correction is the first coordinated tightening scare since 2022. The difference: this time earnings multiples sit on AI capex, not on zero rates.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://ittechpl.substack.com/p/bitcoin-is-back-above-recent-buyers-202"}, {"id": 33, "cat": "gold", "urgency": "deep", "source": "On-Chain Insights", "title": "Five-day rotation: gold miners +13.3%, AI chips -15.2%, memory & storage -23.0%; PAXG +4%, XAUT +4.6%", "idea": "Artemis's five-day sector view: Gold Miners +13.3%, Memory & Storage -23.0%, AI Chips & Semis -15.2%, Crypto Exchanges & Brokers -8.6% (weakest crypto sector). In the TOP 300 heatmap the few green tiles are gold-backed tokens: PAX Gold +4.04%, Tether Gold +4.63%. Author concludes money left AI and crypto and part of it moved to gold.", "angle": "Tokenized gold is outperforming every non-gold token: the crypto-native hedge is gold on-chain.", "tweetA": "Five days: gold miners +13.3%, memory -23%. Same week, the only green tiles in crypto were tokenized gold. Money left AI and crypto and went to the oldest asset on chain. $GDX $XAUT", "tweetB": "Memory & Storage -23% in five days is a sector move that happens in a bust, not a correction. Gold miners +13% in the same window. The market priced AI capex and inflation hedges in opposite directions. $MU $GDX", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://ittechpl.substack.com/p/bitcoin-is-back-above-recent-buyers-202"}, {"id": 34, "cat": "crypto", "urgency": "watch", "source": "On-Chain Insights", "title": "Altcoins fell harder than BTC but dominance flat at 60.50%: Hyperliquid -12.55%, ETH only -1.78%", "idea": "TOTAL market cap -3.13% at $2.52T; OTHERS (ex-top-10) -4.82% at $204.9B; BTC.D flat at 60.50% because ETH fell less (-1.78% on the heatmap). Hyperliquid -12.55% over seven days. Bitcoin's weekly loss 'decided on Wall Street'.", "angle": "ETH outperforming BTC in a risk-off week while alts bleed: relative strength worth tracking after the Binance hack.", "tweetA": "Hyperliquid -12.55%, OTHERS -4.82%, BTC.D unchanged at 60.5% because ETH held up. A flat dominance number hides a quiet ETH bid. Watch ETH/BTC into the next risk-off leg. $ETH $HYPE", "tweetB": "Total crypto market cap is $2.52T, OTHERS under $205B. The long tail is a rounding error. When liquidity leaves, it leaves the small stuff first and nobody notices the exit.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://ittechpl.substack.com/p/bitcoin-is-back-above-recent-buyers-202"}, {"id": 35, "cat": "credit", "urgency": "deep", "source": "Stephen Innes / Dark Side of the Boom", "title": "Morgan Stanley: $45.6B of high-yield data-centre debt; excellent tenants don't make excellent bonds", "idea": "Morgan Stanley's research asks what an unfinished data-centre facility is worth if power hasn't arrived, the financing clock is ticking and politics have shifted. $45.6B of high-yield debt is tied to a large construction pipeline. Secured vs unsecured comparison shows collateral promise vs actual value; strong tech tenants don't translate into strong bonds.", "angle": "Equity worried about peak spend; credit has a different problem: construction-phase risk with no power. HY data-center debt is the AI trade's weak link.", "tweetA": "$45.6B of HY debt financing buildings that don't have power yet. The tenant might be AAA. The bond is a construction loan. Equity debates AI demand; credit gets to debate whether the substation shows up. $ORCL $CRWV", "tweetB": "Democrats win, data-center scrutiny rises, Texas pauses new builds. Each is a delay. Delay is the enemy of a construction-stage high yield bond with a clock. The next AI headline will be a covenant. $CRWV $IREN", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/the-ai-credit-blast-radius-morgan"}, {"id": 36, "cat": "macro", "urgency": "deep", "source": "Stephen Innes / Dark Side of the Boom", "title": "Hartnett's Flow Show: 'DEM Fatale' - bubble, breadth or credit-driven bust into 2027", "idea": "BofA's Hartnett: Democratic sweep challenges the political foundations of the AI investment boom, the Fed remains in tightening mode, and record flows into equities collided with one of the most violent tech liquidations since the pandemic. He is not calling the end of the bull market; he distinguishes between AI bubble continuing, a broadening rally rewarding neglected sectors, and a credit-driven bust investors are reluctant to contemplate. Keeping powder dry.", "angle": "Record equity inflows into the sharpest tech liquidation since 2020: positioning contradiction. Hartnett's third path is credit; pairs with MS's data-centre HY work.", "tweetA": "Record inflows into equities collided with the worst tech liquidation since the pandemic. Who sold? Not the flows. Hartnett's three roads: bubble, breadth, credit bust. Only one of them hasn't been priced at all.", "tweetB": "Hartnett keeps powder dry and names credit as the bust path no one will consider. Morgan Stanley just put a $45.6B number on the HY data-centre pile. Same thesis, two houses, one week. $HYG $SMH", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/michael-hartnetts-dem-fatale-the"}, {"id": 37, "cat": "energy", "urgency": "deep", "source": "Bubble Bubble Report", "title": "WTI -14% to $90.34, Brent -15% to $101 in a week as Democrats constrain Iran war escalation", "idea": "Energy prices fell sharply last week as sweeping Democratic wins fueled expectations that the administration will face constraints on escalating or prolonging the Iran war. WTI plunged 14% to $90.34, Brent about 15% to $101, RBOB gasoline -13%, heating oil -8%. Since March the conflict sent energy prices soaring. Falling oil reduced expectations of further rate hikes, helping precious metals.", "angle": "A 14% crude drop in a week on a political event: oil is trading the war premium, not supply. Brent still at $101 after the drop.", "tweetA": "WTI -14%, Brent -15% in one week on an election. After that Brent is still $101. The market is pricing a political constraint on the war, not any change in barrels. That premium reverses with one headline. $XLE $USO", "tweetB": "Oil -14% cut the Fed hike narrative at the margin and handed precious metals a rebound. The macro chain: election to Iran war constraints to oil to hike odds to gold. Five links, one vote.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://thebubblebubble.substack.com/p/a-precious-metals-and-miners-update-f07"}, {"id": 38, "cat": "gold", "urgency": "deep", "source": "Bubble Bubble Report", "title": "Semis -38% from June peak; thesis: capital rotates from AI mania to precious metals and natural resources", "idea": "Semiconductor stocks have fallen 38% from their June peak, erasing much of the spring mania rally. The author argues that frenzy diverted capital and attention from precious metals over the summer, and that the bust now helps explain gold's second look. He expects substantial rotation out of tech into precious metals and resources. Precious metals were oversold and rebounding from major support zones.", "angle": "-38% in semis, gold miners +13.3%: the capital-flow mirror. The same rotation On-Chain Insights shows in sector returns.", "tweetA": "Semis are down 38% from June. Precious metals sold off while the chip mania sucked in the flows. Now the flows reverse. The mania took capital from gold in the spring and gives it back in the fall. $SMH $GDX", "tweetB": "Sector returns this week: gold miners +13%, AI chips -15%. Different authors, same data. When two unrelated newsletters see the same rotation, it's real flow. $GLD $SOXX", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://thebubblebubble.substack.com/p/a-precious-metals-and-miners-update-f07"}, {"id": 39, "cat": "tech", "urgency": "deep", "source": "P Equity Research", "title": "Intel EMIB-T vs TSMC CoWoS-L: expert call on glass core, reticle limits and a post-2028 split", "idea": "Question set from a P Equity expert call (answers behind licensing/paywall). Themes: whether EMIB-T yield and cost beat CoWoS-L; whether Intel's EMIB for Google's TPU uses Glass Core; why CoWoS-L and EMIB would split the market evenly after 2028 when CoWoS capacity can't expand much; why ABF-substrate packaging breaks the reticle size limit; whether TSMC's CoPoS in 2028 pulls customers back.", "angle": "The question list itself shows what buy-side thinks: packaging, not wafers, is the AI scale constraint and Intel is a credible second source.", "tweetA": "The buy-side question list on the Intel call: can EMIB-T take half of advanced packaging after 2028? If a 'foundry-agnostic' second source in packaging is credible, it changes Intel's story faster than any 18A yield number. $INTC $TSM", "tweetB": "CoWoS is capacity constrained through 2028 and its reticle size can't scale. The alternative breaks the reticle limit with ABF substrates. The constraint moves from TSMC's fab to the substrate maker's glass cloth. $INTC $AMKR", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://pequityresearch.substack.com/p/expert-call-emib-t-packaging-glass"}, {"id": 40, "cat": "AI/infra", "urgency": "watch", "source": "P Equity Research", "title": "ABF substrate: 2027 shortage risk, glass cloth constraint, and a 2028 overcapacity repeat of 2022", "idea": "Questions posed on the call: ABF substrate price rises in 2026 and expected 2027; whether upstream glass cloth, ABF film and equipment limit 2027 expansion; whether long equipment lead times plus AI demand uncertainty could repeat the 2022 overcapacity in 2028; whether substrate makers sign long-term contracts and take prepayments; Rubin Ultra substrate layer counts and Glass Core adoption; Zhen Ding vs Unimicron and Kinsus.", "angle": "Packaging price increases and prepayment contracts are a supply-chain bullwhip signal. The overcapacity question mirrors the HY data-centre risk.", "tweetA": "The sell-side question nobody likes: if ABF substrate capacity doubles into 2028 and AI demand wobbles, is 2022 back? Substrate makers are asking for prepayments. Customers prepaying for capacity is what the top looks like. $3037.TW $UMC", "tweetB": "Glass cloth and ABF film, not silicon, are what limit 2027 substrate expansion. The AI supply chain has retreated three layers upstream from the GPU to fiberglass. The bottleneck is a textile.", "charts": { var COL={macro:"#e24b4a",credit:"#378add",positioning:"#ef9f27","AI/infra":"#1d9e75",crypto:"#7f77dd",geopolitics:"#d85a30",energy:"#f97316",tech:"#06b6d4",gold:"#d4a017",culture:"#ec4899",labor:"#8b5cf6",regulation:"#64748b",science:"#14b8a6",venture:"#84cc16"};
var UE={act:"🔴",deep:"🔵",watch:"🟡"};
var fc="all",fu="all",fs=null;
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}
function toggle(id){var e=document.getElementById("c"+id);e.classList.toggle("open");}
function card(item){
  var c=COL[item.cat]||"#888";
  var ch=item.charts||{count:0,hot:false,desc:""};
  var mark=ch.hot?" 🔥":(ch.desc?" 📊":"");
  var h='<div class="card" id="c'+item.id+'" data-cat="'+item.cat+'" data-urg="'+item.urgency+'" data-src="'+esc(item.source)+'">';
  h+='<div class="hd" onclick="toggle('+item.id+')"><span class="num">'+item.id+'</span><span>'+UE[item.urgency]+'</span><span class="src" style="background:'+c+'">'+esc(item.source)+'</span><span class="tag">'+item.cat+'</span><span>'+mark+'</span><div class="ttl">'+esc(item.title)+'</div></div>';
  h+='<div class="bd"><div class="lbl">The Idea</div><div>'+esc(item.idea)+'</div>';
  h+='<div class="angle" style="border-color:'+c+';background:'+c+'14"><div class="lbl" style="margin-top:0">My Angle</div>'+esc(item.angle)+'</div>';
  h+='<div class="tw"><div><div class="lbl" style="color:#378add">Tweet A</div>'+esc(item.tweetA)+'<br>'+'<button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button></div>';
  h+='<div><div class="lbl" style="color:#7f77dd">Tweet B</div>'+esc(item.tweetB)+'<br>'+'<button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div></div>';
  if(ch.desc){h+='<div class="chart'+(ch.hot?' hot':'')+'">'+(ch.hot?'🔥 CHART WORTH SAVING — ':'📊 ')+esc(ch.desc)+(ch.count?' ('+ch.count+')':'')+'</div>';}
  h+='<div style="margin-top:8px"><a href="'+esc(item.link)+'" target="_blank" rel="noopener">↗ Read full article</a></div></div></div>';
  return h;
}
function apply(collapse){
  var cs=document.querySelectorAll(".card");
  for(var i=0;i<cs.length;i++){
    var e=cs[i],it=ITEMS[i];
    var ok=(fc==="all"||it.cat===fc)&&(fu==="all"||it.urgency===fu)&&(fs===null||it.source.indexOf(fs)!==-1);
    e.style.display=ok?"":"none";
    if(collapse)e.classList.remove("open");
    if(fs!==null&&ok)e.classList.add("open");
  }
  bars();
}
function bars(){
  var cats={};ITEMS.forEach(function(i){cats[i.cat]=(cats[i.cat]||0)+1;});
  var h='<span class="pill'+(fc==="all"?' on':'')+'" style="'+(fc==="all"?'background:#333;border-color:#333':'')+'" onclick="setC(\'all\')">All '+ITEMS.length+'</span>';
  Object.keys(cats).forEach(function(k){var on=fc===k;h+='<span class="pill'+(on?' on':'')+'" style="'+(on?'background:'+COL[k]+';border-color:'+COL[k]:'')+'" onclick="setC(\''+k+'\')">'+k+' '+cats[k]+'</span>';});
  document.getElementById("catbar").innerHTML=h;
  var u={act:0,deep:0,watch:0};ITEMS.forEach(function(i){u[i.urgency]++;});
  var L=[["all","All"],["act","🔴 Act Now"],["deep","🔵 Deep"],["watch","🟡 Watch"]];
  h="";L.forEach(function(p){var n=p[0]==="all"?ITEMS.length:u[p[0]];var on=fu===p[0];h+='<span class="pill'+(on?' on':'')+'" style="'+(on?'background:#333;border-color:#333':'')+'" onclick="setU(\''+p[0]+'\')">'+p[1]+' '+n+'</span>';});
  document.getElementById("urgbar").innerHTML=h;
}
function setC(k){fc=k;fs=null;apply(true);}
function setU(k){fu=k;fs=null;apply(true);}
function filterBySrc(name){fs=name;fc="all";fu="all";apply(true);}
function init(){
  document.getElementById("sub").textContent=META.date+" · "+META.time+" · "+ITEMS.length+" items";
  var h="";ITEMS.forEach(function(i){h+=card(i);});
  document.getElementById("list").innerHTML=h;
  var r='<p>Window: '+esc(META.windowStart)+' to '+esc(META.windowEnd)+'. '+esc(META.note)+'</p><p>Emails in window: '+META.emailsInWindow+' · read: '+META.emailsRead+' · items: '+META.itemsExtracted+'</p><b>Included sources</b> (click to filter)<ul>';
  META.includedSources.forEach(function(s,idx){r+='<li><span class="sl" data-i="'+idx+'">'+esc(s.name)+'</span> — '+s.count+'</li>';});
  r+='</ul><b>Skipped sources</b><ul>';
  META.skippedSources.forEach(function(s){r+='<li>'+esc(s.name)+' — '+esc(s.reason)+'</li>';});
  r+='</ul><p><span class="sl" data-i="-1">Clear source filter</span></p>';
  var rep=document.getElementById("rep");rep.innerHTML=r;
  var ls=rep.querySelectorAll(".sl");
  for(var k=0;k<ls.length;k++){ls[k].addEventListener("click",function(){var i=+this.getAttribute("data-i");if(i<0){fs=null;apply(true);}else filterBySrc(META.includedSources[i].name);});}
  apply(true);
}
init();
