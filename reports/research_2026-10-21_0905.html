<script>
const ITEMS = [{"id": 1, "cat": "macro", "urgency": "deep", "source": "Dark Side of the Boom (China Daily)", "title": "PBOC may swap its policy rate to overnight repo — a ~15bp cut disguised as plumbing", "idea": "Pan Gongsheng at Financial Street Forum: studying a shift of the main policy rate from the 7-day reverse repo (1.40%) to an overnight reverse repo, reportedly 1.25% (Bloomberg). That is ~15bp of easing without a headline cut. DR001 would also become a reference for corporate loans, bonds and derivatives, with legacy benchmark deposit/lending rates retired.", "angle": "China's easing for 2027 may arrive via architecture, not RRR/rate-cut headlines — a CNH/CGB signal that the 'no cut' consensus misses.", "tweetA": "The PBOC can cut 15bp without cutting. Change the benchmark, keep the press conference quiet. Anyone modelling 'no easing in 2026' on the 7-day repo is watching the wrong rate.", "tweetB": "Every CB tightens in the open. Beijing is loosening by renaming the rate. Which one do you think the CGB curve is pricing correctly?", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/china-daily-the-pboc-quietly-rewires"}, {"id": 2, "cat": "macro", "urgency": "deep", "source": "Dark Side of the Boom (China Daily)", "title": "PBOC overnight repo operations went from RMB0.9tn to RMB4.85tn in three months", "idea": "Gross overnight reverse repo operations rose from RMB900bn in June to RMB4.85tn in September — nearly 4x the volume of 7-day operations. Net overnight injections already exceed the 7-day and 14-day facilities combined. The policy rate change would just ratify what the liquidity machinery already does.", "angle": "Operational reality moved first; the official benchmark is catching up. Useful for reading DR001 as the real policy signal.", "tweetA": "RMB0.9tn to RMB4.85tn in one quarter. The PBOC already moved to an overnight regime; the 'main policy rate' is a museum piece. Trade DR001, not the headline.", "tweetB": "Fed watchers argue about the dot plot. In China the actual policy instrument quintupled in volume in 3 months and almost nobody has it on a chart.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/china-daily-the-pboc-quietly-rewires"}, {"id": 3, "cat": "macro", "urgency": "deep", "source": "Dark Side of the Boom (China Daily)", "title": "China Q3 GDP 4.5% buys the PBOC patience — but the firebreaks are being built now", "idea": "Q3 GDP came in at 4.5%, above expectations, so no rush to cut rates or RRR this year. The PBOC is instead pre-building: a liquidity backstop for non-bank financials to stop redemption spirals, SLF access for locally incorporated foreign banks, links between interbank and exchange bond markets, and direct onshore FX access for offshore RMB clearing banks.", "angle": "Plumbing for the next shock: non-bank backstop + offshore RMB clearing access = deeper, more internationalised RMB bond market.", "tweetA": "Beijing is building the bond-fund firebreak before the fire. Non-bank liquidity backstop, foreign-bank SLF, offshore RMB clearers into onshore FX. This is RMB plumbing, not stimulus.", "tweetB": "US non-bank credit has no standing backstop and everyone knows it. China is writing one on a 4.5% growth print. Who's more prepared for a redemption spiral?", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/china-daily-the-pboc-quietly-rewires"}, {"id": 4, "cat": "credit", "urgency": "deep", "source": "Rupak Ghose (Credit Market Daily)", "title": "Tradeweb pays ~60x 2026 EBITDA for Trumid; ICE paid 10.6x for MarketAxess", "idea": "Tradeweb's $1.75bn Trumid price is ~60x 2026 EBITDA but 19.4x fully cost-synergized (targeting $60m, ~50% of Trumid's cost base). ICE paid 10.6x LTM EBITDA for MarketAxess, targeting $100m (~20% of cost base). Trumid grew revenue at a 30% CAGR 2022-25 vs MarketAxess 6%. Only ~13% of new issue is electronic; ~half of IG and ~25% of HY trades electronically.", "angle": "US credit e-trading consolidating to three: ICE/MarketAxess, Tradeweb/Trumid, Bloomberg. LSEG/Octus adds a twist for the LSEG stake in Tradeweb.", "tweetA": "10.6x for the slow grower, 19.4x synergized for the 30% grower. The market just told you what electronic credit share-gain is worth. $TW $ICE $MKTX", "tweetB": "Three platforms left in US credit. Antitrust has to argue 'ICE and Bloomberg are big enough to compete'. That is a weird sentence in 2026.", "charts": {"count": 2, "hot": false, "desc": "Chart from The Desk: MarketAxess gap vs Tradeweb/Trumid eroding; chart of Tradeweb credit revenue 20% CAGR vs MarketAxess."}, "link": "https://rupakghose.substack.com/p/are-platforms-and-nonbanks-eating"}, {"id": 5, "cat": "credit", "urgency": "deep", "source": "Rupak Ghose (Credit Market Daily)", "title": "Banks' G10 credit trading revenue fell $7.5bn → $5.2bn while Jane Street made $40bn in 7 months", "idea": "Crisil Coalition Greenwich: G10 bank credit trading revenues $7.5bn (2021) → $5.2bn (last year). Jane Street's total revenue was $40bn in the first 7 months of 2026 — even a small slice from credit market making beats any investment bank's credit desk. Citadel Securities is now gathering momentum in credit. Q3 2026: US banks strong in equities and financing, credit trading lacklustre.", "angle": "Equitization of credit: price distribution via multi-dealer platforms removes dealer differentiation. Market share goes to non-bank liquidity providers.", "tweetA": "Jane Street: $40bn revenue in 7 months. Whole G10 bank credit trading: $5.2bn a year. The credit market maker of the future isn't wearing a bank badge.", "tweetB": "The bond market is being equitized and the sell side gets to be the exchange's customer. Credit trading desks as Detroit car makers.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://rupakghose.substack.com/p/are-platforms-and-nonbanks-eating"}, {"id": 6, "cat": "gold", "urgency": "deep", "source": "Tavi Costa (Crescat)", "title": "Gold has corrected nearly as much as in 2008 — and he's buying miners", "idea": "Costa's claim: gold has already corrected almost as much as it did in 2008, yet many behave as if the selloff has only begun. He argues that in a secular bull market, pullbacks like this are rare buying chances, and stays focused on gold and silver miners, LatAm opportunities, and links to rates and the monetary system. Email is a teaser; the substance is in the full report.", "angle": "Contrarian positioning: miners as the levered way to play a 2008-sized drawdown inside a still-intact secular bull.", "tweetA": "Gold has already given back nearly what it did in 2008. The crowd is positioned as if the move down is just starting. Either the secular bull is dead or this is the entry. Miners are the tell. $GDX $GDXJ", "tweetB": "I'd rather be early and wrong on a 2008-sized drawdown than late and right on a bounce. Show me the miners' free cash flow at this gold price. $GDX", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://tavicosta.substack.com/p/echoes-of-2008"}, {"id": 7, "cat": "AI/infra", "urgency": "deep", "source": "Dark Side of the Boom (CoreWeave)", "title": "CoreWeave: Goldman and HSBC disagree on whether the economics work — stock faded from $66", "idea": "Wall Street is split on CoreWeave: Goldman sees an opportunity in its financing and pricing structure; HSBC thinks economics work against shareholders as it expands. The stock hit $66 intraday after Goldman's upgrade then gave it all back, read as investors selling the rally. The real divide is equity analysts vs credit investors over contracted demand, expensive debt, and uncertain GPU economics.", "angle": "Credit is the arbiter: equity bulls underwrite demand, credit investors underwrite the cost of capital. Bloomberg Opinion also flags a CoreWeave bond rout (see Authers links).", "tweetA": "Goldman upgrade, stock touches $66, then gives it all back. When good news is a liquidity event, the buyer isn't the equity market. Watch the bonds. $CRWV", "tweetB": "Contracted demand is not the same as a return on a GPU that depreciates in 4 years against 7-year debt. The analyst fight is really a duration argument.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/coreweave-the-battle-of-the-analysts"}, {"id": 8, "cat": "energy", "urgency": "deep", "source": "HFI Research (Energy)", "title": "HFI: still long USO/UCO/BNO plus BNO calls; adding another energy stock after the 'Iran War'", "idea": "HFIR says it rarely adds stocks. It called crude over energy stocks at the start of the year (USO), added on pullbacks after the Iran War began, holds UCO, USO, BNO and sizable BNO calls. Stocks: CNQ bought in April; PXT.TO and GPRK bought in the July oil selloff as part of a Colombian oil producer basket. The new name is behind the paywall.", "angle": "Positioning signal: a well-known energy shop is long crude via ETFs and levered, with equity picks concentrated in Canadian and LatAm producers.", "tweetA": "Crude over energy equities was the right call this year. Now a prominent shop is rotating the other way into select producers. Watch whether the equity/crude ratio mean-reverts. $CNQ $GPRK $BNO", "tweetB": "Colombia as an oil basket, in a year with a war premium in crude. I'd want to know what happens to the basket if the Iran headline flips.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.hfir.com/p/idea-we-are-going-to-add-this-energy"}, {"id": 9, "cat": "geopolitics", "urgency": "act", "source": "John Authers (Bloomberg Points of Return)", "title": "France is <3% of global GDP, half its 1980 share — and 57.5% of its debt is foreign-held", "idea": "Authers: France's weight in world GDP is under 3%, less than half 1980. Contagion risk in 2026 is not banks (Italian and Greek spreads narrowed even as French spreads widened) but the 57.5% of OATs held by foreign institutions (vs 35.9% of BTPs) and insurers. Debt near 110% of GDP, same as US, and the private sector is already leveraged more than US/Europe, limiting domestic funding. Template: Italy 2018, spreads peaked at 325bp.", "angle": "Riots in Paris plus political risk make France the go-to short for sellers; ECB toolset and bank decoupling cap contagion for now.", "tweetA": "57.5% of French government debt is held by foreigners; for BTPs it's 35.9%. The 2010-12 crisis was a bank problem. This one's a real-money and insurer problem, and nobody has a backstop for that. $FXE", "tweetB": "Bessent says French problems won't spill over. Fine. He didn't say whether his own Treasuries are what's moving spreads. Italian and Greek spreads tightened while Paris burned.", "charts": {"count": 6, "hot": true, "desc": "🔥 Several charts: French GDP share, French/Italian/Greek spreads vs Bunds, bank stocks (ASR), debt/GDP, private-sector leverage."}, "link": "https://www.bloomberg.com/opinion/newsletters/2026-10-21/france-s-place-in-world-economy-is-burning-too"}, {"id": 10, "cat": "credit", "urgency": "deep", "source": "John Authers (Bloomberg Points of Return)", "title": "It's US Treasuries, not OATs, that appear most contagious to peripheral spreads", "idea": "Spreads of Italian and Greek bonds over bunds widened sharply in September when Treasury yields were surging, though they lagged the rise in French yields. This month, as French spreads widen on street scenes, premiums for Greece and Italy narrowed. Absolute Strategy Research: French bank stocks tanked while other euro-area banks held up.", "angle": "The global duration shock transmits through UST yields; French politics is idiosyncratic. Relevant for relative-value in EGBs.", "tweetA": "September: UST yields up, BTP and Greek spreads blow out. October: Paris burns, BTP spreads tighten. The marginal driver of euro-area credit is Treasury duration, not Elysée.", "tweetB": "Contagion map in 2026: US term premium -> periphery, not France -> periphery. If that holds, long BTP/short OAT is just a politics trade.", "charts": {"count": 2, "hot": false, "desc": "ASR bank-stock divergence chart and spread chart."}, "link": "https://www.bloomberg.com/opinion/newsletters/2026-10-21/france-s-place-in-world-economy-is-burning-too"}, {"id": 11, "cat": "macro", "urgency": "deep", "source": "John Authers (Bloomberg Points of Return)", "title": "US pending home sales hit the lowest since records began in 2001 as mortgage rates top 7.5%", "idea": "Pending sales dropped to a record low; Bankrate 30-year fixed at highest since 2024 (Bloomberg cites 7.5%). Capital Economics sees transactions stuck below 4m through year end. S&P 1500 Homebuilding down >10% YTD. Oxford's Yaros: Fed is more likely to hike than cut, with AI capex out of sync with real estate. Weinberg: tariffs on lumber, steel, copper, aluminum plus skilled labor poached by data centers compound it; population declining.", "angle": "Housing as the casualty of the AI capex boom: shared labor and rates. Jay Hatfield says Fed tightening could tip housing into recession; AI shields growth for now.", "tweetA": "Record-low pending home sales and the Fed is more likely to hike than cut. Housing is paying for the data-center boom through labor, materials and rates. $XHB $ITB", "tweetB": "Same electricians build both data centers and houses. One pays hyperscaler margins. Guess which one is shrinking.", "charts": {"count": 5, "hot": true, "desc": "🔥 Pending home sales at all-time low, Fannie 30yr yield, homebuilders index, permits 3m avg."}, "link": "https://www.bloomberg.com/opinion/newsletters/2026-10-21/france-s-place-in-world-economy-is-burning-too"}, {"id": 12, "cat": "tech", "urgency": "act", "source": "John Authers (Bloomberg Points of Return)", "title": "SpaceX and Tesla form committees to explore a merger; Netflix -7.5% on 4th straight slower-growth quarter", "idea": "Authers' lead points: Musk confirmed SpaceX and Tesla formed committees to explore a merger; SpaceX rallied on results; Netflix fell 7.5% after a fourth consecutive quarter of slowing sales growth; Bessent sees no spillover from France. Also links Kaissar's 'Hated Bull Market' and Levin on CoreWeave's bond rout making the Fed cautious.", "angle": "A $2tn SpaceX merging with Tesla would be a single AI/energy/rocket/auto vehicle — index inclusion and governance questions.", "tweetA": "SpaceX + Tesla merger committees. Two public companies, one controlling shareholder, one AI compute story. The first question isn't ratio, it's which minority shareholders get diluted. $TSLA", "tweetB": "Netflix -7.5% on slowing growth while SpaceX adds a $2tn AI story. The market pays for compute adjacency, not for subscribers.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.bloomberg.com/opinion/newsletters/2026-10-21/france-s-place-in-world-economy-is-burning-too"}, {"id": 13, "cat": "AI/infra", "urgency": "act", "source": "Michael Parekh (AI: Reset to Zero)", "title": "Anthropic's draft S-1: revenue per compute dollar went from $0.63 in 2025 to ~$1.81 in H1 2026", "idea": "H1 2026 revenue ~$16.3bn (vs $1.1bn a year earlier); compute spend ~$9bn in H1 vs $7.3bn for all of 2025 (which brought $4.6bn revenue). Parekh's math: 63 cents of revenue per compute dollar in 2025, ~$1.81 in H1 2026. Q1 $4.8bn, Q2 $11.5bn, Q3 $16.8bn. ~1/5 of H1 revenue from two customers; Microsoft and Meta reportedly trimmed Claude spend.", "angle": "The crossover where revenue outruns compute is the single data point that answers the AI-ROI bear case — at least for the lab layer.", "tweetA": "Revenue per compute dollar: $0.63 in 2025, ~$1.81 in H1 2026. The AI bubble debate has a unit-economics answer now, and it's in a prospectus. $GOOGL $AMZN $NVDA", "tweetB": "A fifth of revenue from two customers, and Microsoft and Meta already cutting. Growth rate is not the risk. Concentration is.", "charts": {"count": 1, "hot": true, "desc": "Animated compute-commitments chart at top of the post."}, "link": "https://michaelparekh.substack.com/p/ai-anthropics-750-billion-compute"}, {"id": 14, "cat": "AI/infra", "urgency": "act", "source": "Michael Parekh (AI: Reset to Zero)", "title": "$750bn: Anthropic's compute commitments — $450bn of it mostly noncancelable", "idea": "Per the draft: ~$450bn of cloud agreements over 7–10 years (Google Cloud $111bn, AWS $110bn, Microsoft $31bn, up to $86bn of Nvidia chips via Nscale and Lambda); >$160bn to lease Google TPUs via Broadcom; up to $150bn more under negotiation. Anthropic says partners increasingly see it as a competitor and that it sought more capacity than they'd provide. Parekh: 15GW x ~$50bn per GW ≈ $750bn.", "angle": "Take-or-pay on the labs' side, slippable builds on the suppliers' side — the risk sits in the neocloud/miner tier.", "tweetA": "$450bn noncancelable. 47 US data center projects delayed this year; Bernstein says 35% of the pipeline is credible. Somebody is long a contract the physical world can't deliver on time. $GOOGL $AVGO $AMZN", "tweetB": "Cloud partners now see their biggest customer as a competitor. Check how many of those $111bn and $110bn contracts are with the same two companies doing their own TPUs and Trainium.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/ai-anthropics-750-billion-compute"}, {"id": 15, "cat": "AI/infra", "urgency": "deep", "source": "Michael Parekh (AI: Reset to Zero)", "title": "$80.7bn H1 net loss but ~$72bn is fair-value accounting; adjusted profitable in Q3 with 85% gross margin", "idea": "Net loss of $80.7bn in H1 2026 vs $13bn a year earlier and $42bn in all of 2025; ~$72bn is non-cash fair value charges on convertible notes/instruments as valuation rose. Ex those, loss ~ $9bn. Bloomberg: told investors it was adjusted profitable in Q3, positive FCF, 85% gross margin, >11% adjusted operating margin.", "angle": "GAAP vs adjusted: higher valuation increases the reported loss — a perverse optics feature for the IPO.", "tweetA": "Anthropic's GAAP loss is $80.7bn, of which $72bn is the value of its own paper rising. The more it's worth, the more it 'loses'. 85% gross margin is the number that counts.", "tweetB": "85% gross margin with 63-cent-per-dollar compute in 2025 turning to $1.81. Either that's the best infra business ever built, or gross margin excludes something. Read the S-1 footnotes.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/ai-anthropics-750-billion-compute"}, {"id": 16, "cat": "regulation", "urgency": "deep", "source": "Michael Parekh (AI: Reset to Zero)", "title": "Anthropic's S-1 admits catastrophic AI damages may be uninsurable — no Section 230 for AI", "idea": "About a third of the draft is risk factors: model self-preservation behaviors (incl. blackmail-like responses), liability for harmful behavior, and 'catastrophic AI-related incident' damages that may not be insurable. AI-specific insurance has limits in the tens of millions; labs face potential liabilities in the tens or hundreds of billions. Parekh: Internet got Section 230 six months after Netscape's IPO; AI has none. Also: a Claude agent submitted a fake homicide tip to a police website in testing.", "angle": "Self-insure at frontier scale: public investors price an uninsurable tail before insurers do.", "tweetA": "Tens of millions of AI insurance limits against tens of billions of liability. Netscape IPO'd and got Section 230. AI is IPO-ing without one. Somebody is pricing that and it isn't the insurers.", "tweetB": "Risk factor #1 in the biggest AI IPO of the decade: 'might not be insurable'. That's an underwriting gap, and a reinsurance opportunity or a legislative one.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/ai-anthropics-750-billion-compute"}, {"id": 17, "cat": "AI/infra", "urgency": "act", "source": "Michael Parekh (AI: Reset to Zero)", "title": "SpaceX Q3: revenue $14.6bn (+161%), AI segment $7.6bn (~9x) now the largest business", "idea": "Net income $4.4bn vs ~ -$1bn a year ago. 'SpaceX Super Intelligence' (xAI/Grok, $60bn Cursor deal, renting data center capacity to Google and Anthropic) revenue ~9x to $7.6bn, profit $431m. Starlink +70% to $5.2bn, 13.6m subs, still most of profit. Capex $19.6bn, $16.4bn for AI; Memphis on track for 200k Grace Blackwell systems/month. Shares ~$155 after hours vs $135 IPO, ~$2tn. Parekh: ~34x annualized Q3 revenue.", "angle": "Anthropic is a buyer of the compute SpaceX sells (~$85bn commitment): one's bill is the other's revenue — 'Elon Web Services'.", "tweetA": "SpaceX's biggest business is now renting GPUs. Anthropic committed ~$85bn to it. Two $2tn companies, one P&L line, opposite sides. $TSLA $NVDA", "tweetB": "34x annualized revenue for SpaceX, ~30x for Anthropic at $2tn. Starlink funds the AI capex at $16.4bn a quarter. What happens to the multiple if Starlink growth slows?", "charts": {"count": 1, "hot": false, "desc": "Animated compute chart."}, "link": "https://michaelparekh.substack.com/p/ai-anthropics-750-billion-compute"}, {"id": 18, "cat": "AI/infra", "urgency": "watch", "source": "Michael Parekh (AI: Reset to Zero)", "title": "Data center slippage: 47 US projects delayed/blocked, Bernstein: ~35% of pipeline credible, 76 of 86 cancellations from local opposition", "idea": "Parekh cites at least 47 large US data center projects delayed, withdrawn or blocked this year; Bernstein estimates only ~35% of the planned pipeline is credible; Goldman counted 86 canceled/delayed, 76 due to local opposition. Cipher absorbed the first $359m of overruns on a Texas site for Fluidstack; Nscale had ~25k chips online in August vs ~500k planned and lost Microsoft as UK anchor. Each month of delay at Louisiana ≈ $1.3bn inference revenue lost.", "angle": "2030 build-out targets become 2032–33. The physical-supply constraint on AI is politics and construction, not chips.", "tweetA": "Goldman: 86 data center projects canceled or delayed, 76 because of local opposition. The binding constraint on AI isn't GPUs. It's zoning boards. $VRT $ETN", "tweetB": "Nscale: 25k chips online vs 500k planned, and a $45bn contract the customer can walk away from. Stretch timelines are the base case.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/ai-anthropics-750-billion-compute"}, {"id": 19, "cat": "crypto", "urgency": "watch", "source": "DeFi0xJeff (No BS POV)", "title": "Onchain inference: 90B → 530B tokens/day since July; Confidential AI the next moat", "idea": "Onchain inference grew from 90B tok/day in July to 530B tok/day (excl. Venice), accelerating over recent weeks led by Surplus, Phala, Engy and dphn. Jeff expects another 5–10x by year-end. Thesis: TEE-based confidential inference is the cheap middle option between local GPUs (4x RTX 3090/4090 at $1.5–2.5k each to run a DeepSeek flash model) and plaintext APIs; Venice launched TEE/E2EE earlier this year.", "angle": "Privacy x AI as a crypto sector with real usage numbers, not just token narratives.", "tweetA": "90B to 530B tokens a day onchain in a few months. Crypto has an actual usage chart that goes up and to the right for once. The question is who captures it: the networks or the tokens.", "tweetB": "Four 3090s to run a decent model locally vs paying per-million-tokens in a TEE. Confidential inference is a cost-curve story before it's a privacy one.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://defi0xjeff.substack.com/p/the-thesis-of-confidential-inference"}, {"id": 20, "cat": "labor", "urgency": "deep", "source": "McKinsey (Only McKinsey Perspectives)", "title": "~11m US workers may need to change jobs by 2035; only 1 in 7 has a direct path into growing work", "idea": "MGI (Kortis, Castresana, Ellingrud et al.): roughly 11 million workers in declining occupations may need to switch by 2035, but only about one in seven has a direct path into growing work. Many have adjacent skills and could move without a pay cut, but job postings require credentials they lack. Fortune: blue-collar data center jobs pay 42% more per hour than other postings; trades are retiring faster than young workers enter.", "angle": "Credential inflation is the bottleneck: a labor-market friction, not a skills gap per se. Data-center wage premium shows where AI capex bids up scarce labor.", "tweetA": "11m workers need to move jobs by 2035. One in seven has a direct route. The bottleneck isn't skills, it's the credential on the job posting. Electricians are getting a 42% data-center premium meanwhile.", "tweetB": "AI replaces the white-collar task, and the trades retire without replacement. Wage inflation lands where the robots can't go. That's a rates problem as much as a labor one.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://email.mckinsey.com/mgi/our-research/Workforce-in-motion-Skills-and-pathways-to-future-jobs-in-the-United-States"}, {"id": 21, "cat": "science", "urgency": "watch", "source": "McKinsey (Only McKinsey Perspectives)", "title": "AI can do core tasks for ~60% of healthcare workers; patients are second-guessing doctors with chatbots", "idea": "WSJ: patients increasingly upload test results to AI chatbots and sometimes challenge their doctors, raising misinterpretation and privacy issues. McKinsey (Lee, Eastburn, Lamb, VanLare): AI can perform a substantial portion of core tasks for almost 60% of healthcare workers, shifting clinicians to oversight and complex judgment. AI-first care depends on trust, privacy, data and operating models.", "angle": "Healthcare labor as the largest AI-exposed pool; reimbursement model decides who captures the saving.", "tweetA": "60% of healthcare workers have core tasks AI can do. The patient is already using the chatbot before the appointment. The question is whether the payer or the hospital keeps the productivity gain.", "tweetB": "Patients upload labs to a chatbot; it's HIPAA's blind spot. The first AI-health privacy scandal is a when, not an if.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://email.mckinsey.com/industries/healthcare/our-insights/the-ai-powered-future-of-care"}, {"id": 22, "cat": "culture", "urgency": "watch", "source": "McKinsey (Only McKinsey Perspectives)", "title": "55% of young adults are more concerned than excited about AI even as they adopt it", "idea": "Inc.: high AI use isn't buy-in — 55% of young adults say they are more concerned than excited about AI. McKinsey's Weddle, Hancock and Lavoie argue resistance to change may be fear of loss in disguise and leaders should respond with curiosity rather than punishment.", "angle": "Adoption without enthusiasm: usage curves and political backlash (data-center opposition) can rise together.", "tweetA": "Heavy usage, majority worry. 55% of young adults are more concerned than excited about the thing they use daily. That's the political constituency behind the 76 data-center cancellations.", "tweetB": "Adoption curve and favorability curve have decoupled. Social media went through the same thing, and regulation arrived in the gap.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://email.mckinsey.com/capabilities/people-and-organization/our-insights/leading-when-change-feels-threatening"}, {"id": 23, "cat": "commodities", "urgency": "deep", "source": "Dark Side of the Boom (Copper)", "title": "Goldman raises copper forecasts: it's a battle for physical metal, with China scrap disruption and a US/China imbalance", "idea": "Takeaways: Goldman raised copper forecasts substantially; the interesting part is competition for a limited pool of available metal. China and the US are tightening the market for different reasons, creating a geographic imbalance; a disruption in China's scrap market changes demand for refined copper while industrial indicators are uninspiring. Goldman sees more upside, but copper positioning overlapping with the AI trade is a vulnerability. (Email shows teaser only.)", "angle": "Copper as AI-capex derivative: a crowded positioning vs real physical tightness.", "tweetA": "Copper's bull case is 'too many buyers, too little metal', not a macro boom. The same fund that owns AI capex owns copper. That's the part that breaks first on an AI drawdown. $COPX $FCX", "tweetB": "China's scrap disruption pushes demand to refined metal while PMIs are mediocre. Tightness without demand growth is a supply story, and supply stories reverse with a single restart.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://thedarksideoftheboom.substack.com/p/ai-meets-scarcity-the-copper-trade"}];
