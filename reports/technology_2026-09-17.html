: "framework", "entities": ["inter-socket interconnect", "4 KB blocks", "Z-Order"], "conviction": "high", "so_what": "Large-granularity transfer as a latency-amortization strategy applies equally to multi-socket, chiplet and rack-scale fabrics — a general rule for evaluating disaggregation designs.", "quote": "The system pays the bus latency penalty exactly once to ingest a massive payload of coordinates and neighboring data points that will be consumed immediately.", "locator": "Scaling Out: Inter-Socket Mechanics And CXL Traffic Saving", "quote_verified": true}, {"claim": "Local filters acting as a structural isolator drop junk requests on the die before they cross the motherboard, preserving inter-processor bus bandwidth exclusively for actual data payloads.", "speaker": "Cristian Vasile", "type": "causal", "entities": ["inter-processor buses", "Counting Bloom Filter", "CCX", "L2 cache"], "conviction": "high", "so_what": "Filtering at the source rather than the destination is the scaling principle; it determines whether multi-socket systems degrade gracefully as core counts rise.", "quote": "Inter-processor buses remain clear of junk traffic, preserving their entire bandwidth strictly for actual data payloads.", "locator": "Simultaneously, the symbiosis between the 16 CCXs", "quote_verified": true}, {"claim": "The author asserts the future of the datacenter belongs to disaggregated architectures where RAM pools live in separate racks accessed over CXL, but flags fabric-cabling wire latency as CXL's own steep tax.", "speaker": "Cristian Vasile", "type": "prediction", "entities": ["CXL", "Compute Express Link", "memory disaggregation", "datacenter"], "conviction": "high", "so_what": "Memory disaggregation is treated as inevitable but latency-gated, meaning value accrues to whoever solves the tail-latency problem rather than to the protocol itself.", "quote": "the future of the datacenter belongs to disaggregated architectures, where massive pools of RAM are decoupled into separate racks and accessed via the Compute Express Link (CXL) protocol", "locator": "Looking further ahead, beyond the limits of the motherboard", "quote_verified": true}, {"claim": "Extending the global Counting Bloom filter to track CXL-mapped address spaces turns it into a CXL Traffic Saver that aborts a request at the silicon boundary on a predicted miss, claimed to recapture roughly 250 nanoseconds of parasitic tail latency per avoided traversal plus wattage.", "speaker": "Cristian Vasile", "type": "data_point", "entities": ["CXL", "Counting Bloom Filter", "tail latency", "250 nanoseconds"], "conviction": "medium", "so_what": "Puts a hard number on the cost of a wasted CXL round trip — the metric by which CXL memory-pooling products should be judged, since miss handling dominates pooled-memory economics.", "quote": "This mechanism instantly recaptures roughly 250 nanoseconds of parasitic tail-latency and saves significant wattage, ensuring that transactions only leave the chip via CXL when there is near-absolute probabilistic certainty of a hit.", "locator": "The request is terminated on the spot", "quote_verified": true}, {"claim": "When a CXL traversal is unavoidable, it should retrieve a full 4 KB mini-page in Z-Order layout so the physical distance penalty is paid once for a complete hypercube of analytical data.", "speaker": "Cristian Vasile", "type": "framework", "entities": ["CXL", "4 KB mini-page", "Z-Order"], "conviction": "high", "so_what": "Implies pooled CXL memory will favor page-granular, layout-aware access patterns over cache-line semantics, which shapes which workloads can actually use disaggregated memory.", "quote": null, "locator": "When a CXL traversal does occur", "quote_verified": false}]}, {"theme": "Positioning, Target Markets And Credibility", "insights": [{"claim": "The author explicitly scopes the design as a specialized processor, not a general-purpose CPU, naming seismic and oil and gas exploration, AI/ML, distributed SQL r in September 2026 to meet Donald Trump.", "speaker": "Louise Matsakis", "type": "data_point", "entities": ["Xi Jinping", "Donald Trump", "United States", "China"], "conviction": "medium", "so_what": "A concrete near-dated catalyst: any AI language in the summit readout is a tradable event for chip-export and China-tech exposure.", "quote": null, "locator": "Preliminary negotiations between the two countries", "quote_verified": false}, {"claim": "Both governments have expressed shared concern about cybersecurity threats, misuse of powerful models, and unexpected behavior from increasingly capable AI systems, giving a narrow but real overlap for incremental agreement.", "speaker": "Louise Matsakis", "type": "thesis", "entities": ["United States", "China"], "conviction": "medium", "so_what": "The realistic deal surface is technical and narrow; scope expectations to incident-reporting and misuse protocols rather than capability limits.", "quote": null, "locator": "There are plenty of reasons to be hopeful", "quote_verified": false}, {"claim": "The binding constraint on any US-China AI agreement is verification — designing a credible way for each country to confirm the other is abiding by its commitments is identified as what would move the needle most.", "speaker": "Louise Matsakis", "type": "framework", "entities": ["Michelle Nie", "United States", "China"], "conviction": "medium", "so_what": "Compute-attestation, model-auditing and datacenter-verification tooling is the underpriced picks-and-shovels play if any bilateral framework advances.", "quote": null, "locator": "“There are people who genuinely care about AI safety on both sides", "quote_verified": false}, {"claim": "A research fellow at AI safety nonprofit MATS Research argues Amodei's essay may backfire by eroding the fragile trust diplomatic talks depend on, undermining one of the few available levers for reducing the risks he claims to prioritize.", "speaker": "Louise Matsakis", "type": "contrarian", "enti rvation, which researchers say must be untangled before drawing conclusions.", "speaker": "Molly Taft", "type": "framework", "entities": ["Maine", "great white sharks", "Pine Point Beach", "Wells Beach"], "conviction": "high", "so_what": "A clean template for any data series where sensor density rises alongside the underlying phenomenon — rising detections are not automatically rising incidence.", "quote": "“There are more of them, but they are also easier to see, so you have to untangle that,”", "locator": "“There are more of them, but they are also easier to see", "quote_verified": true}, {"claim": "Ubiquitous consumer imaging hardware — iPhones and hobby drones carried to the beach by ordinary people — has become a de facto distributed marine-observation network capable of capturing high-quality footage of wildlife, and all three experts interviewed cite it as a partial explanation for the sighting surge.", "speaker": "Molly Taft", "type": "thesis", "entities": ["iPhone", "hobby drones", "Apple", "consumer drones"], "conviction": "high", "so_what": "Consumer drone and phone camera proliferation is quietly generating an environmental dataset layer; it raises baseline 'incident' counts across wildlife, safety and insurance datasets.", "quote": "more and more people bring equipment, from iPhones to hobby drones, that can capture high-quality footage of marine life", "locator": "Another indirect impact of climate change", "quote_verified": true}, {"claim": "The Maine shark monitoring program is less than a decade old and does not tag every shark, so its acoustic-telemetry baseline is too short and too incomplete to definitively attribute the sighting uptick — an admitted data-coverage gap, not a measured trend.", "speaker": "Molly Taft", "type": "data_point", "entities": ["Maine Department of Natural Resources", "Matthew Davis", "acoustic telemetry"], "conviction": "high", "so_what": "Short baselines are the recurring weakness in environmental monitoring claims; discount headline 'record' figures from programs under ten years old.", "quote": "“not every shark is tagged,”", "locator": "Maine’s state shark monitoring system uses a technology", "quote_verified": true}]}, {"theme": "Conservation lag economics", "insights": [{"claim": "Great white males take 26 years to reach adulthood and females up to 33 years, so US federal protections instated in the 1990s for both sharks and gray seals are only now producing visible adult-population effects — a roughly three-decade lag between policy and observable outcome.", "speaker": "Molly Taft", "type": "causal", "entities": ["great white sharks", "gray seals", "US federal protections"], "conviction": "high", "so_what": "Multi-decade maturation lags mean conservation policy payoffs arrive far outside typical investment or political horizons; the same lag logic applies to any slow-regenerating natural asset.", "quote": null, "locator": "Great whites males take 26 years to reach adulthood", "quote_verified": false}, {"claim": "Great white populations collapsed on both US coasts after 1975 due to overfishing, bycatch and trophy hunting, a decline explicitly linked in the article to the cultural aftermath of Steven Spielberg's Jaws.", "speaker": "Molly Taft", "type": "anecdote", "entities": ["Jaws", "Steven Spielberg", "great white sharks"], "conviction": "medium", "so_what": "Demonstrates how mass-media narrative can move a physical resource stock; a reminder that sentiment shocks have durable effects on real-world supply.", "quote": null, "locator": "When Steven Spielberg’s classic movie Jaws came out in 1975", "quote_verified": false}, {"claim": "Multiple independent studies corroborate that protections for both sharks and their gray seal prey increased populations along the US East Coast, meaning the prey-side protection was as load-bearing as the predator-side protection.", "speaker": "Molly Taft", "type": "data_point", "entities": ["gray seals", "great white sharks", "US East Coast"], "c c telemetry", "hobby drones", "iPhone", "El Niño", "Jaws", "Oregon State University"], "source_meta": {"author": "Molly Taft", "word_count": 911, "paywalled": false}}, {"record_id": "85a3e521c90d2afe", "source_type": "technology", "source_name": "Wired", "source_url": "https://www.wired.com/story/smart-nanoparticles-deliver-mrna-directly-to-tumors-in-new-cancer-therapy/", "title": "‘Smart’ Nanoparticles Deliver mRNA Directly to Tumors in New Cancer Therapy", "published_date": "2026-09-16", "language": "en", "processed_at": "2026-09-17T11:12:16Z", "processor": "claude-code-sub-opus", "tags": ["Tech"], "gist": "A University of Adelaide team led by Chunxia Zhao published in Science Advances a targeted lipid nanoparticle studded with anti-TREM2 antibodies that delivers CXCL9 mRNA plus the drug resiquimod specifically into immunosuppressive tumor-associated macrophages, reprogramming them to recruit T cells. In mice with aggressive breast cancer, three doses slowed tumor growth, raised CXCL9 roughly fourfold versus control and cut immunosuppressive macrophages by 63 percent — but combination with checkpoint inhibitors did not further shrink tumors, and no human trials have begun.", "themes": [{"theme": "Targeting as the value layer", "insights": [{"claim": "The scientific novelty is not the mRNA payload but the targeting mechanism: a standard lipid nanoparticle was studded with antibodies binding TREM2, a surface protein on immunosuppressive tumor-associated macrophages, so the payload enters only the specific cells needing reprogramming within a heterogeneous tumor.", "speaker": "Javier Carbajal", "type": "thesis", "entities": ["TREM2", "lipid nanoparticles", "tumor-associated macrophages", "University of Adelaide"], "conviction": "high", "so_what": "Delivery-and-targeting IP, not the mRNA sequence, is where defensible value sits in next-generation mRNA therapeutics — the relevant screen for LNP platform companies.", "quote": null, "locator": "The smart nanoparticles we "theme": "Format bundling beyond text", "insights": [{"claim": "The app bundles original video, vertical podcasts, narrated stories and audio playlists alongside written articles, indicating WIRED is competing for time-spent against video and audio platforms rather than only against other text publishers.", "speaker": "WIRED Staff", "type": "thesis", "entities": ["WIRED", "vertical podcasts", "narrated stories"], "conviction": "medium", "so_what": "Vertical-format podcasting as a publisher feature confirms short-form video conventions are now the default packaging for all media, including audio.", "quote": "Go beyond the article with original video, vertical podcasts, and more in the Watch tab.", "locator": "In the WIRED app, you’ll have more ways", "quote_verified": true}, {"claim": "A personalized Daily Digest is positioned as the app's primary personalization surface, framing algorithmic curation as a product feature rather than something left to external feeds.", "speaker": "WIRED Staff", "type": "data_point", "entities": ["WIRED", "Daily Digest"], "conviction": "medium", "so_what": "In-house recommendation stacks are becoming table stakes for mid-size publishers, which expands the addressable market for personalization tooling vendors.", "quote": "Make WIRED yours with a personalized Daily Digest", "locator": "Make WIRED yours with a personalized Daily Digest", "quote_verified": true}]}, {"theme": "Community as retention", "insights": [{"claim": "The app includes a comment section and live AMAs with WIRED journalists and experts, treating direct reader-to-journalist interaction as a retention mechanism rather than a moderation liability.", "speaker": "WIRED Staff", "type": "thesis", "entities": ["WIRED", "AMAs"], "conviction": "medium", "so_what": "Community features re-entering mainstream publisher products is a reversal of the 2010s comment-section shutdown trend, driven by subscription-retention math.", "quote": "Join the conversation in our comment section and participate in live AMAs with WIRED journalists and experts.", "locator": "Join the conversation in our comment section", "quote_verified": true}]}], "insight_total": 5, "top_entities": ["WIRED", "iPhone", "Android", "Daily Digest", "vertical podcasts", "AMAs"], "source_meta": {"author": "WIRED Staff", "word_count": 133, "paywalled": false}}, {"record_id": "9fb59935c514ac67", "source_type": "technology", "source_url": "https://www.wired.com/review/apple-iphone-18-pro-and-iphone-18-pro-max/", "source_name": "Wired", "title": "The iPhone 18 Pro Is for the Shutterbugs", "published_date": "2026-09-16", "language": "en", "processed_at": "2026-09-17T11:12:16Z", "processor": "claude-code-sub-opus", "tags": ["Tech", "Positioning", "AI"], "gist": "Apple shipped only Pro-tier iPhones this fall — the iPhone 18 Pro at $1,199 and 18 Pro Max at $1,299, both $100 more than last year — with no base iPhone 18 until an expected spring 2027 launch alongside a mid-tier 18e, plus a costly folding iPhone Duo next month. The headline hardware change is a four-stop variable aperture (f/1.48 to f/4) on the main camera, a feature Samsung abandoned but Huawei and Xiaomi still ship, alongside a 3x-larger vapor chamber and the A20 Pro chip.", "themes": [{"theme": "Lineup restructuring and pricing", "insights": [{"claim": "Apple released no base-model iPhone in the fall 2026 cycle, offering only the iPhone 18 Pro and 18 Pro Max plus a folding iPhone Duo arriving the following month, with the base iPhone 18 and a mid-tier iPhone 18e expected only in spring 2027.", "speaker": "Julian Chokkattu", "type": "data_point", "entities": ["Apple", "iPhone 18 Pro", "iPhone 18e", "iPhone Duo"], "conviction": "high", "so_what": "Splitting the iPhone line into two launch windows shifts revenue seasonality across fiscal quarters and changes how holiday-quarter unit comparisons should be read.", "quote": "There is no iPhone 18 this year.", "locator": "There is no iPhone 18 this year", "quote_verified": true}, {"claim": "The iPhone 18 Pro is priced at $1,199 and the 18 Pro Max at $1,299, a $100 hike over the prior year's Pro models, with the reviewer flagging price as a chief negative alongside the missing base model.", "speaker": "Julian Chokkattu", "type": "data_point", "entities": ["Apple", "iPhone 18 Pro", "iPhone 18 Pro Max"], "conviction": "high", "so_what": "A $100 Pro-tier increase alongside a delayed cheap model implies ASP expansion is the near-term iPhone revenue lever rather than unit growth.", "quote": null, "locator": "That said, if you’re a Pro connoisseur", "quote_verified": false}, {"claim": "The reviewer explicitly advises buyers of the base iPhone tier to wait rather than trade up to Pro, and tells owners of iPhone 17 Pro, 16 Pro and even 15 Pro not to upgrade — a recommendation to extend replacement cycles.", "speaker": "Julian Chokkattu", "type": "contrarian", "entities": ["Apple", "iPhone 18 Pro", "iPhone 15 Pro", "iPhone 17 Pro"], "conviction": "high", "so_what": "Enthusiast press telling three generations of owners to hold is a direct headwind to upgrade-rate assumptions in iPhone unit forecasts.", "quote": "hold onto your devices for longer!", "locator": "That said, if you’re a Pro connoisseur", "quote_verified": true}, {"claim": "The Pro models are described as being eclipsed by the spectacle of the foldable iPhone Duo, with \"Living in the iPhone Duo's shadow\" listed among the review's negatives despite a 9/10 rating.", "speaker": "Julian Chokkattu", "type": "thesis", "entities": ["Apple", "iPhone Duo", "iPhone 18 Pro"], "conviction": "medium", "so_what": "Mindshare cannibalization of the Pro slab by Apple's first foldable is an early signal that foldables will drive Apple's premium-mix narrative next cycle.", "quote": "Living in the iPhone Duo's shadow.", "locator": "TIRED", "quote_verified": true}]}, {"theme": "Variable aperture as differentiation", "insights": [{"claim": "Apple debuted a mechanical variable aperture on the iPhone 18 Pro main camera offering four selectable f-stops — f/1.48, f/1.78, f/2.8 and f/4 — versus the iPhone 17 Pro's fixed f/1.78.", "speaker": "Julian Chokkattu", "type": "data_point", "entities": ["Apple", "iPhone 18 Pro", "variable aperture"], "conviction": "high", "so_what": "Mechanical camera components re-entering flagship phones creates a new precision-actuator supply-chain line item distinct from the sensor and lens stack.", "quote": null, "locator": "Apple is debuting a variable aperture", "quote_verified": false}, {"claim": "Variable aperture is not new to smartphones — Samsung and Huawei both launched phones with it years ago, Samsung abandoned the technology, and Huawei and Xiaomi still ship it on their flagships, meaning Apple is adopting rather than inventing.", "speaker": "Julian Chokkattu", "type": "contrarian", "entities": ["Apple", "Samsung", "Huawei", "Xiaomi"], "conviction": "high", "so_what": "Apple validating a feature Chinese OEMs kept and Samsung dropped suggests Chinese flagship camera roadmaps are now a leading indicator for Apple's.", "quote": "While Samsung abandoned the tech, Huawei and Xiaomi still ship it on their flagships.", "locator": "This is by no means the first time", "quote_verified": true}, {"claim": "Real optical bokeh at f/1.48 was good enough that the reviewer stopped using Apple's computational Portrait mode entirely, indicating optics are reclaiming ground from the computational-photography stack Apple spent years building.", "speaker": "Julian Chokkattu", "type": "thesis", "entities": ["Apple", "Portrait mode", "variable aperture"], "conviction": "high", "so_what": "A partial reversal of the software-over-hardware trend in phone imaging; watch whether optics-heavy component suppliers regain BOM share versus ISP/AI silicon.", "quote": "Shooting at f/1.48 delivers a nice bokeh effect—especially in low light—so I stopped using Apple's Portrait mode altogether.", "locator": "I love it. I shoot manual on my mirrorless camera", "quote_veri rs, while still lacking the spark or versatility of rival AI assistants.", "speaker": "Julian Chokkattu", "type": "thesis", "entities": ["Apple", "Siri AI", "iOS 27", "Apple Intelligence"], "conviction": "medium", "so_what": "Apple has closed the embarrassment gap on voice assistants but not the capability gap, keeping the door open for third-party assistant integrations.", "quote": "It still doesn't quite have the spark or versatility of other AI assistants, but you might be fine with that.", "locator": "The iPhone 18 Pro models come with iOS 27", "quote_verified": true}, {"claim": "Siri AI and other Apple Intelligence features are not exclusive to the newest hardware and run on any iPhone 15 Pro or newer, removing AI as a reason to upgrade.", "speaker": "Julian Chokkattu", "type": "data_point", "entities": ["Apple", "Apple Intelligence", "Siri AI", "iPhone 15 Pro"], "conviction": "high", "so_what": "Apple is choosing installed-base AI reach over using AI to force hardware refresh — good for services attach, neutral-to-negative for near-term unit sales.", "quote": null, "locator": "Remember that Siri AI and other Apple Intelligence features", "quote_verified": false}, {"claim": "The Dynamic Island is noticeably smaller this year and now displays three simultaneous live activities — such as a DoorDash order status and an Uber ETA alongside Apple Maps navigation — up from two.", "speaker": "Julian Chokkattu", "type": "data_point", "entities": ["Apple", "Dynamic Island", "DoorDash", "Uber", "Apple Maps"], "conviction": "high", "so_what": "Expanding live-activity slots enlarges the always-visible real estate third-party apps compete for, raising the value of Live Activity integration for consumer services.", "quote": null, "locator": "The Dynamic Island, the pill-shaped bar", "quote_verified": false}]}, {"theme": "Competitive imaging and the 'authenticity' turn", "insights": [{"claim": "Against Google's Pixel 11 Pro, the iPhone 18 Pro over-brightens scenes that should ", "iPhone Duo", "Samsung", "Huawei", "Xiaomi", "Pixel 11 Pro", "Dynamic Island"], "source_meta": {"author": "Julian Chokkattu", "word_count": 1518, "paywalled": false}}, {"record_id": "b88a4009f4b1955f", "source_type": "technology", "source_name": "Wired", "source_url": "https://www.wired.com/story/boox-palma-3-announced/", "title": "Boox’s Beloved Palma E-Reader Gets Its Third Generation", "published_date": "2026-09-16", "language": "en", "processed_at": "2026-09-17T11:12:16Z", "processor": "claude-code-sub-opus", "tags": ["Tech", "Society"], "gist": "Boox announced three E Ink devices in September 2026 — the Note Air6 C and Note Mini C at $580 each and the smartphone-shaped Palma 3 at $340 — with only the Note Air6 C shipping immediately and the other two undated. All run Android 16, the two Note models share Kaleido 3 color displays and identical internals (octa-core, 6 GB RAM, 64 GB storage, microSD to 2 TB) differing only by 10.3-inch versus 8.52-inch screen size, and the Palma 3 moves to an aluminum build while being marketed as a low-stimulation second screen.", "themes": [{"theme": "Low-stimulation device category", "insights": [{"claim": "Boox markets the Palma 3 explicitly as a \"low-stimulation second screen\" rather than purely as an e-reader, positioning E Ink hardware as an antidote to smartphone attention capture.", "speaker": "Nena Farrell", "type": "thesis", "entities": ["Boox", "Palma 3", "E Ink"], "conviction": "high", "so_what": "The digital-wellbeing framing is becoming a hardware product category, not just an app feature — a durable niche demand driver for E Ink panel makers.", "quote": "Boox promotes this as a low-stimulation second screen", "locator": "Size also comes into play for Boox’s final", "quote_verified": true}, {"claim": "The Palma line's defining bet is form factor rather than display capability — a palm-sized, smartphone-shaped device with a 6.13-inch non-color E Ink screen, dual-tone front light and ambient light sensor.", "spea // ---------- helpers ----------
// YouTube-aligned hex colors for tinted insight chips (bg = color+"1a", text = color, border = color+"55").
const TYPE_HEX = {
  thesis: '#6366f1', prediction: '#0ea5e9', framework: '#8b5cf6',
  data_point: '#7c3aed', causal: '#d97706', contrarian: '#dc2626',
  anecdote: '#64748b',
};
const CONV_HEX = { high: '#7c3aed', medium: '#ca8a04', low: '#94a3b8', exploratory: '#94a3b8' };
function typeHex(t) { return TYPE_HEX[String(t || '').toLowerCase()] || '#475569'; }
function convHex(c) { return CONV_HEX[String(c || '').toLowerCase()] || '#64748b'; }

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }

// Tinted chip (YouTube style): faint bg, colored text + border.
function tintChip(text, color) {
  return `<span class="chip" style="background:${color}1a;color:${color};border-color:${color}55">${escapeHtml(text)}</span>`;
}
function tagPills(tags) {
  if (!tags || !tags.length) return '';
  return tags.map(t => `<span class="pill tag">${escapeHtml(t)}</span>`).join(' ');
}

// ---------- rendering ----------
// Insight presentation ported from the YouTube digest: type/conviction tinted
// chips, speaker as a 🗣 chip, and entities as indigo chips — all in the meta row
// directly under the claim. Quote treatment is INTENTIONALLY kept as Concepts'
// verbatim + "✓ verified" (stronger than YouTube's ≈ paraphrase wording).
function renderInsight(ins) {
  if (!ins) return '';
  const cls = 'insight' + (ins.type ? (' ' + String(ins.type).toLowerCase()) : '');
  const meta = [];
  if (ins.type) meta.push(tintChip(ins.type, typeHex(ins.type)));
  if (ins.speaker) meta.push(`<span class="chip chip-spk">🗣 ${escapeHtml(ins.speaker)}</span>`);
  if (ins.conviction) meta.push(tintChip('conviction: ' + ins.conviction, convHex(ins.conviction)));
  (ins.entities || []).slice(0, 12).forEach(e => {
    if (e) meta.push(`<span class="chip chip-ent">${escapeHtml(e)}</span>`);
  });
  let quote = '';
  if (ins.quote) {
    const v = ins.quote_verified
      ? `<span class="vmark">✓ verified</span>`
      : `<span class="vmark no">unverified</span>`;
    quote = `<div class="quote">“${escapeHtml(ins.quote)}”${v}</div>`;
  }
  const so = ins.so_what
    ? `<div class="insight-so"><span class="lbl">so what</span>${escapeHtml(ins.so_what)}</div>` : '';
  return `
    <div class="${cls}">
      <div class="insight-claim">${escapeHtml(ins.claim || '')}</div>
      <div class="insight-meta">${meta.join('')}</div>
      ${so}
      ${quote}
    </div>`;
}

function renderTheme(theme) {
  const insights = (theme.insights || []).map(renderInsight).join('');
  return `
    <div class="theme">
      <div class="theme-title">${escapeHtml(theme.theme || 'Theme')}</div>
      ${insights}
    </div>`;
}

function renderCard(card) {
  if (!card) return '';
  const meta = card.source_meta || {};
  const nameHtml = card.source_url
    ? `<a class="source-name" href="${escapeAttr(card.source_url)}" target="_blank" rel="noopener">${escapeHtml(card.source_name || '')}</a>`
    : `<span class="source-name">${escapeHtml(card.source_name || '')}</span>`;
  const subBits = [];
  if (card.published_date) subBits.push(escapeHtml(card.published_date));
  if (meta.author) subBits.push(escapeHtml(meta.author));
  if (meta.word_count) subBits.push(`${meta.word_count} words`);
  if (meta.paywalled) subBits.push('paywalled');
  const themes = (card.themes || []).map(renderTheme).join('');
  const n = card.insight_total != null ? card.insight_total
            : (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
  return `
    <div class="source">
      <div class="source-head" onclick="toggleSource(this)">
        <div class="source-meta-left">
          <div class="source-name-row">${nameHtml}</div>
          <div class="source-title">${escapeHtml(card.title || '')}</div>
          <div class="source-sub">${subBits.join('  ·  ')}</div>
        </div>
        <span class="source-count">${n} insight${n === 1 ? '' : 's'}</span>
        <span class="source-arrow">▸</span>
      </div>
      <div class="source-body">
        ${card.gist ? `<div class="gist">${escapeHtml(card.gist)}</div>` : ''}
        ${card.tags && card.tags.length ? `<div class="tags">${tagPills(card.tags)}</div>` : ''}
        ${themes || '<div class="empty">No insights.</div>'}
      </div>
    </div>`;
}

function renderTopStats(d) {
  const s = d.stats || {};
  const parts = [];
  if (d.date) parts.push(`date <strong>${escapeHtml(d.date)}</strong>`);
  if (s.lookback_days != null) parts.push(`lookback <strong>${s.lookback_days}d</strong>`);
  if (s.sources != null) parts.push(`sources <strong>${s.sources}</strong>`);
  if (s.cards != null) parts.push(`cards <strong>${s.cards}</strong>`);
  if (s.insights != null) parts.push(`insights <strong>${s.insights}</strong>`);
  if (s.quote_verified_pct != null) parts.push(`quotes verified <strong>${s.quote_verified_pct}%</strong>`);
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSource(headEl) { headEl.parentElement.classList.toggle('open'); }

function insightCount(card) {
  return (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
}

// Build the sort/filter control bar (display only — re-groups REPORT_DATA in place).
function buildControls(d) {
  const cards = d.cards || [];
  const names = [...new Set(cards.map(c => c.source_name || '—'))].sort((a, b) => a.localeCompare(b));
  const opts = names.map(n => `<option value="${escapeAttr(n)}">${escapeHtml(n)}</option>`).join('');
  document.getElementById('controls').innerHTML =
    `<label>Sort
       <select id="sortSel">
         <option value="source">Source A–Z</option>
         <option value="insights">Insight count ▼</option>
       </select></label>
     <label>Source
       <select id="srcSel">
         <option value="__all">All sources (${names.length})</option>
         ${opts}
       </select></label>
     <span class="ctl-btns">
       <button type="button" id="expandAll">Expand all</button>
       <button type="button" id="collapseAll">Collapse all</button>
     </span>`;
  document.getElementById('sortSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('srcSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('expandAll').addEventListener('click', () => setAllGroups(false));
  document.getElementById('collapseAll').addEventListener('click', () => setAllGroups(true));
}

// Group-level collapse: header click toggles one group; the control-bar buttons toggle all.
function toggleGroup(headEl) { headEl.parentElement.classList.toggle('collapsed'); }
function setAllGroups(collapsed) {
  document.querySelectorAll('.group').forEach(g => g.classList.toggle('collapsed', collapsed));
}

// Group cards by source, sort groups (and cards within), optionally filter to one source.
function renderGroups(d) {
  const sortMode = (document.getElementById('sortSel') || {}).value || 'source';
  const srcFilter = (document.getElementById('srcSel') || {}).value || '__all';
  let cards = (d.cards || []).slice();
  if (srcFilter !== '__all') cards = cards.filter(c => (c.source_name || '—') === srcFilter);

  const groups = new Map();
  cards.forEach(c => {
    const k = c.source_name || '—';
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(c);
  });
  let entries = [...groups.entries()].map(([name, cs]) => ({
    name, cards: cs, insights: cs.reduce((a, c) => a + insightCount(c), 0),
  }));
  if (sortMode === 'insights') entries.sort((a, b) => b.insights - a.insights || a.name.localeCompare(b.name));
  else entries.sort((a, b) => a.name.localeCompare(b.name));
  // Within each source group, heaviest cards first.
  entries.forEach(e => e.cards.sort((a, b) => insightCount(b) - insightCount(a)));

  const html = entries.map(e => {
    const head = `<div class="group-head" onclick="toggleGroup(this)">`
      + `<span class="group-name">${escapeHtml(e.name)}</span>`
      + `<span class="group-meta">${e.cards.length} card${e.cards.length === 1 ? '' : 's'} · ${e.insights} insights</span>`
      + `<span class="group-arrow">▾</span></div>`;
    return `<div class="group">${head}<div class="group-body">${e.cards.map(renderCard).join('')}</div></div>`;
  }).join('');

  const app = document.getElementById('app');
  app.innerHTML = html || '<div class="empty">No cards for this source.</div>';
  // Open the first two source cards by default.
  document.querySelectorAll('.source').forEach((sec, i) => { if (i < 2) sec.classList.add('open'); });
}

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  document.getElementById('stats-top').innerHTML = renderTopStats(d);
  buildControls(d);
  renderGroups(d);   // default: grouped, sorted by source A–Z
}

renderReport(REPORT_DATA);
</script>
</body>
