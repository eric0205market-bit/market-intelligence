<title>Twitter Bank Research</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root {
  --bg: #faf8f5;
  --surface: #ffffff;
  --border: #e8e4df;
  --border-light: #f0ede4;
  --text: #1a1a1a;
  --text-2: #555;
  --text-3: #8a8a8a;
  --accent: #2563eb;
  --accent-bg: #f0f5ff;
  --accent-2: #1d4ed8;
  --tag-text: #0e7490;
  --tag-bg: #e8f4f8;
  --yellow: #fff5b3;
  --yellow-border: #f0d966;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; line-height: 1.55;
       background: var(--bg); color: var(--text); }
.container { max-width: 960px; margin: 0 auto; padding: 24px 16px 80px; }

/* HEADER */
.header { display: flex; justify-content: space-between; align-items: baseline;
          border-bottom: 2px solid var(--accent); padding-bottom: 12px; margin-bottom: 20px; }
.title { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; color: var(--accent); }
.subtitle { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-3); }

/* FILTER BAR */
.filter-bar { display: none; background: var(--yellow); border: 1px solid var(--yellow-border);
              border-radius: 6px; padding: 8px 12px; margin-bottom: 16px;
              align-items: center; gap: 10px; font-size: 13px; }
.filter-bar.active { display: flex; }
.filter-bar button { font-family: inherit; font-size: 12px; background: transparent;
                     border: 1px solid var(--text); padding: 3px 10px; border-radius: 4px;
                     cursor: pointer; }
.filter-bar button:hover { background: rgba(0,0,0,0.05); }

/* SUMMARY */
.summary { background: var(--surface); border: 1px solid var(--border);
           border-left: 4px solid var(--accent); border-radius: 6px;
           padding: 16px 18px; margin-bottom: 20px; }
.summary p { margin-bottom: 8px; }
.summary p:last-child { margin-bottom: 0; }
.summary strong { font-weight: 600; }

/* SECTIONS (top-level collapsible) */
.section { background: var(--surface); border: 1px solid var(--border);
           border-radius: 6px; margin-bottom: 14px; overflow: hidden; }
.section-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px;
                background: var(--accent-bg); cursor: pointer; user-select: none;
                font-weight: 600; font-size: 13px; color: var(--accent-2); }
.section-head:hover { background: #e1ecff; }
.section-letter { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
                  min-width: 18px; }
.section-name { flex: 1; }
.section-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
                 color: var(--text-3); }
.section-arrow { font-size: 10px; transition: transform .2s; }
.section.open .section-arrow { transform: rotate(90deg); }
.section-body { display: none; padding: 6px 0; }
.section.open .section-body { display: block; }

/* TOPIC (nested collapsible inside Topics section) */
.topic { border-bottom: 1px solid var(--border-light); }
.topic:last-child { border-bottom: none; }
.topic-head { display: flex; align-items: center; gap: 10px; padding: 10px 16px;
              background: var(--accent-bg); cursor: pointer; user-select: none;
              font-size: 13px; font-weight: 600; color: var(--accent-2); }
.topic-head:hover { background: #e1ecff; }
.topic-name { flex: 1; }
.topic-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-3); }
.topic-arrow { font-size: 10px; transition: transform .2s; }
.topic.open .topic-arrow { transform: rotate(90deg); }
.topic-body { display: none; padding: 4px 0 6px; }
.topic.open .topic-body { display: block; }

/* ITEM CARDS */
.item-card { background: var(--surface); border: 1px solid var(--border);
             border-radius: 6px; padding: 12px 14px; margin: 10px 16px; }
.item-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
             flex-wrap: wrap; }
.item-author { font-weight: 600; color: var(--accent); cursor: pointer; }
.item-author:hover { text-decoration: underline; }
.item-time { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-3); }
.item-link { font-family: 'IBM Plex Mono', monospace; font-size: 11px;

.item-link:hover { text-decoration: underline; }
.item-text { font-size: 13.5px; line-height: 1.6; color: var(--text);
             white-space: pre-wrap; word-wrap: break-word; }

.data-points { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.dp-tag { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
          background: var(--tag-bg); color: var(--tag-text);
          padding: 2px 7px; border-radius: 4px; }

.charts { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.chart { width: 100%; max-width: 420px; height: auto;

.lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85);
            align-items: center; justify-content: center; z-index: 100; cursor: zoom-out; }
.lightbox.open { display: flex; }
.lightbox img { max-width: 92vw; max-height: 92vh;
                box-shadow: 0 8px 40px rgba(0,0,0,.6); }

/* LINKS */
.link-row { padding: 8px 16px; border-bottom: 1px solid var(--border-light);
            font-size: 13px; display: flex; gap: 12px; align-items: baseline; }
.link-row:last-child { border-bottom: none; }
.link-author { color: var(--text-3); min-width: 110px; cursor: pointer; }
.link-author:hover { color: var(--accent); }
.link-url { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
            color: var(--accent); text-decoration: none; word-break: break-all; flex: 1; }
.link-url:hover { text-decoration: underline; }
.link-desc { color: var(--text-2); font-size: 12px; }

/* AUTHOR FILTER STATES */
.filterable.match { background: var(--yellow); border-color: var(--yellow-border); }
.filterable.dim { opacity: 0.25; }

/* STATS BAR */
.stats { margin-top: 24px; padding: 10px 14px; background: var(--surface);
         border: 1px solid var(--border); border-radius: 6px;
         font-family: 'IBM Plex Mono', monospace; font-size: 11.5px;
         color: var(--text-2); display: flex; gap: 18px; flex-wrap: wrap; }
.stats strong { color: var(--text); font-weight: 600; }

.empty { color: var(--text-3); font-size: 13px; padding: 14px 18px; font-style: italic; }

@media (max-width: 640px) {
  .container { padding: 16px 12px 60px; }
  .item-card { margin: 8px 10px; }
  .link-row { flex-direction: column; gap: 4px; }
  .link-author { min-width: 0; }
  .header { flex-direction: column; align-items: flex-start; gap: 4px; }
  .chart { max-width: 100%; }
}
</style>

th, up from its initial 0.23% estimate, which it said “would lift the y/y rate to 3.3% from 3.1%, which is a clearly hawkish development.” For headline PCE, it is tracking 0.34% and 3.9% from a year earlier.\n\n“Our core PCE tracking estimate would meet Governor Waller’s threshold for a 50bp hike in December based on his remarks from this morning,” Bank of America said. “That helps explain the move in market pricing. We still think the Fed goes 25bp for now, but the door to a larger hike at its next meeting has opened further after today’s data.”\n\nGoldman Sachs now estimates that core PCE rose 0.35% in October, up from its 0.23% expectation before the CPI release, “corresponding to a year-over-year rate of +3.30%,” with headline PCE up 0.36%, or 3.87% from a year earlier.\n\n It said the core CPI surprise “was driven by firmer-than-expected readings in a broad set of categories,” with owners’ equivalent rent “firm for the second consecutive month” and “concentrated in the Midwest,” and motor vehicle insurance prices rebounding “after running softer this year.” Medical services rose “despite a decline in health insurance prices following the BLS’ incorporation of updated source data on insurance premiums.”", "tweet_url": "https://x.com/neilsethinew/status/2120218934074876396", "images": ["https://pbs.twimg.com/media/HWx-pbuW4AAkh16.jpg"], "created_at": "2026-11-10T18:16:00.000Z", "relayers": []}, {"author": "neilsethinew", "text": "ADP’s preliminary weekly hiring estimate (the NER Pulse) for the four weeks ending October 24th rose for a second week to +79k (+19.75k/wk), the best since the four weeks ending September 26th. In ADP’s words, “Hiring strengthened for the second week.”\n\n▪️ The four weeks ending October 17th (which we didn't get due to the monthly report last week) came in at +78k, up from +67k the week before.\n▪️ ADP made no revisions.\n▪️ The 4-week moving average though fell for a fourth week to +73.5k, the least since September 12th, as the strong late-September readings rolled out.\n▪️ The current pace works out to roughly +85.6k a month. That’s well above the Federal Reserve Board’s estimate of breakeven job growth (under 10k a month) and near the top of the St. Louis Fed’s 15k to 87k range.", "tweet_url": "https://x.com/neilsethinew/status/2120179417724915786", "images": ["https://pbs.twimg.com/media/HWxj6upW8AARng0.jpg"], "created_at": "2026-11-10T15:38:58.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "We haven't even had three months of 2% annualized core PCE inflation since Dec 2020\n\nBofA: The size and duration of the inflation miss put the onus on the Fed to return to 2.0%. \"Low 2s\" won't cut it anymore. @augurinfinity https://t.co/QIpEBGUYqS", "tweet_url": "https://x.com/MikeZaccardi/status/2120133374069153906", "images": ["https://pbs.twimg.com/media/HWw6ES9XkAAMw1-.jpg"], "created_at": "2026-11-10T12:36:01.000Z", "relayers": []}, {"author": "neilsethinew", "text": "October CPI preview: banks see core cooling, but probably not enough to stop a December hike.\n\nTuesday’s CPI is the last before the Fed’s December 8th–9th meeting. Bloomberg consensus is 0.3% for headline and 0.2% for core, after 0.65% and 0.33% in September (core’s most since April).\n\nFive bank forecasts (headline / core / core PCE):\n\n▪️ Goldman Sachs: 0.21% / 0.16% / 0.23%.\n\n▪️ Morgan Stanley: 0.19% / 0.19% / 0.22%.\n\n▪️ Bank of America: 0.17% / 0.22% / 0.23%.\n\n▪️ Barclays: 0.24% / 0.22% / 0.21%.\n\n▪️ JPMorgan: 0.25% / 0.23% / 0.23%.\n\nAll five core calls round to the 0.2% consensus, but four of five see headline below 0.3%. The core PCE readthrough is 0.21% to 0.23%, which BofA and JPMorgan say would push core PCE back up to 3.2% y/y.\n\nWhere they agree:\n▪️ Shelter should cool. Owners’ equivalent rent jumped 0.35% in September, which Morgan Stanley calls “largely noise, amplified by unusual volatility in the Midwest,” and Goldman, BofA and JPMorgan all see 0.26% to 0.3%.\n\n▪️ AI is showing up in goods prices. BofA says IT commodities added roughly 90bp to core goods’ 2.4% annualized three-month pace, and Morgan Stanley cites “AI-related price pressures.”\n\n▪️A December hike is likely. BofA says its forecast “would effectively lock in another 25bp hike,” and that it would take “an indisputably soft 0.1% m/m print” to change the Fed’s mind. Barclays sees October as “a pause, rather than a reversal.\"  JPM says \"a very\nsoft number could raise questions about a hike next month, but that is not our expectation,\" and a third straight 0.3% would challenge market pricing for only one more hike next year. Morgan Stanley expects hikes in December and March. \n\nWhere they disagree:\n▪️ Health insurance gets its semiannual source-data update. Goldman and JPMorgan see about −2.5%, BofA −0.9%, while Barclays expects a firmer run-rate.\n\n▪️ Used cars: Goldman sees −1.5% based on auction prices, BofA flat and JPMorgan +0.4%.\n\n▪️ Energy: BofA sees −0.38%, while Goldman and JPMorgan see +0.5%.", "tweet_url": "https://x.com/neilsethinew/status/2120129343896830154", "images": ["https://pbs.twimg.com/media/HWu6aOEXcAAzGuh.jpg"], "created_at": "2026-11-10T12:20:00.000Z", "relayers": []}]}, {"bank": "JPM", "theme": "JPMorgan — JPM AM chart of large market moves followed by reversals; CPI preview forecasts; Israel coalition note", "items": [{"author": "neilsethinew", "text": "@C_Barraud's Tuesday Brief has an interesting chart from JPMorgan Asset Management (via @dailychartbook): “History shows that large market moves are often followed by meaningful moves in the opposite direction.”\n\nThe data backs that up, with a catch (and scroll down further for what historically comes next):\n▪️ Nine of the 10 historical moves on JPMorgan’s chart reversed the next day. Only March 24, 2020 didn’t.\n▪️ But every one of them came with the S&P 500 already 16% to 46% below its high, consistent with typical big swings in both directions in bear markets: 17 of the 20 biggest up days since 1950 came 20% or more off the high, and none came within 10% of one.\n▪️ In that regard, a big up day isn’t an all-clear. After the 11.6% gain on October 13, 2008, the index fell another 33% over the next year.\n\nLast Thursday’s 4.4% drop started just 1.7% below the October 6 record, which is a different setup. Since 1950, a 4% one-day drop from within 5% of a record has happened only five other times:\n▪️ September 1955 (Eisenhower’s heart attack), September 1986, October 1989 (Friday-the-13th mini-crash), October 1997 (the Asian crisis) and February 2018 (Volmageddon).\n▪️ All five were higher three and six months later. Four of five were higher a year later, with 1989 the exception.\n▪️ New record closes came 39 to 228 days later, with a median of 82.\n▪️ The catch: 1989 and 2018, the two slowest to recover, both fell about 11% further along the way.\n\nAlso note this time the second big move came with a day's delay with Friday’s 0.3% gain before Monday’s 2.35% gain. The two days won back 59% of Thursday’s drop. That’s at the strong end of those five cases: 1955 won back 56% and 1997 65%, while 2018 won back only 29%. The S&P 500 is now 3.4% below its record.\n\nThe timing lesson holds: JPMorgan AM finds 7 of the 10 best days from 2005 to 2024 came within two weeks of one of the 10 worst. Selling into a shock usually means missing a rebound.\n\nAlso note it’s a small sample, so it's certainly not guaranteed.", "tweet_url": "https://x.com/neilsethinew/status/2120147149237141854", "images": ["https://pbs.twimg.com/media/HWxCu7dW4AAJwgw.jpg"], "created_at": "2026-11-10T13:30:45.000Z", "relayers": []}, {"author": "neilsethinew", "text": "October CPI preview: banks see core cooling, but probably not enough to stop a December hike.\n\nTuesday’s CPI is the last before the Fed’s December 8th–9th meeting. Bloomberg consensus is 0.3% for headline and 0.2% for core, after 0.65% and 0.33% in September (core’s most since April).\n\nFive bank forecasts (headline / core / core PCE):\n\n▪️ Goldman Sachs: 0.21% / 0.16% / 0.23%.\n\n▪️ Morgan Stanley: 0.19% / 0.19% / 0.22%.\n\n▪️ Bank of America: 0.17% / 0.22% / 0.23%.\n\n▪️ Barclays: 0.24% / 0.22% / 0.21%.\n\n▪️ JPMorgan: 0.25% / 0.23% / 0.23%.\n\nAll five core calls round to the 0.2% consensus, but four of five see headline below 0.3%. The core PCE readthrough is 0.21% to 0.23%, which BofA and JPMorgan say would push core PCE back up to 3.2% y/y.\n\nWhere they agree:\n▪️ Shelter should cool. Owners’ equivalent rent jumped 0.35% in September, which Morgan Stanley calls “largely noise, amplified by unusual volatility in the Midwest,” and Goldman, BofA and JPMorgan all see 0.26% to 0.3%.\n\n▪️ AI is showing up in goods prices. BofA says IT commodities added roughly 90bp to core goods’ 2.4% annualized three-month pace, and Morgan Stanley cites “AI-related price pressures.”\n\n▪️A December hike is likely. BofA says its forecast “would effectively lock in another 25bp hike,” and that it would take “an indisputably soft 0.1% m/m print” to change the Fed’s mind. Barclays sees October as “a pause, rather than a reversal.\"  JPM says \"a very\nsoft number could raise questions about a hike next month, but that is not our expectation,\" and a third straight 0.3% would challenge market pricing for only one more hike next year. Morgan Stanley expects hikes in December and March. \n\nWhere they disagree:\n▪️ Health insurance gets its semiannual source-data update. Goldman and JPMorgan see about −2.5%, BofA −0.9%, while Barclays expects a firmer run-rate.\n\n▪️ Used cars: Goldman sees −1.5% based on auction prices, BofA flat and JPMorgan +0.4%.\n\n▪️ Energy: BofA sees −0.38%, while Goldman and JPMorgan see +0.5%.", "tweet_url": "https://x.com/neilsethinew/status/2120129343896830154", "images": ["https://pbs.twimg.com/media/HWu6aOEXcAAzGuh.jpg"], "created_at": "2026-11-10T12:20:00.000Z", "relayers": []}, {"author": "neilsethinew", "text": "An under-the-radar story with a lot riding on it flagged in @C_Barraud’s Morning Brief: Israeli President Herzog has given Gadi Eisenkot the first shot at forming a government. That puts Netanyahu’s record tenure closer to its end than at any point in years.\n\nWhere things stand after the Oct. 27 vote:\n\n▪️ Netanyahu’s bloc won 53 seats and Eisenkot’s 48. The Arab-led parties surged to 19 (+9). Nobody got the 61 needed for a majority.\n▪️ But Eisenkot got 67 recommendations, including both Arab-led lists, vs. 46 for Netanyahu. That is why he got the mandate even though Likud is still the largest party at 27 seats.\n▪️ He has 28 days, plus a possible 14-day extension, to put a coalition together.\n\nThis is being treated by many as a binary outcome. If Eisenkot succeeds, Netanyahu and his religious-nationalist partners go to the opposition. That could come through a “national emergency government” or a minority government kept alive by outside Arab or ultra-Orthodox support. \n\nIf Eisenkot fails, the mandate likely goes back to Netanyahu. If Netanyahu can’t form a government either, Israel heads to new elections within 90 days, probably in early spring, with Netanyahu staying on as caretaker.\n\nThat’s where Netanyahu likely wins even in a stalemate. First, he remains in power throughout the process.  Second, Eisenkot’s camp was carried by two turnout surges that will be hard to repeat:\n\n▪️ Record Arab turnout, with estimates above 77% vs. roughly 53% last time.\n▪️ Tens of thousands of expat Israelis flying home to vote, since Israel has no absentee voting for ordinary citizens.\n\nA rerun a few months from now looks set up to tilt back toward Netanyahu.\n\nThe path for Eisenkot is narrow. He has set conditions aimed at the Arab parties, including recognizing Israel as a Jewish state and Hamas as a terrorist group. The ultra-Orthodox parties hold 13 seats and want draft exemptions, while equal military service was central to his campaign. Then there’s the Iran wildcard: if the US renews strikes, the pressure shifts toward a unity government with Netanyahu.\n\nTel Aviv stocks rallied about 2% in the last session before the vote, and the shekel hit a five-week high as investors priced in a change of government. Both reversed when the deadlock became clear. The shekel fell 2.2% to around 3.12/$, its weakest close in more than six months, and the TA-125 dropped 2.5%. JPMorgan had estimated the election alone could move the shekel by as much as 3%. The next six weeks decide which way that risk premium goes.", "tweet_url": "https://x.com/neilsethinew/status/2120094126712512591", "images": ["https://pbs.twimg.com/media/HWu9txnW8AAcxJX.jpg"], "created_at": "2026-11-10T10:00:03.000Z", "relayers": []}, {"author": "dailychartbook", "text": "\"History shows that large market moves are often followed by meaningful moves in the opposite direction, making it extremely difficult to time the market.\"\n\n-JPMorgan AM https://t.co/9BCqZbLb9Y", "tweet_url": "https://x.com/dailychartbook/status/2120009426551685139", "images": ["https://pbs.twimg.com/media/HWvJVsuWMAA6-lQ.jpg"], "created_at": "2026-11-10T04:23:29.000Z", "relayers": []}]}, {"bank": "Yardeni", "theme": "Yardeni — semiconductor forward P/E at 13.1, S&P 500 forward earnings at record highs, bull-market return decomposition", "items": [{"author": "neilsethinew", "text": "Ed Yardeni stays bullish on semiconductors: \n\nSoaring earnings estimates and the recent decline in stock prices have compressed [semiconductor] valuations. The industry's forward P/E has plunged to just 13.1, well below the S&P 500's 18.7 and the Information Technology sector's 18.4 (chart). \n\nHistorically, Semiconductor P/Es have tended to bottom near earnings-growth peaks and recover as earnings-growth expectations bottom and turn higher. We suspect that such a recovery could cushion stock prices as forward earnings growth moderates to more sustainable levels, with speed bumps slowing—but not derailing—the AI investment boom.", "tweet_url": "https://x.com/neilsethinew/status/2120164279575879839", "images": ["https://pbs.twimg.com/media/HWxWLRNWUAAYYuH.jpg"], "created_at": "2026-11-10T14:38:49.000Z", "relayers": []}, {"author": "dailychartbook", "text": "\"Since the bull market began on October 12, 2022, the S&amp;P 500 has risen 106.2%. Forward earnings is up 75.5%, while the forward P/E is up 22.5%\"\n\n@yardeni https://t.co/v0MHvoyF4z", "tweet_url": "https://x.com/dailychartbook/status/2120139536617361861", "images": ["https://pbs.twimg.com/media/HWw_rDdW4AA-yZo.jpg"], "created_at": "2026-11-10T13:00:30.000Z", "relayers": []}, {"author": "dailychartbook", "text": "\"Forward earnings for the S&amp;P 500, S&amp;P 400, and S&amp;P 600 all rose to record highs again last week. Earnings strength remains broad.\"\n\n@yardeni https://t.co/N4ixVOOV5d", "tweet_url": "https://x.com/dailychartbook/status/2120109045835071542", "images": ["https://pbs.twimg.com/media/HWwj8Q6XwAA9mYG.jpg"], "created_at": "2026-11-10T10:59:20.000Z", "relayers": []}]}, {"bank": "Apollo/Slok", "theme": "Apollo/Slok — negative-earnings companies outperforming, Euro capex at 10-year high", "items": [{"author": "dailychartbook", "text": "\"Something is broken in price discovery when companies with negative earnings keep outperforming companies with positive earnings\"\n\n-Torsten Slok, Apollo https://t.co/CDsanzOsN5", "tweet_url": "https://x.com/dailychartbook/status/2120131232629465522", "images": ["https://pbs.twimg.com/media/HWw4Hw0XMAAXdh4.jpg"], "created_at": "2026-11-10T12:27:30.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "T at Apollo: Euro capex is hitting a 10-year high, with spending set to jump €77B by 2028 (utilities lead at 40%, plus defense +36%, IT +78%).\n\nUnlike the US AI-driven cycle, Europe is surging in power, defense &amp; infrastructure. The industrial renaissance is going global. 🇪🇺📈 https://t.co/Sn9eqIa6dp", "tweet_url": "https://x.com/MikeZaccardi/status/2120119938408972793", "images": ["https://pbs.twimg.com/media/HWwt2VcXoAAP5hP.jpg" // ---------- helpers ----------
function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }

function renderBold(text) {
  return escapeHtml(text).replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
}

function relativeTime(iso) {
  if (!iso) return '';
  const dt = new Date(iso);
  if (isNaN(dt.getTime())) return '';
  const secs = Math.max(0, (Date.now() - dt.getTime()) / 1000);
  if (secs < 60)   return Math.floor(secs) + 's ago';
  const mins = secs / 60;
  if (mins < 60)   return Math.floor(mins) + 'm ago';
  const hrs  = mins / 60;
  if (hrs < 48)    return Math.floor(hrs) + 'h ago';
  return Math.floor(hrs / 24) + 'd ago';
}

function authorTag(name, cls = 'item-author') {
  if (!name) return '';
  return `<span class="${cls}" onclick="filterAuthor('${escapeAttr(name)}')">@${escapeHtml(name)}</span>`;
}

// ---------- rendering ----------
function renderCharts(images) {
  if (!images || !images.length) return '';
  return `<div class="charts">` + images.map(u =>
    `<img src="${escapeAttr(u)}" class="chart" loading="lazy" alt="" onclick="openLightbox('${escapeAttr(u)}')">`
  ).join('') + `</div>`;
}

function renderDataPoints(points) {
  if (!points || !points.length) return '';
  return `<div class="data-points">` + points.map(p =>
    `<span class="dp-tag">${escapeHtml(p)}</span>`
  ).join('') + `</div>`;
}

function renderRelayers(item) {
  const r = item.relayers || [];
  if (!r.length) return '';
  // gen_bank_research_report.py already puts this line into data_points.
  if ((item.data_points || []).some(p => String(p).startsWith('also carried by'))) return '';
  return `<div class="data-points"><span class="dp-tag">also carried by: ${
    r.map(a => '@' + escapeHtml(a)).join(', ')}</span></div>`;
}

function renderItem(item, preferText) {
  const author = item.author || item.author_username || '';
  const time = relativeTime(item.created_at);
  const link = item.tweet_url
    ? `<a class="item-link" href="${escapeAttr(item.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  const body = preferText ? (item.text || item.description || '')
                          : (item.description || item.text || '');
  return `
    <div class="item-card filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${authorTag(author)}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      ${body ? `<div class="item-text">${escapeHtml(body)}</div>` : ''}
      ${renderDataPoints(item.data_points)}
      ${renderRelayers(item)}
      ${renderCharts(item.images)}
    </div>`;
}

function renderTopic(topic, idx) {
  const items = (topic.items || []).map(it => renderItem(it, topic._fromBanks)).join('');
  const name = topic.topic || topic.name || `Topic ${idx + 1}`;
  return `
    <div class="topic">
      <div class="topic-head" onclick="toggleTopic(this)">
        <span class="topic-name">${escapeHtml(name)}</span>
        <span class="topic-count">${(topic.items || []).length}</span>
        <span class="topic-arrow">▸</span>
      </div>
      <div class="topic-body">${items || '<div class="empty">No items.</div>'}</div>
    </div>`;
}

function renderLink(l) {
  const author = l.author || l.author_username || '';
  const url = l.url || (l.resolved || l.tco) || '';
  return `
    <div class="link-row filterable" data-author="${escapeAttr(author).toLowerCase()}">
      ${author ? authorTag(author, 'link-author') : '<span class="link-author">—</span>'}
      <a class="link-url" href="${escapeAttr(url)}" target="_blank" rel="noopener">${escapeHtml(url)}</a>
      ${l.description ? `<span class="link-desc">${escapeHtml(l.description)}</span>` : ''}
    </div>`;
}

function renderSection(letter, name, body, count) {
  return `
    <div class="section">
      <div class="section-head" onclick="toggleSection(this)">
        <span class="section-letter">${letter}.</span>
        <span class="section-name">${escapeHtml(name)}</span>
        <span class="section-count">${count}</span>
        <span class="section-arrow">▸</span>
      </div>
      <div class="section-body">${body}</div>
    </div>`;
}

function renderSummary(text) {
  if (!text) return '';
  const paragraphs = String(text).split(/\n\n+/).filter(Boolean)
    .map(p => `<p>${renderBold(p)}</p>`).join('');
  return `<div class="summary">${paragraphs}</div>`;
}

// The bank-research routine emits `banks` [{bank, theme, items[{text,...}]}];
// older reports (and the Data template's schema) use `topics`. Render `banks`
// directly when present, else fall back to `topics`.
function reportGroups(d) {
  if (Array.isArray(d.banks) && d.banks.length) {
    return { label: 'Banks', unit: 'banks', groups: d.banks.map(b => ({
      topic: b.theme ? `${b.bank} — ${b.theme}` : (b.bank || ''),
      items: b.items || [],
      _fromBanks: true,
    })) };
  }
  return { label: 'Topics', unit: 'topics', groups: d.topics || [] };
}

function renderStats(d) {
  const parts = [];
  const cov = d.coverage || {};
  if (cov.authors_covered != null && cov.authors_total != null) {
    const pct = cov.authors_total ? (100 * cov.authors_covered / cov.authors_total) : 0;
    parts.push(`coverage <strong>${cov.authors_covered}/${cov.authors_total}</strong> (${pct.toFixed(0)}%)`);
  }
  const g = reportGroups(d);
  const topicCount = g.groups.length;
  const itemCount = g.groups.reduce((n, t) => n + (t.items || []).length, 0);
  parts.push(`${g.unit} <strong>${topicCount}</strong>`);
  parts.push(`items <strong>${itemCount}</strong>`);
  if ((d.links || []).length) parts.push(`links <strong>${d.links.length}</strong>`);
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSection(el) { el.parentElement.classList.toggle('open'); }
function toggleTopic(el)   { el.parentElement.classList.toggle('open'); }

function openLightbox(src) {
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-img').src = '';
}

let activeFilter = null;
function filterAuthor(name) {
  if (!name) return;
  activeFilter = String(name).toLowerCase();
  document.querySelectorAll('.filterable').forEach(el => {
    const a = (el.dataset.author || '').toLowerCase();
    if (a === activeFilter) { el.classList.add('match'); el.classList.remove('dim'); }
    else                    { el.classList.add('dim'); el.classList.remove('match'); }
  });
  document.getElementById('filter-name').textContent = '@' + name;
  document.getElementById('filter-bar').classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function clearFilter() {
  activeFilter = null;
  document.querySelectorAll('.filterable').forEach(el => {
    el.classList.remove('match'); el.classList.remove('dim');
  });
  document.getElementById('filter-bar').classList.remove('active');
}
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (document.getElementById('lightbox').classList.contains('open')) closeLightbox();
    else if (activeFilter) clearFilter();
  }
});

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';

  const g = reportGroups(d);
  const topicsBody = g.groups.map(renderTopic).join('')
                  || `<div class="empty">No ${g.unit}.</div>`;
  const linksBody = (d.links || []).map(renderLink).join('');

  const sections = [
    renderSummary(d.summary),
    renderSection('A', g.label, topicsBody, g.groups.length),
    linksBody ? renderSection('B', 'Link Queue', linksBody, (d.links || []).length) : '',
  ].join('');

  document.getElementById('app').innerHTML = sections || '<div class="empty">No report data.</div>';

  // Auto-open the main section and the first topic.
  document.querySelectorAll('.section').forEach((s, i) => { if (i === 0) s.classList.add('open'); });
  const firstTopic = document.querySelector('.topic');
  if (firstTopic) firstTopic.classList.add('open');

  document.getElementById('stats').innerHTML = renderStats(d);
}

renderReport(REPORT_DATA);
</script>
