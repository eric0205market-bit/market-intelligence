<script>
const ITEMS=[{"cat": "geopolitics", "urgency": "act", "source": "Fulcrum / The Pressure Point", "title": "The sanctions blacklist now has an unpublished exit ramp", "idea": "Energy Sec. Wright said sanctioned dark-fleet tankers can enter a process to ship crude legitimately again. No OFAC guidance, general license, delisting standard or eligibility criteria has been published, so it is a signal, not a removal. Fulcrum's point: a sanction with an unpublished rehabilitation process is an option held by the sanctioning government, and a delisted hull gains value purely from changed legal status.", "angle": "Sanctions turning into negotiable probation is a supply-side bearish tail for crude with WTI >$100. Watch the first delisted vessel and who the beneficial owner is.", "tweetA": "A sanctioned tanker's steel doesn't change when Treasury delists it. Its insurance, banking and port access do. Washington just told the dark fleet that legal status is a variable, with WTI above $100. Who owns the first hull to get cleaned?", "tweetB": "Sanctions were a permanent price. Now they're an option the Treasury holds on every dark-fleet owner. Options have value before they're exercised: expect shipowners to price the optionality long before a single tanker is delisted. $USO", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://pressurepoint.whatsthelatest.ai/archive/the-pressure-point-compliance-begins-after-evasion/", "id": 1}, {"cat": "energy", "urgency": "act", "source": "Fulcrum / The Pressure Point", "title": "Russian diesel waiver runs on a parallel track to enacted sanctions; Rubio gives Trump 60 days", "idea": "The administration waived a restriction to allow Russian diesel supplies; Wright called it a 'carrot' for peace, not a lifeline. Rubio said Trump may take up to 60 days (outer edge Dec 17) to decide on Congress-passed Russia sanctions. Bipartisan lawmakers oppose the diesel deal, and the timing sits before the Nov 3 midterms: fuel relief now, strategic cost later and abroad.", "angle": "A policy-driven diesel supply response caps cracks at the margin just as the market is long Hormuz risk. Midterm calendar is the real hedge ratio.", "tweetA": "The market is worried about Hormuz. Washington is solving diesel with Russian barrels before Nov 3. Two oil trades hiding in one headline: geopolitics up, policy cap on cracks. They can't both be right for long. $VLO $MPC", "tweetB": "60 days from Rubio's comment lands on Dec 17. The midterms land on Nov 3. If you think the sanctions timeline was set by foreign policy rather than the pump price, I have a bridge to sell you.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://pressurepoint.whatsthelatest.ai/archive/the-pressure-point-compliance-begins-after-evasion/", "id": 2}, {"cat": "geopolitics", "urgency": "deep", "source": "Fulcrum / The Pressure Point", "title": "Trump open to meeting Xi and Putin in China next month on nuclear weapons talks", "idea": "Buried in 'Things happen': Trump said he is open to meeting Xi Jinping and Vladimir Putin in China next month for talks on nuclear weapons and denuclearization (SCMP). Same issue contains the Russia diesel waiver and a pending sanctions decision.", "angle": "Tri-lateral optics next month would sit right on top of the sanctions-waiver and US-China trade tracks; positioning risk for energy, defense and rare earths.", "tweetA": "A Trump-Xi-Putin summit on nukes, in Beijing, one month after a Russian diesel waiver and while Russia sanctions sit on the president's desk. Read the sequence, not the headlines.", "tweetB": "Nobody is pricing a world where the US-China-Russia trio talks nukes in November while Hormuz burns. If it happens, the defense-vs-energy relative trade needs a rethink. $LMT $XLE", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://pressurepoint.whatsthelatest.ai/archive/the-pressure-point-compliance-begins-after-evasion/", "id": 3}, {"cat": "geopolitics", "urgency": "act", "source": "Fulcrum / The Pressure Point", "title": "France: Macron orders security review after police lose control in several cities", "idea": "Macron ordered a security review after French authorities underestimated nationwide protests and police lost control in several cities amid rioting and looting; resignation offers followed an intelligence failure (Fox News). Market Ear and Dark Side both show France stress hitting OAT spreads and banks the same day.", "angle": "Social unrest is the political leg of the OAT-BTP blowout. Connect to SX7E short thesis.", "tweetA": "French police lose control of several cities, OAT trades 35bp wide of BTPs, and SX7E is rolling over. That's one trade, not three headlines. $EWQ", "tweetB": "Sovereign spread blowouts usually need a fiscal story. France is adding a street-level one. Core Europe's anchor is now the risk premium.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://pressurepoint.whatsthelatest.ai/archive/the-pressure-point-compliance-begins-after-evasion/", "id": 4}, {"cat": "credit", "urgency": "deep", "source": "Fulcrum / The Pressure Point", "title": "Nuveen Private Capital crosses $100B committed; Mastercard launches Stablecoin Security", "idea": "Nuveen Private Capital passed $100B in committed capital roughly three years after combining Churchill and Arcmont. Separately, Mastercard launched 'Stablecoin Security', a risk-intelligence product with Borderless.xyz and Keyrails as initial partners.", "angle": "Private credit keeps raising while public credit screens widen. Card networks building compliance rails for stablecoins is the plumbing story.", "tweetA": "Public credit spreads are screaming. Private credit managers keep crossing $100B in commitments. Someone is wrong about the price of risk, and it won't be resolved at the quarterly mark.", "tweetB": "Mastercard shipping a risk-intelligence layer for stablecoins tells you where the incumbents think the volume goes: they're not fighting rails, they're underwriting them. $MA $CRCL", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://pressurepoint.whatsthelatest.ai/archive/the-pressure-point-compliance-begins-after-evasion/", "id": 5}, {"cat": "positioning", "urgency": "act", "source": "Dark Side of the Boom", "title": "Record ~$10B into leveraged ETFs last week, $7B in SOXL alone", "idea": "Goldman's Chris Lucas: nearly $10B flowed into leveraged ETFs, the largest weekly inflow in the dataset since 2006. ~$7B (~74%) went into SOXL (3x semis), $1.3B into TQQQ, in the same week the SOX lost ~11% and SMH fell nine sessions in a row, its longest streak in a 15-year history.", "angle": "Retail doubled down into a drawdown. Combine with the GS Prime net leverage collapse: pros de-grossing, levered retail buying. Who is on the other side of that.", "tweetA": "Hedge funds cut net leverage to the 0th percentile. Retail put $7B into 3x semis in a single week. Same tape, opposite books. One of these groups is about to learn about path dependency.", "tweetB": "$7B into SOXL after nine straight down days. A 3x product that falls 11% needs 36%+ on the underlying to get back even once you add compounding drag. 'Buy the dip' with 3x is a different trade than people think. $SOXL $SMH", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/the-ai-rubber-band-snaps-back", "id": 6}, {"cat": "credit", "urgency": "act", "source": "Dark Side of the Boom", "title": "NeoClouds barely green on the semis bounce while credit spreads widened", "idea": "SOX +2.5% (snapping an eight-day losing streak) and NDX +1%, but NeoClouds barely finished green, credit spreads widened and Treasury yields rose. The author's frame: bears were never arguing AI demand collapsed; the question is who writes the cheques and at what price. 'The market has stopped counting racks and started counting receipts.'", "angle": "Weakest links in the financing chain are the tell; use NeoCloud/CoreWeave bond yields as the read-through for the AI capex cycle.", "tweetA": "If the AI trade were truly all-clear, the leveraged NeoClouds would have ripped harder than the leaders. They didn't. Equities are repricing hope, credit is repricing duration.", "tweetB": "Expensive money, the market can live with. Reluctant money is the problem. Watch whether lenders start asking for terms on the next compute deal, not whether Meta says 'demand is strong.' $CRWV $META", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/the-ai-rubber-band-snaps-back", "id": 7}, {"cat": "energy", "urgency": "act", "source": "Dark Side of the Boom", "title": "WTI back above $100 after Iran says it has 'no choice' but to assert control of Hormuz", "idea": "Weekend flow: Saudi helicopter crash near the Yemeni border, Houthi attacks on Yanbu, two tankers reporting strikes in the Persian Gulf. WTI is back above $100 and the author calls oil the 'loose floorboard' keeping the inflation fuse burning while markets push back on near-term Fed tightening.", "angle": "Oil staying high rather than vertical is the Fed problem. Pair with CPI 3.7% and gasoline +34%.", "tweetA": "Oil doesn't need to go vertical. It needs to stay above $100 long enough for the Fed to stop pricing relief. Yanbu hit, tankers hit, Iran 'no choice.' The curve is already voting.", "tweetB": "Everyone is debating Meta's capex. Crude at $100 with Hormuz live is the macro variable that sets the discount rate for all of it.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/the-ai-rubber-band-snaps-back", "id": 8}, {"cat": "macro", "urgency": "deep", "source": "Dark Side of the Boom", "title": "KOSPI +4% in two sessions, still ~20% below where it was two weeks ago", "idea": "The author uses South Korea as the 'patient sitting up in bed and asking for water' example. SOX +2.5% after an 11.5% weekly decline; France added stress. Gold and bitcoin pushed lower in the US session while the dollar stayed flat, VIX compressed.", "angle": "A 20% two-week drawdown in a memory/semis heavy index is a true positioning event; read-through to memory and HBM supply chain.", "tweetA": "KOSPI down ~20% in two weeks and bouncing 4%. When the memory complex trades like that and nobody quotes it, you're looking at the real AI-capex stress gauge. $EWY", "tweetB": "Gold and bitcoin both fell on a risk-on day with a flat dollar. Not a flight-to-safety unwind. A liquidity unwind. Different thing.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/the-ai-rubber-band-snaps-back", "id": 9}, {"cat": "positioning", "urgency": "deep", "source": "The Market Ear", "title": "Record tech net selling; GS Prime L/S net leverage at 0th percentile five-year", "idea": "GS: Information Technology was the most net-sold sector with net selling at the highest level on record. US Fundamental L/S net leverage fell 3.2 pts to 43.7%, the biggest weekly drop since Liberation Day week (Apr '25), 4th largest in five years and 0th percentile.", "angle": "Positioning already washed out: that is the bull case to hold against the credit bear case. Both are true.", "tweetA": "Record tech net selling, net leverage at the 0th percentile. When the fundamental crowd has nothing left to sell, bad news needs to be worse than last week's. Is it?", "tweetB": "You can short credit stress or you can buy washed-out positioning. The mistake is thinking those are the same trade. $QQQ", "charts": {"count": 2, "hot": true, "desc": "GS Prime net leverage and sector net buying/selling charts"}, "link": "https://themarketear.com/posts/cwKhMKTDrZ", "id": 10}, {"cat": "macro", "urgency": "deep", "source": "The Market Ear", "title": "NDX forward P/E 20.5x, the lowest since the AI cycle began; semis 29x to 17x", "idea": "NDX forward P/E has compressed to 20.5x, lowest since 2023. NDX premium to S&P is 1.8x, the narrowest in nearly a decade. Semis forward P/E went from ~29x this summer to ~17x.", "angle": "Multiple compression of 12 turns in semis in a few months. The de-rating has done a lot of the work; what's left is the earnings estimate leg.", "tweetA": "Semis went from 29x to 17x forward in one summer. The AI trade isn't broken on multiples. It's broken on whether the E in that P/E holds when capex gets financed at higher spreads. $SOXX", "tweetB": "NDX at a 1.8x premium to the S&P, narrowest in a decade. The 'tech is expensive' tweet got retired without a funeral.", "charts": {"count": 1, "hot": true, "desc": "NDX forward P/E vs SPX premium chart (GS)"}, "link": "https://themarketear.com/posts/cx6ZDH0usK", "id": 11}, {"cat": "positioning", "urgency": "act", "source": "The Market Ear", "title": "VIX call volume second-highest in five years, only behind Aug 2, 2024", "idea": "VIX call volume surged to its second-highest level in five years, exceeded only by Aug 2, 2024, just before VIX exploded above 60 the following Monday.", "angle": "Panic hedging at record pace with VIX compressing Monday: either the hedge is working or the crowd is early.", "tweetA": "The only time VIX call volume was higher than this was the Friday before VIX hit 60. Doesn't mean it repeats. Means the crowd is positioned for it. $VIX", "tweetB": "VIX compressed on Monday while call volume sat at the second-highest in five years. Hedges bought into a bounce is the setup for a second leg or a grind. Pick your poison.", "charts": {"count": 1, "hot": false, "desc": "VIX call volume chart (GS/Bloomberg)"}, "link": "https://themarketear.com/posts/cTcJSLxk4Y", "id": 12}, {"cat": "credit", "urgency": "act", "source": "The Market Ear", "title": "NDX back at mid-September levels while CDX IG has widened dramatically; NVDA and AVGO CDS widening", "idea": "NDX is back around mid-Sept levels while CDX IG spreads have widened sharply over the same period; the second chart shows SPX vs inverted CDX IG. NVDA and AVGO CDS continue to widen and NDX has largely followed credit, at least until Monday's bounce.", "angle": "IG spreads on the AI leaders are the market's cleanest price on AI financing risk.", "tweetA": "NVDA and AVGO CDS widening is a sentence I did not expect to write this year. Equities bounced Monday. The credit desk didn't get the memo. $NVDA $AVGO", "tweetB": "SPX vs inverted CDX IG is the chart to keep. Mean-reverting credit vs trending equities has its caveats, but the gap has to close one way.", "charts": {"count": 3, "hot": true, "desc": "SPX vs inverted CDX IG; NDX vs CDX; NVDA/AVGO CDS"}, "link": "https://themarketear.com/posts/ck-w0aqPLW", "id": 13}, {"cat": "AI/infra", "urgency": "deep", "source": "The Market Ear", "title": "TS Lombard: ~80% of AI ecosystem revenue still tied to recycled capex", "idea": "TS Lombard estimates roughly 80% of AI ecosystem revenues are still tied to recycled capex rather than demand from outside the ecosystem. The open question is when genuine end-user demand catches up with the investment boom.", "angle": "The circularity number frames the credit question: 20% external demand supporting the other 80%.", "tweetA": "If 80% of AI revenue is the ecosystem paying itself, the bull case is a 20% external demand number that has to 5x. Credit markets are doing that math. Equities less so.", "tweetB": "Anthropic reporting ~$17B quarterly revenue is real demand. TS Lombard says the rest of the ecosystem is a hall of mirrors. Both can be true.", "charts": {"count": 1, "hot": false, "desc": "TS Lombard chart on recycled capex"}, "link": "https://themarketear.com/posts/cvVfuHZvhU", "id": 14}, {"cat": "positioning", "urgency": "deep", "source": "The Market Ear", "title": "Apple's two-month correlation with NDX turns negative for the first time ever", "idea": "AAPL trades near all-time highs, closing in on NVDA as the most valuable company. Forward FCF yield ~3.15%, above NDX. Its rolling two-month correlation with NDX is negative for the first time in history, a sign of flight to safety inside tech.", "angle": "AAPL as the tech bond-proxy: a hedge inside the index that is itself the index's biggest weight.", "tweetA": "Apple's correlation to the Nasdaq is negative for the first time in history. The 'safe haven' inside the AI trade is the one company that didn't build a data-center mortgage. $AAPL", "tweetB": "A 3.15% forward FCF yield on a mega-cap, above the index. When your defensive is a mega-cap tech stock, the rotation story is more fragile than it looks.", "charts": {"count": 1, "hot": false, "desc": "AAPL vs NDX correlation chart"}, "link": "https://themarketear.com/posts/cQwsaQHQrw", "id": 15}, {"cat": "credit", "urgency": "act", "source": "The Market Ear", "title": "French 10Y trades ~35bp above Italy; European banks selling off", "idea": "France's 10-year yields trade roughly 35bp above Italy; the OAT-BTP spread keeps widening, redrawing the core/periphery map, while SX7E sells off. Market Ear: no need for a full doom loop; persistent sovereign stress alone can keep pressure on banks. They stick to their bearish SX7E view.", "angle": "France-Italy inversion is a regime-change chart; ties to the street unrest in the Pressure Point.", "tweetA": "France yields 35bp more than Italy. Read that again. The anchor is now the periphery, and European banks own the paper. $SX7E", "tweetB": "A decade of 'Italy is the problem' ends with Italy as the relative safe asset. Sovereign stress in the core never trades like it does at the edge. Gap risk.", "charts": {"count": 2, "hot": true, "desc": "OAT-BTP spread; FR-IT 10Y spread vs SX7E"}, "link": "https://themarketear.com/posts/c6gyhPXtLX", "id": 16}, {"cat": "macro", "urgency": "watch", "source": "Lord Fed / Between the Lines", "title": "Bear Trap: realized gain on 10Y calls, opened a fresh bond trade", "idea": "Preview-only: Lord Fed says last week 'bonds did what I expected, stocks didn't', he realized a gain on the 10-year calls he recently shared and opened a new bond trade shortly after. Title of the post on the web: 'This is how a year-end melt-up starts'.", "angle": "Contrarian long-duration positioning with 10Y above 5%. Flagging because the web title implies a melt-up thesis.", "tweetA": "10Y above 5%, Fed hiking, oil at $100, and some people are buying bond calls for a year-end melt-up. That's either genius or a very expensive way to be early.", "tweetB": "A year-end melt-up needs yields to fall without growth collapsing. With gasoline +34% in CPI, the path runs straight through a credit event. Care what you wish for.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.lordfed.co.uk/p/this-is-how-a-year-end-melt-up-starts", "id": 17}, {"cat": "AI/infra", "urgency": "deep", "source": "Arvind Narayanan et al. / AI Snake Oil", "title": "Agent evaluation now costs tens of thousands of dollars per benchmark run", "idea": "Princeton paper 'Emerging Trends in AI Agent Evaluation': several agents on ExploitBench cost tens of thousands of dollars in credits to evaluate. Evaluators must inspect whole trajectories, and OpenAI-HuggingFace incident forensics relied on other agents with their own biases. METR's RCT found agent tools increased task completion time. Labs now release summarized rather than raw chain of thought.", "angle": "Eval cost is a moat for labs and a hidden tax for independent oversight. Important for AI safety / regulation framing and for judging benchmark claims.", "tweetA": "It costs tens of thousands of dollars to evaluate one agent on one benchmark. That makes independent verification a luxury good. Every lab benchmark chart you see is, by default, self-graded.", "tweetB": "METR's RCT: AI agent tools made developers slower. Princeton: evaluating the agents costs a fortune. The productivity story and the verification story are both under-priced.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.normaltech.ai/p/new-paper-emerging-trends-in-ai-agent", "id": 18}, {"cat": "tech", "urgency": "deep", "source": "This Week in AI", "title": "Claude Code's harness can run on local models via Ollama", "idea": "Claude Code is two systems: the model and the 'agent harness' around it. Ollama can now speak to Claude Code directly so builders swap in local models with one command (ollama launch claude...). Anthropic hasn't released weights; the harness is separable from the model.", "angle": "Decoupling harness from model is a margin story: the harness is the product, the tokens are fungible.", "tweetA": "Claude Code is a harness. The model underneath is now swappable with one command. Whoever owns the harness owns the workflow; whoever owns the model owns the bill. Different margin structures.", "tweetB": "Local models inside the best coding agent harness means token budgets get a floor. If it runs offline on 128GB, what's the cloud API's pricing power on routine tasks? $MSFT $NVDA", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.thisweekinai.ai/p/the-highs-and-lows-of-running-claude", "id": 19}, {"cat": "tech", "urgency": "deep", "source": "This Week in Startups", "title": "Same story from the TWIST side: local model in Claude Code, plus Muse Spark Open", "idea": "Same newsletter text under TWiST: Sharbel A.'s tutorial on running Claude Code with local models via Ollama; subject also references Meta's Muse Spark Open model run locally. RAM is the constraint ('provided you have the RAM').", "angle": "Local inference demand drives unified memory demand: DRAM/HBM and high-memory edge devices.", "tweetA": "The limiting factor for running frontier-ish agents locally isn't compute, it's RAM. Memory is the toll booth for the on-device AI trade. $MU $AAPL", "tweetB": "Open-weight models plus a closed harness. It's the opposite of how everyone thought the stack would split. Distribution wins again.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://twistartups.substack.com/p/the-highs-and-lows-of-running-claude", "id": 20}, {"cat": "venture", "urgency": "act", "source": "Michael Parekh / AI Ramblings Daily", "title": "Private AI markets party on while public markets worry: Anthropic S-1 imminent, valuation talk below $1.5T", "idea": "Per ARD: Morgan Stanley's private tech conference last week was packed despite public weakness; CoreWeave bond yields jumped and an Australian data center company pulled its IPO. Anthropic reported almost $17B Q3 revenue, +45%, after 140% growth the prior quarter; some investors nudged bankers toward a valuation below $1.5T, down from $2T; IPO targeted by Thanksgiving. Inference startups (Fireworks, Baseten, Fal) at billion-dollar valuations. Private debt at low-to-mid-teens rates.", "angle": "Growth decelerated from 140% to 45% QoQ and the IPO valuation is being talked down by a quarter of a trillion. Public vs private mood gap.", "tweetA": "Anthropic Q3 revenue: ~$17B, +45% QoQ after +140% the quarter before. Growth halved and the valuation chatter went from $2T to under $1.5T. Both numbers are staggering. Neither is the same story.", "tweetB": "Private AI debt costs low-to-mid teens. Public AI equity is derating. IPO window by Thanksgiving. Someone is going to mark to market.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/the-art-of-the-ai-deal-anthropic", "id": 21}, {"cat": "AI/infra", "urgency": "deep", "source": "Michael Parekh / AI Ramblings Daily", "title": "Nscale loses Microsoft as anchor for its UK site; grid power not expected until the 2030s", "idea": "UK neocloud Nscale (raising up to $3B in IPO) lost Microsoft as anchor tenant for its first UK data center in Loughton, Essex, where grid power isn't expected until the 2030s (Telegraph). Nscale says its relationship with Microsoft is unchanged. The Dark Side issue notes headlines about Nscale potentially selling up to $45B of compute to Anthropic. ARD frames the build at $10T+.", "angle": "Power connection date is the real constraint: a 2030s grid date for a 2026 data center plan. Pair with the $45B Anthropic headline.", "tweetA": "A neocloud IPO raising $3B, anchor tenant gone, grid power in the 2030s. Meanwhile a $45B Anthropic compute rumor. Same company. The AI buildout is a power-queue story with a financing wrapper.", "tweetB": "$10 trillion of data center debt meets banks charging mid-teens in private markets. That's not a demand problem. That's a cost-of-capital problem with a grid delay.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/the-art-of-the-ai-deal-anthropic", "id": 22}, {"cat": "AI/infra", "urgency": "deep", "source": "Michael Parekh / AI Ramblings Daily", "title": "Anthropic turns to lawyers to teach agents to negotiate; Project Deal and 180,000 agent negotiations", "idea": "FT: Anthropic is working with law firms on 'negotiation norms' for agents facing adversarial agents. Project Deal: 69 employees let Claude agents buy/sell belongings, 186 deals worth ~$4,000; the stronger model got better prices and many didn't notice. A Harvard professor ran 180,000+ agent negotiations, some with prompt injection to extract private info.", "angle": "Model-quality asymmetry in negotiation is a new inequality: the user with the weaker model loses silently.", "tweetA": "In Anthropic's Project Deal the stronger model got better prices and people didn't notice. Imagine that at scale: the quality of your AI is now a hidden tax or subsidy on every transaction.", "tweetB": "180,000 agent-to-agent negotiations and some tried prompt injection to steal private info. Agent commerce has a fraud problem before it has a market. $V $MA", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/the-art-of-the-ai-deal-anthropic", "id": 23}, {"cat": "geopolitics", "urgency": "deep", "source": "Michael Parekh / AI Ramblings Daily", "title": "Ex-OpenAI engineer charged with bugging an executive conference room; China-linked phishing of Anthropic exec spoof", "idea": "FBI arrested a former OpenAI engineer (Saudi national) for planting a recording device behind a TV in an executive conference room at OpenAI SF; a second device was in a bag. OpenAI used its own models to investigate and sees no sign weights or data were accessed. Proofpoint: China-linked group impersonated a senior Anthropic employee to phish AI policy experts. Labs warn staff about spies; a bug can cost under $100.", "angle": "Frontier labs are now treated like defense contractors: physical counter-surveillance, insider risk, and IPO-driven incentives for espionage.", "tweetA": "A $100 bug behind a TV in OpenAI's exec room. When labs are valued at a trillion, the cheapest alpha is a recording device. Expect TSCM to be a line item in every S-1.", "tweetB": "Frontier AI labs now face state-level espionage and are about to be public companies with disclosure obligations. How does a material security incident get disclosed when the 'asset' is weights?", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/the-art-of-the-ai-deal-anthropic", "id": 24}, {"cat": "tech", "urgency": "deep", "source": "Michael Parekh / AI Ramblings Daily", "title": "Nadella: treat every AI agent as an insider risk; Surface Laptop Ultra at $2,600-$5,900 runs frontier models locally", "idea": "Nadella told Joanna Stern Microsoft treats every agent and model as an 'insider risk': agents get their own identities and sandboxes with security software watching them; Copilot is being pulled back from many surfaces. Surface Laptop Ultra on Nvidia RTX Spark chips starts ~$2,600, top 128GB model ~$5,900; Verge: local AI still feels beta, a simple photo task takes minutes with fans at full blast.", "angle": "The local-AI hardware cycle: 128GB unified memory at $5,900 is a compute-capex substitute for token budgets.", "tweetA": "The CEO of Microsoft says: treat our AI agents as insiders and we will sell you software to watch them. That's the whole enterprise AI security market in one sentence. $MSFT", "tweetB": "$5,900 for 128GB to run last year's frontier models locally, slowly, with fans at full blast. Beta hardware today, but it caps what cloud inference can charge for the long tail. $NVDA", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/the-art-of-the-ai-deal-anthropic", "id": 25}, {"cat": "macro", "urgency": "act", "source": "Natalie Brunell / The News Block", "title": "CPI 3.7% YoY (from 3.4%), gasoline +34%, 10Y above 5%, Fed hiked in September for first time in three years", "idea": "Per The News Block: inflation reaccelerated to 3.7% from 3.4% driven by energy, with gasoline +34%. The 10-year Treasury yield is above 5%, and the Fed raised rates in September for the first time in three years, with another decision due at the end of the month. Bitcoin briefly slipped below $80,000, the first time in nearly a month.", "angle": "Inflation re-accelerating into a hiking cycle with oil >$100 and 10Y >5% is the base-rate regime for everything above.", "tweetA": "3.7% CPI, gasoline +34%, 10Y above 5%, and the Fed already hiked once. The market is arguing about AI capex while the discount rate does the actual damage.", "tweetB": "Bitcoin lost $80K the same week CPI re-accelerated. Gold and BTC fell on Monday too. The 'debasement hedge' trade is trading as a liquidity asset in a hiking cycle. $BTC", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thenewsblock.substack.com/p/news-block-the-53-million-american", "id": 26}, {"cat": "positioning", "urgency": "deep", "source": "Natalie Brunell / The News Block", "title": "Paul Tudor Jones: short stocks all of 2027, 'most negative flow picture since 2002'", "idea": "PTJ on CNBC: 2027 will be 'really, really challenging' for equities and he'll be short the whole year. His worry is flows: buybacks reverse as giant offerings follow SpaceX's from OpenAI and Anthropic to pay for chips and data centers. He puts 60-40 odds that a market crisis forces Washington to address the deficit.", "angle": "Equity supply from mega-IPOs (SpaceX, OpenAI, Anthropic) as a flow-shock thesis. Pairs with the Anthropic S-1 timeline.", "tweetA": "PTJ isn't worried about earnings. He's worried about supply: SpaceX, OpenAI, Anthropic all issuing to fund compute while buybacks fade. The most negative flow picture since 2002, in his words.", "tweetB": "Anthropic IPO by Thanksgiving, SpaceX done, OpenAI next. The market is about to absorb the largest equity supply wave since 1999-2000, and the index funds have to buy them at cap weight. $SPY", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thenewsblock.substack.com/p/news-block-the-53-million-american", "id": 27}, {"cat": "crypto", "urgency": "deep", "source": "Natalie Brunell / The News Block", "title": "MSCI non-operating company rule: Strategy, Metaplanet and Yellow Cake flagged; final list Nov 11", "idea": "MSCI finalized a rule for companies behaving like funds. Test one: >50% of assets tied to operations; Strategy fails. Five other tests; failing four of five makes a company ineligible. Test run flagged Strategy, Metaplanet and uranium holder Yellow Cake. MSCI funds hold ~3% of Strategy; JPMorgan estimates ~$2.8B forced selling. The stock fell ~12% in a week.", "angle": "Index eligibility is a new regulatory-like constraint on the digital asset treasury model; uranium holder in the same bucket.", "tweetA": "MSCI's 'non-operating company' test catches Strategy, Metaplanet and a uranium holder in the same net. Nov 11 is the date. JPM sizes the forced selling at $2.8B. The market is deciding what a company is. $MSTR", "tweetB": "Yellow Cake on the same list as Strategy tells you the rule is about holding a commodity, not bitcoin. Every physical-commodity vehicle should read the test closely. $URA", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thenewsblock.substack.com/p/news-block-the-53-million-american", "id": 28}, {"cat": "crypto", "urgency": "deep", "source": "Natalie Brunell / The News Block", "title": "Strive launches SATS preferred: 15% dividend paid every business day, upsized 40% to ~$630M", "idea": "Strive's SATS preferred pays 15% annual, paid daily. Sold at $90 against a $100 dividend base, ~17% effective. Raise upsized 40% to ~$630M. Strive holds ~35,600 BTC, up from <8,000 at the start of the year, buying ~6,100 in two weeks. Model assumes BTC compounds 50% a year through 2030. Plans to set aside 18 months of dividends, then needs cash flow, asset sales or new raises.", "angle": "A 17% yield on a BTC-backed preferred is the cost of equity in this cycle's version of structured credit; it needs 50% compounding to work.", "tweetA": "15% paid daily, effectively 17% at $90. For a preferred. Backed by an asset that pays nothing. The model needs BTC to compound 50% a year through 2030. That is not a dividend, that's a leveraged call option sold to retail. $SATS", "tweetB": "Eighteen months of dividends pre-funded, then Strive has to sell assets, raise more or make cash flow appear. Digital credit is a Ponzi-shaped question with an expiry date. Know it.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thenewsblock.substack.com/p/news-block-the-53-million-american", "id": 29}, {"cat": "culture", "urgency": "watch", "source": "Natalie Brunell / The News Block", "title": "Investopedia: the lifetime cost of the American dream is $5.3M vs ~$3.6M lifetime earnings", "idea": "A house, two kids and their college, a couple of cars, an annual vacation, healthcare and retirement total $5.3M. A typical graduate working forty years earns about $3.6M pre-tax; with twenty years of Social Security that's ~$4.1M, over $1M short, which is why families need two incomes for a lifestyle that once took one.", "angle": "Consumer affordability shows up as political risk before the midterms; the $1M gap is a clean framing for the housing and wage debate.", "tweetA": "The American dream costs $5.3M and a college graduate earns $4.1M including Social Security. The $1.2M gap is why two incomes became the minimum and why every election is about prices.", "tweetB": "Run the model with gasoline up 34% and 10Y over 5%. The dream just got less affordable at both ends: the mortgage and the commute.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thenewsblock.substack.com/p/news-block-the-53-million-american", "id": 30}, {"cat": "credit", "urgency": "deep", "source": "Haymaker", "title": "Paramount 7.875% 2030 debenture: bought at 103.5 in 2022, now 93 after leveraging up for Warner Bros/Discovery", "idea": "Haymaker exits two past bond ideas. The Paramount 7.875% due 2030, highlighted 11/7/2022 at 103 1/2, is now 93, reflecting four years of higher yields and Paramount leveraging its balance sheet to acquire Warner Brothers/Discovery. The issue still produced a decent return via coupons; other income ideas have been stellar performers.", "angle": "Media M&A funded with debt is widening credit for the acquirer; a case study in 'strategic deal' vs bondholder return.", "tweetA": "A 7.875% bond bought at 103.5 is at 93 four years later. Coupons made it a fine trade. The price is the market's opinion of a balance sheet that swallowed Warner Bros/Discovery. Acquirer bondholders pay for the strategy. $PARA", "tweetB": "Haymaker's real lesson: bond price = yield regime + issuer leverage. Four years of the first and a big dose of the second. Know which one you're being paid for.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://haymaker.substack.com/p/bond-update", "id": 31}, {"cat": "AI/infra", "urgency": "deep", "source": "Pequity Research", "title": "InP substrate expert call: market expects a 2027 supply gap and price inflection, price decline possible after H2 2027", "idea": "Preview shows the question set from an expert call on indium phosphide substrates: 2026-27 demand structure, substrate consumption per optical module, CPO's effect on InP demand, 2027 supply gap, AXT and Yunnan Germanium expansion, 6-inch yield, VB vs VGF, indium and red phosphorus supply, qualification risk with shortened cycles, and whether prices fall after H2 2027. The full answers are paywalled; the questions themselves frame the consensus.", "angle": "InP substrate is the upstream bottleneck for lasers/optical transceivers in the AI networking build; 6-inch yield and indium supply are the pressure points.", "tweetA": "Everyone talks about GPUs and optics. The real bottleneck is a 6-inch indium phosphide wafer with yield problems and a handful of suppliers. The market already assumes prices fall after H2 2027. Is that capacity or hope? $AXTI $LITE $COHR", "tweetB": "CPO could change the InP substrate per-module math. The question the industry is asking is whether silicon photonics eats demand or shifts it from modules to lasers. That's the trade. $AXTI", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://pequityresearch.substack.com/p/expert-call-inp-substrate-market", "id": 32}];
