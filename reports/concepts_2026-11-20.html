  --t-data_point: #d97706;
  --t-causal: #be185d;

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; line-height: 1.55;

             color: var(--text-2); display: flex; gap: 16px; flex-wrap: wrap; }

despite price strength signals a structural cost problem; value Norwegian salmon equities on cost trajectory, not price.", "quote": "Return on capital employed (pre tax ROCE, NOK) for leading Norwegian salmonids farmers has fallen from ~20% in 2016 to <10% during 2025 and early 2026.", "locator": "The Why", "quote_verified": true}, {"claim": "Norwegian salmon farming returns compressed over the decade to Q3 2026 because production costs rose rapidly and production became more capital intensive, outweighing positive price achievement.", "speaker": "BCG Henderson Institute", "type": "causal", "entities": ["Norwegian salmon farmers"], "conviction": "high", "so_what": "Monitor cost per kg and capital intensity per harvested kg as the key drivers of farmer ROCE.", "quote": "returns compressed due to rapidly increasing production cost and increased capital intensity of production", "locator": "Over the decade through to Q3’26", "quote_verified": true}, {"claim": "Salmon farming cost inflation over 10+ years was driven by lower input productivity (e.g. more vessels used per harvested kg), higher supplier raw material costs especially feed via FX and commodity prices, and shifting supplier economics.", "speaker": "BCG Henderson Institute", "type": "causal", "entities": ["feed", "vessels", "FX"], "conviction": "high", "so_what": "Feed commodity prices and NOK FX are key cost-side inputs to track for salmon farmer margins; supplier pricing power is rising.", "quote": "higher use of e.g. vessels per harvested kg", "locator": "The high cost inflation in the industry", "quote_verified": true}]}, {"theme": "Cyclical return recovery into 2027-2028", "insights": [{"claim": "As of Q4 2026, a return recovery for Norwegian salmon farmers into 2027 and 2028 is likely, as salmon price growth and easing biological and FX headwinds offset feed prices at all-time highs.", "speaker": "BCG Henderson Institute", "type": "prediction", "entities": ["Norwegian salmon farmers", "feed"], "conviction": "medium", "so_what": "Supports a cyclical upturn view on Norwegian salmon farmer earnings through 2028, with feed cost as the main offsetting risk.", "quote": "a return recovery into 2027 and 2028 is on the cards", "locator": "As of Q4 2026, a return recovery", "quote_verified": true}, {"claim": "The expected salmon farming recovery is driven mostly by historical investments starting to pay off, including post smolt, new vaccines against reemerging challenges, and preventive and proactive sea lice treatments, plus favorable seawater temperatures.", "speaker": "BCG Henderson Institute", "type": "causal", "entities": ["post smolt", "vaccines", "sea lice treatments"], "conviction": "medium", "so_what": "Biological improvements (lice, vaccines, post smolt) are leading indicators for mortality and cost improvements; partly weather-dependent and so not fully durable.", "quote": null, "locator": "As of Q4 2026, a return recovery", "quote_verified": false}, {"claim": "Even if the 2027-2028 salmon return recovery materializes, it will not come from fundamentally reshaped decision making, so without better operating decisions farmers risk another cycle of margin compression.", "speaker": "BCG Henderson Institute", "type": "contrarian", "entities": ["Norwegian salmon farmers"], "conviction": "medium", "so_what": "Treat the upcoming recovery as cyclical rather than structural; avoid extrapolating recovered margins absent operational change.", "quote": "If the return recovery manifests, it will not be due to farmers fundamentally reshaping decision making processes.", "locator": "If the return recovery manifests", "quote_verified": true}]}, {"theme": "Salmon farming as a digital laggard", "insights": [{"claim": "Salmonids farming still relies heavily on experience-based decision making; data volume and quality are growing rapidly but rarely analyzed to isolate outcome drivers or used in day-to-day decisions.", "speaker": "BCG Henderson Institute", "type": "thesis", "entities": ["salmonids farming"], "conviction": "high", "so_what": "Untapped operational data implies upside for farmers that operationalize analytics and for data/AI suppliers to aquaculture.", "quote": "Salmonids farming remains an industry with a high degree of experience-based decision making.", "locator": "The What", "quote_verified": true}, {"claim": "Salmonids farming lags comparable industries including other protein farming and agriculture on digitalization, where leaders already use it to reshape processing yield, feed selection, and S&OP to improve returns.", "speaker": "BCG Henderson Institute", "type": "thesis", "entities": ["protein farming", "agricultural industries"], "conviction": "medium", "so_what": "Other protein/ag sectors provide a playbook and benchmark for the productivity gains available to salmon farmers.", "quote": "Salmonids farming lag other comparable industries on digitalization", "locator": "BCG works shoulder to shoulder", "quote_verified": true}]}, {"theme": "Five decision domains worth >NOK 6/kg EBIT", "insights": [{"claim": "BCG identifies five digitalization priorities for salmon farmers: S&OP linking harvest, processing, logistics and sales; biomass planning and site outfitting; feeding and selection of roe, vaccines and feed recipes; ROI-based treatment and fish health decisions; and business process automation.", "speaker": "BCG Henderson Institute", "type": "framework", "entities": ["S&OP", "biomass planning", "feeding", "fish health", "business process automation"], "conviction": "high", "so_what": "Use as a checklist to assess which salmon farmers are digitalizing the highest-value decisions.", "quote": null, "locator": "Farmers should structure their digitalization efforts", "quote_verified": false}, {"claim": "Together, the five digitalization priorities could add more than NOK 6/kg in EBIT for salmonids farmers within three to five years.", "speaker": "BCG Henderson Institute", "type": "prediction", "entities": ["Norwegian salmon farmers"], "conviction": "medium", "so_what": "A >NOK 6/kg EBIT uplift is material to farmer margins; a quantifiable upside for operators that execute on AI-driven decisions.", "quote": "Together, these priorities hold a potential above 6 NOK/kg EBIT improvement for salmonids farmers in the coming 3 to 5 years.", "locator": "Farmers should structure their digitalization efforts", "quote_verified": true}]}, {"theme": "Buy supplier tools vs build proprietary decision support", "insights": [{"claim": "Aquaculture tech suppliers are best placed where a single data source answers the question, such as biomass monitoring, start-stop feeding via pellet detection, and preventive sea lice management, and farmers should buy these where ROI is proven.", "speaker": "BCG Henderson Institute", "type": "framework", "entities": ["biomass monitoring", "pellet detection", "sea lice management"], "conviction": "high", "so_what": "Single-data-source point solutions (biomass, feeding cameras, lice) are the commercial sweet spot for aquaculture tech vendors.", "quote": "Here, farmers should buy what they see ROI on.", "locator": "The How", "quote_verified": true}, {"claim": "The highest-impact salmon farming decisions are complex and multidisciplinary, requiring data from multiple suppliers simultaneously, so farmers must orchestrate or build decision support and automation themselves rather than rely on vendors.", "speaker": "BCG Henderson Institute", "type": "thesis", "entities": ["Norwegian salmon farmers"], "conviction": "high", "so_what": "Limits the addressable market of single-point aquaculture vendors; favors farmers with internal data/AI capabilities and integration layers.", "quote": "delivering value from digitalization comes down to improved decision making and not improved access to data", "locator": "However, delivering value from digitalization", "quote_verified": true}, {"claim": "AI is dramatically cutting the cost of building proprietary software, turning months-long te customers, then capital, then exits that recycle capital and founders — with one-way causal links (patents lead VC, exits lead capital, not vice versa). The $10B cumulative late-stage capital mark is the self-sustaining threshold; exit size ($139M vs $75M median), not count, separates fast hubs like Vilnius, São Paulo and Singapore from slow ones.", "themes": [{"theme": "Entrepreneurial Prosperity Cycle: sequence beats ingredients", "insights": [{"claim": "BCG's study of roughly 100 cities over four decades finds startup ecosystems scale about twice as fast when they build ingredients in sequence (IP/talent, then corporate customers, then capital, then exits and recycling) rather than accumulating incubators, funds and research parks.", "speaker": "BCG Henderson Institute", "type": "thesis", "entities": ["BCG"], "conviction": "high", "so_what": "Judge city/regional innovation programs by whether they address the current binding constraint, not by volume of incubators or funds launched.", "quote": "The ingredients that make up a startup ecosystem matter, but what really accelerates growth is implementing them in the right order.", "locator": "Over the past two decades, cities around", "quote_verified": true}, {"claim": "BCG's Entrepreneurial Prosperity Cycle orders ecosystem growth as: IP and talent -> corporate customers confirm demand -> early- and late-stage capital scales -> startup formation produces exits -> larger exits -> capital and founders recycle; policy and culture act as enablers.", "speaker": "BCG Henderson Institute", "type": "framework", "entities": ["Entrepreneurial Prosperity Cycle"], "conviction": "high", "so_what": "A checklist for locating where an emerging tech hub sits in its maturity curve and what comes next.", "quote": null, "locator": "In our article “Entrepreneurial Capitalism Will Be", "quote_verified": false}, {"claim": "Granger-style tests across the top 100 startup ecosystems show the causal links run one way: patents lead early-stage investment, new companies lead exits, exits lead capital — but capital does not produce patents and exits do not produce new companies.", "speaker": "BCG Henderson Institute", "type": "causal", "entities": ["patents", "venture capital"], "conviction": "high", "so_what": "Pouring VC into a city lacking commercially promising IP is unlikely to create it; capital follows innovation rather than generating it.", "quote": "On the other hand, capital did not bring patents, and exits did not bring new companies.", "locator": "We tested the links in the cycle", "quote_verified": true}, {"claim": "Ordering ecosystem-building correctly can cut the time to a self-sustaining startup ecosystem roughly in half; the fastest-maturing cities shared a willingness to build the next stage before the previous one finished paying off.", "speaker": "BCG Henderson Institute", "type": "thesis", "entities": [], "conviction": "high", "so_what": "Policy leaders can credibly promise faster maturity if they sequence investments; watch for cities shifting spend toward next-stage constraints.", "quote": "What they shared was a willingness to build the next stage before the previous one had finished paying off", "locator": "Cities have spent decades investing", "quote_verified": true}]}, {"theme": "$10B late-stage threshold and speed of maturity", "insights": [{"claim": "BCG uses $10 billion in cumulative late-stage venture round capital as the maturity threshold at which exits begin to refill the ecosystem; beyond that point exits nearly double and recycled money and founders can fund the next generation without heavy outside investment.", "speaker": "BCG Henderson Institute", "type": "framework", "entities": ["PitchBook"], "conviction": "high", "so_what": "A concrete KPI to track emerging hubs: cumulative late-stage capital raised approaching $10B signals a self-sustaining exit/recycling flywheel.", "quote": "Beyond that point, exits nearly double", "locator": "How We Identified the Fastest-Maturing Cities", "quote_verified": true}, {"claim": "Time from first $20M venture year to $10B in late-stage capital: São Paulo 16 years, Singapore 17, Silicon Valley 21, Boston roughly 32; fastest-quartile cities averaged 16.5 years versus 28.8 for the slowest.", "speaker": "BCG Henderson Institute", "type": "data_point", "entities": ["São Paulo", "Singapore", "Silicon Valley", "Boston"], "conviction": "high", "so_what": "Newer hubs are maturing faster than legacy US clusters, compressing the window for investors to enter emerging ecosystems early.", "quote": null, "locator": "We treat $10 billion in capital", "quote_verified": false}, {"claim": "Cities that reached the $10B late-stage benchmark saw GDP grow 12.1% in the following five years versus 9.1% for cities that did not.", "speaker": "BCG Henderson Institute", "type": "data_point", "entities": [], "conviction": "medium", "so_what": "Startup ecosystem maturity is a leading indicator of local/regional GDP outperformance.", "quote": "In cities that reached the benchmark, GDP grew by 12.1% in the following five years, compared to 9.1% for the rest.", "locator": "We treat $10 billion in capital", "quote_verified": true}, {"claim": "Fast-maturing ecosystems outside the StartupBlink top 30 include Vilnius (12 years), Kyiv and Hong Kong (16), Nanjing, Chennai, Guangzhou, Hyderabad, Dublin and Denver (17), Copenhagen and Melbourne (18), and Bangkok, Hamburg and Barcelona (19).", "speaker": "BCG Henderson Institute", "type": "data_point", "entities": ["Vilnius", "Kyiv", "Hong Kong", "Nanjing", "Chennai", "Guangzhou", "Hyderabad", "Dublin", "Denver", "Copenhagen", "Melbourne", "Bangkok", "Hamburg", "Barcelona", "StartupBlink"], "conviction": "medium", "so_what": "A watchlist of second-tier hubs with proven fast maturity for regional VC/growth allocation.", "quote": null, "locator": "We measured speed from the year", "quote_verified": false}, {"claim": "Jakarta, ranked 30th globally, had raised $9.8 billion in late-stage , "entities": [], "conviction": "high", "so_what": "Startup formation counts forecast exit volume up to a decade ahead.", "quote": null, "locator": "Step 4: Startup Formation Accelerates", "quote_verified": false}, {"claim": "Ecosystems stall when startup formation comes in a single wave from one incubator or funding push: early exits look healthy for years, but by the time the formation slowdown shows up in exits the city has lost unrecoverable years.", "speaker": "BCG Henderson Institute", "type": "contrarian", "entities": [], "conviction": "medium", "so_what": "Healthy near-term exit numbers can mask a thinning pipeline; track formation continuity, not just exits.", "quote": "by the time the slowdown shows up in exits, the city has lost years that it cannot recover", "locator": "An ecosystem can stall when formation", "quote_verified": true}, {"claim": "Exit size, not exit count, separates fast from slow ecosystems: the fastest-maturing cities had median exits of $139M versus $75M for the slowest, while the annual number of exits was similar.", "speaker": "BCG Henderson Institute", "type": "contrarian", "entities": [], "conviction": "high", "so_what": "Policy and investor focus should be on enabling large exits (IPO-ready markets) rather than many small ones.", "quote": "a median of $139 million versus $75 million", "locator": "Step 5: Startups Scale into Larger Exits", "quote_verified": true}, {"claim": "A doubling of exits was followed by 27% more early-stage VC and 31% more late-stage capital the following year, with the effect persisting five years.", "speaker": "BCG Henderson Institute", "type": "causal", "entities": ["venture capital"], "conviction": "high", "so_what": "Large exits/IPOs in a region are a leading indicator of the next funding wave there.", "quote": null, "locator": "Step 6: Capital and Founders Recycle", "quote_verified": false}, {"claim": "Jakarta's exchange initially could not list its tech champions (no dual-class shares, profitability-fa ropic over other foundation-model labs because its enterprise-first strategy could make it a business as large as the hyperscalers, underpinned by the safety and trust enterprises require.", "speaker": "Bessemer Venture Partners", "type": "thesis", "entities": ["Anthropic", "Bessemer Venture Partners", "hyperscalers"], "conviction": "high", "so_what": "Thesis is that enterprise trust, not consumer reach, is the scaling path for frontier labs; benchmark Anthropic's enterprise revenue mix against hyperscaler scale.", "quote": "its enterprise-first strategy had the makings of a business that could get as big as the hyperscalers, built on a foundation of safety and trust that enterprises require", "locator": "Anthropic was our choice in", "quote_verified": true}, {"claim": "Anthropic's first-mover push into developer code generation and agentic coding was a key source of its competitive edge.", "speaker": "Bessemer Venture Partners", "type": "causal", "entities": ["Anthropic", "code generation", "agentic coding"], "conviction": "high", "so_what": "Coding/agentic developer tooling is the wedge to monitor for Anthropic's revenue durability and competitive pressure from rival labs.", "quote": "Anthropic moved first to serve developers with code generation and agentic coding", "locator": "Anthropic was our choice in", "quote_verified": true}, {"claim": "Early partnerships with AWS, Google and others gave Anthropic durable distribution moats in enterprise AI.", "speaker": "Bessemer Venture Partners", "type": "causal", "entities": ["Anthropic", "AWS", "Google"], "conviction": "high", "so_what": "Cloud-marketplace distribution ties Anthropic's growth to AWS and Google; these partners' AI revenue disclosures are a read-through on Anthropic demand.", "quote": "its early partnerships with AWS, Google, and others built durable distribution moats", "locator": "Anthropic was our choice in", "quote_verified": true}, {"claim": "Safety positioning ('helpful, honest, and harmless') is c ue to offer stable and consistent leadership as AI Giants play a pivotal role in steering the pace of the frontier.", "locator": "The industry is rapidly deploying AI", "quote_verified": true}]}], "insight_total": 9, "top_entities": ["Anthropic", "Bessemer", "Dario Amodei", "Daniela Amodei", "AWS", "Google", "Byron Deeter", "Sameer Dholakia", "hyperscalers", "agentic coding"], "source_meta": {"author": "", "word_count": 1460, "paywalled": false}}, {"record_id": "6cebda6ad2e1fd1a", "source_type": "concepts", "source_name": "Chatham House", "source_url": "https://www.chathamhouse.org/2026/11/what-does-cop31-reveal-about-geopolitics-climate-change", "title": "What does COP31 reveal about the geopolitics of climate change?", "published_date": "2026-11-19", "language": "en", "processed_at": "2026-11-20T11:12:53Z", "processor": "claude-code-sub-opus", "tags": ["Geopolitics", "Energy", "Macro"], "gist": "Chatham House argues COP31 in Antalya, Turkey, though record-attended (93,000 participants), reveals a geopolitical shift: the US has fully exited the climate regime, Europe, the UK and Canada are retreating domestically and stalling climate finance, while China (29.5% of 2025 emissions) wins Global South favour by exporting clean tech. Real transition drivers, including the Iran war's boost to low-carbon tech, matter more than conference outcomes.", "themes": [{"theme": "COP31 turnout vs. eroding climate politics", "insights": [{"claim": "COP31 in Turkey drew a record 93,000 registered participants and 77 heads of state and government, even as the developed-world political right rejects climate action and corporations drop net zero targets.", "speaker": "Chatham House", "type": "data_point", "entities": ["COP31", "Turkey"], "conviction": "high", "so_what": "Summit headcount signals climate's global salience persists despite Western political retreat; don't read Western ESG pullback as global demand collapse.", "quote": "A record 93,000 participants as well as 77 heads of  the table in Antalya, a consequence of the continued influence of fossil fuel interests.", "locator": "Meanwhile the level of ambition seems", "quote_verified": true}]}, {"theme": "US exit and Trump energy dominance", "insights": [{"claim": "The US has no delegation at COP31: President Trump formally withdrew from the Paris Agreement in 2025 and from the underlying UN climate convention in 2026, following Biden's reengagement and Trump's first-term Paris exit in 2017.", "speaker": "Chatham House", "type": "data_point", "entities": ["United States", "Donald Trump", "Joe Biden", "Paris Agreement"], "conviction": "high", "so_what": "Full US exit from the UNFCCC removes the largest historical emitter from multilateral climate finance; US climate policy whipsaws with each administration.", "quote": null, "locator": "The most extreme example is the United States.", "quote_verified": false}, {"claim": "US climate policy whipsaws because it is shaped by two forces: the superpower contest with China (which briefly drove a low-carbon 'race-to-the-top' via the Inflation Reduction Act) and the US's new position as the world's leading oil and gas producer, which Trump's 'energy dominance' strategy exploits.", "speaker": "Chatham House", "type": "causal", "entities": ["United States", "China", "Inflation Reduction Act", "Donald Trump"], "conviction": "high", "so_what": "US policy favors hydrocarbons over renewables under Trump; clean-tech policy support is cyclical and tied to US-China rivalry framing.", "quote": "But policy is also influenced by the US’s newfound position as the world’s leading oil and gas producer.", "locator": "This whipsaw climate policy is influenced", "quote_verified": true}]}, {"theme": "Europe and middle powers in retreat", "insights": [{"claim": "The EU has dialled down COP31 expectations largely due to US absence; EU climate diplomat Wopke Hoestra called for a narrow focus on the electrification target and dismissed further finance talks as 'dead in the water'.", "speaker": "Chatham House", "type": "data_point", "entities": ["EU", "Wopke Hoestra", "COP31"], "conviction": "high", "so_what": "Climate finance expansion is effectively stalled among major donors; lower odds of new multilateral finance flows to emerging markets.", "quote": "dismissing any further talks on finance as ‘ dead in the water ’", "locator": "The EU, traditionally among the most ambitious", "quote_verified": true}, {"claim": "European leaders are distracted by the Russian threat: most skipped the Antalya World Leaders' Summit to attend a security-focused European Political Community meeting in Dublin.", "speaker": "Chatham House", "type": "causal", "entities": ["Europe", "Russia", "European Political Community", "Dublin"], "conviction": "medium", "so_what": "Security spending is crowding out climate in European political bandwidth; defence over decarbonization as the policy priority.", "quote": null, "locator": "Europe’s political class is also distracted", "quote_verified": false}, {"claim": "Canada and the UK pair international climate-finance pledges with domestic retreat: Canada under Mark Carney has dismantled climate policies and funded new fossil fuel infrastructure, while the UK under Andy Burnham approved new gas drilling and is considering weakening EV targets.", "speaker": "Chatham House", "type": "contrarian", "entities": ["Canada", "UK", "Mark Carney", "Andy Burnham"], "conviction": "high", "so_what": "Domestic policy tilts toward fossil supply (Canadian infrastructure, UK gas drilling) and softer EV mandates; negative for UK EV adoption pace.", "quote": "But this international positioning is paired with domestic retreat.", "locator": "Canada and the UK, positioning themselves", "quote_verified": true}, {"claim": "UK Prime Minister Andy Burnham told COP31 the climate consensus had 'gone', but this is a UK-centric view: cross-party support collapsed in Westminster while a record 75% of the global population considers climate change // ---------- helpers ----------
// YouTube-aligned hex colors for tinted insight chips (bg = color+"1a", text = color, border = color+"55").
const TYPE_HEX = {
  thesis: '#6366f1', prediction: '#0ea5e9', framework: '#8b5cf6',
  data_point: '#059669', causal: '#d97706', contrarian: '#dc2626',
  anecdote: '#64748b',
};
const CONV_HEX = { high: '#16a34a', medium: '#ca8a04', low: '#94a3b8', exploratory: '#94a3b8' };
function typeHex(t) { return TYPE_HEX[String(t || '').toLowerCase()] || '#475569'; }
function convHex(c) { return CONV_HEX[String(c || '').toLowerCase()] || '#64748b'; }

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }

// Tinted chip (YouTube style): faint bg, colored text + border.
function tintChip(text, color) {
  return `<span class="chip" style="background:${color}1a;color:${color};border-color:${color}55">${escapeHtml(text)}</span>`;
}
function tagPills(tags) {
  if (!tags || !tags.length) return '';
  return tags.map(t => `<span class="pill tag">${escapeHtml(t)}</span>`).join(' ');
}

// ---------- rendering ----------
// Insight presentation ported from the YouTube digest: type/conviction tinted
// chips, speaker as a 🗣 chip, and entities as indigo chips — all in the meta row
// directly under the claim. Quote treatment is INTENTIONALLY kept as Concepts'
// verbatim + "✓ verified" (stronger than YouTube's ≈ paraphrase wording).
function renderInsight(ins) {
  if (!ins) return '';
  const cls = 'insight' + (ins.type ? (' ' + String(ins.type).toLowerCase()) : '');
  const meta = [];
  if (ins.type) meta.push(tintChip(ins.type, typeHex(ins.type)));
  if (ins.speaker) meta.push(`<span class="chip chip-spk">🗣 ${escapeHtml(ins.speaker)}</span>`);
  if (ins.conviction) meta.push(tintChip('conviction: ' + ins.conviction, convHex(ins.conviction)));
  (ins.entities || []).slice(0, 12).forEach(e => {
    if (e) meta.push(`<span class="chip chip-ent">${escapeHtml(e)}</span>`);
  });
  let quote = '';
  if (ins.quote) {
    const v = ins.quote_verified
      ? `<span class="vmark">✓ verified</span>`
      : `<span class="vmark no">unverified</span>`;
    quote = `<div class="quote">“${escapeHtml(ins.quote)}”${v}</div>`;
  }
  const so = ins.so_what
    ? `<div class="insight-so"><span class="lbl">so what</span>${escapeHtml(ins.so_what)}</div>` : '';
  return `
    <div class="${cls}">
      <div class="insight-claim">${escapeHtml(ins.claim || '')}</div>
      <div class="insight-meta">${meta.join('')}</div>
      ${so}
      ${quote}
    </div>`;
}

function renderTheme(theme) {
  const insights = (theme.insights || []).map(renderInsight).join('');
  return `
    <div class="theme">
      <div class="theme-title">${escapeHtml(theme.theme || 'Theme')}</div>
      ${insights}
    </div>`;
}

function renderCard(card) {
  if (!card) return '';
  const meta = card.source_meta || {};
  const nameHtml = card.source_url
    ? `<a class="source-name" href="${escapeAttr(card.source_url)}" target="_blank" rel="noopener">${escapeHtml(card.source_name || '')}</a>`
    : `<span class="source-name">${escapeHtml(card.source_name || '')}</span>`;
  const subBits = [];
  if (card.published_date) subBits.push(escapeHtml(card.published_date));
  if (meta.author) subBits.push(escapeHtml(meta.author));
  if (meta.word_count) subBits.push(`${meta.word_count} words`);
  if (meta.paywalled) subBits.push('paywalled');
  const themes = (card.themes || []).map(renderTheme).join('');
  const n = card.insight_total != null ? card.insight_total
            : (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
  return `
    <div class="source">
      <div class="source-head" onclick="toggleSource(this)">
        <div class="source-meta-left">
          <div class="source-name-row">${nameHtml}</div>
          <div class="source-title">${escapeHtml(card.title || '')}</div>
          <div class="source-sub">${subBits.join('  ·  ')}</div>
        </div>
        <span class="source-count">${n} insight${n === 1 ? '' : 's'}</span>
        <span class="source-arrow">▸</span>
      </div>
      <div class="source-body">
        ${card.gist ? `<div class="gist">${escapeHtml(card.gist)}</div>` : ''}
        ${card.tags && card.tags.length ? `<div class="tags">${tagPills(card.tags)}</div>` : ''}
        ${themes || '<div class="empty">No insights.</div>'}
      </div>
    </div>`;
}

function renderTopStats(d) {
  const s = d.stats || {};
  const parts = [];
  if (d.date) parts.push(`date <strong>${escapeHtml(d.date)}</strong>`);
  if (s.lookback_days != null) parts.push(`lookback <strong>${s.lookback_days}d</strong>`);
  if (s.sources != null) parts.push(`sources <strong>${s.sources}</strong>`);
  if (s.cards != null) parts.push(`cards <strong>${s.cards}</strong>`);
  if (s.insights != null) parts.push(`insights <strong>${s.insights}</strong>`);
  if (s.quote_verified_pct != null) parts.push(`quotes verified <strong>${s.quote_verified_pct}%</strong>`);
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSource(headEl) { headEl.parentElement.classList.toggle('open'); }

function insightCount(card) {
  return (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
}

// Build the sort/filter control bar (display only — re-groups REPORT_DATA in place).
function buildControls(d) {
  const cards = d.cards || [];
  const names = [...new Set(cards.map(c => c.source_name || '—'))].sort((a, b) => a.localeCompare(b));
  const opts = names.map(n => `<option value="${escapeAttr(n)}">${escapeHtml(n)}</option>`).join('');
  document.getElementById('controls').innerHTML =
    `<label>Sort
       <select id="sortSel">
         <option value="source">Source A–Z</option>
         <option value="insights">Insight count ▼</option>
       </select></label>
     <label>Source
       <select id="srcSel">
         <option value="__all">All sources (${names.length})</option>
         ${opts}
       </select></label>
     <span class="ctl-btns">
       <button type="button" id="expandAll">Expand all</button>
       <button type="button" id="collapseAll">Collapse all</button>
     </span>`;
  document.getElementById('sortSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('srcSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('expandAll').addEventListener('click', () => setAllGroups(false));
  document.getElementById('collapseAll').addEventListener('click', () => setAllGroups(true));
}

// Group-level collapse: header click toggles one group; the control-bar buttons toggle all.
function toggleGroup(headEl) { headEl.parentElement.classList.toggle('collapsed'); }
function setAllGroups(collapsed) {
  document.querySelectorAll('.group').forEach(g => g.classList.toggle('collapsed', collapsed));
}

// Group cards by source, sort groups (and cards within), optionally filter to one source.
function renderGroups(d) {
  const sortMode = (document.getElementById('sortSel') || {}).value || 'source';
  const srcFilter = (document.getElementById('srcSel') || {}).value || '__all';
  let cards = (d.cards || []).slice();
  if (srcFilter !== '__all') cards = cards.filter(c => (c.source_name || '—') === srcFilter);

  const groups = new Map();
  cards.forEach(c => {
    const k = c.source_name || '—';
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(c);
  });
  let entries = [...groups.entries()].map(([name, cs]) => ({
    name, cards: cs, insights: cs.reduce((a, c) => a + insightCount(c), 0),
  }));
  if (sortMode === 'insights') entries.sort((a, b) => b.insights - a.insights || a.name.localeCompare(b.name));
  else entries.sort((a, b) => a.name.localeCompare(b.name));
  // Within each source group, heaviest cards first.
  entries.forEach(e => e.cards.sort((a, b) => insightCount(b) - insightCount(a)));

  const html = entries.map(e => {
    const head = `<div class="group-head" onclick="toggleGroup(this)">`
      + `<span class="group-name">${escapeHtml(e.name)}</span>`
      + `<span class="group-meta">${e.cards.length} card${e.cards.length === 1 ? '' : 's'} · ${e.insights} insights</span>`
      + `<span class="group-arrow">▾</span></div>`;
    return `<div class="group">${head}<div class="group-body">${e.cards.map(renderCard).join('')}</div></div>`;
  }).join('');

  const app = document.getElementById('app');
  app.innerHTML = html || '<div class="empty">No cards for this source.</div>';
  // Open the first two source cards by default.
  document.querySelectorAll('.source').forEach((sec, i) => { if (i < 2) sec.classList.add('open'); });
}

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  document.getElementById('stats-top').innerHTML = renderTopStats(d);
  buildControls(d);
  renderGroups(d);   // default: grouped, sorted by source A–Z
}

renderReport(REPORT_DATA);
</script>
