<title>Twitter Bank Research</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root {
  --bg: #faf8f5;
  --surface: #ffffff;
  --border: #e8e4df;
  --border-light: #f0ede4;
  --text: #1a1a1a;
  --text-2: #555;
  --text-3: #8a8a8a;
  --accent: #2563eb;
  --accent-bg: #f0f5ff;
  --accent-2: #1d4ed8;
  --tag-text: #0e7490;
  --tag-bg: #e8f4f8;
  --yellow: #fff5b3;
  --yellow-border: #f0d966;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; line-height: 1.55;
       background: var(--bg); color: var(--text); }
.container { max-width: 960px; margin: 0 auto; padding: 24px 16px 80px; }

/* HEADER */
.header { display: flex; justify-content: space-between; align-items: baseline;
          border-bottom: 2px solid var(--accent); padding-bottom: 12px; margin-bottom: 20px; }
.title { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; color: var(--accent); }
.subtitle { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-3); }

/* FILTER BAR */
.filter-bar { display: none; background: var(--yellow); border: 1px solid var(--yellow-border);
              border-radius: 6px; padding: 8px 12px; margin-bottom: 16px;
              align-items: center; gap: 10px; font-size: 13px; }
.filter-bar.active { display: flex; }
.filter-bar button { font-family: inherit; font-size: 12px; background: transparent;
                     border: 1px solid var(--text); padding: 3px 10px; border-radius: 4px;
                     cursor: pointer; }
.filter-bar button:hover { background: rgba(0,0,0,0.05); }

/* SUMMARY */
.summary { background: var(--surface); border: 1px solid var(--border);
           border-left: 4px solid var(--accent); border-radius: 6px;
           padding: 16px 18px; margin-bottom: 20px; }
.summary p { margin-bottom: 8px; }
.summary p:last-child { margin-bottom: 0; }
.summary strong { font-weight: 600; }

/* SECTIONS (top-level collapsible) */
.section { background: var(--surface); border: 1px solid var(--border);
           border-radius: 6px; margin-bottom: 14px; overflow: hidden; }
.section-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px;
                background: var(--accent-bg); cursor: pointer; user-select: none;
                font-weight: 600; font-size: 13px; color: var(--accent-2); }
.section-head:hover { background: #e1ecff; }
.section-letter { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
                  min-width: 18px; }
.section-name { flex: 1; }
.section-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
                 color: var(--text-3); }
.section-arrow { font-size: 10px; transition: transform .2s; }
.section.open .section-arrow { transform: rotate(90deg); }
.section-body { display: none; padding: 6px 0; }
.section.open .section-body { display: block; }

/* TOPIC (nested collapsible inside Topics section) */
.topic { border-bottom: 1px solid var(--border-light); }
.topic:last-child { border-bottom: none; }
.topic-head { display: flex; align-items: center; gap: 10px; padding: 10px 16px;
              background: var(--accent-bg); cursor: pointer; user-select: none;
              font-size: 13px; font-weight: 600; color: var(--accent-2); }
.topic-head:hover { background: #e1ecff; }
.topic-name { flex: 1; }
.topic-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-3); }
.topic-arrow { font-size: 10px; transition: transform .2s; }
.topic.open .topic-arrow { transform: rotate(90deg); }
.topic-body { display: none; padding: 4px 0 6px; }
.topic.open .topic-body { display: block; }

/* ITEM CARDS */
.item-card { background: var(--surface); border: 1px solid var(--border);
             border-radius: 6px; padding: 12px 14px; margin: 10px 16px; }
.item-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
             flex-wrap: wrap; }
.item-author { font-weight: 600; color: var(--accent); cursor: pointer; }
.item-author:hover { text-decoration: underline; }
.item-time { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-3); }
.item-link { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--accent); text-decoration: none; }
.item-link:hover { text-decoration: underline; }
.item-text { font-size: 13.5px; line-height: 1.6; color: var(--text);
             white-space: pre-wrap; word-wrap: break-word; }

/* DATA POINT TAGS */
.data-points { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.dp-tag { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
          background: var(--tag-bg); color: var(--tag-text);
          padding: 2px 7px; border-radius: 4px; }

/* CHARTS (large, NOT thumbnails) */
.charts { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.chart { width: 100%; max-width: 420px; height: auto;
         border: 1px solid var(--border); border-radius: 4px; cursor: zoom-in;
         background: #f0ede4; }

/* LIGHTBOX */
.lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85);
            align-items: center; justify-content: center; z-index: 100; cursor: zoom-out; }
.lightbox.open { display: flex; }
.lightbox img { max-width: 92vw; max-height: 92vh;
                box-shadow: 0 8px 40px rgba(0,0,0,.6); }

/* LINKS */
.link-row { padding: 8px 16px; border-bottom: 1px solid var(--border-light);
            font-size: 13px; display: flex; gap: 12px; align-items: baseline; }
.link-row:last-child { border-bottom: none; }
.link-author { color: var(--text-3); min-width: 110px; cursor: pointer; }
.link-author:hover { color: var(--accent); }
.link-url { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
            color: var(--accent); text-decoration: none; word-break: break-all; flex: 1; }
.link-url:hover { text-decoration: underline; }
.link-desc { color: var(--text-2); font-size: 12px; }

/* AUTHOR FILTER STATES */
.filterable.match { background: var(--yellow); border-color: var(--yellow-border); }
.filterable.dim { opacity: 0.25; }

/* STATS BAR */
.stats { margin-top: 24px; padding: 10px 14px; background: var(--surface);
         border: 1px solid var(--border); border-radius: 6px;
         font-family: 'IBM Plex Mono', monospace; font-size: 11.5px;
         color: var(--text-2); display: flex; gap: 18px; flex-wrap: wrap; }
.stats strong { color: var(--text); font-weight: 600; }

.empty { color: var(--text-3); font-size: 13px; padding: 14px 18px; font-style: italic; }

@media (max-width: 640px) {
  .container { padding: 16px 12px 60px; }
  .item-card { margin: 8px 10px; }
  .link-row { flex-direction: column; gap: 4px; }
  .link-author { min-width: 0; }
  .header { flex-direction: column; align-items: flex-start; gap: 4px; }
  .chart { max-width: 100%; }
}
</style>
</head>

<script>
const REPORT_DATA = {"report_type": "TWITTER BANK RESEARCH", "freshness_gate": "OK    data/twitter/latest/tweets_bank_research.json: collected_at 2026-11-19T06:23:21+00:00 (0.4h old), non-empty\nFRESHNESS GATE PASSED.", "collected_at": "2026-11-19T06:23:21Z", "window_days": 4, "input_stats": {"total_tweets": 120, "considered": 120, "kept": 21, "dropped": 99, "deduped": 0}, "summary": "Goldman dominates (12): 2027 S&P 500 targets (8000 YE / 8700 2027) and downside/upside scenarios, EPS concentration in top-10 names, AI EPS growth cooling, hyperscaler/AI debt issuance, IPOs, tech weight record.\nPositioning/momentum unwind recurs across Goldman and JPM: HF momentum exposure collapse, crowding at lows, GS Panic Index at 6.3/10.\nBofA November FMS: soft landing back as base case, tech overweight cut; client flows into Utilities, out of Tech.\nMacro themes: Goldman 2027 oil glut base case, Morgan Stanley-closest housing starts print, Apollo/Slok and Deutsche/Reid on AI and jobs/business formation, Yardeni tech P/E.\nCounts: Goldman 12, BofA 3, Apollo/Slok 2, Deutsche 1, JPM 1, Morgan Stanley 1, Yardeni 1 — 21 unique items across 7 banks.", "by_bank_counts": {"Goldman": 12, "BofA": 3, "Apollo/Slok": 2, "Deutsche": 1, "JPM": 1, "Morgan Stanley": 1, "Yardeni": 1}, "banks": [{"bank": "Goldman", "theme": "Goldman — 2027 S&P targets & EPS concentration, AI capex/issuance, momentum unwind, Panic Index, oil outlook, GS inflation/wage trackers", "items": [{"author": "MikeZaccardi", "text": "GS core inflation tracker: near 2.3% https://t.co/1xjom61iDW", "tweet_url": "https://x.com/MikeZaccardi/status/2123202343927685378", "images": ["https://pbs.twimg.com/media/HXchR_WWMAAYyYH.png"], "created_at": "2026-11-18T23:51:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "GS wage tracker still generally downward https://t.co/RuSz6gbSwi", "tweet_url": "https://x.com/MikeZaccardi/status/2123197310314086653", "images": ["https://pbs.twimg.com/media/HXccs_JXMAAT0hI.png"], "created_at": "2026-11-18T23:31:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "GS: We expect $440 billion of direct issuance from the hyperscalers and $545 billion of AI-related project finance debt in 2027 $LQD \n\nWe expect higher gross supply across most markets in 2027 https://t.co/2py0S6Pn5s", "tweet_url": "https://x.com/MikeZaccardi/status/2123082806351827052", "images": ["https://pbs.twimg.com/media/HXa0j-bXMAAlR04.png"], "created_at": "2026-11-18T15:56:00.000Z", "relayers": []}, {"author": "neilsethinew", "text": "Goldman from Monday afternoon, and this only went in the direction of more \"panic\" Tuesday:\n\nThe vol market has yet to turn off the \"seatbelt sign.\" Our GS Panic Index, which combines the 2y weighted percentiles of 1-month S&P implied volatility, VIX volatility, S&P 1m put-call skew, and S&P term structure slope (1m vs. 3m), currently stands at 6.3/10 - this is in the 67th percentile on a 1y lookback. \n\nThe reading has been led by VIX volatility and SPX skew which have jumped from the 12th and 38th percentiles respectively on November 11th to the 59th and 67th on a rolling 2y lookback. \n\nThe vol forecast suggests elevated volatility and more choppy conditions in the near-term.", "tweet_url": "https://x.com/neilsethinew/status/2123033479801634840", "images": ["https://pbs.twimg.com/media/HXYMMp_XcAADHy2.png"], "created_at": "2026-11-18T12:40:00.000Z", "relayers": []}, {"author": "neilsethinew", "text": "Goldman: hedge funds’ momentum exposure collapsed from about 60% at its 2026 peak to the 23rd percentile of its five-year range, and Data Center basket crowding is at the 1st percentile over six months: “the consensus winners are no longer crowded.” \n\nFuture momentum rebalances point to buying consumer and health care and selling energy and tech, “specifically, a rotation out of semis and into software.” \n\nGoldman’s High Beta TMT Momentum basket rose 125% in the first half of 2026 and is down 56% in the second.", "tweet_url": "https://x.com/neilsethinew/status/2123028446809079858", "images": ["https://pbs.twimg.com/media/HXYOie7WUAAxJjM.jpg"], "created_at": "2026-11-18T12:20:00.000Z", "relayers": [], "quoted_text": "The Week Ahead – Have We Seen the Q4 Bottom?\n\nDip buyers powered the S&amp;P 500 even as rate-hike bets nearly doubled. Now Nvidia’s first report under its interim CEO, retail sales, FOMC minutes and a score of Fed speakers put the rebound to the test.\n\nhttps://t.co/HeKgm4AJvi https://t.co/q3gujZPDRR"}, {"author": "dailychartbook", "text": "\"AI stocks' EPS growth will cool from near 90% to below 20% by 2029\"\n\nGoldman Sachs via @MikeZaccardi https://t.co/N1VIO8o1w4", "tweet_url": "https://x.com/dailychartbook/status/2123008311796637985", "images": ["https://pbs.twimg.com/media/HXZwz0FWkAAsi3H.png"], "created_at": "2026-11-18T10:59:59.000Z", "relayers": []}, {"author": "LanceRoberts", "text": "$GS is maintaining their year-end target of 8000 for the S&amp;P 500 index and have put a target of 8700 for 2027.  Those targets are expected based on continued strong earnings growth particularly from the Technology sector. \nh/t @ISABELNET_SA https://t.co/wHcklilbJG", "tweet_url": "https://x.com/LanceRoberts/status/2123006370215776651", "images": ["https://pbs.twimg.com/media/HXZuufLWMAANp3z.jpg"], "created_at": "2026-11-18T10:52:16.000Z", "relayers": []}, {"author": "neilsethinew", "text": "@C_Barraud’s Tuesday Brief included ZeroHedge’s post on Goldman’s 2027 oil outlook, “Adaption,” framed by ZH as warning of an oil glut.\n\nAnd Goldman’s base case does call for a glut. It sees Brent averaging $88/bbl in 2027 and easing to $78 by December, as a 2M bbl/day surplus lowers its fair-value estimate from about $90 today to the high $70's by end-2027. Three drivers:\n\n▪️ The market likely tipped into surplus in October already. Goldman estimates a 1.6M bbl/day surplus as Persian Gulf crude exports recovered to their 2025 average.\n▪️ Gulf output keeps climbing. Goldman sees it rising nearly 4M bbl/day from October levels in 2027, with 3.8M bbl/day of new pipeline capacity bypassing Hormuz coming online over the next year.\n▪️ Chinese demand has been scarred by the shock. Goldman thinks China’s oil demand peaked in 2025 as electric cars and trucks took share during the price spike.\n\nBut note, Goldman’s forecast is above where oil futures trade for almost every period. As of the November 13 close, 2027 Brent futures were at $81, $7 below Goldman’s $88. For the first quarter, Goldman is at $96 versus $86 in futures. For 2031 to 2035, it’s at $75 versus $67. The only period where Goldman is below the curve is 2028.\n\nPart of the reason is how fast the war premium has collapsed. Brent hit $117.64 on October 30 and is down about 21% since, to roughly $93. Goldman estimates the war risk premium in Brent fell from $27 the Friday before the midterms to “only a few dollars” last week. It calls that premium “quite low” given the geopolitical risks. Its risks are two-sided:\n\n▪️ Upside: Brent could average about $120, with peaks near $130, if renewed escalation keeps Gulf output 2.7M bbl/day below its 2025 average.\n▪️ Downside: Brent could fall into the $60's if Gulf output overshoots and the 1M bbl/day disruption allowance in Goldman’s base case doesn’t materialize.\n\nFor consumers, though, crude is expected to normalize faster than refined products. Goldman sees U.S. retail gasoline easing to $3.70/gal by end-2027 from $4.00 now, and diesel to $4.60 from $6.10.\n\nThe takeaway: Goldman sees a glut, but its price forecasts aren’t bearish relative to market pricing. After a 21% drop, Goldman’s forecasts sit above what you can lock in on the futures curve today. Goldman says traders should lean toward buying when its risk-premium estimate is small, as it is now, and suggests long summer 2027 European gasoline as a hedge against renewed escalation.", "tweet_url": "https://x.com/neilsethinew/status/2123000764570140907", "images": ["https://pbs.twimg.com/media/HXX_GW_XkAEXvND.jpg"], "created_at": "2026-11-18T10:30:00.000Z", "relayers": [], "quoted_text": "⚠  Tuesday Brief ⚠️\n\n🇺🇸 🇨🇳 🌎 U.S. Chip Curbs\n🇺🇸 Focus on U.S. Retail Sales and Nvidia Earnings \n🇬🇧 U.K. Payrolls Fell Unexpectedly\n...\n\nhttps://t.co/oDLaLYV8eh"}, {"author": "MikeZaccardi", "text": "IPOs.. fewer.. but big ones (GS) https://t.co/4AAuGVzRG6", "tweet_url": "https://x.com/MikeZaccardi/status/2122861346945376440", "images": ["https://pbs.twimg.com/media/HXXrJWJWEAAST50.png"], "created_at": "2026-11-18T01:16:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "GS: The weight of technology in the S&amp;P 500 has climbed to a record high... obv in retreat in the last 6 weeks https://t.co/4NjBgah662", "tweet_url": "https://x.com/MikeZaccardi/status/2122853801208005023", "images": ["https://pbs.twimg.com/media/HXXkSBTXgAAMIpb.png"], "created_at": "2026-11-18T00:46:01.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "GS: S&amp;P 500 earnings growth remains heavily concentrated, with the top 10 contributors projected to drive two-thirds of 2027 EPS growth—led by NVIDIA alone at nearly 25%. https://t.co/P88TL13IVS", "tweet_url": "https://x.com/MikeZaccardi/status/2122846247564234842", "images": ["https://pbs.twimg.com/media/HXXdabXXwAEYt7b.jpg"], "created_at": "2026-11-18T00:16:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "GS: Equities face 2027 downside if 2028 earnings falter. \n\nThough AI capex and semiconductor margins drive volatility, a return to historical P/E and trend EPS could drop the S&amp;P 500 25% to 5,600, while strong productivity or lower rates could push it up 27% to 9,400. https://t.co/CYrvXvjyrm", "tweet_url": "https://x.com/MikeZaccardi/status/2122838697808703497", "images": ["https://pbs.twimg.com/media/HXXWi-OW0AAO0KR.png"], "created_at": "2026-11-17T23:46:00.000Z", "relayers": []}]}, {"bank": "BofA", "theme": "BofA — November FMS macro expectations, client sector flows (Utilities inflow, Tech outflow), BofAI participation economy", "items": [{"author": "MikeZaccardi", "text": "BofAI: After dipping from 2011 to 2019 on average, the share of people engaged in physical activity increased across all age groups in 2025\n\nthe \"participation economy\" https://t.co/elluCWKov9", "tweet_url": "https://x.com/MikeZaccardi/status/2123104449149214733", "images": ["https://pbs.twimg.com/media/HXbIPvMW0AA-x-H.png"], "created_at": "2026-11-18T17:22:00.000Z", "relayers": []}, {"author": "neilsethinew", "text": "BofA clients poured $811M into Utilities stocks last week, the sector’s 2nd-largest weekly inflow in BofA’s data back to 2008, essentially all of it from hedge funds.\n\nBofA notes that the prior 6 times inflows were this large relative to the sector’s market cap, Utilities beat the S&P 500 over the next 4 weeks in all but one, by 2 percentage points on average.\n\nClients also sold $1.9B of Tech, led by hedge funds (-$2.2B, institutions bought $1.1B), and sold Communication Services for a 5th straight week. \n\nIndustrials saw inflows for the first time in 16 weeks, ending the sector’s longest outflow streak since January 2024.", "tweet_url": "https://x.com/neilsethinew/status/2123037991614464109", "images": ["https://pbs.twimg.com/media/HXaLrd6XQAAm4KD.jpg"], "created_at": "2026-11-18T12:57:55.000Z", "relayers": []}, {"author": "neilsethinew", "text": "BofA’s November FMS also showed investors cooling on the economy, from “boom” to “soft landing,” but not calling for a recession with the most since Oct 2024 looking for lower inflation:\n\n▪ 50% now expect a soft landing, ahead of 42% for no landing, the first time since June it’s been the base case.\n▪ The share expecting a boom eased to 41% from 47%, which had been the highest since February 2022.\n▪ A net 14% expect a weaker global economy, the most pessimistic reading since April.\n▪ A net 32% expect lower inflation, the most since October 2024.\n▪ Just 3% expect a hard landing.\n\nHartnett says growth and earnings optimism has peaked. The oddity: 47% call the outlook stagflation even as most expect inflation to fall.", "tweet_url": "https://x.com/neilsethinew/status/2123018380102029737", "images": ["https://pbs.twimg.com/media/HXXcOrbWQAAO6b2.jpg"], "created_at": "2026-11-18T11:40:00.000Z", "relayers": [], "quoted_text": "BofA’s Michael Hartnett says fund managers are still bullish on macro and markets in the November Global Fund Manager Survey, “but euphoria on boom &amp; AI over.” Investors cut their tech overweight to a net 12% from 37%, the biggest one-month cut since June 2006.\n\nThe AI worries https://t.co/b3mViRZCkZ"}]}, {"bank": "Apollo/Slok", "theme": "Apollo/Slok — AI and business formation; locked-in low rates for corporates/households vs. government", "items": [{"author": "dailychartbook", "text": "\"AI is making it much easier to start a business.\"\n\n-Torsten Slok, Apollo https://t.co/we4GzRmrht", "tweet_url": "https://x.com/dailychartbook/status/2123038607816478892", "images": ["https://pbs.twimg.com/media/HXaMXQOXoAA2mAV.jpg"], "created_at": "2026-11-18T13:00:22.000Z", "relayers": []}, {"author": "dailychartbook", "text": "\"Corporate America and households both locked in low rates during the pandemic ... Washington didn’t\"\n\n-Torsten Slok, Apollo https://t.co/tj5Dc8mYww", "tweet_url": "https://x.com/dailychartbook/status/2123023781916467287", "images": ["https://pbs.twimg.com/media/HXZ-4NAXUAAxOwB.jpg"], "created_at": "2026-11-18T12:01:28.000Z", "relayers": []}]}, {"bank": "Deutsche", "theme": "Deutsche/Reid — innovation and job creation history", "items": [{"author": "dailychartbook", "text": "\"Throughout history, every major innovation has arrived alongside fears that it would destroy jobs. The reality has generally been that the productivity gains from innovation ultimately create new jobs elsewhere in the economy.\"\n\n-Jim Reid, Deutsche Bank https://t.co/Ur9HhVp6MT", "tweet_url": "https://x.com/dailychartbook/status/2123015740659810528", // ---------- helpers ----------
function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }

function renderBold(text) {
  return escapeHtml(text).replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
}

function relativeTime(iso) {
  if (!iso) return '';
  const dt = new Date(iso);
  if (isNaN(dt.getTime())) return '';
  const secs = Math.max(0, (Date.now() - dt.getTime()) / 1000);
  if (secs < 60)   return Math.floor(secs) + 's ago';
  const mins = secs / 60;
  if (mins < 60)   return Math.floor(mins) + 'm ago';
  const hrs  = mins / 60;
  if (hrs < 48)    return Math.floor(hrs) + 'h ago';
  return Math.floor(hrs / 24) + 'd ago';
}

function authorTag(name, cls = 'item-author') {
  if (!name) return '';
  return `<span class="${cls}" onclick="filterAuthor('${escapeAttr(name)}')">@${escapeHtml(name)}</span>`;
}

// ---------- rendering ----------
function renderCharts(images) {
  if (!images || !images.length) return '';
  return `<div class="charts">` + images.map(u =>
    `<img src="${escapeAttr(u)}" class="chart" loading="lazy" alt="" onclick="openLightbox('${escapeAttr(u)}')">`
  ).join('') + `</div>`;
}

function renderDataPoints(points) {
  if (!points || !points.length) return '';
  return `<div class="data-points">` + points.map(p =>
    `<span class="dp-tag">${escapeHtml(p)}</span>`
  ).join('') + `</div>`;
}

function renderRelayers(item) {
  const r = item.relayers || [];
  if (!r.length) return '';
  // gen_bank_research_report.py already puts this line into data_points.
  if ((item.data_points || []).some(p => String(p).startsWith('also carried by'))) return '';
  return `<div class="data-points"><span class="dp-tag">also carried by: ${
    r.map(a => '@' + escapeHtml(a)).join(', ')}</span></div>`;
}

function renderItem(item, preferText) {
  const author = item.author || item.author_username || '';
  const time = relativeTime(item.created_at);
  const link = item.tweet_url
    ? `<a class="item-link" href="${escapeAttr(item.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  const body = preferText ? (item.text || item.description || '')
                          : (item.description || item.text || '');
  return `
    <div class="item-card filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${authorTag(author)}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      ${body ? `<div class="item-text">${escapeHtml(body)}</div>` : ''}
      ${renderDataPoints(item.data_points)}
      ${renderRelayers(item)}
      ${renderCharts(item.images)}
    </div>`;
}

function renderTopic(topic, idx) {
  const items = (topic.items || []).map(it => renderItem(it, topic._fromBanks)).join('');
  const name = topic.topic || topic.name || `Topic ${idx + 1}`;
  return `
    <div class="topic">
      <div class="topic-head" onclick="toggleTopic(this)">
        <span class="topic-name">${escapeHtml(name)}</span>
        <span class="topic-count">${(topic.items || []).length}</span>
        <span class="topic-arrow">▸</span>
      </div>
      <div class="topic-body">${items || '<div class="empty">No items.</div>'}</div>
    </div>`;
}

function renderLink(l) {
  const author = l.author || l.author_username || '';
  const url = l.url || (l.resolved || l.tco) || '';
  return `
    <div class="link-row filterable" data-author="${escapeAttr(author).toLowerCase()}">
      ${author ? authorTag(author, 'link-author') : '<span class="link-author">—</span>'}
      <a class="link-url" href="${escapeAttr(url)}" target="_blank" rel="noopener">${escapeHtml(url)}</a>
      ${l.description ? `<span class="link-desc">${escapeHtml(l.description)}</span>` : ''}
    </div>`;
}

function renderSection(letter, name, body, count) {
  return `
    <div class="section">
      <div class="section-head" onclick="toggleSection(this)">
        <span class="section-letter">${letter}.</span>
        <span class="section-name">${escapeHtml(name)}</span>
        <span class="section-count">${count}</span>
        <span class="section-arrow">▸</span>
      </div>
      <div class="section-body">${body}</div>
    </div>`;
}

function renderSummary(text) {
  if (!text) return '';
  const paragraphs = String(text).split(/\n\n+/).filter(Boolean)
    .map(p => `<p>${renderBold(p)}</p>`).join('');
  return `<div class="summary">${paragraphs}</div>`;
}

// The bank-research routine emits `banks` [{bank, theme, items[{text,...}]}];
// older reports (and the Data template's schema) use `topics`. Render `banks`
// directly when present, else fall back to `topics`.
function reportGroups(d) {
  if (Array.isArray(d.banks) && d.banks.length) {
    return { label: 'Banks', unit: 'banks', groups: d.banks.map(b => ({
      topic: b.theme ? `${b.bank} — ${b.theme}` : (b.bank || ''),
      items: b.items || [],
      _fromBanks: true,
    })) };
  }
  return { label: 'Topics', unit: 'topics', groups: d.topics || [] };
}

function renderStats(d) {
  const parts = [];
  const cov = d.coverage || {};
  if (cov.authors_covered != null && cov.authors_total != null) {
    const pct = cov.authors_total ? (100 * cov.authors_covered / cov.authors_total) : 0;
    parts.push(`coverage <strong>${cov.authors_covered}/${cov.authors_total}</strong> (${pct.toFixed(0)}%)`);
  }
  const g = reportGroups(d);
  const topicCount = g.groups.length;
  const itemCount = g.groups.reduce((n, t) => n + (t.items || []).length, 0);
  parts.push(`${g.unit} <strong>${topicCount}</strong>`);
  parts.push(`items <strong>${itemCount}</strong>`);
  if ((d.links || []).length) parts.push(`links <strong>${d.links.length}</strong>`);
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSection(el) { el.parentElement.classList.toggle('open'); }
function toggleTopic(el)   { el.parentElement.classList.toggle('open'); }

function openLightbox(src) {
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-img').src = '';
}

let activeFilter = null;
function filterAuthor(name) {
  if (!name) return;
  activeFilter = String(name).toLowerCase();
  document.querySelectorAll('.filterable').forEach(el => {
    const a = (el.dataset.author || '').toLowerCase();
    if (a === activeFilter) { el.classList.add('match'); el.classList.remove('dim'); }
    else                    { el.classList.add('dim'); el.classList.remove('match'); }
  });
  document.getElementById('filter-name').textContent = '@' + name;
  document.getElementById('filter-bar').classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function clearFilter() {
  activeFilter = null;
  document.querySelectorAll('.filterable').forEach(el => {
    el.classList.remove('match'); el.classList.remove('dim');
  });
  document.getElementById('filter-bar').classList.remove('active');
}
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (document.getElementById('lightbox').classList.contains('open')) closeLightbox();
    else if (activeFilter) clearFilter();
  }
});

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';

  const g = reportGroups(d);
  const topicsBody = g.groups.map(renderTopic).join('')
                  || `<div class="empty">No ${g.unit}.</div>`;
  const linksBody = (d.links || []).map(renderLink).join('');

  const sections = [
    renderSummary(d.summary),
    renderSection('A', g.label, topicsBody, g.groups.length),
    linksBody ? renderSection('B', 'Link Queue', linksBody, (d.links || []).length) : '',
  ].join('');

  document.getElementById('app').innerHTML = sections || '<div class="empty">No report data.</div>';

  // Auto-open the main section and the first topic.
  document.querySelectorAll('.section').forEach((s, i) => { if (i === 0) s.classList.add('open'); });
  const firstTopic = document.querySelector('.topic');
  if (firstTopic) firstTopic.classList.add('open');

  document.getElementById('stats').innerHTML = renderStats(d);
}

renderReport(REPORT_DATA);
</script>
