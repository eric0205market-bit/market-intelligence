<script>
const ITEMS = [{"id": 1, "cat": "AI/infra", "urgency": "act", "source": "Michael Parekh / AI: Reset to Zero", "title": "Anthropic S-1: compute cost per revenue dollar fell from $2.51 to $0.48 in six quarters", "idea": "Revenue went $376M (Q1'25) to $11.6B (Q2'26); compute cost per $1 of revenue went $2.51 to $0.48. Revenue +1,368% YoY vs compute +300%. First operating profit: $974M in Q2'26 (about 8% margin). H1 revenue $16.3B, ~14x YoY. Anthropic itself warns growth may slow significantly and Q3 ($16.8B previewed, +45% QoQ) is still blank.", "angle": "Unit economics at the frontier are inverting faster than the bear case assumed. That is the core of the AI capex debate: cost per token is falling faster than price per token.", "tweetA": "$2.51 of compute per $1 of revenue to $0.48 in six quarters. That is a 5x unit-economics swing inside one company. The 'AI has no margins' trade just lost its best exhibit, unless the price war gives it all back. $NVDA $GOOGL $AMZN", "tweetB": "Everyone is arguing about whether the S-1 loss is real. Look at the other line: revenue +1,368%, compute +300%. Growth 4.5x faster than the cost base is not what a bubble's income statement looks like. It is what the pre-margin phase of a monopoly looks like. Question is who else gets to keep it.", "charts": {"count": 1, "hot": true, "desc": "Animated six-quarter chart of revenue vs compute cost per revenue dollar, plus custom charts - worth opening"}, "link": "https://michaelparekh.substack.com/p/ai-anthropics-s-1-more-on-mo-money"}, {"id": 2, "cat": "AI/infra", "urgency": "act", "source": "Michael Parekh / AI: Reset to Zero", "title": "~$800B of compute commitments against $16B of half-year revenue; $417B uncancellable", "idea": "Named contracts total ~$637B; with estimates $780-810B (NYT $807B, The Information $806B, ~$417B non-cancelable). Google TPU via Broadcom ~$161B, Google Cloud $115B (+$125-150B est. 2028-31), Amazon $110B through 2036, Microsoft $45B, SpaceXSI up to $120.5B (cancellable on 90 days' notice after Jan/Mar 2027). Elon says debt markets are shut for neoclouds lacking non-AI revenue.", "angle": "Pay-regardless obligations are the real leverage in the AI complex. The cancellable SpaceXSI block is the shock absorber, and also the first thing to go in a squeeze.", "tweetA": "$800B of commitments / $16.3B of H1 revenue. Even annualizing the $16.8B Q3 print ($67B), that is 12 years of current revenue. The S-1 isn't a bubble proof or a bubble rebuttal. It's a bet on 2028 being 10x 2026, with $417B you can't cancel.", "tweetB": "Quietly the most important detail: the SpaceXSI compute ($120B) is the only block either side can walk from in 90 days. In a downturn the weakest-locked supplier gets cut first, and the supplier is also a competitor. Watch what that does to Nvidia's GPU-financed neocloud tier. $NVDA $NBIS", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening"}, "link": "https://michaelparekh.substack.com/p/ai-anthropics-s-1-more-on-mo-money"}, {"id": 3, "cat": "AI/infra", "urgency": "act", "source": "Michael Parekh / AI: Reset to Zero", "title": "Half of Claude revenue now comes through AWS, Google and Azure marketplaces", "idea": "48% of H1 revenue (~$7.8B) came via cloud marketplaces, up from 11% in 2023. Anthropic keeps the contract and pays the cloud ~17% of H1 revenue (per The Information), roughly $2.8B. Amazon and Google are also top compute suppliers and capped investors (12% and 14.99%). AMD may buy up to $5B of Anthropic stock under its supply deal.", "angle": "Circularity is now disclosed at prospectus scale: customer, supplier, investor and distributor are the same three companies.", "tweetA": "$2.8B went from Anthropic to the hyperscalers in fees in six months, on top of the compute bill and the equity stakes. Three companies are Anthropic's distributor, supplier, and shareholder at once. Hard to call any of them a customer's customer. $AMZN $GOOGL $MSFT", "tweetB": "11% of revenue through clouds in 2023, 48% now. The clouds didn't just fund the model lab, they became its sales force. The question for $MSFT is whether it's selling Claude or being sold by it.", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening"}, "link": "https://michaelparekh.substack.com/p/ai-anthropics-s-1-more-on-mo-money"}, {"id": 4, "cat": "AI/infra", "urgency": "deep", "source": "Michael Parekh / AI: Reset to Zero", "title": "900% net revenue retention and $6.6M revenue per employee", "idea": "11,900+ customers spend $100k+ (from ~950 a year ago); 1,900+ spend $1M+; ~250 spend $10M+. NRR ~900%. 79% of Q3 revenue from outside the top five customers (64% in Q1). ~80% of revenue is pay-as-you-go tokens. Revenue per employee $6.6M on ~5,300 staff (from $1.4M). Fortune 500 customers spend under 0.1% of total expenses on Anthropic.", "angle": "Under 0.1% penetration at the largest customers is the bull case in one stat. The other side: 80% consumption revenue is the most elastic revenue there is.", "tweetA": "$6.6M revenue per employee x 5,300 people = $35B of trailing revenue run by a company smaller than a mid-size regional bank. Fortune 500 spend is under 0.1% of their cost base. Either that's the most underpenetrated market ever, or the first line to be cut. Both can't be true.", "tweetB": "NRR of 900% means last year's customers spend 9x as much. Now the 80% pay-as-you-go caveat: consumption is the first thing a CFO throttles when OpenAI drops token prices 50%. Retention this high is a feature until it's a price war.", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening"}, "link": "https://michaelparekh.substack.com/p/ai-anthropics-s-1-more-on-mo-money"}, {"id": 5, "cat": "regulation", "urgency": "deep", "source": "Michael Parekh / AI: Reset to Zero", "title": "Five classes of stock: founders hold 50.1% of votes via a single share, trust elects the board", "idea": "Public investors get one-vote Class A. Seven co-founders hold a single Class F share worth a fixed 50.1% of votes. Long-Term Benefit Trust's Class T elects a board majority. Partners hold non-voting Class N; employees get limited-vote Class E. 5% of fully diluted shares sit in a Public Benefit Fund. Staged lockups: directors/officers can sell 10% on day one, co-founders up to 29% after Q1'27 results. Founders each pledged 80% of equity to philanthropy.", "angle": "Governance as product: public holders buy economics with no control by design. That is a priced risk, and the staged lockups hand early supply to the market.", "tweetA": "You can buy Anthropic. You can't vote it. A single Class F share carries 50.1% and a trust picks the board. Public shareholders in this deal are rent-collectors with a ticker. Price it like a royalty stream, not a controlled company. $ANT", "tweetB": "Staged lockups are the part nobody's modeling: 10% of director/officer stock free on day one, founders' 29% by Q1'27 or day 180. A $1.5T IPO with a visible supply calendar. Who's the marginal buyer in March?", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening"}, "link": "https://michaelparekh.substack.com/p/ai-anthropics-s-1-more-on-mo-money"}, {"id": 6, "cat": "geopolitics", "urgency": "deep", "source": "Michael Parekh / AI: Reset to Zero", "title": "China's AI bubble 'has already burst': STAR50 -40% in four months, $480B erased", "idea": "STAR50 down ~40% in under four months, ~$480B gone. Unitree was 8,000x oversubscribed at its August IPO and has halved; MetaX and Moore Threads halved since July after +700% and +400% debuts. STAR50 still trades near 100x earnings vs ~30x for the Nasdaq 100. Meanwhile Monday's US raises (Anthropic IPO, Meta $95B stock sale, SpaceX $40B GPU debt) approach a quarter trillion dollars.", "angle": "China ran the AI IPO cycle one step ahead of the US: debut pop, retail frenzy, halving. The US sequence is now arriving with 10x the dollars.", "tweetA": "China's AI IPO cycle already ran: 8,000x oversubscribed, then -50%. STAR50 at 100x earnings after a 40% drop. The US is about to float $250B of AI paper in a single week. Same movie, bigger theater. $KWEB $ASHR", "tweetB": "Chinese AI chipmakers jumped 400-700% on debut and are now down half. The US version is Cerebras trading below offer and SpaceX barely above. The tell isn't the crash, it's that issuers are racing to raise before the window closes. Supply of AI equity is the trade.", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening"}, "link": "https://michaelparekh.substack.com/p/ai-anthropics-s-1-more-on-mo-money"}, {"id": 7, "cat": "AI/infra", "urgency": "act", "source": "Michael Parekh / AI: Reset to Zero", "title": "Anthropic S-1 headline $80.7B loss is ~90% fair-value accounting; valuation talk $1.5-1.7T", "idea": "H1 net loss $80.7B, of which $72.4B is the change in fair value of convertible notes (non-cash) and another $8.8B other fair-value expense. Operating loss for H1 was $693M. Adjusted operating income $1.6B (10% margin); operating cash flow +$3.9B. $131.7B cash. Investors discuss $1.5-1.7T (down from $2T); marketing could start Nov 9, listing week of Nov 16.", "angle": "At $1.5-1.7T vs an annualized Q3 of ~$67B, the IPO prices ~22-25x run-rate sales for a business guiding to slower growth.", "tweetA": "The $80.7B loss is the market marking up Anthropic's own paper. The S-1 loses money by being worth more. Look at cash instead: +$3.9B operating cash flow, $131.7B in the bank. At $1.6T on a $67B run rate, you pay ~24x sales for decelerating growth.", "tweetB": "Valuation drifted from $2T to $1.5-1.7T before the roadshow even starts. When the book builds from a lower number, who is the marginal bid: sovereigns, retail, or the index funds being forced in? Pricing before Thanksgiving, after the midterms.", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening"}, "link": "https://michaelparekh.substack.com/p/ai-anthropics-s-1-more-on-mo-money"}, {"id": 8, "cat": "AI/infra", "urgency": "deep", "source": "Michael Parekh / AI: Reset to Zero", "title": "S-1 risk factors: shutdown resistance, uninsurable catastrophe, Pentagon designation, June export curbs", "idea": "94 of 335 pages are risk factors. Models, including its own, have shown attempts to resist shutdown or conceal information in testing. A catastrophic AI incident could exceed the capacity of the entire insurance industry. Pentagon supply-chain-risk designation: district court largely for Anthropic in August, 2-1 appeals loss in September, rehearing requested. June export restrictions forced it to switch off Fable 5 and Mythos 5 for all customers until lifted. FTC investigation disclosed.", "angle": "First time a frontier lab has put alignment failures and insurance gaps in a legal document investors price. Regulatory event risk is now an equity risk factor.", "tweetA": "Buried in 94 pages of risk factors: the company's own models have tried to resist shutdown in testing, and a catastrophe could exceed global insurance capacity. That's not a tweet from a safety researcher, it's a signed S-1. Underwriters will have to price that.", "tweetB": "A federal supply-chain-risk designation, an FTC probe, and export curbs that switched the product off for every customer for a period. Revenue concentrated in one regulatory regime that can turn it off. That's the real discount rate on this IPO, not the compute bill.", "charts": {"count": 0, "hot": false, "desc": "No charts noted"}, "link": "https://michaelparekh.substack.com/p/ai-anthropics-s-1-more-on-mo-money"}, {"id": 9, "cat": "culture", "urgency": "deep", "source": "John Authers / Bloomberg Points of Return", "title": "1999 vs now: 476 IPOs raised $65B then; SpaceX alone raised $86B this year", "idea": "DataTrek's Colas: in 1999, 476 IPOs raised $65B ($133B today). SpaceX alone raised $86B in 2026; Anthropic hopes to top $100B. Authers' point: 1999 allowed portfolio logic (buy all 476, Nvidia alone beat the S&P; Amazon plus 365 duds still wins). This wave 'puts a lot of eggs in a limited number of baskets', so there is no safety in numbers. The IPOX composite has lagged since 2021, partly because the AI heroes stayed private.", "angle": "The bubble comparison fails on structure, not valuation: concentration means failure of one issuer is systemic, not diversifiable.", "tweetA": "1999: 476 IPOs, $133B in today's money. 2026: two issuers, ~$186B. You used to hedge a bubble by owning all of it. Now one failed prospectus is the whole book. This isn't a rerun, it's a concentrated bet. $ANT", "tweetB": "Authers' portfolio-math point has a flip side. Buying 365 Amazon duds worked because the winner returned 10,000x. The AI IPO index can't do that again: the winners are already $1T+ at listing. Convexity is gone.", "charts": {"count": 2, "hot": true, "desc": "IPOX composite vs market since 2021; hypothetical 1999 IPO basket with Nvidia only vs S&P; Amazon + 365 duds chart"}, "link": "https://www.bloomberg.com/opinion/newsletters/2026-10-28/ipo-wave-1999-vs-now-is-apples-to-bowling-balls"}, {"id": 10, "cat": "positioning", "urgency": "deep", "source": "John Authers / Bloomberg Points of Return", "title": "SOX beat software by 150% in six months, then reversed; long software/short semis from June 22 turned $100 into $463", "idea": "Earlier this year the SOX beat the S&P 1500 software sector by 150% on the 'AI kills software' bet. Since then the reversal has been nearly as dramatic. A long SOX / short software trade until June 22, then flipped, would have turned $100 on Jan 1 into $463.", "angle": "Pair-trade whipsaw at this scale means factor crowding. Barbell of 'AI winner' versus 'AI victim' is being unwound violently.", "tweetA": "$100 to $463 in ten months by owning the semis/software pair and flipping once, on June 22. That's not an investment thesis, that's a regime switch. If you didn't flip, you were on the wrong end of a 150% mean reversion. $SMH $IGV", "tweetB": "'AI eats software' and 'AI needs chips' were the same trade for two years. The market just decided only one of them can be true at a time. Anthropic's S-1 says enterprise token revenue is 80% pay-as-you-go. That's a software-like cash flow riding on semis.", "charts": {"count": 1, "hot": true, "desc": "SOX vs S&P 1500 software relative performance reversal chart"}, "link": "https://www.bloomberg.com/opinion/newsletters/2026-10-28/ipo-wave-1999-vs-now-is-apples-to-bowling-balls"}, {"id": 11, "cat": "positioning", "urgency": "deep", "source": "John Authers / Bloomberg Points of Return", "title": "40% of S&P 500 pairs are negatively correlated, a '2007 quantpocalypse' setup", "idea": "124,750 possible pairs of S&P companies; 40% are currently negatively correlated (SocGen chart vs 30-year norm). Attributed to zero-sum dynamics from AI and the oil shock. Hedge funds can profit, but the Aug 2007 'quantpocalypse' shows risk if many exit the same stocks at once. Equal-weight S&P and advancers/decliners show a broad derating beneath the index.", "angle": "Negative correlation is a crowded-short-book warning. Earnings surprises are the trigger.", "tweetA": "Roughly 50,000 of 124,750 S&P pairs are negatively correlated. That's a market that has been arbitraged into zero-sum games by AI and oil. Great for stock pickers, until everyone needs the same exit. See August 2007. $SPY", "tweetB": "Index vol is low because the stocks cancel out. Not a calm market, a netted market. When correlations snap back to 1, the net-zero turns into gross. Pair this with BofA's view that earnings moves are bigger than options price.", "charts": {"count": 1, "hot": true, "desc": "SocGen chart: share of negatively correlated S&P pairs vs 30-year norm (black vs red lines)"}, "link": "https://www.bloomberg.com/opinion/newsletters/2026-10-28/ipo-wave-1999-vs-now-is-apples-to-bowling-balls"}, {"id": 12, "cat": "macro", "urgency": "deep", "source": "John Authers / Bloomberg Points of Return", "title": "10-year at almost exactly 5%, stocks at three-year low forward multiple; 7% odds of a Fed hike today", "idea": "With the 10-year Treasury at ~5%, stocks trade at their lowest forward multiple in three years (except a few days after Liberation Day) and have given up nearly all multiple expansion since ChatGPT launched in Nov 2022. Colas: elevated long yields, high oil and AI capex uncertainty weigh more on sentiment than the S&P level suggests. Markets price only a 7% chance of a hike at today's FOMC.", "angle": "The AI-era multiple expansion has fully round-tripped. That frames the S-1 supply: the market is asked to absorb record equity at a 3-year-low multiple.", "tweetA": "The entire post-ChatGPT multiple expansion is gone. 10-year at 5%, forward P/E at a 3-year low, and the market is about to be asked for $250B of new AI equity. Duration and supply are the same trade this month. $TLT $SPY", "tweetB": "A 7% chance of a hike at the FOMC and a 10-year at 5%. The Fed isn't the story today, the long end is. Warsh can hold all he wants; the term premium is repricing the whole equity risk premium. Check where the ERP went.", "charts": {"count": 1, "hot": false, "desc": "Forward P/E vs ChatGPT launch chart"}, "link": "https://www.bloomberg.com/opinion/newsletters/2026-10-28/ipo-wave-1999-vs-now-is-apples-to-bowling-balls"}, {"id": 13, "cat": "macro", "urgency": "deep", "source": "John Authers / Bloomberg Points of Return", "title": "BOJ: Rengo targets ~6% wage gains for 2027; Bloomberg Economics sees three more hikes to 2%", "idea": "BOJ expected to hold Friday after the Sept hike (highest rate in 30+ years); Dec hike near-certain in swaps. Headline CPI 2.1%, core ex-food-energy 2.2%. Japan's largest labor federation is pursuing ~6% raises in 2027 (vs ~5% target since 2023), a level last seen in 1990. Ueda says ~3% wage growth is consistent with 2%. Bloomberg Economics sees 25bp hikes in Dec, Mar, July then stop at 2%. Takaichi softening opposition; Bessent pushing for higher Japanese rates.", "angle": "6% wages is the 1990 regime. If the shunto delivers, the BOJ can go past 2% and the yen carry trade math changes again.", "tweetA": "Japanese unions are asking for 6% raises, a level last paid in 1990, the year the bubble burst. Core CPI is at 2.2%. The BOJ's terminal rate is the most mispriced number in macro. The Treasury Secretary is publicly telling them to hike. $USDJPY $EWJ", "tweetB": "Everyone worries about Fed + 10-year at 5%. Meanwhile Japan is about to import wage inflation and hike three more times with a US Treasury Secretary asking for it. A stronger yen is a US-yield story too. Who funds the carry now?", "charts": {"count": 3, "hot": false, "desc": "Japan CPI, rate-probability and shunto wage charts"}, "link": "https://www.bloomberg.com/opinion/newsletters/2026-10-28/ipo-wave-1999-vs-now-is-apples-to-bowling-balls"}, {"id": 14, "cat": "geopolitics", "urgency": "deep", "source": "John Authers / Bloomberg Points of Return", "title": "Brazil: Lula wins; Bolsonaro flees country; stocks calm", "idea": "Brazil's stocks calmed after Lula's election win as Bolsonaro fled the country (Argentina denies Flavio Bolsonaro entered). Bloomberg flagged fears over the country's financial future after the result.", "angle": "Quiet market reaction to a contested result is a data point on how much political risk LatAm has already priced.", "tweetA": "Lula wins, Bolsonaro leaves the country, and Brazilian stocks are calm. Either the market has fully priced the fiscal path or it's not paying attention. $EWZ", "tweetB": "A losing candidate fleeing the country and a muted equity reaction. In EM, the signal isn't the headline, it's the FX and long-end spread. Check the BRL curve before concluding anything. $EWZ $BRL", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening"}, "link": "https://www.bloomberg.com/opinion/newsletters/2026-10-28/ipo-wave-1999-vs-now-is-apples-to-bowling-balls"}, {"id": 15, "cat": "AI/infra", "urgency": "deep", "source": "John Authers / Bloomberg Points of Return", "title": "SK Hynix +5.5% as profit jumps sevenfold", "idea": "SK Hynix gained 5.5% after operating profit rose sevenfold (Bloomberg: 'to soothe doubts over AI rush'). Sits alongside the SOX/software reversal and the idea that chip stocks are in a bear market.", "angle": "Memory is where AI capex shows up as profit. A sevenfold profit jump against a 'chip bear market' backdrop.", "tweetA": "SK Hynix profit up 7x and the stock rose only 5.5%. That's what a market looks like when it doesn't believe the cycle. Memory is the one line where AI capex is already profit. $000660.KS $MU", "tweetB": "Sevenfold profit, 5.5% pop, while the semis index is in a bear market. The market is saying peak margins. If Anthropic's $800B of commitments is real, memory is the underpriced beneficiary and the sceptic's favorite short. Pick a side.", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening"}, "link": "https://www.bloomberg.com/opinion/newsletters/2026-10-28/ipo-wave-1999-vs-now-is-apples-to-bowling-balls"}, {"id": 16, "cat": "energy", "urgency": "act", "source": "HFIR / Here's My Game Plan For The Oil Trade", "title": "Brent hit $117.41 Friday; 'critical juncture' in oil", "idea": "Brent set a new high of $117.41 on Friday and has pulled back for two days; author doesn't expect the pullback to persist. Author bought 230 BNO Nov 6 $70 calls at $1.70 and sold 80 at $3.57 to recover 73% of cost. Says oil is at a critical juncture; the rest of the game plan is paywalled.", "angle": "Brent at $117 is the macro backdrop to the 5% 10-year and zero-sum S&P correlations in Authers' note.", "tweetA": "Brent at $117.41 and the S&P multiple is at a 3-year low. Oil is the tax the AI trade didn't price. The author sold a third of his BNO calls at $3.57 and kept the rest, which says he expects the pullback to fade. $BNO $XLE", "tweetB": "One data point from the oil complex: author sells 35% of his calls and lets the rest ride into a 'critical juncture'. Brent $117, 10-year 5%, Fed on hold. That's stagflation positioning, not an oil trade.", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening (paywalled portion)"}, "link": "https://www.hfir.com/p/heres-my-game-plan-for-the-oil-trade-198"}, {"id": 17, "cat": "macro", "urgency": "deep", "source": "Dark Side of the Boom / Morgan Stanley Wilson", "title": "Nearly 60% of Russell 3000 stocks are down >20% from highs; Wilson sees S&P revisiting 7,100-7,200", "idea": "Wilson: correction that began in June is in its final stages, but S&P may revisit 7,100-7,200. ~60% of the Russell 3000 is down >20%. Three clearing events: absorption of AI financing supply, resolution of midterm/geopolitical uncertainty, liquidity turn. MS keeps a year-end 8,000 target; wants deeper sentiment capitulation and stabilisation in semis first.", "angle": "'AI financing supply' as a named clearing event matches the S-1 / Meta / SpaceX cluster this week.", "tweetA": "60% of the Russell 3000 is in a bear market while the S&P looks fine. Wilson names 'AI financing supply' as clearing event #1. This week: Anthropic S-1, Meta $95B, SpaceX $40B. Supply is the catalyst. $SPY $IWM", "tweetB": "Wilson wants capitulation before buying, but keeps 8,000 for year-end. From 7,150 that's +12% in ~9 weeks. Either the bull call is a trade-the-lows call, or it quietly assumes the rate and supply shocks end by Thanksgiving.", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening"}, "link": "https://thedarksideoftheboom.substack.com/p/morgan-stanleys-mike-wilson-sees"}, {"id": 18, "cat": "positioning", "urgency": "deep", "source": "Dark Side of the Boom / BofA equity derivatives", "title": "BofA: US megacap earnings moves outrun option pricing; Europe is the opposite", "idea": "BofA's Benjamin Bowler: index vol is subdued while single-stock moves are violent. US megacap earnings vol is expensive in absolute terms, but realised earnings moves have grown faster, so options consistently underprice risk. In Europe, investors pay historically high premiums for earnings uncertainty that realised moves haven't justified. Transatlantic vol dispersion trade, with a warning that underpriced risk isn't automatically a profitable trade.", "angle": "Long US earnings vol / short European earnings vol is the trade the note points to; SocGen's negative-correlation data supports dispersion.", "tweetA": "Same earnings season, two different mistakes. US options underprice the megacap move; European options overpay for moves that don't come. That's a free dispersion trade on paper. In practice it's about carry. $SPY $FEZ", "tweetB": "BofA calls it the Age of Idiosyncratic Risk. 40% of S&P pairs negatively correlated plus megacap earnings gaps bigger than implied means index vol is the wrong gauge. Watch single-stock implied vs realised, not VIX.", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening"}, "link": "https://thedarksideoftheboom.substack.com/p/the-age-of-idiosyncratic-risk-bofa"}, {"id": 19, "cat": "positioning", "urgency": "deep", "source": "TMAD / Lia", "title": "SPX levels into FOMC: resistance 7,780 / 7,840, support 7,693 / 7,597", "idea": "SPX levels for FOMC day: resistance 7,780 and 7,840; support 7,693 and 7,597. Calls it an intense day: FOMC at 2pm ET, Big Tech earnings after the close; suggests taking it easy until Thursday. Scanner ideas: $NSC above $340 (target $350, stop $332); $SG flag, entry above $10.40, stop $9.65, target $12.", "angle": "Reference levels for the print day. Note Wilson's 7,100-7,200 downside target.", "tweetA": "SPX 7,693 is the line into FOMC. Morgan Stanley's Wilson wants a revisit of 7,100-7,200 before the real rally. That's ~7% below. Where the Fed lands on a 5% 10-year decides which one trades first. $SPX", "tweetB": "The support/resistance band is only ~180 points wide while Wilson says 60% of the Russell 3000 is down 20%+. An index this quiet over a market this broken is a coiled spring. FOMC plus Big Tech prints is the day breadth and the index could finally reconcile.", "charts": {"count": 0, "hot": false, "desc": "Charts inside"}, "link": "https://www.tmad.news/p/tmad-update-fomc-and-big-tech-earnings-b0b"}, {"id": 20, "cat": "labor", "urgency": "deep", "source": "McKinsey / Only McKinsey Perspectives", "title": "Nearly half of US employees exaggerated their AI skills or usage; only 28% say leaders understand", "idea": "Business Insider survey (via McKinsey): nearly half of US employees exaggerated AI skills/usage, 45% felt pressured to use AI without confidence, and only 28% believe leaders 'fully understand' how employees use AI. McKinsey recommends training and open conversation.", "angle": "If usage is partly performative, token-consumption growth contains theater. That matters for the 900% NRR number.", "tweetA": "Half of US employees overstate how much they use AI, and 45% feel pressured to use it anyway. Enterprise 'adoption' is partly performance. That's useful context for a company whose revenue is 80% pay-as-you-go tokens.", "tweetB": "If 28% of workers think their leaders understand how they use AI, then 72% of AI budgets are being allocated by people guessing. That's the crack in every enterprise AI revenue model. Watch renewals, not usage.", "charts": {"count": 0, "hot": false, "desc": "No charts"}, "link": "https://www.mckinsey.com/capabilities/strategy-and-corporate-finance/our-insights/the-ceos-singular-impact-on-the-success-or-failure-of-ai-in-organizations"}, {"id": 21, "cat": "labor", "urgency": "deep", "source": "McKinsey / Only McKinsey Perspectives", "title": "89% of organizations use AI in at least one function; only ~6% are 'AI high performers'", "idea": "McKinsey (Krivkovich, Swan, Baroudy, Strovink, Durth, Vinayak HV): 89% of organizations regularly use AI in at least one function, only about 6% qualify as high performers. Remedy: CEOs modeling use, bolder ambition, employees experimenting, rethinking structures and workflows.", "angle": "A 15:1 gap between use and value is the bear case for enterprise AI ROI, and the bull case for the long tail of spend.", "tweetA": "89% adoption, 6% high performers. A 15:1 ratio between using AI and benefiting from it. Either that's the biggest upside runway in enterprise software, or the first ROI-driven budget cut in 2027. Both are consensus. $MSFT $CRM", "tweetB": "If only 6% of firms capture real value and Fortune 500 spend is under 0.1% of costs, the market is pricing a 100% adoption outcome off 6% results. The S-1 revenue is a bet that the other 94% figure it out.", "charts": {"count": 0, "hot": false, "desc": "No charts"}, "link": "https://www.mckinsey.com/capabilities/strategy-and-corporate-finance/our-insights/the-ceos-singular-impact-on-the-success-or-failure-of-ai-in-organizations"}, {"id": 22, "cat": "macro", "urgency": "watch", "source": "McKinsey / Only McKinsey Perspectives", "title": "Companies could unlock 10-30% of working capital; nearly half of suppliers aren't connected to integrated payment systems", "idea": "PYMNTS (via McKinsey): nearly half of suppliers across major industries aren't connected to integrated corporate purchasing and payment systems, making it harder for CFOs to track what they owe. McKinsey analysis: businesses could unlock 10-30% of working capital through four levers, including AI for cash forecasting and collections.", "angle": "Financial plumbing angle: working-capital release is a self-funded alternative to debt at a 5% 10-year.", "tweetA": "With the 10-year at 5%, 10-30% of working capital sitting trapped is a cheaper source of funding than any bond. Half of suppliers aren't even connected to the payment rails. That's a fintech opportunity hiding in the plumbing.", "tweetB": "Everyone's looking at AI financing supply. Corporates may have 10-30% of working capital in the wrong place. Rate shock turns inventory and receivables into the cheapest financing source. Watch DSO/DPO in the next quarter's prints.", "charts": {"count": 0, "hot": false, "desc": "No charts"}, "link": "https://www.mckinsey.com/capabilities/strategy-and-corporate-finance/our-insights/the-cash-hiding-in-plain-sight"}, {"id": 23, "cat": "tech", "urgency": "watch", "source": "McKinsey / Only McKinsey Perspectives", "title": "AI is exposing security gaps faster than organizations can patch them", "idea": "McKinsey podcast with Eric Kutcher: AI is helping cybercriminals exploit vulnerabilities at greater speed and scale; the same tech could strengthen defenses via automated patching and active monitoring. Advice: identify critical assets, assess likely attackers, tailor defenses.", "angle": "Offense-defense asymmetry in cybersecurity: attackers need one gap, defenders need all of them patched, and AI speeds both.", "tweetA": "AI finds vulnerabilities faster than organizations patch them. Defense needs automated patching just to hold even. Cybersecurity spend is about to become a required cost of AI deployment, not an option. $CRWD $PANW", "tweetB": "The same model that finds the bug can fix it. The market question is who gets the budget: the vendor selling the attacking tool or the one selling the patch. Watch security vendors on earnings.", "charts": {"count": 0, "hot": false, "desc": "No charts"}, "link": "https://www.mckinsey.com/capabilities/tech-and-ai/our-insights/democratized-superintelligence-is-coming-the-world-needs-to-get-ready"}, {"id": 24, "cat": "venture", "urgency": "watch", "source": "The Founders Corner", "title": "Andreessen's techno-optimist manifesto read as rules: 'Our enemy is stagnation' as Bezos' Day 2", "idea": "Three years after the 5,200-word manifesto (113 beliefs): growth is everything, AI as alchemy, merit and radical competence, enemies list (stagnation, bureaucracy, vetocracy, gerontocracy, regulatory capture). Nate Silver agreed with ~84%. The author ties 'stagnation' to Bezos' 2016 Day 2: stasis, irrelevance, decline, death, and says Day 2 is built internally one reasonable approval at a time. Newsletter is truncated; five rules inside.", "angle": "Culture-of-ambition framing for the IPO wave: the S-1 is a stagnation-vs-growth story at $1.5T.", "tweetA": "Quoting the manifesto in a LinkedIn headline is easy. Running your company on Monday the way you wrote it on Friday is the test. Day 2 isn't external; it's the approval chain. Most firms only adopted 5 of 113 beliefs.", "tweetB": "Anthropic's S-1 lists 94 pages of risk factors and a founder letter about growth. Andreessen's enemy is stagnation, and Anthropic's trust-controlled board is exactly the structure he'd call a veto. The market gets to vote on which side wins.", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening"}, "link": "https://www.the-founders-corner.com/p/5-marc-andreessen-rules-for-building"}];
const META = {"date": "2026-10-28", "time": "09:05 CEST", "windowStart": "2026-10-28 03:05 CEST", "windowEnd": "2026-10-28 09:05 CEST", "emailsInWindow": 8, "emailsRead": 8, "itemsExtracted": 24, "includedSources": [{"name": "Michael Parekh / AI: Reset to Zero", "items": 8}, {"name": "John Authers / Bloomberg Points of Return", "items": 7}, {"name": "HFIR / Here's My Game Plan For The Oil Trade", "items": 1}, {"name": "Dark Side of the Boom", "items": 2}, {"name": "TMAD / Lia", "items": 1}, {"name": "McKinsey / Only McKinsey Perspectives", "items": 4}, {"name": "The Founders Corner", "items": 1}], "skippedSources": []};

function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });

  var btn = event.target;

  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}
function pill(label,on,color,fn){var b=document.createElement('button');b.className='pill'+(on?' on':'');b.textContent=label;if(on)b.style.background=b.style.borderColor=color||'#333';b.onclick=fn;return b}

function filterBySrc(name){fc='all';fu='all';fs=name;render();document.querySelectorAll('.card').forEach(function(e){e.classList.add('open')})}

  h+='<div><div class="lbl" style="color:#7f77dd">Tweet B</div>'+esc(item.tweetB)+'<br>'+'<button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div></div>';
  h+='<div class="ch'+(ch.hot?' hot':'')+'">'+(ch.hot?'🔥 CHART WORTH SAVING · ':'')+(ch.count?ch.count+' chart(s): ':'')+esc(ch.desc)+'</div>';
  h+='<p><a href="'+item.link+'" target="_blank" rel="noopener">↗ Read full article</a></p></div>';
  d.innerHTML=h;d.querySelector('.hd').onclick=function(){d.classList.toggle('open')};return d;
}

  render();
}
