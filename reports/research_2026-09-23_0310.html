const META = {
  date: "2026-09-23",
  time: "03:10 CEST",
  windowStart: "2026-09-22 21:15 CEST",
  windowEnd: "2026-09-23 03:10 CEST",
  emailsInWindow: 16,
  emailsRead: 16,
  itemsExtracted: 22,
  includedSources: [
    "Dark Side of the Boom (Goldman notes) — 3",
    "bepresearch — 2",
    "SixSigmaCapital — 1",
    "Daily Chartbook — 3",
    "Topdown Charts (Callum Thomas) — 1",

    "Capital Flows Research — 2",
    "McKinsey Global Institute — 1",
    "ARK Invest (Cathie Wood) — 1",
    "This Week in Startups — 1",
    "Bespoke Investment Group — 1",
    "Citrini Research — 1"

  skippedSources: [
    "SixSigmaCapital (subscriber chat notification) — pure announcement pointing to the same CRWV write-up already captured as its own item, zero additional content",
    "Norseman Market Timing (portfolio update) — screenshot-only holdings update, no extractable text thesis or data"
  ]
};

const CAT_COLORS = {
  "macro": "var(--macro)", "credit": "var(--credit)", "positioning": "var(--positioning)",
  "AI/infra": "var(--aiinfra)", "crypto": "var(--crypto)", "geopolitics": "var(--geopolitics)",
  "energy": "var(--energy)", "tech": "var(--tech)", "gold": "var(--gold)",
  "culture": "var(--culture)", "labor": "var(--labor)", "regulation": "var(--regulation)",
  "science": "var(--science)", "venture": "var(--venture)"
};

const URG_EMOJI = { act_now: "🔴", deep: "🔵", watch: "🟡" };
const URG_LABEL = { act_now: "Act Now", deep: "Deep", watch: "Watch" };

let activeCat = "all";
let activeUrg = "all";
let activeSrc = null;

function catColor(cat) { return CAT_COLORS[cat] || "#888"; }

function buildFilterBars() {
  const catCounts = {};
  ITEMS.forEach(i => { catCounts[i.cat] = (catCounts[i.cat] || 0) + 1; });
  const catBar = document.getElementById('catBar');
  let html = '<button class="pill active" data-cat="all" onclick="setCat(this,\'all\')">All <span class="count">' + ITEMS.length + '</span></button>';
  Object.keys(catCounts).sort().forEach(cat => {
    html += '<button class="pill" data-cat="' + cat + '" onclick="setCat(this,\'' + cat + '\')">' + cat + ' <span class="count">' + catCounts[cat] + '</span></button>';
  });
  catBar.innerHTML = html;

  const urgCounts = { act_now: 0, deep: 0, watch: 0 };
  ITEMS.forEach(i => { urgCounts[i.urgency]++; });
  const urgBar = document.getElementById('urgBar');
  let uhtml = '<button class="pill active" data-urg="all" onclick="setUrg(this,\'all\')">All <span class="count">' + ITEMS.length + '</span></button>';
  ['act_now', 'deep', 'watch'].forEach(u => {
    uhtml += '<button class="pill" data-urg="' + u + '" onclick="setUrg(this,\'' + u + '\')">' + URG_EMOJI[u] + ' ' + URG_LABEL[u] + ' <span class="count">' + urgCounts[u] + '</span></button>';
  });
  urgBar.innerHTML = uhtml;
}

function setCat(btn, cat) {
  activeCat = cat;
  activeSrc = null;
  document.querySelectorAll('#catBar .pill').forEach(function(p) {
    p.classList.remove('active');
    p.style.background = '';
    p.style.color = '';
    p.style.borderColor = '';
  });
  btn.classList.add('active');
  if (cat !== 'all') { btn.style.background = catColor(cat); btn.style.color = '#fff'; btn.style.borderColor = 'transparent'; }
  render();
}

function setUrg(btn, urg) {
  activeUrg = urg;
  activeSrc = null;
  document.querySelectorAll('#urgBar .pill').forEach(function(p) {
    p.classList.remove('active');
    p.style.background = '';
    p.style.color = '';
    p.style.borderColor = '';
  });
  btn.classList.add('active');
  if (urg !== 'all') { btn.style.background = '#333'; btn.style.color = '#fff'; btn.style.borderColor = 'transparent'; }
  render();
}

function filterBySrc(name) {
  activeSrc = name;
  activeCat = 'all';
  activeUrg = 'all';
  document.querySelectorAll('#catBar .pill, #urgBar .pill').forEach(function(p) {
    p.classList.remove('active');
    p.style.background = ''; p.style.color = ''; p.style.borderColor = '';
  });
  document.querySelector('#catBar .pill[data-cat="all"]').classList.add('active');
  document.querySelector('#urgBar .pill[data-urg="all"]').classList.add('active');
  render(true);
}

function render(expandAll) {
  const container = document.getElementById('cards');
  const filtered = ITEMS.filter(function(item) {
    if (activeSrc && item.source.indexOf(activeSrc) === -1) return false;
    if (activeCat !== 'all' && item.cat !== activeCat) return false;
    if (activeUrg !== 'all' && item.urgency !== activeUrg) return false;
    return true;
  });

  let html = '';
  filtered.forEach(function(item, idx) {
    const color = catColor(item.cat);
    const chartFlag = item.charts.hot ? '🔥' : (item.charts.count > 0 ? '📊' : '');
    const openClass = (activeSrc) ? ' open' : '';
    html += '<div class="card' + openClass + '" id="card-' + item.id + '">';
    html += '<div class="card-header" onclick="toggleCard(' + item.id + ')">';
    html += '<span class="idx">' + String(idx + 1).padStart(2, '0') + '</span>';
    html += '<span class="urg">' + URG_EMOJI[item.urgency] + '</span>';
    html += '<span class="src-badge" style="background:' + color + '">' + item.source.split(' /')[0] + '</span>';
    html += '<span class="cat-tag">' + item.cat + '</span>';
    if (chartFlag) html += '<span class="chart-flag">' + chartFlag + '</span>';
    html += '<span class="card-title">' + item.title + '</span>';
    html += '</div>';
    html += '<div class="card-body">';
    html += '<div class="section-label">The Idea</div><div class="idea-text">' + item.idea + '</div>';
    html += '<div class="section-label">My Angle</div><div class="angle-box" style="border-left:3px solid ' + color + '; background:' + color + '14;">' + item.angle + '</div>';
    html += '<div class="tweet-row">';
    html += '<div class="tweet-box"><div class="tweet-label" style="color:#378add;">TWEET A</div><div class="tweet-text">' + item.tweetA + '</div><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button></div>';
    html += '<div class="tweet-box"><div class="tweet-label" style="color:#7f77dd;">TWEET B</div><div class="tweet-text">' + item.tweetB + '</div><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div>';
    html += '</div>';
    if (item.charts.count > 0 || item.charts.desc) {
      html += '<div class="chart-block' + (item.charts.hot ? ' hot' : '') + '">' + (item.charts.hot ? '🔥 ' : '📊 ') + item.charts.desc + (item.charts.count > 0 ? ' (' + item.charts.count + ' chart' + (item.charts.count > 1 ? 's' : '') + ')' : '') + '</div>';
    }
    html += '<a class="read-link" href="' + item.link + '" target="_blank">↗ Read full article</a>';
    html += '</div></div>';
  });
  container.innerHTML = html || '<p style="color:#999;text-align:center;padding:30px 0;">No items match this filter.</p>';

  document.getElementById('metaLine').textContent =
    META.date + ' · ' + META.time + ' · ' + filtered.length + ' of ' + ITEMS.length + ' items shown';
}

function toggleCard(id) {
  document.getElementById('card-' + id).classList.toggle('open');
}

function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}

function buildReportCard() {
  var body = document.getElementById('reportBody');
  var html = '<p><strong>Window:</strong> ' + META.windowStart + ' → ' + META.windowEnd + '</p>';
  html += '<p><strong>Emails in window:</strong> ' + META.emailsInWindow + ' &nbsp; <strong>Read:</strong> ' + META.emailsRead + ' &nbsp; <strong>Items extracted:</strong> ' + META.itemsExtracted + '</p>';
  html += '<div class="section-label">Included Sources</div><ul>';
  META.includedSources.forEach(function(s) {
    var name = s.split(' — ')[0];
    html += '<li><span class="src-link" onclick="filterBySrc(\'' + name.replace(/'/g, "\\'") + '\')">' + s + '</span></li>';
  });
  html += '</ul>';
  html += '<div class="section-label">Skipped Sources</div><ul>';
  META.skippedSources.forEach(function(s) { html += '<li>' + s + '</li>'; });
  html += '</ul>';
  body.innerHTML = html;
}

document.getElementById('reportHeader').addEventListener('click', function() {
  document.getElementById('reportCard').classList.toggle('open');
});

buildFilterBars();
buildReportCard();
render();
</script>
