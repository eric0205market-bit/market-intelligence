 "so_what": "Compute availability gates adoption of advanced mask techniques at leading nodes.", "quote": "potentially forcing compromises between optimization depth and delivery schedules", "locator": "Siemens identifies the transition", "quote_verified": true}, {"claim": "ILT works backward from the desired wafer pattern to find mask shapes, often complex curves, and NVIDIA identifies ILT and curvilinear OPC as applications that benefit from accelerated computation.", "speaker": "Daniel Nenni", "type": "framework", "entities": ["ILT", "NVIDIA"], "conviction": "high", "so_what": "Curvilinear masks raise compute demand, a structural tailwind for GPU-based lithography software.", "quote": null, "locator": "ILT approaches mask creation", "quote_verified": false}]}, {"theme": "AI chip manufacturability loop", "insights": [{"claim": "Software that supports pattern transfer contributes to the infrastructure behind future AI chips, because designing a powerful processor is only part of delivering it and its patterns must be produced consistently.", "speaker": "Daniel Nenni", "type": "thesis", "entities": ["Siemens", "NVIDIA"], "conviction": "medium", "so_what": "Manufacturing software is a less visible but real constraint on AI silicon supply.", "quote": null, "locator": "The relevance to AI", "quote_verified": false}, {"claim": "Siemens presents a reinforcing cycle in which accelerated computing prepares more advanced semiconductors for manufacturing and those semiconductors provide more computing capability, with significance dependent on maintaining accuracy.", "speaker": "Daniel Nenni", "type": "framework", "entities": ["Siemens"], "conviction": "low", "so_what": "A flywheel favoring GPU vendors, contingent on accuracy preservation.", "quote": null, "locator": "There is also a reinforcing relationship", "quote_verified": false}]}], "insight_total": 9, "top_entities": ["Siemens", "NVIDIA", "cuLitho", "Calibre", "High-NA EUV", "ILT", "Daniel Nenni"], "source_meta": {"au itle": "Rethinking Phase Jitter: An Algorithmic Approach to Signal Integrity", "published_date": "2026-10-19", "language": "en", "processed_at": "2026-10-20T11:07:59Z", "processor": "claude-code-sub-opus", "tags": ["Tech"], "gist": "A contributed pitch by Richard Shreiner argues phase jitter should be eliminated algorithmically at Layer 1 before signal ingress rather than through hardware redesign, promoting his patent-pending QuantSync. It offers no technical methodology or independent validation, only before/after NASA telemetry images.", "themes": [{"theme": "Phase jitter as a scaling bottleneck", "insights": [{"claim": "The author argues that as data rates reach sub-picosecond regimes in HPC, 5G/6G and AI clusters, Layer 1 signal integrity has shifted from an engineering challenge to a critical bottleneck.", "speaker": "Admin", "type": "thesis", "entities": ["Richard Shreiner"], "conviction": "medium", "so_what": "Timing integrity is a rising constraint for AI cluster interconnects.", "quote": null, "locator": "Modern semiconductor architectures", "quote_verified": false}, {"claim": "Phase jitter persists despite multi-stage PLLs, interconnect redesign and thermal management because thermal noise, voltage fluctuations and parasitic capacitance are inevitable in physical silicon.", "speaker": "Admin", "type": "causal", "entities": ["Richard Shreiner"], "conviction": "medium", "so_what": "Hardware mitigation has diminishing returns per the author.", "quote": null, "locator": "Yet, despite these sophisticated interventions", "quote_verified": false}, {"claim": "Jitter that slips past Layer 1 causes pipeline stalls from setup and hold violations, over-voltaging and thermal throttling to preserve margins, and ever more expensive redesign cycles with each node shrink.", "speaker": "Admin", "type": "causal", "entities": ["Richard Shreiner"], "conviction": "medium", "so_what": "Timing margins translate into power and cost penalties.", "quote": null, "locator": "When clock jitter slips past Layer 1", "quote_verified": false}]}, {"theme": "Algorithmic stabilization claim", "insights": [{"claim": "The author claims deterministic algorithmic transformations at the software and protocol layer before signal ingress can neutralize timing variability entirely, reducing phase jitter to a 0.000 baseline metric.", "speaker": "Admin", "type": "thesis", "entities": ["Richard Shreiner", "QuantSync"], "conviction": "low", "so_what": "Extraordinary claim with no methodology, benchmarks or independent validation provided.", "quote": "Eliminating phase jitter algorithmically at the baseline metric (0.000)", "locator": "By applying deterministic algorithmic transformations", "quote_verified": true}, {"claim": "The author asserts that algorithmic stabilization would let processors run at optimal voltage, raise throughput on existing silicon without redesigns, and work across silicon and quantum systems.", "speaker": "Admin", "type": "prediction", "entities": ["Richard Shreiner"], "conviction": "low", "so_what": "Unsubstantiated promotional claims; evidence is limited to before/after images of NASA telescope telemetry.", "quote": null, "locator": "The implications for the industry are vast", "quote_verified": false}, {"claim": "The piece is a pitch submission by Richard Shreiner, inventor of the patent-pending QuantSync Layer 1 technology, so its claims are promotional.", "speaker": "Admin", "type": "anecdote", "entities": ["Richard Shreiner", "QuantSync"], "conviction": "high", "so_what": "Discount heavily as an investment signal.", "quote": null, "locator": "Author Bio for Pitch Submission", "quote_verified": false}]}], "insight_total": 6, "top_entities": ["Richard Shreiner", "QuantSync", "NASA", "PLL", "SerDes", "Moore’s Law"], "source_meta": {"author": "Admin", "word_count": 668, "paywalled": false}}, {"record_id": "622127eb3cfa3403", "source_type": "technology", "source_name": "SemiWiki", "source_url": "https://semiwiki.com/lithography/373583-maskless-euv-lithography-an-alternative-to-e-beam/", "title": "Maskless EUV Lithography: An Alternative to E-Beam", "published_date": "2026-10-18", "language": "en", "processed_at": "2026-10-20T11:07:59Z", "processor": "claude-code-sub-opus", "tags": ["Tech"], "gist": "Maskless EUV lithography would write digital patterns directly with a programmable array, sitting between masked EUV and slow serial e-beam. It faces major technical hurdles, so early use is likely niche (prototyping, low volume, mask repair) but could reduce the fixed cost of experimenting at the leading edge.", "themes": [{"theme": "Maskless EUV concept", "insights": [{"claim": "Maskless EUV would replace the physical photomask with a programmable, rapidly addressable optical element that writes digital patterns directly onto the wafer, whereas conventional EUV needs a costly custom mask set for every design.", "speaker": "Admin", "type": "framework", "entities": ["EUV", "maskless EUV"], "conviction": "medium", "so_what": "Turns a physical fixed cost into software-defined input.", "quote": null, "locator": "Maskless EUV lithography proposes", "quote_verified": false}, {"claim": "E-beam lithography is maskless and extremely fine but writes serially, making full-wafer exposure too slow for manufacturing, and parallel multibeam systems add complexity in beam control, calibration, data handling and defect management.", "speaker": "Admin", "type": "causal", "entities": ["e-beam lithography"], "conviction": "high", "so_what": "Throughput is the structural limit of e-beam, which is the gap maskless EUV targets.", "quote": "Their weakness is speed.", "locator": "The idea occupies an important middle ground", "quote_verified": true}, {"claim": "In principle millions of controllable elements could expose many features in parallel, combining direct digital patterning with the parallel exposure of light and allowing designs to change by loading a new pattern file.", "speaker": "Admin", "type": "thesis", "entities": ["maskless EUV"], "conviction": "medium", "so_what": "Faster iteration and lower fixed cost for small quantities.", "quote": null, "locator": "A maskless EUV platform could combine", "quote_verified": false}]}, {"theme": "Economics and adoption", "insights": [{"claim": "Mask costs and lead times increasingly shape who can experiment at the leading edge, encouraging fewer, safer bets, so maskless EUV could enable more experimentation, customized accelerators, small-batch photonics and secure or local chips.", "speaker": "Admin", "type": "thesis", "entities": ["maskless EUV"], "conviction": "medium", "so_what": "Lower design-iteration cost could broaden participation in advanced-node chip design.", "quote": "faster design-to-wafer cycles may be as valuable as smaller transistors", "locator": "This flexibility is why the technology matters", "quote_verified": true}, {"claim": "Early maskless EUV applications would likely be selective, such as prototyping, low-volume advanced devices, research, mask repair or particular critical layers, while masked EUV keeps its advantage for high-volume identical chips and e-beam for finest direct-write and mask production.", "speaker": "Admin", "type": "prediction", "entities": ["maskless EUV", "EUV", "e-beam lithography"], "conviction": "medium", "so_what": "It complements rather than displaces incumbent lithography, limiting near-term threat to ASML-style volume tools.", "quote": null, "locator": "For these reasons", "quote_verified": false}]}, {"theme": "Technical barriers", "insights": [{"claim": "Maskless EUV must work in vacuum with reflective optics, use a programmable pattern generator that survives EUV exposure, deliver adequate power, hold nanometer placement accuracy, control heat and contamination, and process vast pattern files in real time.", "speaker": "Admin", "type": "causal", "entities": ["maskless EUV"], "conviction": "high", "so_what": "Multiple unsolved engineering hurdles imply a long path to production.", "quote": null, "locator": "The approach, however", "quote_verified": false}, {"claim": "At very small dimensions limited photon counts cause stochastic resist variation such as rough edges, missing contacts or bridges, adding a further challenge for maskless EUV.", "speaker": "Admin", "type": "causal", "entities": ["photoresist"], "conviction": "high", "so_what": "Stochastics constrain yield for any EUV approach, including maskless.", "quote": null, "locator": "Photoresist behavior creates another challenge", "quote_verified": false}]}], "insight_total": 7, "top_entities": ["EUV", "maskless EUV", "e-beam", "SPIE Digital Library", "lithography"], "source_meta": {"author": "Admin", "word_count": 781, "paywalled": false}}, {"record_id": "3e204ec38fb579a2", "source_type": "technology", "source_name": "SemiWiki", "source_url": "https://semiwiki.com/forum/threads/26059", "title": "SpaceX and Tesla Put the Cost of AI in Focus", "published_date": "2026-10-19", "language": "en", "processed_at": "2026-10-20T11:07:59Z", "processor": "claude-code-sub-opus", "tags": ["Tech", "AI", "Positioning"], "gist": "SpaceX (Tuesday) and Tesla (Wednesday) earnings will test whether Musk's core businesses can fund escalating AI spending amid merger speculation. SpaceX spent $15.8 billion on AI capex last quarter and Tesla's free cash flow is expected to be deeply negative.", "themes": [{"theme": "Funding Musk's AI ambitions", "insights": [{"claim": "SpaceX and Tesla earnings this week will test whether Musk's established businesses can support increasingly expensive AI ambitions, with SpaceX reporting Tuesday and Tesla Wednesday.", "speaker": "SemiWiki", "type": "thesis", "entities": ["SpaceX", "Tesla", "Elon Musk"], "conviction": "medium", "so_what": "Earnings are a read-through on how long AI capex can be financed internally.", "quote": null, "locator": "SpaceX and Tesla’s earnings this week", "quote_verified": false}, {"claim": "SpaceX spent $15.8 billion on AI capital investment in the previous quarter, and analysts expect quarterly revenue of about $12.74 billion.", "speaker": "SemiWiki", "type": "data_point", "entities": ["SpaceX", "Starlink"], "conviction": "medium", "so_what": "AI capex exceeding quarterly revenue shows the scale of commitment relative to the base business.", "quote": "The company spent $15.8 billion on AI capital investment in the previous quarter", "locator": null, "quote_verified": true}, {"claim": "Analysts forecast Tesla revenue of about $27.88 billion and adjusted EPS of 43 cents versus 50 cents a year earlier, with heavy spending expected to push quarterly free cash flow deeply negative despite stronger deliveries.", "speaker": "SemiWiki", "type": "data_point", "entities": ["Tesla"], "conviction": "medium", "so_what": "Vehicle profits are not covering robotaxi, humanoid robot and AI infrastructure spending.", "quote": null, "locator": "Tesla faces a related challenge", "quote_verified": false}]}, {"theme": "Merger speculation and investor discipline", "insights": [{"claim": "Speculation is building about a SpaceX-Tesla merger that neither company nor Musk has formally endorsed, and a deal would raise valuation, ownership, voting control and risk-allocation questions for shareholders.", "speaker": "SemiWiki", "type": "thesis", "entities": ["SpaceX", "Tesla", "Elon Musk"], "conviction": "low", "so_what": "Shared leadership does not guarantee a combination benefits both shareholder groups equally.", "quote": "Shared leadership does not automatically mean a transaction benefits both groups equally.", "locator": "A merger would also raise questions", "quote_verified": true}, {"claim": "The most revealing signals will be management's spending commitments and explanations of when investments will produce cash, since revenue growth alone cannot establish sustainable economics.", "speaker": "SemiWiki", "type": "framework", "entities": ["SpaceX", "Tesla"], "conviction": "medium", "so_what": "Watch capex guidance and payback timelines  and EUR45 billion and its shares rose 2.8% to EUR1,551.60.", "speaker": "L", "type": "data_point", "entities": ["ASML", "Bloomberg"], "conviction": "high", "so_what": "Guidance upgrade confirms demand strength.", "quote": null, "locator": null, "quote_verified": false}, {"claim": "ASML has completed price conversations with key customers, with the effect visible partly through 2027 and fully from 2028, and China remains about a fifth of this year's revenue.", "speaker": "L", "type": "data_point", "entities": ["ASML", "China"], "conviction": "medium", "so_what": "Pricing power adds to margin upside beyond volume.", "quote": null, "locator": null, "quote_verified": false}, {"claim": "A second Dutch ASML campus is under construction with the first phase due in 2029, which is the horizon customers are now asking it to quote for.", "speaker": "L", "type": "data_point", "entities": ["ASML"], "conviction": "medium", "so_what": "New capacity arrives only in 2029, extending the shortage window.", "quote": null, "locator": null, "quote_verified": false}]}, {"theme": "Order book as evidence versus financial risk", "insights": [{"claim": "ASML's most advanced tools take more than a year between order and delivery, so its order book records what chipmakers have already committed to rather than what they say, making it the hardest evidence against the AI-bubble argument.", "speaker": "L", "type": "thesis", "entities": ["ASML"], "conviction": "medium", "so_what": "Physical tool orders are stronger demand evidence than sentiment or guidance.", "quote": "its book is a record of what chipmakers have already committed to rather than what they say", "locator": "ASML is the hardest evidence", "quote_verified": true}, {"claim": "An order for a lithography machine is not a revenue promise but a purchase of a physical object from the only company that makes it.", "speaker": "L", "type": "contrarian", "entities": ["ASML"], "conviction": "medium", "so_what": "ASML's exposure to AI-financing "NestJS 12: ESM Packages, Standard Schema Validation and Native Observability", "published_date": "2026-10-19", "language": "en", "processed_at": "2026-10-20T11:07:46Z", "processor": "claude-code-sub-opus", "tags": ["Tech"], "gist": "NestJS 12 moves core packages to ESM, adds Standard Schema validation, rebuilds the CLI and ships @nestjs/observe, a framework-native observability SDK. Early reviewers find ESM brings tooling cleanup rather than performance gains, and APM vendors warn of framework-level lock-in.", "themes": [{"theme": "ESM migration and upgrade path", "insights": [{"claim": "NestJS 12 ships its core packages as ESM while CommonJS apps continue to work via Node.js require(esm), so it requires Node.js 20.19+ or 22.12+.", "speaker": "Daniel Curtis", "type": "data_point", "entities": ["NestJS 12", "Node.js"], "conviction": "high", "so_what": "Low-friction ESM adoption lowers upgrade risk but forces Node version floors.", "quote": "Core packages now ship as ESM, but CommonJS applications keep working through Node.js require(esm) support", "locator": "The ESM change is the headline", "quote_verified": true}, {"claim": "Preview benchmarks found no meaningful startup or memory gains from ESM, so it is a tooling and configuration cleanup rather than a performance upgrade.", "speaker": "Anton Chapala", "type": "contrarian", "entities": ["ESM", "NestJS"], "conviction": "medium", "so_what": "Teams should not expect runtime performance benefits to justify migration effort.", "quote": "is a massive cleanup of tooling and configuration debt", "locator": "The ESM change is the headline", "quote_verified": true}, {"claim": "New ESM projects default to Vitest and oxlint and Rspack replaces webpack as the monorepo bundler, while nest upgrade moves packages to v12 and TypeScript 6 but deliberately does not convert projects to ESM, Vitest or oxlint.", "speaker": "Daniel Curtis", "type": "data_point", "entities": ["Vitest", "oxlint", "Rspack", "webpack", "TypeScript"], "conviction": "medium", "so_what": "Defaults track the shift away from webpack and legacy toolchains to Rust/Go-based tooling.", "quote": "It deliberately does not convert projects to ESM, Vitest or oxlint.", "locator": "It deliberately does not", "quote_verified": true}, {"claim": "Early adopters report friction: AWS Lambda runtimes need --experimental-require-module, path aliases break under ESM and Fastify middleware exceptions can hang.", "speaker": "Daniel Curtis", "type": "anecdote", "entities": ["AWS Lambda", "Fastify"], "conviction": "medium", "so_what": "ESM migration pitfalls remain in serverless and aliasing setups.", "quote": "AWS Lambda runtimes need --experimental-require-module", "locator": "One GitHub issue prompted docs", "quote_verified": true}, {"claim": "Follow-up v12.1 added built-in cookies, CSRF protection and security headers.", "speaker": "Daniel Curtis", "type": "data_point", "entities": ["NestJS"], "conviction": "medium", "so_what": "Rapid follow-ups show the framework absorbing middleware concerns into core.", "quote": null, "locator": "The follow-up v12.1", "quote_verified": false}]}, {"theme": "Standard Schema validation", "insights": [{"claim": "Route decorators accept a schema option for any Standard Schema compatible object, so Zod, Valibot and ArkType work without third-party wrappers, while class-validator remains the documented default.", "speaker": "Daniel Curtis", "type": "data_point", "entities": ["Zod", "Valibot", "ArkType", "class-validator"], "conviction": "high", "so_what": "Standard Schema reduces validator lock-in across the TypeScript ecosystem.", "quote": "accept a schema option taking any Standard Schema compatible object", "locator": "Day-to-day ergonomics", "quote_verified": true}, {"claim": "Building on a spec instead of directly on Zod keeps validator choice in developer hands, though types still need manual annotation because Nest relies on legacy TypeScript decorators.", "speaker": "Daniel Curtis", "type": "contrarian", "entities": ["Standard Schema", "Zod", "TypeScript"], "conviction": "low", "so_what": "Legacy decorators limit the type-inference benefits of schema-first validation.", "quote": "keeps the choice in my hands while removing the boilerplate", "locator": "Blogger iiaku", "quote_verified": true}]}, {"theme": "Native observability and first-party platform", "insights": [{"claim": "@nestjs/observe hooks into Nest's lifecycle via an instrument option rather than patching the HTTP server, reporting traces in terms of controllers and providers.", "speaker": "Daniel Curtis", "type": "data_point", "entities": ["@nestjs/observe", "NestJS"], "conviction": "high", "so_what": "Framework-native tracing yields richer context than generic HTTP instrumentation.", "quote": "The most debated addition is @nestjs/observe", "locator": "The most debated addition", "quote_verified": true}, {"claim": "Scout Monitoring warns the observability SDK is NestJS-only, lacks cross-stack correlation out of the box and risks vendor lock-in at the framework level.", "speaker": "Scout Monitoring", "type": "contrarian", "entities": ["Scout Monitoring", "@nestjs/observe"], "conviction": "medium", "so_what": "First-party observability competes with APM vendors and OpenTelemetry-style neutrality.", "quote": "vendor lock-in at the framework level", "locator": "The most debated addition", "quote_verified": true}, {"claim": "A new nest deploy command forwarding to the Mau platform points toward first-party services around the framework.", "speaker": "Daniel Curtis", "type": "thesis", "entities": ["Mau", "NestJS"], "conviction": "medium", "so_what": "Open-source frameworks are moving to monetize through hosted platforms and tooling.", "quote": "points the same way towards first-party services", "locator": "A new nest deploy command", "quote_verified": true}]}], "insight_total": 10, "top_entities": ["NestJS", "Node.js", "Zod", "Valibot", "ArkType", "Scout Monitoring", "Vitest", "Rspack", "TypeScript"], "source_meta": {"author": "Daniel Curtis", "word_count": 946, "paywalled": false}}, {"record_id": "1b5b4665f7113698", "source_type": "technology", "source_name": "InfoQ", "source_url": "https://www.infoq.com/news/2026/10/embeddinggemma-2-multimodal/", "title": "EmbeddingGemma 2 Expands Beyond Text to Support Code, Images, Video, and Audio", "published_date": "2026-10-19", "language": "en", "processed_at": "2026-10-20T11:07:46Z", "processor": "claude-code-sub-opus", "tags": ["Tech", "AI"], "gist": "Google released EmbeddingGemma 2, an Apache 2.0 open-weight model built on Gemma 4 that embeds text, code, images, video and audio into one 768-dimensional space, scaling from 270M to 740M parameters for on-device use. MRL truncation cuts storage sixfold but costs retrieval quality, especially for non-text modalities.", "themes": [{"theme": "Multimodal on-device embeddings", "insights": [{"claim": "EmbeddingGemma 2 is a compact open-weight multimodal embedding model based on Gemma 4 under Apache 2.0, aimed at efficient on-device semantic search and RAG.", "speaker": "Sergio De Simone", "type": "data_point", "entities": ["Google", "EmbeddingGemma 2", "Gemma 4"], "conviction": "high", "so_what": "Permissive licensing and small size make local multimodal retrieval a commodity capability.", "quote": "Based on Gemma 4 and released under the Apache 2.0 license", "locator": "Based on Gemma 4", "quote_verified": true}, {"claim": "The model represents text, code, images, video and audio in a single 768-dimensional embedding space, so developers can search across media types without maintaining separate incompatible embedding spaces.", "speaker": "Sergio De Simone", "type": "thesis", "entities": ["EmbeddingGemma 2"], "conviction": "high", "so_what": "Unified spaces simplify retrieval architecture and reduce index infrastructure for multimodal apps.", "quote": "represent text, code, images, video, and audio in a unified 768-dimensional embedding space", "locator": "EmbeddingGemma 2's key f // ---------- helpers ----------
// YouTube-aligned hex colors for tinted insight chips (bg = color+"1a", text = color, border = color+"55").
const TYPE_HEX = {
  thesis: '#6366f1', prediction: '#0ea5e9', framework: '#8b5cf6',
  data_point: '#7c3aed', causal: '#d97706', contrarian: '#dc2626',
  anecdote: '#64748b',
};
const CONV_HEX = { high: '#7c3aed', medium: '#ca8a04', low: '#94a3b8', exploratory: '#94a3b8' };
function typeHex(t) { return TYPE_HEX[String(t || '').toLowerCase()] || '#475569'; }
function convHex(c) { return CONV_HEX[String(c || '').toLowerCase()] || '#64748b'; }

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }

// Tinted chip (YouTube style): faint bg, colored text + border.
function tintChip(text, color) {
  return `<span class="chip" style="background:${color}1a;color:${color};border-color:${color}55">${escapeHtml(text)}</span>`;
}
function tagPills(tags) {
  if (!tags || !tags.length) return '';
  return tags.map(t => `<span class="pill tag">${escapeHtml(t)}</span>`).join(' ');
}

// ---------- rendering ----------
// Insight presentation ported from the YouTube digest: type/conviction tinted
// chips, speaker as a 🗣 chip, and entities as indigo chips — all in the meta row
// directly under the claim. Quote treatment is INTENTIONALLY kept as Concepts'
// verbatim + "✓ verified" (stronger than YouTube's ≈ paraphrase wording).
function renderInsight(ins) {
  if (!ins) return '';
  const cls = 'insight' + (ins.type ? (' ' + String(ins.type).toLowerCase()) : '');
  const meta = [];
  if (ins.type) meta.push(tintChip(ins.type, typeHex(ins.type)));
  if (ins.speaker) meta.push(`<span class="chip chip-spk">🗣 ${escapeHtml(ins.speaker)}</span>`);
  if (ins.conviction) meta.push(tintChip('conviction: ' + ins.conviction, convHex(ins.conviction)));
  (ins.entities || []).slice(0, 12).forEach(e => {
    if (e) meta.push(`<span class="chip chip-ent">${escapeHtml(e)}</span>`);
  });
  let quote = '';
  if (ins.quote) {
    const v = ins.quote_verified
      ? `<span class="vmark">✓ verified</span>`
      : `<span class="vmark no">unverified</span>`;
    quote = `<div class="quote">“${escapeHtml(ins.quote)}”${v}</div>`;
  }
  const so = ins.so_what
    ? `<div class="insight-so"><span class="lbl">so what</span>${escapeHtml(ins.so_what)}</div>` : '';
  return `
    <div class="${cls}">
      <div class="insight-claim">${escapeHtml(ins.claim || '')}</div>
      <div class="insight-meta">${meta.join('')}</div>
      ${so}
      ${quote}
    </div>`;
}

function renderTheme(theme) {
  const insights = (theme.insights || []).map(renderInsight).join('');
  return `
    <div class="theme">
      <div class="theme-title">${escapeHtml(theme.theme || 'Theme')}</div>
      ${insights}
    </div>`;
}

function renderCard(card) {
  if (!card) return '';
  const meta = card.source_meta || {};
  const nameHtml = card.source_url
    ? `<a class="source-name" href="${escapeAttr(card.source_url)}" target="_blank" rel="noopener">${escapeHtml(card.source_name || '')}</a>`
    : `<span class="source-name">${escapeHtml(card.source_name || '')}</span>`;
  const subBits = [];
  if (card.published_date) subBits.push(escapeHtml(card.published_date));
  if (meta.author) subBits.push(escapeHtml(meta.author));
  if (meta.word_count) subBits.push(`${meta.word_count} words`);
  if (meta.paywalled) subBits.push('paywalled');
  const themes = (card.themes || []).map(renderTheme).join('');
  const n = card.insight_total != null ? card.insight_total
            : (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
  return `
    <div class="source">
      <div class="source-head" onclick="toggleSource(this)">
        <div class="source-meta-left">
          <div class="source-name-row">${nameHtml}</div>
          <div class="source-title">${escapeHtml(card.title || '')}</div>
          <div class="source-sub">${subBits.join('  ·  ')}</div>
        </div>
        <span class="source-count">${n} insight${n === 1 ? '' : 's'}</span>
        <span class="source-arrow">▸</span>
      </div>
      <div class="source-body">
        ${card.gist ? `<div class="gist">${escapeHtml(card.gist)}</div>` : ''}
        ${card.tags && card.tags.length ? `<div class="tags">${tagPills(card.tags)}</div>` : ''}
        ${themes || '<div class="empty">No insights.</div>'}
      </div>
    </div>`;
}

function renderTopStats(d) {
  const s = d.stats || {};
  const parts = [];
  if (d.date) parts.push(`date <strong>${escapeHtml(d.date)}</strong>`);
  if (s.lookback_days != null) parts.push(`lookback <strong>${s.lookback_days}d</strong>`);
  if (s.sources != null) parts.push(`sources <strong>${s.sources}</strong>`);
  if (s.cards != null) parts.push(`cards <strong>${s.cards}</strong>`);
  if (s.insights != null) parts.push(`insights <strong>${s.insights}</strong>`);
  if (s.quote_verified_pct != null) parts.push(`quotes verified <strong>${s.quote_verified_pct}%</strong>`);
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSource(headEl) { headEl.parentElement.classList.toggle('open'); }

function insightCount(card) {
  return (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
}

// Build the sort/filter control bar (display only — re-groups REPORT_DATA in place).
function buildControls(d) {
  const cards = d.cards || [];
  const names = [...new Set(cards.map(c => c.source_name || '—'))].sort((a, b) => a.localeCompare(b));
  const opts = names.map(n => `<option value="${escapeAttr(n)}">${escapeHtml(n)}</option>`).join('');
  document.getElementById('controls').innerHTML =
    `<label>Sort
       <select id="sortSel">
         <option value="source">Source A–Z</option>
         <option value="insights">Insight count ▼</option>
       </select></label>
     <label>Source
       <select id="srcSel">
         <option value="__all">All sources (${names.length})</option>
         ${opts}
       </select></label>
     <span class="ctl-btns">
       <button type="button" id="expandAll">Expand all</button>
       <button type="button" id="collapseAll">Collapse all</button>
     </span>`;
  document.getElementById('sortSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('srcSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('expandAll').addEventListener('click', () => setAllGroups(false));
  document.getElementById('collapseAll').addEventListener('click', () => setAllGroups(true));
}

// Group-level collapse: header click toggles one group; the control-bar buttons toggle all.
function toggleGroup(headEl) { headEl.parentElement.classList.toggle('collapsed'); }
function setAllGroups(collapsed) {
  document.querySelectorAll('.group').forEach(g => g.classList.toggle('collapsed', collapsed));
}

// Group cards by source, sort groups (and cards within), optionally filter to one source.
function renderGroups(d) {
  const sortMode = (document.getElementById('sortSel') || {}).value || 'source';
  const srcFilter = (document.getElementById('srcSel') || {}).value || '__all';
  let cards = (d.cards || []).slice();
  if (srcFilter !== '__all') cards = cards.filter(c => (c.source_name || '—') === srcFilter);

  const groups = new Map();
  cards.forEach(c => {
    const k = c.source_name || '—';
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(c);
  });
  let entries = [...groups.entries()].map(([name, cs]) => ({
    name, cards: cs, insights: cs.reduce((a, c) => a + insightCount(c), 0),
  }));
  if (sortMode === 'insights') entries.sort((a, b) => b.insights - a.insights || a.name.localeCompare(b.name));
  else entries.sort((a, b) => a.name.localeCompare(b.name));
  // Within each source group, heaviest cards first.
  entries.forEach(e => e.cards.sort((a, b) => insightCount(b) - insightCount(a)));

  const html = entries.map(e => {
    const head = `<div class="group-head" onclick="toggleGroup(this)">`
      + `<span class="group-name">${escapeHtml(e.name)}</span>`
      + `<span class="group-meta">${e.cards.length} card${e.cards.length === 1 ? '' : 's'} · ${e.insights} insights</span>`
      + `<span class="group-arrow">▾</span></div>`;
    return `<div class="group">${head}<div class="group-body">${e.cards.map(renderCard).join('')}</div></div>`;
  }).join('');

  const app = document.getElementById('app');
  app.innerHTML = html || '<div class="empty">No cards for this source.</div>';
  // Open the first two source cards by default.
  document.querySelectorAll('.source').forEach((sec, i) => { if (i < 2) sec.classList.add('open'); });
}

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  document.getElementById('stats-top').innerHTML = renderTopStats(d);
  buildControls(d);
  renderGroups(d);   // default: grouped, sorted by source A–Z
}

renderReport(REPORT_DATA);
</script>
