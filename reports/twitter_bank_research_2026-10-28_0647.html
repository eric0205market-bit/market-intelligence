<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root {
  --bg: #faf8f5;
  --surface: #ffffff;
  --border: #e8e4df;
  --border-light: #f0ede4;
  --text: #1a1a1a;
  --text-2: #555;
  --text-3: #8a8a8a;
  --accent: #2563eb;
  --accent-bg: #f0f5ff;
  --accent-2: #1d4ed8;
  --tag-text: #0e7490;
  --tag-bg: #e8f4f8;
  --yellow: #fff5b3;
  --yellow-border: #f0d966;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; line-height: 1.55;
       background: var(--bg); color: var(--text); }
.container { max-width: 960px; margin: 0 auto; padding: 24px 16px 80px; }

/* HEADER */
.header { display: flex; justify-content: space-between; align-items: baseline;
          border-bottom: 2px solid var(--accent); padding-bottom: 12px; margin-bottom: 20px; }
.title { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; color: var(--accent); }
.subtitle { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-3); }

/* FILTER BAR */
.filter-bar { display: none; background: var(--yellow); border: 1px solid var(--yellow-border);
              border-radius: 6px; padding: 8px 12px; margin-bottom: 16px;
              align-items: center; gap: 10px; font-size: 13px; }
.filter-bar.active { display: flex; }
.filter-bar button { font-family: inherit; font-size: 12px; background: transparent;
                     border: 1px solid var(--text); padding: 3px 10px; border-radius: 4px;
                     cursor: pointer; }
.filter-bar button:hover { background: rgba(0,0,0,0.05); }

/* SUMMARY */
.summary { background: var(--surface); border: 1px solid var(--border);
           border-left: 4px solid var(--accent); border-radius: 6px;
           padding: 16px 18px; margin-bottom: 20px; }
.summary p { margin-bottom: 8px; }
.summary p:last-child { margin-bottom: 0; }
.summary strong { font-weight: 600; }

/* SECTIONS (top-level collapsible) */
.section { background: var(--surface); border: 1px solid var(--border);
           border-radius: 6px; margin-bottom: 14px; overflow: hidden; }
.section-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px;
                background: var(--accent-bg); cursor: pointer; user-select: none;
                font-weight: 600; font-size: 13px; color: var(--accent-2); }
.section-head:hover { background: #e1ecff; }
.section-letter { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
                  min-width: 18px; }
.section-name { flex: 1; }
.section-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
                 color: var(--text-3); }
.section-arrow { font-size: 10px; transition: transform .2s; }
.section.open .section-arrow { transform: rotate(90deg); }
.section-body { display: none; padding: 6px 0; }
.section.open .section-body { display: block; }

/* TOPIC (nested collapsible inside Topics section) */
.topic { border-bottom: 1px solid var(--border-light); }
.topic:last-child { border-bottom: none; }
.topic-head { display: flex; align-items: center; gap: 10px; padding: 10px 16px;
              background: var(--accent-bg); cursor: pointer; user-select: none;
              font-size: 13px; font-weight: 600; color: var(--accent-2); }
.topic-head:hover { background: #e1ecff; }
.topic-name { flex: 1; }
.topic-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-3); }
.topic-arrow { font-size: 10px; transition: transform .2s; }
.topic.open .topic-arrow { transform: rotate(90deg); }
.topic-body { display: none; padding: 4px 0 6px; }
.topic.open .topic-body { display: block; }

/* ITEM CARDS */
.item-card { background: var(--surface); border: 1px solid var(--border);
             border-radius: 6px; padding: 12px 14px; margin: 10px 16px; }
.item-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
             flex-wrap: wrap; }
.item-author { font-weight: 600; color: var(--accent); cursor: pointer; }
.item-author:hover { text-decoration: underline; }
.item-time { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-3); }
.item-link { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--accent); text-decoration: none; }
.item-link:hover { text-decoration: underline; }
.item-text { font-size: 13.5px; line-height: 1.6; color: var(--text);
             white-space: pre-wrap; word-wrap: break-word; }

/* DATA POINT TAGS */
.data-points { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.dp-tag { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
          background: var(--tag-bg); color: var(--tag-text);
          padding: 2px 7px; border-radius: 4px; }

/* CHARTS (large, NOT thumbnails) */
.charts { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.chart { width: 100%; max-width: 420px; height: auto;
         border: 1px solid var(--border); border-radius: 4px; cursor: zoom-in;
         background: #f0ede4; }

/* LIGHTBOX */
.lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85);
            align-items: center; justify-content: center; z-index: 100; cursor: zoom-out; }
.lightbox.open { display: flex; }
.lightbox img { max-width: 92vw; max-height: 92vh;
                box-shadow: 0 8px 40px rgba(0,0,0,.6); }

/* LINKS */
.link-row { padding: 8px 16px; border-bottom: 1px solid var(--border-light);
            font-size: 13px; display: flex; gap: 12px; align-items: baseline; }
.link-row:last-child { border-bottom: none; }
.link-author { color: var(--text-3); min-width: 110px; cursor: pointer; }
.link-author:hover { color: var(--accent); }
.link-url { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
            color: var(--accent); text-decoration: none; word-break: break-all; flex: 1; }
.link-url:hover { text-decoration: underline; }
.link-desc { color: var(--text-2); font-size: 12px; }

/* AUTHOR FILTER STATES */
.filterable.match { background: var(--yellow); border-color: var(--yellow-border); }
.filterable.dim { opacity: 0.25; }

/* STATS BAR */
.stats { margin-top: 24px; padding: 10px 14px; background: var(--surface);
         border: 1px solid var(--border); border-radius: 6px;
         font-family: 'IBM Plex Mono', monospace; font-size: 11.5px;
         color: var(--text-2); display: flex; gap: 18px; flex-wrap: wrap; }
.stats strong { color: var(--text); font-weight: 600; }

.empty { color: var(--text-3); font-size: 13px; padding: 14px 18px; font-style: italic; }

@media (max-width: 640px) {
  .container { padding: 16px 12px 60px; }
  .item-card { margin: 8px 10px; }
  .link-row { flex-direction: column; gap: 4px; }
  .link-author { min-width: 0; }
  .header { flex-direction: column; align-items: flex-start; gap: 4px; }
  .chart { max-width: 100%; }
}
</style>

<script>
const REPORT_DATA = {"report_type": "TWITTER BANK RESEARCH", "collected_at": "2026-10-28T06:23:50Z", "window_days": 4, "input_stats": {"total_tweets": 119, "considered": 119, "kept": 33, "dropped": 86, "deduped": 0}, "freshness_gate": "FRESHNESS GATE PASSED.", "summary": "Goldman dominates the window: GDP tracking (+3.3–3.4% Q3), 13% market-implied recession risk, negative equity sentiment indicators, buyback-window and CTA flow estimates.\nBofA: consumer confidence, Iran hedging costs, 10yr yield and retail spending; JPM: Feroli Fed view, duration returns, profit margins.\nOther: SocGen midterm seasonality, Morgan Stanley year-end catalysts, Apollo/Slok core PCE, Yardeni sentiment.\nCounts: Goldman 16, BofA 7, JPM 3, Yardeni 3, Deutsche 2, HSBC 2, Apollo/Slok 1, Citadel 1, Morgan Stanley 1, SocGen 1.", "by_bank_counts": {"Goldman": 16, "BofA": 7, "JPM": 3, "Yardeni": 3, "Deutsche": 2, "HSBC": 2, "Apollo/Slok": 1, "Citadel": 1, "Morgan Stanley": 1, "SocGen": 1}, "banks": [{"bank": "Goldman", "theme": "GDP tracking, recession odds, sentiment indicators, buyback window and CTA flow estimates", "items": [{"author": "MikeZaccardi", "text": "GS: Core Capital Goods Orders in Line With Expectations but Shipments Above Expectations; \n\nBoosting Q3 GDP Tracking Estimate to +3.4% https://t.co/hqispQDEVL", "tweet_url": "https://x.com/MikeZaccardi/status/2115216249630130242", "images": ["https://pbs.twimg.com/media/HVrB-GsXkAA3HGk.png"], "created_at": "2026-10-27T22:57:07.000Z", "relayers": []}, {"author": "neilsethinew", "text": "As expected, Goldman raises Q3 GDP tracking to +3.4% after durable goods. https://t.co/pNchSyZ0Ip", "tweet_url": "https://x.com/neilsethinew/status/2115111284685635606", "images": ["https://pbs.twimg.com/media/HVpaS8LWkAAV_Mb.png"], "created_at": "2026-10-27T16:00:01.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "Zooming out (not just midterm years).. now is often a great time to buy GS $SPY https://t.co/IzpAF0tkw6", "tweet_url": "https://x.com/MikeZaccardi/status/2115088880705900957", "images": ["https://pbs.twimg.com/media/HVPQampWgAAUeKv.jpg"], "created_at": "2026-10-27T14:31:00.000Z", "relayers": []}, {"author": "neilsethinew", "text": "Goldman: We estimate ~27% of the index is currently in open buyback window, with that number almost doubling to ~50% by the end of the week. \n\nAs reporting progresses and corporate windows systematically reopen, we anticipate an uptick in volumes into November, which seasonally ranks as our second most active execution month on the desk. \n\nIn terms of execution mix, clients are slowly moving back into opportunistic open market flow, with discretionary orders climbing to 16% vs 84% in 10b5-1plans (compared to 15% and 85% respectively in the prior week).", "tweet_url": "https://x.com/neilsethinew/status/2115086264336605205", "images": ["https://pbs.twimg.com/media/HVpLv4fWsAAhFRK.png"], "created_at": "2026-10-27T14:20:36.000Z", "relayers": []}, {"author": "neilsethinew", "text": "From @C_Barraud's Morning Brief, ZeroHedge points out we need another update to the AI \"circular financing\" chart, as Nvidia, AMD and Broadcom, three of Meta's biggest chip suppliers, \"indicated an interest\" in buying up to $5 billion of Meta's announced $95 billion equity offering.\n\nNote though that indication is non-binding, and they \"may determine to purchase more, fewer, or no shares.\" \n\nZH's take: \"If Meta, with an AA- rating and one of the world's two biggest ad businesses, prefers stock to bonds, the question for everyone else is obvious. Oracle hosts its investor day on Wednesday. SpaceX still has to price its $40 billion chip deal. Microsoft and Alphabet report Wednesday, Amazon on Thursday, and Goldman's TMT desk warns that 'any signs of further equity issuance or balance-sheet pressure are unlikely to be well received.' As for the neoclouds, which have neither Starlink nor Instagram to fall back on, Musk has already written the obituary.\"", "tweet_url": "https://x.com/neilsethinew/status/2115063632161636611", "images": ["https://pbs.twimg.com/media/HVo21YXXsAAuLDh.png"], "created_at": "2026-10-27T12:50:40.000Z", "relayers": []}, {"author": "neilsethinew", "text": "Goldman, like Tier1Alpha, sees gamma as farily negative (so accelerating direction moves in the SPX).  While it builds in both directions, it is not modeled to turn positive even on sharp (10%+) moves in either direction, arguing for continued index-level volatility for now. https://t.co/ud2xDFBvkl", "tweet_url": "https://x.com/neilsethinew/status/2115045847255695858", "images": ["https://pbs.twimg.com/media/HVmfYb1W8AA6zmr.png"], "created_at": "2026-10-27T11:40:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "The probability of a US recession in the next 1 year has risen from 8% to 13%\n\nGoldman sees a 15% chance https://t.co/zMF3NY6dap", "tweet_url": "https://x.com/MikeZaccardi/status/2115044213180027161", "images": ["https://pbs.twimg.com/media/HVolgRhXIAAEjAY.png"], "created_at": "2026-10-27T11:33:30.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "GS: 13% market-implied recession risk in the next 12 months https://t.co/or8tmbI9sd", "tweet_url": "https://x.com/MikeZaccardi/status/2115043583300415897", "images": ["https://pbs.twimg.com/media/HVok7neX0AETmvt.png"], "created_at": "2026-10-27T11:31:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "GS Social Media Sentiment Index continues to deteriorate... now a 2-year low... as if on a seasonal cue https://t.co/8XBbUQQHpS", "tweet_url": "https://x.com/MikeZaccardi/status/2115042954490314793", "images": ["https://pbs.twimg.com/media/HVokW_8X0AEMsle.png"], "created_at": "2026-10-27T11:28:30.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "GS Wage Tracker remains subdued and below real-time inflation https://t.co/frs7017RR8", "tweet_url": "https://x.com/MikeZaccardi/status/2115042325210529892", "images": ["https://pbs.twimg.com/media/HVojyYXWYAAnPED.png"], "created_at": "2026-10-27T11:26:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "GS: Our Q3 GDP forecast stands at +3.3% https://t.co/BdVtqSW1Yf", "tweet_url": "https://x.com/MikeZaccardi/status/2115041696039776685", "images": ["https://pbs.twimg.com/media/HVojNwpXIAAmuiy.png"], "created_at": "2026-10-27T11:23:30.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "GS: 2027 US and global GDP estimates... no upward revisions yet https://t.co/AEk8MyM075", "tweet_url": "https://x.com/MikeZaccardi/status/2115041067238056270", "images": ["https://pbs.twimg.com/media/HVoipJBWUAACIC0.jpg"], "created_at": "2026-10-27T11:21:00.000Z", "relayers": []}, {"author": "LanceRoberts", "text": "Both $GS and $MS investment sentiment indicators have pulled back into more neutral territory. \nh/t @thedailyshot https://t.co/FOa1C96kTx", "tweet_url": "https://x.com/LanceRoberts/status/2115030384002138376", "images": ["https://pbs.twimg.com/media/HVoYv_gXQAAixRs.jpg", "https://pbs.twimg.com/media/HVoYwhlXYAAEp1M.jpg"], "created_at": "2026-10-27T10:38:33.000Z", "relayers": []}, {"author": "neilsethinew", "text": "Goldman updated their SPX CTA estimates Monday and per @dailychartbook's nightly email now see as their base case approximately $11.5B in selling just this week ($23.3B globally with selling \"across all regions\").  \n\nHere's the full breakdown:\n\nOver the next 1 week…\nFlat tape: Sellers -$11.6B out of the SPX\nUp tape (+2 s/d): Sellers -$5.9B out of the SPX\nDown tape (-2.5 s/d): Sellers -$26.4B out of the SPX\n\nOver the next 1 month…\nFlat tape: Sellers -$11.9B out of the SPX\nUp tape: Buyers $11.2B into the SPX\nDown tape: Sellers -$64.4B out of the SPX", "tweet_url": "https://x.com/neilsethinew/status/2115025714768433619", "images": ["https://pbs.twimg.com/media/HVmZgfwXAAAZ36J.jpg"], "created_at": "2026-10-27T10:20:00.000Z", "relayers": []}, {"author": "neilsethinew", "text": "Goldman’s US Equity Sentiment Indicator* remained negative for a seventh week, but at -0.23, the least negative since the first of those weeks.\n\nThe current reading is associated with a 1-month average return of around 1% since 2009 which is pretty good with a positive rate around 52%.\n\n*The indicator combines “six weekly and three monthly indicators that span [across the more than 80% of the US equity market that is owned by institutional, retail and foreign investors]. Readings of +1.0 or higher have historically signaled stretched equity positioning. Readings of -1.0 or lower have signaled very light positioning and have historically been a statistically significant signal for subsequent S&P 500 performance”.", "tweet_url": "https://x.com/neilsethinew/status/2115005587037540852", "images": ["https://pbs.twimg.com/media/HVmiXOMW8AA26V-.jpg"], "created_at": "2026-10-27T09:00:01.000Z", "relayers": []}, {"author": "dailychartbook", "text": "\"We estimate ~27% of the index is currently in open window, with that number almost doubling to ~50% by the end of the week.\"\n\n-Robbie Stankard, Goldman Sachs https://t.co/lq8plWYiSi", "tweet_url": "https://x.com/dailychartbook/status/2114997909586350316", "images": ["https://pbs.twimg.com/media/HVn7Y_-W0AAzQ0Q.jpg"], "created_at": "2026-10-27T08:29:31.000Z", "relayers": []}]}, {"bank": "BofA", "theme": "Consumer confidence, Iran hedging costs, 10yr yield outlook and retail spending", "items": [{"author": "neilsethinew", "text": "The Conference Board’s consumer confidence index jumps 7.5 points in October to 91.7, the highest since June and far above the 81.0 expected. It was the biggest beat since May 2025 per ZeroHedge, and the first increase in four months per Bloomberg.\n\n▪ All five components improved\n▪ Present Situation: 120.4, a six-month high per Bloomberg. Net business conditions turned positive again at +3.6%, from −1.2%\n▪ Labor differential: Jobs “plentiful”: 26.7%, a six-month high. “Hard to get” unchanged at 21.4%\n▪ Expectations: 72.6, “only partially reversing three consecutive monthly declines,” and still below the 80 level the Conference Board has linked to recession\n▪ Expected jobs still negative at −11.1%, but expected income rose to +6.7%\n▪ Average 12-month inflation expectations: 5.8%, which “remained elevated”\n▪ 49.6% expect higher stock prices, against a 35.7% long-run average (Yardeni Research)\n▪ Spending plans weakened: durable goods “dropped across the board,” and services were “generally lower” except movies, live entertainment and sports\n▪ Gains were narrow: on a six-month basis, only under-35s and households earning $100,000+ saw confidence rise. Confidence improved “much more so for Republicans”\n\nThe Conference Board’s McCormick: the rebound “was in line with retail gasoline prices easing,” but confidence “remained on the long-term downward trend.”", "tweet_url": "https://x.com/neilsethinew/status/2115096634824470890", "images": ["https://pbs.twimg.com/media/HVpVKTOW4AA3g7y.jpg"], "created_at": "2026-10-27T15:01:48.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "The Conference Board: Overall, more consumers in October expected stock prices to increase rather than decrease in the next 12 months.\n\nConsumers’ average 12-month inflation expectations declined in October but remained elevated at 5.8% https://t.co/8WGlJWqd3R", "tweet_url": "https://x.com/MikeZaccardi/status/2115083346745217210", "images": ["https://pbs.twimg.com/media/HVpJGIXWoAARtfo.png"], "created_at": "2026-10-27T14:09:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "BofA: Hedging Iran risk is getting expensive\n\nThe energy sector is trading at its richest levels vs. the index since at least a year ago. https://t.co/GwjXjvlvFD", "tweet_url": "https://x.com/MikeZaccardi/status/2115040438881062926", "images": ["https://pbs.twimg.com/media/HVoiEkUXAAAp_TS.jpg"], "created_at": "2026-10-27T11:18:30.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "Ciana BofA: 10yr yield... Correction within an uptrend, should end by 4.83%, and not below 4.74% $TNX https://t.co/RGZYFACgJ3", "tweet_url": "https://x.com/MikeZaccardi/status/2115039809076899947", "images": ["https://pbs.twimg.com/media/HVohf6dW8AEKf4r.png"], "created_at": "2026-10-27T11:16:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "BofA: In each year of 2023-25, retail ex-auto spending ran about 18% above its annual average in the five weeks ending Dec 24. \n\nThis year, we expect elevated airfares to weigh on holiday travel. We think this could boost retail spending. https://t.co/3k6jZJ6pOO", "tweet_url": "https://x.com/MikeZaccardi/status/2115039180061364561", "images": ["https://pbs.twimg.com/media/HVog7SaWQAABcBy.png"], "created_at": "2026-10-27T11:13:30.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "Durables, Conference Board, housing data on tap. 5-year auction at 1pm ET @seekingalpha https://t.co/H9GEfcWYcn", "tweet_url": "https://x.com/MikeZaccardi/status/2115038550471164164", "images": ["https://pbs.twimg.com/media/HVogWp8WIAA2J7Q.png"], "created_at": "2026-10-27T11:11:00.000Z", "relayers": []}, {"author": "neilsethinew", "text": "It’s a full slate of economic data and earnings as the Fed starts its two-day meeting. \n\nSeptember economic reports include durable goods orders and new home sales. October reports include Conference Board consumer confidence and the Richmond Fed manufacturing and Dallas Fed services surveys. For August, we get the S&P Cotality Case-Shiller and FHFA home price indexes. We’ll also get the weekly ADP NER Pulse.\n\nThe FOMC begins its two-day meeting, with the decision Wednesday at 2pm ET.\n\nNon-Bill (>1yr in maturity) US Treasury auctions are $70B of 5-year notes. Treasury will also conduct a buyback of 20- to 30-year securities.\n\n41 S&P 500 components report, six of them with market caps over $100B:\n\nBefore the open: Coca-Cola ($KO), Boeing ($BA), S&P Global ($SPGI), HCA Healthcare ($HCA), Freeport-McMoRan ($FCX), American Tower ($AMT), Johnson Controls ($JCI), UPS ($UPS), // ---------- helpers ----------
function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }

function renderBold(text) {
  return escapeHtml(text).replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
}

function relativeTime(iso) {
  if (!iso) return '';
  const dt = new Date(iso);
  if (isNaN(dt.getTime())) return '';
  const secs = Math.max(0, (Date.now() - dt.getTime()) / 1000);
  if (secs < 60)   return Math.floor(secs) + 's ago';
  const mins = secs / 60;
  if (mins < 60)   return Math.floor(mins) + 'm ago';
  const hrs  = mins / 60;
  if (hrs < 48)    return Math.floor(hrs) + 'h ago';
  return Math.floor(hrs / 24) + 'd ago';
}

function authorTag(name, cls = 'item-author') {
  if (!name) return '';
  return `<span class="${cls}" onclick="filterAuthor('${escapeAttr(name)}')">@${escapeHtml(name)}</span>`;
}

// ---------- rendering ----------
function renderCharts(images) {
  if (!images || !images.length) return '';
  return `<div class="charts">` + images.map(u =>
    `<img src="${escapeAttr(u)}" class="chart" loading="lazy" alt="" onclick="openLightbox('${escapeAttr(u)}')">`
  ).join('') + `</div>`;
}

function renderDataPoints(points) {
  if (!points || !points.length) return '';
  return `<div class="data-points">` + points.map(p =>
    `<span class="dp-tag">${escapeHtml(p)}</span>`
  ).join('') + `</div>`;
}

function renderRelayers(item) {
  const r = item.relayers || [];
  if (!r.length) return '';
  // gen_bank_research_report.py already puts this line into data_points.
  if ((item.data_points || []).some(p => String(p).startsWith('also carried by'))) return '';
  return `<div class="data-points"><span class="dp-tag">also carried by: ${
    r.map(a => '@' + escapeHtml(a)).join(', ')}</span></div>`;
}

function renderItem(item, preferText) {
  const author = item.author || item.author_username || '';
  const time = relativeTime(item.created_at);
  const link = item.tweet_url
    ? `<a class="item-link" href="${escapeAttr(item.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  const body = preferText ? (item.text || item.description || '')
                          : (item.description || item.text || '');
  return `
    <div class="item-card filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${authorTag(author)}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      ${body ? `<div class="item-text">${escapeHtml(body)}</div>` : ''}
      ${renderDataPoints(item.data_points)}
      ${renderRelayers(item)}
      ${renderCharts(item.images)}
    </div>`;
}

function renderTopic(topic, idx) {
  const items = (topic.items || []).map(it => renderItem(it, topic._fromBanks)).join('');
  const name = topic.topic || topic.name || `Topic ${idx + 1}`;
  return `
    <div class="topic">
      <div class="topic-head" onclick="toggleTopic(this)">
        <span class="topic-name">${escapeHtml(name)}</span>
        <span class="topic-count">${(topic.items || []).length}</span>
        <span class="topic-arrow">▸</span>
      </div>
      <div class="topic-body">${items || '<div class="empty">No items.</div>'}</div>
    </div>`;
}

function renderLink(l) {
  const author = l.author || l.author_username || '';
  const url = l.url || (l.resolved || l.tco) || '';
  return `
    <div class="link-row filterable" data-author="${escapeAttr(author).toLowerCase()}">
      ${author ? authorTag(author, 'link-author') : '<span class="link-author">—</span>'}
      <a class="link-url" href="${escapeAttr(url)}" target="_blank" rel="noopener">${escapeHtml(url)}</a>
      ${l.description ? `<span class="link-desc">${escapeHtml(l.description)}</span>` : ''}
    </div>`;
}

function renderSection(letter, name, body, count) {
  return `
    <div class="section">
      <div class="section-head" onclick="toggleSection(this)">
        <span class="section-letter">${letter}.</span>
        <span class="section-name">${escapeHtml(name)}</span>
        <span class="section-count">${count}</span>
        <span class="section-arrow">▸</span>
      </div>
      <div class="section-body">${body}</div>
    </div>`;
}

function renderSummary(text) {
  if (!text) return '';
  const paragraphs = String(text).split(/\n\n+/).filter(Boolean)
    .map(p => `<p>${renderBold(p)}</p>`).join('');
  return `<div class="summary">${paragraphs}</div>`;
}

// The bank-research routine emits `banks` [{bank, theme, items[{text,...}]}];
// older reports (and the Data template's schema) use `topics`. Render `banks`
// directly when present, else fall back to `topics`.
function reportGroups(d) {
  if (Array.isArray(d.banks) && d.banks.length) {
    return { label: 'Banks', unit: 'banks', groups: d.banks.map(b => ({
      topic: b.theme ? `${b.bank} — ${b.theme}` : (b.bank || ''),
      items: b.items || [],
      _fromBanks: true,
    })) };
  }
  return { label: 'Topics', unit: 'topics', groups: d.topics || [] };
}

function renderStats(d) {
  const parts = [];
  const cov = d.coverage || {};
  if (cov.authors_covered != null && cov.authors_total != null) {
    const pct = cov.authors_total ? (100 * cov.authors_covered / cov.authors_total) : 0;
    parts.push(`coverage <strong>${cov.authors_covered}/${cov.authors_total}</strong> (${pct.toFixed(0)}%)`);
  }
  const g = reportGroups(d);
  const topicCount = g.groups.length;
  const itemCount = g.groups.reduce((n, t) => n + (t.items || []).length, 0);
  parts.push(`${g.unit} <strong>${topicCount}</strong>`);
  parts.push(`items <strong>${itemCount}</strong>`);
  if ((d.links || []).length) parts.push(`links <strong>${d.links.length}</strong>`);
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSection(el) { el.parentElement.classList.toggle('open'); }
function toggleTopic(el)   { el.parentElement.classList.toggle('open'); }

function openLightbox(src) {
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-img').src = '';
}

let activeFilter = null;
function filterAuthor(name) {
  if (!name) return;
  activeFilter = String(name).toLowerCase();
  document.querySelectorAll('.filterable').forEach(el => {
    const a = (el.dataset.author || '').toLowerCase();
    if (a === activeFilter) { el.classList.add('match'); el.classList.remove('dim'); }
    else                    { el.classList.add('dim'); el.classList.remove('match'); }
  });
  document.getElementById('filter-name').textContent = '@' + name;
  document.getElementById('filter-bar').classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function clearFilter() {
  activeFilter = null;
  document.querySelectorAll('.filterable').forEach(el => {
    el.classList.remove('match'); el.classList.remove('dim');
  });
  document.getElementById('filter-bar').classList.remove('active');
}
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (document.getElementById('lightbox').classList.contains('open')) closeLightbox();
    else if (activeFilter) clearFilter();
  }
});

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';

  const g = reportGroups(d);
  const topicsBody = g.groups.map(renderTopic).join('')
                  || `<div class="empty">No ${g.unit}.</div>`;
  const linksBody = (d.links || []).map(renderLink).join('');

  const sections = [
    renderSummary(d.summary),
    renderSection('A', g.label, topicsBody, g.groups.length),
    linksBody ? renderSection('B', 'Link Queue', linksBody, (d.links || []).length) : '',
  ].join('');

  document.getElementById('app').innerHTML = sections || '<div class="empty">No report data.</div>';

  // Auto-open the main section and the first topic.
  document.querySelectorAll('.section').forEach((s, i) => { if (i === 0) s.classList.add('open'); });
  const firstTopic = document.querySelector('.topic');
  if (firstTopic) firstTopic.classList.add('open');

  document.getElementById('stats').innerHTML = renderStats(d);
}

renderReport(REPORT_DATA);
</script>
