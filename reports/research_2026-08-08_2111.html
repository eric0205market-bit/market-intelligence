": "16 days. Unattended. 265 commits, 127 pull requests. That's not a coding benchmark, that's Qwen3.8-Max running as an unsupervised employee for over two weeks. The 'agents can't do long-horizon work' objection just lost its best counterexample.", "tweetB": "Qwen3.8-Max beat 458 of 526 HUMAN teams in a dialogue challenge. Not other models — human teams. Read that number again before assuming the 'China is behind on AI' narrative is still current.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://nlp.elvissaravia.com/p/ai-agents-weekly-agent-plugins-standard"}, {"id": 13, "cat": "tech", "urgency": "watch", "source": "The Founder's Corner", "title": "BYD closes the EV charging-speed gap with gasoline", "idea": "BYD introduced charging speeds approaching gasoline refueling times, removing what's arguably the single largest remaining behavioral barrier to EV adoption — range anxiety was always downstream of charging TIME, not charging availability.", "angle": "If charge times genuinely converge with refueling, the EV adoption inflection stops being a battery-chemistry story and becomes a pure charger-density infrastructure story — a different investable thesis than 'wait for better batteries.'", "tweetA": "BYD just made 'EV charging takes too long' obsolete as an objection. The adoption story stops being about batteries and starts being purely about charger density. Different winners in that world than in the 'wait for better chemistry' world.", "tweetB": "China's EV strategy arc in one line: compete on cost, then compete on performance. Charging speed was the last real performance gap versus ICE. It's closing faster than most Western OEM roadmaps assume.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.the-founders-corner.com/p/the-fundraising-agent-the-only-moat"}, {"id": 14, "cat": "AI/infra", "urgency": "deep", "source": "The Founder's Corner", "title": "DeepSeek V4 Flash: 3 cents a test run, matching Gemini 3.6 Flash", "  not retirement, that's a signal about where he thinks the next infra layer is.", "tweetB": "Hassabis moving UP to chief scientist while DeepMind gets a new day-to-day leader reads like Google positioning Hassabis for a bigger seat — chief scientist roles at this level are rarely lateral moves.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.the-founders-corner.com/p/the-fundraising-agent-the-only-moat"}, {"id": 16, "cat": "regulation", "urgency": "watch", "source": "The Founder's Corner", "title": "120+ companies join an AI security disclosure framework — minus the frontier labs", "idea": "The Nvidia-backed Open Secure AI Alliance shipped its first SAFE proposals for AI cybersecurity incident reporting one week after launching, with 120+ companies signed on — but Anthropic, OpenAI, and Google are notably not members, even as Meta separately disclosed a security incident involving its Muse Spark model.", "angle": "A self-regulation framework that excludes the three labs actually building frontier models is optics more than governance — the real test is whether regulators treat SAFE as sufficient cover given the frontier labs' absence.", "tweetA": "120+ companies signed an AI security disclosure framework in its first week. Anthropic, OpenAI, and Google — the three labs actually building frontier models — aren't on the list. A safety framework without the frontier labs is a trade association, not a safety framework.", "tweetB": "Meta disclosed a security incident on its Muse Spark model the same week the industry launched a voluntary incident-disclosure standard it didn't join. The disclosure happened despite the framework, not because of it.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.the-founders-corner.com/p/the-fundraising-agent-the-only-moat"}, {"id": 17, "cat": "macro", "urgency": "deep", "source": "The Founder's Corner", "title": "Computer equipment, software, and R&D are carrying US growth almost alone", "idea": "Per economist Eric Basmajian's data cited in the digest, most US economic sectors have expanded slowly this cycle while computer equipment, software, and R&D spending continue to post outsized growth — a narrow slice of the economy accounting for a disproportionate share of overall growth.", "angle": "This is the real-economy mirror of the equity market's mega-cap concentration — if AI-capex sectors are effectively the growth engine, any capex air-pocket (see the DRAM shortage items below) doesn't just hit tech stocks, it hits headline GDP prints directly.", "tweetA": "If computer equipment/software/R&D is basically carrying US growth right now, then the DRAM shortage story isn't a semis story. It's a GDP story. The concentration in equities has a real-economy twin and almost nobody's pricing that link.", "tweetB": "'Most sectors grew slowly, a handful of tech categories did all the work' is the same sentence whether you're describing S&P earnings or US GDP components this cycle. That's not a coincidence, that's one economy with two mirrors.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.the-founders-corner.com/p/the-fundraising-agent-the-only-moat"}, {"id": 18, "cat": "macro", "urgency": "deep", "source": "Macro Mornings", "title": "Money market cash pile is thinner (relative to the market) than at the 2000 top", "idea": "$8.29 trillion sits in US money market funds — an all-time high in dollar terms — but against the S&P's $70 trillion market cap that's just 11.8%. Compare: 66% at the 2009 low (S&P then +95% over 3 years), 31% in Oct 2002 (+58% over 3 years), and ~14% at the March 2000 top (S&P then -45% over 3 years). Today's ratio is BELOW the dot-com top.", "angle": "Every 'record cash on the sidelines = bullish dry powder' headline measures the numerator and ignores the denominator — relative to what it might buy, this cash pile is thinner than any comparable era, including the bubble it keeps getting compared favorably against.", "tweetA": "$8.3 trillion in money funds sounds like dry powder until you divide by the $70T it's supposed to buy. That ratio (11.8%) is BELOW where it stood at the exact top of the dot-com bubble (14%). 'Record cash on the sidelines' is the most misleading bullish headline of the year.", "tweetB": "2009 low: cash was 66% of the index. 2026 now: cash is 11.8% of the index. Same 'sidelines cash' headline gets written both times. One of those setups preceded a 95% rally. Guess which one this looks like.", "charts": {"count": 0, "hot": true, "desc": "🔥 CHART WORTH SAVING — money-fund-to-S&P-cap ratio across 2000/2002/2009/2026, one of 9 charts referenced in the letter"}, "link": "https://macromornings.substack.com/p/1987-equities-are-ignoring-the-bond"}, {"id": 19, "cat": "macro", "urgency": "deep", "source": "Macro Mornings", "title": "Household equity ownership hits 232% of GDP — 66 points above the dot-com peak", "idea": "US households hold $74 trillion in corporate equity, up $48 trillion (+185%) since 2020, now 232% of GDP versus a 2009 trough near 66% and a March 2000 peak near 140%. This ratio carries an R² of roughly 0.9 against subsequent 10-year S&P total returns — a far stronger predictor than CAPE or dividend yield. Post-1968 peak: +3.1%/yr nominal for a decade. Post-2000 peak: -0.95%/yr for a decade.", "angle": "If this ratio genuinely carries 0.9 R² to forward 10-year returns, it may be the single most important number in today's whole window — and almost nobody outside macro-twitter tracks it as a standing chart.", "tweetA": "Household equity ownership to GDP has a 0.9 R² to the NEXT DECADE of S&P returns. Better than CAPE. Better than dividend yield. It's at 232% right now — 66 points above the dot-com peak. If this relationship holds even loosely, the 2030s decade return is already mostly written.", "tweetB": "After the 2000 peak in this ratio: -0.95%/year for a decade. After 1968: +3.1%/year nominal, roughly -3% real. Two very different decades, same starting signal at a similar extreme. We're now 66 points past both.", "charts": {"count": 0, "hot": true, "desc": "🔥 CHART WORTH SAVING — household equity ownership/GDP with 1968, 2000, 2009 markers"}, "link": "https://macromornings.substack.com/p/1987-equities-are-ignoring-the-bond"}, {"id": 20, "cat": "macro", "urgency": "deep", "source": "Macro Mornings", "title": "S&P EPS growth: 45% headline vs 26% operating vs 12% for the median stock", "idea": "Goldman's Ioannis Blekos: aggregate S&P EPS growth is tracking 45% including mark-to-market gains on mega-cap tech's private AI stakes, 26% excluding them, and just 12% for the median constituent. That headline-to-operating gap widened 6x in 8 quarters (6pts in Q1 2024, now 33pts) since a 2018 accounting change let unrealized private-stake markups flow straight into net income and EPS. In 2001 a similar 57%-vs-reported gap preceded a 49% index decline; in 2006-08 a comparable financials-earnings gap preceded reported EPS collapsing -82%.", "angle": "If a meaningful chunk of 'record' S&P earnings growth is unrealized private AI-stake markups rather than operating income, every multiple calculated off headline EPS is overstating cheapness — and the historical precedent is that markets eventually re-rate around the real E, not the reported one.", "tweetA": "45% headline EPS growth. 26% excluding mark-to-market gains on private AI stakes. 12% for the median stock. The S&P's 'earnings growth' this quarter is 33 points ahead of the actual median company — that gap was 6 points eight quarters ago. The P/E isn't expensive because of E growth, it's expensive because of accounting.", "tweetB": "2001: a 57-point gap between operating and reported earnings preceded a -49% index move. Today's gap on the same measure: 33 points, widening 6x in 2 years. Nobody's saying it's 2001. Everybody should at least check which E they're dividing by.", "charts": {"count": 0, "hot": true, "desc": "🔥 CHART WORTH SAVING — headline vs operating vs median EPS growth bar chart"}, "link": "https://macromornings.substack.com/p/1987-equities-are-ignoring-the-bond"}, {"id": 21, "cat": "macro", "urgency": "deep", "source": "Macro Mornings", "title": "Earnings beats are running 5-6x normal — historically a warning, not a green light", "idea": "Q2 aggregate beat rates: S&P 500 +27%, Nasdaq 100 +55%, Bloomberg AI Value Chain +71%, versus the Philadelphia Semiconductor index (the most operationally 'pure' of the four) at only +15%. Long-run average surprise is 4-5%, ~7% post-2020 — so this quarter is 5-6x normal with no precedent in the series. Beat size correlates roughly zero (negative at extremes) with next year's return: 2021's then-record +19% beat preceded the S&P -18.1%, Nasdaq 100 -32.6%, and a 60/40 portfolio's worst year since 1937.", "angle": "Beat size ranks in the exact order of mark-to-market exposure (AI Value Chain > Nasdaq 100 > S&P > physical-product semis) — that ordering is itself evidence the beats are measuring analyst models missing private-stake revaluations, not real operational outperformance.", "tweetA": "Beat size by index this quarter: AI Value Chain +71%, Nasdaq 100 +55%, S&P +27%, physical-product semis (Philly Semi) only +15%. That's not four separate beats — that's ONE ranking, sorted exactly by how much mark-to-market exposure each index carries.", "tweetB": "2021 had a then-record earnings beat of +19%. The next year: S&P -18%, Nasdaq -33%, a 60/40 portfolio's worst year since 1937. This year's beat is even bigger. The correlation between beat size and forward returns is roughly zero, negative at the extremes. A record beat isn't a forecast, it's a confession the models were already broken.", "charts": {"count": 0, "hot": false, "desc": "Beat-rate-by-index bar chart in article"}, "link": "https://macromornings.substack.com/p/1987-equities-are-ignoring-the-bond"}, {"id": 22, "cat": "geopolitics", "urgency": "watch", "source": "Macro Mornings", "title": "Record yen short is funding the US tech trade — and the unwind math is worse than August 2024", "idea": "Leveraged funds hold their largest net yen short since 2017 (~118,000 contracts, ~¥1.5 quadrillion notional). In carry regimes, dollar-yen/Nasdaq 100 correlation runs +0.6 to +0.8 — they stop trading as separate markets. The August 2024 unwind (yen +14.3% in 5 weeks) triggered a Nikkei -12.4% single session (worst since Oct 1987), VIX to 65.73, and roughly $6.4T in global equity value gone in 3 weeks. The S&P was $45T then; it's $70T now — the same percentage unwind today is 56% larger in dollar terms.", "angle": "This is a live, underpriced tail risk sitting directly under the AI trade — a yen shock isn't a Japan story, it's a leveraged-unwind story landing on the same US tech names the carry trade has been funding for three years.", "tweetA": "August 2024's yen unwind erased $6.4T globally in 3 weeks. Positioning is now MORE extreme than then, and the S&P is 56% bigger in dollar terms — so the same percentage move today is a bigger dollar shock landing on a market that's roughly 42% concentrated in exactly the trade the yen is funding.", "tweetB": "Nobody trades 'dollar-yen' as a currency call anymore. When leveraged short-yen positioning is this extreme, you're trading Nasdaq 100 beta with extra steps — the correlation runs 0.6-0.8 in carry regimes. Check your yen exposure like it's a tech position, because it is one.", "charts": {"count": 0, "hot": true, "desc": "🔥 CHART WORTH SAVING — dollar-yen vs Nasdaq 100 overlay across the 1998/2007/2024 unwind episodes"}, "link": "https://macromornings.substack.com/p/1987-equities-are-ignoring-the-bond"}, {"id": 23, "cat": "gold", "urgency": "watch", "source": "Tavi Costa (Substack)", "title": "Copper-gold divergence: 'the lag is your friend'", "idea": "Tavi Costa flags copper as having led gold throughout this cycle, calling the copper-gold divergence 'one of the most important' in markets today and signaling gold still has 'catching up' to do relative to copper's move.", "angle": "Coming the same week gold broke into its 9-month resistance zone (item #1), a copper-led catch-up thesis adds a second, independent technical argument for further upside in the metal.", "tweetA": "Copper's been telling the story gold hasn't caught up to yet, per Tavi Costa. Same week gold just broke a 9-month resistance zone on falling rate-hike odds. Two unrelated catalysts — industrial-metal fundamentals and Fed pricing — pointing the same direction is worth more than either alone.", "tweetB": "'The lag is your friend' is a cleaner way of saying: when a leading indicator moves first and the lagging asset hasn't caught up, don't fade the lag, trade it. Copper led. Gold's turn.", "charts": {"count": 0, "hot": false, "desc": "Content paywalled past the teaser — likely a copper/gold ratio chart inside"}, "link": "https://tavicosta.substack.com/p/the-tale-of-two-metals"}, {"id": 24, "cat": "AI/infra", "urgency": "deep", "source": "The Dark Side of the Boom (Substack)", "title": "DRAM prices set to rise 400%+ from 2024 to end of 2026 on AI datacenter demand", "idea": "J.P. Morgan Global Research estimates DRAM prices will have risen more than 400% from the start of 2024 through the end of 2026, as AI datacenter construction and hyperscaler demand absorb a disproportionate share of global memory capacity — a shortage that 'may take years to unwind.'", "angle": "A 400%+ move in a commodity input that touches every consumer electronics category is a much bigger and more durable inflation story than most people tracking 'AI capex' are pricing — this is the input-cost read-through of the buildout, not just a capex line item.", "tweetA": "DRAM prices +400% from 2024 to end of 2026, per JPMorgan. That's not a chip-stock story, that's every laptop, phone, and server refresh cycle for the next 2 years getting repriced by AI datacenter demand alone. $MU", "tweetB": "The AI buildout doesn't just show up in Nvidia's revenue line — it shows up in your next phone's bill of materials. A 400% memory price move is a tax on literally every other electronics category competing for the same fabs.", "charts": {"count": 0, "hot": true, "desc": "🔥 CHART WORTH SAVING — DRAM price index trajectory 2024-2026"}, "link": "https://thedarksideoftheboom.substack.com/p/overdrawn-at-the-memory-bank-how"}, {"id": 25, "cat": "macro", "urgency": "deep", "source": "The Dark Side of the Boom (Substack)", "title": "The memory shortage is already showing up in consumer inflation prints", "idea": "CPI for software and accessories and PPI for storage devices have both risen 23% since the end of 2024 — a direct, measurable inflation channel from the AI memory shortage into consumer and producer price data.", "angle": "This is a concrete, trackable proof point that AI capex-driven input shortages are leaking into official inflation statistics right now, not a hypothetical — worth watching whether it becomes a talking point in the next CPI reaction.", "tweetA": "Software/accessories CPI and storage device PPI: both +23% since the end of 2024. That's the AI memory shortage showing up in the actual inflation data the Fed watches, not just in chip-stock analyst notes.", "tweetB": "Everyone's debating whether AI capex is inflationary in some abstract macro sense. Here's the non-abstract version: storage device PPI is up 23% in 20 months because AI datacenters are eating the DRAM supply meant for consumer electronics.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/overdrawn-at-the-memory-bank-how"}, {"id": 26, "cat": "tech", "urgency": "watch", "source": "The Dark Side of the Boom (Substack)", "title": "A major cyberattack could add $145B in emergency chip demand to an already broken memory market", "idea": "Analysts cited in the piece warn the memory supply crunch is straining cybersecurity infrastructure, and that a major cyberattack could unleash an estimated $145 billion in additional chip demand onto a market that's already capacity-constrained.", "angle": "A second-order tail risk stacked on the DRAM shortage — a systemic cyber event wouldn't just be a security story, it would be a fresh demand shock on the exact commodity that's already up 400% and years from resolving.", "tweetA": "$145B in emergency chip demand from a single major cyberattack, on a memory market that's already short and years from resolving. The DRAM shortage isn't just an AI capex story anymore — it's now a systemic-risk multiplier for the next big cybersecurity incident.", "tweetB": "Memory shortage plus fragile cybersecurity infrastructure is a genuinely underpriced compounding risk: the event that would force emergency chip replacement (a major breach) is happening in the exact market that has no spare capacity to absorb it.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/overdrawn-at-the-memory-bank-how"}], "meta": {"date": "2026-08-08", "time": "21:11 CEST", "windowStart": "2026-08-08 15:06 CEST", "windowEnd": "2026-08-08 21:11 CEST", "emailsInWindow": 11, "emailsRead": 11, "itemsExtracted": 26, "includedSources": [{"name": "The Bubble Bubble (Substack)", "count": 2}, {"name": "Eliant Capital (Substack)", "count": 2}, {"name": "The Dark Side of the Boom (Substack)", "count": 4}, {"name": "Herb Greenberg's Red Flag Alert (Substack)", "count": 1}, {"name": "a16z crypto (Substack)", "count": 1}, {"name": "McKinsey Monthly Highlights", "count": 3}, {"name": "AI Agents Weekly (Elvis Saravia)", "count": 2}, {"name": "The Founder's Corner", "count": 5}, {"name": "Macro Mornings", "count": 5}, {"name": "Tavi Costa (Substack)", "count": 1}], "skippedSources": [{"name": "Market Sentiment (marketsentiment@substack.com) — \"Is the capex sustainable?\"", "reason": "Timestamped 13:01:44 UTC, ~4 minutes before the strict 6-hour cutoff (13:05:51 UTC). Excluded per the hard time-window boundary; not read."}]}};
const ITEMS = DATA.items;
const META = DATA.meta;

const CAT_COLORS = {
  macro:"var(--macro)", credit:"var(--credit)", positioning:"var(--positioning)", "AI/infra":"var(--aiinfra)",
  crypto:"var(--crypto)", geopolitics:"var(--geopolitics)", energy:"var(--energy)", tech:"var(--tech)",
  gold:"var(--gold)", culture:"var(--culture)", labor:"var(--labor)", regulation:"var(--regulation)",
  science:"var(--science)", venture:"var(--venture)"
};
const URG_META = { act:{emoji:"🔴", label:"Act Now"}, deep:{emoji:"🔵", label:"Deep"}, watch:{emoji:"🟡", label:"Watch"} };

let activeCat = "all";
let activeUrg = "all";
let activeSrc = null;

function catCounts(){
  const m = {};
  ITEMS.forEach(i => { m[i.cat] = (m[i.cat]||0) + 1; });
  return m;
}
function urgCounts(){
  const m = {};
  ITEMS.forEach(i => { m[i.urgency] = (m[i.urgency]||0) + 1; });
  return m;
}

function renderFilterBars(){
  const cc = catCounts();
  const cats = Object.keys(cc).sort();
  const catBar = document.getElementById('catBar');
  let html = '<button class="pill'+(activeCat==='all'?' active':'')+'" style="'+(activeCat==='all'?'background:#3a3835':'')+'" onclick="setCat(\'all\')">All <span class="count">'+ITEMS.length+'</span></button>';
  cats.forEach(c => {
    const isActive = activeCat === c;
    const bg = isActive ? CAT_COLORS[c] : 'transparent';
    html += '<button class="pill'+(isActive?' active':'')+'" style="background:'+bg+';'+(isActive?'border-color:transparent;':'')+'" onclick="setCat(\''+c+'\')">'+c+' <span class="count">'+cc[c]+'</span></button>';
  });
  catBar.innerHTML = html;

  const uc = urgCounts();
  const urgBar = document.getElementById('urgBar');
  let uhtml = '<button class="pill'+(activeUrg==='all'?' active':'')+'" style="'+(activeUrg==='all'?'background:#3a3835':'')+'" onclick="setUrg(\'all\')">All <span class="count">'+ITEMS.length+'</span></button>';
  ['act','deep','watch'].forEach(u => {
    const isActive = activeUrg === u;
    uhtml += '<button class="pill'+(isActive?' active':'')+'" onclick="setUrg(\''+u+'\')">'+URG_META[u].emoji+' '+URG_META[u].label+' <span class="count">'+(uc[u]||0)+'</span></button>';
  });
  urgBar.innerHTML = uhtml;
}

function setCat(c){ activeCat = c; activeSrc = null; renderFilterBars(); renderItems(); }
function setUrg(u){ activeUrg = u; activeSrc = null; renderFilterBars(); renderItems(); }

function filterBySrc(name){
  activeSrc = name;
  activeCat = 'all'; activeUrg = 'all';
  renderFilterBars();
  renderItems();
  document.querySelectorAll('.card').forEach(function(card){
    const id = parseInt(card.getAttribute('data-id'), 10);
    const item = ITEMS.find(function(i){ return i.id === id; });
    if (item && item.source.indexOf(name) !== -1) card.classList.add('open');
  });
  document.getElementById('items').scrollIntoView({behavior:'smooth'});
}

function cardHTML(item){
  const color = CAT_COLORS[item.cat] || '#888';
  const urg = URG_META[item.urgency];
  const chartFlag = item.charts.count > 0 ? (item.charts.hot ? ' 🔥' : ' 📊') : (item.charts.hot ? ' 🔥' : '');
  let html = '';
  html += '<div class="card" data-id="'+item.id+'" id="card-'+item.id+'">';
  html += '<div class="card-header" onclick="toggleCard('+item.id+')">';
  html += '<span class="idx">'+String(item.id).padStart(2,'0')+'</span>';
  html += '<span class="urg" title="'+urg.label+'">'+urg.emoji+'</span>';
  html += '<span class="badge" style="background:'+color+'">'+item.source.split(' via ')[0].split(' / ')[0].split(' (')[0]+'</span>';
  html += '<span class="tag">'+item.cat+'</span>';
  html += '<span class="chart-flag">'+chartFlag+'</span>';
  html += '<span class="title">'+item.title+'</span>';
  html += '</div>';
  html += '<div class="card-body">';
  html += '<div class="label">The Idea</div><div class="idea">'+item.idea+'</div>';
  html += '<div class="label">My Angle</div><div class="angle" style="border-left-color:'+color+'; background:'+color+'12;">'+item.angle+'</div>';
  html += '<div class="tweets">';
  html += '<div class="tweet"><div class="tweet-head"><span class="tweet-label" style="color:var(--credit)">TWEET A</span><button class="copy-btn" onclick="copyTweet('+item.id+',\'a\')">📋 Copy</button></div><div class="tweet-text">'+escapeHtml(item.tweetA)+'</div></div>';
  html += '<div class="tweet"><div class="tweet-head"><span class="tweet-label" style="color:var(--crypto)">TWEET B</span><button class="copy-btn" onclick="copyTweet('+item.id+',\'b\')">📋 Copy</button></div><div class="tweet-text">'+escapeHtml(item.tweetB)+'</div></div>';
  html += '</div>';
  if (item.charts.count > 0 || item.charts.hot || item.charts.desc){
    html += '<div class="chart-box'+(item.charts.hot?' hot':'')+'">'+(item.charts.hot?'🔥 ':'📊 ')+escapeHtml(item.charts.desc)+'</div>';
  }
  html += '<div class="linkrow"><a href="'+item.link+'" target="_blank" rel="noopener">↗ Read full article</a></div>';
  html += '</div>';
  html += '</div>';
  return html;
}

function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderItems(){
  const container = document.getElementById('items');
  let filtered = ITEMS;
  if (activeSrc){
    filtered = filtered.filter(function(i){ return i.source.indexOf(activeSrc) !== -1; });
  } else {
    if (activeCat !== 'all') filtered = filtered.filter(function(i){ return i.cat === activeCat; });
    if (activeUrg !== 'all') filtered = filtered.filter(function(i){ return i.urgency === activeUrg; });
  }
  container.innerHTML = filtered.map(cardHTML).join('');
}

function toggleCard(id){
  const card = document.getElementById('card-'+id);
  card.classList.toggle('open');
}

function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}

function renderReport(){
  document.getElementById('headSub').textContent = META.date + ' · ' + META.time + ' · ' + META.itemsExtracted + ' items from ' + (META.includedSources.length) + ' sources';
  let html = '';
  html += '<p><strong>Window:</strong> ' + META.windowStart + ' to ' + META.windowEnd + ' (last 6 hours). Emails outside this window were not processed.</p>';
  html += '<p><strong>Emails in window:</strong> ' + META.emailsInWindow + ' &nbsp; <strong>Read:</strong> ' + META.emailsRead + ' &nbsp; <strong>Items extracted:</strong> ' + META.itemsExtracted + '</p>';
  html += '<h4>Included Sources</h4>';
  META.includedSources.forEach(function(s){
    html += '<div class="srcrow"><span class="srcname" onclick="filterBySrc(\''+s.name.replace(/'/g,"\\'")+'\')">'+s.name+'</span><span>'+s.count+' item'+(s.count===1?'':'s')+'</span></div>';
  });
  html += '<h4>Skipped Sources</h4>';
  META.skippedSources.forEach(function(s){
    html += '<div class="skiprow"><div class="sname">'+s.name+'</div><div>'+s.reason+'</div></div>';
  });
  document.getElementById('reportBody').innerHTML = html;
}

document.getElementById('reportHead').addEventListener('click', function(){
  document.getElementById('report').classList.toggle('open');
  document.getElementById('reportChevron').textContent = document.getElementById('report').classList.contains('open') ? '▴' : '▾';
});

renderFilterBars();
renderItems();
renderReport();
</script>
