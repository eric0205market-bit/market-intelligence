function esc(s){
  const d = document.createElement('div');
  d.innerText = s;
  return d.innerHTML;
}

function buildFilters(){
  const catCounts = {};
  ITEMS.forEach(i => catCounts[i.cat] = (catCounts[i.cat]||0)+1);
  const catBar = document.getElementById('catFilters');
  let html = '<button class="pill active" data-cat="All" onclick="setCat(\'All\')" style="background:#333;color:#fff;">All <span class="count">'+ITEMS.length+'</span></button>';
  Object.keys(catCounts).sort().forEach(c => {
    const color = CATEGORY_COLORS[c] || '#888';
    html += '<button class="pill" data-cat="'+esc(c)+'" onclick="setCat(\''+c.replace(/'/g,"\\'")+'\')" style="border-color:'+color+';color:'+color+';">'+esc(c)+' <span class="count">'+catCounts[c]+'</span></button>';
  });
  catBar.innerHTML = html;

  const urgCounts = {act:0, deep:0, watch:0};
  ITEMS.forEach(i => urgCounts[i.urgency]++);
  const urgBar = document.getElementById('urgFilters');
  let uhtml = '<button class="pill active" data-urg="All" onclick="setUrg(\'All\')" style="background:#333;color:#fff;">All <span class="count">'+ITEMS.length+'</span></button>';
  uhtml += '<button class="pill" data-urg="act" onclick="setUrg(\'act\')" style="border-color:#e24b4a;color:#e24b4a;">🔴 Act Now <span class="count">'+urgCounts.act+'</span></button>';
  uhtml += '<button class="pill" data-urg="deep" onclick="setUrg(\'deep\')" style="border-color:#378add;color:#378add;">🔵 Deep <span class="count">'+urgCounts.deep+'</span></button>';
  uhtml += '<button class="pill" data-urg="watch" onclick="setUrg(\'watch\')" style="border-color:#d4a017;color:#a37f14;">🟡 Watch <span class="count">'+urgCounts.watch+'</span></button>';
  urgBar.innerHTML = uhtml;
}

function setCat(c){
  activeCat = c;
  activeSrc = null;
  refreshFilterUI();
  renderCards();
}
function setUrg(u){
  activeUrg = u;
  activeSrc = null;
  refreshFilterUI();
  renderCards();
}
function resetSourceFilter(){
  activeSrc = null;
  activeCat = "All";
  activeUrg = "All";
  refreshFilterUI();
  renderCards();
}
function filterBySrc(name){
  activeSrc = name;
  activeCat = "All";
  activeUrg = "All";
  refreshFilterUI();
  renderCards(true);
}

function refreshFilterUI(){
  document.querySelectorAll('#catFilters .pill').forEach(function(btn){
    const c = btn.getAttribute('data-cat');
    const isActive = c === activeCat;
    const color = c === 'All' ? '#333' : (CATEGORY_COLORS[c] || '#888');
    btn.className = 'pill' + (isActive ? ' active' : '');
    if(isActive){ btn.style.background = color; btn.style.color = '#fff'; btn.style.borderColor = color; }
    else { btn.style.background = 'transparent'; btn.style.color = color; btn.style.borderColor = color; }
  });
  document.querySelectorAll('#urgFilters .pill').forEach(function(btn){
    const u = btn.getAttribute('data-urg');
    const isActive = u === activeUrg;
    const colorMap = {All:'#333', act:'#e24b4a', deep:'#378add', watch:'#a37f14'};
    const color = colorMap[u];
    btn.className = 'pill' + (isActive ? ' active' : '');
    if(isActive){ btn.style.background = color; btn.style.color = '#fff'; btn.style.borderColor = color; }
    else { btn.style.background = 'transparent'; btn.style.color = color; btn.style.borderColor = color; }
  });
}

function renderCards(expandMatches){
  const container = document.getElementById('cards');
  let items = ITEMS;
  if(activeSrc){
    items = items.filter(i => i.source.indexOf(activeSrc) !== -1);
  } else {
    if(activeCat !== 'All') items = items.filter(i => i.cat === activeCat);
    if(activeUrg !== 'All') items = items.filter(i => i.urgency === activeUrg);
  }

  let html = '';
  items.forEach(function(item){
    const color = CATEGORY_COLORS[item.cat] || '#888';
    const urg = URGENCY_META[item.urgency];
    const chartFlag = item.charts.hot ? '🔥' : (item.charts.count > 0 ? '📊' : '');
    const openClass = expandMatches ? ' open' : '';
    html += '<div class="card'+openClass+'" id="card-'+item.id+'">';
    html += '  <div class="card-header" onclick="toggleCard('+item.id+')">';
    html += '    <span class="idx">#'+item.id+'</span>';
    html += '    <span class="urg">'+urg.emoji+'</span>';
    html += '    <span class="badge" style="background:'+color+';">'+esc(item.source)+'</span>';
    html += '    <span class="cat-tag">'+esc(item.cat)+'</span>';
    if(chartFlag) html += '    <span class="chart-flag">'+chartFlag+'</span>';
    html += '    <span class="title">'+esc(item.title)+'</span>';
    html += '  </div>';
    html += '  <div class="card-body">';
    html += '    <div class="section-label">The Idea</div>';
    html += '    <div class="idea-text">'+esc(item.idea)+'</div>';
    html += '    <div class="section-label">My Angle</div>';
    html += '    <div class="angle-box" style="border-left-color:'+color+';background:'+color+'14;">'+esc(item.angle)+'</div>';
    html += '    <div class="tweets">';
    html += '      <div class="tweet"><div class="tweet-label a">TWEET A</div><div class="tweet-text">'+esc(item.tweetA)+'</div><button class="copy-btn" onclick="copyTweet('+item.id+',\'a\')">📋 Copy</button></div>';
    html += '      <div class="tweet"><div class="tweet-label b">TWEET B</div><div class="tweet-text">'+esc(item.tweetB)+'</div><button class="copy-btn" onclick="copyTweet('+item.id+',\'b\')">📋 Copy</button></div>';
    html += '    </div>';
    const chartsClass = item.charts.hot ? 'charts-box hot' : 'charts-box';
    const chartsLabel = item.charts.hot ? '🔥 CHART WORTH SAVING — ' : (item.charts.count > 0 ? '📊 '+item.charts.count+' chart(s) — ' : 'No charts — ');
    html += '    <div class="'+chartsClass+'">'+chartsLabel+esc(item.charts.desc)+'</div>';
    html += '    <div class="link-row"><a href="'+item.link+'" target="_blank" rel="noopener">↗ Read full article</a></div>';
    html += '  </div>';
    html += '</div>';
  });
  container.innerHTML = html || '<div style="color:var(--sub);padding:20px 0;">No items match this filter.</div>';
}

function toggleCard(id){
  const card = document.getElementById('card-'+id);
  card.classList.toggle('open');
}

function toggleReport(){
  const rep = document.getElementById('reportCard');
  rep.classList.toggle('open');
  document.getElementById('repToggle').textContent = rep.classList.contains('open') ? '▾' : '▸';
}

function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}

function buildReport(){
  let html = '<table class="rep">';
  html += '<tr><td><b>Time window</b></td><td>'+META.windowStart+' → '+META.windowEnd+'</td></tr>';
  html += '<tr><td><b>Emails in window</b></td><td>'+META.emailsInWindow+'</td></tr>';
  html += '<tr><td><b>Emails read</b></td><td>'+META.emailsRead+'</td></tr>';
  html += '<tr><td><b>Items extracted</b></td><td>'+META.itemsExtracted+'</td></tr>';
  html += '</table>';
  html += '<div class="section-label" style="margin-top:14px;">Included Sources</div>';
  META.includedSources.forEach(function(s){
    html += '<div class="src-row"><span class="src-name" onclick="filterBySrc(\''+s.name.replace(/'/g,"\\'")+'\')">'+esc(s.name)+'</span><span>'+s.emails+' email(s) → '+s.items+' item(s)</span></div>';
  });
  html += '<div class="section-label" style="margin-top:14px;">Skipped Sources</div>';
  if(META.skippedSources.length === 0){
    html += '<div style="color:var(--sub);">None — every email in the window contained substantive content.</div>';
  } else {
    META.skippedSources.forEach(function(s){
      html += '<div class="src-row"><span>'+esc(s.name)+'</span><span>'+esc(s.reason)+'</span></div>';
    });
  }
  document.getElementById('reportBody').innerHTML = html;
}

document.getElementById('metaLine').textContent = META.date + ' · ' + META.time + ' · ' + META.itemsExtracted + ' items from ' + META.emailsRead + ' emails';

buildFilters();
renderCards();
buildReport();
</script>
</body>
</html>
