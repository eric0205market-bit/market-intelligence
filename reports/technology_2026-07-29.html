 the microwave.", "locator": "It's trickling down", "quote_verified": true}]}, {"theme": "Starling's business model", "insights": [{"claim": "Starling, a two-person studio whose past clients include Sony, Microsoft, Netflix, Sega, and Ford, is publicizing its microwave sound experiments and says it isn't worried about manufacturers copying the technique in-house, betting that its design sensibility and consulting expertise are more valuable and defensible than any single sound.", "speaker": "Jeremy White", "type": "contrarian", "entities": ["Starling", "Joel Corelitz", "Colin Coogan", "Sony", "Microsoft", "Netflix", "Sega", "Ford", "Panasonic", "Samsung"], "conviction": "medium", "so_what": "An unusually open, non-defensive IP posture from a small studio betting on ongoing consulting/services revenue over protecting a specific technique, relevant as a model for other small firms pitching big OEMs.", "quote": "It's not a big fear that someone's going to steal this", "locator": "It's not a big fear that someone's going to steal this", "quote_verified": true}, {"claim": "Starling says it already has a list of other hated everyday device sounds it wants to tackle next, beyond microwaves.", "speaker": "Jeremy White", "type": "prediction", "entities": ["Starling", "Colin Coogan"], "conviction": "exploratory", "so_what": "Signals Starling may expand its firmware-only sonic-UX fix model into adjacent device categories; worth watching for its next target and any manufacturer partnerships.", "quote": "Oh, we have a few", "locator": "So, now that microwaves are sorted, what's next?", "quote_verified": true}]}], "insight_total": 11, "top_entities": ["Starling", "Joel Corelitz", "Colin Coogan", "Whirlpool", "KitchenAid Pro Line", "Richard Hughes", "Volvo", "piezoelectric buzzer", "Arduino UNO R4 Minima", "Panasonic", "Samsung"], "source_meta": {"author": "Jeremy White", "word_count": 1585, "paywalled": false}}, {"record_id": "5ac0f2fd844d821a", "source_type": "technology", "source_name": "Wood Mackenzie", "source_url": "https://www.woodmac.com/press-releases/wood-mackenzie-european-gas-storage-at-risk-of-being-below-70-ahead-of-winter-202627/", "title": "Wood Mackenzie: European Gas Storage at risk of being below 70% ahead of Winter 2026/27", "published_date": "2026-07-27", "language": "en", "processed_at": "2026-07-29T11:22:38Z", "processor": "claude-code-sub-opus", "tags": ["Energy", "Macro", "Geopolitics"], "gist": "Wood Mackenzie warns that near-record-low European gas storage combined with a renewed Strait of Hormuz disruption has pushed spot prices up more than 50% since June, and even a best-case Qatari supply recovery leaves Europe entering winter 2026/27 at only 75% storage versus a 90% five-year average.", "themes": [{"theme": "European Storage Deficit", "insights": [{"claim": "European gas storage stood at just above 50% (54% per Wood Mackenzie's key findings) in late July 2026, a historically low level for that time of year.", "speaker": "Wood Mackenzie", "type": "data_point", "entities": ["Europe", "Wood Mackenzie", "natural gas storage"], "conviction": "high", "so_what": "Track weekly EU gas storage fill data as a near-term leading indicator for winter 2026/27 price spikes.", "quote": "Storage across Europe stands at just above 50%, a historically low level for late July.", "locator": "Wood Mackenzie's analysis warns that European gas storage", "quote_verified": true}, {"claim": "Even in Wood Mackenzie's best-case scenario, where Qatar reaches full operational LNG capacity (excluding damaged trains) by end of September 2026, European gas storage would only reach 75% by 1 November 2026, well below the 90% five-year average for that date.", "speaker": "Wood Mackenzie", "type": "prediction", "entities": ["Europe", "Qatar", "Wood Mackenzie", "LNG"], "conviction": "high", "so_what": "A 15-point storage shortfall versus the historical average implies structurally tighter winter gas balances and elevated price floors even under favorable assumptions.", "quote": "Wood Mackenzie's analysis suggests European storage reaches 75% at best by 1 November. The five-year average for that date is 90%.", "locator": "Considering a hypothetical “best case” scenario", "quote_verified": true}, {"claim": "If the Strait of Hormuz remains closed for a further two months beyond Wood Mackenzie's base assumptions, European storage would end up below 70%, pushing prices higher and triggering demand destruction in some emerging Asian economies.", "speaker": "Wood Mackenzie", "type": "causal", "entities": ["Strait of Hormuz", "Europe", "Asia", "LNG"], "conviction": "medium", "so_what": "A prolonged Strait of Hormuz closure is a distinct downside tail risk investors should monitor as a trigger for a second leg up in gas and LNG prices.", "quote": "Should the Strait remain closed for a further two months, storage will end up lower than 70%.", "locator": "Considering a hypothetical “best case” scenario", "quote_verified": true}]}, {"theme": "Price Spike Mechanics", "insights": [{"claim": "European gas spot prices are up more than 50% since their 12 June 2026 lows and are trading above €60/MWh (US$20/mmbtu), with gas proving more sensitive to the Strait of Hormuz disruption than oil.", "speaker": "Wood Mackenzie", "type": "data_point", "entities": ["natural gas", "oil", "Strait of Hormuz", "Europe"], "conviction": "high", "so_what": "The outsized gas-versus-oil price reaction to the same geopolitical shock signals gas market tightness is the dominant driver, not just a generic risk-off move in energy.", "quote": "Spot prices are up more than 50% since 12 June and trading above €60/MWh (US$20/mmbtu). Gas is proving more sensitive than oil to the disruption.", "locator": "Key findings", "quote_verified": true}, {"claim": "Unlike the 2022 crisis following Russia's invasion of Ukraine, current European gas prices have not returned to those record highs, partly because sustained investment in European renewables capacity since 2022 has reduced the power sector's exposure to gas prices — but Wood Mackenzie says Europe is nonetheless approaching energy crisis territory with limited near-term alternatives to gas.", "speaker": "Wood Mackenzie", "type": "causal", "entities": ["Europe", "Russia", "Ukraine", "renewables"], "conviction": "medium", "so_what": "Renewables buildout has structurally lowered Europe's gas-price sensitivity versus 2022, which caps (but does not eliminate) upside price risk this winter — relevant for utilities and power-price forecasting.", "quote": "This is not 2022. Prices have not returned to the records set after Russia’s invasion of Ukraine removed major pipeline supply, and sustained investment in European renewables capacity since then has reduced power market exposure.", "locator": "Implications for Europe", "quote_verified": true}]}, {"theme": "LNG Supply Squeeze", "insights": [{"claim": "Asian LNG demand has returned to 2025 levels despite a continuing shortfall in Qatari export volumes, intensifying competition with Europe for available LNG cargoes.", "speaker": "Wood Mackenzie", "type": "data_point", "entities": ["Asia", "Qatar", "Europe", "LNG"], "conviction": "high", "so_what": "Rebounding Asian demand removes a key slack variable Europe has historically relied on to absorb LNG cargoes during supply disruptions.", "quote": "Asian LNG demand has returned to 2025 levels, despite the shortfall in Qatari volumes, sharpening competition with Europe for available cargoes.", "locator": "Three pressures are bearing down at once", "quote_verified": true}, {"claim": "No significant new LNG supply growth is expected globally over the next 9 to 12 months, with Qatari developments not expected to return to full capacity before the second half of 2027.", "speaker": "Wood Mackenzie", "type": "thesis", "entities": ["Qatar", "LNG"], "conviction": "high", "so_what": "A near-term LNG supply wall through mid-2027 argues for elevated price floors persisting well beyond this winter, not just a transient spike.", "quote": "No significant new LNG supply is expected over the next 9 to 12 months, with new Qatari capacity not online before the second half of 2027.", "locator": "Key findings", "quote_verified": true}, {"claim": "Wood Mackenzie now expects the global LNG market to rebalance only from 2028, as sustained disruption or new geopolitical risks reduce both the duration and depth of the previously anticipated global LNG oversupply.", "speaker": "Wood Mackenzie", "type": "prediction", "entities": ["LNG", "Wood Mackenzie"], "conviction": "medium", "so_what": "A pushed-back LNG oversupply timeline (to 2028) is a material revision for anyone positioned for a 2026/2027 LNG glut and falling prices.", "quote": "LNG market might only rebalance from 2028. Sustained disruption or new geopolitical risks is poised to reduce both the duration and the depth of the anticipated global LNG oversupply.", "locator": "Key findings", "quote_verified": true}]}, {"theme": "Emerging Market Demand Destruction", "insights": [{"claim": "High LNG costs are already straining some emerging Asian economies, which face outright demand destruction rather than just price pain, whereas wealthier nations can absorb the higher cost.", "speaker": "Wood Mackenzie", "type": "causal", "entities": ["Asia", "LNG"], "conviction": "high", "so_what": "Watch lower-income Asian LNG importers for demand-destruction signals (curtailed industrial gas use, fuel switching) as an early indicator of how tight the global LNG market truly is.", "quote": "Some emerging Asian economies face demand destruction, not just price pain. Wealthier nations can absorb the cost. Lower-income markets cannot.", "locator": "Key findings", "quote_verified": true}]}, {"theme": "EU Policy Crosscurrents", "insights": [{"claim": "The EU faces a difficult trade-off: its proposed ban on all Russian LNG imports starting January 2027, combined with more stringent methane emission regulations, could constrain import flexibility at precisely the moment Europe needs maximum flexibility to secure winter gas supply.", "speaker": "Wood Mackenzie", "type": "contrarian", "entities": ["EU", "Russia", "LNG"], "conviction": "medium", "so_what": "EU policymakers may face pressure to delay or soften the Russian LNG import ban or methane rules if the supply crunch worsens — a policy risk worth tracking for gas and LNG traders.", "quote": "the EU faces a difficult calculation: pressing ahead with both a proposed ban on all Russian LNG imports from January 2027 and more stringent methane emission regulations could constrain import flexibility at precisely the moment Europe needs it most.", "locator": "Implications for Europe", "quote_verified": true}]}, {"theme": "Analyst View & Industry Signal", "insights": [{"claim": "Wood Mackenzie's Vice President of Gas and LNG Research, Massimo Di Odoardo, says the combination of low European inventories, strong Asian demand and limited new LNG supply growth almost guarantees elevated gas prices through winter 2026/27 and into 2027.", "speaker": "Wood Mackenzie", "type": "thesis", "entities": ["Massimo Di Odoardo", "Wood Mackenzie", "Europe", "Asia", "LNG"], "conviction": "high", "so_what": "A named senior analyst's high-conviction call for sustained elevated prices through 2027, not just a single winter, is a signal to extend hedging/positioning horizons beyond the immediate season.", "quote": "Low European inventories, strong Asian demand and limited new LNG supply growth almost guarantee elevated prices through this winter and into 2027", "locator": "quote from Massimo Di Odoardo", "quote_verified": true}, {"claim": "The global gas industry will convene at the Gastech 2026 conference in Bangkok in September 2026, where supply resilience is expected to define the agenda.", "speaker": "Wood Mackenzie", "type": "anecdote", "entities": ["Gastech 2026", "Bangkok"], "conviction": "exploratory", "so_what": "Gastech 2026 in Bangkok (September) is a near-term event to watch for industry commentary, deals, or policy signals on LNG supply resilience.", "quote": "The global gas industry convenes at Gastech 2026 in Bangkok in September. Supply resilience will define the agenda.", "locator": "Implications for Europe", "quote_verified": true}]}], "insight_total": 12, "top_entities": ["Wood Mackenzie", "Massimo Di Odoardo", "Europe", "Qatar", "Strait of Hormuz", "Asia", "EU", "Russia", "LNG", "Gastech 2026"], "source_meta": {"author": "Wood Mackenzie", "word_count": 536, "paywalled": false}}, {"record_id": "64af2a363e9e69a8", "source_type": "technology", "source_name": "Wood Mackenzie", "source_url": "https://www.woodmac.com/news/opinion/where-is-latin-americas-next-upstream-opportunity/", "title": "Where is Latin America's next upstream opportunity? | Wood Mackenzie", "published_date": "2026-07-27", "language": "en", "processed_at": "2026-07-29T11:23:03Z", "processor": "claude-code-sub-opus", "tags": ["Energy", "Geopolitics"], "gist": "A thin, largely promotional Wood Mackenzie piece framing Latin America (Brazil, Argentina, Guyana, Suriname, Venezuela) as entering a new upstream oil and gas growth phase, but the substantive analysis is confined to an embedded 5:36 video rather than the article text itself.", "themes": [{"theme": "Latin America upstream growth wave", "insights": [{"claim": "Latin America is entering a new growth phase for upstream oil and gas investment, spanning Brazil's deepwater potential, Argentina's investment wave, and emerging opportunities in Guyana, Suriname and Venezuela.", "speaker": "Pietro Ferreira", "type": "thesis", "entities": ["Brazil", "Argentina", "Guyana", "Suriname", "Venezuela", "Wood Mackenzie"], "conviction": "high", "so_what": "Investors screening for upstream E&P opportunities should track these five Latin American markets as a connected regional growth theme rather than isolated single-country plays.", "quote": "From Brazil's deepwater potential to Argentina's investment wave and emerging opportunities in Guyana, Suriname and Venezuela, the region is entering a new phase of growth.", "locator": "From Brazil's deepwater potential", "quote_verified": true}, {"claim": "In Latin America's upstream sector, established producers are simultaneously expanding output, frontier exploration plays continue to attract investor attention, and regulatory changes are reshaping the investment landscape.", "speaker": "Pietro Ferreira", "type": "framework", "entities": ["Latin America", "upstream oil and gas"], "conviction": "medium", "so_what": "Points to a three-pronged dynamic (production growth, frontier exploration, regulatory shifts) investors should monitor together rather than relying on a single catalyst to time the region.", "quote": "Established producers are expanding output, frontier plays continue to attract attention, and regulatory changes are reshaping the investment landscape.", "locator": "Established producers are expanding output", "quote_verified": true}, {"claim": "Wood Mackenzie's substantive commentary on which Latin American upstream projects are drawing the biggest investment and which commercial and policy forces will define the region's next growth wave is delivered via an embedded 5-minute-36-second video featuring analysts Pietro Ferreira and Adrian Lara, not reproduced in the article's own text.", "speaker": "Pietro Ferreira", "type": "anecdote", "entities": ["Wood Mackenzie", "Pietro Ferreira", "Adrian Lara"], "conviction": "exploratory", "so_what": "The actionable specifics live in the video, not this text, so investors relying only on the written article will miss the real analysis and should watch the video directly.", "quote": null, "locator": "In this video, Wood Mackenzie experts", "quote_verified": false}]}, {"theme": "Related Wood Mackenzie coverage threads", "insights": [{"claim": "Wood Mackenzie analyst Adrian Lara published analysis in January 2026 on how Venezuela's regime change affects oil production and crude and product markets, indicating the firm treats Venezuela's political transition as a live driver of Latin American oil market dynamics.", "speaker": "Adrian Lara", "type": "data_point", "entities": ["Venezuela", "Adrian Lara", "Wood Mackenzie"], "conviction": "medium", "so_what": "Flags Venezuela's post-regime-change oil sector as a distinct, actively-tracked catalyst for crude and product markets that investors should follow via Wood Mackenzie's dedicated coverage.", "quote": "Venezuela regime change: what it means for oil production, crude and product markets", "locator": "Venezuela regime change: what it means", "quote_verified": true}, {"claim": "Wood Mackenzie analyst Pietro Ferreira has drawn a comparison between Argentina's giant shale play and the Midland Basin, suggesting the firm is positioning Argentina's shale resource as a potentially world-class unconventional play.", "speaker": "Pietro Ferreira", "type": "framework", "entities": ["Argentina", "Midland Basin", "Pietro Ferreira", "Wood Mackenzie"], "conviction": "medium", "so_what": "A Midland Basin comparison implies scale and economics that investors evaluating Argentine shale opportunities should benchmark against.", "quote": "Is Argentina's giant shale play the next Midland Basin?", "locator": "Is Argentina's giant shale play the next Midland Basin?", "quote_verified": true}, {"claim": "Wood Mackenzie has maintained ongoing coverage of how Argentine President Milei's policies affect the country's oil and gas sector, alongside broader analysis of the challenges facing gas resource development across Latin America.", "speaker": "Adrian Lara", "type": "data_point", "entities": ["Argentina", "Milei", "Latin America", "Wood Mackenzie"], "conviction": "low", "so_what": "Indicates Argentine policy risk/reform under Milei and regional gas development constraints are recurring watch items in Wood Mackenzie's Latin America upstream coverage.", "quote": null, "locator": "What does Milei mean for oil and gas in Argentina?", "quote_verified": false}]}], "insight_total": 6, "top_entities": ["Wood Mackenzie", "Brazil", "Argentina", "Guyana", "Suriname", "Venezuela", "Pietro Ferreira", "Adrian Lara", "Midland Basin"], "source_meta": {"author": "Pietro Ferreira", "word_count": 294, "paywalled": false}}, {"record_id": "733ec55c81b6d71a", "source_type": "technology", "source_name": "Wood Mackenzie", "source_url": "https://www.woodmac.com/blogs/the-edge/oil-and-gas-markets-dilemma/", "title": "Oil and gas markets’ perilous dilemma | Wood Mackenzie", "published_date": "2026-07-28", "language": "en", "processed_at": "2026-07-29T11:22:42Z", "processor": "claude-code-sub-opus", "tags": ["Energy", "Geopolitics", "Macro", "Positioning"], "gist": "Wood Mackenzie's Alan Gelder lays out a binary scenario tree for oil and gas markets amid renewed Gulf/Red Sea conflict: no US-Iran deal risks Brent retesting $120/bbl and tipping the world into recession, while a credible deal could send Brent well below $60/bbl by 2027 as UAE and Iranian supply return to a market heading toward glut.", "themes": [{"theme": "Gulf Conflict & Supply Disruption", "insights": [{"claim": "Iran has widened the Gulf conflict by enlisting Houthi proxies in Yemen to disrupt roughly 4 million b/d of Saudi Arabian crude exports transiting the Bab el-Mandeb Strait at the southern end of the Red Sea, the alternative route used when the Strait of Hormuz is blocked.", "speaker": "Simon Flowers", "type": "data_point", "entities": ["Iran", "Houthi", "Yemen", "Saudi Arabia", "Bab el-Mandeb Strait", "Red Sea", "Strait of Hormuz"], "conviction": "high", "so_what": "Watch Red Sea shipping and tanker-insurance rates plus Saudi export volumes as a leading indicator of renewed supply stress beyond just the Strait of Hormuz.", "quote": "enlisting its Houthi proxies in Yemen to disrupt around 4 million b/d of Saudi Arabia’s crude exports", "locator": "The on-off-on conflict in the Gulf", "quote_verified": true}, {"claim": "The brief US-Iran Memorandum of Understanding (MoU) allowed a few weeks of oil and LNG value-chain recovery and inventory rebuild, but its collapse has returned markets to the same perilous state that existed before the MoU was signed.", "speaker": "Simon Flowers", "type": "causal", "entities": ["United States", "Iran", "MoU", "LNG"], "conviction": "high", "so_what": "Diplomatic on/off cycles are now a primary near-term price driver; treat MoU status as a binary catalyst to track rather than assume a stable de-escalation.", "quote": "oil and LNG markets are once again perilously placed, and the world is back to where it was before the MoU", "locator": "A few weeks of respite", "quote_verified": true}, {"claim": "Wood Mackenzie frames the US-Iran standoff as a binary dilemma with huge global implications: either the conflict festers and produces dire economic consequences, or the two sides strike a sustainable deal that unlocks constrained oil and LNG supply.", "speaker": "Simon Flowers", "type": "framework", "entities": ["United States", "Iran"], "conviction": "high", "so_what": "Positioning should be scenario-based around this binary outcome rather than assuming gradual, linear de-escalation.", "quote": "a binary outcome with huge implications for the world: allow the conflict to fester and face dire economic consequences or strike a sustainable deal to unlock constrained supply back into the market", "locator": "The dilemma confronting the two sides", "quote_verified": true}]}, {"theme": "Bear Case: No Deal, Global Recession", "insights": [{"claim": "In the no-deal scenario, up to 12 million b/d of liquids (12% of global production) and 86 Mt of LNG production (20% of global LNG) could be shut in, raising the risk of value-chain degradation including reservoir deterioration.", "speaker": "Simon Flowers", "type": "data_point", "entities": ["LNG", "Iran", "Strait of Hormuz"], "conviction": "medium", "so_what": "Extended shut-ins risk permanent reservoir damage, meaning some capacity may not return even after a deal is reached — a structural bullish tail risk to watch for.", "quote": "Up to 12 million b/d of liquids (12% of the global production market) and 86 Mt of LNG production (20%) are shut in", "locator": "No deal, global recession inevitable", "quote_verified": true}, {"claim": "Cushing crude inventories are already near operational minimums, so further inventory draws in a no-deal scenario would directly reduce the volume of US crude available to export markets.", "speaker": "Simon Flowers", "type": "data_point", "entities": ["Cushing", "United States"], "conviction": "high", "so_what": "US export availability is itself a tightening constraint, not just a Gulf supply story — watch weekly Cushing stock data as a supplementary stress gauge.", "quote": "Visible inventories at Cushing are already near operational minimums, reducing the volumes of US crude available to export markets.", "locator": "Global oil stocks are low", "quote_verified": true}, {"claim": "Late-summer seasonality compounds the no-deal scenario because the northern hemisphere is at its peak of global oil demand, unlike the seasonal backdrop of earlier price spikes during this conflict.", "speaker": "Simon Flowers", "type": "causal", "entities": ["Brent crude"], "conviction": "medium", "so_what": "Seasonal demand timing amplifies this disruption's price impact versus prior flare-ups, a reason this leg of the conflict could push prices higher than earlier ones.", "quote": "Different seasonal factors are at play compared with earlier spikes, with late summer in the northern hemisphere traditionally the peak of global oil demand.", "locator": "Upward pressure mounts on energy prices", "quote_verified": true}, {"claim": "China is responding to elevated import prices by drawing down its strategic oil reserves rather than paying up for crude imports, a move Wood Mackenzie says only delays rather than resolves the market reckoning.", "speaker": "Simon Flowers", "type": "contr // ---------- helpers ----------
// YouTube-aligned hex colors for tinted insight chips (bg = color+"1a", text = color, border = color+"55").
const TYPE_HEX = {
  thesis: '#6366f1', prediction: '#0ea5e9', framework: '#8b5cf6',
  data_point: '#7c3aed', causal: '#d97706', contrarian: '#dc2626',
  anecdote: '#64748b',
};
const CONV_HEX = { high: '#7c3aed', medium: '#ca8a04', low: '#94a3b8', exploratory: '#94a3b8' };
function typeHex(t) { return TYPE_HEX[String(t || '').toLowerCase()] || '#475569'; }
function convHex(c) { return CONV_HEX[String(c || '').toLowerCase()] || '#64748b'; }

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }

// Tinted chip (YouTube style): faint bg, colored text + border.
function tintChip(text, color) {
  return `<span class="chip" style="background:${color}1a;color:${color};border-color:${color}55">${escapeHtml(text)}</span>`;
}
function tagPills(tags) {
  if (!tags || !tags.length) return '';
  return tags.map(t => `<span class="pill tag">${escapeHtml(t)}</span>`).join(' ');
}

// ---------- rendering ----------
// Insight presentation ported from the YouTube digest: type/conviction tinted
// chips, speaker as a 🗣 chip, and entities as indigo chips — all in the meta row
// directly under the claim. Quote treatment is INTENTIONALLY kept as Concepts'
// verbatim + "✓ verified" (stronger than YouTube's ≈ paraphrase wording).
function renderInsight(ins) {
  if (!ins) return '';
  const cls = 'insight' + (ins.type ? (' ' + String(ins.type).toLowerCase()) : '');
  const meta = [];
  if (ins.type) meta.push(tintChip(ins.type, typeHex(ins.type)));
  if (ins.speaker) meta.push(`<span class="chip chip-spk">🗣 ${escapeHtml(ins.speaker)}</span>`);
  if (ins.conviction) meta.push(tintChip('conviction: ' + ins.conviction, convHex(ins.conviction)));
  (ins.entities || []).slice(0, 12).forEach(e => {
    if (e) meta.push(`<span class="chip chip-ent">${escapeHtml(e)}</span>`);
  });
  let quote = '';
  if (ins.quote) {
    const v = ins.quote_verified
      ? `<span class="vmark">✓ verified</span>`
      : `<span class="vmark no">unverified</span>`;
    quote = `<div class="quote">“${escapeHtml(ins.quote)}”${v}</div>`;
  }
  const so = ins.so_what
    ? `<div class="insight-so"><span class="lbl">so what</span>${escapeHtml(ins.so_what)}</div>` : '';
  return `
    <div class="${cls}">
      <div class="insight-claim">${escapeHtml(ins.claim || '')}</div>
      <div class="insight-meta">${meta.join('')}</div>
      ${so}
      ${quote}
    </div>`;
}

function renderTheme(theme) {
  const insights = (theme.insights || []).map(renderInsight).join('');
  return `
    <div class="theme">
      <div class="theme-title">${escapeHtml(theme.theme || 'Theme')}</div>
      ${insights}
    </div>`;
}

function renderCard(card) {
  if (!card) return '';
  const meta = card.source_meta || {};
  const nameHtml = card.source_url
    ? `<a class="source-name" href="${escapeAttr(card.source_url)}" target="_blank" rel="noopener">${escapeHtml(card.source_name || '')}</a>`
    : `<span class="source-name">${escapeHtml(card.source_name || '')}</span>`;
  const subBits = [];
  if (card.published_date) subBits.push(escapeHtml(card.published_date));
  if (meta.author) subBits.push(escapeHtml(meta.author));
  if (meta.word_count) subBits.push(`${meta.word_count} words`);
  if (meta.paywalled) subBits.push('paywalled');
  const themes = (card.themes || []).map(renderTheme).join('');
  const n = card.insight_total != null ? card.insight_total
            : (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
  return `
    <div class="source">
      <div class="source-head" onclick="toggleSource(this)">
        <div class="source-meta-left">
          <div class="source-name-row">${nameHtml}</div>
          <div class="source-title">${escapeHtml(card.title || '')}</div>
          <div class="source-sub">${subBits.join('  ·  ')}</div>
        </div>
        <span class="source-count">${n} insight${n === 1 ? '' : 's'}</span>
        <span class="source-arrow">▸</span>
      </div>
      <div class="source-body">
        ${card.gist ? `<div class="gist">${escapeHtml(card.gist)}</div>` : ''}
        ${card.tags && card.tags.length ? `<div class="tags">${tagPills(card.tags)}</div>` : ''}
        ${themes || '<div class="empty">No insights.</div>'}
      </div>
    </div>`;
}

function renderTopStats(d) {
  const s = d.stats || {};
  const parts = [];
  if (d.date) parts.push(`date <strong>${escapeHtml(d.date)}</strong>`);
  if (s.lookback_days != null) parts.push(`lookback <strong>${s.lookback_days}d</strong>`);
  if (s.sources != null) parts.push(`sources <strong>${s.sources}</strong>`);
  if (s.cards != null) parts.push(`cards <strong>${s.cards}</strong>`);
  if (s.insights != null) parts.push(`insights <strong>${s.insights}</strong>`);
  if (s.quote_verified_pct != null) parts.push(`quotes verified <strong>${s.quote_verified_pct}%</strong>`);
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSource(headEl) { headEl.parentElement.classList.toggle('open'); }

function insightCount(card) {
  return (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
}

// Build the sort/filter control bar (display only — re-groups REPORT_DATA in place).
function buildControls(d) {
  const cards = d.cards || [];
  const names = [...new Set(cards.map(c => c.source_name || '—'))].sort((a, b) => a.localeCompare(b));
  const opts = names.map(n => `<option value="${escapeAttr(n)}">${escapeHtml(n)}</option>`).join('');
  document.getElementById('controls').innerHTML =
    `<label>Sort
       <select id="sortSel">
         <option value="source">Source A–Z</option>
         <option value="insights">Insight count ▼</option>
       </select></label>
     <label>Source
       <select id="srcSel">
         <option value="__all">All sources (${names.length})</option>
         ${opts}
       </select></label>
     <span class="ctl-btns">
       <button type="button" id="expandAll">Expand all</button>
       <button type="button" id="collapseAll">Collapse all</button>
     </span>`;
  document.getElementById('sortSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('srcSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('expandAll').addEventListener('click', () => setAllGroups(false));
  document.getElementById('collapseAll').addEventListener('click', () => setAllGroups(true));
}

// Group-level collapse: header click toggles one group; the control-bar buttons toggle all.
function toggleGroup(headEl) { headEl.parentElement.classList.toggle('collapsed'); }
function setAllGroups(collapsed) {
  document.querySelectorAll('.group').forEach(g => g.classList.toggle('collapsed', collapsed));
}

// Group cards by source, sort groups (and cards within), optionally filter to one source.
function renderGroups(d) {
  const sortMode = (document.getElementById('sortSel') || {}).value || 'source';
  const srcFilter = (document.getElementById('srcSel') || {}).value || '__all';
  let cards = (d.cards || []).slice();
  if (srcFilter !== '__all') cards = cards.filter(c => (c.source_name || '—') === srcFilter);

  const groups = new Map();
  cards.forEach(c => {
    const k = c.source_name || '—';
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(c);
  });
  let entries = [...groups.entries()].map(([name, cs]) => ({
    name, cards: cs, insights: cs.reduce((a, c) => a + insightCount(c), 0),
  }));
  if (sortMode === 'insights') entries.sort((a, b) => b.insights - a.insights || a.name.localeCompare(b.name));
  else entries.sort((a, b) => a.name.localeCompare(b.name));
  // Within each source group, heaviest cards first.
  entries.forEach(e => e.cards.sort((a, b) => insightCount(b) - insightCount(a)));

  const html = entries.map(e => {
    const head = `<div class="group-head" onclick="toggleGroup(this)">`
      + `<span class="group-name">${escapeHtml(e.name)}</span>`
      + `<span class="group-meta">${e.cards.length} card${e.cards.length === 1 ? '' : 's'} · ${e.insights} insights</span>`
      + `<span class="group-arrow">▾</span></div>`;
    return `<div class="group">${head}<div class="group-body">${e.cards.map(renderCard).join('')}</div></div>`;
  }).join('');

  const app = document.getElementById('app');
  app.innerHTML = html || '<div class="empty">No cards for this source.</div>';
  // Open the first two source cards by default.
  document.querySelectorAll('.source').forEach((sec, i) => { if (i < 2) sec.classList.add('open'); });
}

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  document.getElementById('stats-top').innerHTML = renderTopStats(d);
  buildControls(d);
  renderGroups(d);   // default: grouped, sorted by source A–Z
}

renderReport(REPORT_DATA);
</script>
