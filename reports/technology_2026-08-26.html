er Illinois' 2017 TRUST Act sanctuary law binds prosecutors at all — exposing a structural loophole in even the strongest state sanctuary regimes.", "themes": [{"theme": "Sanctuary-law loophole: prosecutors as the gap", "insights": [{"claim": "Illinois' TRUST Act bars police and other agencies from aiding federal deportation efforts absent a criminal warrant, but does not squarely say whether county prosecutors and their staff are covered — a drafting gap that let state's attorney's offices become channels to ICE inside one of the largest sanctuary states.", "speaker": "Aura Bogado", "type": "thesis", "entities": ["TRUST Act", "Illinois", "ICE", "state's attorneys"], "conviction": "high", "so_what": "State sanctuary statutes that regulate police but not prosecutors leave an enforceable data channel open; expect legislative patches and litigation in sanctuary states.", "quote": "But the law doesn’t squarely answer whether prosecutors and their staff are bound by those same restrictions.", "locator": "The TRUST Act bars police", "quote_verified": true}, {"claim": "Illinois' December courthouse law barring civil immigration arrests within 1,000 feet of a courthouse addressed ICE agents outside but did nothing about prosecutors sharing defendant data from inside the building — legislation targeted the visible enforcement vector while missing the informational one.", "speaker": "Aura Bogado", "type": "framework", "entities": ["Illinois", "JB Pritzker", "ICE", "courthouses"], "conviction": "high", "so_what": "A template for evaluating any privacy/sanctuary regulation: laws that police physical access but ignore data flows leave the more scalable channel open.", "quote": "But the courthouse law was written to stop the agent waiting on the sidewalk, not the prosecutor inside.", "locator": "In 2021, Governor JB Pritzker called", "quote_verified": true}, {"claim": "Illinois' own top legal officers refused to resolve whether the TRUST Act binds prosecutors — Attorney General Kwame Raoul called application 'not always clear-cut' and Governor Pritzker declined to answer — leaving compliance to each county's discretion.", "speaker": "Aura Bogado", "type": "data_point", "entities": ["Kwame Raoul", "JB Pritzker", "TRUST Act", "Illinois"], "conviction": "high", "so_what": "Absent state-level clarification, county-by-county divergence persists; watch for an AG opinion, amendment, or test case that would settle prosecutor coverage nationally-cited sanctuary law.", "quote": "Applying the TRUST Act in practice requires state and local enforcement to navigate complex interactions in circumstances that are not always clear-cut", "locator": "Illinois Attorney General Kwame Raoul", "quote_verified": true}]}, {"theme": "Scale and mechanics of prosecutor-ICE data sharing", "insights": [{"claim": "State's attorney's offices in 1 out of every 6 Illinois counties shared sensitive personal data about defendants with federal immigration agencies during the first 15 months of Trump's second term — without criminal warrants, public disclosure, legislative oversight, or any accounting of frequency or who was affected.", "speaker": "Aura Bogado", "type": "data_point", "entities": ["Illinois", "ICE", "DHS", "state's attorneys", "Donald Trump"], "conviction": "high", "so_what": "Quantifies how deeply federal immigration enforcement penetrates local justice systems even in model sanctuary states; relevant to detention-capacity and enforcement-volume forecasts.", "quote": null, "locator": "State’s attorneys offices in 1 out", "quote_verified": false}, {"claim": "Prosecutors' emails to ICE contained photographs, home addresses, and the exact date and time a defendant was due in court or set to leave jail — operationally actionable targeting data giving ICE the precise window to make an arrest.", "speaker": "Aura Bogado", "type": "data_point", "entities": ["ICE", "Injustice Watch", "FOIA"], "conviction": "high", "so_what": "Local court-system data is functioning as a de facto ICE targeting feed; firms handling court-records data and jail-management systems sit in a politically exposed position.", "quote": "The date and time a defendant was due in court or set to leave jail—the exact window for ICE to make an arrest.", "locator": "Injustice Watch filed Freedom of Information", "quote_verified": true}, {"claim": "The written record understates the collaboration: 11 of 102 Illinois offices ignored FOIA requests (some produced records only after being sued), others remain in litigation, and email phrases like 'Thank you for taking my call' point to phone coordination no records request can capture.", "speaker": "Aura Bogado", "type": "causal", "entities": ["FOIA", "Injustice Watch", "Illinois"], "conviction": "medium", "so_what": "Documented collaboration is a floor, not a ceiling — any quantitative read on local-federal immigration cooperation from public records is biased downward.", "quote": "Messages with phrases like “Thank you for taking my call” point to conversations no records requests could follow.", "locator": "Eleven offices didn’t respond", "quote_verified": true}, {"claim": "A DuPage County prosecutor handed CBP the voting records of two county residents within 90 minutes of receiving a mere administrative subpoena issued by DHS itself — a document with little legal force that DHS would have had to enforce in federal court if refused.", "speaker": "Aura Bogado", "type": "anecdote", "entities": ["DuPage County", "CBP", "DHS", "Bob Berlin"], "conviction": "high", "so_what": "Voluntary compliance with non-judicial subpoenas means DHS can extract sensitive records (including voter data) at near-zero legal cost; a precedent for data demands beyond immigration.", "quote": "Ninety minutes later, the prosecutor sent the voting records of two county residents.", "locator": "In April 2025, for example", "quote_verified": true}, {"claim": "Kane County prosecutors asked Customs and Border Protection to identify three people through facial recognition, and the state's attorney defended it as standard practice — showing federal biometric surveillance tools being loaned downstream to local prosecutors.", "speaker": "Aura Bogado", "type": "data_point", "entities": ["Kane County", "CBP", "facial recognition", "Jamie Mosser"], "conviction": "high", "so_what": "Federal facial-recognition capacity is diffusing into routine county-level prosecution; a tailwind for government biometric vendors and a growing regulatory/litigation flashpoint.", "quote": "a standard investigatory technique used throughout all of law enforcement.", "locator": "In Kane County, where staffers asked", "quote_verified": true}, {"claim": "Collaboration networks propagated across county lines: Menard County's state's attorney contacted immigration agents at least five times and steered prosecutors in neighboring Cass and Mason counties to a Homeland Security investigator, who they then contacted on their own.", "speaker": "Aura Bogado", "type": "anecdote", "entities": ["Menard County", "Gwendolyn Thomas", "Cass County", "Mason County", "Homeland Security Investigations"], "conviction": "high", "so_what": "Informal peer referral spreads federal cooperation faster than policy: enforcement reach grows via professional networks, not mandates.", "quote": null, "locator": "In central Illinois, Menard County", "quote_verified": false}]}, {"theme": "Civil-removal arbitrage over criminal process", "insights": [{"claim": "Deportation offers prosecutors an easier disposal path than prosecution — civil removal requires only 'clear and convincing evidence' with no right to appointed counsel, versus proof beyond reasonable doubt with appointed defense in criminal court — creating an incentive to hand defendants to ICE to 'clear their docket'.", "speaker": "Aura Bogado", "type": "framework", "entities": ["ICE", "Spencer Reynolds", "NAACP Legal Defense Fund", "DHS"], "conviction": "high", "so_what": "A structural incentive, not one-off misconduct: expect the prosecutor-to-ICE channel to persist and scale wherever it is legally ambiguous, feeding detention and removal volumes.", "quote": "risks undermining the rights people have in the criminal proceeding context.", "locator": "Criminal cases offer protections that immigration", "quote_verified": true}, {"claim": "In Marion County a prosecutor explicitly conceded that removal outranked his own case — telling an HSI agent 'Our warrant will not take priority over removal' — and the target was in ICE custody awaiting removal 34 minutes later.", "speaker": "Aura Bogado", "type": "anecdote", "entities": ["Marion County", "John Christeson", "Sergio Fulgencio", "Homeland Security Investigations"], "conviction": "high", "so_what": "Concrete evidence that local criminal accountability is being traded away for federal removal speed — the mechanism behind rising expedited removals from sanctuary jurisdictions.", "quote": "Our warrant will not take priority over removal", "locator": "Twenty minutes after flagging Samayoa", "quote_verified": true}, {"claim": "Legal scholars call prosecutor-ICE information sharing unprecedented: a University of Kentucky law professor said he could not recall a single instance in past practice of a state's attorney's office sharing information with ICE.", "speaker": "Aura Bogado", "type": "contrarian", "entities": ["Matthew Boaz", "University of Kentucky", "ICE", "TRUST Act"], "conviction": "medium", "so_what": "This is a new enforcement channel under Trump's second term, not a continuation of past practice — a regime change in how federal immigration enforcement sources targets.", "quote": "I cannot recall a single instance in my past practice where an individual within the state’s attorney’s office shared information with ICE", "locator": "Legal scholars described the collaboration", "quote_verified": true}]}, {"theme": "Discretion divergence: collaboration was a choice", "insights": [{"claim": "More than half of Illinois state's attorney's offices reported no contact with ICE under the same federal pressure, and at least one actively shut ICE out — demonstrating that every act of prosecutor collaboration was discretionary, not compelled.", "speaker": "Aura Bogado", "type": "thesis", "entities": ["Illinois", "ICE", "state's attorneys"], "conviction": "high", "so_what": "Local officeholder discretion, not statute, is the binding variable in sanctuary outcomes — county prosecutor elections become the effective control point.", "quote": "suggesting every act of collaboration was a choice.", "locator": "None of it was inevitable.", "quote_verified": true}, {"claim": "The two offices with the clearest legal positions on TRUST Act coverage behaved opposite to their stated views: DuPage's Bob Berlin said the act binds his office yet contacted immigration officials more than any other, while Lake County's Eric Rinehart said it doesn't bind him yet shut ICE out entirely — and neither tracks ICE contacts because state's attorneys, unlike police, file no compliance reports.", "speaker": "Aura Bogado", "type": "contrarian", "entities": ["Bob Berlin", "DuPage County", "Eric Rinehart", "Lake County", "TRUST Act"], "conviction": "high", "so_what": "Stated legal interpretation is a poor predictor of behavior when there is no reporting mandate — the oversight gap (no compliance reports for prosecutors) is the actionable policy fix to watch.", "quote": null, "locator": "These two offices staked out", "quote_verified": false}, {"claim": "Countermeasures exist and were used: Lake County barred ICE from private office areas without a judge-signed warrant and told the public defender to report TRUST Act violations, while Jackson County processed federal agents' questions as redacted FOIA requests — treating DHS as any other public requester.", "speaker": "Aura Bogado", "type": "framework", "entities": ["Lake County", "Eric Rinehart", "Jackson County", "ICE", "FOIA"], "conviction": "medium", "so_what": "A replicable playbook for jurisdictions wanting to wall off federal immigration access without new legislation — likely to spread to other sanctuary states.", "quote": null, "locator": "In Lake County, State’s Attorney Eric Rinehart", "quote_verified": false}]}, {"theme": "Trust erosion and second-order effects", "insights": [{"claim": "Defendants complying with court obligations were converted into ICE targets — Rolando Perez Samayoa attended his DUI hearings, a prosecutor emailed his address and court date to HSI, and he and his 17-year-old son were removed to Mexico within weeks — teaching immigrant communities that court appearance itself is a deportation risk.", "speaker": "Aura Bogado", "type": "causal", "entities": ["Rolando Perez Samayoa", "ICE", "Marion County", "Homeland Security Investigations"], "conviction": "high", "so_what": "Expect rising failure-to-appear rates and degraded witness cooperation in immigrant-heavy jurisdictions — a measurable chilling effect on local justice systems and public safety.", "quote": "Showing up for prosecutors could mean showing up for ICE.", "locator": "When Injustice Watch reached Samayoa", "quote_verified": true}, {"claim": "The collaboration crossed party lines and every staff level from paralegals to elected state's attorneys, and none of the responding state's attorneys called it a mistake — most defended the practice outright as routine inter-agency information sharing.", "speaker": "Aura Bogado", "type": "data_point", "entities": ["state's attorneys", "Eric Weis", "Kendall County", "ICE"], "conviction": "high", "so_what": "Normalized, bipartisan, and unapologetic cooperation means this won't self-correct with election cycles; only statutory change or litigation alters the trajectory.", "quote": "It is very common that information is shared between agencies in the criminal justice system, including those in law enforcement,", "locator": "None of the state’s attorneys who responded", "quote_verified": true}, {"claim": "Because Il // ---------- helpers ----------
// YouTube-aligned hex colors for tinted insight chips (bg = color+"1a", text = color, border = color+"55").
const TYPE_HEX = {
  thesis: '#6366f1', prediction: '#0ea5e9', framework: '#8b5cf6',
  data_point: '#7c3aed', causal: '#d97706', contrarian: '#dc2626',
  anecdote: '#64748b',
};
const CONV_HEX = { high: '#7c3aed', medium: '#ca8a04', low: '#94a3b8', exploratory: '#94a3b8' };
function typeHex(t) { return TYPE_HEX[String(t || '').toLowerCase()] || '#475569'; }
function convHex(c) { return CONV_HEX[String(c || '').toLowerCase()] || '#64748b'; }

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }

// Tinted chip (YouTube style): faint bg, colored text + border.
function tintChip(text, color) {
  return `<span class="chip" style="background:${color}1a;color:${color};border-color:${color}55">${escapeHtml(text)}</span>`;
}
function tagPills(tags) {
  if (!tags || !tags.length) return '';
  return tags.map(t => `<span class="pill tag">${escapeHtml(t)}</span>`).join(' ');
}

// ---------- rendering ----------
// Insight presentation ported from the YouTube digest: type/conviction tinted
// chips, speaker as a 🗣 chip, and entities as indigo chips — all in the meta row
// directly under the claim. Quote treatment is INTENTIONALLY kept as Concepts'
// verbatim + "✓ verified" (stronger than YouTube's ≈ paraphrase wording).
function renderInsight(ins) {
  if (!ins) return '';
  const cls = 'insight' + (ins.type ? (' ' + String(ins.type).toLowerCase()) : '');
  const meta = [];
  if (ins.type) meta.push(tintChip(ins.type, typeHex(ins.type)));
  if (ins.speaker) meta.push(`<span class="chip chip-spk">🗣 ${escapeHtml(ins.speaker)}</span>`);
  if (ins.conviction) meta.push(tintChip('conviction: ' + ins.conviction, convHex(ins.conviction)));
  (ins.entities || []).slice(0, 12).forEach(e => {
    if (e) meta.push(`<span class="chip chip-ent">${escapeHtml(e)}</span>`);
  });
  let quote = '';
  if (ins.quote) {
    const v = ins.quote_verified
      ? `<span class="vmark">✓ verified</span>`
      : `<span class="vmark no">unverified</span>`;
    quote = `<div class="quote">“${escapeHtml(ins.quote)}”${v}</div>`;
  }
  const so = ins.so_what
    ? `<div class="insight-so"><span class="lbl">so what</span>${escapeHtml(ins.so_what)}</div>` : '';
  return `
    <div class="${cls}">
      <div class="insight-claim">${escapeHtml(ins.claim || '')}</div>
      <div class="insight-meta">${meta.join('')}</div>
      ${so}
      ${quote}
    </div>`;
}

function renderTheme(theme) {
  const insights = (theme.insights || []).map(renderInsight).join('');
  return `
    <div class="theme">
      <div class="theme-title">${escapeHtml(theme.theme || 'Theme')}</div>
      ${insights}
    </div>`;
}

function renderCard(card) {
  if (!card) return '';
  const meta = card.source_meta || {};
  const nameHtml = card.source_url
    ? `<a class="source-name" href="${escapeAttr(card.source_url)}" target="_blank" rel="noopener">${escapeHtml(card.source_name || '')}</a>`
    : `<span class="source-name">${escapeHtml(card.source_name || '')}</span>`;
  const subBits = [];
  if (card.published_date) subBits.push(escapeHtml(card.published_date));
  if (meta.author) subBits.push(escapeHtml(meta.author));
  if (meta.word_count) subBits.push(`${meta.word_count} words`);
  if (meta.paywalled) subBits.push('paywalled');
  const themes = (card.themes || []).map(renderTheme).join('');
  const n = card.insight_total != null ? card.insight_total
            : (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
  return `
    <div class="source">
      <div class="source-head" onclick="toggleSource(this)">
        <div class="source-meta-left">
          <div class="source-name-row">${nameHtml}</div>
          <div class="source-title">${escapeHtml(card.title || '')}</div>
          <div class="source-sub">${subBits.join('  ·  ')}</div>
        </div>
        <span class="source-count">${n} insight${n === 1 ? '' : 's'}</span>
        <span class="source-arrow">▸</span>
      </div>
      <div class="source-body">
        ${card.gist ? `<div class="gist">${escapeHtml(card.gist)}</div>` : ''}
        ${card.tags && card.tags.length ? `<div class="tags">${tagPills(card.tags)}</div>` : ''}
        ${themes || '<div class="empty">No insights.</div>'}
      </div>
    </div>`;
}

function renderTopStats(d) {
  const s = d.stats || {};
  const parts = [];
  if (d.date) parts.push(`date <strong>${escapeHtml(d.date)}</strong>`);
  if (s.lookback_days != null) parts.push(`lookback <strong>${s.lookback_days}d</strong>`);
  if (s.sources != null) parts.push(`sources <strong>${s.sources}</strong>`);
  if (s.cards != null) parts.push(`cards <strong>${s.cards}</strong>`);
  if (s.insights != null) parts.push(`insights <strong>${s.insights}</strong>`);
  if (s.quote_verified_pct != null) parts.push(`quotes verified <strong>${s.quote_verified_pct}%</strong>`);
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSource(headEl) { headEl.parentElement.classList.toggle('open'); }

function insightCount(card) {
  return (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
}

// Build the sort/filter control bar (display only — re-groups REPORT_DATA in place).
function buildControls(d) {
  const cards = d.cards || [];
  const names = [...new Set(cards.map(c => c.source_name || '—'))].sort((a, b) => a.localeCompare(b));
  const opts = names.map(n => `<option value="${escapeAttr(n)}">${escapeHtml(n)}</option>`).join('');
  document.getElementById('controls').innerHTML =
    `<label>Sort
       <select id="sortSel">
         <option value="source">Source A–Z</option>
         <option value="insights">Insight count ▼</option>
       </select></label>
     <label>Source
       <select id="srcSel">
         <option value="__all">All sources (${names.length})</option>
         ${opts}
       </select></label>
     <span class="ctl-btns">
       <button type="button" id="expandAll">Expand all</button>
       <button type="button" id="collapseAll">Collapse all</button>
     </span>`;
  document.getElementById('sortSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('srcSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('expandAll').addEventListener('click', () => setAllGroups(false));
  document.getElementById('collapseAll').addEventListener('click', () => setAllGroups(true));
}

// Group-level collapse: header click toggles one group; the control-bar buttons toggle all.
function toggleGroup(headEl) { headEl.parentElement.classList.toggle('collapsed'); }
function setAllGroups(collapsed) {
  document.querySelectorAll('.group').forEach(g => g.classList.toggle('collapsed', collapsed));
}

// Group cards by source, sort groups (and cards within), optionally filter to one source.
function renderGroups(d) {
  const sortMode = (document.getElementById('sortSel') || {}).value || 'source';
  const srcFilter = (document.getElementById('srcSel') || {}).value || '__all';
  let cards = (d.cards || []).slice();
  if (srcFilter !== '__all') cards = cards.filter(c => (c.source_name || '—') === srcFilter);

  const groups = new Map();
  cards.forEach(c => {
    const k = c.source_name || '—';
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(c);
  });
  let entries = [...groups.entries()].map(([name, cs]) => ({
    name, cards: cs, insights: cs.reduce((a, c) => a + insightCount(c), 0),
  }));
  if (sortMode === 'insights') entries.sort((a, b) => b.insights - a.insights || a.name.localeCompare(b.name));
  else entries.sort((a, b) => a.name.localeCompare(b.name));
  // Within each source group, heaviest cards first.
  entries.forEach(e => e.cards.sort((a, b) => insightCount(b) - insightCount(a)));

  const html = entries.map(e => {
    const head = `<div class="group-head" onclick="toggleGroup(this)">`
      + `<span class="group-name">${escapeHtml(e.name)}</span>`
      + `<span class="group-meta">${e.cards.length} card${e.cards.length === 1 ? '' : 's'} · ${e.insights} insights</span>`
      + `<span class="group-arrow">▾</span></div>`;
    return `<div class="group">${head}<div class="group-body">${e.cards.map(renderCard).join('')}</div></div>`;
  }).join('');

  const app = document.getElementById('app');
  app.innerHTML = html || '<div class="empty">No cards for this source.</div>';
  // Open the first two source cards by default.
  document.querySelectorAll('.source').forEach((sec, i) => { if (i < 2) sec.classList.add('open'); });
}

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  document.getElementById('stats-top').innerHTML = renderTopStats(d);
  buildControls(d);
  renderGroups(d);   // default: grouped, sorted by source A–Z
}

renderReport(REPORT_DATA);
</script>
