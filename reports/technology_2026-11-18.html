mpute-access export controls", "insights": [{"claim": "New US export measures target overseas data centers and remote computing arrangements that let Chinese companies use advanced American AI chips without importing them directly.", "speaker": "SemiWiki", "type": "data_point", "entities": ["United States", "China", "AI chips", "data centers", "remote computing"], "conviction": "high", "so_what": "Export policy is shifting from hardware shipments to compute access, widening the set of exposed firms beyond chipmakers.", "quote": "The measures target overseas data centers and remote computing arrangements that can give Chinese companies access to powerful American chips without importing them directly.", "locator": "The measures target overseas data centers", "quote_verified": true}, {"claim": "Covered US AI chip shipments to Singapore, Malaysia, Thailand, Indonesia and Brazil now face licensing requirements, and certain overseas providers serving Chinese companies face new licensing obligations.", "speaker": "SemiWiki", "type": "data_point", "entities": ["Singapore", "Malaysia", "Thailand", "Indonesia", "Brazil", "AI chips"], "conviction": "high", "so_what": "Watch for shipment delays and order slippage into Southeast Asian and Brazilian data center builds.", "quote": null, "locator": "The measures target overseas data centers", "quote_verified": false}, {"claim": "Because AI compute can be delivered as a cloud service from servers far from China, physical border controls on chips alone cannot contain Chinese access to American AI capability.", "speaker": "SemiWiki", "type": "causal", "entities": ["cloud computing", "China", "AI chips"], "conviction": "high", "so_what": "Expect further regulation of cloud/IaaS customer identity, not just hardware exports.", "quote": "Physical borders alone cannot contain a service delivered through the cloud.", "locator": "Why does this matter?", "quote_verified": true}]}, {"theme": "Enforcement risk", "insights": [{"claim": "The effectiveness of US AI chip export restrictions depends on identifying actual end users and enforcing requirements consistently across a network of suppliers, intermediaries and customers; otherwise rules that look decisive on paper may disappoint.", "speaker": "SemiWiki", "type": "framework", "entities": ["United States", "export controls"], "conviction": "medium", "so_what": "Leakage via intermediaries could blunt the policy; know-your-customer enforcement is the key variable to monitor.", "quote": "Rules that look decisive on paper can disappoint if authorities cannot trace where computing capacity ultimately goes.", "locator": "For Washington, the challenge is", "quote_verified": true}, {"claim": "A key open question for the new AI compute restrictions is whether they constrain Chinese access without unnecessarily disrupting legitimate business or accelerating the search for alternative (non-US) suppliers.", "speaker": "SemiWiki", "type": "thesis", "entities": ["China", "AI chips", "alternative suppliers"], "conviction": "medium", "so_what": "Tighter controls risk accelerating substitution toward non-US chip suppliers, a long-term share risk for US vendors.", "quote": null, "locator": "The next test is whether", "quote_verified": false}]}, {"theme": "Business fallout beyond Nvidia", "insights": [{"claim": "Tighter US controls on AI compute access could impose additional compliance costs, customer uncertainty and expansion delays on data center operators, cloud providers and their investors, not only on Nvidia.", "speaker": "SemiWiki", "type": "causal", "entities": ["Nvidia", "data center operators", "cloud providers"], "conviction": "medium", "so_what": "Reassess growth assumptions for Southeast Asian data center operators and cloud providers with Chinese customer exposure.", "quote": "For businesses, the implications extend beyond Nvidia.", "locator": "For businesses, the implications extend", "quote_verified": true}, {"claim": "Countries courting AI infrastructure investment, such as Southeast Asian data center hubs, may have to balance commercial ambitions against American security demands.", "speaker": "SemiWiki", "type": "thesis", "entities": ["Singapore", "Malaysia", "Thailand", "Indonesia", "Brazil", "AI infrastructure"], "conviction": "medium", "so_what": "Host-country policy alignment with Washington becomes a factor in data center siting and investment risk.", "quote": null, "locator": "Countries attracting AI infrastructure investment", "quote_verified": false}]}, {"theme": "Trump-Xi diplomatic timing", "insights": [{"claim": "Introducing tighter AI chip controls just before Trump's talks with Xi Jinping could strengthen Washington's bargaining position but also make cooperation harder, as Beijing may read it as evidence that technological containment remains central to US policy.", "speaker": "SemiWiki", "type": "thesis", "entities": ["Donald Trump", "Xi Jinping", "China", "United States"], "conviction": "medium", "so_what": "Summit outcomes on tech could swing either way; headline risk for China-exposed semiconductor names around the talks.", "quote": null, "locator": "The diplomatic timing adds another layer", "quote_verified": false}, {"claim": "AI competition between the US and China now extends beyond chip factories into the ownership, location and use of computing infrastructure.", "speaker": "SemiWiki", "type": "framework", "entities": ["AI infrastructure", "United States", "China"], "conviction": "high", "so_what": "Compute ownership and location become a geopolitical asset class; policy risk attaches to data centers, not only fabs.", "quote": "AI competition now reaches beyond chip factories into the ownership, location and use of computing infrastructure.", "locator": "The broader significance is clear", "quote_verified": true}]}], "insight_total": 9, "top_entities": ["United States", "China", "Nvidia", "Donald Trump", "Xi Jinping", "Singapore", "Malaysia", "Thailand", "Indonesia", "Brazil", "data centers", "cloud providers"], "source_meta": {"author": "SemiWiki", "word_count": 363, "paywalled": false}}, {"record_id": "9858828c261ab02f", "source_type": "technology", "source_name": "SemiWiki", "source_url": "https://semiwiki.com/3dic/376277-can-faster-hbm-solve-ais-memory-bottleneck/", "title": "Can Faster HBM Solve AI's Memory Bottleneck?", "published_date": "2026-11-17", "language": "en", "processed_at": "2026-11-18T11:08:05Z", "processor": "claude-code-sub-opus", "tags": ["Tech", "AI"], "gist": "Moh Kolb argues that faster HBM (HBM4, custom HBM) only speeds AI when memory bandwidth is the binding constraint: decode-heavy inference benefits, but compute limits, KV-cache capacity, interconnect, and power/thermal/packaging/manufacturing limits can cap or shift gains, so effective sustained memory performance should replace peak bandwidth as the optimization target.", "themes": [{"theme": "Roofline limits on HBM bandwidth gains", "insights": [{"claim": "Higher HBM bandwidth does not automatically make AI applications proportionally faster; the gain depends on whether bandwidth, capacity, latency, data reuse, or off-accelerator communication is the binding constraint.", "speaker": "Moh Kolb", "type": "thesis", "entities": ["HBM", "AI accelerators"], "conviction": "high", "so_what": "Discount marketing claims that tie HBM generation bandwidth jumps linearly to AI accelerator speedups.", "quote": "Faster HBM can relieve one bottleneck while exposing another.", "locator": "Why bandwidth alone cannot determine", "quote_verified": true}, {"claim": "The roofline model bounds attainable accelerator throughput at min(peak compute, sustained memory bandwidth x arithmetic intensity), so extra HBM bandwidth only raises the ceiling for low-arithmetic-intensity, bandwidth-limited workloads.", "speaker": "Moh Kolb", "type": "framework", "entities": ["HBM", "roofline model", "arithmetic intensity"], "conviction": "high", "so_what": "Use arithmetic intensity of target workloads to judge how much value a faster HBM generation actually unlocks.", "quote": null, "locator": "1. Why HBM Bandwidth Matters", "quote_verified": false}, {"claim": "Once an AI workload approaches its compute limit, additional HBM bandwidth yields diminishing benefit.", "speaker": "Moh Kolb", "type": "causal", "entities": ["HBM", "AI accelerators"], "conviction": "high", "so_what": "Bandwidth premiums pay off less for compute-bound training-style workloads than for memory-bound ones.", "quote": "Once the workload approaches the computational limit, however, more bandwidth provides diminishing benefit.", "locator": "1. Why HBM Bandwidth Matters", "quote_verified": true}]}, {"theme": "Training vs prefill vs decode memory profiles", "insights": [{"claim": "AI training's large matrix operations reuse data extensively and are often compute-bound, so training performance hinges on balancing compute, memory access, and multi-accelerator communication rather than raw HBM bandwidth.", "speaker": "Moh Kolb", "type": "causal", "entities": ["AI training", "HBM"], "conviction": "medium", "so_what": "Training-centric demand is less sensitive to HBM bandwidth upgrades than inference-centric demand.", "quote": null, "locator": "2. AI Training and Inference", "quote_verified": false}, {"claim": "LLM inference decode, unlike compute-bound prefill, often repeatedly moves model weights or attention data with comparatively little computation, so added HBM bandwidth can substantially raise token-generation throughput.", "speaker": "Moh Kolb", "type": "causal", "entities": ["LLM inference", "decode", "prefill", "HBM"], "conviction": "high", "so_what": "Growth of inference/decode workloads is the strongest demand driver for higher-bandwidth HBM.", "quote": "In these conditions, additional HBM bandwidth can substantially improve token-generation throughput.", "locator": "2. AI Training and Inference", "quote_verified": true}, {"claim": "Batch size, long-context key-value cache traffic, and speculative decoding change which resource limits LLM inference, so no single HBM bandwidth requirement describes all inference workloads.", "speaker": "Moh Kolb", "type": "thesis", "entities": ["KV cache", "speculative decoding", "LLM inference"], "conviction": "medium", "so_what": "Software techniques can shift inference bottlenecks and therefore shift the value of memory hardware specs.", "quote": "Consequently, there is no single bandwidth requirement that describes all AI inference workloads.", "locator": "2. AI Training and Inference", "quote_verified": true}]}, {"theme": "HBM capacity and KV cache pressure", "insights": [{"claim": "The key-value cache can become a significant consumer of HBM capacity in large-language-model inference as context length and concurrent requests grow.", "speaker": "Moh Kolb", "type": "causal", "entities": ["KV cache", "HBM", "LLM inference"], "conviction": "high", "so_what": "Long-context and high-concurrency inference trends drive demand for HBM capacity (more stacks/higher density), not just bandwidth.", "quote": null, "locator": "3. The Capacity Problem", "quote_verified": false}, {"claim": "An accelerator with higher HBM bandwidth but insufficient capacity can be slower overall than one with moderately lower bandwidth that holds the whole working set locally, because overflow forces offloading or distributed communication.", "speaker": "Moh Kolb", "type": "contrarian", "entities": ["HBM", "AI accelerators"], "conviction": "medium", "so_what": "Compare accelerators on per-device HBM capacity versus model working set, not headline bandwidth alone.", "quote": "The faster memory interface can therefore belong to the slower overall system.", "locator": "3. The Capacity Problem", "quote_verified": true}]}, {"theme": "Four levers for the memory bottleneck", "insights": [{"claim": "Accelerator designers can attack the memory bottleneck four ways - raising HBM bandwidth, raising HBM capacity, reducing memory traffic, and reorganizing the memory hierarchy across SRAM, local HBM, peer-accelerator memory, and host memory - and successful systems may need all four at once.", "speaker": "Moh Kolb", "type": "framework", "entities": ["HBM", "SRAM", "host memory", "AI accelerators"], "conviction": "high", "so_what": "Value accrues not only to HBM vendors but to software, scheduling, and memory-tiering solutions.", "quote": "These four approaches are not mutually exclusive.", "locator": "4. Four Different Ways", "quote_verified": true}, {"claim": "Quantization, caching, improved attention algorithms, data reuse, and workload-aware scheduling can be particularly powerful because they raise the efficiency of existing HBM bandwidth instead of requiring faster physical interfaces.", "speaker": "Moh Kolb", "type": "thesis", "entities": ["quantization", "attention algorithms", "HBM"], "conviction": "medium", "so_what": "Algorithmic traffic reduction is a competing substitute for hardware bandwidth upgrades; watch for software gains that dampen HBM spec-race economics.", "quote": null, "locator": "Approach C: Reduce Memory Traffic", "quote_verified": false}, {"claim": "Adding HBM stacks for capacity consumes package area and adds routing, power-delivery, thermal, and manufacturing complexity, and still does not improve throughput if the workload remains bandwidth- or compute-limited.", "speaker": "Moh Kolb", "type": "causal", "entities": ["HBM", "advanced packaging"], "conviction": "medium", "so_what": "Capacity-driven stack count increases raise packaging cost and complexity for accelerator vendors.", "quote": "But increasing capacity is not free.", "locator": "Approach B: Increase HBM Capacity", "quote_verified": true}]}, {"theme": "Bottleneck migration after faster HBM", "insights": [{"claim": "Speeding up HBM access can expose limits in compute throughput, synchronization, inter-accelerator communication, or software scheduling, and makes remote data movement a larger share of execution time.", "speaker": "Moh Kolb", "type": "causal", "entities": ["HBM", "interconnect", "AI accelerators"], "conviction": "high", "so_what": "Faster local memory raises the strategic importance of scale-out interconnect and scheduling software.", "quote": "Improving one part of the memory system changes the relative importance of the remaining parts.", "locator": "5. Why Faster HBM Can Move", "quote_verified": true}, {"claim": "Peak HBM bandwidth comparisons cannot establish application speedup; the relevant metrics are achieved bandwidth utilization, execution time, token throughput, latency, working-set residency, and system energy under representative workloads.", "speaker": "Moh Kolb", "type": "framework", "entities": ["HBM", "token throughput"], "conviction": "high", "so_what": "Evaluate AI hardware claims on workload-level benchmarks, not datasheet bandwidth.", "quote": null, "locator": "5. Why Faster HBM Can Move", "quote_verified": false}]}, {"theme": "Power, thermal, packaging, manufacturing limits", "insights": [{"claim": "A higher-bandwidth HBM architecture can improve energy per transferred bit while still increasing total memory-subsystem power under some workloads, so bandwidth and power must be evaluated together.", "speaker": "Moh Kolb", "type": "causal", "entities": ["HBM", "power"], "conviction": "medium", "so_what": "Rising memory power adds to accelerator thermal and data-center power budgets.", "quote": null, "locator": "6. The Power and Thermal Consequences", "quote_verified": false}, {"claim": "Heat from nearby high-power accelerators and from memory activity can force HBM below its nominal interface bandwidth, creating a gap between advertised bandwidth and bandwidth sustainable within qualified operating conditions.", "speaker": "Moh Kolb", "type": "causal", "entities": ["HBM", "thermal management", "advanced packaging"], "conviction": "high", "so_what": "Thermal solutions and packaging integration become differentiators for realized HBM performance.", "quote": "This creates a distinction between advertised bandwidth and bandwidth that can be maintained within the product’s qualified operating conditions.", "locator": "6. The Power and Thermal Consequences", "quote_verified": true}, {"claim": "Higher aggregate HBM bandwidth and more stacks push against practical limits of interposer size, substrate technology, package geometry, power distribution, and thermal management in heterogeneous AI packages where compute, memory, and high-speed communication compete for space.", "speaker": "Moh Kolb", "type": "causal", "entities": ["interposer", "substrate", "advanced packaging", "HBM"], "conviction": "medium", "so_what": "HBM roadmaps create pull for larger interposers and advanced substrates.", "quote": null, "locator": "7. What Changes at the Package Level?", "quote_verified": false}, {"claim": "Two HBM implementations meeting the same nominal bandwidth specification can show different power consumption, operating margins, and thermal behavior due to manufacturing variation in stacking, bonding, and interconnect formation.", "speaker": "Moh Kolb", "type": "data_point", "entities": ["HBM", "manufacturing", "bonding"], "conviction": "medium", "so_what": "HBM suppliers can differentiate on manufacturing capability and margins beyond spec-sheet parity.", "quote": null, "locator": "8. Manufacturing and Qualification", "quote_verified": false}]}, {"theme": "Effective memory performance as the next target", "insights": [{"claim": "The next phase of HBM development, including HBM4's wider interface and custom HBM architectures, should optimize effective sustained memory performance matched to workloads rather than peak bandwidth alone.", "speaker": "Moh Kolb", "type": "prediction", "entities": ["HBM4", "custom HBM", "AI accelerators"], "conviction": "medium", "so_what": "Expect custom HBM and workload-matched memory configurations to gain importance versus pure bandwidth races.", "quote": "The next phase of HBM development should focus on effective memory performance rather than peak bandwidth alone.", "locator": "9. What Should the Industry Optimize Next?", "quote_verified": true}]}], "insight_total": 18, "top_entities": ["HBM", "HBM4", "custom HBM", "AI accelerators", "KV cache", "LLM inference", "advanced packaging", "interposer", "SRAM", "quantization"], "source_meta": {"author": "Moh Kolb", "word_count": 2598, "paywalled": false}}, {"record_id": "bc6a828cfea68f44", "source_type": "technology", "source_name": "SemiWiki", "source_url": "https://semiwiki.com/forum/threads/26239", "title": "Nvidia Resists Huang Comeback Despite Trump’s Support", "published_date": "2026-11-17", "language": "en", "processed_at": "2026-11-18T11:08:19Z", "processor": "claude-code-sub-opus", "tags": ["Tech", "AI", "Geopolitics"], "gist": "Per Reuters, Nvidia's board is not considering reinstating Jensen Huang, who resigned as CEO on November 11 after revelations about personal relationships (including a Chinese businesswoman with alleged, unproven intelligence links), despite a 180,200+ signature petition, backing from Musk, Masad and Sweeney, and Trump saying he 'would certainly not mind' his return; CFO Colette Kress is interim CEO.", "themes": [{"theme": "Board rejects Huang reinstatement", "insights": [{"claim": "According to Reuters, citing three people, Nvidia's board is not considering reinstating co-founder Jensen Huang as CEO despite a public campaign for his return.", "speaker": "SemiWiki", "type": "data_point", "entities": ["Nvidia", "Jensen Huang", "Reuters"], "conviction": "high", "so_what": "Signals the board is prioritizing governance process over founder popularity; reduces odds of a near-term Huang return.", "quote": "three people told Reuters that the board was not weighing his return", "locator": "Supporters want Huang restored while", "quote_verified": true}, {"claim": "Nvidia's regulatory filing states the board accepted Jensen Huang's resignation as president, CEO and board member on November 11, effective , "conviction": "high", "so_what": "Political involvement raises pressure on Nvidia's board and blends US government relations into a corporate governance decision.", "quote": "would certainly not mind", "locator": "Trump said on November 16", "quote_verified": true}, {"claim": "The campaign to reinstate Jensen Huang as Nvidia CEO lists Elon Musk, Replit CEO Amjad Masad and Epic Games CEO Tim Sweeney among its supporters.", "speaker": "SemiWiki", "type": "data_point", "entities": ["Elon Musk", "Amjad Masad", "Replit", "Tim Sweeney", "Epic Games", "Jensen Huang"], "conviction": "high", "so_what": "Shows breadth of tech-industry backing for Huang; an indicator of ecosystem loyalty to the founder.", "quote": null, "locator": "Trump said on November 16", "quote_verified": false}, {"claim": "More than 180,200 people signed a petition seeking Jensen Huang's reinstatement at Nvidia, with thousands self-identifying as Nvidia employees, though those affiliations were self-reported and unverified.", "speaker": "SemiWiki", "type": "data_point", "entities": ["Nvidia", "Jensen Huang"], "conviction": "medium", "so_what": "Possible employee morale / retention risk at Nvidia if the board holds firm; signal strength limited by unverified affiliations.", "quote": null, "locator": "Reuters reported that more than 180,200", "quote_verified": false}]}, {"theme": "Governance vs. founder influence", "insights": [{"claim": "The Jensen Huang reinstatement dispute tests how Nvidia balances its co-founder's influence against board oversight and continuity, given Huang's relationships span employees, customers, suppliers and government.", "speaker": "SemiWiki", "type": "framework", "entities": ["Nvidia", "Jensen Huang"], "conviction": "medium", "so_what": "Key-person risk: Huang's web of customer, supplier and government ties may be hard to replace, affecting relationships during the transition.", "quote": "Huang’s relationships span employees, customers, suppliers and government.", "locator": "The dispute matters because it", "quote_verified": true}, {"claim": "SemiWiki argues public popularity will not decide Jensen Huang's return; Nvidia's directors must maintain confidence in operations while ensuring leadership decisions follow a credible process.", "speaker": "SemiWiki", "type": "thesis", "entities": ["Nvidia", "Jensen Huang"], "conviction": "medium", "so_what": "Expect the board to defer any leadership decision until the independent investigation concludes, rather than reacting to public pressure.", "quote": "popularity alone will not determine whether he returns to lead the company through its next phase", "locator": "For directors, public support does not", "quote_verified": true}]}], "insight_total": 9, "top_entities": ["Nvidia", "Jensen Huang", "Colette Kress", "Donald Trump", "Reuters", "Elon Musk", "Tim Sweeney", "Amjad Masad", "Epic Games", "Replit"], "source_meta": {"author": "SemiWiki", "word_count": 311, "paywalled": false}}, {"record_id": "c7d6c2bef15f2b56", "source_type": "technology", "source_name": "SemiWiki", "source_url": "https://semiwiki.com/forum/threads/26244", "title": "Rumor:  Razor Lake gets 12 P-core only die with bLLC on Intel 18A-P", "published_date": "2026-11-17", "language": "en", "processed_at": "2026-11-18T11:07:51Z", "processor": "claude-code-sub-opus", "tags": ["Tech"], "gist": "Rumor (via leaker Jaykihn) that Intel's 2028 Razor Lake includes an unlocked 12 P-core-only (12+0+4, Coyote Cove) single compute die with bLLC built on Intel 18A-P, in contrast to Nova Lake whose top SKUs may be TSMC N2P-only; Razor Lake will still also have TSMC N2 variants.", "themes": [{"theme": "Razor Lake 12P die on Intel 18A-P", "insights": [{"claim": "Intel is reportedly preparing an unlocked Razor Lake desktop processor with 12 P-cores on a single compute die, built on Intel's 18A-P process and featuring bLLC (Big Last Level Cache), per hardware leaker Jaykihn.", "speaker": "S", "type": "data_point", "entities": ["Intel", "Razor Lake", "Intel 18A-P", "bLLC", "Jaykihn"], "conviction": "medium", "so_what": "An internal-node flagship-class client die signals Intel confidence in 18A-P yields/performance; watch for confirmation as a foundry credibility marker.", "quote": "Intel is reportedly preparing an unlocked Razor Lake desktop processor featuring 12 P-cores on a single compute die.", "locator": "Intel is reportedly preparing an unlocked", "quote_verified": true}, {"claim": "The rumored Razor Lake part uses a 12+0+4 configuration: 12 Coyote Cove performance cores, zero standard efficiency cores, and four low-power efficiency cores.", "speaker": "S", "type": "data_point", "entities": ["Intel", "Razor Lake", "Coyote Cove"], "conviction": "medium", "so_what": "A P-core-heavy, no-standard-E-core design targets per-thread performance (e.g., gaming), a segment where Intel competes directly with AMD's cache-heavy parts.", "quote": "12+0+4 configuration", "locator": "Jaykihn reports that the processor has", "quote_verified": true}, {"claim": "The Razor Lake 12 P-core part is reportedly a dedicated P-core-only compute die rather than a hybrid die with disabled E-cores, and all 12 P-cores sit on one die rather than two six-core compute tiles.", "speaker": "S", "type": "data_point", "entities": ["Intel", "Razor Lake"], "conviction": "medium", "so_what": "Taping out a dedicated die implies Intel sees enough volume in the high per-thread-performance desktop segment to justify extra design cost.", "quote": "dedicated P-core-only compute die", "locator": "The leaker clarified that this is", "quote_verified": true}, {"claim": "Coyote Cove, the P-core architecture in the rumored Razor Lake die, is also expected to debut with Nova Lake.", "speaker": "S", "type": "data_point", "entities": ["Coyote Cove", "Nova Lake", "Razor Lake", "Intel"], "conviction": "medium", "so_what": "Core-architecture reuse across generations shifts Razor Lake's differentiation to process (18A-P) and cache (bLLC).", "quote": null, "locato "medium", "so_what": "Signals a potential new diagnostics/wearables category for inflammation; watch for spinouts or licensing deals.", "quote": "No such device exists today for continuous tracking of inflammation.", "locator": "One of the cool projects she oversees", "quote_verified": true}, {"claim": "The wearable immune monitor is explicitly modeled on continuous glucose monitors, which changed how diabetes is treated and managed, suggesting a CGM-like trajectory for immune disorders if it works.", "speaker": "Timmerman Report", "type": "framework", "entities": ["continuous glucose monitors", "diabetes", "immune disorders"], "conviction": "medium", "so_what": "CGM precedent offers a template for market sizing and adoption of continuous inflammation sensing.", "quote": "It’s inspired by continuous glucose monitors that have changed the way diabetes is treated and managed.", "locator": "One of the cool projects she oversees", "quote_verified": true}, {"claim": "Successful continuous inflammation monitoring would have large implications for research and treatment of immune disorders affecting millions of people.", "speaker": "Timmerman Report", "type": "prediction", "entities": ["immune disorders", "inflammation"], "conviction": "exploratory", "so_what": "Could reshape immunology trial endpoints and disease management if technically proven.", "quote": null, "locator": "One of the cool projects she oversees", "quote_verified": false}]}, {"theme": "Development stage and path to market", "insights": [{"claim": "Detection of inflammatory proteins by the Kelley team's sensing approach has so far been demonstrated only in mice, with results published in Science in December 2024.", "speaker": "Timmerman Report", "type": "data_point", "entities": ["Science", "inflammatory proteins", "Shana Kelley"], "conviction": "high", "so_what": "Preclinical stage only; human validation and commercialization are years away.", "quote": "The detection of inflammatory proteins was demonstrated in mice and published in Science in December 2024.", "locator": "The detection of inflammatory proteins", "quote_verified": true}, {"claim": "Bringing the continuous immune monitor to market will require an industry partnership, creating a potential licensing or collaboration opportunity for diagnostics/medtech companies.", "speaker": "Timmerman Report", "type": "prediction", "entities": ["Chan Zuckerberg Biohub Chicago", "medtech", "diagnostics"], "conviction": "high", "so_what": "Watch for a medtech/diagnostics partner announcement as the commercialization catalyst.", "quote": "The next steps to build something suitable for the marketplace will require some kind of industry partnership.", "locator": "The detection of inflammatory proteins", "quote_verified": true}]}, {"theme": "AI agents in life-sciences research", "insights": [{"claim": "AlphaSense launched SuperAnalyst, an always-on AI agent that continuously monitors life-sciences sources such as clinical trial data, literature, regulatory filings and expert transcripts on a user's behalf (per sponsor copy).", "speaker": "Timmerman Report", "type": "data_point", "entities": ["AlphaSense", "SuperAnalyst", "AI agents"], "conviction": "low", "so_what": "Evidence of agentic AI products entering biotech competitive-intelligence workflows; promotional source.", "quote": "AlphaSense just launched SuperAnalyst, an always-on agent that works like a power user inside the platform on your behalf.", "locator": "AlphaSense just launched SuperAnalyst", "quote_verified": true}]}], "insight_total": 6, "top_entities": ["Shana Kelley", "Chan Zuckerberg Biohub Chicago", "Northwestern University", "continuous glucose monitors", "inflammation", "Science", "AlphaSense"], "source_meta": {"author": "Timmerman Report", "word_count": 555, "paywalled": false}}, {"record_id": "39e8cf4960718900", "source_type": "technology", "source_name": "Together AI Blog", "source_url": "https://www.together.ai/blog/road-to-together-compiler", "title": "Last year we built megakernels. This year we deleted them: The road to Together Compiler", "published_date": "2026-11-16", "language": "en", "processed_at": "2026-11-18T11:09:26Z", "processor": "claude-code-sub-opus", "tags": ["AI", "Tech"], "gist": "Together AI found that its record-setting megakernels were unproductizable and that default Torch Inductor kernels plus CUDA Graphs and PDL recover 98% of their performance; heterogeneous models and hardware make monolithic fusion suboptimal. It replaced rule-based compilation with a minimal agent-driven optimizer (Together Compiler) after learning that heavy scaffolding (IRs, knowledge hubs, expert strategies) hurt agents, claiming up to 1.7x over megakernels and up to 2.6x over optimized baselines.", "themes": [{"theme": "Megakernels deleted: simple primitives match them", "insights": [{"claim": "Together AI's hand-built Llama 1B megakernel reached 990 TPS on H100 (48% over Torch Inductor's 669 TPS), but after months of production work in late 2025 it supported only one model, one batch size (1), one precision (BF16) and one customer.", "speaker": "Dylan Lim, Reyna Abhyankar, Simran Arora", "type": "anecdote", "entities": ["Together AI", "Megakernels", "Llama 1B", "H100", "Torch Inductor"], "conviction": "high", "so_what": "Record-breaking monolithic kernels can be commercially unproductizable; discount benchmark-only inference speed claims that lack workload flexibility.", "quote": "we had a grand total of one model, one batch size, and one customer.", "locator": "Introduction / Then we tried putting megakernels into production", "quote_verified": true}, {"claim": "Default Torch Inductor kernels plus CUDA Graphs and fine-grained Programmatic Dependent Launch (PDL) reach 975 TPS on Llama 1B H100, 98% of the hand-optimized megakernel, without writing a single custom kernel.", "speaker": "Dylan Lim, Reyna Abhyankar, Simran Arora", "type": "data_point", "entities": ["Torch Inductor", "CUDA Graphs", "PDL", "NVIDIA", "Llama 1B", "H100"], "conviction": "high", "so_what": "Much of the 'custom kernel' performance moat in inference is replicable with stock NVIDIA primitives, compressing differentiation for kernel-specialist startups.", "quote": "we could recover 98% of megakernel performance without writing a single kernel", "locator": "Putting all of this together, default PyTorch Inductor kernels", "quote_verified": true}, {"claim": "Stepwise ablation on Llama 1B H100: Torch Compile 669 TPS, +CUDA Graphs 864 TPS (87% of megakernel), +PDL 953 TPS (96%), +fine-grained PDL placement 975 TPS (98%).", "speaker": "Dylan Lim, Reyna Abhyankar, Simran Arora", "type": "data_point", "entities": ["Torch Compile", "CUDA Graphs", "PDL", "Llama 1B"], "conviction": "high", "so_what": "Launch-overhead removal is the dominant lever in small-batch decode; CUDA Graphs alone captures most of the gain.", "quote": null, "locator": "Launch overhead. Kernel launch overhead is costly.", "quote_verified": false}, {"claim": "In PyTorch, ATen dispatch costs 37 microseconds for an H100 Llama 1B down-projection whose GPU execution is only 15 microseconds; even pure C++ launches cost about 2 microseconds each, adding up across hundreds of kernels per forward pass.", "speaker": "Dylan Lim, Reyna Abhyankar, Simran Arora", "type": "data_point", "entities": ["PyTorch", "ATen", "H100", "Llama 1B"], "conviction": "high", "so_what": "CPU-side framework overhead, not GPU FLOPs, often bounds low-latency decode—favoring graph capture and host-side optimization tooling.", "quote": "Thirty-seven microseconds of paperwork for fifteen microseconds of work", "locator": "Launch overhead.", "quote_verified": true}, {"claim": "Megakernels do not eliminate launch costs; they trade them for in-kernel synchronization: megakernel grid sync costs 646 ns on H100 vs 645 ns for CUDA Graph + PDL, while a normal cudaLaunchKernelEx costs 2,077 ns (2,496 ns on B200).", "speaker": "Dylan Lim, Reyna Abhyankar, Simran Arora", "type": "data_point", "entities": ["CUDA Graphs", "PDL", "H100", "B200", "NVIDIA"], "conviction": "high", "so_what": "The headline advantage of persistent megakernels is largely illusory once modern launch primitives are used.", "quote": "it just trades launch overhead for similar synchronization costs inside the kernel", "locator": "Synchronization cost across launch mechanisms on H100 and B200", "quote_verified": true}, {"claim": "Intra-kernel synchronization is slightly slower on NVIDIA B200 than H100 because B200 is split into two separate dies; single-die sync matches H100 for an equivalent SM count.", "speaker": "Dylan Lim, Reyna Abhyankar, Simran Arora", "type": "causal", "entities": ["NVIDIA", "B200", "H100", "Blackwell"], "conviction": "medium", "so_what": "Multi-die GPU designs introduce sync penalties that favor software designs avoiding global grid barriers.", "quote": null, "locator": "Interestingly, intra-kernel synchronization is slightly slower on B200", "quote_verified": false}, {"claim": "Compute-overlap benefits of persistent kernels are limited: in the Llama 1B H100 megakernel three of five producer-consumer edges per layer require full barriers (a fourth is effectively full), so only the attention instruction meaningfully benefits from overlap.", "speaker": "Dylan Lim, Reyna Abhyankar, Simran Arora", "type": "causal", "entities": ["Megakernels", "Llama 1B", "H100"], "conviction": "high", "so_what": "Inherent serialization in transformer layers caps gains from exotic scheduling; skepticism warranted toward persistent-kernel marketing.", "quote": null, "locator": "Compute overlap. Wave quantization occurs", "quote_verified": false}, {"claim": "Megakernel paged-memory weight preloading was worth only about 3.3% of forward time (990 to 961 TPS when removed), and PDL with carefully placed griddepcontrol.wait recovers up to 98% of that gain.", "speaker": "Dylan Lim, Reyna Abhyankar, Simran Arora", "type": "data_point", "entities": ["Megakernels", "PDL", "Llama 1B"], "conviction": "high", "so_what": "Memory-prefetch tricks are second-order in decode; simpler tooling captures them.", "quote": "Memory preloading helps, but not a lot", "locator": "Memory overlap. Our earlier megakernel divided", "quote_verified": true}]}, {"theme": "Why monolithic kernels fail on new hardware/models", "insights": [{"claim": "Megakernels force one launch envelope (warp count, registers, cluster shape) on all ops: Hopper wgmma GEMMs run best at 12 warps, and forcing them into the megakernel's 20-warp configuration makes them 1.2-1.5x slower; AMD hardware faces the same register constraint, though Blackwell's tcgen05 does not.", "speaker": "Dylan Lim, Reyna Abhyankar, Simran Arora", "type": "causal", "entities": ["Megakernels", "Hopper", "Blackwell", "AMD", "NVIDIA"], "conviction": "high", "so_what": "Hardware heterogeneity (NVIDIA generations plus AMD) structurally penalizes one-size kernel strategies, favoring adaptive compilers.", "quote": null, "locator": "Persistent kernels force hardware tradeoffs", "quote_verified": false}, {"claim": "Packing a whole model into one megakernel binary overflows the SM instruction cache, causing evictions and refetches when operations repeat.", "speaker": "Dylan Lim, Reyna Abhyankar, Simran Arora", "type": "causal", "entities": ["Megakernels", "GPU instruction cache"], "conviction": "medium", "so_what": "Another hidden cost of monolithic fusion that grows with model complexity.", "quote": null, "locator": "Megakernels also add pressure to the SM's instruction cache", "quote_verified": false}, {"claim": "Kimi K3 on Blackwell interleaves KDA and MLA layers that need different tensor-core cta_group modes (single-CTA vs CTA-pair), which PTX forbids mixing in one kernel, so a megakernel cannot run both optimally.", "speaker": "Dylan Lim, Reyna Abhyankar, Simran Arora", "type": "causal", "entities": ["Kimi K3", "Blackwell", "KDA", "MLA", "PTX"], "conviction": "high", "so_what": "Architectural diversity in frontier open models (hybrid attention, MoE) makes inference optimization a per-model problem—a moat for continual optimization services.", "quote": "PTX forbids mixing these two different modes into one kernel", "locator": "Modern architectures don't fit single envelopes", "quote_verified": true}, {"claim": "For Kimi K3, running MoE GEMMs tensor-parallel and attention projections data-parallel means TP GEMMs process 8x more tokens and need a different cluster size; forcing one cluster size causes a 5-19% slowdown.", "speaker": "Dylan Lim, Reyna Abhyankar, Simran Arora", "type": "data_point", "entities": ["Kimi K3", "MoE", "Tensor parallelism"], "conviction": "medium", "so_what": "Mixed parallelism schemes in production MoE serving reward per-op tuning.", "quote": null, "locator": "During inference, different kernels may require different parallelism schemes", "quote_verified": false}, {"claim": "Un-fusing can win: moving Kimi K3 expert dispatch to the GPU copy engine beat Mixture of Kittens' MoE megakernel by 6.9% under imbalanced routing, and FlashInfer's MegaMoE ran 17% faster by factoring dispatch out of its GEMM.", "speaker": "Dylan Lim, Reyna Abhyankar, Simran Arora", "type": "contrarian", "entities": ["Kimi K3", "Mixture of Kittens", "FlashInfer", "MegaMoE", "MoE"], "conviction": "high", "so_what": "Contrary to the 'fuse everything' consensus, the edge is choosing which ops to couple—a search problem suited to automated/agentic tuning.", "quote": "Fusion for the sake of fusion is not always ideal.", "locator": "Examining open source kernels, we found", "quote_verified": true}]}, {"theme": "Torch Inductor's heuristic and benchmarking gaps", "insights": [{"claim": "Torch Inductor's 'freezing' flag improved throughput 10-26% at larger batch sizes but caused a 49% slowdown at batch size 1, because an FP32 weight conversion was not reversed for matrix-vector operations.", "speaker": "Dylan Lim, Reyna Abhyankar, Simran Arora", "type": "data_point", "entities": ["Torch Inductor", "PyTorch"], "conviction": "high", "so_what": "Static compiler heuristics can badly misfire on latency-critical batch-1 serving; workload-specific search has real value.", "quote": null, "locator": "The best optimization depends on the workload.", "quote_verified": false}, {"claim": "As of Q3 2026 Torch Inductor exposes 607 tuning flags, 198 added in the past year, and their effects interact non-additively (aggressive_fusion alone cost 6 TPS on Llama 1B but combined with three other flags gained 3 TPS).", "speaker": "Dylan Lim, Reyna Abhyankar, Simran Arora", "type": "data_point", "entities": ["Torch Inductor", "PyTorch", "Llama 1B"], "conviction": "high", "so_what": "The exploding configuration space argues for systematic/agentic search over human-tuned compilers.", "quote": "As of Q3 2026, Inductor exposes 607 tuning flags, 198 of which were added in the past year.", "locator": "Optimizations interact in unpredictable ways.", "quote_verified": true}, {"claim": "Inductor's isolated kernel benchmarks flush L2 cache and include CPU launch idle time, overestimating kernel times by 39-58% versus live inference and reporting 2.5 µs for an op doing no GPU work; this led it to pick a Triton GEMM 15% slower than cuBLAS on Llama 1B's output projection.", "speaker": "Dylan Lim, Reyna Abhyankar, Simran Arora", "type": "causal", "entities": ["Torch Inductor", "Triton", "cuBLAS", "Llama 1B", "Nsight Systems"], "conviction": "high", "so_what": "Benchmark fidelity is a hidden performance lever; vendors measuring inside real forward passes gain edge.", "quote": null, "locator": "Finding #2: The fastest kernel in isolation", "quote_verified": false}, {"claim": "Unrealistic benchmark inputs distort results: zero-initialized token IDs made torch.embedding 2.1x faster than random IDs at 64K tokens, and random inputs misjudged GLM 5.3's MoE grouped-GEMM latency by 4-21%.", "speaker": "Dylan Lim, Reyna Abhyankar, Simran Arora", "type": "data_point", "entities": ["PyTorch", "GLM 5.3", "MoE"], "conviction": "high", "so_what": "Data-dependent architectures (MoE) make realistic-input profiling essential.", "quote": "accurate benchmarking requires taking measurements from inside a real forward pass on real input data", "locator": "Benchmark inputs can also distort cache behavior", "quote_verified": true}, {"claim": "Inductor's greedy pairwise fusion scores candidates by memory-traffic savings and so rejects fusing kernels sharing no memory, even when one launches just 6 CTAs leaving most of an H100's 132 SMs idle.", "speaker": "Dylan Lim, Reyna Abhyankar, Simran Arora", "type": "framework", "entities": ["Torch Inductor", "H100"], "conviction": "medium", "so_what": "Fusion algorithms should optimize GPU utilization, not just memory traffic.", "quote": "an algorithm for kernel fusion should reason about utilization, not just memory", "locator": "Finding #3: Inductor leaves fusion opportunities on the table.", "quote_verified": true}]}, {"theme": "Agent-built kernels need real data and context", "insights": [{"claim": "A static repository of pre-generated agent kernels swapped into Torch graphs proved ineffective because the best kernel depends on the model, workload and surrounding operations.", "speaker": "Dylan Lim, Reyna Abhyankar, Simran Arora", "type": "causal", "entities": ["Together AI", "Coding agents", "PyTorch"], "conviction": "medium", "so_what": "Kernel libraries/marketplaces have limited value vs in-context continual optimization.", "quote": "a static registry could not easily account for this", "locator": "In March when these experiments were taking place", "quote_verified": true}, {"claim": "An agent-written top-k indexer ran in 20 µs on random inputs but 62 ms on real inputs, because ReLU-produced exact zeros concentrated candidates into one histogram bin and triggered quadratic work.", "speaker": "Dylan Lim, Reyna Abhyankar, Simran Arora", "type": "anecdote", "entities": ["Coding agents", "GPU kernels"], "conviction": "high", "so_what": "AI-generated kernels validated on synthetic data can catastrophically regress in production—a risk for agentic codegen vendors.", "quote": "Agents need real data and full execution context to generate optimizations that hold up in production.", "locator": "Furthermore, synthetic inputs misled agents.", "quote_verified": true}, {"claim": "Together AI found that by March coding agents had become remarkably capable at writing GPU kernels, shifting its approach from a rule-based compiler to an agent-centric compiler.", "speaker": "Dylan Lim, Reyna Abhyankar, Simran Arora", "type": "thesis", "entities": ["Together AI", "Coding agents", "GPU kernels"], "conviction": "high", "so_what": "Frontier coding agents are now credible GPU kernel engineers, threatening scarce-human-expertise moats in CUDA optimization.", "quote": "coding agents had become remarkably capable at writing GPU kernels", "locator": "In March when these experiments were taking place", "quote_verified": true}]}, {"theme": "Bitter lessons: less scaffolding, better agents", "insights": [{"claim": "Together AI's custom BlockIR (driver-level kernel capture via CUPTI/rocProf with symbolic pointer mapping) was abandoned because agents spent more time debugging pointer tracking than optimizing; agents now edit forward-pass source code directly.", "speaker": "Dylan Lim, Reyna Abhyankar, Simran Arora", "type": "contrarian", "entities": ["Together AI", "BlockIR", "CUPTI", "rocProf", "AMD"], "conviction": "high", "so_what": "As frontier models improve, elaborate IRs become liabilities; simpler source-level agent loops win.", "quote": "agents were spending more time debugging pointer tracking than identifying optimizations", "locator": "Phase 1: Capturing a sequence of kernels", "quote_verified": true}, {"claim": "In Kimi K2.6 on TensorRT-LLM, 23 of 24 decoder-layer kernels are dispatched through C++ as custom torch ops and are opaque to Torch Inductor, limiting what PyTorch's FX graph compilers can optimize.", "speaker": "Dylan Lim, Reyna Abhyankar, Simran Arora", "type": "data_point", "entities": ["Kimi K2.6", "TensorRT-LLM", "Torch Inductor", "PyTorch"], "conviction": "medium", "so_what": "Production engines largely bypass PyTorch compilers, so compiler-level optimization tools must work beyond FX graphs.", "quote": null, "locator": "We started from PyTorch's FX Graph IR.", "quote_verified": false}, {"claim": "Host-side optimizations outside kernel IRs matter: rewriting Kimi K3's MLA metadata planning to split long sequences across thread blocks sped the MLA kernel 1.7-2.5x.", "speaker": "Dylan Lim, Reyna Abhyankar, Simran Arora", "type": "data_point", "entities": ["Kimi K3", "MLA"], "conviction": "medium", "so_what": "Agentic optimizers with full source access can capture gains invisible to kernel-only compilers.", "quote": null, "locator": "A limited optimization space.", "quote_verified": false}, {"claim": "On GLM 5.3 on AMD, clock drift up to 325 µs between launch hooks and PyTorch's allocator history mislabeled pointers, illustrating brittleness of pointer-level IR capture.", "speaker": "Dylan Lim, Reyna Abhyankar, Simran Arora", "type": "anecdote", "entities": ["GLM 5.3", "AMD", "PyTorch"], "conviction": "low", "so_what": "AMD tooling paths remain rougher, adding friction for cross-vendor optimization.", "quote": null, "locator": "Even identifying pointers in the first place was fragile.", "quote_verified": false}, {"claim": "An expert-curated knowledge hub made agents 25-31% worse by anchoring them to known patterns; on MiniMax-M3 layer 3 (B200, TP4, batch 1) it cut ensemble speedup from 5.85x to 4.75x.", "speaker": "Dylan Lim, Reyna Abhyankar, Simran Arora", "type": "contrarian", "entities": ["MiniMax-M3", "B200", "Together AI"], "conviction": "high", "so_what": "Retrieval-augmented 'expert knowledge' can harm agent search—relevant to RAG/agent tooling vendors' value propositions.", "quote": null, "locator": "Knowledge hub. Our system used a knowledge hub", "quote_verified": false}, {"claim": "A naive prompt to 'make this forward pass as fast as possible' outperformed six expert-written strategy ensembles (6.20x vs 4.92x, 26% better), as prescribing optimization order traps agents in local minima (phase-ordering problem).", "speaker": "Dylan Lim, Reyna Abhyankar, Simran Arora", "type": "contrarian", "entities": ["Together AI", "Coding agents"], "conviction": "high", "so_what": "Human-prescribed workflows can cap agent performance; value shifts to measurement infrastructure and compute throughput.", "quote": null, "locator": "Expert strategies. We initially seeded each parallel agent", "quote_verified": false}, {"claim": "Enforced DAG-style research logging consumed up to 43% of agents' CLI/tool calls per trial with little optimization value, so it was removed.", "speaker": "Dylan Lim, Reyna Abhyankar, Simran Arora", "type": "data_point", "entities": ["Coding agents"], "conviction": "medium", "so_what": "Agent bookkeeping overhead is a measurable tax; lean scaffolds improve compute efficiency.", "quote": null, "locator": "Research and logging data structures.", "quote_verified": false}, {"claim": "Parallel agents communicating frequently via a lightweight message board reached 7.72x speedup vs 6.20x with infrequent and 4.82x with no communication, because isolation caused redundant duplicate work.", "speaker": "Dylan Lim, Reyna Abhyankar, Simran Arora", "type": "data_point", "entities": ["Together AI", "Coding agents"], "conviction": "high", "so_what": "Multi-agent systems benefit from continuous coordination—a design signal for agent orchestration platforms.", "quote": null, "locator": "Agent ensembling.", "quote_verified": false}, {"claim": "Systems built around agents should anticipate improving model capabilities, because scaffolding that helps early can later become a constraint.", "speaker": "Dylan Lim, Reyna Abhyankar, Simran Arora", "type": "framework", "entities": ["Coding agents", "Together AI"], "conviction": "high", "so_what": "Bet on minimal, measurement-centric agent infrastructure that scales with model progress rather than heavy bespoke frameworks.", "quote": "frameworks that help early on can later become constraints", "locator": "Wrapping Up", "quote_verified": true}]}, {"theme": "Together Compiler results and positioning", "insights": [{"claim": "Together Compiler (TKCC), an agent-driven continual inference optimizer, runs in under 24 hours on no more than two nodes and generates up to 1.7x higher TPS than Together's megakernel baseline (over 1,100 TPS for Llama 1B on H100).", "speaker": "Dylan Lim, Reyna Abhyankar, Simran Arora", "type": "data_point", "entities": ["Together AI", "Together Compiler", "TKCC", "Llama 1B", "H100"], "conviction": "high", "so_what": "Together AI is productizing automated per-customer inference optimization as a differentiator vs other inference clouds; offered in early access.", "quote": null, "locator": "This minimal system is what powers Together Compiler today.", "quote_verified": false}, {"claim": "Together Compiler claims to beat highly optimized baselines by up to 2.6x, setting low-latency state of the art at 1,111 TPS on MiniMax M3.1-Flash and 1,205 TPS on DeepSeek v4.1-Flash, and speedups up to 6.4x on open-source codebases in weather modeling, PDEs, time-series and biology.", "speaker": "Dylan Lim, Reyna Abhyankar, Simran Arora", "type": "data_point", "entities": ["Together Compiler", "MiniMax M3.1-Flash", "DeepSeek v4.1-Flash", "Together AI"], "conviction": "medium", "so_what": "If generalizable, agentic optimization expands beyond LLM serving into scientific computing, widening Together AI's TAM; claims are vendor self-reported.", "quote": "setting state-of-the-art low-latency performance with 1,111 TPS on MiniMax M3.1-Flash and 1,205 TPS on DeepSeek v4.1-Flash", "locator": "Tops engine leaderboards", "quote_verified": true}, {"claim": "Together AI argues inference is becoming heterogeneous—new architectures weekly, shifting batch sizes and sequence lengths, proliferating hardware—so the winning approach is continual, workload-specific optimization rather than monolithic kernels or static compiler heuristics.", "speaker": "Dylan Lim, Reyna Abhyankar, Simran Arora", "type": "thesis", "entities": ["Together AI", "Together Compiler", "AI inference"], "conviction": "high", "so_what": "Hardware/model fragmentation increases value of optimization software layers and erodes single-vendor lock-in; watch inference providers' compiler moats.", "quote": "there is no one-size-fits-all kernel", "locator": "Introduction / Wrapping Up", "quote_verified": true}]}], "insight_total": 33, "top_entities": ["Together AI", "Together Compiler", "Megakernels", "Torch Inductor", "CUDA Graphs", "PDL", "Llama 1B", "H100", "B200", "Kimi K3", "Coding agents", "MoE"], "source_meta": {"author": "Dylan Lim, Reyna Abhyankar, Simran Arora", "word_count": 6189, "paywalled": false}}, {"record_id": "b9d21ce5fcc559c0", "source_type": "technology", "source_name": "Together AI Blog", "source_url": "https://www.together.ai/blog/making-open-models-work-for-long-horizon-agentic-workloads", "title": "Making open models work for long-horizon agentic workloads", "published_date": "2026-11-16", "language": "en", "processed_at": "2026-11-18T11:08:52Z", "processor": "claude-code-sub-opus", "tags": ["AI", "Tech"], "gist": "Together AI and Ollama explain that agentic coding workloads are prefill-dominated and only economical with prefix caching, which harnesses break by mutating early prompt content (timestamps, late tool insertion, reasoning-effort changes) and engines lose via misrouting or eviction; Together counters with cache-aware routing, CPU offload, PagedAttention and disaggregated prefill/decode over RDMA.", "themes": [{"theme": "Agentic traffic is prefill-bound", "insights": [{"claim": "Coding-agent workloads have very large input sequence lengths and very small outputs: each step resends the entire conversation (system prompt, tool definitions, files read, commands run) and typically gets back a tool call only a few dozen tokens long.", "speaker": "Zain Hasan, Parth Sareen (Ollama)", "type": "data_point", "entities": ["coding agents", "prefix caching"], "conviction": "high", "so_what": "Inference demand from agents scales with context length, not output tokens; providers optimized for prefill and cache reuse gain cost advantage.", "quote": "This large input sequence length (ISL) and small output sequence length (OSL) is characteristic of most agentic workloads.", "locator": "Coding agents have an odd traffic pattern", "quote_verified": true}, {"claim": "For agentic workloads, model speed effectively means how fast an engine can process a long history of previous turns, because agent turns are dominated by prefill rather than decode, even for reasoning models once sessions reach tens of thousands of tokens.", "speaker": "Zain Hasan, Parth Sareen (Ollama)", "type": "framework", "entities": ["prefill", "decode", "reasoning models"], "conviction": "high", "so_what": "Benchmark inference providers on time-to-first-token over long cached prompts, not tokens/sec streaming, when evaluating agent infrastructure.", "quote": "an agent turn is mostly prefill", "locator": "A normal chat response spends time", "quote_verified": true}, {"claim": "Without prefix caching, the compute redone across an agent session grows with the square of session length: 100 equal-sized turns process 5,050 units of prompt uncached versus 100 with caching (idealized).", "speaker": "Zain Hasan, Parth Sareen (Ollama)", "type": "data_point", "entities": ["prefix caching", "KV cache"], "conviction": "high", "so_what": "Prefix-cache hit rate is a first-order driver of agent inference cost; vendors that sell cached-token discounts capture this economics.", "quote": "without caching, the work you redo grows with the square of the session length", "locator": "The arithmetic is simple", "quote_verified": true}, {"claim": "A prefix cache matches only up to the first differing token, so appending to the prompt is free while changing even one character near the top forces re-processing of the whole session.", "speaker": "Zain Hasan, Parth Sareen (Ollama)", "type": "causal", "entities": ["prefix caching"], "conviction": "high", "so_what": "Any harness or API feature that mutates early prompt content silently multiplies inference spend.", "quote": "Changing anything earlier, even a single character, means re-processing everything after it.", "locator": "The catch is that a prefix cache", "quote_verified": true}]}, {"theme": "Harness design that breaks caches", "insights": [{"claim": "Ollama shipped an 'ollama launch' command letting users connect harnesses like Claude Code, Codex and Pi to open models such as DeepSeek-V4.1-Flash and GLM-5.3 while keeping existing workflows.", "speaker": "Zain Hasan, Parth Sareen (Ollama)", "type": "data_point", "entities": ["Ollama", "Claude Code", "Codex", "Pi", "DeepSeek-V4.1-Flash", "GLM-5.3"], "conviction": "high", "so_what": "Open models are being plugged into closed-vendor agent harnesses, lowering switching costs away from proprietary model APIs.", "quote": null, "locator": "The harnesses and APIs", "quote_verified": false}, {"claim": "Translation layers between agent harnesses and model APIs are a frequent cause of prefix-cache breakage, unexplained agent behavior and outright harness errors, imposing time and monetary costs.", "speaker": "Zain Hasan, Parth Sareen (Ollama)", "type": "causal", "entities": ["Ollama", "agent harnesses"], "conviction": "medium", "so_what": "Integration quality, not just model quality, determines real-world cost/performance of open models in agent stacks.", "quote": null, "locator": "Connecting a harness to an API might seem easy", "quote_verified": false}, {"claim": "Late-loaded tools found via tool search should be appended at the end of the conversation rather than inserted into the tool list near the top, which can force re-processing of hundreds of thousands of tokens; but some models' chat templates error when a tool definition appears mid-conversation.", "speaker": "Zain Hasan, Parth Sareen (Ollama)", "type": "causal", "entities": ["tool search", "chat templates"], "conviction": "medium", "so_what": "Model chat-template design (support for mid-conversation tools) becomes a competitive feature for open models in agent use.", "quote": null, "locator": "Loading tools late", "quote_verified": false}, {"claim": "Putting turn-varying values such as timestamps, git status or the working directory in the system prompt turns every agent turn into a full re-read; session-specific values like a user's name also prevent new sessions from reusing cached setups across users.", "speaker": "Zain Hasan, Parth Sareen (Ollama)", "type": "causal", "entities": ["system prompt", "prefix caching"], "conviction": "high", "so_what": "Harness builders should keep system prompts byte-identical across sessions to unlock cross-session cache hits.", "quote": "The easiest way to wreck the cache is to put something in the system prompt that changes from turn to turn", "locator": "Things at the top that change", "quote_verified": true}, {"claim": "In GLM-5.3-Flash the chat template writes reasoning effort into the first system block, so raising effort mid-session invalidates nearly the whole cache; the authors advise fixing effort at session start or starting a fresh (or compacted) session instead.", "speaker": "Zain Hasan, Parth Sareen (Ollama)", "type": "data_point", "entities": ["GLM-5.3-Flash", "Ollama", "reasoning effort"], "conviction": "high", "so_what": "Model-level template choices can make common user actions expensive; a hidden cost factor when comparing open models for agents.", "quote": null, "locator": "Reasoning effort", "quote_verified": false}, {"claim": "Oversized tool outputs are paid for on every subsequent turn, and truncating them without telling the model (e.g. returning lines 1-100 of a 640-line file silently) leads the model to confidently edit code it never saw; a one-line truncation notice fixes it.", "speaker": "Zain Hasan, Parth Sareen (Ollama)", "type": "causal", "entities": ["tool output truncation", "coding agents"], "conviction": "high", "so_what": "Agent reliability failures often stem from harness engineering rather than model capability.", "quote": "Cutting it without saying so gets you a model confidently editing code it never saw.", "locator": "Big tool results", "quote_verified": true}, {"claim": "Open models such as Kimi K3, GLM-5.3 and GLM-5.3-Flash are now good at splitting tasks across subagents, but having subagents inherit the full parent history is not strictly better than a brief, because cached prefix still costs attention compute and GPU memory.", "speaker": "Zain Hasan, Parth Sareen (Ollama)", "type": "contrarian", "entities": ["Kimi K3", "GLM-5.3", "GLM-5.3-Flash", "subagents"], "conviction": "medium", "so_what": "Open models are reaching multi-agent orchestration capability; efficient context scoping is a lever on inference cost.", "quote": "Inheriting sounds strictly better, but it isn't.", "locator": "Subagents", "quote_verified": true}]}, {"theme": "Engine-side cache economics", "insights": [{"claim": "Together AI frames an inference engine as a machine for keeping GPUs busy, citing a single GPU's rental cost at around $50k per year while serving hundreds of concurrent users.", "speaker": "Zain Hasan, Parth Sareen (Ollama)", "type": "data_point", "entities": ["Together AI", "GPU"], "conviction": "high", "so_what": "GPU utilization is the core margin lever for inference providers; idle or redundant compute directly hits economics.", "quote": "A single GPU costs around $50k to rent per year", "locator": "The engine side", "quote_verified": true}, {"claim": "Cache-aware routing must send each agent turn to the data center and node holding the session's cache, either via a client-supplied key like prompt_cache_key or by hashing prefixes to find the node with the longest match; misrouting forces recomputation and duplicate storage.", "speaker": "Zain Hasan, Parth Sareen (Ollama)", "type": "framework", "entities": ["Together AI", "prompt_cache_key", "cache-aware routing"], "conviction": "high", "so_what": "Inference providers with sophisticated cache-aware routing can offer materially cheaper agent workloads.", "quote": null, "locator": "Routing requests for optimal cache hits", "quote_verified": false}, {"claim": "Under load-aware routing, a cache miss on an idle node can be a better deal than queuing at an overloaded warm node, so even a perfectly stable prompt does not guarantee a cache hit.", "speaker": "Zain Hasan, Parth Sareen (Ollama)", "type": "contrarian", "entities": ["Together AI", "load-aware routing"], "conviction": "medium", "so_what": "Cache hit rates depend on provider backend quality, not just client discipline.", "quote": "sometimes the cache miss might be the better deal", "locator": "It also isn't as simple", "quote_verified": true}, {"claim": "Together AI offloads idle agent sessions' KV cache to CPU memory while tools like tests run, and restores it on the next turn, to free GPU memory for active users.", "speaker": "Zain Hasan, Parth Sareen (Ollama)", "type": "data_point", "entities": ["Together AI", "KV cache", "CPU offload"], "conviction": "high", "so_what": "Tiered memory (GPU/CPU) for KV cache is becoming core inference infrastructure, supporting demand for host memory and interconnect.", "quote": null, "locator": "Keeping the cache alive between turns", "quote_verified": false}, {"claim": "Cache memory headroom, not compute, usually limits how many concurrent requests a GPU can serve; engines use PagedAttention and continuous batching to allocate cache in small blocks and fill freed slots immediately.", "speaker": "Zain Hasan, Parth Sareen (Ollama)", "type": "causal", "entities": ["PagedAttention", "continuous batching", "GPU memory"], "conviction": "high", "so_what": "Memory capacity/bandwidth (HBM) is the binding constraint for agentic inference, favoring memory-rich accelerators.", "quote": "headroom for cache memory, not compute, is usually what limits how many requests a GPU can serve at once", "locator": "The upshot for anyone building a harness", "quote_verified": true}, {"claim": "Together AI runs prefill and decode on separate clusters — compute-tuned for prefill and memory-bandwidth-tuned for decode — shipping the cache between them over RDMA so long agent prompts don't slow token streaming for others.", "speaker": "Zain Hasan, Parth Sareen (Ollama)", "type": "data_point", "entities": ["Together AI", "disaggregated prefill/decode", "RDMA"], "conviction": "high", "so_what": "Disaggregated serving drives demand for high-bandwidth networking (RDMA) in inference clusters.", "quote": null, "locator": "Agents also push the prefill/decode split", "quote_verified": false}, {"claim": "Agent performance at long horizons requires both sides to cooperate: a stable harness prompt still loses the cache if the engine misroutes a turn, and perfect routing fails if the harness changes the first line every turn.", "speaker": "Zain Hasan, Parth Sareen (Ollama)", "type": "thesis", "entities": ["Together AI", "Ollama"], "conviction": "high", "so_what": "Vertical coordination between harness and inference provider is a moat; watch for bundled harness+inference offerings.", "quote": null, "locator": "None of that is visible to the person", "quote_verified": false}]}], "insight_total": 18, "top_entities": ["Together AI", "Ollama", "prefix caching", "KV cache", "GLM-5.3", "GLM-5.3-Flash", "Kimi K3", "DeepSeek-V4.1-Flash", "Claude Code", "Codex", "PagedAttention", "RDMA"], "source_meta": {"author": "Zain Hasan, Parth Sareen (Ollama)", "word_count": 2762, "paywalled": false}}, {"record_id": "1261b481d9a11e80", "source_type": "technology", "source_name": "Wired", "source_url": "https://www.wired.com/story/the-nvidia-scandal-is-about-chip-sales-to-china-trump-wants-to-keep-them-going/", "title": "The Nvidia Scandal Could Upend Chip Sales to China. Trump Wants to Keep Them Going", "published_date": "2026-11-17", "language": "en", "processed_at": "2026-11-18T11:08:49Z", "processor": "claude-code-sub-opus", "tags": ["Tech", "AI", "Geopolitics"], "gist": "Amid fallout from Jensen Huang's affair with a suspected Chinese intelligence asset tied to Megaspeed, Trump is backing Lutnick's cautious export-control stance, believing some chip sales keep China dependent and lift US tech stocks. Rather than blacklisting Megaspeed, which leased Inspur/Aivres-sourced Nvidia H200 compute to Chinese firms from Malaysian and Indonesian data centers, Commerce will issue an interim rule against remote compute access.", "themes": [{"theme": "Trump's chip-sales-to-China doctrine", "insights": [{"claim": "President Trump believes allowing sales of some advanced AI chips to China keeps China reliant on US technology while simultaneously boosting US tech stocks, according to sources cited by WIRED.", "speaker": "Hugo Lowell", "type": "thesis", "entities": ["Donald Trump", "China", "Nvidia", "US tech stocks"], "conviction": "high", "so_what": "Policy bias favors continued (non-frontier) Nvidia sales to China; tail risk of a sweeping ban is lower than headlines imply.", "quote": "allowing the sale of some advanced AI chips to China can keep China reliant on US technology and simultaneously boost US tech stocks", "locator": "But Trump’s defense of Lutnick", "quote_verified": true}, {"claim": "Trump defended Commerce Secretary Howard Lutnick's slow export-control action as a way to avoid a blowup with China ahead of a meeting with Xi Jinping, citing a very good current relationship with China.", "speaker": "Hugo Lowell", "type": "causal", "entities": ["Donald Trump", "Howard Lutnick", "Xi Jinping", "China"], "conviction": "high", "so_what": "Diplomatic détente with Beijing is actively suppressing new chip export controls; watch summit outcomes as the key policy driver.", "quote": "if you didn’t do something, you could have a blowup with China", "locator": "Lutnick “was doing that because", "quote_verified": true}, {"claim": "A senior White House official said Chinese firms cannot acquire Nvidia's most advanced Blackwell and Rubin chips, drawing a line distinct from previous-generation Hopper-based H200 chips.", "speaker": "Hugo Lowell", "type": "thesis", "entities": ["Nvidia", "Blackwell", "Rubin", "H200", "Hopper"], "conviction": "high", "so_what": "The policy red line is at the frontier generation; H200-class China revenue remains politically tolerated while Blackwell/Rubin China upside is off the table.", "quote": null, "locator": "A senior White House official added", "quote_verified": false}]}, {"theme": "Megaspeed / Inspur chip-diversion pipeline", "insights": [{"claim": "Megaspeed obtained Nvidia advanced AI chips through several layers of companies starting with a subsidiary of Inspur, a blacklisted Chinese server conglomerate, per New York Times reporting.", "speaker": "Hugo Lowell", "type": "data_point", "entities": ["Megaspeed", "Nvidia", "Inspur"], "conviction": "medium", "so_what": "Layered-entity diversion exposes Nvidia and its channel partners to enforcement and reputational risk.", "quote": null, "locator": "Megaspeed received advanced AI chips", "quote_verified": false}, {"claim": "Inspur's California-based subsidiary Aivres could legally buy restricted Nvidia chips without triggering direct export bans and ship them to Southeast Asia, transferring billions of dollars' worth, including H200s, to Megaspeed subsidiaries.", "speaker": "Hugo Lowell", "type": "data_point", "entities": ["Aivres", "Inspur", "Nvidia", "H200", "Megaspeed", "Southeast Asia"], "conviction": "high", "so_what": "Billions in Nvidia sales flowed through a US-domiciled affiliate of a blacklisted firm; tighter affiliate/ownership rules could claw back a meaningful channel.", "quote": "In total, Aivres transferred billions of dollars’ worth of restricted Nvidia chips", "locator": "Inspur, the Chinese server conglomerate", "quote_verified": true}, {"claim": "Rather than shipping chips into China, Megaspeed hosted servers in Malaysia and Indonesia data centers and rented compute power to major Chinese companies, exploiting a remote-access loophole in US export controls.", "speaker": "Hugo Lowell", "type": "causal", "entities": ["Megaspeed", "Malaysia", "Indonesia", "Chinese AI labs"], "conviction": "high", "so_what": "Southeast Asian data-center capacity is a key conduit for Chinese AI compute; regulation targeting remote access directly hits SEA data-center demand.", "quote": null, "locator": "Instead of shipping the physical chips", "quote_verified": false}, {"claim": "Aivres states it complies with all US export controls, indicating the chip flows may have been legal under the rules then in force.", "speaker": "Hugo Lowell", "type": "data_point", "entities": ["Aivres"], "conviction": "low", "so_what": "Legal-loophole framing means remedies will come via new rules rather than penalties on past sales.", "quote": null, "locator": "A spokesperson for Aivres said", "quote_verified": false}]}, {"theme": "Cabinet split over export controls", "insights": [{"claim": "At a November 5 Oval Office meeting, Treasury Secretary Scott Bessent confronted Lutnick over why Megaspeed was not added to the entity list faster, as Marco Rubio and Jamieson Greer had already agreed it should be.", "speaker": "Hugo Lowell", "type": "anecdote", "entities": ["Scott Bessent", "Howard Lutnick", "Marco Rubio", "Jamieson Greer", "Megaspeed", "Entity List"], "conviction": "medium", "so_what": "Hawks (Bessent, Rubio, Greer) vs. cautious Commerce signals ongoing policy volatility around China chip controls.", "quote": null, "locator": "In the meeting, the sources say", "quote_verified": false}, {"claim": "Lutnick argued blacklisting Megaspeed would be whack-a-mole because it already held the chips for months, and the real issue is Chinese firms' remote access to US chips.", "speaker": "Hugo Lowell", "type": "framework", "entities": ["Howard Lutnick", "Megaspeed"], "conviction": "medium", "so_what": "Entity-list additions alone are ineffective against compute leasing; expect rules targeting cloud/remote access instead.", "quote": "blacklisting the company would be akin to playing whack-a-mole", "locator": "Lutnick’s position appears to have been", "quote_verified": true}, {"claim": "Trump chose a third path: Lutnick will introduce a new interim trade rule to stop Chinese AI labs from remotely using advanced AI chips by leasing compute from Southeast Asian data centers.", "speaker": "Hugo Lowell", "type": "prediction", "entities": ["Donald Trump", "Howard Lutnick", "Chinese AI labs", "Southeast Asia"], "conviction": "high", "so_what": "An interim remote-access rule is coming; watch SEA data-center operators and cloud providers renting GPUs to Chinese clients for demand hits.", "quote": null, "locator": "But Trump settled on a third approach", "quote_verified": false}, {"claim": "The White House says the new rule will crack down on smuggling of advanced US AI chips and ensure the most advanced chips go first to US AI developers rather than Chinese shell companies.", "speaker": "Hugo Lowell", "type": "prediction", "entities": ["White House", "Nvidia"], "conviction": "medium", "so_what": "Framing implies prioritized domestic allocation of frontier chips, supportive of US hyperscaler supply.", "quote": "help ensure that America’s most advanced chips go first to US SI innovators, not Chinese shell companies", "locator": "In a statement to WIRED", "quote_verified": true}]}, {"theme": "Affiliates rule and rare-earth retaliation", "insights": [{"claim": "In September 2025, the Commerce Department's Bureau of Industry and Security began using the affiliates rule, automatically extending restrictions to any company 50 percent owned by an entity-list or military end-user-list firm." sk at the largest US bank may accelerate modernization/cloud migration spend; rules out a cyber narrative for security stocks.", "quote": "JPMorganChase has experienced a temporary issue related to a software bug in on-premise hardware systems—there is no evidence this is cyber-related", "locator": "JPMorganChase has experienced a temporary issue", "quote_verified": true}, {"claim": "JPMorganChase, the top US retail bank holding over 10 percent of all US deposits, is the likely source of the broad banking disruption, illustrating how a single dominant bank's failure can propagate to counterparties.", "speaker": "Andrew Couts", "type": "thesis", "entities": ["JPMorganChase"], "conviction": "medium", "so_what": "Concentration of deposits creates systemic operational single points of failure — a theme for regulators and for counterparty banks.", "quote": null, "locator": "It is currently unclear which systems", "quote_verified": false}, {"claim": "JPMorganChase denied a systemic issue but acknowledged other banks may have seen slower transactions to the extent they transacted with JPMorganChase, while its customers retained access to accounts and funds.", "speaker": "Andrew Couts", "type": "causal", "entities": ["JPMorganChase"], "conviction": "medium", "so_what": "Spillover through transaction counterparty links means a single bank's IT glitch shows up as industry-wide slowness.", "quote": "other banks may have been impacted by slowness in transactions only to the extent that they were a party to a transaction with us", "locator": "Rodriguez adds that the bank", "quote_verified": true}]}, {"theme": "Payment networks deny fault", "insights": [{"claim": "Zelle said its systems were not down and that it does not hold consumer funds, attributing user-facing Zelle problems to the participating banks that manage accounts.", "speaker": "Andrew Couts", "type": "contrarian", "entities": ["Zelle"], "conviction": "high", "so_what": "Zelle's dependency on member-bank uptime means s, but execution remains the critical test", "published_date": "2026-11-17", "language": "en", "processed_at": "2026-11-18T11:08:42Z", "processor": "claude-code-sub-opus", "tags": ["Energy"], "gist": "Wood Mackenzie finds Malaysia's revised CRESS grid access charges (effective MYR180/MWh, with tariff-reset risk shifted to offtakers) keep corporate renewable procurement (~US$95/MWh) cheaper than HV/UHV tariffs through 2038, but the hard 31 Dec 2028 COD deadline plus land and transmission scarcity make project readiness the decisive constraint.", "themes": [{"theme": "CRESS grid charge restructuring", "insights": [{"claim": "Malaysia's PETRA cut the CRESS developer System Access Charge from MYR200/MWh (US$49/MWh) to MYR140/MWh (US$34/MWh) in the September 2026 CRESS Acceleration Package.", "speaker": "Wood Mackenzie", "type": "data_point", "entities": ["PETRA", "CRESS", "Malaysia"], "conviction": "high", "so_what": "Headline cost cut improves bankability of Malaysian corporate renewable projects.", "quote": null, "locator": "On 18 September 2026, the Ministry", "quote_verified": false}, {"claim": "The Energy Commission clarified that green consumers under Malaysia's CRESS must pay an additional MYR40/MWh (US$10/MWh) charge, bringing the effective grid access charge to MYR180/MWh (US$44/MWh), so the real cut is only MYR20/MWh rather than MYR60/MWh.", "speaker": "Wood Mackenzie", "type": "data_point", "entities": ["Energy Commission", "CRESS", "Malaysia"], "conviction": "high", "so_what": "Headline SAC cut overstates the true saving; model the MYR180/MWh all-in figure.", "quote": "This brings the effective grid access charge to MYR180/MWh (US$44/MWh).", "locator": "On 18 September 2026, the Ministry", "quote_verified": true}, {"claim": "The revised Malaysian CRESS structure reallocates risk: developers get a fixed MYR140/MWh charge for ten years of cost certainty, while offtakers absorb exposure to future Regulatory Period tariff resets via the variable MYR40/MWh consumer charge.", "speaker": "Wood Mackenzie", "type": "framework", "entities": ["CRESS", "Malaysia"], "conviction": "high", "so_what": "Commercial CPPA negotiations will center on how tariff-reset risk is shared between developers and offtakers.", "quote": "The most significant design feature is the revised structure’s reallocation of risk", "locator": "The most significant design feature", "quote_verified": true}, {"claim": "If future Malaysian tariff guidelines keep the 15% cap on adjustments, the CRESS green consumer charge could rise by about MYR20–30/MWh (US$4.9–7.3/MWh) over a ten-year contract spanning multiple tariff review cycles after RP4 ends in December 2027.", "speaker": "Wood Mackenzie", "type": "prediction", "entities": ["CRESS", "Malaysia", "RP4"], "conviction": "medium", "so_what": "Offtakers should budget for MYR20–30/MWh of upward drift in grid charges.", "quote": null, "locator": "The fixed MYR140/MWh developer charge", "quote_verified": false}, {"claim": "Many Malaysian corporate PPAs run 15 to 21 years, beyond the 10-year fixed SAC window, and PETRA has not clarified SAC treatment after year ten, so developers and lenders will price in post-year-ten cost assumptions.", "speaker": "Wood Mackenzie", "type": "causal", "entities": ["PETRA", "CPPA", "Malaysia"], "conviction": "medium", "so_what": "Regulatory ambiguity after year ten is a residual risk that may raise required returns on long CPPAs.", "quote": null, "locator": "Beyond the near-term window", "quote_verified": false}]}, {"theme": "Cost competitiveness vs utility tariffs", "insights": [{"claim": "Wood Mackenzie estimates Malaysian CRESS renewable procurement costs at US$95/MWh in 2026, competitive with both High Voltage and Ultra High Voltage time-of-use utility tariffs, and remaining below them through 2038.", "speaker": "Wood Mackenzie", "type": "data_point", "entities": ["CRESS", "Wood Mackenzie", "Malaysia"], "conviction": "high", "so_what": "Large Malaysian industrial and data-center-ty
