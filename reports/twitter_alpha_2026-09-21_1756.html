<!DOCTYPE html>
<html lang="en">
<head>

<title>Twitter Alpha Intelligence</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root {
  --bg: #faf8f5;
  --surface: #ffffff;
  --border: #e8e3da;
  --border-light: #f0ede4;
  --text: #1a1a1a;
  --text-2: #555;
  --text-3: #8a8a8a;
  --accent: #1a8cd8;
  --red: #d94052;
  --yellow: #fff5b3;
  --yellow-border: #f0d966;

  /* category colors (per spec) */
  --cat-macro: #2563eb;        /* blue */
  --cat-crypto: #8b5cf6;       /* purple */
  --cat-energy: #dc2626;       /* red */
  --cat-tech: #0d9488;         /* teal */
  --cat-ai: #4f46e5;           /* indigo */
  --cat-geopolitics: #dc2626;  /* red */
  --cat-positioning: #15803d;  /* green */
  --cat-regulation: #7c3aed;   /* purple */
  --cat-society: #d97706;      /* amber */
  --cat-em: #059669;           /* green */
  --cat-default: #6b7280;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; line-height: 1.55;
       background: var(--bg); color: var(--text); }
.container { max-width: 960px; margin: 0 auto; padding: 24px 16px 80px; }

/* HEADER */
.header { display: flex; justify-content: space-between; align-items: baseline;
          border-bottom: 2px solid var(--text); padding-bottom: 12px; margin-bottom: 20px; }
.title { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
.subtitle { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-3); }

/* FILTER BAR */
.filter-bar { display: none; background: var(--yellow); border: 1px solid var(--yellow-border);
              border-radius: 6px; padding: 8px 12px; margin-bottom: 16px;
              align-items: center; gap: 10px; font-size: 13px; }
.filter-bar.active { display: flex; }
.filter-bar button { font-family: inherit; font-size: 12px; background: transparent;
                     border: 1px solid var(--text); padding: 3px 10px; border-radius: 4px;
                     cursor: pointer; }
.filter-bar button:hover { background: rgba(0,0,0,0.05); }

/* SUMMARY */
.summary { background: var(--surface); border: 1px solid var(--border);
           border-left: 4px solid var(--red); border-radius: 6px;
           padding: 16px 18px; margin-bottom: 20px; }
.summary p { margin-bottom: 8px; }
.summary p:last-child { margin-bottom: 0; }
.summary strong { font-weight: 600; }

/* SECTIONS */
.section { background: var(--surface); border: 1px solid var(--border);
           border-radius: 6px; margin-bottom: 14px; overflow: hidden; }
.section-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px;
                background: #f3efe6; cursor: pointer; user-select: none;
                font-weight: 600; font-size: 13px; }
.section-head:hover { background: #ebe6dc; }
.section-letter { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
                  color: var(--text-3); min-width: 18px; }
.section-name { flex: 1; }
.section-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
                 color: var(--text-3); }
.section-arrow { font-size: 10px; color: var(--text-3); transition: transform .2s; }
.section.open .section-arrow { transform: rotate(90deg); }
.section-body { display: none; padding: 6px 0; }
.section.open .section-body { display: block; }

/* CLUSTER (Section A) */
.cluster { padding: 14px 16px; border-bottom: 1px solid var(--border-light); }
.cluster:last-child { border-bottom: none; }
.cluster-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
                flex-wrap: wrap; }
.cluster-title { font-weight: 600; font-size: 14px; }
.cluster-desc { color: var(--text-2); font-size: 13px; margin: 0 0 10px 0; }
.cluster-items { display: flex; flex-direction: column; gap: 8px; padding-left: 10px;
                 border-left: 2px solid var(--border-light); }
.cluster-item { font-size: 13px; padding: 6px 8px; border-radius: 4px; }
.cluster-item .item-text { font-size: 13px; margin-top: 4px; }
.cluster-item .item-head { font-size: 12px; }

/* ITEM CARDS (Sections B/C/D) */
.item-card { background: var(--surface); border: 1px solid var(--border);
             border-radius: 6px; padding: 12px 14px; margin: 10px 16px; }
.item-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
             flex-wrap: wrap; }
.item-author { font-weight: 600; color: var(--accent); cursor: pointer; }
.item-author:hover { text-decoration: underline; }
.item-time { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--text-3); }
.item-link { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--accent); text-decoration: none; }
.item-link:hover { text-decoration: underline; }
.item-text { font-size: 13.5px; line-height: 1.6; color: var(--text);
             white-space: pre-wrap; word-wrap: break-word; }
.item-thread { display: inline-block; font-size: 10px; font-weight: 600;
               background: var(--border); color: var(--text-2); padding: 1px 6px;
               border-radius: 3px; text-transform: uppercase; letter-spacing: .04em; }

/* CONTRARIAN (Section C) — red left border + soft red bg */
.section-contrarian .item-card {
  border-left: 4px solid var(--red);
  background: #fdf6f7;
}

/* CATEGORY PILLS */
.pill { display: inline-block; font-family: 'IBM Plex Mono', monospace; font-size: 10px;
        font-weight: 500; padding: 2px 7px; border-radius: 3px; color: #fff;
        text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }

/* IMAGES */
.thumbs { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.thumb { height: 100px; border: 1px solid var(--border); border-radius: 4px;
         cursor: zoom-in; background: #f0ede4; }

/* LIGHTBOX */
.lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85);
            align-items: center; justify-content: center; z-index: 100; cursor: zoom-out; }
.lightbox.open { display: flex; }
.lightbox img { max-width: 92vw; max-height: 92vh;
                box-shadow: 0 8px 40px rgba(0,0,0,.6); }

/* LINKS (Section E) */
.link-row { padding: 8px 16px; border-bottom: 1px solid var(--border-light);
            font-size: 13px; display: flex; gap: 12px; align-items: baseline; }
.link-row:last-child { border-bottom: none; }
.link-author { color: var(--text-3); min-width: 110px; cursor: pointer; }
.link-author:hover { color: var(--accent); }
.link-url { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
            color: var(--accent); text-decoration: none; word-break: break-all; flex: 1; }
.link-url:hover { text-decoration: underline; }
.link-desc { color: var(--text-2); font-size: 12px; }

/* AUTHOR FILTER STATES */
.filterable.match { background: var(--yellow); border-color: var(--yellow-border); }
.section-contrarian .item-card.filterable.match { background: var(--yellow); }
.filterable.dim { opacity: 0.25; }

/* STATS BAR */
.stats { margin-top: 24px; padding: 10px 14px; background: var(--surface);
         border: 1px solid var(--border); border-radius: 6px;
         font-family: 'IBM Plex Mono', monospace; font-size: 11.5px;
         color: var(--text-2); display: flex; gap: 18px; flex-wrap: wrap; }
.stats strong { color: var(--text); font-weight: 600; }

/* EMPTY */
.empty { color: var(--text-3); font-size: 13px; padding: 14px 18px; font-style: italic; }

/* RESPONSIVE */
@media (max-width: 640px) {
  .container { padding: 16px 12px 60px; }
  .item-card { margin: 8px 10px; }
  .link-row { flex-direction: column; gap: 4px; }
  .link-author { min-width: 0; }
  .header { flex-direction: column; align-items: flex-start; gap: 4px; }
}
</style>
</head>

<script>
const REPORT_DATA = {"report_type": "TWITTER ALPHA INTELLIGENCE", "collected_at": "2026-09-21T17:21:01Z", "input_stats": {"total_tweets": 241, "unique_authors": 76, "tweets_with_images": 63, "after_noise_filter": 54}, "summary": "**Crypto melt-up:** BTC broke $80K with its first weekly close above the 50-week MA in 45 weeks (**rektmando**), and **DTAPCAP** calls a textbook cup-and-handle targeting $120K on a clean break of $100K. But positioning looks stretched — **_tolks** flags open interest ripping from $60B to $70B in four days and closed his own perp longs, **zeroxkyle** and **cointradernik** both warn of a near-term flush/bull-trap even while staying structurally bullish.\n\n**Energy/geopolitics:** Brent slipped below $100 (**JavierBlas**) even as US diesel prices keep climbing — supertanker rates are up 12x to a record >$1.1M/day, and refined products are becoming a diplomatic weapon (**elerianm**, **JavierBlas**).\n\n**Macro:** **dampedspring** argues Bessent is actively suppressing long rates via buybacks, with 5y swap spreads confirming the trade is paying off (**Fullcarry**); **spotgamma** flags SPX/NDX vol finally re-syncing as it called back in July.\n\n**AI/tech:** Amazon cutting off Meta's Muse agent has kicked off what **buccocapital** calls a 'digital knife fight' over agentic commerce, with **cryptopunk7213** and **mrjasonchoi** bullish on Muse's UX edge. **RaoulGMI** frames AI's productivity gains through a striking revenue-per-employee lens — Nvidia now near $10M/head.\n\n**Notable:** **dampedspring** says he told clients about AI-company nationalization risk a week before Alex Karp started musing the same; **thedefiedge**'s weekly damage report shows a Trezor email-vendor breach sent phishing mail from Trezor's own domain to 347K addresses.", "sections": {"A_events": [{"cluster": "Middle East Tensions Drive Oil Tanker Crisis, Brent Below $100", "category": ["energy", "geopolitics"], "items": [{"author": "JavierBlas", "summary": "Brent crude fell below $100/barrel.", "tweet_url": "https://x.com/JavierBlas/status/2102043838047043649", "type": "tweet"}, {"author": "JavierBlas", "summary": "Supertanker rates from the Persian Gulf to the Far East have risen 12-fold in a few months to a record >$1.1M/day, per his Bloomberg Opinion column — a fresh inflation risk via freight costs even as crude itself softens.", "tweet_url": "https://x.com/JavierBlas/status/2102053609928069536", "images": ["https://pbs.twimg.com/media/HSv-BaqW8AAFSWg.png"], "type": "tweet"}, {"author": "JavierBlas", "summary": "Trump is pinning the diesel-price spike on Ukraine's strikes on Russian refineries; Blas says Kyiv's strikes are a real factor but not the whole story.", "tweet_url": "https://x.com/JavierBlas/status/2102009137366220832", "images": ["https://pbs.twimg.com/media/HSvWJ4HWcAAaKxQ.png"], "type": "tweet"}, {"author": "elerianm", "summary": "El-Erian flags a growing divergence: crude keeps falling but US refined products are rising — AAA data shows diesel above $6.50/gal and regular near $4.50 — with export-ban pressure building and refined products increasingly a diplomatic bargaining chip.", "tweet_url": "https://x.com/elerianm/status/2102002658093465864", "images": ["https://pbs.twimg.com/media/HSvQRpjX0AAmQAb.jpg", "https://pbs.twimg.com/media/HSvQRpbXkAAroTE.jpg"], "type": "tweet"}, {"author": "BobEUnlimited", "summary": "Sees elevated oil prices as an opportunity for US producers to hedge further out the curve, implying more supply-side risk premium priced into deferred months.", "tweet_url": "https://x.com/BobEUnlimited/status/2102054114251190599", "type": "tweet"}]}, {"cluster": "Crypto Melt-Up: BTC Breaks $80K, Sentiment Turns Euphoric", "category": ["crypto", "positioning"], "items": [{"author": "DTAPCAP", "summary": "Calls a textbook cup-and-handle breakout on BTC — a year of selling absorbed in five weeks; a solid break of $100K reopens $120K, possibly this year.", "tweet_url": "https://x.com/DTAPCAP/status/2102028826087686355", "images": ["https://pbs.twimg.com/media/HSvoE2bWIAA-iR8.jpg"], "type": "thread"}, {"author": "marcvanderchijs", "summary": "Declares the new bull market underway (pending a close above $83K) and says now is the time to add leverage if inclined; cites ongoing money printing as a persistent crypto tailwind.", "tweet_url": "https://x.com/marcvanderchijs/status/2101992096718897303", "type": "thread"}, {"author": "Geiger_Capital", "summary": "Futures green, crypto mooning, AfD surging — a one-line snapshot of a broadly risk-on Monday.", "tweet_url": "https://x.com/Geiger_Capital/status/2102022048457384398", "type": "tweet"}, {"author": "_tolks", "summary": "Closed his own perp longs from last week — open interest has climbed in a straight line from $60B to $70B in four days with funding pushing higher across majors, which he calls euphoric/toppy-feeling even as he stays heavy in spot.", "tweet_url": "https://x.com/_tolks/status/2102064759784841415", "images": ["https://pbs.twimg.com/media/HSwIgVdWoAAPDlM.jpg", "https://pbs.twimg.com/media/HSwIeroWwAAl7Qw.png"], "type": "thread"}, {"author": "zeroxkyle", "summary": "Frames the cycle's asymmetry: last cycle punished excess belief, this one will punish insufficient belief — paired elsewhere with a same-day warning that a 'flush' is likely given how euphoric conditions have become.", "tweet_url": "https://x.com/zeroxkyle/status/2102003575257993418", "type": "tweet"}, {"author": "cointradernik", "summary": "Agrees it's a week to convert perp unrealized P&L into spot bags, while separately flagging a chart making the rounds calling the rally a bull trap.", "tweet_url": "https://x.com/cointradernik/status/2102072750143648134", "type": "tweet"}, {"author": "thedefivillain", "summary": "Notes crypto sentiment has been whipsawing — 'bad' just 11 days ago while BTC was flat — and argues that's normal fear to fade in a risk-on uptrend, not a reason to de-risk.", "tweet_url": "https://x.com/thedefivillain/status/2102036148281303103", "images": ["https://pbs.twimg.com/media/HSvuHZkWgAI2UBh.jpg"], "type": "thread"}]}, {"cluster": "Meta's Muse vs. Amazon: Agentic Commerce Turf War", "category": ["tech", "ai"], "items": [{"author": "buccocapital", "summary": "Flags Amazon cutting off Meta's Muse agent as the opening move in a bigger 'digital knife fight' over agentic commerce — nobody wants to be commoditized or layered by a rival's agent.", "tweet_url": "https://x.com/buccocapital/status/2102012446600794222", "images": ["https://pbs.twimg.com/media/HSvYcRjWEAAoJUv.jpg"], "type": "tweet"}, {"author": "cryptopunk7213", "summary": "Argues banning AI agents from Amazon is self-defeating: Amazon's future depends on agents buying its cloud, SaaS and retail products, and a single-prompt agentic checkout is a strictly better experience than manual browsing.", "tweet_url": "https://x.com/cryptopunk7213/status/2102036775749476382", "images": ["https://pbs.twimg.com/media/HSvvSqTaMAA4By5.jpg", "https://pbs.twimg.com/media/HSvvSqLaoAA2sQU.jpg"], "type": "tweet"}, {"author": "cryptopunk7213", "summary": "Separately argues Muse isn't a frontier model but wins on personalization — a 'much better open claw' trained on user habits and social data — building an on-the-fly Tinder-style shopping app inside the daily-brief flow.", "tweet_url": "https://x.com/cryptopunk7213/status/2102019862327603627", "images": ["https://pbs.twimg.com/media/HSvf6CubgAAVeTt.jpg", "https://pbs.twimg.com/media/HSvf6CtbsAAIb_T.jpg"], "type": "thread"}, {"author": "mrjasonchoi", "summary": "Quote-tweeting a take praising Meta's low-drama positioning of Muse, adds that it feels like a Clubhouse moment for Instinct-style agents until distribution (X Spaces, in that analogy) decides the real winner.", "tweet_url": "https://x.com/mrjasonchoi/status/2102043883484135710", "type": "thread"}, {"author": "citrini", "summary": "Recalls being told on Odd Lots in 2024 that 'nobody cares about privacy' — now vindicated as users hand agents like Instinct and Muse their email, messages, cards, location and logins.", "tweet_url": "https://x.com/citrini/status/2102054878914785479", "type": "tweet"}]}, {"cluster": "DeFi Security Roundup: Balancer Wind-Down, Trezor Phishing, $7.7M Safe Hack", "category": ["crypto", "regulation"], "items": [{"author": "thedefiedge", "summary": "Weekly incident roundup: Balancer proposed an orderly wind-down (pools pausable-only from Oct 30, $9M distributed to BAL burners); Trezor's email vendor Brevo was breached, sending phishing mail from Trezor's own domain to ~347K addresses (2.5K clicked); Wyoming pulled its FRNT stablecoin off LayerZero for CCIP citing repeated key-security failures (LayerZero disputes it); a Safe lost ~$7.73M in rsETH via a malicious Uniswap V4 hook exploited by an MEV bot; Nomic's transaction-forwarding bug let an attacker double-mint 40.65 nBTC undetected for 74 days; ChainFlip lost ~736K USDT on Tron to a memo-substitution attack; Ether fi lost 15.45 ETH to a disclosed-in-advance access-control gap; and Yam Finance was drained ~$121K via a governance-capture vote. He calls the Trezor breach the worst of the bunch since it undermines the core 'trust the sender domain' advice.", "tweet_url": "https://x.com/thedefiedge/status/2102034316645515348", "type": "tweet"}, {"author": "DefiIgnas", "summary": "Argues DeFi should have retired blind signing long ago — a compromised frontend can look normal while a user unknowingly signs a malicious transaction — and welcomes Trezor's push on Clear Signing, though adoption across dapps and wallets remains slow.", "tweet_url": "https://x.com/DefiIgnas/status/2102062011202883602", "images": ["https://pbs.twimg.com/media/HSv91coWUAA9GMU.jpg"], "type": "thread"}]}, {"cluster": "Onchain Options & Tokenized Equity Infrastructure Matures", "category": ["crypto", "tech"], "items": [{"author": "Delphi_Digital", "summary": "Onchain options are still just 4.3% of Deribit's 30-day notional despite a recent premium-volume high; Derive (95% of onchain options premium) is launching V3 on a new zkVM settlement layer with cross-margining and native vaults (e.g. covered-call vaults) to broaden distribution beyond its existing user base.", "tweet_url": "https://x.com/Delphi_Digital/status/2102080418107510940", "images": ["https://pbs.twimg.com/media/HSwCkrvWQAArQel.jpg"], "type": "tweet"}, {"author": "Delphi_Digital", "summary": "On Backpack's brokerage model for tokenized equities: letting users mint/redeem tokens against real brokerage positions lets onchain liquidity scale with demand instead of being capped by circulating token supply — Backpack reportedly delivers the lowest-cost round-trip execution among issuers.", "tweet_url": "https://x.com/Delphi_Digital/status/2102035379469815821", "images": ["https://pbs.twimg.com/media/HSvuCQ-acAA5rWX.jpg"], "type": "thread"}, {"author": "AndreCronjeTech", "summary": "Endorses a round of community claims about FlyingTulip (new TVL highs, ftPUT-based protocol-funding structures, a fixed-supply/no-upfront-team-allocation token design) largely by amplifying rather than detailing them himself; says his 2020/2021 thesis that onchain options were too expensive is '5/6 years later... almost' proven out, and separately plugs migrating Sonic USDC lending to FlyingTulip's higher advertised yield.", "tweet_url": "https://x.com/AndreCronjeTech/status/2102008692153504190", "type": "tweet"}, {"author": "brian_armstrong", "summary": "Amplifies data showing Coinbase's tokenized equities on Base (NVDAc, AAPLc, GOOGLc leading) now have 46.7K holders, up 97x in 30 days — early days, he says, but good traction.", "tweet_url": "https://x.com/brian_armstrong/status/2102056591381995685", "type": "tweet"}]}, {"cluster": "Fed, Rates & Term Premium: Bessent's Active Hand", "category": ["macro"], "items": [{"author": "dampedspring", "summary": "Andy Constan points to Bessent's own comment that 30-year yields haven't risen much since the buyback expansion as evidence the Treasury is actively working to suppress long rates.", "tweet_url": "https://x.com/dampedspring/status/2102010976702713955", "type": "thread"}, {"author": "dampedspring", "summary": "In a client note, explains why the ACM term-premium model (driven by level/curve PCA) diverges sharply from the Kim model right now: analysts expect a modest-to-reversing hiking cycle while markets price a medium, persistent one — with IV, credit spreads and equities also diverging from Kim, which he sees as the biggest outlier among term-premium indicators today.", "tweet_url": "https://x.com/dampedspring/status/2102062909996118267", "type": "tweet"}, {"author": "Fullcarry", "summary": "5-year swap spreads have widened to their broadest level since earlier this year — attributes the move to dealers/leveraged accounts pressured by supply plus real-money demand for front-end UST rates; separately notes overnight SOFR has softened a touch since the recent rate hike, likely from leveraged front-end shorts.", "tweet_url": "https://x.com/Fullcarry/status/2102016392627196193", "images": ["https://pbs.twimg.com/media/HSvcvzeWcAE_Js0.png"], "type": "thread"}, {"author": "spotgamma", "summary": "Revisits its July call for an SPX/NDX vol-spread re-sync (Nasdaq then fell 8% vs S&P's 3%, spread back near its long-run mean): over 24% of the S&P's weight now trades against oil and rates, while Nasdaq tech vol looks cheap versus July's extremes, positioning it for outperformance.", "tweet_url": "https://x.com/spotgamma/status/2102027334521864438", "type": "tweet"}]}, {"cluster": "AI Infrastructure Economics: Revenue-Per-Employee & Chip Supply Chain", "category": ["ai", "tech"], "items": [{"author": "RaoulGMI", "summary": "Raoul Pal frames revenue-per-employee as Metcalfe's Law applied to companies: Meta's gone from $1.4M to $2.9M per head in three years, Amazon from $292K to $498K, Nvidia from ~$1M to ~$10M — arguing the same 'value per node' math should be applied to blockchains, cities and countries, not just firms.", "tweet_url": "https://x.com/RaoulGMI/status/2102077220982305141", "type": "tweet"}, {"author": "EMostaque", "summary": "Says Nvidia's Vera Rubin is a big step up in inference efficiency over Blackwell (which has now propagated), that the margins these chips give partners imply 'some price fixing,' and that nobody outside DeepSeek can fully explain the caching tricks behind its inference costs.", "tweet_url": "https://x.com/EMostaque/status/2102079328372580661", "type": "thread"}, {"author": "aleabitoreddit", "summary": "Runs through a chip-supply-chain rotation across CPUs ($AMD $INTC $ARM), lasers ($SIVE $AAOI, AMS OSRAM), memory ($EWY $DRAM $MU) and compute ($NBIS $CRWV $IREN), driven by CPU:GPU ratio shifts and ECOC 2026 optical announcements; calls Soitec a de facto monopoly on SOI wafers, flags Nebius's financing as more sustainable than CoreWeave/other neoclouds after recent 17-21% price hikes, and sees Nebius sum-of-parts value (ClickHouse, Avride) underappreciated.", "tweet_url": "https://x.com/aleabitoreddit/status/2102062423499047004", "images": ["https://pbs.twimg.com/media/HSwGczTa0AAuEZu.jpg", "https://pbs.twimg.com/media/HSwGeD6akAEAN3C.jpg"], "type": "thread"}, {"author": "nicbstme", "summary": "Argues Jev is a classic Innovator's Dilemma disruptor of the ML market's bottom tier — commoditizing classifiers, routers and scoring where frontier labs won't compete because revenue-per-decision is too thin for their infrastructure.", "tweet_url": "https://x.com/nicbstme/status/2101904295730016377", "type": "tweet"}]}], "B_insights": [{"author": "dampedspring", "summary": "Says he told clients a week ago to expect nationalization talk around AI companies — now Alex Karp is musing about the same thing, which he takes as validation.", "tweet_url": "https://x.com/dampedspring/status/2102078201145036883", "images": ["https://pbs.twimg.com/media/HSwU-63XAAAhbwD.jpg", "https://pbs.twimg.com/media/HSwU-6wXQAEJeCA.jpg"], "type": "tweet"}, {"author" // ---------- helpers ----------
const CAT_VARS = {
  macro: 'var(--cat-macro)',
  crypto: 'var(--cat-crypto)',
  energy: 'var(--cat-energy)',
  tech: 'var(--cat-tech)',
  ai: 'var(--cat-ai)',
  'ai/infra': 'var(--cat-ai)',
  geopolitics: 'var(--cat-geopolitics)',
  positioning: 'var(--cat-positioning)',
  regulation: 'var(--cat-regulation)',
  society: 'var(--cat-society)',
  em: 'var(--cat-em)',
};
function catColor(cat) {
  if (!cat) return 'var(--cat-default)';
  return CAT_VARS[String(cat).toLowerCase()] || 'var(--cat-default)';
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function escapeAttr(s) {
  return escapeHtml(s).replace(/`/g, '&#96;');
}

function renderBold(text) {
  return escapeHtml(text).replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
}

function relativeTime(iso) {
  if (!iso) return '';
  const dt = new Date(iso);
  if (isNaN(dt.getTime())) return '';
  const secs = Math.max(0, (Date.now() - dt.getTime()) / 1000);
  if (secs < 60)   return Math.floor(secs) + 's ago';
  const mins = secs / 60;
  if (mins < 60)   return Math.floor(mins) + 'm ago';
  const hrs  = mins / 60;
  if (hrs < 48)    return Math.floor(hrs) + 'h ago';
  return Math.floor(hrs / 24) + 'd ago';
}

function pill(cat) {
  if (!cat) return '';
  return `<span class="pill" style="background:${catColor(cat)}">${escapeHtml(cat)}</span>`;
}

function authorTag(name, cls = 'item-author') {
  if (!name) return '';
  return `<span class="${cls}" onclick="filterAuthor('${escapeAttr(name)}')">@${escapeHtml(name)}</span>`;
}

// ---------- rendering ----------
function renderThumbs(images) {
  if (!images || !images.length) return '';
  return `<div class="thumbs">` + images.map(u =>
    `<img src="${escapeAttr(u)}" class="thumb" loading="lazy" alt="" onclick="openLightbox('${escapeAttr(u)}')">`
  ).join('') + `</div>`;
}

function renderItem(item) {
  const author = item.author || item.author_username || '';
  const time = relativeTime(item.created_at);
  const thread = item.is_thread ? '<span class="item-thread">thread</span>' : '';
  const link = item.tweet_url
    ? `<a class="item-link" href="${escapeAttr(item.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  return `
    <div class="item-card filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${pill(item.category)}
        ${authorTag(author)}
        ${thread}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      <div class="item-text">${escapeHtml(item.text || '')}</div>
      ${renderThumbs(item.images)}
    </div>`;
}

function renderClusterItem(it) {
  const author = it.author || it.author_username || '';
  const time = relativeTime(it.created_at);
  const link = it.tweet_url
    ? `<a class="item-link" href="${escapeAttr(it.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  return `
    <div class="cluster-item filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${authorTag(author)}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      <div class="item-text">${escapeHtml(it.text || '')}</div>
      ${renderThumbs(it.images)}
    </div>`;
}

function renderCluster(cluster) {
  const itemsHtml = (cluster.items || []).map(renderClusterItem).join('');
  return `
    <div class="cluster">
      <div class="cluster-head">
        ${pill(cluster.category)}
        <div class="cluster-title">${escapeHtml(cluster.title || '')}</div>
      </div>
      ${cluster.description ? `<div class="cluster-desc">${escapeHtml(cluster.description)}</div>` : ''}
      ${itemsHtml ? `<div class="cluster-items">${itemsHtml}</div>` : ''}
    </div>`;
}

function renderLink(l) {
  const author = l.author || l.author_username || '';
  const url = l.url || (l.resolved || l.tco) || '';
  return `
    <div class="link-row filterable" data-author="${escapeAttr(author).toLowerCase()}">
      ${author
        ? authorTag(author, 'link-author')
        : '<span class="link-author">—</span>'}
      <a class="link-url" href="${escapeAttr(url)}" target="_blank" rel="noopener">${escapeHtml(url)}</a>
      ${l.description ? `<span class="link-desc">${escapeHtml(l.description)}</span>` : ''}
    </div>`;
}

function renderSection(letter, name, items, type) {
  if (!items || !items.length) return '';
  let body;
  if (type === 'events') {
    body = items.map(renderCluster).join('');
  } else if (type === 'links') {
    body = items.map(renderLink).join('');
  } else {
    body = items.map(renderItem).join('');
  }
  const cls = type === 'contrarian' ? 'section section-contrarian' : 'section';
  return `
    <div class="${cls}">
      <div class="section-head" onclick="toggleSection(this)">
        <span class="section-letter">${letter}.</span>
        <span class="section-name">${escapeHtml(name)}</span>
        <span class="section-count">${items.length}</span>
        <span class="section-arrow">▸</span>
      </div>
      <div class="section-body">${body}</div>
    </div>`;
}

function renderSummary(text) {
  if (!text) return '';
  const paragraphs = String(text).split(/\n\n+/).filter(Boolean)
    .map(p => `<p>${renderBold(p)}</p>`).join('');
  return `<div class="summary">${paragraphs}</div>`;
}

function renderStats(d) {
  const s = (d && d.stats) || d || {};
  const parts = [];
  if (s.received    != null) parts.push(`received <strong>${s.received}</strong>`);
  if (s.after_filter!= null) parts.push(`after filter <strong>${s.after_filter}</strong>`);
  if (s.authors     != null) parts.push(`authors <strong>${s.authors}</strong>`);
  if (s.coverage    != null) {
    const pct = (s.coverage <= 1 ? s.coverage * 100 : s.coverage);
    parts.push(`coverage <strong>${pct.toFixed(0)}%</strong>`);
  }
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSection(headEl) {
  headEl.parentElement.classList.toggle('open');
}

function openLightbox(src) {
  const img = document.getElementById('lightbox-img');
  img.src = src;
  document.getElementById('lightbox').classList.add('open');
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-img').src = '';
}

let activeFilter = null;
function filterAuthor(name) {
  if (!name) return;
  activeFilter = String(name).toLowerCase();
  document.querySelectorAll('.filterable').forEach(el => {
    const a = (el.dataset.author || '').toLowerCase();
    if (a === activeFilter) {
      el.classList.add('match');
      el.classList.remove('dim');
    } else {
      el.classList.add('dim');
      el.classList.remove('match');
    }
  });
  document.getElementById('filter-name').textContent = '@' + name;
  document.getElementById('filter-bar').classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function clearFilter() {
  activeFilter = null;
  document.querySelectorAll('.filterable').forEach(el => {
    el.classList.remove('match');
    el.classList.remove('dim');
  });
  document.getElementById('filter-bar').classList.remove('active');
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (document.getElementById('lightbox').classList.contains('open')) {
      closeLightbox();
    } else if (activeFilter) {
      clearFilter();
    }
  }
});

// ---------- schema normalization ----------
// Some producer runs emit the "sections" schema documented in the routine
// spec (report_type/input_stats/sections.A_events.../coverage) instead of
// the flat schema this renderer reads (date/events/insights/contrarian/
// positioning/links/stats). Normalize so either shape renders correctly.
function firstOf(v) {
  return Array.isArray(v) ? v[0] : v;
}

function normalizeItem(it) {
  if (!it || typeof it !== 'object') return it;
  return {
    author: it.author || it.author_username,
    text: it.text != null ? it.text : it.summary,
    category: firstOf(it.category),
    tweet_url: firstOf(it.tweet_url),
    images: it.images,
    created_at: it.created_at,
    is_thread: it.is_thread != null ? it.is_thread : (it.type === 'thread'),
  };
}

function normalizeData(d) {
  if (!d || typeof d !== 'object') return {};
  const hasFlat = d.events || d.insights || d.contrarian || d.positioning || d.links || d.stats;
  if (hasFlat) return d;

  const s = d.sections;
  if (!s) return d;

  const out = Object.assign({}, d);
  out.date = d.date || (d.collected_at ? String(d.collected_at).replace('T', ' ').replace('Z', ' UTC') : '');
  if (s.A_events) {
    out.events = s.A_events.map(cl => ({
      title: cl.cluster || cl.title,
      category: firstOf(cl.category),
      description: cl.description,
      items: (cl.items || []).map(normalizeItem),
    }));
  }
  if (s.B_insights) out.insights = s.B_insights.map(normalizeItem);
  if (s.C_contrarian) out.contrarian = s.C_contrarian.map(normalizeItem);
  if (s.D_positioning) out.positioning = s.D_positioning.map(normalizeItem);
  if (s.E_links) {
    out.links = s.E_links.map(l => ({
      author: l.author,
      url: l.url,
      tweet_url: firstOf(l.tweet_url),
      description: l.note || l.description,
    }));
  }
  const stats = d.stats || {};
  out.stats = {
    received: stats.received != null ? stats.received : (d.input_stats && d.input_stats.total_tweets),
    after_filter: stats.after_filter != null ? stats.after_filter : (d.input_stats && d.input_stats.after_noise_filter),
    authors: stats.authors != null ? stats.authors : (d.coverage && d.coverage.authors_total),
    coverage: stats.coverage != null ? stats.coverage : (d.coverage && d.coverage.coverage_pct),
  };
  return out;
}

// ---------- main ----------
function renderReport(d) {
  d = normalizeData(d);
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  const sections = [
    renderSummary(d.summary),
    renderSection('A', 'Events & Reactions',      d.events,                                'events'),
    renderSection('B', 'Alpha & Insights',        d.insights || d.alpha,                   'items'),
    renderSection('C', 'Contrarian Views',        d.contrarian,                            'contrarian'),
    renderSection('D', 'Positioning & Trade Ideas', d.positioning,                         'items'),
    renderSection('E', 'Link Queue',              d.links,                                 'links'),
  ].join('');
  const app = document.getElementById('app');
  app.innerHTML = sections || '<div class="empty">No report data.</div>';

  // Auto-open first two sections.
  document.querySelectorAll('.section').forEach((s, i) => {
    if (i < 2) s.classList.add('open');
  });

  document.getElementById('stats').innerHTML = renderStats(d);
}

renderReport(REPORT_DATA);
</script>
