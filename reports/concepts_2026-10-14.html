r cities are expected to add.", "speaker": "Sally Li", "type": "prediction", "entities": ["Africa", "Europe", "labour force"], "conviction": "high", "so_what": "Africa's urban workforce expansion contrasts with ageing advanced economies and underpins long-run consumer and labour-cost arbitrage themes.", "quote": null, "locator": "A key driver of this is Africa’s demographic momentum", "quote_verified": false}, {"claim": "By 2050 Cairo and Kinshasa will become the world's fourth- and fifth-most-populous cities, Lagos and Luanda will enter the global top 20, and seven more African cities will become megacities (over 10mn people).", "speaker": "Sally Li", "type": "prediction", "entities": ["Cairo", "Kinshasa", "Lagos", "Luanda", "megacities"], "conviction": "medium", "so_what": "A new generation of African megacities implies huge infrastructure, housing and consumer-market build-outs.", "quote": null, "locator": "This labour market and population expansion", "quote_verified": false}, {"claim": "Africa's 12 megacities are expected to account for more than 20% of global urban population growth over the next 25 years.", "speaker": "Sally Li", "type": "prediction", "entities": ["Africa", "megacities"], "conviction": "medium", "so_what": "A fifth of global urban growth concentrated in a dozen African cities makes them central to any global urbanisation allocation.", "quote": null, "locator": "This labour market and population expansion", "quote_verified": false}]}, {"theme": "Demographic risk and growth concentration", "insights": [{"claim": "Africa's rapid population growth could undermine rather than lift its cities' performance, because weak governance, climate pressures and fiscal constraints risk producing urbanisation with weak infrastructure, low-value jobs and poor service access; Africa has historically failed to convert demographic strength into economic performance.", "speaker": "Sally Li", "type": "contrarian", "entities": ["Africa", "governance", "climate", "fiscal constraints"], "conviction": "medium", "so_what": "The demographic dividend is not automatic; investors should screen for governance and fiscal capacity rather than population growth alone.", "quote": "the massive increase in population could actually undermine the performance of African cities", "locator": "But this rapid growth in the continent’s population", "quote_verified": true}, {"claim": "Oxford Economics projects that Cairo, Accra, Nairobi, Dakar and Luanda together will generate one-third of all GDP growth among African cities in the Global Cities Index over the next 25 years, signalling increasing concentration of growth.", "speaker": "Sally Li", "type": "prediction", "entities": ["Cairo", "Accra", "Nairobi", "Dakar", "Luanda"], "conviction": "high", "so_what": "Concentrate African urban exposure in these five cities; growth outside them is likely to be thinner.", "quote": null, "locator": "GDP growth is becoming concentrated in a subset of cities", "quote_verified": false}, {"claim": "Converting Africa's youthful population boom into sustainable development will be hard given weak investment, deep poverty and high crime rates across the continent.", "speaker": "Sally Li", "type": "thesis", "entities": ["Africa"], "conviction": "medium", "so_what": "Expect wide dispersion in outcomes across African cities; weak investment and crime are key risks to monitor.", "quote": "that won’t be easy in a continent grappling with weak investment, deep poverty, and high crime rates", "locator": "Overall, Africa is a rapidly changing continent", "quote_verified": true}]}], "insight_total": 17, "top_entities": ["Cairo", "Accra", "Nairobi", "Dakar", "Luanda", "Lagos", "Johannesburg", "Kinshasa", "Global Cities Index", "Port Louis", "New Capital"], "source_meta": {"author": "Sally Li", "word_count": 1357, "paywalled": false}}, {"record_id": "a7ef3386f08913e5", "source_type": "concepts", "source_name": "Oxford Economics", "source_url": "https://www.oxfordeconomics.com/resource/mapping-the-ai-trade-boom/", "title": "Mapping the AI trade boom", "published_date": "2026-10-13", "language": "en", "processed_at": "2026-10-14T11:14:15Z", "processor": "claude-code-sub-opus", "tags": ["AI", "Macro", "Tech"], "gist": "Oxford Economics' 104-product AI export index shows an Asia-centred, intermediate-goods-heavy (~60%) AI trade boom where semiconductors are only ~34% of value; China is the largest exporter but Taiwan the most exposed, the US the largest (downstream-weighted) importer, and reliance on shared regional freight networks (air freight largest) concentrates logistics risk.", "themes": [{"theme": "AI export basket composition", "insights": [{"claim": "Oxford Economics tracks 104 AI-related traded products (semiconductors, servers, computing equipment, other inputs and capital goods) to build an AI export index measuring the trade boom from the global AI capacity build-out.", "speaker": "Sally Li", "type": "framework", "entities": ["Oxford Economics", "AI", "semiconductors", "servers"], "conviction": "high", "so_what": "Trade data on this basket offers a real-economy gauge of AI capex momentum beyond company guidance.", "quote": "We track 104 AI-related products, spanning semiconductors, servers, computing equipment, and other inputs and capital goods, and use them to construct an AI export index.", "locator": "The global build-out of AI capacity", "quote_verified": true}, {"claim": "Semiconductors account for around 34% of AI-related trade, with the remainder spread across computers, networking equipment, power infrastructure and other inputs.", "speaker": "Sally Li", "type": "data_point", "entities": ["semiconductors", "networking equipment", "power infrastructure"], "conviction": "high", "so_what": "Roughly two-thirds of AI trade value sits outside chips, so beneficiaries of the build-out extend to networking, power and computer hardware suppliers.", "quote": "Semiconductors account for around 34% of AI-related trade", "locator": "Semiconductors account for around 34%", "quote_verified": true}, {"claim": "Intermediate goods such as chips and components make up around 60% of the AI-related trade basket, showing the AI investment boom reaches far upstream into global supply chains.", "speaker": "Sally Li", "type": "data_point", "entities": ["semiconductors", "AI supply chain"], "conviction": "high", "so_what": "Upstream component exporters carry heavy leverage to any change in AI capex, amplifying both upside and downside.", "quote": "showing how far the AI investment boom reaches upstream into global supply chains", "locator": "Semiconductors account for around 34%", "quote_verified": true}]}, {"theme": "Asia-centred geography and exposure", "insights": [{"claim": "Asia sits at the centre of AI-related trade, with Asian economies playing different roles within the AI supply chain.", "speaker": "Sally Li", "type": "thesis", "entities": ["Asia", "AI supply chain"], "conviction": "high", "so_what": "Asian export data and currencies are a key read-through on the AI cycle.", "quote": null, "locator": "Asia sits at the centre of AI-related trade", "quote_verified": false}, {"claim": "China is the largest exporter of AI-related goods, but Taiwan is considerably more exposed to shifts in AI investment.", "speaker": "Sally Li", "type": "contrarian", "entities": ["China", "Taiwan"], "conviction": "high", "so_what": "Taiwan's economy, exports and equity market are the more concentrated macro bet on AI capex, and the most vulnerable to an AI investment slowdown.", "quote": "China is the largest exporter, while Taiwan is considerably more exposed to shifts in AI investment.", "locator": "Asia sits at the centre of AI-related trade", "quote_verified": true}, {"claim": "The US is the largest importer of AI-related goods, with its import mix weighted further downstream than the rest of the supply chain.", "speaker": "Sally Li", "type": "data_point", "entities": ["US"], "conviction": "high", "so_what": "US AI build-out depends on imported finished hardware, linking US capex to tariff and trade-policy risk.", "quote": null, "locator": "Asia sits at the centre of AI-related trade", "quote_verified": false}]}, {"theme": "Freight networks and concentration risk", "insights": [{"claim": "Air freight is the largest transport mode for AI-related trade, though freight networks differ sharply by mode (air, container and overland).", "speaker": "Sally Li", "type": "data_point", "entities": ["air freight", "container shipping", "overland freight"], "conviction": "high", "so_what": "Air cargo volumes and rates are a high-frequency indicator of AI hardware trade and benefit from the build-out.", "quote": "Air freight is the largest transport mode for AI-related trade", "locator": "Air freight is the largest transport mode", "quote_verified": true}, {"claim": "Because an AI supply chain spanning several economies can still depend on a common regional freight network, freight exposure in AI trade is less diversified than the supply chain's geography suggests.", "speaker": "Sally Li", "type": "causal", "entities": ["AI supply chain", "air freight", "Asia"], "conviction": "medium", "so_what": "Disruption to a single regional logistics network could hit AI hardware flows from multiple countries at once, a hidden concentration risk.", "quote": "leaving freight exposure less diversified than the geography of the supply chain might suggest", "locator": "This means a supply chain that spans", "quote_verified": true}]}], "insight_total": 8, "top_entities": ["AI", "semiconductors", "China", "Taiwan", "US", "Asia", "air freight", "networking equipment", "power infrastructure"], "source_meta": {"author": "Sally Li", "word_count": 413, "paywalled": false}}, {"record_id": "a797d88f7cdd89be", "source_type": "concepts", "source_name": "Packy McCormick / Not Boring", "source_url": "https://www.notboring.co/p/runway-learning-from-watching-the", "title": "Runway: Learning From Watching the World", "published_date": "2026-10-13", "language": "en", "processed_at": "2026-10-14T11:15:36Z", "processor": "claude-code-sub-opus", "tags": ["AI", "Tech"], "gist": "Co-written with Runway co-CEO Anastasis Germanidis, the essay argues Runway's burst of releases (Solaris interfaces, GWM Worlds 2, open-weight robotics model Praxis-1, Project Continuum OS) all stem from one next-frame-prediction World Model backbone, betting the Bitter Lesson favors learning from abundant video. Runway funds this with a fast-growing creative/ads business (>$100M ARR added in Q3 2026) and ultimately aims at World Models as simulators for robotics, software and science.", "themes": [{"theme": "Runway's one-backbone release streak", "insights": [{"claim": "In roughly six weeks (Sept-Oct 2026) Runway shipped a real-time interface model (Solaris), an interactive world model (GWM Worlds 2), an open-weight robotics model (Praxis-1), an AI ad agent for performance marketers, an OS research preview (Project Continuum), and acquired Paris robotics lab Kinetix.", "speaker": "Packy McCormick", "type": "data_point", "entities": ["Runway", "Solaris", "GWM Worlds 2", "Praxis-1", "Project Continuum", "Kinetix", "Runway Ads"], "conviction": "high", "so_what": "Release cadence across disparate domains is the visible signal that a shared foundation model has crossed a usefulness threshold.", "quote": null, "locator": "Over the past six weeks, it has shipped", "quote_verified": false}, {"claim": "Runway's video, interface, robotics and operating-system products are not separate pretrains but different post-trained applications on one General World Model backbone built on next-frame prediction at scale.", "speaker": "Packy McCormick", "type": "thesis", "entities": ["Runway", "General World Model", "GWM-1"], "conviction": "high", "so_what": "If true, each new base pretrain should lift every product line at once, giving Runway compounding leverage versus single-application competitors.", "quote": "These are not separate pretrains. They’re different applications, built around the same General World Model backbone, with different post-training on top.", "locator": "A video model. An interface model.", "quote_verified": true}, {"claim": "About 90% of Runway's research effort goes into pretraining, on the belief that capabilities are learned by watching and post-training mostly elicits what the model already knows, so each new application is cheaper to stand up than the last.", "speaker": "Packy McCormick", "type": "data_point", "entities": ["Runway"], "conviction": "high", "so_what": "Marginal cost of entering new verticals falls as the base improves; expect accelerating product breadth from Runway.", "quote": null, "locator": "This is why the company is moving so fast", "quote_verified": false}, {"claim": "Runway frames its roadmap as four chapters: media and entertainment, broader content and full video, robotics (where it says it is now), and science.", "speaker": "Packy McCormick", "type": "framework", "entities": ["Runway", "Anastasis Germanidis"], "conviction": "high", "so_what": "Useful map for tracking which TAM Runway is pivoting into next and judging execution against its own stated plan.", "quote": null, "locator": "Anastasis describes it as a plan in four chapters", "quote_verified": false}, {"claim": "The key distinction between a video model and a World Model is action conditioning: a video model predicts P(next frame | frame) while a World Model predicts P(next state | state, action); Runway's releases are effectively different action vocabularies (camera moves and text, audio, clicks/drags, robot end-effector commands) on the same machinery.", "speaker": "Packy McCormick", "type": "framework", "entities": ["Runway", "GWM Worlds 2", "Runway Characters", "Solaris", "Praxis-1"], "conviction": "high", "so_what": "A reusable lens for classifying 'world model' claims: no action input, no world model.", "quote": "“That at,” we wrote, “is the magic.”", "locator": "Actions are the important thing.", "quote_verified": true}, {"claim": "Runway built GWM-1 by converting its Gen-4.5 base video model into an autoregressive, real-time, action-steerable model via a recipe of sequential frame generation, distilling dozens of denoising steps to a few, and training on its own outputs to hold quality over long sessions.", "speaker": "Packy McCormick", "type": "causal", "entities": ["Runway", "GWM-1", "Gen-4.5"], "conviction": "high", "so_what": "Latency (interaction breaks above ~half a second of lag) is the gating spec; distillation and autoregression are what turn clip generators into interactive products.", "quote": null, "locator": "That’s what Runway did with GWM-1", "quote_verified": false}]}, {"theme": "Big Blob of Video thesis", "insights": [{"claim": "Runway's core research bet is a Bitter Lesson corollary it calls the Big Blob of Video hypothesis: the most scalable data source tends to win, and vast existing third-person video is the least human-mediated, most scalable source for learning how the world works.", "speaker": "Packy McCormick", "type": "thesis", "entities": ["Runway", "Richard Sutton", "Bitter Lesson", "Dario Amodei"], "conviction": "high", "so_what": "Positions video-native labs as the logical heirs of the scaling paradigm that made LLMs win on internet text.", "quote": "Put more bluntly: if you really believe the Bitter Lesson, you should be working on World Models.", "locator": "The Bitter Lesson and the Big Blob of Video", "quote_verified": true}, {"claim": "Next-frame prediction forces a model to implicitly learn physical regularities like object permanence, gravity and collision without anyone coding them, just as next-token prediction forces LLMs to model the reality behind text.", "speaker": "Packy McCormick", "type": "causal", "entities": ["Runway", "Ilya Sutskever"], "conviction": "high", "so_what": "Underpins the claim that video pretraining yields general physical priors transferable to robotics and simulation.", "quote": null, "locator": "When a model is trained on video, nobody tells", "quote_verified": false}, {"claim": "Language is a lossy compression of reality, so models that learn from raw video can in principle capture far more of how the world works than models learning from text or other human-mediated data.", "speaker": "Packy McCormick", "type": "thesis", "entities": ["Runway", "LLMs"], "conviction": "high", "so_what": "Argument for why World Models could eventually do things in the physical world LLMs cannot.", "quote": "Language is compression.", "locator": "Language is compression.", "quote_verified": true}, {"claim": "Learning from pixels is far less efficient than from text: research building language models from raw audio shows language emerges but needs roughly three orders of magnitude more compute than learning from text.", "speaker": "Packy McCormick", "type": "data_point", "entities": ["LLMs"], "conviction": "medium", "so_what": "The efficiency penalty implies very large compute requirements for World Models, a key cost risk for video-first labs.", "quote": null, "locator": "Learning about the world from pixels is less efficient", "quote_verified": false}, {"claim": "Runway rejects Yann LeCun's critique that pixel prediction wastes effort, arguing JEPA-style latent prediction has not shown better scaling than its diffusion models and that it is hard to know in advance which pixels are noise.", "speaker": "Packy McCormick", "type": "contrarian", "entities": ["Runway", "Yann LeCun", "JEPA"], "conviction": "medium", "so_what": "Watch whether JEPA-style approaches (LeCun camp) or pixel-diffusion approaches win on scaling; it determines which world-model labs are on the right architecture.", "quote": "The rustling leaf isn’t noise if it tells you that the wind has picked up.", "locator": "Then there’s Yann LeCun’s critique", "quote_verified": true}, {"claim": "Runway co-CEO Anastasis Germanidis expects the compute needed to train World Models to eventually exceed what LLMs need, and says naive scaling alone will not suffice without real algorithmic progress.", "speaker": "Packy McCormick", "type": "prediction", "entities": ["Anastasis Germanidis", "Runway", "Jensen Huang"], "conviction": "high", "so_what": "A new compute-demand vector beyond LLMs is bullish for GPU suppliers and a funding risk for World Model labs.", "quote": "I expect the compute needed to train World Models to eventually exceed what LLMs need, and we’ll need real algorithmic progress on top of that.", "locator": "As Anastasis said in our first conversation", "quote_verified": true}, {"claim": "Runway estimates video and World Models are one to two years behind LLMs, so pretraining is nowhere near saturated; Germanidis's rule of thumb is that generatable pixels (resolution x duration) roughly double every few months, with no blocker to hour-long generated video within one to two years.", "speaker": "Packy McCormick", "type": "prediction", "entities": ["Runway", "Anastasis Germanidis"], "conviction": "high", "so_what": "Hour-long coherent generation would require learned persistence/memory, unlocking long-form content and persistent simulations.", "quote": "I don’t see any fundamental blocker to hour-long generated video within a year or two.", "locator": "My (Anastasis’) rule of thumb", "quote_verified": true}, {"claim": "Runway's longest-term bet is a single model that handles language, pixels, audio and actions together.", "speaker": "Packy McCormick", "type": "prediction", "entities": ["Runway"], "conviction": "medium", "so_what": "Signals convergence between LLM labs and video/world-model labs; expect head-on competition over a unified multimodal-action model.", "quote": null, "locator": "Longer term, the really big bet", "quote_verified": false}]}, {"theme": "Video-pretrained robot brains (Praxis-1)", "insights": [{"claim": "Robotics is bottlenecked by scarce, expensive teleoperation data, whereas everyday video is effectively limitless and can be further multiplied by generating realistic variations.", "speaker": "Packy McCormick", "type": "causal", "entities": ["Runway", "robotics", "teleoperation"], "conviction": "high", "so_what": "Whoever converts abundant video into robot competence sidesteps the data wall that constrains teleop-heavy robotics startups.", "quote": null, "locator": "Every robotics company with ambitions of deploying at scale", "quote_verified": false}, {"claim": "Runway's Praxis-1 is pretrained mostly on third-person video, then lightly fine-tuned on egocentric data and finally on a specific robot; about 30 minutes of robot data teaches it to control a body unseen in pretraining, and some new-environment tasks reach strong performance with minutes of data.", "speaker": "Packy McCormick", "type": "data_point", "entities": ["Runway", "Praxis-1"], "conviction": "high", "so_what": "Collapsing per-embodiment data needs to ~30 minutes would commoditize robot hardware and shift value to the model layer.", "quote": null, "locator": "How much robot data does that last step take?", "quote_verified": false}, {"claim": "In Runway's test, robot policies pretrained on ordinary web video performed essentially the same as those pretrained on teleoperated robot video, with final placement errors of 16.1 cm vs 16.0 cm across 10 to 1,000 hours of pretraining data.", "speaker": "Packy McCormick", "type": "data_point", "entities": ["Runway", "Praxis-1"], "conviction": "high", "so_what": "If web video is roughly interchangeable with costly teleop data as a starting point, the economics of robot data collection change sharply.", "quote": null, "locator": "As a test, Runway pretrained robot policies", "quote_verified": false}, {"claim": "Packy McCormick's earlier view that internet video lacks mass, force, friction and stiffness is reconciled with Runway's approach because Runway uses video before, not instead of, robot data: video supplies priors, physical practice still required.", "speaker": "Packy McCormick", "type": "thesis", "entities": ["Runway", "Evan Beard", "Standard Bots"], "conviction": "medium", "so_what": "The debate over video vs robot data is a sequencing question; bet on stacks that combine cheap video priors with targeted embodied fine-tuning.", "quote": "What resolves the seeming disagreement is that Runway isn’t betting on video instead of robot data, but before robot data.", "locator": "Second, though, this isn’t the disagreement", "quote_verified": true}, {"claim": "Praxis-1 expresses actions in a standard end-effector format (where the gripper should be in 3D space and its orientation), which lets human hands in YouTube videos, humanoids, six-axis industrial arms and bimanual setups share one action representation.", "speaker": "Packy McCormick", "type": "causal", "entities": ["Praxis-1", "Standard Bots", "Noble Machines", "Ultra"], "conviction": "high", "so_what": "Embodiment-agnostic action spaces are what make one model layer portable across hardware vendors.", "quote": null, "locator": "Part of the answer is in how Runway represents actions", "quote_verified": false}, {"claim": "Praxis-1 is being tested on Noble Machines' bimanual setup, Standard Bots' six-degree-of-freedom RO1 arm, and Ultra's mobile robot.", "speaker": "Packy McCormick", "type": "data_point", "entities": ["Praxis-1", "Standard Bots", "RO1", "Noble Machines", "Ultra"], "conviction": "high", "so_what": "Early hardware partners are leading indicators of whether Runway becomes a default robot-brain supplier.", "quote": null, "locator": "To that end, Runway’s model is currently being tested", "quote_verified": false}, {"claim": "World Models serve robotics in three ways: generating training-data variations, simulating/evaluating policies before real hardware, and acting as the robot's real-time brain, the last being what Runway co-CEO Cristóbal Valenzuela finds most compelling.", "speaker": "Packy McCormick", "type": "framework", "entities": ["Runway", "Cristóbal Valenzuela"], "conviction": "high", "so_what": "Separates near-term revenue (synthetic data, eval) from the larger prize (being the onboard policy).", "quote": null, "locator": "It may be helpful to think about the three ways", "quote_verified": false}, {"claim": "In a February test, eight RoboArena manipulation policies run inside GWM-Robotics (an early Praxis-1) on a Franka Panda arm were ranked with 0.95 correlation to their real-world ranking, from 1,450 simulated rollouts and 16,000+ human ratings, using only a starting image rather than full 3D scene reconstruction.", "speaker": "Packy McCormick", "type": "data_point", "entities": ["Runway", "GWM-Robotics", "RoboArena", "Franka Panda"], "conviction": "high", "so_what": "High-fidelity policy ranking in cheap simulation reduces scarce physical robot time, a sellable eval product for robotics teams.", "quote": null, "locator": "In February, its robotics team took eight", "quote_verified": false}, {"claim": "Runway expects first real robot deployments in enterprise warehouses and manufacturing for fine-grained manipulation, with useful home robots taking longer.", "speaker": "Packy McCormick", "type": "prediction", "entities": ["Runway", "warehouses", "manufacturing"], "conviction": "medium", "so_what": "Points robotics revenue timing toward industrial automation before consumer.", "quote": null, "locator": "Runway thinks the first real deployments will be in enterprise", "quote_verified": false}, {"claim": "Germanidis does not expect a world of all humanoids: because LLMs ease component design and 3D printers ease fabrication, he expects a menagerie of cheaper, job-specific custom robot bodies all running on a shared model layer.", "speaker": "Packy McCormick", "type": "contrarian", "entities": ["Anastasis Germanidis", "humanoids", "3D printing"], "conviction": "medium", "so_what": "Skeptical signal for humanoid-centric valuations; value accrues to the shared brain layer rather than any one body form.", "quote": "Long-term, I (Anastasis) don’t think we end up in a world of all humanoids.", "locator": "Long-term, I (Anastasis) don’t think", "quote_verified": true}, {"claim": "Runway plans to release Praxis-1 as open weights so it becomes the default starting point for robot builders, creating a data flywheel back into its World Models; the Kinetix acquisition fits this robotics push.", "speaker": "Packy McCormick", "type": "thesis", "entities": ["Runway", "Praxis-1", "Kinetix"], "conviction": "high", "so_what": "Open-weighting the brain layer is a land-grab strategy; watch adoption by hardware makers as the moat-building metric.", "quote": "In this world, the model that is the robot’s brain is the layer at which value accrues, so what do you do to own that layer? Runway thinks you give it away.", "locator": "In this world, the model that is the robot’s brain", "quote_verified": true}]}, {"theme": "Pixel-generated interfaces and OS", "insights": [{"claim": "Runway calls itself a Pixel Maximalism company: since an operating system, an app interface and a robot's view are all pixels, a model that can simulate any pixel at sufficient fidelity and speed can produce almost anything shown as pixels.", "speaker": "Packy McCormick", "type": "thesis", "entities": ["Runway", "Cristóbal Valenzuela"], "conviction": "high", "so_what": "Expands Runway's addressable market from creative tools to software rendering itself.", "quote": null, "locator": "When people hear “pixels,” Cristóbal said", "quote_verified": false}, {"claim": "Solaris, Runway's first Interface World Model, generates interfaces frame by frame in real time with no code, treating clicks and drags as conditioning; in the near term an LLM handles logic while the World Model replaces the HTML/CSS/JavaScript presentation layer.", "speaker": "Packy McCormick", "type": "framework", "entities": ["Runway", "Solaris"], "conviction": "high", "so_what": "A potential long-run threat to traditional front-end engineering and UI frameworks if costs fall.", "quote": null, "locator": "For now, Solaris pairs a World Model with an LLM.", "quote_verified": false}, {"claim": "In a Runway study of ~7,500 side-by-side judgments by 250 people, Solaris beat a coded interface from Claude Opus 5 on instruction-following (61% vs 24%, 13% tie) and on natural in-scene behavior (71% vs 21%, 7% tie).", "speaker": "Packy McCormick", "type": "data_point", "entities": ["Solaris", "Claude Opus 5", "Runway"], "conviction": "medium", "so_what": "Early evidence generated UIs can beat LLM-coded UIs for physical/visual interactions, though the study is vendor-run.", "quote": null, "locator": "Runway ran a study.", "quote_verified": false}, {"claim": "Generated interfaces still struggle with stable legible text, trustworthiness for instructional or commercial use, drift in long sessions, accessibility/screen-reader compatibility, and per-frame cost, though Solaris is already orders of magnitude cheaper than standard video diffusion.", "speaker": "Packy McCormick", "type": "data_point", "entities": ["Solaris", "Runway"], "conviction": "high", "so_what": "These are the milestones to watch before generated interfaces go mainstream; adoption hinges on cost approaching traditional apps.", "quote": null, "locator": "The post also admits that there’s a lot Solaris can’t do well yet.", "quote_verified": false}, {"claim": "Project Continuum, Runway's OS research preview, aims to make anything an interface, e.g. photographing an engine to get an interactive manipulable simulation, while structured domains like medical records and financial transactions stay in conventional databases.", "speaker": "Packy McCormick", "type": "prediction", "entities": ["Project Continuum", "Runway", "Cristóbal Valenzuela"], "conviction": "exploratory", "so_what": "A bet that chat is not the final interface for AI; watch whether real-time generation cost reaches parity with running traditional apps.", "quote": "Solaris and Continuum are bets that chat isn’t the final interface, that everything you can see might become the interface.", "locator": "On October 1st, Runway previewed Project Continuum", "quote_verified": true}]}, {"theme": "Frontier lab plus distribution business", "insights": [{"claim": "Runway reports use by 95%+ of the Fortune 100, ~50% month-over-month growth, 5x credit-usage growth this year, and over $100M of ARR added in Q3 2026, with customers including every major Hollywood studio and advertising agency.", "speaker": "Packy McCormick", "type": "data_point", "entities": ["Runway", "Dolce & Gabbana", "Palo Alto Networks", "Lucid Motors", "Cloudflare", "Yamaha"], "conviction": "high", "so_what": "Unusual commercial traction for a research-heavy lab; revenue base to fund expensive World Model training.", "quote": null, "locator": "Runway is used by 95%+ of the Fortune 100", "quote_verified": false}, {"claim": "Runway sizes content production (storyboarding, VFX, post-production) at $600B+ and marketing and advertising at $1T+, the markets of its Chapter 1 and Chapter 2.", "speaker": "Packy McCormick", "type": "data_point", "entities": ["Runway"], "conviction": "medium", "so_what": "Company-provided TAM framing for generative video's near-term commercial opportunity.", "quote": null, "locator": "Runway sizes content production", "quote_verified": false}, {"claim": "Runway says internally using its Runway Ads agent scaled ad volume 1,000% while doubling return on ad spend, raised conversion 34% with steady CTR, and cut cost per subscriber 41%; public launch is weeks away.", "speaker": "Packy McCormick", "type": "data_point", "entities": ["Runway Ads", "Runway"], "conviction": "medium", "so_what": "If replicable for customers, performance marketing is a direct, measurable-ROI revenue line for generative video.", "quote": null, "locator": "Runway Ads is the clearest sign", "quote_verified": false}, {"claim": "Only four labs build world-class video generation models (Google, ByteDance, Kuaishou, Runway); most other video platforms are aggregators reselling others' models with squeezed margins and API-cutoff risk.", "speaker": "Packy McCormick", "type": "thesis", "entities": ["Google", "ByteDance", "Kuaishou", "Runway"], "conviction": "high", "so_what": "Favor model-owning labs with distribution over aggregator wrappers in generative video.", "quote": "Most other video platforms are aggregators, reselling other people’s models, which squeezes their margins and leaves them one API cutoff away from trouble.", "locator": "There are essentially four labs", "quote_verified": true}, {"claim": "Runway uses its creative business to fund its World Model research, mirroring the deep-tech pattern of SpaceX using Starlink to fund Starship, and Germanidis expects every AI lab to eventually become a World Model lab.", "speaker": "Packy McCormick", "type": "prediction", "entities": ["Runway", "SpaceX", "Starlink", "Anastasis Germanidis"], "conviction": "medium", "so_what": "Cash-generating near-term product funding a moonshot is a model to value differently from pure research labs; watch LLM labs pivoting to world models.", "quote": null, "locator": "Anastasis expects every AI lab to turn into a World Model lab", "quote_verified": false}, {"claim": "The main risk to Runway's strategy is cost: if World Models need more compute than LLMs, its creative business must keep growing fast against Google and ByteDance competing for the same customers and researchers.", "speaker": "Packy McCormick", "type": "causal", "entities": ["Runway", "Google", "ByteDance"], "conviction": "medium", "so_what": "Key bear case: capital intensity versus well-funded hyperscaler competitors.", "quote": null, "locator": "The risk, of course, is that the bigger bet gets very expensive.", "quote_verified": false}]}, {"theme": "World Models as wind tunnels for science", "insights": [{"claim": "Germanidis argues the AI-scientist bottleneck is running experiments, not proposing them, so science accelerates most by simulating experiments with World Models trained on broad media, sensor and scientific data.", "speaker": "Packy McCormick", "type": "contrarian", "entities": ["Anastasis Germanidis", "DeepMind", "Runway"], "conviction": "medium", "so_what": "Points to simulation-first AI-for-science as a larger opportunity than hypothesis-generation tools.", "quote": "Coming up with experiments is the easy part. Running them is what’s slow.", "locator": "Most visions of the “AI scientist”", "quote_verified": true}, {"claim": "Germanidis distinguishes 'sandbox superintelligence' in domains with perfect verifiers like code and math from 'real-world superintelligence' in messy, slow-feedback domains, arguing AI coding's rapid adoption is the wrong lesson because code comes with a perfect simulator.", "speaker": "Packy McCormick", "type": "framework", "entities": ["Anastasis Germanidis", "AlphaProof", "Project Vend", "Anthropic"], "conviction": "medium", "so_what": "Explains why AI gains concentrate in verifiable domains and where learned simulators are needed to extend them.", "quote": null, "locator": "This past July, I extended the argument", "quote_verified": false}, {"claim": "Learned World Models are positioned as scalable 'wind tunnels' and RL environments for every domain, replacing hand-built software-clone RL environments; Runway frames Praxis-1 as one for robot policies and Solaris as one for computer-use agents.", "speaker": "Packy McCormick", "type": "thesis", "entities": ["Runway", "Praxis-1", "Solaris", "GWM Worlds 2", "Wright Brothers"], "conviction": "high", "so_what": "RL-environment spend is a growing market; learned simulators could displace hand-engineered environment vendors.", "quote": "At the limit, world models will become the RL environments for everything.", "locator": "AI needs wind tunnels for every domain", "quote_verified": true}, {"claim": "Agents trained inside overly predictable learned simulators exploit their glitches: in Ha and Schmidhuber's 2018 work, an agent survived 2,086 steps in a low-randomness dream but only 193 in the real game, while higher randomness yielded 1,092 real steps.", "speaker": "Packy McCormick", "type": "data_point", "entities": ["Ha and Schmidhuber"], "conviction": "high", "so_what": "Simulator-trained agents need real-world deployment loops; pure-sim robotics/RL claims should be discounted.", "quote": "A dream that’s too easy to game teaches you to game dreams.", "locator": "There’s a catch, though. Agents cheat.", "quote_verified": true}, {"claim": "Evidence that video pretraining transfers to physics: UCLA's PhysiX, initialized from a video generation model, beat task-specific baselines and prior state of the art on The Well benchmark, alongside cross-domain transfer examples like Google's TimesFM and Riffusion.", "speaker": "Packy McCormick", "type": "data_point", "entities": ["PhysiX", "UCLA", "The Well", "TimesFM", "Riffusion"], "conviction": "medium", "so_what": "Supports the thesis that general video world models can become foundation models for scientific simulation.", "quote": null, "locator": "I believe physics is the most striking case.", "quote_verified": false}, {"claim": "Germanidis argues transfer works because cross-domain training teaches learning-to-learn and because common patterns (waves, diffusion) recur across scales, so siloed scientific data likely holds large untapped value if trained together.", "speaker": "Packy McCormick", "type": "causal", "entities": ["Anastasis Germanidis"], "conviction": "medium", "so_what": "Pooling scientific datasets is a potential moat for whoever aggregates them.", "quote": "Waves are waves, whether they’re in a pond or a plasma.", "locator": "Transfer works for two reasons.", "quote_verified": true}, {"claim": "Germanidis predicts World Models will have their biggest impact wherever an agent acts in an unpredictable environment (robots, cells, markets), calling the TAM practically infinite and expecting them to eventually be more useful than LLMs are today.", "speaker": "Packy McCormick", "type": "prediction", "entities": ["Anastasis Germanidis", "Arc Institute", "World Models"], "conviction": "exploratory", "so_what": "Frames action-conditioned simulators (virtual cells, market simulators) as the next platform category to watch.", "quote": "The endgame of a universal simulator of pixels is a universal simulator of reality.", "locator": "This is where I think World Models will ultimately", "quote_verified": true}]}, {"theme": "What to watch", "insights": [{"claim": "The test of Runway's bet is whether each new base pretrain simultaneously improves robot dexterity, interface coherence, world persistence, video length and ad performance without hand-building each improvement, as successive LLMs improved across domains at once.", "speaker": "Packy McCormick", "type": "framework", "entities": ["Runway"], "conviction": "high", "so_what": "A concrete diligence checklist for each new Runway base model release.", "quote": null, "locator": "The thing to watch from here", "quote_verified": false}, {"claim": "Runway's leaders argue video models are widely misread as creative toys when they will soon power most intelligent behaviors, and Packy McCormick admits he underestimated video as a path to World Models.", "speaker": "Packy McCormick", "type": "contrarian", "entities": ["Cristóbal Valenzuela", "Anastasis Germanidis", "Runway"], "conviction": "medium", "so_what": "If consensus still boxes video models as 'tools for creatives', the market may be under-pricing world-model optionality.", "quote": "People generally underestimate how far video can go.", "locator": "Right now, most people put video models", "quote_verified": true}]}], "insight_total": 45, "top_entities": ["Runway", "Anastasis Germanidis", "Cristóbal Valenzuela", "Praxis-1", "Solaris", "GWM Worlds 2", "Project Continuum", "Standard Bots", "Kinetix", "Google", "ByteDance", "Bitter Lesson"], "source_meta": {"author": "Packy McCormick", "word_count": 10720, "paywalled": false}}, {"record_id": "d82861e3c46b34f1", "source_type": "concepts", "source_name": "Peterson Institute (PIIE)", "source_url": "https://www.piie.com/blogs/realtime-economics/2026/chinas-deposit-insurance-fund-strikingly-underfunded", "title": "China's Deposit Insurance Fund is strikingly underfunded", "published_date": "2026-10-13", "language": "en", "processed_at": "2026-10-14T11:14:34Z", "processor": "claude-code-sub-opus", "tags": ["Macro"], "gist": "China's Deposit Insurance Fund held just RMB130bn at end-2025, an estimated 0.1% of ~RMB124tn insured deposits versus a 1.5% IMF-reported target and far below US (1.42%), EU (0.8%) and Japan (0.43%) levels, after bailouts like Baoshang drained it. Depositors are likely protected by implicit state support, but losses would be socialized onto the public balance sheet; Huang urges higher risk-based bank levies now and stricter bail-in rules.", "themes": [{"theme": "DIF reserve ratio shortfall", "insights": [{"claim": "China's Deposit Insurance Fund held only RMB130 billion ($18.5 billion) at end-2025, an estimated 0.1 percent of insured deposits, versus a 1.5 percent target reported by the IMF.", "speaker": "Tianlei Huang", "type": "data_point", "entities": ["China Deposit Insurance Fund", "IMF", "China"], "conviction": "high", "so_what": "China's bank-failure backstop is roughly 1/15th of its own target, so any sizable failure must be funded outside the prefunded pool.", "quote": "At the end of 2025, its reported balance(link is external) was only RMB130 billion ($18.5 billion), equivalent to an estimated 0.1 percent of insured deposits", "locator": "Body: China's Deposit Insurance Fund (DIF), a key pillar", "quote_verified": true}, {"claim": "Because Chinese authorities do not publish insured-deposit figures, Huang backs out insured deposits from the IMF's target (about US$224 billion / RMB1.6 trillion at a 1.5 percent ratio), implying RMB107 trillion insured, about 37 percent of RMB290 trillion total deposits at end-2023.", "speaker": "Tianlei Huang", "type": "framework", "entities": ["IMF", "Financial Sector Assessment Program", "People's Bank of China"], "conviction": "medium", "so_what": "A reusable method to estimate opaque deposit-insurance coverage; the 0.1 percent figure is an estimate that depends on the IMF target inputs.", "quote": null, "locator": "Note 2: The IMF's 2025 Financial Sector Assessment Program", "quote_verified": false}, {"claim": "Carrying the 37 percent insured share forward to the People's Bank of China's reported RMB336 trillion of total deposits at end-2025 implies about RMB124 trillion of insured deposits in China.", "speaker": "Tianlei Huang", "type": "data_point", "entities": ["People's Bank of China", "China"], "conviction": "medium", "so_what": "Sizes the contingent liability: roughly RMB124 trillion of insured deposits sits behind a RMB130 billion fund.", "quote": null, "locator": "Yet this relatively generous coverage is backed", "quote_verified": false}, {"claim": "By comparison, the US Deposit Insurance Fund's reserve ratio was 1.42 percent at end-2025 (above its 1.35 percent statutory minimum), the EU generally requires at least 0.8 percent, and Japan held 0.43 percent at end-March 2026, while Brazil and India have much higher ratios than many advanced economies.", "speaker": "Tianlei Huang", "type": "data_point", "entities": ["FDIC Deposit Insurance Fund", "European Union", "Japan", "Brazil", "India", "United States"], "conviction": "high", "so_what": "China's deposit-insurance prefunding is an outlier even versus Japan; useful benchmark for relative banking-system backstop strength.", "quote": null, "locator": "By comparison, the figure below shows", "quote_verified": false}, {"claim": "The EU Deposit Guarantee Schemes Directive allows member states with highly concentrated banking sectors to target a lower 0.5 percent ratio, and France uses this derogation and meets the lower target.", "speaker": "Tianlei Huang", "type": "data_point", "entities": ["EU Deposit Guarantee Schemes Directive", "France"], "conviction": "high", "so_what": "Even the EU's lowest permitted target is five times China's estimated ratio.", "quote": null, "locator": "Note 3: The EU Deposit Guarantee Schemes Directive", "quote_verified": false}]}, {"theme": "Generous coverage, thin backing", "insights": [{"claim": "China's deposit insurance covers nearly 3,000 banks and protects up to RMB500,000 per depositor per bank, which the People's Bank of China says fully protects more than 99 percent of depositors.", "speaker": "Tianlei Huang", "type": "data_point", "entities": ["People's Bank of China", "China"], "conviction": "high", "so_what": "Near-universal retail coverage means confidence rests on the state's backstop rather than the fund itself.", "quote": null, "locator": "The system covers(link is external) nearly 3,000 banks", "quote_verified": false}, {"claim": "China's deposit insurance limit of about five times GDP per capita is among the most generous in the world, double the G20 median of 2.5 times GDP per capita reported by the International Association of Deposit Insurers for 2022.", "speaker": "Tianlei Huang", "type": "data_point", "entities": ["International Association of Deposit Insurers", "G20", "China"], "conviction": "high", "so_what": "High coverage plus tiny prefunding maximizes the implicit fiscal guarantee on Chinese bank liabilities.", "quote": null, "locator": "At about five times China's GDP per capita", "quote_verified": false}]}, {"theme": "Fund depletion via bailouts", "insights": [{"claim": "Extensive use of China's Deposit Insurance Fund, including payments to creditors beyond deposit-insurance coverage, depleted its resources, and Chinese bank resolution remains heavily reliant on public funding without forcing creditors to absorb significant losses.", "speaker": "Tianlei Huang", "type": "causal", "entities": ["China Deposit Insurance Fund", "China"], "conviction": "high", "so_what": "Creditor bail-in is weak in China, so senior/uninsured bank creditors have historically been protected by public money — a moral-hazard signal for bank credit pricing.", "quote": "Bank resolution also remains heavily reliant on public funding and does not force creditors to absorb significant losses.", "locator": "Generous coverage backed by a small fund", "quote_verified": true}, {"claim": "In the 2019 Baoshang Bank failure, all household deposits and other claims up to RMB50 million were fully protected (100 times the RMB500,000 statutory limit), and the Deposit Insurance Fund spent RMB93 billion in 2020, roughly three quarters of its reserves, on Baoshang alone, with the People's Bank of China adding further support.", "speaker": "Tianlei Huang", "type": "anecdote", "entities": ["Baoshang Bank", "China Deposit Insurance Fund", "People's Bank of China"], "conviction": "high", "so_what": "A single mid-sized regional bank failure consumed most of the fund — the DIF cannot absorb a multi-bank regional crisis without state money.", "quote": null, "locator": "Note 1: For example, when Baoshang Bank failed in 2019", "quote_verified": false}]}, {"theme": "Who bears the losses", "insights": [{"claim": "A low deposit-insurance reserve ratio in China does not necessarily mean insured depositors lose money, because recoveries from failed banks' assets, the Financial Stability Guarantee Fund set up in 2022, and central and local government resources can cover shortfalls.", "speaker": "Tianlei Huang", "type": "thesis", "entities": ["Financial Stability Guarantee Fund", "China"], "conviction": "high", "so_what": "Depositor run risk is low; the real risk transfer is to the sovereign/local-government balance sheet.", "quote": null, "locator": "Who ultimately pays?", "quote_verified": false}, {"claim": "Expectations of government support likely explain why the tiny size of China's Deposit Insurance Fund has done little to undermine depositor confidence.", "speaker": "Tianlei Huan // ---------- helpers ----------
// YouTube-aligned hex colors for tinted insight chips (bg = color+"1a", text = color, border = color+"55").
const TYPE_HEX = {
  thesis: '#6366f1', prediction: '#0ea5e9', framework: '#8b5cf6',
  data_point: '#059669', causal: '#d97706', contrarian: '#dc2626',
  anecdote: '#64748b',
};
const CONV_HEX = { high: '#16a34a', medium: '#ca8a04', low: '#94a3b8', exploratory: '#94a3b8' };
function typeHex(t) { return TYPE_HEX[String(t || '').toLowerCase()] || '#475569'; }
function convHex(c) { return CONV_HEX[String(c || '').toLowerCase()] || '#64748b'; }

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }

// Tinted chip (YouTube style): faint bg, colored text + border.
function tintChip(text, color) {
  return `<span class="chip" style="background:${color}1a;color:${color};border-color:${color}55">${escapeHtml(text)}</span>`;
}
function tagPills(tags) {
  if (!tags || !tags.length) return '';
  return tags.map(t => `<span class="pill tag">${escapeHtml(t)}</span>`).join(' ');
}

// ---------- rendering ----------
// Insight presentation ported from the YouTube digest: type/conviction tinted
// chips, speaker as a 🗣 chip, and entities as indigo chips — all in the meta row
// directly under the claim. Quote treatment is INTENTIONALLY kept as Concepts'
// verbatim + "✓ verified" (stronger than YouTube's ≈ paraphrase wording).
function renderInsight(ins) {
  if (!ins) return '';
  const cls = 'insight' + (ins.type ? (' ' + String(ins.type).toLowerCase()) : '');
  const meta = [];
  if (ins.type) meta.push(tintChip(ins.type, typeHex(ins.type)));
  if (ins.speaker) meta.push(`<span class="chip chip-spk">🗣 ${escapeHtml(ins.speaker)}</span>`);
  if (ins.conviction) meta.push(tintChip('conviction: ' + ins.conviction, convHex(ins.conviction)));
  (ins.entities || []).slice(0, 12).forEach(e => {
    if (e) meta.push(`<span class="chip chip-ent">${escapeHtml(e)}</span>`);
  });
  let quote = '';
  if (ins.quote) {
    const v = ins.quote_verified
      ? `<span class="vmark">✓ verified</span>`
      : `<span class="vmark no">unverified</span>`;
    quote = `<div class="quote">“${escapeHtml(ins.quote)}”${v}</div>`;
  }
  const so = ins.so_what
    ? `<div class="insight-so"><span class="lbl">so what</span>${escapeHtml(ins.so_what)}</div>` : '';
  return `
    <div class="${cls}">
      <div class="insight-claim">${escapeHtml(ins.claim || '')}</div>
      <div class="insight-meta">${meta.join('')}</div>
      ${so}
      ${quote}
    </div>`;
}

function renderTheme(theme) {
  const insights = (theme.insights || []).map(renderInsight).join('');
  return `
    <div class="theme">
      <div class="theme-title">${escapeHtml(theme.theme || 'Theme')}</div>
      ${insights}
    </div>`;
}

function renderCard(card) {
  if (!card) return '';
  const meta = card.source_meta || {};
  const nameHtml = card.source_url
    ? `<a class="source-name" href="${escapeAttr(card.source_url)}" target="_blank" rel="noopener">${escapeHtml(card.source_name || '')}</a>`
    : `<span class="source-name">${escapeHtml(card.source_name || '')}</span>`;
  const subBits = [];
  if (card.published_date) subBits.push(escapeHtml(card.published_date));
  if (meta.author) subBits.push(escapeHtml(meta.author));
  if (meta.word_count) subBits.push(`${meta.word_count} words`);
  if (meta.paywalled) subBits.push('paywalled');
  const themes = (card.themes || []).map(renderTheme).join('');
  const n = card.insight_total != null ? card.insight_total
            : (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
  return `
    <div class="source">
      <div class="source-head" onclick="toggleSource(this)">
        <div class="source-meta-left">
          <div class="source-name-row">${nameHtml}</div>
          <div class="source-title">${escapeHtml(card.title || '')}</div>
          <div class="source-sub">${subBits.join('  ·  ')}</div>
        </div>
        <span class="source-count">${n} insight${n === 1 ? '' : 's'}</span>
        <span class="source-arrow">▸</span>
      </div>
      <div class="source-body">
        ${card.gist ? `<div class="gist">${escapeHtml(card.gist)}</div>` : ''}
        ${card.tags && card.tags.length ? `<div class="tags">${tagPills(card.tags)}</div>` : ''}
        ${themes || '<div class="empty">No insights.</div>'}
      </div>
    </div>`;
}

function renderTopStats(d) {
  const s = d.stats || {};
  const parts = [];
  if (d.date) parts.push(`date <strong>${escapeHtml(d.date)}</strong>`);
  if (s.lookback_days != null) parts.push(`lookback <strong>${s.lookback_days}d</strong>`);
  if (s.sources != null) parts.push(`sources <strong>${s.sources}</strong>`);
  if (s.cards != null) parts.push(`cards <strong>${s.cards}</strong>`);
  if (s.insights != null) parts.push(`insights <strong>${s.insights}</strong>`);
  if (s.quote_verified_pct != null) parts.push(`quotes verified <strong>${s.quote_verified_pct}%</strong>`);
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSource(headEl) { headEl.parentElement.classList.toggle('open'); }

function insightCount(card) {
  return (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
}

// Build the sort/filter control bar (display only — re-groups REPORT_DATA in place).
function buildControls(d) {
  const cards = d.cards || [];
  const names = [...new Set(cards.map(c => c.source_name || '—'))].sort((a, b) => a.localeCompare(b));
  const opts = names.map(n => `<option value="${escapeAttr(n)}">${escapeHtml(n)}</option>`).join('');
  document.getElementById('controls').innerHTML =
    `<label>Sort
       <select id="sortSel">
         <option value="source">Source A–Z</option>
         <option value="insights">Insight count ▼</option>
       </select></label>
     <label>Source
       <select id="srcSel">
         <option value="__all">All sources (${names.length})</option>
         ${opts}
       </select></label>
     <span class="ctl-btns">
       <button type="button" id="expandAll">Expand all</button>
       <button type="button" id="collapseAll">Collapse all</button>
     </span>`;
  document.getElementById('sortSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('srcSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('expandAll').addEventListener('click', () => setAllGroups(false));
  document.getElementById('collapseAll').addEventListener('click', () => setAllGroups(true));
}

// Group-level collapse: header click toggles one group; the control-bar buttons toggle all.
function toggleGroup(headEl) { headEl.parentElement.classList.toggle('collapsed'); }
function setAllGroups(collapsed) {
  document.querySelectorAll('.group').forEach(g => g.classList.toggle('collapsed', collapsed));
}

// Group cards by source, sort groups (and cards within), optionally filter to one source.
function renderGroups(d) {
  const sortMode = (document.getElementById('sortSel') || {}).value || 'source';
  const srcFilter = (document.getElementById('srcSel') || {}).value || '__all';
  let cards = (d.cards || []).slice();
  if (srcFilter !== '__all') cards = cards.filter(c => (c.source_name || '—') === srcFilter);

  const groups = new Map();
  cards.forEach(c => {
    const k = c.source_name || '—';
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(c);
  });
  let entries = [...groups.entries()].map(([name, cs]) => ({
    name, cards: cs, insights: cs.reduce((a, c) => a + insightCount(c), 0),
  }));
  if (sortMode === 'insights') entries.sort((a, b) => b.insights - a.insights || a.name.localeCompare(b.name));
  else entries.sort((a, b) => a.name.localeCompare(b.name));
  // Within each source group, heaviest cards first.
  entries.forEach(e => e.cards.sort((a, b) => insightCount(b) - insightCount(a)));

  const html = entries.map(e => {
    const head = `<div class="group-head" onclick="toggleGroup(this)">`
      + `<span class="group-name">${escapeHtml(e.name)}</span>`
      + `<span class="group-meta">${e.cards.length} card${e.cards.length === 1 ? '' : 's'} · ${e.insights} insights</span>`
      + `<span class="group-arrow">▾</span></div>`;
    return `<div class="group">${head}<div class="group-body">${e.cards.map(renderCard).join('')}</div></div>`;
  }).join('');

  const app = document.getElementById('app');
  app.innerHTML = html || '<div class="empty">No cards for this source.</div>';
  // Open the first two source cards by default.
  document.querySelectorAll('.source').forEach((sec, i) => { if (i < 2) sec.classList.add('open'); });
}

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  document.getElementById('stats-top').innerHTML = renderTopStats(d);
  buildControls(d);
  renderGroups(d);   // default: grouped, sorted by source A–Z
}

renderReport(REPORT_DATA);
</script>
</body>
</html>
