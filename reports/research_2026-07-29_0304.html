let activeCat = "all";
let activeUrg = "all";

function catColor(c){ return CAT_COLORS[c] || "#888"; }

function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}

function toggleCard(id) {
  var el = document.getElementById('card-' + id);
  el.classList.toggle('open');
}

function toggleReport() {
  document.getElementById('reportCard').classList.toggle('open');
  document.getElementById('reportChevron').textContent =
    document.getElementById('reportCard').classList.contains('open') ? '▾' : '▸';
}

function setCatFilter(cat) {
  activeCat = cat;
  activeSrc = null;
  render();
}
function setUrgFilter(urg) {
  activeUrg = urg;
  activeSrc = null;
  render();
}
function filterBySrc(name) {
  activeSrc = name;
  activeCat = "all";
  activeUrg = "all";
  render();
  setTimeout(function(){
    ITEMS.forEach(function(it){
      if (it.source.indexOf(name) !== -1) {
        var el = document.getElementById('card-' + it.id);
        if (el) el.classList.add('open');
      }
    });
  }, 0);
}

function buildFilters() {
  var catCounts = {};
  var urgCounts = { act:0, deep:0, watch:0 };
  ITEMS.forEach(function(it){
    catCounts[it.cat] = (catCounts[it.cat]||0)+1;
    urgCounts[it.urgency] = (urgCounts[it.urgency]||0)+1;
  });

  var catHtml = '<button class="pill' + (activeCat==="all"?" active":"") + '" style="' + (activeCat==="all"?"background:#333;":"") + '" onclick="setCatFilter(\'all\')">All <span class="count">' + ITEMS.length + '</span></button>';
  Object.keys(catCounts).sort().forEach(function(c){
    var isActive = activeCat === c;
    catHtml += '<button class="pill' + (isActive?" active":"") + '" style="' + (isActive ? ("background:"+catColor(c)+";border-color:"+catColor(c)+";") : ("color:"+catColor(c)+";border-color:"+catColor(c)+";")) + '" onclick="setCatFilter(\'' + c + '\')">' + c + ' <span class="count">' + catCounts[c] + '</span></button>';
  });
  document.getElementById('catFilters').innerHTML = catHtml;

  var urgOrder = ["act","deep","watch"];
  var urgHtml = '<button class="pill' + (activeUrg==="all"?" active":"") + '" style="' + (activeUrg==="all"?"background:#333;":"") + '" onclick="setUrgFilter(\'all\')">All <span class="count">' + ITEMS.length + '</span></button>';
  urgOrder.forEach(function(u){
    var isActive = activeUrg === u;
    urgHtml += '<button class="pill' + (isActive?" active":"") + '" style="' + (isActive?"background:#333;":"") + '" onclick="setUrgFilter(\'' + u + '\')">' + URG_META[u].label + ' <span class="count">' + (urgCounts[u]||0) + '</span></button>';
  });
  document.getElementById('urgFilters').innerHTML = urgHtml;
}

function renderCards() {
  var wrap = document.getElementById('cardsWrap');
  var html = '';
  ITEMS.forEach(function(it, idx){
    var visible = true;
    if (activeCat !== "all" && it.cat !== activeCat) visible = false;
    if (activeUrg !== "all" && it.urgency !== activeUrg) visible = false;
    if (activeSrc && it.source.indexOf(activeSrc) === -1) visible = false;

    var chartFlag = '';
    if (it.charts.hot) chartFlag = '<span class="chart-flag">🔥</span>';
    else if (it.charts.count > 0) chartFlag = '<span class="chart-flag">📊</span>';

    var chartBoxHtml = '';
    if (it.charts.desc) {
      chartBoxHtml = '<div class="chart-box' + (it.charts.hot ? ' hot' : '') + '">' +
        (it.charts.hot ? '<strong>🔥 CHART WORTH SAVING — </strong>' : (it.charts.count > 0 ? '<strong>📊 Chart — </strong>' : '')) +
        it.charts.desc + '</div>';
    }

    html += '<div class="card' + (visible?'':' hidden') + '" id="card-' + it.id + '" style="--accent:' + catColor(it.cat) + '">' +
      '<div class="card-header" onclick="toggleCard(' + it.id + ')">' +
        '<span class="idx">' + String(idx+1).padStart(2,'0') + '</span>' +
        '<span class="urg">' + URG_META[it.urgency].emoji + '</span>' +
        '<span class="badge" style="background:' + catColor(it.cat) + '">' + it.source.split(' / ')[0].split(' (')[0] + '</span>' +
        '<span class="tag">' + it.cat + '</span>' +
        chartFlag +
        '<span class="title-txt">' + it.title + '</span>' +
      '</div>' +
      '<div class="card-body">' +
        '<div class="block"><div class="block-label">The Idea</div><div class="block-text">' + it.idea + '</div></div>' +
        '<div class="block"><div class="block-label">My Angle</div><div class="angle-block">' + it.angle + '</div></div>' +
        '<div class="tweets">' +
          '<div class="tweet"><div class="tweet-label a">TWEET A</div><div class="tweet-text">' + it.tweetA + '</div><button class="copy-btn" onclick="copyTweet(' + it.id + ',\'a\')">📋 Copy</button></div>' +
          '<div class="tweet"><div class="tweet-label b">TWEET B</div><div class="tweet-text">' + it.tweetB + '</div><button class="copy-btn" onclick="copyTweet(' + it.id + ',\'b\')">📋 Copy</button></div>' +
        '</div>' +
        chartBoxHtml +
        '<div class="link-row"><a href="' + it.link + '" target="_blank">↗ Read full article</a></div>' +
      '</div>' +
    '</div>';
  });
  wrap.innerHTML = html;
}

function render() {
  buildFilters();
  renderCards();
}

function buildReport() {
  var html = '<h4>Time Window</h4>' +
    '<div>' + META.windowStart + ' → ' + META.windowEnd + '. Emails outside this window were not processed.</div>' +
    '<h4>Included Sources</h4>';
  META.includedSources.forEach(function(s){
    html += '<span class="src-item" onclick="filterBySrc(\'' + s.name.replace(/'/g,"\\'") + '\')">' + s.name + ' (' + s.count + ')</span>';
  });
  html += '<h4>Skipped Sources</h4>';
  META.skippedSources.forEach(function(s){
    html += '<div class="skip-item">• <strong>' + s.name + '</strong> — ' + s.reason + '</div>';
  });
  html += '<div class="totals"><strong>Totals:</strong> ' + META.emailsInWindow + ' emails in window · ' + META.emailsRead + ' read · ' + META.itemsExtracted + ' items extracted</div>';
  document.getElementById('reportBody').innerHTML = html;
}

document.getElementById('headerMeta').textContent =
  META.date + ' · ' + META.time + ' · ' + META.itemsExtracted + ' items from ' + META.emailsRead + ' emails';

</script>
