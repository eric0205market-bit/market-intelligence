<script>
const ITEMS = [{"id": 1, "cat": "gold", "urgency": "deep", "source": "Stephen Innes / Dark Side of the Boom (Gold)", "title": "India is paying 3% more for 29% less gold", "idea": "Indian Q3 gold demand fell 29% YoY in volume while consumer spend rose 3%, because domestic prices are up ~45%. Bar & coin demand collapsed 40% YoY. Share of Indian consumers expecting higher prices in 3 months slipped 69%→61%; investment-led jewellery purchases 19%→15%.", "angle": "Rising rupee spend masks a real volume collapse in the world's #2 physical market — physical demand is no longer a cushion under $4,000.", "tweetA": "India spent MORE on gold in Q3 and got 29% LESS metal. That's not demand, that's price inelasticity running out. Bar & coin -40% is the investor bid leaving, not the bride. $GLD", "tweetB": "Everyone quotes gold demand in dollars. Quote it in tonnes and India just had a recession: -29% volume, -40% bars & coins. If the physical bid is gone, $4,000 is held up purely by futures positioning.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening (gold vs 50DMA / trendline compression likely)"}, "link": "https://thedarksideoftheboom.substack.com/p/golds-4000-moment-the-bulls-are-running"}, {"id": 2, "cat": "gold", "urgency": "watch", "source": "Stephen Innes / Dark Side of the Boom (Gold)", "title": "RBI gold buying: 50t → 4t → 0.3t", "idea": "Reserve Bank of India bought ~50 tonnes in 9M 2024, ~4 tonnes in 9M 2025 and just 0.3 tonnes in 9M 2026 — effectively disappeared. Gold's share of India's FX reserves fell from ~19% in January to 14.5% at end-Q3.", "angle": "Central-bank accumulation was the structural pillar of the gold bull. One major buyer going to zero is a crack in the de-dollarization narrative worth tracking across PBoC/NBP/CBRT.", "tweetA": "The RBI bought 50 tonnes of gold in 2024. In 2026: 0.3 tonnes. If the de-dollarization trade was a central bank trade, someone should check whether the central banks are still in it.", "tweetB": "Gold's share of India's reserves dropped from 19% to 14.5% in nine months — partly price, mostly the RBI going silent. Question nobody asks: is India defending the rupee with reserves instead of diversifying them?", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://thedarksideoftheboom.substack.com/p/golds-4000-moment-the-bulls-are-running"}, {"id": 3, "cat": "gold", "urgency": "deep", "source": "Stephen Innes / Dark Side of the Boom (Gold)", "title": "A long-time gold bull is thinking of throwing in the towel before year-end", "idea": "Gold trapped between $4,000 support and a descending trendline; the latest rebound failed to even challenge the 50-day MA. Rising Treasury yields and a firmer dollar have reasserted the classic inverse relationships. Innes says he 'seriously doubts' he's the only long-standing bull contemplating capitulation.", "angle": "When a vocal structural bull publicly flirts with capitulation, that's sentiment data. A decisive $4,000 break with a Fed hiking path is a different regime than the 2024-25 run.", "tweetA": "Gold rebound failed below the 50DMA, the 2y just had its biggest jump since Liberation Day, and a career gold bull says he may throw in the towel. Either this is the capitulation low or $4,000 is the trapdoor.", "tweetB": "The problem with $4,000: everyone knows where it is. Round-number support with a hiking Fed and missing central bank buyers is where stop-runs live.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — $4,000 vs descending trendline & 50DMA"}, "link": "https://thedarksideoftheboom.substack.com/p/golds-4000-moment-the-bulls-are-running"}, {"id": 4, "cat": "tech", "urgency": "deep", "source": "SixSigmaCapital / SixSigmaResearch", "title": "Sea Q3: Shopee earns more per GMV dollar — and spends all of it", "idea": "Sea revenue $8.58B (+43.4% YoY), net income $502.5M. Shopee GAAP take rate +2.0pts YoY, ad revenue +55%, ad take rate +80bps — but S&M/GMV rose from ~2.8% to 3.6% (S&M +60% vs revenue +41%), so adj. EBITDA/GMV improved only ~0.1pt to ~0.68%.", "angle": "Classic platform 'monetise-and-reinvest' loop. The bull case requires S&M to be discretionary; Sea doesn't disclose what's inside the line.", "tweetA": "Shopee raised take rate 2 full points and EBITDA per GMV dollar moved 0.1pt. Every extra cent of ad revenue went straight back out as marketing. That's not a moat, that's a toll booth with a rebate. $SE", "tweetB": "SE trades on 'monetisation inflection'. The inflection happened. It just landed in the S&M line instead of EBITDA. Watch whether 0.68% EBITDA/GMV moves in Q4 or the story needs a new chapter.", "charts": {"count": 0, "hot": false, "desc": "Financial tables in article"}, "link": "https://sixsigmaresearch.com/p/sea-ltd-earnings-update-q3-2026"}, {"id": 5, "cat": "AI/infra", "urgency": "watch", "source": "SixSigmaCapital / SixSigmaResearch", "title": "Sea launches Sea Cloud: no contracts, no ROI target, capex spike", "idea": "Sea launched Sea Cloud (AI infra + models + agents for outside customers). No enterprise contracts signed. Q3 capex ~$547M exceeded the whole H1 ($495M); D&A +46%. Forrest Li: 'very, very frugal' on capex but no numerical limit and no ROI view. Other Services EBITDA loss widened to $83.9M from $25.1M YoY.", "angle": "Even an EM e-commerce company now feels it must have an AI cloud story. 'Capex-light AI cloud funded by customer prepayments' is the neocloud model in reverse — worth watching as a template.", "tweetA": "Sea now has an AI cloud business with zero contracts, no ROI target, and capex that just doubled QoQ. The AI capex virus has officially reached Southeast Asian e-commerce. $SE", "tweetB": "Question for Sea Cloud: who in ASEAN buys AI capacity from a marketplace operator instead of from AWS, Google or a sovereign cloud? The answer is probably 'data-residency regulated customers' — and that's a real niche.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://sixsigmaresearch.com/p/sea-ltd-earnings-update-q3-2026"}, {"id": 6, "cat": "credit", "urgency": "watch", "source": "SixSigmaCapital / SixSigmaResearch", "title": "Monee: loan book +60%, provisions +82%, NPLs rising in Thailand & Brazil", "idea": "Monee (Sea's fintech) revenue +63.9%, loan book +60%, but credit-loss provisions +82.3% to $678.7M and S&M doubled. 90-day NPL ratio rose to 1.3% from 1.0% QoQ; driven by Thailand, Brazil and off-Shopee SPayLater. Underwriting tightened. 44M active credit users; listing planned in 1–3 years.", "angle": "EM unsecured BNPL credit is deteriorating in Thailand/Brazil at the same time fuel prices are squeezing consumers — a consumer-stress signal beyond the US.", "tweetA": "One of SE Asia's biggest unsecured lenders just saw NPLs jump 30% in a quarter, provisions +82%, and the response is... an IPO in 1-3 years. Classic: list the lender before the cycle turns.", "tweetB": "Monee EBITDA margin: 26% → 20.5% → 18.4%. Thailand and Brazil consumer credit is cracking. If you want to know how fuel-price inflation lands in EM, read BNPL loss provisions, not CPI.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://sixsigmaresearch.com/p/sea-ltd-earnings-update-q3-2026"}, {"id": 7, "cat": "culture", "urgency": "watch", "source": "SixSigmaCapital / SixSigmaResearch", "title": "Shopee sees 'value-seeking' consumers as fuel prices bite; buyback ≈ SBC", "idea": "Management noted more value-seeking behaviour amid macro pressures such as fuel prices. FY Shopee EBITDA guide of ~$1B implies ~$252M in Q4, below Q3's $269M. Q3 buyback ~$165M vs SBC of $132M — buyback mostly offsetting dilution; diluted shares only -0.8% YoY.", "angle": "The oil shock is showing up in ASEAN/Brazil consumer behaviour. Implied Q4 EBITDA decline in the holiday quarter is a quiet tell.", "tweetA": "Shopee's own guidance implies Q4 EBITDA BELOW Q3 — in the quarter with 11.11 and 12.12. Management says consumers are 'value-seeking' due to fuel. The oil shock is now a margin story in Jakarta.", "tweetB": "$1B buyback headline, $132M of quarterly SBC underneath it. Share count down 0.8%. Most 'shareholder returns' in tech are just dilution management with good PR. $SE", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://sixsigmaresearch.com/p/sea-ltd-earnings-update-q3-2026"}, {"id": 8, "cat": "AI/infra", "urgency": "deep", "source": "Stephen Innes / Dark Side of the Boom (JPM capex)", "title": "JPMorgan: 2027 AI capex locked in, 2028 hits the permit wall", "idea": "JPM's Dubravko Lakos-Bujas: after the Democratic sweep, the binding constraint on AI is shifting from chips and financing to permits to operate. 2027 capex is largely intact (financed, construction advanced); 2028 is where regulatory delays could flatten the curve on the ~$2T buildout. The overlooked risk: debt financing secured against anticipated completion dates.", "angle": "Equity sees a growth slowdown; credit sees a completion-risk problem. Data-center ABS/project finance with completion covenants is where a permit delay becomes a default.", "tweetA": "The AI capex risk just changed from 'can we get GPUs' to 'can we get a permit.' Chips are a 2027 story. Zoning boards are the 2028 story. $NVDA trades on the first, data center credit trades on the second.", "tweetB": "JPM says 2027 is safe and 2028 is at risk. Translation for credit: every DC loan underwritten on a 2028 completion date is now a political bet. Equity holders can wait a year. Lenders with completion covenants can't.", "charts": {"count": 0, "hot": false, "desc": "Paywalled; JPM capex forecast charts likely inside"}, "link": "https://thedarksideoftheboom.substack.com/p/the-2-trillion-ai-buildout-meets"}, {"id": 9, "cat": "energy", "urgency": "deep", "source": "HFI Research (WCTW)", "title": "Trump's oil incentive: do nothing, then blame the Democrats", "idea": "HFIR's thesis: post-midterms, Trump's incentive is to keep the Hormuz status quo and blame any oil rise on the incoming Democrats. Hormuz implied flow ~9 mb/d vs a 3–4 mb/d panic scenario; Brent in the low $90s, only ~$20 above pre-war. $4 gasoline is pinned on the war; if it hits $6, blame shifts.", "angle": "Political incentive analysis says no strikes but also no fix — slow inventory drain. Bullish crude on a 3–6 month horizon regardless of headlines.", "tweetA": "Market read the blue wave as 'war over.' HFIR reads it as 'Trump now has someone else to blame for $6 gas.' Those are opposite oil trades. I'd rather own the one where inventories keep draining. $XLE $USO", "tweetB": "Hormuz flowing ~9mb/d with daily tanker attacks is not 'normal', it's a slow bleed. Peace-deal headlines price out risk premium while the physical buffer shrinks. That's how you get a gap, not a grind.", "charts": {"count": 1, "hot": false, "desc": "Hormuz implied flow chart (HormuzStraitTracker.com)"}, "link": "https://www.hfir.com/p/wctw-the-unsustainable-status-quo"}, {"id": 10, "cat": "geopolitics", "urgency": "watch", "source": "HFI Research (WCTW)", "title": "Iran's 7-point plan is untenable — and so is the status quo", "idea": "HFIR: Iran's 7 points require irreversible US acts — leaving the region, war reparations, releasing sanctioned funds, forcing Israel out of Lebanon. None is politically feasible. Market is wrong to price a peace deal, but right that strikes are unlikely. The paywalled section argues the status quo itself is unsustainable.", "angle": "A 'no war, no peace' equilibrium is the worst combo for energy: no clearing event, persistent inventory decline.", "tweetA": "Read Iran's 7 points: reparations, sanctions relief, US exit, Israel out of Lebanon. Not one is reversible, not one is passable. Any 'peace deal' headline that ignores this is a gift to oil bulls.", "tweetB": "Worst-of-both-worlds geopolitics: no strikes to break the deadlock, no deal to end it. Markets are built to price events. They are terrible at pricing indefinite attrition.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://www.hfir.com/p/wctw-the-unsustainable-status-quo"}, {"id": 11, "cat": "macro", "urgency": "watch", "source": "Capital Flows", "title": "'The inflation cycle has begun' — and 60/40 is the wrong frame", "idea": "Capital Flows argues the inflation cycle is starting to shock complacent positioning, and that the asset-management industry keeps clients in 60/40 instead of focusing on the real purchasing power of returns. Full inflation-nowcasting playbook to follow in a Friday livestream (email is mostly a video teaser).", "angle": "Thin email, but the framing — measure returns in real purchasing power, not nominal — is exactly the regime question after hot October CPI.", "tweetA": "With the Fed hiking into 4% CPI, a 60/40 that returns 6% nominal is roughly 2% real with double the drawdown risk of 2021. The question isn't stocks vs bonds. It's nominal vs real.", "tweetB": "In an inflation cycle, bonds stop hedging stocks — they become the same trade. 2022 taught that. Most portfolios still haven't priced the lesson.", "charts": {"count": 0, "hot": false, "desc": "Video teaser; macro regime model linked"}, "link": "https://www.capitalflowsresearch.com/p/the-inflation-cycle-has-begun"}, {"id": 12, "cat": "macro", "urgency": "act", "source": "John Authers / Bloomberg Points of Return", "title": "October CPI: broad-based, not oil — 13-month rate tops 4%", "idea": "No YoY figure due to last year's shutdown, but the 13-month rate topped 4%. Trimmed-mean and median core both jumped; supercore and food rose. Barclays' Pooja Sriram: increases spanned furniture, appliances, toys, TVs, smartphones, laptops/PCs, cosmetics, prescription drugs — imprint of freight costs and 'continued AI-related inflation'.", "angle": "'AI-related inflation' in consumer electronics (memory/compute costs passing through to laptops and phones) is a new and underappreciated CPI driver.", "tweetA": "Smartphones, laptops and PCs pushing CPI higher. That's not oil — that's DRAM. The AI buildout is eating the memory supply and consumers are paying the bill. $MU $SMSN", "tweetB": "Trimmed mean and median both spiked. You can't blame an outlier when the cleanest core measures confirm it. Warsh's 'information-rich' October just turned into a policy error he has to pay back.", "charts": {"count": 9, "hot": true, "desc": "~9 charts: 11- and 13-month CPI, trimmed mean/median core, supercore & food, implied hikes path, 2y yield spike, 10y trendline bounce, Anthropic raise vs records. 🔥 2y yield biggest daily jump since Liberation Day"}, "link": "https://www.bloomberg.com/opinion/newsletters/2026-11-11/skipping-a-rate-hike-doesn-t-look-so-clever-now"}, {"id": 13, "cat": "macro", "urgency": "act", "source": "John Authers / Bloomberg Points of Return", "title": "Waller floats 'jumbo' 50bp; 3 hikes now priced as certainty", "idea": "Waller (a 2025 cut-dissenter) said more robust action may be needed if inflation surprises; Logan wants at least two more 25bp hikes. December hike priced at 100%, 11% chance of 50bp. Last week market doubted two more hikes; now three is certain. 2y had biggest daily rise since April 2025 Liberation Day reversal; 10y bounced off its yearly uptrend. SPX -0.38%, equal-weight -0.02%.", "angle": "Equities shrugging off a 2y shock is either resilience or complacency; the equal-weight flat print says breadth isn't panicking.", "tweetA": "Waller dissented FOR cuts in 2025. In 2026 he's floating 50bp hikes. When the dove becomes the hawk, the terminal rate isn't a number anymore — it's a range with no ceiling.", "tweetB": "2y: biggest daily rise since Liberation Day. SPX: -0.38%. Equal-weight: flat. Either equities believe hikes kill inflation without killing growth, or they haven't done the math yet.", "charts": {"count": 0, "hot": true, "desc": "See Authers charts: implied hikes by end-2026/Sep-2027; 2y daily change"}, "link": "https://www.bloomberg.com/opinion/newsletters/2026-11-11/skipping-a-rate-hike-doesn-t-look-so-clever-now"}, {"id": 14, "cat": "AI/infra", "urgency": "deep", "source": "John Authers / Bloomberg Points of Return", "title": "Anthropic's raise would beat SpaceX's record — and BI flags compute commitments", "idea": "Up to $90.4B including concurrent placement at ~$1.4T fully diluted — surpassing SpaceX's $75B in June as the largest public-market financing. Chris Hughes sees $2T within reach by 2029, but Bloomberg Intelligence's Mandeep Singh notes ~$450B of compute commitments through 2030 require sustaining premium pricing vs Gemini, ChatGPT, Grok.", "angle": "Note discrepancy: Authers/BI cite ~$450B through 2030; Parekh cites nearly $900B in the updated S-1. Worth checking which horizon — matters a lot for the leverage story.", "tweetA": "Two sources, two numbers: Bloomberg says Anthropic has ~$450B of compute commitments through 2030, the updated S-1 coverage says ~$900B. Whichever is right, the IPO is a bet on keeping premium pricing while cutting prices. $ANT", "tweetB": "The largest public-market raise in history lands the same week the Fed prices three hikes. IPO windows don't close on bad companies, they close on bad rates.", "charts": {"count": 1, "hot": false, "desc": "Bar chart: largest public-market financings; Anthropic revenue growth"}, "link": "https://www.bloomberg.com/opinion/newsletters/2026-11-11/skipping-a-rate-hike-doesn-t-look-so-clever-now"}, {"id": 15, "cat": "regulation", "urgency": "deep", "source": "John Authers / Bloomberg Points of Return", "title": "Strategas: data-center regulation is a gift to incumbents", "idea": "Thomas Tzitzouris (Strategas): post-midterm regulation slowing data-center construction could help frontier labs and hyperscalers by strangling smaller players' access to capital — 'Why would I want to lend against that?' Big Tech can slow down, improve cash flow and reap 'almost-oligopoly pricing'.", "angle": "Counter-intuitive: permit walls are bearish for neoclouds and DC developers, bullish for hyperscaler margins and FCF. Pairs with JPM's 2028 permit note.", "tweetA": "Regulation slowing data centers sounds bearish for AI. It's bearish for the small guys. If you can't finance a facility that may never get permitted, the only builders left are the ones with $100B balance sheets. $MSFT $GOOGL vs $CRWV", "tweetB": "Every regulatory moat in history gets built by the people complaining about the regulation. Data-center permitting may be the moat hyperscalers couldn't build themselves.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://www.bloomberg.com/opinion/newsletters/2026-11-11/skipping-a-rate-hike-doesn-t-look-so-clever-now"}, {"id": 16, "cat": "positioning", "urgency": "watch", "source": "John Authers / Bloomberg Points of Return", "title": "Supply indigestion: markets die from the Fed or from too much paper", "idea": "Pitcairn's Nathan Sonnenberg: markets die either when the Fed hikes too much or when there's too much supply — and Anthropic now plus OpenAI next year means investors must sell something to make room. Bob Elliott: if the IPO trades poorly, investors will question whether planned capex can pay for itself. Nvidia results + Jensen Huang affair make this a pivotal month.", "angle": "Both killers are now present simultaneously: hikes AND record equity supply. Index fast-track inclusion forces passive selling of existing mega-caps.", "tweetA": "Markets historically die two ways: too many hikes or too much supply. November 2026 is offering both at once — 3 priced hikes and the largest IPO ever. $QQQ", "tweetB": "$90B of new AI paper, fast-tracked into indices, means passive funds sell something else to buy it. The 'something else' is probably the Mag 7. Watch relative performance the week of Nov 19.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://www.bloomberg.com/opinion/newsletters/2026-11-11/skipping-a-rate-hike-doesn-t-look-so-clever-now"}, {"id": 17, "cat": "culture", "urgency": "deep", "source": "John Authers / Bloomberg Points of Return", "title": "Why Boca Juniors fans wave Swedish flags", "idea": "Boca adopted blue-and-yellow in 1906 after a kit clash, taking the colours of the first ship to enter the port of La Boca the next day — Swedish. They now have a Swedish shirt sponsor. Also: Pelé played his entire career for Santos in a 16,000-seat stadium — the 'rainy night in Stoke' every week.", "angle": "Pure culture — but a nice example of path dependence: an arbitrary 1906 choice now monetised as a sponsorship.", "tweetA": "Boca Juniors' colours came from whichever ship docked first in 1906. It was Swedish. 120 years later that's a shirt sponsorship. Best case study of path dependence I've seen all year.", "tweetB": "English fans claim Pelé couldn't handle a rainy night in Stoke. He played his whole career in a 16,000-seat cauldron in Santos. Most 'conditions' arguments are just unfamiliarity.", "charts": {"count": 0, "hot": false, "desc": "Photos of Santos stadium & Bombonera"}, "link": "https://www.bloomberg.com/opinion/newsletters/2026-11-11/skipping-a-rate-hike-doesn-t-look-so-clever-now"}, {"id": 18, "cat": "positioning", "urgency": "act", "source": "Lia / Trading Mindset & Data (TMAD)", "title": "SPX squeezed between 100 and 200DMA; semis entering 'Stage 4'", "idea": "SPX levels for Nov 11: resistance 7,543/7,577, support 7,480/7,365; price squeezed between 100- and 200-day MAs with possible double top/bear flag. CME FedWatch Nov 10: 90.9% 25bp / 9.1% 50bp. TMAD liquidity indicator (equity & bond vol + dollar) still negative. Many semis, incl. $MU, entering Stage 4 markdown.", "angle": "Liquidity negative + semis in Stage 4 + IPO supply = reasons to fade AI-semi bounces until the Anthropic print.", "tweetA": "$MU breaking into Stage 4 while CPI blames laptops and smartphones for inflation. The memory price story and the memory stock story have officially decoupled. One of them is wrong.", "tweetB": "SPX trapped between the 100 and 200DMA, liquidity gauge negative, 9% odds of a 50bp hike. That's a coiled spring with the bearish side loaded. 7,365 is the level that matters.", "charts": {"count": 3, "hot": false, "desc": "SPX levels chart, liquidity indicator chart, $MU stage chart"}, "link": "https://www.tmad.news/p/tmad-update-a52"}, {"id": 19, "cat": "macro", "urgency": "act", "source": "Stephen Innes / Dark Side of the Boom (Goldman Fed)", "title": "Goldman's Mericle adds a third hike — first cut pushed to Dec 2027", "idea": "Goldman chief economist David Mericle now forecasts three 25bp hikes, the last in March 2027, taking the peak funds rate to 4.25–4.50%, with the first cut delayed to December 2027. He still sees meaningful disinflation next year, but the Fed may have more tightening to deliver first.", "angle": "A dovish house capitulating is the kind of shift that drags consensus; bearish for crowded short-dollar / long-gold positioning.", "tweetA": "Goldman's first cut is now December 2027. That's 13 months of no relief for anyone levered to the 'Fed pivot' trade. Short-dollar is the most crowded macro position and its timeline just got pushed a full year. $DXY", "tweetB": "When the dovish economists start adding hikes, the forecast isn't moving — the floor is. 4.25-4.50% peak, hikes into March. Gold bulls needed real rates to fall. They're going the other way. $GLD", "charts": {"count": 0, "hot": false, "desc": "Paywalled; funds rate path chart likely"}, "link": "https://thedarksideoftheboom.substack.com/p/dollar-bears-and-gold-bulls-take"}, {"id": 20, "cat": "macro", "urgency": "deep", "source": "MacroEdge Research", "title": "50bp December is the underpriced scenario into Friday's PPI", "idea": "MacroEdge says a 50bp December hike is underpriced going into Friday PPI; upside risk across the yield curve, especially the front end. Energy YoY base effects off very low bases won't roll off until March 2027, creating a stagflationary environment — 'the final tunes of this equity cycle', especially in tech.", "angle": "If energy base effects persist until March, the next 4 CPI prints are skewed hot mechanically — supports hedging front-end via SOFR options.", "tweetA": "Energy base effects don't roll off until March. That's four more hot CPI prints baked in before any disinflation can show up. The Fed won't wait for March. Cheap 50bp December optionality looks mispriced at ~10%.", "tweetB": "Stagflation isn't a scenario in the energy math, it's arithmetic: YoY energy off a low base through Q1. The question is just whether tech multiples notice before or after the Anthropic print.", "charts": {"count": 0, "hot": false, "desc": "Paywalled; inflation recap charts inside"}, "link": "https://www.macroedge.world/p/war-note-on-holiday-inflation-recap"}, {"id": 21, "cat": "regulation", "urgency": "watch", "source": "MacroEdge Research", "title": "Taiwan short-sale curbs and BoK support prop up Asian equities", "idea": "Strict short-selling regulations in Taiwan produced a bounce and the Bank of Korea provided short-term support for Korean equities. European markets rolled back to all-time highs after a brief touch of 200DMAs. MacroEdge calls it living in a financially engineered 'faux-conomy'.", "angle": "When authorities in the two most AI-semi-heavy markets (TSMC, Samsung/SK Hynix) intervene, it's a signal of how stressed the semi trade got.", "tweetA": "Taiwan restricting short sales and the Bank of Korea backstopping equities in the same week. When the two AI-memory-and-foundry markets need official support, the semi unwind was worse than the US tape showed. $TSM $EWY", "tweetB": "Europe back at all-time highs while Asia needs short-sale bans. The AI trade is a hardware trade; Europe barely owns hardware. That's been the best hedge of the month.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://www.macroedge.world/p/war-note-on-holiday-inflation-recap"}, {"id": 22, "cat": "geopolitics", "urgency": "watch", "source": "MacroEdge Research", "title": "Iran missile tests, daily ship attacks — and 'IPO runway foaming'", "idea": "Iran continues new missile testing; ship attacks have continued daily for the last 4 days. MacroEdge sees it very unlikely the US hands over long-term control of Hormuz; Houthi/Saudi middle-ground is baseline. Separately: Veterans Day bond-market closure, thin tape, and expects Bessent to 'lean on the tape' ahead of the Anthropic listing. Nasdaq back at its 200DMA.", "angle": "Second independent source (with HFIR) saying Hormuz conflict is ongoing despite peace narrative; plus a policy-put thesis for the IPO week.", "tweetA": "Daily ship attacks in Hormuz for four straight days and oil just had its worst week of speculative liquidation in months. The market priced the peace. The water didn't get the memo.", "tweetB": "'IPO runway foaming' — the idea that Washington needs a clean tape for Anthropic and OpenAI is the new Fed put. If the listings are systemically important, so is the Nasdaq 200DMA.", "charts": {"count": 0, "hot": false, "desc": "WTI 'springboard' chart referenced, paywalled"}, "link": "https://www.macroedge.world/p/war-note-on-holiday-inflation-recap"}, {"id": 23, "cat": "positioning", "urgency": "deep", "source": "Stephen Innes / Dark Side of the Boom (Yen)", "title": "Goldman's yen AI-hedge didn't pay — Nasdaq worst day since COVID, JPY barely moved", "idea": "Goldman's Kamakshya Trivedi and Karen Reichgott Fishman still back short USD/JPY as a hedge for a deeper AI unwind. Three weeks in: Nasdaq suffered its worst session since the pandemic, Treasury yields fell sharply, yet the yen barely responded. Hot CPI complicates it further. Key distinction: hedging a correction vs hedging a growth scare.", "angle": "The yen only works as a hedge when US growth expectations break, not when equities merely correct. Rising US front-end yields now actively fight the trade.", "tweetA": "Nasdaq had its worst day since COVID and the yen didn't move. Hedges that don't pay on the worst day of the year aren't hedges — they're positions. $USDJPY", "tweetB": "Goldman's yen hedge failed because the AI unwind was an equity event, not a growth event. The difference is everything: equity selloffs don't repatriate Japanese capital, recessions do.", "charts": {"count": 0, "hot": false, "desc": "Paywalled; daily correlation analysis charts inside"}, "link": "https://thedarksideoftheboom.substack.com/p/the-yen-hedge-that-didnt-pay-goldman"}, {"id": 24, "cat": "AI/infra", "urgency": "act", "source": "Michael Parekh / AI-RTZ #1267", "title": "Anthropic IPO terms: $70–78, $64.4B raise, $26B from the chip stack", "idea": "825M Class A shares at $70–78 on Nasdaq ('ANT'); ~$64.4B at top (~$62.5B to Anthropic), greenshoe could take it past $74B. $26B private placement at IPO price from AMD, Broadcom, Google, Micron, Microsoft, Nvidia and TSMC — unregistered and not subject to lock-ups. ~$1.4T fully diluted / ~$1T non-diluted. Pricing Nov 18, trading Nov 19. Overnight a 867M-share, $70–80 version circulated and was pulled.", "angle": "The chip supply chain owning a piece of its largest customer — and those shares not locked up — is a circularity and supply-overhang detail the market will revisit.", "tweetA": "AMD, Broadcom, Google, Micron, Microsoft, Nvidia and TSMC are writing $26B checks into Anthropic's IPO. Suppliers buying equity in the customer so the customer can buy their chips. Vendor financing with a ticker. $NVDA $TSM $MU", "tweetB": "Read the fine print: the $26B chip-stack placement isn't subject to underwriter lock-ups. Every other holder waits 180 days. The suppliers don't. That's the overhang nobody's pricing.", "charts": {"count": 0, "hot": false, "desc": "No charts in email; S-1 tables worth opening"}, "link": "https://michaelparekh.substack.com/p/ai-anthropic-puts-a-price-on-its"}, {"id": 25, "cat": "AI/infra", "urgency": "deep", "source": "Michael Parekh / AI-RTZ #1267", "title": "From 30x to 17x revenue in three months — without the price falling much", "idea": "August ask: $2T on a $65B run rate ≈ 30x. Now: $1.4T on ~$81B run rate ≈ 17x (under 16x at the bottom). Run rate rose $10B in October alone. Q3 revenue $16.96B, +47% QoQ — strong, but decelerating from +144% the prior quarter. 9M revenue $33.24B, ~+1,200% YoY.", "angle": "The multiple compressed by ~45% mostly via growth, not price — but QoQ growth decelerating from 144% to 47% is the number the market will key on.", "tweetA": "$81B run rate. Up $10B in ONE month. If Anthropic holds +47% QoQ for one more year, the $1.4T IPO is ~5x 2027 revenue. If it decays like every hypergrowth company, it's 12x. That's the whole IPO in one line.", "tweetB": "Anthropic's growth went from +144% QoQ to +47% QoQ. Still absurd. But IPOs get priced on the first derivative and trade on the second.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://michaelparekh.substack.com/p/ai-anthropic-puts-a-price-on-its"}, {"id": 26, "cat": "AI/infra", "urgency": "deep", "source": "Michael Parekh / AI-RTZ #1267", "title": "Compute cost per revenue dollar: $2.51 → $0.48", "idea": "Per the S-1, Anthropic spent ~$2.51 on compute & infrastructure per $1 of revenue in Q1 2025, falling to $0.48 by Q2 2026 — the crossover the IPO is priced on. Compute commitments now nearly $900B (from ~$800B in the October filing). 9M net loss $104B, mostly non-cash fair-value changes on convertibles/derivatives.", "angle": "An 80% drop in compute cost per revenue dollar is the AI unit-economics chart of the year — but $900B of commitments is ~11x run-rate revenue.", "tweetA": "Anthropic went from losing $1.51 on compute per dollar of revenue to keeping 52 cents in five quarters. That's the most important AI chart nobody is putting on a slide. 🔥", "tweetB": "$900B of compute commitments against an $81B run rate = 11 years of current revenue pre-committed to chips and clouds. Anthropic isn't an AI lab, it's the biggest offtake contract in industrial history.", "charts": {"count": 0, "hot": true, "desc": "🔥 CHART WORTH SAVING — S-1 efficiency curve: compute cost per revenue $ ($2.51 → $0.48); build it from S-1 data"}, "link": "https://michaelparekh.substack.com/p/ai-anthropic-puts-a-price-on-its"}, {"id": 27, "cat": "regulation", "urgency": "deep", "source": "Michael Parekh / AI-RTZ #1267", "title": "Founders: 11.2% of votes on paper, 50.1% guaranteed; 20% retail allocation", "idea": "Seven co-founders each sell ~3.4M shares (~$250M apiece) and keep ~3.2% (~$18B each, ~22% combined). Their shares carry ~11.2% voting power, but via an LLC they're guaranteed 50.1% of most votes; the Long-Term Benefit Trust elects the board majority. Each pledged 80% of equity to philanthropy. ~20% of the offering to retail vs typical 5–10%; board members indicated up to $303M; index providers likely to fast-track inclusion.", "angle": "Controlled-company PBC + fast-track index inclusion = passive capital forced to own a stock with limited governance rights. A precedent for OpenAI.", "tweetA": "Public Anthropic shareholders will own ~78% of the economics and have no path to control. Index funds will be forced to buy it within days. Governance was the price of admission, and passive paid it.", "tweetB": "20% of the Anthropic IPO goes to retail — 2-4x the norm. When underwriters hand retail more allocation, ask why institutions are getting less.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://michaelparekh.substack.com/p/ai-anthropic-puts-a-price-on-its"}, {"id": 28, "cat": "tech", "urgency": "watch", "source": "Michael Parekh / AI-RTZ #1267", "title": "Price cut mid-roadshow: Fable 5.2 & Mythos 5.2, 30% faster, $8/$40 per M tokens", "idea": "Anthropic launched Claude Fable 5.2 and Mythos 5.2 — first frontier models since Dario Amodei called for slowing AI development in September — up to 30% faster than 5.1 at $8/M input and $40/M output tokens, with new safety evals incl. sandbox escapes. The S-1 adopts the White House term 'Super Intelligence' while risk factors warn of past misaligned behaviour.", "angle": "Price cut during the roadshow ties directly to the margin debate (OpenAI discounts pulling customers). Token deflation is a revenue headwind the S-1 must outrun.", "tweetA": "Anthropic cut model prices in the middle of its IPO roadshow. Every price cut is a bet that volume grows faster than price falls. At $900B in compute commitments, that bet better be right.", "tweetB": "An S-1 that uses the phrase 'Super Intelligence' AND discloses that the models have behaved in misaligned ways. Promise and risk factor in the same legal document. First time investors get to price alignment risk directly.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://michaelparekh.substack.com/p/ai-anthropic-puts-a-price-on-its"}, {"id": 29, "cat": "venture", "urgency": "watch", "source": "Michael Parekh / AI-RTZ #1267", "title": "OpenAI closed $11B at $1.25T — below the $1.5T it sought", "idea": "OpenAI closed about $11B of its final private round at a $1.25T valuation, below the $1.5T initially sought, ahead of an IPO expected early next year. Anthropic's range ($1.26–1.4T fully diluted) now brackets it. Anthropic's private round in May was $965B.", "angle": "Private marks are being set by public comps now. If ANT trades below range, OpenAI's $1.25T private mark is immediately stale.", "tweetA": "Six weeks ago Anthropic was talking $2T and OpenAI $1.5T. Now both land around $1.25-1.4T. The midterm tech rout did what no VC could: it priced the frontier labs.", "tweetB": "Anthropic at $1.26T bottom of range vs OpenAI's last private mark at $1.25T. Whatever ANT does on Nov 19 is OpenAI's down-round or up-round, decided by retail.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://michaelparekh.substack.com/p/ai-anthropic-puts-a-price-on-its"}, {"id": 30, "cat": "positioning", "urgency": "act", "source": "PauloMacro", "title": "Brent -$12 Tuesday-to-Tuesday — Friday's COT will show a washout", "idea": "Brent fell $10 Mon–Tue last week, then -$9 Wednesday (not captured in Friday's COT), plus -$6 this Monday: a Tuesday-to-Tuesday flush of -$12/bbl Brent and -$10 WTI. Paulo expects Friday's COT to show a speculative washout worth noticing, and flags a 'highly unusual' divergence between WTI and Brent positioning in last week's report.", "angle": "Washed-out spec length + HFIR's draining-inventory thesis + MacroEdge's daily ship attacks = contrarian setup for crude into year-end.", "tweetA": "Brent dropped $12 in a week on peace headlines while ships in Hormuz got hit four days straight. Friday's COT will show specs puked. That's usually where the bottom is, not the start of the trend. $BNO", "tweetB": "WTI and Brent positioning diverging is a tell: one market is pricing US politics, the other is pricing Hormuz. When they reconverge, someone's wrong by $10.", "charts": {"count": 0, "hot": false, "desc": "Paywalled; COT positioning chart (WTI vs Brent divergence) inside"}, "link": "https://paulomacro.substack.com/p/a-highly-unusual-divergence-in-oil"}];

  r+='</table><div class="lbl">Skipped</div><table>';

  r+='</table><div class="lbl">Totals</div>Emails in window: '+META.emailsInWindow+' · Read: '+META.emailsRead+' · Items: '+META.itemsExtracted;

}
