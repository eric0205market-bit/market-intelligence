function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function buildFilterBars() {
  const catCounts = {};
  ITEMS.forEach(i => { catCounts[i.cat] = (catCounts[i.cat] || 0) + 1; });
  const catBar = document.getElementById("catBar");
  let html = `<button class="pill active" data-cat="all" onclick="setCatFilter('all')">All <span class="count">${ITEMS.length}</span></button>`;
  Object.keys(catCounts).sort().forEach(cat => {
    const color = CAT_COLORS[cat] || "#999";
    html += `<button class="pill" data-cat="${esc(cat)}" onclick="setCatFilter('${esc(cat)}')" style="--c:${color}">${esc(cat)} <span class="count">${catCounts[cat]}</span></button>`;
  });
  catBar.innerHTML = html;

  const urgCounts = {};
  ITEMS.forEach(i => { urgCounts[i.urgency] = (urgCounts[i.urgency] || 0) + 1; });
  const urgBar = document.getElementById("urgBar");
  let uhtml = `<button class="pill active" data-urg="all" onclick="setUrgFilter('all')">All <span class="count">${ITEMS.length}</span></button>`;
  ["act", "deep", "watch"].forEach(u => {
    if (!urgCounts[u]) return;
    uhtml += `<button class="pill" data-urg="${u}" onclick="setUrgFilter('${u}')">${URG_META[u].label} <span class="count">${urgCounts[u]}</span></button>`;
  });
  urgBar.innerHTML = uhtml;
}

function setCatFilter(cat) {
  activeCat = cat;
  activeSrc = null;
  document.querySelectorAll("#catBar .pill").forEach(p => {
    const isActive = p.getAttribute("data-cat") === cat;
    p.classList.toggle("active", isActive);
    p.style.background = isActive ? (cat === "all" ? "#1a1a1a" : CAT_COLORS[cat]) : "";
    p.style.borderColor = isActive ? "transparent" : "";
    p.style.color = isActive ? "#fff" : "";
  });
  render();
}
function setUrgFilter(urg) {
  activeUrg = urg;
  activeSrc = null;
  document.querySelectorAll("#urgBar .pill").forEach(p => {
    const isActive = p.getAttribute("data-urg") === urg;
    p.classList.toggle("active", isActive);
    p.style.background = isActive ? "#1a1a1a" : "";
    p.style.borderColor = isActive ? "transparent" : "";
    p.style.color = isActive ? "#fff" : "";
  });
  render();
}
function filterBySrc(name) {
  activeSrc = name;
  activeCat = "all";
  activeUrg = "all";
  document.querySelectorAll("#catBar .pill, #urgBar .pill").forEach(p => {
    p.classList.remove("active");
    p.style.background = "";
    p.style.borderColor = "";
    p.style.color = "";
  });
  document.querySelector('#catBar .pill[data-cat="all"]').classList.add("active");
  document.querySelector('#urgBar .pill[data-urg="all"]').classList.add("active");
  render();
  document.querySelectorAll(".card").forEach(c => {
    const item = ITEMS.find(i => "card-" + i.id === c.id);
    if (item && item.source.indexOf(name) !== -1) c.classList.add("open");
  });
  window.scrollTo({ top: document.getElementById("cards").offsetTop - 20, behavior: "smooth" });
}

function cardHtml(item) {
  const color = CAT_COLORS[item.cat] || "#999";
  const urg = URG_META[item.urgency];
  const chartFlag = item.charts.hot ? "\uD83D\uDD25" : (item.charts.count > 0 ? "\uD83D\uDCCA" : "");
  const chartsBoxClass = "charts-box" + (item.charts.hot ? " hot" : "");
  const chartsLabel = item.charts.hot ? "\uD83D\uDD25 CHART WORTH SAVING \u2014 " : (item.charts.count > 0 ? "\uD83D\uDCCA " + item.charts.count + " chart(s) \u2014 " : "\uD83D\uDCC8 ");
  return `
  <div class="card" id="card-${item.id}">
    <div class="card-header" onclick="toggleCard(${item.id})">
      <span class="idx">#${String(item.id).padStart(2, "0")}</span>
      <span class="urg" title="${esc(urg.label)}">${urg.emoji}</span>
      <span class="badge-source" style="background:${color}">${esc(item.source)}</span>
      <span class="badge-cat">${esc(item.cat)}</span>
      <span class="chart-flag">${chartFlag}</span>
      <span class="card-title">${esc(item.title)}</span>
      <span class="caret">\u25B8</span>

    <div class="card-body">

      <div class="${chartsBoxClass}">${chartsLabel}${esc(item.charts.desc)}</div>

    </div>
  </div>`;
}

    if (activeCat !== "all" && i.cat !== activeCat) return false;
    if (activeUrg !== "all" && i.urgency !== activeUrg) return false;
    return true;
  });
  document.getElementById("cards").innerHTML = list.map(cardHtml).join("");
}

function toggleCard(id) {
  const card = document.getElementById("card-" + id);
  card.classList.toggle("open");
}

function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '\u2713 Copied';
  setTimeout(function() { btn.textContent = '\uD83D\uDCCB Copy'; }, 1500);
}

function buildReport() {
  document.getElementById("metaLine").textContent =
    META.date + " \u00b7 " + META.time + " \u00b7 " + META.itemsExtracted + " items from " + META.emailsRead + " emails";

  let html = `<div>Window: <strong>${esc(META.windowStart)}</strong> \u2192 <strong>${esc(META.windowEnd)}</strong>. Emails outside this window were not processed.</div>`;
  html += `<div style="margin-top:6px">Emails in window: ${META.emailsInWindow} \u00b7 Emails read: ${META.emailsRead} \u00b7 Items extracted: ${META.itemsExtracted}</div>`;
  html += `<h4>Included Sources</h4>`;
  META.includedSources.forEach(s => {
    html += `<div class="src-row"><span class="src-link" onclick="filterBySrc('${esc(s.name).replace(/'/g, "\\'")}')">${esc(s.name)}</span> \u2014 ${s.count} item${s.count === 1 ? "" : "s"}</div>`;
  });
  html += `<h4>Skipped Sources</h4>`;
  META.skippedSources.forEach(s => {
    html += `<div class="skip-row">${esc(s.name)} \u2014 <em>${esc(s.reason)}</em></div>`;
  });
  html += `<div class="totals">Total: ${META.itemsExtracted} items \u00b7 ${META.includedSources.length} sources included \u00b7 ${META.skippedSources.length} source skipped</div>`;
  document.getElementById("reportBody").innerHTML = html;
}

document.getElementById("reportHeader").addEventListener("click", () => {
  const card = document.getElementById("reportCard");
  card.classList.toggle("open");
  document.getElementById("reportCaret").textContent = card.classList.contains("open") ? "\u25BE" : "\u25B8";
});

buildFilterBars();
render();
buildReport();
</script>
</body>
</html>
