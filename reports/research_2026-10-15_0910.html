<script>
const ITEMS = [{"id": 1, "cat": "macro", "urgency": "now", "source": "Bloomberg — John Authers (Points of Return)", "title": "10Y spiked to 5.32% on 3.7% CPI, then gave it ALL back to 5.18% on no news", "idea": "Sept CPI printed 3.7%, hotter than expected. The 10Y jumped to 5.32% (recent highs) then slid to 5.18% 'on no new news of any significance'. Authers: buyers 'average in' now that yields give a margin of safety. Fed funds futures briefly priced a 50/50 hike at the FOMC in two weeks, then faded.", "angle": "A 14bp round trip on a hot print says the marginal buyer of duration has shown up at 5.2%. That changes the hedge math for anything long-beta.", "tweetA": "Hot CPI, 10Y +14bp, then all of it retraced by the close. When a print that bad can't hold a yield high, the buyer at 5.2% is the story, not the number. Who is averaging in?", "tweetB": "The bond market just told the Fed it doesn't need a hike. Warsh gets to stay hawkish in words while the 10Y does the tightening for him. That's a very convenient arrangement until the buyers disappear.", "charts": {"count": 1, "hot": false, "desc": "Several CPI breakdown charts and a 10Y intraday chart; the 5.32%→5.18% round trip is the one to save."}, "link": "https://www.bloomberg.com/opinion/newsletters/2026-10-15/hot-inflation-isn-t-playing-along-with-trump"}, {"id": 2, "cat": "macro", "urgency": "deep", "source": "Bloomberg — John Authers (Points of Return)", "title": "The causation may run from Treasury yields TO the Fed, not the reverse", "idea": "Authers argues the pressure to hike comes from the risk that the bond market loses confidence in the Fed and long yields run amok. Wednesday was the test: plenty of buyers at 5.2% reduced the urgency to hike. Ergas: fed funds works with a year's lag, the 10Y passes through instantly.", "angle": "Reframes the Fed as a reaction function to the long end. If buyers strike, a hike becomes a defence of duration, not of CPI.", "tweetA": "Everyone models the Fed reacting to CPI. Authers flips it: the Fed reacts to the 10Y. If that's right, the real FOMC input on Oct 28 isn't inflation, it's the next Treasury auction tail.", "tweetB": "A hike in 2 weeks is a coin-flip on CPI and near zero on the 10Y at 5.18%. Same data, two different Feds. I'd rather own the one that depends on a price than a print.", "charts": {"count": 1, "hot": false, "desc": "Fed funds futures path since Warsh's Jackson Hole surprise."}, "link": "https://www.bloomberg.com/opinion/newsletters/2026-10-15/hot-inflation-isn-t-playing-along-with-trump"}, {"id": 3, "cat": "macro", "urgency": "deep", "source": "Bloomberg — John Authers (Points of Return)", "title": "Core inflation is embedded: trimmed mean, sticky CPI and supercore all moving the wrong way", "idea": "Ex-energy inflation has been under the Fed's 3% upper bound for 2+ years but never reached 2%, and just ticked up. Cleveland trimmed mean is above 2% and rising, Atlanta sticky-price CPI notched higher, and supercore (services ex-shelter) is back above 3%. None of these are touched directly by oil.", "angle": "Kills the 'it's just oil' defence. Supports staying short front-end duration even if the long end is a buy.", "tweetA": "Everyone's blaming oil. The measures that exclude oil — trimmed mean, sticky CPI, supercore — all just turned up. Supercore back above 3%. This isn't an energy shock, it's an inflation regime.", "tweetB": "Bought the 10Y at 5.2% because the front end can't cut? Fine. But if supercore is >3% the curve you're buying isn't the one the Fed is pricing. Watch the 2s10s steepener, not the level.", "charts": {"count": 4, "hot": true, "desc": "Four charts: CPI by component, ex-energy CPI, Cleveland trimmed mean, Atlanta sticky CPI + supercore. Trimmed-mean chart is the cleanest."}, "link": "https://www.bloomberg.com/opinion/newsletters/2026-10-15/hot-inflation-isn-t-playing-along-with-trump"}, {"id": 4, "cat": "labor", "urgency": "deep", "source": "Bloomberg — John Authers (Points of Return)", "title": "Bottom-quartile wages now growing slower than headline inflation", "idea": "Pay for the lowest-paid 25% grew more slowly last month and is now below headline inflation. Authers flags it as increasingly salient politically ahead of the midterms, and says it makes cutting rates (as Trump wants) harder still.", "angle": "Real-wage squeeze at the bottom plus 3.7% CPI is the midterm setup. Policy intervention risk rises.", "tweetA": "Bottom-quartile wages are now lagging 3.7% CPI. That's the number that decides the midterms, not the S&P. Expect price-control style 'interventions' before November.", "tweetB": "A Fed that can't cut, a president who wants cuts, and the lowest-paid quartile losing real income. Something gives by November and it's probably not the Fed.", "charts": {"count": 1, "hot": false, "desc": "Wage growth by income quartile vs CPI."}, "link": "https://www.bloomberg.com/opinion/newsletters/2026-10-15/hot-inflation-isn-t-playing-along-with-trump"}, {"id": 5, "cat": "culture", "urgency": "watch", "source": "Bloomberg — John Authers (Points of Return)", "title": "College tuition finally rising faster than inflation again; spirits deflating at fastest pace in 20+ years", "idea": "Tuition had grown below inflation since the pandemic, until this CPI. Authers: colleges can no longer sit on accumulated costs. Meanwhile distilled spirits (ex-whiskey) are deflating at the fastest rate in more than two decades.", "angle": "Education cost catch-up is a middle-class affordability signal. Spirits deflation looks like a demand story (GLP-1, Gen Z drinking less).", "tweetA": "Tuition is back to outrunning CPI after years of lagging it. Colleges ate costs for years and just stopped. Add it to the middle-class affordability stack next to rent and insurance.", "tweetB": "Spirits prices are falling at the fastest pace in 20 years. Nobody calls that a disinflation story because it's a demand story. $STZ $DEO would tell you the same thing in different words.", "charts": {"count": 2, "hot": false, "desc": "Tuition CPI vs headline; distilled spirits CPI."}, "link": "https://www.bloomberg.com/opinion/newsletters/2026-10-15/hot-inflation-isn-t-playing-along-with-trump"}, {"id": 6, "cat": "geopolitics", "urgency": "deep", "source": "Bloomberg — John Authers (Points of Return)", "title": "China exports +36% y/y while consumers shrink spending; trade surplus tracking above last year's record $1.2T", "idea": "Chinese exports soared 36% y/y in September. Golden Week spending fell vs two years ago, consumer confidence disappointed, and the CSI 300 is down nearly 20% since June. Even exporting tech and industrial firms have disappointed: export strength is not reaching private sector profits.", "angle": "Dumping narrative gets ammunition: record volume with no profits. Disinflation export to everyone else.", "tweetA": "+36% exports, CSI 300 down ~20% since June. China is winning the trade war on volume and losing it on profit. That's what dumping looks like on a P&L, and Brussels can read it.", "tweetB": "A $1.2T+ surplus with weak domestic demand is a deflation pipeline pointed at Europe. Germany and France are already asking for caps. This is the next trade fight, not the US one.", "charts": {"count": 3, "hot": true, "desc": "China exports, CSI 300 vs consumer confidence, and corporate profits charts. Exports +36% vs equities -20% is the divergence chart."}, "link": "https://www.bloomberg.com/opinion/newsletters/2026-10-15/hot-inflation-isn-t-playing-along-with-trump"}, {"id": 7, "cat": "geopolitics", "urgency": "deep", "source": "Bloomberg — John Authers (Points of Return)", "title": "China's financing advantage: yields now below Treasuries, a self-reinforcing export loop", "idea": "China's bond yields have flipped below Treasuries, reversing a decades-long pattern. Lower yields support domestic activity, weaken the yuan and make exports cheaper in dollar terms. Absent a major shock the edge should be hard to dislodge. Analyst Presnick: priorities are consumption third, growth second, industrial dominance first, a hub-and-spoke model with China as R&D, capital, and automation provider.", "angle": "China cost of capital is below the US with US 10Y at 5.2%. That's a structural export subsidy.", "tweetA": "The 10Y is at 5.2% and China borrows for less than the US Treasury does. Cheap capital, cheaper yuan, 36% export growth. That's an industrial policy running on a rate differential.", "tweetB": "Presnick says the order is industrial dominance, growth, then consumption. Stop waiting for the Chinese consumer stimulus. The playbook isn't a consumer one.", "charts": {"count": 1, "hot": false, "desc": "China sovereign yield vs US Treasury yield chart."}, "link": "https://www.bloomberg.com/opinion/newsletters/2026-10-15/hot-inflation-isn-t-playing-along-with-trump"}, {"id": 8, "cat": "geopolitics", "urgency": "deep", "source": "Bloomberg — John Authers (Points of Return)", "title": "G7 share of China's exports fell to 23% from 48% in 2000; Southeast Asia is now the largest market", "idea": "Rothman: in 1Q-3Q 2026 the G7 took 23% of Chinese exports, versus 48% in 2000 before the WTO. Southeast Asia is now Beijing's biggest market. This weakens Washington and Brussels' leverage. China's household savings have doubled since 2020, which explains no urgency to stimulate: confidence is the missing input.", "angle": "Tariff leverage is eroding as trade reroutes. A doubled savings pile is a latent consumer wave if confidence returns.", "tweetA": "G7 share of China's exports: 48% in 2000, 23% now. Tariffs are being fought on a map that has already moved. Southeast Asia is the real counterparty.", "tweetB": "Chinese household savings doubled since 2020. When confidence returns, that is a consumption release no Western model prices. The trigger isn't stimulus, it's entrepreneurs feeling safe.", "charts": {"count": 2, "hot": false, "desc": "G7 share of China exports; EU goods deficit with China ($34.8B in Sept, +20% y/y)."}, "link": "https://www.bloomberg.com/opinion/newsletters/2026-10-15/hot-inflation-isn-t-playing-along-with-trump"}, {"id": 9, "cat": "positioning", "urgency": "now", "source": "Bloomberg — John Authers (Points of Return)", "title": "Nasdaq 100 -2.02%, worst day since July; Kospi -7.8% intraday; chip sell-off spills over from Asia", "idea": "Nasdaq 100 lost 2.02% on CPI day, with a 'brutal' Asian follow-through: Kospi -7.8% at time of writing, chipmakers worst. A Fed hike next month is a coin-flip per Authers; stocks outside the AI-boosted group are the ones that make the Fed stay its hand.", "angle": "Kospi -7.8% is a semi-memory-cycle signal. Korea is the cleanest high-beta proxy for AI hardware.", "tweetA": "Kospi -7.8% in a session. That isn't an inflation print reaction, that's the memory trade being repriced. Watch what $MU and $SK Hynix do when the US wakes up.", "tweetB": "Worst Nasdaq day since July, and the SPX is still within ~2% of its high. Under the surface it's already a bear market in breadth. The index is the last thing to find out.", "charts": {"count": 1, "hot": false, "desc": "Nasdaq 100 vs US 10Y yield, CPI day."}, "link": "https://www.bloomberg.com/opinion/newsletters/2026-10-15/hot-inflation-isn-t-playing-along-with-trump"}, {"id": 10, "cat": "macro", "urgency": "deep", "source": "MacroEdge — Don / Six / John (Ozone)", "title": "Energy is leaking into services: car rentals +5.4%, hotels +2%, airfares +1.2%", "idea": "Six: higher energy prices pass through to services. Car and truck rentals +5.4%, hotels +2%, airfares +1.2%, transportation services +0.6%. Beige Book: higher energy costs affect every district, diesel costs moving through supply chains, with more cost increases expected as contracts expire and hedges roll off.", "angle": "Hedge roll-off is a timing risk. The second wave arrives in Q4/Q1 contracts, so CPI hits aren't done.", "tweetA": "Beige Book: 'hedges fall off' is the line to underline. Airlines and rental fleets locked prices earlier this year. As those contracts roll, the pass-through gets bigger, not smaller.", "tweetB": "Car rentals +5.4% in a month. That's the CPI the Fed can't fix with rates, and it's the one that lands directly on the lower 90% of earners.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.macroedge.world/p/strategy-note-more-interventions"}, {"id": 11, "cat": "positioning", "urgency": "now", "source": "MacroEdge — Don / Six / John (Ozone)", "title": "Long semis and short bonds are the #1 and #2 most crowded trades (BofA FMS), and both are unwinding at once", "idea": "Six: the most important datapoint was that bonds round-tripped their decline while stocks did not. US10Y rose 10bp+ then fell on the day while stocks slid all day. Long semis and short bonds are the first and second most crowded trades in the BofA Fund Manager Survey, and both appear to be unwinding simultaneously. Bond futures rallying hard overnight.", "angle": "Both crowded trades unwinding together is a deleveraging signature. Positioning, not macro, is driving it.", "tweetA": "Most crowded: #1 long semis, #2 short bonds. Both unwinding the same day. That's not a view change, that's a risk-budget cut. Gross comes down, correlations go to one.", "tweetB": "Bonds round-tripped, stocks didn't. In a normal CPI shock those two move together. The break in correlation is the first sign the old 'yields up, stocks up' regime is cracking.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.macroedge.world/p/strategy-note-more-interventions"}, {"id": 12, "cat": "AI/infra", "urgency": "now", "source": "MacroEdge — Don / Six / John (Ozone)", "title": "Anthropic 3Q26 ARR report 'fell short'; AI trade's second derivative is decelerating", "idea": "Six: Anthropic's 3Q26 ARR report missed expectations with a substantial deceleration in growth rate, landing in a bleak AI tape while the indices are still less than 2% off highs. Their Flagship returned 1.8% on the day thanks to SMH and EWY shorts (put on Friday) and PFE LEAP calls. Also 3 Fed hikes are in the forward curve.", "angle": "The market pays for growth rate of growth. A deceleration at the leading lab hits every capex name through the supply chain.", "tweetA": "ARR misses at Anthropic, revenue shock at OpenAI on Oct 8. Two labs, two decelerations in a week. The capex story needs the second derivative to hold, and it's not holding.", "tweetB": "3 hikes in the forward curve and the AI trade decelerating. SMH and EWY shorts working. The question isn't whether AI is real, it's whether it's real at 5.2% discount rates.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.macroedge.world/p/strategy-note-more-interventions"}, {"id": 13, "cat": "geopolitics", "urgency": "deep", "source": "MacroEdge — Don / Six / John (Ozone)", "title": "Korea 'pulverized'; Don expects emergency measures from foreign governments before the midterms", "idea": "Don: Asia, namely Korea, 'continues to get pulverized'. He expects emergency measures to be announced by foreign governments to quell drawdowns, especially in this pre-midterm period, in a world reliant on equities melting up against declining real hourly earnings for the lower 90%.", "angle": "Short-sale bans / stabilisation funds in Korea would be the tell. Intervention headlines are an event-risk for shorts.", "tweetA": "Kospi -7.8% and a lot of people are going to ask who blinks. History says Seoul bans short-selling or announces a stabilization fund within days. If you're short $EWY, that headline is the risk.", "tweetB": "An equity market that has to go up because the bottom 90% are losing real income is not a market, it's a political requirement. Interventions will come, and they'll be priced as bullish for about a day.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.macroedge.world/p/strategy-note-more-interventions"}, {"id": 14, "cat": "energy", "urgency": "now", "source": "MacroEdge Oil & Gas Research — DJ", "title": "UAE container ship hits sea mine on Hormuz southern route; MOAB vs IRGC under consideration", "idea": "DJ: a container ship out of the UAE hit a sea mine transiting the southern route in the Strait this morning. The Trump Administration is exploring using the 'MOAB' against IRGC forces. Oil/product flows through Hormuz are tightening, the blockade is becoming 'untenable' for Iran, and a 'flare moment' is likely approaching. He expects Iran to blink.", "angle": "A mine strike on the southern route means the alternate corridor is also compromised, which hits insurance and freight, not just crude.", "tweetA": "A container ship hit a sea mine on the southern Hormuz route. That was the 'safe' lane. War-risk premiums and freight reprice before crude does. Watch tanker rates, not just Brent.", "tweetB": "MOAB vs the IRGC doesn't move the needle, says DJ. I'd argue the opposite: a public escalation ladder tells you the diplomatic route is closed, and the market is still pricing an off-ramp.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://macroedgeenergy.substack.com/p/macroedge-oil-and-gas-research-strategy-082"}, {"id": 15, "cat": "energy", "urgency": "deep", "source": "MacroEdge Oil & Gas Research — DJ", "title": "CLZ27 candle, $87 invalidation, and $80-82 'defended': higher-for-longer regime", "idea": "DJ: the Dec-2027 contract printed a candle that suggests heavy lifting on the front-end of the curve. The pattern invalidates below ~$87/bbl. $80-82 continues to look defended, with 'record demand across the board' subsidized by politicians, so he sees little Q4 demand destruction risk. Chinese crude imports are on a gentle recovery.", "angle": "A long-dated candle in a backwardated market tells you the back end is repricing the regime, not the front.", "tweetA": "The Dec-2027 contract is the one to watch. The back of the curve repricing higher means the market is starting to believe 'higher for longer', not 'spike and revert'.", "tweetB": "Everyone is staring at AI. Energy gets ignored. DJ calls that the opportunity. Meanwhile oil is staying correlated with yields, which means the 10Y matters for crude now.", "charts": {"count": 2, "hot": false, "desc": "CLZ27 chart with the candle circled; Chinese crude imports chart. Charts inside, worth opening."}, "link": "https://macroedgeenergy.substack.com/p/macroedge-oil-and-gas-research-strategy-082"}, {"id": 16, "cat": "energy", "urgency": "watch", "source": "MacroEdge Oil & Gas Research — DJ", "title": "'Do Americans at QT and Costco know they're indirectly energy bulls?'", "idea": "DJ: demand at all-time highs, 'relentless appetite' for crude, jet fuel, gasoline and diesel, subsidized by politicians worldwide. 1H 2027 price forecasts go to clients in ~8 days.", "angle": "A reminder that US consumer behavior is the demand side of the trade.", "tweetA": "Every driver filling up at Costco is long crude by revealed preference. Price inelasticity is the whole thesis. Demand destruction needs a lot more than $90.", "tweetB": "The energy market keeps pricing elasticity that the consumer doesn't have. Subsidies, SPR, and politics all flatten the demand curve at exactly the wrong time.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://macroedgeenergy.substack.com/p/macroedge-oil-and-gas-research-strategy-082"}, {"id": 17, "cat": "macro", "urgency": "deep", "source": "The Dark Side of the Boom", "title": "The OpenAI Tell: on Oct 8 Nasdaq fell and Treasury yields FELL too, the first sign bonds can hedge the AI unwind", "idea": "BofA's Bowler, Saksena, Goyal: the Oct 8 OpenAI revenue shock gave a clean preview of an AI unwind with Nasdaq selling off while yields fell rather than rose. 2026 has been an equities-down, yields-up market. If an AI slowdown hits capex, growth and resource demand, duration may start behaving like a hedge again.", "angle": "The correlation regime flips from inflation-driven to growth-driven if AI is the marginal story. Today's round-trip fits the pattern.", "tweetA": "Oct 8: OpenAI revenue shock, Nasdaq down, yields down. Oct 14: hot CPI, 10Y up then back down, Nasdaq -2%. Twice in a week bonds refused to sell off with stocks. Is duration the hedge again?", "tweetB": "If AI is what breaks first, bonds hedge it. If inflation is, they don't. The market just ran both tests in one week and the answer was the same.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/the-openai-tell-when-the-ai-trade"}, {"id": 18, "cat": "positioning", "urgency": "deep", "source": "The Dark Side of the Boom", "title": "Dealer gamma masking the real vol: BofA bubble indicator below 1990s peak, VIX calls rising while realized vol is compressed", "idea": "BofA's Bubble Risk Indicator shows much less broad-based froth than the late-1990s peak, but unusually high dealer gamma may be making the index look calmer than the underlying market. VIX call positioning is rising even as realised vol is compressed, leaving the market exposed to a larger mechanical vol response if the gamma cushion weakens.", "angle": "Index vol being suppressed by gamma while single stocks and breadth are deteriorating is the classic setup for a vol gap.", "tweetA": "Index looks calm, breadth is falling apart. High dealer gamma is why. When it flips, the index doesn't drift lower — it gaps. VIX calls being bid tells you someone else sees it.", "tweetB": "Low froth reading, high gamma. 'Not 1999' is a fair statement, but it's the wrong comparison: 1999 had no dealer gamma pin. This time the calm is mechanical.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/the-openai-tell-when-the-ai-trade"}, {"id": 19, "cat": "credit", "urgency": "now", "source": "The Dark Side of the Boom", "title": "CoreWeave 2032 bonds below 80c, yields mid-teens; borrowing ~9% against returns 'materially below that'", "idea": "CoreWeave's 2032 unsecured debt has traded below 80 cents with yields pushing into the mid-teens, distressed territory. The author's arithmetic: borrowing around 9% and earning returns materially below that means scale magnifies the problem. Demand is real; the economics are the issue. Credit is giving the first vote on survival before equity listens.", "angle": "Neocloud leverage is the weak link in the AI capex chain. $CRWV credit is the AI-capex canary, and it's chirping.", "tweetA": "CoreWeave 2032s under 80, yield mid-teens. Equity still prices the dream, credit prices the liability stack. When they disagree, credit has historically been right and early.", "tweetB": "Do the math: if you borrow at 9% and earn less than that on GPUs, growing faster just loses money faster. At 15% on the unsecured, the flywheel is a treadmill with the incline on max.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/coreweave-the-ai-boom-meets-the-price"}, {"id": 20, "cat": "credit", "urgency": "deep", "source": "The Dark Side of the Boom", "title": "Maturity mismatch and 'the subprime tranche of AI': capital markets become the governor on AI capex", "idea": "Long-lived data-centre obligations financed against shorter customer contracts works while compute is scarce; scarcity attracts capital and supply, and the customer then gets to shop around. A feedback loop: wider spreads → higher funding costs → weaker project economics → lower equity prices → more cautious lenders. The marginal project stops clearing the hurdle rate; compute demand need not collapse.", "angle": "The AI boom's brake isn't demand, it's the hurdle rate. Spreads set the speed limit.", "tweetA": "You don't need AI demand to fall to slow the buildout. You need the marginal data centre's return to fall below its cost of capital. At a 5.2% 10Y and 15% on CoreWeave paper, it's closer than the capex guidance says.", "tweetB": "Hyperscalers fund from cash flow. Neoclouds fund from the bond market. When the 10Y is 5.2%, those two sets of companies are not in the same business anymore.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/coreweave-the-ai-boom-meets-the-price"}, {"id": 21, "cat": "AI/infra", "urgency": "deep", "source": "Michael Parekh — AI Reset (AI-RTZ #1240)", "title": "Microsoft's Copilot pivots to 'the Costco of AI': a model router, 30M+ corporate users, and >$2B/yr paid to Anthropic", "idea": "Charles Lamanna, who won Nadella over by showing Anthropic models beat OpenAI's on Excel math and PowerPoint, now runs Office+Copilot. Corporate Copilot users more than doubled YTD to 30M+. A homegrown LLM-based router picks the cheapest model that does the job; Microsoft is still on track to pay Anthropic >$2B per year. 'Model monogamy' was called dangerous.", "angle": "Router = the margin layer. Whoever routes owns the customer; model makers become commodities with volume discounts.", "tweetA": "Microsoft will pay Anthropic >$2B a year and built a router so it can pay less. The router is the moat. The labs are the suppliers. Costco doesn't make the cereal.", "tweetB": "30M corporate Copilot users, up 2x YTD, and the CIO of National Life says most employees still use ChatGPT. Seats ≠ usage. That's the metric nobody reports.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/ai-microsofts-copilot-evolving-to"}, {"id": 22, "cat": "AI/infra", "urgency": "deep", "source": "Michael Parekh — AI Reset (AI-RTZ #1240)", "title": "15M paid Copilot seats vs 450M Office 365 users; Microsoft owns ~27% of OpenAI and is also a rival to both labs", "idea": "Parekh: ~15M paid Copilot seats (Jan) against 450M+ Office 365 users shows runway and the sales job ahead. Microsoft owns ~27% of OpenAI, has IP rights into the 2030s and a $250B Azure commitment, while OpenAI sells ChatGPT Enterprise to the same customers. Every task routed to someone else's model is a cost, not a margin.", "angle": "~3% penetration of the seat base. Margin risk comes from routing to third-party models.", "tweetA": "15M of 450M. About 3% penetration after three years. The AI revenue debate is about whether that number is 3% or 30% in 2028, and nobody has the data.", "tweetB": "Microsoft owns 27% of OpenAI, pays Anthropic $2B+, and competes with both. It's the only company long and short the AI labs in the same quarter.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/ai-microsofts-copilot-evolving-to"}, {"id": 23, "cat": "culture", "urgency": "watch", "source": "Michael Parekh — AI Reset (AI-RTZ #1240)", "title": "Succession: Nadella is bringing Lamanna and other execs to quarterly board meetings", "idea": "Nadella has been CEO since 2014. He's bringing a handful of executives (Lamanna, Jacob Andreou, Asha Sharma, Hayete Gallot, Arun Ulag) to quarterly board meetings, which senior execs read as introducing the board to potential successors. Lamanna, 38, started as an intern; asked about becoming CEO again, 'in the abstract, yes.'", "angle": "The successor is an ex-intern from the cloud/apps side who pushed multi-model against internal opposition. A different Microsoft.", "tweetA": "Nadella is bringing five executives to board meetings. That's not a coincidence, that's a bench. The candidate who won an internal fight by paying a competitor $2B a year is not a loyalist to the old OpenAI deal.", "tweetB": "A 38-year-old who called single-model dependence 'dangerous' and won. If he's next, $MSFT's AI strategy gets less OpenAI and more router.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/ai-microsofts-copilot-evolving-to"}, {"id": 24, "cat": "positioning", "urgency": "now", "source": "Eliant's Exploits — Eliant Capital", "title": "Nasdaq -380bp on the week, Dow +90bp: growth/momentum to value/low-vol rotation, and a 'mini VaR shock'", "idea": "Eliant: after two of the lowest-volume sessions on record for indices, CPI triggered a mini VaR shock with dollar and bonds bid alongside defensives, and almost everything else sold indiscriminately. Nasdaq is the week's worst major index (-3.8%), Dow the best (+0.9%), as Growth/Momentum factors are the worst performers and Value / low-vol the best.", "angle": "A 470bp Nasdaq-Dow spread in 3 days is a factor crash, not a macro move.", "tweetA": "Nasdaq -3.8%, Dow +0.9% in three sessions. 470bp of spread in a week where the index barely moved. Factor rotation is doing all the work.", "tweetB": "Two of the lowest-volume days on record, then a VaR shock. Low vol begets leverage, leverage begets this. Same story as every vol-compression unwind.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.eliantcapital.com/p/hysteria-everywhere"}, {"id": 25, "cat": "positioning", "urgency": "deep", "source": "Eliant's Exploits — Eliant Capital", "title": "Breadth reset: 31% above 20D, 25% above 50D, Fear-Greed near 'Extreme Fear' with SPX only 160bp from ATH", "idea": "% of stocks above the 20-day fell back to 31% (oversold, not extreme); % above the 50-day is near 25%. Fear-Greed is firmly in 'Fear' and encroaching on 'Extreme Fear' while the S&P is 160bp from its all-time high; even 'the generals' are getting dragged lower.", "angle": "Sentiment at fear levels with the index at highs is a divergence. Either index catches down or breadth rebounds.", "tweetA": "SPX 160bp from highs. Fear-Greed near Extreme Fear. 25% of stocks above their 50D. One of those three is wrong, and it's usually the index.", "tweetB": "Fear readings with the index at highs usually mean the index leaders haven't broken yet. When the generals go, the fear reading validates itself.", "charts": {"count": 1, "hot": true, "desc": "Fear-Greed index overlaid with the S&P 500. 🔥 divergence chart."}, "link": "https://www.eliantcapital.com/p/hysteria-everywhere"}, {"id": 26, "cat": "culture", "urgency": "watch", "source": "Eliant's Exploits — Eliant Capital", "title": "YTD basket leaders: security stack, agentic economy, US industrial sovereignty; laggards: gaming & media, global marketplace, housing", "idea": "Eliant's Plutus baskets, YTD best: 1) Mission Critical Security Stack 2) Agentic Economy 3) Rebuilding U.S. Industrial Sovereignty 4) Industrial and Auto Analog Recovery 5) AI Medicine Stack. Worst: 1) Gaming & Media 2) The Global Marketplace 3) Make Housing Great Again.", "angle": "YTD winner themes = cyber, agents, reshoring. Losers = consumer discretionary, rate-sensitive housing, consumer platforms.", "tweetA": "YTD winners: security, agents, reshoring, analog. Losers: gaming, marketplaces, housing. That's a portfolio of 'things that survive 5% yields' vs 'things that need cheap money'.", "tweetB": "Housing is the worst basket at a 5.2% 10Y and the market is surprised? The mortgage rate is the story. The loser list reads like a rate-sensitivity ranking.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.eliantcapital.com/p/hysteria-everywhere"}, {"id": 27, "cat": "crypto", "urgency": "deep", "source": "Checkonchain — Checkmate", "title": "Strategy (MSTR) vs Strive (ASST): defensive vs aggressive treasury balance sheets and mNAV expansion", "idea": "Checkmate rebuilt his treasury-company data pipeline after the July $58k BTC low, focusing on MSTR (the 'gorilla') and ASST (one of the fastest out of the gate). He compares their defensive vs aggressive balance-sheet strategies and argues mNAV expansion/contraction is the critical metric to track as this bull run progresses. Premium paywall for the charts and video.", "angle": "mNAV is the reflexivity dial for treasury cos. Different balance sheets = different convexity to BTC.", "tweetA": "MSTR and ASST started this cycle with opposite balance-sheet philosophies. In a 5.2% 10Y world the difference isn't strategy, it's cost of capital. mNAV is a credit spread in disguise.", "tweetB": "BTC bottomed at $58k in July and treasury cos are the levered way to own it. But mNAV expansion needs cheap equity issuance, and the Nasdaq just fell 2%. Watch mNAV before BTC.", "charts": {"count": 0, "hot": false, "desc": "Premium charts inside — worth opening."}, "link": "https://newsletter.checkonchain.com/p/divergent-treasury-strategies"}, {"id": 28, "cat": "macro", "urgency": "watch", "source": "BowTied Bull", "title": "'Inflation came in hot, AI growth cooling': Q4 pull-down may be coming", "idea": "BowTied Bull sees a Q4 pull-down possibly starting, with hot inflation and an 'AI slowdown'. He will reiterate his strategy and where he sees opportunity, with purchases due Friday and a paid post with updated numbers. Body is mostly paywalled.", "angle": "Another voice calling the same two pivots (CPI + AI deceleration) as MacroEdge and Dark Side. Retail/crypto-adjacent sentiment is turning.", "tweetA": "Retail newsletters are now writing 'Q4 pull down' headlines. When the Substack macro crowd starts writing the same sentence, positioning is already short.", "tweetB": "Hot CPI plus AI cooling is the two-sided squeeze: inflation hurts the discount rate, AI cooling hurts the numerator. I haven't seen a clean hedge for both except cash.", "charts": {"count": 0, "hot": false, "desc": "Paywalled; charts likely inside."}, "link": "https://bowtiedbull.io/p/inflation-came-in-hot-ai-growth-cooling"}, {"id": 29, "cat": "positioning", "urgency": "deep", "source": "Campbell Ramble — Punter Portfolio Book v001", "title": "A low-vol book: 2.6% vol, 2/10 conviction, short 14% stocks, long 4% commodities, long 4% bonds", "idea": "The author's reset book: 12 positions across 5 themes (mostly spreads, so ~5 trades). Runs at about a fifth of equity-market vol, deliberately: 'protection first'. This time he publishes the greeks and the daily cost to hold, not just tickers. The prior book was 125% net long agricultural call options. He just did a week-plus road trip and saw 'lots of potential for reindustrialization'.", "angle": "A practitioner explicitly choosing 2/10 conviction and net short stocks into a vol shock. Greeks-first disclosure is a good template for my own risk posts.", "tweetA": "A book at 2.6% vol, 2/10 conviction, short 14% stocks and long bonds and commodities. The most honest portfolio disclosure is the one that says 'I don't know yet'. Publish the greeks, not the thesis.", "tweetB": "Last book: 125% net long ag calls and 'sleeping fine'. This one: a fifth of equity vol, protection first. It took one hot CPI for the risk appetite of a whole newsletter ecosystem to flip.", "charts": {"count": 0, "hot": false, "desc": "Risk report/greeks inside — worth opening."}, "link": "https://www.campbellramble.ai/p/punter-portfolio-book-v001"}, {"id": 30, "cat": "science", "urgency": "watch", "source": "Substack Notes — a16z crypto", "title": "OpenAI math results sparked 'crypto is broken' FUD; Stanford's Dan Boneh says they contained no cryptography results", "idea": "a16z crypto note quoting Boneh: 'This is incredible progress in mathematics, in computer science, but there are no questions here on cryptography.' The note frames the social-media warnings about AI breaking crypto as FUD, from a conversation with the Stanford cryptographer.", "angle": "AI-breaks-crypto is a recurring narrative risk for BTC/ETH. Expert pushback matters for a fast narrative cycle.", "tweetA": "AI math results ≠ broken cryptography, says Dan Boneh. But the narrative will outrun the clarification. Every AI capability jump will keep producing a 'Bitcoin is dead' thread for the next few years.", "tweetB": "Quantum was the last FUD cycle, AI math is the next. Notice who is saying it's FUD: the ones with no BTC risk are the ones calling it a threat.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://substack.com/@a16zcrypto/note/c-358513509"}, {"id": 31, "cat": "crypto", "urgency": "watch", "source": "Substack Notes — Michael Howell (Capital Wars)", "title": "'If it's time for bonds again, could it be worth adding Bitcoin to the watch list?'", "idea": "Howell, a liquidity-flow analyst, notes that if duration is becoming attractive again, BTC may belong on the list as well. A one-line note, 18 likes, but it ties the BTC story to the liquidity cycle rather than to equity beta.", "angle": "Bonds bid + liquidity inflecting is the BTC setup in Howell's framework. Opposite to the 'BTC trades like Nasdaq' view.", "tweetA": "Howell: if it's time for bonds, add Bitcoin to the watch list. 10Y at 5.2% and bonds finally showing buyers. Liquidity, not beta, is the driver.", "tweetB": "Today stocks fell, bonds round-tripped, BTC is a liquidity asset. If the long end rallies from 5.3%, the liquidity impulse restarts. That's the trade, not the AI one.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://substack.com/@capitalwars/note/c-358938349"}];

var COL={macro:"#e24b4a",credit:"#378add",positioning:"#ef9f27","AI/infra":"#1d9e75",crypto:"#7f77dd",geopolitics:"#d85a30",energy:"#f97316",tech:"#06b6d4",gold:"#d4a017",culture:"#ec4899",labor:"#8b5cf6",regulation:"#64748b",science:"#14b8a6",venture:"#84cc16"};

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}
function setC(c){fc=c;fs=null;render(true);}

function filterBySrc(n){fs=n;fc="all";fu="all";render(false);document.querySelectorAll('.card').forEach(function(c){c.classList.add('open');});}
function tog(id){document.getElementById('c'+id).classList.toggle('open');}
function pills(){
  var cats=[],cnt={};ITEMS.forEach(function(i){cnt[i.cat]=(cnt[i.cat]||0)+1;if(cats.indexOf(i.cat)<0)cats.push(i.cat);});
  var h='<span class="pill'+(fc==="all"?' on':'')+'" style="'+(fc==="all"?'background:#222':'')+'" onclick="setC(\'all\')">All '+ITEMS.length+'</span>';

  document.getElementById('ub').innerHTML=u;
}

  ITEMS.forEach(function(item){
    if(fc!=="all"&&item.cat!==fc)return;if(fu!=="all"&&item.urgency!==fu)return;
    if(fs&&item.source.indexOf(fs)<0)return;

    h+='<div class="card" id="c'+item.id+'"><div class="hd" onclick="tog('+item.id+')"><span class="num">#'+item.id+'</span><span>'+UE[item.urgency]+'</span><span class="src" style="background:'+col+'">'+esc(item.source)+'</span><span class="tag">'+esc(item.cat)+'</span>'+(item.charts.count?'<span>'+(item.charts.hot?'🔥':'📊')+'</span>':'')+'<span class="ttl">'+esc(item.title)+'</span></div><div class="bd">';

    h+='<div class="tw"><div><div class="lbl" style="color:#378add;margin-top:0">Tweet A</div>'+esc(item.tweetA)+'<br><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button></div>';
    h+='<div><div class="lbl" style="color:#7f77dd;margin-top:0">Tweet B</div>'+esc(item.tweetB)+'<br><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div></div>';
    if(item.charts.count||item.charts.desc){h+='<div class="chart'+(item.charts.hot?' hot':'')+'">'+(item.charts.hot?'🔥 CHART WORTH SAVING · ':'📊 ')+(item.charts.count?item.charts.count+' chart(s) — ':'')+esc(item.charts.desc)+'</div>';}
    h+='<div style="margin-top:10px"><a href="'+esc(item.link)+'" target="_blank">↗ Read full article</a></div></div></div>';
  });
  document.getElementById('list').innerHTML=h||'<p>No items.</p>';
}
function init(){
  document.getElementById('sub').textContent=META.date+' · '+META.time+' · '+ITEMS.length+' items';
  var r='<p><b>Window:</b> '+META.windowStart+' to '+META.windowEnd+'. Emails outside this window were not processed.</p><p>Emails in window: '+META.emailsInWindow+' · read: '+META.emailsRead+' · items: '+META.itemsExtracted+'</p><p>'+esc(META.note)+'</p><p><b>Included sources</b> (click to filter):</p><ul>';

  META.skippedSources.forEach(function(s){r+='<li>'+esc(s.name)+': '+esc(s.reason)+'</li>';});
  r+='</ul>';document.getElementById('rb').innerHTML=r;
  document.querySelectorAll('.sl').forEach(function(e){e.onclick=function(){filterBySrc(e.getAttribute('data-s'));};});
  render();
}
