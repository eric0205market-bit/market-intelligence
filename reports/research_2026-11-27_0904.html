const ITEMS = [{"cat": "tech", "urgency": "act", "source": "AI-RTZ #1283 / Michael Parekh — SpaceX + Tesla Mega-Merger Roadmap", "title": "SpaceX/xAI ($1.75T) + Tesla ($1.55T) = $3.3T+ all-stock merger targeted by year-end", "idea": "Per the FT (via Parekh), bankers are modelling an all-stock deal: Morgan Stanley and Goldman for SpaceX, Evercore for Tesla. At current prices it would form a $3.3T+ company (FT: about $3.5T). The target is to agree terms by year-end. A source says there is 'more friction than people assume' and the committees 'aren't close yet'. Overlaps: AI models, chip design, data centres. Additive: rockets, robots, solar.", "angle": "This could be the largest M&A deal ever, and it changes what an index holder of $TSLA owns. Within weeks, TSLA's risk shifts from autos/robotaxi to the rocket + frontier-model cash burn.", "tweetA": "A $3.3T merger, and neither side has to raise a dollar of cash. All-stock deals between two richly valued companies are really a vote on which multiple survives. Tesla at ~400x earnings versus SpaceX/xAI at whatever the June IPO crowd paid. $TSLA", "tweetB": "If SpaceX/xAI absorbs Tesla, every S&P 500 index fund suddenly owns a rocket company, a frontier AI lab and a robotaxi bet in one ticker. That's the passive-flow story nobody is modelling yet. $TSLA $SPY", "charts": {"count": 1, "hot": true, "desc": "Opening animation: two 'planets' (SpaceX+xAI moon at $1.75T, Tesla at $1.55T) merging into $3.3T, with Elon's voting-share bars underneath"}, "link": "https://michaelparekh.substack.com/p/ai-spacex-tesla-the-mega-merger-roadmap", "id": 1}, {"cat": "regulation", "urgency": "deep", "source": "AI-RTZ #1283 / Michael Parekh — SpaceX + Tesla Mega-Merger Roadmap", "title": "Same 32% stake gives 74% of votes under SpaceX rules, 32% under Tesla rules", "idea": "Elon owns ~42% of SpaceX stock but holds ~84% of its votes through 10-vote Class B shares. At Tesla he has ~20% of both stock and votes. In a combined company he would own  thing about the Tesla–SpaceX ratio: swing it ±20% and Elon's control hardly moves. The only people the ratio really matters to are the 20% of Tesla owned by retail. They're the swing vote, and they think TSLA is worth more than the market does.", "tweetB": "53/47 at market. Retail owns ~1/5 of $TSLA and needs >50% of ALL shares outstanding. Abstentions count as NO. This deal doesn't need to win the argument. It needs turnout from a retail base that never reads proxies.", "charts": {"count": 1, "hot": false, "desc": "Three-scenario bar chart: market (53/47), Tesla +20% premium (Tesla majority), Tesla −20% discount (~60/40), with Elon's cut alongside"}, "link": "https://michaelparekh.substack.com/p/ai-spacex-tesla-the-mega-merger-roadmap", "id": 3}, {"cat": "tech", "urgency": "deep", "source": "AI-RTZ #1283 / Michael Parekh — SpaceX + Tesla Mega-Merger Roadmap", "title": "Combined SpaceX/Tesla could burn at least $54B of free cash this year", "idea": "Analysts cited by the FT in October estimated the combined company would burn at least $54B of free cash flow this year. Parekh: 'a merger is a financing story too'. Tesla has far more revenue but thin margins, and trades at ~400x earnings on robotaxi/Optimus hopes.", "angle": "Merging Tesla's balance sheet into SpaceX/xAI gives xAI's compute spending a large, stable cash and equity base. It works more like a funding transaction than a strategic one.", "tweetA": "$54B of annual cash burn, and the fix is to merge with the company that has the auto cash flow and a 400x multiple to issue against. This isn't synergy. It's Tesla's equity being used as xAI's compute budget. $TSLA", "tweetB": "Every AI lab hits the same wall: frontier compute costs more than any VC round. OpenAI went to Microsoft and Oracle, Anthropic went to the IPO market. xAI's answer is to absorb a $1.55T public company it already controls culturally.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/ai-spacex-tesla-the-mega-merger-roadmap", "id": 4}, {"cat": "regulation", "urgency": "watch", "source": "AI-RTZ #1283 / Michael Parekh — SpaceX + Tesla Mega-Merger Roadmap", "title": "Tesla's Dec 3 AGM: ISS and Glass Lewis recommend against re-electing chair Denholm", "idea": "Tesla's annual meeting on December 3 comes before any merger vote. Both proxy advisers oppose re-electing chair Robyn Denholm, who also sits on the special committee negotiating the merger. Past Musk deals (SolarCity 2016, the $56B pay package) led to years of litigation.", "angle": "The vote count on Denholm on Dec 3 previews how Tesla's institutional base will vote on the merger. A weak result tells you the >50% of all shares hurdle is in play.", "tweetA": "Dec 3 is the real merger poll. If Denholm, who is negotiating the SpaceX deal for Tesla holders, barely survives an ISS + Glass Lewis 'against', the special meeting gets a lot harder. $TSLA", "tweetB": "The person negotiating Tesla's side of a $3T merger may be voted down by Tesla's own shareholders a week before terms are due. That isn't a governance footnote. It's a negotiating leverage problem.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/ai-spacex-tesla-the-mega-merger-roadmap", "id": 5}, {"cat": "regulation", "urgency": "deep", "source": "AI-RTZ #1283 / Michael Parekh — SpaceX + Tesla Mega-Merger Roadmap", "title": "'Disinterested' but loyal: all five merger negotiators have long Musk ties", "idea": "SpaceX's committee: Roelof Botha (ex-Sequoia, got his first US job from Musk at PayPal, led Sequoia's $800M into the Twitter buyout) and Randy Glein (DFJ, on SpaceX's board since 2009, ~$800M stake). Tesla's: chair Robyn Denholm, Kathleen Wilson-Thompson (both steered Musk's pay packages) and Jack Hartung (ex-Chipotle CFO). Kimbal Musk and others were excluded as too close. Quote: 'They can't afford to let Elon bulldoze them.'", "angle": "Texas corporate law (both companies have moved there) decides how much deference the committees get. This deal is a live test of Texas's business-court regime after the Delaware exit.", "tweetA": "Five 'independent' directors, each with a Musk history that goes back years, negotiating a $3T deal under Texas law for the first time. This is the test case for whether the Delaware exodus was about efficiency or about weaker shareholder protection.", "tweetB": "Ask the question nobody on either committee is paid to ask: what's the walk-away price? In a deal where everyone at the table owes their career to one man, the special committee is the only check, and it's made of friends.", "charts": {"count": 1, "hot": false, "desc": "Negotiator cards: SpaceX committee (blue) vs Tesla committee (red), bankers and lawyers underneath"}, "link": "https://michaelparekh.substack.com/p/ai-spacex-tesla-the-mega-merger-roadmap", "id": 6}, {"cat": "venture", "urgency": "deep", "source": "AI-RTZ #1283 / Michael Parekh — SpaceX + Tesla Mega-Merger Roadmap", "title": "The mega-AI IPO troika: SpaceX/xAI ($1.77T), Anthropic ($1.2T, $83 IPO), OpenAI ($1.25T private, 2027)", "idea": "SpaceX/xAI listed in June at ~$1.77T. Anthropic priced at $83/share last week in the biggest IPO ever and is worth ~$1.2T. OpenAI is valued at $1.25T in its latest private round and is expected to list in 2027. SpaceX + Tesla combined is about the size of Anthropic + OpenAI together. Closing the merger and the OpenAI IPO may both land in 2027, alongside votes, antitrust reviews in four jurisdictions and a new Congress.", "angle": "The 2027 supply calendar is huge: OpenAI's IPO plus merger share issuance into indices. Absorbing that much new equity is a headwind for AI-adjacent multiples in mega-cap tech.", "tweetA": "Three AI companies worth ~$4.2T will have come to public markets within 18 months. For scale, that's more than the entire listed Japanese tech sector. 2027 needs a lot of buyers. $NVDA $QQQ", "tweetB": "SpaceX+Tesla ≈ Anthropic+OpenAI. The AI trade is consolidating into two blocs: Musk Inc. on one side, the 'safety-branded' labs on the other. Index investors will end up owning both whether they want to or not.", "charts": {"count": 1, "hot": true, "desc": "Troika cards plus bar chart comparing SpaceX/xAI, Anthropic, OpenAI and SpaceX+Tesla combined values"}, "link": "https://michaelparekh.substack.com/p/ai-spacex-tesla-the-mega-merger-roadmap", "id": 7}, {"cat": "macro", "urgency": "deep", "source": "The Dark Side of the Boom / Stephen Innes — Hartnett: Breadth, Bubble or Bust", "title": "Hartnett 2027: breadth, bubble or bust, and AI capex vs earnings vs cost of capital is 'hard to reconcile'", "idea": "Innes summarises BofA's Michael Hartnett's 2027 outlook. Hartnett expects a change in market leadership (toward breadth) but thinks investors must 'endure a little more discomfort' first. He sees three outcomes: breadth, bubble or bust. Beneath the bullish consensus, the link between AI spending, corporate earnings and the cost of capital is getting harder to reconcile. The scenario investors are least prepared for may be the most consequential.", "angle": "Hartnett's breadth call pairs with the equal-weight vs cap-weight trade (RSP/SPY). His 'discomfort first' is consistent with the Nikkei's two AI liquidations this year.", "tweetA": "Every 2027 S&P target assumes AI capex turns into earnings before the cost of capital catches up. Hartnett is the one strategist pricing the third option: it doesn't. Breadth only works if the leaders fall first. $RSP $SPY", "tweetB": "The sell-side's year-ahead targets are precise to 50 points and, historically, wrong by about 500. The useful question for 2027 isn't the level. It's which of breadth/bubble/bust you're NOT hedged for.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening (teaser only in email)"}, "link": "https://thedarksideoftheboom.substack.com/p/bofas-michael-hartnett-grab-the-popcorn", "id": 8}, {"cat": "positioning", "urgency": "act", "source": "The Dark Side of the Boom / Stephen Innes — Japan's Second AI Correction (GS)", "title": "Nikkei down ~20% from its October peak, the second AI-driven liquidation of 2026", "idea": "Japan's second AI correction of 2026 was much more severe than the first. The Nikkei has lost about 20% from its October peak. The same small group of semiconductor and data-centre hardware names drove both sell-offs, which raises the question of how much of Japan's equity performance depends on one theme. Goldman's Tokyo desk thinks the latest lows may be a turning point.", "angle": "Japan is effectively a leveraged AI hardware ETF (Advantest, Tokyo Electron, SoftBank, Fujikura). It is a cleaner read on AI-capex sentiment than the S&P 500.", "tweetA": "The Nikkei has had two 20%-class AI liquidations in one year, driven by the same five tickers both times. Japan isn't a 'governance reform' story anymore. It's a levered NVDA supply-chain trade with a yen overlay. $EWJ $DXJ", "tweetB": "If you want to know whether the AI drawdown is done, don't watch the Nasdaq. Watch Tokyo Electron and Advantest. They fell first, harder, and with more margin debt behind them. $TOELY", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening (GS positioning and sector charts likely)"}, "link": "https://thedarksideoftheboom.substack.com/p/japans-second-ai-correction-may-be", "id": 9}, {"cat": "positioning", "urgency": "watch", "source": "The Dark Side of the Boom / Stephen Innes — Japan's Second AI Correction (GS)", "title": "Foreigners, hedge funds and margin traders have cut exposure, but the liquidation may not be finished", "idea": "Goldman's positioning data show foreign investors, hedge funds and domestic margin traders have all cut Japan exposure. Even so, the data suggest the liquidation may not have run its full course. Innes warns not to 'confuse a potential trading bottom with the resolution of the fundamental questions'.", "angle": "Watch the weekly TSE margin balances and foreign flow data. A trading bottom without a capitulation in margin debt is how bear-market rallies start.", "tweetA": "Three seller groups cut exposure, and Goldman still says positioning isn't clean. When the 'last buyer' is the margin trader and margin debt hasn't capitulated, the bottom is a trade, not a turn.", "tweetB": "The Japan bull case was 'foreigners are underweight'. They just got more underweight, and the market fell 20% anyway. Flow-based bull theses only work when someone is actually buying.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://thedarksideoftheboom.substack.com/p/japans-second-ai-correction-may-be", "id": 10}, {"cat": "AI/infra", "urgency": "watch", "source": "The Dark Side of the Boom / Stephen Innes — Japan's Second AI Correction (GS)", "title": "Buried line: 'Jensen Huang's reinstatement at Nvidia' helped stabilise the global AI complex", "idea": "Innes mentions in passing that Jensen Huang's reinstatement at Nvidia helped stabilise sentiment across the global AI complex. That implies a recent leadership disruption at Nvidia that was then reversed. Along with the Thanksgiving recovery on Wall Street, it is cited as a reason forced selling may be near exhaustion.", "angle": "If Nvidia had a CEO crisis during the AI drawdown, key-person risk is now a priced factor for the whole AI hardware chain, not only NVDA. Verify the details: this is a major event mentioned only in passing.", "tweetA": "Nvidia's CEO got 'reinstated' and it's a subordinate clause in a Japan note. A one-man key-person risk at the world's most important AI supplier just showed up in the price. That premium doesn't fully go away. $NVDA", "tweetB": "Notice what stabilised the Nikkei: not earnings, not the BoJ, but one person's job status in California. That's how concentrated the global AI trade is.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/japans-second-ai-correction-may-be", "id": 11}, {"cat": "positioning", "urgency": "deep", "source": "The Dark Side of the Boom / Stephen Innes — Japan's Second AI Correction (GS)", "title": "Goldman's playbook in the wreckage: earnings quality, less-crowded themes and domestic shareholder support", "idea": "Goldman sees opportunity in Japan where three things offer insulation from more AI volatility: earnings quality, less crowded investment themes, and domestic shareholder support (buybacks and cross-shareholding unwinds).", "angle": "This is a rotation within Japan, away from AI hardware and toward domestic buyback and governance names. It fits Hartnett's broader call for breadth over leadership in 2027.", "tweetA": "Goldman's Japan advice, decoded: own the companies buying back their own stock, not the ones foreigners crowded into. In a liquidation, the only reliable bid is a company's own treasury. $DXJ", "tweetB": "Hartnett says breadth over leaders for 2027. Goldman says the same thing about Tokyo, from the bottom up: quality, uncrowded, domestically owned. Two desks, one rotation.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://thedarksideoftheboom.substack.com/p/japans-second-ai-correction-may-be", "id": 12}];

    h+='<div class="tw"><div class="twb"><div class="twl" style="color:#378add">TWEET A <button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button></div>'+esc(item.tweetA)+'</div>';
    h+='<div class="twb"><div class="twl" style="color:#7f77dd">TWEET B <button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div>'+esc(item.tweetB)+'</div></div>';
    if(item.charts.count>0||item.charts.desc){h+='<div class="chart'+(item.charts.hot?' hot':'')+'">'+(item.charts.count>0?'📊 '+item.charts.count+' chart(s) — ':'')+esc(item.charts.desc)+'</div>';}
    h+='<a class="lnk" href="'+esc(item.link)+'" target="_blank" rel="noopener">↗ Read full article</a></div></div>';
  });
  document.getElementById('cards').innerHTML=h||'<p style="color:#888">No items match.</p>';
}
function init(){
  document.getElementById('sub').textContent=META.date+' · '+META.time+' · '+ITEMS.length+' items';
  var r='<p><b>Window:</b> '+esc(META.windowStart)+' → '+esc(META.windowEnd)+'. Emails outside this window were not processed.<br><span style="color:#888">'+esc(META.timezoneNote)+'</span></p>';
  r+='<p><b>Totals:</b> '+META.emailsInWindow+' emails in window · '+META.emailsRead+' read · '+META.itemsExtracted+' items · '+META.includedSources.length+' sources</p>';
  r+='<div class="lbl">included sources (click to filter)</div><table>';
  META.includedSources.forEach(function(s,ix){r+='<tr><td><span class="sl" onclick="filterBySrc(META.includedSources['+ix+'].name)">'+esc(s.name)+'</span></td><td>'+s.items+'</td></tr>';});
  r+='</table><div class="lbl">skipped</div><table>';
  META.skippedSources.forEach(function(s){r+='<tr><td>'+esc(s.name)+'</td><td>'+esc(s.reason)+'</td></tr>';});
  r+='</table><p style="color:#888;font-size:12.5px">'+esc(META.notes)+'</p>';
  document.getElementById('repbd').innerHTML=r;
  render();
}
init();
</script></body></html>
