<script>
const ITEMS = [{"id": 1, "cat": "labor", "urgency": "deep", "source": "McKinsey / Chart of the Week", "title": "70% of US workers may need to reinvent how they work — while headcount stays flat", "idea": "MGI's 'Workforce in motion' finds more than 70% of US workers could need to reinvent how they work as automation changes their task mix; about 25% could see over 30% of their task time reshuffled or replaced with new tasks. Employment can be stable, growing or shrinking and the job content still changes. Workers who learn to collaborate with AI and redesign workflows gain mobility.", "angle": "Task churn without headcount change is invisible in payroll data but shows up in margins and wage dispersion. Retraining is the unpriced bottleneck.", "tweetA": "A quarter of US workers could see 30%+ of their task time reshuffled while the payroll number doesn't move. BLS won't show it. Margins will.", "tweetB": "If 70% of workers have to reinvent how they work, the bottleneck isn't GPUs, it's training budgets. Who actually sells the retraining at that scale? Nobody is sizing that trade.", "charts": {"count": 1, "hot": false, "desc": "Featured chart: AI and the workforce reinvention (share of US workers by degree of task reshuffling). Charts inside — worth opening."}, "link": "https://www.mckinsey.com/mgi/our-research/workforce-in-motion-skills-and-pathways-to-future-jobs-in-the-united-states"}, {"id": 2, "cat": "culture", "urgency": "watch", "source": "McKinsey / Chart of the Week", "title": "Record capital and entrants into beauty, and only seven brands founded in 20 years clear $1B", "idea": "McKinsey's prior-week chart: the global beauty sector has attracted more new entrants and capital than ever, yet only seven beauty brands founded in the past two decades generated more than $1B in sales last year. Weaver and coauthors look at value propositions and category dynamics behind revenue milestones.", "angle": "A steep consumer power law despite abundant capital. Useful lens for DTC/VC consumer underwriting and for retailer shelf power.", "tweetA": "More capital and more entrants than ever, and seven beauty brands in twenty years crossed $1B. The consumer power law is steeper than most venture models assume.", "tweetB": "Count how many of those seven owe their scale to one retail partner or one social platform. The brand isn't the moat, distribution is the toll booth. $ULTA $EL", "charts": {"count": 1, "hot": false, "desc": "Beauty's elusive billion chart (linked in newsletter). Charts inside — worth opening."}, "link": "https://www.mckinsey.com/featured-insights/charts/beautys-elusive-billion"}, {"id": 3, "cat": "gold", "urgency": "deep", "source": "The Bubble Bubble Report", "title": "The Precious Metals Mania Is Still Ahead: +235% in 23 months vs +546% in 113", "idea": "Since the January 2026 correction began, many call it the final mania top like 1980 and 2011. The author counters: by the January peak the Sprott CEF proxy was up 235% over 23 months, versus 546% over 113 months in the 2000s secular bull, and US investors, with the most wealth of any country, never piled in. No retail participation means no blow-off.", "angle": "Bear case is a price chart; bull case is an absence (no retail mania). Testable via ETF flows, not charts.", "tweetA": "Gold/silver bull: +235% in 23 months last time around was +546% over 113. Calling a secular top after two years at less than half the prior magnitude requires a reason other than price. $GLD $SLV", "tweetB": "The bear case is a chart. The bull case is something that didn't happen: retail never showed up. Absence is hard to trade and harder to verify. Watch GLD/SLV flows, not the CEF chart.", "charts": {"count": 3, "hot": true, "desc": "Bubble-anatomy diagram, CEF long-term chart with descending channel and triangle, CEF/S&P ratio indexed to 100. 🔥 CHART WORTH SAVING: bubble anatomy vs 2020s participation."}, "link": "https://thebubblebubble.substack.com/p/the-precious-metals-mania-is-still"}, {"id": 4, "cat": "gold", "urgency": "deep", "source": "The Bubble Bubble Report", "title": "Two breakouts, two decade-long runs: May 2002 and March 2024", "idea": "CEF spent the 1980s-90s in a descending channel that broke in May 2002, starting the 2000s secular bull. After the early-2010s peak it consolidated in a large triangle for roughly a decade before breaking out in March 2024. Secular precious-metals cycles have typically lasted about a decade, and the 2000s run had comparable corrections along the way. The author frames gold/silver vs the S&P 500 as counterbalancing capital flows.", "angle": "The ratio to equities may be the cleaner question than dollar price. If the equity leader (AI) breaks, rotation has a destination.", "tweetA": "Everyone argues gold in dollars. The ratio to the S&P is the cleaner question: capital rotates between the two in decade-long cycles. If the AI trade is the thing breaking, the rotation has somewhere to go. $SPX $GLD", "tweetB": "Breakouts in 2002 and 2024, each from a decade-plus base. We're 2.5 years into the second. My read: last week's junior-miner capitulation looks more like 2004-06 than 2008, but only if real yields cooperate.", "charts": {"count": 2, "hot": false, "desc": "CEF vs S&P 500 ratio chart and CEF channel/triangle chart. Charts inside — worth opening."}, "link": "https://thebubblebubble.substack.com/p/the-precious-metals-mania-is-still"}, {"id": 5, "cat": "gold", "urgency": "deep", "source": "Tavi Costa / Shortage of Silver Equities", "title": "Gold miners at ~10% FCF yield would be the cheapest sector in the S&P", "idea": "Costa shows that if gold miners were a standalone US equity sector, they would be the cheapest group in the comparison, at roughly a 10% free cash flow yield with no other sector close. The full report builds the fundamental case and mechanics for silver miners ('shortage of silver equities').", "angle": "Valuation anchor for the miner trade after a sell-off; frames the debate as cash-flow durability, not metal price.", "tweetA": "Gold miners at a ~10% FCF yield would be the cheapest sector in the S&P if they were one. The same week the sell-side is cutting targets. That's usually where the multiple starts doing the work. $GDX", "tweetB": "A 10% FCF yield on gold near $4,100 isn't the question. The question is how much of it survives a gold price 20% lower. That's the real margin-of-safety math. $GDX $SIL", "charts": {"count": 1, "hot": true, "desc": "Sector FCF-yield comparison chart. 🔥 CHART WORTH SAVING: gold miners as the cheapest sector."}, "link": "https://tavicosta.substack.com/p/shortage-of-silver-equities"}, {"id": 6, "cat": "macro", "urgency": "deep", "source": "Robert Sinn / The Charts Of The Week", "title": "PPI +1.3% m/m, retail sales beat, and the 10-year still fell 30bp+", "idea": "Week to Oct 16: VIX spiked ~35% and 10y yields reversed more than 30bp. Hot CPI Wednesday briefly pushed October hike odds above 50%, but after Bowman and Daly signaled patience, odds fell below 20% by Friday. Yields fell despite PPI +1.3% m/m and retail sales +0.8%. Author reads the market as weighting financial stress and a Fed pause over strong data.", "angle": "Good data stopped mattering. The market is trading the Fed's reluctance and credit stress, a different regime than inflation scare.", "tweetA": "PPI +1.3% m/m, retail sales beat, 10-year down 30bp. The bond market is ignoring the data and pricing stress plus a reluctant Fed. That's a regime where good numbers stop being good news. $TLT", "tweetB": "Oil up, yields down in the same week. Oil says inflation, yields say accident. They can't both be right, and only one of them has a catalyst before the Oct 27-28 FOMC. $USO $TLT", "charts": {"count": 3, "hot": true, "desc": "VIX weekly, 10-year yield reversal, WTI breakout. 🔥 CHART WORTH SAVING: WTI breakout overlaid with falling 10y."}, "link": "https://robertsinn.substack.com/p/the-charts-of-the-week-10172026-volatile"}, {"id": 7, "cat": "macro", "urgency": "deep", "source": "Robert Sinn / The Charts Of The Week", "title": "Rising oil + falling yields = a recessionary signal, 2006-07 vibes", "idea": "Author argues the combination of a bearish reversal in yields and a crude breakout can't be read any other way than recessionary, pointing to 2008 when elevated energy prices and higher interest costs weakened the base before credit defaults accelerated the crisis. He flags XHB, LOW and ORCL charts as inconsistent with a strong economy, and says consensus still calls for massive AI capex increases, comparing the mood to 'subprime is contained' in 2006-07.", "angle": "Common factor across housing-linked and AI-debt-linked equities is the discount rate. Capex cut is nobody's base case.", "tweetA": "XHB, LOW and ORCL on the same page tells you the common factor is the discount rate, not the sector. 'Contained' is doing a lot of work, same as it did in 2006. $XHB $ORCL", "tweetB": "Consensus models AI capex only going up while two of the funding legs, housing wealth and credit, roll over. Positioning for a capex cut isn't crazy, it's just nobody's base case.", "charts": {"count": 3, "hot": false, "desc": "XHB, LOW, ORCL daily charts. Charts inside — worth opening."}, "link": "https://robertsinn.substack.com/p/the-charts-of-the-week-10172026-volatile"}, {"id": 8, "cat": "positioning", "urgency": "deep", "source": "Robert Sinn / The Charts Of The Week", "title": "Crowded long dollar is exposed if December hike odds slide", "idea": "Author flags risk to crowded long USD positions: if December rate-hike odds begin to move lower, a significant unwind of the dollar long trade is possible. In his view last week's reversal in yields and the dollar also drove the sharp Thursday bounce in gold miners.", "angle": "USD unwind is the cross-asset link between rates, gold, and EM. A pause narrative flips several consensus trades at once.", "tweetA": "Everyone is long dollars on the hike path. Hike odds went from 50% to under 20% in three days. If December follows, the dollar unwind is the trade that drags everything else with it. $DXY", "tweetB": "The dollar long, the AI long, and the 'strong economy' long are the same position expressed three ways. Only one needs to crack. $UUP $QQQ", "charts": {"count": 1, "hot": false, "desc": "US Dollar Index daily chart. Charts inside — worth opening."}, "link": "https://robertsinn.substack.com/p/the-charts-of-the-week-10172026-volatile"}, {"id": 9, "cat": "regulation", "urgency": "deep", "source": "Robert Sinn / The Charts Of The Week", "title": "Senate flip on Nov 3 as an AI-trade risk: data centers as populist target", "idea": "Author notes midterms are two weeks out, Democrats are near-locked to win the House, and the Senate is the battleground (Texas, Maine, Michigan, Ohio). A Democratic favorite in Texas is called a sharp illustration of demographic change and rejection of Trump 2.0. He quotes Joseph Wang: higher rates, higher energy prices, cracks in AI, and Democrats who may dislike the AI infrastructure buildout; people don't like data centers driving up energy costs and noise.", "angle": "Political leg to the AI capex thesis; the first place it shows is permitting and rate-case treatment of data centers.", "tweetA": "The AI capex story just grew a political leg. Data centers raising local power bills is the most easily weaponized grievance in America. If the Senate flips, permitting and tariff treatment is where it shows first. $VST $CEG", "tweetB": "I'd frame it differently from 'Dems vs AI': it's the grid that gets regulated, not the models. Utilities with data-center tariffs are the tell, and they're pricing none of it.", "charts": {"count": 0, "hot": false, "desc": "No chart in this section."}, "link": "https://robertsinn.substack.com/p/the-charts-of-the-week-10172026-volatile"}, {"id": 10, "cat": "energy", "urgency": "deep", "source": "Robert Sinn / The Charts Of The Week", "title": "Uranium trades as an AI derivative: URA -12.6% YTD, Cameco -11%", "idea": "URA is down 12.6% for the first nine months of 2026, Cameco about 11% YTD, much of it recently. Author's reasons: nuclear became associated with AI and shares its valuation reset as investors question the pace and returns of AI spend, plus operational challenges (Kazatomprom citing higher sulfuric-acid and wellfield costs; Cameco transport disruptions). He went long CCJ last week as a contrarian trade with seasonal tailwinds.", "angle": "A factor-driven sell-off while supply-side fundamentals worsen is where dislocations form.", "tweetA": "URA -12.6% YTD while the supply side gets worse: Kazatomprom's acid costs, Cameco's logistics. When price and fundamentals diverge because a factor shifted, that's where I start looking. $CCJ $URA", "tweetB": "The nuclear thesis had two buyers: utilities signing decade-long contracts, and the AI capex narrative. Only one of them has a contract. Which one is repricing? $CCJ", "charts": {"count": 1, "hot": false, "desc": "Cameco daily chart. Charts inside — worth opening."}, "link": "https://robertsinn.substack.com/p/the-charts-of-the-week-10172026-volatile"}, {"id": 11, "cat": "gold", "urgency": "deep", "source": "Robert Sinn / The Charts Of The Week", "title": "TSX-V at a 52-week low: Q4 as the flush, 1H27 as the next leg", "idea": "Wednesday was a capitulation day in miners; TSX-Venture made a 52-week low and closed near major support. Monthly chart shows a falling wedge with a bullish long-term MA crossover. Author expects Q4 2026 as a short-to-intermediate low in juniors, followed by a powerful 1H27 leg that could double the TSX-V from about 1,700, calling tax-loss season a generational buying opportunity and recommending 25% cash into November. (Note: the text cites ~840 support and ~1,700 close; the figures look inconsistent.)", "angle": "Leveraged-beta expression of gold; tax-loss season often finishes the flush.", "tweetA": "TSX-V at a 52-week low with gold -3.6% YTD. Juniors are the leveraged expression of a leveraged expression, and tax-loss season usually finishes the job. The question is whether Q4 is the flush or the start.", "tweetB": "'Generational buying opportunity' calls are free. What isn't: a miner upsizing a financing 2x the same week. Capital is rationing by quality, not disappearing. That bifurcation is the trade.", "charts": {"count": 3, "hot": false, "desc": "TSX-V daily and monthly (falling wedge), GDX daily, gold daily. Charts inside — worth opening."}, "link": "https://robertsinn.substack.com/p/the-charts-of-the-week-10172026-volatile"}, {"id": 12, "cat": "venture", "urgency": "deep", "source": "Robert Sinn / The Charts Of The Week", "title": "San Lorenzo Gold upsizes C$40M to C$80M, no warrants, in the ugliest junior week", "idea": "San Lorenzo Gold (Chile gold-copper) announced a C$40M best-efforts financing at C$5.30 with no warrants, upsized to C$80M by afternoon, during an otherwise ugly week. Treasury goes to roughly C$100M on a C$700M market cap, funding up to five diamond rigs at ~US$500/meter. Aztec Minerals (C$6.4M raise last month) and Andina Copper are cited as relative-strength names.", "angle": "Risk-capital markets still clear for quality stories at a premium. Financing size as a signal.", "tweetA": "An upsized, no-warrant raise at C$5.30 in a 52-week-low tape. That isn't dilution, it's price discovery for quality. Capital is rationed, not gone.", "tweetB": "C$80M at ~US$500/m buys drill meters, not a discovery. The financing risk is gone; now the rocks have to deliver. That's a different stock tomorrow.", "charts": {"count": 1, "hot": false, "desc": "San Lorenzo Gold daily chart. Charts inside — worth opening."}, "link": "https://robertsinn.substack.com/p/the-charts-of-the-week-10172026-volatile"}, {"id": 13, "cat": "gold", "urgency": "deep", "source": "Robert Sinn / The Charts Of The Week", "title": "CIBC cuts Barrick to Neutral, PT $49 from $57, but still sees gold at $4,500 in Q4", "idea": "CIBC downgraded Barrick to neutral citing outperformance, lowering PT to US$49 from $57; it cut targets across miners with lower gold/silver forecasts but still sees gold at $4,500 in Q4 2026, $5,200 in 2027 and $5,500 in 2028. Barrick held support near $39; catalysts include the partial Fourmile sale to Newmont (~$1.5B net, Q4) and the North American asset IPO.", "angle": "Sell-side still projects 8% upside by year-end and 25% by 2027 from spot ($4,166).", "tweetA": "CIBC cut miner targets and still has gold at $4,500 this quarter, $5,200 next year, $5,500 in 2028. Spot is $4,166: that's 8% to year-end and 25% to 2027. The cut is on the path, not the destination. $GLD $B", "tweetB": "Barrick got downgraded for outperforming, not for weak gold. The $39 support matters more than the PT. Fourmile-to-Newmont cash and the NA IPO are the real catalysts. $B $NEM", "charts": {"count": 1, "hot": false, "desc": "Barrick daily chart. Charts inside — worth opening."}, "link": "https://robertsinn.substack.com/p/the-charts-of-the-week-10172026-volatile"}, {"id": 14, "cat": "metals", "urgency": "deep", "source": "Robert Sinn / The Charts Of The Week", "title": "Copper Giant's Mocoa: 11.5B lb copper, +50% in a year, stock sold the news", "idea": "Copper Giant's updated MRE totals 1.9B tonnes in all categories, with 290Mt at 0.54% CuEq indicated; 11.5B lb of copper is about 50% above the November 2025 estimate. Maiden PEA is due Q4 2026 (likely November). The stock sold off, possibly on $0.50 warrants expiring Dec 12. Colombia is described as increasingly receptive to large-scale critical-minerals projects.", "angle": "De-risking event sold into a bad tape; warrant overhang defines the date. Colombia as a copper supply sleeper.", "tweetA": "11.5B lb of copper at Mocoa, up 50% in a year, and the stock sold off on the upgrade. When good geology gets sold, it's warrants and positioning. The date to watch is Dec 12.", "tweetB": "Everyone models copper supply from Chile and Peru. A Colombian porphyry at 290Mt indicated and a government that wants the jobs is the sleeper. $FCX $COPX", "charts": {"count": 1, "hot": false, "desc": "Copper Giant daily chart. Charts inside — worth opening."}, "link": "https://robertsinn.substack.com/p/the-charts-of-the-week-10172026-volatile"}, {"id": 15, "cat": "metals", "urgency": "watch", "source": "Robert Sinn / The Charts Of The Week", "title": "Hudbay's Snow Lake: reserve life to 2043 and ~185koz/yr gold through 2030", "idea": "Cormark raised its Hudbay PT to C$40 from C$35 after touring Snow Lake: reserve life extended to 2043 (+6 years vs 2021), gold production averaging ~185 koz/yr over 2026-2030, up 37% in total gold output (additional 250 koz) vs the 2021 plan. Author likes the SW US copper growth profile more; HBM support at US$23 with momentum pointing lower; copper miners were under heavy pressure last week.", "angle": "By-product gold option is larger than the market treats it. Copper miners trade with the AI beta short term.", "tweetA": "185koz/yr of gold from Snow Lake at spot is roughly $770M of revenue. Hudbay is a copper story the sell-side is finally modeling as a gold option too. $HBM", "tweetB": "Copper miners sold off alongside AI last week. Copper as the AI-power metal works until the AI trade doesn't. That correlation is the real risk in the group. $COPX", "charts": {"count": 1, "hot": false, "desc": "Hudbay daily chart. Charts inside — worth opening."}, "link": "https://robertsinn.substack.com/p/the-charts-of-the-week-10172026-volatile"}, {"id": 16, "cat": "geopolitics", "urgency": "deep", "source": "The Pressure Point / Fulcrum", "title": "Every bypass becomes another target: 24 vessels hit in two weeks, Brent >$110", "idea": "The FT counted 24 tankers/vessels targeted in two weeks (six on one Sunday), and two ships sank this week. Houthis hit Saudi airports and reportedly reached Aramco HQ; a Hormuz bypass pipeline was forced closed in September before flows recovered to near prewar with escorts. Exports remain steady, but Brent rose above $110 as markets price the next interruption. Costs shift to insurance, escorts and air defense across Fujairah, Saudi Red Sea terminals and Bab al-Mandeb.", "angle": "Barrels move but the security bill spreads. Watch war-risk quotes, not loadings.", "tweetA": "24 vessels hit in two weeks and regional exports are still steady. Brent above $110 with flows holding is an insurance premium, not a supply loss. The market prices the next interruption, not the loaded barrel.", "tweetB": "Saudi and the UAE spent a decade building Hormuz insurance and handed the Houthis a target list. Watch war-risk quotes at Bab al-Mandeb, not Brent. $XOM $STNG", "charts": {"count": 0, "hot": false, "desc": "No charts."}, "link": "https://pressurepoint.whatsthelatest.ai/archive/the-pressure-point-redundancy-widened-the-bullseye/"}, {"id": 17, "cat": "geopolitics", "urgency": "act", "source": "The Pressure Point / Fulcrum", "title": "Trump exempts Russia from further sanctions mandated by new law", "idea": "Per the Pressure Point 'Things happen' section (citing FT): Donald Trump exempted Russia from further sanctions mandated by a new law. NPR: Zelenskyy urged support for new US sanctions on Russia after Trump put them on hold. Context in the same issue: Brent above $110 amid Gulf tensions.", "angle": "Statutory sanctions tail looks like a dead letter; implications for Urals discount and Gulf-vs-Russian barrel pricing.", "tweetA": "A sanctions law passes and the White House waives it within days. Russian barrels get easier to buy just as Gulf barrels get harder to ship. Watch the Brent-Urals spread. $USO", "tweetB": "Congress writes sanctions, the executive writes exemptions. For anyone pricing Russia risk, the statutory tail is dead letter until proven otherwise.", "charts": {"count": 0, "hot": false, "desc": "No charts."}, "link": "https://pressurepoint.whatsthelatest.ai/archive/the-pressure-point-redundancy-widened-the-bullseye/"}, {"id": 18, "cat": "tech", "urgency": "watch", "source": "The Pressure Point / Fulcrum", "title": "Proofpoint to buy Varonis for ~$6.3B all-cash", "idea": "Pressure Point 'Things happen': Proofpoint agreed to acquire Varonis Systems in an all-cash deal valued at about $6.3B (via Seeking Alpha key-deals roundup, which also lists International Paper, IonQ and Bumble).", "angle": "Security M&A continues while the AI trade sells off; data-access governance is the agent-era wedge.", "tweetA": "Proofpoint is paying $6.3B cash for Varonis, a company whose entire job is who can touch which files. AI agents are the newest class of user with too many permissions. $VRNS", "tweetB": "Security consolidation is the quiet M&A theme while the AI complex bleeds. Who's next in the data-security tier? $CRWD $S", "charts": {"count": 0, "hot": false, "desc": "No charts."}, "link": "https://www.tradingview.com/news/seekingalpha:2aad812db094b:0-key-deals-this-week-international-paper-ionq-bumble-and-more/"}, {"id": 19, "cat": "macro", "urgency": "deep", "source": "Six Sigma Capital / Week Ahead Preview", "title": "Fed hiked to 3.75-4.00% unanimously, 10-year at 5.24%, FOMC Oct 27-28", "idea": "Per last Sunday's commentary quoted in the preview: September minutes showed unanimous support for a 25bp hike to 3.75-4.00%, with most officials seeing another hike likely by year-end. The 10-year was above 5.24%, near its highest in over two decades; Brent hovering around $100. Next catalyst: CPI and the Oct 27-28 FOMC; Q3 earnings kick off Tuesday with big banks.", "angle": "Fed is hiking into a steep curve (about 135bp of 10y over funds midpoint), with stress now dictating the reaction function.", "tweetA": "10-year at 5.24% with funds at 3.75-4.00%: the curve is ~135bp steep after a hike. Hiking into steepening is how the long end does the tightening for you, or breaks something. $TLT", "tweetB": "Unanimous hike, most see another by year-end, and Friday still priced October under 20%. The reaction function is stress-dependent now. Credit spreads, not CPI, decide Oct 28.", "charts": {"count": 1, "hot": false, "desc": "10-year yield chart ('climbing at one of the fastest paces in recent memory'). Charts inside — worth opening."}, "link": "https://sixsigmaresearch.com/p/preview-of-the-week-ahead-wc-october-580"}, {"id": 20, "cat": "AI/infra", "urgency": "deep", "source": "Six Sigma Capital / Week Ahead Preview", "title": "SOXX -12% in a week, four distribution days, RSI 30.65, still +57.6% YTD", "idea": "Weekly: Dow +0.67%, S&P -1.95%, Nasdaq -4.48%, IWM -3.05%. SOXX sold off 12% on cascading volume with four distribution days, RSI 30.65, 8.15% below its 50-day and 5.6% above its 200-day, still +57.56% YTD; a 200-day test coinciding with the July low looks probable. S&P closed below its 50-day with a bearish engulfing Friday candle; Nasdaq below 21- and 50-day.", "angle": "Semis gave back ~27% of YTD gain in a week: where AI credit stress is hitting equity first.", "tweetA": "SOXX -12% in a week and still +57.6% YTD. That one week gave back more than a quarter of the year's gain. Four distribution days say it isn't dip-buyers' money yet. $SOXX $NVDA", "tweetB": "The 200-day on SOXX lines up with the July low. That's the level where the AI trade either re-bids or confirms what credit has been saying. $SOXX", "charts": {"count": 3, "hot": false, "desc": "SOXX, SPX, Nasdaq Composite charts with distribution-day arrows. Charts inside — worth opening."}, "link": "https://sixsigmaresearch.com/p/preview-of-the-week-ahead-wc-october-580"}, {"id": 21, "cat": "positioning", "urgency": "deep", "source": "Six Sigma Capital / Week Ahead Preview", "title": "Rotation not liquidation: Dow +0.67% vs Nasdaq -4.48%, breadth up to 45%", "idea": "Author trimmed high-capex, debt-heavy AI names (exited CIFR at $19; CRWV sold at $116, $110, $101, $92; exited CRDO Oct 2), bought equal-weight RSP near $209, trimmed megacaps on crowding, and is holding 5-10% cash (SGOV or 2y). S&P stocks above 50-day rose to 45.4% from 36.4% last week after hitting ~20%.", "angle": "Index down, breadth up: money rotating, not leaving. Capital structure is the sort key.", "tweetA": "Dow +0.67%, Nasdaq -4.48%, and breadth up from 36% to 45% above the 50-day. That isn't liquidation. It's a rotation sorted by capital structure. $RSP $QQQ", "tweetB": "Practitioner tell: selling debt-funded AI (CIFR, CRWV) into strength and parking in equal-weight and T-bills. It's the 'financing regime' trade at the position level, not a call on demand.", "charts": {"count": 1, "hot": false, "desc": "S&P 500 percent of stocks above 50-day chart. Charts inside — worth opening."}, "link": "https://sixsigmaresearch.com/p/preview-of-the-week-ahead-wc-october-580"}, {"id": 22, "cat": "positioning", "urgency": "deep", "source": "Six Sigma Capital / Week Ahead Preview", "title": "EEM closes below 200-day for the first time since April 2025; EWZ +31% YTD", "idea": "EEM $62.85 is 5.96% below its 50-day and 0.90% below its 200-day (RSI 31.98), a breakdown on above-average volume; heavy TSMC, SK Hynix and Samsung weights mean a rebound there decides the ETF. Meanwhile EWZ ($41.83) is +31.14% YTD and 11% above its 50-day, retesting April highs after a post-election gap.", "angle": "EM is a memory/foundry ETF with a currency attached; Brazil is the EM that doesn't need Nvidia to be right.", "tweetA": "EEM closed under its 200-day for the first time since April 2025, and the reason is three tickers: TSMC, SK Hynix, Samsung. EM right now is a memory-and-foundry ETF with a currency attached.", "tweetB": "EWZ +31% YTD, 11% above its 50-day, with Brent at $100. Brazil is the EM that doesn't need the AI trade to be right. The EWZ/EEM spread is the clean version. $EWZ $EEM", "charts": {"count": 2, "hot": false, "desc": "EEM and EWZ charts. Charts inside — worth opening."}, "link": "https://sixsigmaresearch.com/p/preview-of-the-week-ahead-wc-october-580"}, {"id": 23, "cat": "gold", "urgency": "deep", "source": "Six Sigma Capital / Week Ahead Preview", "title": "Gold $4,166, -3.6% YTD, rejected the 21EMA twice, $4,100-4,150 to defend", "idea": "Gold is 3.79% below its 50-day and 7.85% below its 200-day (RSI 45.26), converging with the January descending trendline. Bulls need to reclaim the 21EMA and 50SMA first; $4,100-4,150 is support. Author holds physical.", "angle": "Gold behaving like a real-yield asset, not an inflation or stress hedge, despite oil at $100 and a Fed hiking.", "tweetA": "Gold is -3.6% YTD with oil near $100 and the Fed hiking. It's not trading as inflation hedge or safe haven, it's trading as a real-yield asset. The Friday 10y reversal is the only thing that changes that. $GLD", "tweetB": "$4,100-4,150 is the line. Below it, the January trendline and the 200-day both sit overhead. The 'mania is still ahead' crowd needs this level more than any pattern. $GLD", "charts": {"count": 1, "hot": false, "desc": "Gold daily chart with 21EMA/50SMA/200SMA and January descending trendline. Charts inside — worth opening."}, "link": "https://sixsigmaresearch.com/p/preview-of-the-week-ahead-wc-october-580"}, {"id": 24, "cat": "crypto", "urgency": "deep", "source": "Six Sigma Capital / Week Ahead Preview", "title": "BTC $81.6K, -6.7% YTD, rejected twice at the $82-83K May high", "idea": "BTC is 0.37% above its 50-day (~$81.3K) and 12.7% above its 200-day (RSI 46.72), -6.68% YTD; rejected again at $82-83K (May high); a close below the 50-day puts $80K support in focus. Author is long.", "angle": "Worst YTD of S&P (+11.7%), gold (-3.6%), BTC (-6.7%) in a stress tape: not behaving as digital gold or as tech.", "tweetA": "BTC is -6.7% YTD against +11.7% for the S&P and -3.6% for gold. In a year of rising macro stress it's the worst of the three. It isn't trading like digital gold or like tech. $BTC", "tweetB": "BTC is coiled between $80K and $83K into CPI and the Oct 28 FOMC. The break direction tells you whether crypto is trading as liquidity (down with Nasdaq) or as a hedge.", "charts": {"count": 1, "hot": false, "desc": "BTC chart with 50SMA and $82-83K resistance. Charts inside — worth opening."}, "link": "https://sixsigmaresearch.com/p/preview-of-the-week-ahead-wc-october-580"}, {"id": 25, "cat": "credit", "urgency": "deep", "source": "Dark Side of the Boom / Goldman chart pack", "title": "Goldman's AI credit charts: credit already prices a tougher financing regime than equities", "idea": "Louis Miller (Goldman custom baskets desk) chart pack, via Dark Side of the Boom: less a crash call than a warning that AI credit is pricing a tougher financing regime than hyperscaler equities reflect. Title implies a ~15% hyperscaler 'catch down'. The key question is whether credit stabilises; if it does, rotation stays orderly, if not equities have catching up to do.", "angle": "Credit leads equity; the AI trade has two capital structures, cash-flow funded and debt-funded.", "tweetA": "AI credit already trades like a tougher financing regime, and hyperscaler equity doesn't. One of those is wrong, and credit has the better record of being early. $MSFT $META", "tweetB": "The AI trade has two capital structures: cash-flow funded (megacaps) and debt-funded (neoclouds, Oracle). Credit is repricing the second and equity hasn't followed the first. $ORCL $CRWV", "charts": {"count": 0, "hot": true, "desc": "Goldman chart pack (counts not visible in text). 🔥 Charts inside — worth opening."}, "link": "https://thedarksideoftheboom.substack.com/p/spooky-season-goldmans-ai-credit"}, {"id": 26, "cat": "AI/infra", "urgency": "deep", "source": "Dark Side of the Boom / Goldman chart pack", "title": "Capex stays enormous while its earnings contribution fades: depreciation is the next debate", "idea": "Takeaways: the AI capex cycle can remain enormous even as its earnings contribution fades, so financing, depreciation and returns on capital matter more than the next spending headline. The market is absorbing stress through rotation rather than index weakness; Goldman stays constructive on broadening and selective quality while moving away from the most crowded AI expressions.", "angle": "Lag between capex cash-out and depreciation drag is the unmodeled part.", "tweetA": "Capex can stay at record levels while its marginal earnings contribution fades. Then depreciation does the work: the P&L eats the cash flow years later. That lag is the part nobody models. $MSFT $GOOGL", "tweetB": "If the next question is financing, not demand, the winners are suppliers paid up front: power, optics, memory. The weak link is the debt-funded buyer who pauses orders, not the vendor, until that pause arrives.", "charts": {"count": 0, "hot": false, "desc": "Goldman chart pack. Charts inside — worth opening."}, "link": "https://thedarksideoftheboom.substack.com/p/spooky-season-goldmans-ai-credit"}, {"id": 27, "cat": "AI/infra", "urgency": "watch", "source": "Pequity Research / Expert Call", "title": "Optical expert-call question set: CPO commitments vs roadmap, LTAs, EML lead times", "idea": "Pequity's Q3 2026 optical components call outline (questions only; no answers in the email) probes optical density per GPU cluster, 800G to 1.6T mix, whether CPO/NPO prep has become procurement commitments or roadmap talk, scale-out vs scale-up, LTA duration at Coherent/Lumentum/Murata, EML/DML/driver lead times vs 90 days ago, and share shift to InnoLight, Eoptolink and Accelink.", "angle": "The question list shows what buyside diligence is stress-testing: pricing deflation vs mix, Chinese share gains, CPO timing.", "tweetA": "The question on that expert-call list worth watching: has co-packaged optics turned into procurement commitments or is it still roadmap slides? That decides how long 1.6T pluggables run. $COHR $LITE", "tweetB": "Lead times for EMLs vs 90 days ago is the only question on the list that can't be answered with a narrative. Pricing mix vs real deflation and InnoLight share are the others. $LITE", "charts": {"count": 0, "hot": false, "desc": "No charts."}, "link": "https://pequityresearch.substack.com/p/expert-call-q3-2026-optical-components"}];
