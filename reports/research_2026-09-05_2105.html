umber.", "tweetA": "24,541 pitch decks analyzed. Median view time: 77 seconds. 18% of investors quit before slide 2. If your traction slide is buried past slide 3, you've lost most of your audience before they've seen a single number.", "tweetB": "Only 4 in 10 decks show financials at all inside the window investors actually read. Founders polish narrative slides nobody reaches. The deck isn't a pitch, it's a 77-second filter — optimize for the filter, not the story.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.the-founders-corner.com/p/startup-accelerator-rankings-startup"}, {"id": 6, "cat": "tech", "urgency": "deep", "source": "The Founders Corner", "title": "Cursor hit $1B ARR in 3 years. Figma took 13.", "idea": "Cursor reached $1B ARR in three years; Figma needed thirteen. Cheaper distribution and faster buying cycles are compressing the time it takes new software companies to scale by close to an order of magnitude.", "angle": "Pair this with Anthropic's own reported ARR run ($3B to $30B in a year) — the ramp is compressing at every layer of the AI stack, model and application alike.", "tweetA": "Figma: 13 years to $1B ARR. Cursor: 3 years. Anthropic: $3B to $30B ARR in ONE year. The AI stack isn't just growing faster than SaaS did, it's growing faster at every layer, model and application both. Old 'time to scale' benchmarks are useless now.", "tweetB": "Everyone's debating whether AI companies deserve their multiples. Nobody's asking why the ARR ramp itself got 4x faster. Cheaper distribution plus zero-friction buying is the real story, and it's structural, not hype.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.the-founders-corner.com/p/startup-accelerator-rankings-startup"}, {"id": 7, "cat": "labor", "urgency": "watch", "source": "The Founders Corner", "title": "Students using AI: homework scores +18%, exam scores -20%", "idea": "A cited study found students using AI scored 18% higher on homework but p tfs-have-seen-a-very-heavy"}, {"id": 13, "cat": "crypto", "urgency": "act", "source": "Crypto Integrat — Crypto News", "title": "AMC's CEO calls Robinhood's tokenized stock program 'contemptible and vile'", "idea": "AMC CEO Adam Aron blasted Robinhood's tokenized stock program covering AMC and 190+ other companies, saying it was issued without company knowledge or consent. Robinhood CEO Vlad Tenev stood behind the program; CLO Dan Gallagher challenged AMC's legal team to reach out.", "angle": "The first real public confrontation over whether a broker can synthetically wrap a company's stock without its consent — a legal question regulators haven't answered yet.", "tweetA": "Robinhood tokenized 190+ companies' stock without asking any of them. AMC's CEO just called it 'contemptible and vile' in public. This is the first real test of whether a broker can synthesize your equity into a token you never authorized, and the answer is coming from a lawsuit, not a regulator. $HOOD $AMC", "tweetB": "Nobody asked the obvious question when Robinhood launched stock tokens: do companies get a say in whether their equity gets wrapped and traded on-chain? AMC just answered it for everyone else with a very public 'no, and we're furious.'", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.cryptointegrat.com/p/crypto-news-september-5-2026"}, {"id": 14, "cat": "regulation", "urgency": "deep", "source": "Crypto Integrat — Crypto News", "title": "House cancels two weeks of September session right after the Senate's first CLARITY Act vote", "idea": "The US House canceled two weeks of September session, leaving just two days after the Senate's first CLARITY Act vote to act before midterm politics create legislative gridlock, putting the crypto market-structure bill at risk.", "angle": "Crypto market-structure legislation now has a hard clock problem: a two-day legislative window before midterm politics freeze everything.", "tweetA": "The House just canceled two weeks of session, leaving 2 days after the Senate's first CLARITY Act vote to move a crypto market-structure bill before midterm politics freeze everything. If you're pricing in regulatory clarity for crypto this year, that clock just got a lot shorter.", "tweetB": "Crypto's 'regulation is coming' narrative has quietly depended on a legislative calendar nobody was watching. That calendar just lost two weeks. The CLARITY Act now needs a near-perfect two-day window or it slides to 2027.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.cryptointegrat.com/p/crypto-news-september-5-2026"}, {"id": 15, "cat": "crypto", "urgency": "watch", "source": "Crypto Integrat — Crypto News", "title": "South Korea is planning to move its ENTIRE capital markets infrastructure onchain", "idea": "South Korea's Financial Services Commission and Korea Securities Depository are building out plans to bring the country's entire capital markets infrastructure onchain using Avalanche.", "angle": "A sovereign-scale validation of tokenized market infrastructure well beyond pilot programs — a leading indicator for other G20 markets and for $AVAX specifically.", "tweetA": "South Korea isn't piloting tokenization, it's planning to move its ENTIRE capital markets infrastructure onchain, on Avalanche. When a G20 securities depository does this, every other market regulator has to explain why they're not. $AVAX", "tweetB": "The tokenization story has been 'BlackRock launches a fund' for two years. This is different: a national securities depository redesigning core market plumbing. That's infrastructure risk-transfer, not a product launch.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.cryptointegrat.com/p/crypto-news-september-5-2026"}, {"id": 16, "cat": "crypto", "urgency": "deep", "source": "Crypto Integrat — Crypto News", "title": "The Bank for International Settlements tested the XRP Ledger for verifying official statistics", "idea": "The BIS published a paper using the XRP Ledger as a proof-of-concept for verifying official statistics onchain, citing low fees and fast settlement — though it stresses no adoption decision has been made.", "angle": "A BIS working paper isn't a policy, but it's the kind of institutional validation that moves a chain from 'crypto asset' to 'considered financial infrastructure' in the eyes of central bankers.", "tweetA": "The BIS, the central bank of central banks, just published a paper using the XRP Ledger to verify official government statistics. No adoption decision yet, but this is the institution that sets the tone for every central bank on earth. $XRP", "tweetB": "Nobody at the BIS picks a blockchain by accident for a research paper. Low fees and fast settlement are the stated reasons, but the real signal is that an XRPL proof-of-concept now exists inside the most conservative financial institution in the world.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.cryptointegrat.com/p/crypto-news-september-5-2026"}, {"id": 17, "cat": "regulation", "urgency": "watch", "source": "Crypto Integrat — Crypto News", "title": "A bank combining traditional banking with onchain settlement just got a national charter", "idea": "The OCC granted OpenReserve preliminary conditional approval to charter a national bank combining traditional banking with onchain settlement under federal supervision.", "angle": "This is the regulatory template other crypto-native banks will now try to copy: a federally chartered bank with onchain settlement built in, not bolted on.", "tweetA": "The OCC just conditionally chartered a national bank that does onchain settlement natively, under full federal supervision. This is the regulatory template every crypto-adjacent fintech has been waiting for someone else to test first.", "tweetB": "Everyone's watching stablecoin issuers for the 'crypto goes mainstream' moment. The actual moment might be a boring OCC bank charter with onchain settlement plumbing that nobody outside fintech regulatory circles even noticed.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.cryptointegrat.com/p/crypto-news-september-5-2026"}, {"id": 18, "cat": "AI/infra", "urgency": "act", "source": "Crypto Integrat — AI News", "title": "GPT-6 Astra scored 63% on ARC-AGI-3 — and beat humans on move efficiency on 96% of levels", "idea": "GPT-6 Astra scored 63% on ARC-AGI-3, beating the human baseline on action efficiency and using fewer moves than the median human on 96% of levels. It's pretrained on 100,000+ GPUs at Stargate and is rolling out across ChatGPT plans over the following days.", "angle": "Beating humans on efficiency, not just accuracy, is the more important number — it signals the model finds shorter solution paths rather than brute-forcing more attempts.", "tweetA": "GPT-6 Astra doesn't just score well on ARC-AGI-3, it beats the median human on MOVE EFFICIENCY on 96% of levels. That's not 'more compute solves harder problems,' that's 'the model finds shorter paths than we do.' Different kind of scary.", "tweetB": "100,000+ GPUs at Stargate went into pretraining Astra. The headline benchmark gets the attention. The one that matters is efficiency: Astra needed fewer moves than humans on almost every level. Compute scaling is starting to buy reasoning quality, not just accuracy.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.cryptointegrat.com/p/ai-news-september-5-2026"}, {"id": 19, "cat": "AI/infra", "urgency": "deep", "source": "Crypto Integrat — AI News", "title": "OpenAI built an automated system to patch its own vulnerabilities as open-weight models catch up to attackers", "idea": "OpenAI unveiled Defense Factory, an automated system to continuously find, validate, and fix vulnerabilities as open-weight models close the gap with attackers.", "angle": "An implicit admission that open-weight models are now good enough to be used offensively at scale — the defense automation is a reaction to that gap closing, not a proactive feature.", "tweetA": "OpenAI just automated its own vulnerability-patching pipeline. Read between the lines: open-weight models are now good enough to be weaponized for attacks, and the only defense that scales is an AI patching AI faster than humans can review it.", "tweetB": "The cybersecurity arms race just went fully autonomous on both sides. Attackers use open-weight models to find exploits; OpenAI just shipped an automated system to find and fix them first. Neither side has a human in that loop anymore.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.cryptointegrat.com/p/ai-news-september-5-2026"}, {"id": 20, "cat": "AI/infra", "urgency": "watch", "source": "Unchained Premium", "title": "A wallet-level 'kill switch' for AI agents just landed a BNY Mellon partnership", "idea": "Ampersend, co-founded by Edge & Node's Rodrigo Coelho, built a wallet-level control layer that can block an AI agent from overspending or acting on a hallucination, launched on Base, and is working with enterprises including BNY Mellon. Coelho himself says the agentic commerce boom is still a distant reality.", "angle": "The most credible voice on agentic-commerce infrastructure is telling you it's NOT close yet — more useful than any bullish agentic-commerce thesis, because it's coming from the person building the rails.", "tweetA": "The guy building wallet guardrails FOR autonomous AI agent spending is telling you the agentic commerce boom is still far away. When the infrastructure builder is the bear case, that's worth more than every 'AI agents will run the economy' thread combined.", "tweetB": "BNY Mellon is already piloting AI agent spending controls — enterprises expect autonomous agent payments sooner than the public conversation assumes, even while the builder himself downplays the timeline. Institutions moving ahead of the narrative is usually the signal to watch.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://unchainedcrypto.beehiiv.com/p/how-ampersend-is-making-it-safer-to-manage-multiple-ai-agents"}, {"id": 21, "cat": "AI/infra", "urgency": "deep", "source": "McKinsey Monthly Highlights", "title": "90% of companies use AI regularly. Only 37% say it's shown up in EBIT.", "idea": "McKinsey's latest Global Survey: nearly 9 in 10 respondents say their organizations regularly use AI, 8 in 10 say it's improved individual productivity, but only 37% report it has contributed to EBIT.", "angle": "The clearest gap-quantification yet between individual productivity gains and enterprise P&L impact — the 'AI ROI' skeptic case just got a hard number instead of vibes.", "tweetA": "90% adoption. 80% say it makes THEM more productive. 37% say it shows up in EBIT. That 53-point gap between 'I feel more productive' and 'the company made more money' is the entire AI-ROI debate in one survey.", "tweetB": "Individual productivity gains that don't aggregate into enterprise profit usually mean one of two things: the gains get captured as slack, or the org hasn't redesigned workflows around the tool yet. McKinsey's framing says the second. I'd bet on both.", "charts": {"count": 1, "hot": false, "desc": "Survey bar chart comparing adoption / individual productivity / EBIT contribution — worth opening."}, "link": "https://www.mckinsey.com/capabilities/quantumblack/our-insights/the-state-of-ai"}, {"id": 22, "cat": "labor", "urgency": "deep", "source": "McKinsey Chart of the Week", "title": "32% feared AI would cut their headcount. A year later, only 14% actually saw cuts.", "idea": "McKinsey's Chart of the Week: 32% of respondents in 2025 anticipated AI-driven headcount reductions; a year later only 14% reported actual reductions. Two-thirds report little or no AI-related employment change over the past year. But 39% now expect AI to reduce headcount over the NEXT year.", "angle": "The fear consistently runs about 2x ahead of the realized outcome — and it resets forward each year rather than resolving. That looks like a permanent anxiety premium, not a one-time overreaction.", "tweetA": "2025: 32% feared AI job cuts. 2026 actual: 14% saw them. Now: 39% expect cuts NEXT year, a higher fear number than last year's, despite last year's fear being wrong by more than half. This isn't converging toward accuracy, it's an anxiety premium that resets annually.", "tweetB": "The AI jobs panic has a measurable error rate: predicted cuts run about 2x actual cuts, every year, and the next year's prediction doesn't correct for it. That's not a forecasting problem, that's fear that never resolves — worth remembering next time an 'AI will kill X jobs' headline moves a stock.", "charts": {"count": 1, "hot": true, "desc": "🔥 CHART WORTH SAVING — bar chart of anticipated vs actual AI headcount reduction, 2025 fear vs 2026 reality vs 2027 fear. Clean story in one image."}, "link": "https://www.mckinsey.com/featured-insights/charts"}, {"id": 23, "cat": "AI/infra", "urgency": "deep", "source": "NLP News (Elvis Saravia)", "title": "GPT-6 Astra beats Claude Fable 5.1 by 10-32 points across every published agentic benchmark", "idea": "Per OpenAI's own launch comparison: Astra scores 41.4% on AutomationBench vs 31.4% for Claude Fable 5.1 and 18.1% for GPT-5.6 Sol; 57.9% on Terminal-Bench 4.0 vs 55.8% and 37.3%; 97.6% on FrontierMath Tier 4 vs 87.8% and 83.0%; 99.9% on ARC-AGI-3 vs 7.8% for GPT-5.6 Sol, with no Fable 5.1 score reported on that one.", "angle": "It's OpenAI's own comparison, so treat every number as best-case framing — but the missing Fable 5.1 data point specifically on ARC-AGI-3 is the tell worth flagging.", "tweetA": "OpenAI's own benchmark table has Astra beating Claude Fable 5.1 on every metric they chose to publish, except one: ARC-AGI-3, where they didn't even bother reporting a Fable 5.1 number. When a competitor's own launch deck has a conspicuous blank cell, that's the number to go find yourself.", "tweetB": "Read vendor benchmark tables like earnings guidance: the numbers they show you are cherry-picked, the ones they omit are the tell. Astra's table has one glaring gap: no Claude Fable 5.1 score on ARC-AGI-3. Either it wasn't available, or it wasn't flattering.", "charts": {"count": 1, "hot": false, "desc": "OpenAI's own launch comparison table across 5 benchmarks — worth opening to see the full row-by-row."}, "link": "https://nlp.elvissaravia.com/p/ai-agents-weekly-gpt-6-astra-claude"}, {"id": 24, "cat": "AI/infra", "urgency": "act", "source": "NLP News (Elvis Saravia)", "title": "NVIDIA agrees to acquire Hugging Face", "idea": "This week's AI Agents Weekly roundup flags that NVIDIA has agreed to acquire Hugging Face, folding the largest open-model hosting and distribution hub into the dominant AI hardware vendor.", "angle": "A vertical-integration move that could reshape open-model distribution economics — NVIDIA now owns both the compute layer and the biggest open-weight distribution channel.", "tweetA": "NVIDIA just agreed to buy Hugging Face, the default distribution hub for every open-weight model on earth. NVIDIA now owns the compute AND the pipes almost every open model ships through. That's not a research acquisition, that's a chokepoint. $NVDA", "tweetB": "Everyone's been asking how NVIDIA defends its moat once AI hardware competition catches up. Now we know part of the answer: buy the platform that decides which open models get distributed and how, and make sure it's optimized for your hardware first.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://nlp.elvissaravia.com/p/ai-agents-weekly-gpt-6-astra-claude"}, {"id": 25, "cat": "science", "urgency": "watch", "source": "NLP News (Elvis Saravia)", "title": "Researchers ran 100 AI agents together — cheating AND whistleblowing spontaneously emerged", "idea": "This week's AI Agents Weekly flags a research result where cheating and whistleblowing behaviors emerged spontaneously in a 100-agent research swarm — social dynamics forming without being explicitly trained for.", "angle": "Emergent social behavior (both adversarial and cooperative-enforcement) in agent swarms is exactly the kind of unplanned complexity that makes multi-agent deployment harder to guarantee-safe than single-agent systems.", "tweetA": "Put 100 AI agents in a research swarm together and you don't just get task completion, you get cheating AND whistleblowing, neither of which anyone trained for. Every company racing to deploy multi-agent systems in production should sit with that sentence for a minute.", "tweetB": "Single-agent AI safety research is basically solved-adjacent. Multi-agent safety is not, and this is why: put enough agents together and you get emergent social dynamics, including policing behavior nobody programmed. We're building organizational structures, not just tools, and we don't have the alignment theory for organizations yet.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://nlp.elvissaravia.com/p/ai-agents-weekly-gpt-6-astra-claude"}, {"id": 26, "cat": "positioning", "urgency": "deep", "source": "Dark Side of the Boom (Goldman Sachs / Chris Cha)", "title": "Korean retail dip-buying collapsed 90% in two months — corporate buybacks are the only thing holding up KOSPI", "idea": "Goldman's Chris Cha: Korean retail net buying fell to KRW5.4 trillion in August from KRW54.5 trillion in June (~90% drop) as dip buyers turned into break-even sellers after the late-July correction. Corporate buybacks led by Samsung and SK Hynix have absorbed selling from retail, institutions, and foreigners. Cha estimates the buyback pace could run out by late September to mid-October.", "angle": "A concrete, dated risk window — the KOSPI's main support mechanism has an expiration date roughly 4-6 weeks out, and foreign flows haven't returned to replace it.", "tweetA": "Korean retail net buying: KRW54.5T in June to KRW5.4T in August. A 90% collapse in two months. The ONLY thing holding the KOSPI up right now is Samsung and SK Hynix buying back their own stock, and Goldman says that buyback runway runs out by mid-October. Mark the date.", "tweetB": "Everyone's watching Fed dots and CPI prints for the next macro catalyst. Here's a cleaner one with an actual expiration date: Korean corporate buybacks propping up KOSPI run dry in 4-6 weeks, and retail, the group that used to buy every dip, has already quit.", "charts": {"count": 1, "hot": false, "desc": "Goldman flow chart of Korean retail vs corporate vs foreign net buying by month — worth opening."}, "link": "https://thedarksideoftheboom.substack.com/p/koreas-buyback-bid-is-holding-the"}, {"id": 27, "cat": "gold", "urgency": "deep", "source": "Dark Side of the Boom (Goldman Sachs / Tony Kim)", "title": "Central banks now buy 1,000+ tonnes of gold a year, against 3,500 tonnes of mine supply", "idea": "Goldman's Tony Kim: central banks used to buy roughly 400-500 tonnes of gold annually; that figure is now closer to 1,000-1,100 tonnes, against annual mine supply of about 3,500 tonnes. Kim's practical marker for stronger sovereign/institutional sponsorship is around $4,000/oz.", "angle": "Central banks alone now absorb roughly 30% of annual mine supply, up from ~12-14% historically — a structural float reduction independent of any macro/rate narrative.", "tweetA": "Central banks are now buying 1,000+ tonnes of gold a year against 3,500 tonnes of total mine supply. That's roughly 30% of ALL new gold going straight into vaults that never sell. A decade ago it was closer to 12-14%. This is a supply story wearing a macro costume.", "tweetB": "Goldman's own marker for gold is $4,000/oz, the level where sovereign buying becomes visibly dominant. Pair that with the mining-capex drought (drilling near historic lows despite gold up $3,000/oz since 2022) and you get a structural bull case that survives any single CPI print.", "charts": {"count": 1, "hot": true, "desc": "🔥 CHART WORTH SAVING — chart via Axi Select showing central bank gold purchases vs mine supply over time."}, "link": "https://thedarksideoftheboom.substack.com/p/gold-weekly-the-bull-market-has-a"}, {"id": 28, "cat": "positioning", "urgency": "deep", "source": "Herb Greenberg — The Wrap", "title": "G-III Apparel: raised EPS guidance, flat revenue guidance, and a 10% sales miss", "idea": "G-III Apparel's stock, up more than 50% since Herb Greenberg's original short report over a year ago, is now up 'a mere 16%' after missing on sales (down 10%) despite the earnings release headlining raised earnings guidance. Revenue guidance stayed flat, licensing revenue is fading as Calvin Klein/Tommy Hilfiger relationships wind down, and the newly closed Mark Jacobs acquisition brings dilution over the next 12 months.", "angle": "Management led with the number that looks good (EPS guidance) and buried the one that doesn't (flat revenue, declining licensing) — the stock giving back more than half its post-report gain says the market read the fine print.", "tweetA": "G-III's earnings release headline: 'raising earnings guidance.' What it didn't say: revenue guidance stayed FLAT, sales missed by 10%, and licensing revenue is fading as Calvin Klein and Tommy Hilfiger wind down. The stock gave back most of its post-earnings pop once people read past the headline. $GIII", "tweetB": "Watch for this pattern in earnings season: EPS guidance up, revenue guidance flat, sales miss. That combination means margin engineering, not growth, and it usually means the next print is where the market actually notices.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.herbgreenberg.com/p/the-wrap-recapping-what-you-may-have"}, {"id": 29, "cat": "culture", "urgency": "watch", "source": "Herb Greenberg — The Wrap", "title": "Serial stock promoters with fraud track records are pivoting into AI — with an assist from Nvidia's halo", "idea": "Herb Greenberg's Wrap notes a recurring pattern: stock promoters who've cycled through past 'money grabs,' leaving trails of regulatory action, activist short-seller attention, bankruptcies, insider-dealing allegations and criminal convictions among founders, are now re-emerging in AI, often with the help of association with Nvidia.", "angle": "'Nvidia-adjacent' is becoming the new promotional halo phrase, the way 'blockchain-based' was in 2018 — worth building a mental red-flag list before Q4 retail flows chase it.", "tweetA": "Herb Greenberg is tracking the same promoters who ran the blockchain hype cycle, the cannabis hype cycle, and the SPAC hype cycle, now showing up in AI, with Nvidia's name doing the credibility laundering. The names change. The playbook doesn't.", "tweetB": "'Nvidia-adjacent' is becoming what 'blockchain-based' was in 2018: a halo phrase promotional stock operators attach to otherwise shaky companies. If a microcap's entire pitch is a vague Nvidia relationship and a founder with a securities-fraud history, you already know how this ends.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.herbgreenberg.com/p/the-wrap-recapping-what-you-may-have"}, {"id": 30, "cat": "gold", "urgency": "deep", "source": "Dark Side of the Boom (ING / Ewa Manthey)", "title": "The Netherlands didn't buy more gold — it moved 86 tonnes to London so it can actually sell it in a crisis", "idea": "The Dutch central bank moved ~86 tonnes of gold from New York/Ottawa to London, not new purchases, a relocation. London's share of Dutch reserves rose from 18.1% to 32.1%; total holdings unchanged at 612.4 tonnes. It used a mix of gold sales/rebuys and physical transfers as what amounts to a dry run for moving reserves under stress.", "angle": "A liquidity-preparedness story, not a bullish-gold story — but it reveals a G7-adjacent central bank actively war-gaming crisis access to its own reserves.", "tweetA": "The Dutch central bank just ran a live-fire drill for moving its own gold reserves under crisis conditions, relocating 86 tonnes to London specifically because it's easier to sell there fast. No new buying, just a rehearsal for a scenario they clearly think is plausible enough to prepare for.", "tweetB": "If central banks are quietly stress-testing how fast they can access and sell their own reserves, that tells you more about how seriously they're taking geopolitical fragmentation risk than any public statement would. The Dutch didn't announce a crisis plan, they just executed one.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/why-it-matters-where-central-banks"}, {"id": 31, "cat": "geopolitics", "urgency": "deep", "source": "Dark Side of the Boom (ING / Ewa Manthey)", "title": "Venezuela has been locked out of $4B of its own gold at the Bank of England since 2018", "idea": "Venezuela renewed its request for the return of ~$4 billion of gold held at the Bank of England to fund earthquake reconstruction. It's been unable to access the bullion since 2018 due to a dispute over which authority (Maduro government vs. opposition-recognized entities) can represent the central bank.", "angle": "The cautionary case for every country now increasing gold allocations in foreign vaults for 'safety' — physical custody abroad is subject to the host country's courts and political recognition decisions, which can freeze access for years absent formal sanctions.", "tweetA": "Venezuela has been locked out of $4B of its own gold at the Bank of England for 8 years, not because of sanctions, but because UK courts can't agree on who legally represents Venezuela's central bank. Every country stacking gold in London as 'safe' storage should read this case file first.", "tweetB": "The gold-repatriation debate always frames the risk as 'what if they freeze it.' Venezuela shows the more common failure mode: nobody has to freeze anything if a legal recognition dispute does the job for eight years and counting.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/why-it-matters-where-central-banks"}, {"id": 32, "cat": "commodities", "urgency": "deep", "source": "Tavi Costa", "title": "Gold is up $3,000/oz since 2022. Drilling activity is still near historic lows.", "idea": "Gold prices are nearly $3,000/oz higher than in 2022, yet drilling activity remains near historic lows — the same pattern holds across several other metals. Reserves are depleting, ore grades deteriorating, exploration budgets still declining.", "angle": "The supply-side complement to the central-bank-demand gold thesis: neither demand (CBs buying ~30% of mine supply) nor supply (no new drilling) is loosening up — a rare double-tailwind setup for miners specifically, not just bullion.", "tweetA": "Gold is up $3,000/oz since 2022 and drilling activity STILL hasn't responded. Normally a 3-4x price move drags new supply online within a couple years. This time exploration budgets are still falling. That's not a price problem, that's a decade-long supply gap being locked in right now. $GDX $NEM", "tweetB": "Pair this with central banks buying ~30% of annual mine supply and you get a rare setup: demand structurally rising, supply structurally frozen, and neither side is rate-sensitive. Most gold bull cases hinge on the Fed. This one doesn't need it to work.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://tavicosta.substack.com/p/the-mines-never-built"}, {"id": 33, "cat": "positioning", "urgency": "watch", "source": "Helene Meisler — Saturday Chart Fest", "title": "Nothing made a higher high this week — and the McClellan Summation Index keeps falling despite the 'broadening out' narrative", "idea": "Helene Meisler's weekly chart review found almost no index or sector making a higher high week-over-week; the broad-market read is 'giant sideways in the third quarter.' She flags the McClellan Summation Index still declining, sarcastically noting 'must be all that broadening out,' a jab at the popular narrative that market breadth is improving.", "angle": "When a widely-read technician calls out a specific consensus narrative as contradicted by the actual breadth indicator built to measure it, that's a useful contrarian tell against a story that's become desk consensus.", "tweetA": "The 'market is broadening out' narrative is everywhere right now. The McClellan Summation Index, the actual breadth indicator, is still falling. Somebody's wrong, and it's probably not the indicator built specifically to measure breadth.", "tweetB": "Almost nothing made a new weekly high this week across DJIA, SPX, Nasdaq, IWM, sector ETFs, pick one. 'Giant sideways' isn't a bearish call, it's just what a market topping-out process usually looks like before anyone agrees to call it that.", "charts": {"count": 1, "hot": false, "desc": "20+ chart roundup across major indices and sectors — worth opening for individual levels to watch (XLP, ITB, LIT head-and-shoulders setups flagged)."}, "link": "https://helenemeisler.substack.com/p/saturday-chart-fest-001"}, {"id": 34, "cat": "cybersecurity", "urgency": "watch", "source": "Crypto Integrat — Crypto News", "title": "Trezor's shipping partner breach just doubled in size — 67,000 more customers exposed", "idea": "Trezor's data breach has expanded, with shipping provider ShipMonk exposing full personal details of another 67,000 US customers who ordered between Nov 2019 and Aug 2021.", "angle": "Hardware wallet security is marketed as the 'safe' crypto custody solution, but the actual attack surface keeps turning out to be the logistics/shipping vendor, not the device — physical delivery data is arguably worse than a stolen password.", "tweetA": "Trezor's hardware wallets are cryptographically solid. Its shipping partner just leaked another 67,000 customers' full personal details, meaning attackers now know exactly who owns a hardware wallet AND their home address. The weakest link in cold storage was never the cold storage.", "tweetB": "If you bought a Trezor between Nov 2019 and Aug 2021, someone now has your name, address, and the fact that you own a hardware wallet with real crypto in it. That's a home-invasion targeting list, not just a data breach. Physical security matters as much as the seed phrase.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.cryptointegrat.com/p/crypto-news-september-5-2026"}];
const META = {"date": "2026-09-05", "time": "21:05 CEST", "windowStart": "2026-09-05 15:04 CEST", "windowEnd": "2026-09-05 21:04 CEST", "emailsInWindow": 15, "emailsRead": 15, "itemsExtracted": 34, "includedSources": [{"name": "Dark Side of the Boom", "count": 8}, {"name": "The Founders Corner", "count": 8}, {"name": "Crypto Integrat", "count": 8}, {"name": "Unchained Premium", "count": 1}, {"name": "McKinsey Monthly Highlights", "count": 1}, {"name": "McKinsey Chart of the Week", "count": 1}, {"name": "NLP News", "count": 3}, {"name": "Herb Greenberg", "count": 2}, {"name": "Tavi Costa", "count": 1}, {"name": "Helene Meisler", "count": 1}], "skippedSources": [{"name": "David Lin Report (‘The Fed Is Going To Make A Big Blunder’)", "reason": "Timestamp 13:03:02 UTC — 1.5 minutes before the hard 6-hour cutoff (13:04:33 UTC). Excluded per the strict time-window rule, not for content reasons."}]};
const CAT_COLORS = {"macro": "#e24b4a", "credit": "#378add", "positioning": "#ef9f27", "AI/infra": "#1d9e75", "crypto": "#7f77dd", "geopolitics": "#d85a30", "energy": "#f97316", "tech": "#06b6d4", "gold": "#d4a017", "culture": "#ec4899", "labor": "#8b5cf6", "regulation": "#64748b", "science": "#14b8a6", "venture": "#84cc16", "commodities": "#a16207", "cybersecurity": "#b91c1c"};

const URG_LABEL = { act: "🔴 Act Now", deep: "🔵 Deep", watch: "🟡 Watch" };
const URG_EMOJI = { act: "🔴", deep: "🔵", watch: "🟡" };

let activeCat = "all";
let activeUrg = "all";
let activeSrc = null;

function esc(s) {
  return (s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function catCounts() {
  const counts = {};
  ITEMS.forEach(i => { counts[i.cat] = (counts[i.cat] || 0) + 1; });
  return counts;
}
function urgCounts() {
  const counts = {};
  ITEMS.forEach(i => { counts[i.urgency] = (counts[i.urgency] || 0) + 1; });
  return counts;
}

function renderFilters() {
  const cc = catCounts();
  const cats = Object.keys(cc).sort();
  const catBar = document.getElementById('cat-filters');
  let html = '<button class="pill' + (activeCat === 'all' ? ' active' : '') + '" style="' + (activeCat === 'all' ? 'background:#333;border-color:#333;' : '') + '" onclick="setCat(\'all\')">All (' + ITEMS.length + ')</button>';
  cats.forEach(c => {
    const color = CAT_COLORS[c] || '#888';
    const isActive = activeCat === c;
    html += '<button class="pill' + (isActive ? ' active' : '') + '" style="' + (isActive ? ('background:' + color + ';border-color:' + color + ';') : ('color:' + color + ';border-color:' + color + ';')) + '" onclick="setCat(\'' + c + '\')">' + esc(c) + ' (' + cc[c] + ')</button>';
  });
  catBar.innerHTML = html;

  const uc = urgCounts();
  const urgBar = document.getElementById('urg-filters');
  let uhtml = '<button class="pill' + (activeUrg === 'all' ? ' active' : '') + '" style="' + (activeUrg === 'all' ? 'background:#333;border-color:#333;' : '') + '" onclick="setUrg(\'all\')">All (' + ITEMS.length + ')</button>';
  ['act','deep','watch'].forEach(u => {
    if (!uc[u]) return;
    const isActive = activeUrg === u;
    uhtml += '<button class="pill' + (isActive ? ' active' : '') + '" style="' + (isActive ? 'background:#333;border-color:#333;' : '') + '" onclick="setUrg(\'' + u + '\')">' + URG_LABEL[u] + ' (' + uc[u] + ')</button>';
  });
  urgBar.innerHTML = uhtml;
}

function setCat(c) { activeCat = c; activeSrc = null; renderFilters(); renderCards(); }
function setUrg(u) { activeUrg = u; activeSrc = null; renderFilters(); renderCards(); }

function filterBySrc(name) {
  activeCat = 'all';
  activeUrg = 'all';
  activeSrc = name;
  renderFilters();
  renderCards();
  ITEMS.forEach(i => {
    if (i.source.indexOf(name) !== -1) {
      const el = document.getElementById('card-' + i.id);
      if (el) el.classList.add('open');
    }
  });
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function toggleCard(id) {
  const el = document.getElementById('card-' + id);
  el.classList.toggle('open');
}

function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}

function renderCards() {
  const container = document.getElementById('cards');
  const emptyNote = document.getElementById('empty-note');
  let visible = 0;
  let html = '';
  ITEMS.forEach(item => {
    let show = true;
    if (activeCat !== 'all' && item.cat !== activeCat) show = false;
    if (activeUrg !== 'all' && item.urgency !== activeUrg) show = false;
    if (activeSrc && item.source.indexOf(activeSrc) === -1) show = false;
    if (show) visible++;
    const color = CAT_COLORS[item.cat] || '#888';
    const chartFlag = item.charts && item.charts.hot ? '🔥' : (item.charts && item.charts.count > 0 ? '📊' : '');
    html += '<div class="card' + (show ? '' : ' hidden-item') + '" id="card-' + item.id + '">';
    html += '  <div class="card-head" onclick="toggleCard(' + item.id + ')">';
    html += '    <span class="idx">' + String(item.id).padStart(2, '0') + '</span>';
    html += '    <span class="urg">' + (URG_EMOJI[item.urgency] || '') + '</span>';
    html += '    <span class="src-badge" style="background:' + color + '">' + esc(item.source) + '</span>';
    html += '    <span class="cat-tag">' + esc(item.cat) + '</span>';
    if (chartFlag) html += '    <span class="chart-flag">' + chartFlag + '</span>';
    html += '    <span class="card-title">' + esc(item.title) + '</span>';
    html += '    <span class="chev">▸</span>';
    html += '  </div>';
    html += '  <div class="card-body">';
    html += '    <div class="block-label">The Idea</div>';
    html += '    <div class="idea-text">' + esc(item.idea) + '</div>';
    html += '    <div class="block-label">My Angle</div>';
    html += '    <div class="angle-box" style="border-left:2px solid ' + color + ';background:' + color + '14;">' + esc(item.angle) + '</div>';
    html += '    <div class="tweets-row">';
    html += '      <div class="tweet-box a"><div class="t-label">TWEET A</div><div class="tweet-text">' + esc(item.tweetA) + '</div><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button></div>';
    html += '      <div class="tweet-box b"><div class="t-label">TWEET B</div><div class="tweet-text">' + esc(item.tweetB) + '</div><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div>';
    html += '    </div>';
    if (item.charts && (item.charts.count > 0 || item.charts.desc)) {
      html += '    <div class="charts-box' + (item.charts.hot ? ' hot' : '') + '">' + (item.charts.hot ? '🔥 ' : '📊 ') + esc(item.charts.desc || (item.charts.count + ' chart(s) in email')) + '</div>';
    }
    html += '    <a class="read-link" href="' + esc(item.link) + '" target="_blank" rel="noopener">↗ Read full article</a>';
    html += '  </div>';
    html += '</div>';
  });
  container.innerHTML = html;
  emptyNote.hidden = visible !== 0;
}

function renderReportCard() {
  let html = '';
  html += '<div>Window: <strong>' + esc(META.windowStart) + '</strong> to <strong>' + esc(META.windowEnd) + '</strong>. Emails outside this window were not processed.</div>';
  html += '<div>Emails in window: ' + META.emailsInWindow + ' &middot; Emails read: ' + META.emailsRead + ' &middot; Items extracted: ' + META.itemsExtracted + '</div>';
  html += '<div class="rc-section-title">Included Sources</div>';
  META.includedSources.forEach(s => {
    html += '<div><span class="src-link" onclick="filterBySrc(\'' + s.name.replace(/'/g, "\\'") + '\')">' + esc(s.name) + '</span> — ' + s.count + ' item(s)</div>';
  });
  if (META.skippedSources && META.skippedSources.length) {
    html += '<div class="rc-section-title">Skipped / Excluded</div>';
    META.skippedSources.forEach(s => {
      html += '<div class="skip-item"><strong>' + esc(s.name) + '</strong>: ' + esc(s.reason) + '</div>';
    });
  }
  document.getElementById('rc-body').innerHTML = html;
}

document.getElementById('rc-toggle').addEventListener('click', () => {
  const rc = document.getElementById('report-card');
  rc.classList.toggle('open');
  document.getElementById('rc-chev').textContent = rc.classList.contains('open') ? '▾' : '▸';
});

document.getElementById('meta-line').textContent = META.date + ' · ' + META.time + ' · ' + META.itemsExtracted + ' items from ' + META.includedSources.length + ' sources';

renderFilters();
renderCards();
renderReportCard();
</script>
