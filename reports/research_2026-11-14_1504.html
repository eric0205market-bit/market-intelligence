function col(c){ return CATC[c] || "#888"; }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function tint(hex){ return hex + "14"; }

function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}

function toggleCard(id){ document.getElementById('card'+id).classList.toggle('open'); }

function renderBars(){
  var cats = {}; ITEMS.forEach(function(i){ cats[i.cat] = (cats[i.cat]||0)+1; });
  var h = '<span class="pill'+(state.cat==="all"?' active':'')+'" style="'+(state.cat==="all"?'background:#333':'')+'" onclick="setCat(\'all\')">All '+ITEMS.length+'</span>';
  Object.keys(cats).sort(function(a,b){return cats[b]-cats[a];}).forEach(function(c){
    var a = state.cat===c;
    h += '<span class="pill'+(a?' active':'')+'" style="'+(a?'background:'+col(c):'')+'" onclick="setCat(\''+c+'\')">'+esc(c)+' '+cats[c]+'</span>';
  });
  document.getElementById('catbar').innerHTML = h;
  var u = {act:0,deep:0,watch:0}; ITEMS.forEach(function(i){ u[i.urgency]++; });
  var g = '<span class="pill'+(state.urg==="all"?' active':'')+'" style="'+(state.urg==="all"?'background:#333':'')+'" onclick="setUrg(\'all\')">All</span>';
  ["act","deep","watch"].forEach(function(k){
    var a = state.urg===k;
    g += '<span class="pill'+(a?' active':'')+'" style="'+(a?'background:#555':'')+'" onclick="setUrg(\''+k+'\')">'+URGL[k]+' '+u[k]+'</span>';
  });
  document.getElementById('urgbar').innerHTML = g;
}

function setCat(c){ state.cat=c; state.src=null; renderBars(); renderCards(false); }
function setUrg(u){ state.urg=u; state.src=null; renderBars(); renderCards(false); }
function filterBySrc(name){ state.src=name; state.cat="all"; state.urg="all"; renderBars(); renderCards(true); window.scrollTo(0,0); }

function renderCards(expand){
  var out = '', n = 0;
  ITEMS.forEach(function(item){
    if (state.cat!=="all" && item.cat!==state.cat) return;
    if (state.urg!=="all" && item.urgency!==state.urg) return;
    if (state.src && item.source.indexOf(state.src)===-1 && state.src.indexOf(item.source)===-1) return;
    n++;
    var c = col(item.cat), ch = item.charts || {count:0,hot:false,desc:""};
    var icon = ch.hot ? ' 🔥' : (ch.count>0 ? ' 📊' : '');
    out += '<div class="card'+(ch.hot?' hot':'')+(expand?' open':'')+'" id="card'+item.id+'">';
    out += '<div class="ch" onclick="toggleCard('+item.id+')">';
    out += '<span class="num">#'+item.id+'</span><span>'+URG[item.urgency]+'</span>';
    out += '<span class="src" style="background:'+c+'">'+esc(item.source)+'</span>';
    out += '<span class="cat">'+esc(item.cat)+'</span>'+icon;
    out += '<span class="ttl">'+esc(item.title)+'</span></div>';
    out += '<div class="cb">';
    out += '<div class="lbl">the idea</div><div class="idea">'+esc(item.idea)+'</div>';
    out += '<div class="lbl">my angle</div><div class="angle" style="border-color:'+c+';background:'+tint(c)+'">'+esc(item.angle)+'</div>';
    out += '<div class="tw">';
    out += '<div class="twb"><div class="twh"><span class="twa">TWEET A</span><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button></div>'+esc(item.tweetA)+'</div>';
    out += '<div class="twb"><div class="twh"><span class="twbb">TWEET B</span><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div>'+esc(item.tweetB)+'</div>';
    out += '</div>';
    out += '<div class="chart'+(ch.hot?' hotc':'')+'">'+(ch.hot?'🔥 CHART WORTH SAVING · ':'📊 ')+(ch.count?ch.count+' chart(s) · ':'')+esc(ch.desc||'')+'</div>';
    out += '<a class="lnk" href="'+esc(item.link)+'" target="_blank" rel="noopener">↗ Read full article</a>';
    out += '</div></div>';
  });
  document.getElementById('cards').innerHTML = out || '<div class="empty">No items match these filters.</div>';

  else b.style.display='none';
}
