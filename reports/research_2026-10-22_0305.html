<script>
const ITEMS = [{"id": 1, "cat": "energy", "urgency": "act", "source": "Dark Side of the Boom / Asia Open", "title": "Oil as roulette: Brent >$110, WTI >$101, then three reversals in one session", "idea": "Brent topped $110 and WTI $101 after two more Gulf tanker attacks, then rolled over on Kremlin talk of resuming trilateral negotiations, a Russia-related US general licence and China/Russia oil-cooperation headlines. Late: State Dept staff/family departures from Gulf embassies (later clarified as narrower) and a reported attack on an Aramco field in the eastern region pushed crude back up. Author: 'pick a number, oil will be there three headlines from now.'", "angle": "Realized vol is the trade, not direction. Long-dated airline/refiner exposure is a headline-latency bet; Southwest was the third US airline to cut guidance on fuel this month.", "tweetA": "Brent $110 to risk-off and back inside one session, driven by a diplomatic headline and an embassy memo that got walked back. That's not price discovery, it's a latency contest. I'd rather own the vol than the direction. $USO $XLE", "tweetB": "An evacuation order that gets 'clarified as narrower' within hours still moved crude and the whole yield curve. The market is now pricing the press-release lag. Who's long that carry?", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/asia-open-us-stock-futures-slip-as"}, {"id": 2, "cat": "macro", "urgency": "act", "source": "Dark Side of the Boom / Asia Open", "title": "20Y auction tails at the highest yield since 1986; French 10Y through 5%", "idea": "The 20-year auction tailed at the highest yield since 1986 while French 10-year yields pushed above 5%. The late oil bounce dragged yields higher across the curve with the short end underperforming, which took the air out of the late equity bid.", "angle": "Oil to breakevens to term premium is the transmission. Duration supply plus energy shocks is the combination long-duration equity can't ignore.", "tweetA": "20Y auction at the highest yield since 1986. OAT 10Y over 5%. And the equity tape's response was to chase tech for six hours. Positioning must have been very defensive, or very deaf. $TLT", "tweetB": "Oil up, short end underperforms, 20Y tails. That's the opposite of a flight to quality. The bond market is telling you the Gulf is an inflation story now, not a safe-haven one.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/asia-open-us-stock-futures-slip-as"}, {"id": 3, "cat": "credit", "urgency": "act", "source": "Dark Side of the Boom / Asia Open", "title": "Hyperscaler spreads at fresh wides while equities rally; CoreWeave yield back under 15%", "idea": "Hyperscaler credit spreads pushed to fresh wides even as data-center debt got a modest bid. CoreWeave bonds improved enough to take yields below 15% with the stock flat; SpaceX shares rose on the capex narrative but its bonds moved the other way. Author's framing: 'the market can be right about the technology and wrong about the financing bill.'", "angle": "Credit is where the AI capex question is being asked first. A 15% handle on CoreWeave is the benchmark for what 'marginal' AI financing costs.", "tweetA": "CoreWeave paper yields just under 15%. Hyperscaler spreads at new wides. Equity says 'AI demand is strong.' Credit says 'show me the cash flows.' One of them is going to be repriced. $CRWV", "tweetB": "SpaceX stock up on capex, SpaceX bonds down on capex. Same news, two asset classes, opposite verdicts. The lender and the shareholder are no longer underwriting the same company.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/asia-open-us-stock-futures-slip-as"}, {"id": 4, "cat": "positioning", "urgency": "deep", "source": "Dark Side of the Boom / Asia Open", "title": "Hedge-fund short ratio at a one-month high; >1M SpaceX calls; Mag7 vs S&P 493 divergence", "idea": "Hedge funds were better buyers with demand in tech and consumer while long-only leaned to the offer; the HF short ratio hit its highest of the month, so good AI prints triggered a squeeze-like response. More than a million SpaceX calls traded, momentum baskets ripped, Mag 7 beat the S&P 493 and the ex-AI cohort barely moved - the mirror image of last week's broadening.", "angle": "Short-covering plus call buying explains the amplitude of the AI bounce better than fundamentals. Fade-able if credit doesn't confirm.", "tweetA": "Hedge fund short ratio at a monthly high going into AI earnings. Then good prints. That's not a re-rating, that's a spring being released. Watch if the S&P 493 follows. $QQQ", "tweetB": "1M+ SpaceX calls in a day. The retail options complex now has its own mega-cap to gamma-squeeze. Dealers are short something very large.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/asia-open-us-stock-futures-slip-as"}, {"id": 5, "cat": "tech", "urgency": "act", "source": "Dark Side of the Boom / Asia Open", "title": "Meta warns AI serving costs rise; Tesla cuts 2026 capex - opposite messages, same session", "idea": "Meta gave a strong revenue outlook, but investors balked once it said the next leg of the buildout needs significantly more investment and higher serving costs. Tesla cut its 2026 capex forecast with Q3 spending well below expectations. Argument has shifted from revenue growth to 'cost of sustaining it.'", "angle": "Serving cost (inference) is now the line investors underwrite. Pressure Point also notes Meta will issue a new class of shares to fund AI - connect the two.", "tweetA": "Meta: the cost of serving AI goes up. Tesla: we'll spend less. Both fell. The market has stopped paying for capex and started asking for the unit economics. $META $TSLA", "tweetB": "Revenue guide up, stock down. In 2024 that print rallies 10%. The marginal AI dollar is no longer free; it's being priced as a financing decision.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/asia-open-us-stock-futures-slip-as"}, {"id": 6, "cat": "venture", "urgency": "watch", "source": "Dark Side of the Boom / Asia Open", "title": "Data-center blowups: NextDC -45% in Australia, Elice's Korean debut flop", "idea": "NextDC imploded 45% in Australia and was largely shrugged off by US markets, whereas Elice's disastrous Korean debut a day earlier upset sentiment. Author reads this as investors distinguishing idiosyncratic execution failures from names that can fund and monetize the buildout.", "angle": "Second-tier data-center operators are where funding stress shows up first. Boockvar also flagged NEXTDC ('never heard of them') in his subject line.", "tweetA": "A 45% one-day drop in a listed data-center operator and the Nasdaq led higher. The AI complex is now tiering itself: the funded and the hoping.", "tweetB": "Elice in Korea, NextDC in Australia: regional AI-infra names breaking on execution, in a week hyperscalers widen. Watch the weakest balance sheets first.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/asia-open-us-stock-futures-slip-as"}, {"id": 7, "cat": "positioning", "urgency": "deep", "source": "Dark Side of the Boom / Retail Investors", "title": "Retail equity allocation 71.8% (AAII) - 2000 territory; >50% expect higher stocks, a ~35-year high", "idea": "AAII retail equity allocation is 71.8%, a level barely seen since 2000; the only recent touch was ~72% in late 2017, just before Volmageddon. Conference Board shows more than half expect higher stocks in 12 months (near a 35-year high) while expectations for lower rates and easing inflation fell. Bloomberg's Simon White: share of stories mentioning 'bubble' is well below late-2025 and 2020 peaks.", "angle": "Burry, Klarman, Grantham, Dalio and Griffin all warn; retail doesn't care and 'bubble' mentions fall. Sentiment-to-allocation gap is the signal.", "tweetA": "Retail equity allocation 71.8%. Last time: 2000, and a brief 72% in late 2017 right before Volmageddon. Meanwhile 'bubble' mentions in Bloomberg are *falling*. Complacency doesn't need a bubble headline. $SPY", "tweetB": "Five famous bears shouting and the crowd's reply is a buy button. Being early has cost more than being wrong on the upside. That's exactly how every top gets built.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/retail-investors-keep-buying-despite"}, {"id": 8, "cat": "tech", "urgency": "act", "source": "AI Ramblings Daily / Michael Parekh", "title": "Tesla-SpaceX merger committees formed: ~$3.6T combined; SpaceX rev +161% to $14.6B", "idea": "Musk says both boards set up special committees on a merger on SpaceX's first earnings call since its June IPO. Combined ~$3.6T; Musk has ~84% of SpaceX votes vs ~20% at Tesla; Tesla deal needs a majority of all shares. SpaceX revenue +161% to $14.6B, AI unit ('Super Intelligence') up ninefold to $7.6B; analysts see combined FCF burn of at least $54B this year. Parekh: Nasdaq's rule change fast-tracked SpaceX into the Nasdaq-100, and a larger entity grabs more passive flow.", "angle": "Passive-index mechanics: a merger converts Tesla's index weight into a bigger SpaceX-linked weight. Tesla core autos at ~$0.5T on fundamentals vs Toyota <$300B.", "tweetA": "SpaceX AI unit: $0.8B to $7.6B in a year-ish. Tesla core valued like Toyota is <$300B. A merger only works if the market pays for robots and rockets at the same multiple. Index funds will own it either way. $TSLA", "tweetB": "The merger is a financing event dressed as a strategy. $54B burn, 84% vs 20% votes, and an index rule written fast enough to fit it. Follow the passive bid.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/the-fix-is-in-in-ai-musk-nvidia-openai"}, {"id": 9, "cat": "energy", "urgency": "deep", "source": "AI Ramblings Daily / Michael Parekh", "title": "Nvidia DSX POD: closed-loop cooling cuts water 'up to 100%', 54M liters/day saved at 2GW; setup 6 months to 14 days", "idea": "Nvidia's DSX blueprint for Vera Rubin uses liquid-cooled chips, closed loop and dry coolers with no evaporation; claims 54M liters/day saved at a 2GW site and up to 30% less power for the same output, with grid-responsive power dialing. Containerized POD cuts setup from six months to 14 days; 17 partners (Dell, Foxconn, Schneider), deliveries early next year. Parekh ties it to data-center resistance ahead of the midterms.", "angle": "Water and grid politics are the binding constraint, not chips. 14-day deployment collapses the time-to-revenue for neoclouds - and the construction moat of those who build slowly.", "tweetA": "Six months to 14 days for data-center setup, and zero evaporated water. Nvidia is selling a permitting answer as much as a chip. Local opposition just lost its best talking point. $NVDA $SU", "tweetB": "54 million liters/day at one 2GW site. That's the number every county commission is asking about. Midterms plus water: the AI buildout's real regulator is a zoning board.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/the-fix-is-in-in-ai-musk-nvidia-openai"}, {"id": 10, "cat": "tech", "urgency": "deep", "source": "AI Ramblings Daily / Michael Parekh", "title": "OpenAI models to Google Cloud; GCP growth ~82% vs 37% (AWS) and 42% (Azure)", "idea": "OpenAI will put GPT models in Google Cloud's model garden and coding tool within weeks, so it is now on all three US clouds after Microsoft's exclusive licence ended in April. Parekh cites Google Cloud growth speeding to ~82% last quarter vs 37% for Amazon and 42% for Microsoft; all three report next week.", "angle": "Model neutrality across clouds turns hyperscalers into distribution, not kingmakers. GCP at 82% is the growth outlier to track into next week's prints.", "tweetA": "GCP growing 82%. AWS 37%. Azure 42%. And now OpenAI sells through all three. The cloud wars have a surprising winner: whoever isn't the OpenAI landlord. $GOOGL $MSFT $AMZN", "tweetB": "Exclusivity ended in April; Google gets OpenAI in October. Both frontier labs are now multi-cloud. The model layer is commoditizing faster than the compute layer.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/the-fix-is-in-in-ai-musk-nvidia-openai"}, {"id": 11, "cat": "culture", "urgency": "watch", "source": "AI Ramblings Daily / Michael Parekh", "title": "Consumer AI agents: Meta's Muse passes 10M downloads in ~a month; Instinct users +10% per day", "idea": "Economist overview via Parekh: proactive assistants are replacing waiting-for-prompt Siri-style bots. Meta's Muse has 10M+ downloads in a little over a month vs 3.7M for ChatGPT's app in its first stretch; texting-based startup Instinct is growing ~10% a day. Shopify, Walmart, Instacart and Expedia work with agents; Amazon is keeping them out for now. Parekh's metric: first to 100M daily users, and a non-shopping habit.", "angle": "Agent-vs-gatekeeper fight (Amazon) is the commerce analog of the browser wars. 10% daily growth compounds absurdly if it lasts even a month.", "tweetA": "10% daily growth is 17x in a month if it holds. It won't. But Instinct is a text message, not an app. The distribution moat is the phone number. $META $AMZN", "tweetB": "Amazon blocks agents while Shopify, Walmart and Instacart let them in. First time a retailer's best defense against AI is saying no to its own customers' assistants.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/the-fix-is-in-in-ai-musk-nvidia-openai"}, {"id": 12, "cat": "AI/infra", "urgency": "deep", "source": "a16z / Gimlet Labs (Zain Asgar)", "title": "GPU's 1000x inference gain: only 2.5x from process; 16x from number formats, 12.5x from new instructions", "idea": "Citing Bill Dally (Hot Chips 2023): of the ~1000x single-GPU inference speedup in ~10 years, 16x came from simpler number formats (FP32 to BF16), 12.5x from new instructions, 2x from sparsity and only 2.5x from process (28nm to 5nm). Dennard voltage scaling died ~2005, cost per transistor stalled ~2012. Author says there isn't much room below 4-bit precision.", "angle": "If process was <1% of the log gain, the 'node shrink' narrative understates architecture. Remaining levers are heterogeneity, memory and networking.", "tweetA": "Dally's breakdown: 1000x GPU inference gain, and process node explains 2.5x of it. Number formats alone gave 16x. Everyone watches TSMC nodes. The money was in the data type. $NVDA $TSM", "tweetB": "Going 32-bit to 4-bit was the free lunch. There's no 2-bit sequel at the same quality. Where does the next 10x come from? Orchestration across chips.", "charts": {"count": 1, "hot": true, "desc": "Dennard scaling breakdown chart: voltage, frequency and core count flattening around 2005; Dally's inference performance gain decomposition."}, "link": "https://www.a16z.news/p/why-hardware-specialization-is-back"}, {"id": 13, "cat": "AI/infra", "urgency": "deep", "source": "a16z / Gimlet Labs (Zain Asgar)", "title": "Tokens demand 24x by 2030 vs available power ~2x (Goldman 2026); compute +80x vs memory bandwidth +17x (2012-22)", "idea": "Goldman 2026: token demand up 24x from 2026 to 2030 while available power grows ~2x. Patterson: NVIDIA GPU compute +80x vs memory bandwidth +17x from 2012 to 2022 because compute scales with chip area but bandwidth with perimeter. Nvidia now orchestrates GPUs with Groq-derived SRAM 'LPUs'; Cerebras, d-Matrix put memory on die. Author's company Gimlet splits inference across chip types for better perf/watt.", "angle": "24x demand vs 2x power forces an efficiency multiple of ~12x to be found somewhere. That's the case for SRAM/near-memory vendors and photonics.", "tweetA": "Token demand 24x by 2030. Power supply 2x. Somebody has to find a 12x efficiency gain that isn't free. That's the entire specialized-silicon thesis in one ratio. $NVDA $CRDO $AVGO", "tweetB": "Compute scales with area, bandwidth with perimeter. A geometry problem decides who wins inference. HBM allocation, not FLOPs, is the scarce good.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.a16z.news/p/why-hardware-specialization-is-back"}, {"id": 14, "cat": "AI/infra", "urgency": "deep", "source": "a16z / Gimlet Labs (Zain Asgar)", "title": "The 1990s 'killer micros' killed Cray, Thinking Machines, Symbolics - now the pendulum swings back", "idea": "Specialists (ETA 1989, Multiflow 1990, Alliant 1992, Symbolics 1993, KSR and Thinking Machines 1994, Cray Computer 1995) died when volume-driven general-purpose micros beat them even on their own workloads. Makimoto's pendulum: generalization wins while Moore's law pays, specialization wins when the free lunch ends. Author expects specialization for years, eventually swinging back; fab and HBM allocation favor GPUs near-term.", "angle": "Historical template for 2026 custom-silicon valuations: ideas survive, companies often don't (CPUs absorbed vector units as SSE/AVX).", "tweetA": "Cerebras, Groq, d-Matrix are the 2026 Thinking Machines. Specialist ideas always win; specialist companies usually don't. Nvidia buying Groq's architecture is the 1990s CPU absorbing vector units again. $NVDA", "tweetB": "The pendulum thesis has one tell: when agents can write the kernels, the software moat of the generalist shrinks. That's the actual difference this cycle.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.a16z.news/p/why-hardware-specialization-is-back"}, {"id": 15, "cat": "venture", "urgency": "watch", "source": "This Week in AI / TypeSafe Jev", "title": "'Decision models' became a category in 5 weeks: TypeSafe at $7.5B ($870M, a16z), input $0.042/M tokens, ~100ms", "idea": "TypeSafe's Jev returns yes/no probabilities, multiple-choice picks or scores with confidence, no generated text. Input is $0.042 per million tokens with free output; claims 20-200x faster and 40-400x cheaper. OpenAI's Decisions API on GPT-6 Luna costs $0.10 per million input tokens; Amazon and Cloudflare shipped their own. TypeSafe raised $870M at a $7.5B valuation led by a16z. Most popular use: router in front of expensive models.", "angle": "A new price floor for classification-style agent steps, an input to token-demand math: cheaper steps raise call volume.", "tweetA": "$0.042 per million input tokens and 100ms. That's a router priced like a rounding error. If decisions are free, the expensive model only gets called for the 5% that need it. Jevons applies. $MSFT", "tweetB": "Five weeks from stealth to a $7.5B valuation and three hyperscalers copying the product. 'Decision model' is the fastest category to commoditize I've seen.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.thisweekinai.ai/p/jev-check-in-help-your-agent-make"}, {"id": 16, "cat": "gold", "urgency": "deep", "source": "The Bubble Bubble Report", "title": "Silver's five-decade cup-and-handle: $50 breakout, $121 peak in Jan 2026, 'next leg' call", "idea": "Author argues silver's multi-decade cup-and-handle (resistance $50, the 1980 and 2011 peaks) broke out in fall 2025, parabolized to $121 in January 2026 and has corrected since. Public interest arrived within days of the peak and left on the pullback. Projects hundreds of dollars/oz after the cooling-off completes.", "angle": "Technical thesis, so weight lightly; but the sentiment pattern (crowd arrives at the top, leaves on the dip) is clean and testable against gold/silver ratio.", "tweetA": "Silver hit $121 in January and everyone discovered it the same week. Now it's 'dead money.' The retail round trip is the data point, not the cup and handle. $SLV", "tweetB": "A pattern that took 50 years to form projects 'hundreds' per oz. Fine. But the ratio to gold and ETF flows decide whether $50 holds as support. That's the level to watch.", "charts": {"count": 1, "hot": true, "desc": "Five-decade silver cup-and-handle chart with $50 resistance."}, "link": "https://thebubblebubble.substack.com/p/silvers-bull-market-roadmap"}, {"id": 17, "cat": "regulation", "urgency": "deep", "source": "The Pressure Point / Fulcrum", "title": "Safety refusals cost defenders time while attackers cycle accounts and models", "idea": "Wired: criminal hackers manipulate systems including Claude into agentic attacks despite safeguards; Axios: authorized security teams say models 'can suddenly refuse to help' during investigations. Author argues refusals hit the identifiable (defenders) harder than anonymous attackers who split tasks across accounts or run local models. Calls for verified-access tiers, published refusal rates, appeal times and evidence of campaign disruption; separate Axios report: advanced models can blueprint attacks on power and water systems.", "angle": "Verified-defender tiers are a product and a regulatory gap. Also a signal for cyber vendors (identity-gated AI).", "tweetA": "Attacker hits a refusal and rewrites the prompt, splits across accounts, or runs a local model. Defender hits a refusal and files a ticket. Safety systems are measuring blocked prompts, not disrupted campaigns. $CRWD $PANW", "tweetB": "Models that can blueprint attacks on power and water systems, with refusals that bite the utility engineer and not the intruder. The fix is identity, not vocabulary.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://pressurepoint.whatsthelatest.ai/archive/the-pressure-point-safety-catches-the-accountable/"}, {"id": 18, "cat": "regulation", "urgency": "act", "source": "The Pressure Point / Fulcrum", "title": "Judge orders Meta to pay New Mexico $25B after jury finds it deceived users", "idea": "A judge ordered Meta to pay New Mexico $25B after a jury found it deceived Facebook users about privacy and content moderation (ABC). Same issue: Meta will issue a new class of shares to fund AI initiatives (Verge) and Southwest became the third major US airline this month to cut its 2026 profit forecast on fuel.", "angle": "State AG litigation is a new tail risk for platform balance sheets; combined with a new share class for AI funding, governance and dilution questions stack up.", "tweetA": "$25B from one state, one jury. Meta is also creating a new share class to fund AI. The legal reserve and the capex bill are now competing for the same cash. $META", "tweetB": "Third US airline this month cutting guidance on fuel. Everybody trading oil as a headline; the P&L already told you the average price.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://pressurepoint.whatsthelatest.ai/archive/the-pressure-point-safety-catches-the-accountable/"}, {"id": 19, "cat": "positioning", "urgency": "deep", "source": "Eliant's Exploits / Eliant Capital", "title": "Fear & Greed in 'fear' while Nasdaq and small caps are +~220bps on the week", "idea": "Semis had nine straight red days before a washout bottom; this week small caps and Nasdaq are each up ~220bps and SPX ~130bps. Under the hood: % of stocks above 20D 48% (neutral), above 50D only 34% (oversold). Growth and momentum factors rebounded from oversold, value/low-vol faded, and Fear & Greed still reads fear, which author reads as a breadth reset beneath benign index levels.", "angle": "Fear + oversold 50D breadth with index up 1-2% is a classic mid-correction washout setup; compare with the retail 71.8% allocation - sentiment surveys and positioning disagree.", "tweetA": "Indices +130 to +220bps on the week and Fear & Greed still says fear. 34% above the 50D. The tape isn't lying; it's just describing a different market than the index. $IWM $QQQ", "tweetB": "Nine red days in semis, then a washout. Retail holds 72% equities while the market's own gauge reads fear. Someone's measuring the wrong thing: allocation or sentiment.", "charts": {"count": 1, "hot": false, "desc": "Fear-Greed index history overlaid with S&P (not rendered in plain text)."}, "link": "https://www.eliantcapital.com/p/when-pessimism-peaks"}];
const META = {"date": "2026-10-22", "time": "03:05 CEST", "windowStart": "2026-10-21 21:04 CEST", "windowEnd": "2026-10-22 03:04 CEST", "emailsInWindow": 15, "emailsRead": 10, "itemsExtracted": 19, "includedSources": [{"name": "Dark Side of the Boom / Asia Open", "items": 6}, {"name": "Dark Side of the Boom / Retail Investors", "items": 1}, {"name": "AI Ramblings Daily / Michael Parekh", "items": 4}, {"name": "a16z / Gimlet Labs (Zain Asgar)", "items": 3}, {"name": "This Week in AI / TypeSafe Jev", "items": 1}, {"name": "The Bubble Bubble Report", "items": 1}, {"name": "The Pressure Point / Fulcrum", "items": 2}, {"name": "Eliant's Exploits / Eliant Capital", "items": 1}], "skippedSources": [{"name": "Eliant subscriber chat / SixSigma chat / MacroEdge chat", "reason": "automated subscriber-chat notifications"}, {"name": "Maggie Lake live video (SpaceX Surprise)", "reason": "live-stream notification, no body"}, {"name": "Pequity Research 50% OFF", "reason": "pure promo"}, {"name": "GitHub: Collect Twitter workflow failed (54bc4e7)", "reason": "automated CI notification - note: workflow failing repeatedly"}, {"name": "Geiger Capital: My 3rd Midterm Bet", "reason": "body only a Polymarket squad link, no position detail"}, {"name": "WealthVest Weekly Bull&Bear S11E32", "reason": "podcast stub; only topic list (Fed, DM debt, 5 AI questions)"}]};
var COL={macro:"#e24b4a",credit:"#378add",positioning:"#ef9f27","AI/infra":"#1d9e75",crypto:"#7f77dd",geopolitics:"#d85a30",energy:"#f97316",tech:"#06b6d4",gold:"#d4a017",culture:"#ec4899",labor:"#8b5cf6",regulation:"#64748b",science:"#14b8a6",venture:"#84cc16"};
var UE={act:"🔴",deep:"🔵",watch:"🟡"};
var fc="all",fu="all",fs=null;
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}
function pill(label,active,color,fn){return '<span class="pill" style="'+(active?'background:'+color+';border-color:'+color+';color:#fff':'')+'" onclick="'+fn+'">'+label+'</span>'}
function filters(){
  var cn={};ITEMS.forEach(function(i){cn[i.cat]=(cn[i.cat]||0)+1});
  var h=pill("All ("+ITEMS.length+")",fc==="all","#333","setC('all')");
  Object.keys(cn).forEach(function(c){h+=pill(c+" ("+cn[c]+")",fc===c,COL[c]||"#555","setC('"+c+"')")});
  document.getElementById("cats").innerHTML=h;
  var un={act:0,deep:0,watch:0};ITEMS.forEach(function(i){un[i.urgency]++});
  var u=pill("All",fu==="all","#333","setU('all')");
  [["act","🔴 Act Now"],["deep","🔵 Deep"],["watch","🟡 Watch"]].forEach(function(x){u+=pill(x[1]+" ("+un[x[0]]+")",fu===x[0],"#333","setU('"+x[0]+"')")});
  document.getElementById("urgs").innerHTML=u;
}
function setC(c){fc=c;fs=null;render(false)}
function setU(u){fu=u;fs=null;render(false)}
function filterBySrc(name){fs=name;fc="all";fu="all";render(true)}
function card(i,open){
  var c=COL[i.cat]||"#555";
  var ch=i.charts.count?('<div class="chart'+(i.charts.hot?' hot':'')+'">'+(i.charts.hot?'🔥 CHART WORTH SAVING — ':'📊 ')+esc(i.charts.desc||'Charts inside — worth opening')+'</div>'):'<div class="chart">No chart in email. Charts inside article may exist — worth opening</div>';
  return '<div class="card'+(open?' open':'')+'" id="c'+i.id+'"><div class="head" onclick="document.getElementById(\'c'+i.id+'\').classList.toggle(\'open\')"><span class="num">#'+i.id+'</span><span>'+UE[i.urgency]+'</span><span class="src" style="background:'+c+'">'+esc(i.source)+'</span><span class="tag">'+esc(i.cat)+'</span>'+(i.charts.count?'<span>'+(i.charts.hot?'🔥':'📊')+'</span>':'')+'<span class="ttl">'+esc(i.title)+'</span></div>'
  +'<div class="body"><div class="lbl">The Idea</div><div>'+esc(i.idea)+'</div><div class="lbl">My Angle</div><div class="angle" style="border-color:'+c+';background:'+c+'14">'+esc(i.angle)+'</div>'
  +'<div class="tw"><div><div class="lbl" style="color:#378add">Tweet A</div>'+esc(i.tweetA)+'<br><button class="copy-btn" onclick="copyTweet(' + i.id + ',\'a\')">📋 Copy</button></div>'
  +'<div><div class="lbl" style="color:#7f77dd">Tweet B</div>'+esc(i.tweetB)+'<br><button class="copy-btn" onclick="copyTweet(' + i.id + ',\'b\')">📋 Copy</button></div></div>'
  +ch+'<div style="margin-top:8px"><a href="'+esc(i.link)+'" target="_blank" rel="noopener">↗ Read full article</a></div></div></div>';
}
function render(open){
  filters();
  var h="";ITEMS.forEach(function(i){
    if(fc!=="all"&&i.cat!==fc)return;if(fu!=="all"&&i.urgency!==fu)return;
    if(fs&&i.source.indexOf(fs)<0)return;h+=card(i,!!fs)});
  document.getElementById("list").innerHTML=h||"<p>No items.</p>";
}
function init(){
  document.getElementById("meta").textContent=META.date+" · "+META.time+" · "+ITEMS.length+" items";
  var r="<p>Window: "+META.windowStart+" to "+META.windowEnd+". Emails outside this window were not processed.</p><p>Emails in window: "+META.emailsInWindow+" · read: "+META.emailsRead+" · items: "+META.itemsExtracted+"</p><b>Included sources (click to filter)</b><ul>";
  META.includedSources.forEach(function(s){r+='<li><span class="sl" onclick="filterBySrc(\''+s.name.replace(/'/g,"")+'\')">'+esc(s.name)+'</span> — '+s.items+'</li>'});
  r+="</ul><b>Skipped</b><ul>";
  META.skippedSources.forEach(function(s){r+="<li>"+esc(s.name)+" — "+esc(s.reason)+"</li>"});
  document.getElementById("repbd").innerHTML=r+"</ul>";
  render(false);
}
init();
</script></body></html>
