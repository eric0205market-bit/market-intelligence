<script>
const ITEMS = [{"id": 1, "cat": "AI/infra", "urgency": "deep", "source": "Seven c Newsletter #193", "title": "SOX -21.8% in five sessions — worst since Sept 2001, then $500-600B bounced back in a day", "idea": "Semiconductor Index fell 21.8% over five sessions, the largest five-day decline since September 2001. SOXL lost 60% in the same stretch. Chips then recovered roughly $500-600B of market cap and the Nasdaq 100 rose 2.4% as dip-buyers stepped in.", "angle": "A 2001-sized drawdown followed by a one-day half-recovery is a liquidity event, not a thesis change. Matters for sizing in photonics/memory names where beta is highest.", "tweetA": "SOX -21.8% in 5 days was a 2001 print. SOXL -60%. And the market handed back $500B+ the very next session. Either that's the cleanest dip-buy of the cycle or a dead-cat bounce with leverage on both sides. $SOXX $NVDA", "tweetB": "Look at what a 3x product does to a 22% index move: -60%, and a 2.4% Nasdaq bounce can't repair it (it needs +150%). Leveraged ETF holders are the marginal seller in this tape, not fundamentals. $SOXL", "charts": {"count": 0, "hot": false, "desc": "No chart seen in email body — article link may have charts"}, "link": "https://sevenc.substack.com/p/seven-c-newsletter-193"}, {"id": 2, "cat": "positioning", "urgency": "deep", "source": "Seven c Newsletter #193", "title": "Record 11.23M put contracts in a day — 8 of the 10 biggest days are in 2026", "idea": "CBOE US put volume hit a record 11.23M contracts on Thursday, above the 10.22M record from 4 April 2025. The 20-day average is near a record and eight of the ten highest daily readings came in 2026.", "angle": "Hedging demand is structurally higher this year; the record only beat Liberation Day by ~10%, which says the panic was big but not unprecedented in options terms.", "tweetA": "Record puts: 11.23M vs 10.22M on Liberation Day. A 4.3% SPX drop and only a 10% bigger put print than April 2025 tells you hedges had been quietly bought all year. Who's left to sell?", "tweetB": "8 of the top 10 put-volume days are in 2026. Funny how a year with 'the market's fine' headlines is the year everyone kept paying for protection. Smart money was never as bullish as the index.", "charts": {"count": 0, "hot": false, "desc": "No chart seen in email body — article link may have charts"}, "link": "https://sevenc.substack.com/p/seven-c-newsletter-193"}, {"id": 3, "cat": "positioning", "urgency": "deep", "source": "Seven c Newsletter #193", "title": "Retail bought 22 straight sessions — $33B — right into the crash; YTD record +$251B", "idea": "Retail investors bought US equities for 22 consecutive sessions through 3 Nov, about $33B, the third-longest streak since the 2021 memestock mania. Year-to-date retail purchases are a record $251B.", "angle": "Retail was max long into the Thursday flush. $33B / 22 sessions is ~$1.5B a day — meaningful but small next to $3T erased; the pain is in the leverage layer.", "tweetA": "Retail bought 22 sessions in a row, $33B, and then Thursday happened. $251B YTD is a record. The question for next week: do they keep buying the dip, or is this the first leg of capitulation?", "tweetB": "$33B of retail inflow over 22 sessions vs $3T of market cap gone in one day. Retail didn't cause this move, it just supplied the bid that made the unwind orderly enough to be sold into. $SPY $QQQ", "charts": {"count": 0, "hot": false, "desc": "No chart seen in email body — article link may have charts"}, "link": "https://sevenc.substack.com/p/seven-c-newsletter-193"}, {"id": 4, "cat": "macro", "urgency": "deep", "source": "Seven c Newsletter #193", "title": "Payrolls +165k, UR 4.1% — and a December Fed HIKE is now 80% priced", "idea": "October payrolls rose 165k, about 100k above consensus, unemployment fell to 4.1%. Odds of a 25bp hike in December jumped to a new high of 80% after earlier 'crashing'. The next FOMC move being a hike is the base case, not tail.", "angle": "The market is trading AI-regulation fear while the rates channel is pricing tightening into a 4.3% equity drop. That combination is the squeeze on duration-heavy tech.", "tweetA": "A 100k jobs beat flipped December hike odds to 80%. Equities sold 4.3% on politics in the same week the Fed path got hawkish. Nobody is pricing the interaction. $TLT $QQQ", "tweetB": "What does a Fed hiking into a vol shock look like? Last time the answer was Dec 2018. Different cause, same setup: hike odds up, risk assets gapping down, buyback blackout about to end. Watch Tuesday's CPI.", "charts": {"count": 0, "hot": false, "desc": "No chart seen in email body — article link may have charts"}, "link": "https://sevenc.substack.com/p/seven-c-newsletter-193"}, {"id": 5, "cat": "macro", "urgency": "deep", "source": "Seven c Newsletter #193", "title": "Productivity +3.5%, unit labor costs -0.7% — AI capex is showing up in the national accounts", "idea": "Q3 nonfarm productivity rose 3.5% annualized, third straight quarterly gain, with output +3.7% and unit labor costs -0.7%. The source attributes it largely to AI, software and equipment investment. Fed balance sheet is also at $6.75T, +$212B since the Dec 2025 low.", "angle": "Productivity up and ULC down is the bull case for AI in one line — and the opposite of a hike-worthy inflation impulse. The Fed hiking against falling ULC is a policy-error candidate.", "tweetA": "ULC -0.7% with output +3.7%. If that's AI, then the disinflation story is real, and a December hike is fighting the thing that's actually working. $SPY", "tweetB": "Productivity +3.5% and the S&P just had its worst day since Liberation Day. The macro data says AI is working; the tape says the political risk premium on AI just reset. Those can both be true, and that's the trade.", "charts": {"count": 0, "hot": false, "desc": "No chart seen in email body — article link may have charts"}, "link": "https://sevenc.substack.com/p/seven-c-newsletter-193"}, {"id": 6, "cat": "macro", "urgency": "deep", "source": "Seven c Newsletter #193", "title": "Housing 'frozen': purchase apps 131, mortgage 7.18%, above 7% for seven straight weeks", "idea": "MBA purchase index fell 2% to 131 — second-lowest since Jan 2025, sixth-lowest weekly reading since 1995, 50% below 2019. The 30-yr fixed is 7.18%, up 120bp since February and above 7% for seven weeks.", "angle": "Rates up 120bp since Feb with a hike priced is the housing lock-in compounding. Fits a K-shaped economy: AI capex booming, rate-sensitive consumer assets frozen.", "tweetA": "Purchase apps at the sixth-lowest level since 1995, in an economy printing +165k jobs. Mortgage rates +120bp since February. Housing doesn't need a recession to be in one.", "tweetB": "30yr at 7.18%, a December hike at 80%. The housing market isn't frozen, it's waiting for a rate cut that the Fed is now pricing out. $ITB $XHB", "charts": {"count": 0, "hot": false, "desc": "No chart seen in email body — article link may have charts"}, "link": "https://sevenc.substack.com/p/seven-c-newsletter-193"}, {"id": 7, "cat": "AI/infra", "urgency": "deep", "source": "Seven c Newsletter #193", "title": "Computer/server orders +27% y/y — biggest since January 1997; nondefense capex ex-air at record $86B", "idea": "Nondefense capital goods shipments ex-aircraft rose 11.6% y/y in September to a record $86B (3m annualized +16.5%). Orders for computers, servers and storage are +27% y/y, the largest increase since January 1997.", "angle": "January 1997 is the pre-dotcom acceleration comparison. Hard data says the physical buildout hasn't blinked even as equities repriced.", "tweetA": "Computer & server orders +27% y/y — highest since Jan 1997. The stock market is pricing an AI bust while the Census Bureau is pricing 1997. One of them is wrong. $SMCI $DELL $VRT", "tweetB": "Record $86B in capex shipments and tech stocks down 20%+. The buildout is a real-economy fact; the equity drawdown is a financing and politics story. Follow the orders, not the multiples.", "charts": {"count": 0, "hot": false, "desc": "No chart seen in email body — article link may have charts"}, "link": "https://sevenc.substack.com/p/seven-c-newsletter-193"}, {"id": 8, "cat": "venture", "urgency": "deep", "source": "Seven c Newsletter #193", "title": "OpenAI $11B at $1.25T; Anthropic eyeing a November IPO raising $80-100B at $1.25-1.75T (FT)", "idea": "OpenAI closed $11B of a new round at a $1.25T valuation. FT reports Anthropic plans a November IPO raising $80-100B at a $1.25-1.75T valuation, about $1.5T before Thanksgiving.", "angle": "An $80-100B raise is the largest IPO ever by a wide margin, launched into the worst tape since Liberation Day. Equity-supply angle ties directly to Pasquariello's net-supply warning.", "tweetA": "An $80-100B IPO into the worst week since Liberation Day. Even by AI-era standards that's a bold calendar. The window either slams shut or this is the print that reopens it. $ORCL $NVDA", "tweetB": "$100B raise = 6-8% of a $1.25-1.75T company. Add OpenAI's $11B round and you have AI labs absorbing capital at a rate equities haven't had to fund since 2000. Supply is the story nobody's pricing.", "charts": {"count": 0, "hot": false, "desc": "No chart seen in email body — article link may have charts"}, "link": "https://sevenc.substack.com/p/seven-c-newsletter-193"}, {"id": 9, "cat": "AI/infra", "urgency": "act", "source": "Seven c Newsletter #193", "title": "Oracle -5% as Microsoft ends AI cloud capacity rental; stock now -68% from ATH", "idea": "Oracle fell 5% after Microsoft ended its deal to rent AI cloud capacity from it. The stock is down 68% from its record high.", "angle": "A hyperscaler cancelling capacity is the first visible demand-side crack in third-party AI cloud. A 68% drawdown needs +213% to recover.", "tweetA": "Microsoft walked away from renting AI capacity from Oracle. $ORCL is -68% from the high. Who else is holding a take-or-pay they can't use? $MSFT $CRWV", "tweetB": "-68% requires a 3.1x just to get back to the high. The market spent 2025 treating AI cloud backlog as an asset. Cancelled rentals turn backlog into a liability.", "charts": {"count": 0, "hot": false, "desc": "No chart seen in email body — article link may have charts"}, "link": "https://sevenc.substack.com/p/seven-c-newsletter-193"}, {"id": 10, "cat": "positioning", "urgency": "deep", "source": "Seven c Newsletter #193", "title": "Berkshire doubles Q3 buybacks to $9.6B — first buying after ~22 months, net buyer $11.2B YTD", "idea": "Berkshire's Q3 buybacks more than doubled to $9.6B; YTD buybacks $14.4B, ending a near-22-month pause. It has been a net stock buyer of $11.2B YTD versus net sales in 2025.", "angle": "Buffett's shop switching from net seller to buyer is a valuation signal from the one allocator with no benchmark. It happened before the Thursday crash.", "tweetA": "Berkshire spent $9.6B on buybacks in Q3 after 22 months of nothing. The most patient capital allocator alive was bidding for stock before the crash. Cash pile as a call option just got exercised.", "tweetB": "Net seller of stocks in 2025, net buyer of $11.2B in 2026. Berkshire doesn't time markets, but it does know when its own stock is cheaper than the alternatives. $BRK.B", "charts": {"count": 0, "hot": false, "desc": "No chart seen in email body — article link may have charts"}, "link": "https://sevenc.substack.com/p/seven-c-newsletter-193"}, {"id": 11, "cat": "energy", "urgency": "deep", "source": "Seven c Newsletter #193", "title": "1.28B barrels of crude in transit — all-time high; 'timely delivery is the bottleneck'", "idea": "Global crude oil in transit hit a record 1.28B barrels, up 180M in recent weeks, as ship-to-ship transfers and longer routes tie up barrels. Brent fell 5% on US-Iran deal reports, then 10% after Democrats won Congress; Putin discussed a Russia-Iran oil pipeline.", "angle": "Oil afloat is the physical symptom of Hormuz rerouting: supply exists but is stuck in logistics. Price is trading deal headlines while the delivery constraint persists.", "tweetA": "180M extra barrels on the water in a few weeks. That's not a glut, that's a logistics tax. Brent -10% on a US election result tells me the oil market is trading the dollar and demand, not the physical tightness. $USO $XLE", "tweetB": "Putin pitching Iran a Russia-Iran pipeline while the US negotiates Hormuz. Every route that avoids the strait lowers Iran's leverage and raises Russia's. Watch who ends up owning the alternative path.", "charts": {"count": 0, "hot": false, "desc": "No chart seen in email body — article link may have charts"}, "link": "https://sevenc.substack.com/p/seven-c-newsletter-193"}, {"id": 12, "cat": "crypto", "urgency": "act", "source": "Seven c Newsletter #193", "title": "Binance hack: bogus job interview compromised an employee, then an internal AI tool controlled the wallets", "idea": "Binance is resuming withdrawals in phases after the hack. Reuters-attributed reporting: attackers used a fake job interview to compromise an employee, then the compromised computer plus an internal AI tool to control wallets. North Korea denies involvement; extra colour claims a DevOps engineer's relationship with a DPRK spy.", "angle": "The attack vector is social engineering + internal AI agent privilege escalation — AI tools inside custody operations are the new attack surface.", "tweetA": "The exploit wasn't a smart contract. It was a fake job interview, then an internal AI tool with wallet access. Every exchange giving agents operational privileges just got a free audit. $BNB $BTC", "tweetB": "Binance withdrawals resuming in phases. The thing to watch isn't price, it's whether institutional custodians start asking for human-in-the-loop controls on any AI tooling with signing authority.", "charts": {"count": 0, "hot": false, "desc": "No chart seen in email body — article link may have charts"}, "link": "https://sevenc.substack.com/p/seven-c-newsletter-193"}, {"id": 13, "cat": "crypto", "urgency": "deep", "source": "Seven c Newsletter #193", "title": "Crypto regulation splits: Russia approves BTC/ETH/USDT retail, US 401(k) rule at White House, MEXC ban, 67 firms reject OKX tokenisation", "idea": "Same week: Russia's central bank approved BTC, ETH and USDT trading for retail; a rule allowing crypto in US 401(k)s reached the White House; US Treasury plans to ban MEXC over Iran/NK/Russia links; 67 firms incl. Apple and Meta rejected OKX plans to tokenise their stocks; Democrats discussed tougher crypto laws and a bigger strategic Bitcoin reserve.", "angle": "Access expanding (Russia retail, 401k) and enforcement tightening (MEXC, Dem crypto bills) simultaneously. De-dollarization via USDT in Russia is the geopolitical read.", "tweetA": "Russia legalises retail BTC/ETH/USDT the same week Treasury moves to ban MEXC over Russia/Iran flows. Crypto is now an explicit instrument of sanctions policy on both sides. $BTC $ETH", "tweetB": "A 401(k) crypto rule at the White House, Democrats now holding Congress and talking a bigger Bitcoin reserve to win 2028 votes. Crypto is becoming a bipartisan retail product while the AI trade becomes the partisan target.", "charts": {"count": 0, "hot": false, "desc": "No chart seen in email body — article link may have charts"}, "link": "https://sevenc.substack.com/p/seven-c-newsletter-193"}, {"id": 14, "cat": "crypto", "urgency": "watch", "source": "Seven c Newsletter #193", "title": "Satoshi wallets move for the first time since 2010 — unclear if Satoshi or an attacker", "idea": "Outflows from Satoshi-attributed wallets were reported for the first time since 2010, with no clarity on whether it was Satoshi or an attacker. Separately FT says Democrats eye an expanded strategic Bitcoin reserve.", "angle": "Dormant-wallet movement is a tail risk for sentiment more than supply; the key question is whether the keys were compromised.", "tweetA": "Satoshi-era wallets just moved for the first time since 2010. If it's an attacker, key-security assumptions break for every early-era coin. If it's Satoshi, that's a different headline. $BTC", "tweetB": "16 years of dormancy, one transaction, and nobody knows who signed it. This is the one on-chain event where the price impact depends entirely on attribution.", "charts": {"count": 0, "hot": false, "desc": "No chart seen in email body — article link may have charts"}, "link": "https://sevenc.substack.com/p/seven-c-newsletter-193"}, {"id": 15, "cat": "geopolitics", "urgency": "watch", "source": "Seven c Newsletter #193", "title": "BoE warns UK inflation could hit 6.2% if Middle East conflict escalates; Dems prep to strip Canada tariffs", "idea": "Bank of England warned UK inflation could reach 6.2% in an escalation scenario. Separately, Democrats are preparing to remove President Trump's tariffs on Canada after the midterms.", "angle": "Two policy levers on inflation: energy escalation is the upside tail, tariff removal the downside. Gilts and CAD the expressions.", "tweetA": "BoE puts 6.2% UK inflation on the table if the Middle East escalates. The same week Democrats line up removing Canada tariffs. Inflation risk is now two-sided, and the Fed is hiking into it. $GBP $CAD", "tweetB": "6.2% UK CPI as a scenario. Hormuz talks 'progressing' per Trump but P Equity says no progress. The gap between diplomacy headlines and inflation scenarios is the volatility.", "charts": {"count": 0, "hot": false, "desc": "No chart seen in email body — article link may have charts"}, "link": "https://sevenc.substack.com/p/seven-c-newsletter-193"}, {"id": 16, "cat": "geopolitics", "urgency": "deep", "source": "The Pressure Point / Michael McDonough (Fulcrum)", "title": "Pinochet lost under the constitution he wrote — and why the California ballot fight is the 1988 test", "idea": "Chile's opposition accepted the 1980 constitution to enforce its plebiscite clause: No won 56% in Oct 1988, Pinochet left in 1990 but stayed Army chief to 1998. Four conditions drove compliance: clear vote, organized opposition, security-force defections, and the regime's own investment in the constitution. DOJ dismissed its California ballot suit after the Supreme Court refused to segregate ballots.", "angle": "Institutional resilience read: rule-bound exits work when the incumbent has staked legitimacy on the rules. Relevant for political-risk premium on AI regulation after the Blue sweep.", "tweetA": "Pinochet lost because he'd made compliance part of his own legitimacy claim. The US version: DOJ invoked the process, lost in it, and dismissed. Watch the Ninth Circuit case. That's the next test of whether process still binds.", "tweetB": "The Chile 56% No vote took a coalition of socialists and Christian Democrats who agreed on nothing but one procedural goal. Markets are pricing the US midterm as an AI-regulation event; the institutional story is the one that determines how orderly it is.", "charts": {"count": 0, "hot": false, "desc": "No chart in email"}, "link": "https://pressurepoint.whatsthelatest.ai/archive/the-pressure-point-pinochet-wrote-his-own-exit/"}, {"id": 17, "cat": "AI/infra", "urgency": "act", "source": "The Pressure Point / Michael McDonough (Fulcrum)", "title": "Nvidia board opens security investigation after Jensen Huang admits affair with suspected Chinese spy", "idea": "Nvidia opened a security investigation after CEO Huang admitted an affair with a suspected Chinese spy and said he'd cooperate (BBC). FT reporting names Alice Huang of Megaspeed, allegedly recruited by China's MSS; Megaspeed is under scrutiny for chip smuggling.", "angle": "Key-man + national-security + export-control tail on the largest AI company, landing the weekend after a record drawdown and before Monday's open.", "tweetA": "$NVDA starts Monday with a board-level national security investigation into its CEO, after a -6.5% Thursday. The market is not set up for a governance discount on the most owned stock in the world.", "tweetB": "An export-control angle on top of CEO risk: Megaspeed is already being looked at for chip smuggling. The question isn't Jensen's job, it's whether Congress now has a reason to hold hearings on every Nvidia customer in Asia. $NVDA $AMD", "charts": {"count": 0, "hot": false, "desc": "No chart in email"}, "link": "https://pressurepoint.whatsthelatest.ai/archive/the-pressure-point-pinochet-wrote-his-own-exit/"}, {"id": 18, "cat": "geopolitics", "urgency": "act", "source": "The Pressure Point / Michael McDonough (Fulcrum)", "title": "Israel: president tasks Eisenkot with forming a government; he's open to Netanyahu joining", "idea": "Israel's president tasked the opposition leader Eisenkot with forming a coalition government, while Eisenkot said he was open to Netanyahu joining it.", "angle": "Israeli election outcome is a named risk event in SixSigma's week-ahead; coalition shape matters for Iran policy and Hormuz.", "tweetA": "Eisenkot asked to form a government and open to Netanyahu inside it. A unity coalition would be the most hawkish-and-centrist combination possible on Iran. Oil traders should read the cabinet, not the polls.", "tweetB": "Coalition math in Israel and Hormuz talks in the Gulf are the same trade this week. Brent already fell 15% in a week on Iran-deal hope, with the political counterparty about to change. $XLE", "charts": {"count": 0, "hot": false, "desc": "No chart in email"}, "link": "https://pressurepoint.whatsthelatest.ai/archive/the-pressure-point-pinochet-wrote-his-own-exit/"}, {"id": 19, "cat": "energy", "urgency": "act", "source": "The Pressure Point / Michael McDonough (Fulcrum)", "title": "Trump: renewed Iran strikes 'highly unlikely' if nuclear and Hormuz talks progress", "idea": "Trump said renewed strikes on Iran were highly unlikely if nuclear and Strait of Hormuz talks progress, while keeping military action on the table.", "angle": "Conditional language, not a deal. P Equity says there's been no progress; Brent has priced the optimistic path.", "tweetA": "'Highly unlikely if talks progress' is the weakest possible form of no-strikes. Brent fell 15% on deal hopes in a week. The asymmetry now is entirely to the upside on a failed round. $CL $USO", "tweetB": "Trump says no strikes if talks progress; a P Equity note says talks aren't progressing. Read together, the conditional is the whole story.", "charts": {"count": 0, "hot": false, "desc": "No chart in email"}, "link": "https://pressurepoint.whatsthelatest.ai/archive/the-pressure-point-pinochet-wrote-his-own-exit/"}, {"id": 20, "cat": "regulation", "urgency": "watch", "source": "The Pressure Point / Michael McDonough (Fulcrum)", "title": "Blanche won't rule out prosecuting Democratic lawmakers probing the administration; Jeffries backs Hegseth impeachment", "idea": "AG Todd Blanche declined to rule out prosecuting Democratic lawmakers who threaten investigations of administration officials. House Minority Leader Jeffries endorsed impeaching Defense Secretary Hegseth. Ex-adviser Calley Means alleged corruption after resigning.", "angle": "With Democrats holding the House, oversight is about to become the dominant political variable, including subpoena power over tech and Nvidia.", "tweetA": "Democrats take the House and the AG won't rule out prosecuting oversight members. The subpoena fights this produces will land first on defense, then on AI and chips. $LMT $NVDA", "tweetB": "Hegseth impeachment, DOJ threats, a Nvidia security probe. 2027's equity risk premium may include a political-conflict component that has no historical analog in the factor models.", "charts": {"count": 0, "hot": false, "desc": "No chart in email"}, "link": "https://pressurepoint.whatsthelatest.ai/archive/the-pressure-point-pinochet-wrote-his-own-exit/"}, {"id": 21, "cat": "AI/infra", "urgency": "act", "source": "P Equity Research", "title": "Huang's apology: 'whether he remains CEO is to be seen' — plus congressional hearings and export-control risk", "idea": "Huang's company memo admits being unfaithful, says the board started an independent investigation on national-security concerns, and pledges cooperation. P Equity: he hadn't admitted it when asked before; this invites subpoenas, hearings and potential export controls that could shut Nvidia out of Asia.", "angle": "Credibility gap is the second-order risk: 'what else could he be lying about' is the bear's framing; the policy channel is the harder tail.", "tweetA": "Jensen denied it, then admitted it. For a company whose valuation is a trust trade on a roadmap and a supply chain, the first lie matters more than the affair. $NVDA", "tweetB": "The market has been debating AI capex ROI. Now it's debating whether the CEO of the biggest AI company can testify to Congress. That's a different discount rate entirely.", "charts": {"count": 0, "hot": false, "desc": "No chart in email"}, "link": "https://pequityresearch.substack.com/p/speedrun-upcoming-events-this-week-8fa"}, {"id": 22, "cat": "macro", "urgency": "act", "source": "P Equity Research", "title": "This week's catalyst: CPI Tuesday (headline 0.3% est vs 0.6% prior), PPI Friday (0.4% vs 1.3% prior)", "idea": "Calendar: Tue Nov 10 core CPI MoM 0.2% est vs 0.3% prior, headline 0.3% est vs 0.6% prior; Fri Nov 13 PPI 0.4% est vs 1.3% prior. Iran conflict update: 'no progress is being made'.", "angle": "With December hike odds at 80%, a hot CPI gets priced as a certainty; a soft print would cause a violent hedge unwind. Prior 0.6% headline and 1.3% PPI show the energy shock already in the base.", "tweetA": "Headline CPI at 0.6% last month, PPI at 1.3%. Fed hike at 80%. And equities just fell 4.3% on politics. Tuesday's print decides whether this week is a squeeze or a leg lower. $SPY $TLT", "tweetB": "PPI +1.3% prior means the pipeline pressure is upstream. If CPI is merely in line, the market learns the Fed still hikes; if it's soft, hike odds collapse and duration rips. Positioning is asymmetric.", "charts": {"count": 0, "hot": false, "desc": "No chart in email"}, "link": "https://pequityresearch.substack.com/p/speedrun-upcoming-events-this-week-8fa"}, {"id": 23, "cat": "macro", "urgency": "deep", "source": "Goldfinger Capital / Robert Sinn", "title": "Thursday was the largest single-day market-cap loss in history: $3T off the S&P alone; QQQ 'failed breakout'", "idea": "Sinn: Thursday erased US$3T from S&P 500 companies, the largest one-day market-cap loss ever. QQQ's early-October marginal new high came on light volume and weak momentum; failed breakouts bring fast moves opposite. Mega-cap tech/AI weakened over the month; the midterm result added fear of a tougher AI regulatory environment. Subject also flags '2000 dot-com déjà vu'.", "angle": "Technical read supports the macro one: breakouts on light volume that fail tend to retrace fully. Email body truncated at the paywall — open for the charts.", "tweetA": "$3T in a day is the record. But the QQQ high in October was on light volume and failed. The tape had told you before the election did.", "tweetB": "Dot-com déjà vu charts are everywhere this week. The difference: in 2000 the capex cycle was ending; the Sep 2026 orders data (+27% computers) says it isn't. That divergence is the whole trade. $QQQ", "charts": {"count": 1, "hot": false, "desc": "QQQ daily chart with failed breakout; more charts in article (email truncated) — worth opening"}, "link": "https://robertsinn.substack.com/p/the-charts-of-the-week-1182026-tech"}, {"id": 24, "cat": "gold", "urgency": "watch", "source": "Goldfinger Capital / Robert Sinn", "title": "Gold and silver 'may have put in a tradable low' after weeks of selling", "idea": "Subject and snippet: after weeks of selling, gold and silver may have put in a tradable low, in a 'Precious Metals Rally' section of the weekly charts post. Full detail behind the link.", "angle": "Metals bottoming while equities crash and hikes get priced is the interesting divergence; need the chart to judge. ", "tweetA": "Gold and silver sold off for weeks while the S&P had its record loss day. If metals bottom alongside a risk-off event, the 'real rates' story is finally being overridden by the hedging story. $GLD $SLV", "tweetB": "A hike priced at 80% is a headwind for gold, and still a tradable low may be in. That tells me positioning was washed out more than fundamentals changed. $GC", "charts": {"count": 1, "hot": false, "desc": "Precious metals chart in article — worth opening"}, "link": "https://robertsinn.substack.com/p/the-charts-of-the-week-1182026-tech"}, {"id": 25, "cat": "macro", "urgency": "deep", "source": "MKTCONTEXT", "title": "Nasdaq -6.5%, SPX -4.3% — biggest drop since Liberation Day; hedges removed Wednesday created the squeeze", "idea": "After the election, investors removed hedges, creating a Wednesday short-squeeze; Thursday the 'blue sweep' reality reversed it all and more. Nasdaq -6.5% through its 200-day, SPX -4.3% (largest since April 2025), vol spiked and correlations surged. Timer: Bearish.", "angle": "Hedge removal on Wednesday + correlation spike Thursday = the classic positioning trap. Correlation surge ends the rotation trade.", "tweetA": "Wednesday everyone sold their hedges and squeezed the market higher. Thursday they needed them back at 2x the price. That's how you get -4.3% on a political event that was a consensus outcome.", "tweetB": "Nasdaq through the 200-day with correlations at 1. A rotation market only works when stocks disagree. They stopped disagreeing on Thursday. $QQQ $IWM", "charts": {"count": 0, "hot": false, "desc": "No chart seen in email body — article link may have charts"}, "link": "https://www.mktcontext.com/p/sharp-selloff-blue-wave"}, {"id": 26, "cat": "positioning", "urgency": "deep", "source": "MKTCONTEXT", "title": "'End of the rotational market': AI complex down since June, Mag 7 joined in October, now breadth cracking; portfolios 70% cash", "idea": "MktContext: AI complex has been selling off since June, Mag 7 joined in October, and now the broader market is cracking. Fundamentals and earnings are deteriorating. Their portfolios went from 40% cash (several weeks) to 70% cash by Friday.", "angle": "A sequential spread of the selloff (AI, Mag7, breadth) is what a bear leg looks like. Contradicts the strong capex data — so the question is margins and financing.", "tweetA": "AI since June, Mag 7 since October, everything else since Thursday. That sequence is how bear markets travel. The only question is where it stops. $SPY", "tweetB": "A tactical manager going from 40% to 70% cash in a week tells you what systematic and discretionary allocators are doing. That's the next leg of selling: de-grossing, not panic.", "charts": {"count": 0, "hot": false, "desc": "No chart seen in email body — article link may have charts"}, "link": "https://www.mktcontext.com/p/sharp-selloff-blue-wave"}, {"id": 27, "cat": "positioning", "urgency": "watch", "source": "Cubic Analytics", "title": "'The most impactful market studies occur at extremes' — a rare signal flashed this week", "idea": "Cubic says a rare signal flashed this week, and the studies on what it implies for the likely path (not the guaranteed path) are behind the paywall. Method: isolate truth at distribution extremes to exploit others' fear and greed.", "angle": "Content is a teaser, so no number to trade. Useful as a flag that quant shops see this week as an extreme-event study set. Open to see the studies.", "tweetA": "Quant studies only get interesting at extremes, and this week gave one: record put volume, record cap loss, SOX -22% in 5 days. Expect a wave of 'what happens next after X' studies, and check their sample sizes.", "tweetB": "Every extreme-event study has n<10. Treat any 'after Thursday, forward returns are +X%' chart with suspicion, and look at what else was true then.", "charts": {"count": 0, "hot": false, "desc": "No chart seen in email body — article link may have charts"}, "link": "https://cubicanalytics.substack.com/p/this-volatility-is-your-friend"}, {"id": 28, "cat": "positioning", "urgency": "act", "source": "The Dark Side of the Boom / Stephen Innes (Goldman: Garrett)", "title": "Goldman's Garrett: 'biggest vol surprise in 19 years' — record equity turnover, HF positioning collapse, but 'no systemic break'", "idea": "GS's Brian Garrett: Thursday's dislocation was historic in magnitude (extraordinary vol surprise, record equity turnover, violent hedge-fund positioning collapse) but systemic stress is well below GFC, pandemic and Liberation Day. Investors are paying up for protection they discarded hours earlier, and systematic sellers are still working through exposure. He's looking for opportunities on the other side.", "angle": "Spread between vol surprise and funding stress is the key distinction. Systematic selling still to come is the near-term risk; stress gauges are low.", "tweetA": "Biggest vol surprise in 19 years, record turnover, hedge funds in collapse — and Goldman's own stress gauge says not systemic. If that's the all-clear, buying protection after the move is the most expensive trade of the week.", "tweetB": "Garrett's tell: 'systematic sellers still working through exposure.' So the panic is over but the mechanical selling isn't. Expect Monday to be about vol-control and CTA rebalancing, not headlines. $VIX", "charts": {"count": 0, "hot": false, "desc": "No chart seen in email body — article link may have charts"}, "link": "https://thedarksideoftheboom.substack.com/p/the-biggest-surprise-in-19-years"}, {"id": 29, "cat": "positioning", "urgency": "deep", "source": "The Dark Side of the Boom / Stephen Innes (Goldman: Pasquariello)", "title": "Goldman's Pasquariello: one last S&P push in 2026, then the biggest increase in net equity supply since 2000", "idea": "Pasquariello (27 years at GS) still expects the S&P to make one final push higher before year-end, but sees a harder 2027: earnings growth decelerating, corporate demand for equities weakening, AI infrastructure facing a complicated financing landscape. The next year could bring the largest increase in net equity supply since 2000. Three bull-market drivers are turning at different speeds.", "angle": "Net equity supply (IPOs like Anthropic/OpenAI, converts, secondaries) + weaker buybacks is the demand-supply mechanic of a top. Written pre-crash; the crash makes 'one last push' harder.", "tweetA": "Net equity supply highest since 2000 next year. Anthropic is eyeing an $80-100B IPO, OpenAI is raising at $1.25T, and corporate buybacks are weakening. 2000 had a lot of this too.", "tweetB": "The 'last rally' call was written before Thursday. If Goldman is right on supply, then Wednesday's relief rally and Thursday's reversal were the setup. Year-end push now needs a catalyst. $SPX", "charts": {"count": 0, "hot": false, "desc": "No chart seen in email body — article link may have charts"}, "link": "https://thedarksideoftheboom.substack.com/p/metamorphic-wall-streets-last-rally"}, {"id": 30, "cat": "macro", "urgency": "watch", "source": "SixSigmaResearch / SixSigmaCapital", "title": "Week-ahead game plan: volatility expected — Jensen situation 'anything but positive for risk assets', Israel election, inflation prints", "idea": "SixSigma expects a volatile week given last week, the Jensen situation over the weekend ('anything but positive for risk assets'), the Israel election, and inflation prints later in the week. Advice: don't do anything that can take you out of the game. Links to a 'Markets in Turmoil' post.", "angle": "Consensus risk calendar: Nvidia governance, Israel coalition, CPI. All three are event-driven and mostly binary.", "tweetA": "Three binary events in one week: Jensen, Israel's coalition, Tuesday CPI. Event-density like this is when correlations go to one and diversification stops working. Size accordingly.", "tweetB": "'A dollar saved is a dollar earned' is the right framing in a week where the market can gap in either direction on a headline. Cash is the only hedge that doesn't reprice.", "charts": {"count": 0, "hot": false, "desc": "No chart seen in email body — article link may have charts"}, "link": "https://open.substack.com/pub/sixsigmacapital/p/markets-in-turmoil?r=5pny2c&utm_campaign=post-expanded-share&utm_medium=web"}];
