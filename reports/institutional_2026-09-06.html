<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>Institutional Research</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root {
  --bg: #faf8f5;
  --surface: #ffffff;
  --border: #e8e3da;
  --border-light: #f0ede4;
  --text: #1a1a1a;
  --text-2: #555;
  --text-3: #8a8a8a;
  --accent: #7c3aed;          /* purple — institutional report accent */
  --accent-soft: #f3eefc;
  --divergence: #d94052;      /* divergence red */
  --consensus: #15803d;       /* consensus green */
  --yellow: #fff5b3;

  /* category colors (institutional schema: rates, growth, fx, equities,
     credit, crypto, energy, commodities, geopolitics, ai_tech, em) */
  --cat-rates: #2563eb;
  --cat-growth: #d97706;
  --cat-fx: #0891b2;
  --cat-equities: #15803d;
  --cat-credit: #be185d;
  --cat-crypto: #8b5cf6;
  --cat-energy: #dc2626;
  --cat-commodities: #ea580c;
  --cat-geopolitics: #b91c1c;
  --cat-ai_tech: #4f46e5;
  --cat-em: #059669;
  --cat-default: #6b7280;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; line-height: 1.55;
       background: var(--bg); color: var(--text); }
.container { max-width: 980px; margin: 0 auto; padding: 24px 16px 80px; }

/* HEADER */
.header { display: flex; justify-content: space-between; align-items: baseline;
          border-bottom: 2px solid var(--text); padding-bottom: 12px; margin-bottom: 12px; }
.title { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
.subtitle { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-3); }

/* STATS BAR (top: period + coverage) */
.stats-top { margin-bottom: 16px; padding: 8px 12px; background: var(--surface);
             border: 1px solid var(--border); border-radius: 6px;
             font-family: 'IBM Plex Mono', monospace; font-size: 11.5px;
             color: var(--text-2); display: flex; gap: 16px; flex-wrap: wrap; }
.stats-top strong { color: var(--text); font-weight: 600; }

/* SUMMARY */
.summary { background: var(--surface); border: 1px solid var(--border);
           border-left: 4px solid var(--accent); border-radius: 6px;
           padding: 16px 18px; margin-bottom: 20px; }
.summary p { margin-bottom: 10px; }
.summary p:last-child { margin-bottom: 0; }
.summary strong { font-weight: 600; }

/* SECTIONS */
.section { background: var(--surface); border: 1px solid var(--border);
           border-radius: 6px; margin-bottom: 14px; overflow: hidden; }
.section-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px;
                background: #f3efe6; cursor: pointer; user-select: none;
                font-weight: 600; font-size: 13px; }
.section-head:hover { background: #ebe6dc; }
.section-letter { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
                  color: var(--text-3); min-width: 18px; }
.section-name { flex: 1; }
.section-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
                 color: var(--text-3); }
.section-arrow { font-size: 10px; color: var(--text-3); transition: transform .2s; }
.section.open .section-arrow { transform: rotate(90deg); }
.section-body { display: none; padding: 6px 0; }
.section.open .section-body { display: block; }

/* THEME CARD (Section A) */
.theme { padding: 14px 16px; border-bottom: 1px solid var(--border-light); }
.theme:last-child { border-bottom: none; }
.theme-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
              flex-wrap: wrap; }
.theme-title { font-weight: 600; font-size: 14.5px; }
.theme-stance { display: grid; grid-template-columns: 1fr; gap: 6px; margin-bottom: 10px; }
@media (min-width: 720px) { .theme-stance { grid-template-columns: 1fr 1fr; } }
.theme-line { font-size: 13px; padding: 8px 10px; border-radius: 4px;
              border-left: 3px solid var(--border); background: #fafafa; line-height: 1.5; }
.theme-line.consensus { border-left-color: var(--consensus); background: #f0f9f3; }
.theme-line.divergence { border-left-color: var(--divergence); background: #fdf6f7; }
.theme-line .lbl { font-family: 'IBM Plex Mono', monospace; font-size: 10px;
                   text-transform: uppercase; letter-spacing: .06em;
                   color: var(--text-3); display: block; margin-bottom: 2px; }
.theme-items { display: flex; flex-direction: column; gap: 8px; padding-left: 10px;
               border-left: 2px solid var(--border-light); }
.theme-item { font-size: 13px; padding: 6px 8px; border-radius: 4px; }

/* ITEM CARDS (Sections B/C/D) */
.item-card { background: var(--surface); border: 1px solid var(--border);
             border-radius: 6px; padding: 12px 14px; margin: 10px 16px; }
.item-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
             flex-wrap: wrap; }
.item-source { font-weight: 600; color: var(--accent); }
a.item-source { text-decoration: none; }
a.item-source:hover { text-decoration: underline; }
.item-link { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--accent); text-decoration: none; }
.item-link:hover { text-decoration: underline; }
.item-title { font-weight: 600; font-size: 14px; margin: 4px 0 6px; }
.item-text { font-size: 13.5px; line-height: 1.6; color: var(--text);
             white-space: pre-wrap; word-wrap: break-word; }

/* DEEP READS (Section C) — purple left border to mark flagship long-form */
.section-deepreads .item-card { border-left: 4px solid var(--accent); background: var(--accent-soft); }

/* HOUSE VIEWS — compact one-line-per-source list */
.hv-row { display: flex; gap: 10px; align-items: baseline;
          padding: 6px 16px; border-bottom: 1px solid var(--border-light);
          font-size: 13px; }
.hv-row:last-child { border-bottom: none; }
.hv-name { font-weight: 600; color: var(--accent); min-width: 180px;
           text-decoration: none; }
.hv-name:hover { text-decoration: underline; }
.hv-stance { color: var(--text); flex: 1; }

/* CATEGORY PILLS */
.pill { display: inline-block; font-family: 'IBM Plex Mono', monospace; font-size: 10px;
        font-weight: 500; padding: 2px 7px; border-radius: 3px; color: #fff;
        text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }

/* IMAGES */
.thumbs { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.thumb { height: 110px; border: 1px solid var(--border); border-radius: 4px;
         cursor: zoom-in; background: #f0ede4; }

/* LIGHTBOX */
.lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85);
            align-items: center; justify-content: center; z-index: 100; cursor: zoom-out; }
.lightbox.open { display: flex; }
.lightbox img { max-width: 92vw; max-height: 92vh;
                box-shadow: 0 8px 40px rgba(0,0,0,.6); }

/* EMPTY */
.empty { color: var(--text-3); font-size: 13px; padding: 14px 18px; font-style: italic; }

/* RESPONSIVE */
@media (max-width: 640px) {
  .container { padding: 16px 12px 60px; }
  .item-card { margin: 8px 10px; }
  .hv-row { flex-direction: column; gap: 2px; }
  .hv-name { min-width: 0; }
  .header { flex-direction: column; align-items: flex-start; gap: 4px; }
}
</style>
</head>

<script>
const REPORT_DATA = {"report_type": "INSTITUTIONAL RESEARCH", "collected_at": "2026-09-06T02:01:39Z", "period": {"lookback_days": 10, "from": "2026-08-27", "to": "2026-09-06"}, "input_stats": {"total_articles": 389, "sources_present": 52, "after_filter": 141}, "summary": "**Rates / Fed:** Consensus is that Fed Chair **Kevin Warsh**'s hawkish Jackson Hole debut lifted September-hike odds toward **50-60%** (Standard Chartered, UBS), but the sharpest split runs even inside the same shop: **PIMCO**'s Clarida reads Warsh as signaling a hike is likely, while PIMCO's own Wilding argues weak wage growth (labor's income share at its **lowest since 1947**) makes the hike case thin — a view **BCA Research** and dovish Fed Governor **Waller** both echo even after a stronger-than-expected August payrolls print.\n\n**Long bonds & fiscal sustainability:** Most agree fiscal supply, not inflation fear, is pushing 30-year yields toward **5-6%** (BNP Paribas, UBS, JPMorgan). The divide is what to do about it: **Gavekal**'s Louis Gave calls this a structurally lost decade for OECD government bonds (only Switzerland has beaten inflation), while **Oxford Economics** and **Franklin Templeton** treat the backup as a buying opportunity and recommend extending duration toward neutral.\n\n**AI capex & credit:** **Goldman**, **UBS** and **Citi** agree AI infrastructure spend keeps climbing toward **$3.8 trillion by 2030**, increasingly funded by hyperscaler debt (**>$200bn** issued, per Citi). Sharpest split: **WisdomTree** and **UBS** stay overweight the AI-infrastructure trade, while **Gavekal**, **Bridgewater**'s Karniol-Tambour and Franklin Templeton's ClearBridge warn markets are pricing the buildout phase, not the harder adoption phase that follows, flagging hyperscaler credit spreads widening back to 2022 levels.\n\n**Gold & de-dollarization:** **Goldman Sachs** forecasts gold to **$4,900/oz** by year-end on accelerating central-bank buying (**100 tonnes/month** as of June), but the **Federal Reserve**'s own research (Colin Weiss) directly rebuts the 'gold overtook Treasuries' narrative, arguing central-bank gold buying has been **flat since 2022** and the rally is a private-ETF-driven valuation illusion.\n\n**Oil / Iran war:** Six months in, **RBC**'s Helima Croft estimates roughly **8 million b/d** of Middle East export capacity remains disrupted and doubts Tehran settles without a **$300bn** reconstruction package; **UBS** is more sanguine, forecasting Brent easing to **~$85/bbl** by December.\n\n**Equities:** Consensus stays constructive — **UBS**, **Standard Chartered** and **Franklin Templeton** (S&P 500 target **7,400-7,800**) recommend buying dips on strong EPS growth — but **Man Group**'s regime model flags September 2026 as most closely resembling **May 1997**, five weeks before the Thai baht devaluation, and **Bridgewater** warns investors are broadly overweight US equities with little margin for error.\n\n**Crypto:** Bitcoin's rally back above **$80,000** is read by **CoinShares** and **Galaxy Digital** as a resurgent 'debasement trade' tied to US fiscal concerns rather than improving fundamentals; Galaxy's headline call is **$250,000** BTC by year-end 2027.", "sections": {"A_debates": [{"theme": "Rates & Central Banks: Warsh vs. the Doves", "category": ["rates", "inflation"], "consensus": "The street agrees the center of gravity shifted hawkish after new Fed Chair Kevin Warsh's Jackson Hole speech reiterated that 2% PCE inflation is a 'firm fixed target' and that the Fed has 'work to do' unless underlying inflation converges 'clearly and at sufficient speed.' Standard Chartered's Market Watch tracked September-hike odds jumping from 36% to roughly 60% immediately after the speech, and UBS, Franklin Templeton and PIMCO's Clarida all treat a hike as a live possibility contingent on the August CPI print and payrolls.", "divergence": "The disagreement is unusually granular, splitting even within single firms. PIMCO's Richard Clarida reads Warsh's speech as a clear green light for a hike, but PIMCO's own Tiffany Wilding pushes back in a separate note, arguing that unit-labor-cost growth (~1% y/y, near pandemic-era lows) is running far below 3.3% core PCE inflation because labor's income share has fallen to its lowest level since 1947 while corporate margins sit at 80-year highs — implying wage-price-spiral risk, and thus the case for a hike, is actually low. BCA Research goes further, arguing the August payrolls beat (162k vs. 55k expected) is 'not yet inflationary' and maintaining a dovish, no-overheating house view even as the market prices a hawkish Fed. Dovish Fed Governor Christopher Waller (cited via Standard Chartered's Daily Navigator and CoinShares) publicly signaled he would favor a hold if disinflation continues, pulling hike odds back toward 50% within days of the Jackson Hole spike — a rare live disagreement playing out inside the FOMC itself. Franklin Templeton's Sonal Desai reads the same Warsh speech as a decisive pivot away from the Fed 'carrying water' for fiscal policy, implying the Fed's near-term reaction function is now dominated by inflation, not growth, while UBS frames the outcome as a binary 'AI liftoff' (up to three hikes, benign) versus 'policy test' (two hikes, painful) scenario and keeps a base case of a Fed on hold through year-end.", "items": [{"source": "pimco", "name": "PIMCO", "thesis": "Reads Warsh's Jackson Hole speech as a clear signal a September hike is on the table, with the August CPI print likely decisive for whether a majority of FOMC voters back it.", "url": "https://www.pimco.com/us/en/insights/chairman-warshs-jackson-hole-speech-emphasizes-price-stability", "images": []}, {"source": "pimco", "name": "PIMCO", "thesis": "Counters that unit-labor-cost growth (~1% y/y) is running far below 3.3% core PCE because labor's income share has fallen to its lowest level since 1947 while corporate margins sit at 80-year highs -- wage-price-spiral risk, and the case for a hike, is low.", "url": "https://www.pimco.com/us/en/insights/if-inflation-is-the-problem-why-arent-wages", "images": []}, {"source": "bca_research", "name": "BCA Research", "thesis": "Discounts the August payrolls beat (162k vs. 55k est.) as not yet inflationary; maintains a dovish, no-overheating house view and a tactical equities-over-bonds tilt even as the market prices a hawkish Fed.", "url": "https://www.bcaresearch.com/marketing/felix-antoine-vezina-poirier", "images": []}, {"source": "franklin_templeton", "name": "Franklin Templeton", "thesis": "Reads Warsh's Jackson Hole speech as a decisive pivot away from the Fed 'carrying water' for fiscal policy -- inflation, not growth, now dominates the Fed's reaction function.", "url": "https://www.franklintempleton.com/articles/2026/fixed-income/on-my-mind-rearranging-the-debt-chairs", "images": []}, {"source": "ubs", "name": "UBS", "thesis": "Frames the outlook as binary: an 'AI liftoff' scenario (up to three hikes, benign, on higher productivity estimates) versus a 'policy test' scenario (two hikes, painful); base case is 2% US growth, gradual disinflation, and a Fed on hold through year-end.", "url": "https://www.ubs.com/global/en/wealthmanagement/insights/chief-investment-office/house-view/daily/2026/latest-04092026.html", "images": []}, {"source": "standard_chartered", "name": "Standard Chartered", "thesis": "Tracked September-hike odds jumping from 36% to ~60% immediately after Warsh's Jackson Hole speech, with the 2-year yield up 11bp and gold down 3.1%.", "url": "https://www.sc.com/sg/market-outlook/market-watch-31-8-2026/?mvog=1", "images": []}, {"source": "standard_chartered", "name": "Standard Chartered", "thesis": "Reports DXY fell 0.7% after Fed Governor Waller signaled he would favor holding rates steady in September if disinflation continues, cutting hike odds back to ~50%.", "url": "https://www.sc.com/sg/market-outlook/daily-navigator-4-9-2026/?mvog=1", "images": []}]}, {"theme": "Long-End Yields & Fiscal Sustainability", "category": ["rates", "financial_stability"], "consensus": "There is broad agreement that the rise in long-end yields -- 30-year Treasuries approaching 5.2-6%, the 10-year JGB briefly touching 3% for the first time in decades, German and French long yields at 15-year highs -- is being driven by fiscal supply and term-premium dynamics rather than near-term inflation fear. BNP Paribas's Chris Iggo, UBS, JPMorgan and Franklin Templeton's Stephen Dover all point to the same underlying culprits: US federal debt above $40 trillion, global government debt near $100 trillion, and AI-linked corporate borrowing competing for the same capital.", "divergence": "The disagreement is about what this means for positioning. Gavekal's Louis Gave takes the most bearish structural view, arguing this has been a genuinely lost decade for OECD government bonds -- not a single major sovereign bond market has kept pace with US inflation, and only Switzerland has delivered a positive real return -- and separately frames Treasury Secretary Bessent's buyback-driven 'Treasury twist' as a race against the Fed's own balance-sheet 'untwist,' with the September 9 expanded buyback as the key tell. Oxford Economics takes the opposite tactical stance: its fair-value models attribute the yield rise to the unwinding of the post-GFC 'global savings glut' (fiscal austerity, US deleveraging, Chinese savings), sees no catalyst to reverse the higher range, but explicitly recommends a mean-reversion duration strategy -- buying into yield backups -- rather than a directional bearish bet. Franklin Templeton's Dover lands in the same camp, recommending investors extend duration toward neutral and add core high-quality corporate credit, arguing TIPS-implied inflation expectations remain stable so this is not a repeat of 2022's simultaneous bond/equity bear market. UBS splits the difference operationally, raising its own year-end forecasts (30-year to 5%, 10-year to 4.5%) while still expecting front-end yields to fall as the Fed holds.", "items": [{"source": "bnp_paribas", "name": "BNP Paribas", "thesis": "US federal debt above $40tn; ~22% of outstanding Treasuries yield above 5% with an average coupon of just 3.25%, so refinancing them at current rates would add over $4bn to the Treasury's annual interest bill; a 5% 10-year yield (vs. 4.7%) is seen as the level that would trigger a buying spree.", "url": "https://www.bnpparibas-am.com/en-us/front-of-mind/view-from-the-markets-bonds-panicand-crisis/", "images": []}, {"source": "gavekal", "name": "Gavekal Research", "thesis": "Louis-Vincent Gave argues protectionism, wars, fiscal profligacy and lenient central banks have made this decade brutal for OECD government bonds -- no major sovereign market has kept pace with US inflation, and only Switzerland has delivered a positive real return.", "url": "https://research.gavekal.com/teaser/where-should-one-buy-bonds/", "images": []}, {"source": "gavekal", "name": "Gavekal Research", "thesis": "Frames Bessent's long-end buyback 'Treasury twist' as racing against the Fed's own balance-sheet 'untwist' away from long-duration holdings; flags the September 9 first expanded buyback as the key test of which side moves faster.", "url": "https://research.gavekal.com/teaser/are-us-long-bonds-a-buy-part-ii/", "images": []}, {"source": "oxford_economics", "name": "Oxford Economics", "thesis": "Attributes the real-yield-driven rise in global bond yields to the unwinding of the post-GFC global savings glut; sees no catalyst to reverse the shift but recommends a mean-reversion duration strategy over a directional bearish bet.", "url": "https://www.oxfordeconomics.com/resource/bonds-and-the-end-of-the-global-savings-glut/", "images": []}, {"source": "franklin_templeton", "name": "Franklin Templeton", "thesis": "Stephen Dover argues rising yields reflect real-rate increases, not inflation fear -- TIPS-implied inflation expectations remain stable -- and recommends extending duration toward neutral plus core high-quality corporate credit.", "url": "https://www.franklintempleton.com/articles/2026/institute/quick-thoughts-making-sense-of-bewildering-bonds", "images": []}, {"source": "ubs", "name": "UBS", "thesis": "Raised year-end forecasts to 30-year Treasury at 5% and 10-year at 4.5%, while still expecting shorter-dated yields to fall as the Fed holds through year-end.", "url": "https://www.ubs.com/global/en/wealthmanagement/insights/chief-investment-office/house-view/daily/2026/latest-04092026.html", "images": []}]}, {"theme": "AI Capex, Hyperscaler Debt & the Credit Question", "category": ["ai_tech", "credit", "equities"], "consensus": "Nearly every desk agrees the AI infrastructure build is still scaling: Citi projects global AI-related capex growing to $3.8 trillion by 2030 from $1 trillion this year with hyperscaler order backlogs up 151% YoY; Goldman sees data-center power demand rising 170% by 2030; and the financing mix is shifting from free cash flow to debt, with Citi citing over $200bn of hyperscaler bond issuance.", "divergence": "The divide is whether that debt shift is a benign broadening of the trade or an early fragility signal. WisdomTree and UBS stay overweight AI infrastructure and power/resources plays, with UBS citing Broadcom's raised FY2027 AI-chip guidance and NVIDIA's post-earnings pop as evidence demand remains understated. On the other side, Bridgewater's Karen Karniol-Tambour warns markets are still pricing the capex buildout phase rather than the harder adoption phase that follows, and Gavekal frames the debate around four explicit scenarios for how hyperscalers' shrinking free cash flow resolves. Franklin Templeton's ClearBridge (Matthew Lilling) argues AI-driven scarcity is letting lower-quality companies -- especially in memory and optical networking -- temporarily post the revenue growth and margins normally associated with quality, warning that when capex slows, smaller earnings beats will expose which firms only 'borrowed quality from the cycle.' The credit-market evidence increasingly supports the caution camp: both BNP Paribas and Franklin Templeton independently observe hyperscaler investment-grade spreads widening back to 2022 levels even as fundamentals stay strong, a technical dislocation Citi calls 'noticeable, though not yet critical' strain on the IG market.", "items": [{"source": "citi_gps", "name": "Citi GPS", "thesis": "Hyperscalers have issued over $200bn in debt to fund AI capex, creating 'noticeable, though not yet critical' strain on the investment-grade market via increasingly complex, off-balance-sheet data-centre financing structures.", "url": "https://www.citigroup.com/global/insights/markets-edition-how-does-debt-demand-affect-ai-investors", "images": []}, {"source": "citi_gps", "name": "Citi GPS", "thesis": "Combined hyperscaler order backlog reached ~$1.7tn at Q2-end, up 151% YoY; projects global AI-related capex growing to $3.8tn by 2030 from $1tn this year, with new AI power capacity of 19GW in 2026 rising to 45GW by 2028.", "url": "https://www.citigroup.com/global/insights/citis-2026-global-tmt-conference-preview-key-tech-themes-to-watch", "images": []}, {"source": "wisdomtree", "name": "WisdomTree", "thesis": "Reads NVIDIA's Q2 print as evidence the AI bottleneck is shifting from GPUs to memory (gross margin guidance fell to 74% on HBM cost inflation) but stays overweight AI infrastructure given supply commitments that more than doubled QoQ to ~$279bn.", "url": "https://www.wisdomtree.com/us/insights/blog/what-nvidia-s-august-2026-print-actually-tells-us-about-the-ai-buildout", "images": []}, {"source": "bridgewater", "name": "Bridgewater Associates", "thesis": "Warns most investors are overweight US equities and underweight real assets; the AI capex boom is driving current US growth, but markets are still pricing the buildout phase rather than the adoption phase that follows.", "url": "https://www.bridgewater.com/research-and-insights/karen-karniol-tambour-on-investing-in-a-more-fragmented-world", "images": []}, {"source": "gavekal", "name": "Gavekal Research", "thesis": "Frames Amazon, Meta and Alphabet's shift from low-capex 'Mag-7' to capex-heavy 'hyperscaler' models around four scenarios for how shrinking free cash flow resolves and what it means for share prices.", "url": "https://research.gavekal.com/teaser/the-way-ahead-for-us-hyperscalers/", "images": []}, {"source": "franklin_templeton", "name": "Franklin Templeton", "thesis": "ClearBridge's Matthew Lilling warns AI-driven scarcity is letting lower-quality companies (memory, optical networking) temporarily post quality-like revenue growth and margins; when capex slows, smaller beats will expose who only 'borrowed quality from the cycle.'", "url": "https://www.franklintempleton.com/articles/2026/clearbridge-investments/when-revenue-acceleration-overwhelms-quality", "images": []}, {"source": "franklin_templeton", "name": "Franklin Templeton", "thesis": "Notes hyperscaler (Amazon, Alphabet, Meta, Microsoft, Oracle) investment-grade debt issuance has outpaced demand, pushing spreads wider so some long-dated hyperscaler paper now yields close to high-yield levels despite strong balance sheets -- a technical, not fundamental, dislocation.", "url": "https://www.franklintempleton.com/articles/2026/multi-asset/income-opportunities-beneath-the-surface-equity-volatility-and-credit-dislocations", "images": []}]}, {"theme": "Gold, Central-Bank Buying & De-Dollarization", "category": ["commodities", "fx"], "consensus": "Sell-side desks are broadly bullish gold. Goldman Sachs forecasts gold climbing to $4,900/oz by year-end 2026 (from $4,600), and UBS, Standard Chartered and WisdomTree's gold-miner thesis all reiterate the metal as a preferred hedge against fiscal and geopolitical risk.", "divergence": "The bulls' own rationale -- accelerating central-bank buying -- is directly disputed by the Federal Reserve's own research staff. Goldman's Lina Thomas and Daan Struyven cite central-bank purchases accelerating to 100 tonnes/month as of June 2026 (versus 17 tonnes/month pre-2022) as a key driver of the rally. But the Fed's Colin Weiss explicitly rebuts the broader 'gold overtook Treasuries as the world's favorite reserve asset' narrative that has circulated since 2025, arguing the shift is a valuation illusion: gold's market-value surge since 2024 has been driven by private-sector ETF demand, not accelerated official-sector buying, which Weiss says has stayed flat since 2022 once the five long-standing legacy holders (US, Germany, Italy, France, IMF) are excluded. This is a direct, citable clash over the same underlying data series between a bulge-bracket desk and the US central bank's own economists -- exactly the kind of disagreement a generalist should not paper over.", "items": [{"source": "goldman_sachs", "name": "Goldman Sachs", "thesis": "Forecasts gold to $4,900/oz by end-2026 (from $4,600), driven by central-bank buying accelerating to 100 tonnes/month in June 2026 versus 17 tonnes/month pre-2022, with China the largest identifiable buyer.", "url": "https://www.goldmansachs.com/insights/articles/gold-is-forecast-to-climb-as-central-banks-buy-the-precious-metal", "images": []}, {"source": "federal_reserve", "name": "Federal Reserve", "thesis": "Colin Weiss rebuts the 'gold overtook Treasuries' narrative directly: central-bank gold buying has been flat since 2022 once the five legacy holders are excluded, and the 2024-26 rally reflects private ETF demand, not official reserve diversification.", "url": "https://www.federalreserve.gov/econres/notes/feds-notes/why-gold-didnt-actually-overtake-treasury-securities-as-the-worlds-favorite-reserve-asset-20260903.html", "images": []}, {"source": "goldman_sachs", "name": "Goldman Sachs", "thesis": "Tony Kim (Metals Trading) calls gold's pullback from its January record an 'elongated pause,' not the end of the bull market, citing a 'huge reduction' in speculative positioning but persistent central-bank accumulation.", "url": "https://www.goldmansachs.com/insights/the-markets/why-gold-is-expected-to-rise-to-record-highs", "images": []}, {"source": "wisdomtree", "name": "WisdomTree", "thesis": "Argues the gold-miner equity thesis stays intact even with a range-bound gold price, because all-in sustaining costs have risen far more slowly than the gold price over the past decade, implying wider producer margins than valuations reflect.", "url": "https://www.wisdomtree.com/us/insights/blog/gold-miners-in-2026-beneath-the-surface-the-case-is-building", "images": []}]}, {"theme": "Oil & the Iran War at Six Months", "category": ["energy", "geopolitics", "commodities"], "consensus": "There is wide agreement the six-month-old Iran conflict remains a live, unresolved supply shock. RBC, the World Bank, Brookings and Wood Mackenzie all point to the Strait of Hormuz closure (roughly 20% of global oil and LNG trade) as still constraining supply, and RBC notes President Trump's March claim the war was 'very complete' has proven premature.", "divergence": "The split is over how much longer the disruption persists and how tradeable it is. RBC's Helima Croft is the most cautious, estimating roughly 8 million b/d of Middle East export capacity remains offline overall despite US naval escorts lifting Hormuz crude exports by about 1 mb/d, and she doubts Iran accepts any deal without a $300bn reconstruction facility, full sanctions removal and Hormuz operational-control rights -- implying a resolution is months away at best. UBS is comparatively sanguine, forecasting Brent easing to ~$85/bbl by December 2026 with upside risk only if the conflict re-escalates, and stays Neutral (not underweight) US energy equities. On the adjacent US-Venezuela oil deal, the split is sharper still: UBS judges the new 25-year, 1.5mbd agreement strategically significant but slow to matter given Venezuela's current ~1.12mbd output, while Gavekal's Tom Holland is openly skeptical, arguing private investors 'would be mad' to back the deal at all. Goldman's commodities desk adds a product-market nuance largely absent elsewhere: it sees crude itself unlikely to 'break' as seasonal demand fades, but favors long crack-spread (refined-product) positioning given persistently tight diesel and jet-fuel markets from impaired Russian and Chinese refining capacity.", "items": [{"source": "rbc", "name": "RBC Capital Markets", "thesis": "Estimates roughly 8 mb/d of Middle East export capacity remains disrupted despite US naval escorts lifting Hormuz crude exports by ~1 mb/d; doubts Iran accepts a deal without a $300bn reconstruction facility, full sanctions removal and Hormuz operational-control rights.", "url": "https://www.rbccm.com/en/insights/2026/09/inauspicious-anniversary-the-iran-war-at-six-months", "images": []}, {"source": "ubs", "name": "UBS", "thesis": "Judges the 25-year US-Venezuela oil deal (targeting 1.5mbd) strategically significant but slow to matter given current output of just ~1.12mbd; forecasts Brent easing to ~$85/bbl by December 2026, Neutral on US energy equities.", "url": "https://www.ubs.com/global/en/wealthmanagement/insights/chief-investment-office/house-view/daily/2026/latest-310826.html", "images": []}, {"source": "gavekal", "name": "Gavekal Research", "thesis": "Tom Holland argues private investors 'would be mad' to back Trump's Venezuela oil deal, a contrarian skeptical call on a high-profile energy trade.", "url": "https://research.gavekal.com/teaser/geoeconomic-monitor-indias-china-question/", "images": []}, {"source": "goldman_sachs", "name": "Goldman Sachs", "thesis": "Sees crude unlikely to 'break' as seasonal demand fades but favors long crack-spread positioning given persistently tight refined-product markets from impaired Russian and Chinese refining capacity.", "url": "https://www.goldmansachs.com/insights/the-markets/what-is-the-outlook-for-diesel-and-gasoline-supplies", "images": []}, {"source": "world_bank", "name": "World Bank", "thesis": "Models the Strait of Hormuz disruption across 80 countries: in 61 of 80, over 90% of workers see real income declines, with Cambodia, Ukraine and Vietnam hit hardest while oil exporters are largely insulated.", "url": "https://blogs.worldbank.org/en/developmenttalk/the-unequal-costs-of-a-global-trade-disruption", "images": []}]}, {"theme": "Equities: Broadening Bull vs. Hidden Fragility", "category": ["equities"], "consensus": "The dominant sell-side view stays constructive: UBS, Standard Chartered and Franklin Templeton (year-end S&P 500 target of 7,400-7,800 on 15%+ EPS growth) all recommend buying dips, citing broadening market breadth beyond mega-cap AI names -- UBS notes the equal-weighted S&P 500 has outperformed the Nasdaq YTD.", "divergence": "Two independent voices push back hard on the complacency implied by that consensus. Man Group's proprietary MacroScope regime model finds September 2026 conditions most closely resemble May 1997 -- five weeks before the Thai baht devaluation that triggered the Asian financial crisis -- and flags that on July 9 the gap between implied index-level and single-stock volatility, and S&P 500 cross-stock correlation, both hit bottom-1%-since-2005 extremes, meaning calm index-level readings are masking real dispersion underneath; its house stance is explicit 'cautious pessimism.' Bridgewater's Karen Karniol-Tambour makes a similar point from a positioning angle, warning most investors are overweight US equities and underweight real assets with little margin for error if the AI-buildout narrative disappoints. Both stand in contrast to the sell-side's buy-the-dip consensus rather than confirming it.", "items": [{"source": "man_group", "name": "Man Group", "thesis": "MacroScope regime model finds September 2026 most closely resembles May 1997 (pre-Thai-baht-devaluation) and, second, February 2013 (pre-taper-tantrum); notes extreme dispersion beneath a historically low VIX; house stance is explicit 'cautious pessimism.'", "url": "https://www.man.com/insights/views-from-the-floor-2026-1-Sept", "images": []}, {"source": "bridgewater", "name": "Bridgewater Associates", "thesis": "Warns most investors are overweight US equities and underweight real assets, with markets still pricing the AI capex buildout phase rather than the harder adoption phase that follows.", "url": "https://www.bridgewater.com/research-and-insights/karen-karniol-tambour-on-investing-in-a-more-fragmented-world", "images": []}, {"source": "ubs", "name": "UBS", "thesis": "Cites Broadcom's raised AI-chip guidance and NVIDIA's post-earnings pop as evidence of broadening market breadth (equal-weighted S&P 500 +13.9% YTD vs. 12.8% for Nasdaq); recommends broadening AI exposure into power/resources.", "url": "https://www.ubs.com/global/en/wealthmanagement/insights/chief-investment-office/house-view/daily/2026/latest-03092026.html", "images": []}, {"source": "franklin_templeton", "name": "Franklin Templeton", "thesis": "Year-end S&P 500 target of 7,400-7,800 on 15%+ EPS growth; market trades at 21x 2026 and 19x 2027 earnings versus a 17x long-term average.", "url": "https://www.franklintempleton.com/articles/series/from-the-market-desk", "images": []}, {"source": "standard_chartered", "name": "Standard Chartered", "thesis": "Recommends a 'buy on dips' equity strategy given 20%+ consensus S&P 500 EPS growth expected for Q3/Q4.", "url": "https://www.sc.com/sg/market-outlook/weekly-market-view-4-9-2026/?mvog=1", "images": []}]}, {"theme": "FX & the Dollar", "category": ["fx"], "consensus": "UBS and Standard Chartered both see continued broad USD weakness even amid higher US yields -- an unusual decoupling both banks explicitly flag -- and both favor NOK, NZD and AUD as high-carry currencies with stronger fiscal credibility.", "divergence": "The more distinctive divergence sits in Japan. Vanguard raised its BoJ forecast to two more 25bp hikes in 2026 (to 1.5%) and further normalization to 2% in 2027, with rates strategist Ales Koutny arguing the market is under-pricing a 2-2.5% neutral rate; Oxford Economics goes further still, expecting hikes in September and December 2026 plus April 2027 to reach 1.75%, with a weaker-yen scenario potentially forcing a move to 2% by mid-2027. Both frame this as the BoJ being pressured to defend the yen after the late-July US-Japan joint FX intervention, which markets read as the US Treasury demanding faster hikes in exchange for support -- a case where independent and asset-manager houses are more aggressively hawkish on a G10 central bank than the market itself.", "items": [{"source": "ubs", "name": "UBS", "thesis": "DXY has weakened since late July despite higher US yields; keeps NOK and NZD as top FX picks (GBP, CNY also Attractive), expects broader USD weakness to push EURUSD toward 1.18-1.20.", "url": "https://www.ubs.com/global/en/wealthmanagement/insights/chief-investment-office/house-view/daily/2026/latest-02092026.html", "images": []}, {"source": "standard_chartered", "name": "Standard Chartered", "thesis": "Reinstates Overweight gold and favors AUD as markets underestimate scope for further RBA hikes; the ~40-50bp rise in the 30-year yield this year reflects debt/supply concerns more than inflation.", "url": "https://www.sc.com/sg/market-outlook/global-market-outlook-28-8-2026/?mvog=1&source=podcast", "images": []}, {"source": "vanguard", "name": "Vanguard", "thesis": "Raised BoJ forecast to two more 25bp hikes in 2026 (to 1.5%) and to 2% in 2027; rates strategist Ales Koutny sees a 2-2.5% neutral rate as more likely than the market's lower pricing.", "url": "https://corporate.vanguard.com/content/corporatesite/us/en/corp/articles/japans-higher-rates-raise-stakes-global-markets.html", "images": []}, {"source": "oxford_economics", "name": "Oxford Economics", "thesis": "Now expects BoJ hikes in September and December 2026 and again April 2027, reaching 1.75% -- faster and higher than previously forecast -- with a weaker-yen scenario potentially forcing a move to 2% by mid-2027.", "url": "https://www.oxfordeconomics.com/resource/the-boj-will-likely-hike-higher-and-faster/", "images": []}]}, {"theme": "Emerging Markets & China", "category": ["em", "equities", "growth"], "consensus": "BNP Paribas argues EM equities have structurally become a tech/manufacturing asset class rather than a macro-beta trade -- IT and communication services now make up 44% of the MSCI EM Index, with Taiwan and South Korea together nearly half -- and that EM earnings momentum has stayed positive even through the summer AI correction.", "divergence": "Within that bullish EM-tech frame, there's a live valuation question and a China-specific split. BNP Paribas's Daniel Morris asks directly whether the current EM outperformance (EM equities have returned roughly 2x the MSCI World since the start of 2025) will prove as durable as the multi-year upswings that began in 1987 and 2001, noting the leadership has already rotated once, from Chinese internet/retail names (now lagging) to tech hardware/semiconductors. On China specifically, Gavekal is more cautious than the EM-equity bulls: its 'Narrowing Profit Boom' piece finds the majority of Chinese industries still post losses and remain in deflation even as headline corporate profits surge, with gains concentrated almost entirely in coal, non-ferrous metals and chips -- a much narrower recovery than the EM-tech consensus implies. Gavekal separately challenges the demographic 'dissaving' consensus, questioning whether an aging China will actually reduce its savings glut as classic theory predicts, given the household savings rate has stayed near 35% of income for a decade despite rapid aging.", "items": [{"source": "bnp_paribas", "name": "BNP Paribas", "thesis": "IT and communication services now 44% of MSCI EM Index, Taiwan and South Korea together nearly half; three Asian memory/foundry giants are forecast to generate combined free cash flow exceeding $300bn, surpassing the top-5 US hyperscalers' own FCF, which turns negative this year.", "url": "https://www.bnpparibas-am.com/en/portfolio-perspectives/picks-shovels-and-deep-value-a-re-examination-of-emerging-market-equities/", "images": []}, {"source": "bnp_paribas", "name": "BNP Paribas", "thesis": "EM equities have returned roughly 2x the MSCI World index since the start of 2025; asks whether the current upswing (now led by tech hardware/semiconductors after Chinese internet/retail names faded) will prove as durable as the multi-decade upswings starting 1987 and 2001.", "url": "https://www.bnpparibas-am.com/en-us/front-of-mind/view-from-the-markets-is-emerging-market-equity-outperformance-sustainable/", "images": []}, {"source": "gavekal", "name": "Gavekal Research", "thesis": "China's corporate profits are surging and producer prices rising again after ~3 years of deflation, but the majority of industries still post losses and remain in deflation -- gains are concentrated almost entirely in coal, non-ferrous metals and chips.", "url": "https://research.gavekal.com/teaser/the-narrowing-profit-boom/", "images": []}, {"source": "gavekal", "name": "Gavekal Research", "thesis": "Questions whether China's household savings rate (stuck near 35% of income for a decade despite rapid aging, a coming fertility collapse, and generational turnover to a more prosperous cohort) will finally fall as classic demographic dissaving theory predicts -- a challenge to the consensus view that an aging China should structurally shrink its savings glut.", "url": "https://research.gavekal.com/teaser/will-an-aging-china-save-less/", "images": []}, {"source": "gavekal", "name": "Gavekal Research", "thesis": "India posted 7.8% y/y GDP growth in the June quarter; Gavekal argues data-manipulation criticism is exaggerated and the economy is fundamentally sound, though sustained higher oil prices from the Iran war are a real risk to growth momentum.", "url": "https://research.gavekal.com/teaser/will-indias-growth-keep-defying-global-headwinds/", "images": []}]}, {"theme": "Geopolitics: Europe's Capability Gap", "category": ["geopolitics", "fx"], "consensus": "Carnegie and Brookings both document a widening gap between Europe's self-image as a geostrategic actor and its actual deterrent capability -- Carnegie counts 151 Russian sabotage/hybrid-warfare incidents since 2022, quadrupling between 2023-24, while Brookings flags the Iran war diverting US military assets and attention away from both Europe and Asia simultaneously.", "divergence": "Where the two houses differ is on what fills the gap. Carnegie's Russia coverage argues Moscow's drone incursions into NATO airspace (Geran-2 drones capable of 2,500km range) are a deliberate test of European readiness that will likely continue even after any Ukraine ceasefire if Europe's defenses are judged weak -- a call for higher European defense spending now. Peterson Institute's parallel research is more contrarian on the adjacent de-dollarization narrative that these geopolitical shocks are often used to support: it finds the Chinese yuan's SWIFT payments share has actually fallen back to 2.75% from a 2024 peak of 4.7% -- now behind the Canadian dollar by some measures -- directly rebutting headlines that China is 'ditching the dollar,' even as China's own sanctions-resilient CIPS clearing system keeps growing. Domestically, a concrete near-term risk sits in Germany's September 6 Saxony-Anhalt election, where Brookings notes the AfD is polling ~41%, within reach of its first outright state government.", "items": [{"source": "carnegie", "name": "Carnegie Endowment", "thesis": "The EU's weak responses to the Ceuta migrant crisis and a Russian drone attack on Romania's Neptun Deep gas project expose a gap between Europe's self-image as a geostrategic power and its actual capabilities; 151 Russian sabotage/hybrid-warfare incidents since 2022, quadrupling 2023-24.", "url": "https://carnegieendowment.org/europe/strategic-europe/2026/09/europes-self-confidence-problem", "images": []}, {"source": "carnegie", "name": "Carnegie Endowment", "thesis": "Russian drone incursions into NATO airspace (Geran-2 drones, up to 2,500km range) appear to be a deliberate test of European readiness that is likely to continue coercively even after a Ukraine ceasefire if defenses are judged weak.", "url": "https://carnegieendowment.org/research/2026/08/russias-long-drone-shadow", "images": []}, {"source": "peterson_institute", "name": "Peterson Institute (PIIE)", "thesis": "The yuan's SWIFT payments share peaked at 4.7% in July 2024 and has since fallen back to 2.75% -- now behind the Canadian dollar by some measures -- a contrarian corrective to 'China ditching the dollar' headlines; 72% of China's own trade is still settled in other currencies.", "url": "https://www.piie.com/blogs/realtime-economics/2026/has-chinese-yuans-rise-global-usage-hit-wall", "images": []}, {"source": "brookings", "name": "Brookings Institution", "thesis": "Ahead of the September 6 Saxony-Anhalt election, the AfD is polling ~41%, within reach of an outright majority and its first state government; a vote simulator puts the odds of an AfD-only government at 33%.", "url": "https://www.brookings.edu/articles/could-the-right-wing-extremist-afd-govern-a-german-state-for-the-first-time/", "images": []}, {"source": "brookings", "name": "Brookings Institution", "thesis": "The Iran war is diverting US military assets from the Indo-Pacific, delaying a ~$30bn Taiwan arms sale and scaling back South Korea joint exercises -- weakening deterrence and reinforcing North Korea's view that nuclear weapons are essential to regime survival.", "url": "https://www.brookings.edu/articles/the-iran-war-and-americas-widening-strategy-gap-in-asia/", "images": []}]}, {"theme": "Crypto: The Debasement Trade", "category": ["crypto", "rates"], "consensus": "CoinShares and Galaxy Digital both attribute Bitcoin's rally back above $80,000 to a resurgent 'debasement trade' -- rising concern over US fiscal sustainability (30-year Treasury yields near two-decade highs, federal debt above $40 trillion) rather than improving crypto-specific fundamentals -- with digital-asset fund flows posting some of the year's strongest weekly inflows.", "divergence": "The disagreement is about durability and direction. CoinShares is explicitly cautious about extrapolating the rally, noting it reflects a changed macro/policy backdrop (a friendlier US regulatory stance, Fed Governor Waller's dovish pushback against Warsh) rather than improved fundamentals across most smaller, less-differentiated tokens, and frames Bitcoin's ability to hold above $80k as conditional on either an Iran-conflict resolution or a further loss of confidence in US sovereign debt. Galaxy Digital is far more directionally bullish, setting a headline call of $250,000 Bitcoin by year-end 2027 as part of its 26 predictions for the year, even while acknowledging near-term downside risk skewed below $100-105k on a shorter horizon -- a case of the same 'debasement trade' logic being read as a durable multi-year thesis by one house and a fragile, policy-contingent rally by another.", "items": [{"source": "coinshares", "name": "CoinShares", "thesis": "Bitcoin rallied from the low $60ks to a high of $80.1k as the 'debasement trade' returned amid US fiscal concern; Fed Governor Waller's dovish pushback against Warsh's hawkish tone helped lift Bitcoin back above $80k; needs an Iran resolution or further loss of confidence in US debt to break decisively higher.", "url": "https://coinshares.com/insights/research-data/market-update-04-09-2026/", "images": []}, {"source": "coinshares", "name": "CoinShares", "thesis": "Ties the rally to a resurgent debasement trade (30-year yields near two-decade highs, Druckenmiller warning governments defending prices against fundamentals always lose) plus a friendlier US policy stance; cautions this reflects a changed macro backdrop rather than improved fundamentals for most smaller tokens.", "url": "https://coinshares.com/insights/the-node/output-from-despair-to-greed-in-a-week-a-rally-is-not-a-verdict/", "images": []}, {"source": "galaxy_digital", "name": "Galaxy Digital", "thesis": "Headline call is BTC reaching $250k by year-end 2027, while options markets price roughly equal odds of $70k or $130k by June 2026 and $50k or $250k by year-end 2026, with near-term risk skewed to the downside below $100-105k.", "url": "https://www.galaxy.com/insights/research/predictions-2026-crypto-bitcoin-defi", "images": []}]}], "B_calls": [{"source": "goldman_sachs", "name": "Goldman Sachs", "call": "Gold price target $4,900/oz by end-2026, up from $4,600 as of Aug 25.", "category": ["commodities"], "url": "https://www.goldmansachs.com/insights/articles/gold-is-forecast-to-climb-as-central-banks-buy-the-precious-metal", "images": []}, {"source": "goldman_sachs", "name": "Goldman Sachs", "call": "Global data-center power demand to rise 170% by 2030 vs. 2025; Mid-Atlantic stays the largest US market, Midwest overtakes Texas for second.", "category": ["ai_tech", "energy"], "url": "https://www.goldmansachs.com/insights/goldman-sachs-exchanges/the-outlook-for-data-center-power-demand-as-ai-token-use-grows", "images": []}, {"source": "ubs", "name": "UBS", "call": "Raised year-end Treasury forecasts: 30-year to 5%, 10-year to 4.5%.", "category": ["rates"], "url": "https://www.ubs.com/global/en/wealthmanagement/insights/chief-investment-office/house-view/daily/2026/latest-04092026.html", "images": []}, {"source": "ubs", "name": "UBS", "call": "Brent forecast ~$85/bbl by December 2026; Neutral on US energy equities.", "category": ["energy", "commodities"], "url": "https://www.ubs.com/global/en/wealthmanagement/insights/chief-investment-office/house-view/daily/2026/latest-310826.html", "images": []}, {"source": "ubs", "name": "UBS", "call": "NOK and NZD top FX picks (GBP, CNY also Attractive); EURUSD toward 1.18-1.20 as Fed tightening bets are pared.", "category": ["fx"], "url": "https://www.ubs.com/global/en/wealthmanagement/insights/chief-investment-office/house-view/daily/2026/latest-02092026.html", "images": []}, {"source": "franklin_templeton", "name": "Franklin Templeton", "call": "Year-end S&P 500 target of 7,400-7,800 on 15%+ EPS growth.", "category": ["equities"], "url": "https://www.franklintempleton.com/articles/series/from-the-market-desk", "images": []}, {"source": "vanguard", "name": "Vanguard", "call": "BoJ to deliver two more 25bp hikes in 2026 (to 1.5%) and reach 2% in 2027; neutral rate seen at 2-2.5%, above market pricing.", "category": ["rates", "fx"], "url": "https://corporate.vanguard.com/content/corporatesite/us/en/corp/articles/japans-higher-rates-raise-stakes-global-markets.html", "images": []}, {"source": "oxford_economics", "name": "Oxford Economics", "call": "BoJ hikes in September and December 2026 and again April 2027, reaching 1.75%; a weaker-yen scenario could force 2% by mid-2027.", "category": ["rates", "fx"], "url": "https://www.oxfordeconomics.com/resource/the-boj-will-likely-hike-higher-and-faster/", "images": []}, {"source": "standard_chartered", "name": "Standard Chartered", "call": "Overweight US and Asia ex-Japan equities and gold; preferred bond bucket extended to 3-5 years; AUD as top FX pick on underpriced RBA hikes.", "category": ["equities", "fx", "commodities"], "url": "https://www.sc.com/sg/market-outlook/global-market-outlook-28-8-2026/?mvog=1&source=podcast", "images": []}, {"source": "norges_bank_im", "name": "Norges Bank Investment Management", "call": "Recommends cutting the government-bond share of the ~$2tn+ GPFG's fixed-income benchmark from 70% to 50% and switching to market-value weighting, adding securitized and government-related bonds.", "category": ["rates", "financial_stability"], "url": "https://www.nbim.no/en/news-and-insights/submissions-to-ministry/2026/the-government-pension-fund-global--analyses-and-assessments-of-the-investment-strategy-for-bonds/", "images": []}, {"source": "wisdomtree", "name": "WisdomTree", "call": "Stays overweight AI infrastructure/semiconductors (WTAI) versus concentrated mega-cap exposure (QGRW) as revenue-per-gigawatt rises from ~$18bn (Hopper) to $40bn (Vera Rubin).", "category": ["ai_tech", "equities"], "url": "https://www.wisdomtree.com/us/insights/blog/what-nvidia-s-august-2026-print-actually-tells-us-about-the-ai-buildout", "images": []}, {"source": "blackrock_investment_institute", "name": "BlackRock Investment Institute", "call": "Favors more selectivity in equities and greater use of starting yield, carry and diversification in fixed income as the regime clarifies.", "category": ["equities", "rates"], "url": "https://www.blackrock.com/us/individual/insights/ai-fed-investment-opportunities", "images": []}, {"source": "blackrock_investment_institute", "name": "BlackRock Investment Institute", "call": "Argues investors are underexposed to defense: S&P 500 gives just 4% exposure to defense beneficiaries versus 30% to AI, against record global defense spending of $2.7tn.", "category": ["geopolitics", "equities"], "url": "https://www.blackrock.com/us/individual/insights/defense-sector-on-the-radar", "images": []}, {"source": "citi_gps", "name": "Citi GPS", "call": "Projects global AI-related capex growing to $3.8tn by 2030 from $1tn this year, with hyperscalers generating ~30% cash returns on invested capital.", "category": ["ai_tech"], "url": "https://www.citigroup.com/global/insights/citis-2026-global-tmt-conference-preview-key-tech-themes-to-watch", "images": []}, {"source": "rbc", "name": "RBC Capital Markets", "call": "XBI up 80% over the past year on ~$78bn in M&A YTD (nearly double all of 2025); stays constructive but expects H2 to reward selectivity over breadth.", "category": ["equities"], "url": "https://www.rbccm.com/en/insights/2026/09/whats-driving-biotechs-latest-rally", "images": []}, {"source": "galaxy_digital", "name": "Galaxy Digital", "call": "Headline call: Bitcoin to $250,000 by year-end 2027; near-term risk skewed to the downside below $100-105k.", "category": ["crypto"], "url": "https://www.galaxy.com/insights/research/predictions-2026-crypto-bitcoin-defi", "images": []}, {"source": "amundi", "name": "Amundi", "call": "Bank of Korea hiked 25bp to 3% while raising its 2026 growth forecast to 3.3% from 2.6%.", "category": ["rates", "growth", "em"], "url": "https://research-center.amundi.com/article/iran-conflict-diversification-play", "images": []}, {"source": "man_group", "name": "Man Group", "call": "Factor positioning long Momentum and increasingly Quality; overweight fertilizers, biotech and oil exploration; most negative on mortgage lenders, semiconductor equipment and chipmakers.", "category": ["equities"], "url": "https://www.man.com/insights/views-from-the-floor-2026-1-Sept", "images": []}, {"source": "deutsche_bank", "name": "Deutsche Bank", "call": "Expects three Fed rate cuts by end-2026 and double-digit equity earnings growth across major regions -- a notably more dovish rate call than the post-Jackson-Hole consensus.", "category": ["rates", "equities"], "url": "https://wealth.db.com/en/insights/investing-insights/economic-and-market-outlook/cio-annual-outlook-2026-investing-in-tomorrow.html", "images": []}, {"source": "bofa", "name": "Bank of America", "call": "Total card spending growth eased to 5.0% YoY in July from 6.3% in June; the previously K-shaped consumer is converging across income groups except the top 5% of earners.", "category": ["growth", "inflation"], "url": "https://institute.bankofamerica.com/economic-insights/consumer-checkpoint-august-2026.html", "images": []}, {"source": "bofa", "name": "Bank of America", "call": "Estimated August payroll growth of 1.5% YoY (down from 1.8% in July); the K-shaped wage gap has reversed -- lower-income after-tax wage growth (4.7% YoY) now outpaces higher-income (3.5% YoY).", "category": ["growth"], "url": "https://institute.bankofamerica.com/economic-insights/monthly-employment-report-august-2026.html", "images": []}, {"source": "wood_mackenzie", "name": "Wood Mackenzie", "call": "US Executive Order 14420 bans imported bulk-power equipment from ~24 nations, overwhelmingly China, worsening a transformer market already facing 15% shortages in 2026 -- a direct physical constraint on the AI data-center buildout.", "category": ["energy", "ai_tech"], "url": "https://www.woodmac.com/press-releases/us-executive-order-banning-chinese-bulk-power-equipment-set-to-worsen-critical-transformer-shortage/", "images": []}, {"source": "kpmg", "name": "KPMG", "call": "Global AI Pulse survey: 76% of leaders report AI is already delivering tangible business value, but organizations with full operational clarity on AI outcomes are 5x more likely to report established ROI.", "category": ["ai_tech"], "url": "https://kpmg.com/xx/en/our-insights/transformation/perspectives-on-managed-services/is-your-ai-creating-value-or-just-activity.html", "images": []}], "C_deep_reads": [{"source": "federal_reserve", "name": "Federal Reserve", "title": "Why Gold Didn't Actually Overtake Treasury Securities as the World's \"Favorite\" Reserve Asset", "summary": "Colin Weiss's rebuttal of the 'gold overtook Treasuries' narrative is the most consequential piece of central-bank research this cycle for anyone positioning around de-dollarization. He shows world gold reserves reached $5.1tn at end-2025 (ex-US $4tn) versus $3.9tn in foreign official Treasury holdings, but by June 2026 foreign Treasury holdings again exceeded ex-US gold reserves once the surge is stripped of valuation effects. The five largest gold holders (US, Germany, Italy, France, IMF) hold 52% of world gold but haven't added since the 1970s Bretton Woods era; official-sector buying has been flat since 2022, meaning the 2024-26 price surge -- and the media narrative built on it -- is a private-ETF-driven valuation illusion, not a genuine flight from Treasuries into gold by central banks.", "url": "https://www.federalreserve.gov/econres/notes/feds-notes/why-gold-didnt-actually-overtake-treasury-securities-as-the-worlds-favorite-reserve-asset-20260903.html", "images": []}, {"source": "gavekal", "name": "Gavekal Research", "title": "AI Versus The Labor Market", "summary": "Gavekal's most pointed piece of the cycle takes direct aim at new Fed Chair Warsh's own stated rationale for tolerating above-target inflation. Warsh argues the AI capex boom will lift productivity and dampen inflation the way the late-1990s tech boom did. Gavekal counters with the actual data: since ChatGPT's late-2022 launch, solid US productivity growth has coincided with rising inflation, not falling, while real GDP growth has merely held near its 20-year median of 2.3%. Gavekal's explanation is a labor shortage constraining the economy's ability to meet the additional demand the AI buildout itself is generating -- directly undercutting the disinflationary-AI logic the Fed chair is using to justify staying patient (or, on PIMCO's reading, to justify hiking).", "url": "https://research.gavekal.com/teaser/ai-versus-the-labor-market/", "images": []}, {"source": "man_group", "name": "Man Group", "title": "Views from the Floor: Today's Economy Mirrors Eve of 1997 Asian Financial Crisis", "summary": "Man Numeric's MacroScope regime model is the most systematic 'this rhymes with a crisis' call of the cycle. Running current conditions against history, September 2026 most closely resembles May 1997 -- five weeks before the Thai baht devaluation that triggered the Asian financial crisis -- and, second, February 2013, just before the taper tantrum; August 2011 is the least similar historical analog. The model's stance is explicit 'cautious pessimism': a fiscally constrained US government, a Fed seen as more likely to hike than cut, and valuations pricing a benign outcome leave little margin for error. Beneath a VIX near its 14.2-year low, the gap between implied index-level and single-stock volatility, and S&P 500 cross-stock correlation, both hit bottom-1%-since-2005 extremes on July 9 -- calm on the surface, real dispersion underneath.", "url": "https://www.man.com/insights/views-from-the-floor-2026-1-Sept", "images": []}, {"source": "bridgewater", "name": "Bridgewater Associates", "title": "Karen Karniol-Tambour on Investing in a More Fragmented World", "summary": "Bridgewater Co-CIO Karen Karniol-Tambour's Milken Institute remarks lay out a structural, not cyclical, thesis: modern mercantilism is inherently inflationary because every country is now spending to close its own vulnerabilities, whether in chips, energy or defense. She warns most investors remain overweight US equities and underweight real assets -- poorly positioned for the environment she describes -- and makes a distinction that cuts against consensus AI enthusiasm: the AI capex boom is currently driving US growth, but markets are still pricing the buildout phase rather than the harder adoption phase that follows it. She also frames geographic fragmentation as creating genuinely distinct investable ecosystems as industrial policy increasingly favors national champions, arguing for broader regional exposure than a US-concentrated portfolio provides.", "url": "https://www.bridgewater.com/research-and-insights/karen-karniol-tambour-on-investing-in-a-more-fragmented-world", "images": []}, {"source": "brookings", "name": "Brookings Institution", "title": "Blowback: How the Iran war may change the world", "summary": "Brookings' cross-institutional essay collection, published as the Iran war passes the six-month mark, is the most comprehensive single treatment of the conflict's second-order effects. More than 100 days after US/Israeli strikes killed Iran's Supreme Leader, the regime remains in control and has retaliated by blocking Strait of Hormuz traffic -- the chokepoint for 20% of global oil and LNG supply. The essays cover Asia's oil-shock-driven economic-security hit, US naval capability shortfalls exposed by the conflict, oil-market normalization likely taking months even after Hormuz reopens, unpopular-war-driven domestic US political blowback, and China's opportunistic gains from US strategic distraction -- a reminder that the trading-desk framing of this as primarily an energy-price story misses the wider geopolitical realignment underway.", "url": "https://www.brookings.edu/collection/blowback-how-the-iran-war-may-change-the-world/", "images": []}, {"source": "franklin_templeton", "name": "Franklin Templeton", "title": "On My Mind: Rearranging the Debt Chairs", "summary": "Franklin Templeton CIO Sonal Desai delivers the sharpest read of the cycle on the Fed-Treasury relationship. She argues Treasury Secretary Bessent's move to at least double long-bond buybacks is irrelevant unless the fiscal deficit itself shrinks, since the government must keep issuing debt regardless -- and both this year's deficit (swelled by Iran-conflict costs and tariff refunds) and next year's will be larger still, with 67% of outstanding debt maturing under five years after poor debt-management decisions during the low-rate era. She reads Warsh's Jackson Hole speech as a decisive pivot away from monetary policy 'carrying water' for fiscal policy: he called 2% PCE inflation a 'firm fixed target,' said AI's productivity potential won't affect near-term policy, and said the Fed must act unless confident underlying inflation is converging to target 'clearly and at sufficient speed' -- a chair whose dominant concern, on this reading, is inflation, not growth or debt-service costs.", "url": "https://www.franklintempleton.com/articles/2026/fixed-income/on-my-mind-rearranging-the-debt-chairs", "images": []}, {"source": "norges_bank_im", "name": "Norges Bank Investment Management", "title": "The Government Pension Fund Global – analyses and assessments of the investment strategy for bonds", "summary": "Norges Bank's formal letter to Norway's Ministry of Finance proposes the most consequential reallocation in the report: cutting the government-bond subindex of the Government Pension Fund Global's (over $2 trillion) fixed-income benchmark from 70% to 50%, switching government-bond weighting from GDP-based to market-value-based since high public debt is now broad-based across developed economies rather than concentrated in a few, and adding securitized bonds (including agency MBS) and government-related bonds to capture more risk premia. This reverses the fund's 2018-19 push toward a simpler, narrower bond index and is a rare case of a major sovereign allocator explicitly reacting to the same fiscal-sustainability concerns driving the long-bond debate elsewhere in this report.", "url": "https://www.nbim.no/en/news-and-insights/submissions-to-ministry/2026/the-government-pension-fund-global--analyses-and-assessments-of-the-investment-strategy-for-bonds/", "images": []}, {"source": "norges_bank_im", "name": "Norges Bank Investment Management", "title": "Geopolitical risk and concentration risk in the equity index of the GPFG", "summary": "In a companion letter, Norges Bank addresses rising geopolitical and concentration risk to the GPFG directly, citing warnings from Norway's own Sverdrup Commission and Expert Council that the fund's size and visibility make it a potential target for taxation, regulatory action, or even confiscation abroad. It describes the Bank's historical and forward-looking stress-testing process for contingency planning, and flags -- unusually candidly for a sovereign wealth fund -- that the equity portfolio's return of over 70% over the past three years is a pace 'we cannot expect to continue.'", "url": "https://www.nbim.no/en/news-and-insights/submissions-to-ministry/2026/geopolitical-risk-and-concentration-risk-in-the-equity-index-of-the-government-pension-fund-global-gpfg/", "images": []}, {"source": "world_bank", "name": "World Bank", "title": "The unequal costs of a global trade disruption", "summary": "The World Bank's modeling of a Strait of Hormuz shipping disruption across 80 countries is the most rigorous quantification in the report of who actually bears the cost of the Iran war's energy shock. In 61 of 80 countries, over 90% of workers see real income declines; Cambodia, Ukraine and Vietnam are hit hardest, while oil exporters (Nigeria, Angola, Australia, Brunei, Kazakhstan, Norway, Russia) are largely insulated. Within-country dispersion is large -- the worst-hit sector loses about 7.5% real income on average, a 30-point gap versus the least-hit sector -- and labor immobility across sectors accounts for roughly 14% of total welfare loss. Non-high-income countries see about 2% food-price inflation versus near-zero in high-income countries, making the policy case that labor-market flexibility and targeted food-subsidy readiness materially cushion geopolitical energy shocks.", "url": "https://blogs.worldbank.org/en/developmenttalk/the-unequal-costs-of-a-global-trade-disruption", "images": []}], "D_charts": [{"source": "pimco", "name": "PIMCO", "chart": "Median net interest-coverage ratios for corporate issuers (~6x USD IG, ~3x HY) versus the gap between index current yield and average coupon, showing debt-servicing risk from the yield backup is concentrated in CCC-rated borrowers, not the broad market.", "url": "https://www.pimco.com/us/en/insights/the-credit-market-lens-us-corporate-issuers-can-digest-higher-refinancing-costs", "images": ["https://www.pimco.com/us/en/-/media/global-assets/insights/economic-and-market-commentary/the-credit-market-lens/08/the-credit-market-lens-us-corporate-issuers-can-digest-higher-refinancing-costs/fig-1_2026-08-28t23_57_40.webp"]}, {"source": "pimco", "name": "PIMCO", "chart": "Household net-worth-to-disposable-income near record highs alongside diverging subprime vs. prime 90-day auto delinquency rates, showing consumer credit stress is idiosyncratic (bad 2022-24 underwriting) rather than systemic.", "url": "https://www.pimco.com/us/en/insights/how-a-k-shaped-economy-affects-opportunities-in-asset-based-finance", "images": ["https://www.pimco.com/us/en/-/media/global-assets/insights/economic-and-market-commentary/general/2026/09/how-a-k-shaped-economy-affects-opportunities-in-asset-based-finance/k-economy-chart-gbl-en-81518-2.webp"]}, {"source": "pimco", "name": "PIMCO", "chart": "Unit-labor-cost growth (~1% y/y) plotted against 3.3% core PCE inflation, illustrating the gap PIMCO uses to argue wage-price-spiral risk -- and the case for a Fed hike -- is low.", "url": "https://www.pimco.com/us/en/insights/if-inflation-is-the-problem-why-arent-wages", "images": ["https://www.pimco.com/us/en/-/media/global-assets/insights/economic-and-market-commentary/macro-signposts/2026/08/if-inflation-is-the-problem-why-arent-wages/figure_1-web_2026-09-02t13_31_13.webp"]}, {"source": "federal_reserve", "name": "Federal Reserve", "chart": "World gold reserves versus foreign official Treasury holdings in dollar terms since 2022, the chart underpinning the Fed's rebuttal of the 'gold overtook Treasuries' narrative.", "url": "https://www.federalreserve.gov/econres/notes/feds-notes/why-gold-didnt-actually-overtake-treasury-securities-as-the-worlds-favorite-reserve-asset-20260903.html", "images": ["https://www.federalreserve.gov/econres/notes/feds-notes/fig1-4147.png", "https://www.federalreserve.gov/econres/notes/feds-notes/fig2-4147.png"]}, {"source": "federal_reserve", "name": "Federal Reserve", "chart": "State-by-state consumer tariff-exposure map built from Consumer Expenditure Survey data matched to Census import data via an LLM-based HS-code concordance; California (13.8%) and New Jersey (12.7%) most exposed, Nebraska and Missouri least (2.6%).", "url": "https://www.federalreserve.gov/econres/notes/feds-notes/which-states-are-most-exposed-to-tariff-increases-a-new-measure-based-on-the-consumption-channel-20260903.html", "images": ["https://www.federalreserve.gov/econres/notes/feds-notes/figure1-41 // ---------- helpers ----------
const CAT_VARS = {
  rates: 'var(--cat-rates)',
  growth: 'var(--cat-growth)',
  fx: 'var(--cat-fx)',
  equities: 'var(--cat-equities)',
  credit: 'var(--cat-credit)',
  crypto: 'var(--cat-crypto)',
  energy: 'var(--cat-energy)',
  commodities: 'var(--cat-commodities)',
  geopolitics: 'var(--cat-geopolitics)',
  ai_tech: 'var(--cat-ai_tech)',
  em: 'var(--cat-em)',
};
function catColor(cat) {
  if (!cat) return 'var(--cat-default)';
  return CAT_VARS[String(cat).toLowerCase()] || 'var(--cat-default)';
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }
function renderBold(text) {
  return escapeHtml(text).replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
}
function pill(cat) {
  if (!cat) return '';
  return `<span class="pill" style="background:${catColor(cat)}">${escapeHtml(cat)}</span>`;
}
function pills(cats) {
  if (!cats) return '';
  if (Array.isArray(cats)) return cats.map(pill).join(' ');
  return pill(cats);
}
function externalLink(url, label) {
  if (!url) return '';
  return `<a class="item-link" href="${escapeAttr(url)}" target="_blank" rel="noopener">${label || 'link →'}</a>`;
}
function nameLink(url, name) {
  if (!name) return '';
  if (!url) return `<span class="item-source">${escapeHtml(name)}</span>`;
  return `<a class="item-source" href="${escapeAttr(url)}" target="_blank" rel="noopener">${escapeHtml(name)}</a>`;
}

// ---------- rendering ----------
function renderThumbs(images) {
  if (!images || !images.length) return '';
  return `<div class="thumbs">` + images.map(u =>
    `<img src="${escapeAttr(u)}" class="thumb" loading="lazy" alt="" onclick="openLightbox('${escapeAttr(u)}')">`
  ).join('') + `</div>`;
}

function renderThemeItem(it) {
  return `
    <div class="theme-item">
      <div class="item-head">
        ${nameLink(it.url, it.name || it.source)}
        ${externalLink(it.url)}
      </div>
      <div class="item-text">${renderBold(it.thesis || '')}</div>
      ${renderThumbs(it.images)}
    </div>`;
}

function renderTheme(theme) {
  const items = (theme.items || []).map(renderThemeItem).join('');
  return `
    <div class="theme">
      <div class="theme-head">
        ${pills(theme.category)}
        <div class="theme-title">${escapeHtml(theme.theme || '')}</div>
      </div>
      <div class="theme-stance">
        ${theme.consensus ? `<div class="theme-line consensus"><span class="lbl">Consensus</span>${renderBold(theme.consensus)}</div>` : ''}
        ${theme.divergence ? `<div class="theme-line divergence"><span class="lbl">Divergence</span>${renderBold(theme.divergence)}</div>` : ''}
      </div>
      ${items ? `<div class="theme-items">${items}</div>` : ''}
    </div>`;
}

function renderCall(it) {
  return `
    <div class="item-card">
      <div class="item-head">
        ${pills(it.category)}
        ${nameLink(it.url, it.name || it.source)}
        ${externalLink(it.url)}
      </div>
      <div class="item-text">${renderBold(it.call || '')}</div>
      ${renderThumbs(it.images)}
    </div>`;
}

function renderDeepRead(it) {
  return `
    <div class="item-card">
      <div class="item-head">
        ${nameLink(it.url, it.name || it.source)}
        ${externalLink(it.url, 'read →')}
      </div>
      ${it.title ? `<div class="item-title">${escapeHtml(it.title)}</div>` : ''}
      <div class="item-text">${renderBold(it.summary || '')}</div>
      ${renderThumbs(it.images)}
    </div>`;
}

function renderChart(it) {
  return `
    <div class="item-card">
      <div class="item-head">
        ${nameLink(it.url, it.name || it.source)}
        ${externalLink(it.url)}
      </div>
      <div class="item-text">${renderBold(it.chart || '')}</div>
      ${renderThumbs(it.images)}
    </div>`;
}

function renderHouseView(hv) {
  const name = hv.name || hv.source || '';
  const nameHtml = hv.url
    ? `<a class="hv-name" href="${escapeAttr(hv.url)}" target="_blank" rel="noopener">${escapeHtml(name)}</a>`
    : `<span class="hv-name">${escapeHtml(name)}</span>`;
  return `
    <div class="hv-row">
      ${nameHtml}
      <span class="hv-stance">${renderBold(hv.stance || '')}</span>
    </div>`;
}

function renderSection(letter, name, items, render, extraClass) {
  if (!items || !items.length) return '';
  const body = items.map(render).join('');
  const cls = 'section' + (extraClass ? (' ' + extraClass) : '');
  return `
    <div class="${cls}">
      <div class="section-head" onclick="toggleSection(this)">
        <span class="section-letter">${letter}</span>
        <span class="section-name">${escapeHtml(name)}</span>
        <span class="section-count">${items.length}</span>
        <span class="section-arrow">▸</span>
      </div>
      <div class="section-body">${body}</div>
    </div>`;
}

function renderSummary(text) {
  if (!text) return '';
  const paragraphs = String(text).split(/\n\n+/).filter(Boolean)
    .map(p => `<p>${renderBold(p)}</p>`).join('');
  return `<div class="summary">${paragraphs}</div>`;
}

function renderTopStats(d) {
  const parts = [];
  const p = d.period || {};
  const is = d.input_stats || {};
  const cv = d.coverage || {};
  if (p.from && p.to)
    parts.push(`period <strong>${escapeHtml(p.from)} → ${escapeHtml(p.to)}</strong>`);
  else if (p.lookback_days != null)
    parts.push(`lookback <strong>${p.lookback_days}d</strong>`);
  if (is.total_articles != null) parts.push(`articles <strong>${is.total_articles}</strong>`);
  if (is.sources_present != null) parts.push(`sources <strong>${is.sources_present}</strong>`);
  if (is.after_filter != null) parts.push(`after filter <strong>${is.after_filter}</strong>`);
  if (cv.coverage_pct != null) {
    const pct = (cv.coverage_pct <= 1 ? cv.coverage_pct * 100 : cv.coverage_pct);
    parts.push(`coverage <strong>${pct.toFixed(0)}%</strong>`);
  } else if (cv.sources_covered != null && cv.sources_total != null) {
    parts.push(`coverage <strong>${cv.sources_covered}/${cv.sources_total}</strong>`);
  }
  return parts.join(' | ');
}

function reportDate(d) {
  if (d.period && d.period.to) return d.period.to;
  if (d.collected_at) return String(d.collected_at).slice(0, 10);
  return '';
}

// ---------- interactions ----------
function toggleSection(headEl) { headEl.parentElement.classList.toggle('open'); }
function openLightbox(src) {
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-img').src = '';
}
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && document.getElementById('lightbox').classList.contains('open')) {
    closeLightbox();
  }
});

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = reportDate(d);
  document.getElementById('stats-top').innerHTML = renderTopStats(d);
  const s = d.sections || {};
  const out = [
    renderSummary(d.summary),
    renderSection('A.', 'Debates — Consensus vs Divergence', s.A_debates,    renderTheme),
    renderSection('B.', 'Key Calls & Positioning',           s.B_calls,      renderCall),
    renderSection('C.', 'Notable Deep Reads',                s.C_deep_reads, renderDeepRead,
                  'section-deepreads'),
    renderSection('D.', 'Charts & Data',                     s.D_charts,     renderChart),
    renderSection('E.', 'House Views',                       s.house_views,  renderHouseView),
  ].join('');
  const app = document.getElementById('app');
  app.innerHTML = out || '<div class="empty">No report data.</div>';

  // Auto-open Summary's section view: first two sections open by default.
  document.querySelectorAll('.section').forEach((sec, i) => {
    if (i < 2) sec.classList.add('open');
  });
}

renderReport(REPORT_DATA);
</script>
</body>
</html>
