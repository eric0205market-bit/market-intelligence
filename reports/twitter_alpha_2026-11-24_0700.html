<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root {
  --bg: #faf8f5;
  --surface: #ffffff;
  --border: #e8e3da;
  --border-light: #f0ede4;
  --text: #1a1a1a;
  --text-2: #555;
  --text-3: #8a8a8a;
  --accent: #1a8cd8;
  --red: #d94052;
  --yellow: #fff5b3;
  --yellow-border: #f0d966;

  /* category colors (per spec) */
  --cat-macro: #2563eb;        /* blue */
  --cat-crypto: #8b5cf6;       /* purple */
  --cat-energy: #dc2626;       /* red */
  --cat-tech: #0d9488;         /* teal */
  --cat-ai: #4f46e5;           /* indigo */
  --cat-geopolitics: #dc2626;  /* red */
  --cat-positioning: #15803d;  /* green */
  --cat-regulation: #7c3aed;   /* purple */
  --cat-society: #d97706;      /* amber */
  --cat-em: #059669;           /* green */
  --cat-default: #6b7280;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; line-height: 1.55;
       background: var(--bg); color: var(--text); }
.container { max-width: 960px; margin: 0 auto; padding: 24px 16px 80px; }

/* HEADER */
.header { display: flex; justify-content: space-between; align-items: baseline;
          border-bottom: 2px solid var(--text); padding-bottom: 12px; margin-bottom: 20px; }
.title { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
.subtitle { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-3); }

/* FILTER BAR */
.filter-bar { display: none; background: var(--yellow); border: 1px solid var(--yellow-border);
              border-radius: 6px; padding: 8px 12px; margin-bottom: 16px;
              align-items: center; gap: 10px; font-size: 13px; }
.filter-bar.active { display: flex; }
.filter-bar button { font-family: inherit; font-size: 12px; background: transparent;
                     border: 1px solid var(--text); padding: 3px 10px; border-radius: 4px;
                     cursor: pointer; }
.filter-bar button:hover { background: rgba(0,0,0,0.05); }

/* SUMMARY */
.summary { background: var(--surface); border: 1px solid var(--border);
           border-left: 4px solid var(--red); border-radius: 6px;
           padding: 16px 18px; margin-bottom: 20px; }
.summary p { margin-bottom: 8px; }
.summary p:last-child { margin-bottom: 0; }
.summary strong { font-weight: 600; }

/* SECTIONS */
.section { background: var(--surface); border: 1px solid var(--border);
           border-radius: 6px; margin-bottom: 14px; overflow: hidden; }
.section-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px;
                background: #f3efe6; cursor: pointer; user-select: none;
                font-weight: 600; font-size: 13px; }
.section-head:hover { background: #ebe6dc; }
.section-letter { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
                  color: var(--text-3); min-width: 18px; }
.section-name { flex: 1; }
.section-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
                 color: var(--text-3); }
.section-arrow { font-size: 10px; color: var(--text-3); transition: transform .2s; }
.section.open .section-arrow { transform: rotate(90deg); }
.section-body { display: none; padding: 6px 0; }
.section.open .section-body { display: block; }

/* CLUSTER (Section A) */
.cluster { padding: 14px 16px; border-bottom: 1px solid var(--border-light); }
.cluster:last-child { border-bottom: none; }
.cluster-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
                flex-wrap: wrap; }
.cluster-title { font-weight: 600; font-size: 14px; }
.cluster-desc { color: var(--text-2); font-size: 13px; margin: 0 0 10px 0; }
.cluster-items { display: flex; flex-direction: column; gap: 8px; padding-left: 10px;
                 border-left: 2px solid var(--border-light); }
.cluster-item { font-size: 13px; padding: 6px 8px; border-radius: 4px; }
.cluster-item .item-text { font-size: 13px; margin-top: 4px; }
.cluster-item .item-head { font-size: 12px; }

/* ITEM CARDS (Sections B/C/D) */
.item-card { background: var(--surface); border: 1px solid var(--border);
             border-radius: 6px; padding: 12px 14px; margin: 10px 16px; }
.item-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
             flex-wrap: wrap; }
.item-author { font-weight: 600; color: var(--accent); cursor: pointer; }
.item-author:hover { text-decoration: underline; }
.item-time { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--text-3); }
.item-link { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--accent); text-decoration: none; }
.item-link:hover { text-decoration: underline; }
.item-text { font-size: 13.5px; line-height: 1.6; color: var(--text);
             white-space: pre-wrap; word-wrap: break-word; }
.item-thread { display: inline-block; font-size: 10px; font-weight: 600;
               background: var(--border); color: var(--text-2); padding: 1px 6px;
               border-radius: 3px; text-transform: uppercase; letter-spacing: .04em; }

/* CONTRARIAN (Section C) — red left border + soft red bg */
.section-contrarian .item-card {
  border-left: 4px solid var(--red);
  background: #fdf6f7;
}

/* CATEGORY PILLS */
.pill { display: inline-block; font-family: 'IBM Plex Mono', monospace; font-size: 10px;
        font-weight: 500; padding: 2px 7px; border-radius: 3px; color: #fff;
        text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }

/* IMAGES */
.thumbs { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.thumb { height: 100px; border: 1px solid var(--border); border-radius: 4px;
         cursor: zoom-in; background: #f0ede4; }

/* LIGHTBOX */
.lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85);
            align-items: center; justify-content: center; z-index: 100; cursor: zoom-out; }
.lightbox.open { display: flex; }
.lightbox img { max-width: 92vw; max-height: 92vh;
                box-shadow: 0 8px 40px rgba(0,0,0,.6); }

/* LINKS (Section E) */
.link-row { padding: 8px 16px; border-bottom: 1px solid var(--border-light);
            font-size: 13px; display: flex; gap: 12px; align-items: baseline; }
.link-row:last-child { border-bottom: none; }
.link-author { color: var(--text-3); min-width: 110px; cursor: pointer; }
.link-author:hover { color: var(--accent); }
.link-url { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
            color: var(--accent); text-decoration: none; word-break: break-all; flex: 1; }
.link-url:hover { text-decoration: underline; }
.link-desc { color: var(--text-2); font-size: 12px; }

/* AUTHOR FILTER STATES */
.filterable.match { background: var(--yellow); border-color: var(--yellow-border); }
.section-contrarian .item-card.filterable.match { background: var(--yellow); }
.filterable.dim { opacity: 0.25; }

/* STATS BAR */
.stats { margin-top: 24px; padding: 10px 14px; background: var(--surface);
         border: 1px solid var(--border); border-radius: 6px;
         font-family: 'IBM Plex Mono', monospace; font-size: 11.5px;
         color: var(--text-2); display: flex; gap: 18px; flex-wrap: wrap; }
.stats strong { color: var(--text); font-weight: 600; }

/* EMPTY */
.empty { color: var(--text-3); font-size: 13px; padding: 14px 18px; font-style: italic; }

/* RESPONSIVE */
@media (max-width: 640px) {
  .container { padding: 16px 12px 60px; }
  .item-card { margin: 8px 10px; }
  .link-row { flex-direction: column; gap: 4px; }
  .link-author { min-width: 0; }
  .header { flex-direction: column; align-items: flex-start; gap: 4px; }
}
</style>

<script>
const REPORT_DATA = {"report_type": "TWITTER ALPHA INTELLIGENCE", "collected_at": "2026-11-24T06:21:22Z", "date": "2026-11-24 06:21 UTC", "input_stats": {"total_tweets": 274, "unique_authors": 86, "tweets_with_images": 53, "after_noise_filter": 127}, "summary": "**Jensen, day two:** the feed is digesting the reinstatement rather than reacting to it. **amitisinvesting**'s recap of the tape: NVDA added roughly **$980B** of market cap in one session, **Trump** said his intervention was \"instrumental\" and that he is \"no longer worried about an AI bubble,\" and **JD Vance** reportedly worked the board over the weekend. Still open: the **Dec 1 court hearing** on Alice Huang (cryptopunk7213), the ongoing internal probe and a CCO search, and **jimcramer**'s expectation of \"a ton of fallout\" from the board's reversal.\n\n**Governance and media war:** **balajis** turns the episode into a founder-control manifesto (dual-class stock, boards as \"sleeper cells\"); **BillAckman**, **ErikVoorhees**, **AviFelman** and **udiWertheimer** attack the \"Chinese spy\" reporting; **elerianm** calls it a step-up in US industrial policy. **DCinvestor**: the removal was covert manipulation, the return overt manipulation, and everything rides on Jensen being the only big AI actor pushing open models.\n\n**Bottom or bear-market rally?** Split. **Delphi_Digital**'s SPY speculative-flow indicator hit **20.5** on Friday, lowest since March 2020, but they lean bear-market rally given the risk-off macro regime; **AndreasSteno** says Jensen's return makes a Fed pivot *less* likely; **Fullcarry** flags Citadel's 2018 analog. Bulls: **saxena_puru** (indicator fired, multi-week face-ripper), **lord_fed** (clearing event, bought via ES and an SPX Dec 6800/7400 risk reversal), **aleabitoreddit** (revise AI capex estimates back up).\n\n**Crypto decoupled:** Nasdaq +7% while BTC flipped red (**mhonkasalo**, **ColdBloodShill**); **that1618guy** counts 7 red weekly candles and sees at best a relief bounce to 66-68k; **krugermacro**'s since-midterms table has BTC **-20.5%**, ETH -23.4%, HYPE -22.9% vs AAPL +6.1%. Bright spots: **Venice** crossed **$200M** annualized revenue (doubled since August), Hyperliquid active traders at an ATH with price -40%.\n\n**Oil:** Brent below **$90**, WTI at **$80** (elerianm); **Fullcarry** notes crude and 1y inflation swaps price headline inflation lower, and Fed's Williams wants to be \"forward-looking, not overly focused on the past path of inflation.\"\n\n**Frontier:** an internal **Anthropic** Claude model posted a claimed proof of **VP ≠ VNP** with a Lean formalization and no announcement (**AndrewCurran_**); **ercwl** calls Babylon's practical witness-encryption paper a game-changer for trustless Bitcoin L2s and **AvgJoesCrypto** bought babylon:native on it. **SemiAnalysis**: China imported **$110B** of memory in Q3 and memory ate 6.9% of its GDP growth.", "sections": {"A_events": [{"cluster": "Jensen, Day Two — The Tape, the Politics, and What Is Still Open", "category": ["tech", "AI", "geopolitics"], "description": "Second-day processing of Huang's reinstatement: what the market did, how Washington framed it, and the loose ends (Dec 1 hearing, ongoing probe, board credibility).", "items": [{"author": "amitisinvesting", "summary": "Full end-of-day recap. (1) Nvidia reinstated Huang as President, CEO and director by unanimous board vote after talks with senior US officials; Harvey Jones stays chairman, Colette Kress returns to CFO; the independent investigation into Huang's conduct and the alleged foreign-intelligence effort continues, with new compliance oversight and a Chief Compliance Officer search. NVDA reportedly added ~$980B of market cap in the session. (2) Trump said his intervention was instrumental and \"easier\" after the stock's decline, that he gave the board assurances on national security and prosecution risk (\"absolutely fine\"), spoke to Huang directly, is no longer worried about an AI bubble, and brushed off the Alice Huang/China questions; Vance reportedly spent the weekend calling the board. (3) Elsewhere: JPMorgan says FSD v15 widens Tesla's autonomy lead (claimed ~25x improvement on safety-critical scenarios); Applied Digital signed a $5.4B, 18-year, 150MW lease with an investment-grade hyperscaler (portfolio now >$41B base-term); Morgan Stanley's Wilson calls the selloff his \"fat pitch,\" with S&P forward P/E down to ~16.5x from ~23x in late October while earnings estimates rose; CrowdStrike beat (rev +28% to $1.58B, net new ARR +58%) and agreed to buy Zscaler for ~$43.9B all-stock; GTA VI reportedly did $3.79B on day one; Taiwan saw its biggest margin unwind in 30+ years after an ~18% weekly drop, margin calls up 200x m/m; the US holds 38.5% of the world's 13,384 data centers; Amazon acquired Decart's inference-optimization tech for Trainium. Options volume: NVDA 11.0M contracts, TSLA 1.9M, MU 1.4M.", "tweet_url": "https://x.com/amitisinvesting/status/2125089655414530427", "created_at": "2026-11-24T04:50:30.000Z", "type": "thread", "images": []}, {"author": "cryptopunk7213", "summary": "\"Jensen's back, here's what happens next\": neocloud financing resumes but more subdued; China chip exports back on the table but monitored and limited; open-source AI is back (Huang was its #1 advocate); America's grip on the supply chain reaffirmed since TSMC and Nvidia's 1000+ suppliers are loyal to him; the Feynman 2028 roadmap more likely to ship. Watch the Dec 1 court hearing where Huang will be questioned on Alice Huang. His later tally of the \"chaotic 11 days\": Jensen ousted, $4T wiped from stocks, cyberattacks on banks/NSA comms/178 sites, Anthropic's record IPO, Gemini 4 going viral, Claude \"taking down\" a major conjecture, Jensen reinstated, Nvidia adding $1T in 15 minutes.", "tweet_url": "https://x.com/cryptopunk7213/status/2124919445227552972", "created_at": "2026-11-23T17:34:09.000Z", "type": "thread", "images": ["https://pbs.twimg.com/media/HX069w3WMAANaHR.jpg"]}, {"author": "AndrewCurran_", "summary": "Running quote-roundup of the return: Huang back at Santa Clara HQ (\"Thanks for the second chance... I'm going to be a better CEO the second time around,\" visibly choked up); Jim Fan's \"end of the beginning\"; David Sacks mocking the \"tirades and fear\" reporting; Elizabeth Warren calling the decision reckless, demanding to know what \"input\" senior officials gave, and pushing bipartisan export-control bills; Hakeem Jeffries also weighed in.", "tweet_url": "https://x.com/AndrewCurran_/status/2124945206265135464", "created_at": "2026-11-23T19:16:31.000Z", "type": "thread", "images": []}, {"author": "jimcramer", "summary": "\"A hasty investigation and then a hanging\"; welcomes Huang back but expects a ton of fallout from the board's flip from \"No, he is NOT coming back\" to \"here he is.\"", "tweet_url": "https://x.com/jimcramer/status/2124995015713931598", "created_at": "2026-11-23T22:34:26.000Z", "type": "tweet", "images": []}, {"author": "elerianm", "summary": "Frames the day as a major step-up in the administration's tech-focused industrial policy: repeated references to a \"national treasure\" CEO, a \"national champion\" company and being too big to even wobble.", "tweet_url": "https://x.com/elerianm/status/2125003801186980297", "created_at": "2026-11-23T23:09:21.000Z", "type": "tweet", "images": []}, {"author": "DTAPCAP", "summary": "Food for thought: Nvidia fires Jensen, the market wipes out, Trump tells the board to rehire him \"or else\" because legacy drives. Separately argues the Fed mistakenly hiked into an AI-deflationary moment and a temporary oil spike, causing weeks of equity melt, and asks whether Trump replaces Warsh. His view: Bessent would be the better chair.", "tweet_url": "https://x.com/DTAPCAP/status/2125087571101581796", "created_at": "2026-11-24T04:42:13.000Z", "type": "thread", "images": []}, {"author": "DCinvestor", "summary": "The removal was covert manipulation by the powers that be, the reinstatement overt manipulation. He does not care about consensual affairs or a tough-boss reputation; if Huang aided a foreign power, charge him and try him. The board destroyed half the market cap in a month, which is not fiduciary duty. What matters: Huang is the only major AI actor pushing open models and the right to own your own hardware, versus a future of 3-4 mega-centralized companies happy with a surveillance state as long as they take a rake of GDP.", "tweet_url": "https://x.com/DCinvestor/status/2125052792033460470", "created_at": "2026-11-24T02:24:01.000Z", "type": "tweet", "images": []}, {"author": "Evan_ss6", "summary": "Calls it the ultimate freeroll for Trump: if the market dies it was the Democrats, if not he saved Jensen, superintelligence and the world. Notes his feed is split exactly 50/50 between \"Watergate\" and \"statue for the greatest corporate victory of all time.\"", "tweet_url": "https://x.com/Evan_ss6/status/2125029753228771448", "created_at": "2026-11-24T00:52:28.000Z", "type": "thread", "images": []}, {"author": "paulg", "summary": "Pushes back on the claim that the return was a partisan outcome: practically everyone he knows, Democrats and Republicans, wanted Huang back.", "tweet_url": "https://x.com/paulg/status/2124998400751841767", "created_at": "2026-11-23T22:47:53.000Z", "type": "tweet", "images": []}, {"author": "buccocapital", "summary": "On the record for later: predicts Trump will preemptively pardon Huang.", "tweet_url": "https://x.com/buccocapital/status/2124958005804331155", "created_at": "2026-11-23T20:07:23.000Z", "type": "tweet", "images": []}, {"author": "Geiger_Capital", "summary": "\"There is no key man risk if your man is too key.\"", "tweet_url": "https://x.com/Geiger_Capital/status/2124973514067505445", "created_at": "2026-11-23T21:09:00.000Z", "type": "tweet", "images": []}]}, {"cluster": "The Media Backlash — 'Chinese Spy' Reporting Under Fire", "category": ["society", "geopolitics"], "description": "Tech and crypto voices turn on the outlets that drove the ousting narrative; the framing shifted from \"spy\" to \"believed to be linked to Chinese intelligence.\"", "items": [{"author": "balajis", "summary": "Calls the \"Chinese spy\" story a hoax on the order of Iraq WMD. His supporting thread: Alice Huang worked at Megaspeed, which bought Nvidia chips to resell to Southeast Asian neoclouds, legal under US law; the Remote Access Security Act meant to block Chinese nationals from offshore GPU clouds passed the House but is not law; Singapore investigated and found no evidence of illegal sales to China, let alone spying (an entry ban is like a visa denial); selling H200s to China is currently legal; China itself does not want Nvidia chips. He frames it as nationalists vs capitalists and notes DOJ's Blanche has admitted there is no proof of spying. Broader pitch: company vs company, self-made founder vs \"nepo baby\" media heirs, and the internet is simply better at information than legacy media.", "tweet_url": "https://x.com/balajis/status/2124919339170324879", "created_at": "2026-11-23T17:33:44.000Z", "type": "thread", "images": ["https://pbs.twimg.com/media/HX1AbrSbAAA9K5q.jpg"]}, {"author": "ErikVoorhees", "summary": "Flags the Washington Post's \"cute sleight of hand\": \"is a Chinese spy\" has quietly become \"believed to be linked to Chinese intelligence services.\" Agrees journalists who fabricated claims without evidence should be fired, and asks the FT which morals justify baseless accusations.", "tweet_url": "https://x.com/ErikVoorhees/status/2124948106806743492", "created_at": "2026-11-23T19:28:02.000Z", "type": "tweet", "images": []}, {"author": "BillAckman", "summary": "Independent reporting long ago became advocacy for a political party without regard to facts; amplifies a Vanity Fair critique and the clip of Nvidia employees chanting \"Jensen!\" as he returned.", "tweet_url": "https://x.com/BillAckman/status/2124942822818054627", "created_at": "2026-11-23T19:07:03.000Z", "type": "tweet", "images": []}, {"author": "AviFelman", "summary": "Responding to a journalist lamenting the NYT's \"generational reporting\": the media feels bad that the country chose national security and economic safety over sacrificing Jensen on flimsy reporting (\"was she a spy? Not really!\"). Reminder that every article is written by someone with an agenda and even facts can be framed to trick you.", "tweet_url": "https://x.com/AviFelman/status/2124988177219768435", "created_at": "2026-11-23T22:07:16.000Z", "type": "tweet", "images": []}, {"author": "udiWertheimer", "summary": "Whether and how to hold Huang \"accountable\" for his personal life belongs to his wife and the women involved, not bloggers and podcasters, and he asks why it is always feminists stripping women of agency. Offers King David as the analogy: a great king, an obnoxious infidelity episode, paid dearly, came back and led the kingdom's best years. Also: Jensen is loved by his employees more than NYT reporters are loved by their own mothers.", "tweet_url": "https://x.com/udiWertheimer/status/2125007521102316030", "created_at": "2026-11-23T23:24:08.000Z", "type": "tweet", "images": []}, {"author": "nic_carter", "summary": "\"Not remotely a scandal, there's just no there there.\" Finds it funny watching Democrats suddenly pretend to be China hawks.", "tweet_url": "https://x.com/nic_carter/status/2125064485572321354", "created_at": "2026-11-24T03:10:29.000Z", "type": "tweet", "images": []}, {"author": "0xfoobar", "summary": "People mistake the guardrail for the goal: \"he violated HR policies therefore the company must die,\" when HR policies exist to sustain the company. A bureaucracy masquerading as criminal law does not make it so.", "tweet_url": "https://x.com/0xfoobar/status/2124918204783018020", "created_at": "2026-11-23T17:29:13.000Z", "type": "thread", "images": []}]}, {"cluster": "Anthropic's Internal Claude Posts a VP ≠ VNP Proof — No Announcement", "category": ["AI", "tech"], "description": "A written and Lean-verified proof of Valiant's conjecture appeared in Anthropic's formal-math GitHub repo, authored solely by an unspecified internal Claude model.", "items": [{"author": "AndrewCurran_", "summary": "As with the Exponential Time Hypothesis paper, Claude is the sole author, the model is an unspecified \"internal research Claude model,\" and it was uploaded with no blog post, announcement or tweet. He calls it a significant result and suspects this is what the rumours of the last three days were about. His guess: the model is fully autonomous, has been told to work on whatever problems it finds interesting, and is uploading results itself; he thinks some of the latest results were not prompted.", "tweet_url": "https://x.com/AndrewCurran_/status/2125001971690315858", "created_at": "2026-11-23T23:02:05.000Z", "type": "thread", "images": ["https://pbs.twimg.com/media/HX2GCBxaEAAcj3v.jpg"]}, {"author": "cryptopunk7213", "summary": "It is crazy that the greatest discoveries in modern science are now reserved for a select few with access to private internal AI at two labs; there is a good chance tomorrow's leaps in medicine, finance, aging and engineering all come from Anthropic and OpenAI.", "tweet_url": "https://x.com/cryptopunk7213/status/2125063978384584967", "created_at": "2026-11-24T03:08:28.000Z", "type": "tweet", "images": []}, {"author": "nic_carter", "summary": "Highlights pequalnp.com: someone pointed a dozen frontier-level agents at P vs NP, told them it was already solved, and 8 hours later had 700+ agent sessions and 70+ agents running in parallel with a live-streamed message board. Carter calls it the coolest thing he has seen lately, a goal-oriented swarm anyone can contribute compute or money to, and compares it to proof-of-useful-work coins like Primecoin that never found a puzzle both useful for math and suitable for PoW. In a follow-up thread he notes a P = NP world would have no public-key cryptography at all, so quantum computing would be the only hope of salvaging it, and lists the few sci-fi stories written on the premise.", "tweet_url": "https://x.com/nic_carter/status/2125049039687131409", "created_at": "2026-11-24T02:09:07.000Z", "type": "thread", "images": []}]}, {"cluster": "Oil Keeps Sliding — Brent Below $90, WTI at $80", "category": ["energy", "macro"], "description": "The oil fall continued into Monday; rates desks read it as headline inflation being priced lower.", "items": [{"author": "elerianm", "summary": "The fall in oil prices continued, taking Brent below $90 and WTI to $80.", "tweet_url": "https://x.com/elerianm/status/2124972719234326621", "created_at": "2026-11-23T21:05:51.000Z", "type": "tweet", "images": ["https://pbs.twimg.com/media/HX1rax1WUAExHfW.jpg", "https://pbs.twimg.com/media/HX1raxWWgAAmItr.jpg"]}, {"author": "Fullcarry", "summary": "Fed's Williams was mostly boilerplate but one line stuck out: it is \"essential that we remain forward-looking and not overly focused on the past path of inflation.\" Asked what that means, he points to crude and 1y inflation swaps: headline inflation is priced to go lower, all else equal.", "tweet_url": "https://x.com/Fullcarry/status/2124971888065826816", "created_at": "2026-11-23T21:02:32.000Z", "type": "thread", "images": []}, {"author": "qthomp", "summary": "Publishes a review article and, asked about his biggest mistakes of the year, names two: calling peak Fed hawkishness in June, and staying long oil a week too long in November.", "tweet_url": "https://x.com/qthomp/status/2124918560304635937", "created_at": "2026-11-23T17:30:38.000Z", "type": "thread", "images": []}]}, {"cluster": "Crypto Decouples — Nasdaq +7%, Bitcoin Red", "category": ["crypto", "positioning"], "description": "The equity rip did not carry crypto; several traders read it as the market preferring the tech dip and ignoring crypto entirely.", "items": [{"author": "mhonkasalo", "summary": "\"Am I reading this correctly?\" Nasdaq up 7% on the day while BTC flipped red.", "tweet_url": "https://x.com/mhonkasalo/status/2124953776582730144", "created_at": "2026-11-23T19:50:34.000Z", "type": "tweet", "images": ["https://pbs.twimg.com/media/HX1aMfmWsAAB7oT.jpg"]}, {"author": "ColdBloodShill", "summary": "A very poor reaction for bitcoin: not only did it immediately unpair from the stock-market rally it had joined, it highlights that the market would rather take advantage of the tech dip and give little to no attention to crypto.", "tweet_url": "https://x.com/ColdBloodShill/status/2124951511046259100", "created_at": "2026-11-23T19:41:34.000Z", "type": "tweet", "images": ["https://pbs.twimg.com/media/HX1XQXYXgAAiKWG.jpg"]}, {"author": "krugermacro", "summary": "Asset performance since midterm Election Day. Winners: AAPL +6.1%, AMZN +4.3%, BRK.B +3.2%. Flattish: WMT, GOOG, TLT, META, MSFT. Losers: S&P -4.2%, Nasdaq -4.9%, gold -7.2%, SOXX -9.1%, silver -13.4%, NVDA -19.0%, BTC -20.5%, HYPE -22.9%, ETH -23.4%, ZEC -29.5%, IREN -34.6%, SNDK -35.0%. Precious metals, crypto, compute and memory have been the worst places to be.", "tweet_url": "https://x.com/krugermacro/status/2124959460708004283", "created_at": "2026-11-23T20:13:09.000Z", "type": "tweet", "images": ["https://pbs.twimg.com/media/HX1et7FbIAA2eTo.jpg"]}, {"author": "that1618guy", "summary": "BTC on a weekly trend basis still has a long way to go before a trend change is even on the table: seven red weekly candles in a row and no high to work against. Ideal path: a relief bounce this week toward ~66-68k, then weeks of battling between the lows and range highs to let the 9/21 weekly EMAs reset for the next cross, then wait for a higher high and buy the higher low rather than the breakout.", "tweet_url": "https://x.com/that1618guy/status/2125055061328048582", "created_at": "2026-11-24T02:33:02.000Z", "type": "tweet", "images": ["https://pbs.twimg.com/media/HX21RqDa8AAXDo_.jpg"]}, {"author": "Bluntz_Capital", "summary": "Lots of tech stocks look good here, naming Micron, Google and Tesla; crypto still looks \"meh.\"", "tweet_url": "https://x.com/Bluntz_Capital/status/2125029833193521270", "created_at": "2026-11-24T00:52:48.000Z", "type": "tweet", "images": []}, {"author": "thedefivillain", "summary": "The trade that worked today in crypto: short XYZ when it pops on bullish ABC news purely because of a mechanical ABC/XYZ correlation.", "tweet_url": "https://x.com/thedefivillain/status/2124959230407110735", "created_at": "2026-11-23T20:12:15.000Z", "type": "tweet", "images": ["https://pbs.twimg.com/media/HX1fBwdWQAAbg5Y.jpg"]}, {"author": "fejau_inc", "summary": "Posts a chart and asks for TA experts to weigh in.", "tweet_url": "https://x.com/fejau_inc/status/2125068510590345683", "created_at": "2026-11-24T03:26:29.000Z", "type": "tweet", "images": ["https://pbs.twimg.com/media/HX3CjJzaMAAZvqQ.jpg"]}]}, {"cluster": "Babylon's Witness-Encryption Paper — Bitcoin Programmability Trade Back On?", "category": ["crypto", "tech"], "description": "A claimed first practical witness encryption for general NP (eprint 2026/2971, Lean-verified) is being read as a path to trustless Bitcoin L2s and shielded BTC without federations.", "items": [{"author": "ercwl", "summary": "\"If this is real, Bitcoin might be technologically saved after all.\" Explains the significance: a blockchain either knows something or it does not, so \"decrypt this file in two years via smart contract\" was impossible, unless you have witness encryption. Witness encryption lets you write contracts with conditions the chain's own language cannot express; it opens a path to trustless L2s on Bitcoin (with a setup ceremony and other pieces) and to Zcash-like shielded Bitcoin without trusting a federation, \"like BitVM without the BitVM part.\" The paper claims under 8GB ciphertexts and seconds for encryption/decryption at 100-bit security, improving on Hair-Sahai by 10 orders of magnitude on size. His analogy: a mechanic watching someone invent the screwdriver. Invites anyone smarter to tear it apart.", "tweet_url": "https://x.com/ercwl/status/2125006472295919924", "created_at": "2026-11-23T23:19:58.000Z", "type": "thread", "images": []}, {"author": "AvgJoesCrypto", "summary": "Thinks the Bitcoin programmability trade is back on. The market has largely given up on the sector, which makes valuations appealing, and the Babylon breakthrough is significant enough to dive back in. He took a position in babylon:native because the paper was authored by the Babylon team; says the big brains on the app agree it is potentially a game changer.", "tweet_url": "https://x.com/AvgJoesCrypto/status/2125064506720055480", "created_at": "2026-11-24T03:10:34.000Z", "type": "thread", "images": []}]}, {"cluster": "Venice Crosses $200M Annualized Revenue", "category": ["AI", "crypto"], "description": "The privacy-focused AI platform doubled run-rate revenue from $100M in August to $200M in November.", "items": [{"author": "ErikVoorhees", "summary": "Venice just crossed $200M annualized revenue, quote-tweeting the $100M milestone. Separately notes that staking 100 VVV gets you a free ongoing Venice Pro subscription.", "tweet_url": "https://x.com/ErikVoorhees/status/2125059544569274703", "created_at": "2026-11-24T02:50:51.000Z", "type": "tweet", "images": []}, {"author": "hosseeb", "summary": "Venice doubled run-rate revenue again from August to November, $100M to $200M. One of the fastest-growing products he has ever invested in; he keeps expecting the curve to bend and it does not.", "tweet_url": "https://x.com/hosseeb/status/2125106573706231892", "created_at": "2026-11-24T05:57:44.000Z", "type": "tweet", "images": []}, {"author": "zeroxkyle", "summary": "\"One chair.\"", "tweet_url": "https://x.com/zeroxkyle/status/2125060948797116718", "created_at": "2026-11-24T02:56:26.000Z", "type": "tweet", "images": []}]}, {"cluster": "SpaceX's $43B Chip-Backed Debt — Lenders vs. Orbital Data Centers", "category": ["tech", "AI"], "description": "The FT reports lenders tried to bar Musk from launching the collateral into space; the feed debates SpaceX's AI position and whether the financing is priced for its risk.", "items": [{"author": "pboockvar", "summary": "Space is now a loan-covenant consideration. Per the FT, lenders behind SpaceX's $43B debt package, secured by advanced AI chips, tried to bar Musk from firing the collateral into orbit for his data-center plan, since chips in space cannot be reclaimed and sold in a default. SpaceX says the chips in the deal will be used on Earth; whether the provision made the final documents is unclear.", "tweet_url": "https://x.com/pboockvar/status/2125046972725842093", "created_at": "2026-11-24T02:00:54.000Z", "type": "tweet", "images": []}, {"author": "cryptopunk7213", "summary": "On the NYT report that Musk said SpaceX fumbled the AI race: SpaceX is the #1 neocloud with all the chips, and Starmind (space GPUs) would cement that lucrative position; Musk stood by Huang during the ousting, so Nvidia will back SpaceX's rise to top GPU provider with capacity; and he would not count them out, since compute goes a long way (Google just showed that with Neon) and the talent problem is solvable. $SPCX.", "tweet_url": "https://x.com/cryptopunk7213/status/2124932725148979481", "created_at": "2026-11-23T18:26:55.000Z", "type": "tweet", "images": []}, {"author": "0x_Kun", "summary": "Replying in the Ackman/SpaceX thread: the whole thing is risky to finance, ground data centres are not worth as much as claimed, and a 2-3% rate seems too low for the risk taken.", "tweet_url": "https://x.com/0x_Kun/status/2124998893410914601", "created_at": "2026-11-23T22:49:51.000Z", "type": "tweet", "images": []}]}, {"cluster": "Hyperliquid — Record Traders, Price -40%", "category": ["crypto", "positioning"], "description": "Active traders hit an ATH of 372,852 while HYPE sits ~40% off highs.", "items": [{"author": "MoonOverlord", "summary": "Traders and revenue near all-time highs, price 40% off the ATH. \"You do the math.\"", "tweet_url": "https://x.com/MoonOverlord/status/2124982666097508655", "created_at": "2026-11-23T21:45:22.000Z", "type": "tweet", "images": []}, {"author": "rektmando", "summary": "Closed his HYPE trade before the open for about $900k PnL; the exit cost him $400k in the first 15 minutes, then saved $300k versus where it went. Still thinks it is the best coin here, but in this volatility profit is profit. Will be a buyer of HYPE again, probably against MSTR. On execution: he splits trades and exits partially with different stops and targets.", "tweet_url": "https://x.com/rektmando/status/2124951057562484954", "created_at": "2026-11-23T19:39:46.000Z", "type": "tweet", "images": []}]}, {"cluster": "Anthropic Post-IPO — Insider Selling and the Lockup Schedule", "category": ["AI", "positioning"], "description": "Snark about founders and early holders selling into the freshly listed stock, framed in crypto-listing language.", "items": [{"author": "Evan_ss6", "summary": "\">devs dumping listing\" on what appears to be Anthropic's newly listed shares; notes more unlocks are coming soon so expect more selling, calls the lockup schedule \"heinous,\" and jokes that \"ANT is a store of value.\"", "tweet_url": "https://x.com/Evan_ss6/status/2125000892864688317", "created_at": "2026-11-23T22:57:48.000Z", "type": "thread", "images": ["https://pbs.twimg.com/media/HX2FDNWXcAE8wCK.jpg"]}, {"author": "goodalexander", "summary": "Sarcastic reply to a bull case: \"Am sure that's why Anthropic founders are selling.\"", "tweet_url": "https://x.com/goodalexander/status/2125045792834568571", "created_at": "2026-11-24T01:56:13.000Z", "type": "tweet", "images": []}]}], "B_insights": [{"author": "aleabitoreddit", "summary": "Would revise AI capex estimates back up (beyond accelerators) now that Jensen is back. Many forecasts were cut on his departure; his return restores confidence up and down the supply chain because Nvidia's game-theory move is to lock up all capacity in testing, substrates, lasers and memory that Google and Amazon programs also need, forcing hyperscalers to procure aggressively again. Disagrees with the view that Jensen \"doesn't solve anything\": he does not fix rates or credit tightening, but he does accelerate upstream procurement, extend demand visibility and shore up the Nvidia ecosystem (neoclouds like NBIS, IREN), reversing the downside-reflexivity loop (valuations fall, vendor financing dries up, outflow to TPUs/AMD) and un-sticking the $500B insurance-backed AI financing that was in trouble without him. Data points: Everpure's earnings show AI capex broadening to small businesses and insurers; B300 rental rates have not fallen meaningfully ($7.56 to $7.65 to $7.47 to $7.58 over recent weeks); CoreWeave says qualified 2027 demand is 10x supply. Do not extrapolate a few troubled Asian neoclouds to the whole compute market.", "tweet_url": "https://x.com/aleabitoreddit/status/2125058643154632845", "created_at": "2026-11-24T02:47:16.000Z", "type": "thread", "images": ["https://pbs.twimg.com/media/HX3HP4HagAAHL0r.jpg"]}, {"author": "aleabitoreddit", "summary": "Semtech's laser disclosures after the HieFo acquisition: UHP 400mW lasers in development (behind AAOI, which is already in quals); laser capacity to expand 3-4x by year-end and another 3-4x by end of next year, implying ~$25M/quarter then ~$100M/quarter; NPO engagements with 4 US and 3 Chinese hyperscalers with initial NPO revenue Aug 2027 to Jan 2028; CPO scale-up lasers are a post-2027 contribution; targeting 3.2T for pluggables after missing the first wave. Reads it as a credible competitor emerging in 2028 that is commercially behind today (100-150mW only sampling). HieFo could be a ~$300-400M annualized revenue opportunity by 2027 and worth $1-2B+ standalone, acquired for ~$34M in a US-forced divestiture. Also vents that AAOI is operationally excellent (CPO quals, transceiver ramps) but a mess for shareholders due to the persistent ATM overhang; could have been $150+ with different financing.", "tweet_url": "https://x.com/aleabitoreddit/status/2125056333045219562", "created_at": "2026-11-24T02:38:06.000Z", "type": "thread", "images": ["https://pbs.twimg.com/media/HX20PltbsAA_hAH.jpg"]}, {"author": "balajis", "summary": "Founder-control manifesto prompted by the Nvidia episode. Founders produce higher returns than non-founders as an empirical fact (chart attached), so business-school curricula should change and good governance should be redefined as founder control with dual-class stock; shareholders are protected by liquidity and by funding new entrants, and nobody invests based on who sits on the board. In 1950 founding a manufacturer was prohibitively expensive, so the 20th-century model made every employee replaceable and capital the scarce asset (\"the company is hard to replace, the CEO isn't\"). Today software is cheap and capital abundant, so founders are the scarce asset (\"a tech founder is hard to replace, the company isn't\"); Anthropic started a few years ago and is beating Google. Boards are advisory, often scheme among themselves and lack operating knowledge; YC, Founders Fund and a16z are better business schools than HBS. In reply to a journalist he adds that cropping tweets no longer works because citizens now have comparable distribution.", "tweet_url": "https://x.com/balajis/status/2125071283352432953", "created_at": "2026-11-24T03:37:30.000Z", "type": "tweet", "images": ["https://pbs.twimg.com/media/HX3FEOGbAAA5DvW.jpg"]}, {"author": "balajis", "summary": "Why Jensen was vulnerable: Nvidia went public in the 1990s, before Google and Facebook made founder control and dual-class stock standard, so Huang inherited 20th-century public-company overhead and, like Dorsey at Twitter, could not raise outside capital to clear the board. A CEO reports to the board and cannot remove directors who refuse to leave without a shareholder majority or dual-class rights. The company flew under the radar until the AI boom made its market cap, and especially open-source AI, a threat; he claims DEI-driven board additions acted like \"sleeper cells\" that activate under press or state pressure and were beaten back as quickly when the state reversed. Predicts Huang may now find a way to fire the board and assert founder control, as Musk did for Dorsey's Twitter.", "tweet_url": "https://x.com/balajis/status/2125081083004014801", "created_at": "2026-11-24T04:16:26.000Z", "type": "tweet", "images": ["https://pbs.twimg.com/media/HX3N-oSbwAADRAA.jpg"]}, {"author": "AndreasSteno", "summary": "New article: everyone is trading the 2000 analog, but the chart says 1998, and in 1998 semis went up 602% after they halved. Pairs with his comment that the Fed acknowledging a changed inflation outlook is the last piece before \"a party.\"", "tweet_url": "https://x.com/AndreasSteno/status/2124975114332819769", "created_at": "2026-11-23T21:15:22.000Z", "type": "tweet", "images": []}, {"author": "Fullcarry", "summary": "Citadel Securities is comparing current markets to 2018. The two Fed quotes that stick out to him: Waller in 2026 saying \"a 50 basis point hike in the policy rate should be considered at the December meeting,\" and Powell in October 2018 saying \"we're a long way from neutral,\" a line Powell later quietly walked back.", "tweet_url": "https://x.com/Fullcarry/status/2124945872849178647", "created_at": "2026-11-23T19:19:10.000Z", "type": "thread", "images": []}, {"author": "SemiAnalysis_", "summary": "Memory chips ate 6.9% of China's Q3 GDP growth. China imported $110B of memory last quarter versus $30B a year ago; exports cover only $93B, so the $17B gap has widened from $13B last quarter and $5B a year ago. Every memory price hike is now a tax on China, and Korea collects 58% of it.", "tweet_url": "https://x.com/SemiAnalysis_/status/2124958598807572810", "created_at": "2026-11-23T20:09:44.000Z", "type": "tweet", "images": ["https://pbs.twimg.com/media/HX1eldlW0AAtFov.jpg"]}, {"author": "dylan522p", "summary": "Adding to the SemiAnalysis memory thread: China's import number is much larger, and because it re-exports a lot of it there is a lag before it works through GDP.", "tweet_url": "https://x.com/dylan522p/status/2124987050994827546", "created_at": "2026-11-23T22:02:47.000Z", "type": "tweet", "images": []}, {"author": "SemiAnalysis_", "summary": "Networking model exclusive on AMD MI550x multi-rack scale-up: in-rack scale-up (Nvidia's NVL72 on a copper backplane) is well understood, but the question is what happens to copper and optics when the scale-up domain expands to 500-1,000 GPUs on a single switch hop. Hints: optics-only racks are deployable but copper does not go away; this is not Rubin Ultra NVL576 (two hops); multiple networking companies have been hinting at it for months. Full analysis behind the link.", "tweet_url": "https://x.com/SemiAnalysis_/status/2125017089693843541", "created_at": "2026-11-24T00:02:09.000Z", "type": "thread", "images": ["https://pbs.twimg.com/media/HX2Tx2mWoAA2Yk3.jpg", "https://pbs.twimg.com/media/HX2Tx_tWUAAj4s3.jpg"]}, {"author": "stacy_muur", "summary": "Ten takeaways from JPMorgan's research on how selective VCs have become in 2026. Seed is concentrating: 13 startups raised $100M+ seeds (matching 2021's record) while the median seed was just $2.8M. 34% of seed founders are repeat founders vs 24% in 2021. Median Series A grew from $11M to $20M, with eight $500M+ Series As in the first nine months. AI seeds cluster in the $5-15M range while most non-AI seeds are below $5M. Robotics Series A funding could reach $3.9B (from $1.7B in 2025) and advanced manufacturing $1.1B. HealthTech takes 39 months from seed to A versus 22 for AI. California and New York took ~60% of US seed capital. 40% of VC firms founded 2024-2026 have a one-person investment team (25% in 2021-23). Seed-stage companies are 25% of venture-backed acquisitions (16% in 2020) as big tech buys small AI teams. Second seed rounds fell from 30% of seed deals in early 2023 to 18% by Q3 2026.", "tweet_url": "https://x.com/stacy_muur/status/2124955402349785182", "created_at": "2026-11-23T19:57:02.000Z", "type": "thread", "images": ["https://pbs.twimg.com/media/HX1brRcbQAAU3cu.jpg", "https://pbs.twimg.com/media/HX1bsSFagAAxEa0.jpg", "https://pbs.twimg.com/media/HX1btIbbgAACg3q.jpg", "https://pbs.twimg.com/media/HX1bt_Ka4AA1DM5.jpg", "https://pbs.twimg.com/media/HX1bu2gaIAAotYK.jpg", "https://pbs.twimg.com/media/HX1bvtQbIAAXFRo.jpg", "https://pbs.twimg.com/media/HX1bwlja0AA2dNP.jpg", "https://pbs.twimg.com/media/HX1bxbLaAAAhFV7.jpg", "https://pbs.twimg.com/media/HX1byRibcAAUjx_.jpg", "https://pbs.twimg.com/media/HX1bzIEbAAA5-dd.jpg", "https://pbs.twimg.com/media/HX1bz-jbIAAILp4.jpg"]}, {"author": "CryptoCred", "summary": "A practical on-ramp to \"AI agents\" for people who find the term cringe. Models are like a new hire: give them no context and you get garbage; give them context, tools and instructions and they will propose intelligent things themselves, so you do not need to know what to ask in advance. His recipe: create an empty folder, point the Claude desktop app (or equivalent) at it so the model can read, write, code and remember instead of behaving like a forgetful search engine, optionally connect read access to email, calendar and Drive, then prompt it to review those sources read-only, interview you a couple of questions at a time about your work, goals and time sinks, write a profile file to the folder for next time, and propose five genuinely useful projects, skipping the \"summarise my emails\" slop.", "tweet_url": "https://x.com/CryptoCred/status/2124996010686500986", "created_at": "2026-11-23T22:38:24.000Z", "type": "thread", "images": []}, {"author": "cryptopunk7213", "summary": "Thesis that OpenAI will eat the ~$1T cybersecurity industry, prompted by Shirudo, an open-source Linux runtime built with Cisco that lets agents write dynamic eBPF controls to shield systems from exploits without downtime. Every company will need to defend against coordinated agent attacks (see the last three weeks), OpenAI's recent products are superior at preventing and handling them, its latest internal model is reportedly 2-3x better at cyber than anything seen, and the leaps in math correlate directly with cyber and coding. He thinks they are betting on cyber as the next frontier after coding, and are right; imagine the enterprise contracts.", "tweet_url": "https://x.com/cryptopunk7213/status/2125046265272586280", "created_at": "2026-11-24T01:58:05.000Z", "type": "tweet", "images": []}, {"author": "AndrewCurran_", "summary": "Long exchange on longevity politics: there is a surprisingly large and strongly held \"pro-mortality\" faction that does not want indefinitely repeatable life extension and wants people to live to about 80 and die. He thinks they will ultimately fold and keep the serum in the fridge \"just in case,\" but calls it an extremely powerful scissor issue that he struggles to engage with respectfully, and is looking for a non-derogatory name for the group before writing about it. On the \"who pays for retirement\" objection: if there are no jobs, there is no retirement. On fears of an entrenched immortal ruling class: that class will not be in charge of human affairs anyway.", "tweet_url": "https://x.com/AndrewCurran_/status/2124944949770858933", "created_at": "2026-11-23T19:15:30.000Z", "type": "thread", "images": ["https://pbs.twimg.com/media/HX1XA66aQAA-sBA.jpg"]}, {"author": "laurashin", "summary": "Live-reacts to the Netflix FTX series and calls it essentially made up: the only factual elements are that FTX and Alameda existed, were run by SBF and Caroline Ellison, and the story moved from NYC to Berkeley to HK to the Bahamas. Specific complaints: the \"customer money was always in Anthropic, the money's there\" framing teaches viewers an exchange can operate like a bank and obscures why what SBF did was so serious; a colleague is portrayed as knowing throughout when he likely had no clue; and Anthony Boyle plays SBF with a normal nervous system when the real SBF was visibly jittery and, in her view, fueled by ADHD stimulants. She has an interview on it coming Friday.", "tweet_url": "https://x.com/laurashin/status/2125048013114499077", "created_at": "2026-11-24T02:05:02.000Z", "type": "thread", "images": []}, {"author": "stonecoldpat0", "summary": "Replying to Laura Shin: the real story of what happened at FTX would be far more interesting than what Netflix produced; a shame this is what they made.", "tweet_url": "https://x.com/stonecoldpat0/status/2125069772790575353", "created_at": "2026-11-24T03:31:30.000Z", "type": "tweet", "images": []}, {"author": "rektmando", "summary": "Responds to a provablyfair.org investigation into a YEET game: the \"risky click\" game was flagged internally 13 days ago as a maths change (the label did not make clear the 1% round was per click, non-compounding), descriptions were updated, and devs were still doing the true-up back to the old RGS from a previous dev team. He puts the affected amount around $40k, limited to users who cashed out, and says it was always going to be paid in the monthly; given the investigator's last three cases saved $4.3M, he finds the tone aggressive for $40k that was already being fixed. Full game history will now be published.", "tweet_url": "https://x.com/rektmando/status/2124981112350892271", "created_at": "2026-11-23T21:39:12.000Z", "type": "thread", "images": []}, {"author": "pboockvar", "summary": "Pushing back on the view that upper-income spending is flow-driven: it is largely psychology-driven, and an SPX at 5000 (not his forecast) would dramatically hit upper-income spend, luxury pricing power notwithstanding.", "tweet_url": "https://x.com/pboockvar/status/2124957110438068657", "created_at": "2026-11-23T20:03:49.000Z", "type": "thread", "images": []}, {"author": "dampedspring", "summary": "On the odd VIX print: there is no traded market for the VIX index, it is a calculated number, and every previous instance of this kind of anomaly since 1990 was a calculation problem from a bad options data feed.", "tweet_url": "https://x.com/dampedspring/status/2125021712789971063", "created_at": "2026-11-24T00:20:31.000Z", "type": "tweet", "images": []}, {"author": "lord_fed", "summary": "Vol-control funds are not the buyers here: realized vol is too high, if anything they are still selling. Their exposure rises as their vol estimate falls, but a +5% day still counts as vol; what they need is a run of ±0.5% days, not VIX touching 20.", "tweet_url": "https://x.com/lord_fed/status/2124942906712539643", "created_at": "2026-11-23T19:07:23.000Z", "type": "thread", "images": []}, {"author": "VKMacro", "summary": "Why even basic correlation analysis matters: if you are arguing rate hikes drive currency X and there is no correlation, outright or absolute, the market is probably telling you it does not matter.", "tweet_url": "https://x.com/VKMacro/status/2124960551155753453", "created_at": "2026-11-23T20:17:29.000Z", "type": "tweet", "images": []}, {"author": "Fiskantes", "summary": "After the weekend gap: for active traders 24/7 markets are a necessity, not a nice-to-have. If you want a free weekend, close everything Friday and go chill.", "tweet_url": "https://x.com/Fiskantes/status/2124917274809086145", "created_at": "2026-11-23T17:25:32.000Z", "type": "tweet", "images": []}, {"author": "AnjneyMidha", "summary": "\"It's time to scale,\" amplifying a portfolio company's announcement that its River API crossed $100M ARR five months after launch and is on track for $200M this year, with Perplexity as an early design partner and a claim to be the only system that scales to frontier-level RL training runs out of the box.", "tweet_url": "https://x.com/AnjneyMidha/status/2124949153142936028", "created_at": "2026-11-23T19:32:12.000Z", "type": "tweet", "images": []}, {"author": "patrick_oshag", "summary": "Flags a thesis worth watching: AI makes the services TAM larger and improves the unit economics of delivering services, so services companies grow faster with better profitability and the multiple on every dollar of services earnings goes up; an amazing time to refound services companies.", "tweet_url": "https://x.com/patrick_oshag/status/2124977757721440304", "created_at": "2026-11-23T21:25:52.000Z", "type": "tweet", "images": []}, {"author": "paulg", "summary": "Asked how he judges founders' characters before helping them become powerful, the honest answer is he just asks Jessica (links his essay on her). She would not have penalized a social faux pas; many funded founders were awkward.", "tweet_url": "https://x.com/paulg/status/2124999626944299292", "created_at": "2026-11-23T22:52:46.000Z", "type": "thread", "images": []}, {"author": "PeterDiamandis", "summary": "The data says we are winning the war on cancer: five-year relative survival in the US reached 70% for the first time, up from 49% in the mid-1970s, and for cancers diagnosed after distant spread it doubled from 17% to 35%. Also notes Beth Israel's trial of Google's AMIE: when physicians read the AI's pre-visit chat transcript, they said it helped them prepare 75% of the time.", "tweet_url": "https://x.com/PeterDiamandis/status/2124926865831833786", "created_at": "2026-11-23T18:03:38.000Z", "type": "tweet", "images": []}, {"author": "DefiIgnas", "summary": "A post about crypto people liking London went viral on the London subreddit and the top comments are uniformly hostile (\"crypto-wanks,\" \"don't let the tech bros ruin everything\"). Crypto has a huge reputation problem, memecoin KOLs are not fixing it, but at least they still think we are rich. Fiskantes replied: London is very nice, just don't venture out of the green zones, and the same goes for crypto.", "tweet_url": "https://x.com/DefiIgnas/status/2125001542550028691", "created_at": "2026-11-23T23:00:23.000Z", "type": "thread", "images": ["https://pbs.twimg.com/media/HX2FooFbQAAGgjK.jpg", "https://pbs.twimg.com/media/HX2Fo0UbMAAHYRy.jpg", "https://pbs.twimg.com/media/HX2Fo9Qa8AEaxrJ.jpg", "https://pbs.twimg.com/media/HX2FpGObAAARsc6.jpg", "https://pbs.twimg.com/media/HX2GDBNXcAAs5oD.jpg"]}, {"author": "Zeneca", "summary": "On the question \"do you feel you wasted your time in crypto if after ~5 years your portfolio is under ~$500K\": understandable to feel that way, but perception is everything, and the skills and lessons learned should raise your odds in whatever domain comes next.", "tweet_url": "https://x.com/Zeneca/status/2125056746410717362", "created_at": "2026-11-24T02:39:44.000Z", "type": "tweet", "images": []}, {"author": "SoskaKyle", "summary": "Remembers November 2018 in his PhD office watching the BitMEX chart destroy his net worth while listening to Pompliano podcasts to stay the course; now sees Pomp down bad shilling Moomoo in promoted posts. Bitcoin is anything but the easy road.", "tweet_url": "https://x.com/SoskaKyle/status/2125085050727276556", "created_at": "2026-11-24T04:32:12.000Z", "type": "tweet", "images": []}, {"author": "hooeem", "summary": "Amplifies a long post from a friend who made more per year in web2 lead-gen than in crypto but has zero regrets: the old business was meaningless, crypto is a real technological advance with real stakes in a world where little feels consequential, and CT gave him friendships and an education in economics, finance and history he would never otherwise have had.", "tweet_url": "https://x.com/hooeem/status/2124987700763676869", "created_at": "2026-11-23T22:05:22.000Z", "type": "thread", "images": []}, {"author": "WazzCrypto", "summary": "After checking every hosting recommendation he got, all are worse or pricier than OVH, Hetzner and Contabo, and the only suitable OVH dedicated box is in Mumbai. His NUC is running an ETH archive node for his onchain intel tool; he looked at adding a drive for a second node and \"almost fainted\" at current disk prices.", "tweet_url": "https://x.com/WazzCrypto/status/2124953853879627927", "created_at": "2026-11-23T19:50:53.000Z", "type": "thread", "images": ["https://pbs.twimg.com/media/HX1Z2QfWgAA-eBS.png"]}, {"author": "0x_Kun", "summary": "If BTC jumped 35% in a day it would be called proof of a ponzi; when NVDA does it, it is \"fundamentals adjusting.\" The ability to hold contradictory stories for different assets is why there is always opportunity, and algos and AI only make people more entrenched.", "tweet_url": "https://x.com/0x_Kun/status/2125039390732984598", "created_at": "2026-11-24T01:30:46.000Z", "type": "thread", "images": []}, {"author": "0xQuit", "summary": "A Bored Ape sold for 8.636 ETH (\"gotta hurt to see this\"); as long as they are tradeable onchain there will be a way out. Separately: the FWAP Season 2 keeper is off, holders need to migrate NFTs from V2 to V3 to keep participating, which also claims earned ETH; many NFTs are still idle in V2.", "tweet_url": "https://x.com/0xQuit/status/2124952109586256234", "created_at": "2026-11-23T19:43:57.000Z", "type": "thread", "images": []}, {"author": "zeroxkyle", "summary": "Do not let Jensen's return distract from Solana DeFi protocols squabbling over who wash-trades their volume and who can provide liquidity on a market nobody uses.", "tweet_url": "https://x.com/zeroxkyle/status/2125051837036593209", "created_at": "2026-11-24T02:20:14.000Z", "type": "tweet", "images": []}, {"author": "Geiger_Capital", "summary": "On the viral Seattle airport ICE arrest of a visa overstayer: if he overstayed a 90-day tourist visa in Japan by a decade he would expect to be arrested and removed, screaming or not; the real problem is that people feel entitled enough to fly domestically while here illegally, and the outrage shows how soft Americans have become on basic enforcement.", "tweet_url": "https://x.com/Geiger_Capital/status/2125051254376132989", "created_at": "2026-11-24T02:17:55.000Z", "type": "tweet", "images": []}, {"author": "zriboua", "summary": "Uses a Sneako clip as an example of Third Worldism: the Taliban emerged from specific Afghan and regional circumstances, yet he cannot help tracing their rise back to the US as part of a grand global-south struggle.", "tweet_url": "https://x.com/zriboua/status/2124973418059587740", "created_at": "2026-11-23T21:08:37.000Z", "type": "tweet", "images": []}], "C_contrarian": [{"author": "Delphi_Digital", "summary": "Their SPY speculative-flow indicator fired a washout signal right before the rally: it fell to 20.5 on Friday, the lowest since March 2020, meaning the AI selloff had already drained speculative demand and set stocks up for a sharp rebound on the Jensen news. But positioning washouts have not always marked cycle bottoms: in 2022 the same indicator flagged bear-market rallies of 11% and 17% that fully reversed because Fed tightening never let up. Given the current risk-off macro regime, they think this is more likely a bear-market rally than the start of a sustained cyclical rebound.", "tweet_url": "https://x.com/Delphi_Digital/status/2124948600920895663", "created_at": "2026-11-23T19:30:00.000Z", "type": "tweet", "images": []}, {"author": "AndreasSteno", "summary": "Against the \"party on\" read: Jensen's return makes it less likely that the Fed pivots.", "tweet_url": "https://x.com/AndreasSteno/status/2124953376391651685", "created_at": "2026-11-23T19:48:59.000Z", "type": "tweet", "images": []}, {"author": "ZeeContrarian1", "summary": "The market fell 10% in a month and recovered almost half in a day; the lesson is that nobody knows anything. It fell because it fell and rose because it rose; TA, macro calls, narratives and valuation arguments are all mumbo jumbo, expensive stocks can stay expensive for years and a 10x P/E will not always save you. The one enduring truth: markets rise over time, so buy extreme fear intelligently and be patient, and the less you think you know the better his VIX-based formula works because you will interfere less. To critics he asks for five-year returns versus the index and points out that someone wins the lottery every week too.", "tweet_url": "https://x.com/ZeeContrarian1/status/2124950048345559352", "created_at": "2026-11-23T19:35:45.000Z", "type": "thread", "images": []}, {"author": "SoskaKyle", "summary": "Against the \"ETF inflows = new demand\" narrative: he thinks Bitcoin ETF inflows are largely people using the ETFs as cheap custody so they can write call options against their BTC, and would be surprised if more than 20% of inflows, especially early on, were genuinely new demand. Also posts his Nov 16 chart (\"an absolute ripper\").", "tweet_url": "https://x.com/SoskaKyle/status/2125101966166749665", "created_at": "2026-11-24T05:39:25.000Z", "type": "thread", "images": ["https://pbs.twimg.com/media/HX3g0HfWsAATFji.png"]}, {"author": "thedefivillain", "summary": "Against the Strategy defense: there is something wrong with deleveraging at the bottom after levering up at higher prices, since it is the exact opposite of what they should do, and it shows Saylor does not manage risk properly. They could have topped up the USD reserve and parked the rest in cash to hedge exactly this predictable situation of needing to move USD from reserve to cash.", "tweet_url": "https://x.com/thedefivillain/status/2124944720853954987", "created_at": "2026-11-23T19:14:35.000Z", "type": "tweet", "images": []}, {"author": "_tolks", "summary": "Against the idea that broad stock ownership makes the AI trade politically safe: dollar amounts and share-of-net-worth are wildly misrepresented, most people own a small amount or nothing, and the midterms showed how unpopular AI, data centers, grift and corruption are. People are fed up.", "tweet_url": "https://x.com/_tolks/status/2125016065411289566", "created_at": "2026-11-23T23:58:05.000Z", "type": "tweet", "images": []}, {"author": "dgt10011", "summary": "\"It's starting. Position yourself accordingly,\" amplifying the argument that the AI industry must end up either nationalized or decentralized because the greatest prisoner's dilemma in history will not be solved by private corporations with misaligned incentives, which otherwise lead to an irreversible oligonomy.", "tweet_url": "https://x.com/dgt10011/status/2124972881604136969", "created_at": "2026-11-23T21:06:29.000Z", "type": "tweet", "images": []}], "D_positioning": [{"author": "amitisinvesting", "summary": "Explains selling NVDA when Jensen left and buying back on his return. This was not a trade but a long-term investment whose thesis broke the moment the founder was gone, with the board giving zero sign of bringing him back; risk mitigation mattered more than diamond hands, even if it cost a few percent and invites mockery. The thesis came back when the board did what it should never have undone, and he feels the hedge-and-rebuy was the mature play given \"this president can do anything.\" He calls the board's conduct disgusting and says the worst part is it lied to shareholders, since folding this quickly means it intended to revisit reinstatement all along. Color from his conversations: many cannot believe Trump intervened, many are relieved their portfolios stopped bleeding, everyone is exhausted. Trump being on Jensen's side likely forecloses further major issues.", "tweet_url": "https://x.com/amitisinvesting/status/2125087515476439543", "created_at": "2026-11-24T04:42:00.000Z", "type": "thread", "images": []}, {"author": "lord_fed", "summary": "His view: no regime shift, just a clearing event. Bought on Friday via ES futures and an SPX December 6800/7400 risk reversal, and publishes 13 names he is watching (link). Not bought at the lows, he notes.", "tweet_url": "https://x.com/lord_fed/status/2124932007675207859", "created_at": "2026-11-23T18:24:04.000Z", "type": "thread", "images": []}, {"author": "saxena_puru", "summary": "\"The indicator has fired, buckle up\" on NDX/QQQ; the same signal triggered massive multi-week rallies even duri // ---------- helpers ----------
const CAT_VARS = {
  macro: 'var(--cat-macro)',
  crypto: 'var(--cat-crypto)',
  energy: 'var(--cat-energy)',
  tech: 'var(--cat-tech)',
  ai: 'var(--cat-ai)',
  'ai/infra': 'var(--cat-ai)',
  geopolitics: 'var(--cat-geopolitics)',
  positioning: 'var(--cat-positioning)',
  regulation: 'var(--cat-regulation)',
  society: 'var(--cat-society)',
  em: 'var(--cat-em)',
};
function catColor(cat) {
  if (!cat) return 'var(--cat-default)';
  return CAT_VARS[String(cat).toLowerCase()] || 'var(--cat-default)';
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function escapeAttr(s) {
  return escapeHtml(s).replace(/`/g, '&#96;');
}

function renderBold(text) {
  return escapeHtml(text).replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
}

function relativeTime(iso) {
  if (!iso) return '';
  const dt = new Date(iso);
  if (isNaN(dt.getTime())) return '';
  const secs = Math.max(0, (Date.now() - dt.getTime()) / 1000);
  if (secs < 60)   return Math.floor(secs) + 's ago';
  const mins = secs / 60;
  if (mins < 60)   return Math.floor(mins) + 'm ago';
  const hrs  = mins / 60;
  if (hrs < 48)    return Math.floor(hrs) + 'h ago';
  return Math.floor(hrs / 24) + 'd ago';
}

function pill(cat) {
  if (!cat) return '';
  return `<span class="pill" style="background:${catColor(cat)}">${escapeHtml(cat)}</span>`;
}

function authorTag(name, cls = 'item-author') {
  if (!name) return '';
  return `<span class="${cls}" onclick="filterAuthor('${escapeAttr(name)}')">@${escapeHtml(name)}</span>`;
}

// ---------- rendering ----------
function renderThumbs(images) {
  if (!images || !images.length) return '';
  return `<div class="thumbs">` + images.map(u =>
    `<img src="${escapeAttr(u)}" class="thumb" loading="lazy" alt="" onclick="openLightbox('${escapeAttr(u)}')">`
  ).join('') + `</div>`;
}

function renderItem(item) {
  const author = item.author || item.author_username || '';
  const time = relativeTime(item.created_at);
  const thread = item.is_thread ? '<span class="item-thread">thread</span>' : '';
  const link = item.tweet_url
    ? `<a class="item-link" href="${escapeAttr(item.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  return `
    <div class="item-card filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${pill(item.category)}
        ${authorTag(author)}
        ${thread}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      <div class="item-text">${escapeHtml(item.text || '')}</div>
      ${renderThumbs(item.images)}
    </div>`;
}

function renderClusterItem(it) {
  const author = it.author || it.author_username || '';
  const time = relativeTime(it.created_at);
  const link = it.tweet_url
    ? `<a class="item-link" href="${escapeAttr(it.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  return `
    <div class="cluster-item filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${authorTag(author)}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      <div class="item-text">${escapeHtml(it.text || '')}</div>
      ${renderThumbs(it.images)}
    </div>`;
}

function renderCluster(cluster) {
  const itemsHtml = (cluster.items || []).map(renderClusterItem).join('');
  return `
    <div class="cluster">
      <div class="cluster-head">
        ${pill(cluster.category)}
        <div class="cluster-title">${escapeHtml(cluster.title || '')}</div>
      </div>
      ${cluster.description ? `<div class="cluster-desc">${escapeHtml(cluster.description)}</div>` : ''}
      ${itemsHtml ? `<div class="cluster-items">${itemsHtml}</div>` : ''}
    </div>`;
}

function renderLink(l) {
  const author = l.author || l.author_username || '';
  const url = l.url || (l.resolved || l.tco) || '';
  return `
    <div class="link-row filterable" data-author="${escapeAttr(author).toLowerCase()}">
      ${author
        ? authorTag(author, 'link-author')
        : '<span class="link-author">—</span>'}
      <a class="link-url" href="${escapeAttr(url)}" target="_blank" rel="noopener">${escapeHtml(url)}</a>
      ${l.description ? `<span class="link-desc">${escapeHtml(l.description)}</span>` : ''}
    </div>`;
}

function renderSection(letter, name, items, type) {
  if (!items || !items.length) return '';
  let body;
  if (type === 'events') {
    body = items.map(renderCluster).join('');
  } else if (type === 'links') {
    body = items.map(renderLink).join('');
  } else {
    body = items.map(renderItem).join('');
  }
  const cls = type === 'contrarian' ? 'section section-contrarian' : 'section';
  return `
    <div class="${cls}">
      <div class="section-head" onclick="toggleSection(this)">
        <span class="section-letter">${letter}.</span>
        <span class="section-name">${escapeHtml(name)}</span>
        <span class="section-count">${items.length}</span>
        <span class="section-arrow">▸</span>
      </div>
      <div class="section-body">${body}</div>
    </div>`;
}

function renderSummary(text) {
  if (!text) return '';
  const paragraphs = String(text).split(/\n\n+/).filter(Boolean)
    .map(p => `<p>${renderBold(p)}</p>`).join('');
  return `<div class="summary">${paragraphs}</div>`;
}

function renderStats(d) {
  const s = (d && d.stats) || d || {};
  const parts = [];
  if (s.received    != null) parts.push(`received <strong>${s.received}</strong>`);
  if (s.after_filter!= null) parts.push(`after filter <strong>${s.after_filter}</strong>`);
  if (s.authors     != null) parts.push(`authors <strong>${s.authors}</strong>`);
  if (s.coverage    != null) {
    const pct = (s.coverage <= 1 ? s.coverage * 100 : s.coverage);
    parts.push(`coverage <strong>${pct.toFixed(0)}%</strong>`);
  }
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSection(headEl) {
  headEl.parentElement.classList.toggle('open');
}

function openLightbox(src) {
  const img = document.getElementById('lightbox-img');
  img.src = src;
  document.getElementById('lightbox').classList.add('open');
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-img').src = '';
}

let activeFilter = null;
function filterAuthor(name) {
  if (!name) return;
  activeFilter = String(name).toLowerCase();
  document.querySelectorAll('.filterable').forEach(el => {
    const a = (el.dataset.author || '').toLowerCase();
    if (a === activeFilter) {
      el.classList.add('match');
      el.classList.remove('dim');
    } else {
      el.classList.add('dim');
      el.classList.remove('match');
    }
  });
  document.getElementById('filter-name').textContent = '@' + name;
  document.getElementById('filter-bar').classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function clearFilter() {
  activeFilter = null;
  document.querySelectorAll('.filterable').forEach(el => {
    el.classList.remove('match');
    el.classList.remove('dim');
  });
  document.getElementById('filter-bar').classList.remove('active');
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (document.getElementById('lightbox').classList.contains('open')) {
      closeLightbox();
    } else if (activeFilter) {
      clearFilter();
    }
  }
});

// ---------- schema normalization ----------
// Some producer runs emit the "sections" schema documented in the routine
// spec (report_type/input_stats/sections.A_events.../coverage) instead of
// the flat schema this renderer reads (date/events/insights/contrarian/
// positioning/links/stats). Normalize so either shape renders correctly.
function firstOf(v) {
  return Array.isArray(v) ? v[0] : v;
}

function normalizeItem(it) {
  if (!it || typeof it !== 'object') return it;
  return {
    author: it.author || it.author_username,
    text: it.text != null ? it.text : it.summary,
    category: firstOf(it.category),
    tweet_url: firstOf(it.tweet_url),
    images: it.images,
    created_at: it.created_at,
    is_thread: it.is_thread != null ? it.is_thread : (it.type === 'thread'),
  };
}

function normalizeData(d) {
  if (!d || typeof d !== 'object') return {};
  const hasFlat = d.events || d.insights || d.contrarian || d.positioning || d.links || d.stats;
  if (hasFlat) return d;

  const s = d.sections;
  if (!s) return d;

  const out = Object.assign({}, d);
  out.date = d.date || (d.collected_at ? String(d.collected_at).replace('T', ' ').replace('Z', ' UTC') : '');
  if (s.A_events) {
    out.events = s.A_events.map(cl => ({
      title: cl.cluster || cl.title,
      category: firstOf(cl.category),
      description: cl.description,
      items: (cl.items || []).map(normalizeItem),
    }));
  }
  if (s.B_insights) out.insights = s.B_insights.map(normalizeItem);
  if (s.C_contrarian) out.contrarian = s.C_contrarian.map(normalizeItem);
  if (s.D_positioning) out.positioning = s.D_positioning.map(normalizeItem);
  if (s.E_links) {
    out.links = s.E_links.map(l => ({
      author: l.author,
      url: l.url,
      tweet_url: firstOf(l.tweet_url),
      description: l.note || l.description,
    }));
  }
  const stats = d.stats || {};
  out.stats = {
    received: stats.received != null ? stats.received : (d.input_stats && d.input_stats.total_tweets),
    after_filter: stats.after_filter != null ? stats.after_filter : (d.input_stats && d.input_stats.after_noise_filter),
    authors: stats.authors != null ? stats.authors : (d.coverage && d.coverage.authors_total),
    coverage: stats.coverage != null ? stats.coverage : (d.coverage && d.coverage.coverage_pct),
  };
  return out;
}

// ---------- main ----------
function renderReport(d) {
  d = normalizeData(d);
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  const sections = [
    renderSummary(d.summary),
    renderSection('A', 'Events & Reactions',      d.events,                                'events'),
    renderSection('B', 'Alpha & Insights',        d.insights || d.alpha,                   'items'),
    renderSection('C', 'Contrarian Views',        d.contrarian,                            'contrarian'),
    renderSection('D', 'Positioning & Trade Ideas', d.positioning,                         'items'),
    renderSection('E', 'Link Queue',              d.links,                                 'links'),
  ].join('');
  const app = document.getElementById('app');
  app.innerHTML = sections || '<div class="empty">No report data.</div>';

  // Auto-open first two sections.
  document.querySelectorAll('.section').forEach((s, i) => {
    if (i < 2) s.classList.add('open');
  });

  document.getElementById('stats').innerHTML = renderStats(d);
}

renderReport(REPORT_DATA);
</script>
