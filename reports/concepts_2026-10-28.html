* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; line-height: 1.55;

low for iterative machine learning, and Spark's in-memory reuse of data while keeping fault tolerance made such workloads up to ten times faster.", "speaker": "Ben Horowitz, Michael McGuiness", "type": "causal", "entities": ["Hadoop", "Spark", "Matei Zaharia"], "conviction": "high", "so_what": "Origin story shows how an architectural bottleneck fix created a company; look for analogous bottlenecks in agent workloads.", "quote": null, "locator": "Hadoop's critical flaw", "quote_verified": false}, {"claim": "Spark was open source and free, so Databricks had to create value (easier, faster, more secure, enterprise-ready) faster than the free alternative could catch up; agents lowering switching costs will subject more companies to the same test.", "speaker": "Ben Horowitz, Michael McGuiness", "type": "causal", "entities": ["Databricks", "Spark"], "conviction": "medium", "so_what": "Open-source-plus-managed-service economics and agent-lowered switching costs pressure software pricing power broadly.", "quote": null, "locator": "Databricks built this muscle early on", "quote_verified": false}, {"claim": "Table-layer projects (Delta Lake, Hudi, Iceberg), developed independently by Databricks, Uber and Netflix, gave data lakes warehouse-like guarantees, which made the lakehouse merging lake and warehouse possible.", "speaker": "Ben Horowitz, Michael McGuiness", "type": "causal", "entities": ["Delta Lake", "Hudi", "Iceberg", "Uber", "Netflix"], "conviction": "high", "so_what": "Open table formats are the enabling layer for unified data architecture; relevant to warehouse incumbents and format competition.", "quote": null, "locator": "in the late 2010s", "quote_verified": false}, {"claim": "Lakebase applies the lakehouse idea to operational databases by separating storage from compute, so changes to transactional data are instantly available to analytics and agents without fragile pipelines; Databricks calls this unification LTAP.", "speaker": "Ben Horowitz, Michael McGuiness", "type": "framework", "entities": ["Lakebase", "LTAP", "Neon", "Postgres"], "conviction": "high", "so_what": "Collapsing the OLTP/OLAP divide threatens ETL/pipeline vendors and standalone operational database players.", "quote": null, "locator": "Lakebase", "quote_verified": false}, {"claim": "Because Lakebase copies only changes, even petabyte-scale databases can be duplicated in seconds, letting an agent branch a database, experiment, and discard it; Databricks says it did not fully appreciate this agent use case until recently.", "speaker": "Ben Horowitz, Michael McGuiness", "type": "causal", "entities": ["Lakebase", "agents"], "conviction": "medium", "so_what": "Database branching like code is a native agent primitive that could shape database purchasing criteria.", "quote": null, "locator": "This separation makes the database behave more like code", "quote_verified": false}, {"claim": "Databricks acquired Neon in 2025, a serverless Postgres company whose databases were already created mostly by AI agents, to form Lakebase.", "speaker": "Ben Horowitz, Michael McGuiness", "type": "data_point", "entities": ["Neon", "Databricks", "Postgres"], "conviction": "high", "so_what": "M&A signal: agent-generated database creation is already a real workload worth buying.", "quote": null, "locator": "Lakebase", "quote_verified": false}, {"claim": "The shift is from a few databases managed by a central team and read by thousands of employees to thousands of databases that millions of agents read and write.", "speaker": "Ben Horowitz, Michael McGuiness", "type": "prediction", "entities": ["agents", "databases"], "conviction": "medium", "so_what": "Database count and write volume scale with agents, a demand driver for serverless, cheap-storage architectures.", "quote": null, "locator": "This technological unlock has come just in time", "quote_verified": false}]}, {"theme": "Agent capability and the context problem", "insights": [{"claim": "Databricks CEO Ali Ghodsi asserts AGI is already here, citing frontier models solving more than half of Humanity's Last Exam's 2,500 expert-written questions.", "speaker": "Ben Horowitz, Michael McGuiness", "type": "thesis", "entities": ["Ali Ghodsi", "Humanity's Last Exam"], "conviction": "medium", "so_what": "A vendor CEO's framing; note the claim supports selling agent infrastructure, so discount for incentive.", "quote": "We believe AGI is already here", "locator": "A System of Record for Agents", "quote_verified": true}, {"claim": "METR data shows the length of task an agent can finish on its own has doubled roughly every seven months since 2019, and if it holds through the early 2030s agents could do tasks that take a human years.", "speaker": "Ben Horowitz, Michael McGuiness", "type": "prediction", "entities": ["METR", "agents"], "conviction": "medium", "so_what": "An exponential task-horizon trend underpins bullish agent-adoption timelines; monitor whether it keeps holding.", "quote": null, "locator": "Researchers at METR", "quote_verified": false}, {"claim": "Since ChatGPT's 2022 launch, agent coding capability has moved from tasks taking a person about thirty seconds to tasks taking a skilled engineer a full work day.", "speaker": "Ben Horowitz, Michael McGuiness", "type": "data_point", "entities": ["ChatGPT", "agents"], "conviction": "high", "so_what": "Concrete measure of capability gain relevant to engineering labor demand.", "quote": null, "locator": "When ChatGPT came out in 2022", "quote_verified": false}, {"claim": "The bottleneck for enterprise agents is context, not intelligence: most companies still do not trust AI to reliably update records in Salesforce.", "speaker": "Ben Horowitz, Michael McGuiness", "type": "thesis", "entities": ["Ali Ghodsi", "Salesforce"], "conviction": "high", "so_what": "Value accrues to whoever supplies governed company context and permissions, not only to model makers.", "quote": "AI does not have an intelligence problem", "locator": "A System of Record for Agents", "quote_verified": true}, {"claim": "A company's ontology (what exists, how it relates, what words mean, which source governs) is never finished and largely lives in experienced employees' heads, so agents can act autonomously only if ontology, authority and evaluation move into a system of record.", "speaker": "Ben Horowitz, Michael McGuiness", "type": "framework", "entities": ["ontology", "system of record", "Databricks"], "conviction": "high", "so_what": "Frames a new enterprise software category, the system of record for agents, with Databricks contesting it against Palantir and SaaS vendors.", "quote": null, "locator": "Every company has an ontology", "quote_verified": false}, {"claim": "Databricks' Genie Ontology and its OntoRank algorithm (weighing author, usage breadth and recency) raised agent answer accuracy from about 50% to 84.5% when grounding agents in the company's ontology.", "speaker": "Ben Horowitz, Michael McGuiness", "type": "data_point", "entities": ["Genie Ontology", "OntoRank", "Databricks"], "conviction": "medium", "so_what": "Vendor-reported evidence that grounding is the main lever for enterprise agent reliability.", "quote": null, "locator": "What does it mean?", "quote_verified": false}, {"claim": "Agent identity and access must change because per-employee logins break when employees spin up hundreds of agents a day; Unity Gateway gives each model and agent an identity, budget, guardrails and action traces.", "speaker": "Ben Horowitz, Michael McGuiness", "type": "causal", "entities": ["Unity Gateway", "Databricks", "agents"], "conviction": "medium", "so_what": "Agent governance, identity and cost control is an emerging security/software spend category.", "quote": "You can’t grant access to each proprietary, siloed database to your agents", "locator": "What is allowed?", "quote_verified": true}, {"claim": "Every enterprise platform shift produced a new fight over the system of record (IBM mainframe; Oracle and SAP client-server;
