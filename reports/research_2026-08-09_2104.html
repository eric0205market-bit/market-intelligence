const META = {
  date: "2026-08-09",
  time: "21:04 CEST",
  windowStart: "2026-08-09 15:04 CEST",
  windowEnd: "2026-08-09 21:04 CEST",
  emailsInWindow: 24,
  emailsRead: 11,
  itemsExtracted: 17,
  includedSources: [
    {name:"Noahpinion (guest: Institute for Progress)", count:1},
    {name:"The Dark Side of the Boom (Slok)", count:1},
    {name:"The Bubble Bubble", count:1},
    {name:"NLP News (Elvis Saravia) — Top AI Papers", count:3},
    {name:"McKinsey & Company", count:1},
    {name:"IT Tech PL — On-chain Insights", count:3},
    {name:"Tavi Costa", count:1},
    {name:"Capital Wars", count:1},
    {name:"Chamath Palihapitiya", count:3},
    {name:"PaperAlfa", count:2}
  ],
  skippedSources: [
    {name:"Macro Mornings (\u201cMacro Asset Dashboard & Model Portfolio Allocation\u201d)", reason:"Body is pure promotion for the paid newsletter \u2014 demo link, TrustPilot testimonials, subscriber disclosure. No dashboard data or analysis actually included in the email itself."},
    {name:"GitHub notifications (13 messages, 14:48\u201316:08 CEST)", reason:"Automated CI/CD failure and pages-deploy notifications from this repository\u2019s own workflows \u2014 no analytical content, per the automated-notification skip rule."}
  ]
};

const CATCOLORS = {
  macro:"var(--macro)", credit:"var(--credit)", positioning:"var(--positioning)", aiinfra:"var(--aiinfra)",
  crypto:"var(--crypto)", geopolitics:"var(--geopolitics)", energy:"var(--energy)", tech:"var(--tech)",
  gold:"var(--gold)", culture:"var(--culture)", labor:"var(--labor)", regulation:"var(--regulation)",
  science:"var(--science)", venture:"var(--venture)"
};
const CATLABEL = {
  macro:"macro", credit:"credit", positioning:"positioning", aiinfra:"AI/infra", crypto:"crypto",
  geopolitics:"geopolitics", energy:"energy", tech:"tech", gold:"gold", culture:"culture",
  labor:"labor", regulation:"regulation", science:"science", venture:"venture"
};
const URGLABEL = { act:"🔴 Act Now", deep:"🔵 Deep", watch:"🟡 Watch" };
const URGEMOJI = { act:"🔴", deep:"🔵", watch:"🟡" };

let activeCat = "all";
let activeUrg = "all";
let activeSrc = null;

function countBy(list, keyFn){
  const m = {};
  list.forEach(it => { const k = keyFn(it); m[k] = (m[k]||0)+1; });
  return m;
}

function buildFilters(){
  const catCounts = countBy(ITEMS, it => it.cat);
  const catRow = document.getElementById('catRow');
  const allCatPill = document.createElement('button');
  allCatPill.className = 'pill active';
  allCatPill.textContent = `All (${ITEMS.length})`;
  allCatPill.onclick = () => { activeCat='all'; activeSrc=null; render(); };
  catRow.appendChild(allCatPill);
  Object.keys(CATLABEL).forEach(cat => {
    if(!catCounts[cat]) return;
    const b = document.createElement('button');
    b.className = 'pill';
    b.dataset.cat = cat;
    b.textContent = `${CATLABEL[cat]} (${catCounts[cat]})`;
    b.onclick = () => { activeCat = cat; activeSrc=null; render(); };
    catRow.appendChild(b);
  });

  const urgCounts = countBy(ITEMS, it => it.urgency);
  const urgRow = document.getElementById('urgRow');
  const allUrgPill = document.createElement('button');
  allUrgPill.className = 'pill active';
  allUrgPill.textContent = `All (${ITEMS.length})`;
  allUrgPill.onclick = () => { activeUrg='all'; activeSrc=null; render(); };
  urgRow.appendChild(allUrgPill);
  ['act','deep','watch'].forEach(u => {
    if(!urgCounts[u]) return;
    const b = document.createElement('button');
    b.className = 'pill';
    b.dataset.urg = u;
    b.textContent = `${URGLABEL[u]} (${urgCounts[u]})`;
    b.onclick = () => { activeUrg = u; activeSrc=null; render(); };
    urgRow.appendChild(b);
  });
}

function updatePillStates(){
  document.querySelectorAll('#catRow .pill').forEach(p => {
    const cat = p.dataset.cat;
    const isAll = !cat;
    const active = isAll ? activeCat==='all' : activeCat===cat;
    p.classList.toggle('active', active);
    p.style.background = active ? (cat ? CATCOLORS[cat] : '#333') : 'transparent';
    p.style.color = active ? '#fff' : 'var(--text-dim)';
  });
  document.querySelectorAll('#urgRow .pill').forEach(p => {
    const u = p.dataset.urg;
    const isAll = !u;
    const active = isAll ? activeUrg==='all' : activeUrg===u;
    p.classList.toggle('active', active);
    p.style.background = active ? '#333' : 'transparent';
    p.style.color = active ? '#fff' : 'var(--text-dim)';
  });
}

function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}

function toggleCard(id){
  const el = document.getElementById('card-'+id);
  el.classList.toggle('open');
}

function filterBySrc(name){
  activeSrc = name;
  activeCat = 'all';
  activeUrg = 'all';
  render();
  document.querySelectorAll('.card').forEach(c => {
    if(!c.classList.contains('hidden')) c.classList.add('open');
  });
}

function render(){
  updatePillStates();
  const wrap = document.getElementById('cardsWrap');
  wrap.innerHTML = '';
  ITEMS.forEach((item, idx) => {
    const matchCat = activeCat==='all' || item.cat===activeCat;
    const matchUrg = activeUrg==='all' || item.urgency===activeUrg;
    const matchSrc = !activeSrc || item.source.indexOf(activeSrc) !== -1;
    const visible = matchCat && matchUrg && matchSrc;

    const card = document.createElement('div');
    card.className = 'card' + (visible ? '' : ' hidden');
    card.id = 'card-'+item.id;

    const chartIcon = item.charts.hot ? '🔥' : (item.charts.count>0 ? '📊' : '');

    const header = document.createElement('div');
    header.className = 'card-header';
    header.onclick = () => toggleCard(item.id);
    header.innerHTML = `
      <span class="idx">${String(idx+1).padStart(2,'0')}</span>
      <span>${URGEMOJI[item.urgency]}</span>
      <span class="badge" style="background:${CATCOLORS[item.cat]}">${item.source}</span>
      <span class="cattag">${CATLABEL[item.cat]}</span>
      <span class="chartmark">${chartIcon}</span>
      <span class="htitle">${item.title}</span>
    `;

    const body = document.createElement('div');
    body.className = 'card-body';
    const chartClass = item.charts.hot ? 'chart-box hot' : 'chart-box';
    const chartLabel = item.charts.hot ? '🔥 CHART WORTH SAVING — ' : (item.charts.count>0 ? '📊 ' : '📈 ');
    body.innerHTML = `
      <div class="section-label">The Idea</div>
      <div class="idea-text">${item.idea}</div>
      <div class="section-label">My Angle</div>
      <div class="angle-box" style="border-left-color:${CATCOLORS[item.cat]}">${item.angle}</div>
      <div class="tweets">
        <div class="tweet a">
          <div class="tweet-label">TWEET A</div>
          <div class="tweet-text">${item.tweetA}</div>
          <button class="copy-btn" onclick="copyTweet(${item.id},'a')">📋 Copy</button>
        </div>
        <div class="tweet b">
          <div class="tweet-label">TWEET B</div>
          <div class="tweet-text">${item.tweetB}</div>
          <button class="copy-btn" onclick="copyTweet(${item.id},'b')">📋 Copy</button>
        </div>
      </div>
      <div class="${chartClass}">${chartLabel}${item.charts.desc}</div>
      <div class="linkrow"><a href="${item.link}" target="_blank" rel="noopener">↗ Read full article</a></div>
    `;

    card.appendChild(header);
    card.appendChild(body);
    wrap.appendChild(card);
  });
}

function buildReport(){
  document.getElementById('metaLine').textContent =
    `${META.date} · ${META.time} · ${META.itemsExtracted} items from ${META.emailsRead} emails`;

  const rb = document.getElementById('reportBody');
  let html = `<h4>Time Window</h4><div>${META.windowStart} → ${META.windowEnd} (hard 6-hour boundary). Emails outside this window were not processed.</div>`;
  html += `<h4>Coverage</h4><div>${META.emailsRead} of ${META.emailsInWindow} emails in window read in full. ${META.itemsExtracted} items extracted.</div>`;
  html += `<h4>Included Sources</h4>`;
  META.includedSources.forEach(s => {
    html += `<div><span class="srcname" onclick="filterBySrc('${s.name.replace(/'/g,"\\'")}')">${s.name}</span> — ${s.count} item${s.count>1?'s':''}</div>`;
  });
  html += `<h4>Skipped</h4>`;
  if(META.skippedSources.length === 0){
    html += `<div>None — every email in the window contained substantive analytical content.</div>`;
  } else {
    META.skippedSources.forEach(s => {
      html += `<div>${s.name} — ${s.reason}</div>`;
    });
  }
  rb.innerHTML = html;
}

buildFilters();
buildReport();
render();
</script>
</body>
</html>
