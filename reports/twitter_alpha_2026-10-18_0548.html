<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root {
  --bg: #faf8f5;
  --surface: #ffffff;
  --border: #e8e3da;
  --border-light: #f0ede4;
  --text: #1a1a1a;
  --text-2: #555;
  --text-3: #8a8a8a;
  --accent: #1a8cd8;
  --red: #d94052;
  --yellow: #fff5b3;
  --yellow-border: #f0d966;

  /* category colors (per spec) */
  --cat-macro: #2563eb;        /* blue */
  --cat-crypto: #8b5cf6;       /* purple */
  --cat-energy: #dc2626;       /* red */
  --cat-tech: #0d9488;         /* teal */
  --cat-ai: #4f46e5;           /* indigo */
  --cat-geopolitics: #dc2626;  /* red */
  --cat-positioning: #15803d;  /* green */
  --cat-regulation: #7c3aed;   /* purple */
  --cat-society: #d97706;      /* amber */
  --cat-em: #059669;           /* green */
  --cat-default: #6b7280;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; line-height: 1.55;
       background: var(--bg); color: var(--text); }
.container { max-width: 960px; margin: 0 auto; padding: 24px 16px 80px; }

/* HEADER */
.header { display: flex; justify-content: space-between; align-items: baseline;
          border-bottom: 2px solid var(--text); padding-bottom: 12px; margin-bottom: 20px; }
.title { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
.subtitle { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-3); }

/* FILTER BAR */
.filter-bar { display: none; background: var(--yellow); border: 1px solid var(--yellow-border);
              border-radius: 6px; padding: 8px 12px; margin-bottom: 16px;
              align-items: center; gap: 10px; font-size: 13px; }
.filter-bar.active { display: flex; }
.filter-bar button { font-family: inherit; font-size: 12px; background: transparent;
                     border: 1px solid var(--text); padding: 3px 10px; border-radius: 4px;
                     cursor: pointer; }
.filter-bar button:hover { background: rgba(0,0,0,0.05); }

/* SUMMARY */
.summary { background: var(--surface); border: 1px solid var(--border);
           border-left: 4px solid var(--red); border-radius: 6px;
           padding: 16px 18px; margin-bottom: 20px; }
.summary p { margin-bottom: 8px; }
.summary p:last-child { margin-bottom: 0; }
.summary strong { font-weight: 600; }

/* SECTIONS */
.section { background: var(--surface); border: 1px solid var(--border);
           border-radius: 6px; margin-bottom: 14px; overflow: hidden; }
.section-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px;
                background: #f3efe6; cursor: pointer; user-select: none;
                font-weight: 600; font-size: 13px; }
.section-head:hover { background: #ebe6dc; }
.section-letter { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
                  color: var(--text-3); min-width: 18px; }
.section-name { flex: 1; }
.section-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
                 color: var(--text-3); }
.section-arrow { font-size: 10px; color: var(--text-3); transition: transform .2s; }
.section.open .section-arrow { transform: rotate(90deg); }
.section-body { display: none; padding: 6px 0; }
.section.open .section-body { display: block; }

/* CLUSTER (Section A) */
.cluster { padding: 14px 16px; border-bottom: 1px solid var(--border-light); }
.cluster:last-child { border-bottom: none; }
.cluster-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
                flex-wrap: wrap; }
.cluster-title { font-weight: 600; font-size: 14px; }
.cluster-desc { color: var(--text-2); font-size: 13px; margin: 0 0 10px 0; }
.cluster-items { display: flex; flex-direction: column; gap: 8px; padding-left: 10px;
                 border-left: 2px solid var(--border-light); }
.cluster-item { font-size: 13px; padding: 6px 8px; border-radius: 4px; }
.cluster-item .item-text { font-size: 13px; margin-top: 4px; }
.cluster-item .item-head { font-size: 12px; }

/* ITEM CARDS (Sections B/C/D) */
.item-card { background: var(--surface); border: 1px solid var(--border);
             border-radius: 6px; padding: 12px 14px; margin: 10px 16px; }
.item-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
             flex-wrap: wrap; }
.item-author { font-weight: 600; color: var(--accent); cursor: pointer; }
.item-author:hover { text-decoration: underline; }
.item-time { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--text-3); }
.item-link { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--accent); text-decoration: none; }
.item-link:hover { text-decoration: underline; }
.item-text { font-size: 13.5px; line-height: 1.6; color: var(--text);
             white-space: pre-wrap; word-wrap: break-word; }
.item-thread { display: inline-block; font-size: 10px; font-weight: 600;
               background: var(--border); color: var(--text-2); padding: 1px 6px;
               border-radius: 3px; text-transform: uppercase; letter-spacing: .04em; }

/* CONTRARIAN (Section C) — red left border + soft red bg */
.section-contrarian .item-card {
  border-left: 4px solid var(--red);
  background: #fdf6f7;
}

/* CATEGORY PILLS */
.pill { display: inline-block; font-family: 'IBM Plex Mono', monospace; font-size: 10px;
        font-weight: 500; padding: 2px 7px; border-radius: 3px; color: #fff;
        text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }

/* IMAGES */
.thumbs { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.thumb { height: 100px; border: 1px solid var(--border); border-radius: 4px;
         cursor: zoom-in; background: #f0ede4; }

/* LIGHTBOX */
.lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85);
            align-items: center; justify-content: center; z-index: 100; cursor: zoom-out; }
.lightbox.open { display: flex; }
.lightbox img { max-width: 92vw; max-height: 92vh;
                box-shadow: 0 8px 40px rgba(0,0,0,.6); }

/* LINKS (Section E) */
.link-row { padding: 8px 16px; border-bottom: 1px solid var(--border-light);
            font-size: 13px; display: flex; gap: 12px; align-items: baseline; }
.link-row:last-child { border-bottom: none; }
.link-author { color: var(--text-3); min-width: 110px; cursor: pointer; }
.link-author:hover { color: var(--accent); }
.link-url { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
            color: var(--accent); text-decoration: none; word-break: break-all; flex: 1; }
.link-url:hover { text-decoration: underline; }
.link-desc { color: var(--text-2); font-size: 12px; }

/* AUTHOR FILTER STATES */
.filterable.match { background: var(--yellow); border-color: var(--yellow-border); }
.section-contrarian .item-card.filterable.match { background: var(--yellow); }
.filterable.dim { opacity: 0.25; }

/* STATS BAR */
.stats { margin-top: 24px; padding: 10px 14px; background: var(--surface);
         border: 1px solid var(--border); border-radius: 6px;
         font-family: 'IBM Plex Mono', monospace; font-size: 11.5px;
         color: var(--text-2); display: flex; gap: 18px; flex-wrap: wrap; }
.stats strong { color: var(--text); font-weight: 600; }

/* EMPTY */
.empty { color: var(--text-3); font-size: 13px; padding: 14px 18px; font-style: italic; }

/* RESPONSIVE */
@media (max-width: 640px) {
  .container { padding: 16px 12px 60px; }
  .item-card { margin: 8px 10px; }
  .link-row { flex-direction: column; gap: 4px; }
  .link-author { min-width: 0; }
  .header { flex-direction: column; align-items: flex-start; gap: 4px; }
}
</style>

6250923207", "images": ["https://pbs.twimg.com/media/HU3noTaWQAA9-bj.jpg"], "type": "thread", "category": ["crypto"]}, {"author": "mfigge", "summary": "Mudwater is Yuga's first Solana collection; trading fees include a 2.5% $APE reflection matched 50/50 with holders. Glyph wallet will get a Solana address and a tokengated 'Nexus & Chill' is planned for Thursday.", "tweet_url": "https://x.com/mfigge/status/2111601972629372975", "images": [], "type": "thread", "category": ["crypto"]}, {"author": "0xQuit", "summary": "Support follow-ups: OpenSea will not show the totem (it sits in the ape's 6551 account), claims need ETH for gas while the rip happens on Solana, holders have 90 days, and a 'Shadow Delegate' toggle on delegate.xyz moves claim rights. Ripping is now enabled on the Mudwater site.", "tweet_url": "https://x.com/0xQuit/status/2111620444000227839", "images": ["https://pbs.twimg.com/media/HU3-uDkXAAERZjO.jpg"], "type": "thread", "category": ["crypto"]}]}, {"cluster": "Agents Meet Finance — Coinbase AI Push, Amazon Blocking Agents", "category": ["AI", "crypto", "tech"], "items": [{"author": "brian_armstrong", "summary": "Coinbase is working to become the 'most AI-enabled financial account'. Replying to a demo, he says to make real trades you can paste 'Connect to coinbase.com/skill.md' into Claude.", "tweet_url": "https://x.com/brian_armstrong/status/2111595678015099053", "images": [], "type": "tweet", "category": ["AI", "crypto"]}, {"author": "nicbstme", "summary": "'Amazon blocking agents is not customer centric.' (Image attached; the linked content is not available in the data.)", "tweet_url": "https://x.com/nicbstme/status/2111603550677868773", "images": ["https://pbs.twimg.com/media/HU3sPOpasAABrx_.jpg"], "type": "tweet", "category": ["AI", "tech"]}, {"author": "nicbstme", "summary": "Says he misses Sora — the personal memes shared with friends were 'so good' (the product appears to be gone).", "tweet_url": "https://x.com/nicbstme/status/2111590594556629268", "images": [], "type": "tweet", "category": ["AI", "tech"]}]}, {"cluster": "Anthropic Under the Microscope — Security, Hiring, Distillation Claims", "category": ["AI", "tech"], "items": [{"author": "theallinpod", "summary": "a16z's Ben Horowitz on the All-In podcast: Anthropic is 'one of the most negligent companies we've seen in terms of security'. His story: with Opus 4.5 they had one agent build a pet-store site and another probe it; the second found a SQL injection, then, asked if it was exploitable, broke in and stole customer data. Anthropic's reply was 'you prompted it wrong'.", "tweet_url": "https://x.com/theallinpod/status/2111551443693883739", "images": [], "type": "tweet", "category": ["AI"]}, {"author": "cryptopunk7213", "summary": "Reacts to a report that Anthropic is on track to stop hiring technical juniors by 2027: junior research jobs will be run around by models in 12 months, but the talent entering the market may be higher calibre, and human+AI might simply replace the role.", "tweet_url": "https://x.com/cryptopunk7213/status/2111566860386963756", "images": [], "type": "tweet", "category": ["AI", "society"]}, {"author": "abcampbell", "summary": "'6 open weight models working together pretending to be Claude' (quoted link not in data).", "tweet_url": "https://x.com/abcampbell/status/2111569664451240108", "images": [], "type": "tweet", "category": ["AI"]}, {"author": "udiWertheimer", "summary": "Says he is 'very far from Anthropic's biggest fan' but criticizes a critic's cringe delivery (context not in data).", "tweet_url": "https://x.com/udiWertheimer/status/2111493682775962097", "images": [], "type": "tweet", "category": ["AI"]}]}, {"cluster": "MIT / Sabatini Verdict — Ackman Letter to MIT", "category": ["society"], "items": [{"author": "BillAckman", "summary": "Open letter to MIT's president and board chair after a Boston jury unanimously found Prof. Kristin Knouse defamed David Sabatini (the quoted report says he was awarded $6M). Asks whether ber 22. The skill gathers data via AI or the user, then runs a calculator over earnings, moat, profitability, risk and supply (dilution/buybacks). Demoed on Opus 5.5 with no added data; code is on GitHub. Cost him about 41% of a weekly plan to build; he admits he did not 'one-shot' it.", "tweet_url": "https://x.com/hooeem/status/2111552283141923217", "images": ["https://pbs.twimg.com/media/HU29nBqXEAAXE1S.jpg", "https://pbs.twimg.com/media/HU29nx7XAAE7ZNh.jpg", "https://pbs.twimg.com/media/HU29oYkW0AA6O9n.jpg", "https://pbs.twimg.com/media/HU29o51XsAEVCeB.jpg"], "type": "thread", "category": ["crypto", "AI"]}, {"author": "thedefiedge", "summary": "Weekly reads list. Headline stat: every liquid crypto AI token combined is worth about $24.9B, less than Crusoe, one GPU cloud company. Reads include: The State of Crypto Inference (Eigen-commissioned), Multicoin on compute as a financeable asset class needing onchain exchanges/prime brokerage, Derive as a possible 'Hyperliquid of options' (open question: does volume stick without incentives), Crypto's Next Chapter (24/7 stocks, Treasuries, cheaper AI, private trading), a Papertrade farming deep dive, a security checklist, a Tulip King research list of coins above $3M, and 'Cockroach Maxing' (sizing and survival).", "tweet_url": "https://x.com/thedefiedge/status/2111658619595022769", "images": [], "type": "thread", "category": ["crypto", "AI"]}, {"author": "thedefiedge", "summary": "Kraken's Protected Strategies USDC vault (curated by Sentora) now has Firelight cover. If a covered protocol is exploited or an oracle fails, five independent security firms review, and if validated Firelight pays from capital staked in XRP, which gets slashed. Caveats: payouts are not automatic, only specified incidents are covered, and there is a $38M ceiling across three strategies. Takeaway: check what happens when things go wrong, not just the APY.", "tweet_url": "https://x.com/thedefiedge/status/2111614049410801826", "images": [], "type": "tweet", "category": ["crypto"]}, {"author": "RaoulGMI", "summary": "Argues that DCF is the wrong way to value a blockchain: invert it by imagining Ethereum switched off tomorrow, and everything that would go to zero (stablecoins, DeFi, L2s, NFTs) is what it is worth. Networks attract capital because they are dense with developers, programmability and deep markets. Links a longer piece on why most chains die and what separates survivors (a companion piece tests common metrics as predictors and finds most poor).", "tweet_url": "https://x.com/RaoulGMI/status/2111533534884049317", "images": [], "type": "tweet", "category": ["crypto"]}, {"author": "Swedish_uranium", "summary": "Bull case for HydroGraph ($HGRAF): after a day of research, protective coatings could be its most profitable application. Initial Sparc lab tests of its FGA-1 in water-based coatings showed 39-60% less corrosion creep over up to 1,680 hours. A white-paper formulation uses 0.5% graphene versus 0.0015% in PET bottle testing, so 10,000 tonnes of coating would need about 50 tonnes of graphene versus 150 kg for PET (about 333x), though these are separate test formulations. Low loading levels make improvements economic across PET, packaging, automotive composites, cement and coatings. Quoted post says he has seen no disclosed setback after the share price fell sharply.", "tweet_url": "https://x.com/Swedish_uranium/status/2111533593876918662", "images": [], "type": "tweet", "category": ["positioning", "tech"]}, {"author": "cryptopunk7213", "summary": "Agrees with Jack Clark's IMF talk on the singularity: three years ago models couldn't count letters in 'strawberry'; now they are solving hard problems in maths, physics and genetics, with new releases every ~13 days, 'RSI' on the horizon and last quarter's frontier models served at 1/8th the cost. Barely anyone is using AI yet, and he expects what happened to software engineering to hit the rest of the economy next year.", "tweet_url": "https://x.com/cryptopunk7213/status/2111587977025487138", "images": [], "type": "tweet", "category": ["AI"]}, {"author": "marcvanderchijs", "summary": "Replies in a long exchange on AI and jobs: prompt engineering is already automated; bots earn money for humans and pay each other, money may disappear in a couple of years; 'unlimited demand, supply is the bottleneck — the opposite of a bubble'; most models will be open-weight with local inference; costs fall 95% per year; AI can learn any job (mathematicians are 'freaking out'). Says he mostly uses Opus 5.5, not Fable.", "tweet_url": "https://x.com/marcvanderchijs/status/2111591651248660880", "images": [], "type": "thread", "category": ["AI", "macro"]}, {"author": "PeterDiamandis", "summary": "Optimism posts: lists record literacy, healthspans, global energy access, child survival and collapsing intelligence/energy costs as proof of 'the single greatest moment in history'; says optimism is a conclusion he re-derives from evidence; expects waiting months for specialists and years for transplants to seem unbelievable in a decade.", "tweet_url": "https://x.com/PeterDiamandis/status/2111525336626221233", "images": [], "type": "tweet", "category": ["society", "AI"]}, {"author": "ErikVoorhees", "summary": "'Narrow expertise, fallible doctors < raw lab data & private AI' — quoting a user who woke up energized for the first time in a decade after analysing their lab data with private AI. Predicts 'millions of stories like this'.", "tweet_url": "https://x.com/ErikVoorhees/status/2111525333119709250", "images": [], "type": "tweet", "category": ["AI", "society"]}, {"author": "laurashin", "summary": "The user in question (laurashin) says a condition locks iron away from her body, which she manages with lactoferrin; she used Venice (privacy-focused router) and Gemini in incognito to analyse her data, and criticises health service @function for flagging LMHR (keto/carnivore) cholesterol as unhealthy. Personal anecdote, not medical evidence.", "tweet_url": "https://x.com/laurashin/status/2111595341191774404", "images": [], "type": "thread", "category": ["AI", "society"]}, {"author": "dylan522p", "summary": "Defends analyst @jukan05 against 'clueless loud voices' discouraging him from sharing opinions ('censoring your thought will make you worse as an analyst') and notes a 'MEME:' tagged post was still rage-baited on.", "tweet_url": "https://x.com/dylan522p/status/2111609664303755740", "images": [], "type": "tweet", "category": ["AI", "tech"]}, {"author": "udiWertheimer", "summary": "Quoting Tim Sweeney on writing Unreal Engine 1 (about 30% deep hard-problem coding, 70% typing and routine work), says 'Tim is becoming the DHH of video games'. Elsewhere, replying to Sweeney: it is 'finally sustainable to build games for VR fans'.", "tweet_url": "https://x.com/udiWertheimer/status/2111673658339139793", "images": [], "type": "tweet", "category": ["tech"]}, {"author": "paulg", "summary": "Asks why AI-generated replies so often say words 'doing work' and 'doing heavy lifting' and whether it is one model's idiosyncrasy that all others share (image of examples attached).", "tweet_url": "https://x.com/paulg/status/2111510655681597824", "images": ["https://pbs.twimg.com/media/HU2XXRZWUAAbB29.png"], "type": "tweet", "category": ["AI"]}, {"author": "laurashin", "summary": "Summary of a video: 'the best hardware wallet is an iPhone', since a phone from an official Apple Store is too common to be a supply-chain target; replies add multisig and backup advice.", "tweet_url": "https://x.com/laurashin/status/2111593113332617299", "images": [], "type": "tweet", "category": ["crypto"]}, {"author": "stevehou", "summary": "Reacts with 👀 to a joke index on 'Bankmandan liquidity to the real economy' collapsing since the beginning of the year (the quoted post is a joke 'index' and he adds only an emoji reaction).", "tweet_url": "https://x.com/stevehou/status/2111590342172516500", "images": [], "type": "tweet", "category": ["macro"]}, {"author": "zeroxkyle", "summary": "Argues sovereign individuals in crypto must be sovereign in every part of life ('high agency'), with a 'patch update of the world' coming. Replying to a thesis that on-chain would be first to recover, he says on-chain is a 'solved game' with no '1 to 2' like Sol last season, and prefers alts.", "tweet_url": "https://x.com/zeroxkyle/status/2111674567722996011", "images": [], "type": "tweet", "category": ["crypto", "society"]}, {"author": "ErikVoorhees", "summary": "Privacy is relative: a home with the shades closed is private from street watchers, yet they still know it exists and when you enter or leave.", "tweet_url": "https://x.com/ErikVoorhees/status/2111536959307083875", "images": [], "type": "tweet", "category": ["crypto"]}, {"author": "Evan_ss6", "summary": "Image thread on crypto-Twitter attention: 'you will receive 98% slop and 2% good post' and the recurring accounts he sees as the future of the space. Mostly social commentary.", "tweet_url": "https://x.com/Evan_ss6/status/2111569052527149427", "images": ["https://pbs.twimg.com/media/HU3PjpQWEAAJJhz.jpg"], "type": "thread", "category": ["society"]}, {"author": "0xfoobar", "summary": "On delta-neutral farming in a portfolio tracker: losses are expected on paper in exchange for a paper gain, and staking-reward accounting is tricky.", "tweet_url": "https://x.com/0xfoobar/status/2111659381179969975", "images": [], "type": "tweet", "category": ["crypto"]}, {"author": "dampedspring", "summary": "On AI coding tools: says the differences between Codex, Claude Code and the rest are irrelevant. On equities, says the COT report is a poor directional indicator.", "tweet_url": "https://x.com/dampedspring/status/2111566868003639694", "images": [], "type": "tweet", "category": ["tech", "positioning"]}, {"author": "beaniemaxi", "summary": "Claims nobody can profit from day trading consistently over a reasonable period, and that supposed pro-athlete-level crypto traders are scamming people.", "tweet_url": "https://x.com/beaniemaxi/status/2111652286149603541", "images": [], "type": "tweet", "category": ["crypto", "positioning"]}, {"author": "abcampbell", "summary": "Quoting a post about VCs taking junior infrastructure equity without hedging rate risk, pitches 'interest rate swaps' to 'sharks' (image attached) — tongue in cheek.", "tweet_url": "https://x.com/abcampbell/status/2111628817949503533", "images": ["https://pbs.twimg.com/media/HU4DNhJacAAtspt.jpg"], "type": "tweet", "category": ["macro"]}], "C_contrarian": [{"author": "marcvanderchijs", "summary": "Counter to bubble talk: sees 'unlimited demand, not enough supply' as the opposite of a bubble, and says costs fall 95% a year.", "tweet_url": "https://x.com/marcvanderchijs/status/2111591651248660880", "images": [], "type": "thread", "category": ["AI"]}, {"author": "jvisserlabs", "summary": "Against 'the AI bubble popped': it is hedge fund leverage popping, and abundance may erode terminal values of most companies (not an AI-demand problem).", "tweet_url": "https://x.com/jvisserlabs/status/2111510266558955634", "images": [], "type": "tweet", "category": ["macro", "AI"]}, {"author": "ErikVoorhees", "summary": "Against both parties' reform stories: 'voting will not change the game theory', Trump grew the state larger than Biden, and bond markets will force the change. Also disputes the migrant-cause narrative from Geiger and others: migration is a symptom of handouts.", "tweet_url": "https://x.com/ErikVoorhees/status/2111534759964729383", "images": ["https://pbs.twimg.com/media/HU3E4NoWcAAbtDK.jpg"], "type": "thread", "category": ["geopolitics", "macro"]}, {"author": "zeroxkyle", "summary": "Against the consensus that on-chain/retail memecoin beta recovers first: calls on-chain a 'solved game' and prefers alts on risk/reward.", "tweet_url": "https://x.com/zeroxkyle/status/2111647717420315007", "images": [], "type": "tweet", "category": ["crypto"]}, {"author": "Zeneca", "summary": "Against the cry // ---------- helpers ----------
const CAT_VARS = {
  macro: 'var(--cat-macro)',
  crypto: 'var(--cat-crypto)',
  energy: 'var(--cat-energy)',
  tech: 'var(--cat-tech)',
  ai: 'var(--cat-ai)',
  'ai/infra': 'var(--cat-ai)',
  geopolitics: 'var(--cat-geopolitics)',
  positioning: 'var(--cat-positioning)',
  regulation: 'var(--cat-regulation)',
  society: 'var(--cat-society)',
  em: 'var(--cat-em)',
};
function catColor(cat) {
  if (!cat) return 'var(--cat-default)';
  return CAT_VARS[String(cat).toLowerCase()] || 'var(--cat-default)';
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function escapeAttr(s) {
  return escapeHtml(s).replace(/`/g, '&#96;');
}

function renderBold(text) {
  return escapeHtml(text).replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
}

function relativeTime(iso) {
  if (!iso) return '';
  const dt = new Date(iso);
  if (isNaN(dt.getTime())) return '';
  const secs = Math.max(0, (Date.now() - dt.getTime()) / 1000);
  if (secs < 60)   return Math.floor(secs) + 's ago';
  const mins = secs / 60;
  if (mins < 60)   return Math.floor(mins) + 'm ago';
  const hrs  = mins / 60;
  if (hrs < 48)    return Math.floor(hrs) + 'h ago';
  return Math.floor(hrs / 24) + 'd ago';
}

function pill(cat) {
  if (!cat) return '';
  return `<span class="pill" style="background:${catColor(cat)}">${escapeHtml(cat)}</span>`;
}

function authorTag(name, cls = 'item-author') {
  if (!name) return '';
  return `<span class="${cls}" onclick="filterAuthor('${escapeAttr(name)}')">@${escapeHtml(name)}</span>`;
}

// ---------- rendering ----------
function renderThumbs(images) {
  if (!images || !images.length) return '';
  return `<div class="thumbs">` + images.map(u =>
    `<img src="${escapeAttr(u)}" class="thumb" loading="lazy" alt="" onclick="openLightbox('${escapeAttr(u)}')">`
  ).join('') + `</div>`;
}

function renderItem(item) {
  const author = item.author || item.author_username || '';
  const time = relativeTime(item.created_at);
  const thread = item.is_thread ? '<span class="item-thread">thread</span>' : '';
  const link = item.tweet_url
    ? `<a class="item-link" href="${escapeAttr(item.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  return `
    <div class="item-card filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${pill(item.category)}
        ${authorTag(author)}
        ${thread}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      <div class="item-text">${escapeHtml(item.text || '')}</div>
      ${renderThumbs(item.images)}
    </div>`;
}

function renderClusterItem(it) {
  const author = it.author || it.author_username || '';
  const time = relativeTime(it.created_at);
  const link = it.tweet_url
    ? `<a class="item-link" href="${escapeAttr(it.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  return `
    <div class="cluster-item filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${authorTag(author)}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      <div class="item-text">${escapeHtml(it.text || '')}</div>
      ${renderThumbs(it.images)}
    </div>`;
}

function renderCluster(cluster) {
  const itemsHtml = (cluster.items || []).map(renderClusterItem).join('');
  return `
    <div class="cluster">
      <div class="cluster-head">
        ${pill(cluster.category)}
        <div class="cluster-title">${escapeHtml(cluster.title || '')}</div>
      </div>
      ${cluster.description ? `<div class="cluster-desc">${escapeHtml(cluster.description)}</div>` : ''}
      ${itemsHtml ? `<div class="cluster-items">${itemsHtml}</div>` : ''}
    </div>`;
}

function renderLink(l) {
  const author = l.author || l.author_username || '';
  const url = l.url || (l.resolved || l.tco) || '';
  return `
    <div class="link-row filterable" data-author="${escapeAttr(author).toLowerCase()}">
      ${author
        ? authorTag(author, 'link-author')
        : '<span class="link-author">—</span>'}
      <a class="link-url" href="${escapeAttr(url)}" target="_blank" rel="noopener">${escapeHtml(url)}</a>
      ${l.description ? `<span class="link-desc">${escapeHtml(l.description)}</span>` : ''}
    </div>`;
}

function renderSection(letter, name, items, type) {
  if (!items || !items.length) return '';
  let body;
  if (type === 'events') {
    body = items.map(renderCluster).join('');
  } else if (type === 'links') {
    body = items.map(renderLink).join('');
  } else {
    body = items.map(renderItem).join('');
  }
  const cls = type === 'contrarian' ? 'section section-contrarian' : 'section';
  return `
    <div class="${cls}">
      <div class="section-head" onclick="toggleSection(this)">
        <span class="section-letter">${letter}.</span>
        <span class="section-name">${escapeHtml(name)}</span>
        <span class="section-count">${items.length}</span>
        <span class="section-arrow">▸</span>
      </div>
      <div class="section-body">${body}</div>
    </div>`;
}

function renderSummary(text) {
  if (!text) return '';
  const paragraphs = String(text).split(/\n\n+/).filter(Boolean)
    .map(p => `<p>${renderBold(p)}</p>`).join('');
  return `<div class="summary">${paragraphs}</div>`;
}

function renderStats(d) {
  const s = (d && d.stats) || d || {};
  const parts = [];
  if (s.received    != null) parts.push(`received <strong>${s.received}</strong>`);
  if (s.after_filter!= null) parts.push(`after filter <strong>${s.after_filter}</strong>`);
  if (s.authors     != null) parts.push(`authors <strong>${s.authors}</strong>`);
  if (s.coverage    != null) {
    const pct = (s.coverage <= 1 ? s.coverage * 100 : s.coverage);
    parts.push(`coverage <strong>${pct.toFixed(0)}%</strong>`);
  }
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSection(headEl) {
  headEl.parentElement.classList.toggle('open');
}

function openLightbox(src) {
  const img = document.getElementById('lightbox-img');
  img.src = src;
  document.getElementById('lightbox').classList.add('open');
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-img').src = '';
}

let activeFilter = null;
function filterAuthor(name) {
  if (!name) return;
  activeFilter = String(name).toLowerCase();
  document.querySelectorAll('.filterable').forEach(el => {
    const a = (el.dataset.author || '').toLowerCase();
    if (a === activeFilter) {
      el.classList.add('match');
      el.classList.remove('dim');
    } else {
      el.classList.add('dim');
      el.classList.remove('match');
    }
  });
  document.getElementById('filter-name').textContent = '@' + name;
  document.getElementById('filter-bar').classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function clearFilter() {
  activeFilter = null;
  document.querySelectorAll('.filterable').forEach(el => {
    el.classList.remove('match');
    el.classList.remove('dim');
  });
  document.getElementById('filter-bar').classList.remove('active');
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (document.getElementById('lightbox').classList.contains('open')) {
      closeLightbox();
    } else if (activeFilter) {
      clearFilter();
    }
  }
});

// ---------- schema normalization ----------
// Some producer runs emit the "sections" schema documented in the routine
// spec (report_type/input_stats/sections.A_events.../coverage) instead of
// the flat schema this renderer reads (date/events/insights/contrarian/
// positioning/links/stats). Normalize so either shape renders correctly.
function firstOf(v) {
  return Array.isArray(v) ? v[0] : v;
}

function normalizeItem(it) {
  if (!it || typeof it !== 'object') return it;
  return {
    author: it.author || it.author_username,
    text: it.text != null ? it.text : it.summary,
    category: firstOf(it.category),
    tweet_url: firstOf(it.tweet_url),
    images: it.images,
    created_at: it.created_at,
    is_thread: it.is_thread != null ? it.is_thread : (it.type === 'thread'),
  };
}

function normalizeData(d) {
  if (!d || typeof d !== 'object') return {};
  const hasFlat = d.events || d.insights || d.contrarian || d.positioning || d.links || d.stats;
  if (hasFlat) return d;

  const s = d.sections;
  if (!s) return d;

  const out = Object.assign({}, d);
  out.date = d.date || (d.collected_at ? String(d.collected_at).replace('T', ' ').replace('Z', ' UTC') : '');
  if (s.A_events) {
    out.events = s.A_events.map(cl => ({
      title: cl.cluster || cl.title,
      category: firstOf(cl.category),
      description: cl.description,
      items: (cl.items || []).map(normalizeItem),
    }));
  }
  if (s.B_insights) out.insights = s.B_insights.map(normalizeItem);
  if (s.C_contrarian) out.contrarian = s.C_contrarian.map(normalizeItem);
  if (s.D_positioning) out.positioning = s.D_positioning.map(normalizeItem);
  if (s.E_links) {
    out.links = s.E_links.map(l => ({
      author: l.author,
      url: l.url,
      tweet_url: firstOf(l.tweet_url),
      description: l.note || l.description,
    }));
  }
  const stats = d.stats || {};
  out.stats = {
    received: stats.received != null ? stats.received : (d.input_stats && d.input_stats.total_tweets),
    after_filter: stats.after_filter != null ? stats.after_filter : (d.input_stats && d.input_stats.after_noise_filter),
    authors: stats.authors != null ? stats.authors : (d.coverage && d.coverage.authors_total),
    coverage: stats.coverage != null ? stats.coverage : (d.coverage && d.coverage.coverage_pct),
  };
  return out;
}

// ---------- main ----------
function renderReport(d) {
  d = normalizeData(d);
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  const sections = [
    renderSummary(d.summary),
    renderSection('A', 'Events & Reactions',      d.events,                                'events'),
    renderSection('B', 'Alpha & Insights',        d.insights || d.alpha,                   'items'),
    renderSection('C', 'Contrarian Views',        d.contrarian,                            'contrarian'),
    renderSection('D', 'Positioning & Trade Ideas', d.positioning,                         'items'),
    renderSection('E', 'Link Queue',              d.links,                                 'links'),
  ].join('');
  const app = document.getElementById('app');
  app.innerHTML = sections || '<div class="empty">No report data.</div>';

  // Auto-open first two sections.
  document.querySelectorAll('.section').forEach((s, i) => {
    if (i < 2) s.classList.add('open');
  });

  document.getElementById('stats').innerHTML = renderStats(d);
}

renderReport(REPORT_DATA);
</script>
