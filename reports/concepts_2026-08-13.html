mmary before acting.", "quote": "It asks where some of the real barriers and constraints on delivery lie and examines what would need to change to unlock private capital at scale.", "locator": "This roundtable brings together those responsible", "quote_verified": true}]}], "insight_total": 7, "top_entities": ["Oxford Economics", "UK infrastructure", "National Infrastructure Pipeline", "John Armitt", "Societe Generale", "Construction Plant-hire Association", "Half-Built Britain", "National Infrastructure Commission", "Public Private Partnership Commission", "French Chamber of Commerce"], "source_meta": {"author": "Duncan Campbell", "word_count": 496, "paywalled": false}}, {"record_id": "5bf6eee9022de9a2", "source_type": "concepts", "source_name": "Peterson Institute (PIIE)", "source_url": "https://www.piie.com/blogs/realtime-economics/2026/trying-prop-yen-us-wants-have-its-cake-and-eat-it-too", "title": "In trying to prop up the yen, the US wants to have its cake and eat it too", "published_date": "2026-08-11", "language": "en", "processed_at": "2026-08-13T11:14:33Z", "processor": "claude-code-sub-opus", "tags": ["Macro", "Geopolitics", "Positioning"], "gist": "On July 31, 2026 the US Treasury joined Japan in its first yen-buying intervention since June 1998, after Japan burned an estimated $87 billion of reserves over two days to arrest a mere 4.6 percent yen slide. Obstfeld argues the operation is incoherent: US tariffs and the $550 billion Japanese investment pledge structurally weaken the yen, a stronger yen contradicts Bessent's 'strong dollar' talk, and the real motive - sparing the fragile Treasury market from Japanese reserve liquidation, plus a request to 'upsize' the Fed's FIMA repo facility - pushes the US toward fiscal dominance.", "themes": [{"theme": "The July 31 intervention mechanics", "insights": [{"claim": "The US Treasury joined Japanese authorities in a joint FX intervention to strengthen the yen on July 31, 2026, the first US intervention in support of the yen since June 1998.", "speaker": "Maurice Obstfeld", "type": "data_point", "entities": ["US Treasury", "Bank of Japan", "Japan", "yen", "Scott Bessent"], "conviction": "high", "so_what": "A 28-year precedent break signals Washington is now willing to use its balance sheet on FX; treat USD/JPY upside as carrying explicit official intervention risk rather than pure carry.", "quote": "The US action was notable as its first intervention in support of the yen since June 1998", "locator": "In a highly unusual move, the US Treasury", "quote_verified": true}, {"claim": "Japan spent an estimated $87 billion of its foreign exchange reserves buying yen over the last two days of July, while the US Treasury added only a relatively small amount of financial support but a substantial political signal.", "speaker": "Maurice Obstfeld", "type": "data_point", "entities": ["Japan", "US Treasury", "yen", "foreign exchange reserves"], "conviction": "high", "so_what": "The size ratio shows Japan bears the cost while the US supplies signaling; watch Japan's reserve drawdown pace as the true constraint on how long the defense can run.", "quote": "Japan spent an estimated $87 billion(link is external) of its foreign exchange reserves to buy yen over the last two days of July.", "locator": "But Japan spent an estimated $87 billion", "quote_verified": true}, {"claim": "The yen had depreciated only about 4.6 percent against the dollar since Japan's prior solo intervention in spring 2025 - not a massive or sudden move - meaning the intervention trigger was political rather than disorderly-market driven.", "speaker": "Maurice Obstfeld", "type": "data_point", "entities": ["yen", "dollar", "Japan"], "conviction": "high", "so_what": "A 4.6 percent move as an intervention trigger implies a far lower pain threshold than markets assumed, tightening the implied band on USD/JPY.", "quote": "The yen had depreciated by around 4.6 percent against the dollar since the Japanese government's prior solo intervention last spring, hardly a massive or sudden move.", "locator": "The yen had depreciated by around 4.6 percent", "quote_verified": true}, {"claim": "Treasury Secretary Scott Bessent framed the yen intervention geopolitically rather than economically, saying the administration 'delivers for America's trusted partners.'", "speaker": "Maurice Obstfeld", "type": "thesis", "entities": ["Scott Bessent", "Trump administration", "Japan"], "conviction": "high", "so_what": "FX policy is being used as alliance currency, so intervention odds now track diplomatic relationships as much as valuation - relevant for KRW, TWD and other allied Asian crosses.", "quote": "The Trump Administration delivers for America's trusted partners.", "locator": "Treasury Secretary Scott Bessent gave it a geopolitical gloss", "quote_verified": true}]}, {"theme": "Why intervention cannot work: the FX framework", "insights": [{"claim": "Exchange rate trends depend primarily on monetary and fiscal policies plus long-run trade developments, making FX intervention at best a short-term corrective to disorderly moves rather than a way to change a currency's path.", "speaker": "Maurice Obstfeld", "type": "framework", "entities": ["foreign exchange market", "monetary policy", "fiscal policy"], "conviction": "high", "so_what": "Use intervention-driven yen strength as a fade opportunity unless BOJ tightening or US fiscal consolidation actually changes the rate differential.", "quote": "exchange rate trends depend primarily on monetary and fiscal policies, as well as long-run trade developments, making foreign exchange interventions at best a short-term corrective to disorderly exchange rate movements", "locator": "As the floating exchange rate system evolved", "quote_verified": true}, {"claim": "The Treasury's newly activist exchange rate stance rests on the illusion that inherent policy tradeoffs don't apply, which produces inconsistent policies likely to raise economic volatility.", "speaker": "Maurice Obstfeld", "type": "causal", "entities": ["US Treasury", "Scott Bessent"], "conviction": "high", "so_what": "Higher policy inconsistency argues for owning FX and rates volatility rather than carry; the regime raises the odds of abrupt reversals.", "quote": "A more activist role toward exchange rates, which the US Treasury is now embracing, relies on the illusion that inherent policy tradeoffs don't apply. This misguided belief leads to inconsistent policies likely to raise economic volatility.", "locator": "A more activist role toward exchange rates", "quote_verified": true}, {"claim": "The 1998 US-Japan intervention had a stronger systemic rationale - an Asian financial crisis and China holding the yuan stable - and was conditioned on Japanese promises of financial sector reform and demand stimulus, yet even that had little enduring impact on the yen.", "speaker": "Maurice Obstfeld", "type": "framework", "entities": ["Japan", "China", "yuan", "US Treasury", "Federal Reserve"], "conviction": "high", "so_what": "The best-case historical comparator failed on the currency; expect the 2026 version, which lacks conditionality, to fail faster.", "quote": "Even so, the intervention had little enduring impact on the yen, and Japan's efforts proved insufficient to turn its economy around before new shocks hit it.", "locator": "Cakeism is bad policy", "quote_verified": true}, {"claim": "The 2026 intervention lacks the conditionality of 1998 - there is no paired commitment by Japan to address the underlying causes of yen depreciation - so it is a short-term response to policy dilemmas on both sides of the Pacific and will not work over the longer term.", "speaker": "Maurice Obstfeld", "type": "prediction", "entities": ["Japan", "US Treasury", "yen"], "conviction": "high", "so_what": "Base case is renewed yen weakness after the intervention effect decays; the tell would be absence of Japanese fiscal or structural commitments alongside future operations.", "quote": "Foreign exchange intervention is not a free lunch. It is not even a free cake.", "locator": "In contrast, last month's US intervention", "quote_verified": true}]}, {"theme": "Tariffs versus the yen: the trade contradiction", "insights": [{"claim": "US trade actions against Japan - multiple tariffs, most recently under Section 301 of the Trade Act of 1974, plus investigations - are themselves a driver of yen weakness that intervention cannot mask.", "speaker": "Maurice Obstfeld", "type": "causal", "entities": ["Japan", "Section 301", "Trade Act of 1974", "tariffs", "yen"], "conviction": "high", "so_what": "Every new tariff escalation on Japan mechanically adds to the yen-weakening force the same government is fighting; track Section 301 actions as a leading indicator for USD/JPY.", "quote": "Japan's yen intervention, supported by the US Treasury, cannot long mask the fact that the hostile American trade actions against Japan are one driver of a weaker yen.", "locator": "Trade policy confusion", "quote_verified": true}, {"claim": "Japan's trade-deal commitment to invest $550 billion in US projects selected by the administration weakens the yen, because more Japanese investment into America requires a bigger Japanese trade surplus.", "speaker": "Maurice Obstfeld", "type": "causal", "entities": ["Japan", "Trump administration", "yen", "trade deal"], "conviction": "high", "so_what": "The $550bn pledge is a structural yen-negative capital outflow; the more of it that gets deployed, the harder intervention has to work against it.", "quote": "Other things being equal, these factors would weaken the yen (Japanese exporters must find new buyers, while more investment into America requires a bigger Japanese trade surplus).", "locator": "Under its so-called \"trade deal\" with the Trump administration", "quote_verified": true}, {"claim": "Bessent fears a weak yen could catalyze broader Asian currency weakness - and the same Asian countries are targets of US protectionist policies and threats, making the US the source of the pressure it wants to contain.", "speaker": "Maurice Obstfeld", "type": "contrarian", "entities": ["Scott Bessent", "Asia", "yen", "US tariffs"], "conviction": "medium", "so_what": "Watch for intervention or jawboning spreading to other Asian FX; the Treasury has signaled it views regional currency weakness as a policy problem.", "quote": "Bessent has noted that currencies throughout Asia are weak and expressed fears(link is external) that a weak yen could catalyze broader currency weakness regionally.", "locator": "Bessent has noted that currencies throughout Asia are weak", "quote_verified": true}]}, {"theme": "Japan's rates-versus-fiscal dilemma", "insights": [{"claim": "Prime Minister Sanae Takaichi's expansive fiscal plans, driven partly by higher defense spending the Trump administration favors, worry markets against an already massive Japanese debt-to-GDP ratio and now-positive nominal yen interest rates.", "speaker": "Maurice Obstfeld", "type": "causal", "entities": ["Sanae Takaichi", "Japan", "JGBs", "defense spending", "Trump administration"], "conviction": "high", "so_what": "Fiscal expansion plus positive nominal rates is a JGB term-premium story; watch the long end of the JGB curve as the transmission channel into the yen.", "quote": "Prime Minister Sanae Takaichi's expansive fiscal plans, driven in part by higher defense spending that the Trump administration favors, worry markets", "locator": "To be sure, there are other fundamental sources of yen weakness", "quote_verified": true}, {"claim": "Japanese real interest rates remain far below US levels, which continues to fuel yen weakness regardless of intervention.", "speaker": "Maurice Obstfeld", "type": "causal", "entities": ["Japan", "United States", "real interest rates", "yen"], "conviction": "high", "so_what": "The real-rate gap is the core carry driver; yen recovery requires that gap to close, so trade the US-Japan real rate differential, not the intervention headlines.", "quote": "Nonetheless, Japanese real interest rates remain far below US levels, giving additional fuel to yen weakness.", "locator": "Nonetheless, Japanese real interest rates", "quote_verified": true}, {"claim": "Bessent has called on Japan to raise interest rates and BOJ officials are signaling they may well do so in September 2026, but Japanese authorities face a dilemma between hiking to strengthen the yen and dampen inflation versus worsening fiscal sustainability.", "speaker": "Maurice Obstfeld", "type": "prediction", "entities": ["Bank of Japan", "Scott Bessent", "Japan", "interest rates"], "conviction": "medium", "so_what": "A September BOJ hike is the single most tradable near-term catalyst flagged here; position for JGB yield and yen reaction, and note US pressure raises the odds.", "quote": "Bank of Japan (BOJ) officials are signaling that they may well do so in September", "locator": "Bessent has called(link is external) on Japan to raise interest rates", "quote_verified": true}]}, {"theme": "Strong dollar rhetoric versus weak dollar goal", "insights": [{"claim": "Bessent's advocacy of a 'strong dollar' and promotion of the dollar's premier international role, including global dollar-based stablecoins, is contradicted by the intervention itself, whose stated goal is a more competitive - i.e. weaker - dollar.", "speaker": "Maurice Obstfeld", "type": "contrarian", "entities": ["Scott Bessent", "dollar", "stablecoins", "yen"], "conviction": "high", "so_what": "Discount official strong-dollar rhetoric; the revealed preference is dollar depreciation, which argues for structurally short-dollar positioning against allied Asian currencies.", "quote": "this detail doesn't alter the fact that the fundamental and, in fact, stated goal of the intervention is a more competitive (i.e., weaker) dollar", "locator": "Strong dollar or weak dollar?", "quote_verified": true}, {"claim": "The Treasury sold euros rather than dollars for yen on July 31, likely to frame the operation as yen-strengthening rather than dollar-weakening.", "speaker": "Maurice Obstfeld", "type": "data_point", "entities": ["US Treasury", "euro", "yen", "Exchange Stabilization Fund"], "conviction": "medium", "so_what": "The choice of funding currency is the tell for how future US interventions will be dressed up; euro crosses can be collateral damage in US-Japan FX operations.", "quote": "One reason the Treasury sold euros rather than dollars for yen on July 31 may have been to signal a yen-strengthening rather than a dollar-weakening operation", "locator": "Strong dollar or weak dollar?", "quote_verified": true}, {"claim": "The Treasury sold euros without consulting euro area authorities in advance, a small monetary gesture that conveyed a strong negative signal about US cooperation in managing the international financial commons - and markets have taken note.", "speaker": "Maurice Obstfeld", "type": "thesis", "entities": ["US Treasury", "euro area", "ECB", "euro"], "conviction": "medium", "so_what": "Erosion of G7 FX coordination norms raises the tail risk of uncoordinated or competing interventions; a euro-positive reserve-diversification argument over time.", "quote": "Treasury sold euros without consulting euro area authorities in advance, much to their annoyance", "locator": "Note 1", "quote_verified": true}]}, {"theme": "Treasury market fragility, FIMA and fiscal dominance", "insights": [{"claim": "A key motive for US participation was that the Treasury market has become increasingly fragile as US public debt has grown, and further large-scale Treasury sales by a holder as big as Japan could stress the market and raise borrowing rates; US yen buying lets Japan liquidate fewer Treasuries.", "speaker": "Maurice Obstfeld", "type": "causal", "entities": ["US Treasury market", "Japan", "US public debt", "Treasury securities"], "conviction": "high", "so_what": "The intervention is partly a rates-market defense - Japanese FX defense and US long-end yields are now linked, so watch Japanese reserve composition as a UST supply risk.", "quote": "The Treasury market has become increasingly fragile(link is external) as the US public debt has grown. Further large-scale sales of Treasury securities by a holder as big as Japan could stress the market and raise borrowing rates.", "locator": "What's more, one motive for the US yen intervention", "quote_verified": true}, {"claim": "The contradiction between America's ongoing fiscal deficit, which is gradually eroding the Treasury's funding advantage, and the dollar's reserve currency role cannot be resolved by asking foreign reserve holders to limit their use of dollars; the fix requires greater US fiscal prudence and Treasury market infrastructure upgrades.", "speaker": "Maurice Obstfeld", "type": "thesis", "entities": ["US fiscal deficit", "dollar", "US Treasury market", "reserve currency"], "conviction": "high", "so_what": "Absent fiscal consolidation or market-structure reform, the US funding advantage keeps eroding - a structural argument for higher term premium and gold/non-dollar reserve assets.", "quote": "The solution requires greater US fiscal prudence and upgrades to Treasury market infrastructure to facilitate trade even when large shocks occur.", "locator": "The contradiction between America's ongoing fiscal deficit", "quote_verified": true}, {"claim": "Bessent 'encouraged' the Federal Reserve to 'upsize' the FIMA repo facility, which was designed for temporary emergency Treasury acquisitions to support market functioning - not to stabilize Treasury borrowing rates by accommodating foreign authorities' exchange rate operations absent financial stability threats.", "speaker": "Maurice Obstfeld", "type": "contrarian", "entities": ["Federal Reserve", "FIMA repo facility", "Scott Bessent", "US Treasury"], "conviction": "high", "so_what": "Any Fed move to upsize or routinize FIMA is a concrete marker of institutional erosion; watch FOMC pushback as the signal on Fed independence.", "quote": "It was not designed to stabilize Treasury borrowing rates by accommodating foreign authorities' exchange rate management operations, absent immediate financial stability threats.", "locator": "Pressure on the Fed", "quote_verified": true}, {"claim": "Blurring the emergency-liquidity and FX-management roles of the FIMA facility would move the US monetary regime a step closer to fiscal dominance, at the expense of Fed credibility, and would likely be resisted by the FOMC.", "speaker": "Maurice Obstfeld", "type": "thesis", "entities": ["Federal Reserve", "FOMC", "FIMA repo facility", "fiscal dominance"], "conviction": "high", "so_what": "Fiscal-dominance risk is the tail trade here: steepeners, breakeven inflation and gold benefit if the Fed's balance sheet becomes an adjunct to Treasury financial diplomacy.", "quote": "Blurring the line between these two roles would move the US monetary regime a step closer to fiscal dominance.", "locator": "Pressure on the Fed", "quote_verified": true}, {"claim": "It has not been disclosed whether the Federal Reserve put its own balance sheet behind the July 31 intervention alongside the Treasury's, unlike most past US foreign exchange interventions.", "speaker": "Maurice Obstfeld", "type": "data_point", "entities": ["Federal Reserve", "US Treasury", "Exchange Stabilization Fund"], "conviction": "medium", "so_what": "Disclosure of Fed participation - or its absence - in the quarterly FX operations report is a direct read on how much independence the Fed is conceding.", "quote": "Whether the Fed even put its own balance sheet behind the July 31 intervention along with the Treasury's, as has been the case in most past US foreign exchange interventions, has not been disclosed.", "locator": "Pressure on the Fed", "quote_verified": true}]}], "insight_total": 22, "top_entities": ["Scott Bessent", "US Treasury", "Bank of Japan", "Japan", "yen", "Federal Reserve", "FIMA", "Sanae Takaichi", "dollar", "Trump administration", "Treasury market", "euro"], "source_meta": {"author": "Maurice Obstfeld", "word_count": 1406, "paywalled": false}}, {"record_id": "e2f91a209844489d", "source_type": "concepts", "source_name": "World Gold Council", "source_url": "https://www.gold.org/goldhub/research/gold-most-effective-commodity-investment-2026-edition", "title": "Gold: The most effective commodity investment − 2026 edition", "published_date": "2026-08-11", "language": "en", "processed_at": "2026-08-13T11:14:46Z", "processor": "claude-code-sub-opus", "tags": ["Macro", "Positioning", "Energy"], "gist": "The World Gold Council argues gold should be held as a standalone strategic allocation rather than accessed through broad commodity indices, marshalling 20-year data (June 2006–June 2026) on returns, roll drag, correlation, inflation regimes and liquidity: gold returned 9.9% spot / 8.9% via futures vs crude oil's -0.2% spot / -7.2% futures, a 5% gold sleeve contributed 28% of total portfolio diversification benefit versus 15% for an equal-sized commodity sleeve, and daily global gold trading averaged US$373bn in 2025. It is explicitly advocacy from an industry body — every chart is sourced or co-sourced to the WGC and the conclusion is a call to raise gold exposure — but the underlying comparisons (index weights, stocks-to-use sensitivity, macro-regime returns) are specific and checkable.", "themes": [{"theme": "Index weightings understate gold", "insights": [{"claim": "2026 target weights give gold just 7.2% of the S&P GSCI and 14.9% of the Bloomberg Commodity Index, while energy takes 51.8% and 29.4% respectively — so a standard commodity index allocation is overwhelmingly an energy bet, not a gold one.", "speaker": "World Gold Council", "type": "data_point", "entities": ["S&P GSCI", "Bloomberg Commodity Index", "S&P Dow Jones Indices", "Bloomberg", "gold", "energy"], "conviction": "high", "so_what": "Investors who think they own gold via a commodity index own mostly crude and refined products; size a separate physical/ETF gold sleeve if gold exposure is the actual objective.", "quote": "Weights are the 2026 target weights announced by Bloomberg and S&P Dow Jones Indices.", "locator": "Table 1: Commodity indices have a small allocation to gold", "quote_verified": true}, {"claim": "Commodity index methodologies rely on futures-market liquidity and/or production-based measures, which structurally understate gold because gold's liquidity sits largely in OTC and ETF markets and its available supply sits in a large recyclable above-ground stock rather than annual mine output.", "speaker": "World Gold Council", "type": "causal", "entities": ["commodity indices", "gold", "OTC market", "gold ETFs", "mine production"], "conviction": "high", "so_what": "The under-weight is a methodology artefact, not a market judgement — expect index weights to keep lagging gold's true market depth, so benchmark-relative gold exposure has to be added deliberately.", "quote": "Gold's liquidity extends beyond futures markets through deep OTC and ETF trading, while its available supply extends beyond annual mine production through a large above-ground stock that can be recycled, resold and reallocated.", "locator": "Gold, under-represented", "quote_verified": true}, {"claim": "Because commodities are typically under 10% of a portfolio and gold is usually under 10% of that commodity sleeve, most portfolios end up with less than 1% effective exposure to gold.", "speaker": "World Gold Council", "type": "data_point", "entities": ["institutional portfolios", "gold", "commodities"], "conviction": "high", "so_what": "Quantifies the gap between the typical 1% de facto gold weight and the 2.5–10% allocations the analysis tests — a large potential incremental demand pool if institutions reallocate.", "quote": "most portfolios will have less than 1% exposure to gold", "locator": "Portfolio impact", "quote_verified": true}, {"claim": "Accessing gold through a broad commodity index imposes roll costs that, uniquely among commodities, are avoidable simply by holding the metal physically.", "speaker": "World Gold Council", "type": "thesis", "entities": ["commodity indices", "gold", "futures roll"], "conviction": "high", "so_what": "The implementation vehicle, not just the allocation size, drives realised return — physical or physically-backed ETF beats index futures exposure for a strategic gold holder.", "quote": "it results in roll costs, which – unlike most other commodities – are avoidable with physical allocation", "locator": "And while these allocations are trending higher", "quote_verified": true}]}, {"theme": "Gold's dual demand structure decouples it from the cycle", "insights": [{"claim": "Gold's demand splits between counter-cyclical investment demand (which drives price during economic uncertainty) and pro-cyclical consumer demand from jewellery and technology (which supports price during expansions), making the metal less sensitive to the business cycle than any other metal.", "speaker": "World Gold Council", "type": "framework", "entities": ["gold", "jewellery demand", "technology demand", "investment demand"], "conviction": "high", "so_what": "A reusable model for why gold produces positive returns in more macro regimes than industrial commodities — the two demand legs take turns rather than failing together.", "quote": "during periods of economic uncertainty it is the counter-cyclical investment demand that drives up the gold price. During periods of economic expansion pro-cyclical consumer demand supports performance.", "locator": "Market structure: contrasting supply and demand forces", "quote_verified": true}, {"claim": "Silver, copper, aluminium, nickel and lead derive a far larger share of demand from industrial and technology use than gold does, on five-year average annual demand estimates ending Q4 2025, leaving them materially more exposed to the business cycle.", "speaker": "World Gold Council", "type": "data_point", "entities": ["silver", "copper", "aluminium", "nickel", "lead", "gold", "Metals Focus", "Silver Institute", "International Copper Study Group"], "conviction": "high", "so_what": "Silver is not a cheap gold substitute in a risk-off allocation — its industrial demand share makes it a cyclical, higher-beta holding.", "quote": null, "locator": "Chart 1: Gold enjoys sources of demand that de-link it from the global business cycle", "quote_verified": false}, {"claim": "Oil, copper, natural gas and cocoa prices are driven by how tight physical inventory buffers are (stocks-to-use), whereas gold's above-ground stock is huge relative to mine production and is never consumed, so gold's price is a function of demand rather than short-term inventory scarcity.", "speaker": "World Gold Council", "type": "framework", "entities": ["oil", "copper", "natural gas", "cocoa", "gold", "stocks-to-use"], "conviction": "high", "so_what": "Do not run inventory/supply-shock playbooks on gold — model demand (investment, central bank, consumer) instead; conversely, keep watching stocks-to-use for the commodities where it does bind.", "quote": "gold’s price is less a function of short-term inventory scarcity and more a function of demand", "locator": "From a supply perspective, gold and other commodities differ", "quote_verified": true}, {"claim": "Gold's mine production is more geographically diverse than that of other commodities, making its supply less exposed to disruption.", "speaker": "World Gold Council", "type": "thesis", "entities": ["gold mining", "commodity supply"], "conviction": "medium", "so_what": "Geopolitical supply shocks are a weaker upside catalyst for gold than for concentrated commodities — gold's asymmetry comes from the demand side.", "quote": "Gold production is more geographically diverse making supply less exposed to disruption.", "locator": "From a supply perspective, gold and other commodities differ", "quote_verified": true}, {"claim": "Gold sits closer to metals — especially precious metals — than to energy, agriculture or livestock, because metals can be recycled and reused for new fabrication while energy and agricultural commodities are spent, consumed or transformed and rarely recovered.", "speaker": "World Gold Council", "type": "framework", "entities": ["gold", "precious metals", "energy", "agriculture", "livestock", "recycling"], "conviction": "medium", "so_what": "The recyclability distinction explains why supply elasticity and inventory dynamics differ so sharply across the commodity complex — useful when choosing which sub-index to own.", "quote": null, "locator": "Market structure: contrasting supply and demand forces", "quote_verified": false}]}, {"theme": "Return gap and the roll-cost drag", "insights": [{"claim": "Between June 2006 and June 2026 gold returned 9.9% annualised in spot terms and 8.9% via futures — a roughly 1pp roll and collateral drag — while crude oil returned -0.2% spot but -7.2% via futures over the same window.", "speaker": "World Gold Council", "type": "data_point", "entities": ["gold", "crude oil", "futures curve", "contango"], "conviction": "high", "so_what": "The single hardest number in the piece: roll mechanics cost oil futures holders ~7pp a year versus spot, so vehicle choice dominates the commodity investment decision.", "quote": "between June 2006 and June 2026, gold returned 9.9% in spot terms and 8.9% through futures. Over the same period, oil generated a -0.2% spot return but a -7.2% futures return due to rolling and collateral costs", "locator": "Gold's market structure is different", "quote_verified": true}, {"claim": "Gold's front futures curve stays relatively flat because its large above-ground stock, low storage costs and limited benefit from immediate physical possession keep its convenience yield near zero — unlike crude oil, where tight inventories can push convenience yield above carry costs and produce backwardation and positive roll returns.", "speaker": "World Gold Council", "type": "causal", "entities": ["gold futures", "crude oil", "convenience yield", "backwardation", "contango"], "conviction": "high", "so_what": "Explains why gold futures track spot closely; it also implies gold offers no roll-yield upside in tight markets, so the carry case for other commodities is regime-dependent while gold's is not.", "quote": "the convenience yield is generally limited and the front end of the futures curve has historically remained relatively flat", "locator": "Gold's market structure is different", "quote_verified": true}, {"claim": "Gold has outperformed broad commodity indices and most commodity sub-indices over 3, 5, 10 and 20 years to 30 June 2026, and several sub-indices and broad commodities have actually fallen over the past 20 years.", "speaker": "World Gold Council", "type": "data_point", "entities": ["gold", "Bloomberg Commodity Index", "energy", "agriculture", "industrial metals", "livestock"], "conviction": "high", "so_what": "Two decades of negative absolute returns in parts of the commodity complex undercuts the default 'commodities for the long run' allocation case.", "quote": "a number of sub-indices and broad commodities have fallen over the past 20 years", "locator": "1. Better returns", "quote_verified": true}, {"claim": "Gold's outperformance is not persistent: on a one-year rolling basis versus the Bloomberg Commodity ex-precious-metals index from June 2006 to June 2026, gold's relative performance has swung across a very wide band and it has underperformed over shorter horizons.", "speaker": "World Gold Council", "type": "data_point", "entities": ["gold", "Bloomberg Commodity ex precious metals index"], "conviction": "high", "so_what": "A rare concession from an advocacy source — size gold as a strategic multi-year allocation, not a tactical trade, and expect long stretches of relative pain.", "quote": "even if it’s not the holy grail at all times", "locator": "Chart 6: …even if it’s not the holy grail at all times", "quote_verified": true}, {"claim": "Gold sits at the low end of the commodity volatility spectrum on daily data from June 2006 to June 2026, below silver, energy, the S&P GSCI, industrial metals and agriculture, with only the Bloomberg Commodity Index and livestock lower.", "speaker": "World Gold Council", "type": "data_point", "entities": ["gold", "silver", "energy", "S&P GSCI", "Bloomberg Commodity Index", "LBMA Gold Price"], "conviction": "high", "so_what": "Gold delivers the complex's best returns near the bottom of its risk range — the risk-adjusted case rests as much on low vol as on high return.", "quote": null, "locator": "Chart 8: Gold sits at the lower end of the commodity risk spectrum", "quote_verified": false}]}, {"theme": "Correlation dynamics and crisis behaviour", "insights": [{"claim": "Gold's correlation to equities is regime-dependent: positive during growth phases when equities rise, but negative when the S&P 500 falls by more than two standard deviations — a convexity that broad commodities do not provide.", "speaker": "World Gold Council", "type": "framework", "entities": ["gold", "S&P 500", "commodities", "silver", "industrial metals"], "conviction": "high", "so_what": "This is the specific property being paid for — monitor whether gold's negative tail correlation to equities still holds in the next 2-sigma drawdown, because the whole allocation case rests on it.", "quote": "gold is typically negatively correlated with stocks during risk-off periods, protecting investors against tail risks", "locator": "2. Effective diversification", "quote_verified": true}, {"claim": "In the Q4 2018 equity selloff the MSCI USA index fell 14% and commodities fell 9% while gold rose 8%; in the Q1 2020 COVID selloff MSCI USA fell 20% and commodities fell 23% while gold returned 6%.", "speaker": "World Gold Council", "type": "data_point", "entities": ["MSCI USA Index", "Bloomberg Commodity Index", "gold", "COVID selloff"], "conviction": "high", "so_what": "Two clean case studies where commodities behaved like a risk-on asset and only gold delivered positive returns — the empirical basis for preferring gold over commodities as tail hedge.", "quote": "In the Q4 2018 global equity selloff the MSCI USA index fell 14% and commodities fell 9%, yet gold rose 8%.", "locator": "This dynamism reflects gold’s dual nature", "quote_verified": true}, {"claim": "Across the ten worst quarters of US stock performance since December 1972 gold provided more consistent downside protection than the Bloomberg Commodity Index, which behaved more like a risk-on asset.", "speaker": "World Gold Council", "type": "data_point", "entities": ["MSCI USA Index", "LBMA Gold Price PM", "Bloomberg Commodity Total Return Index"], "conviction": "high", "so_what": "Broad commodities fail precisely when hedges are needed — do not count a commodity sleeve as crisis insurance.", "quote": "broader commodities behaved more like a risk-on asset", "locator": "Chart 11: Gold provides more consistent downside protection", "quote_verified": true}, {"claim": "Gold has little to no correlation with commodities themselves, so a gold allocation cannot be replicated or proxied through broad commodity exposure.", "speaker": "World Gold Council", "type": "thesis", "entities": ["gold", "commodities", "silver", "industrial metals", "agriculture", "energy"], "conviction": "high", "so_what": "Argues gold and commodities are additive, not substitutable, line items — the core of the WGC's ask for a separate strategic allocation.", "quote": "its role as a diversifier is distinct and cannot be replicated through broad commodity exposure alone", "locator": "2. Effective diversification", "quote_verified": true}, {"claim": "Gold is a more effective diversifier than other precious metals such as silver precisely because silver depends to a much greater extent on industrial demand.", "speaker": "World Gold Council", "type": "causal", "entities": ["gold", "silver", "precious metals"], "conviction": "high", "so_what": "Relevant to the perennial gold-vs-silver allocation question: silver's industrial leg destroys the crisis-hedge property.", "quote": "Gold is also a more effective diversifier than other precious metals such as silver, as these other metals depend, to a greater extent, on industrial demand.", "locator": "Chart 10 discussion", "quote_verified": true}]}, {"theme": "Inflation-regime performance", "insights": [{"claim": "Measured against US CPI from December 1971 to June 2026, gold beat commodities in high-inflation periods (>5% y/y) and, unlike commodities, still delivered positive nominal returns when inflation was low (<2%), where commodities posted negative nominal returns.", "speaker": "World Gold Council", "type": "data_point", "entities": ["gold", "commodities", "US CPI", "LBMA Gold Price PM"], "conviction": "high", "so_what": "The low-inflation leg is the differentiator — a commodity inflation hedge bleeds when inflation normalises, whereas gold does not, reducing the timing risk of holding the hedge.", "quote": "in periods of low inflation commodities delivered negative nominal returns while gold posted positive returns", "locator": "3. Protection against inflation", "quote_verified": true}, {"claim": "The reason gold still earns positive returns in low-inflation environments is that robust economic conditions lift consumer-driven gold demand, offsetting the absence of an inflation bid.", "speaker": "World Gold Council", "type": "causal", "entities": ["gold", "consumer demand", "inflation"], "conviction": "medium", "so_what": "A mechanism to test: if jewellery/consumer demand weakens structurally at high price levels, gold's low-inflation return floor weakens with it.", "quote": "reflecting increased demand when economic conditions are robust", "locator": "3. Protection against inflation", "quote_verified": true}]}, {"theme": "Liquidity and market microstructure", "insights": [{"claim": "Daily trading in the global gold market averaged US$373bn in 2025, split roughly US$180bn OTC (about 48% of trading, linked to physical delivery), US$186bn global futures (about 50%), and US$7.2bn in physically-backed gold ETFs.", "speaker": "World Gold Council", "type": "data_point", "entities": ["gold", "OTC market", "gold futures", "gold ETFs"], "conviction": "high", "so_what": "Hard capacity numbers for anyone sizing an institutional gold position; the near-50/50 OTC-futures split is why futures-liquidity-based index weights systematically halve gold's apparent depth.", "quote": "Overall, daily trading in the global gold market averaged US$373bn in 2025.", "locator": "4. Gold is liquid", "quote_verified": true}, {"claim": "COMEX gold futures averaged US$53bn of daily volume over the past 10 years to 30 June 2026, second only to oil among commodities traded there and ahead of natural gas, soybeans, silver, aluminium, corn and zinc.", "speaker": "World Gold Council", "type": "data_point", "entities": ["COMEX", "gold futures", "WTI Crude Oil", "Brent Crude Oil", "silver", "natural gas"], "conviction": "high", "so_what": "Confirms gold as the second-deepest exchange-traded commodity, which matters for execution and for the credibility of large tactical positioning.", "quote": "On the COMEX alone, daily volumes averaged US$53bn over the past 10 years", "locator": "4. Gold is liquid", "quote_verified": true}, {"claim": "Gold is unusual among commodities in that a large share of trading is linked to physical delivery, whereas for most commodities futures dominate trading and physical delivery is rare.", "speaker": "World Gold Council", "type": "thesis", "entities": ["gold", "OTC market", "futures markets", "physical delivery"], "conviction": "high", "so_what": "Physical-linked flow means gold's price discovery is less purely financial than other commodities — watch OTC and physical channels, not just COMEX positioning.", "quote": "While futures dominate most commodity trading and physical delivery is rare, around 48% of gold trading occurs over-the-counter (OTC) linked to physical delivery", "locator": "4. Gold is liquid", "quote_verified": true}, {"claim": "The scale and depth of the gold market means it can comfortably absorb large buy-and-hold institutional investors — an explicit capacity argument aimed at allocators who fear market impact.", "speaker": "World Gold Council", "type": "thesis", "entities": ["gold market", "institutional investors"], "conviction": "high", "so_what": "Removes the liquidity objection to raising gold weights from ~1% toward 5–10%, which is the practical constraint most large funds cite.", "quote": "The scale and depth of the market means that it can comfortably accommodate large, buy-and-hold institutional investors.", "locator": "4. Gold is liquid", "quote_verified": true}]}, {"theme": "Portfolio construction maths", "insights": [{"claim": "In the WGC's own hypothetical 70/30 equity-bond portfolio, adding a 2.5%–10% commodity allocation would NOT have improved risk-adjusted returns over the 20 years to 30 June 2026, whereas gold allocations did.", "speaker": "World Gold Council", "type": "contrarian", "entities": ["commodities", "gold", "MSCI World", "MSCI EM", "Bloomberg US Treasury Index", "Bloomberg US Corporate Bond Index"], "conviction": "high", "so_what": "Directly challenges the standard consultant recommendation to hold a diversified commodity basket; note the source's incentive, but the test window and portfolio construction are fully specified and replicable.", "quote": "our analysis suggests that adding a 2.5%–10% portfolio allocation to commodities would not have improved risk-adjusted returns over the past 20 years", "locator": "Portfolio impact", "quote_verified": true}, {"claim": "A 5% gold allocation contributed 28% of the hypothetical portfolio's total diversification benefit — first among all assets — versus 15% from an identically sized 5% commodity allocation.", "speaker": "World Gold Council", "type": "data_point", "entities": ["gold", "commodities", "global equities", "EM equities", "US Treasuries", "US corporate bonds"], "conviction": "high", "so_what": "Gold delivers roughly double the diversification per unit of capital versus a commodity basket — the cleanest quantitative argument for splitting the two sleeves.", "quote": "a 5% allocation to gold contributes 28% to total diversification benefits – ranking it first among all assets", "locator": "While vital to assess the degree of portfolio diversification", "quote_verified": true}, {"claim": "Adding gold and commodities cut modelled total portfolio risk from 11.8% to 11.2% while the diversification benefit rose from 1.4% to 2.3% of risk, on US dollar performance between 30 June 2006 and 30 June 2026.", "speaker": "World Gold Council", "type": "data_point", "entities": ["gold", "commodities", "portfolio risk decomposition"], "conviction": "high", "so_what": "Puts a magnitude on the benefit — roughly 60bp of portfolio volatility for a 10% combined allocation, which allocators can weigh against tracking error and carry.", "quote": null, "locator": "Charts 16 & 17: Gold and commodities can reduce total portfolio risk", "quote_verified": false}, {"claim": "Over 20 years to 30 June 2026 a 5% gold sleeve lifted annualised returns from 7.8% to 7.9%, cut volatility from 11.8% to 11.3%, raised reward-to-risk from 66.2% to 70.2% and shrank maximum drawdown from -41.0% to -38.6%.", "speaker": "World Gold Council", "type": "data_point", "entities": ["gold", "institutional portfolio", "maximum drawdown"], "conviction": "high", "so_what": "Notice the return uplift is only ~10bp over 20 years — the honest case for 5% gold is drawdown and volatility reduction, not return enhancement.", "quote": null, "locator": "Table 2: Gold has increased returns while reducing volatility and maximum drawdowns", "quote_verified": false}, {"claim": "The gold benefit is much larger over the most recent three years: a 5% gold sleeve raised annualised returns from 15.4% to 16.2% and reward-to-risk from 155.9% to 167.6%, versus a 10bp return uplift over 20 years.", "speaker": "World Gold Council", "type": "data_point", "entities": ["gold", "institutional portfolio"], "conviction": "medium", "so_what": "Much of the headline case is driven by the recent gold bull run — a caution against extrapolating the 3-year numbers into forward expectations.", "quote": null, "locator": "Table 2: Gold has increased returns while reducing volatility and maximum drawdowns", "quote_verified": false}]}, {"theme": "Four-regime macro framework", "insights": [{"claim": "The WGC frames the macro environment in four regimes defined by the direction of bond yields and corporate credit spreads: 'QE-style goldilocks', 'Fear of the Fed', 'Recovery' and 'Risk-off'.", "speaker": "World Gold Council", "type": "framework", "entities": ["bond yields", "corporate credit spreads", "Federal Reserve", "gold", "commodities"], "conviction": "high", "so_what": "A two-variable regime map (yields, spreads) that can be run live off Treasury yields and IG OAS to decide when to tilt between gold and commodities.", "quote": "The framework divides the macro environment into four phases: ‘QE-style goldilocks’, ‘Fear of the Fed’, ‘Recovery’, and ‘Risk-off’, with each phase defined by the direction of bond yields and corporate spreads", "locator": "Macro drivers", "quote_verified": true}, {"claim": "On annualised returns from June 1989 to June 2026, gold performs best in risk-off and QE-style goldilocks regimes but delivered positive returns in all four regimes, while commodities do best in recovery — resurgent growth with rising inflation and rates — and fare badly in recession.", "speaker": "World Gold Council", "type": "framework", "entities": ["gold", "commodities", "S&P GSCI", "LBMA Gold Price PM", "Bloomberg US Agg Corporate OAS"], "conviction": "high", "so_what": "Actionable rotation rule: own commodities into a growth-and-inflation recovery, own gold everywhere else, and treat gold as the only leg with no negative-return regime.", "quote": "gold provided positive returns in all regimes, providing more stable returns across cycles. Commodities, on the other hand, do best in the recovery phase", "locator": "Chart 20 discussion", "quote_verified": true}, {"claim": "The QE-style goldilocks regime — one of gold's two best environments — is also characterised by a higher equity-bond correlation.", "speaker": "World Gold Council", "type": "causal", "entities": ["gold", "equity-bond correlation", "quantitative easing"], "conviction": "medium", "so_what": "Gold's best regimes overlap with the periods when the 60/40's internal hedge breaks down, which is exactly when a third diversifier earns its keep.", "quote": "The latter is also characterised by a higher equity-bond correlation.", "locator": "Macro drivers", "quote_verified": true}, {"claim": "The concluding recommendation is that gold be held as a distinct strategic allocation, complementary to but not interchangeable with broad commodity exposure — an advocacy position from a producer-funded industry body whose charts are all sourced or co-sourced to itself.", "speaker": "World Gold Council", "type": "thesis", "entities": ["World Gold Council", "gold", "commodities", "Metals Focus"], "conviction": "high", "so_what": "Read the conclusion as a lobbying ask aimed at institutional allocators; the data are checkable but the framing and hypothetical portfolio design are chosen to favour gold.", "quote": "gold should therefore be considered a distinct portfolio allocation, complementary to – but not interchangeable with – a broad commodity exposure", "locator": "Conclusion", "quote_verified": true}]}], "insight_total": 34, "top_entities": ["gold", "World Gold Council", "Bloomberg Commodity Index", "S&P GSCI", "crude oil", "silver", "COMEX", "LBMA Gold Price", "MSCI USA Index", "S&P 500", "gold-backed ETF", "US CPI"], "source_meta": {"author": "@goldcouncil", "word_count": 4033, "paywalled": false}}]};

// YouTube-aligned hex colors for tinted insight chips (bg = color+"1a", text = color, border = color+"55").
const TYPE_HEX = {
  thesis: '#6366f1', prediction: '#0ea5e9', framework: '#8b5cf6',
  data_point: '#059669', causal: '#d97706', contrarian: '#dc2626',
  anecdote: '#64748b',
};
const CONV_HEX = { high: '#16a34a', medium: '#ca8a04', low: '#94a3b8', exploratory: '#94a3b8' };
function typeHex(t) { return TYPE_HEX[String(t || '').toLowerCase()] || '#475569'; }
function convHex(c) { return CONV_HEX[String(c || '').toLowerCase()] || '#64748b'; }

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }

// Tinted chip (YouTube style): faint bg, colored text + border.
function tintChip(text, color) {
  return `<span class="chip" style="background:${color}1a;color:${color};border-color:${color}55">${escapeHtml(text)}</span>`;
}
function tagPills(tags) {
  if (!tags || !tags.length) return '';
  return tags.map(t => `<span class="pill tag">${escapeHtml(t)}</span>`).join(' ');
}

// ---------- rendering ----------
// Insight presentation ported from the YouTube digest: type/conviction tinted
// chips, speaker as a 🗣 chip, and entities as indigo chips — all in the meta row
// directly under the claim. Quote treatment is INTENTIONALLY kept as Concepts'
// verbatim + "✓ verified" (stronger than YouTube's ≈ paraphrase wording).
function renderInsight(ins) {
  if (!ins) return '';
  const cls = 'insight' + (ins.type ? (' ' + String(ins.type).toLowerCase()) : '');
  const meta = [];
  if (ins.type) meta.push(tintChip(ins.type, typeHex(ins.type)));
  if (ins.speaker) meta.push(`<span class="chip chip-spk">🗣 ${escapeHtml(ins.speaker)}</span>`);
  if (ins.conviction) meta.push(tintChip('conviction: ' + ins.conviction, convHex(ins.conviction)));
  (ins.entities || []).slice(0, 12).forEach(e => {
    if (e) meta.push(`<span class="chip chip-ent">${escapeHtml(e)}</span>`);
  });
  let quote = '';
  if (ins.quote) {
    const v = ins.quote_verified
      ? `<span class="vmark">✓ verified</span>`
      : `<span class="vmark no">unverified</span>`;
    quote = `<div class="quote">“${escapeHtml(ins.quote)}”${v}</div>`;
  }
  const so = ins.so_what
    ? `<div class="insight-so"><span class="lbl">so what</span>${escapeHtml(ins.so_what)}</div>` : '';
  return `
    <div class="${cls}">
      <div class="insight-claim">${escapeHtml(ins.claim || '')}</div>
      <div class="insight-meta">${meta.join('')}</div>
      ${so}
      ${quote}
    </div>`;
}

function renderTheme(theme) {
  const insights = (theme.insights || []).map(renderInsight).join('');
  return `
    <div class="theme">
      <div class="theme-title">${escapeHtml(theme.theme || 'Theme')}</div>
      ${insights}
    </div>`;
}

function renderCard(card) {
  if (!card) return '';
  const meta = card.source_meta || {};
  const nameHtml = card.source_url
    ? `<a class="source-name" href="${escapeAttr(card.source_url)}" target="_blank" rel="noopener">${escapeHtml(card.source_name || '')}</a>`
    : `<span class="source-name">${escapeHtml(card.source_name || '')}</span>`;
  const subBits = [];
  if (card.published_date) subBits.push(escapeHtml(card.published_date));
  if (meta.author) subBits.push(escapeHtml(meta.author));
  if (meta.word_count) subBits.push(`${meta.word_count} words`);
  if (meta.paywalled) subBits.push('paywalled');
  const themes = (card.themes || []).map(renderTheme).join('');
  const n = card.insight_total != null ? card.insight_total
            : (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
  return `
    <div class="source">
      <div class="source-head" onclick="toggleSource(this)">
        <div class="source-meta-left">
          <div class="source-name-row">${nameHtml}</div>
          <div class="source-title">${escapeHtml(card.title || '')}</div>
          <div class="source-sub">${subBits.join('  ·  ')}</div>
        </div>
        <span class="source-count">${n} insight${n === 1 ? '' : 's'}</span>
        <span class="source-arrow">▸</span>
      </div>
      <div class="source-body">
        ${card.gist ? `<div class="gist">${escapeHtml(card.gist)}</div>` : ''}
        ${card.tags && card.tags.length ? `<div class="tags">${tagPills(card.tags)}</div>` : ''}
        ${themes || '<div class="empty">No insights.</div>'}
      </div>
    </div>`;
}

function renderTopStats(d) {
  const s = d.stats || {};
  const parts = [];
  if (d.date) parts.push(`date <strong>${escapeHtml(d.date)}</strong>`);
  if (s.lookback_days != null) parts.push(`lookback <strong>${s.lookback_days}d</strong>`);
  if (s.sources != null) parts.push(`sources <strong>${s.sources}</strong>`);
  if (s.cards != null) parts.push(`cards <strong>${s.cards}</strong>`);
  if (s.insights != null) parts.push(`insights <strong>${s.insights}</strong>`);
  if (s.quote_verified_pct != null) parts.push(`quotes verified <strong>${s.quote_verified_pct}%</strong>`);
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSource(headEl) { headEl.parentElement.classList.toggle('open'); }

function insightCount(card) {
  return (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
}

// Build the sort/filter control bar (display only — re-groups REPORT_DATA in place).
function buildControls(d) {
  const cards = d.cards || [];
  const names = [...new Set(cards.map(c => c.source_name || '—'))].sort((a, b) => a.localeCompare(b));
  const opts = names.map(n => `<option value="${escapeAttr(n)}">${escapeHtml(n)}</option>`).join('');
  document.getElementById('controls').innerHTML =
    `<label>Sort
       <select id="sortSel">
         <option value="source">Source A–Z</option>
         <option value="insights">Insight count ▼</option>
       </select></label>
     <label>Source
       <select id="srcSel">
         <option value="__all">All sources (${names.length})</option>
         ${opts}
       </select></label>
     <span class="ctl-btns">
       <button type="button" id="expandAll">Expand all</button>
       <button type="button" id="collapseAll">Collapse all</button>
     </span>`;
  document.getElementById('sortSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('srcSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('expandAll').addEventListener('click', () => setAllGroups(false));
  document.getElementById('collapseAll').addEventListener('click', () => setAllGroups(true));
}

// Group-level collapse: header click toggles one group; the control-bar buttons toggle all.
function toggleGroup(headEl) { headEl.parentElement.classList.toggle('collapsed'); }
function setAllGroups(collapsed) {
  document.querySelectorAll('.group').forEach(g => g.classList.toggle('collapsed', collapsed));
}

// Group cards by source, sort groups (and cards within), optionally filter to one source.
function renderGroups(d) {
  const sortMode = (document.getElementById('sortSel') || {}).value || 'source';
  const srcFilter = (document.getElementById('srcSel') || {}).value || '__all';
  let cards = (d.cards || []).slice();
  if (srcFilter !== '__all') cards = cards.filter(c => (c.source_name || '—') === srcFilter);

  const groups = new Map();
  cards.forEach(c => {
    const k = c.source_name || '—';
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(c);
  });
  let entries = [...groups.entries()].map(([name, cs]) => ({
    name, cards: cs, insights: cs.reduce((a, c) => a + insightCount(c), 0),
  }));
  if (sortMode === 'insights') entries.sort((a, b) => b.insights - a.insights || a.name.localeCompare(b.name));
  else entries.sort((a, b) => a.name.localeCompare(b.name));
  // Within each source group, heaviest cards first.
  entries.forEach(e => e.cards.sort((a, b) => insightCount(b) - insightCount(a)));

  const html = entries.map(e => {
    const head = `<div class="group-head" onclick="toggleGroup(this)">`
      + `<span class="group-name">${escapeHtml(e.name)}</span>`
      + `<span class="group-meta">${e.cards.length} card${e.cards.length === 1 ? '' : 's'} · ${e.insights} insights</span>`
      + `<span class="group-arrow">▾</span></div>`;
    return `<div class="group">${head}<div class="group-body">${e.cards.map(renderCard).join('')}</div></div>`;
  }).join('');

  const app = document.getElementById('app');
  app.innerHTML = html || '<div class="empty">No cards for this source.</div>';
  // Open the first two source cards by default.
  document.querySelectorAll('.source').forEach((sec, i) => { if (i < 2) sec.classList.add('open'); });
}

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  document.getElementById('stats-top').innerHTML = renderTopStats(d);
  buildControls(d);
  renderGroups(d);   // default: grouped, sorted by source A–Z
}

renderReport(REPORT_DATA);
</script>
</body>
</html>
