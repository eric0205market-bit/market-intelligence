  idea:`Cronos stopped producing blocks Sunday after an attacker exploited Tectonic, its largest lending protocol, by pushing its own governance token TONIC up ~100x in 20 minutes, depositing it as collateral (accepted at a 20% collateral factor despite thin liquidity), and borrowing real assets against it. Tectonic held $121.7M on Aug 26; that's now ~$3M. Only ~$6M reached Ethereum before the halt.`,
  angle:`This is the third time in crypto history (after Mango Markets 2022) that a protocol accepted its own illiquid governance token as collateral and got drained by a self-inflated price — an entirely preventable, well-documented attack vector that keeps getting shipped anyway.`,
  tweetA:`Tectonic accepted its own token as collateral at 20% LTV with thin liquidity. Someone pumped it 100x in 20 minutes and borrowed real money against the fake price. This is EXACTLY the Mango Markets exploit from 2022, replayed almost mechanically, four years later.`,
  tweetB:`$121.7M in a lending protocol Tuesday. ~$3M left today. The entire Cronos chain had to stop producing blocks to contain it. "DeFi risk management" is still, in 2026, a protocol accepting its own token as collateral.`,
  charts:{count:0, hot:false, desc:"No chart in email."},
  link:"https://unchainedcrypto.com/cronos-halts-its-blockchain-after-75-million-exploit-at-lending-protocol-tectonic/" },

{ id:20, cat:"crypto", urgency:"watch", source:"Unchained Crypto", title:"Cosmos Labs Silently Patched a Bug That Let Attackers Drain 6 Chains for $5.7M",
  idea:`Cosmos Labs' post-mortem admits a researcher reported the integer-underflow bug in April, the team concluded live networks weren't at risk, and shipped a silent patch with no advisory. MANTRA (which lost $3.6M) says the eventual security release landed just 20 hours before the first attack, without disclosing what it fixed.`,
  angle:`"Silent patching" without disclosure is a governance failure pattern worth watching across the whole modular/shared-security ecosystem — a fix that isn't communicated to downstream chains isn't really a fix.`,
  tweetA:`Cosmos Labs knew about this bug in April. Patched it silently. Didn't tell downstream chains what it fixed. Six chains got drained for $5.7M starting in August. "We patched it" means nothing if the chains actually at risk don't know to check.`,
  tweetB:`MANTRA's security release landed 20 hours before the exploit hit — and STILL didn't say what it fixed. In a modular ecosystem, silent security patches are a shared-risk problem, not a private one.`,
  charts:{count:0, hot:false, desc:"No chart, GitHub post-mortem writeup."},
  link:"https://github.com/cosmos/security/blob/main/communications/cosmos_evm_GHSA-7g4w-cg88-2cq2_post_mortem.md" },

{ id:24, cat:"positioning", urgency:"deep", source:"Blind Squirrel Macro (Arcadia)", title:"Rolling EURUSD Hedges Out to 2027 Because Jackson Hole Didn't Break the Yield Downtrend",

{ id:25, cat:"macro", urgency:"act", source:"David Rosenberg", title:"Warsh Boxed Himself In — the Fed Now Has to Explain Why It ISN'T Hiking",
  idea:`Rosenberg argues Warsh's Jackson Hole remarks doubled the market-implied odds of a rate hike to ~60%, and that if the Fed doesn't hike at the next FOMC, investors will demand to know what changed since his more dovish late-July remarks — especially since the data since then has weakened, not strengthened. Market internals are rolling over even as headline indices sit near record highs.`,

{ id:26, cat:"macro", urgency:"act", source:"Peter Boockvar", title:"French 10-Year Yields Just Passed Italy's — Highest Since November 2008",
  idea:`France's 10-year yield rose to 4.16%, now ABOVE Italy's and the highest level since November 2008, dragging German 10s to a fresh 15-year high. Boockvar argues this move is driven by REAL rates, not inflation expectations — pointing to debt/deficit concerns, not Fed policy, as the actual driver of the long end globally.`,
  angle:`France trading worse than Italy on sovereign credit is a genuine regime break — Italy has been Europe's fiscal-risk punching bag for over a decade; if French paper yields more, that's core-periphery convergence happening from the wrong direction.`,
  tweetA:`French 10-year yields are now HIGHER than Italy's. Let that sink in. For over a decade, "Italian spread" was Europe's fiscal risk gauge. Now France — the EU's second-largest economy — is the one paying more to borrow. This is a core-periphery regime change, not a rounding error.`,
  tweetB:`Boockvar's point: this is REAL rates rising, not inflation expectations. That means rate hikes don't fix it — it's a debt-and-deficit repricing, and it's happening in France AND Germany (15-year yield high) at the same time. The ECB has no tool for this.`,
  charts:{count:0, hot:false, desc:"No chart in email."},
  link:"https://peterboockvar.substack.com/p/the-rate-tweaking-cycle-continues" },

{ id:27, cat:"culture", urgency:"deep", source:"ChinaTalk", title:"New Book Traces North Korea's Personality Cult to Kim Il Sung's Christian Upbringing",
  idea:`"Korean Messiah" (Jonathan Cheng, 2026) argues the DPRK's Kim personality cult has direct roots in Christian iconography and messianic structure from Kim Il Sung's own upbringing — a structural, not incidental, explanation for why North Korean state ideology reads the way it does to Western observers.`,

{ id:28, cat:"positioning", urgency:"deep", source:"Gamma Report (Kurt Saltrichter)", title:"Dealer Gamma Flipped Positive Exactly on Schedule, and CTA Positioning Spiked to a 6-Month High",
  idea:`Dealers flipped back into positive gamma with spot 17 points above the 7,695 flip line — exactly what last week's report predicted "within the week." CTAs reversed a 3-day selling streak into a 2-day buying spree, pushing the combined systematic z-score through +2, the highest reading in the 6-month window, right into Friday's NFP print.`,
  angle:`Positive gamma normally suppresses volatility (dealers buy dips, sell rips), but that mechanical dampening is now stacked on the most stretched systematic long positioning in 6 months — exactly the setup where a "disappointing print" produces an air pocket the dealer flow can't absorb.`,
  tweetA:`Dealer gamma flipped positive on schedule. CTA z-score just spiked through +2, the highest read in 6 months, right before NFP. Positive gamma dampens vol — until systematic positioning this stretched needs an unwind, and then the dampening runs out of room fast.`,
  tweetB:`The report's own framing: "little room for a disappointing print." Then the biggest print of the cycle — nonfarm payrolls — lands Friday. This is a setup, not a forecast.`,
  charts:{count:5, hot:true, desc:"Multiple embedded charts: dealer gamma dashboard, systematic z-score positioning (6-month high), vol term structure, sector momentum table, weekly expected move bands. 🔥 CHART WORTH SAVING — the systematic z-score chart alone tells the positioning story."},

{ id:29, cat:"AI/infra", urgency:"deep", source:"Gamma Report (Kurt Saltrichter)", title:"Nvidia Is Now Backstopping ~2GW of Compute Credit for One AI Lab — and Calling It Not-Circular",
  idea:`Nvidia's earnings call disclosed ~$50B invested directly into frontier AI labs, a new partnership with six infrastructure capital providers (Apollo, BlackRock, Blackstone, Brookfield, Goldman Sachs, KKR) to raise $500B+ in third-party financing for those labs, and a commitment to backstop nearly 2GW of compute for one lab's credit. Management disputed the "circular financing" label directly on the call. Separately, it called its 70% FY2028 revenue growth guide a supply number, not demand — implying unconstrained demand runs above it.`,
  angle:`Whether or not it's technically "circular," a chip vendor backstopping the credit of its own customer is a dependency that didn't exist a year ago — the interesting question isn't whether Nvidia can sell the chips, it's what happens to that $500B financing structure if one lab's revenue disappoints.`,
  tweetA:`Nvidia: sells chips to AI labs, invests $50B directly in those labs, then helps arrange $500B in THIRD-PARTY financing for them, AND personally backstops 2GW of one lab's compute credit. Management says this isn't circular financing. Read the mechanics again and decide for yourself.`,
  tweetB:`The real signal from the call wasn't the guide, it was the framing: "70% growth is a SUPPLY number, not demand." Nvidia is telling you demand is uncapped. The risk was never demand — it's whether the $500B financing scaffolding under that demand holds if one borrower stumbles.`,
  charts:{count:0, hot:false, desc:"No chart embedded for this section specifically; the underlying Nvidia earnings deck has the financing structure diagram."},
  link:"https://www.kurtaltrichter.com/p/gamma-report-8312026" },

{ id:31, cat:"regulation", urgency:"watch", source:"The Dark Side of the Boom", title:"Korea Crushed Leveraged-ETF Demand to 4% of Its Peak With One Homework Assignment",
  idea:`Leveraged ETFs tracking 2x Samsung/SK Hynix daily returns have seen trading value collapse to 4% of their June peak, on pace for their first monthly outflow, after Korean regulators required 5 days of simulated trading (via a Windows-only program, 1+ hour/day) before allowing leveraged access, effective Aug 19.`,
  angle:`This is a striking natural experiment in behavioral regulation — no ban, no price cap, just friction, and it gutted 96% of trading activity. That's a more surgical (and exportable) regulatory tool than anything US regulators have tried on retail leverage.`,
  tweetA:`Korea didn't ban leveraged ETFs. It required 5 days of mandatory simulated trading first. Volume collapsed to 4% of peak. If US regulators ever want to cool retail leverage (0DTE, meme options) without a ban fight, this is the playbook — friction beats prohibition.`,
  tweetB:`The real finding here isn't regulatory, it's behavioral: retail traders were fine taking 2x daily leverage with a few taps, but wouldn't spend 5 hours learning how it works. That gap between risk appetite and risk literacy is the actual story, not the ETF.`,
  charts:{count:0, hot:false, desc:"No chart in email; article title references a chart 'Five Days of Homework.' Charts inside — worth opening."},
  link:"https://thedarksideoftheboom.substack.com/p/nothing-kills-a-korean-get-rich-quick" },

{ id:32, cat:"venture", urgency:"deep", source:"The Founder's Corner", title:"The 'Implied Post-Money' Math on Startup Accelerators Inverts the Entire Ranking",
  idea:`Priced across 274 accelerators, a16z Speedrun's $500K for 10% implies a $5.0M valuation vs. Techstars' $20K for 5% implying just $400K — a 12x spread on the same headline comparison. Run the actual COST formula (fixed equity % × [your real valuation − the implied break-even]) at a $12M valuation instead, and Techstars costs $580K vs. Speedrun's $700K — the ranking flips entirely. 500 Global's stated $150K-for-6% deal actually nets only $112,500 after a $37,500 fee, quietly removing $625K of implied valuation from the headline number.`,
  angle:`Every "best accelerators" listicle ranks by implied post-money (a break-even number) instead of actual dollar cost at the founder's real valuation — meaning the standard advice ("go for the biggest name/check") is systematically wrong for any founder who's already good enough to be picky.`,
  tweetA:`a16z Speedrun looks 12x "better priced" than Techstars by implied valuation. Run the actual cost at a $12M valuation instead, and Techstars is CHEAPER. The entire accelerator ranking inverts once you stop comparing break-evens and start comparing what you'd actually pay.`,
  tweetB:`500 Global's deal page says $150K for 6%. You actually receive $112,500 after a $37,500 fee — deducted so quietly it never shows up in the announcement. That's $625K of implied valuation that just vanished. Read the net cash line, not the headline number, on every term sheet.`,
  charts:{count:0, hot:false, desc:"No chart; article includes a downloadable directory/calculator tool, not a chart image."},
  link:"https://www.the-founders-corner.com/p/we-priced-274-startup-accelerators" },

  tweetB:`$3,000-$6,000 of semiconductor content in every humanoid robot means this is a chip demand story wearing a labor-automation costume. Amazon's $72B savings number gets the headlines; the silicon bill of materials is the actual trade.`,

function catColor(c){ return CAT_COLORS[c] || "#999"; }

function buildFilters(){
  const catCounts = {};
  ITEMS.forEach(i => catCounts[i.cat] = (catCounts[i.cat]||0)+1);
  const catBar = document.getElementById('catFilters');
  let html = `<div class="pill active" data-catall="1" onclick="setCat('all')">All (${ITEMS.length})</div>`;
  Object.keys(catCounts).sort().forEach(c => {
    html += `<div class="pill" data-cat="${c}" onclick="setCat('${c}')">${c} (${catCounts[c]})</div>`;
  });
  catBar.innerHTML = html;

  const urgCounts = {act:0, deep:0, watch:0};
  ITEMS.forEach(i => urgCounts[i.urgency]++);
  const urgBar = document.getElementById('urgFilters');
  let uhtml = `<div class="pill active" data-urgall="1" onclick="setUrg('all')">All (${ITEMS.length})</div>`;
  Object.keys(URG_META).forEach(u => {
    uhtml += `<div class="pill" data-urg="${u}" onclick="setUrg('${u}')">${URG_META[u].emoji} ${URG_META[u].label} (${urgCounts[u]})</div>`;
  });
  urgBar.innerHTML = uhtml;
}

function setCat(c){
  activeCat = c; activeSrc = null;
  document.querySelectorAll('#catFilters .pill').forEach(p => {
    const isAll = p.hasAttribute('data-catall');
    const match = isAll ? c === 'all' : p.getAttribute('data-cat') === c;
    p.classList.toggle('active', match);
    p.style.background = match && !isAll ? catColor(c) : (match && isAll ? '#333' : '#fff');
    p.style.color = match ? '#fff' : 'var(--text)';
    p.style.borderColor = match ? 'transparent' : 'var(--border)';
  });
  render();
}
function setUrg(u){
  activeUrg = u; activeSrc = null;
  const uColors = {act:'#e24b4a', deep:'#378add', watch:'#b8860b'};
  document.querySelectorAll('#urgFilters .pill').forEach(p => {
    const isAll = p.hasAttribute('data-urgall');
    const match = isAll ? u === 'all' : p.getAttribute('data-urg') === u;
    p.classList.toggle('active', match);
    p.style.background = match ? (isAll ? '#333' : uColors[u]) : '#fff';
    p.style.color = match ? '#fff' : 'var(--text)';
    p.style.borderColor = match ? 'transparent' : 'var(--border)';
  });
  render();
}
function filterBySrc(name){
  activeCat = 'all'; activeUrg = 'all'; activeSrc = name;
  document.querySelectorAll('#catFilters .pill, #urgFilters .pill').forEach(p=>{
    const isAllCat = p.hasAttribute('data-catall');
    const isAllUrg = p.hasAttribute('data-urgall');
    p.classList.toggle('active', isAllCat || isAllUrg);
    p.style.background = (isAllCat || isAllUrg) ? '#333' : '#fff';
    p.style.color = (isAllCat || isAllUrg) ? '#fff' : 'var(--text)';
    p.style.borderColor = (isAllCat || isAllUrg) ? 'transparent' : 'var(--border)';
  });
  render(true);
}

function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}

function render(expandMatches){
  const container = document.getElementById('cards');
  let html = '';
  let shown = 0;
  ITEMS.forEach(item => {
    let visible = true;
    if(activeSrc){ visible = item.source.indexOf(activeSrc) !== -1; }
    else {
      if(activeCat !== 'all' && item.cat !== activeCat) visible = false;
      if(activeUrg !== 'all' && item.urgency !== activeUrg) visible = false;
    }
    if(!visible) return;
    shown++;
    const col = catColor(item.cat);
    const urg = URG_META[item.urgency];
    const openClass = (activeSrc) ? ' open' : '';
    const chartBadge = item.charts.count > 0 ? (item.charts.hot ? '🔥' : '📊') : '';
    html += `<div class="card${openClass}" id="card-${item.id}">
      <div class="card-head" onclick="toggleCard(${item.id})">
        <span class="idx">${String(item.id).padStart(2,'0')}</span>
        <span>${urg.emoji}</span>
        <span class="badge" style="background:${col}">${item.source.split(' (')[0]}</span>
        <span class="tag">${item.cat}</span>
        ${chartBadge ? `<span>${chartBadge}</span>` : ''}
        <span class="htitle">${item.title}</span>
      </div>
      <div class="card-body">
        <div class="label">The Idea</div>
        <div class="idea">${item.idea}</div>
        <div class="label">My Angle</div>
        <div class="angle" style="border-left:2px solid ${col}; background:${col}14;">${item.angle}</div>
        <div class="label">Tweets</div>
        <div class="tweets">
          <div class="tweet">
            <div class="twlabel" style="color:#378add;">TWEET A</div>
            <div class="txt">${item.tweetA}</div>
            <button class="copy-btn" onclick="copyTweet(${item.id},'a')">📋 Copy</button>
          </div>
          <div class="tweet">
            <div class="twlabel" style="color:#7f77dd;">TWEET B</div>
            <div class="txt">${item.tweetB}</div>
            <button class="copy-btn" onclick="copyTweet(${item.id},'b')">📋 Copy</button>
          </div>
        </div>
        <div class="charts-box${item.charts.hot ? ' hot':''}">
          ${item.charts.count > 0 ? (item.charts.hot ? '🔥 CHART WORTH SAVING — ' : '📊 ') : '— '}${item.charts.desc}
        </div>
        <div class="linkrow"><a href="${item.link}" target="_blank" rel="noopener">↗ Read full article</a></div>
      </div>
    </div>`;
  });
  container.innerHTML = html;
  document.getElementById('noresults').style.display = shown === 0 ? 'block' : 'none';
}

function buildReport(){
  const el = document.getElementById('report');
  let srcRows = META.includedSources.map(s =>
    `<div class="srcline"><span class="name" onclick="filterBySrc('${s.name.replace(/'/g,"\\'")}')">${s.name}</span><span>${s.count} item${s.count>1?'s':''}</span></div>`
  ).join('');
  let skipRows = META.skippedSources.map(s =>
    `<div class="skip"><strong>${s.name}</strong> — ${s.reason}</div>`
  ).join('');
  el.innerHTML = `<details class="report-card">
    <summary>📋 Session Report — ${META.emailsRead} of ${META.emailsInWindow} emails read, ${META.itemsExtracted} items extracted</summary>
    <div style="margin-top:12px; font-size:13px; color:var(--sub);">
      Window: <strong>${META.windowStart}</strong> → <strong>${META.windowEnd}</strong>. Emails outside this window were not processed.
    </div>
    <div class="label" style="margin-top:14px;">Included Sources (click to filter)</div>
    ${srcRows}
    <div class="label" style="margin-top:14px;">Skipped / Excluded</div>
    ${skipRows}
  </details>`;
}

document.getElementById('metaline').textContent =
  `${META.date} · ${META.time} · ${META.itemsExtracted} items from ${META.includedSources.length} sources (${META.emailsRead}/${META.emailsInWindow} emails read)`;

buildFilters();
render();
buildReport();
</script>
</body>
</html>
