<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root {
  --bg: #faf8f5;
  --surface: #ffffff;
  --border: #e8e4df;
  --border-light: #f0ede4;
  --text: #1a1a1a;
  --text-2: #555;
  --text-3: #8a8a8a;
  --accent: #2563eb;
  --accent-bg: #f0f5ff;
  --accent-2: #1d4ed8;
  --tag-text: #0e7490;
  --tag-bg: #e8f4f8;
  --yellow: #fff5b3;
  --yellow-border: #f0d966;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; line-height: 1.55;
       background: var(--bg); color: var(--text); }
.container { max-width: 960px; margin: 0 auto; padding: 24px 16px 80px; }

/* HEADER */
.header { display: flex; justify-content: space-between; align-items: baseline;
          border-bottom: 2px solid var(--accent); padding-bottom: 12px; margin-bottom: 20px; }
.title { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; color: var(--accent); }
.subtitle { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-3); }

/* FILTER BAR */
.filter-bar { display: none; background: var(--yellow); border: 1px solid var(--yellow-border);
              border-radius: 6px; padding: 8px 12px; margin-bottom: 16px;
              align-items: center; gap: 10px; font-size: 13px; }
.filter-bar.active { display: flex; }
.filter-bar button { font-family: inherit; font-size: 12px; background: transparent;
                     border: 1px solid var(--text); padding: 3px 10px; border-radius: 4px;
                     cursor: pointer; }
.filter-bar button:hover { background: rgba(0,0,0,0.05); }

/* SUMMARY */
.summary { background: var(--surface); border: 1px solid var(--border);
           border-left: 4px solid var(--accent); border-radius: 6px;
           padding: 16px 18px; margin-bottom: 20px; }
.summary p { margin-bottom: 8px; }
.summary p:last-child { margin-bottom: 0; }
.summary strong { font-weight: 600; }

/* SECTIONS (top-level collapsible) */
.section { background: var(--surface); border: 1px solid var(--border);
           border-radius: 6px; margin-bottom: 14px; overflow: hidden; }
.section-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px;
                background: var(--accent-bg); cursor: pointer; user-select: none;
                font-weight: 600; font-size: 13px; color: var(--accent-2); }
.section-head:hover { background: #e1ecff; }
.section-letter { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
                  min-width: 18px; }
.section-name { flex: 1; }
.section-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
                 color: var(--text-3); }
.section-arrow { font-size: 10px; transition: transform .2s; }
.section.open .section-arrow { transform: rotate(90deg); }
.section-body { display: none; padding: 6px 0; }
.section.open .section-body { display: block; }

/* TOPIC (nested collapsible inside Topics section) */
.topic { border-bottom: 1px solid var(--border-light); }
.topic:last-child { border-bottom: none; }
.topic-head { display: flex; align-items: center; gap: 10px; padding: 10px 16px;
              background: var(--accent-bg); cursor: pointer; user-select: none;
              font-size: 13px; font-weight: 600; color: var(--accent-2); }
.topic-head:hover { background: #e1ecff; }
.topic-name { flex: 1; }
.topic-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-3); }
.topic-arrow { font-size: 10px; transition: transform .2s; }
.topic.open .topic-arrow { transform: rotate(90deg); }
.topic-body { display: none; padding: 4px 0 6px; }
.topic.open .topic-body { display: block; }

/* ITEM CARDS */
.item-card { background: var(--surface); border: 1px solid var(--border);
             border-radius: 6px; padding: 12px 14px; margin: 10px 16px; }
.item-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
             flex-wrap: wrap; }
.item-author { font-weight: 600; color: var(--accent); cursor: pointer; }
.item-author:hover { text-decoration: underline; }
.item-time { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-3); }
.item-link { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--accent); text-decoration: none; }
.item-link:hover { text-decoration: underline; }
.item-text { font-size: 13.5px; line-height: 1.6; color: var(--text);
             white-space: pre-wrap; word-wrap: break-word; }

/* DATA POINT TAGS */
.data-points { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.dp-tag { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
          background: var(--tag-bg); color: var(--tag-text);
          padding: 2px 7px; border-radius: 4px; }

/* CHARTS (large, NOT thumbnails) */
.charts { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.chart { width: 100%; max-width: 420px; height: auto;
         border: 1px solid var(--border); border-radius: 4px; cursor: zoom-in;
         background: #f0ede4; }

/* LIGHTBOX */
.lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85);
            align-items: center; justify-content: center; z-index: 100; cursor: zoom-out; }
.lightbox.open { display: flex; }
.lightbox img { max-width: 92vw; max-height: 92vh;
                box-shadow: 0 8px 40px rgba(0,0,0,.6); }

/* LINKS */
.link-row { padding: 8px 16px; border-bottom: 1px solid var(--border-light);
            font-size: 13px; display: flex; gap: 12px; align-items: baseline; }
.link-row:last-child { border-bottom: none; }
.link-author { color: var(--text-3); min-width: 110px; cursor: pointer; }
.link-author:hover { color: var(--accent); }
.link-url { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
            color: var(--accent); text-decoration: none; word-break: break-all; flex: 1; }
.link-url:hover { text-decoration: underline; }
.link-desc { color: var(--text-2); font-size: 12px; }

/* AUTHOR FILTER STATES */
.filterable.match { background: var(--yellow); border-color: var(--yellow-border); }
.filterable.dim { opacity: 0.25; }

/* STATS BAR */
.stats { margin-top: 24px; padding: 10px 14px; background: var(--surface);
         border: 1px solid var(--border); border-radius: 6px;
         font-family: 'IBM Plex Mono', monospace; font-size: 11.5px;
         color: var(--text-2); display: flex; gap: 18px; flex-wrap: wrap; }
.stats strong { color: var(--text); font-weight: 600; }

.empty { color: var(--text-3); font-size: 13px; padding: 14px 18px; font-style: italic; }

@media (max-width: 640px) {
  .container { padding: 16px 12px 60px; }
  .item-card { margin: 8px 10px; }
  .link-row { flex-direction: column; gap: 4px; }
  .link-author { min-width: 0; }
  .header { flex-direction: column; align-items: flex-start; gap: 4px; }
  .chart { max-width: 100%; }
}

<script>
const REPORT_DATA = {"freshness_gate": "FRESHNESS GATE PASSED.", "report_type": "TWITTER BANK RESEARCH", "collected_at": "2026-10-29T06:24:00Z", "window_days": 4, "input_stats": {"total_tweets": 120, "considered": 120, "kept": 27, "dropped": 93, "deduped": 0}, "summary": "Recurring themes: Oct 28 FOMC hold and the BofA/Goldman rate-path commentary; CTA and Nasdaq positioning; hyperscaler earnings and AI capex; Treasury positioning and starting yields.\nPer-bank counts: BofA 11, Goldman 9, Apollo/Slok 2, JPM 2, SocGen 2, Yardeni 1.\nAlso: consumer/older-cohort spending (BofAI), core PCE supply/demand split (Apollo), S&P 500 ex-Tech margins (Yardeni).\n27 research items kept of 120 considered; no duplicates found.", "by_bank_counts": {"BofA": 11, "Goldman": 9, "Apollo/Slok": 2, "JPM": 2, "SocGen": 2, "Yardeni": 1}, "banks": [{"bank": "BofA", "theme": "BofA flows, CTA positioning, Fed-hike call, earnings and consumer charts", "items": [{"author": "neilsethinew", "text": "Microsoft shares up around 2% after beating across the board and keeping cash flow in positive territory. \n\nFor the first time we also got Azure in dollars: $33.2B, up 48%, now its largest product line. That's vs. a 44%-45% company guide, ~45% consensus and a ~47% buy-side whisper (per MarketWatch), and up from 42% in the June quarter on the new, narrower definition.  \n\n▪️ Revenue $92.3B (+19%) vs. $90.7B est. (per TipRanks), $1.3B above the top of its own guide \n▪️ Adj. EPS $4.89 vs. $4.73 \n▪️ Microsoft Cloud $63.9B, growth accelerating to 30%; Microsoft 365 cloud $27.8B vs. $27.4B est. \n▪️ Operating margin 49.8%, up ~0.9 pt, even as gross margin slipped ~1.3 pts with depreciation up 44%; opex grew just 6% \n▪️ CapEx incl. finance leases $45.2B (+30%), ~$5B under StreetAccount's $50.7B, partly a shift away from leases; cash CapEx $39.4B, double a year ago \n▪️ Free cash flow $18.6B (−27%), still positive, while Alphabet burned $9B+ and Meta turned negative last week for the first time \n▪️ Commercial backlog $677B (+73% y/y) but flat vs. $678B in June \n▪️ Devices & Consumer $15.5B (−3%) but ahead of $15.05B est.; Windows OEM −22% on higher memory and storage costs (CNBC)  \n\nSo Azure supplied ~74% of the $14.6B revenue increase and is now 36% of sales vs. 29% a year ago. Ex-Azure, Microsoft grew ~7%.", "tweet_url": "https://x.com/neilsethinew/status/2115565291493068995", "images": ["https://pbs.twimg.com/media/HVv_SgRXMAA5CCU.jpg"], "created_at": "2026-10-28T22:04:05.000Z", "relayers": []}, {"author": "neilsethinew", "text": "As expected by most, the Fed held rates unchanged tihs afternoon, reiterating their commitment to bringing down inflation, but not offering a clear signal on December.\n\nThe statement remained short but upgraded the assessment of the economy to a \"strong pace\" from a \"solid\" one in September.\n\nThe committee went on to say that the the \"accumulation of more information will help the committee determine the policy stance appropriate to ensure a timely return of inflation to the committee’s 2% goal.\"\n\nThere was one big surprise, though.  I mentioned in my preview there would likely be dissents, particularly from Cleveland Fed President Hammack, who did dissent, but there was also a dissent from Governor Lisa Cook, her first dissent since becoming a Board member in 2022. As you may recall, President Trump has recently renewed efforts to remove Cook from the Fed, following an earlier effort blocked by the Supreme Court.", "tweet_url": "https://x.com/neilsethinew/status/2115510514067640396", "images": ["https://pbs.twimg.com/media/HVvNlugW4AEeAss.jpg"], "created_at": "2026-10-28T18:26:25.000Z", "relayers": []}, {"author": "neilsethinew", "text": "Into today’s FOMC, BofA’s CTA model shows while trend followers have mostly covered their long-maturity Treasury shorts, there remains a healthy amount of short-maturity shorts which could be at risk from a dovish Warsh:\n\n▪ 20- and 30-year: covering done\n▪ 7- and 10-year: inside their covering ranges, the 10-year ~1bp from finishing\n▪ 2- and 5-year: shorts still on\n\nThe 2-year in particular is highly sensitive to Fed rate expectations. Because the front end is less volatile, BofA thinks those shorts were likely larger at their peak than the long-end ones already unwound. Yields there need to fall another ~7–9bp to start covering, a level BofA calls the “key threshold for a rally extension risk.”\n\nSo an unexpectedly dovish Fed could set off a sharp move lower in front-end yields, as covering adds to the rally.", "tweet_url": "https://x.com/neilsethinew/status/2115466117607281107", "images": ["https://pbs.twimg.com/media/HVuaCfzWMAABZtL.jpg"], "created_at": "2026-10-28T15:30:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "Among the aged, 2/3rds of net wealth is held by the wealthiest 10% of households -BofAI https://t.co/kAsBkKh3lf", "tweet_url": "https://x.com/MikeZaccardi/status/2115464531874902390", "images": ["https://pbs.twimg.com/media/HVujyAWXEAAGZKO.jpg"], "created_at": "2026-10-28T15:23:42.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "BofAI: Older generations’ spending growth has slowed \n\nDiscretionary spending growth has been slower among older (Baby Boomer and Traditionalist) households despite wealth effect https://t.co/oxSYsM3XNM", "tweet_url": "https://x.com/MikeZaccardi/status/2115456304894333333", "images": ["https://pbs.twimg.com/media/HVucTC0XQAALTyA.jpg"], "created_at": "2026-10-28T14:51:01.000Z", "relayers": []}, {"author": "neilsethinew", "text": "Given the weakness in the Communications sector last week, probably not a surprise that BofA says clients sold $4.8B of Communication Services stocks, the sector's largest weekly outflow since it was created in 2018 (also the largest relative to market cap). Retail clients did about 70% of that selling. \n\nThat took the headline away from the fact that Industrials saw a 13th straight week of outflows. The longest streak in BofA's data, back to 2008, was 30 weeks in 2016.\n\nElsewhere, clients bought 7 of 11 sectors, led by Consumer Discretionary, Financials and Health Care (over $1B each).", "tweet_url": "https://x.com/neilsethinew/status/2115438434676273604", "images": ["https://pbs.twimg.com/media/HVuKZD6XQAAuQrl.jpg"], "created_at": "2026-10-28T13:40:00.000Z", "relayers": []}, {"author": "neilsethinew", "text": "BofA says regardless of whether Fed hikes, the bigger picture is the Fed has more work to do. \n\nIf the Fed holds, BofA expects hikes in December and March and seesd risks tilted toward more increases in June and possibly September 2027 if inflation stays sticky despite favorable base effects.\n\nThursday’s September PCE report is part of that case. BofA expects core PCE prices to rise 0.3% (0.35% unrounded – that is their wording), lifting the year-over-year rate a tenth to 3.1%. \n\nEven a 0.15% monthly pace for the rest of the year, roughly 1.8% annualized, would leave core PCE at 2.9% in December, where it ended 2025, so no progress over the year.", "tweet_url": "https://x.com/neilsethinew/status/2115433401427669430", "images": ["https://pbs.twimg.com/media/HVuEh4AXEAARWyC.jpg"], "created_at": "2026-10-28T13:20:00.000Z", "relayers": []}, {"author": "neilsethinew", "text": "Ahead of this week's batch of earnings a little surprisingly, misses have been getting a pass. \n\nPer BofA, companies missing EPS estimates have outperformed the S&P 500 by 0.7 percentage points the day after reporting, vs. a typical 2-point lag since 2000. \n\nFactSet finds the same: misses have fallen just 0.4% from two days before their reports through two days after, vs. a 3.1% five-year average.\n\nBeats in contrast are being rewarded at roughly normal levels (BofA +0.7 pt vs. +1.0 average; FactSet +1.3% vs. +0.9%)\n\nOverall, the average next-day move is 3.7% vs. 5.3% in 2Q.", "tweet_url": "https://x.com/neilsethinew/status/2115403201885139183", "images": ["https://pbs.twimg.com/media/HVr14DLXQAAW4gp.jpg"], "created_at": "2026-10-28T11:20:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "BofA: Supermarket inflation falls to a 1-yr+ low at 2.6% MTD YoY https://t.co/XjjuH6WdRd", "tweet_url": "https://x.com/MikeZaccardi/status/2115402196573409469", "images": ["https://pbs.twimg.com/media/HVtrFpQWQAAxbK_.png"], "created_at": "2026-10-28T11:16:00.000Z", "relayers": []}, {"author": "neilsethinew", "text": "Of the major banks, the only one I know that as of this week was still calling for a rate hike today was BofA although it's a curious call given they have \"low conviction\":\n\nAditya Bhave and team are sticking with their out-of-consensus call saying the large beat in September inflation “bolsters the case for an Oct hike,” but concedes it would be “a heavy lift,” with markets pricing only about a 10% chance and the meeting falling six days before the midterm elections. Despite its “strong conviction that the Fed should hike,” BofA says it has “only low conviction that it will,” makng the reasoning behind sticking with the call a little questionable.\n\nBofA frames the meeting as a test of Chair Kevin Warsh’s resolve to bring a “sea change” to the Fed’s forward guidance. Vice Chair Philip Jefferson and New York Fed President John Williams gave what BofA calls “heavy-handed forward guidance” that led markets to price out an October hike. \n\nWhichever way the Fed goes, BofA says Warsh’s job at the press conference will be to head off a “policy error” trade. A hike risks markets pricing in over-tightening, which BofA says could bring a large correction in risk assets and a flatter yield curve. \n\nA hold invites questions about the Fed’s inflation-fighting credibility. It also risks a repeat of the July press conference: a steeper curve, a weaker dollar and a moderate selloff in risk assets.", "tweet_url": "https://x.com/neilsethinew/status/2115398181177700856", "images": ["https://pbs.twimg.com/media/HVr0n9SXUAAmUDT.png"], "created_at": "2026-10-28T11:00:03.000Z", "relayers": []}, {"author": "neilsethinew", "text": "BofA: Ahead of Alphabet and Microsoft later today and Amazon on Thursday BofA notes consensus has the five hyperscalers (Microsoft, Amazon, Alphabet, Meta and Oracle) spending $1.11 trillion on capex in 2027, per BofA. \n\nThat’s now slightly more than the other ~495 S&P 500 companies combined ($1.09 trillion). \n\nTheir share of S&P 500 capex has climbed from 16% in 2023 to a projected 51% in 2027, and 2027 estimates are up nearly 90% this year.", "tweet_url": "https://x.com/neilsethinew/status/2115367977117761784", "images": ["https://pbs.twimg.com/media/HVr1gZeWEAAPEnr.jpg"], "created_at": "2026-10-28T09:00:02.000Z", "relayers": []}]}, {"bank": "Goldman", "theme": "Goldman charts — FOMC recap, S&P 8,700 target, CTA/Nasdaq positioning, tightening cycles, trade and capex data", "items": [{"author": "MikeZaccardi", "text": "GS... October FOMC Recap: Sticking to an Every-Other-Meeting Pace.. Cook and Hammack Dissent Preferring a 25bp Hike... a summary https://t.co/zAA3OnoKg5", "tweet_url": "https://x.com/MikeZaccardi/status/2115585957508350035", "images": ["https://pbs.twimg.com/media/HVwSN6VW4AAMEGm.png"], "created_at": "2026-10-28T23:26:12.000Z", "relayers": []}, {"author": "neilsethinew", "text": "ZH: \"According to the latest CFTC data, Nasdaq non-dealer net positioning hit a new nominal high in the week through October 20, as non-dealers bought $9.5 billion of futures while the index slid 3.5%. That was the third straight week of buying, for a cumulative $21.8 billion since September 29.\n\n\"That is the main finding of a note published this morning by Goldman futures trader Robert Quinn (available to pro subs), and his conclusion is about as blunt as desk notes get: length remains elevated heading into more megacap tech results, and if Amazon, Microsoft, and Alphabet 'fail to impress, meaningful futures selling could ensue.'\"\n\nhttps://t.co/YLZbiBAC6Y", "tweet_url": "https://x.com/neilsethinew/status/2115495057096908839", "images": ["https://pbs.twimg.com/media/HVux16HWYAArKz6.png"], "created_at": "2026-10-28T17:25:00.000Z", "relayers": []}, {"author": "neilsethinew", "text": "The surge in AI imports pushed the US goods trade deficit to $134.9B in September (est. $130.2B), the widest since March 2025 and a third straight monthly increase, per the Census Bureau’s advance report.\n\n▪️ Still exports grew +2.6% to $209.2B, the third highest on record\n▪️ Imports (which are  +2.4% to $344.1B a fresh record\n▪️ Capital goods imports, which include computers, chips and telecom gear,  +7.5% to a record $157.4B, up 77% from a year ago\n▪️ Consumer goods imports +3.1%, the most in four months, but still down 12% from a year ago\n▪️ Industrial supplies imports (incl. oil and gold) -6.0% after jumping 17.1% in August\n\nThe main story is capital goods, the category with the computers, chips and telecom gear feeding the AI buildout. The capital goods deficit is now $84.1B, up from $29.8B a year ago. Strip it out and the rest of the goods deficit is $50.8B, slightly smaller than a year ago ($52.9B).\n\nGoldman noted: \"The capital goods category has been a primary contributor to the widening trade deficit this year and has partially offset the impact of rapidly rising AI business investment on GDP growth.\"\n\nBefore today’s data, the Atlanta Fed’s GDPNow had net exports subtracting 2.86 points from Q3 GDP. The full trade balance report, with services, is out November 4.", "tweet_url": "https://x.com/neilsethinew/status/2115446713229926770", "images": ["https://pbs.twimg.com/media/HVuTiczWEAAPLRy.jpg"], "created_at": "2026-10-28T14:12:54.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "Central bank shocker... RBNZ holds at 2.75% in a surprise 4-3 vote GS https://t.co/PilkPCNtzu", "tweet_url": "https://x.com/MikeZaccardi/status/2115413384757661842", "images": ["https://pbs.twimg.com/media/HVt1Q4NXIAA_4y6.png"], "created_at": "2026-10-28T12:00:28.000Z", "relayers": []}, {"author": "neilsethinew", "text": "Goldman: Tightening cycles have historically been longer and larger than this one is expected to be, and there are a limited number of historical examples of modest hiking cycles. \n\n1997 and 2015 were cycles where the Fed hiked only once, and 1999 was the next smallest hiking cycle at 175bps of tightening. We bucket those three smallest and shortest hiking cycles (1997, 1999, and 2015) as “modest” tightening cycles and the larger and longer cycles as “other cycles” (1983, 1988, 1994, 2004, 2016, 2022). \n\nThe exhibits  show median asset performance across those categories and across the full sample in the one year before and the two years following the first Fed hike, indexed to the day of the hike, for the S&P 500, the 2-year Treasury yield, the slope of the yield curve (10y minus 2y yields), and the real trade-weighted US Dollar.\n\n-Equities tend to struggle after the first hike but recover quickly. \n\n-Both front- and long-end yields tend to rise in anticipation of the first hike. In the median, yields tend to peak locally shortly after the first hike in modest hiking cycles but continue to rise for some time in other cycles.\n\n-The curve tends to flatten into the first hike, and this flattening tends to continue after the first hike...Our rates strategists similarly noted that front-end forward yields usually peak around the end of rate hikes and after the peak in inflation is confirmed in the data and that, after the peak in forward yields, flattening tends to stop as the curve rallies in parallel.\n\n-The real trade-weighted US Dollar tends to strengthen into the first hike, but its performance afterwards has been mixed across cycles.", "tweet_url": "https://x.com/neilsethinew/status/2115413270899147159", "images": ["https://pbs.twimg.com/media/HVruMhyWYAAbxPL.jpg"], "created_at": "2026-10-28T12:00:00.000Z", "relayers": []}, {"author": "LanceRoberts", "text": "Goldman Sachs sees the S&amp;P 500 climbing to 8,700 over th y positioning according to JPM with their client survey seeing long positions \"up 6 percentage points, with neutrals dropping 4 percentage points and shorts falling 2 percentage points. \n\n\"The outright long positions are now at the greatest in a month while the net long position is the most since Sept. 8.\"", "tweet_url": "https://x.com/neilsethinew/status/2115418484834177200", "images": ["https://pbs.twimg.com/media/HVt5tanXUAAyokc.png"], "created_at": "2026-10-28T12:20:44.000Z", "relayers": []}, {"author": "dailychartbook", "text": "\"Starting yields have historically been a powerful predictor of future fixed income returns. Since 1976, starting yields have explained 89% of the variation in subsequent five-year annualized returns for the Bloomberg U.S. Aggregate\"\n\n-JPMorgan AM https://t.co/hYsO2gJ6V6", "tweet_url": "https://x.com/dailychartbook/status/2115390704461508801", "images": ["https://pbs.twimg.com/media/HVtgot-XYAAMv8r.png"], "created_at": "2026-10-28T10:30:20.000Z", "relayers": []}]}, {"bank": "SocGen", "theme": "SocGen — XMOMO cautious streak; CDS vs EPS for hyperscalers", "items": [{"author": "dailychartbook", "text": "XMOMO: \"Cautious for 7 weeks in a row; Cautious phases typically do not exceed eight weeks, as in March this year.\"\n\n-Manish Kabra,SocGen https://t.co/Ics06ydtnJ", "tweet_url": "https://x.com/dailychartbook/status/2115428160045011044", "images": ["https://pbs.twimg.com/media/HVuCs4fXIAAUM20.jpg"], "created_at": "2026-10-28T12:59:10.000Z", "relayers": []}, {"author": "dailychartbook", "text": "\"Watch CDS, not EPS. CDS and FCF (Free-cash flow) matter more than EPS for Hyperscalers' valuation multiples. A peak in CDS spreads would signal an inflection in FCF and an end to the de-rating cycle.\"\n\n-Manish Kabra, SocGen https://t.co/MfUmKgekck", "tweet_url": "https://x.com/dailychartbook/status/2115382690933264657", "images": ["https://pbs.twimg.com/media/HVtZWM2WAAAbCpE.jpg"], "created_at": "2026-10-28T09:58:30.000Z", "relayers" // ---------- helpers ----------
function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }

function renderBold(text) {
  return escapeHtml(text).replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
}

function relativeTime(iso) {
  if (!iso) return '';
  const dt = new Date(iso);
  if (isNaN(dt.getTime())) return '';
  const secs = Math.max(0, (Date.now() - dt.getTime()) / 1000);
  if (secs < 60)   return Math.floor(secs) + 's ago';
  const mins = secs / 60;
  if (mins < 60)   return Math.floor(mins) + 'm ago';
  const hrs  = mins / 60;
  if (hrs < 48)    return Math.floor(hrs) + 'h ago';
  return Math.floor(hrs / 24) + 'd ago';
}

function authorTag(name, cls = 'item-author') {
  if (!name) return '';
  return `<span class="${cls}" onclick="filterAuthor('${escapeAttr(name)}')">@${escapeHtml(name)}</span>`;
}

// ---------- rendering ----------
function renderCharts(images) {
  if (!images || !images.length) return '';
  return `<div class="charts">` + images.map(u =>
    `<img src="${escapeAttr(u)}" class="chart" loading="lazy" alt="" onclick="openLightbox('${escapeAttr(u)}')">`
  ).join('') + `</div>`;
}

function renderDataPoints(points) {
  if (!points || !points.length) return '';
  return `<div class="data-points">` + points.map(p =>
    `<span class="dp-tag">${escapeHtml(p)}</span>`
  ).join('') + `</div>`;
}

function renderRelayers(item) {
  const r = item.relayers || [];
  if (!r.length) return '';
  // gen_bank_research_report.py already puts this line into data_points.
  if ((item.data_points || []).some(p => String(p).startsWith('also carried by'))) return '';
  return `<div class="data-points"><span class="dp-tag">also carried by: ${
    r.map(a => '@' + escapeHtml(a)).join(', ')}</span></div>`;
}

function renderItem(item, preferText) {
  const author = item.author || item.author_username || '';
  const time = relativeTime(item.created_at);
  const link = item.tweet_url
    ? `<a class="item-link" href="${escapeAttr(item.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  const body = preferText ? (item.text || item.description || '')
                          : (item.description || item.text || '');
  return `
    <div class="item-card filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${authorTag(author)}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      ${body ? `<div class="item-text">${escapeHtml(body)}</div>` : ''}
      ${renderDataPoints(item.data_points)}
      ${renderRelayers(item)}
      ${renderCharts(item.images)}
    </div>`;
}

function renderTopic(topic, idx) {
  const items = (topic.items || []).map(it => renderItem(it, topic._fromBanks)).join('');
  const name = topic.topic || topic.name || `Topic ${idx + 1}`;
  return `
    <div class="topic">
      <div class="topic-head" onclick="toggleTopic(this)">
        <span class="topic-name">${escapeHtml(name)}</span>
        <span class="topic-count">${(topic.items || []).length}</span>
        <span class="topic-arrow">▸</span>
      </div>
      <div class="topic-body">${items || '<div class="empty">No items.</div>'}</div>
    </div>`;
}

function renderLink(l) {
  const author = l.author || l.author_username || '';
  const url = l.url || (l.resolved || l.tco) || '';
  return `
    <div class="link-row filterable" data-author="${escapeAttr(author).toLowerCase()}">
      ${author ? authorTag(author, 'link-author') : '<span class="link-author">—</span>'}
      <a class="link-url" href="${escapeAttr(url)}" target="_blank" rel="noopener">${escapeHtml(url)}</a>
      ${l.description ? `<span class="link-desc">${escapeHtml(l.description)}</span>` : ''}
    </div>`;
}

function renderSection(letter, name, body, count) {
  return `
    <div class="section">
      <div class="section-head" onclick="toggleSection(this)">
        <span class="section-letter">${letter}.</span>
        <span class="section-name">${escapeHtml(name)}</span>
        <span class="section-count">${count}</span>
        <span class="section-arrow">▸</span>
      </div>
      <div class="section-body">${body}</div>
    </div>`;
}

function renderSummary(text) {
  if (!text) return '';
  const paragraphs = String(text).split(/\n\n+/).filter(Boolean)
    .map(p => `<p>${renderBold(p)}</p>`).join('');
  return `<div class="summary">${paragraphs}</div>`;
}

// The bank-research routine emits `banks` [{bank, theme, items[{text,...}]}];
// older reports (and the Data template's schema) use `topics`. Render `banks`
// directly when present, else fall back to `topics`.
function reportGroups(d) {
  if (Array.isArray(d.banks) && d.banks.length) {
    return { label: 'Banks', unit: 'banks', groups: d.banks.map(b => ({
      topic: b.theme ? `${b.bank} — ${b.theme}` : (b.bank || ''),
      items: b.items || [],
      _fromBanks: true,
    })) };
  }
  return { label: 'Topics', unit: 'topics', groups: d.topics || [] };
}

function renderStats(d) {
  const parts = [];
  const cov = d.coverage || {};
  if (cov.authors_covered != null && cov.authors_total != null) {
    const pct = cov.authors_total ? (100 * cov.authors_covered / cov.authors_total) : 0;
    parts.push(`coverage <strong>${cov.authors_covered}/${cov.authors_total}</strong> (${pct.toFixed(0)}%)`);
  }
  const g = reportGroups(d);
  const topicCount = g.groups.length;
  const itemCount = g.groups.reduce((n, t) => n + (t.items || []).length, 0);
  parts.push(`${g.unit} <strong>${topicCount}</strong>`);
  parts.push(`items <strong>${itemCount}</strong>`);
  if ((d.links || []).length) parts.push(`links <strong>${d.links.length}</strong>`);
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSection(el) { el.parentElement.classList.toggle('open'); }
function toggleTopic(el)   { el.parentElement.classList.toggle('open'); }

function openLightbox(src) {
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-img').src = '';
}

let activeFilter = null;
function filterAuthor(name) {
  if (!name) return;
  activeFilter = String(name).toLowerCase();
  document.querySelectorAll('.filterable').forEach(el => {
    const a = (el.dataset.author || '').toLowerCase();
    if (a === activeFilter) { el.classList.add('match'); el.classList.remove('dim'); }
    else                    { el.classList.add('dim'); el.classList.remove('match'); }
  });
  document.getElementById('filter-name').textContent = '@' + name;
  document.getElementById('filter-bar').classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function clearFilter() {
  activeFilter = null;
  document.querySelectorAll('.filterable').forEach(el => {
    el.classList.remove('match'); el.classList.remove('dim');
  });
  document.getElementById('filter-bar').classList.remove('active');
}
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (document.getElementById('lightbox').classList.contains('open')) closeLightbox();
    else if (activeFilter) clearFilter();
  }
});

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';

  const g = reportGroups(d);
  const topicsBody = g.groups.map(renderTopic).join('')
                  || `<div class="empty">No ${g.unit}.</div>`;
  const linksBody = (d.links || []).map(renderLink).join('');

  const sections = [
    renderSummary(d.summary),
    renderSection('A', g.label, topicsBody, g.groups.length),
    linksBody ? renderSection('B', 'Link Queue', linksBody, (d.links || []).length) : '',
  ].join('');

  document.getElementById('app').innerHTML = sections || '<div class="empty">No report data.</div>';

  // Auto-open the main section and the first topic.
  document.querySelectorAll('.section').forEach((s, i) => { if (i === 0) s.classList.add('open'); });
  const firstTopic = document.querySelector('.topic');
  if (firstTopic) firstTopic.classList.add('open');

  document.getElementById('stats').innerHTML = renderStats(d);
}

renderReport(REPORT_DATA);
</script>
