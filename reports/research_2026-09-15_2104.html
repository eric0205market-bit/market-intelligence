const META = {
  date: "2026-09-15",
  time: "21:04 CEST",
  windowStart: "2026-09-15 15:04 CEST",
  windowEnd: "2026-09-15 21:04 CEST",
  emailsInWindow: 18,
  emailsRead: 18,
  itemsExtracted: 14,
  includedSources: [
    { name: "Bespoke Investment Group", count: 4 },
    { name: "Sammy's Snippets (0xSammy / Khala Research)", count: 1 },
    { name: "Robert's Inn (Goldfinger Capital)", count: 1 },
    { name: "a16z (Andreessen Horowitz)", count: 1 },
    { name: "Transformer News (Julian Gewirtz)", count: 1 },
    { name: "The Pragmatic Engineer (Gergely Orosz)", count: 1 },
    { name: "James Bulltard", count: 1 },
    { name: "Binary Breakaway", count: 1 },
    { name: "McKinsey & Company", count: 1 },
    { name: "This Week in AI (TWIAI)", count: 1 },
    { name: "Dark Side of the Boom", count: 1 }
  ],
  skippedSources: [
    { name: "Tavi Costa (Substack)", reason: "Live-stream notification email with zero sentences of content, just an upgrade-to-watch link." },
    { name: "Unchained Crypto", reason: "Administrative notice about Bits + Bips podcast migrating feeds — no analytical content." },
    { name: "McKinsey & Company", reason: "\"Winning\" video teaser — promotional announcement for a video with no specific data or framework detail in the email body." },
    { name: "Norseman Market Timing", reason: "\"BERSERKER INDEX TRADE ALERT\" — email body was empty behind the paywall, just an unsubscribe link, zero content." }
  ]
};

function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

let activeCat = "all";
let activeUrgency = "all";
let activeSrc = null;

function catColor(cat) {
  return CATEGORY_COLORS[cat] || "#888888";
}

function buildFilters() {
  const catCounts = {};
  ITEMS.forEach(function(i) { catCounts[i.cat] = (catCounts[i.cat] || 0) + 1; });
  const catBar = document.getElementById('catFilters');
  let html = '<button class="pill active" data-cat="all" onclick="setCatFilter(\'all\')">All (' + ITEMS.length + ')</button>';
  Object.keys(catCounts).sort().forEach(function(cat) {
    html += '<button class="pill" data-cat="' + cat + '" onclick="setCatFilter(\'' + cat + '\')">' + esc(cat) + ' (' + catCounts[cat] + ')</button>';
  });
  catBar.innerHTML = html;

  const urgCounts = { act: 0, deep: 0, watch: 0 };
  ITEMS.forEach(function(i) { urgCounts[i.urgency]++; });
  const urgBar = document.getElementById('urgFilters');
  let uhtml = '<button class="pill active" data-urg="all" onclick="setUrgFilter(\'all\')">All (' + ITEMS.length + ')</button>';
  uhtml += '<button class="pill" data-urg="act" onclick="setUrgFilter(\'act\')">🔴 Act Now (' + urgCounts.act + ')</button>';
  uhtml += '<button class="pill" data-urg="deep" onclick="setUrgFilter(\'deep\')">🔵 Deep (' + urgCounts.deep + ')</button>';
  uhtml += '<button class="pill" data-urg="watch" onclick="setUrgFilter(\'watch\')">🟡 Watch (' + urgCounts.watch + ')</button>';
  urgBar.innerHTML = uhtml;
}

function paintFilterActive(barId, dataAttr, value) {
  const bar = document.getElementById(barId);
  const pills = bar.querySelectorAll('.pill');
  pills.forEach(function(p) {
    const isActive = p.getAttribute(dataAttr) === value;
    p.classList.toggle('active', isActive);
    if (isActive && value !== 'all') {
      const cat = p.getAttribute('data-cat');
      p.style.background = catColor(cat);
      p.style.borderColor = catColor(cat);
    } else if (isActive && value === 'all') {
      p.style.background = '#333';
      p.style.borderColor = '#333';
    } else {
      p.style.background = 'transparent';
      p.style.borderColor = '#ccc';
      p.style.color = '#1a1a1a';
    }
  });
}

function setCatFilter(cat) {
  activeCat = cat;
  activeSrc = null;
  paintFilterActive('catFilters', 'data-cat', cat);
  collapseAll();
  render();
}

function setUrgFilter(urg) {
  activeUrgency = urg;
  activeSrc = null;
  paintFilterActive('urgFilters', 'data-urg', urg);
  collapseAll();
  render();
}

function filterBySrc(name) {
  activeCat = 'all';
  activeUrgency = 'all';
  activeSrc = name;
  paintFilterActive('catFilters', 'data-cat', 'all');
  paintFilterActive('urgFilters', 'data-urg', 'all');
  render();
  ITEMS.forEach(function(item) {
    if (item.source.indexOf(name) !== -1) {
      const card = document.getElementById('card-' + item.id);
      if (card) card.classList.add('open');
    }
  });
  window.scrollTo({ top: document.getElementById('cardContainer').offsetTop - 20, behavior: 'smooth' });
}

function collapseAll() {
  document.querySelectorAll('.card').forEach(function(c) { c.classList.remove('open'); });
}

function toggleCard(id) {
  const card = document.getElementById('card-' + id);
  card.classList.toggle('open');
}

function toggleReport() {
  const rc = document.getElementById('reportCard');
  rc.classList.toggle('open');
  document.getElementById('reportChevron').textContent = rc.classList.contains('open') ? '▾' : '▸';
}

function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}

function render() {
  const container = document.getElementById('cardContainer');
  let visibleCount = 0;
  let html = '';
  ITEMS.forEach(function(item) {
    let visible = true;
    if (activeCat !== 'all' && item.cat !== activeCat) visible = false;
    if (activeUrgency !== 'all' && item.urgency !== activeUrgency) visible = false;
    if (activeSrc && item.source.indexOf(activeSrc) === -1) visible = false;
    if (visible) visibleCount++;
    const color = catColor(item.cat);
    const urgLabel = URGENCY_LABELS[item.urgency];
    const chartIcon = item.charts.hot ? '🔥' : (item.charts.count > 0 ? '📊' : '');
    html += '<div class="card' + (visible ? '' : ' hidden') + '" id="card-' + item.id + '">';
    html += '<div class="card-header" onclick="toggleCard(' + item.id + ')">';
    html += '<span class="idx">#' + item.id + '</span>';
    html += '<span>' + urgLabel.split(' ')[0] + '</span>';
    html += '<span class="badge" style="background:' + color + '">' + esc(item.source) + '</span>';
    html += '<span class="cat-tag">' + esc(item.cat) + '</span>';
    if (chartIcon) html += '<span class="chart-icon">' + chartIcon + '</span>';
    html += '<span class="title-text">' + esc(item.title) + '</span>';
    html += '</div>';
    html += '<div class="card-body">';
    html += '<div class="section-label">The Idea</div>';
    html += '<div class="idea-text">' + esc(item.idea) + '</div>';
    html += '<div class="section-label">My Angle</div>';
    html += '<div class="angle-box" style="border-left:3px solid ' + color + '; background:' + color + '14;">' + esc(item.angle) + '</div>';
    html += '<div class="section-label">Tweets</div>';
    html += '<div class="tweets">';
    html += '<div class="tweet-box"><div class="tweet-label" style="color:#378add;">TWEET A</div><div class="tweet-text">' + esc(item.tweetA) + '</div><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button></div>';
    html += '<div class="tweet-box"><div class="tweet-label" style="color:#7f77dd;">TWEET B</div><div class="tweet-text">' + esc(item.tweetB) + '</div><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div>';
    html += '</div>';
    html += '<div class="charts-box' + (item.charts.hot ? ' hot' : '') + '">' + (item.charts.hot ? '🔥 CHART WORTH SAVING — ' : '📊 ') + esc(item.charts.desc) + ' (charts: ' + item.charts.count + ')</div>';
    html += '<a class="read-link" style="color:' + color + '" href="' + item.link + '" target="_blank">↗ Read full article</a>';
    html += '</div>';
    html += '</div>';
  });
  container.innerHTML = html;
  document.getElementById('noResults').style.display = visibleCount === 0 ? 'block' : 'none';
}

function buildReport() {
  let html = '<div><strong>Time window:</strong> ' + META.windowStart + ' → ' + META.windowEnd + '</div>';
  html += '<div style="margin-top:8px;"><strong>Emails in window:</strong> ' + META.emailsInWindow + ' &nbsp;|&nbsp; <strong>Emails read:</strong> ' + META.emailsRead + ' &nbsp;|&nbsp; <strong>Items extracted:</strong> ' + META.itemsExtracted + '</div>';
  html += '<div class="section-label" style="margin-top:14px;">Included Sources</div>';
  html += '<ul style="padding-left:18px; margin:6px 0;">';
  META.includedSources.forEach(function(s) {
    html += '<li><span class="src-link" onclick="filterBySrc(\'' + s.name.replace(/'/g, "\\'") + '\')">' + esc(s.name) + '</span> — ' + s.count + ' item' + (s.count > 1 ? 's' : '') + '</li>';
  });
  html += '</ul>';
  html += '<div class="section-label">Skipped Sources</div>';
  html += '<ul style="padding-left:18px; margin:6px 0; color:#777;">';
  META.skippedSources.forEach(function(s) {
    html += '<li><strong>' + esc(s.name) + '</strong> — ' + esc(s.reason) + '</li>';
  });
  html += '</ul>';
  document.getElementById('reportBody').innerHTML = html;
}

document.getElementById('metaLine').textContent = META.date + ' · ' + META.time + ' · ' + META.itemsExtracted + ' items from ' + META.includedSources.length + ' sources (window: ' + META.windowStart.split(' ')[1] + '–' + META.windowEnd.split(' ')[1] + ' CEST)';

buildFilters();
render();
buildReport();
</script>
