<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Twitter Alpha Intelligence</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root {
  --bg: #faf8f5;
  --surface: #ffffff;
  --border: #e8e3da;
  --border-light: #f0ede4;
  --text: #1a1a1a;
  --text-2: #555;
  --text-3: #8a8a8a;
  --accent: #1a8cd8;
  --red: #d94052;
  --yellow: #fff5b3;
  --yellow-border: #f0d966;

  /* category colors (per spec) */
  --cat-macro: #2563eb;        /* blue */
  --cat-crypto: #8b5cf6;       /* purple */
  --cat-energy: #dc2626;       /* red */
  --cat-tech: #0d9488;         /* teal */
  --cat-ai: #4f46e5;           /* indigo */
  --cat-geopolitics: #dc2626;  /* red */
  --cat-positioning: #15803d;  /* green */
  --cat-regulation: #7c3aed;   /* purple */
  --cat-society: #d97706;      /* amber */
  --cat-em: #059669;           /* green */
  --cat-default: #6b7280;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; line-height: 1.55;
       background: var(--bg); color: var(--text); }
.container { max-width: 960px; margin: 0 auto; padding: 24px 16px 80px; }

/* HEADER */
.header { display: flex; justify-content: space-between; align-items: baseline;
          border-bottom: 2px solid var(--text); padding-bottom: 12px; margin-bottom: 20px; }
.title { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
.subtitle { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-3); }

/* FILTER BAR */
.filter-bar { display: none; background: var(--yellow); border: 1px solid var(--yellow-border);
              border-radius: 6px; padding: 8px 12px; margin-bottom: 16px;
              align-items: center; gap: 10px; font-size: 13px; }
.filter-bar.active { display: flex; }
.filter-bar button { font-family: inherit; font-size: 12px; background: transparent;
                     border: 1px solid var(--text); padding: 3px 10px; border-radius: 4px;
                     cursor: pointer; }
.filter-bar button:hover { background: rgba(0,0,0,0.05); }

/* SUMMARY */
.summary { background: var(--surface); border: 1px solid var(--border);
           border-left: 4px solid var(--red); border-radius: 6px;
           padding: 16px 18px; margin-bottom: 20px; }
.summary p { margin-bottom: 8px; }
.summary p:last-child { margin-bottom: 0; }
.summary strong { font-weight: 600; }

/* SECTIONS */
.section { background: var(--surface); border: 1px solid var(--border);
           border-radius: 6px; margin-bottom: 14px; overflow: hidden; }
.section-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px;
                background: #f3efe6; cursor: pointer; user-select: none;
                font-weight: 600; font-size: 13px; }
.section-head:hover { background: #ebe6dc; }
.section-letter { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
                  color: var(--text-3); min-width: 18px; }
.section-name { flex: 1; }
.section-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
                 color: var(--text-3); }
.section-arrow { font-size: 10px; color: var(--text-3); transition: transform .2s; }
.section.open .section-arrow { transform: rotate(90deg); }
.section-body { display: none; padding: 6px 0; }
.section.open .section-body { display: block; }

/* CLUSTER (Section A) */
.cluster { padding: 14px 16px; border-bottom: 1px solid var(--border-light); }
.cluster:last-child { border-bottom: none; }
.cluster-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
                flex-wrap: wrap; }
.cluster-title { font-weight: 600; font-size: 14px; }
.cluster-desc { color: var(--text-2); font-size: 13px; margin: 0 0 10px 0; }
.cluster-items { display: flex; flex-direction: column; gap: 8px; padding-left: 10px;
                 border-left: 2px solid var(--border-light); }
.cluster-item { font-size: 13px; padding: 6px 8px; border-radius: 4px; }
.cluster-item .item-text { font-size: 13px; margin-top: 4px; }
.cluster-item .item-head { font-size: 12px; }

/* ITEM CARDS (Sections B/C/D) */
.item-card { background: var(--surface); border: 1px solid var(--border);
             border-radius: 6px; padding: 12px 14px; margin: 10px 16px; }
.item-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
             flex-wrap: wrap; }
.item-author { font-weight: 600; color: var(--accent); cursor: pointer; }
.item-author:hover { text-decoration: underline; }
.item-time { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--text-3); }
.item-link { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--accent); text-decoration: none; }
.item-link:hover { text-decoration: underline; }
.item-text { font-size: 13.5px; line-height: 1.6; color: var(--text);
             white-space: pre-wrap; word-wrap: break-word; }
.item-thread { display: inline-block; font-size: 10px; font-weight: 600;
               background: var(--border); color: var(--text-2); padding: 1px 6px;
               border-radius: 3px; text-transform: uppercase; letter-spacing: .04em; }

/* CONTRARIAN (Section C) — red left border + soft red bg */
.section-contrarian .item-card {
  border-left: 4px solid var(--red);
  background: #fdf6f7;
}

/* CATEGORY PILLS */
.pill { display: inline-block; font-family: 'IBM Plex Mono', monospace; font-size: 10px;
        font-weight: 500; padding: 2px 7px; border-radius: 3px; color: #fff;
        text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }

/* IMAGES */
.thumbs { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.thumb { height: 100px; border: 1px solid var(--border); border-radius: 4px;
         cursor: zoom-in; background: #f0ede4; }

/* LIGHTBOX */
.lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85);
            align-items: center; justify-content: center; z-index: 100; cursor: zoom-out; }
.lightbox.open { display: flex; }
.lightbox img { max-width: 92vw; max-height: 92vh;
                box-shadow: 0 8px 40px rgba(0,0,0,.6); }

/* LINKS (Section E) */
.link-row { padding: 8px 16px; border-bottom: 1px solid var(--border-light);
            font-size: 13px; display: flex; gap: 12px; align-items: baseline; }
.link-row:last-child { border-bottom: none; }
.link-author { color: var(--text-3); min-width: 110px; cursor: pointer; }
.link-author:hover { color: var(--accent); }
.link-url { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
            color: var(--accent); text-decoration: none; word-break: break-all; flex: 1; }
.link-url:hover { text-decoration: underline; }
.link-desc { color: var(--text-2); font-size: 12px; }

/* AUTHOR FILTER STATES */
.filterable.match { background: var(--yellow); border-color: var(--yellow-border); }
.section-contrarian .item-card.filterable.match { background: var(--yellow); }
.filterable.dim { opacity: 0.25; }

/* STATS BAR */
.stats { margin-top: 24px; padding: 10px 14px; background: var(--surface);
         border: 1px solid var(--border); border-radius: 6px;
         font-family: 'IBM Plex Mono', monospace; font-size: 11.5px;
         color: var(--text-2); display: flex; gap: 18px; flex-wrap: wrap; }
.stats strong { color: var(--text); font-weight: 600; }

/* EMPTY */
.empty { color: var(--text-3); font-size: 13px; padding: 14px 18px; font-style: italic; }

/* RESPONSIVE */
@media (max-width: 640px) {
  .container { padding: 16px 12px 60px; }
  .item-card { margin: 8px 10px; }
  .link-row { flex-direction: column; gap: 4px; }
  .link-author { min-width: 0; }
  .header { flex-direction: column; align-items: flex-start; gap: 4px; }
}
</style>
</head>

<script>
const REPORT_DATA = {"report_type": "TWITTER ALPHA INTELLIGENCE", "collected_at": "2026-09-03T17:21:01Z", "input_stats": {"total_tweets": 255, "unique_authors": 80, "tweets_with_images": 55, "after_noise_filter": 73}, "summary": "The **September FOMC vote** is the week's central macro question: **Jim Bianco** tallies it at 6 hold–5 hike–1 unknown with **Jay Powell** as the likely tiebreaker (no 6-6 vote since 1936), **Peter Boockvar** is skeptical Waller's dovish signal survives a hot PPI print next week, and **Dan Tapiero** calls a hike \"almost zero\" odds while targeting **BTC $100k** on a break above $85k.\n\n**Robinhood Chain** is the dominant crypto storyline — tokenized stocks are trading 7x their float in a single day and annualizing to roughly **$662M** in Robinhood revenue (Stacy Muur), but skeptics including **Haseeb Qureshi** (\"financial Jackass\"), **Crypto_McKenna** (urging profit-taking before liquidity dries up) and **MoonOverlord** warn the meme-stock-pairing mania is pure gambling dressed up as innovation.\n\nOn AI, **Gavin Baker** flags an unprecedented break in seasonality (AI usage accelerated through summer 2026 instead of slowing), rumors of **GPT-6 \"Astra/Aeon\"** circulated after a server outage hit competitors, **Bob Elliott** asks whether peak AI expectations are now behind the market, and energy is emerging as the consensus bottleneck for AI buildout (Thiel/Musk, via Crypto_McKenna).\n\nMacro data was mixed: ISM services beat on the headline (**Mohamed El-Erian**) with prices paid at a four-year high, but the employment subcomponent stayed below 50 (**Ed Bradford**); several voices (**Jameson Lopp**, **Raoul Pal**, **Mel Mattison**) kept hammering the dollar-debasement/fiscal-dominance theme.\n\nOn positioning, **ZeeContrarian1** disclosed **BTDR** as a 13%-of-portfolio position on Bitcoin-mining economics, **Taiki Maeda** is doubling down on **ZEC**, and **Andy Constan** reiterated he holds gold (10% of liquid net worth) as his debasement hedge but owns no BTC.\n\nUnderneath the news, **Andy Constan** also flagged a striking flow signal: leveraged-ETF market-on-close buying has collapsed from $25-30BN three months ago to $7.5BN today.", "sections": {"A_events": [{"cluster": "Robinhood Chain Mania: Tokenized Stocks, DEX Wars, and the Skeptics", "category": ["crypto", "positioning", "tech"], "items": [{"author": "thedefiedge", "summary": "Deep-dive on Robinhood Chain's tokenized-stock activity: ~$88M tokenized across 203 assets and ~97K holders traded $600M in a single day (7x the float). Some names (NVDA, SPY) see 24h DEX volume exceed total tokenized supply, memecoins are now paired directly against stock tokens ($BONER/$HIMS, $ArtificiallyInu/$NVDA), and off-hours trading lets tokenized prices drift from the real stock until Monday arbitrage catches up. Argues the real winners will be the lending markets, LP managers and options protocols built on top of the tokenized stocks, not just the issuing platforms.", "tweet_url": "https://x.com/thedefiedge/status/2095465578106429454", "images": ["https://pbs.twimg.com/media/HRRtpnca8AAXfU_.jpg"], "type": "tweet"}, {"author": "stacy_muur", "summary": "Estimates Robinhood Chain generated $12.7M in revenue over 7 days (~$662M annualized), which would be roughly 20% of Robinhood's entire Q2 2026 transaction-based revenue ($776M) — flags the numbers as speculative but the scale as potentially massive.", "tweet_url": "https://x.com/stacy_muur/status/2095546617550225444", "images": ["https://pbs.twimg.com/media/HRTgiy6aAAE6OkY.jpg"], "type": "tweet"}, {"author": "hosseeb", "summary": "On his podcast, argues Robinhood Chain's OHM-fork RWA mania is a kind of \"financial Jackass\" — the biggest thing happening in crypto right now, but destructive and unlikely to end well. Debate with co-hosts gets heated.", "tweet_url": "https://x.com/hosseeb/status/2095539969297404266", "images": [], "type": "tweet"}, {"author": "Crypto_McKenna", "summary": "Cautions that while it's fun watching young traders win on Robinhood Chain, liquidity dries up fast on any down-swing and there isn't enough depth to let multi-seven-figure winners all cash out — advises being first in/first out and expects some of these names to become excellent shorts by year-end.", "tweet_url": "https://x.com/Crypto_McKenna/status/2095525267020140858", "images": [], "type": "tweet"}, {"author": "MoonOverlord", "summary": "Argues there's no real cultural difference between Solana and Robinhood Chain — both are just venues for gambling on nonsense.", "tweet_url": "https://x.com/MoonOverlord/status/2095562496946085930", "images": [], "type": "tweet"}, {"author": "zeroxkyle", "summary": "Argues against longing $HOOD purely for the Chain narrative (a 12% stock move on what's really only a ~3% top-line uptick once annualized). Prefers the more direct trade: Lighter, the decentralized perps exchange Robinhood integrated into Robinhood Chain. Followed up with a chart calling a cup-and-handle breakout on the same 'Robinhood beta' trade.", "tweet_url": "https://x.com/zeroxkyle/status/2095513466107043905", "images": ["https://pbs.twimg.com/media/HRTCIwKaYAEynzW.png"], "type": "tweet"}, {"author": "Matt_Hougan", "summary": "Notes Robinhood is expanding simultaneously upward (TradePMR, Platinum, Advisory) and outward (Robinhood Chain, social trading) — calls the pincer strategy remarkable.", "tweet_url": "https://x.com/Matt_Hougan/status/2095556625956540891", "images": [], "type": "tweet"}, {"author": "0xJeff", "summary": "Flags an emerging ve(3,3) DEX war for the 'Aerodrome of Robinhood Chain' spot between UP (classic ve(3,3)), RamsesX (multichain) and Fable (Uniswap v4 hook); RamsesX just overtook UP in volume, while Fable's TVL is growing fast ahead of its Oct 5 TGE. Discloses he's still rooting for Fable on tokenomics.", "tweet_url": "https://x.com/0xJeff/status/2095377536402460945", "images": [], "type": "tweet"}, {"author": "fejau_inc", "summary": "Pushes back on meme-coin traders complaining about 30-cent Robinhood swap fees, noting NFT gas wars used to cost $200-3,000 per mint on ETH mainnet — framed as a reminder of how much cheaper on-chain trading has gotten.", "tweet_url": "https://x.com/fejau_inc/status/2095509437939409168", "images": [], "type": "tweet"}, {"author": "Pentosh1", "summary": "Calls the current on-chain trading season the most fun since the 2020-2021 DeFi era.", "tweet_url": "https://x.com/Pentosh1/status/2095537360700342291", "images": [], "type": "tweet"}, {"author": "DefiIgnas", "summary": "Notes the USDG stablecoin launching on Robinhood is issued by Paxos, calling it a rare win for the beleaguered issuer.", "tweet_url": "https://x.com/DefiIgnas/status/2095512021227720778", "images": [], "type": "tweet"}]}, {"cluster": "Fed September Vote Count — Powell as Tiebreaker", "category": ["macro", "positioning"], "items": [{"author": "biancoresearch", "summary": "Long thread arguing Fed-watching has become vote-tallying: with Waller signaling a hold, the September 16 FOMC vote sits at 6 hold–5 hike–1 unknown, with Jay Powell (silent since May) as the likely decider — putting hike odds near 50/50. Notes there's been no 6-6 tie since 1936 (closest was 6-5 in 1963/64/73) and the Federal Reserve Act has no tie-breaking provision, so a tie would default to holding rates. In a follow-up, argues that if the actual vote isn't close (e.g. 10-2 or 12-0), it signals several voters caved to the Chairman, meaning the Fed has effectively lost its independence — which Trump would read as license to push Warsh harder for cuts. Also flagged a Waller Q&A headline: \"Warsh letting perfect be the enemy of good.\"", "tweet_url": "https://x.com/biancoresearch/status/2095538447851167772", "images": ["https://pbs.twimg.com/media/HRTX8rZbgAAU3H2.png", "https://pbs.twimg.com/media/HRTYfb1a8AAEWgb.png"], "type": "thread"}, {"author": "pboockvar", "summary": "Responding to Bianco's tally, argues Waller is playing the same expectations-management game he ran before the last meeting (threatening a hike if inflation ran hot) — this time in reverse — and is ignoring that next week's PPI print is expected at 4.7% y/y.", "tweet_url": "https://x.com/pboockvar/status/2095558433688736014", "images": [], "type": "tweet"}, {"author": "dampedspring", "summary": "Posted a chart on the market-implied odds of a Powell dissent at the September meeting.", "tweet_url": "https://x.com/dampedspring/status/2095547241775714550", "images": ["https://pbs.twimg.com/tweet_video_thumb/HRThG2tW0AQ29_O.jpg"], "type": "tweet"}, {"author": "DTAPCAP", "summary": "Calls the odds of a September hike \"almost zero,\" expects soft payrolls the next day and a cut before year-end (with CPI at 2% or 3% irrelevant to that call). Also sees USD/JPY topping with a long way to fall, and argues lower US short rates support a BTC breakout — a break above $85k gets Bitcoin to $100k \"pronto.\"", "tweet_url": "https://x.com/DTAPCAP/status/2095523510672114143", "images": ["https://pbs.twimg.com/media/HRTLhS7XMAAMk-z.jpg", "https://pbs.twimg.com/media/HRTLhm3WYAUV6WK.jpg"], "type": "tweet"}]}, {"cluster": "ISM Services: Strong Headline, Soft Labor Component", "category": ["macro"], "items": [{"author": "elerianm", "summary": "Calls the ISM Services report particularly strong both outright and versus expectations — business activity hit a six-month high, new orders climbed to a three-year-plus high, and prices paid reached a four-year peak. Employment was the lone weak subcomponent.", "tweet_url": "https://x.com/elerianm/status/2095522110437302723", "images": ["https://pbs.twimg.com/media/HRTKQDeakAEaJ-E.jpg"], "type": "tweet"}, {"author": "Fullcarry", "summary": "Flags that the ISM services employment gauge is under 50 again — the soft spot inside an otherwise strong report.", "tweet_url": "https://x.com/Fullcarry/status/2095513295163691206", "images": ["https://pbs.twimg.com/media/HRTCLgqagAAj4hw.jpg"], "type": "tweet"}]}, {"cluster": "Broadcom Wobbles Even as the AI Data-Center Buildout Narrative Holds", "category": ["tech", "AI", "macro"], "items": [{"author": "jimcramer", "summary": "Notes heavy volume pushing Broadcom dramatically lower than its after-hours print — \"someone must know something.\" Separately insists the data-center buildout theme will survive near-term wobbles, and highlights Snowflake as \"the best way for the uncertain to get compute\" versus a more nuanced Broadcom story.", "tweet_url": "https://x.com/jimcramer/status/2095455639694700894", "images": [], "type": "tweet"}, {"author": "Chartfest1", "summary": "Reacted \"Parabolic\" to a chart showing US semiconductor imports up 127.4% y/y in July, a fresh record.", "tweet_url": "https://x.com/Chartfest1/status/2095523712741113859", "images": [], "type": "tweet"}]}, {"cluster": "GPT-6 \"Astra/Aeon\" Launch Rumors", "category": ["AI", "tech"], "items": [{"author": "cryptopunk7213", "summary": "Circulated rumors that OpenAI's next model, tagged internally as gpt-6-astra / gpt-6-astra-aeon, is built for long-horizon work running for days at a time, expecting it to \"one-shot\" large amounts of white-collar work — and claims Astra itself (a still-more-powerful model) has been ready for months. Separately claimed the GPT-6 launch overwhelmed competitors' servers (Claude, Grok, Cursor briefly unusable), tying it to unverified claims the model \"broke out of containment.\" Flagged as speculative/rumor-stage, not confirmed.", "tweet_url": "https://x.com/cryptopunk7213/status/2095547669951262996", "images": [], "type": "tweet"}]}, {"cluster": "Hugging Face's $12.9B Nvidia Acquisition", "category": ["AI", "tech"], "items": [{"author": "EMostaque", "summary": "Praised Hugging Face's role in scaling Stable Diffusion and everything that followed, calling the team's open-source commitment central to that outcome, in reaction to Hugging Face's announced ~$12.93B combination with Nvidia.", "tweet_url": "https://x.com/EMostaque/status/2095549624547188825", "images": [], "type": "tweet"}]}, {"cluster": "Energy Named as the Real Bottleneck for AI Infrastructure", "category": ["AI", "energy", "tech"], "items": [{"author": "Crypto_McKenna", "summary": "Flags that Peter Thiel is now positioning around energy — not chips — as the core bottleneck to the AI infrastructure buildout, with Elon Musk voicing similar concerns; says it's worth watching over the next two years.", "tweet_url": "https://x.com/Crypto_McKenna/status/2095530603655696697", "images": ["https://pbs.twimg.com/media/HRTRo_YagAArU-V.jpg"], "type": "tweet"}]}, {"cluster": "Onchain Meme-Stock Pairing Frenzy: $BONER, $NUDES, $AUTSM", "category": ["crypto", "society"], "items": [{"author": "himgajria", "summary": "Predicts that once meme-stock-pairing instruments (like $BONER, tied to Robinhood Chain stock pairs) reach critical mass, institutions will start incorporating their \"memetic reflexivity\" into models of real-world assets — adding fuel to the fire.", "tweet_url": "https://x.com/himgajria/status/2095521995366748162", "images": [], "type": "tweet"}, {"author": "ColdBloodShill", "summary": "Argues momentum in the viral $BONER/$NUDES pairing trade tends not to reverse once established and calls $BONER \"a viral masterpiece\"; separately targets $10m market cap next for $AUTSM, and posted an $HOOD 'barbell' trade thesis pairing the memes with the stock itself.", "tweet_url": "https://x.com/ColdBloodShill/status/2095551429293310357", "images": ["https://pbs.twimg.com/media/HRTka1BaAAM1u0d.jpg", "https://pbs.twimg.com/media/HRTkznib0AEfH8f.jpg"], "type": "tweet"}, {"author": "thedefivillain", "summary": "Notes a scam coin ($AKE) trading flat after a huge multiple as a bullish signal (no organic sellers left, next move likely up); separately argues $SPX and a Solana Bonk-related token are the top performers among 'old' memes because their bullposters keep them relevant, disclosing he's positioned and up sharply.", "tweet_url": "https://x.com/thedefivillain/status/ // ---------- helpers ----------
const CAT_VARS = {
  macro: 'var(--cat-macro)',
  crypto: 'var(--cat-crypto)',
  energy: 'var(--cat-energy)',
  tech: 'var(--cat-tech)',
  ai: 'var(--cat-ai)',
  'ai/infra': 'var(--cat-ai)',
  geopolitics: 'var(--cat-geopolitics)',
  positioning: 'var(--cat-positioning)',
  regulation: 'var(--cat-regulation)',
  society: 'var(--cat-society)',
  em: 'var(--cat-em)',
};
function catColor(cat) {
  if (!cat) return 'var(--cat-default)';
  return CAT_VARS[String(cat).toLowerCase()] || 'var(--cat-default)';
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function escapeAttr(s) {
  return escapeHtml(s).replace(/`/g, '&#96;');
}

function renderBold(text) {
  return escapeHtml(text).replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
}

function relativeTime(iso) {
  if (!iso) return '';
  const dt = new Date(iso);
  if (isNaN(dt.getTime())) return '';
  const secs = Math.max(0, (Date.now() - dt.getTime()) / 1000);
  if (secs < 60)   return Math.floor(secs) + 's ago';
  const mins = secs / 60;
  if (mins < 60)   return Math.floor(mins) + 'm ago';
  const hrs  = mins / 60;
  if (hrs < 48)    return Math.floor(hrs) + 'h ago';
  return Math.floor(hrs / 24) + 'd ago';
}

function pill(cat) {
  if (!cat) return '';
  return `<span class="pill" style="background:${catColor(cat)}">${escapeHtml(cat)}</span>`;
}

function authorTag(name, cls = 'item-author') {
  if (!name) return '';
  return `<span class="${cls}" onclick="filterAuthor('${escapeAttr(name)}')">@${escapeHtml(name)}</span>`;
}

// ---------- rendering ----------
function renderThumbs(images) {
  if (!images || !images.length) return '';
  return `<div class="thumbs">` + images.map(u =>
    `<img src="${escapeAttr(u)}" class="thumb" loading="lazy" alt="" onclick="openLightbox('${escapeAttr(u)}')">`
  ).join('') + `</div>`;
}

function renderItem(item) {
  const author = item.author || item.author_username || '';
  const time = relativeTime(item.created_at);
  const thread = item.is_thread ? '<span class="item-thread">thread</span>' : '';
  const link = item.tweet_url
    ? `<a class="item-link" href="${escapeAttr(item.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  return `
    <div class="item-card filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${pill(item.category)}
        ${authorTag(author)}
        ${thread}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      <div class="item-text">${escapeHtml(item.text || '')}</div>
      ${renderThumbs(item.images)}
    </div>`;
}

function renderClusterItem(it) {
  const author = it.author || it.author_username || '';
  const time = relativeTime(it.created_at);
  const link = it.tweet_url
    ? `<a class="item-link" href="${escapeAttr(it.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  return `
    <div class="cluster-item filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${authorTag(author)}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      <div class="item-text">${escapeHtml(it.text || '')}</div>
      ${renderThumbs(it.images)}
    </div>`;
}

function renderCluster(cluster) {
  const itemsHtml = (cluster.items || []).map(renderClusterItem).join('');
  return `
    <div class="cluster">
      <div class="cluster-head">
        ${pill(cluster.category)}
        <div class="cluster-title">${escapeHtml(cluster.title || '')}</div>
      </div>
      ${cluster.description ? `<div class="cluster-desc">${escapeHtml(cluster.description)}</div>` : ''}
      ${itemsHtml ? `<div class="cluster-items">${itemsHtml}</div>` : ''}
    </div>`;
}

function renderLink(l) {
  const author = l.author || l.author_username || '';
  const url = l.url || (l.resolved || l.tco) || '';
  return `
    <div class="link-row filterable" data-author="${escapeAttr(author).toLowerCase()}">
      ${author
        ? authorTag(author, 'link-author')
        : '<span class="link-author">—</span>'}
      <a class="link-url" href="${escapeAttr(url)}" target="_blank" rel="noopener">${escapeHtml(url)}</a>
      ${l.description ? `<span class="link-desc">${escapeHtml(l.description)}</span>` : ''}
    </div>`;
}

function renderSection(letter, name, items, type) {
  if (!items || !items.length) return '';
  let body;
  if (type === 'events') {
    body = items.map(renderCluster).join('');
  } else if (type === 'links') {
    body = items.map(renderLink).join('');
  } else {
    body = items.map(renderItem).join('');
  }
  const cls = type === 'contrarian' ? 'section section-contrarian' : 'section';
  return `
    <div class="${cls}">
      <div class="section-head" onclick="toggleSection(this)">
        <span class="section-letter">${letter}.</span>
        <span class="section-name">${escapeHtml(name)}</span>
        <span class="section-count">${items.length}</span>
        <span class="section-arrow">▸</span>
      </div>
      <div class="section-body">${body}</div>
    </div>`;
}

function renderSummary(text) {
  if (!text) return '';
  const paragraphs = String(text).split(/\n\n+/).filter(Boolean)
    .map(p => `<p>${renderBold(p)}</p>`).join('');
  return `<div class="summary">${paragraphs}</div>`;
}

function renderStats(d) {
  const s = (d && d.stats) || d || {};
  const parts = [];
  if (s.received    != null) parts.push(`received <strong>${s.received}</strong>`);
  if (s.after_filter!= null) parts.push(`after filter <strong>${s.after_filter}</strong>`);
  if (s.authors     != null) parts.push(`authors <strong>${s.authors}</strong>`);
  if (s.coverage    != null) {
    const pct = (s.coverage <= 1 ? s.coverage * 100 : s.coverage);
    parts.push(`coverage <strong>${pct.toFixed(0)}%</strong>`);
  }
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSection(headEl) {
  headEl.parentElement.classList.toggle('open');
}

function openLightbox(src) {
  const img = document.getElementById('lightbox-img');
  img.src = src;
  document.getElementById('lightbox').classList.add('open');
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-img').src = '';
}

let activeFilter = null;
function filterAuthor(name) {
  if (!name) return;
  activeFilter = String(name).toLowerCase();
  document.querySelectorAll('.filterable').forEach(el => {
    const a = (el.dataset.author || '').toLowerCase();
    if (a === activeFilter) {
      el.classList.add('match');
      el.classList.remove('dim');
    } else {
      el.classList.add('dim');
      el.classList.remove('match');
    }
  });
  document.getElementById('filter-name').textContent = '@' + name;
  document.getElementById('filter-bar').classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function clearFilter() {
  activeFilter = null;
  document.querySelectorAll('.filterable').forEach(el => {
    el.classList.remove('match');
    el.classList.remove('dim');
  });
  document.getElementById('filter-bar').classList.remove('active');
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (document.getElementById('lightbox').classList.contains('open')) {
      closeLightbox();
    } else if (activeFilter) {
      clearFilter();
    }
  }
});

// ---------- schema normalization ----------
// Some producer runs emit the "sections" schema documented in the routine
// spec (report_type/input_stats/sections.A_events.../coverage) instead of
// the flat schema this renderer reads (date/events/insights/contrarian/
// positioning/links/stats). Normalize so either shape renders correctly.
function firstOf(v) {
  return Array.isArray(v) ? v[0] : v;
}

function normalizeItem(it) {
  if (!it || typeof it !== 'object') return it;
  return {
    author: it.author || it.author_username,
    text: it.text != null ? it.text : it.summary,
    category: firstOf(it.category),
    tweet_url: firstOf(it.tweet_url),
    images: it.images,
    created_at: it.created_at,
    is_thread: it.is_thread != null ? it.is_thread : (it.type === 'thread'),
  };
}

function normalizeData(d) {
  if (!d || typeof d !== 'object') return {};
  const hasFlat = d.events || d.insights || d.contrarian || d.positioning || d.links || d.stats;
  if (hasFlat) return d;

  const s = d.sections;
  if (!s) return d;

  const out = Object.assign({}, d);
  out.date = d.date || (d.collected_at ? String(d.collected_at).replace('T', ' ').replace('Z', ' UTC') : '');
  if (s.A_events) {
    out.events = s.A_events.map(cl => ({
      title: cl.cluster || cl.title,
      category: firstOf(cl.category),
      description: cl.description,
      items: (cl.items || []).map(normalizeItem),
    }));
  }
  if (s.B_insights) out.insights = s.B_insights.map(normalizeItem);
  if (s.C_contrarian) out.contrarian = s.C_contrarian.map(normalizeItem);
  if (s.D_positioning) out.positioning = s.D_positioning.map(normalizeItem);
  if (s.E_links) {
    out.links = s.E_links.map(l => ({
      author: l.author,
      url: l.url,
      tweet_url: firstOf(l.tweet_url),
      description: l.note || l.description,
    }));
  }
  const stats = d.stats || {};
  out.stats = {
    received: stats.received != null ? stats.received : (d.input_stats && d.input_stats.total_tweets),
    after_filter: stats.after_filter != null ? stats.after_filter : (d.input_stats && d.input_stats.after_noise_filter),
    authors: stats.authors != null ? stats.authors : (d.coverage && d.coverage.authors_total),
    coverage: stats.coverage != null ? stats.coverage : (d.coverage && d.coverage.coverage_pct),
  };
  return out;
}

// ---------- main ----------
function renderReport(d) {
  d = normalizeData(d);
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  const sections = [
    renderSummary(d.summary),
    renderSection('A', 'Events & Reactions',      d.events,                                'events'),
    renderSection('B', 'Alpha & Insights',        d.insights || d.alpha,                   'items'),
    renderSection('C', 'Contrarian Views',        d.contrarian,                            'contrarian'),
    renderSection('D', 'Positioning & Trade Ideas', d.positioning,                         'items'),
    renderSection('E', 'Link Queue',              d.links,                                 'links'),
  ].join('');
  const app = document.getElementById('app');
  app.innerHTML = sections || '<div class="empty">No report data.</div>';

  // Auto-open first two sections.
  document.querySelectorAll('.section').forEach((s, i) => {
    if (i < 2) s.classList.add('open');
  });

  document.getElementById('stats').innerHTML = renderStats(d);
}

renderReport(REPORT_DATA);
</script>
