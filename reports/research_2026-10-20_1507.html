<script>
const ITEMS = [{"id": 1, "cat": "AI/infra", "urgency": "deep", "source": "Jim Reid (Deutsche Bank) / The Dark Side of the Boom", "title": "AI basket +18% since Oct 29 2025, but spenders went nowhere and sellers soared", "idea": "100+ global AI stocks sorted by market cap vs performance since 29 Oct 2025. Basket +18%. Payers: MSFT c.-2%, META c.-6%, AVGO c.-15%, AMZN +9%, NVDA only +3%. Payees: SK hynix and Samsung >+100%, TSMC c.+60%, MRVL/STX/WDC further ahead.", "angle": "The AI trade split into one trade for capex payers and another for cheque cashers. Positioning is long the suppliers of the spenders' budgets.", "tweetA": "NVDA +3% in a year while Samsung doubled. The market stopped paying the cheque writer and started paying whoever cashes it. Which means the whole trade now rests on four balance sheets not blinking. $NVDA $MSFT $META", "tweetB": "Quick test of how crowded AI really is: the biggest AI spenders are flat to down over 12 months and the basket is still +18%. That return is pure second-derivative. Capex growth slows by a hair and every winner on this chart reprices.", "charts": {"count": 1, "hot": true, "desc": "Log-scale scatter of 100+ AI stocks (market cap vs perf since 29 Oct 2025) plus an unscaled second chart"}, "link": "https://thedarksideoftheboom.substack.com/p/deutsche-bank-different-ways-to-skin"}, {"id": 2, "cat": "AI/infra", "urgency": "deep", "source": "Jim Reid (Deutsche Bank) / The Dark Side of the Boom", "title": "Atoms vs bits: physical bottlenecks win, software is the menu item", "idea": "Outperformers are memory, storage, packaging, optical networking and servers. Underperformers are Adobe, Intuit, ServiceNow, Salesforce, Wix. Reid: 15 years after software ate the world, 'the menu appears to have been reversed'. Split runs through Asia: MediaTek, ASE, SK hynix up; Infosys, Wipro, HCL, Tata almost all below the line.", "angle": "Same technology, best and worst thing for two Asian export models: hardware makers vs IT services. Pair-trade framework across Taiwan/Korea vs India.", "tweetA": "Software ate the world for 15 years. AI is eating software. Infosys, Wipro, HCL and Tata sit below the line while Korean memory doubled. Same technology, opposite export models.", "tweetB": "Every bear on software said 'AI is a feature'. The tape says it's a substitute. Adobe, Intuit, ServiceNow, Salesforce all red while the hardware that runs the models doubles. $CRM $NOW $ADBE", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening"}, "link": "https://thedarksideoftheboom.substack.com/p/deutsche-bank-different-ways-to-skin"}, {"id": 3, "cat": "credit", "urgency": "deep", "source": "Jim Reid (Deutsche Bank) / The Dark Side of the Boom", "title": "Leverage casualties: Oracle, CoreWeave, Super Micro down 40-60% since Oct 29", "idea": "The names most tied to debt- or contract-funded build-outs are each down 40-60% over the period while the basket is +18%. Mega-cap capex is the revenue of nearly every infrastructure winner; Reid says the trade cracks if spending slows or returns disappoint.", "angle": "The funding structure, not the technology, decides who gets paid. Credit is the transmission mechanism for AI risk.", "tweetA": "Oracle, CoreWeave, SMCI: -40% to -60%. Same AI, same demand, different funding. The equity market already sorted AI by balance sheet; credit is still catching up. $ORCL $CRWV", "tweetB": "Everyone argues whether AI demand is real. Wrong question. The names down 40-60% have demand. They have debt. $ORCL $CRWV $SMCI", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening"}, "link": "https://thedarksideoftheboom.substack.com/p/deutsche-bank-different-ways-to-skin"}, {"id": 4, "cat": "AI/infra", "urgency": "deep", "source": "Jim Reid (Deutsche Bank) / The Dark Side of the Boom", "title": "Apple +27% and Alphabet +24%: the two mega-cap exceptions", "idea": "Apple has not joined the data-centre capex arms race and is rewarded for earnings growth without infrastructure cheques. Alphabet is both spender and demonstrable earner (first $100bn quarter, Cloud, Search, YouTube all benefiting from Gemini). Market funds big budgets when revenue growth is visible.", "angle": "Market pays for AI capex when revenue shows up at the same time; Apple is the capex-free version.", "tweetA": "The market gave Apple +27% for not spending on AI and Alphabet +24% for spending and showing the receipts. Meta spent and showed capex only: -6%. Pick your shape. $AAPL $GOOGL", "tweetB": "Alphabet is the control experiment: same capex intensity as META, opposite stock reaction. The difference is Cloud growth you can model. Disclosure beats ambition. $GOOGL $META", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening"}, "link": "https://thedarksideoftheboom.substack.com/p/deutsche-bank-different-ways-to-skin"}, {"id": 5, "cat": "science", "urgency": "watch", "source": "Citrini Research", "title": "Claude spawned 300+ sub-agents overnight and designed 211 proteins for a lab", "idea": "Citrini (non-scientists) used an internal Anthropic research model to go from idea to a lab-ready package for scorpion antivenom minibinders. 300+ concurrent GPUs, ~10,000 H100-hours, $49,997 compute, 367 messages total, only 5 human messages for the first 180 designs. Campaign ran 64 hours.", "angle": "Autonomous research loop costing less than a junior analyst's quarter. Cost curve of discovery is the signal.", "tweetA": "A newsletter with $50k and no biologists went from prompt to 211 lab-ready protein designs in 64 hours. 5 human messages to get the first 180. Drug discovery's bottleneck just moved from thinking to the wet lab.", "tweetB": "~10,000 H100-hours = $50k of compute for what used to be a funded postdoc project. Now ask who has the lab capacity to absorb this. $TWST", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening"}, "link": "https://www.citriniresearch.com/p/citrini-therapeutics"}, {"id": 6, "cat": "science", "urgency": "deep", "source": "Citrini Research", "title": "17 binders hit across 4 of 5 toxins; the single-molecule moonshot failed as Claude predicted", "idea": "35 design-toxin pairs hit, 17 passed criteria; Cn2-B1 and B2 reached low-nanomolar affinity and compete with a known antibody. Moonshot of one binder for all 5 toxins failed: of 91 designs only one qualified, only vs AaH I. Claude had warned it would likely fail. No functional blocking data yet.", "angle": "Honest scorecard of AI biology: binding is solved-ish, function is not. The model also forecast its own failure.", "tweetA": "17 working binders, zero functional proof yet. And the model told them the moonshot would fail before it ran, and it did. Calibrated failure prediction is a bigger tell than the hits.", "tweetB": "Binding is not blocking. Citrini says it plainly: no experiment has shown these stop the toxin. AI biology is fast at design and still at the speed of life for validation. Where the money is: whoever owns the validation step.", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening"}, "link": "https://www.citriniresearch.com/p/citrini-therapeutics"}, {"id": 7, "cat": "regulation", "urgency": "watch", "source": "Citrini Research", "title": "Biosecurity classifier blocked them; access to Claude Science limited to vetted institutions", "idea": "First prompt was guardrailed. Anthropic sent a 60+ question security questionnaire; Citrini ran the work in person on Anthropic's local network using an internal model more advanced than the public one. Only 'carefully-selected institutional experts' have expanded Claude Science access.", "angle": "Capability gap between internal and public models plus gated bio access. Tiered-access regime for dual-use AI is already real.", "tweetA": "There's a model most of us can't use because it designs proteins. They needed 60 security answers and a physical visit. The frontier is gated and the gate is a questionnaire.", "tweetB": "Public model: classifier-blocked. Internal model: designs binders overnight. Gap between what's released and what exists is the real AI timeline. Plan for the internal version.", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening"}, "link": "https://www.citriniresearch.com/p/citrini-therapeutics"}, {"id": 8, "cat": "venture", "urgency": "watch", "source": "Citrini Research", "title": "Twist quote: $33,750 for binding assays alone, wet lab costs on par with the compute", "idea": "Twist quote for 250 samples: $18,750 DNA synthesis, $12,500 expression/purification, $1,250 SEC, $33,750 binding measurements, $18,750 developability. Compute was $49,997. After designs were sent, 2 months went on lab turnaround. Citrini hiring healthcare/bio analysts and has a thesis: life sciences as secular story at cyclical lows. Three stocks paywalled.", "angle": "CRO/lab-services as AI-biology toll booth. Also Citrini pivoting capital to healthcare is a rotation signal out of crowded AI infra.", "tweetA": "The compute was $50k. The lab bill was about the same and took two months. Every AI-bio story ends in a CRO queue. $TWST", "tweetB": "Citrini left AI infrastructure over crowding and went looking at life sciences. When the best-known AI-infra research shop starts rotating out, note which sector they walked into.", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening"}, "link": "https://www.citriniresearch.com/p/citrini-therapeutics"}, {"id": 9, "cat": "AI/infra", "urgency": "deep", "source": "SixSigmaResearch (SixSigmaCapital)", "title": "3M gives Amazon a warrant for 3.16M shares at $164.89, vesting on $6B of optical purchases", "idea": "Amazon subsidiary gets warrant on up to 3.16M 3M shares at $164.89; 85% vest as Amazon's purchases of 3M optical connectivity and other data-center products reach $6B. 3M +5% after hours. Futures: SPX -0.27%, Nasdaq -0.75%, crude 100.02.", "angle": "Hyperscaler-equity-for-orders structure, same circular-financing template as chip deals, now reaching industrial suppliers like 3M.", "tweetA": "Amazon is paying for $6B of optical gear with warrants on the supplier's stock. The AI supply chain now has vendor financing in reverse. $MMM $AMZN", "tweetB": "3M is a 'data center play' because the customer got paid in its equity if volumes hit. Circularity has spread from GPUs to optical connectivity. $MMM", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening"}, "link": "https://sixsigmaresearch.com/"}, {"id": 10, "cat": "tech", "urgency": "deep", "source": "SixSigmaResearch (SixSigmaCapital)", "title": "Waymo to double fleet to 8,000 by year-end, 20,000 by end-2027, funded by $5B private credit", "idea": "Semafor: Waymo fleet from ~4,000 to 8,000 by year-end and 20,000 by end-2027 after raising $5B debt from private credit lenders this month.", "angle": "Autonomy capex is moving to private credit, the same pipe as data centers. Asset-backed vehicle fleets as a new credit asset class.", "tweetA": "Waymo funds a 5x fleet expansion with $5B of private credit, not equity. Robotaxis are becoming the next asset-backed trade. Who underwrites utilization? $GOOGL", "tweetB": "4,000 to 20,000 cars in 15 months. At 10x the cheque, private credit just bought a stake in autonomy before most insurers have a model for it.", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening"}, "link": "https://sixsigmaresearch.com/"}, {"id": 11, "cat": "labor", "urgency": "watch", "source": "SixSigmaResearch (SixSigmaCapital)", "title": "Qualcomm 'performance-focused reduction' starts in November; Sea launches Sea Cloud", "idea": "Qualcomm CEO Amon memo: job cuts worldwide after annual reviews, notifications from November, number undisclosed. Sea (Forrest Li): launching Sea Cloud, an AI-first enterprise cloud, and planning an IPO for fintech arm Monee.", "angle": "Layoffs framed as performance not cost. Southeast Asia gets another AI-cloud entrant while neocloud financing is wobbling.", "tweetA": "Qualcomm cutting 'on performance' after annual reviews. Third big-tech cut this quarter framed that way. AI capex is being paid for in headcount. $QCOM", "tweetB": "Sea launches an AI cloud the same week a Korean neocloud IPO breaks issue by 32%. Either contrarian or late. $SE", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening"}, "link": "https://sixsigmaresearch.com/"}, {"id": 12, "cat": "crypto", "urgency": "deep", "source": "Unchained", "title": "BlackRock files PBIT: bitcoin ETF with a ~10% loss floor, capped upside", "idea": "iShares Bitcoin Managed Protection ETF holds IBIT calls in three overlapping tranches plus cash; lower strike near 90%; upper strike caps gains. Third BlackRock BTC ETF. Effective 75 days after filing = early Jan 2027. Fee blank.", "angle": "Defined-outcome wrapper for BTC reaches the advisor channel; sells convexity from the top, buys it at the bottom.", "tweetA": "BlackRock is selling the 10% buffer and keeping the upside tax. Defined-outcome BTC is a volatility product in an ETF wrapper. The buyer is someone who wants BTC and hates drawdowns. That's a new buyer. $IBIT", "tweetB": "Third BTC ETF from BlackRock and it holds no bitcoin. It holds IBIT calls. Dealers get a steady bid on BTC vol. Watch skew. $IBIT", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening"}, "link": "https://unchainedcrypto.beehiiv.com/p/blackrock-builds-a-different-kind-of-bitcoin-etf-22f3"}, {"id": 13, "cat": "regulation", "urgency": "deep", "source": "Unchained", "title": "CFTC turns CME's own earnings call against it in the perps lawsuit", "idea": "CFTC reply brief Oct 16: CME crypto futures volume rose from 2,660,960 contracts in May to 3,282,530 in September; perps caused 'no adverse impact'. Quotes CME CEO saying it has capability to launch perps but 'has not heard demand from our customers'. CME sued in June claiming perps are swaps.", "angle": "Incumbent is blocking a product it says nobody wants. Perps in the US hinge on this.", "tweetA": "CME says it can launch perps but customers don't want them. Also says perps hurt it. Pick one. The CFTC just read both quotes into the record. $CME", "tweetB": "Volume +23% May to September while CME claims harm. If perps come to the US, offshore venues lose the one thing they own. $HOOD $COIN", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening"}, "link": "https://unchainedcrypto.beehiiv.com/p/blackrock-builds-a-different-kind-of-bitcoin-etf-22f3"}, {"id": 14, "cat": "positioning", "urgency": "deep", "source": "Unchained", "title": "Strategy lifts preferred buyback cap to $3B after $193.1M STRC week; Strive 36,818 BTC; Bitmine 4.9% of ETH", "idea": "Strategy raised buyback cap on preferred to $3B after $193.1M STRC repurchases. Strive added 4,045 BTC to 36,818 BTC with $700M SATS preferred settling Tuesday. Bitmine 6.04M ETH (~4.9% of supply), value fell to $15.1B as ETH dropped to $2,365.", "angle": "Treasury companies now fund via preferreds and defend the preferreds with buybacks. Reflexivity runs through the pref.", "tweetA": "The BTC treasury trade is now defending its own preferreds: $193M bought back STRC in a week while ETH treasury marks fall to $15.1B. Preferred markets are the new stress gauge. $MSTR", "tweetB": "Bitmine owns 4.9% of all ETH and is marking at $2,365. If it hits 5% and the price keeps sliding, a single buyer carries the float. Who is on the other side? $BMNR", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening"}, "link": "https://unchainedcrypto.beehiiv.com/p/blackrock-builds-a-different-kind-of-bitcoin-etf-22f3"}, {"id": 15, "cat": "crypto", "urgency": "watch", "source": "Unchained", "title": "Hackers still hold $287M of stolen crypto that cannot be frozen; Binance opens AI strategy agent to all", "idea": "Blockaid review of 60 exploits Jan-Aug: $287M remains monitored but unfreezable. Binance opened AI Pro agent to all users, up to 10 AI-built strategies across spot and USDS-M futures on a free tier.", "angle": "AI agent trading goes retail at the largest exchange; stolen funds liquidity as an overhang.", "tweetA": "Binance lets every user run up to 10 AI-built strategies for free. The retail flow you trade against is about to be agent-generated. $BNB", "tweetB": "$287M sitting in wallets nobody can freeze. The exploit to exit gap is the real security metric.", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening"}, "link": "https://unchainedcrypto.beehiiv.com/p/blackrock-builds-a-different-kind-of-bitcoin-etf-22f3"}, {"id": 16, "cat": "crypto", "urgency": "deep", "source": "Unchained", "title": "JPM Coin to Ethereum; Mesh-Visa spend across 175M merchant locations; Mastercard stablecoin screening", "idea": "JPMorgan brings JPM Coin deposit token to Ethereum for institutions, citing liquidity. Mesh + Visa lets users spend wallet balances at 175M merchant locations without selling. Mastercard Stablecoin Security screens payments for fraud/sanctions pre-settlement. Zerohash Auth links Robinhood, Coinbase, MetaMask, Phantom. Blockchain Association asks Treasury to narrow GENIUS Act rule.", "angle": "Big banks and card networks are building the compliance layer on public rails.", "tweetA": "JPM picks Ethereum for its deposit token, Mastercard builds the compliance layer, Visa builds the spend layer. Public chain, private rails, licensed everything. $ETH $JPM", "tweetB": "Mastercard screening stablecoin payments before they move onchain turns every stablecoin transfer into a permissioned one by default. Does that kill the point?", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening"}, "link": "https://unchainedcrypto.beehiiv.com/p/blackrock-builds-a-different-kind-of-bitcoin-etf-22f3"}, {"id": 17, "cat": "regulation", "urgency": "deep", "source": "Lucky Trader / The Morning Minute", "title": "Nine companies object to OKXICE tokenizing their shares: Verizon, Broadcom, UNH, CoreWeave, more", "idea": "Nine issuers objected to listing on OKXICE (OKX + ICE): Verizon, Broadcom, UnitedHealth, Cerebras, AppLovin, Applied Digital, Rocket Lab, CoreWeave, Applied Optoelectronics. That is 14% of 63 planned. Venue is not SEC-registered, no Reg NMS, upgradable contracts, volume capped. Nasdaq opts its own shares out. Exists because SEC 'Innovation Exemption' in September after Clarity Act died in Senate.", "angle": "Issuer consent is the unpriced bottleneck in tokenization. Companies get a vote.", "tweetA": "Every tokenized stock bull case assumed the hard part was the SEC. The hard part is the CFO who doesn't want his stock trading at 3am with no best-execution duty. 14% already opted out. $COIN $HOOD", "tweetB": "Nasdaq opts out of a rival's tokenized venue while building its own. Incumbents will tokenize on their terms, not Uniswap's. Who loses? Backed, Kraken xStocks, Robinhood Chain.", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening"}, "link": "https://luckytrader.substack.com/p/nine-blue-chip-companies-say-no-to"}, {"id": 18, "cat": "crypto", "urgency": "deep", "source": "Lucky Trader / The Morning Minute", "title": "JPMAM adds BTC to long-term forecasts: 10% base case vs 7.5% US large-cap vs 5.5% gold; BTC ETFs +$527M", "idea": "JPMorgan Asset Management included bitcoin in capital market assumptions for the first time: 10% annual vs 7.5% large-cap stocks and 5.5% gold. BTC ETFs had $527M inflows Monday (biggest in a month), ETH ETFs -$103M. BTC $81.5k, ETH $2,380. Mt. Gox trustee delayed repayment to Oct 31 2027, fourth straight one-year delay, 34,388 BTC ($2.8B) undistributed.", "angle": "CMA inclusion is the gate to model portfolios. Also removes Mt. Gox as a dated overhang.", "tweetA": "JPMAM now has a number for BTC in its 10-year forecast: 10%. Gold gets 5.5%. When the plumbing bank writes BTC into CMAs, allocators with benchmarks have a line item.", "tweetB": "Mt. Gox just pushed repayment out a fourth year. 34,388 BTC is a permanent overhang that never prints. Overhang trades die when the date keeps moving.", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening"}, "link": "https://luckytrader.substack.com/p/nine-blue-chip-companies-say-no-to"}, {"id": 19, "cat": "crypto", "urgency": "watch", "source": "Lucky Trader / The Morning Minute", "title": "Papertrade makes PAPER non-transferable because a tradable perp lets an attacker short the protocol's solvency", "idea": "Papertrade led onchain protocols in revenue ($2.5M) then said PAPER won't be transferable, uncapped, because a perp on the token would let an attacker short the protocol's own solvency. Also Pump.fun launched gacha packs ($25-$5,000), Hyperliquid Policy Center filed five recommendations on SEC Regulation Crypto Assets (airdrops, auto buybacks).", "angle": "A token design choice driven by perp-market attack vectors: tokens are collateral and instruments.", "tweetA": "Papertrade won't let its token trade because a perp would let someone short the protocol into insolvency. Token design is now adversarial market design. $HYPE", "tweetB": "Pump.fun gacha packs at $5,000 a pull. Memecoin infrastructure converges on trading card gambling.", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening"}, "link": "https://luckytrader.substack.com/p/nine-blue-chip-companies-say-no-to"}, {"id": 20, "cat": "positioning", "urgency": "deep", "source": "Compounding Quality", "title": "Akre ETF: ~50% in five stocks - Mastercard, Constellation, Brookfield, Visa, Moody's", "idea": "Akre has compounded 12.4% over 15 years. 'Three-legged stool': extraordinary business, talented management, reinvestment runway. Neff's coin-flip analogy for concentration; add to existing positions; low turnover ('a 100-bagger is a 50-bagger that doubles'). Serial acquirers: Constellation, Topicus, Lumine, Roper, Perimeter.", "angle": "Concentration is s the Anthropic IPO to be a sell-the-fact event. Cites Bianco: AI is 49% of the S&P, bigger than any sector ever except the 1880s railroads.", "angle": "Sector leadership handoff semis to energy while AI sets up for its largest supply event.", "tweetA": "The Anthropic IPO is the largest supply event for an AI asset ever, landing on a semis index with a triple top. $SMH is also losing the YTD race to $XLE. Who sells to fund the allocation?", "tweetB": "AI at 49% of S&P versus railroads in the 1880s. The last sector that big built the infrastructure and broke its owners. $SMH", "charts": {"count": 1, "hot": true, "desc": "Bianco chart of AI share of S&P vs historical sector peaks (railroads 1880s)"}, "link": "https://themarkethouse.substack.com/p/tony-greer-we-have-replaced-afghanistan"}, {"id": 23, "cat": "geopolitics", "urgency": "deep", "source": "The Market House (Tony Greer)", "title": "'We have replaced Afghanistan with Iran': forever war, empty SPR, no Venezuelan barrels", "idea": "Greer would bet 'a million dollars' on Iran as forever war, no political solution attempted. SPR is empty so oil can't be capped, Venezuelan supply he expected is not coming. Rare earths trade will suffer until oil is back near $70. 'Only game in town is energy.'", "angle": "Strategic buffers are spent. The put under oil is gone.", "tweetA": "The SPR is empty and Venezuela didn't show. Oil's shock absorbers are gone. The next supply hit has nowhere to be released from. $XLE $USO", "tweetB": "Greer: rare earths won't trade until oil is back at $70. Energy cost sets the cycle for the metals that bring us the AI build. $MP", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening"}, "link": "https://themarkethouse.substack.com/p/tony-greer-we-have-replaced-afghanistan"}, {"id": 24, "cat": "gold", "urgency": "deep", "source": "The Market House (Tony Greer)", "title": "Gold 'doing God's work': higher lows above $4,000 while tech retreats and energy rallies; bonds have bottomed", "idea": "Gold keeps making higher lows over the earlier $4,000 consolidation. Greer can't get bearish. Says bond sell-off ended: bonds rallied through a hot PPI. 'No cure for high prices like high prices': 7.5% 30-year mortgage freezes housing.", "angle": "Gold as the hedge that held the line while correlations moved.", "tweetA": "Gold is flat and everyone is annoyed at it. It made higher lows while tech sold off and oil spiked. A hedge that doesn't rally doesn't mean it's not working. $GLD", "tweetB": "Bonds rallying on a hot PPI is the signal Greer wants. Dauber says the opposite: long end sold into an equity rally. Both can't be right by Friday. $TLT", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening"}, "link": "https://themarkethouse.substack.com/p/tony-greer-we-have-replaced-afghanistan"}, {"id": 25, "cat": "energy", "urgency": "act", "source": "Peter Boockvar / The Boock Report", "title": "Nov WTI up $5 to $109; May 2027 WTI above $90 for the first time", "idea": "New cycle high for the Nov contract. 2027 contracts are also rising: May 2027 above $90 for the first time. Good for E&P and services, bad for refiner margins and consumers.", "angle": "The back of the curve is moving: it's not a spike anymore, it's a repricing.", "tweetA": "WTI front at $109 is a headline. May 2027 above $90 is the story. Front-month is a war premium; back-month above $90 is a price the market believes. $XOP $OIH", "tweetB": "If 2027 WTI is $90, then every capex budget built on $65 is wrong. Who reprices first: refiners, airlines or the Fed? $VLO $DAL", "charts": {"count": 1, "hot": true, "desc": "Chart of May 2027 WTI futures price crossing $90"}, "link": "https://peterboockvar.substack.com/p/higher-for-longercredit-vs-equity"}, {"id": 26, "cat": "credit", "urgency": "act", "source": "Peter Boockvar / The Boock Report", "title": "CoreWeave: $35B equity cap vs 5y CDS at 1,089bp implying ~55% default", "idea": "5-year CDS closed at 1,089bp (down 38bp on the day): ~$1.1M a year to hedge $10M of bonds, implying ~55% default probability, which would zero the equity. Equity cap still ~$35B. 'Who will be right?'", "angle": "Credit vs equity standoff. One of them is mispricing the same company by tens of billions.", "tweetA": "Credit says 55% default. Equity says $35B. One market is wrong by $35B. The CDS has been right in every prior neocloud cycle. $CRWV", "tweetB": "CoreWeave 2032 bonds ~80c per DB, 5y CDS ~1,089bp. Equity holders are long an option on the bond not defaulting. What is that option worth? $CRWV", "charts": {"count": 1, "hot": true, "desc": "CoreWeave 5y CDS chart"}, "link": "https://peterboockvar.substack.com/p/higher-for-longercredit-vs-equity"}, {"id": 27, "cat": "venture", "urgency": "act", "source": "Peter Boockvar / The Boock Report", "title": "Elice (Korean neocloud) priced Oct 6, listed two weeks later and fell 32%", "idea": "Priced at 90,500 won, closed at 61,500 won. Boockvar's point: a two-week gap between pricing and trading in a fast-moving tech world means pricing reflects a world that no longer exists.", "angle": "IPO mechanics are a hidden option for investors in a market that gaps; syndicate risk.", "tweetA": "Elice priced October 6 and traded October 20. A lot happened to neoclouds in between and the book didn't reprice. -32% is what a stale price looks like. $CRWV", "tweetB": "Who in South Korea funds an IPO with a 14 day gap in the neocloud tape? That's a structural flaw in market design, not just a bad deal.", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening"}, "link": "https://peterboockvar.substack.com/p/higher-for-longercredit-vs-equity"}, {"id": 28, "cat": "venture", "urgency": "act", "source": "David Rosenberg / Rosenberg Research", "title": "Korean neocloud Elice -33% on debut despite 400x oversubscription: third sign in a week that neocloud financing is closing", "idea": "Elice (data-center infrastructure) plunged as much as 33% in debut, a record decline for any Korean IPO, after 400x oversubscription. $150M deal, Kosdaq's biggest this year. Rosenberg: third piece of evidence in about a week that the market for financing neoclouds is closing.", "angle": "400x covered book breaking at the open is retail oversubscribed, institutions absent. Funding window narrowing for the AI rental layer.", "tweetA": "400x oversubscribed and still -33%. The book was retail leverage, not conviction. Add it to CoreWeave's CDS and Oracle's drawdown: the neocloud funding window is closing. $CRWV $ORCL", "tweetB": "The Kosdaq record IPO decline sits next to OpenAI's rumored $30B raise at $1.4T. Top of the AI capital stack: infinite. Bottom: shut. Mind the gap.", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening"}, "link": "https://www.earlymorningwithdave.com/p/markets-are-pushing-the-bank-of-canada"}, {"id": 29, "cat": "geopolitics", "urgency": "deep", "source": "ChinaTalk (Jordan Schneider / Nick Brown)", "title": "China imported ~90 immersion DUV systems a year in 2024-25, ~2/3 of ASML's immersion exports", "idea": "Nick Brown (CTS): ~90 systems/year, >$10B, in 2024 and 2025. 340 ASML systems now in China. The NXT:1980i supports 7nm logic and HBM2E and some HBM3 as used by Huawei Ascend. If imports continue, China could approach AI chipmaking parity within a decade.", "angle": "The 'cannonball-sized hole' in export controls: lithography is the hardest tool for China to indigenize and ASML still ships it.", "tweetA": "China bought two-thirds of ASML's immersion output in 2024-25. $10B+ of tools. Export controls on chips, open door on the machines that make chips. $ASML", "tweetB": "340 ASML tools in China. If the MATCH Act passes, the sell-off isn't ASML's China revenue. It's what the Netherlands does next. $ASML", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening"}, "link": "https://www.chinatalk.media/p/the-match-act"}, {"id": 30, "cat": "AI/infra", "urgency": "deep", "source": "ChinaTalk (Jordan Schneider / Nick Brown)", "title": "One NXT:1980i can make 100,000+ Ascend chips a year; US ~30M H100e vs China ~1M plus ~1M remote", "idea": "Compute tale of tape Oct 2026: China ~1M H100-equivalents in China, almost another 1M accessible remotely via SE Asia; US >30M, so ~10x worst case. A single NXT:1980i can produce >100k Ascend chips/yr even with poor yields. Current stockpile alone is ~1/10 of US production through 2035.", "angle": "Compute is the most governable AI input; lithography is the throttle.", "tweetA": "US 30M H100-equivalents, China about 1M, plus 1M rented in Thailand and Malaysia. One DUV tool prints 100,000 Ascends a year. The gap is closing on the manufacturing side, not the training side.", "tweetB": "Remote compute in Malaysia and Thailand is China's hidden second million. What's the sovereign risk of building data centers for a customer you can't see? $NVDA", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening"}, "link": "https://www.chinatalk.media/p/the-match-act"}, {"id": 31, "cat": "regulation", "urgency": "deep", "source": "ChinaTalk (Jordan Schneider / Nick Brown)", "title": "MATCH Act: 150-day negotiation, then unilateral BIS controls; Cymer and Gigaphoton light sources as the backdoor", "idea": "In the Senate NDAA, so decided in conference. Elevates DUV immersion to countrywide control, aligns Japan/Netherlands SME controls on SMIC and CXMT with the US. If Netherlands refuses, US and Japan can jointly block all immersion tools via light sources (Cymer in US, Gigaphoton in Japan) without FDPR. 150-day window invites stockpiling: 'tens, maybe over a hundred' systems.", "angle": "Policy catalyst in conference over the next couple of months. Winners: US/Korean chipmakers; losers: ASML China service revenue.", "tweetA": "The MATCH Act's real lever is a laser. Every immersion tool needs a Cymer or Gigaphoton light source, both US/Japan controlled. The Netherlands can say no and it won't matter. $ASML $AMAT", "tweetB": "A 150-day negotiating window is a 150-day stockpiling window. Expect ASML China orders to spike before the law lands. Q4 print is the tell. $ASML", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening"}, "link": "https://www.chinatalk.media/p/the-match-act"}, {"id": 32, "cat": "macro", "urgency": "act", "source": "Phil Dauber / Morning Musings", "title": "HY >325bp, Brent >$110, long bond selling off into an equity rally, VIX at 18: 'Nothing to see here'", "idea": "Paris café analogy. HY spreads through 325bp, Brent $110, long bond sold off while stocks rallied, Korea -4% overnight, VIX 18, S&P 1.6% off record. 10-year +6bp to 5.15% Monday. Calls: stay short HY, short Wells Fargo vs Citi, long Brent via options. Wrong if 10y <5.00% with Brent >$107.", "angle": "Credit has crossed its line before equities; stock-bond correlation at -0.40 is 2022 regime.", "tweetA": "HY through 325, Brent through 110, 10-year at 5.15%, VIX at 18. The couple at the café keeps ordering while the street burns. The credit shorts are better than equity shorts. $HYG $VIX", "tweetB": "The long bond sold off while stocks rallied. No haven bid. That's a supply tape, not a growth tape. $TLT", "charts": {"count": 2, "hot": true, "desc": "Federal net interest costs as share of GDP 1940-2026 and stock/10y correlation"}, "link": "https://phildauber.substack.com/p/nothing-to-see-here"}, {"id": 33, "cat": "energy", "urgency": "act", "source": "Phil Dauber / Morning Musings", "title": "Dated Brent $126.55 vs Dec-2027 Brent $87.71: $38.8 backwardation vs flat curve in January", "idea": "Dated Brent $126.55 on Oct 14; December 2027 at five-year high $87.71; spread $38.8 vs flat near $61 in January. Dauber: back of the curve repricing means lasting shortage, not war premium. Asian spot LNG ~$30/mmbtu (+200% vs pre-war).", "angle": "A $39 backwardation: physical scarcity, not fear. And LNG tripled.", "tweetA": "Dated Brent minus December 2027: $38.80. Eight months ago it was zero. That is not a war premium, a war premium sits in the front. The market is pricing the cure to be slow. $BNO", "tweetB": "Asian LNG at $30, tripled since the war. That is the number that hits Japanese and Korean margins first, then European winter. $TTE", "charts": {"count": 2, "hot": true, "desc": "Dated Brent vs Dec 2027 curve; Dec 2027 Brent at 5-year high; Asian LNG chart"}, "link": "https://phildauber.substack.com/p/nothing-to-see-here"}, {"id": 34, "cat": "macro", "urgency": "deep", "source": "Phil Dauber / Morning Musings", "title": "Net interest at 3.3% of GDP tops the early-90s peak; stocks and 10y correlation -0.40", "idea": "Annual federal net interest ~3.3% of GDP, above 1990s peak near 3.2% (Axios). 30-day correlation stocks vs 10y at -0.40 for most of 2026, so higher yields hurt equities as in 2022. VP Research frame: guns, butter or sound money - pick two.", "angle": "Fiscal dominance: the Fed cannot fix a supply-driven yield problem.", "tweetA": "Interest costs are 3.3% of GDP, above the 1990s peak. Stocks fall when yields rise at -0.40 correlation. The Treasury is now a swing factor for every other asset. $TLT $SPY", "tweetB": "Guns, butter, sound money - pick two. They are borrowing to avoid picking. Oil and war determine which one breaks first.", "charts": {"count": 1, "hot": false, "desc": "Federal net interest as % GDP, 1940-2026"}, "link": "https://phildauber.substack.com/p/nothing-to-see-here"}, {"id": 35, "cat": "geopolitics", "urgency": "deep", "source": "Phil Dauber / Morning Musings", "title": "Polymarket Senate odds track retail diesel ($6.30); Trump approval 31%; $8B diesel relief for farmers", "idea": "Polymarket Democratic Senate odds ~65 and retail diesel $6.30 both near highs. Trump's approval at record low 31% (Reuters). White House $8B diesel relief for farmers plus Russia sanctions waiver last week.", "angle": "Energy prices are driving the political cycle, and policy (waivers, subsidies) is reacting to the diesel price.", "tweetA": "Diesel at $6.30 and Democratic Senate odds at 65. The pump sets the odds. An $8B farm diesel subsidy and a Russia sanctions waiver in a week - policy reacting to a price, not setting one.", "tweetB": "Approval 31%, record low. Midterms are a referendum on diesel. Markets haven't priced a divided Congress with 5%+ yields. $SPY", "charts": {"count": 1, "hot": true, "desc": "Polymarket Senate odds vs retail diesel"}, "link": "https://phildauber.substack.com/p/nothing-to-see-here"}, {"id": 36, "cat": "credit", "urgency": "deep", "source": "Phil Dauber / Morning Musings", "title": "AI debt issuance ~$600B this year; Fed minutes cite AI-borrowing competition for yields +35bp", "idea": "Fed September minutes named competition for capital from AI debt issuance among reasons yields rose ~35bp between meetings on 2s-10s. AI-related debt ~$600B this year, ~40% from IG hyperscalers vs tech capex heading to ~$884B. AI names to supply more than half of S&P Q3 earnings growth.", "angle": "AI is crowding the long end. The crowded bundle: long AI cash flows, short duration, short credit stress, short inflation.", "tweetA": "The Fed minutes name AI debt issuance as a reason yields rose. $600B this year. The AI buildout is now a macro variable in the FOMC's own words. $TLT $MSFT", "tweetB": "AI supplies more than half of S&P Q3 EPS growth and 40% of its debt comes from the same hyperscalers. Concentration of earnings and of issuance. What happens to the index when one stumbles?", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening"}, "link": "https://phildauber.substack.com/p/nothing-to-see-here"}, {"id": 37, "cat": "macro", "urgency": "deep", "source": "Phil Dauber / Morning Musings", "title": "Builders' sentiment 29, lowest since June 2012; ITB -11% YTD vs SPY +13%; NY Fed services activity -20.7", "idea": "NAHB fell 3 to 29, buyer traffic 18, West 20. ITB ~-11%, XHB ~-7% vs SPY +13% YTD. Atlanta Fed affordability near 2023 lows. NY Fed services: activity -12.0 to -20.7, prices paid 70, prices received 36.3, climate -35.0.", "angle": "Stagflation print in services: activity down, prices paid at 70.", "tweetA": "NAHB at 29 is the lowest since 2012 and homebuilders are -11% on the year. NY Fed services activity -20.7 with prices paid at 70. Stagflation doesn't have to arrive in the CPI first. $ITB $XHB", "tweetB": "Housing is the first sector to price what 5.15% on the 10-year does. Everything else is still arguing about earnings. $ITB", "charts": {"count": 6, "hot": true, "desc": "NAHB regional sentiment; ITB/XHB vs SPY; Atlanta Fed affordability; NY Fed services charts"}, "link": "https://phildauber.substack.com/p/nothing-to-see-here"}, {"id": 38, "cat": "geopolitics", "urgency": "watch", "source": "Phil Dauber / Morning Musings", "title": "Japan 'months' from running out of yttrium as China squeezes rare earths; asks Washington for help", "idea": "FT via Dauber: Tokyo asked Washington for help as yttrium supply from China tightens. Also OpenAI reportedly accelerating ~$30B raise at $1.4T and Wells Fargo flagged short (10.0% CET1 thinnest of six big banks, -2.47% to 81.80).", "angle": "Critical-minerals chokepoint hits Japan's chips and ceramics. Yttrium used in coatings in semiconductor equipment.", "tweetA": "Japan is months from running out of yttrium and had to call Washington. Rare earth leverage is not hypothetical, it's an inventory count. $MP", "tweetB": "Elice -30% and OpenAI raising at $1.4T on the same morning. AI capital isn't gone, it's getting repriced by credit quality. $MSFT", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening"}, "link": "https://phildauber.substack.com/p/nothing-to-see-here"}, {"id": 39, "cat": "macro", "urgency": "deep", "source": "Capital Wars (Michael Howell)", "title": "Global liquidity declines for second week; collateral values under pressure, USD strong", "idea": "Liquidity down second consecutive week. Collateral values under pressure, strong dollar. Collateral multiplier offsetting weakness elsewhere. Volatility jumped but hasn't yet fed into collateral haircuts. Investors reducing risk assets.", "angle": "Haircuts are the next shoe: vol up without margin changes yet.", "tweetA": "Global liquidity has now fallen two weeks in a row with a strong dollar, and haircuts haven't moved yet. Margin changes lag vol by days. That's the part nobody is positioned for.", "tweetB": "Liquidity falling, DXY holding 101.50, collateral under pressure. Every liquidity cycle ends when the collateral multiplier flips. Watch repo haircuts.", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening"}, "link": "https://capitalwars.substack.com/p/global-liquidity-watch-weekly-update-e01"}, {"id": 40, "cat": "geopolitics", "urgency": "watch", "source": "Exponential View (Azeem Azhar)", "title": "Who actually won the trade war? US imports less directly from China but not necessarily less Chinese production", "idea": "Monday Data follows supply chains behind labels: direct imports from China fall but Chinese production still reaches America via third countries.", "angle": "Direct import share is a poor measure; transshipment through Vietnam and Mexico.", "tweetA": "US direct imports from China are down. Chinese-made content in US consumption isn't. The tariff scoreboard is measuring labels, not origin.", "tweetB": "If Chinese goods reach the US through third countries, Vietnam and Mexico exports are Chinese exports. Check their import data from China.", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening"}, "link": "https://www.exponentialview.co/"}, {"id": 41, "cat": "labor", "urgency": "watch", "source": "Exponential View (Azeem Azhar)", "title": "A world of many minds: ecosystem of specialized AI agents instead of one all-powerful machine", "idea": "Sunday's edition explores work organized around many kinds of AI. The future may look like an ecosystem of specialized minds rather than one superintelligence.", "angle": "Management becomes orchestration of heterogeneous agents; org design shifts.", "tweetA": "The AI-at-work story isn't one superintelligence replacing you. It's 20 specialist agents with different failure modes. Management becomes dispatch. Who trains the dispatchers?", "tweetB": "Citrini's 300 sub-agents designing proteins is the practical version of Azhar's ecosystem of minds. Specialized, parallel, disposable.", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening"}, "link": "https://www.exponentialview.co/"}, {"id": 42, "cat": "tech", "urgency": "watch", "source": "AI Supremacy (Michael Spencer)", "title": "OpenAI Dots: always-on background agents on ChatGPT Pro ($100/$200/$500 tiers), reachable by phone call and Slack", "idea": "Dots released Sept 29, powered by GPT-6 Astra, with its own cloud computer, persistent memory across ChatGPT and Slack, callable by voice. Needs Pro tiers $100/$200/$500. Compared to OpenClaw, Hermes, Grok bots. Meta's Muse spurred personal agents. Async agents are 'the new normal in 2026'.", "angle": "Distribution is ChatGPT's user base; always-on agents shift usage from sessions to continuous compute.", "tweetA": "OpenAI Dots run in the background on their own cloud computer, remember across Slack and ChatGPT, and you can phone them. Compute demand per user just moved from minutes to 24/7. $MSFT", "tweetB": "Three Pro tiers at $100/$200/$500. Agent subscriptions price near a junior employee's weekly cost at the top. Who sets the price floor?", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening"}, "link": "https://www.ai-supremacy.com/p/full-guide-to-openai-dots-2026"}, {"id": 43, "cat": "macro", "urgency": "deep", "source": "The Dark Side of the Boom (FX Daily)", "title": "The dollar now trades as an AI proxy: AI credit stress and French spreads keep DXY supported at 101.50/60", "idea": "CoreWeave 2032 bonds ~80c. DXY support 101.50/60 unless tech rolls over. Dollar is now both haven and growth currency: when AI works, capex supports USD; when AI credit wobbles, yields fall and the dollar loses premium. Moody's France review Friday. EUR/USD 1.1180-1.1270.", "angle": "Dollar correlation to AI credit. French fiscal stress an OAT trade.", "tweetA": "The dollar is now an AI-credit instrument. If tech cracks, yields drop and the dollar loses the premium that US exceptionalism gave it. The greenback is on the dance floor. $DXY $UUP", "tweetB": "Moody's reviews France on Friday and investors are already underweight OATs. A downgrade toward single-A is a euro event first. $EURUSD", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening"}, "link": "https://thedarksideoftheboom.substack.com/p/fx-daily-paint-drying-or-calm-before"}, {"id": 44, "cat": "macro", "urgency": "act", "source": "The Dark Side of the Boom (FX Daily)", "title": "BoC hike odds jump to ~21bp for next week; USD/CAD slides from 1.4300 to 1.4070", "idea": "Market priced almost nothing a few sessions ago, now ~21bp for next week as major banks shift calls. Household inflation expectations rising; ~half of firms plan to pass through energy/tariff costs. Employment weakness remains. Rosenberg titled his note the BoC hike as 'a classic policy mistake'.", "angle": "BoC hiking into job losses is the stagflation-lite template.", "tweetA": "BoC went from nothing priced to a coin-flip hike in days, with jobs falling. A central bank tightening into an energy supply shock is a policy mistake in the making. $USDCAD", "tweetB": "Sticky inflation expectations plus job losses plus a hike. Canada is the experiment for what the Fed does at 5.15% on the 10-year. $CAD", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening"}, "link": "https://thedarksideoftheboom.substack.com/p/fx-daily-paint-drying-or-calm-before"}, {"id": 45, "cat": "macro", "urgency": "deep", "source": "The Dark Side of the Boom (FX Daily)", "title": "UK payrolls +13k, almost three BoE hikes priced by March; AUD lags on AI link; KRW and TWD decouple", "idea": "UK payrolled employment +13k in September, strongest since last summer; private wage growth 3.0%. Almost three BoE hikes priced by March, cable >1.3350. AUD lagging because of tighter link to AI/China complex. Taiwan didn't hike in September, so TWD pays; KRW behaves differently.", "angle": "FX is turning idiosyncratic: one-factor trades breaking down.", "tweetA": "The Aussie dollar is an AI proxy now and it's trading like one. KRW and TWD were cousins on the chip story and now split on central bank policy. Relative value is back in FX. $AUDUSD", "tweetB": "Three BoE hikes priced by March with payrolls +13k. Sterling is strong because it has a domestic story, but the strongest part is in the price.", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening"}, "link": "https://thedarksideoftheboom.substack.com/p/fx-daily-paint-drying-or-calm-before"}, {"id": 46, "cat": "macro", "urgency": "deep", "source": "Big Moves (Big Price Moves Explained)", "title": "Cleveland-Cliffs +16%: sees >$4B 2027 EBITDA vs $2.54B consensus", "idea": "Q3 adj. EBITDA $612M vs $575M guide ($143M a year ago); Q4 guide $715M vs $683.6M. 2027 EBITDA >$4B vs Visible Alpha $2.54B (57% above). Contract resets >$1B incremental; take-or-pay minimums signed by 55-60% of customers; net leverage <2.5x by mid-2027. Auto shipments highest since Q3 2023. Stelco turning positive.", "angle": "Steel pricing power from contract resets and tariffs; domestic steel as a levered trade.", "tweetA": "Cleveland-Cliffs says 2027 EBITDA >$4B. Consensus is $2.54B. Q3 was $612M. A 57% gap is either management hubris or the sell side being stuck in 2024. Take-or-pay contracts say it's not hubris. $CLF", "tweetB": "Cliffs is now taking take-or-pay volume contracts from automakers. When the buyer commits volume, the steel cycle changes shape. Domestic steel is a tariff trade with contracts. $X $NUE", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening"}, "link": "https://bigmoves.substack.com/p/big-moves-october-19-2026"}, {"id": 47, "cat": "AI/infra", "urgency": "deep", "source": "Big Moves (Big Price Moves Explained)", "title": "Amazon +5%: TorchNeuron lets PyTorch run on Trainium with one config change; MS top pick PT $350", "idea": "Morgan Stanley top pick, PT $350 from $335, 2028 EPS +7% to ~$16.50. Amazon's TorchNeuron: PyTorch code runs on Trainium with a single configuration change, open-source, 30+ early customers (robotics, world models, voice AI). Attack on CUDA switching costs.", "angle": "Compiler-layer attack on Nvidia's moat. Hyperscaler silicon plus lower switching costs.", "tweetA": "Amazon made Trainium a one-line change from PyTorch and open-sourced it. CUDA's moat was the software cost of leaving. That cost just fell to one config line. $AMZN $NVDA", "tweetB": "Amazon is buying Nvidia GPUs and building the exit ramp from them. Both can be true because the buyer controls the pricing. $AMZN", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening"}, "link": "https://bigmoves.substack.com/p/big-moves-october-19-2026"}, {"id": 48, "cat": "culture", "urgency": "watch", "source": "Big Moves (Big Price Moves Explained)", "title": "39 years since the 1987 crash; 'sentiment max bearish' calls Black Monday; BofA flags structural advisor departures at Ameriprise", "idea": "Author's anniversary note: clients saw Paul Jones as a 'put warrant with positive carry'. Lessons promised in coming weeks. Ameriprise -4.07% after BofA downgrade citing structural advisor-team departures and retention bonuses. Con Ed, DTE, Pinnacle West slid on regulatory items.", "angle": "Anniversary framing for volatility regime; advisor-channel talent flows.", "tweetA": "Thirty-nine years since 1987. Everyone on X called Black Monday ahead of time, no one did on the actual Sunday. Crashes are never consensus the weekend before.", "tweetB": "BofA says Ameriprise advisor departures are structural. Wealth management is a talent business where the assets walk out of the door on Fridays. $AMP", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening"}, "link": "https://bigmoves.substack.com/p/big-moves-october-19-2026"}, {"id": 49, "cat": "positioning", "urgency": "deep", "source": "Macro Charts", "title": "Oversold tech bounce; sentiment 'max bearish' calling another Black Monday", "idea": "Monday saw an oversold bounce in Tech while everything else paused. Author notes X sentiment was maximally bearish with Black Monday calls, quotes 'when all the experts agree, something else happens'. Follow-up on vol, sentiment, positioning, and year-end setup.", "angle": "Sentiment extreme as a contrarian signal; positioning into year-end.", "tweetA": "Sentiment is so bearish people are quoting 1987. When every account on your feed is calling Black Monday on a Sunday, that is the setup for the other thing. $QQQ", "tweetB": "Dauber says HY spreads crossed their line. Macro Charts says sentiment is max bearish. Credit weak plus sentiment washed out is not a clean sell signal. It's a tradeable conflict.", "charts": {"count": 1, "hot": false, "desc": "Charts inside - sentiment/vol/positioning set"}, "link": "https://www.macrocharts.com/p/market-update-and-signals-102026"}, {"id": 50, "cat": "macro", "urgency": "deep", "source": "Paper Alfa (Macro Check)", "title": "Bonds rallied while equities fell and the dollar failed to provide shelter", "idea": "Technology equities, the dollar and Treasury yields behaved unusually last week: inflation uncomfortable, Fed still contemplating tightening, yet bonds rallied as equities weakened and USD didn't hedge. Question: repricing weaker borrowers or early warning that the investment cycle's economics are changing. Foreign ownership and leveraged bond demand amplify shocks.", "angle": "US exceptionalism trade unwinds into dollar, foreign holders of US equities; AI financing cost.", "tweetA": "The dollar didn't hedge the equity drawdown. For foreigners long US tech, that's currency risk and equity risk at once. The exceptionalism trade can unwind in both legs. $DXY $QQQ", "tweetB": "Bonds rallied as equities fell while inflation stayed hot. That's a growth scare overriding inflation. Then Monday the long end sold off. Dauber saw the flip. Whipsaw.", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening"}, "link": "https://www.paperalfa.com/p/macro-check"}, {"id": 51, "cat": "gold", "urgency": "deep", "source": "The Dark Side of the Boom (Gold)", "title": "Gold failed to break higher last week despite AI credit stress; Goldman: central-bank bid remains well above pre-2022 norms", "idea": "Goldman's Thomas and Struyven (Oct 19 Precious Comment): official-sector purchasing exceptionally strong through August. Two gold markets: one tied to USD, real yields and Fed expectations; one tied to reserve security. Author reads failure to break as mildly short-term bearish.", "angle": "Central bank bid sets the floor; speculators set the ceiling.", "tweetA": "Gold has two buyers: those watching real yields and those watching reserve security. The second one is a central bank and doesn't care about the next 25bp. Floor strong. Ceiling still macro. $GLD", "tweetB": "Gold didn't rally in a week of AI credit stress, oil above $110, and French fiscal worries. If that doesn't move it, the speculative crowd is exhausted or hedging via oil. $GC", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening"}, "link": "https://thedarksideoftheboom.substack.com/p/golds-missing-breakout-the-central"}];

var COL={"macro":"#e24b4a","credit":"#378add","positioning":"#ef9f27","AI/infra":"#1d9e75","crypto":"#7f77dd","geopolitics":"#d85a30","energy":"#f97316","tech":"#06b6d4","gold":"#d4a017","culture":"#ec4899","labor":"#8b5cf6","regulation":"#64748b","science":"#14b8a6","venture":"#84cc16"};
var UE={act:"\uD83D\uDD34",deep:"\uD83D\uDD35",watch:"\uD83D\uDFE1"};
var fc="All",fu="All",fs=null;
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '\u2713 Copied';
  setTimeout(function() { btn.textContent = '\uD83D\uDCCB Copy'; }, 1500);
}
function pill(label,active,color,fn){var b=document.createElement('span');b.className='pill';b.textContent=label;if(active){b.style.background=color||'#333';b.style.borderColor=color||'#333';b.style.color='#fff';}b.onclick=fn;return b;}
function card(item){
  var c=COL[item.cat]||'#888';
  var h='<div class="card" id="c'+item.id+'"><div class="hd" onclick="this.parentNode.classList.toggle(\'open\')"><span class="num">'+item.id+'</span><span>'+UE[item.urgency]+'</span><span class="src" style="background:'+c+'">'+esc(item.source)+'</span><span class="tag">'+esc(item.cat)+'</span>'+(item.charts.hot?'<span>\uD83D\uDD25</span>':(item.charts.count?'<span>\uD83D\uDCCA</span>':''))+'<span class="ttl">'+esc(item.title)+'</span></div><div class="body">';
  h+='<div class="lbl">The Idea</div><div>'+esc(item.idea)+'</div>';
  h+='<div class="lbl">My Angle</div><div class="angle" style="border-color:'+c+';background:'+c+'14">'+esc(item.angle)+'</div>';
  h+='<div class="lbl">Tweets</div><div class="tw"><div><b style="color:#378add">TWEET A</b><br>'+esc(item.tweetA)+'<br><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">\uD83D\uDCCB Copy</button></div><div><b style="color:#7f77dd">TWEET B</b><br>'+esc(item.tweetB)+'<br><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">\uD83D\uDCCB Copy</button></div></div>';
  h+='<div class="ch'+(item.charts.hot?' hot':'')+'">'+(item.charts.hot?'\uD83D\uDD25 CHART WORTH SAVING: ':'')+(item.charts.count?item.charts.count+' chart(s). ':'')+esc(item.charts.desc||'')+'</div>';
  if(item.link)h+='<div style="margin-top:8px"><a href="'+item.link+'" target="_blank">\u2197 Read full article</a></div>';
  return h+'</div></div>';
}
function render(){
  var cats=["All"].concat(Object.keys(COL).filter(function(k){return ITEMS.some(function(i){return i.cat===k;});}));
  var cb=document.getElementById('cats');cb.innerHTML='';
  cats.forEach(function(k){var n=k==="All"?ITEMS.length:ITEMS.filter(function(i){return i.cat===k;}).length;cb.appendChild(pill(k+' '+n,fc===k,COL[k],function(){fc=k;fs=null;render();}));});
  var ub=document.getElementById('urg');ub.innerHTML='';
  [["All","All"],["act","\uD83D\uDD34 Act Now"],["deep","\uD83D\uDD35 Deep"],["watch","\uD83D\uDFE1 Watch"]].forEach(function(p){var n=p[0]==="All"?ITEMS.length:ITEMS.filter(function(i){return i.urgency===p[0];}).length;ub.appendChild(pill(p[1]+' '+n,fu===p[0],'#333',function(){fu=p[0];fs=null;render();}));});
  var l=ITEMS.filter(function(i){return (fc==="All"||i.cat===fc)&&(fu==="All"||i.urgency===fu)&&(!fs||i.source.indexOf(fs)>=0);});
  document.getElementById('list').innerHTML=l.map(card).join('');
  if(fs)l.forEach(function(i){document.getElementById('c'+i.id).classList.add('open');});
}
function filterBySrc(name){fs=name;fc="All";fu="All";render();}
