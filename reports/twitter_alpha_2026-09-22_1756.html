<!DOCTYPE html>
<html lang="en">
<head>

<title>Twitter Alpha Intelligence</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root {
  --bg: #faf8f5;
  --surface: #ffffff;
  --border: #e8e3da;
  --border-light: #f0ede4;
  --text: #1a1a1a;
  --text-2: #555;
  --text-3: #8a8a8a;
  --accent: #1a8cd8;
  --red: #d94052;
  --yellow: #fff5b3;
  --yellow-border: #f0d966;

  /* category colors (per spec) */
  --cat-macro: #2563eb;        /* blue */
  --cat-crypto: #8b5cf6;       /* purple */
  --cat-energy: #dc2626;       /* red */
  --cat-tech: #0d9488;         /* teal */
  --cat-ai: #4f46e5;           /* indigo */
  --cat-geopolitics: #dc2626;  /* red */
  --cat-positioning: #15803d;  /* green */
  --cat-regulation: #7c3aed;   /* purple */
  --cat-society: #d97706;      /* amber */
  --cat-em: #059669;           /* green */
  --cat-default: #6b7280;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; line-height: 1.55;
       background: var(--bg); color: var(--text); }
.container { max-width: 960px; margin: 0 auto; padding: 24px 16px 80px; }

/* HEADER */
.header { display: flex; justify-content: space-between; align-items: baseline;
          border-bottom: 2px solid var(--text); padding-bottom: 12px; margin-bottom: 20px; }
.title { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
.subtitle { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-3); }

/* FILTER BAR */
.filter-bar { display: none; background: var(--yellow); border: 1px solid var(--yellow-border);
              border-radius: 6px; padding: 8px 12px; margin-bottom: 16px;
              align-items: center; gap: 10px; font-size: 13px; }
.filter-bar.active { display: flex; }
.filter-bar button { font-family: inherit; font-size: 12px; background: transparent;
                     border: 1px solid var(--text); padding: 3px 10px; border-radius: 4px;
                     cursor: pointer; }
.filter-bar button:hover { background: rgba(0,0,0,0.05); }

/* SUMMARY */
.summary { background: var(--surface); border: 1px solid var(--border);
           border-left: 4px solid var(--red); border-radius: 6px;
           padding: 16px 18px; margin-bottom: 20px; }
.summary p { margin-bottom: 8px; }
.summary p:last-child { margin-bottom: 0; }
.summary strong { font-weight: 600; }

/* SECTIONS */
.section { background: var(--surface); border: 1px solid var(--border);
           border-radius: 6px; margin-bottom: 14px; overflow: hidden; }
.section-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px;
                background: #f3efe6; cursor: pointer; user-select: none;
                font-weight: 600; font-size: 13px; }
.section-head:hover { background: #ebe6dc; }
.section-letter { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
                  color: var(--text-3); min-width: 18px; }
.section-name { flex: 1; }
.section-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
                 color: var(--text-3); }
.section-arrow { font-size: 10px; color: var(--text-3); transition: transform .2s; }
.section.open .section-arrow { transform: rotate(90deg); }
.section-body { display: none; padding: 6px 0; }
.section.open .section-body { display: block; }

/* CLUSTER (Section A) */
.cluster { padding: 14px 16px; border-bottom: 1px solid var(--border-light); }
.cluster:last-child { border-bottom: none; }
.cluster-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
                flex-wrap: wrap; }
.cluster-title { font-weight: 600; font-size: 14px; }
.cluster-desc { color: var(--text-2); font-size: 13px; margin: 0 0 10px 0; }
.cluster-items { display: flex; flex-direction: column; gap: 8px; padding-left: 10px;
                 border-left: 2px solid var(--border-light); }
.cluster-item { font-size: 13px; padding: 6px 8px; border-radius: 4px; }
.cluster-item .item-text { font-size: 13px; margin-top: 4px; }
.cluster-item .item-head { font-size: 12px; }

/* ITEM CARDS (Sections B/C/D) */
.item-card { background: var(--surface); border: 1px solid var(--border);
             border-radius: 6px; padding: 12px 14px; margin: 10px 16px; }
.item-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
             flex-wrap: wrap; }
.item-author { font-weight: 600; color: var(--accent); cursor: pointer; }
.item-author:hover { text-decoration: underline; }
.item-time { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--text-3); }
.item-link { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--accent); text-decoration: none; }
.item-link:hover { text-decoration: underline; }
.item-text { font-size: 13.5px; line-height: 1.6; color: var(--text);
             white-space: pre-wrap; word-wrap: break-word; }
.item-thread { display: inline-block; font-size: 10px; font-weight: 600;
               background: var(--border); color: var(--text-2); padding: 1px 6px;
               border-radius: 3px; text-transform: uppercase; letter-spacing: .04em; }

/* CONTRARIAN (Section C) — red left border + soft red bg */
.section-contrarian .item-card {
  border-left: 4px solid var(--red);
  background: #fdf6f7;
}

/* CATEGORY PILLS */
.pill { display: inline-block; font-family: 'IBM Plex Mono', monospace; font-size: 10px;
        font-weight: 500; padding: 2px 7px; border-radius: 3px; color: #fff;
        text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }

/* IMAGES */
.thumbs { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.thumb { height: 100px; border: 1px solid var(--border); border-radius: 4px;
         cursor: zoom-in; background: #f0ede4; }

/* LIGHTBOX */
.lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85);
            align-items: center; justify-content: center; z-index: 100; cursor: zoom-out; }
.lightbox.open { display: flex; }
.lightbox img { max-width: 92vw; max-height: 92vh;
                box-shadow: 0 8px 40px rgba(0,0,0,.6); }

/* LINKS (Section E) */
.link-row { padding: 8px 16px; border-bottom: 1px solid var(--border-light);
            font-size: 13px; display: flex; gap: 12px; align-items: baseline; }
.link-row:last-child { border-bottom: none; }
.link-author { color: var(--text-3); min-width: 110px; cursor: pointer; }
.link-author:hover { color: var(--accent); }
.link-url { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
            color: var(--accent); text-decoration: none; word-break: break-all; flex: 1; }
.link-url:hover { text-decoration: underline; }
.link-desc { color: var(--text-2); font-size: 12px; }

/* AUTHOR FILTER STATES */
.filterable.match { background: var(--yellow); border-color: var(--yellow-border); }
.section-contrarian .item-card.filterable.match { background: var(--yellow); }
.filterable.dim { opacity: 0.25; }

/* STATS BAR */
.stats { margin-top: 24px; padding: 10px 14px; background: var(--surface);
         border: 1px solid var(--border); border-radius: 6px;
         font-family: 'IBM Plex Mono', monospace; font-size: 11.5px;
         color: var(--text-2); display: flex; gap: 18px; flex-wrap: wrap; }
.stats strong { color: var(--text); font-weight: 600; }

/* EMPTY */
.empty { color: var(--text-3); font-size: 13px; padding: 14px 18px; font-style: italic; }

/* RESPONSIVE */
@media (max-width: 640px) {
  .container { padding: 16px 12px 60px; }
  .item-card { margin: 8px 10px; }
  .link-row { flex-direction: column; gap: 4px; }
  .link-author { min-width: 0; }
  .header { flex-direction: column; align-items: flex-start; gap: 4px; }
}
</style>

<script>
const REPORT_DATA = {"report_type": "TWITTER ALPHA INTELLIGENCE", "collected_at": "2026-09-22T17:21:04Z", "input_stats": {"total_tweets": 204, "unique_authors": 75, "tweets_with_images": 47, "after_noise_filter": 144}, "summary": "**AI safety debate:** All-In Summit 2026 dominated the timeline — **Jensen Huang** called the **10% extinction risk** floated by Dario/Sam/Elon \"irresponsible\" and \"entirely made up,\" while **Elon Musk** said the risk is real and pushed a peer-review fix for overfit evals; **Sam Altman** published a proposal for global frontier AI safety standards. **Jim Bianco** and **Brian Armstrong** pushed back hard on doomer framing, comparing it to 1980s hacker-myth hysteria over the Hugging Face \"attack.\"\n\n**Data centers under strain:** **Nic Carter**'s original satellite survey found 11 of the 25 largest US AI campuses sit within 500m of homes (closest: 90m); SpaceXAI's Colossus 2 in Mississippi is the worst offender, while mitigation has worked elsewhere (Microsoft Mount Pleasant).\n\n**Iran/Oil:** Trump told Tehran at the UN he's writing off the midterms and will keep the blockade going as long as it takes; **Javier Blas** flagged Saudi tankers loading again at Ju'aymah. **Fullcarry** and others doubt Iran deals before the midterms.\n\n**Crypto:** **$ZRO**/LayerZero drew disclosed bullish bets (Evan_ss6, Fiskantes) ahead of the Atlas exchange launch; **Stacy Muur** flags **$85K** as BTC's key test after absorbing two bearish catalysts on ~$648M of short liquidations; **$GRASS**/**$SLC** got a DePIN-revenue re-rating call from Simon Dedic.\n\n**Macro:** **Andy Constan** reiterated his \"not enough GDP pie\" bubble thesis (needs 8%+ sustained nominal growth to justify SPX earnings), echoing Howard Marks; **Quinn Thompson** showed ex-healthcare US job growth was negative most of 2025; **El-Erian** flagged the US 2s-30s curve quietly halving in a month.\n\n**Notable:** iPhone 18 Pro lead times (Gene Munster) look bullish for **$AAPL**; Andrew Kang sees humanoid-robot demand reaching the hundreds of millions within a few years.", "sections": {"A_events": [{"cluster": "Trump at the UN: Iran Blockade Holds, Oil Signals Mixed", "category": ["geopolitics", "energy"], "items": [{"author": "JavierBlas", "summary": "Trump told Tehran at the UN he still has 2.5 years left in office, effectively writing off the midterm results and signaling he'll keep the Iran blockade going as long as it takes to break Tehran.", "tweet_url": "https://x.com/JavierBlas/status/2102408893561512281", "created_at": "2026-09-22T14:45:15.000Z", "type": "tweet"}, {"author": "JavierBlas", "summary": "New open-source Copernicus satellite imagery shows Saudi Arabia's Ju'aymah oil terminal busy again with 6 supertankers loading crude (plus one at Ras Tanura) — at least two tankers different from those seen in Sunday's photo, suggesting export flows are normalizing.", "tweet_url": "https://x.com/JavierBlas/status/2102424652505387452", "created_at": "2026-09-22T15:47:52.000Z", "type": "tweet"}, {"author": "lord_fed", "summary": "Skeptical reaction to Trump urging Iran to \"make a deal\": questions why Tehran would concede anything before the US midterms hand it more leverage.", "tweet_url": "https://x.com/lord_fed/status/2102407623081390173", "created_at": "2026-09-22T14:40:12.000Z", "type": "tweet"}, {"author": "Fullcarry", "summary": "Complementary read: Iran's leverage evaporates after the midterms, so it would make sense for them to cut a deal now — but Trump won't care about gas prices and will push to \"win\" the war outright, for better or worse for his legacy.", "tweet_url": "https://x.com/Fullcarry/status/2102323366195568935", "created_at": "2026-09-22T09:05:24.000Z", "type": "thread"}]}, {"cluster": "All-In Summit 2026: AI Safety Fight Goes Mainstream", "category": ["ai", "regulation"], "items": [{"author": "theallinpod", "summary": "Chamath's full All-In Summit 2026 takeaways: Satya Nadella says AI hasn't shown up in productivity stats yet and pegs 7-8% real GDP growth as what's needed to justify the buildout (or a shorter work week at lower growth); Jensen Huang called the 10% extinction-risk figure floated by Dario/Sam/Elon \"irresponsible\" and \"entirely made up,\" citing doomers' bad track record on job-loss predictions; Elon Musk countered that the risk is real and detailed his peer-review proposal to fix overfit evals via eight heterogeneous testers; Brad Gerstner says frontier labs' combined ~$100B revenue needs to hit ~$180B by year-end to keep the AI trade intact, since hyperscalers are building capacity specifically to rent it to labs; JD Vance addressed the domestic backlash over power costs from data centers.", "tweet_url": "https://x.com/theallinpod/status/2102424882936242296", "created_at": "2026-09-22T15:48:47.000Z", "type": "thread", "images": ["https://pbs.twimg.com/media/HS1QCy4b0AA-zTA.jpg"]}, {"author": "sama", "summary": "Sam Altman published a proposal for global frontier AI safety standards, arguing the US should lead the effort so new entrants and open-model companies can still compete and power concentration is checked.", "tweet_url": "https://x.com/sama/status/2102414347364335917", "created_at": "2026-09-22T15:06:56.000Z", "type": "tweet"}]}, {"cluster": "Opus 5.5 Launch Reactions", "category": ["ai", "tech"], "items": [{"author": "hosseeb", "summary": "Bullish reaction to Claude Opus 5.5: calls it a big intelligence jump paired with a steep price cut (60% off cache reads vs. Opus 5), noting the economic frontier is increasingly being paced by Chinese labs — bullish on the resulting deflation in frontier-intelligence pricing, though wants to see real-world \"vibe checks\" before fully buying the benchmark jump.", "tweet_url": "https://x.com/hosseeb/status/2102443524524233095", "created_at": "2026-09-22T17:02:52.000Z", "type": "thread", "images": ["https://pbs.twimg.com/media/HS1hPQbbEAAOvnC.png", "https://pbs.twimg.com/media/HS1grO_bgAEP_5Q.png"]}, {"author": "udiWertheimer", "summary": "Terse surprised reaction (\"yo what\") quote-tweeting the Opus 5.5 launch news.", "tweet_url": "https://x.com/udiWertheimer/status/2102444394859430174", "created_at": "2026-09-22T17:06:19.000Z", "type": "tweet"}]}, {"cluster": "$ZRO / LayerZero — Atlas Exchange Setup", "category": ["crypto", "positioning"], "items": [{"author": "Evan_ss6", "summary": "Disclosed long: $ZRO breaking out of a long sideways range on anticipation of LayerZero's headless exchange ATLAS launching soon. Notes token unlocks don't end until May 2027 (not a near-term overhang if the cycle runs into 2028-29), and flags institutional involvement plus the proposed staking mechanics as the key catalysts to watch.", "tweet_url": "https://x.com/Evan_ss6/status/2102431173293056248", "created_at": "2026-09-22T16:13:47.000Z", "type": "thread", "images": ["https://pbs.twimg.com/media/HS1T5UkW8AE5EGW.png"]}, {"author": "Fiskantes", "summary": "Complementary bullish view: FUD and bad news no longer push $ZRO to new lows, LayerZero retains 90% market share despite \"the great migration\" narrative, and the Atlas mainnet launch is coming — \"this could be a hated rally.\"", "tweet_url": "https://x.com/Fiskantes/status/2102435929969340813", "created_at": "2026-09-22T16:32:41.000Z", "type": "tweet"}]}, {"cluster": "US AI Data Centers — Noise Backlash", "category": ["ai", "energy", "society"], "items": [{"author": "nic_carter", "summary": "Original research thread (agents spent a week on it): surveyed the 25 largest operating US AI data-center campuses via satellite imagery, filings and noise-complaint records. 11 of 25 sit within 500m of a residential cluster (closest: ~90m). SpaceXAI's Colossus 2 in Mississippi is the worst case — large gas-turbine fleet, corroborated resident complaints. AWS New Carlisle shows big-and-close doesn't automatically mean bad neighbor. Distance plus equipment choice (gas turbines routinely running are worse than idle backup generators) predicts complaints well; every site scoring 3+ concern was within 500m of homes, every site at 800m+ scored lowest. Mitigation works: Microsoft's Mount Pleasant campus fixed a tonal cooling-fan noise issue by changing operations.", "tweet_url": "https://x.com/nic_carter/status/2102430712762626498", "created_at": "2026-09-22T16:11:57.000Z", "type": "thread", "images": ["https://pbs.twimg.com/media/HS1VlypbsAEiXBL.jpg", "https://pbs.twimg.com/media/HS1VmUEaEAAwPL_.jpg", "https://pbs.twimg.com/media/HS1Vm3IaYAA1XAr.jpg", "https://pbs.twimg.com/media/HS1VnVlbEAAVQAo.jpg", "https://pbs.twimg.com/media/HS1VnVpaIAAvSbj.jpg", "https://pbs.twimg.com/media/HS1Vn2pa0AA2lA7.jpg", "https://pbs.twimg.com/media/HS1VLS0aAAAh7tY.jpg", "https://pbs.twimg.com/media/HS1VoUdbEAATB3c.jpg"]}]}], "B_insights": [{"author": "qthomp", "summary": "Updated labor-market data: rolling 12-month US job creation outside healthcare turned negative in June 2025 and only turned positive again in August 2026. Full-year 2025 payroll growth was revised down to just +116,000, while health care/social assistance alone added +686,000 — meaning everything else lost ~570,000 jobs in 2025. Separately notes the 30y-2y curve has flattened sharply since January, calling it ironic that the Fed found appetite to fight inflation under \"Trump's guy.\"", "tweet_url": "https://x.com/qthomp/status/2102436014396473474", "created_at": "2026-09-22T16:33:01.000Z", "type": "thread", "images": ["https://pbs.twimg.com/media/HS1ZN6wWUAIUGh-.jpg", "https://pbs.twimg.com/media/HS1Zvb4WcAALj34.jpg", "https://pbs.twimg.com/media/HS1ZxwXWYAALk_I.jpg"]}, {"author": "elerianm", "summary": "Three macro notes from El-Erian: UK public borrowing hit £18.3B in August vs. £15.5B consensus, widening the OBR overshoot and underscoring thin fiscal headroom ahead of next month's budget; four competing visions for the global order are emerging at UNGA (US-led, a China-asserted multilateral alternative, pragmatic middle-power coalitions, and continued fragmentation); and the US 2s-30s yield curve has quietly halved to ~55bps in about a month — a move he says is \"flying below the radar.\"", "tweet_url": "https://x.com/elerianm/status/2102442142811480358", "created_at": "2026-09-22T16:57:22.000Z", "type": "tweet", "images": ["https://pbs.twimg.com/media/HS1f9u-bsAA6Gcd.png"]}, {"author": "stacy_muur", "summary": "BTC absorbed two bearish catalysts (a Fed hike and the Clarity Act stalling in Congress) well, helped by ~$648M of short liquidations pushing price higher; Bitfinex Alpha data shows the move was spot-demand-led with open interest falling and funding staying neutral. Sees $85K as the key test — ~298K BTC has cost basis there, the biggest supply concentration between $68-90K — and wants BTC to hold $81.3K with continued ETF/spot inflows for the breakout to look convincing.", "tweet_url": "https://x.com/stacy_muur/status/2102402547336282165", "created_at": "2026-09-22T14:20:02.000Z", "type": "tweet", "images": ["https://pbs.twimg.com/media/HS07-ZlbIAAEuvP.jpg"]}, {"author": "stacy_muur", "summary": "GTM teardown of World.xyz's prediction-market launch: rather than compete directly with Polymarket/Kalshi, it parasitized Phantom's existing wallet audience with a mystery-branding tease, a low-friction create-account-to-trade funnel, and a variable \"surprise\" reward loop that generated 2.67M views and viral screenshot sharing — a playbook worth watching for the next crypto-native consumer launch.", "tweet_url": "https://x.com/stacy_muur/status/2102265391859057041", "created_at": "2026-09-22T05:15:02.000Z", "type": "thread", "images": ["https://pbs.twimg.com/media/HSy_O3jb0AATMI7.jpg"]}, {"author": "Rewkang", "summary": "Forecasts the humanoid-robot demand curve crossing an intelligence threshold within a few years that brings demand into the hundreds of millions, with manufacturing (not intelligence) as the binding constraint — could see millions of units produced by 2029 and widespread home adoption by the early 2030s.", "tweet_url": "https://x.com/Rewkang/status/2102412347587649550", "created_at": "2026-09-22T14:58:59.000Z", "type": "thread"}, {"author": "Rewkang", "summary": "Flags the AI-wealth privatization theme: roughly 1B people can access US public stocks, but only \"tens of thousands\" have had access to legitimate Anthropic/OpenAI directs or SPVs — calling it an unprecedented privatization of wealth-building opportunity.", "tweet_url": "https://x.com/Rewkang/status/2102381166087340457", "created_at": "2026-09-22T12:55:05.000Z", "type": "tweet"}, {"author": "dgt10011", "summary": "Assigns a nonzero chance Jensen Huang and Elon Musk found an applied-sciences college in the US within eight years, focused on an engineering mindset and process knowledge rather than traditional CS/engineering degrees.", "tweet_url": "https://x.com/dgt10011/status/2102430774981218484", "created_at": "2026-09-22T16:12:12.000Z", "type": "tweet"}, {"author": "sjdedic", "summary": "Argues the market is waking up to $GRASS (a DePIN token with real, partly offchain revenue) — up 20% on an announcement with no operational change, just recognition. Pivots the same thesis to $SLC/Silencio Network as more overlooked given its low FDV.", "tweet_url": "https://x.com/sjdedic/status/2102356224507343299", "created_at": "2026-09-22T11:15:58.000Z", "type": "tweet"}, {"author": "sjdedic", "summary": "Rebalancing his liquid book and adding 1-2 new positions, saying he's spoiled for choice among overlooked, undervalued onchain businesses right now rather than scraping the barrel.", "tweet_url": "https://x.com/sjdedic/status/2102433697894928609", "created_at": "2026-09-22T16:23:49.000Z", "type": "tweet"}, {"author": "patrick_oshag", "summary": "Relays Rogo founder Gabe Stengel's fundraising story: 40 investors (including Sequoia, Kleiner, Benchmark) passed on the Series A despite personal enthusiasm, before Keith Rabois backed it a month later — even though Rabois himself called it \"not a contrarian bet.\" Rogo has since raised $300M+, illustrating how personal (not just thesis-driven) late-stage VC passes can be.", "tweet_url": "https://x.com/patrick_oshag/status/2102409384512892937", "created_at": "2026-09-22T14:47:12.000Z", "type": "tweet"}, {"author": "munster_gene", "summary": "iPhone 18 Pro/Pro Max lead times are still running 3-4% longer than a year ago — a positive read given expectations of shorter lead times this cycle due to the Duo cannibalizing Pro sales. Contrasts with the 15-18% longer lead times the 18s had vs. the 17s at launch.", "tweet_url": "https://x.com/munster_gene/status/2102441618678702319", "created_at": "2026-09-22T16:55:18.000Z", "type": "tweet", "images": ["https://pbs.twimg.com/media/HS1exS-XwAAfhcy.jpg"]}, {"author": "Chartfest1", "summary": "Technical notes: oversold conditions are broadening out beyond mega-cap tech into cyclicals (Discretionary, Industrials, Financials, Small Caps) after the recent move in crude/rates; separately, the share of Nasdaq 100 members in a bear market rolled back over after briefly topping 50% — a sign of broadening participation rather than a top.", "tweet_url": "https://x.com/Chartfest1/status/2102383551769641104", "created_at": "2026-09-22T13:04:33.000Z", "type": "tweet"}, {"author": "aleabitoreddit", "summary": "Argues classic \"value investing\" (10-12x P/E steady compounders) has gone into hibernation, replaced by AI-era anomalies — a 1.8x runrate-P/E company ($ESMT) growing revenue 605% YoY, or a 16.2x trailing-P/E Sumitomo despite heavy hyperscaler AI exposure. The debate has shifted from \"is it cheap\" to \"how long does the growth last.\"", "tweet_url": "https://x.com/aleabitoreddit/status/2102391630515110126", "created_at": "2026-09-22T13:36:39.000Z", "type": "tweet", "images": ["https://pbs.twimg.com/media/HS0wI7ya8AEL582.jpg"]}, {"author": "fejau_inc", "summary": "Notes the timeline whiplash: a week ago the consensus was hysterics about an AI slowdown and a rate-hike-triggered implosion; now markets are // ---------- helpers ----------
const CAT_VARS = {
  macro: 'var(--cat-macro)',
  crypto: 'var(--cat-crypto)',
  energy: 'var(--cat-energy)',
  tech: 'var(--cat-tech)',
  ai: 'var(--cat-ai)',
  'ai/infra': 'var(--cat-ai)',
  geopolitics: 'var(--cat-geopolitics)',
  positioning: 'var(--cat-positioning)',
  regulation: 'var(--cat-regulation)',
  society: 'var(--cat-society)',
  em: 'var(--cat-em)',
};
function catColor(cat) {
  if (!cat) return 'var(--cat-default)';
  return CAT_VARS[String(cat).toLowerCase()] || 'var(--cat-default)';
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function escapeAttr(s) {
  return escapeHtml(s).replace(/`/g, '&#96;');
}

function renderBold(text) {
  return escapeHtml(text).replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
}

function relativeTime(iso) {
  if (!iso) return '';
  const dt = new Date(iso);
  if (isNaN(dt.getTime())) return '';
  const secs = Math.max(0, (Date.now() - dt.getTime()) / 1000);
  if (secs < 60)   return Math.floor(secs) + 's ago';
  const mins = secs / 60;
  if (mins < 60)   return Math.floor(mins) + 'm ago';
  const hrs  = mins / 60;
  if (hrs < 48)    return Math.floor(hrs) + 'h ago';
  return Math.floor(hrs / 24) + 'd ago';
}

function pill(cat) {
  if (!cat) return '';
  return `<span class="pill" style="background:${catColor(cat)}">${escapeHtml(cat)}</span>`;
}

function authorTag(name, cls = 'item-author') {
  if (!name) return '';
  return `<span class="${cls}" onclick="filterAuthor('${escapeAttr(name)}')">@${escapeHtml(name)}</span>`;
}

// ---------- rendering ----------
function renderThumbs(images) {
  if (!images || !images.length) return '';
  return `<div class="thumbs">` + images.map(u =>
    `<img src="${escapeAttr(u)}" class="thumb" loading="lazy" alt="" onclick="openLightbox('${escapeAttr(u)}')">`
  ).join('') + `</div>`;
}

function renderItem(item) {
  const author = item.author || item.author_username || '';
  const time = relativeTime(item.created_at);
  const thread = item.is_thread ? '<span class="item-thread">thread</span>' : '';
  const link = item.tweet_url
    ? `<a class="item-link" href="${escapeAttr(item.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  return `
    <div class="item-card filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${pill(item.category)}
        ${authorTag(author)}
        ${thread}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      <div class="item-text">${escapeHtml(item.text || '')}</div>
      ${renderThumbs(item.images)}
    </div>`;
}

function renderClusterItem(it) {
  const author = it.author || it.author_username || '';
  const time = relativeTime(it.created_at);
  const link = it.tweet_url
    ? `<a class="item-link" href="${escapeAttr(it.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  return `
    <div class="cluster-item filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${authorTag(author)}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      <div class="item-text">${escapeHtml(it.text || '')}</div>
      ${renderThumbs(it.images)}
    </div>`;
}

function renderCluster(cluster) {
  const itemsHtml = (cluster.items || []).map(renderClusterItem).join('');
  return `
    <div class="cluster">
      <div class="cluster-head">
        ${pill(cluster.category)}
        <div class="cluster-title">${escapeHtml(cluster.title || '')}</div>
      </div>
      ${cluster.description ? `<div class="cluster-desc">${escapeHtml(cluster.description)}</div>` : ''}
      ${itemsHtml ? `<div class="cluster-items">${itemsHtml}</div>` : ''}
    </div>`;
}

function renderLink(l) {
  const author = l.author || l.author_username || '';
  const url = l.url || (l.resolved || l.tco) || '';
  return `
    <div class="link-row filterable" data-author="${escapeAttr(author).toLowerCase()}">
      ${author
        ? authorTag(author, 'link-author')
        : '<span class="link-author">—</span>'}
      <a class="link-url" href="${escapeAttr(url)}" target="_blank" rel="noopener">${escapeHtml(url)}</a>
      ${l.description ? `<span class="link-desc">${escapeHtml(l.description)}</span>` : ''}
    </div>`;
}

function renderSection(letter, name, items, type) {
  if (!items || !items.length) return '';
  let body;
  if (type === 'events') {
    body = items.map(renderCluster).join('');
  } else if (type === 'links') {
    body = items.map(renderLink).join('');
  } else {
    body = items.map(renderItem).join('');
  }
  const cls = type === 'contrarian' ? 'section section-contrarian' : 'section';
  return `
    <div class="${cls}">
      <div class="section-head" onclick="toggleSection(this)">
        <span class="section-letter">${letter}.</span>
        <span class="section-name">${escapeHtml(name)}</span>
        <span class="section-count">${items.length}</span>
        <span class="section-arrow">▸</span>
      </div>
      <div class="section-body">${body}</div>
    </div>`;
}

function renderSummary(text) {
  if (!text) return '';
  const paragraphs = String(text).split(/\n\n+/).filter(Boolean)
    .map(p => `<p>${renderBold(p)}</p>`).join('');
  return `<div class="summary">${paragraphs}</div>`;
}

function renderStats(d) {
  const s = (d && d.stats) || d || {};
  const parts = [];
  if (s.received    != null) parts.push(`received <strong>${s.received}</strong>`);
  if (s.after_filter!= null) parts.push(`after filter <strong>${s.after_filter}</strong>`);
  if (s.authors     != null) parts.push(`authors <strong>${s.authors}</strong>`);
  if (s.coverage    != null) {
    const pct = (s.coverage <= 1 ? s.coverage * 100 : s.coverage);
    parts.push(`coverage <strong>${pct.toFixed(0)}%</strong>`);
  }
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSection(headEl) {
  headEl.parentElement.classList.toggle('open');
}

function openLightbox(src) {
  const img = document.getElementById('lightbox-img');
  img.src = src;
  document.getElementById('lightbox').classList.add('open');
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-img').src = '';
}

let activeFilter = null;
function filterAuthor(name) {
  if (!name) return;
  activeFilter = String(name).toLowerCase();
  document.querySelectorAll('.filterable').forEach(el => {
    const a = (el.dataset.author || '').toLowerCase();
    if (a === activeFilter) {
      el.classList.add('match');
      el.classList.remove('dim');
    } else {
      el.classList.add('dim');
      el.classList.remove('match');
    }
  });
  document.getElementById('filter-name').textContent = '@' + name;
  document.getElementById('filter-bar').classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function clearFilter() {
  activeFilter = null;
  document.querySelectorAll('.filterable').forEach(el => {
    el.classList.remove('match');
    el.classList.remove('dim');
  });
  document.getElementById('filter-bar').classList.remove('active');
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (document.getElementById('lightbox').classList.contains('open')) {
      closeLightbox();
    } else if (activeFilter) {
      clearFilter();
    }
  }
});

// ---------- schema normalization ----------
// Some producer runs emit the "sections" schema documented in the routine
// spec (report_type/input_stats/sections.A_events.../coverage) instead of
// the flat schema this renderer reads (date/events/insights/contrarian/
// positioning/links/stats). Normalize so either shape renders correctly.
function firstOf(v) {
  return Array.isArray(v) ? v[0] : v;
}

function normalizeItem(it) {
  if (!it || typeof it !== 'object') return it;
  return {
    author: it.author || it.author_username,
    text: it.text != null ? it.text : it.summary,
    category: firstOf(it.category),
    tweet_url: firstOf(it.tweet_url),
    images: it.images,
    created_at: it.created_at,
    is_thread: it.is_thread != null ? it.is_thread : (it.type === 'thread'),
  };
}

function normalizeData(d) {
  if (!d || typeof d !== 'object') return {};
  const hasFlat = d.events || d.insights || d.contrarian || d.positioning || d.links || d.stats;
  if (hasFlat) return d;

  const s = d.sections;
  if (!s) return d;

  const out = Object.assign({}, d);
  out.date = d.date || (d.collected_at ? String(d.collected_at).replace('T', ' ').replace('Z', ' UTC') : '');
  if (s.A_events) {
    out.events = s.A_events.map(cl => ({
      title: cl.cluster || cl.title,
      category: firstOf(cl.category),
      description: cl.description,
      items: (cl.items || []).map(normalizeItem),
    }));
  }
  if (s.B_insights) out.insights = s.B_insights.map(normalizeItem);
  if (s.C_contrarian) out.contrarian = s.C_contrarian.map(normalizeItem);
  if (s.D_positioning) out.positioning = s.D_positioning.map(normalizeItem);
  if (s.E_links) {
    out.links = s.E_links.map(l => ({
      author: l.author,
      url: l.url,
      tweet_url: firstOf(l.tweet_url),
      description: l.note || l.description,
    }));
  }
  const stats = d.stats || {};
  out.stats = {
    received: stats.received != null ? stats.received : (d.input_stats && d.input_stats.total_tweets),
    after_filter: stats.after_filter != null ? stats.after_filter : (d.input_stats && d.input_stats.after_noise_filter),
    authors: stats.authors != null ? stats.authors : (d.coverage && d.coverage.authors_total),
    coverage: stats.coverage != null ? stats.coverage : (d.coverage && d.coverage.coverage_pct),
  };
  return out;
}

// ---------- main ----------
function renderReport(d) {
  d = normalizeData(d);
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  const sections = [
    renderSummary(d.summary),
    renderSection('A', 'Events & Reactions',      d.events,                                'events'),
    renderSection('B', 'Alpha & Insights',        d.insights || d.alpha,                   'items'),
    renderSection('C', 'Contrarian Views',        d.contrarian,                            'contrarian'),
    renderSection('D', 'Positioning & Trade Ideas', d.positioning,                         'items'),
    renderSection('E', 'Link Queue',              d.links,                                 'links'),
  ].join('');
  const app = document.getElementById('app');
  app.innerHTML = sections || '<div class="empty">No report data.</div>';

  // Auto-open first two sections.
  document.querySelectorAll('.section').forEach((s, i) => {
    if (i < 2) s.classList.add('open');
  });

  document.getElementById('stats').innerHTML = renderStats(d);
}

renderReport(REPORT_DATA);
</script>
