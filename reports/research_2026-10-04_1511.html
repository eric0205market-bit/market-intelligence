<script>
const ITEMS = [{"id": 1, "cat": "crypto", "urgency": "deep", "source": "Unchained / Laura Shin", "title": "Hunter Biden's $LAPTOP memecoin touched a $317B market cap on thin initial liquidity", "idea": "Hunter Biden's $LAPTOP briefly printed a $317 billion market cap. Hunter walks through the launch: thin initial liquidity, a massive spike, and an unusual prediction-market burn mechanism he says distinguishes it from $TRUMP. He argues on-chain wallet data proves it is not a scam.", "angle": "A $317B 'market cap' off thin liquidity is a pricing artifact, not a valuation. It is the cleanest illustration yet of why fully-diluted market cap on a one-tick-deep book is meaningless, and of political memecoins as a reflexive attention trade.", "tweetA": "$317B market cap on a token with thin initial liquidity. The market cap is last price x supply, and last price was set by a handful of buyers. That's not a valuation, it's a rounding error with a ticker. Memecoin 'caps' need a liquidity-adjusted version.", "tweetB": "Political memecoins are now a recurring product: $TRUMP, now $LAPTOP. Same playbook, thin float, huge FDV, insiders holding supply. The only thing that changes is whose name is on it. Ask who the exit liquidity is every time.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://unchainedcrypto.beehiiv.com/p/hunter-biden-s-317b-memecoin-moment"}, {"id": 2, "cat": "crypto", "urgency": "deep", "source": "Unchained / Laura Shin", "title": "Bitget lost $388M without a single private key being touched: the vendor was the attack surface", "idea": "Attackers took ~$388M from Bitget via a zero-day in a third-party security product, with no access to private keys. Opsek's Pablo Sabbatella and Bitget CEO Gracy Chen walk through it; North Korea/Lazarus is alleged. Only a fraction of the funds have been frozen so far.", "angle": "Third-party security tooling is the new custody risk. Cold-storage diligence is moot if the monitoring/security stack has a zero-day. Relevant for exchange counterparty risk and for $BGB, plus the whole 'security vendor' concentration problem.", "tweetA": "$388M gone and zero private keys compromised. The exploit was in the security product Bitget bought to protect itself. Counterparty diligence on exchanges stops at 'where are the keys' far too often.", "tweetB": "Every exchange audit asks about cold wallets. Nobody scores the security vendor's patch cadence. A zero-day in a third-party tool is a single point of failure that sits outside the proof-of-reserves picture entirely.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://unchainedcrypto.beehiiv.com/p/hunter-biden-s-317b-memecoin-moment"}, {"id": 3, "cat": "crypto", "urgency": "deep", "source": "Unchained / Bits + Bips", "title": "THORChain declined to block Bitget's stolen funds: neutrality vs. responsibility, live", "idea": "Tether, Circle and NEAR Intents froze funds tied to the Bitget hack; THORChain refused to intervene and the attackers routed funds through it. Bits + Bips frames it as a reopening of the fight over what neutral infrastructure means when a protocol is technically able to intervene.", "angle": "Splits the stack in two: issuers (USDT/USDC) are compliance endpoints, permissionless routers are not. Matters for how regulators treat DeFi routing and for the value of 'censorship resistance' as a priced feature of $RUNE.", "tweetA": "Tether froze it. Circle froze it. THORChain didn't. Same stolen funds, three different definitions of neutrality. The market will price which one it wants, and it's probably not the same answer for stablecoins and swap rails.", "tweetB": "If a protocol *can* stop stolen funds and doesn't, is that neutrality or a choice? Regulators will say choice. I think this is the case that gets used to argue permissionless routers are intermediaries.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://unchainedcrypto.beehiiv.com/p/hunter-biden-s-317b-memecoin-moment"}, {"id": 4, "cat": "crypto", "urgency": "deep", "source": "Unchained / The Chopping Block", "title": "Apollo warns AI agents could trigger a new kind of bank run", "idea": "The Chopping Block crew flags Apollo's warning that AI agents could cause a novel bank-run dynamic. Same episode: a validator compromise, claims that Kalshi's perps volume was inflated, and insurance pricing for Treasuries.", "angle": "Agents moving deposits on yield differentials in milliseconds compress the run timeline from days to minutes. Ties to stablecoin and money-market-fund plumbing, and to who holds the liability at 3am.", "tweetA": "Bank runs used to need a rumor, a queue and a weekend. Agents need a yield spread and an API key. If deposit flight is automated, the Fed's lender-of-last-resort window is too slow by design.", "tweetB": "Apollo says AI agents could run the banks. Combine with stablecoin redemptions and sweep accounts and the run speed is set by software, not people. That's a liquidity-coverage-ratio problem nobody has modelled.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://unchainedcrypto.beehiiv.com/p/hunter-biden-s-317b-memecoin-moment"}, {"id": 5, "cat": "credit", "urgency": "deep", "source": "Unchained / Bits + Bips", "title": "Oracle data-center financing under pressure; a host prefers utilities to Treasuries as yields rise", "idea": "Bits + Bips discuss rising U.S. Treasury yields, pressure on Oracle's data-center financing, and one host's preference for utilities over Treasuries. Also: who is liable when an AI agent breaks the law.", "angle": "Higher long-end yields hit levered AI infra financing first. Pairs with the Hardfork 'capital stack becomes a real conversation' quote in the same window. $ORCL credit spreads are the AI-capex canary.", "tweetA": "Oracle's data-center financing is getting harder while the 10Y keeps climbing. AI capex is a duration trade funded with debt. When the discount rate moves, the build-out sees it before earnings do. $ORCL", "tweetB": "A host preferring utilities to Treasuries is telling you where the 'safe yield' trade is moving: toward regulated cash flows with power-demand upside. Treasuries yield more now, but utilities own the AI load growth.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://unchainedcrypto.beehiiv.com/p/hunter-biden-s-317b-memecoin-moment"}, {"id": 6, "cat": "regulation", "urgency": "watch", "source": "Unchained", "title": "SEC buyback guidance 'is narrower than it looks': which token buybacks pass the 'central party' test", "idea": "Headline-level item in the recap: Unchained says the SEC's token buyback guidance is narrower than it appears and sets a 'central party' test that determines which buybacks qualify. Same recap flags Bitcoin rally buyers (ETFs, short sellers, leverage) and a no-fork Zcash-style privacy proposal.", "angle": "Token buybacks are the 'fundamentals' narrative for many alts. A narrow safe harbor means most buyback programs carry securities-law risk. Charts inside, worth opening.", "tweetA": "Every alt with a buyback program is about to be sorted by one question: is there a central party? If the answer is yes, the buyback is the security-law problem, not the value-accrual solution.", "tweetB": "Token buybacks were the 'revenue share without saying revenue share' trade. A narrow SEC test makes that trade a legal-structure question first, a tokenomics question second.", "charts": {"count": 0, "hot": false, "desc": "Charts inside, worth opening"}, "link": "https://unchainedcrypto.com/the-secs-buyback-guidance-is-narrower-than-it-looks-does-yours-pass-the-test/"}, {"id": 7, "cat": "positioning", "urgency": "deep", "source": "Unchained", "title": "Who bought Bitcoin's breakout: ETFs, short sellers and leverage will decide whether it holds", "idea": "Recap headline: the answer to who bought the BTC breakout determines whether price holds. Candidates named: ETFs, short sellers (covering) and leverage. Another recap item notes Cloudflare needs more blockchain throughput than all of crypto combined.", "angle": "Short-covering plus perp leverage is a weaker bid than spot ETF creation. Worth checking funding and ETF flow before trusting the move. Charts inside, worth opening.", "tweetA": "A breakout bought by shorts covering and leverage is a squeeze. A breakout bought by ETF creations is a trend. Same candle, opposite forward returns. $BTC", "tweetB": "Cloudflare alone needs more throughput than the entire crypto industry processes. If agent payments are the use case, the settlement layer is 3-4 orders of magnitude short.", "charts": {"count": 0, "hot": false, "desc": "Charts inside, worth opening"}, "link": "https://unchainedcrypto.com/who-bought-bitcoins-breakout-the-answer-will-decide-whether-the-price-holds/"}, {"id": 8, "cat": "macro", "urgency": "deep", "source": "Eliant / Eliant's Exploits", "title": "The 10Y is going parabolic while the Nasdaq prints an ATH: soft PCE and NFP gave the Fed only a bit of relief", "idea": "The bleed in bonds continues with the 10Y in a parabolic rise. PCE and NFP both came in softer. Nasdaq closed at a new all-time high on Friday, +65bps on the week, while the Dow lost 125bps on the week. The week ahead is quiet: a few bond auctions and Monday PMI/ISM, so the key question is whether the bond selloff exhausts.", "angle": "Equity leadership is a narrow tech tape riding on rising yields. The Nasdaq/Dow spread of ~190bps in one week is the cap-weight vs. equal-weight story. Duration pain lands on non-AI cyclicals first.", "tweetA": "Nasdaq at ATH, Dow -125bps, 10Y parabolic. This is not a risk-on market. It's a one-factor market where AI earnings are paying for the discount rate.", "tweetB": "Soft PCE, soft NFP, and yields still going up. If bad data can't stop the bond selloff, it isn't the Fed driving it. Look at supply and term premium.", "charts": {"count": 1, "hot": false, "desc": "Weekly STD channels on SPY/QQQ/IWM/DJIA"}, "link": "https://www.eliantcapital.com/p/the-week-ahead-10426"}, {"id": 9, "cat": "positioning", "urgency": "deep", "source": "Eliant / Eliant's Exploits", "title": "Under the hood: only ~30% of stocks above the 20D and ~27% above the 50D while SPX is 100bps from highs", "idea": "Breadth has collapsed: 30% of stocks above the 20-day and ~27% above the 50-day, 'oversold but not yet extreme'. SPX sits ~100bps off ATH, yet the Fear & Greed Index is firmly in 'fear' and drifting toward 'extreme fear'. Growth and Momentum were the best factors on the week; Value and Low-Vol the worst.", "angle": "Index near highs with breadth washed out and sentiment in fear is historically a decent contrarian set-up, unless the 10Y keeps going. A reset has happened under the surface without index damage.", "tweetA": "SPX 100bps from an ATH and Fear & Greed is in 'fear'. Only 27% of stocks above their 50D. The index is hiding a bear market in the median stock.", "tweetB": "The setup: breadth oversold, sentiment fearful, index at highs. That's usually a buy-the-dip tape. The only variable that can break it is the 10Y, which is exactly the one that's parabolic.", "charts": {"count": 2, "hot": true, "desc": "Fear & Greed Index overlaid on S&P history; % of stocks above 20D/50D. 🔥 CHART WORTH SAVING"}, "link": "https://www.eliantcapital.com/p/the-week-ahead-10426"}, {"id": 10, "cat": "macro", "urgency": "watch", "source": "Eliant / Eliant's Exploits", "title": "Basket leaderboard YTD: Agentic Economy #1, Industrial Sovereignty #2; Gaming & Media and Housing worst", "idea": "Best YTD baskets: 1) Agentic Economy, 2) Rebuilding U.S. Industrial Sovereignty, 3) Industrial and Auto Analog Recovery, 4) Mission Critical Security Stack, 5) AI Medicine Stack. Worst: Gaming & Media, The Global Marketplace, 'Make Housing Great Again'.", "angle": "Winners are AI-adjacent and reshoring; losers are rate-sensitive and consumer-discretionary. A clean map of 2026's factor structure, with housing as the rate-hike casualty.", "tweetA": "Best YTD themes: agentic AI, U.S. industrial reshoring, analog recovery. Worst: housing, gaming, e-commerce marketplaces. Rates and AI capex made a two-sided market in one sentence.", "tweetB": "Analog recovery is the quiet entry in the top three. Industrial/auto analog is a cycle-turn signal that doesn't get airtime next to AI compute.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.eliantcapital.com/p/the-week-ahead-10426"}, {"id": 11, "cat": "macro", "urgency": "deep", "source": "Eliant / Eliant's Exploits", "title": "Eliant claims +210.8% since June '23 vs QQQ +113%, SPY +86%, Dow +60%; 80.9% win rate, avg win 27.2%, avg loss 14.9%", "idea": "The author reports a tactical-trade return of 210.8% since June 2023 against Qs 113.37%, Spooz 85.63%, Dow 59.84%, small caps 61.78%, with an 80.9% win rate, 27.16% average winner and 14.88% average loser.", "angle": "Self-reported, but note the payoff structure: high win rate with losers at over half the size of winners. Good template for what a mid-range edge looks like. Worth sanity-checking the denominator.", "tweetA": "80.9% win rate, average winner 27%, average loser 15%. That's not a hit-rate edge, that's a payoff-ratio edge that happens to also hit. Self-reported, so size the skepticism accordingly.", "tweetB": "A claimed 2x the Nasdaq since 2023 on active baskets. In this tape, beating the Qs with a diversified book is the hard part, not the headline number.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.eliantcapital.com/p/the-week-ahead-10426"}, {"id": 12, "cat": "macro", "urgency": "deep", "source": "Danny Dayan / The Dance", "title": "The Fed's reaction function changed; stocks and bonds will seesaw until FCI tightens enough to moderate growth and inflation", "idea": "Two weeks ago Dayan argued the Fed's changed reaction function implies a new market regime ('The Turn'). This week's note says stocks and bonds will keep 'dancing' in the months ahead until financial conditions are sufficiently tight to moderate growth and inflation. Week ahead: S&P/ISM Services PMI Monday, trade balance Tuesday, used cars and NY Fed inflation expectations Wednesday, UMich Friday.", "angle": "If FCI is the governor, rising yields help the Fed only if equities fall with them. Right now equities (Nasdaq ATH) are offsetting the tightening. That is why the Fed hiking path is still live.", "tweetA": "The Fed doesn't need to hike if FCI does it for them. But the Nasdaq at an ATH is loosening FCI while the 10Y tightens it. Net: the Fed hasn't been helped yet.", "tweetB": "Stocks up, bonds down, FCI flat. That's why the seesaw keeps going. The Fed hikes when both move the same way. They haven't yet.", "charts": {"count": 1, "hot": false, "desc": "Positioning summary table"}, "link": "https://dannydayan.substack.com/p/the-dance"}, {"id": 13, "cat": "venture", "urgency": "deep", "source": "Quality Compounding / Compounding Quality", "title": "Sygnity: H1'26 revenue +47%, EBITDA +74%, forward EV/EBITDA below 12x. Topicus owns 72.7%, float ~10%", "idea": "Of five public Constellation-universe companies, Sygnity had the best H1 2026: revenue +47%, EBITDA +74%, and it trades below 12x forward EV/EBITDA. Topicus owns 72.7% so float is ~10% (impossible for large investors). It's the only Constellation-universe name that hasn't recovered from AI fears. Topicus turned a 'melting ice cube' into a +15% compounder using pricing power, an acquisition database (4 deals since Feb 2024) and an ROIC-based incentive plan.", "angle": "Cheap because illiquid, not because it's bad. The AI-disruption discount on vertical-market software is applied uniformly, and here the fundamentals diverge from the multiple. Small-cap, low float.", "tweetA": "+47% revenue, +74% EBITDA, under 12x forward EV/EBITDA, and the discount is blamed on AI fears and float. Constellation's playbook applied to a Polish software company. $SGN", "tweetB": "Topicus owns 72.7% of Sygnity. The market treats the 10% float as a discount; the owner treats it as a compounding runway. Ask which side of that you want to be on.", "charts": {"count": 2, "hot": false, "desc": "Topicus transformation visual at Sygnity; Sygnity AI-fear recovery chart"}, "link": "https://www.compoundingquality.net/p/building-a-serial-acquirer-portfolio"}, {"id": 14, "cat": "venture", "urgency": "deep", "source": "Quality Compounding / Compounding Quality", "title": "Chapters Group: a 15-bagger in 8 years; Mitch Rales owns 15.1%, Daniel Ek 12.7%", "idea": "CEO Jan Mohr read his first Buffett biography at 11 and ran his own equity fund at 25. He took control of a cash-rich shell (Medical Columbus), closed the first acquisition end of 2018 and the share price has compounded at +40% CAGR since. Chapters now owns 60+ VMS businesses across 8 platforms. Mitch Rales (Danaher co-founder, 350-bagger) owns 15.1% and speaks with Mohr weekly; Daniel Ek bought in right after hearing Mohr on a podcast and owns 12.7%.", "angle": "Shell-plus-capital-allocator is a repeatable template. Cap table quality (Rales, Ek) is a signal in itself. €1B market cap.", "tweetA": "Chapters Group: 40% CAGR, 60+ software businesses, a €1B market cap. Danaher's co-founder talks to the CEO every week. Spotify's founder bought after one podcast. $CHG", "tweetB": "Serial acquirers compound because small deals avoid competitive bidding, not because their CEOs are brilliant. The cap table is the cheapest diligence signal you'll ever find.", "charts": {"count": 1, "hot": false, "desc": "Chapters share price chart (+40% CAGR)"}, "link": "https://www.compoundingquality.net/p/building-a-serial-acquirer-portfolio"}, {"id": 15, "cat": "venture", "urgency": "watch", "source": "Quality Compounding / Compounding Quality", "title": "Software Circle: shares fell from £0.31 peak to ~£0.16 on AI fears while FCF went from -£1.5M (2020) to +£5.9M (2025)", "idea": "Formerly Grafenia, a struggling printing-software business, now a UK/Ireland VMS acquirer with 11 deals in 5 years. 5-year revenue CAGR 26.2% (but revenue per share was negative because of dilution), organic growth at acquired companies +7% in 2025, new £25M credit line replaces equity funding. Shareholders: P&R Real Value 12.7%, Sun Mountain (Will Thorndike) 10.3%, Chapters 9.8%.", "angle": "Funding-source shift from equity to debt and FCF is the inflection. The dilution history is the risk. A £25M facility against £5.9M FCF is ~4x, so leverage is not trivial.", "tweetA": "Software Circle revenue CAGR 26%. Revenue per share growth negative. That distinction is the whole thesis, and the whole risk. Switching to a credit line is the test.", "tweetB": "Thorndike, Chapters and a Constellation-style playbook on a ~£0.16 stock. Small-cap serial acquirers are priced as if AI deletes vertical software. Mission-critical niche tools are the last thing an LLM replaces.", "charts": {"count": 1, "hot": false, "desc": "Dilution chart: share count explosion"}, "link": "https://www.compoundingquality.net/p/building-a-serial-acquirer-portfolio"}, {"id": 16, "cat": "venture", "urgency": "deep", "source": "Quality Compounding / Compounding Quality", "title": "12 serial acquirers compounded at +34%/yr on average: VMS, Swedish, industrial and 'special' buckets", "idea": "The 12-name portfolio is structured in four buckets of three: VMS (Sygnity, Chapters, Software Circle), Swedish, Industrial and Special serial acquirers. Average shareholder return for the group: +34% per year. Constellation's chicken-coop egg-counting software is the archetype: mission-critical, tiny, no MIT student targeting it.", "angle": "Sweden is the serial-acquirer cluster the way the Bay is software. Structural reason: decentralized model, long-term owners, a deep supply of small private targets in the Nordics.", "tweetA": "12 serial acquirers, +34% a year on average. The business model is almost boring: buy small, mission-critical, unsexy companies and never sell. Compounding is the product.", "tweetB": "VMS serial acquirers sell at AI-disruption multiples while owning egg-counting software for chicken coops. Tell me which LLM startup is going after that.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.compoundingquality.net/p/building-a-serial-acquirer-portfolio"}, {"id": 17, "cat": "macro", "urgency": "deep", "source": "MktContext", "title": "Market now prices three Fed hikes in 2026, versus two cuts not long ago; foreign central banks forced into 'vicious loop' by oil", "idea": "Not long ago the market expected two rate cuts for 2026; now it expects three hikes. The Fed's rationale: a solid economy and tight labor market threaten wage-price spirals, and it is scarred by 2022. Oil shock transmits abroad: most economies absorb higher energy prices worse than the U.S., so foreign central banks raise too, and global yields move together. The author takes a contrarian view that rates are done rising (details paywalled).", "angle": "A five-hike swing in 2026 pricing is the real regime shift. Oil is the common factor. The 'Iran peace deal rebuffed' headline sits upstream of rates.", "tweetA": "Two cuts to three hikes in a few months. That's a 5-move swing in the policy path from an oil shock and a labor market that won't loosen. 'Done rising' needs a theory of oil.", "tweetB": "Everyone is reading this as a Fed story. It's a global one: oil hits Europe and Asia harder, their central banks tighten, and the dollar curve follows the world.", "charts": {"count": 1, "hot": false, "desc": "Chart of global yields moving in tandem"}, "link": "https://www.mktcontext.com/p/are-rates-done-rising-new-trades"}, {"id": 18, "cat": "geopolitics", "urgency": "deep", "source": "MktContext", "title": "Trump rebuffed a proposed Iran peace deal; softer September jobs report lifted stocks to a Nasdaq ATH", "idea": "Stocks began the week cautiously after Trump rebuffed a proposed Iran peace deal, then lifted Friday as the September jobs report came in softer, reducing odds of hikes. Semis and AI lead; non-AI stocks struggle with high rates and weak breadth, though early rebounds appear in other sectors. Market timer: BULLISH.", "angle": "The market is trading 'bad news is good' on labor while ignoring that the peace-deal rejection is an oil-supply risk. Timer stays bullish even as breadth is washed out.", "tweetA": "Peace deal rejected, jobs soft, Nasdaq ATH. The market is long Fed-relief and short geopolitical risk at the same time. One of those is going to be wrong.", "tweetB": "Soft NFP = fewer hikes = stocks up. Iran deal dead = oil up = more hikes. Those two headlines are fighting each other and equities picked one.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.mktcontext.com/p/are-rates-done-rising-new-trades"}, {"id": 19, "cat": "positioning", "urgency": "watch", "source": "MacroCharts", "title": "'An extremely rare, historic signal has fired': Barron's 'A Market Divided' cover week", "idea": "MacroCharts opens Q4 with a claim that 'an extremely rare, historic signal' has fired and that markets may be 'tipping their hand'. The report covers Seven Charts, top signals and a medium-term outlook, with initial portfolio moves made this week and 'asymmetry remains extremely compelling'; the signal itself is behind the paywall. Hook: Barron's cover 'A Market Divided'.", "angle": "Barron's covers are classic sentiment markers, and 'divided' fits the Nasdaq vs Dow and breadth split. The signal is unnamed; open the article for the 7 charts.", "tweetA": "Barron's cover: 'A Market Divided'. Nasdaq at ATH, Dow down 125bps on the week, 27% of stocks above 50D. The cover is accurate. Whether it's a top or a base is the open question.", "tweetB": "Rare historic signals in a narrow market usually mean something has been stretched. I want to know which one before I trade it, and what its forward 12-month hit rate is.", "charts": {"count": 7, "hot": true, "desc": "Seven charts incl. the 'historic signal' stock chart - charts inside, worth opening. 🔥 CHART WORTH SAVING"}, "link": "https://www.macrocharts.com/p/a-market-divided"}, {"id": 20, "cat": "AI/infra", "urgency": "deep", "source": "Irrational Analysis", "title": "Clock speed is an economic choice, not a design choice: how parametric yield turns one die into a SKU stack", "idea": "AMD's four 64-core Turin SKUs share one design; the 9575F draws 33% more power than the 9535. Catastrophic yield decides how many cores live; parametric yield decides speed and power. Process corners are +/-2 sigma, voltage simulated +/-10% and characterized +/-5%, and typical parametric yield after tuning is ~95%. Nvidia's Ti/Super parts arrive ~6 months later because it takes time to bin enough top-X% chips.", "angle": "Binning/harvesting is where margin hides. Leaked engineering-sample clocks mean nothing without knowing the corner. Product management sets final clocks after silicon characterizes.", "tweetA": "Same AMD die, four SKUs, 33% power spread. The chip you buy is a point on a Gaussian somebody chose for margin. Engineering-sample benchmarks with no corner info are noise.", "tweetB": "Nvidia's Ti/Super comes ~6 months after launch because yields need time to stock the best bin. 'Supply constrained' sometimes just means the top of the distribution is thin.", "charts": {"count": 5, "hot": true, "desc": "Process-corner chart, Schmoo plot, volt/frequency curve (3 regions). 🔥 CHART WORTH SAVING - volt/freq curve"}, "link": "https://irrationalanalysis.substack.com/p/practical-parametric-yield"}, {"id": 21, "cat": "AI/infra", "urgency": "deep", "source": "Irrational Analysis", "title": "Cerebras is disproportionately hurt by parametric yield: 84 reticles on one wafer, no way to bin, no socketed test rig", "idea": "Normal chipmakers throw away slow/hot parts, sell them as lower SKUs, or tweak registers. Cerebras can't do the first two and may only partly do the third: it must get good parametric yield across 84 reticles on one wafer, and can't socket-test because the wafer ships with custom vertical power delivery and cooling. Author's guess: WSE3 has a unified power grid with no voltage tuning. He thinks parametric yield is the thing that matters most for the stock for 12-18 months.", "angle": "Cerebras' bull case (great product) and bear case (bad supply/gross margin) can both be true if the constraint is yield, not demand. Test is hardware revenue and gross margin inflection around H1 2027.", "tweetA": "Cerebras can't bin, can't downgrade a bad die to a cheaper SKU, and can't socket-test. A wafer is one yield outcome. The product can be great and the supply can still be terrible.", "tweetB": "Everyone argues Cerebras demand. The author says the real variable is parametric yield across 84 reticles. That's a gross-margin question, and the cheapest way to see it is H1 2027 hardware revenue.", "charts": {"count": 1, "hot": false, "desc": "Jalapeno socketed test rig vs Cerebras"}, "link": "https://irrationalanalysis.substack.com/p/practical-parametric-yield"}, {"id": 22, "cat": "AI/infra", "urgency": "deep", "source": "Irrational Analysis", "title": "The author reads a 25% A0-to-B0 perf/watt delta on OpenAI/Broadcom 'Jalapeno' as a catastrophic red flag, the opposite of SemiAnalysis' narrative", "idea": "Referencing SemiAnalysis' note of a 25% B0 Jalapeno clock speed gain, the author says 5-10% is a modest miss, 15% means something went severely wrong, and 25% is a disaster: A0 was broken and parametric yield 'an unmitigated disaster'. Foundry is TSMC N3P. He leaves it open whether Broadcom or OpenAI (with AI agents vibe-coding RTL in 'record time') is to blame.", "angle": "A direct, public disagreement between two semis analysts on the same data point. Matters for $AVGO custom ASIC ramp timing and for OpenAI's chip credibility.", "tweetA": "SemiAnalysis sees a 25% A0-to-B0 clock gain on Jalapeno as progress. Irrational Analysis sees it as proof A0 was broken. Same number, opposite sign. $AVGO", "tweetB": "If OpenAI's first custom chip needed a 25% clock fix between steppings on N3P, that's an execution story, and the RTL was written with AI agents. Wait for B0 volume numbers.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://irrationalanalysis.substack.com/p/practical-parametric-yield"}, {"id": 23, "cat": "AI/infra", "urgency": "watch", "source": "Irrational Analysis", "title": "Demo cherry-picking in semis: Lumentum's UHP demo at 30C vs the usual 40C+, Alphawave's short channel, Marvell's aggressive cooling", "idea": "Examples of marketing at the edge of cheating: Lumentum's OFC 2026 UHP laser demo ran at 30C die temp while lasers typically run at 40C+, disclosed only in small font; Marvell's 1.6T 3nm optical DSP demo at DesignCon 2025 used very aggressive cooling; Alphawave's PCIe 7 demo showed 1e-12 BER on a short channel while marketing claimed lossy channels. The author also describes a competitor quoting -18% undervolt as safe vs his own -12 to -14%.", "angle": "A checklist for evaluating photonics/interconnect demos: temperature, channel length, cooling, corner. Useful for $LITE, $MRVL.", "tweetA": "Lumentum's headline demo ran at 30C. Production lasers run 40C+. That's a 10C footnote hiding under big font. Photonics demos need a temperature, a channel and a corner before I believe the headline. $LITE", "tweetB": "Testing 5 TT parts and picking the best is marketing. Testing 100 is cheating. The line between them is the entire semis demo season.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://irrationalanalysis.substack.com/p/practical-parametric-yield"}, {"id": 24, "cat": "AI/infra", "urgency": "watch", "source": "Irrational Analysis", "title": "Cerebras CS-4 doubled core and IO clocks with the same WSE3 silicon via better power delivery and cooling; hardware inflection likely H1 2027", "idea": "CS-4 with 'WSE3-turbo' doubled everything (IO and core clocks) on identical silicon thanks to a better enclosure, with improved cooling and lower power-supply ripple. The author's conspiracy theory: they were at a hilariously low point on the volt/frequency curve. Next-gen WSE4 ideas: per-reticle voltage domains, DVFS, decoupled compute/SRAM/NoC clocks, PVT-tolerant custom cells.", "angle": "If CS-4 gains are enclosure-driven, not silicon-driven, the upside from WSE4 voltage domains is the next lever. Supply is limited now as CS-4 ramps.", "tweetA": "Cerebras doubled clocks on the same silicon by fixing power delivery and cooling. That says the chip had been sitting far down its volt/frequency curve. The unit economics of the CS-4 should look very different from CS-3.", "tweetB": "Cerebras gets a 2x clock gain from plumbing, not transistors. Next up: per-reticle voltage domains. That's a design roadmap that improves yield and supply simultaneously.", "charts": {"count": 1, "hot": false, "desc": "Generalised volt/frequency response with WSE3 and WSE3-turbo operating points"}, "link": "https://irrationalanalysis.substack.com/p/practical-parametric-yield"}, {"id": 25, "cat": "culture", "urgency": "watch", "source": "ChinaTalk / Cold Window Newsletter (Lily Ottinger)", "title": "Chinese fiction output collapsed: ~20 new short-fiction collections by June 2026 vs 30 in 2025, while webnovels become the default literature", "idea": "Lily Ottinger reads nearly every new Chinese short-fiction collection: ~20 published in all of mainland China by June this year, down from a 'shockingly low' 30 in 2025. 95后 and 00后 authors now form their own publishing bloc; the line between literary fiction and webnovels has blurred, with webnovels the default form and print literature 'the oddity'. The old trends (Dongbei Renaissance, feminist narrative, working-class non-fiction such as I Deliver Parcels in Beijing) no longer draw readers.", "angle": "Cultural signal on Chinese consumer attention and on youth: webnovels dominate and print collapses. Also AI is the main literary conversation: AI translation of Murakami and Hao Jingfang's reliance on AI.", "tweetA": "20 short-fiction collections in all of mainland China by June. 30 last year. Print literature is shrinking while webnovels are the default form. Cultural output is a leading indicator of consumer attention.", "tweetB": "The only topic Chinese readers and publishers agree on this year is AI: an AI translation of Murakami, a sci-fi writer who openly uses AI. Literary culture is where the AI storm shows up first.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.chinatalk.media/cp/217903916"}, {"id": 26, "cat": "culture", "urgency": "watch", "source": "ChinaTalk / Cold Window Newsletter (Lily Ottinger)", "title": "Apartment-complex noir: the 小区 (housing community) as a claustrophobic setting; Gen Z writers form a bloc", "idea": "Pick #5, Xue Shu's Hidden Malady, uses the modern Chinese 小区 (gated housing community) as a psychological-noir setting: claustrophobic, angular, prying eyes, unfriendly strangers, 'Rear Window narrated by a Shanghai philosophy professor'. Also: the author's #2 pick is one of the youngest Chinese authors she has read, and the five picks have no English translation.", "angle": "Housing-compound anonymity as a literary subject after the property cycle. A window into urban Chinese social isolation.", "tweetA": "Chinese fiction has found a new setting: the gated housing complex. After a property bust, the 小区 is a place you owe money on and don't know your neighbours. Culture catches up to the balance sheet.", "tweetB": "None of this year's top five Chinese short-fiction authors has been translated into English. The cultural frontier is invisible to Western investors.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.chinatalk.media/cp/217903916"}, {"id": 27, "cat": "energy", "urgency": "deep", "source": "Doomberg", "title": "Diesel 'straw man': the debate is framed as a ban vs. 'as you were', ignoring toggle/limit options for exports before the midterms", "idea": "Doomberg says Trump has many levers over runaway domestic diesel prices and that the industry/WSJ framing of 'ban or nothing' is a straw man; Doomberg's own wording is 'toggle' and 'limit'. WSJ's counter: the shortage is a global refining crisis and US refiners cushion volatility. Doomberg's reply: every refinery operates with government consent, which is conditional.", "angle": "Export-restriction risk is a tail for $VLO/$MPC/$PSX and a tailwind for domestic diesel prices, and Europe pays. A political-risk premium on refiners ahead of November.", "tweetA": "'Diesel ban' is the straw man. 'Toggle' is the real option: a discretionary export limit that goes on and off with the midterm calendar. Refiners pricing in a world with no state intervention are pricing the wrong tail. $VLO $MPC", "tweetB": "If a record-high diesel price is a midterm problem, the cheapest lever the White House has is the export valve. Refiners that volunteer to restrain are buying insurance.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://newsletter.doomberg.com/p/straw-clutching"}, {"id": 28, "cat": "energy", "urgency": "deep", "source": "Doomberg", "title": "Energy Secretary Wright is sounding out major refiners on a voluntary diesel export restriction as an alternative to a ban", "idea": "Press report relayed by Doomberg: Chris Wright has contacted executives at several major refiners to gauge support for a voluntary restriction on diesel exports as the administration searches for an alternative to a short-term ban. Doomberg reads this as a 'do it the easy way' message and argues the 'limited options' framing is wishcasting by those with a financial interest in high diesel prices.", "angle": "A voluntary curb is a precursor to a mandatory one. Time-limited signal: refiners' decision before the November midterms. Watch cracks, ULSD spreads, and European diesel.", "tweetA": "The Energy Secretary is asking refiners nicely first. That tells you the White House already has the compulsory version drafted. Crack spreads are pricing a world where nobody is asked. $VLO", "tweetB": "Voluntary restraints are what industries offer before mandatory ones. If a diesel export curb arrives, European diesel and ULSD cracks reprice first, U.S. pump prices second.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://newsletter.doomberg.com/p/straw-clutching"}, {"id": 29, "cat": "energy", "urgency": "deep", "source": "MacroEdge Energy", "title": "WTI floor settling at $80-82; SPR announcements (G7/IEA 100mmb) buy time only until early-to-mid December", "idea": "MacroEdge says the WTI floor is settling in the $80-$82/bbl range and expects it to reprice higher through Q4 and into 2027 regardless of macro softening. Latest SPR actions, on the back of the G7/IEA 100mmb announcement, are 'noise' that buys time through early to mid-December via demand subsidization. Strategy: 'patience through October' ahead of the midterms.", "angle": "A $80-82 floor sets the base case for energy equities. The question of why the West needs to subsidize demand if flows are fine is the market's own contradiction.", "tweetA": "WTI floor at $80-82 and the G7 is releasing 100mmb of SPR. If Hormuz flows and inventories are fine, why is the G7 subsidizing demand? Either the supply picture is worse than the headline or the SPR is a political tool.", "tweetB": "SPR releases buy time to mid-December. After that, the demand subsidy ends and WTI reprices. The Q4 energy trade is a calendar trade.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://macroedgeenergy.substack.com/p/oil-and-gas-research-weekly-energy-0d0"}, {"id": 30, "cat": "geopolitics", "urgency": "deep", "source": "MacroEdge Energy", "title": "Saudi/Houthi front is growing and Iran is using Yemen as a proxy; a Saudi ground invasion would be a multi-year disaster", "idea": "The war is becoming multi-faceted: the Saudi/Houthi component is growing in relevance and could escalate this month. Ansarallah forces in Yemen are landing strategic victories and serve as a proxy for Iran, avoiding direct airstrikes. A Saudi ground invasion of Yemen would be a disaster and a multi-year conflict. US-Iran is a lull, but Iran will eventually have to force an escalation to break the blockade. Escalation is expected near or after midterms.", "angle": "Red Sea/Bab el-Mandeb risk is an under-priced second chokepoint next to Hormuz. Watch tanker insurance and Saudi export routes.", "tweetA": "The Iran war has a Yemen front: Houthi wins let Iran avoid direct missile launches. Bab el-Mandeb is the second chokepoint nobody has priced. A Saudi ground invasion would make this a multi-year war.", "tweetB": "The market watches Hormuz. The escalation risk is moving to Yemen because it gives Tehran deniability. Oil is pricing the first chokepoint, not the second.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://macroedgeenergy.substack.com/p/oil-and-gas-research-weekly-energy-0d0"}, {"id": 31, "cat": "energy", "urgency": "deep", "source": "MacroEdge Energy", "title": "Europe has the highest economic-downside risk as countries limit and shut off exports one by one", "idea": "MacroEdge says Europe now faces the highest downside risk as producing countries limit and shut off exports one by one (covered briefly in the prior night's rant). The author's question of the week is why, if Hormuz/Bab flows, Russian refineries and inventories are fine, foreign nations are being begged to subsidize global demand for months.", "angle": "Export curbs from producers hit Europe hardest: a policy-driven supply shock. Cross-reference with the U.S. diesel export debate in Doomberg.", "tweetA": "Export controls are being added one country at a time and Europe is where it lands. No single announcement, just a sequence of quiet restrictions.", "tweetB": "The U.S. debating a diesel export curb while other producers limit exports means Europe's energy bill is set by foreign domestic politics. That's the real transmission into the euro area.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://macroedgeenergy.substack.com/p/oil-and-gas-research-weekly-energy-0d0"}, {"id": 32, "cat": "AI/infra", "urgency": "deep", "source": "Hardfork / Marvin's Best Weekly Reads", "title": "'AI air pocket' framework: either AI creates revenue and mass layoffs, or ROIC fails and chip/DC spend slows", "idea": "Quoted view: if AI creates significant revenue it implies mass layoffs; if not, a large slowdown in chip/AI-DC spending follows because ROIC isn't showing up. Most likely case: spending slows because of much higher debt terms, the capital stack becomes a real conversation for mega-caps for the first time, a drawdown/air pocket, then rebuild; a standard tech air pocket is ~3 years.", "angle": "Frames the AI trade as a binary on labor vs. capex. Combine with Oracle financing stress and a rising 10Y.", "tweetA": "AI is either a labor-market event or a capex event. Revenue means layoffs; no revenue means capex cut. There's no scenario where the build-out, the labor market and the debt market all stay quiet.", "tweetB": "A standard tech air pocket is ~3 years. The next one is financed with debt at higher yields. That's a different shape from 2000 and 2022.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://hardfork.substack.com/p/marvins-best-weekly-reads-oct-4th"}, {"id": 33, "cat": "geopolitics", "urgency": "deep", "source": "Hardfork / Marvin's Best Weekly Reads", "title": "Deep-sea mining: Rio, Glencore and BHP wait while U.S. executive orders de-risk licenses; China mines the seabed next to Japan's shelf later this year", "idea": "Arena Mag piece: Rio Tinto, Glencore and BHP have the capital and scale for deep-sea mining at volume and are watching from a distance; if the executive orders validate the legal framework, majors could absorb or displace the startups. The Clarion-Clipperton Zone under U.S. frameworks vs. Chinese state direction would yield different supply chains. China will be mining the seabed next to Japan's continental shelf later this year.", "angle": "Critical-minerals supply chain with a legal-framework race. $TMC-type startups as option value for majors. China moving first on a seabed near Japan.", "tweetA": "Rio, Glencore and BHP have the balance sheets to mine the seabed and are waiting for the U.S. to de-risk the legal framework. Startups prove it; majors acquire it. $TMC", "tweetB": "China will be mining the seabed near Japan's continental shelf later this year. Whoever sets the legal precedent for the Pacific floor sets the battery supply chain for decades.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://hardfork.substack.com/p/marvins-best-weekly-reads-oct-4th"}, {"id": 34, "cat": "positioning", "urgency": "deep", "source": "Hardfork / Marvin's Best Weekly Reads", "title": "Fund rotation: sellers of tech in June went into industrials (CAT, GEV, GE Aerospace, RTX, Eaton, Boeing) because it's 'technology in heavy machinery form'", "idea": "Quoted note: oil explains part of the outperformance but the real rotation from tech went into industrials, consistent with mandates; 'industrials are technology in heavy machinery form' is an easier story than owning oil and gas. Major holdings: Caterpillar, GE Vernova, GE Aerospace, RTX, Eaton, Boeing. The space-related sell-off probably went partly into this. The same people who sold tech in June think industrials are the best place to park money.", "angle": "AI-power-capex proxies in industrials are the second-order AI trade. Relevant to $GEV, $ETN, $CAT.", "tweetA": "Industrials is where tech money hid in June: CAT, GEV, GE, RTX, ETN, BA. 'Technology in heavy machinery form' is a good narrative and a crowded one. $GEV $ETN", "tweetB": "Mandate-friendly framing explains why funds own GE Vernova instead of oil. If AI power demand is the thesis, you can own it without saying 'AI'.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://hardfork.substack.com/p/marvins-best-weekly-reads-oct-4th"}, {"id": 35, "cat": "geopolitics", "urgency": "deep", "source": "Hardfork / Marvin's Best Weekly Reads", "title": "European defense/resilience as a secular shift: dependence on Visa, Amex and Mastercard, space sovereignty, dual-use tech", "idea": "An investor quoted in the roundup argues Europe's resilience theme is long-term secular: a wake-up call over dependence on the U.S., Europe falling behind in critical areas (AI centered in the Bay Area), payments dependence on Visa/Amex/Mastercard, defense tech and space sovereignty, and a hope for dual-use spillovers like in the U.S. in the 50s-70s.", "angle": "Payments sovereignty (digital euro, European rails) as an investable theme alongside defense and space.", "tweetA": "Europe depends on Visa, Amex and Mastercard for payments. That's a sovereignty problem as much as a defense one. Payments rails belong in the European resilience basket.", "tweetB": "The U.S. 1950s-70s dual-use playbook is the model Europe wants. Defense spend is the funding mechanism; commercial spinouts are the payoff.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://hardfork.substack.com/p/marvins-best-weekly-reads-oct-4th"}, {"id": 36, "cat": "geopolitics", "urgency": "deep", "source": "Hardfork / Marvin's Best Weekly Reads", "title": "EU put 14 Chinese firms into its 21st Russia sanctions package; Beijing 'hit back where it hurts'", "idea": "Excerpt: the EU's 21st sanctions package included 14 large Chinese businesses for providing dual-use goods to Russia; the piece argues Western leaders ignore how opponents respond, and notes Beijing quickly retaliated. Related excerpt on middle powers caught between a fading U.S. and a rising China, noting China went toe-to-toe with Trump post-Liberation Day.", "angle": "Retaliation channel is critical inputs (rare earths, supply chains). European industrials are the most exposed.", "tweetA": "The EU sanctions 14 Chinese companies and China retaliates in the one place Europe is dependent. Europe's strategic autonomy still ends where its supply chain begins.", "tweetB": "China went toe-to-toe with Trump after Liberation Day. Europe then picked a fight with China with far less leverage. The lesson from the first one wasn't learned.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://hardfork.substack.com/p/marvins-best-weekly-reads-oct-4th"}, {"id": 37, "cat": "macro", "urgency": "deep", "source": "Hardfork / Marvin's Best Weekly Reads", "title": "Korea moves to restrict leveraged ETFs after a boom-bust; 'fears of an AI bubble are quietly creeping back'", "idea": "Excerpt: leveraged financial products plus unsophisticated new buyers plus a strong fundamental story produce bubble and crash, or worsen one already in progress. Korea is now, 'a little belatedly', restricting leveraged ETFs. The fundamental story is more interesting: fears of an AI bubble are quietly creeping back.", "angle": "Retail-leverage regulation following a Korean stock boom-bust (the email doesn't name sectors). A positioning signal for retail-leverage appetite and AI-bubble sentiment.", "tweetA": "Korea is restricting leveraged ETFs after the boom and the bust. Regulators always arrive after the crash. The AI bubble fear is the part that's still live.", "tweetB": "Leveraged ETFs plus retail plus a strong story is a bubble recipe. Korea is closing the door after the horse has left, and the AI-bubble question now sits on top of it.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://hardfork.substack.com/p/marvins-best-weekly-reads-oct-4th"}, {"id": 38, "cat": "labor", "urgency": "deep", "source": "Hardfork / Marvin's Best Weekly Reads", "title": "Born on Third Base: only ~1/3 of Forbes 400 'self-made' came from poor/working/middle class without family capital, though media label 70% self-made", "idea": "Chuck Collins analyzed the Forbes 400's economic backgrounds: media label 70% 'self-made', but only about one-third came from poor, working-class or middle-class families with no significant family capital; two-thirds stood on generational wealth.", "angle": "Narrative vs. data on mobility. Useful for tweeting on wealth concentration and the 'founder myth' in venture.", "tweetA": "Media call 70% of the Forbes 400 self-made. Collins finds one-third started with no significant family capital. 'Self-made' is a story, not a statistic.", "tweetB": "The founder myth is a prior. Two-thirds of the Forbes 400 started with generational capital, which is the same pattern venture follows with network access.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://hardfork.substack.com/p/marvins-best-weekly-reads-oct-4th"}, {"id": 39, "cat": "culture", "urgency": "watch", "source": "Hardfork / Marvin's Best Weekly Reads", "title": "Germany's Mittelstand: 55% of GDP, 70% of exports; employs 2x the listed non-family corporates (5x in aggregate)", "idea": "The Mittelstand accounts for roughly 55% of German GDP and 70% of exports; one-to-one, its firms employ about twice as many as Germany's listed non-family corporations and about five times as many in aggregate. Drivers: owner-manager structure, values-based culture ('Kultur ist der gute Geist im Haus') and industrial significance, with multi-generational decision-making not dictated by quarterly earnings.", "angle": "Why German industry is hard to short and hard to invest in: it's private. Public-market proxies are thin.", "tweetA": "55% of German GDP, 70% of exports, and mostly private. The Mittelstand is the German equity market's biggest blind spot.", "tweetB": "Families that think in decades, not quarters. That's the opposite of the public-market model and maybe why German industry holds up through cycles.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://hardfork.substack.com/p/marvins-best-weekly-reads-oct-4th"}, {"id": 40, "cat": "geopolitics", "urgency": "deep", "source": "Hardfork / Marvin's Best Weekly Reads", "title": "Ukraine now key to Europe's defense: European finance and a fast-tracked military-industrial complex vs a $2T declining Russian economy", "idea": "Excerpt argues Ukraine has the innovation lead, 'unlimited' European finance and growing integration with Europe's defense industry; Russia's $2T declining economy can't compete with a $25T European backstop. NATO membership is 'no longer relevant' because Ukraine is now key to Europe's defence. Also noted: Russia's new social-media bans seen as a sign of expected defeat. (Author's partisan view.)", "angle": "Defense-tech dealmaking between European states and Ukraine. Drone scale-ups. Mark as a thesis, not a forecast.", "tweetA": "Ukraine used to need NATO. The argument now is that Europe needs Ukraine's drone industry. That reverses the leverage in any peace negotiation.", "tweetB": "European defense money is queueing for Ukrainian drone know-how. Procurement is the new alliance structure.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://hardfork.substack.com/p/marvins-best-weekly-reads-oct-4th"}, {"id": 41, "cat": "geopolitics", "urgency": "watch", "source": "Hardfork / Marvin's Best Weekly Reads", "title": "Unmanned systems solve 'concentration of force' and 'surprise' by making losses acceptable; Group 3 vertical-autonomy drones", "idea": "Quoted analysis: unmanned systems provide acceptable losses and speed, solving concentration of forces and surprise on a transparent battlefield; surprise requires decisive rather than piecemeal use. Linked reads: future of autonomous ground warfare and Vertical Autonomy Group 3 drones.", "angle": "Doctrine shift toward mass-attritable systems; supports $AVAV/$KTOS-type defense tech and low-cost autonomy.", "tweetA": "If losses are acceptable, concentration of force stops being a problem. Autonomy changes the cost-per-kill math before it c function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
