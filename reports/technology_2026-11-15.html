* { box-sizing: border-box; margin: 0; padding: 0; }

title": "In elephants, the resilience of communities has its limits", "published_date": "2026-11-13", "language": "en", "processed_at": "2026-11-15T11:08:29Z", "processor": "claude-code-sub-opus", "tags": ["Society"], "gist": "A Science study of 12 years of Asian elephant observations in Sri Lanka's Udawalawe National Park found that once losses outpaced newcomers around 2012, the female social network fractured into smaller, isolated communities, driven by shrinking grassland. Year-to-year 'flickering' in network statistics preceded the breakup and could serve as an early-warning signal for population collapse.", "themes": [{"theme": "Habitat decline at Udawalawe", "insights": [{"claim": "Udawalawe National Park in Sri Lanka, created in the 1970s around a reservoir, developed savanna-like grassland on abandoned farmland that supported large elephant herds, but invasive plants such as lantana are now taking over and reducing forage.", "speaker": "Jacek Krywko", "type": "causal", "entities": ["Udawalawe National Park", "Sri Lanka", "lantana", "Shermin de Silva"], "conviction": "high", "so_what": "Habitat carrying capacity, not just poaching, determines elephant population viability.", "quote": null, "locator": "Accidental savanna", "quote_verified": false}, {"claim": "Between 2007 and 2018 researchers identified 443 adult and subadult female elephants at Udawalawe, and by 2018 about 69 percent of females seen at the start were gone despite Asian elephants' 60-plus-year lifespans.", "speaker": "Jacek Krywko", "type": "data_point", "entities": ["Udawalawe National Park", "Asian elephants"], "conviction": "high", "so_what": "Quantifies a steep population decline in a flagship protected area.", "quote": null, "locator": "The turning point", "quote_verified": false}]}, {"theme": "Social network fracturing", "insights": [{"claim": "Using yearly social network reconstructions and a community-detection algorithm common in human network analysis, Anastasia Madsen's team found that after deaths and departures began outnumbering newcomers around 2012, elephant communities became smaller, more numerous and more isolated.", "speaker": "Jacek Krywko", "type": "data_point", "entities": ["Anastasia Madsen", "University of California, San Diego", "Asian elephants"], "conviction": "high", "so_what": "Steady attrition breaks social systems in ways acute shocks may not — a general model for network resilience.", "quote": null, "locator": "Networking elephants", "quote_verified": false}, {"claim": "Fracturing was not a statistical artifact: 59 resident elephants seen every year also changed their relationships, with fracturing appearing one to three years after the decline began.", "speaker": "Jacek Krywko", "type": "data_point", "entities": ["Anastasia Madsen"], "conviction": "high", "so_what": "Confirms structural social change among survivors, not just a smaller sample.", "quote": null, "locator": "A shrinking population naturally makes for a smaller network", "quote_verified": false}, {"claim": "The weakest ties among elephants — casual acquaintances that may represent mutual tolerance and carry information between communities — were the first to disappear, possibly along with key individuals who held subgroups together.", "speaker": "Jacek Krywko", "type": "causal", "entities": ["Anastasia Madsen"], "conviction": "medium", "so_what": "Weak ties and bridging nodes are critical to network cohesion, echoing human social network theory.", "quote": null, "locator": "The first ties to go were the weakest", "quote_verified": false}, {"claim": "Shermin de Silva links elephant social fracturing to disappearing grass, arguing that more severe competition for food shrinks each animal's social sphere toward fewer, higher-quality relationships.", "speaker": "Jacek Krywko", "type": "causal", "entities": ["Shermin de Silva"], "conviction": "medium", "so_what": "Resource scarcity drives social contraction — a mechanism relevant beyond ecology.", "quote": "As -phase-six-themes-from-the-bnef-summit-london-2026/", "title": "Europe’s Energy Transition Enters a New Phase: Six themes From the BNEF Summit London 2026 | BloombergNEF", "published_date": "2026-11-13", "language": "en", "processed_at": "2026-11-15T11:05:52Z", "processor": "claude-code-sub-opus", "tags": ["Energy", "AI", "Geopolitics", "Macro"], "gist": "BNEF's London 2026 summit recap (byline in text: Sunny Park, BNEF Summit team) says Europe's transition is now argued on security and cost, with AI/data-center-driven demand (+76% by 2050 projected) colliding with a grid that takes a decade to permit. Copper is flagged as the one transition metal where supply falls short, industrial policy is turning selective, and physical climate risk is now hitting portfolios.", "themes": [{"theme": "AI-driven European power demand", "insights": [{"claim": "BloombergNEF projects European electricity demand could rise 76% by 2050, driven by AI and data centers alongside electric vehicles, heat pumps and cooling, ending years of stagnant demand.", "speaker": "BloombergNEF", "type": "data_point", "entities": ["BloombergNEF", "Europe", "AI", "data centers", "electric vehicles", "heat pumps"], "conviction": "high", "so_what": "A structural reversal from flat to growing European load supports utilities, grid equipment and generation build-out over decades.", "quote": "BloombergNEF projects European electricity demand could increase by 76% by 2050.", "locator": "1. Energy security now means more than barrels", "quote_verified": true}, {"claim": "At the BNEF Summit London 2026 the AI debate shifted from computing power to energy infrastructure, with speakers arguing Europe's competitiveness may depend as much on reliable, affordable electricity as on digital capabilities.", "speaker": "BloombergNEF", "type": "thesis", "entities": ["AI", "data centers", "Europe"], "conviction": "medium", "so_what": "Power access, not chips, is framed as Europe's AI bottleneck; watch data-center siting ti ify far quicker.", "quote_verified": true}]}, {"theme": "Grid permitting bottleneck", "insights": [{"claim": "Elia Group CEO Bernard Gustin said data centers take about two years to build versus 10 years for a high-voltage grid line, of which nine years are administrative work and one year actual construction.", "speaker": "Bernard Gustin", "type": "data_point", "entities": ["Elia Group", "Bernard Gustin", "data centers", "high-voltage grid"], "conviction": "high", "so_what": "Permitting, not construction, is the binding constraint; permitting reform is a key catalyst for TSOs and grid-equipment suppliers.", "quote": "Nine years of administrative work and one year of real work, and that needs to change.", "locator": "Bernard Gustin, CEO of Elia Group, illustrated", "quote_verified": true}, {"claim": "Batteries, software and demand-side flexibility are viewed as important tools to squeeze more out of existing European networks while new grid capacity lags demand growth.", "speaker": "BloombergNEF", "type": "causal", "entities": ["batteries", "demand-side flexibility", "Europe"], "conviction": "medium", "so_what": "The grid-buildout lag creates a near-term market for storage and flexibility software.", "quote": null, "locator": "Batteries, software and demand-side flexibility", "quote_verified": false}, {"claim": "Octopus Energy CEO Greg Jackson argued the power system can be built dramatically faster by planning consumption and generation together rather than separately.", "speaker": "Greg Jackson", "type": "framework", "entities": ["Octopus Energy", "Greg Jackson"], "conviction": "high", "so_what": "Favors integrated supplier/flexibility platforms that co-optimize demand and generation.", "quote": "We can build out our new system dramatically faster if we take the systems thinking and join consumption and generation and think about the two together.", "locator": "As Greg Jackson, Founder and Chief Executive", "quote_verified": true}]}, {"theme": "Selective European
