ator": "Tokyo-based optimization software developer JIJ Inc.", "quote_verified": false, "speaker": "Mohamed Abdel-Kareem"}, {"claim": "SQOA Solver uses a (3,1) Quantum Random Access Code (QRAC) relaxation that maps up to three binary variables per physical qubit using Pauli X, Y, and Z operators.", "type": "data_point", "entities": ["SQOA Solver", "Quantum Random Access Code"], "conviction": "high", "so_what": "Up to three times the variable capacity per qubit effectively multiplies usable problem size on current hardware without waiting for larger QPUs.", "quote": "Maps up to three binary variables per physical qubit using Pauli X, Y, and Z operators.", "locator": "Encoding & Compression row of architecture table", "quote_verified": true, "speaker": "Mohamed Abdel-Kareem"}]}, {"theme": "Replacing variational loops", "insights": [{"claim": "Variational algorithms like QAOA typically need one physical qubit per binary variable and repeated quantum-classical optimization loops that accumulate hardware noise as circuit depth grows. SQOA Solver avoids both by packing non-interacting variables onto shared qubits and using the QPU only to sample bitstrings from a relaxed Hamiltonian.", "type": "causal", "entities": ["QAOA", "SQOA Solver"], "conviction": "high", "so_what": "This is part of a broader industry shift from variational loops to sample-then-classically-diagonalize (SQD-style) methods; QAOA-centric roadmaps look increasingly dated.", "quote": "restricting the quantum processor to sampling bitstrings from a non-diagonal relaxed Hamiltonian", "locator": "Conventional variational algorithms such as the", "quote_verified": true, "speaker": "Mohamed Abdel-Kareem"}, {"claim": "In SQOA Solver, state-preparation parameters are computed classically, and classical nodes project the relaxed Hamiltonian onto the subspace spanned by the sampled bitstrings, diagonalize it, and apply rounding and local search to recover feasible assignments.", "type": "framework", "entities": ["SQOA Solver"], "conviction": "high", "so_what": "The heavy lifting is classical, which keeps QPU time short (12.0 s in the MaxCut benchmark) but also means classical compute costs and comparisons to classical heuristics matter.", "quote": null, "locator": "In the post-processing stage, classical", "quote_verified": false, "speaker": "Mohamed Abdel-Kareem"}]}, {"theme": "IBM Heron r2 benchmark results", "insights": [{"claim": "On IBM Heron r2, SQOA Solver solved a 384-node 3-regular MaxCut instance on 129 qubits at a 98.5% approximation ratio with 12.0 seconds of QPU time, and a 200-node QOBLIB Maximum Independent Set instance on 67 qubits at a 100% approximation ratio.", "type": "data_point", "entities": ["IBM Heron r2", "SQOA Solver", "QOBLIB"], "conviction": "high", "so_what": "Roughly 3x variable compression with near-optimal results on standard benchmarks is an important proof point, though these instance sizes remain easy for classical solvers.", "quote": "Solved 384-node MaxCut on 129 qubits (98.5% AR, 12.0 s QPU) and 200-node MIS on 67 qubits (100% AR).", "locator": "IBM Heron r2 Benchmarks row", "quote_verified": true, "speaker": "Mohamed Abdel-Kareem"}]}, {"theme": "Enterprise integration and sizing", "insights": [{"claim": "SQOA Solver ingests QUBO dictionaries, qiskit-addon-opt-mapper models, and Open Mathematical Programming eXchange (OMMX) instances compiled through JIJ's JijModeling 2, so enterprise teams can move the same model between classical solvers and IBM Quantum hardware.", "type": "thesis", "entities": ["SQOA Solver", "OMMX", "JijModeling 2", "JIJ Inc."], "conviction": "medium", "so_what": "Solver-agnostic modeling lowers switching costs for enterprises and positions JIJ's modeling layer as sticky infrastructure regardless of which backend wins.", "quote": null, "locator": "The solver natively ingests Open Mathematical", "quote_verified": false, "speaker": "Mohamed Abdel-Kareem"}, {"claim": "SQOA Solver offers Small (up to 50 variables), Medium (up to 100 variables), and Large (up to 48 vCPU / 768 GB RAM) compute profiles.", "type": "data_point", "entities": ["SQOA Solver"], "conviction": "high", "so_what": "Tiered sizing suggests usage-based monetization inside IBM's catalog, but current tiers still cover small problem sizes.", "quote": null, "locator": "Modeling & Sizing Tiers row", "quote_verified": false, "speaker": "Mohamed Abdel-Kareem"}]}], "insight_total": 7, "top_entities": ["JIJ Inc.", "SQOA Solver", "IBM Quantum Functions Catalog", "IBM Heron r2", "SQOA-QR", "QAOA", "QOBLIB", "OMMX", "JijModeling 2", "Quantum Random Access Code", "Kipu Quantum"], "source_meta": {"author": "Mohamed Abdel-Kareem", "word_count": 476, "paywalled": false}}, {"record_id": "db6e17e48eec4c2c", "source_type": "technology", "source_name": "Quantum Computing Report", "source_url": "https://quantumcomputingreport.com/qfactorial-and-monash-university-secure-a1-12-million-758-6k-usd-australian-government-grant-for-quantum-logistics-optimization/", "title": "QFactorial and Monash University Secure A$1.12 Million ($$758.6K USD) Australian Government Grant for Quantum Logistics Optimization - Quantum Computing Report", "published_date": "2026-11-14", "language": "en", "processed_at": "2026-11-15T11:05:24Z", "processor": "claude-code-sub-opus", "tags": ["Tech", "Geopolitics"], "gist": "QFactorial and Monash University won about A$1.12 million (US$758.6K) under Round 2 Stage 2 of Australia's Critical Technologies Challenge Program. The grant funds a 15-month push of QFactorial's hybrid quantum-classical freight and last-mile routing solver from TRL 5 to TRL 7. The consortium spans the University of Queensland and Griffith University, compute from IBM Quantum, AWS and Fujitsu, and end users Team Global Express and Opal Packaging. Other Stage 2 grants went to Silicon Quantum Computing, QuantX Labs and others.", "themes": [{"theme": "CTCP grant and TRL targets", "insights": [{"claim": "QFactorial and Monash University secured about A$1.12 million (US$758.6K) under Round 2 Stage 2 of the Australian Department of Industry, Science and Resources' Critical Technologies Challenge Program to advance a hybrid quantum-classical optimization solver for freight and last-mile delivery.", "type": "data_point", "entities": ["QFactorial", "Monash University", "Critical Technologies Challenge Program"], "conviction": "high", "so_what": "This is a small, government-seeded grant; it is validation for an Australian quantum software startup rather than a material revenue event.", "quote": null, "locator": "Australian quantum software company QFactorial and", "quote_verified": false, "speaker": "Mohamed Abdel-Kareem"}, {"claim": "QFactorial's project was one of six Stage 2 demonstrator projects chosen from 14 initial feasibility awardees, and over 15 months it aims to take its routing and fleet-utilization platform from Technology Readiness Level 5 to TRL 7.", "type": "data_point", "entities": ["QFactorial", "Critical Technologies Challenge Program"], "conviction": "high", "so_what": "A TRL 7 target means a demonstration in an operational environment, so watch for reported results with real freight data by roughly early 2028.", "quote": null, "locator": "Selected as one of six Stage", "quote_verified": false, "speaker": "Mohamed Abdel-Kareem"}]}, {"theme": "Consortium of multi-cloud and freight users", "insights": [{"claim": "The QFactorial consortium uses IBM Quantum, Amazon Web Services and Fujitsu as multi-platform quantum and classical execution backends. Academic partners Monash, the University of Queensland and Griffith University work on error correction, noise mitigation and AI-driven modeling, and Team Global Express and Opal Packaging supply operational freight datasets.", "type": "data_point", "entities": ["QFactorial", "IBM Quantum", "Amazon Web Services", "Fujitsu", "Monash University", "University of Queensland", "Griffith University", "Team Global Express", "Opal Packaging"], "conviction": "high", "so_what": "Real logistics end users providing data is what moves quantum optimization beyond toy benchmarks; the hardware-agnostic setup hedges against any single QPU vendor.", "quote": null, "locator": "CTCP Round 2 Stage 2 consortium table", "quote_verified": false, "speaker": "Mohamed Abdel-Kareem"}, {"claim": "Combinatorial vehicle routing, load balancing, and fleet scheduling problems often exceed the time limits of exact classical solvers when constraints scale across national supply chains, which is the gap hybrid quantum solvers are targeting.", "type": "causal", "entities": ["vehicle routing"], "conviction": "medium", "so_what": "Logistics optimization is a recurring early-adopter vertical for quantum software, though heuristics already compete hard against exact-solver limits.", "quote": null, "locator": "Combinatorial vehicle routing, load balancing, and", "quote_verified": false, "speaker": "Mohamed Abdel-Kareem"}]}, {"theme": "Error mitigation as scaling prerequisite", "insights": [{"claim": "QFactorial Chief Scientist and Co-Founder Tavis Bennett says integrating tailored error-mitigation routines directly into the company's optimization circuits is essential for scaling hybrid solvers to production workloads. Monash researchers led by Professor Muhammad Usman will design circuit-specific error correction to suppress noise on near-term processors.", "type": "thesis", "entities": ["Tavis Bennett", "QFactorial", "Muhammad Usman", "Monash University"], "conviction": "medium", "so_what": "Application-specific error mitigation is becoming a differentiator for quantum software startups that run on noisy hardware.", "quote": "integrating tailored error-mitigation routines directly into the company’s optimization circuits is essential for scaling hybrid solvers to production workloads", "locator": "According to QFactorial Chief Scientist and", "quote_verified": true, "speaker": "Mohamed Abdel-Kareem"}]}, {"theme": "Australia's wider quantum grant cohort", "insights": [{"claim": "CTCP Round 2 Stage 2 also awarded demonstrator grants to Silicon Quantum Computing, QuantX Labs, Avicena Systems, iQ Sense, and FeBI Technologies across energy grid synchronization and quantum biosensing challenges.", "type": "data_point", "entities": ["Silicon Quantum Computing", "QuantX Labs", "Avicena Systems", "iQ Sense", "FeBI Technologies"], "conviction": "high", "so_what": "Australia is spreading small demonstrator grants across logistics, grids and biosensing; this cohort is the pipeline for future Australian quantum deals.", "quote": null, "locator": "Beyond logistics, CTCP Round 2 Stage", "quote_verified": false, "speaker": "Mohamed Abdel-Kareem"}]}], "insight_total": 6, "top_entities": ["QFactorial", "Monash University", "Critical Technologies Challenge Program", "IBM Quantum", "Amazon Web Services", "Fujitsu", "Team Global Express", "Opal Packaging", "Muhammad Usman", "Tavis Bennett", "Silicon Quantum Computing"], "source_meta": {"author": "Mohamed Abdel-Kareem", "word_count": 406, "paywalled": false}}, {"record_id": "db85f3ad613692b8", "source_type": "technology", "source_name": "Quantum Computing Report", "source_url": "https://quantumcomputingreport.com/german-aerospace-center-dlr-researchers-demonstrate-low-cost-benchmarked-noise-error-mitigation-across-100-qubit-ibm-and-iqm-processors/", "title": "German Aerospace Center (DLR) Researchers Demonstrate Low-Cost Benchmarked-Noise Error Mitigation Across 100-Qubit IBM and IQM Processors - Quantum Computing Report", "published_date": "2026-11-13", "language": "en", "processed_at": "2026-11-15T11:05:24Z", "processor": "claude-code-sub-opus", "tags": ["Tech"], "gist": "German Aerospace Center (DLR) researchers demonstrated randomized benchmarked-noise zero-noise extrapolation (bnZNE). It anchors ZNE to error rates measured on classically simulable twin circuits instead of idealized integer folding factors, and improves accuracy without extra shots. Tested on IBM's 156-qubit Heron r2 (ibm_fez) and IQM's 54-qubit Emerald at up to 100 qubits and two-qubit depth 452, it beat standard ZNE on every tested benchmark and showed that circuit depth matters more for mitigation accuracy than circuit area.", "themes": [{"theme": "Why standard ZNE breaks at utility scale", "insights": [{"claim": "Standard zero-noise extrapolation (ZNE) amplifies noise with redundant gate folds and extrapolates to zero noise, but at utility scale single-qubit gate errors, temporal calibration drift and noise saturation make integer folding factors diverge from physical error rates, introducing systematic bias.", "type": "causal", "entities": ["zero-noise extrapolation"], "conviction": "high", "so_what": "Standard ZNE results on 100-qubit-scale experiments may carry hidden bias, so treat utility-scale claims that rely on plain ZNE with caution.", "quote": "single-qubit gate errors, temporal calibration drift, and noise saturation cause the relationship between integer folding factors and physical error rates to diverge, introducing systematic bias", "locator": "Standard zero-noise extrapolation inflates circuit noise", "quote_verified": true, "speaker": "Mohamed Abdel-Kareem"}]}, {"theme": "bnZNE twin-circuit mechanism", "insights": [{"claim": "DLR's bnZNE pairs each randomized application circuit with a structure-mirroring twin that keeps the exact physical gate layout but evolves only to a classically computable bitstring or identity state, replacing idealized folding factors (r = 1, 3, 5) with empirically measured error rates.", "type": "framework", "entities": ["German Aerospace Center (DLR)", "bnZNE"], "conviction": "high", "so_what": "Calibrating extrapolation against measured hardware noise is a cheap, generalizable upgrade that any provider's mitigation stack could adopt.", "quote": "Replaces idealized integer folding factors (r = 1, 3, 5) with empirical error rates ε(r) ∈ [0, 1].", "locator": "Core Extrapolation Mechanism row", "quote_verified": true, "speaker": "Mohamed Abdel-Kareem"}, {"claim": "bnZNE matches standard ZNE shot budgets: 196,608 total shots per application (32 randomizations x 3 noise levels), with 1,024 shots each for application and benchmark circuits.", "type": "data_point", "entities": ["bnZNE", "zero-noise extrapolation"], "conviction": "high", "so_what": "Better accuracy at equal sampling cost means a direct reduction in effective QPU spend per reliable result.", "quote": null, "locator": "Sampling Cost Parity row", "quote_verified": false, "speaker": "Mohamed Abdel-Kareem"}, {"claim": "The bnZNE protocol combines Pauli twirling, dynamical decoupling and twirled readout error extinction (TREX) across multiple randomizations to anchor the extrapolation to real hardware noise conditions.", "type": "framework", "entities": ["bnZNE", "TREX"], "conviction": "medium", "so_what": "This stacks existing mitigation primitives that are already available in IBM's tooling, which lowers adoption friction.", "quote": null, "locator": "To anchor the classical extrapolation step", "quote_verified": false, "speaker": "Mohamed Abdel-Kareem"}]}, {"theme": "Cross-platform IBM and IQM validation", "insights": [{"claim": "bnZNE was validated on IBM's 156-qubit Heron r2 (ibm_fez) with a 100-qubit kicked Ising circuit (1,980 CZ gates), 50-qubit QFT and 5-qubit Grover circuits, and on IQM's 54-qubit Emerald with 30-qubit kicked Ising dynamics up to 40 Trotter steps (1,160 CZ gates). Workloads reached two-qubit gate depths up to 452.", "type": "data_point", "entities": ["IBM Quantum Heron r2", "ibm_fez", "IQM Emerald"], "conviction": "high", "so_what": "Working across both IBM and IQM gate sets shows the method is vendor-portable, which benefits European hardware like IQM competing with IBM.", "quote": null, "locator": "IBM Heron r2 Protocol and IQM Emerald Protocol rows", "quote_verified": false, "speaker": "Mohamed Abdel-Kareem"}, {"claim": "DLR's bnZNE outperformed standard ZNE on every tested single-qubit observable and two-qubi // ---------- helpers ----------
// YouTube-aligned hex colors for tinted insight chips (bg = color+"1a", text = color, border = color+"55").
const TYPE_HEX = {
  thesis: '#6366f1', prediction: '#0ea5e9', framework: '#8b5cf6',
  data_point: '#7c3aed', causal: '#d97706', contrarian: '#dc2626',
  anecdote: '#64748b',
};
const CONV_HEX = { high: '#7c3aed', medium: '#ca8a04', low: '#94a3b8', exploratory: '#94a3b8' };
function typeHex(t) { return TYPE_HEX[String(t || '').toLowerCase()] || '#475569'; }
function convHex(c) { return CONV_HEX[String(c || '').toLowerCase()] || '#64748b'; }

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }

// Tinted chip (YouTube style): faint bg, colored text + border.
function tintChip(text, color) {
  return `<span class="chip" style="background:${color}1a;color:${color};border-color:${color}55">${escapeHtml(text)}</span>`;
}
function tagPills(tags) {
  if (!tags || !tags.length) return '';
  return tags.map(t => `<span class="pill tag">${escapeHtml(t)}</span>`).join(' ');
}

  if (ins.type) meta.push(tintChip(ins.type, typeHex(ins.type)));
  if (ins.speaker) meta.push(`<span class="chip chip-spk">🗣 ${escapeHtml(ins.speaker)}</span>`);
  if (ins.conviction) meta.push(tintChip('conviction: ' + ins.conviction, convHex(ins.conviction)));
  (ins.entities || []).slice(0, 12).forEach(e => {
    if (e) meta.push(`<span class="chip chip-ent">${escapeHtml(e)}</span>`);
  });
  let quote = '';
  if (ins.quote) {
    const v = ins.quote_verified
      ? `<span class="vmark">✓ verified</span>`
      : `<span class="vmark no">unverified</span>`;
    quote = `<div class="quote">“${escapeHtml(ins.quote)}”${v}</div>`;
  }
  const so = ins.so_what
    ? `<div class="insight-so"><span class="lbl">so what</span>${escapeHtml(ins.so_what)}</div>` : '';
  return `
    <div class="${cls}">
      <div class="insight-claim">${escapeHtml(ins.claim || '')}</div>
      <div class="insight-meta">${meta.join('')}</div>
      ${so}
      ${quote}
    </div>`;
}

function renderTheme(theme) {
  const insights = (theme.insights || []).map(renderInsight).join('');
  return `
    <div class="theme">
      <div class="theme-title">${escapeHtml(theme.theme || 'Theme')}</div>
      ${insights}
    </div>`;
}

function renderCard(card) {
  if (!card) return '';
  const meta = card.source_meta || {};
  const nameHtml = card.source_url
    ? `<a class="source-name" href="${escapeAttr(card.source_url)}" target="_blank" rel="noopener">${escapeHtml(card.source_name || '')}</a>`
    : `<span class="source-name">${escapeHtml(card.source_name || '')}</span>`;
  const subBits = [];
  if (card.published_date) subBits.push(escapeHtml(card.published_date));
  if (meta.author) subBits.push(escapeHtml(meta.author));
  if (meta.word_count) subBits.push(`${meta.word_count} words`);
  if (meta.paywalled) subBits.push('paywalled');
  const themes = (card.themes || []).map(renderTheme).join('');
  const n = card.insight_total != null ? card.insight_total
            : (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
  return `
    <div class="source">
      <div class="source-head" onclick="toggleSource(this)">
        <div class="source-meta-left">
          <div class="source-name-row">${nameHtml}</div>
          <div class="source-title">${escapeHtml(card.title || '')}</div>
          <div class="source-sub">${subBits.join('  ·  ')}</div>
        </div>
        <span class="source-count">${n} insight${n === 1 ? '' : 's'}</span>
        <span class="source-arrow">▸</span>
      </div>
      <div class="source-body">
        ${card.gist ? `<div class="gist">${escapeHtml(card.gist)}</div>` : ''}
        ${card.tags && card.tags.length ? `<div class="tags">${tagPills(card.tags)}</div>` : ''}
        ${themes || '<div class="empty">No insights.</div>'}
      </div>
    </div>`;
}

function renderTopStats(d) {
  const s = d.stats || {};
  const parts = [];
  if (d.date) parts.push(`date <strong>${escapeHtml(d.date)}</strong>`);
  if (s.lookback_days != null) parts.push(`lookback <strong>${s.lookback_days}d</strong>`);
  if (s.sources != null) parts.push(`sources <strong>${s.sources}</strong>`);
  if (s.cards != null) parts.push(`cards <strong>${s.cards}</strong>`);
  if (s.insights != null) parts.push(`insights <strong>${s.insights}</strong>`);
  if (s.quote_verified_pct != null) parts.push(`quotes verified <strong>${s.quote_verified_pct}%</strong>`);
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSource(headEl) { headEl.parentElement.classList.toggle('open'); }

function insightCount(card) {
  return (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
}

// Build the sort/filter control bar (display only — re-groups REPORT_DATA in place).
function buildControls(d) {
  const cards = d.cards || [];
  const names = [...new Set(cards.map(c => c.source_name || '—'))].sort((a, b) => a.localeCompare(b));
  const opts = names.map(n => `<option value="${escapeAttr(n)}">${escapeHtml(n)}</option>`).join('');
  document.getElementById('controls').innerHTML =
    `<label>Sort
       <select id="sortSel">
         <option value="source">Source A–Z</option>
         <option value="insights">Insight count ▼</option>
       </select></label>
     <label>Source
       <select id="srcSel">
         <option value="__all">All sources (${names.length})</option>
         ${opts}
       </select></label>
     <span class="ctl-btns">
       <button type="button" id="expandAll">Expand all</button>
       <button type="button" id="collapseAll">Collapse all</button>
     </span>`;
  document.getElementById('sortSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('srcSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('expandAll').addEventListener('click', () => setAllGroups(false));
  document.getElementById('collapseAll').addEventListener('click', () => setAllGroups(true));
}

// Group-level collapse: header click toggles one group; the control-bar buttons toggle all.
function toggleGroup(headEl) { headEl.parentElement.classList.toggle('collapsed'); }
function setAllGroups(collapsed) {
  document.querySelectorAll('.group').forEach(g => g.classList.toggle('collapsed', collapsed));
}

// Group cards by source, sort groups (and cards within), optionally filter to one source.
function renderGroups(d) {
  const sortMode = (document.getElementById('sortSel') || {}).value || 'source';
  const srcFilter = (document.getElementById('srcSel') || {}).value || '__all';
  let cards = (d.cards || []).slice();
  if (srcFilter !== '__all') cards = cards.filter(c => (c.source_name || '—') === srcFilter);

  const groups = new Map();
  cards.forEach(c => {
    const k = c.source_name || '—';
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(c);
  });
  let entries = [...groups.entries()].map(([name, cs]) => ({
    name, cards: cs, insights: cs.reduce((a, c) => a + insightCount(c), 0),
  }));
  if (sortMode === 'insights') entries.sort((a, b) => b.insights - a.insights || a.name.localeCompare(b.name));
  else entries.sort((a, b) => a.name.localeCompare(b.name));
  // Within each source group, heaviest cards first.
  entries.forEach(e => e.cards.sort((a, b) => insightCount(b) - insightCount(a)));

  const html = entries.map(e => {
    const head = `<div class="group-head" onclick="toggleGroup(this)">`
      + `<span class="group-name">${escapeHtml(e.name)}</span>`
      + `<span class="group-meta">${e.cards.length} card${e.cards.length === 1 ? '' : 's'} · ${e.insights} insights</span>`
      + `<span class="group-arrow">▾</span></div>`;
    return `<div class="group">${head}<div class="group-body">${e.cards.map(renderCard).join('')}</div></div>`;
  }).join('');

  const app = document.getElementById('app');
  app.innerHTML = html || '<div class="empty">No cards for this source.</div>';
  // Open the first two source cards by default.
  document.querySelectorAll('.source').forEach((sec, i) => { if (i < 2) sec.classList.add('open'); });
}

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  document.getElementById('stats-top').innerHTML = renderTopStats(d);
  buildControls(d);
  renderGroups(d);   // default: grouped, sorted by source A–Z
}

renderReport(REPORT_DATA);
</script>
</body>
</html>
