<script>
const DATA={"meta": {"date": "2026-10-17", "time": "21:04 CEST", "windowStart": "2026-10-17 15:04 CEST", "windowEnd": "2026-10-17 21:04 CEST", "emailsInWindow": 8, "emailsRead": 8, "itemsExtracted": 26, "includedSources": [{"name": "Dark Side of the Boom (Goldman takeaways)", "items": 5}, {"name": "a16z crypto / Chris Dixon & Jeremy Allaire", "items": 3}, {"name": "Unchained / Laura Shin", "items": 9}, {"name": "AI Agents Weekly / Elvis Saravia", "items": 2}, {"name": "This Week in Startups", "items": 1}, {"name": "Herb Greenberg / The Wrap", "items": 1}, {"name": "James Bulltard", "items": 5}], "skippedSources": [{"name": "BEP Research - The CPU Decision Starts With the Full Bill", "reason": "Received 15:03:36 CEST (13:03:36 UTC), 60 seconds before the 15:04:36 cutoff. Excluded per hard time boundary, not read."}, {"name": "Sponsor blocks inside TWiST and Unchained", "reason": "Pure promotional (listener survey, sponsors); skipped."}]}, "items": [{"id": 1, "cat": "credit", "urgency": "deep", "source": "Dark Side of the Boom (Goldman takeaways)", "title": "AI credit selloff is concentrated, not systemic", "idea": "Goldman (Lynam, Grut, Ali): the AI credit selloff sits closest to data centers, neoclouds and frontier-model financing rather than across credit. Goldman is not backing away from the buildout - the financing requirement keeps getting larger.", "angle": "Separates the 'AI credit crisis' headline from where the stress really is. Tradeable as a dispersion call inside HY and IG.", "tweetA": "Everyone asks if AI credit is cracking. Goldman's answer: only in the corners funding data centers, neoclouds and frontier labs. That's not contagion, it's a sorting mechanism, and the sort is happening in public.", "tweetB": "Selloff concentrated, financing need rising. That's the setup where spreads on the weakest projects gap wider while the buildout keeps going. The buildout doesn't stop, it reprices.", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening"}, "link": "https://thedarksideoftheboom.substack.com/p/ai-credits-next-test-who-owns-the"}, {"id": 2, "cat": "credit", "urgency": "deep", "source": "Dark Side of the Boom (Goldman takeaways)", "title": "Who owns the paper: advisers and insurers hold HY project finance", "idea": "Investment advisers and insurers have become the dominant reported holders of high-yield project-finance paper just as the asset class sees its first serious repricing. Another huge wave of issuance is coming into a market built on relentless new supply, so the exit narrows.", "angle": "Insurer balance sheets as a transmission channel from data center credit to the broader financial system. Look for who has to be a forced seller.", "tweetA": "Insurers and RIAs are now the biggest reported holders of high-yield project-finance paper. Those are buyers with liability matching, not trading desks. When the exit narrows, they don't sell. They stop buying, which is worse for the next issue.", "tweetB": "Question for the AI capex bulls: who is the marginal buyer of the next $50B of data center debt once the current holders are full? Goldman's own framing says the next phase is decided project by project: tenant quality, construction progress, refinancing structure.", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening"}, "link": "https://thedarksideoftheboom.substack.com/p/ai-credits-next-test-who-owns-the"}, {"id": 3, "cat": "credit", "urgency": "deep", "source": "Dark Side of the Boom (Goldman takeaways)", "title": "Next phase of AI credit: decided by the project, not the narrative", "idea": "Goldman's takeaway: tenant quality, construction progress, refinancing structure and contractual protection become the real dividing lines. Narrative-level exposure to 'AI' no longer works as a credit factor.", "angle": "Credit selection framework for AI infra: read the tenant and the covenant, not the headline.", "tweetA": "AI credit has moved from a beta trade to a covenant-reading exercise. Tenant, construction schedule, refi wall. If you can't name all three for your position, you own the narrative, not the bond.", "tweetB": "Two data centers with identical GPUs can have opposite credit outcomes depending on who signed the lease. That's the new alpha, and it isn't in any ETF.", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening"}, "link": "https://thedarksideoftheboom.substack.com/p/ai-credits-next-test-who-owns-the"}, {"id": 4, "cat": "crypto", "urgency": "deep", "source": "a16z crypto / Chris Dixon & Jeremy Allaire", "title": "Circle: $150B a quarter minted and redeemed, and CCTP as the highway", "idea": "Allaire says Circle mints and redeems about $150B per quarter, plugged into banking systems globally. CCTP is the most widely used interoperability protocol across chains, and on Arc any issued asset becomes eligible to ride the CCTP payload. His line: 'the stablecoin market is winner-take-most, not winner-take-all.'", "angle": "Moat framing from the issuer itself: liquidity and utility network effects plus regulated infrastructure. Relevant for $CRCL and the L1 vs stablecoin-chain debate.", "tweetA": "$150B a quarter minted and redeemed. That's the number to hold in your head when someone says stablecoins are a crypto-native toy. The moat Circle describes is a bank-integration moat, not a blockchain one.", "tweetB": "Circle built the highway and only USDC could drive on it. Arc lets other assets use it. Strategically that's a shift from a product to a toll road, and the toll road is where valuation multiples live. $CRCL", "charts": {"count": 0, "hot": false, "desc": "Podcast, no charts"}, "link": "https://a16zcrypto.substack.com/p/money-for-machines-circle-ceo-jeremy"}, {"id": 5, "cat": "ai/infra", "urgency": "watch", "source": "a16z crypto / Chris Dixon & Jeremy Allaire", "title": "Fly Brain: a fly's connectome as 16MB of bytecode on Arc", "idea": "Allaire flagged a project that converted neurological rules of real fly brains into 16 megabytes of bytecode running on Arc, with AI-built UX where the brains evolve. Another project on Arc is arbitration for AI work: AI jurors up to human arbitrators with a staking model, built for a world where AI hires AI.", "angle": "Weird-but-informative: AI agents plus onchain execution produce odd experiments. The arbitration layer for machine labor is a real gap.", "tweetA": "Someone put a fly's brain on a blockchain in 16MB. Allaire isn't sure it isn't a scam. Fine. The other project is the interesting one: arbitration for AI hiring AI. Once agents contract with agents, somebody has to adjudicate the dispute.", "tweetB": "Dixon's rule: the next big thing starts out looking like a toy. Fly Brain is a toy. Escrow and arbitration for machine-to-machine labor markets isn't.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://a16zcrypto.substack.com/p/money-for-machines-circle-ceo-jeremy"}, {"id": 6, "cat": "crypto", "urgency": "deep", "source": "a16z crypto / Chris Dixon & Jeremy Allaire", "title": "Credit marketplaces that look like AdWords, and a mostly-machine internet", "idea": "Allaire expects blockchains plus fully reserved digital dollars plus AI to create new credit instruments, with credit marketplaces that look more like AdWords than like bundled bonds. Dixon: it is 'very plausible that the vast majority of internet participants will be machines', and blockchains are an antidote to AI centralisation.", "angle": "Credit market structure shift: auction-based micro-credit instead of securitisation. Ties directly into the AI credit stress in the Goldman piece.", "tweetA": "Allaire's picture of credit: an auction like AdWords, not a pool of loans sold as a bond. Compare that with Goldman's note that insurers are stuck holding concentrated project paper. One of these market structures has a price discovery problem.", "tweetB": "Dixon says most internet participants will be machines. If so, the CAC of a customer is a gas fee and the unit of competition is latency. Which companies are priced for that?", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://a16zcrypto.substack.com/p/money-for-machines-circle-ceo-jeremy"}, {"id": 7, "cat": "crypto", "urgency": "act", "source": "Unchained / Laura Shin", "title": "Ledger spy implant: $102M from 324 wallets, three chips, two more resellers", "idea": "Bitquery tallies $102M stolen from 324 wallets. The implant uses three chips: one reads the screen, one is a cellular modem, one is an eSIM. Karpeles says he found it in devices from two more authorized resellers (Changi Airport, MediaMarkt Germany) and that the newest version clips in and is 'made for mass production'. Ledger says its German stock was clean. MediaMarkt Saturn pulled devices Oct 13, Trezor cut its reseller list.", "angle": "Hardware supply-chain attack on self-custody. 'Not your keys' fails when the screen is the leak. Positive read-through for qualified custodians, negative for hardware wallet resellers.", "tweetA": "A modem, an eSIM and a screen reader: $102M from 324 wallets and the cost of the implant is probably a few dollars. Self-custody's weakest link was the retail shelf. Custody is a supply chain business, and most users never audited theirs.", "tweetB": "Ledger launched an $849 cellular-connected device the same day it published its account of an attack carried out by cellular implants. Timing aside, the lesson for allocators is who holds the keys and how many hands touched the box. $COIN", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://unchainedcrypto.beehiiv.com/p/weekly-recap-ledger-s-spy-implant-spreads-richard-heart-detained-in-turkey-3db9"}, {"id": 8, "cat": "crypto", "urgency": "deep", "source": "Unchained / Laura Shin", "title": "Richard Heart detained in Istanbul: HEX -32%, PulseX -36%", "idea": "HEX and PulseChain founder Richard Heart was detained in Istanbul on an Interpol Red Notice issued at Finland's request (tax evasion and assault allegations, remanded in absentia in 2024). HEX fell about 32% and PulseX about 36% in a day. A US judge dismissed the SEC fraud case in 2025 for lack of jurisdiction. Reports on what was seized range from $600k and 24 watches to $4M and 64 watches.", "angle": "Founder-risk case study in jurisdictional arbitrage: the US lost reach, an Interpol notice found him anyway.", "tweetA": "The SEC lost on jurisdiction in the US. A Finnish red notice and a Turkish raid didn't need one. Founder-dependent tokens carry a legal-geography risk that no tokenomics model prices.", "tweetB": "HEX -32%, PulseX -36% in a day on a detention. That's what a single-person key-man risk looks like in a token. Do the same exercise on every token whose roadmap is one person's X account.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://unchainedcrypto.beehiiv.com/p/weekly-recap-ledger-s-spy-implant-spreads-richard-heart-detained-in-turkey-3db9"}, {"id": 9, "cat": "macro", "urgency": "deep", "source": "Unchained / Laura Shin", "title": "CPI 3.7% y/y, Kospi -9% intraday with halt, Nikkei -5%, BTC to $80.5k", "idea": "September US CPI rose 0.6% m/m and 3.7% y/y, with gasoline over half the monthly increase. Kospi fell more than 9% intraday and triggered a 20-minute halt, Nikkei closed down nearly 5%. BTC touched about $80.5k, crypto liquidations topped $950M in 24h, and BTC was near $81.5k Friday. The Fed meets Oct 27-28, the first meeting since its September hike, its first in over three years.", "angle": "Global risk-off with Asia as the transmission. Rates are rising into an energy shock, so the Fed is hiking into stagflation optics.", "tweetA": "Kospi -9% intraday, 20-minute halt. Nikkei -5%. A 3.7% CPI with gasoline doing the heavy lifting. Asia is where the oil shock bites first because they import the barrels. Watch KRW and JPY before you watch the Fed.", "tweetB": "The Fed hiked in September for the first time in three years and gets a 3.7% print one month later. BTC sat near $80k through all of it. That's not a risk-on asset. It's a levered duration asset, and the duration just got longer.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://unchainedcrypto.beehiiv.com/p/weekly-recap-ledger-s-spy-implant-spreads-richard-heart-detained-in-turkey-3db9"}, {"id": 10, "cat": "crypto", "urgency": "deep", "source": "Unchained / Laura Shin", "title": "MSCI to drop Strategy and Metaplanet; STRC buyback 9x the BTC purchase", "idea": "MSCI will screen out 'non-operating companies', putting Strategy and Metaplanet in line for deletion at the November review (final list Nov 11, effective after close Nov 30). Strategy spent $192.4M on STRC preferred buybacks last week versus $21.5M on bitcoin, mostly funded by common share sales. Shareholders vote Oct 28 on daily dividends on STRC and three other preferreds.", "angle": "The treasury-company flywheel is running in reverse: index exclusion plus buybacks funded by dilution. Forced passive selling window in November.", "tweetA": "Strategy spent $192M defending its preferred and $21.5M buying bitcoin. The BTC treasury company is now a preferred-stock support vehicle that sells common to pay for it. Add an MSCI deletion on Nov 30. $MSTR", "tweetB": "Passive funds that must sell Metaplanet and Strategy have a date: after the close on Nov 30. Everyone knows. That's a crowded exit, and I want to know who the natural buyer is. $MSTR", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://unchainedcrypto.beehiiv.com/p/weekly-recap-ledger-s-spy-implant-spreads-richard-heart-detained-in-turkey-3db9"}, {"id": 11, "cat": "regulation", "urgency": "deep", "source": "Unchained / Laura Shin", "title": "Tether money traced to Bo Hines' firm; compliance window 18 to 36 months", "idea": "WSJ reports Nxum, co-owned by Bo Hines while he led the White House stablecoin push, took in about $6.3M under a Tether marketing deal; the first $2.49M left Bitfinex in May 2025, two months before the GENIUS Act became law. Hines allegedly pressed lawmakers to stretch the compliance window from 18 to 36 months, which mainly benefited Tether. Nxum says he didn't know and received no Tether-derived funds in government.", "angle": "Policy-capture narrative around stablecoin legislation. Competitive consequence for USDC vs USDT in the US.", "tweetA": "An extra 18 months on the compliance window is worth more to the largest offshore issuer than any marketing deal. That's the question the WSJ piece raises: was the money the payment, or the receipt?", "tweetB": "GENIUS gave offshore issuers 36 months instead of 18. USDC just got named the EU's first significant stablecoin and faces 60% bank-deposit reserve rules. One issuer gets time, the other gets supervised. $CRCL", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://unchainedcrypto.beehiiv.com/p/weekly-recap-ledger-s-spy-implant-spreads-richard-heart-detained-in-turkey-3db9"}, {"id": 12, "cat": "regulation", "urgency": "deep", "source": "Unchained / Laura Shin", "title": "CFTC defines event contracts as swaps and carves out sportsbooks", "idea": "The CFTC proposed defining event contracts on sports, politics, culture and weather as swaps, giving it exclusive jurisdiction, with a companion rule excluding sportsbook bets and casino games. Appeals courts have split and New Jersey asked the Supreme Court to step in. Kalshi's Mansour: the choice is 'prediction markets in the US or offshore'. A federal judge refused to undo Gemini's CFTC consent order even with the agency's backing.", "angle": "Federal pre-emption move for prediction markets. Sets up a Supreme Court showdown between the CFTC and the states.", "tweetA": "The CFTC wants every event contract to be a swap. States call sports contracts gambling. The Supreme Court will probably decide whether 'who wins the election' and 'who wins the Super Bowl' are the same instrument.", "tweetB": "Gemini's judge ruled that a change in enforcement priorities isn't a change in law. Apply that to the CFTC's new swap definition: the rule can change in a year, but a court ruling is for the next administration to inherit.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://unchainedcrypto.beehiiv.com/p/weekly-recap-ledger-s-spy-implant-spreads-richard-heart-detained-in-turkey-3db9"}, {"id": 13, "cat": "regulation", "urgency": "deep", "source": "Unchained / Laura Shin", "title": "USDC is the EU's first 'significant' e-money token; Circle's 59 cents", "idea": "The EBA named USDC the first significant e-money token under MiCA (out of 45 notified). From Nov 12 it supervises reserves, liquidity and capital of Circle's EU issuer. Significant tokens must hold at least 60% of reserves as bank deposits vs 30% for others. Circle disclosed about $1.4B of H1 revenue with roughly $819M (59 cents per dollar) going to distribution partners and transaction costs, $473M reinvested, and 7 cents profit per dollar.", "angle": "Margin structure of the largest regulated stablecoin: most revenue goes to distribution. Regulatory designation raises cost in the EU.", "tweetA": "Of every revenue dollar Circle books, 59 cents goes to partners and transaction costs and 7 cents is profit. The product is a distribution business that happens to hold treasuries. The EU just added a 60% bank deposit requirement. $CRCL", "tweetB": "Open USD promises partners nearly all of the reserve income. Circle just showed the math on why it can't. If the partner take rate goes to 100%, the issuer is a utility. Which side of that trade are you on? $COIN $CRCL", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://unchainedcrypto.beehiiv.com/p/weekly-recap-ledger-s-spy-implant-spreads-richard-heart-detained-in-turkey-3db9"}, {"id": 14, "cat": "crypto", "urgency": "watch", "source": "Unchained / Laura Shin", "title": "Quantum: Starknet vote to go post-quantum L1; Coinbase says start now", "idea": "StarkWare opened a vote (closes Oct 22) on researching leaving Ethereum to become an independent post-quantum L1, since its bridge and data layer follow Ethereum's schedule. Coinbase, holding about 5% of all BTC by its own count, told Bitcoin developers to begin quantum-resistant upgrades now, favoring designs that can swap signature schemes later and arguing that dormant coins should be debated separately.", "angle": "Quantum risk is moving from white paper to governance vote. The largest custodian is lobbying Bitcoin devs.", "tweetA": "Coinbase holds about 5% of all BTC and is asking Bitcoin devs to start quantum migration before the threat is proven. The dormant coin question is the real fight: freezing coins is the end of 'code is law'. $COIN", "tweetB": "A Starknet vote on leaving Ethereum for post-quantum reasons is the first time a major L2 puts the quantum clock on a ballot. Early results near-unanimous. Ethereum's roadmap just got a credible competitor on one narrow axis.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://unchainedcrypto.beehiiv.com/p/weekly-recap-ledger-s-spy-implant-spreads-richard-heart-detained-in-turkey-3db9"}, {"id": 15, "cat": "tech", "urgency": "watch", "source": "Unchained / Laura Shin", "title": "Network School buys Farcaster; 'digital felonies' via onchain NFT", "idea": "Balaji Srinivasan's Network School acquired Farcaster from Neynar, which bought it in January; terms undisclosed. Users must accept a 'social smart contract' recorded with an onchain access NFT, with bannable 'digital felonies' from scams to repeatedly starting fights. Decliners keep read-only access and can take keys, followers and posts elsewhere. The app is renamed 'Network State Protocol'.", "angle": "Decentralised social protocol as a governance experiment: portability exists, but the app layer is now a state with a criminal code.", "tweetA": "Farcaster changed hands twice in one year. The protocol promise is portability: take your keys and followers and leave. The new owner is writing a criminal code for the app. Both can be true, but only one of them is a product.", "tweetB": "Banning users over months-old posts under a 'social smart contract' is the best argument yet for why neutral protocols need separation from the app layer.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://unchainedcrypto.beehiiv.com/p/weekly-recap-ledger-s-spy-implant-spreads-richard-heart-detained-in-turkey-3db9"}, {"id": 16, "cat": "ai/infra", "urgency": "deep", "source": "AI Agents Weekly / Elvis Saravia", "title": "Meta open-sources Muse Spark Open: 816B MoE, 42B active, 1M context", "idea": "Meta released weights for Muse Spark Open, called the most capable US open-weight model: natively multimodal MoE, 816B total and 42B active parameters, 1M-token context. Scores: 89.2 MCP-Atlas, 80.4 OSWorld Verified, 76.4% Terminal-Bench 2.1. Artificial Analysis index 39, behind GLM 5.3, Kimi K3 and Qwen3.8-2.4T. Meta says it runs on two Apple M5 Ultra Mac Studios with MLX. License is limited commercial. Hosted by Baseten, Fireworks, Groq, Nebius, OpenRouter, Together and others.", "angle": "Open-weight frontier is now Chinese-led on the index and a US model competes on agentic coding. Local inference on 2 Mac Studios is a compute-demand datapoint.", "tweetA": "Meta's open model is 816B parameters and runs on two Mac Studios. It still ranks behind three Chinese models on the Artificial Analysis index. The open-weight race is a geopolitical one now, and inference-on-the-desk is an argument against hyperscaler capture. $META $AAPL", "tweetB": "42B active parameters of 816B. That's the MoE tax: you need the memory of the big model and the compute of a small one. Memory bandwidth is the scarce resource, not FLOPS. $MU $NVDA", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://nlp.elvissaravia.com/p/ai-agents-weekly-muse-spark-open"}, {"id": 17, "cat": "ai/infra", "urgency": "watch", "source": "AI Agents Weekly / Elvis Saravia", "title": "Agent tooling week: Gemini Argon beats Minecraft, Scion replaces git, OpenTelemetry for Claude", "idea": "Headlines from the same issue (only the Muse Spark story has body text in the email): Gemini Argon agents beat Minecraft, OpenCode 2.0 ships Code Mode, NVIDIA Nemotron 3.5 Super VL, OpenRouter Armor for tool calls, Claude Platform adds OpenTelemetry traces, DeepSeek V4.1-Flash-1017, Fish Audio opens Drama 3 weights, 'forgetting helps autoresearch agents scale', and Anthropic replaces git with Scion.", "angle": "Agent infrastructure is moving to observability and security layers (OpenTelemetry, Armor), an enterprise-adoption tell.", "tweetA": "OpenTelemetry traces for Claude and tool-call security at OpenRouter in the same week. Nobody builds observability and armor for toys. Agent workloads are now production systems with SRE and security budgets.", "tweetB": "'Forgetting helps autoresearch agents scale' is the sleeper. If memory pruning is the scaling trick, the memory-hungry agent narrative has a software counterweight. Full story is in the newsletter.", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening"}, "link": "https://nlp.elvissaravia.com/p/ai-agents-weekly-muse-spark-open"}, {"id": 18, "cat": "venture", "urgency": "watch", "source": "This Week in Startups", "title": "AEO: how to get recommended by LLMs and agents (Railway CEO Jake Cooper)", "idea": "TWiST's Saturday recap highlights Railway CEO Jake Cooper's deep dive on Answer Engine Optimization: making products appealing to agents and AI assistants, called the week's most direct advice. Also: Flexport CEO Ryan Petersen on a16z saying 'the key to success is dumb competition'; Stripe's Katie Dill on UI; YC's Christina Gilbert says do the first 100 outreaches without automation.", "angle": "Distribution is shifting from search to agent recommendation. Founders now optimise for model citations.", "tweetA": "SEO took twenty years to become a line item. AEO is already a deep-dive topic from a CEO whose customers are developers. The new channel is not the customer, it's the agent the customer asked.", "tweetB": "Petersen's 'dumb competition' is a contrarian moat claim: pick markets where incumbents are lazy. In an AEO world, lazy incumbents are the ones without agent-readable docs.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://twistartups.substack.com/p/saturday-update-this-week-in-founder"}, {"id": 19, "cat": "macro", "urgency": "deep", "source": "Herb Greenberg / The Wrap", "title": "CoreWeave -25% on credit concerns; 'just trust us' and the Netscape math", "idea": "Greenberg: CoreWeave fell 25% last week on credit concerns while Jensen Huang told Bloomberg 'all of this is going to pass'. He calls the debt-powered AI buildout and decades-out IPO valuations a 'just trust us' trade. Netscape: sold to AOL for $4.2B, then to Verizon (inside AOL) for $4.4B, with the Netscape asset worth effectively zero or negative along the way.", "angle": "Credit, not equity multiples, is where the AI bubble argument lives now. Pairs with the Goldman concentration data.", "tweetA": "CoreWeave -25% in a week on credit concerns, and the CEO of its biggest supplier says it will 'pass'. Compare it with Goldman's note that the stress is concentrated in neoclouds and data center paper. Same story, two sources. $CRWV $NVDA", "tweetB": "Greenberg's Netscape example: $4.2B to $4.4B over two decades, yet the asset itself went to zero. A deal price is not value. Apply that to every private AI mark that hasn't traded since the last round.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.herbgreenberg.com/p/the-wrap-just-trust-us"}, {"id": 20, "cat": "positioning", "urgency": "deep", "source": "James Bulltard", "title": "QQQ loses its 6-month uptrend; SPY bearish engulfing below the 50-day", "idea": "Bulltard: QQQ lost the uptrend that held since the war lows after multiple tests; a big Thursday rally tested the underside and reversed Friday. SPY formed a bearish engulfing candle closing below the 50-day, though still inside the multi-month range. His call: weakness in tech, not necessarily the market; rotate to sectors that do well when tech doesn't. Trend breaks after six months rarely recover instantly.", "angle": "Technical regime change in the index that's overweight AI. Pairs with Greenberg's credit worry.", "tweetA": "Rallied into the trendline on Thursday and got rejected on Friday. That's the trade people will remember: the retest that failed. QQQ's six-month support is now resistance. $QQQ", "tweetB": "Bulltard says it's not the AI bubble deflating, just rotation. I'd ask why the rotation target is 'defensives' and not 'cash': both are what you get when the discount rate rises.", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening"}, "link": "https://www.jamesbulltard.com/p/tech-stocks-finally-broke-down"}, {"id": 21, "cat": "macro", "urgency": "deep", "source": "James Bulltard", "title": "Earnings yield 5.35% vs 20y Treasury ~5.5%: the equity risk premium is gone", "idea": "Bulltard (citing Mike Zaccardi): SPY forward P/E is 18.7, giving an earnings yield of 5.35%, while the 20-year Treasury yields almost 5.5% and he says near 6% elsewhere on the curve. 'A P/E ratio is correlated to the risk-free rate'; 30x earnings was cheap in a decade of near-zero rates and is not now. Rates are being hiked and CPI this week says they are not going lower.", "angle": "Negative equity risk premium: stocks yield less than a risk-free bond. Valuation compression is the mechanism behind the tech breakdown.", "tweetA": "Earnings yield 5.35%, 20-year Treasury 5.5%. You're being paid less than the risk-free rate to own the S&P. Last time that held, the answer came from multiples, not earnings. $SPY", "tweetB": "Bulltard says the stock market is 'cheaper than it's been in a long time' at 18.7x. The Treasury market says it's expensive. Same number, two readings. The 20-year is the one that doesn't have an earnings season.", "charts": {"count": 0, "hot": false, "desc": "Includes an embedded Zaccardi tweet chart - worth opening"}, "link": "https://www.jamesbulltard.com/p/tech-stocks-finally-broke-down"}, {"id": 22, "cat": "positioning", "urgency": "watch", "source": "James Bulltard", "title": "Narrative whiplash: MSFT -30% in June, now third-best Mag 7; Apple the only outperformer", "idea": "Bulltard: Apple, the Mag 7 name not investing heavily in AI, is the only one outperforming the index this year. MSFT was down 30% at one point in late June and is now the third-best Mag 7 YTD behind Apple and Nvidia. Google went from consensus AI winner to +6.8% YTD. Amazon was the top analyst pick for the second straight year and returned about 5% last year and about 10% so far, lagging tech. His conclusion: consensus longs get punished.", "angle": "Narrative half-life is shrinking; crowded consensus is a negative-carry position.", "tweetA": "Microsoft down 30% in June and third-best of the Mag 7 by October. Apple, the AI laggard, leads. Your narrative half-life is now shorter than an earnings cycle. $MSFT $AAPL", "tweetB": "80% of analysts pick Amazon every December and it lags tech two years running. The Street's top pick is a signal, but only if you trade it the other way. $AMZN", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.jamesbulltard.com/p/tech-stocks-finally-broke-down"}, {"id": 23, "cat": "positioning", "urgency": "act", "source": "James Bulltard", "title": "'Somebody big blew up': VIX spike on no news, leverage unwinding", "idea": "Bulltard's guess: someone big blew up this week. The mechanical move down on Thursday, with VIX spiking on no news, felt like the summer episode when 'Leopold blew up'. He says there's a lot of leverage in the system and unwinds create nasty moves; he expects earnings season to decide whether the market recovers. Speculation, not confirmed.", "angle": "Positioning stress read from price action. Cross-check with the 9% Kospi intraday drop and the crypto liquidations of $950M+.", "tweetA": "A VIX spike on no news, Kospi halted, $950M of crypto longs liquidated in a day. Independently, Bulltard suspects a big player blew up. I can't confirm it, but three markets showing forced selling at once looks more like leverage than information.", "tweetB": "When VIX spikes with no headline, someone is selling because they must, not because they want to. The question is whether the margin call is finished or still working through the book.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.jamesbulltard.com/p/tech-stocks-finally-broke-down"}, {"id": 24, "cat": "geopolitics", "urgency": "deep", "source": "James Bulltard", "title": "Houthis bombing Saudi infrastructure daily, Ukraine hitting Russian infrastructure, oil over $100", "idea": "Bulltard: Houthis are bombing Saudi Arabia and its infrastructure daily, Ukraine is destroying multiple key pieces of Russian infrastructure, and oil went above $100 yesterday on top of the Hormuz situation. His (speculative) view: Trump, facing midterms, may want a face-saving 'massive attack on Iran', and tech's breakdown is the market pricing that in as higher rates for longer.", "angle": "Three-theatre energy infrastructure war at once: Gulf, Red Sea and Russia. The Iran escalation scenario is the tail the oil curve prices.", "tweetA": "Gulf infrastructure under daily fire, Russian infrastructure being taken out, and Hormuz open at a price. That's three supply risks at once. Goldman has a $25 risk premium in Brent for exactly this. I think it's too small. $XLE", "tweetB": "Bulltard guesses a pre-midterm attack on Iran as the face-saving move. It's speculation, but the market's reaction function to it is real: oil up, tech down, rates up. The same trade in three assets.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.jamesbulltard.com/p/tech-stocks-finally-broke-down"}, {"id": 25, "cat": "energy", "urgency": "deep", "source": "Dark Side of the Boom (Goldman takeaways)", "title": "Goldman: Brent $90 Dec 2026, $80 avg 2027; dated Brent above $130", "idea": "Goldman raised its Dec 2026 Brent forecast to $90 from $85 and expects an $80 average in 2027. Dated Brent for next-month delivery trades above $130 while futures sit around $100. Struyven sees nearly $25 of risk premium in spot Brent due to escalation risk, near-record-low inventories driving restocking, and oil being bought as a portfolio hedge because stocks and bonds are sensitive to it. Persian Gulf exports are back near the 2025 average since late September, including about 4 mb/d of 'dark' exports.", "angle": "Physical/futures dislocation of roughly $30 is the trade, not the flat price. Dark exports are an unquantified supply buffer.", "tweetA": "Dated Brent above $130, futures near $100. That $30 gap is the market telling you the barrels aren't where the paper is. Goldman says $25 of it is risk premium. If that premium bleeds out, the front of the curve falls first. $USO $XOM", "tweetB": "4 mb/d of Gulf exports are 'dark' tankers with transponders off. That's about 4% of global demand moving where nobody's counting. I would want to know how much of that sits in the inventory data and how much is invisible.", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening"}, "link": "https://thedarksideoftheboom.substack.com/p/will-oil-prices-decline-as-middle"}, {"id": 26, "cat": "energy", "urgency": "deep", "source": "Dark Side of the Boom (Goldman takeaways)", "title": "Oil balance: deficit 7.2 mb/d in March to 0.3 mb/d in September; demand -3.3 mb/d y/y", "idea": "Goldman: the market was nearly balanced in September, with demand above supply by 0.3 mb/d vs a 7.2 mb/d deficit in March. Q3 oil demand was down 3.3 mb/d y/y, concentrated in China, the Middle East and OECD Asia, and nearly 4 mb/d below the no-shock path. They assume 80% of that gap unwinds by Q4 2027 but 0.7 mb/d is permanent, tied to China using existing EVs and trucks and rising EV sales. A surplus is expected in Q4 2026 and 2027.", "angle": "Demand destruction as the balancing item, with a permanent EV share: a $100 oil shock as a structural push to electrification.", "tweetA": "The oil market closed a 7.2 mb/d deficit in six months, and the balancing item was demand, not supply. China burning less oil and driving more EVs. Goldman puts the permanent loss at 0.7 mb/d. That's the stranded-demand number. $CL", "tweetB": "Every oil shock since 2011 has been followed by a demand recovery, which is Goldman's base case. The exception this time is the EV substitution in Chinese trucks. If trucks go electric at $100 oil, the recovery isn't symmetrical.", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening"}, "link": "https://thedarksideoftheboom.substack.com/p/will-oil-prices-decline-as-middle"}]};
const ITEMS=DATA.items, META=DATA.meta;
const COLORS={macro:"#e24b4a",credit:"#378add",positioning:"#ef9f27","ai/infra":"#1d9e75",crypto:"#7f77dd",geopolitics:"#d85a30",energy:"#f97316",tech:"#06b6d4",gold:"#d4a017",culture:"#ec4899",labor:"#8b5cf6",regulation:"#64748b",science:"#14b8a6",venture:"#84cc16"};
const UE={act:"🔴",deep:"🔵",watch:"🟡"};
var fCat="all",fUrg="all",fSrc=null;
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}
function cardHtml(item){
  var c=COLORS[item.cat]||"#999";
  var ch=item.charts.count>0?(item.charts.hot?"🔥":"📊"):"";
  var h='<div class="card" id="c'+item.id+'"><div class="hd" onclick="toggle('+item.id+')"><span class="num">'+item.id+'</span><span>'+UE[item.urgency]+'</span><span class="src" style="background:'+c+'">'+esc(item.source)+'</span><span class="tag">'+esc(item.cat)+'</span><span>'+ch+'</span><span class="ttl">'+esc(item.title)+'</span></div>';
  h+='<div class="body"><div class="lbl">The Idea</div><div>'+esc(item.idea)+'</div>';
  h+='<div class="lbl">My Angle</div><div class="angle" style="border-left-color:'+c+';background:'+c+'14">'+esc(item.angle)+'</div>';
  h+='<div class="lbl">Tweets</div><div class="tw"><div><b style="color:#378add">TWEET A</b><div>'+esc(item.tweetA)+'</div><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button></div>';
  h+='<div><b style="color:#7f77dd">TWEET B</b><div>'+esc(item.tweetB)+'</div><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div></div>';
  h+='<div class="chart'+(item.charts.hot?' hot':'')+'">'+(item.charts.hot?'🔥 CHART WORTH SAVING - ':'')+(item.charts.count>0?item.charts.count+' chart(s): ':'')+esc(item.charts.desc||"No charts")+'</div>';
  h+='<div style="margin-top:10px"><a href="'+esc(item.link)+'" target="_blank">↗ Read full article</a></div></div></div>';
  return h;
}
function toggle(id){document.getElementById('c'+id).classList.toggle('open');}
function render(){
  var out="";
  ITEMS.forEach(function(it){
    if(fCat!=="all"&&it.cat!==fCat)return;
    if(fUrg!=="all"&&it.urgency!==fUrg)return;
    if(fSrc&&it.source.indexOf(fSrc)<0)return;
    out+=cardHtml(it);
  });
  document.getElementById('cards').innerHTML=out;
  if(fSrc){document.querySelectorAll('.card').forEach(function(c){c.classList.add('open');});}
}
function bars(){
  var cats={};ITEMS.forEach(function(i){cats[i.cat]=(cats[i.cat]||0)+1;});
  var h='<span class="pill'+(fCat==="all"?' on':'')+'" style="'+(fCat==="all"?'background:#333':'')+'" onclick="setCat(\'all\')">All '+ITEMS.length+'</span>';
  Object.keys(cats).forEach(function(k){var on=fCat===k;h+='<span class="pill'+(on?' on':'')+'" style="'+(on?'background:'+COLORS[k]:'')+'" onclick="setCat(\''+k+'\')">'+k+' '+cats[k]+'</span>';});
  document.getElementById('catbar').innerHTML=h;
  var u={act:0,deep:0,watch:0};ITEMS.forEach(function(i){u[i.urgency]++;});
  var names=[["all","All"],["act","🔴 Act Now"],["deep","🔵 Deep"],["watch","🟡 Watch"]];
  h="";names.forEach(function(n){var on=fUrg===n[0];var cnt=n[0]==="all"?ITEMS.length:u[n[0]];h+='<span class="pill'+(on?' on':'')+'" style="'+(on?'background:#333':'')+'" onclick="setUrg(\''+n[0]+'\')">'+n[1]+' '+cnt+'</span>';});
  document.getElementById('urgbar').innerHTML=h;
}
function setCat(c){fCat=c;fSrc=null;bars();render();}
function setUrg(u){fUrg=u;fSrc=null;bars();render();}
function filterBySrc(name){fSrc=name;fCat="all";fUrg="all";bars();render();}
function toggleRep(){var r=document.getElementById('repbody');r.style.display=r.style.display==="block"?"none":"block";}
function init(){
  document.getElementById('sub').textContent=META.date+" · "+META.time+" · "+ITEMS.length+" items";
  var h='<p><b>Window:</b> '+META.windowStart+' to '+META.windowEnd+'. Emails outside this window were not processed.</p>';
  h+='<p>Emails in window: '+META.emailsInWindow+' · read: '+META.emailsRead+' · items: '+META.itemsExtracted+'</p><b>Included sources</b><ul>';
  META.includedSources.forEach(function(s){h+='<li><span class="src-link" onclick="filterBySrc(\''+s.name.replace(/'/g,"")+'\')">'+esc(s.name)+'</span> - '+s.items+'</li>';});
  h+='</ul><b>Skipped</b><ul>';
  META.skippedSources.forEach(function(s){h+='<li>'+esc(s.name)+': '+esc(s.reason)+'</li>';});
  h+='</ul>';
  document.getElementById('repbody').innerHTML=h;
  bars();render();
}
init();
</script></body></html>
