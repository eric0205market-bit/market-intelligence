function renderCards() {
  const container = document.getElementById('cards');
  container.innerHTML = '';
  if (state.filtered.length === 0) {
    container.innerHTML = '<div class="empty-msg">No items match the current filters.</div>';
    return;
  }
  state.filtered.forEach(function(item) {
    const div = document.createElement('div');
    div.className = 'card';
    div.id = 'card-' + item.id;
    const urgEmoji = item.urgency === 'act' ? '🔴' : (item.urgency === 'watch' ? '🟡' : '🔵');
    const chartIcon = item.charts.count > 0 ? (item.charts.hot ? ' 🔥' : ' 📊') : '';
    let html = '';
    html += '<div class="card-header" onclick="toggleCard(' + item.id + ')">';
    html += '<span class="idx">' + String(item.id).padStart(2, '0') + '</span>';
    html += '<span>' + urgEmoji + '</span>';
    html += '<span class="src-badge" style="background:' + CATEGORY_COLORS[item.cat] + '">' + item.source + '</span>';
    html += '<span class="cat-tag">' + item.cat + '</span>';
    html += '<span class="title">' + item.title + chartIcon + '</span>';
    html += '</div>';
    html += '<div class="card-body">';
    html += '<div class="section-label">The Idea</div><div>' + item.idea + '</div>';
    html += '<div class="section-label">My Angle</div><div class="angle" style="border-left:3px solid ' + CATEGORY_COLORS[item.cat] + '">' + item.angle + '</div>';
    html += '<div class="tweets">';
    html += '<div class="tweet-box"><div class="tweet-label" style="color:#378add">TWEET A</div><div class="tweet-text">' + item.tweetA + '</div><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button></div>';
    html += '<div class="tweet-box"><div class="tweet-label" style="color:#7f77dd">TWEET B</div><div class="tweet-text">' + item.tweetB + '</div><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div>';
    html += '</div>';
    html += '<div class="charts-box' + (item.charts.hot ? ' hot' : '') + '">' + (item.charts.count > 0 ? (item.charts.count + ' chart(s) — ' + item.charts.desc) : 'No charts in email — ' + item.charts.desc) + '</div>';
    html += '<div class="link-row"><a href="' + item.link + '" target="_blank">↗ Read full article</a></div>';
    html += '</div>';
    div.innerHTML = html;
    if (state.openIds.has(item.id)) div.classList.add('open');
    container.appendChild(div);
  });
}

function toggleCard(id) {
  if (state.openIds.has(id)) state.openIds.delete(id);
  else state.openIds.add(id);
  const el = document.getElementById('card-' + id);
  if (el) el.classList.toggle('open');
}

function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}

const CATEGORY_COLORS = {
  macro: "#e24b4a", credit: "#378add", positioning: "#ef9f27", "AI/infra": "#1d9e75",
  crypto: "#7f77dd", geopolitics: "#d85a30", energy: "#f97316", tech: "#06b6d4",
  gold: "#d4a017", culture: "#ec4899", labor: "#8b5cf6", regulation: "#64748b",
  science: "#14b8a6", venture: "#84cc16", space: "#0ea5e9"
};

const state = {
  catFilter: 'all',
  urgFilter: 'all',
  srcFilter: null,
  openIds: new Set(),
  filtered: ITEMS
};

function applyFilters() {
  state.filtered = ITEMS.filter(function(item) {
    if (state.srcFilter && item.source.indexOf(state.srcFilter) === -1) return false;
    if (state.catFilter !== 'all' && item.cat !== state.catFilter) return false;
    if (state.urgFilter !== 'all' && item.urgency !== state.urgFilter) return false;
    return true;
  });
  state.openIds = new Set();
  renderCards();
}

function setCatFilter(cat, btn) {
  state.catFilter = cat;
  state.srcFilter = null;
  document.querySelectorAll('#cat-filters .pill').forEach(function(p) { p.classList.remove('active'); p.style.background=''; p.style.borderColor='#ccc'; p.style.color='#1a1a1a'; });
  btn.classList.add('active');
  if (cat !== 'all') { btn.style.background = CATEGORY_COLORS[cat]; btn.style.borderColor = CATEGORY_COLORS[cat]; btn.style.color = '#fff'; }
  else { btn.style.background = '#333'; btn.style.borderColor = '#333'; btn.style.color = '#fff'; }
  applyFilters();
}

function setUrgFilter(urg, btn) {
  state.urgFilter = urg;
  document.querySelectorAll('#urg-filters .pill').forEach(function(p) { p.classList.remove('active'); p.style.background=''; p.style.borderColor='#ccc'; p.style.color='#1a1a1a'; });
  btn.classList.add('active');
  btn.style.background = '#333'; btn.style.borderColor = '#333'; btn.style.color = '#fff';
  applyFilters();
}

function filterBySrc(name) {
  state.srcFilter = name;
  state.catFilter = 'all';
  state.urgFilter = 'all';
  document.querySelectorAll('#cat-filters .pill, #urg-filters .pill').forEach(function(p) { p.classList.remove('active'); p.style.background=''; p.style.borderColor='#ccc'; p.style.color='#1a1a1a'; });
  var allCatBtn = document.getElementById('cat-all-btn');
  if (allCatBtn) { allCatBtn.classList.add('active'); allCatBtn.style.background='#333'; allCatBtn.style.borderColor='#333'; allCatBtn.style.color='#fff'; }
  var allUrgBtn = document.getElementById('urg-all-btn');
  if (allUrgBtn) { allUrgBtn.classList.add('active'); allUrgBtn.style.background='#333'; allUrgBtn.style.borderColor='#333'; allUrgBtn.style.color='#fff'; }
  state.filtered = ITEMS.filter(function(item) { return item.source.indexOf(name) !== -1; });
  state.openIds = new Set(state.filtered.map(function(i) { return i.id; }));
  renderCards();
  var el = document.getElementById('cards');
  if (el) el.scrollIntoView({behavior: 'smooth'});
}

  const cats = {};

  const catContainer = document.getElementById('cat-filters');
  let catHtml = '<button class="pill active" id="cat-all-btn" style="background:#333;border-color:#333;color:#fff" onclick="setCatFilter(\'all\', this)">All (' + ITEMS.length + ')</button>';
  Object.keys(cats).sort().forEach(function(c) {
    catHtml += '<button class="pill" onclick="setCatFilter(\'' + c + '\', this)">' + c + ' (' + cats[c] + ')</button>';

  catContainer.innerHTML = catHtml;

  const urgs = { act: 0, deep: 0, watch: 0 };
  ITEMS.forEach(function(i) { urgs[i.urgency]++; });
  const urgContainer = document.getElementById('urg-filters');
  urgContainer.innerHTML =
    '<button class="pill active" id="urg-all-btn" style="background:#333;border-color:#333;color:#fff" onclick="setUrgFilter(\'all\', this)">All (' + ITEMS.length + ')</button>' +
    '<button class="pill" onclick="setUrgFilter(\'act\', this)">🔴 Act Now (' + urgs.act + ')</button>' +
    '<button class="pill" onclick="setUrgFilter(\'deep\', this)">🔵 Deep (' + urgs.deep + ')</button>' +
    '<button class="pill" onclick="setUrgFilter(\'watch\', this)">🟡 Watch (' + urgs.watch + ')</button>';

  let reportHtml = '';
  reportHtml += '<p><strong>Time window:</strong> ' + META.windowStart + ' → ' + META.windowEnd + ' (strict 6-hour lookback, CEST)</p>';
  reportHtml += '<p><strong>Emails in window:</strong> ' + META.emailsInWindow + ' (1 skipped as pure promotional) · <strong>Emails read in full:</strong> ' + META.emailsRead + ' · <strong>Items extracted:</strong> ' + META.itemsExtracted + '</p>';
  reportHtml += '<p><strong>Included sources</strong> (click a name to filter):</p><ul>';
  META.includedSources.forEach(function(s) {
    reportHtml += '<li><span class="src-link" onclick="filterBySrc(\'' + s.name.replace(/'/g, "\\'") + '\')">' + s.name + '</span> — ' + s.count + ' item(s)</li>';
  });
  reportHtml += '</ul>';
  reportHtml += '<p><strong>Skipped / notes:</strong></p><ul>';
  META.skippedSources.forEach(function(s) {
    reportHtml += '<li><strong>' + s.name + ':</strong> ' + s.reason + '</li>';
  });
  reportHtml += '</ul>';
  document.getElementById('report-body').innerHTML = reportHtml;

  renderCards();
}
