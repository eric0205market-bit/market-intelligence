function esc(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}

function buildFilters(){
  const catCounts = {};
  ITEMS.forEach(i => { catCounts[i.cat] = (catCounts[i.cat]||0) + 1; });
  const catRoot = document.getElementById("catFilters");
  let html = '<button class="pill active" data-cat="all" style="border-color:#1f1c18;" onclick="setCat(\'all\')">All <span class="count">' + ITEMS.length + '</span></button>';
  Object.keys(catCounts).sort().forEach(function(c){
    const color = CAT_COLORS[c] || "#888";
    html += '<button class="pill" data-cat="' + esc(c) + '" onclick="setCat(\'' + c.replace(/'/g,"\\'") + '\')">' + esc(c) + ' <span class="count">' + catCounts[c] + '</span></button>';
  });
  catRoot.innerHTML = html;

  const urgCounts = {};
  ITEMS.forEach(i => { urgCounts[i.urgency] = (urgCounts[i.urgency]||0) + 1; });
  const urgRoot = document.getElementById("urgFilters");
  let uhtml = '<button class="pill active" data-urg="all" style="border-color:#1f1c18;" onclick="setUrg(\'all\')">All <span class="count">' + ITEMS.length + '</span></button>';
  ["act","deep","watch"].forEach(function(u){
    if(!urgCounts[u]) return;
    const m = URGENCY_META[u];
    uhtml += '<button class="pill" data-urg="' + u + '" onclick="setUrg(\'' + u + '\')">' + m.emoji + ' ' + m.label + ' <span class="count">' + urgCounts[u] + '</span></button>';
  });
  urgRoot.innerHTML = uhtml;
}

function setCat(c){
  activeCat = c; activeSrc = null;
  document.querySelectorAll('#catFilters .pill').forEach(function(btn){
    const isActive = btn.getAttribute('data-cat') === c;
    btn.classList.toggle('active', isActive);
    if(isActive){
      const color = c === 'all' ? '#1f1c18' : (CAT_COLORS[c] || '#888');
      btn.style.background = color; btn.style.borderColor = color;
    } else {
      btn.style.background = 'transparent'; btn.style.borderColor = '';
    }
  });
  render();
}
function setUrg(u){
  activeUrg = u; activeSrc = null;
  document.querySelectorAll('#urgFilters .pill').forEach(function(btn){
    const isActive = btn.getAttribute('data-urg') === u;
    btn.classList.toggle('active', isActive);
    btn.style.background = isActive ? '#1f1c18' : 'transparent';
    btn.style.borderColor = isActive ? '#1f1c18' : '';
  });
  render();
}
function filterBySrc(name){
  activeCat = "all"; activeUrg = "all"; activeSrc = name;

function cardHtml(item, forceOpen){
  const color = CAT_COLORS[item.cat] || "#888";
  const urg = URGENCY_META[item.urgency] || {emoji:"", label:""};
  const chartFlag = item.charts && item.charts.count > 0 ? (item.charts.hot ? "🔥" : "📊") : "";
  let html = '<div class="card' + (item.charts && item.charts.hot ? ' hot' : '') + (forceOpen ? ' open' : '') + '" id="card-' + item.id + '">';
  html += '<div class="card-header" onclick="toggleCard(' + item.id + ')">';
  html += '<span class="idx">' + String(item.id).padStart(2,'0') + '</span>';
  html += '<span class="urgency-emoji">' + urg.emoji + '</span>';
  html += '<span class="badge" style="background:' + color + '">' + esc(item.source) + '</span>';
  html += '<span class="cat-pill">' + esc(item.cat) + '</span>';
  if(chartFlag) html += '<span class="chart-flag">' + chartFlag + '</span>';
  html += '<span class="card-title">' + esc(item.title) + '</span>';
  html += '<span class="chev">▶</span>';
  html += '</div>';
  html += '<div class="card-body">';
  html += '<div class="block-label">The Idea</div><div class="idea-text">' + esc(item.idea) + '</div>';
  html += '<div class="block-label">My Angle</div><div class="angle-box" style="border-left:2px solid ' + color + '; background:' + color + '14;">' + esc(item.angle) + '</div>';
  html += '<div class="block-label">Tweets</div>';
  html += '<div class="tweet-row">';
  html += '<div class="tweet-col"><div class="tweet-head"><span class="tweet-label a">TWEET A</span><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button></div><div class="tweet-box">' + esc(item.tweetA) + '</div></div>';
  html += '<div class="tweet-col"><div class="tweet-head"><span class="tweet-label b">TWEET B</span><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div><div class="tweet-box">' + esc(item.tweetB) + '</div></div>';
  html += '</div>';
  if(item.charts && (item.charts.count > 0 || item.charts.desc)){
    html += '<div class="chart-note' + (item.charts.hot ? ' hot' : '') + '">' + (item.charts.hot ? '🔥 CHART WORTH SAVING — ' : (item.charts.count > 0 ? '📊 ' : '')) + esc(item.charts.desc || 'Charts inside — worth opening.') + '</div>';
  }
  html += '<div class="link-row"><a href="' + esc(item.link) + '" target="_blank" rel="noopener">↗ Read full article</a></div>';
  html += '</div></div>';
  return html;
}

function toggleCard(id){
  const el = document.getElementById('card-' + id);
  if(el) el.classList.toggle('open');
}

function render(forceOpenSrc){
  const root = document.getElementById('cardsRoot');
  let list = ITEMS;
  if(activeSrc){
    list = ITEMS.filter(function(i){ return i.source.indexOf(activeSrc) !== -1; });
  } else {
    if(activeCat !== 'all') list = list.filter(function(i){ return i.cat === activeCat; });
    if(activeUrg !== 'all') list = list.filter(function(i){ return i.urgency === activeUrg; });
  }
  if(list.length === 0){
    root.innerHTML = '<div class="empty-note">No items match this filter.</div>';
    return;
  }
  root.innerHTML = list.map(function(i){ return cardHtml(i, !!(forceOpenSrc && activeSrc)); }).join('');
}

function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}

  html += '<h4>Skipped Sources</h4>';
  META.skippedSources.forEach(function(s){
    html += '<div class="skip-row"><b>' + esc(s.name) + '</b> — ' + esc(s.reason) + '</div>';
  });

  html += '<div class="totals">' + META.emailsInWindow + ' emails in window · ' + META.emailsRead + ' read · ' + META.itemsExtracted + ' items extracted across ' + META.includedSources.length + ' sources.</div>';

  document.getElementById('reportBody').innerHTML = html;
  document.getElementById('reportHead').onclick = function(){
    document.getElementById('reportCard').classList.toggle('open');
    document.querySelector('#reportHead span').textContent =
      document.getElementById('reportCard').classList.contains('open') ? '▾ Session Report' : '▸ Session Report';
  };
}

buildFilters();
buildReport();
render();
</script>

</body>
</html>
