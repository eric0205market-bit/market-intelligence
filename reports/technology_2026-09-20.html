ated examples are concatenated", "quote_verified": true}, {"claim": "The perplexity script computes its displayed error bar from flattened token-level losses divided by sqrt(num_tokens), but tokens inside a sequence are correlated, so the shown plus-minus should not be read like an error bar from tens of thousands of independent samples.", "speaker": "DedeProGames", "type": "data_point", "entities": ["MLX"], "conviction": "high", "so_what": "Reported uncertainty is understated, so small PPL gaps between quantizations are far less significant than the error bars suggest.", "quote": "Tokens inside a sequence are correlated.", "locator": "7.3 The displayed PPL error bar is token-level", "quote_verified": true}, {"claim": "The tokens-per-second figure from the MLX perplexity script is tokens_evaluated divided by eval_time, a forward-pass evaluation throughput over known tokens, so a table showing 175 tokens/sec must not be read as a chat generation speed under KV-cache autoregressive decoding.", "speaker": "DedeProGames", "type": "data_point", "entities": ["MLX", "KV cache"], "conviction": "high", "so_what": "Speed claims circulating from PPL tables overstate real user-facing decode throughput, distorting perceived hardware and quantization performance.", "quote": "That is forward-pass evaluation throughput over known tokens.", "locator": "7.4 \"Tokens/sec\" is not normal chat-generation speed", "quote_verified": true}, {"claim": "mlx_lm.evaluate does not define any fixed seven-task 'standard MLX metrics' suite - its command-line interface explicitly requires --tasks and passes the chosen names to lm_eval.simple_evaluate, so MLX supplies the model adapter while the benchmark tasks come from lm-evaluation-harness.", "speaker": "DedeProGames", "type": "contrarian", "entities": ["MLX", "lm-evaluation-harness", "Nightmedia"], "conviction": "high", "so_what": "Framing a personal task selection as a toolchain standard borrows unearned authority; verify claimed 'standard' suites against the tool's actual CLI.", "quote": "mlx_lm.evaluate does not define these seven tasks as a mandatory standard suite.", "locator": "8. \"Standard MLX metrics\" is not a fixed seven-task standard", "quote_verified": true}, {"claim": "The seven benchmark columns are not all the same metric - WinoGrande's current lm-eval task configuration uses metric acc rather than acc_norm - and Nightmedia later acknowledged that two of the tasks were not acc_norm despite a caption implying one uniform normalized metric.", "speaker": "DedeProGames", "type": "data_point", "entities": ["WinoGrande", "lm-evaluation-harness", "Nightmedia"], "conviction": "high", "so_what": "Mixed-metric tables silently break comparability between columns and between publishers reporting the same task names.", "quote": "Nightmedia later acknowledged that two of the tasks were not acc_norm.", "locator": "11. Metric-labeling inconsistency", "quote_verified": true}, {"claim": "Published evaluation filenames in the discussion carried lm-eval versions 0.4.9 and 0.4.10 even though lm-eval 0.4.12 was released on May 11, 2026, contradicting the author's statement that he uses the latest available MLX and tests.", "speaker": "DedeProGames", "type": "data_point", "entities": ["lm-evaluation-harness", "MLX", "Nightmedia"], "conviction": "medium", "so_what": "Harness version drift changes prompts, scoring and extraction logic, so version metadata in output filenames is a cheap forensic check on reported scores.", "quote": "lm-eval 0.4.12 was released on May 11, 2026.", "locator": "12. Toolchain version inconsistency", "quote_verified": true}]}, {"theme": "What reproducible evaluation would require", "insights": [{"claim": "Because the same benchmark items are evaluated across quantizations, comparisons are naturally paired, and a McNemar-style paired test on the both-correct, both-wrong and disagreement cells is more informative for a gap like 0.604 versus 0.591 than comparing separate aggregate standard errors.", "speaker": "DedeProGames", "type": "framework", "entities": ["quantization", "McNemar test"], "conviction": "high", "so_what": "Publishing per-item outputs converts noisy aggregate deltas into statistically testable claims - a low-cost standard the ecosystem could adopt immediately.", "quote": "A McNemar-style paired test can determine whether one model consistently flips more items in the right direction.", "locator": "15. Small score deltas need paired analysis", "quote_verified": true}, {"claim": "A convincing release should publish the exact model commit hash, tokenizer files and hash, chat template, mlx-lm version, lm-eval version, task versions, command lines, seed, sampling settings, raw JSON outputs and per-item predictions where licensing permits.", "speaker": "DedeProGames", "type": "framework", "entities": ["MLX", "lm-evaluation-harness"], "conviction": "high", "so_what": "This artifact list is a ready-made due-diligence checklist for evaluating any model publisher's credibility.", "quote": null, "locator": "18. What a convincing evaluation would look like", "quote_verified": false}, {"claim": "Claims that a particular quantization has distinct cognitive or social characteristics require the same source checkpoint, tokenizer, prompts, decoding settings and context with blinded pairwise human evaluation and paired item analysis; without these they remain qualitative impressions and should be labeled as such.", "speaker": "DedeProGames", "type": "framework", "entities": ["quantization"], "conviction": "high", "so_what": "The 'this quant feels smarter' genre drives real download and adoption patterns in open-weights distribution with no controlled evidence behind it.", "quote": "Otherwise observations like \"this quant feels more social\" remain qualitative impressions.", "locator": "14. Quantization claims need paired tests", "quote_verified": true}, {"claim": "After posting a detailed methodological criticism on a DavidAU model discussion, the auditor found the discussion no longer publicly available and Hugging Face returned a 403 stating he was not allowed to interact with that user, illustrating that community scrutiny of benchmark claims can be removed by the party being scrutinized.", "speaker": "DedeProGames", "type": "anecdote", "entities": ["DavidAU", "Hugging Face"], "conviction": "medium", "so_what": "Platform-level blocking makes open-model benchmark claims structurally harder to falsify, weakening the trust assumption the whole open-weights supply chain rests on.", "quote": "Hugging Face returned a 403 stating that I was not allowed to interact with that user.", "locator": "My documented timeline", "quote_verified": true}, {"claim": "The central pattern identified across both publishers is that real benchmark outputs are converted into a story they do not prove - ARC-C improving becomes 'general intelligence increased', a 2M-configured model retaining short-task scores becomes 'safe at 2M', and seven legacy tasks improving becomes 'strongest model overall'.", "speaker": "DedeProGames", "type": "thesis", "entities": ["ARC-Challenge", "DavidAU", "Nightmedia"], "conviction": "high", "so_what": "The failure mode is interpretive, not fraudulent, which means it survives any check that only verifies whether the numbers were actually run.", "quote": "A benchmark can be real.\nThe interpretation can still be wrong.", "locator": "19. The biggest issue", "quote_verified": true}, {"claim": "Open-source model development depends on the ability to check claims rather than on blind trust in authors, so the operative standard is claims proportional to evidence, reproducibility, raw results, and criticism that can be checked by anyone.", "speaker": "DedeProGames", "type": "thesis", "entities": ["DavidAU", "Nightmedia"], "conviction": "high", "so_what": "As open weights move into production stacks, unverifiable capability claims become a supply-chain risk rather than a hobbyist annoyance.", "quote": "claims proportional to evidence, reproducibility, raw results, and criticism that can be checked by anyone.", "locator": "20. Conclusion", "quote_verified": true}]}], "insight_total": 35, "top_entities": ["DavidAU", "Nightmedia", "Hugging Face", "Qwen3.6-27B", "ARC-Challenge", "WinoGrande", "HellaSwag", "MLX", "lm-evaluation-harness", "SWE-bench Verified", "Terminal-Bench", "Gemini"], "source_meta": {"author": "DedeProGames", "word_count": 4785, "paywalled": false}}, {"record_id": "1f165f82a56ba8ec", "source_type": "technology", "source_name": "NVIDIA Developer Blog", "source_url": "https://developer.nvidia.com/blog/benchmarking-llm-inference-at-scale-with-aiperf/", "title": "Benchmarking LLM Inference at Scale with AIPerf | NVIDIA Technical Blog", "published_date": "2026-09-18", "language": "en", "processed_at": "2026-09-20T11:10:40Z", "processor": "claude-code-sub-opus", "tags": ["AI", "Tech"], "gist": "NVIDIA has replaced GenAI-Perf with AIPerf, a ground-up multiprocess rewrite built so the load client stops being the measurement bottleneck under high concurrency, coordinated over ZMQ with separate worker and record-processor services. The walkthrough exposes two benchmarking traps that silently corrupt published LLM throughput numbers - omitting min_tokens and ignore_eos lets models stop early and understates throughput, and running without --streaming makes TTFT and ITL unmeasurable - and shows that single-concurrency runs produce the lowest possible TTFT at the cost of throughput. Acknowledgments name engineers at AWS, Coreweave, Baseten and Pinterest collaborating to standardize on AIPerf.", "themes": [{"theme": "Client-side bottleneck as the hidden measurement error", "insights": [{"claim": "NVIDIA AIPerf is the designated successor to GenAI-Perf and a ground-up rewrite that no longer runs on top of Perf Analyzer, a clean architectural break that NVIDIA says is the reason it can scale.", "speaker": "Francesco Di Natale", "type": "data_point", "entities": ["NVIDIA", "AIPerf", "GenAI-Perf", "Perf Analyzer"], "conviction": "high", "so_what": "GenAI-Perf-based numbers in existing vendor comparisons come from a deprecated architecture; expect a wave of restated inference benchmarks as teams migrate.", "quote": "AIPerf is the designated successor to GenAI-Perf and is a ground-up rewrite.", "locator": "What AIPerf does differently", "quote_verified": true}, {"claim": "Most LLM load generators, including GenAI-Perf itself, use a single-process architecture that becomes GIL-bound under real concurrency or request rate, meaning the benchmark client rather than the inference server sets the measured ceiling.", "speaker": "Francesco Di Natale", "type": "causal", "entities": ["GenAI-Perf", "Python", "AIPerf"], "conviction": "high", "so_what": "A large share of published LLM serving throughput figures may be measuring the test harness, not the hardware or the serving stack - a reason to distrust cross-vendor inference comparisons.", "quote": "Most benchmarkers, GenAI-Perf included, use a single-process architecture that becomes GIL-bound under real concurrency or request rate.", "locator": "The client shouldn't be the bottleneck", "quote_verified": true}, {"claim": "AIPerf splits benchmarking into worker processes that generate load and separate record-processor services that handle results, coordinated over ZMQ, specifically to keep the client from capping measured server performance.", "speaker": "Francesco Di Natale", "type": "framework", "entities": ["AIPerf", "ZMQ"], "conviction": "high", "so_what": "The architectural tell of a trustworthy load generator is process separation between generation and record processing; use it to screen any benchmarking tool.", "quote": "worker processes generate load, separate record-processor services handle results, and everything is coordinated over ZMQ", "locator": "The client shouldn't be the bottleneck", "quote_verified": true}, {"claim": "The alternatives engineers typically reach for - curl commands, hand-rolled asyncio scripts, or one-off load generators - all share single-process performance limits and produce results measured against a self-built reference, so the numbers cannot be fully trusted.", "speaker": "Francesco Di Natale", "type": "thesis", "entities": ["AIPerf", "Python"], "conviction": "high", "so_what": "Internal inference performance claims built on bespoke scripts should be treated as unvalidated until reproduced on a multiprocess harness.", "quote": "you end up with results you can’t fully trust, attached to tooling you’ll have to rewrite the moment requirements change", "locator": "You're deploying a model on a system", "quote_verified": true}]}, {"theme": "Configuration traps that corrupt published numbers", "insights": [{"claim": "Without the flags --extra-inputs min_tokens:128 and --extra-inputs ignore_eos:true, the requested output token count is only a suggestion because the model stops whenever it naturally finishes, so measured throughput ends up lower than it should be and is not reproducible across runs.", "speaker": "Francesco Di Natale", "type": "causal", "entities": ["AIPerf", "vLLM"], "conviction": "high", "so_what": "Benchmarks that omit EOS suppression systematically understate tokens/sec and vary run to run - the single most checkable flaw in a competitor's inference numbers.", "quote": "Without these, the output token count is a suggestion.", "locator": "Running the benchmark", "quote_verified": true}, {"claim": "Streaming mode is mandatory for measuring time-to-first-token and inter-token latency, because without it the server batches the full response before sending and there are no first- or decode-token events to observe at all.", "speaker": "Francesco Di Natale", "type": "causal", "entities": ["AIPerf", "TTFT", "ITL"], "conviction": "high", "so_what": "Any latency claim citing TTFT from a non-streaming run is fabricated by construction; verify the streaming flag before accepting interactive-latency comparisons.", "quote": "--streaming is not optional if you want to measure TTFT and ITL.", "locator": "Running the benchmark", "quote_verified": true}, {"claim": "Pinning both synthetic input and output token standard deviations to zero at 128 tokens each reproduces the commonly used static benchmark that holds request and output lengths constant, which the author frames as a clean baseline rather than a realistic workload.", "speaker": "Francesco Di Natale", "type": "framework", "entities": ["AIPerf", "Qwen3-0.6B", "vLLM"], "conviction": "high", "so_what": "The industry-standard 128/128 static benchmark is explicitly an idealized reference point, not a production proxy - discount headline numbers derived from it.", "quote": "This reproduces a commonly used static benchmark that holds request and output lengths constant.", "locator": "A few flags here are doing more work", "quote_verified": true}, {"claim": "Setting --random-seed 42 makes Poisson arrival timing and synthetic length draws reproducible so that rerunning the same command produces the same sequence of requests.", "speaker": "Francesco Di Natale", "type": "data_point", "entities": ["AIPerf"], "conviction": "high", "so_what": "Seeded arrival patterns turn stochastic load tests into repeatable A/B comparisons across serving stacks and hardware generations.", "quote": "--random-seed 42 makes the Poisson timing and synthetic length draws reproducible.", "locator": "Going further: Configuring a traffic pattern", "quote_verified": true}, {"claim": "On aarch64 the crick dependency ships as source-only and requires a C toolchain such as build-essential on Debian or Ubuntu and Development Tools on RHEL, which is why AIPerf installs can stall on that package.", "speaker": "Francesco Di Natale", "type": "data_point", "entities": ["AIPerf", "aarch64"], "conviction": "high", "so_what": "Arm-based inference deployments hit a friction point in NVIDIA's own tooling chain, a small signal on the maturity gap between x86 and Arm AI stacks.", "qu // ---------- helpers ----------
// YouTube-aligned hex colors for tinted insight chips (bg = color+"1a", text = color, border = color+"55").
const TYPE_HEX = {
  thesis: '#6366f1', prediction: '#0ea5e9', framework: '#8b5cf6',
  data_point: '#7c3aed', causal: '#d97706', contrarian: '#dc2626',
  anecdote: '#64748b',
};
const CONV_HEX = { high: '#7c3aed', medium: '#ca8a04', low: '#94a3b8', exploratory: '#94a3b8' };
function typeHex(t) { return TYPE_HEX[String(t || '').toLowerCase()] || '#475569'; }
function convHex(c) { return CONV_HEX[String(c || '').toLowerCase()] || '#64748b'; }

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }

// Tinted chip (YouTube style): faint bg, colored text + border.
function tintChip(text, color) {
  return `<span class="chip" style="background:${color}1a;color:${color};border-color:${color}55">${escapeHtml(text)}</span>`;
}
function tagPills(tags) {
  if (!tags || !tags.length) return '';
  return tags.map(t => `<span class="pill tag">${escapeHtml(t)}</span>`).join(' ');
}

// ---------- rendering ----------
// Insight presentation ported from the YouTube digest: type/conviction tinted
// chips, speaker as a 🗣 chip, and entities as indigo chips — all in the meta row
// directly under the claim. Quote treatment is INTENTIONALLY kept as Concepts'
// verbatim + "✓ verified" (stronger than YouTube's ≈ paraphrase wording).
function renderInsight(ins) {
  if (!ins) return '';
  const cls = 'insight' + (ins.type ? (' ' + String(ins.type).toLowerCase()) : '');
  const meta = [];
  if (ins.type) meta.push(tintChip(ins.type, typeHex(ins.type)));
  if (ins.speaker) meta.push(`<span class="chip chip-spk">🗣 ${escapeHtml(ins.speaker)}</span>`);
  if (ins.conviction) meta.push(tintChip('conviction: ' + ins.conviction, convHex(ins.conviction)));
  (ins.entities || []).slice(0, 12).forEach(e => {
    if (e) meta.push(`<span class="chip chip-ent">${escapeHtml(e)}</span>`);
  });
  let quote = '';
  if (ins.quote) {
    const v = ins.quote_verified
      ? `<span class="vmark">✓ verified</span>`
      : `<span class="vmark no">unverified</span>`;
    quote = `<div class="quote">“${escapeHtml(ins.quote)}”${v}</div>`;
  }
  const so = ins.so_what
    ? `<div class="insight-so"><span class="lbl">so what</span>${escapeHtml(ins.so_what)}</div>` : '';
  return `
    <div class="${cls}">
      <div class="insight-claim">${escapeHtml(ins.claim || '')}</div>
      <div class="insight-meta">${meta.join('')}</div>
      ${so}
      ${quote}
    </div>`;
}

function renderTheme(theme) {
  const insights = (theme.insights || []).map(renderInsight).join('');
  return `
    <div class="theme">
      <div class="theme-title">${escapeHtml(theme.theme || 'Theme')}</div>
      ${insights}
    </div>`;
}

function renderCard(card) {
  if (!card) return '';
  const meta = card.source_meta || {};
  const nameHtml = card.source_url
    ? `<a class="source-name" href="${escapeAttr(card.source_url)}" target="_blank" rel="noopener">${escapeHtml(card.source_name || '')}</a>`
    : `<span class="source-name">${escapeHtml(card.source_name || '')}</span>`;
  const subBits = [];
  if (card.published_date) subBits.push(escapeHtml(card.published_date));
  if (meta.author) subBits.push(escapeHtml(meta.author));
  if (meta.word_count) subBits.push(`${meta.word_count} words`);
  if (meta.paywalled) subBits.push('paywalled');
  const themes = (card.themes || []).map(renderTheme).join('');
  const n = card.insight_total != null ? card.insight_total
            : (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
  return `
    <div class="source">
      <div class="source-head" onclick="toggleSource(this)">
        <div class="source-meta-left">
          <div class="source-name-row">${nameHtml}</div>
          <div class="source-title">${escapeHtml(card.title || '')}</div>
          <div class="source-sub">${subBits.join('  ·  ')}</div>
        </div>
        <span class="source-count">${n} insight${n === 1 ? '' : 's'}</span>
        <span class="source-arrow">▸</span>
      </div>
      <div class="source-body">
        ${card.gist ? `<div class="gist">${escapeHtml(card.gist)}</div>` : ''}
        ${card.tags && card.tags.length ? `<div class="tags">${tagPills(card.tags)}</div>` : ''}
        ${themes || '<div class="empty">No insights.</div>'}
      </div>
    </div>`;
}

function renderTopStats(d) {
  const s = d.stats || {};
  const parts = [];
  if (d.date) parts.push(`date <strong>${escapeHtml(d.date)}</strong>`);
  if (s.lookback_days != null) parts.push(`lookback <strong>${s.lookback_days}d</strong>`);
  if (s.sources != null) parts.push(`sources <strong>${s.sources}</strong>`);
  if (s.cards != null) parts.push(`cards <strong>${s.cards}</strong>`);
  if (s.insights != null) parts.push(`insights <strong>${s.insights}</strong>`);
  if (s.quote_verified_pct != null) parts.push(`quotes verified <strong>${s.quote_verified_pct}%</strong>`);
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSource(headEl) { headEl.parentElement.classList.toggle('open'); }

function insightCount(card) {
  return (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
}

// Build the sort/filter control bar (display only — re-groups REPORT_DATA in place).
function buildControls(d) {
  const cards = d.cards || [];
  const names = [...new Set(cards.map(c => c.source_name || '—'))].sort((a, b) => a.localeCompare(b));
  const opts = names.map(n => `<option value="${escapeAttr(n)}">${escapeHtml(n)}</option>`).join('');
  document.getElementById('controls').innerHTML =
    `<label>Sort
       <select id="sortSel">
         <option value="source">Source A–Z</option>
         <option value="insights">Insight count ▼</option>
       </select></label>
     <label>Source
       <select id="srcSel">
         <option value="__all">All sources (${names.length})</option>
         ${opts}
       </select></label>
     <span class="ctl-btns">
       <button type="button" id="expandAll">Expand all</button>
       <button type="button" id="collapseAll">Collapse all</button>
     </span>`;
  document.getElementById('sortSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('srcSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('expandAll').addEventListener('click', () => setAllGroups(false));
  document.getElementById('collapseAll').addEventListener('click', () => setAllGroups(true));
}

// Group-level collapse: header click toggles one group; the control-bar buttons toggle all.
function toggleGroup(headEl) { headEl.parentElement.classList.toggle('collapsed'); }
function setAllGroups(collapsed) {
  document.querySelectorAll('.group').forEach(g => g.classList.toggle('collapsed', collapsed));
}

// Group cards by source, sort groups (and cards within), optionally filter to one source.
function renderGroups(d) {
  const sortMode = (document.getElementById('sortSel') || {}).value || 'source';
  const srcFilter = (document.getElementById('srcSel') || {}).value || '__all';
  let cards = (d.cards || []).slice();
  if (srcFilter !== '__all') cards = cards.filter(c => (c.source_name || '—') === srcFilter);

  const groups = new Map();
  cards.forEach(c => {
    const k = c.source_name || '—';
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(c);
  });
  let entries = [...groups.entries()].map(([name, cs]) => ({
    name, cards: cs, insights: cs.reduce((a, c) => a + insightCount(c), 0),
  }));
  if (sortMode === 'insights') entries.sort((a, b) => b.insights - a.insights || a.name.localeCompare(b.name));
  else entries.sort((a, b) => a.name.localeCompare(b.name));
  // Within each source group, heaviest cards first.
  entries.forEach(e => e.cards.sort((a, b) => insightCount(b) - insightCount(a)));

  const html = entries.map(e => {
    const head = `<div class="group-head" onclick="toggleGroup(this)">`
      + `<span class="group-name">${escapeHtml(e.name)}</span>`
      + `<span class="group-meta">${e.cards.length} card${e.cards.length === 1 ? '' : 's'} · ${e.insights} insights</span>`
      + `<span class="group-arrow">▾</span></div>`;
    return `<div class="group">${head}<div class="group-body">${e.cards.map(renderCard).join('')}</div></div>`;
  }).join('');

  const app = document.getElementById('app');
  app.innerHTML = html || '<div class="empty">No cards for this source.</div>';
  // Open the first two source cards by default.
  document.querySelectorAll('.source').forEach((sec, i) => { if (i < 2) sec.classList.add('open'); });
}

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  document.getElementById('stats-top').innerHTML = renderTopStats(d);
  buildControls(d);
  renderGroups(d);   // default: grouped, sorted by source A–Z
}

renderReport(REPORT_DATA);
</script>
