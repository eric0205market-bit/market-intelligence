  --border: #dfe8e3;

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; line-height: 1.55;
       background: var(--bg); color: var(--text); }
.container { max-width: 980px; margin: 0 auto; padding: 24px 16px 80px; }

             color: var(--text-2); display: flex; gap: 16px; flex-wrap: wrap; }

/* CONTROLS (display-only: sort + filter by source) */
.controls { display: flex; gap: 14px; flex-wrap: wrap; align-items: center;
            margin-bottom: 16px; padding: 8px 12px; background: var(--surface);

built around dynasty preservation, versus a growing share of wealth flowing into philanthropic/NGO vehicles instead of long-duration private capital.", "quote": "The wealthy of Britain, and those of the Western world more broadly, are today expected to surrender rather than pass on the fortune they have spent their lives creating.", "locator": "opening paragraph", "quote_verified": true}, {"claim": "Edmund Burke's description of society as a partnership between the living, the dead, and the unborn is presented as the philosophical basis for viewing wealth as an intergenerational trust rather than personal consumption.", "speaker": "Will Tanner", "type": "framework", "entities": ["Edmund Burke", "intergenerational wealth"], "conviction": "high", "so_what": "This Burkean framework is the article's normative lens for judging modern estate-planning and philanthropy trends against a historical alternative model.", "quote": "a partnership not only between those who are living, but between those who are living, those who are dead, and those who are to be born", "locator": "opening section", "quote_verified": true}]}, {"theme": "Land as a distinct, discipline-forcing form of capital", "insights": [{"claim": "Land functioned as a distinctive asset class because it required continuous, multi-generational upkeep and reinvestment (drainage, enclosure, animal husbandry), unlike other forms of capital that could be extracted and abandoned.", "speaker": "Will Tanner", "type": "framework", "entities": ["land", "British aristocracy", "agricultural investment"], "conviction": "high", "so_what": "The argument implies illiquid, maintenance-intensive assets can produce better long-horizon stewardship incentives than liquid capital, a point relevant to debates on family-office allocation toward real assets versus liquid securities.", "quote": "Capital in the form of land was functionally different from other kinds as it required continuous upkeep and attention from its owner.", "locator": "Land, Legacy, and Duty section", "quote_verified": true}, {"claim": "Coke of Norfolk's estate-level agricultural innovations (improved sheep breeds, field drainage) at Holkham are credited as a driver of the British Agricultural Revolution, which in turn fed the Industrial Revolution.", "speaker": "Will Tanner", "type": "causal", "entities": ["Coke of Norfolk", "Holkham Hall", "British Agricultural Revolution", "Industrial Revolution"], "conviction": "medium", "so_what": "This is presented as a concrete causal chain from private, long-horizon estate capital investment to national-scale industrialization, an argument for the productivity payoff of patient, place-rooted capital.", "quote": "Without gentlemen such as Coke of Norfolk funding and promoting such innovations... it is unlikely that the British Agricultural Revolution would have happened at all, or the Industrial Revolution it fed.", "locator": "Land, Legacy, and Duty section", "quote_verified": true}, {"claim": "An 1873 land survey found roughly seven thousand families owned eighty percent of Britain, with nobility holding nearly a third of the nation's land and the gentry another half.", "speaker": "Will Tanner", "type": "data_point", "entities": ["Britain", "landed nobility", "1873 Return of Owners of Land"], "conviction": "high", "so_what": "This concentration figure quantifies the scale of pre-20th-century British land ownership that the article argues was subsequently dismantled by taxation.", "quote": "The 1873 Return of Owners of Land survey found that roughly seven thousand families owned eighty percent of Britain", "locator": "Land, Legacy, and Duty section", "quote_verified": true}, {"claim": "Estates improved with capital-intensive drainage and enclosure made British farmland significantly more productive than smaller continental farms.", "speaker": "Will Tanner", "type": "causal", "entities": ["British estates", "agricultural productivity"], "conviction": "medium", "so_what": "Long time-horizon capital improvement is credited with a durable productivity edge over fragmented continental smallholdings, a historical data point for arguments about scale and patient capital in agriculture.", "quote": "These recurring capital-intensive improvements made British estates significantly more productive than the small farms of the continent", "locator": "Land, Legacy, and Duty section", "quote_verified": true}]}, {"theme": "Aristocratic industrial stewardship: the Fitzwilliam case", "insights": [{"claim": "The Earls of Fitzwilliam chose to mine coal on their own estate directly rather than lease mineral rights for royalties, and set mid-19th-century standards in mine safety, sick pay, worker pensions, and worker housing decades before such practices were common or mandated.", "speaker": "Will Tanner", "type": "anecdote", "entities": ["Earls of Fitzwilliam", "coal mining", "worker welfare"], "conviction": "high", "so_what": "This is offered as a historical counter-example to the idea that concentrated private ownership necessarily produces worse labor outcomes than either pure market competition or state control.", "quote": "As patrician industrialists, they set the standards in mine safety, provided sick pay to workers, pensions to families of worker casualties, and built schools, churches, and homes for their employees.", "locator": "The Elites Who Built an Empire section", "quote_verified": true}, {"claim": "When the postwar Labour government (Manny Shinwell) nationalized the Fitzwilliam coal holdings in 1946, subsequent open-cast mining destroyed the Wentworth Woodhouse estate and the miners themselves were later laid off as the mines closed.", "speaker": "Will Tanner", "type": "causal", "entities": ["Manny Shinwell", "Wentworth Woodhouse", "coal nationalization", "Fitzwilliam family"], "conviction": "high", "so_what": "The episode is used as a cautionary case that nationalization pursued for equity reasons destroyed both private stewardship and the very jobs it was meant to protect.", "quote": "open-cast mining subsequently destroyed the estate, bringing open work pits within mere meters of Wentworth Woodhouse... The miners were soon laid off, and the mines closed.", "locator": "The Elites Who Built an Empire section", "quote_verified": true}]}, {"theme": "Taxation as the deliberate instrument of aristocratic decline", "insights": [{"claim": "British landed elites' share of House of Commons seats fell from roughly fifty percent in the 1880s to about ten percent by 1910, tracking the rise of new taxation and political realignment.", "speaker": "Will Tanner", "type": "data_point", "entities": ["House of Commons", "British landed elite"], "conviction": "high", "so_what": "This is a concrete political-power metric showing how fast aristocratic political influence collapsed once taxation began eroding its economic base, within roughly one generation.", "quote": "By 1910, the seats occupied by landed elites in the House of Commons amounted to roughly ten percent, a sharp decline from fifty percent only thirty years prior.", "locator": "Unhousing the Estate section", "quote_verified": true}, {"claim": "British inheritance taxes peaked at eighty-five percent under Harold Wilson, income tax reached ninety-nine percent under Churchill's wartime government, and investment income taxes hit roughly ninety-eight percent in the 1970s.", "speaker": "Will Tanner", "type": "data_point", "entities": ["inheritance tax", "income tax", "Harold Wilson", "Winston Churchill"], "conviction": "high", "so_what": "These are extreme historical top-rate benchmarks worth citing in any debate over current wealth/inheritance tax proposals and their capacity to force asset liquidation across generations.", "quote": "Inheritance taxes crept inexorably higher, peaking at eighty-five percent during the Harold Wilson years. Income tax rose similarly, reaching a peak of ninety-nine percent under Winston Churchill's wartime government, and investment income taxes reached a similar height of ninety-eight percent in the 1970s.", "locator": "Unhousing the Estate section", "quote_verified": true}, {"claim": "Many British country houses that survived confiscatory taxation were still destroyed or badly damaged during WWII military requisition, including Eggington Hall (demolished after being left with taps running and ceilings collapsed) and Blickling Hall (state rooms smashed by billeted soldiers).", "speaker": "Will Tanner", "type": "anecdote", "entities": ["Eggington Hall", "Blickling Hall", "WWII requisition"], "conviction": "medium", "so_what": "These anecdotes illustrate that policy-driven asset destruction (whether via taxation or wartime requisition) can permanently erase multi-generational capital stock, a durable-asset risk lesson beyond the tax argument itself.", "quote": "the army left the house with all the taps running, the ceilings collapsed, and the building had to be demolished", "locator": "Unhousing the Estate section", "quote_verified": true}, {"claim": "The current UK Starmer government's proposed twenty percent tax on farms is framed as raising revenue roughly equivalent to Britain's annual foreign farm aid, implying the policy trades domestic agricultural continuity for a comparatively small fiscal gain.", "speaker": "Will Tanner", "type": "data_point", "entities": ["Starmer ministry", "farm tax", "United Kingdom"], "conviction": "medium", "so_what": "This is a live current-policy data point framing the UK farm inheritance tax as a small-revenue, high-disruption measure, relevant to UK agricultural land valuations and farm succession planning.", "quote": "the Starmer ministry's recent attempt to levy another twenty percent tax on farms, merely to raise revenue equivalent to the annual amount Britain already provides as aid to foreign farmers", "locator": "Unhousing the Estate section", "quote_verified": true}]}, {"theme": "Modern plutocrats: mobile wealth without civic duty", "insights": [{"claim": "Modern wealth (dollars, stocks, crypto) is highly mobile and thus decoupled from place-based responsibility, unlike land, which the article argues produces 'compliant and even complicit political nonchalance' among today's rich toward the communities they leave behind.", "speaker": "Will Tanner", "type": "thesis", "entities": ["mobile capital", "plutocrats", "crypto"], "conviction": "high", "so_what": "This is a framework for why today's wealthy are argued to disengage from local governance and civic duty compared to historically land-anchored elites — relevant to debates on wealth flight and municipal finance / tax base erosion in high-outmigration jurisdictions.", "quote": "Dollars are fungible, stocks and crypto move with their owners, and houses lived in for but a few years lack the emotional hold of an ancient farm or family estate.", "locator": "Unhousing the Estate section", "quote_verified": true}, {"claim": "Left-leaning Silicon Valley technologists are cited as an example of wealthy elites abandoning communities their own political preferences helped shape once conditions there worsen.", "speaker": "Will Tanner", "type": "contrarian", "entities": ["Silicon Valley", "California", "tech wealth"], "conviction": "medium", "so_what": "This is used as a specific case of the broader thesis that mobile modern wealth lacks the civic 'skin in the game' that land ownership historically forced, relevant to California/tech-hub outmigration narratives.", "quote": "the flight of left-leaning Silicon Valley technologists from California", "locator": "Unhousing the Estate section", "quote_verified": true}, {"claim": "Elon Musk's efforts on free speech online and space settlement are cited as a rare modern echo of duty-driven, multi-generational wealth deployment, contrasted with the more common path of hedonistic spending followed by philanthropic disbursement.", "speaker": "Will Tanner", "type": "anecdote", "entities": ["Elon Musk", "SpaceX", "Mars settlement"], "conviction": nt from today's wealthy class.", "quote": "the last generation of the landed military elite suffered a roughly twenty percent death rate during World War I, a higher proportion than any other class, including the poorest", "locator": "The Elites Who Built an Empire section", "quote_verified": true}, {"claim": "The article's core political-economy argument is that property owners willing to personally fight for their holdings oppose expropriation, making landed elites a structurally different (and more stable) check on state power than a landless, state-employed officer corps, which instead becomes a lobby for higher spending and taxation.", "speaker": "Will Tanner", "type": "framework", "entities": ["landed elite", "military officer corps", "state power"], "conviction": "medium", "so_what": "This is offered as a generalizable political-economy mechanism linking property ownership structure to a state's fiscal and military incentives, applicable beyond the British historical case (the article cites modern Egypt as a negative comparison).", "quote": "if property holders are the ones willing to fight, they oppose expropriation... Making them landless employees of the state might seemingly solve the problem, but it creates a perpetual lobby and faction for greater spending and, with it, taxation, leading to endemic corruption as seen in modern Egypt.", "locator": "Unhousing the Estate section (military discussion)", "quote_verified": true}]}], "insight_total": 18, "top_entities": ["British aristocracy", "Edmund Burke", "Wentworth Woodhouse", "Fitzwilliam family", "Elon Musk", "Die with Zero", "inheritance tax", "Coke of Norfolk", "Starmer ministry", "House of Commons"], "source_meta": {"author": "Will Tanner", "word_count": 5715, "paywalled": false}}, {"record_id": "6c9d4ee998360eb8", "source_type": "concepts", "source_name": "Peterson Institute (PIIE)", "source_url": "https://www.piie.com/blogs/realtime-economics/2026/will-trump-xi-summit-make-limited-progress-ai", "title": "Will the Trump-Xi summit make limited progress on AI?", "published_date": "2026-09-18", "language": "en", "processed_at": "2026-09-20T11:05:48Z", "processor": "claude-code-sub-opus", "tags": ["Geopolitics", "AI", "Macro"], "gist": "Ahead of the September 24 Trump-Xi summit, PIIE's Alan Wm. Wolff argues trade, environmental, and geopolitical issues (Taiwan, Ukraine, Iran) will see only continuity of an uneasy truce, while AI safety is the one area with a real, if narrow, opening for US-China cooperation given industry leaders' warnings about near-term extinction-level risk and Trump's simultaneous dismissal of AI-safety concerns as a \"hoax.\"", "themes": [{"theme": "Summit expectations: trade and geopolitics stay frozen", "insights": [{"claim": "Expectations for the September 24, 2026 Trump-Xi summit are low, with age, temperament, and entrenched strategic positions on both sides pointing to continued rivalry rather than major policy shifts.", "speaker": "Alan Wm. Wolff", "type": "thesis", "entities": ["Donald Trump", "Xi Jinping", "United States", "China"], "conviction": "high", "so_what": "Markets should not price in a major US-China trade or geopolitical breakthrough from this summit; the realistic base case is continuity of the status quo.", "quote": "Expectations for the upcoming September 24 summit meeting in Washington between Presidents Xi Jinping of China and Donald Trump are not high.", "locator": "opening paragraph", "quote_verified": true}, {"claim": "The most likely trade outcome is an extension of the trade truce reached at Busan the prior year, with Trump keeping a base tariff above 10% on China and retaining flexibility to impose selective import limits.", "speaker": "Alan Wm. Wolff", "type": "prediction", "entities": ["Busan trade truce", "United States", "China", "tariffs"], "conviction": "medium", "so_what": "A base case of tariff-truce extension (not escalation or resolution) argues against positioning for either a trade-war re-escalation shock or a broad tariff-relief rally around the summit.", "quote": "More likely than not the trade truce reached last year at Busan will be extended... Trump has no intention of abandoning a base tariff of something above 10 percent", "locator": "trade and geopolitics section", "quote_verified": true}, {"claim": "China is expected to continue restricting access to choke-point commodities such as rare earths, critical minerals, and potentially active pharmaceutical ingredients as leverage in the trade relationship.", "speaker": "Alan Wm. Wolff", "type": "prediction", "entities": ["China", "rare earths", "critical minerals", "active pharmaceutical ingredients"], "conviction": "medium", "so_what": "Continued Chinese chokehold risk on rare earths and APIs argues for sustained US/allied reshoring and stockpiling premiums in those supply chains regardless of summit outcome.", "quote": "China will not surrender the option of providing only uncertain access for choke point commodities, e.g., rare earths and critical minerals, and at some point, perhaps, active pharmaceutical ingredients", "locator": "trade and geopolitics section", "quote_verified": true}, {"claim": "The US is expected to keep export controls in place on high-end chips, semiconductor production equipment, and software as a matter of national security regardless of summit outcomes.", "speaker": "Alan Wm. Wolff", "type": "prediction", "entities": ["United States", "semiconductor export controls", "China"], "conviction": "high", "so_what": "Persistent chip and semiconductor-equipment export controls sustain the investment case for non-China-exposed chip supply chains and for Chinese domestic semiconductor self-sufficiency efforts.", "quote": "Nor can he credibly pledge to refrain from all national security export controls on high end chips, semiconductor production equipment, and software.", "locator": "trade and geopolitics section", "quote_verified": true}, {"claim": "No breakthroughs are expected at the summit on environmental issues (climate change, overfishing, plastic pollution), pandemic preparedness, or expanded trade-discipline talks on subsidies and tariff transparency.", "speaker": "Alan Wm. Wolff", "type": "prediction", "entities": ["climate change", "pandemic preparedness", "trade policy"], "conviction": "medium", "so_what": "Global-commons issues will remain unaddressed by great-power coordination for at least another cycle, keeping the burden on smaller multilateral or regional efforts.", "quote": "all environmental issues (e.g., climate change, overfishing, plastic pollution in the oceans) are areas that will remain unattended to", "locator": "environmental and geopolitical section", "quote_verified": true}, {"claim": "Xi could be tempted toward a more aggressive approach on Taiwan reunification given the US Navy's commitment to the Strait of Hormuz, depleted US weapons stocks, and Washington's domestic focus on fuel prices.", "speaker": "Alan Wm. Wolff", "type": "causal", "entities": ["Xi Jinping", "Taiwan", "US Navy", "Strait of Hormuz"], "conviction": "medium", "so_what": "This is a live tail-risk flag: US naval overextension in the Middle East plus depleted munitions stocks is presented as a window of opportunity for Chinese assertiveness on Taiwan, relevant to defense and Taiwan-exposed supply-chain risk premia.", "quote": "Xi could be tempted to take a more aggressive approach to reunification by the fact that the US Navy is tied down in the Strait of Hormuz and not deployed heavily in Asia, by US weapons stocks being depleted, and by Washington's attention being concentrated on fuel prices at the pump.", "locator": "environmental and geopolitical section", "quote_verified": true}, {"claim": "US support for Taiwan is characterized as no more reliable right now than US commitment to NATO Article 5, given Trump's ambiguous public statements on the island's future.", "speaker": "Alan Wm. Wolff", "type": "contrarian", "entities": ["Taiwan", "NATO Article 5", "Donald Trump"], "conviction": "medium", "so_what": "A credibility discount on both Taiwan and NATO Article 5 commitments implies allies and markets should price higher geopolitical tail risk into Taiwan-adjacent assets (semiconductors, regional currencies) than official alliance rhetoric suggests.", "quote": "US support for Taiwan is no more reliable than its commitment to Article 5 of the North Atlantic Treaty Organization (NATO) right now, meaning not very.", "locator": "environmental and geopolitical section", "quote_verified": true}]}, {"theme": "AI safety as the one live opening for cooperation", "insights": [{"claim": "AI safeguards are identified as the one area where near-term US-China cooperation remains a real, open possibility, in contrast to trade and geopolitical issues where continuity is the base case.", "speaker": "Alan Wm. Wolff", "type": "thesis", "entities": ["AI safety", "United States", "China"], "conviction": "medium", "so_what": "AI-safety dialogue is the summit's one genuine surprise-upside catalyst to watch, distinct from the priced-in continuity elsewhere.", "quote": "One area of cooperation remains an open door—artificial intelligence (AI) safeguards.", "locator": "possible cooperation on AI safeguards section", "quote_verified": true}, {"claim": "Leading AI company CEOs and engineers have forecast a meaningful chance of relatively near-term human extinction from AI escaping control.", "speaker": "Alan Wm. Wolff", "type": "data_point", "entities": ["AI safety", "human extinction risk"], "conviction": "high", "so_what": "Extinction-risk forecasts from the industry's own leadership are being used to justify treating AI safeguards as a first-order geopolitical priority, not a niche regulatory topic.", "quote": "chances of relatively near-term human extinction have been forecast by leading AI company CEOs and engineers", "locator": "possible cooperation on AI safeguards section", "quote_verified": true}, {"claim": "US Treasury Secretary Scott Bessent has reportedly been working on limited AI-safety engagement with China, but his approach focuses narrowly on risk prevention and preserving US technological lead rather than collaborative global regulation.", "speaker": "Alan Wm. Wolff", "type": "data_point", "entities": ["Scott Bessent", "United States", "China", "AI safety"], "conviction": "medium", "so_what": "A US posture of 'narrow risk prevention plus lead preservation' rather than genuine collaborative regulation caps how far any summit AI announcement is likely to go.", "quote": "Bessent's \"approach focuses strictly on narrow risk prevention and maintaining the US technological lead, rather than collaborative global regulations.\"", "locator": "possible cooperation on AI safeguards section", "quote_verified": true}, {"claim": "Anthropic CEO Dario Amodei published a 3,800-word essay, \"We Must Pace the Frontier,\" calling for a global slowdown in AI development, endorsed by Sam Altman, Elon Musk, and Demis Hassabis.", "speaker": "Alan Wm. Wolff", "type": "data_point", "entities": ["Dario Amodei", "Anthropic", "Sam Altman", "Elon Musk", "Demis Hassabis"], "conviction": "high", "so_what": "Cross-lab CEO endorsement (Anthropic, OpenAI, xAI/SpaceX, Google DeepMind) of a slowdown essay signals unusual industry consensus that could translate into real policy momentum if channeled into the summit.", "quote": "Dario Amodei, CEO of Anthropic, has recently published a 3,800-word essay, entitled We Must Pace the Frontier, calling for a global slowdown in AI development... endorsed by Sam Altman... Elon Musk... and... Demis Hassabis", "locator": "possible cooperation on AI safeguards section", "quote_verified": true}, {"claim": "Chief scientists at OpenAI (Jakub Pachocki), Google DeepMind (Shane Legg), and Meta AI (Shengjia Zhao) have separately warned that no one is prepared for runaway AI.", "speaker": "Alan Wm. Wolff", "type": "data_point", "entities": ["Jakub Pachocki", "OpenAI", "Shane Legg", "Google // ---------- helpers ----------
// YouTube-aligned hex colors for tinted insight chips (bg = color+"1a", text = color, border = color+"55").
const TYPE_HEX = {
  thesis: '#6366f1', prediction: '#0ea5e9', framework: '#8b5cf6',
  data_point: '#059669', causal: '#d97706', contrarian: '#dc2626',
  anecdote: '#64748b',
};
const CONV_HEX = { high: '#16a34a', medium: '#ca8a04', low: '#94a3b8', exploratory: '#94a3b8' };
function typeHex(t) { return TYPE_HEX[String(t || '').toLowerCase()] || '#475569'; }
function convHex(c) { return CONV_HEX[String(c || '').toLowerCase()] || '#64748b'; }

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }

// Tinted chip (YouTube style): faint bg, colored text + border.
function tintChip(text, color) {
  return `<span class="chip" style="background:${color}1a;color:${color};border-color:${color}55">${escapeHtml(text)}</span>`;
}
function tagPills(tags) {
  if (!tags || !tags.length) return '';
  return tags.map(t => `<span class="pill tag">${escapeHtml(t)}</span>`).join(' ');
}

// ---------- rendering ----------
// Insight presentation ported from the YouTube digest: type/conviction tinted
// chips, speaker as a 🗣 chip, and entities as indigo chips — all in the meta row
// directly under the claim. Quote treatment is INTENTIONALLY kept as Concepts'
// verbatim + "✓ verified" (stronger than YouTube's ≈ paraphrase wording).
function renderInsight(ins) {
  if (!ins) return '';
  const cls = 'insight' + (ins.type ? (' ' + String(ins.type).toLowerCase()) : '');
  const meta = [];
  if (ins.type) meta.push(tintChip(ins.type, typeHex(ins.type)));
  if (ins.speaker) meta.push(`<span class="chip chip-spk">🗣 ${escapeHtml(ins.speaker)}</span>`);
  if (ins.conviction) meta.push(tintChip('conviction: ' + ins.conviction, convHex(ins.conviction)));
  (ins.entities || []).slice(0, 12).forEach(e => {
    if (e) meta.push(`<span class="chip chip-ent">${escapeHtml(e)}</span>`);
  });
  let quote = '';
  if (ins.quote) {
    const v = ins.quote_verified
      ? `<span class="vmark">✓ verified</span>`
      : `<span class="vmark no">unverified</span>`;
    quote = `<div class="quote">“${escapeHtml(ins.quote)}”${v}</div>`;
  }
  const so = ins.so_what
    ? `<div class="insight-so"><span class="lbl">so what</span>${escapeHtml(ins.so_what)}</div>` : '';
  return `
    <div class="${cls}">
      <div class="insight-claim">${escapeHtml(ins.claim || '')}</div>
      <div class="insight-meta">${meta.join('')}</div>
      ${so}
      ${quote}
    </div>`;
}

function renderTheme(theme) {
  const insights = (theme.insights || []).map(renderInsight).join('');
  return `
    <div class="theme">
      <div class="theme-title">${escapeHtml(theme.theme || 'Theme')}</div>
      ${insights}
    </div>`;
}

function renderCard(card) {
  if (!card) return '';
  const meta = card.source_meta || {};
  const nameHtml = card.source_url
    ? `<a class="source-name" href="${escapeAttr(card.source_url)}" target="_blank" rel="noopener">${escapeHtml(card.source_name || '')}</a>`
    : `<span class="source-name">${escapeHtml(card.source_name || '')}</span>`;
  const subBits = [];
  if (card.published_date) subBits.push(escapeHtml(card.published_date));
  if (meta.author) subBits.push(escapeHtml(meta.author));
  if (meta.word_count) subBits.push(`${meta.word_count} words`);
  if (meta.paywalled) subBits.push('paywalled');
  const themes = (card.themes || []).map(renderTheme).join('');
  const n = card.insight_total != null ? card.insight_total
            : (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
  return `
    <div class="source">
      <div class="source-head" onclick="toggleSource(this)">
        <div class="source-meta-left">
          <div class="source-name-row">${nameHtml}</div>
          <div class="source-title">${escapeHtml(card.title || '')}</div>
          <div class="source-sub">${subBits.join('  ·  ')}</div>
        </div>
        <span class="source-count">${n} insight${n === 1 ? '' : 's'}</span>
        <span class="source-arrow">▸</span>
      </div>
      <div class="source-body">
        ${card.gist ? `<div class="gist">${escapeHtml(card.gist)}</div>` : ''}
        ${card.tags && card.tags.length ? `<div class="tags">${tagPills(card.tags)}</div>` : ''}
        ${themes || '<div class="empty">No insights.</div>'}
      </div>
    </div>`;
}

function renderTopStats(d) {
  const s = d.stats || {};
  const parts = [];
  if (d.date) parts.push(`date <strong>${escapeHtml(d.date)}</strong>`);
  if (s.lookback_days != null) parts.push(`lookback <strong>${s.lookback_days}d</strong>`);
  if (s.sources != null) parts.push(`sources <strong>${s.sources}</strong>`);
  if (s.cards != null) parts.push(`cards <strong>${s.cards}</strong>`);
  if (s.insights != null) parts.push(`insights <strong>${s.insights}</strong>`);
  if (s.quote_verified_pct != null) parts.push(`quotes verified <strong>${s.quote_verified_pct}%</strong>`);
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSource(headEl) { headEl.parentElement.classList.toggle('open'); }

function insightCount(card) {
  return (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
}

// Build the sort/filter control bar (display only — re-groups REPORT_DATA in place).
function buildControls(d) {
  const cards = d.cards || [];
  const names = [...new Set(cards.map(c => c.source_name || '—'))].sort((a, b) => a.localeCompare(b));
  const opts = names.map(n => `<option value="${escapeAttr(n)}">${escapeHtml(n)}</option>`).join('');
  document.getElementById('controls').innerHTML =
    `<label>Sort
       <select id="sortSel">
         <option value="source">Source A–Z</option>
         <option value="insights">Insight count ▼</option>
       </select></label>
     <label>Source
       <select id="srcSel">
         <option value="__all">All sources (${names.length})</option>
         ${opts}
       </select></label>
     <span class="ctl-btns">
       <button type="button" id="expandAll">Expand all</button>
       <button type="button" id="collapseAll">Collapse all</button>
     </span>`;
  document.getElementById('sortSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('srcSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('expandAll').addEventListener('click', () => setAllGroups(false));
  document.getElementById('collapseAll').addEventListener('click', () => setAllGroups(true));
}

// Group-level collapse: header click toggles one group; the control-bar buttons toggle all.
function toggleGroup(headEl) { headEl.parentElement.classList.toggle('collapsed'); }
function setAllGroups(collapsed) {
  document.querySelectorAll('.group').forEach(g => g.classList.toggle('collapsed', collapsed));
}

// Group cards by source, sort groups (and cards within), optionally filter to one source.
function renderGroups(d) {
  const sortMode = (document.getElementById('sortSel') || {}).value || 'source';
  const srcFilter = (document.getElementById('srcSel') || {}).value || '__all';
  let cards = (d.cards || []).slice();
  if (srcFilter !== '__all') cards = cards.filter(c => (c.source_name || '—') === srcFilter);

  const groups = new Map();
  cards.forEach(c => {
    const k = c.source_name || '—';
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(c);
  });
  let entries = [...groups.entries()].map(([name, cs]) => ({
    name, cards: cs, insights: cs.reduce((a, c) => a + insightCount(c), 0),
  }));
  if (sortMode === 'insights') entries.sort((a, b) => b.insights - a.insights || a.name.localeCompare(b.name));
  else entries.sort((a, b) => a.name.localeCompare(b.name));
  // Within each source group, heaviest cards first.
  entries.forEach(e => e.cards.sort((a, b) => insightCount(b) - insightCount(a)));

  const html = entries.map(e => {
    const head = `<div class="group-head" onclick="toggleGroup(this)">`
      + `<span class="group-name">${escapeHtml(e.name)}</span>`
      + `<span class="group-meta">${e.cards.length} card${e.cards.length === 1 ? '' : 's'} · ${e.insights} insights</span>`
      + `<span class="group-arrow">▾</span></div>`;
    return `<div class="group">${head}<div class="group-body">${e.cards.map(renderCard).join('')}</div></div>`;
  }).join('');

  const app = document.getElementById('app');
  app.innerHTML = html || '<div class="empty">No cards for this source.</div>';
  // Open the first two source cards by default.
  document.querySelectorAll('.source').forEach((sec, i) => { if (i < 2) sec.classList.add('open'); });
}

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  document.getElementById('stats-top').innerHTML = renderTopStats(d);
  buildControls(d);
  renderGroups(d);   // default: grouped, sorted by source A–Z
}

renderReport(REPORT_DATA);
</script>
