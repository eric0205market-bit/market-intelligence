is compounding at 25%. Capex is a one-time check. Depreciation and interest are forever. Run that into 2028 margins.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://sixsigmaresearch.com/p/amazoncom-inc-amzn-earnings-update"}, {"id": 3, "cat": "AI/infra", "urgency": "deep", "source": "SixSigmaCapital / AMZN Q3 2026 Earnings Update", "title": "AWS backlog $578B growing triple digits; Trainium to be sold outside AWS in late 2027", "idea": "AWS grew 39.3% (from 37% in Q2, 28% in Q1) to a $184B run rate, with a $578B backlog growing at triple-digit rate. Bedrock token volume up ~17x YoY, Graviton and Trainium commitments each up >20x, inference now well over half of AI revenue. Jassy sees >40% growth in 2027 and 2028 and a trillion-dollar AWS in 5 to 10 years.", "angle": "Trainium going merchant is a direct shot at NVDA's pricing power and a signal custom silicon has crossed the credibility threshold. Watch $NVDA, $AVGO, $MRVL read-through.", "tweetA": "Amazon will sell Trainium to third parties from late 2027. Then NVDA's customer becomes NVDA's competitor, and also the supplier of the competitor's cloud. Nobody priced the conflict of interest.", "tweetB": "$578B backlog against $184B revenue run rate is more than three years of visibility. Which part of that is OpenAI, Meta, NVIDIA signing paper? Concentration risk is the footnote.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://sixsigmaresearch.com/p/amazoncom-inc-amzn-earnings-update"}, {"id": 4, "cat": "AI/infra", "urgency": "watch", "source": "SixSigmaCapital / AMZN Q3 2026 Earnings Update", "title": "Implied Q4 capex ~$48B vs $77.3B in Q3: nobody asked on the call", "idea": "Nine-month capex is $172.2B. A ~$220B full-year guide leaves ~$48B for Q4, well below the Q3 pace, and management gave no explanation. Either the guide is conservative, or Q4 is a deliberate pause, or capacity is constrained by components. Jassy also flagged memory pricing as a headwind.", "angle": "Either capex guide rises into the print in January or Q3 included pull-forward. That is a clean tell for $MU, $VRT, power names.", "tweetA": "Amazon guided $220B for the year and has spent $172B. Q3 alone was $77B. Q4 implies $48B. Either the guide is wrong or the supply chain is. I'm watching which one admits it first.", "tweetB": "Memory was named as a cost headwind on the same call where capex overshot by $18B. Somebody is paying more per bit and still buying more bits. That's the HBM/DRAM demand curve in one sentence.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://sixsigmaresearch.com/p/amazoncom-inc-amzn-earnings-update"}, {"id": 5, "cat": "tech", "urgency": "deep", "source": "SixSigmaCapital / AMZN Q3 2026 Earnings Update", "title": "Amazon ads slow to +12% from +26%; agentic shopping 'not meaningful' yet; Alexa shopping 570%", "idea": "Ad revenue $19.6B vs $20.8B est, growth 12% ex-FX vs 26% in Q2; Amazon blames Prime Day shift (850bps), NBA timing and a lapped search-engine-marketing change, and guides high-teens in Q4. Alexa for Shopping interactions up 570% with 400M users; US users spend 50% more per order. Outside agentic assistants have no meaningful effect on Amazon Ads yet.", "angle": "The 'agents disintermediate retail media' bear case has no data yet in AMZN; the Alexa number is the opposite signal. Contrast with GOOGL search.", "tweetA": "Amazon says outside AI agents aren't touching its ad business yet, while its own Alexa is shipping 570% more shopping interactions. The moat is the checkout, not the search box. For now.", "tweetB": "Ads at +12% against +26% a quarter ago is a 14-point drop that management explains with three different one-offs. When it takes three explanations, I want to see Q4 before I believe any of them.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://sixsigmaresearch.com/p/amazoncom-inc-amzn-earnings-update"}, {"id": 6, "cat": "gold", "urgency": "deep", "source": "Dark Side of the Boom / Gold Weekly", "title": "Gold fell 3.5% to ~$3,881 with the Nasdaq: 'the ATM' trade", "idea": "Spot gold fell ~3.5% to ~$3,881, a one-year low, as semis were liquidated; participants pointed to forced selling and margin calls. Gold went down WITH the Nasdaq twice in two weeks, not after it. Two large CFD desks described client after client stopped out. Playbook: 'Tech wreck: buy the yen, sell the gold.'", "angle": "Correlation regime shift: gold as liquidity source, JPY as funding unwind. Hedge books built on gold-vs-equity diversification just failed twice.", "tweetA": "Gold fell with the Nasdaq twice in two weeks. If your tail hedge sells off in the tail, it's a funding asset, not a hedge. Buy the yen, sell the gold is the new tech-drawdown reflex.", "tweetB": "$4,200 never broke, $4,000 broke. Gold had the dollar, yields and Gulf risk on its side and still couldn't rally. When a market refuses good news, the refusal is the position data.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://thedarksideoftheboom.substack.com/p/gold-weekly-when-the-safe-haven-becomes"}, {"id": 7, "cat": "gold", "urgency": "deep", "source": "Dark Side of the Boom / Gold Weekly", "title": "India September gold imports -81% YoY to ~$1.8B (~20 tonnes)", "idea": "India's marginal buying has gone: imports of roughly 20t, down 81% year on year, as retailers hold festival-season stock and old-gold recycling feeds domestic supply. At $4,000+ households buy lighter pieces and trade in old jewellery, so shops look busy while import demand disappears.", "angle": "Removes a key physical bid just as leveraged longs are flushed, leaving central banks and ETFs to absorb. Retail-looking-healthy is a classic lagging indicator.", "tweetA": "India imported ~20 tonnes of gold in September, down 81%. Shop traffic is fine. The marginal ounce is not coming from abroad. Gold's price floor is now purely an official-sector decision.", "tweetB": "High price is its own supply: Indian households are recycling old gold into new jewellery at $4,000. The same mechanism capped the 2011 silver run. Price creates its own scrap.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/gold-weekly-when-the-safe-haven-becomes"}, {"id": 8, "cat": "gold", "urgency": "deep", "source": "Dark Side of the Boom / Gold Weekly", "title": "Central banks 39t in August, 'a floor is not a trampoline'; no consistent election-day gold pattern", "idea": "Reported central-bank buying was 39t in August with China among the largest. The author's view: official demand supports ~$4,000, but central banks 'can be patient' and don't have to rescue leveraged longs. History shows no statistically compelling gold reaction to US election outcomes; policy mix afterwards matters. Test for a bottom: whether the next bad news still makes gold go down.", "angle": "Tactical vs structural gold clocks disagree. Midterm event risk (blue sweep, Trump veto) is a fiscal-policy question, not a gold question.", "tweetA": "Central banks bought 39t in August. That's the floor. But a floor isn't a bid under every down tick, and they have no incentive to rescue somebody's margin call. Wait for them to name a price.", "tweetB": "The only gold signal I trust after a washout isn't the bounce. It's the next piece of bad news that fails to push it lower. Haven't seen that print yet.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/gold-weekly-when-the-safe-haven-becomes"}, {"id": 9, "cat": "gold", "urgency": "deep", "source": "Tavi Costa / The Bull Isn't Dead", "title": "Silver 2011 vs now: price rose then with a massive supply response, today it's missing", "idea": "Tavi Costa argues the 2011 silver peak was accompanied by a large production increase, whereas today the supply response is 'completely missing', so a violent correction is not the end of the cycle. Report contains multiple charts on precious metals and cycle positioning.", "angle": "Counter to the liquidation narrative in gold: supply inelasticity argues for a sharp but not terminal drawdown. Pair with India demand weakness for the bear side.", "tweetA": "In 2011 silver's price spike pulled out a wave of new supply. In 2026 it hasn't. A correction without a supply response isn't the 2011 top. It's a margin call on a market that still can't make more metal.", "tweetB": "Gold is being sold as 'liquidity' and silver is being argued as 'supply-constrained'. Same week, same tape. Anyone building the pair trade between the two needs to decide which story they believe.", "charts": {"count": 0, "hot": false, "desc": "Report reportedly has many charts — worth opening"}, "link": "https://tavicosta.substack.com/p/the-bull-isnt-dead"}, {"id": 10, "cat": "positioning", "urgency": "deep", "source": "Eliant Capital / The Week Ahead 11/1/26", "title": "Anthropic S-1 'better than feared' sparked growth/momentum rebound that failed by Friday", "idea": "Early week: indices rallied on Middle East resolution hopes and Anthropic's S-1 being much better than feared, relief for momentum/growth. Then disappointing Big Tech earnings pared it: Nasdaq-100 went from +300bps on the week to about -200bps, while small caps closed +130bps. Growth and Momentum ended as the worst factors; Value and low-vol outperformed.", "angle": "The AI IPO is now a factor-level catalyst. Fade/relief dynamics: growth got its bounce and sold it within days.", "tweetA": "Anthropic's S-1 gave the Nasdaq a 500bp swing from the week's high to its low. One IPO filing moved factor leadership. That's not a company anymore, that's a macro event.", "tweetB": "Small caps +130bps on a week where the Q's lost 200. The AI trade got rejected and the money rotated into the part of the market with no AI capex bill.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.eliantcapital.com/p/the-week-ahead-11126-e4b"}, {"id": 11, "cat": "positioning", "urgency": "deep", "source": "Eliant Capital / The Week Ahead 11/1/26", "title": "Breadth recovering (52% above 20D, 41% above 50D) while Fear & Greed hovers near Extreme Fear with S&P only ~3.2% off highs", "idea": "Percent of stocks above the 20-day rose toward 52%, back to neutral; above the 50-day just 41%, still slightly oversold. Fear & Greed is firmly in Fear and nearly Extreme Fear even though the S&P is just over 320bps off highs, because of a big under-the-hood factor 'reset'.", "angle": "Index drawdown understates internal damage; sentiment tracks the factor reset. The setup for midterm/jobs binary events is oversold breadth, not oversold price.", "tweetA": "S&P is 3% from its high and Fear & Greed is near Extreme Fear. The index is lying about how it feels. Half the market already had its correction.", "tweetB": "41% above the 50-day while the index sits near highs: that's a market where the rotation did the damage and the index weights hid it.", "charts": {"count": 1, "hot": false, "desc": "Fear & Greed Index overlaid with S&P (referenced, not visible in plain text)"}, "link": "https://www.eliantcapital.com/p/the-week-ahead-11126-e4b"}, {"id": 12, "cat": "macro", "urgency": "watch", "source": "Eliant Capital / The Week Ahead 11/1/26", "title": "Week ahead: midterms + QRA + Friday jobs report after a soft, higher-unemployment print", "idea": "Packed week: US midterm elections, the Treasury quarterly refunding announcement (QRA), scattered labor data, and Friday's jobs report which follows a softer-than-expected print with an uptick in unemployment. Author also reports a 197% return since June '23 vs QQQ 96.6% and SPY 82.3%.", "angle": "Three event risks stacked: fiscal supply (QRA), political outcome, labor. Gold and tech both enter fragile.", "tweetA": "Midterms, QRA and payrolls in one week with breadth oversold and gold below $4,000. The QRA is the one nobody is positioned for. Coupon sizes decide what the election means for the long end.", "tweetB": "Last jobs report: softer headline, higher unemployment. If Friday repeats it while oil stays high, the Fed gets stuck between the two halves of its mandate.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.eliantcapital.com/p/the-week-ahead-11126-e4b"}, {"id": 13, "cat": "geopolitics", "urgency": "deep", "source": "Michael McDonough / The Pressure Point (Fulcrum)", "title": "Alaska: DOJ asks to isolate ballots for second 'Dan Sullivan'; state says it's 'disturbing and impossible'", "idea": "The DOJ wants ballots for Daniel J. Sullivan Jr. separated as part of a criminal probe into his candidacy. Alaska says it would breach ballot secrecy, and any separation can't show who was confused. Prosecutors can prove recruitment through subpoenas without proving effect; an election remedy requires evidence of changed votes. Dunleavy ordered a state investigation Oct 28; election is Nov 3; no certification date was reported.", "angle": "Election-contest precedent risk: aggregate remedies for 'confusion' with a secret ballot. Senate control margin makes the Alaska race market-relevant.", "tweetA": "You can prove who recruited the second Dan Sullivan. You can't prove who voted for him by mistake. The secret ballot is the reason a federal remedy here needs a legal theory nobody has used.", "tweetB": "If Sullivan Jr.'s total exceeds the margin, expect a fight about 'possible distortion' with no statute behind it. A one-seat Senate is exactly when someone tests that.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://pressurepoint.whatsthelatest.ai/archive/the-pressure-point-privacy-makes-confusion/"}, {"id": 14, "cat": "crypto", "urgency": "act", "source": "Michael McDonough / The Pressure Point (Fulcrum)", "title": "Hackers stole $6.3B from Binance; exchanges moving to tighten security (FT)", "idea": "Per the Pressure Point 'Things happen' roundup citing the FT, crypto exchanges moved to tighten security after hackers stole $6.3 billion from Binance (the newsletter prints 'Bin-ance'). Treat as a single-sourced headline pending verification, but the size would be the largest exchange hack on record.", "angle": "If confirmed: exchange counterparty risk, withdrawals, BNB, and a spot-vs-perp basis dislocation. Verify with FT/primary before any trade.", "tweetA": "$6.3B stolen from the world's largest exchange would be 4x the Bybit hack. If that holds up, the question isn't price. It's who is on the other side of every Binance balance this weekend.", "tweetB": "Every cycle teaches the same lesson: custody is a credit risk. A $6.3B loss either gets socialized or it doesn't. Watch proof-of-reserves and withdrawal queues before the headline.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://pressurepoint.whatsthelatest.ai/archive/the-pressure-point-privacy-makes-confusion/"}, {"id": 15, "cat": "geopolitics", "urgency": "act", "source": "Michael McDonough / The Pressure Point (Fulcrum)", "title": "IRGC says it is monitoring US regional movements; warns new US/Israeli attacks could widen conflict", "idea": "Roundup item (Fox live blog): Iran's Revolutionary Guards said they're monitoring US movements and warned fresh strikes could expand the conflict. Gold weekly notes the Gulf risk premium keeps oil elevated and the Fed inflation problem alive, while indices rallied early in the week on hopes of a Middle East resolution.", "angle": "Weekend gap risk for crude and gold. Connects directly to oil as inflation gatekeeper in the gold piece.", "tweetA": "Monday opens with equities priced for a Middle East resolution and the IRGC saying 'monitoring'. Oil is the only asset that doesn't get to pretend.", "tweetB": "Gold can't rally on Gulf risk because the same shock keeps oil high and real yields firm. The geopolitical bid and the inflation penalty come in one package.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://pressurepoint.whatsthelatest.ai/archive/the-pressure-point-privacy-makes-confusion/"}, {"id": 16, "cat": "macro", "urgency": "deep", "source": "Michael McDonough / The Pressure Point (Fulcrum)", "title": "Midterm final blitz: October polling collapse put House and Senate control at risk for Republicans", "idea": "NY Post reports Republicans entered the final campaign push with control of both chambers at risk after October's polling collapse threatened previously safe incumbents. Gold weekly floats 'Blue Sweep and Trump Veto' as the post-midterm scenario; Eliant lists the midterms and QRA as week-ahead catalysts.", "angle": "Divided government = fiscal gridlock = term premium and defense/energy policy implications. Three sources, one event.", "tweetA": "The market is trading AI capex. The election is about to reprice everything else: tariffs, fiscal, energy permitting. Divided government is the underpriced scenario in the long end.", "tweetB": "Three newsletters, three different angles on Nov 3: polling collapse, gold event risk, week-ahead calendar. Nobody is writing about what a Democratic House does to the permitting bill.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://pressurepoint.whatsthelatest.ai/archive/the-pressure-point-privacy-makes-confusion/"}, {"id": 17, "cat": "geopolitics", "urgency": "watch", "source": "Michael McDonough / The Pressure Point (Fulcrum)", "title": "UK PM Burnham open to formal slavery apology, rules out reparations; UN ends Somalia political mission after 30 years", "idea": "Two roundup items: Prime Minister Andy Burnham said he is open to a formal apology for Britain's role in the transatlantic slave trade but not reparations (Breitbart); the UN ended its political mission in Somalia after three decades, shifting peacebuilding to Somali institutions (Bloomberg). Also: Virginia and DC sued to block Trump's memorial arch; judge dismissed with prejudice Trump's WSJ/Murdoch Epstein-letter defamation suit (SCMP).", "angle": "UK politics under Burnham and the retreat of UN missions in Africa are slow-burn signals; a Gulf of Aden shipping and Horn of Africa security read-through.", "tweetA": "The UN leaves Somalia after 30 years. The Gulf of Aden doesn't get less strategic because the mission ended. Who fills the vacuum is a shipping insurance question.", "tweetB": "Britain's PM says apology yes, reparations no. The line is drawn at the balance sheet. Every legacy-liability debate in Europe ends at that same line.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://pressurepoint.whatsthelatest.ai/archive/the-pressure-point-privacy-makes-confusion/"}, {"id": 18, "cat": "regulation", "urgency": "deep", "source": "McKinsey / Chart of the Week", "title": "$900B of US construction (about 40% of $2.2T) sits in sectors needing federal permitting", "idea": "McKinsey's Chart of the Week: projects requiring federal permitting are concentrated in eight sectors accounting for ~$900B of construction underway in 2025, about 40% of the ~$2.2T total. Delays ripple unevenly across states by industry mix. Their conclusion: competitive edge comes from 'pipeline clarity, not pipeline size'.", "angle": "Permitting is the binding constraint on grid, data center and nuclear buildout. Ties directly to AMZN's $220B capex: capital isn't the bottleneck, approvals are.", "tweetA": "40% of all US construction in progress depends on a federal permit. Amazon can borrow $48B in a quarter. It cannot borrow a permit. Capex guidance is a statement about approvals, not just money.", "tweetB": "The AI buildout is a $200B+ per-company project sitting on top of a $900B permitting queue. The constraint that matters isn't chips. It's the Army Corps and FERC.", "charts": {"count": 1, "hot": true, "desc": "The US permitting mix: 8 sectors, ~$900B in 2025 construction"}, "link": "https://www.mckinsey.com/industries/public-sector/our-insights/federal-permittings-uneven-economic-impact-and-what-companies-can-do-about-it"}, {"id": 19, "cat": "energy", "urgency": "watch", "source": "McKinsey / Chart of the Week", "title": "McKinsey: rising electricity system costs create divergent affordability pressure across G20", "idea": "From the 'missed last week' blurb: McKinsey's Humayun Tai and coauthors show rising electricity system costs create diverging affordability challenges across G20 economies, with countries responding by accelerating lower-cost domestic energy supply. Only the summary is in the email; the chart is on the McKinsey site.", "angle": "Power cost is the AI-capex tax on consumers. Which G20 country moves first on domestic supply affects industrial location and utility pricing.", "tweetA": "Electricity is becoming the real inflation story. Every country in the G20 is solving the same problem with domestic supply. Whoever does it cheapest gets the next data center cycle.", "tweetB": "AI wants gigawatts. Households want a stable bill. Policy picks one, and the G20 is picking different answers. That's the long-run spread between power markets.", "charts": {"count": 1, "hot": false, "desc": "When electricity costs outpace growth — charts inside, worth opening"}, "link": "https://www.mckinsey.com/featured-insights/charts/when-electricity-costs-outpace-growth"}];

  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}
function toggle(id){document.getElementById('c'+id).classList.toggle('open');}
function cardHtml(item){
  var c=COL[item.cat]||'#888';
  var ch=item.charts.count>0?(item.charts.hot?'🔥':'📊'):'';
  var h='<div class="card" id="c'+item.id+'" data-cat="'+item.cat+'" data-urg="'+item.urgency+'" data-src="'+esc(item.source)+'">';
  h+='<div class="hd" onclick="toggle('+item.id+')"><span class="num">'+item.id+'</span><span>'+UE[item.urgency]+'</span><span class="src" style="background:'+c+'">'+esc(item.source)+'</span><span class="tag">'+item.cat+'</span><span>'+ch+'</span><div class="ttl">'+esc(item.title)+'</div></div>';
  h+='<div class="bd"><div class="lbl">The Idea</div><div>'+esc(item.idea)+'</div>';
  h+='<div class="lbl">My Angle</div><div class="angle" style="border-color:'+c+';background:'+c+'14">'+esc(item.angle)+'</div>';
  h+='<div class="tw"><div><div class="lbl" style="color:#378add">Tweet A</div>'+esc(item.tweetA)+'<br><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button></div>';
  h+='<div><div class="lbl" style="color:#7f77dd">Tweet B</div>'+esc(item.tweetB)+'<br><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div></div>';
  var d=item.charts.desc||(item.charts.count?'':'No chart in email');
  h+='<div class="chart'+(item.charts.hot?' hot':'')+'">'+(item.charts.hot?'🔥 CHART WORTH SAVING — ':'📊 ')+item.charts.count+' chart(s). '+esc(d)+'</div>';
  h+='<div style="margin-top:10px"><a href="'+item.link+'" target="_blank" rel="noopener">↗ Read full article</a></div></div></div>';
  return h;
}
function collapseAll(){var cs=document.querySelectorAll('.card');for(var i=0;i<cs.length;i++)cs[i].classList.remove('open');}
function apply(expand){
  var cs=document.querySelectorAll('.card');
  for(var i=0;i<cs.length;i++){var c=cs[i];var it=ITEMS[i];
    var ok=(curCat==='All'||it.cat===curCat)&&(curUrg==='All'||it.urgency===curUrg)&&(!curSrc||it.source.indexOf(curSrc)!==-1);
    c.style.display=ok?'':'none'; if(expand&&ok)c.classList.add('open'); else c.classList.remove('open');}
  drawBars();
}
function setCat(c){curCat=c;curSrc=null;apply(false);}
function setUrg(u){curUrg=u;curSrc=null;apply(false);}
function filterBySrc(name){curSrc=name;curCat='All';curUrg='All';apply(true);window.scrollTo(0,0);}
function pill(label,active,color,fn){return '<span class="pill" style="'+(active?'background:'+color+';border-color:'+color+';color:#fff':'')+'" onclick="'+fn+'">'+label+'</span>';}
function drawBars(){
  var cats=[],cnt={};ITEMS.forEach(function(i){if(!cnt[i.cat]){cnt[i.cat]=0;cats.push(i.cat);}cnt[i.cat]++;});
  var h=pill('All ('+ITEMS.length+')',curCat==='All'&&!curSrc,'#333',"setCat('All')");
  cats.forEach(function(c){h+=pill(c+' ('+cnt[c]+')',curCat===c,COL[c]||'#888',"setCat('"+c+"')");});
  document.getElementById('cats').innerHTML=h;
  var u=[['All','All'],['act','🔴 Act Now'],['deep','🔵 Deep'],['watch','🟡 Watch']];
  h='';u.forEach(function(x){var n=x[0]==='All'?ITEMS.length:ITEMS.filter(function(i){return i.urgency===x[0];}).length;h+=pill(x[1]+' ('+n+')',curUrg===x[0],'#333',"setUrg('"+x[0]+"')");});
  document.getElementById('urg').innerHTML=h;
}
function init(){
  document.getElementById('sub').textContent=META.date+' · '+META.time+' · '+ITEMS.length+' items';
  document.getElementById('list').innerHTML=ITEMS.map(cardHtml).join('');
  var r='<p><b>Window:</b> '+META.windowStart+' to '+META.windowEnd+'. Emails outside this window were not processed.</p>';
  r+='<p>Emails in window: '+META.emailsInWindow+' · read: '+META.emailsRead+' · items: '+META.itemsExtracted+'</p><p><b>Included sources (click to filter):</b></p><ul>';
  META.includedSources.forEach(function(s){r+='<li><span class="sl" data-n="'+esc(s.name)+'" onclick="filterBySrc(this.getAttribute(\'data-n\'))">'+esc(s.name)+'</span> — '+s.items+' items</li>';});
  r+='</ul><p><b>Skipped:</b> none</p><p>'+esc(META.notes)+'</p>';
  document.getElementById('rb').innerHTML=r;
  drawBars();
}
init();
</script></body></html>
