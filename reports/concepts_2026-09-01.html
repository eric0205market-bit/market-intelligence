lue-chain stages — research and development, digital infrastructure, ecosystem readiness and adoption — with the strongest correlation appearing in R&D.", "speaker": "Yasuko Koido", "type": "framework", "entities": ["Australia", "India", "Japan", "Malaysia", "Singapore", "South Korea", "Thailand"], "conviction": "high", "so_what": "A reusable four-stage scorecard for ranking APAC jurisdictions on where AI value actually accrues versus where it is merely consumed.", "quote": null, "locator": "We compared copyright frameworks in Australia", "quote_verified": false}, {"claim": "Singapore ranks as the clearest and most flexible AI-training copyright regime among the seven APAC economies studied, combining a computational data analysis exception with a broad fair-use provision plus safeguards on how data can be accessed and used.", "speaker": "Yasuko Koido", "type": "data_point", "entities": ["Singapore", "computational data analysis exception", "fair use"], "conviction": "high", "so_what": "Supports Singapore as the default APAC domicile for model development and the associated compute, talent and services spend.", "quote": "Its computational data analysis exception and broad fair-use provision give developers comparatively high certainty around permitted uses", "locator": "Singapore combines the clearest and most flexible", "quote_verified": true}, {"claim": "Japan's historically flexible treatment of non-expressive uses, including an explicit text-and-data-mining exception, underpins its strong AI research and patenting position — but recent litigation and policy debate could inject fresh uncertainty into that environment.", "speaker": "Yasuko Koido", "type": "prediction", "entities": ["Japan", "text-and-data-mining exception", "AI research"], "conviction": "medium", "so_what": "A live watch item: Japanese AI-training case law is the single most likely APAC regime change to reprice model-development location decisions.", "quote": "Recent litigation and policy debate, however, could introduce greater uncertainty into that environment.", "locator": "Japan has historically taken a relatively flexible approach", "quote_verified": true}, {"claim": "Australia has the least flexible AI-training copyright framework of the seven economies assessed, with no explicit exception for AI training or text and data mining and future licensing arrangements still under discussion.", "speaker": "Yasuko Koido", "type": "data_point", "entities": ["Australia", "text and data mining", "licensing"], "conviction": "high", "so_what": "Flags Australian AI licensing reform as an unpriced binary catalyst for its domestic AI ecosystem and for rights-holders' bargaining power.", "quote": null, "locator": "Australia sits at the other end", "quote_verified": false}, {"claim": "India, Malaysia and Thailand show greater uncertainty or more restrictive conditions on copyrighted material for AI training while simultaneously facing infrastructure, talent or investment constraints — so copyright costs compound existing weaknesses rather than closing the gap with regional leaders.", "speaker": "Yasuko Koido", "type": "causal", "entities": ["India", "Malaysia", "Thailand"], "conviction": "medium", "so_what": "Argues for divergence rather than convergence in APAC AI capability — fade catch-up narratives for these three absent copyright reform.", "quote": "copyright-related costs and uncertainty risk compounding existing weaknesses rather than helping close the gap with regional leaders", "locator": "Similar issues arise in economies where", "quote_verified": true}]}, {"theme": "Complements, not substitutes", "insights": [{"claim": "Legal flexibility on AI training is necessary but not sufficient: Japan's favourable copyright settings cannot compensate for weaknesses elsewhere in its ecosystem, while Singapore's outperformance reflects legal clarity combined with infrastructure, talent, capital and strong adoption.", "speaker": "Yasuko Koido", "type": "framework", "entities": ["Japan", "Singapore"], "conviction": "high", "so_what": "Screen jurisdictions on the joint condition — a permissive copyright regime alone is not a buy signal for national AI exposure.", "quote": "One lesson from the comparison is that legal flexibility on its own is not enough.", "locator": "Copyright rules can reinforce—or frustrate—AI investment", "quote_verified": true}, {"claim": "The complementarity runs in reverse too: Australia demonstrates that heavy investment in digital infrastructure and AI adoption can coexist with a restrictive training-data regime, leaving an otherwise strong ecosystem underperforming in frontier AI R&D.", "speaker": "Yasuko Koido", "type": "contrarian", "entities": ["Australia", "digital infrastructure", "AI adoption"], "conviction": "medium", "so_what": "Data-centre and adoption metrics alone overstate a country's ability to capture AI value; check the legal layer before extrapolating capex into domestic IP creation.", "quote": "the contrast illustrates how uncertainty around access to training data can weaken an otherwise strong ecosystem", "locator": "Australia sits at the other end", "quote_verified": true}, {"claim": "Access to training data is one of the conditions determining whether APAC governments succeed in moving up the stack from adopting foreign-built AI to hosting research, model development, specialised AI services and the accompanying talent and capital.", "speaker": "Yasuko Koido", "type": "thesis", "entities": ["Asia-Pacific", "AI services", "model development"], "conviction": "high", "so_what": "The adoption-to-creation transition is the value-capture prize; copyright regimes are a cheap screen for which economies can plausibly make it.", "quote": null, "locator": "That matters particularly as governments across Asia-Pacific", "quote_verified": false}]}, {"theme": "Policy arbitrage and the sovereign-AI spend", "insights": [{"claim": "Copyright policy does not operate separately from the billions being invested in compute, skills, research and AI adoption across Asia-Pacific, meaning a mismatched legal regime can actively undercut the returns on state AI capex already committed.", "speaker": "Yasuko Koido", "type": "thesis", "entities": ["Asia-Pacific", "compute", "AI adoption"], "conviction": "high", "so_what": "Sovereign-AI programmes with weak training-data law are a lower-quality earnings stream for infrastructure vendors than headline budget numbers imply.", "quote": "copyright policy does not operate separately from the billions being invested in compute, skills, research and AI adoption across the region", "locator": "This matters because copyright policy", "quote_verified": true}, {"claim": "The implied policy prescription is predictability over permissiveness per se — clear, workable frameworks improve investment conditions, while restrictive or merely uncertain frameworks both add cost and risk, putting ambiguity in the same penalty box as prohibition.", "speaker": "Yasuko Koido", "type": "framework", "entities": ["copyright policy", "AI"], "conviction": "high", "so_what": "Prolonged unresolved litigation is as damaging to a jurisdiction's AI investment case as an adverse ruling — do not wait for verdicts to reprice.", "quote": "Conversely, restrictive or uncertain frameworks add costs and risk.", "locator": "Adding economics to the copyright debate", "quote_verified": true}, {"claim": "The author concedes the economic evidence does not override creator and rights-holder interests, but argues copyright decisions should no longer be treated solely as questions of copyright law — an explicit attempt to insert cost-benefit economics into a debate previously framed on legal and moral grounds.", "speaker": "Yasuko Koido", "type": "contrarian", "entities": ["rights-holders", "creators", "copyright policy"], "conviction": "medium", "so_what": "Signals the lobbying frame AI developers will use in APAC copyright consultations; watch for growth-impact modelling entering official submissions.", "quote": "But nor should those decisions be treated solely as questions of copyright law.", "locator": "Adding economics to the copyright debate", "quote_verified": true}, {"claim": "Government copyright choices will help determine where AI research and development takes place, where investment flows, and how much economic value each country ultimately captures from the technology — making copyright a first-order variable in national AI strategy rather than a peripheral one.", "speaker": "Yasuko Koido", "type": "prediction", "entities": ["AI", "copyright policy", "Asia-Pacific"], "conviction": "high", "so_what": "Expect copyright regime changes to become tradeable catalysts for country-level AI exposure over the next policy cycle.", "quote": "Copyright is therefore not a peripheral consideration in AI strategy.", "locator": "Copyright is therefore not a peripheral", "quote_verified": true}]}], "insight_total": 18, "top_entities": ["Singapore", "Japan", "Australia", "India", "Malaysia", "Thailand", "South Korea", "Asia-Pacific", "AI", "copyright policy", "text and data mining", "training data"], "source_meta": {"author": "Yasuko Koido", "word_count": 1101, "paywalled": false}}, {"record_id": "95d48c7117047fb1", "source_type": "concepts", "source_name": "SF Fed Economic Letters", "source_url": "https://www.frbsf.org/research-and-insights/publications/economic-letter/2026/08/consumer-vibe-check-gas-prices-and-inflation-expectations/", "title": "Consumer Vibe Check: Gas Prices and Inflation Expectations - San Francisco Fed", "published_date": "2026-08-31", "language": "en", "processed_at": "2026-09-01T13:50:28Z", "processor": "claude-code-sub-opus", "tags": ["Macro", "Energy", "Geopolitics", "Society"], "gist": "Using New York Fed Survey of Consumer Expectations panel data from June 2013 to June 2025, SF Fed researchers find household inflation expectations ratchet asymmetrically with gasoline: a 10 percentage point upward revision in expected gas price growth coincides with a 0.24 percentage point rise in one-year inflation expectations, while comparable downward revisions produce no statistically significant decline. The effect is more than three times larger for households earning under $50,000 than for those over $100,000, and upward gas revisions also widen perceived inflation uncertainty by 3.3%.", "themes": [{"theme": "2026 gasoline shock backdrop", "insights": [{"claim": "Average U.S. monthly retail gasoline prices hit $4.65 per gallon in May 2026, up from $3.06 in February 2026 before the start of the U.S.-Iran conflict — a roughly 52% move in three months.", "speaker": "Taerin Kim", "type": "data_point", "entities": ["gasoline", "United States", "Iran", "crude oil"], "conviction": "high", "so_what": "A pump-price move of this size is the exact stimulus this research shows ratchets household inflation expectations upward without symmetric reversal — watch breakevens and survey expectations even if oil retraces.", "quote": "The average monthly retail gasoline price in the United States reached $4.65 per gallon in May 2026, up from $3.06 in February before the start of the U.S.-Iran conflict.", "locator": "This possibility is especially relevant now", "quote_verified": true}, {"claim": "Middle East conflict and supply chain disruptions around the Strait of Hormuz are the identified proximate drivers of renewed 2026 oil and gasoline price concerns.", "speaker": "Taerin Kim", "type": "causal", "entities": ["Strait of Hormuz", "Middle East", "oil", "gasoline", "supply chains"], "conviction": "high", "so_what": "Hormuz transit risk is now a direct input into U.S. household inflation psychology, not just a crude spread trade — geopolitical headlines transmit to expectations faster than to CPI prints.", "quote": null, "locator": "This possibility is especially relevant now", "quote_verified": false}, {"claim": "The 2026 energy disruption is framed as the second such episode in four years, following the gas price surge after Russia's 2022 invasion of Ukraine that made energy a central U.S. household budget concern.", "speaker": "Taerin Kim", "type": "framework", "entities": ["Russia", "Ukraine", "energy prices", "U.S. households"], "conviction": "medium", "so_what": "Repeated energy shocks compound under an asymmetric ratchet: each episode adds to the expectations level without full give-back, raising the risk of drift in the anchor over a decade.", "quote": null, "locator": "These recent global energy market disruptions follow", "quote_verified": false}]}, {"theme": "Asymmetric expectations ratchet", "insights": [{"claim": "A 10 percentage point upward revision in a household's expected gasoline price growth is associated with a 0.24 percentage point increase in that same household's one-year inflation expectations — statistically significant but quantitatively modest.", "speaker": "Taerin Kim", "type": "data_point", "entities": ["gasoline", "inflation expectations", "New York Fed Survey of Consumer Expectations"], "conviction": "high", "so_what": "Gives a usable elasticity: a doubling of pump-price expectations moves one-year household inflation expectations by only a few tenths, so gas shocks alone are unlikely to de-anchor expectations absent other pressure.", "quote": "A 10 percentage point upward revision in expected gas price growth is associated with a 0.24 percentage point increase in one-year inflation expectations.", "locator": "Figure 1 shows the relationship", "quote_verified": true}, {"claim": "Downward revisions in expected gasoline price growth are not associated with a statistically significant decline in inflation expectations, and the gap between the upward and downward responses is statistically distinguishable from zero.", "speaker": "Taerin Kim", "type": "contrarian", "entities": ["inflation expectations", "gasoline"], "conviction": "high", "so_what": "Energy disinflation does not buy back the expectations damage that energy inflation caused — a falling oil price is a weaker policy tailwind for the Fed than a rising one is a headwind.", "quote": "A comparable downward revision is not associated with a statistically significant decline in inflation expectations", "locator": "The response is also asymmetric", "quote_verified": true}, {"claim": "The core mental model is a one-way ratchet: gasoline price pressure leaves a more persistent imprint on household inflation outlooks when prices climb than when they subside.", "speaker": "Taerin Kim", "type": "framework", "entities": ["inflation expectations", "gasoline", "Federal Reserve Bank of San Francisco"], "conviction": "high", "so_what": "Model energy pass-through to expectations as path-dependent, not mean-reverting — a round trip in oil leaves the expectations level higher than where it started.", "quote": "Our results suggest that gasoline price pressures may leave a more persistent imprint on household inflation outlooks when prices climb than when they subside.", "locator": "Conclusion", "quote_verified": true}, {"claim": "Households appear to treat sharp gasoline price increases as a signal about economy-wide inflation rather than as a change in one spending category, because gas is among the most salient and volatile expenses consumers face.", "speaker": "Taerin Kim", "type": "causal", "entities": ["gasoline", "inflation expectations", "Coibion and Gorodnichenko"], "conviction": "medium", "so_what": "Salience, not budget weight alone, drives the signal — so highly visible posted prices (fuel, groceries) carry outsized weight in expectations relative to their CPI share.", "quote": "When gas prices rise sharply, people may interpret the increase not just as a price change in this category but as a signal about inflation more generally.", "locator": "Gasoline prices are among the most salient", "quote_verified": true}, {"claim": "The observed comovement between gasoline and inflation expectations is repeatedly characterized as modest in magnitude, tempering the popular narrative that pump prices dominate consumer inflation psychology.", "speaker": "Taerin Kim", "type": "thesis", "entities": ["gasoline", "inflation expectations"], "conviction": "medium", "so_what": "Counterweight to trading gas prices as a proxy for expectations de-anchoring — the direction is real but the size argues against overreacting to a single pump-price spike.", "quote": "quantitatively, the evidence suggests a moderate relationship between changes in expected gasoline prices and households’ inflation expectations", "locator": "According to household surveys, inflation expectations", "quote_verified": true}]}, {"theme": "Inflation uncertainty channel", "insights": [{"claim": "A 10 percentage point upward revision in expected gasoline price growth is associated with a 3.3% increase in the interquartile range of a household's one-year inflation expectations, versus only 1.4% for a comparable downward revision.", "speaker": "Taerin Kim", "type": "data_point", "entities": ["inflation uncertainty", "interquartile range", "gasoline"], "conviction": "high", "so_what": "Uncertainty is a separate, larger channel than the level effect — rising gas prices widen the distribution of expected outcomes, which supports higher inflation risk premia even when point forecasts barely move.", "quote": "a 10 percentage point upward revision in expected gas-price growth is associated with a 3.3% increase in the IQR of one-year inflation expectations, while a comparable downward revision is associated with a 1.4% increase", "locator": "Using specifications similar to those in Figure 1", "quote_verified": true}, {"claim": "Revisions to expected gasoline price growth in either direction — up or down — raise perceived inflation uncertainty, meaning falling gas price expectations still widen the distribution of outcomes households consider plausible.", "speaker": "Taerin Kim", "type": "contrarian", "entities": ["inflation uncertainty", "gasoline"], "conviction": "high", "so_what": "Energy volatility per se, not just direction, is the uncertainty driver — an oil price collapse does not restore confidence in the inflation outlook, arguing for persistently elevated inflation optionality pricing.", "quote": "revisions of gas price growth in either direction are associated with greater perceived uncertainty", "locator": "Using specifications similar to those in Figure 1", "quote_verified": true}, {"claim": "Concerns about gasoline prices can coincide with a materially less certain household inflation outlook even when the average change in expected inflation itself is small.", "speaker": "Taerin Kim", "type": "thesis", "entities": ["inflation expectations", "inflation uncertainty", "gasoline"], "conviction": "medium", "so_what": "Point-estimate survey measures understate the true expectations damage from energy shocks — track dispersion and IQR measures, not just median expected inflation.", "quote": null, "locator": "This suggests that concerns about gas prices", "quote_verified": false}]}, {"theme": "Income and education gradient", "insights": [{"claim": "The gasoline-to-inflation expectations pass-through is more than three times larger for households earning under $50,000 a year (0.38 percentage point per 10 point revision) than for those earning over $100,000 (0.12 percentage point), with the middle income group at 0.24 percentage point.", "speaker": "Taerin Kim", "type": "data_point", "entities": ["lower-income households", "gasoline", "inflation expectations"], "conviction": "high", "so_what": "Energy shocks hit expectations hardest exactly where balance sheets are thinnest — a leading indicator for discretionary spending pullback and low-income consumer credit stress when pump prices climb.", "quote": "The relationship is therefore more than three times larger for households in the lowest income group than for those in the highest income group.", "locator": "Figure 3 shows that responses to higher expected gas price growth", "quote_verified": true}, {"claim": "The education gradient runs the same direction but is flatter: 0.32 percentage point for high school graduates, 0.26 for some college, and 0.21 for college graduates per 10 percentage point upward revision in expected gasoline price growth.", "speaker": "Taerin Kim", "type": "data_point", "entities": ["high school graduates", "college graduates", "inflation expectations", "gasoline"], "conviction": "high", "so_what": "Income, not schooling, is the sharper sorting variable for expectations sensitivity, pointing at budget-share exposure rather than financial literacy as the operative mechanism.", "quote": null, "locator": "We also find a similar, though less pronounced, pattern by education", "quote_verified": false}, {"claim": "The proposed mechanism for the income gradient is budget share: gasoline takes up a larger fraction of lower-income households' total spending, is harder to absorb without cutting other expenses, and therefore acts as a stronger signal about their overall cost of living.", "speaker": "Taerin Kim", "type": "causal", "entities": ["lower-income households", "gasoline", "cost of living"], "conviction": "medium", "so_what": "Implies substitution pressure: when gas expectations rise, the low-income cohort is the one that reallocates spending away from discretionary categories first.", "quote": "higher gas prices may be harder for these households to absorb without cutting back on other expenses", "locator": "Household differences in how beliefs move together", "quote_verified": true}, {"claim": "The asymmetry holds universally across the income distribution — downward revisions to expected gasoline price growth produce no statistically meaningful decline in inflation expectations for any income group, not just for vulnerable households.", "speaker": "Taerin Kim", "type": "data_point", "entities": ["inflation expectations", "gasoline", "household income groups"], "conviction": "high", "so_what": "The ratchet is a general feature of household belief formation, so falling energy prices cannot be counted on to pull aggregate expectations back down at any income tier.", "quote": "downward revisions to expected gas price growth are not associated with statistically meaningful declines in inflation expectations for any income group", "locator": "Although the comovement remains modest in absolute terms", "quote_verified": true}]}, {"theme": "Within-person panel identification", "insights": [{"claim": "The findings rest on the New York Fed's Survey of Consumer Expectations, monthly from June 2013 through June 2025, restricted to respondents with at least eight consecutive months of participation — a filter that retains about 70% of respondent-month observations.", "speaker": "Taerin Kim", "type": "data_point", "entities": ["New York Fed Survey of Consumer Expectations", "Federal Reserve Bank of San Francisco"], "conviction": "high", "so_what": "A 12-year panel with high retention means the asymmetry is a structural regularity across multiple energy cycles, not an artifact of the 2022 or 2026 episodes.", "quote": null, "locator": "The data cover monthly surveys from June 2013", "quote_verified": false}, {"claim": "The regression compares each respondent with themselves over time via individual baselines, so persistent cross-person differences — such as people who chronically report higher inflation — cannot drive the estimated comovement.", "speaker": "Taerin Kim", "type": "framework", "entities": ["regression analysis", "Survey of Consumer Expectations"], "conviction": "high", "so_what": "The within-person design is why this evidence is stronger than aggregate survey correlations, which conflate common news shocks and shifting respondent composition.", "quote": "we measure the relationship by comparing each person with themselves over time, rather than comparing people with one another", "locator": "We then use a statistical method known as regression", "quote_verified": true}, {"claim": "Movements in aggregate survey averages are explicitly rejected as evidence that any individual's gas and inflation beliefs move together, since averages can comove because of common economic news or changes in the mix of survey respondents.", "speaker": "Taerin Kim", "type": "framework", "entities": ["survey averages", "inflation expectations"], "conviction": "high", "so_what": "A methodological warning for anyone reading headline University of Michigan or SCE aggregates as proof of energy pass-through — composition effects can manufacture the correlation.", "quote": null, "locator": "This analysis requires a survey that follows the same respondents", "quote_verified": false}, {"claim": "The observational panel results align with prior experimental evidence from Aidala et al. (2024) on gasoline price changes and consumer inflation expectations, and extend an earlier SF Fed line of work by Glick et al. (2021) on commodity surges and household inflation expectations.", "speaker": "Taerin Kim", "type": "thesis", "entities": ["Aidala et al. 2024", "Glick et al. 2021", "FRBSF Economic Letter"], "conviction": "medium", "so_what": "Convergence of experimental and observational methods raises confidence that the asymmetry is causal, making it a durable input to inflation-expectations models rather than a one-off correlation.", "quote": null, "locator": "These results are consistent with experimental evidence", "quote_verified": false}]}], "insight_total": 19, "top_entities": ["gasoline", "inflation expectations", "New York Fed Survey of Consumer Expectations", "Federal Reserve Bank of San Francisco", "Strait of Hormuz", "Iran", "Russia", "Ukraine", "lower-income households", "inflation uncertainty", "oil", "United States"], "source_meta": {"author": "Taerin Kim", "word_count": 2171, "paywalled": false}}, {"record_id": "6ced63a41c667d24", "source_type": "concepts", "source_name": "St. Louis Fed — FRED Blog", "source_url": "https://fredblog.stlouisfed.org/2026/08/is-this-a-good-time-to-rent/", "title": "Is this a good time to rent?", "published_date": "", "language": "en", "processed_at": "2026-09-01T13:50:38Z", "processor": "claude-code-sub-opus", "tags": ["Macro", "Society"], "gist": "A FRED-built ratio of the FHFA All-Transactions House Price Index to the BLS CPI for rent of primary residence (both rebased to 100 in January 2015, tracked from 1975Q1 to 2026Q1) sits near historical peaks, implying US homeownership is unusually expensive relative to renting. Citing Dallas Fed research, the post argues the normalization comes through inflation — rents track inflation while nominal house prices lag, so real house prices fall sharply while real rents barely move.", "themes": [{"theme": "Own-vs-rent ratio at a historical extreme", "insights": [{"claim": "The US ratio of house prices to rents remains near historical peaks as of first quarter 2026, making renting the relatively better financial choice for housing on a cost basis.", "speaker": "St. Louis Fed — FRED Blog", "type": "thesis", "entities": ["US housing market", "FRED", "house prices", "rents"], "conviction": "high", "so_what": "A Fed-published affordability read that favors renting supports sustained rental demand and caps the marginal owner-occupier bid — watch residential rental operators versus for-sale homebuilder volumes.", "quote": "The most recent measure of the cost of owning a home (vs. renting a home) remains near historical peaks, suggesting renting today is a relatively better financial choice for housing.", "locator": "The takeaway", "quote_verified": true}, {"claim": "Homeownership costs relative to rents rose rapidly in 2020 and have stayed at high values ever since, per Dallas Fed index work replicated in FRED.", "speaker": "St. Louis Fed — FRED Blog", "type": "data_point", "entities": ["Dallas Fed", "FRED", "US housing market"], "conviction": "high", "so_what": "The dislocation is a discrete 2020 regime break that has not mean-reverted in roughly six years — a stretched spring, not a slow drift, and therefore a mean-reversion setup with unclear timing.", "quote": "the rapid rise of homeownership costs in 2020 and the high values since then", "locator": "Researchers at the Dallas Fed used price index data", "quote_verified": true}, {"claim": "The cost of owning a home and the cost of renting a home historically tend to move together, which makes the current wide gap the anomaly rather than a new baseline.", "speaker": "St. Louis Fed — FRED Blog", "type": "framework", "entities": ["house prices", "rents", "FRED"], "conviction": "medium", "so_what": "If the two series are cointegrated over history, the current spread is a tradable convergence thesis rather than a permanent structural shift in housing.", "quote": null, "locator": "Which is the better financial choice—owning or renting", "quote_verified": false}]}, {"theme": "The price-to-rent ratio as a decision rule", "insights": [{"claim": "An indexed ratio of house prices to rents is a reusable rule for the buy-versus-rent decision: a high ratio means house prices are outgrowing rents and ownership is relatively expensive, while a low ratio means buying is comparatively the better deal.", "speaker": "St. Louis Fed — FRED Blog", "type": "framework", "entities": ["house prices", "rents", "FRED"], "conviction": "high", "so_what": "A single public, free, quarterly-updating series can be used as a housing valuation gauge — treat extremes in it the way you would treat extremes in an equity earnings yield.", "quote": "A high ratio means house prices are growing faster than rents, making homeownership a relatively more expensive proposition. A lower ratio means buying a home is a comparatively better deal.", "locator": "A high ratio means house prices are growing", "quote_verified": true}, {"claim": "The ratio has exactly two paths back toward its historical average — the numerator (house prices) falls or the denominator (rent prices) rises — so a high reading does not by itself forecast a nominal house price crash.", "speaker": "St. Louis Fed — FRED Blog", "type": "framework", "entities": ["house prices", "rents"], "conviction": "high", "so_what": "Bears calling for a nominal housing collapse from this ratio are ignoring the rent-side adjustment channel; position for a grind, not a bust.", "quote": "The ratio will become smaller if the numerator falls or the denominator rises.", "locator": "In this homeownership costs ratio, the numerator", "quote_verified": true}]}, {"theme": "Reproducible FRED construction", "insights": [{"claim": "The own-vs-rent cost gauge can be rebuilt from two free public series — the Federal Housing Finance Agency's All-Transactions House Price Index divided by the Bureau of Labor Statistics CPI for rent of primary residence — with both indexes re-based to 100 in January 2015.", "speaker": "St. Louis Fed — FRED Blog", "type": "data_point", "entities": ["Federal Housing Finance Agency", "Bureau of Labor Statistics", "FRED", "All-Transactions House Price Index", "CPI"], "conviction": "high", "so_what": "No vendor data required — this is a zero-cost, auditable housing valuation indicator any allocator can refresh and backtest in-house.", "quote": null, "locator": "Here we use two different price indexes", "quote_verified": false}, {"claim": "The FRED-constructed series spans first quarter 1975 through first quarter 2026, giving roughly five decades of history against which to judge whether a current reading is extreme.", "speaker": "St. Louis Fed — FRED Blog", "type": "data_point", "entities": ["FRED", "US housing market"], "conviction": "high", "so_what": "A 51-year sample covers multiple rate and inflation regimes, so percentile ranking of today's reading against it is a defensible valuation anchor.", "quote": "from first quarter 1975 to first quarter 2026", "locator": "Our FRED graph above allows us to approximate", "quote_verified": true}, {"claim": "An independently constructed ratio using FHFA and BLS indexes reproduces the shape of the Dallas Fed's proprietary index result, indicating the elevated ownership-cost signal is robust to index choice rather than an artifact of one methodology.", "speaker": "St. Louis Fed — FRED Blog", "type": "causal", "entities": ["Dallas Fed", "Federal Housing Finance Agency", "Bureau of Labor Statistics", "FRED"], "conviction": "medium", "so_what": "Robustness across two independent index constructions raises confidence enough to size a position on the housing valuation view.", "quote": "Our index shows a rapid rise and continued high values of homeownership cost, similar to what the Dallas Fed research showed.", "locator": "Our index shows a rapid rise", "quote_verified": true}]}, {"theme": "Inflation as the mean-reversion mechanism", "insights": [{"claim": "Higher inflation mechanically pushes the house-price-to-rent ratio down toward its historical average because inflation raises rent prices relatively more than it raises house prices.", "speaker": "St. Louis Fed — FRED Blog", "type": "causal", "entities": ["inflation", "rents", "house prices"], "conviction": "high", "so_what": "Inflation is bullish for rental cash flows and bearish for real home equity — a reason to prefer rent-collecting assets over owner-occupied housing exposure in a sticky-inflation regime.", "quote": "Because inflation increases rent prices relatively more than house prices, higher inflation would drive the ratio down, closer to its historical average.", "locator": "In this homeownership costs ratio, the numerator", "quote_verified": true}, {"claim": "Dallas Fed research concludes that nominal house-price growth trails inflation while rents keep pace, so in real terms rents change very little but house prices fall sharply.", "speaker": "St. Louis Fed — FRED Blog", "type": "prediction", "entities": ["Dallas Fed", "inflation", "house prices", "rents"], "conviction": "high", "so_what": "The expected correction is a real-terms erosion of home values, invisible in nominal price headlines — hedge housing exposure on a real, not nominal, basis.", "quote": "Rents rise along with inflation, while nominal house-price growth trails inflation. On an inflation-adjusted basis, rents change very little, but house prices fall sharply.", "locator": "Deeper analysis", "quote_verified": true}, {"claim": "The Dallas Fed report draws on both US and international data to identify the pattern and likely future evolution of an elevated house price-to-rent ratio, implying the dynamic is not US-specific.", "speaker": "St. Louis Fed — FRED Blog", "type": "thesis", "entities": ["Dallas Fed", "US housing market", "house prices", "rents"], "conviction": "medium", "so_what": "If the mean-reversion pattern is cross-country, the same rent-vs-own valuation screen can be applied to other developed housing markets and their listed landlords.", "quote": "uses both U.S. and international data to identify patterns and the likely future evolution of an elevated house price-to-rent ratio", "locator": "The report from the Dallas Fed uses", "quote_verified": true}, {"claim": "A Federal Reserve regional bank publication is willing to state that renting is currently the relatively better financial choice, an implicit challenge to the default assumption that buying a home is always the superior long-run financial decision.", "speaker": "St. Louis Fed — FRED Blog", "type": "contrarian", "entities": ["St. Louis Fed — FRED Blog", "US housing market", "Dallas Fed"], "conviction": "medium", "so_what": "Official-sector framing that normalizes renting can shift household tenure preference at the margin, a slow tailwind for rental housing demand and a headwind for first-time buyer formation.", "quote": null, "locator": "The takeaway", "quote_verified": false}]}], "insight_total": 12, "top_entities": ["FRED", "Dallas Fed", "Federal Housing Finance Agency", "Bureau of Labor Statistics", "All-Transactions House Price Index", "CPI", "US housing market", "house prices", "rents", "inflation", "St. Louis Fed — FRED Blog"], "source_meta": {"author": "", "word_count": 427, "paywalled": false}}, {"record_id": "77839417e3092462", "source_type": "concepts", "source_name": "World Economic Forum", "source_url": "https://www.weforum.org/podcasts/meet-the-leader/episodes/ravi-kumar-cognizant-future-technology/", "title": "Upskilling, tapping human talents, and what's needed for the future of work: Cognizant CEO Ravi Kumar", "published_date": "2026-08-31", "language": "en", "processed_at": "2026-09-01T13:51:12Z", "processor": "claude-code-sub-opus", "tags": ["AI", "Tech", "Macro", "Society", "Energy", "Geopolitics"], "gist": "Cognizant CEO Ravi Kumar, drawing on a Cognizant/Oxford Economics study of 2,000 businesses covering 22,000 tasks across 1,000 US occupations, argues generative AI is the first tech disruption that helps the bottom half of the workforce more than the top (37% vs 17% productivity gains), breaking two decades of flat productivity via a sharper S-curve with 'slow takeoff, short runway'. He claims it dissolves the Industrial Revolution work template, shifts prized cognitive diversity from STEM toward liberal arts and human sciences, and makes compute/energy supply plus explainability the binding constraints.", "themes": [{"theme": "Task-level exposure mapping", "insights": [{"claim": "Cognizant commissioned Oxford Economics to survey 2,000 businesses and map 22,000 tasks across roughly 1,000 US occupations, scoring each task for generative-AI 'exposure' and for 'friction' (the cost of bridging to the new task set) on a horizon running to 2032.", "speaker": "World Economic Forum", "type": "data_point", "entities": ["Cognizant", "Oxford Economics", "Ravi Kumar", "generative AI", "IT services"], "conviction": "high", "so_what": "Task-level exposure/friction datasets are the emerging unit of analysis for AI labour-displacement models; IT services firms that own this data can sell reskilling and transformation mandates rather than just headcou // ---------- helpers ----------
// YouTube-aligned hex colors for tinted insight chips (bg = color+"1a", text = color, border = color+"55").
const TYPE_HEX = {
  thesis: '#6366f1', prediction: '#0ea5e9', framework: '#8b5cf6',
  data_point: '#059669', causal: '#d97706', contrarian: '#dc2626',
  anecdote: '#64748b',
};
const CONV_HEX = { high: '#16a34a', medium: '#ca8a04', low: '#94a3b8', exploratory: '#94a3b8' };
function typeHex(t) { return TYPE_HEX[String(t || '').toLowerCase()] || '#475569'; }
function convHex(c) { return CONV_HEX[String(c || '').toLowerCase()] || '#64748b'; }

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }

// Tinted chip (YouTube style): faint bg, colored text + border.
function tintChip(text, color) {
  return `<span class="chip" style="background:${color}1a;color:${color};border-color:${color}55">${escapeHtml(text)}</span>`;
}
function tagPills(tags) {
  if (!tags || !tags.length) return '';
  return tags.map(t => `<span class="pill tag">${escapeHtml(t)}</span>`).join(' ');
}

// ---------- rendering ----------
// Insight presentation ported from the YouTube digest: type/conviction tinted
// chips, speaker as a 🗣 chip, and entities as indigo chips — all in the meta row
// directly under the claim. Quote treatment is INTENTIONALLY kept as Concepts'
// verbatim + "✓ verified" (stronger than YouTube's ≈ paraphrase wording).
function renderInsight(ins) {
  if (!ins) return '';
  const cls = 'insight' + (ins.type ? (' ' + String(ins.type).toLowerCase()) : '');
  const meta = [];
  if (ins.type) meta.push(tintChip(ins.type, typeHex(ins.type)));
  if (ins.speaker) meta.push(`<span class="chip chip-spk">🗣 ${escapeHtml(ins.speaker)}</span>`);
  if (ins.conviction) meta.push(tintChip('conviction: ' + ins.conviction, convHex(ins.conviction)));
  (ins.entities || []).slice(0, 12).forEach(e => {
    if (e) meta.push(`<span class="chip chip-ent">${escapeHtml(e)}</span>`);
  });
  let quote = '';
  if (ins.quote) {
    const v = ins.quote_verified
      ? `<span class="vmark">✓ verified</span>`
      : `<span class="vmark no">unverified</span>`;
    quote = `<div class="quote">“${escapeHtml(ins.quote)}”${v}</div>`;
  }
  const so = ins.so_what
    ? `<div class="insight-so"><span class="lbl">so what</span>${escapeHtml(ins.so_what)}</div>` : '';
  return `
    <div class="${cls}">
      <div class="insight-claim">${escapeHtml(ins.claim || '')}</div>
      <div class="insight-meta">${meta.join('')}</div>
      ${so}
      ${quote}
    </div>`;
}

function renderTheme(theme) {
  const insights = (theme.insights || []).map(renderInsight).join('');
  return `
    <div class="theme">
      <div class="theme-title">${escapeHtml(theme.theme || 'Theme')}</div>
      ${insights}
    </div>`;
}

function renderCard(card) {
  if (!card) return '';
  const meta = card.source_meta || {};
  const nameHtml = card.source_url
    ? `<a class="source-name" href="${escapeAttr(card.source_url)}" target="_blank" rel="noopener">${escapeHtml(card.source_name || '')}</a>`
    : `<span class="source-name">${escapeHtml(card.source_name || '')}</span>`;
  const subBits = [];
  if (card.published_date) subBits.push(escapeHtml(card.published_date));
  if (meta.author) subBits.push(escapeHtml(meta.author));
  if (meta.word_count) subBits.push(`${meta.word_count} words`);
  if (meta.paywalled) subBits.push('paywalled');
  const themes = (card.themes || []).map(renderTheme).join('');
  const n = card.insight_total != null ? card.insight_total
            : (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
  return `
    <div class="source">
      <div class="source-head" onclick="toggleSource(this)">
        <div class="source-meta-left">
          <div class="source-name-row">${nameHtml}</div>
          <div class="source-title">${escapeHtml(card.title || '')}</div>
          <div class="source-sub">${subBits.join('  ·  ')}</div>
        </div>
        <span class="source-count">${n} insight${n === 1 ? '' : 's'}</span>
        <span class="source-arrow">▸</span>
      </div>
      <div class="source-body">
        ${card.gist ? `<div class="gist">${escapeHtml(card.gist)}</div>` : ''}
        ${card.tags && card.tags.length ? `<div class="tags">${tagPills(card.tags)}</div>` : ''}
        ${themes || '<div class="empty">No insights.</div>'}
      </div>
    </div>`;
}

function renderTopStats(d) {
  const s = d.stats || {};
  const parts = [];
  if (d.date) parts.push(`date <strong>${escapeHtml(d.date)}</strong>`);
  if (s.lookback_days != null) parts.push(`lookback <strong>${s.lookback_days}d</strong>`);
  if (s.sources != null) parts.push(`sources <strong>${s.sources}</strong>`);
  if (s.cards != null) parts.push(`cards <strong>${s.cards}</strong>`);
  if (s.insights != null) parts.push(`insights <strong>${s.insights}</strong>`);
  if (s.quote_verified_pct != null) parts.push(`quotes verified <strong>${s.quote_verified_pct}%</strong>`);
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSource(headEl) { headEl.parentElement.classList.toggle('open'); }

function insightCount(card) {
  return (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
}

// Build the sort/filter control bar (display only — re-groups REPORT_DATA in place).
function buildControls(d) {
  const cards = d.cards || [];
  const names = [...new Set(cards.map(c => c.source_name || '—'))].sort((a, b) => a.localeCompare(b));
  const opts = names.map(n => `<option value="${escapeAttr(n)}">${escapeHtml(n)}</option>`).join('');
  document.getElementById('controls').innerHTML =
    `<label>Sort
       <select id="sortSel">
         <option value="source">Source A–Z</option>
         <option value="insights">Insight count ▼</option>
       </select></label>
     <label>Source
       <select id="srcSel">
         <option value="__all">All sources (${names.length})</option>
         ${opts}
       </select></label>
     <span class="ctl-btns">
       <button type="button" id="expandAll">Expand all</button>
       <button type="button" id="collapseAll">Collapse all</button>
     </span>`;
  document.getElementById('sortSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('srcSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('expandAll').addEventListener('click', () => setAllGroups(false));
  document.getElementById('collapseAll').addEventListener('click', () => setAllGroups(true));
}

// Group-level collapse: header click toggles one group; the control-bar buttons toggle all.
function toggleGroup(headEl) { headEl.parentElement.classList.toggle('collapsed'); }
function setAllGroups(collapsed) {
  document.querySelectorAll('.group').forEach(g => g.classList.toggle('collapsed', collapsed));
}

// Group cards by source, sort groups (and cards within), optionally filter to one source.
function renderGroups(d) {
  const sortMode = (document.getElementById('sortSel') || {}).value || 'source';
  const srcFilter = (document.getElementById('srcSel') || {}).value || '__all';
  let cards = (d.cards || []).slice();
  if (srcFilter !== '__all') cards = cards.filter(c => (c.source_name || '—') === srcFilter);

  const groups = new Map();
  cards.forEach(c => {
    const k = c.source_name || '—';
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(c);
  });
  let entries = [...groups.entries()].map(([name, cs]) => ({
    name, cards: cs, insights: cs.reduce((a, c) => a + insightCount(c), 0),
  }));
  if (sortMode === 'insights') entries.sort((a, b) => b.insights - a.insights || a.name.localeCompare(b.name));
  else entries.sort((a, b) => a.name.localeCompare(b.name));
  // Within each source group, heaviest cards first.
  entries.forEach(e => e.cards.sort((a, b) => insightCount(b) - insightCount(a)));

  const html = entries.map(e => {
    const head = `<div class="group-head" onclick="toggleGroup(this)">`
      + `<span class="group-name">${escapeHtml(e.name)}</span>`
      + `<span class="group-meta">${e.cards.length} card${e.cards.length === 1 ? '' : 's'} · ${e.insights} insights</span>`
      + `<span class="group-arrow">▾</span></div>`;
    return `<div class="group">${head}<div class="group-body">${e.cards.map(renderCard).join('')}</div></div>`;
  }).join('');

  const app = document.getElementById('app');
  app.innerHTML = html || '<div class="empty">No cards for this source.</div>';
  // Open the first two source cards by default.
  document.querySelectorAll('.source').forEach((sec, i) => { if (i < 2) sec.classList.add('open'); });
}

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  document.getElementById('stats-top').innerHTML = renderTopStats(d);
  buildControls(d);
  renderGroups(d);   // default: grouped, sorted by source A–Z
}

renderReport(REPORT_DATA);
</script>
</body>
</html>
