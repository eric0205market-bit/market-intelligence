<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>Institutional Research</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root {
  --bg: #faf8f5;
  --surface: #ffffff;
  --border: #e8e3da;
  --border-light: #f0ede4;
  --text: #1a1a1a;
  --text-2: #555;
  --text-3: #8a8a8a;
  --accent: #7c3aed;          /* purple — institutional report accent */
  --accent-soft: #f3eefc;
  --divergence: #d94052;      /* divergence red */
  --consensus: #15803d;       /* consensus green */
  --yellow: #fff5b3;

  /* category colors (institutional schema: rates, growth, fx, equities,
     credit, crypto, energy, commodities, geopolitics, ai_tech, em) */
  --cat-rates: #2563eb;
  --cat-growth: #d97706;
  --cat-fx: #0891b2;
  --cat-equities: #15803d;
  --cat-credit: #be185d;
  --cat-crypto: #8b5cf6;
  --cat-energy: #dc2626;
  --cat-commodities: #ea580c;
  --cat-geopolitics: #b91c1c;
  --cat-ai_tech: #4f46e5;
  --cat-em: #059669;
  --cat-default: #6b7280;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; line-height: 1.55;
       background: var(--bg); color: var(--text); }
.container { max-width: 980px; margin: 0 auto; padding: 24px 16px 80px; }

/* HEADER */
.header { display: flex; justify-content: space-between; align-items: baseline;
          border-bottom: 2px solid var(--text); padding-bottom: 12px; margin-bottom: 12px; }
.title { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
.subtitle { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-3); }

/* STATS BAR (top: period + coverage) */
.stats-top { margin-bottom: 16px; padding: 8px 12px; background: var(--surface);
             border: 1px solid var(--border); border-radius: 6px;
             font-family: 'IBM Plex Mono', monospace; font-size: 11.5px;
             color: var(--text-2); display: flex; gap: 16px; flex-wrap: wrap; }
.stats-top strong { color: var(--text); font-weight: 600; }

/* SUMMARY */
.summary { background: var(--surface); border: 1px solid var(--border);
           border-left: 4px solid var(--accent); border-radius: 6px;
           padding: 16px 18px; margin-bottom: 20px; }
.summary p { margin-bottom: 10px; }
.summary p:last-child { margin-bottom: 0; }
.summary strong { font-weight: 600; }

/* SECTIONS */
.section { background: var(--surface); border: 1px solid var(--border);
           border-radius: 6px; margin-bottom: 14px; overflow: hidden; }
.section-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px;
                background: #f3efe6; cursor: pointer; user-select: none;
                font-weight: 600; font-size: 13px; }
.section-head:hover { background: #ebe6dc; }
.section-letter { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
                  color: var(--text-3); min-width: 18px; }
.section-name { flex: 1; }
.section-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
                 color: var(--text-3); }
.section-arrow { font-size: 10px; color: var(--text-3); transition: transform .2s; }
.section.open .section-arrow { transform: rotate(90deg); }
.section-body { display: none; padding: 6px 0; }
.section.open .section-body { display: block; }

/* THEME CARD (Section A) */
.theme { padding: 14px 16px; border-bottom: 1px solid var(--border-light); }
.theme:last-child { border-bottom: none; }
.theme-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
              flex-wrap: wrap; }
.theme-title { font-weight: 600; font-size: 14.5px; }
.theme-stance { display: grid; grid-template-columns: 1fr; gap: 6px; margin-bottom: 10px; }
@media (min-width: 720px) { .theme-stance { grid-template-columns: 1fr 1fr; } }
.theme-line { font-size: 13px; padding: 8px 10px; border-radius: 4px;
              border-left: 3px solid var(--border); background: #fafafa; line-height: 1.5; }
.theme-line.consensus { border-left-color: var(--consensus); background: #f0f9f3; }
.theme-line.divergence { border-left-color: var(--divergence); background: #fdf6f7; }
.theme-line .lbl { font-family: 'IBM Plex Mono', monospace; font-size: 10px;
                   text-transform: uppercase; letter-spacing: .06em;
                   color: var(--text-3); display: block; margin-bottom: 2px; }
.theme-items { display: flex; flex-direction: column; gap: 8px; padding-left: 10px;
               border-left: 2px solid var(--border-light); }
.theme-item { font-size: 13px; padding: 6px 8px; border-radius: 4px; }

/* ITEM CARDS (Sections B/C/D) */
.item-card { background: var(--surface); border: 1px solid var(--border);
             border-radius: 6px; padding: 12px 14px; margin: 10px 16px; }
.item-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
             flex-wrap: wrap; }
.item-source { font-weight: 600; color: var(--accent); }
a.item-source { text-decoration: none; }
a.item-source:hover { text-decoration: underline; }
.item-link { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--accent); text-decoration: none; }
.item-link:hover { text-decoration: underline; }
.item-title { font-weight: 600; font-size: 14px; margin: 4px 0 6px; }
.item-text { font-size: 13.5px; line-height: 1.6; color: var(--text);
             white-space: pre-wrap; word-wrap: break-word; }

/* DEEP READS (Section C) — purple left border to mark flagship long-form */
.section-deepreads .item-card { border-left: 4px solid var(--accent); background: var(--accent-soft); }

/* HOUSE VIEWS — compact one-line-per-source list */
.hv-row { display: flex; gap: 10px; align-items: baseline;
          padding: 6px 16px; border-bottom: 1px solid var(--border-light);
          font-size: 13px; }
.hv-row:last-child { border-bottom: none; }
.hv-name { font-weight: 600; color: var(--accent); min-width: 180px;
           text-decoration: none; }
.hv-name:hover { text-decoration: underline; }
.hv-stance { color: var(--text); flex: 1; }

/* CATEGORY PILLS */
.pill { display: inline-block; font-family: 'IBM Plex Mono', monospace; font-size: 10px;
        font-weight: 500; padding: 2px 7px; border-radius: 3px; color: #fff;
        text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }

/* IMAGES */
.thumbs { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.thumb { height: 110px; border: 1px solid var(--border); border-radius: 4px;
         cursor: zoom-in; background: #f0ede4; }

/* LIGHTBOX */
.lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85);
            align-items: center; justify-content: center; z-index: 100; cursor: zoom-out; }
.lightbox.open { display: flex; }
.lightbox img { max-width: 92vw; max-height: 92vh;
                box-shadow: 0 8px 40px rgba(0,0,0,.6); }

/* EMPTY */
.empty { color: var(--text-3); font-size: 13px; padding: 14px 18px; font-style: italic; }

/* RESPONSIVE */
@media (max-width: 640px) {
  .container { padding: 16px 12px 60px; }
  .item-card { margin: 8px 10px; }
  .hv-row { flex-direction: column; gap: 2px; }
  .hv-name { min-width: 0; }
  .header { flex-direction: column; align-items: flex-start; gap: 4px; }
}
</style>
</head>

<script>
const REPORT_DATA = {"report_type": "INSTITUTIONAL RESEARCH", "collected_at": "2026-10-11T02:01:54.000Z", "period": {"lookback_days": 10, "from": "2026-10-01", "to": "2026-10-11"}, "input_stats": {"total_articles": 414, "sources_present": 52, "after_filter": 170}, "summary": "**Rates / Fed:** Everyone agrees the bond selloff is the market's main story — **10y UST ~5.24–5.36%, 30y ~5.7%**, highest since 2002 — after the Fed's **September 25bp hike**. Sharpest split is on what is priced (~3–4 more hikes): **Goldman** (Hatzius, one more hike in **December**, 'one-and-done' possible) and **UBS** call that too aggressive, while **BNY** shows history pointing to **+43bp more on the 10y** and **BCA** says the selloff 'is not over'.\n\n**Bonds — buy or avoid?:** **Gavekal's Kaletsky** says 'start buying bonds' against house colleagues (Charles, Will) who stay bearish/neutral; **PIMCO** and **Amundi** like elevated yields (Amundi: higher-quality, peripherals over core in EMU), **BCA** wants **Bunds/peripherals hedged** but avoids **USTs and French OATs**, and **Goldman** prefers equities over bonds near-term, bonds on longer horizons.\n\n**France / Europe rates:** OAT-Bund spread hit **150bp (Oct 2)**, ~**139bp** Oct 8, a 2012-type gap. **Gavekal** sees a repricing settling **125–300bp**; **BCA** avoids OATs; **Standard Chartered** calls French risk 'largely contained'. **Oxford Economics** expects **two more ECB hikes**; **BoE** hawks (Mann, Pill) already voted for **Bank Rate 4%**.\n\n**Oil / Iran:** Brent **~$100–105**, WTI ~$90, war in its 8th month with no ceasefire (**BCA** risk score 8). Gulf exports are back near **80–90%+ of pre-war** (PIMCO, UBS, BCA) yet **BCA** argues there's a **floor under Brent**; **Amundi** sees **$80 by early 2027**, **Wood Mackenzie** shows acute product/sour-crude dislocations (**Sverdrup +$24 vs Brent**, medium-sour >$140) and **Oxford** says diesel has **doubled**.\n\n**US Equities / AI:** Consensus is constructive on earnings (UBS S&P EPS **+25%** in 2026; StanChart Q3 EPS **+31%**, tech **+67%**) but breadth is thin (**29%** above 50dma, CoinShares). **UBS/Franklin** say stay invested; **Standard Chartered** is trimming semis/Taiwan and its stock-bond model turned **negative**; **Goldman's** HF desk reports L/S positioning at **historic lows**; Nasdaq **-1.25%** on OpenAI revenue-run-rate reports.\n\n**Growth / Inflation:** Growth resilient (PIIE: global **3.2% / 3.1%** 2026/27; US **2.3% / 2.2%**; PIMCO's 'three buffers'). Inflation read differs: **UBS** sees 3m core PCE at **2.05%** and more disinflation, while **Gavekal/Oxford/BoE** stress energy second-round risk; September payrolls undershot (**BNP**: private +46k).\n\n**Credit:** **PIMCO**: IG spreads **flat vs February** despite the shock. **BNP AM**: HY OAS jumped **267→318bp** but is 'hard to square' with US fundamentals; **Oxford** flags private credit as a key vulnerability; **KKR** insurers: **91%** keep/raise credit exposure.\n\n**Crypto:** BTC ~**$83k**; flows cooled after **$11.1B** inflows since mid-July (**CoinShares**), who frame BTC as a fiscal-sustainability hedge; **Galaxy** sees the 10/10 crash as a 'blip' and debates AI-vs-cryptography risk; **DPRK** theft passes **$1B** in 2026 (Chainalysis).", "sections": {"A_debates": [{"theme": "Rates & Central Banks", "category": ["rates"], "consensus": "The street agrees the Fed has entered a (mild) hiking cycle after the September 25bp hike and that long-end yields are being driven by energy prices, heavy sovereign and AI-related debt supply and weak long-end demand: 10y UST touched 5.34–5.36% intraday (UBS), 30y ~5.7% (Goldman, CoinShares). Central banks elsewhere lean hawkish too — BoE MPC members Pill and Mann voted to lift Bank Rate to 4%, Lombardelli says policy is 'already leaning against' persistence and will tighten further if needed, and Oxford expects two more ECB hikes. Near-term, markets cut October-hike odds (CoinShares: ~75%→23% after soft September payrolls), and the Fed minutes still signalled support for another hike before year-end.", "divergence": "On the path: Goldman's Hatzius expects one more hike in December (pushed back from October) and says the ~3 hikes still priced are 'not necessary', with one-and-done possible; UBS agrees that ~4 further 25bp hikes by end-2027 is too aggressive given 3m-annualised core PCE of 2.05%; Amundi expects a mild, not prolonged, tightening. Against that, BNY argues risks are skewed to higher yields — in the last seven cycles the 10y rose an average 43bp in the six months after the first hike — with real yields (10y 2.90%, highest since 2008) doing the work while breakevens sit at ~2.35%; Oxford Economics raised its rate forecasts on a higher neutral rate; Deutsche Bank Wealth says 'higher for longer is the name of the game'; Goldman's rates desk (Qubbaj) says a second hike in October or December is 'a timing debate, not an existence debate'. At the BoE, Mann argues the stance is 'not sufficiently tight' and wants follow-through, while Pill stresses Knightian uncertainty and warns against conditioning policy on noisy energy-price moves.", "items": [{"source": "goldman_sachs", "name": "Goldman Sachs", "thesis": "Hatzius (CNBC, Oct 2): best guess is a December hike after pushing the next/final move back from October following soft core PCE and Williams/Jefferson comments; markets' ~3 hikes unnecessary; one-and-done possible; the October CPI is the key release.", "url": "https://www.goldmansachs.com/insights/videos/cnbc-jan-hatzius-outlook-for-us-economy", "images": []}, {"source": "goldman_sachs", "name": "Goldman Sachs", "thesis": "Qubbaj (rates S&T): 30y UST ~5.7%, highest since 2002; FOMC coalesced around two hikes this year; energy prices are the key driver of long rates; investors reluctant to add duration amid heavy issuance; German and Japanese yields rising for the same three reasons.", "url": "https://www.goldmansachs.com/insights/articles/will-30-year-us-treasury-yields-climb-higher", "images": []}, {"source": "ubs", "name": "UBS CIO", "thesis": "UBS: 10y hit 5.3% (first since 2007) after seven straight selloff sessions; ~4 more hikes priced through end-2027 judged too aggressive; core PCE 3m annualised 2.05%, lowest since Jul 2024.", "url": "https://www.ubs.com/global/en/wealthmanagement/insights/chief-investment-office/house-view/daily/2026/latest-01102026.html", "images": []}, {"source": "bny", "name": "BNY Investments", "thesis": "BNY: 10y ~5.30%; 4 more hikes priced through 2027; 10y real 2.90% (highest since 2008), breakeven ~2.35%; history says yields rise a further ~43bp on average in 6 months after the first hike; rate-sensitive equity sectors starting to feel it.", "url": "https://www.bny.com/investments/us/en/individual/articles/markets-and-economy/treasury-yields-push-to-multi-decade-highs--and-history-says-the.html", "images": []}, {"source": "oxford_economics", "name": "Oxford Economics", "thesis": "Oxford Economics raises its rate forecasts: more hawkish Fed, higher neutral rate, elevated inflation risk, heavy sovereign + AI-led corporate supply and weaker auction demand; AI buildout offsets for now; stock market, private credit and small business are the key vulnerabilities.", "url": "https://www.oxfordeconomics.com/resource/a-hawkish-us-fed-and-heavy-debt-supply-raise-the-rates-bar/", "images": []}, {"source": "boe", "name": "Bank of England", "thesis": "BoE's Mann: UK financial conditions price greater risk premia since the Middle East conflict; stance 'not sufficiently tight' — voted for +25bp at the last two meetings and wants Bank Rate follow-through.", "url": "https://www.bankofengland.co.uk/speech/2026/october/catherine-mann-nomura-investor-conference", "images": []}, {"source": "boe", "name": "Bank of England", "thesis": "BoE's Lombardelli: framework of four channels (direct, indirect, second-round, demand); direct effects look through, second-round 'too early to tell → tighten'; policy already leaning against persistence and will tighten further if needed.", "url": "https://www.bankofengland.co.uk/speech/2026/september/clare-lombardelli-speech-at-the-sixth-biennial-conference-poland", "images": []}, {"source": "boe", "name": "Bank of England", "thesis": "BoE's Pill (Sept 3): supported Bank Rate at 4%; argues for clear, prompt and decisive action; energy shock carries Knightian uncertainty, so don't condition policy on high-frequency oil moves.", "url": "https://www.bankofengland.co.uk/speech/2026/september/remarks-at-the-edinburgh-chamber-of-commerce", "images": []}, {"source": "deutsche_bank", "name": "Deutsche Bank Wealth", "thesis": "Deutsche Bank Wealth (Oct 5): not a bond 'rout' but a sustained rise; confirms its 'higher for longer' rates view.", "url": "https://wealth.db.com/en/insights/investing-insights/cio-weekly-investment-outlook-podcast.html", "images": []}]}, {"theme": "Bonds: Buy the Dip or Avoid Duration", "category": ["rates", "credit"], "consensus": "Almost everyone concedes that bond yields are now attractive in absolute terms (Amundi: average global government yield ~4%, highest since 2007; Goldman: bonds 'clearly look more attractive on first look'; PIMCO: elevated yields offer income and downside mitigation) and that the Q3 drawdown was brutal (Gavekal: long UST -7.6%, French long bonds ~-15% in USD; BCA/UBS: worst quarter since 2024).", "divergence": "Timing and location differ. Gavekal's Kaletsky says 'yes' to buying bonds after five years of a bear market, explicitly against colleagues Charles (bearish US/UK/France) and Will (neutral at best); Yardeni treats The Economist cover 'Will bonds blow up?' as a contrarian all-clear. BCA says the selloff is not over — avoid USTs and French OATs, favour Bunds and peripherals currency-hedged — while its fixed-income team (Timper) sees a mild hiking cycle as a 'buyable dip' with inflation-linked protection. Goldman's asset allocation head (Mueller-Glissmann) still prefers equities over bonds over the next few months and bonds only for longer horizons since duration may not hedge in risk-off; BNY prefers short-dated/floating-rate credit over duration; Amundi is neutral on US duration (intermediates) but constructive on EMU peripherals with a steepener; PIMCO is constructive on bonds as central-bank credibility improves.", "items": [{"source": "gavekal", "name": "Gavekal Research", "thesis": "Kaletsky (Oct 6): 'Reasons to start buying bonds' — dissents from Gavekal colleagues Charles (bearish US/UK/French bonds) and Will (unattractive/neutral).", "url": "https://research.gavekal.com/teaser/reasons-to-start-buying-bonds/", "images": []}, {"source": "gavekal", "name": "Gavekal Research", "thesis": "Gavekal webinar: Q3 losses of -7.6% for long USTs and almost -15% for equivalent French bonds in USD terms.", "url": "https://research.gavekal.com/teaser/webinar-bond-market-blues/", "images": []}, {"source": "bca_research", "name": "BCA Research", "thesis": "BCA Peloso: global bond selloff not over; USTs and French OATs vulnerable; favour German Bunds and peripherals on a currency-hedged basis.", "url": "https://www.bcaresearch.com/reports/higher-yields-better-bets-09-10-2026/227133", "images": []}, {"source": "bca_research", "name": "BCA Research", "thesis": "BCA Timper (Q4 model bond portfolio): 'a mild hiking cycle offers a buyable dip'; balanced labour markets point to mild tightening; inflation-linked bonds provide protection from energy risk.", "url": "https://www.bcaresearch.com/reports/global-model-bond-portfolio-q426-mild-hiking-cycle-offers-buyable-dip-09-10-2026/227145", "images": []}, {"source": "goldman_sachs", "name": "Goldman Sachs", "thesis": "Goldman Research (Mueller-Glissmann): equities still more attractive than bonds over the next few months; 60/40 offers better risk-reward over longer horizons; long duration may not hedge when investors shun risk.", "url": "https://www.goldmansachs.com/insights/articles/are-bonds-becoming-a-better-investment-for-portfolios", "images": []}, {"source": "amundi", "name": "Amundi", "thesis": "Amundi: neutral US duration (intermediates), constructive EMU duration (peripherals over core, steepening), mild positive UK, Japan moved to neutral; credit mildly constructive, prefers Global IG.", "url": "https://research-center.amundi.com/article/global-investment-views-october-2026", "images": []}, {"source": "bny", "name": "BNY Investments", "thesis": "BNY: for cash holders, prefer short-dated global credit, floating-rate and ABS to capture carry without duration risk.", "url": "https://www.bny.com/investments/us/en/individual/articles/fixed-income/seeking-yield-beyond-duration-resilience-with-duration-risk-mitigation.html", "images": []}, {"source": "yardeni_research", "name": "Yardeni Research", "thesis": "Yardeni: The Economist's Oct 10 cover 'Will bonds blow up?' is read as the contrarian 'front-page curse' all-clear for buying bonds.", "url": "https://yardeni.com/research/quicktakes/2026/10/10/us-markets-call-is-the-10-year-bond-yield-back-to-the-old-normal", "images": []}]}, {"theme": "France & European Sovereigns", "category": ["rates", "geopolitics"], "consensus": "French fiscal/political stress is the live European credit story: Gavekal notes the 10y OAT-Bund spread widened 40bp in three weeks of September to 127bp, touched 150bp on Oct 2 and was 139bp on Oct 8, a gap last seen in mid-2012; Barclays' podcast (ep. 52) is titled 'French bonds: OAT of control'.", "divergence": "Gavekal's Gemehl thinks the spread is repricing, not reverting, and will settle somewhere between 125bp and 300bp, listing three tests; BCA keeps OATs on the avoid list while favouring Bunds and peripherals; Standard Chartered says French political risks are 'largely contained' and still likes European regional bank equities (profitability, capital strength, valuation) though French risk clouds the EUR; Goldman's Wilson sees investor scrutiny of French borrowing growing but points to European defence and energy-independence names as opportunities.", "items": [{"source": "gavekal", "name": "Gavekal Research", "thesis": "Gavekal (Oct 1): OAT-Bund 10y spread +40bp in 3 weeks to 127bp, widest since June 2012.", "url": "https://research.gavekal.com/teaser/how-wide-can-french-spreads-get/", "images": []}, {"source": "gavekal", "name": "Gavekal Research", "thesis": "Gavekal (Oct 8): spread touched 150bp Oct 2, 127bp Tue, 139bp Thu — a repricing likely to settle in a 125–300bp range.", "url": "https://research.gavekal.com/teaser/three-tests-for-french-spreads/", "images": []}, {"source": "barclays", "name": "Barclays", "thesis": "Barclays Brief ep. 52 'French bonds: OAT of control' (podcast; collected text is navigation only, no substantive stance extractable).", "url": "https://www.ib.barclays/content/barclaysmicrosites/ibpublic/en/our-insights/barclays-brief/french-bonds-oat-of-control.html", "images": []}, {"source": "standard_chartered", "name": "Standard Chartered", "thesis": "Standard Chartered: French political/fiscal risks cloud EUR but remain largely contained; regional European banks attractive.", "url": "https://www.sc.com/sg/market-outlook/weekly-market-view-9-10-2026/?mvog=1", "images": []}]}, {"theme": "Energy, Oil & Iran", "category": ["energy", "commodities", "geopolitics"], "consensus": "The US–Iran conflict (since Feb 28; Hormuz/Bab al-Mandab disrupted per Gavekal) keeps Brent near $100–105 (UBS, BCA, PIIE) and has doubled diesel prices (Oxford); the World Bank Pink Sheet shows the energy index +25.7% in September (crude +21.2%, gas +15.3%). Most houses see Gulf crude exports recovering — PIMCO: ~80–90% of pre-conflict; UBS: above pre-war levels on 4 of the last 7 days of September; G7 agreed to release 100m barrels of crude/diesel — but all flag fragility.", "divergence": "Is recovery bearish for oil? BCA's Ibrahim says no: Middle East exports are back at pre-war levels yet Brent stays above $100, so there is a floor under Brent and even Russian diesel releases won't ease near-term product tightness; Amundi expects Brent to ease to ~$80 by early 2027 but warns on gas/LNG and Europe's storage; Deutsche Bank Wealth sees lower oil longer term as trade flows adapt but tight European gas through winter; PIMCO notes only 'tentative signs' of normalisation with refining/product bottlenecks persisting. At the micro level Wood Mackenzie reports Saudi suspension of the East-West pipeline pushing medium-sour crude above $140 and Johan Sverdrup to a record $24/bbl premium to Brent, while RBC highlights US diesel-export-ban risk (retail diesel +70%, gasoline +50% since the war began) ahead of the Nov 3 midterms. Escalation risk: UBS flagged Brent +3.8% to $104 on reports the White House weighed new strikes before the midterms; CoinShares later noted Trump said there would be no attack before Nov 3.", "items": [{"source": "bca_research", "name": "BCA Research", "thesis": "BCA (Oct 9): 'Why there's a floor under Brent' — exports at pre-war levels, Brent >$100; no clean policy fix; Russian diesel release unlikely to help near term.", "url": "https://www.bcaresearch.com/reports/why-theres-floor-under-brent-09-10-2026/227155", "images": []}, {"source": "amundi", "name": "Amundi", "thesis": "Amundi: Brent briefly $105, expected to ease toward $80 by early 2027; gas is a separate risk, Europe vulnerable if storage isn't rebuilt; Super El Niño and grain disruption add food-price risk.", "url": "https://research-center.amundi.com/article/global-investment-views-october-2026", "images": []}, {"source": "pimco", "name": "PIMCO", "thesis": "PIMCO: six-month WTI ~25% above end-February, in line with past shocks, but credit spreads and Treasuries behaved differently; Gulf exports ~80–90% of pre-conflict; US rig counts edging up; refining bottlenecks remain.", "url": "https://www.pimco.com/us/en/insights/the-credit-market-lens-an-oil-shock-mostly-like-no-other", "images": []}, {"source": "wood_mackenzie", "name": "Wood Mackenzie", "thesis": "Wood Mackenzie: Saudi on record; assesses how convenience yields/risk premia distort oil futures as forecasts of spot.", "url": "https://www.federalreserve.gov/econres/notes/feds-notes/convenience-yields-risk-premiums-and-the-interpretation-of-oil-futures-prices-during-geo-conflict-20261009.html", "images": []}]}, {"theme": "US Equities & the AI Trade", "category": ["equities", "ai_tech"], "consensus": "Earnings are the anchor: S&P 500 set a record Oct 6 (UBS: +14.2% YTD) with the equity market 'calm' (VIX ~15–16) despite 20+ year highs in long yields. UBS sees 2026 S&P EPS +25% and global AI capex +33% to $1.2tr in 2027; Standard Chartered cites Q3 S&P EPS +31% with tech +67%; Yardeni's 'FEMO' notes Q2 EPS growth >50% y/y (≈25% ex mark-to-market gains) and a fifth straight record quarter; BNP AM notes record $942bn foreign inflows into US equities in the year to July.", "divergence": "Positioning vs. fragility. UBS and Franklin Templeton (multi-asset 'Risk on, rates up') say stay invested — 'focus less on the perfect entry point'; T. Rowe's Vohora says 'the cost of capital matters again' and urges selectivity in the AI ecosystem. Standard Chartered is slightly OW equities but is 'taking chips off the table' in semiconductors/Taiwan since its stock-bond model turned negative for the first time since Mar 2025, and CoinShares flags breadth: only 29% of S&P stocks above their 50dma (RSP on track for a 7th weekly decline). Goldman's HF desk (Wilson) says L/S equity positioning is at historically low levels and Euro stocks/Bund yields are -70% correlated (1990s-type regime), while Goldman's Callahan says AI is becoming a stock-picker's market with growing software dispersion. BNP AM shows the divergence directly: from Aug 4–Oct 1 non-tech MSCI ACWI fell 8% while tech gained 9%, with the 10y up 60bp+. Gavekal's Darcet asks why stocks aren't plunging (MSCI World +9% since the Feb 28 war start) and Gavekal also flags US banks -7.5% vs S&P +1% since September. On AI economics, a Delphi analyst argues frontier-lab valuations are hard to justify (Anthropic cited at a $2tn IPO valuation and an $8.06bn net loss) while UBS reads robust demand (TSMC revenue +51%, Marvell guide-up) despite the Nasdaq's -1.25% drop on reports of a lower OpenAI revenue run-rate.", "items": [{"source": "ubs", "name": "UBS CIO", "thesis": "UBS (Oct 7): S&P +0.6% to first record since Aug (YTD +14.2%); AI capex +33% to $1.2tr in 2027; S&P EPS +25% in 2026; Nasdaq 100 EPS +43% / +28%.", "url": "https://www.ubs.com/global/en/wealthmanagement/insights/chief-investment-office/house-view/daily/2026/latest-07102026.html", "images": []}, {"source": "ubs", "name": "UBS CIO", "thesis": "UBS (Oct 9): Nasdaq -1.25% (largest 1-day drop since August) on lower-than-expected OpenAI run-rate reports; UBS points to TSMC +51% revenue, Samsung ~9x operating profit jump, Marvell guide-up.", "url": "https://www.ubs.com/us/en/wealth-management/insights/investment-research/insights-display-adp/global/en/wealthmanagement/insights/chief-investment-office/house-view/daily/2026/latest-09102026.html?caasID=CAAS-ActivityStream", "images": []}, {"source": "standard_chartered", "name": "Standard Chartered", "thesis": "Standard Chartered: locks in tactical gains in semis and Taiwan; slight OW equities; Q3 S&P EPS +31%, tech +67%; MOVE near highest since March while VIX ~15.", "url": "https://www.sc.com/sg/market-outlook/weekly-market-view-9-10-2026/?mvog=1", "images": []}, {"source": "coinshares", "name": "CoinShares", "thesis": "CoinShares: S&P/Nasdaq records on Oct 6 but just 29% of constituents above the 50dma (47% above 200dma, vs 73% in Aug); tech wobbled on AI-financing doubts; Trump said no attack on Iran before Nov 3.", "url": "https://coinshares.com/insights/research-data/equities-update-09-10-2026/", "images": []}, {"source": "goldman_sachs", "name": "Goldman Sachs", "thesis": "Goldman (Wilson): HF L/S equity positioning at historic lows; Europe more exposed to the energy shock; defence and energy-independence themes; Euro stocks vs Bund yields -70% correlated.", "url": "https://www.goldmansachs.com/insights/the-markets/hedge-funds-are-cautious-on-stocks-amid-rates-and-energy-volatility", "images": []}, {"source": "goldman_sachs", "name": "Goldman Sachs", "thesis": "Goldman (Callahan): AI trade broadening beyond semis/capex beneficiaries to implementers and agentic commerce; dispersion rising in software; 'meh summer' for megacaps.", "url": "https://www.goldmansachs.com/insights/the-markets/ai-is-becoming-a-stock-pickers-market", "images": []}, {"source": "bnp_paribas", "name": "BNP Paribas AM", "thesis": "BNP AM (Morris): non-tech ACWI -8% vs tech +9% (Aug 4–Oct 1) as the 10y rose 60bp+; yields vs nominal GDP growth (6.3%) suggest 'partial normalisation' and 10y above 5% more likely than below.", "url": "https://www.bnpparibas-am.com/en-us/front-of-mind/view-from-the-markets-is-this-the-new-old-normal-for-government-bond-yields/", "images": []}, {"source": "gavekal", "name": "Gavekal Research", "thesis": "Gavekal (Darcet): 'Why aren't stocks plunging?' — MSCI World +9% since hostilities began Feb 28 despite WTI ~$90 and rising yields.", "url": "https://research.gavekal.com/teaser/why-arent-stocks-plunging/", "images": []}, {"source": "delphi_digital", "name": "Delphi Digital", "thesis": "Delphi (Arcana): intelligence is commoditising via open-source models; argues frontier-lab IPO valuations (Anthropic cited at ~$2tn, $8.06bn net loss) are hard to justify — a crypto-native shop's contrarian take.", "url": "https://members.delphidigital.io/feed/how-durable-is-the-frontier-premium", "images": []}, {"source": "franklin_templeton", "name": "Franklin Templeton", "thesis": "Franklin Templeton Investment Solutions (Oct 9): 'Risk On, Rates Up' — strong growth and earnings warrant a positive risk stance despite geopolitics, inflation and tightening.", "url": "https://www.franklintempleton.com/about-us/franklin-templeton-investment-solutions", "images": []}, {"source": "t_rowe_price", "name": "T. Rowe Price", "thesis": "T. Rowe Price (Vohora): AI and geopolitics define 2026; the cost of capital matters again; stay invested, diversified and active, selective across the AI ecosystem.", "url": "https://www.troweprice.com/en/us/insights/ai-geopolitical-shifts-and-the-new-cost-of-capital", "images": []}, {"source": "yardeni_research", "name": "Yardeni Research", "thesis": "Yardeni: Q1 S&P EPS ~+30% y/y, Q2 >+50% (≈20%/25% ex mark-to-market gains); fifth consecutive record-earnings quarter; Q3 'FEMO' continuing.", "url": "https://yardeni.com/research/quicktakes/2026/10/08/lots-of-femo-in-q3s-earnings-reporting-season", "images": []}]}, {"theme": "Growth, Labour & Inflation", "category": ["growth"], "consensus": "Global growth is holding up thanks to the AI capex cycle: PIIE projects 3.2% (2026) and 3.1% (2027) global GDP, US 2.3% / 2.2%; PIMCO's baseline is resilient growth with moderating inflation, supported by three buffers (AI capex, consumers/China absorbing costs, incremental central banks); BofA Institute card data show September spending +6.2% y/y (+5.1% ex gasoline) and breadth across income cohorts.", "divergence": "Labour/inflation reads differ. September payrolls came in 'well below' estimates (UBS; consensus ~90k) — BCA calls the report 'slightly cool' and says it reduces pressure on the Fed to hike in October; BNP AM notes private payrolls of just +46k but argues the weakness is concentrated in temp/admin services and unemployment is steady; BofA's deposit data show payroll growth slowing to +1.4% y/y. UBS leans disinflationary (3m core PCE 2.05%) but ISM prices paid at 77.9 (vs 73.0 expected) shows input-cost risk, and CoinShares cites 3.0% y/y core PCE. Moody's titles ('Low-hire, low-fire', 'U.S. Road to Recession: Mixed Bag', 'Consumers Are Losing Faith') are the cautious end; Goldman's Briggs argues the sentiment gap (consumer confidence 81.9, lowest since 2014 per CoinShares) reflects eroded institutional trust, so sentiment surveys are 'probably not a very useful' analytical tool. Oxford sees European consumption (+0.4% q/q in Q2) slowing in H2, but says higher-for-longer inflation will 'dent, not derail' the eurozone.", "items": [{"source": "peterson_institute", "name": "Peterson Institute (PIIE)", "thesis": "PIIE (Dynan): global GDP +3.2% in 2026 and +3.1% in 2027; US +2.3% / +2.2%; AI boom cushions energy, inflation and rate shocks; Brent ~$100.", "url": "https://www.piie.com/blogs/realtime-economics/2026/global-growth-remains-solid-challenging-environment", "images": []}, {"source": "pimco", "name": "PIMCO", "thesis": "PIMCO cyclical outlook (Wilding/Balls): resilient growth over 6–12 months; three buffers; risks if AI boom fades, energy shock worsens or financial conditions tighten; be selective in credit and AI buildout financing.", "url": "https://www.pimco.com/us/en/insights/growth-holds-risks-widen", "images": []}, {"source": "goldman_sachs", "name": "Goldman Sachs", "thesis": "Goldman (Briggs): US consumers are downbeat despite a healthy economy; gap tied to declining trust in institutions.", "url": "https://www.goldmansachs.com/insights/videos/why-us-consumers-are-downbeat-despite-a-healthy-economy", "images": []}, {"source": "bofa", "name": "Bank of America Institute", "thesis": "BofA Institute: Sept card spend/household +6.2% y/y (+5.1% ex-gas); lower/middle-income recovery; BNPL rising but not alarming (≈1 in 5 users has a repayment >$500). Employment report: payroll growth 1.4% y/y.", "url": "https://institute.bankofamerica.com/economic-insights/consumer-checkpoint-october-2026.html", "images": []}, {"source": "bnp_paribas", "name": "BNP Paribas AM", "thesis": "BNP AM (Morris): HY spreads not signalling recession; Sept private payrolls +46k driven by admin/temp services; unemployment steady at 3.8%.", "url": "https://www.bnpparibas-am.com/en/front-of-mind/view-from-the-markets-is-high-yield-credit-flashing-a-warning-sign/", "images": []}, {"source": "moodys_analytics", "name": "Moody's Analytics", "thesis": "Moody's Analytics: 'U.S. Road to Recession: Mixed Bag' and 'Low-Hire, Low-Fire Labor Market Remains in Effect' (collected text is navigation only; titles indicate cautious labour view).", "url": "https://www.economy.com/economicview/analysis/424122/US-Road-to-Recession-Mixed-Bag", "images": []}, {"source": "oxford_economics", "name": "Oxford Economics", "thesis": "Oxford Economics: APAC industrial production 4.9% in 2026 but 2027 cut to 4.0% (from 4.4%) on prolonged Middle East conflict; AI electronics output upgraded.", "url": "https://www.oxfordeconomics.com/resource/higher-energy-prices-weigh-on-apac-output-while-ai-demand-supports-growth/", "images": []}]}, {"theme": "Credit & Financing the AI Build-out", "category": ["credit", "ai_tech"], "consensus": "Spreads are tight and fundamentals fine, but the funding load is heavy: PIMCO notes IG spreads are flat versus February despite the oil shock; Amundi says US IG issuance has surged led by AI capex; UBS cites hyperscaler debt issuance as an additional yield headwind; Brookings estimates AI investment could total $10.3tn (2025–2032), ~3.63% of US GDP per year, with financing moving to JVs, private credit and SPVs.", "divergence": "Is the HY widening a warning? BNP AM says US HY OAS jumped from 267bp (Sep 8) to 318bp (Oct 1) — near the March peak — but concludes it is concentrated in CCCs, hard to reconcile with US data, and sees BBB opportunities; Oxford lists private credit as one of three key vulnerabilities; KKR's insurance survey (~50 insurers, $2.6tn) finds 91% keep or raise credit exposure and ~80% keep or accelerate private capital even while recognising a credit event is an 'underpriced' risk; Brookings calls systemic risk premature but wants better disclosure; PIMCO asks for more compensation for regulatory/legal/political risk in AI-related credit; Citi's Willer/Pickett warn that rising rates vol may make risky assets start to 'take rising rates more seriously'.", "items": [{"source": "pimco", "name": "PIMCO", "thesis": "PIMCO Credit Market Lens: IG spreads flat vs pre-conflict; higher all-in yields supporting credit demand; why this oil shock differs (less oil-intensive US economy, AI capex).", "url": "https://www.pimco.com/us/en/insights/the-credit-market-lens-an-oil-shock-mostly-like-no-other", "images": []}, {"source": "bnp_paribas", "name": "BNP Paribas AM", "thesis": "BNP AM: HY OAS 267bp → 318bp; September was the 5th busiest month ever for HY issuance; weakness concentrated in CCC; selective BBB opportunities.", "url": "https://www.bnpparibas-am.com/en/front-of-mind/view-from-the-markets-is-high-yield-credit-flashing-a-warning-sign/", "images": []}, {"source": "brookings", "name": "Brookings", "thesis": "Brookings (Van Nieuwerburgh): $10.3tn AI investment 2025–32; financing shifting off balance sheets; not yet systemic.", "url": "https://www.brookings.edu/articles/the-10-trillion-question-financing-the-ai-buildout/", "images": []}, {"source": "kkr", "name": "KKR", "thesis": "KKR Insurance CIO survey: 91% maintain/increase credit exposure; ~80% maintain/accelerate private capital; 'Divergence Conundrum'; insurers high-grading into private/structured.", "url": "https://www.kkr.com/insights/2026-insurance-cio-survey", "images": []}, {"source": "citi_gps", "name": "Citi Research", "thesis": "Citi (Willer/Pickett): MOVE index a better predictor of Treasury vol than the 10y yield; 'buyer strike' in Treasuries and back-end decoupling raise risks for equities, though vol spikes are usually short-lived.", "url": "https://www.citigroup.com/global/insights/markets-edition-var-volatility-also-rises", "images": []}]}, {"theme": "USD, FX & Gold", "category": ["fx", "commodities"], "consensus": "The dollar is range-bound with policy the main driver: Standard Chartered (Oct 9) has DXY at ~102.1 and expects it rangebound as data points to a Fed pause in October; Deutsche Bank Wealth says USD is supported by hawkish-Fed expectations. Carry is the common theme (BCA's G10 scorecard favours high-carry currencies; Amundi favours higher-carry EM currencies).", "divergence": "Medium-term direction: Deutsche Bank expects USD to weaken somewhat over the medium term, EUR supported by a restrictive ECB, JPY needing more BoJ tightening after rebounding from 40-year lows, and a gradual CNY appreciation after a four-year high; Standard Chartered notes French risk clouds EUR; Waller (cited by SC) says further hikes are needed but stresses flexibility on pace. Gold is supported by central-bank demand (Deutsche Bank, Amundi positive).", "items": [{"source": "deutsche_bank", "name": "Deutsche Bank Wealth", "thesis": "Deutsche Bank Wealth: USD supported near-term by hawkish Fed but to weaken medium-term; EUR supported by ECB; JPY needs tighter BoJ; CNY at 4-year high, gradual appreciation seen over 12 months.", "url": "https://wealth.db.com/en/insights/investing-insights/asset-class-insights/central-banks-back-in-the-spotlight.html", "images": []}, {"source": "standard_chartered", "name": "Standard Chartered", "thesis": "Standard Chartered Daily Navigator (Oct 9): DXY 102.138, rangebound as data points to Fed pause in October; Waller says more hikes needed but flexible on pace.", "url": "https://www.sc.com/sg/market-outlook/daily-navigator-9-10-2026/?mvog=1", "images": []}, {"source": "bca_research", "name": "BCA Research", "thesis": "BCA FX Scorecard: G10 cyclical scorecard still favours high-carry over low-yielding currencies ('Riding the carry wave').", "url": "https://www.bcaresearch.com/reports/g10-fx-scorecard-riding-carry-wave-07-10-2026/227117", "images": []}]}, {"theme": "Geopolitics & China/EM", "category": ["geopolitics", "em"], "consensus": "Risk remains elevated and unresolved: BCA's Global Geopolitical Risk Score stays at 8 (no ceasefires in Europe or the Middle East; Russia provoking NATO; Iran emboldened by the absence of definitive US success). BCA's Papic argues the long-end move reflects 'sanguine' growth forces rather than fiscal profligacy and says the Iran war is subsiding partly because the Fed has acted.", "divergence": "On China: BCA's Sima sees policy gradually more supportive of households but no decisive reflationary pivot — favouring state-owned banks and onshore utilities defensively — while Gavekal Dragonomics sees an idiosyncratic profit cycle (earnings soaring while output volumes fall, boosted by a historically large global demand surge), Tier-1 housing prices stabilising, and a tech sector that is stronger but squeezed by hyper-competition; Goldman says China's chip capacity is ramping faster than expected and Chinese open-weight models are spreading globally. On EM more broadly, Amundi is constructive on EM and sees Latin American equities as a diversifier, and the World Bank argues EM private lending can deliver competitive returns. Post-midterm, BCA warns President Trump has fewer constraints for a maximalist foreign policy and (webcast) forecasts Democrats winning the Senate.", "items": [{"source": "bca_research", "name": "BCA Research", "thesis": "BCA Global Risk Outlook Q4: risk score held at 8; Russia/NATO, Iran, fragile China raise belligerence risk; post-midterm Trump less constrained.", "url": "https://www.bcaresearch.com/reports/global-risk-outlook-q4-2026-09-10-2026/227144", "images": []}, {"source": "bca_research", "name": "BCA Research", "thesis": "BCA GeoMacro (Papic/Shtrevensky): FOMC 'targeting geopolitics'; long-dated yields +48bp since last missive while equities resilient; war in Iran subsiding.", "url": "https://www.bcaresearch.com/reports/fomc-targeting-geopolitics-06-10-2026/227101", "images": []}, {"source": "bca_research", "name": "BCA Research", "thesis": "BCA China (Sima): policy gradually more supportive of households; no decisive reflation pivot; favour large SOE banks and onshore utilities.", "url": "https://www.bcaresearch.com/reports/china-five-questions-investors-minds-09-10-2026/227135", "images": []}, {"source": "gavekal", "name": "Gavekal Research", "thesis": "Gavekal Dragonomics: 2026 is one of the most idiosyncratic Chinese profit cycles — earnings soaring on a historically large global demand surge while output volume falls.", "url": "https://research.gavekal.com/teaser/an-unbalanced-earnings-cycle/", "images": []}, {"source": "goldman_sachs", "name": "Goldman Sachs", "thesis": "Goldman Research: competition among China's AI models intensifying; China's semiconductor build-out ahead of expectations though bottlenecks persist.", "url": "https://www.goldmansachs.com/insights/articles/competition-among-chinas-ai-models-is-intensifying-as-chip-sector-advances", "images": []}, {"source": "amundi", "name": "Amundi", "thesis": "Amundi: Latin America rising as a diversifier; EM constructive; India transformation thematic.", "url": "https://research-center.amundi.com/article/markets-weigh-rising-yields-and-ai-exuberance", "images": []}]}, {"theme": "Crypto & Digital Assets", "category": ["crypto"], "consensus": "Bitcoin is consolidating around $83–88k (The Block: ~$82,975 on Oct 9; Galaxy podcast: testing $88k on $2.4B weekly ETF inflows) with sensitivity to Fed-hike odds. Professionals held firm in the Q2 sell-off: CoinShares' 13F report shows filers at 264k BTC (+1.3% q/q) while US spot ETF holdings fell 6.3% and non-13F holders cut 8.3%.", "divergence": "Macro read: CoinShares says digital-asset fund flows have lost momentum after $11.1B of inflows since mid-July and that the bond market may matter more than the Fed — if yields reflect fiscal-sustainability worries rather than growth, BTC acts as an alternative to government-issued money rather than a risk asset (a countervailing view to the standard 'higher real yields = headwind'). Galaxy argues the Oct 10, 2025 $19bn liquidation event is shaping up as 'a blip', and debates whether OpenAI's 719 math results raise a cryptography risk (none relate explicitly to cryptography, but adjacent progress sparked prep debate); Delphi tracks on-chain options volume doubling in September (+121.7% m/m to $4.83bn). Regulation: CoinShares notes the CLARITY Act failed to reach 60 Senate votes on Sept 15, while Galaxy says the CFTC is moving to let users keep their own keys. Security: Chainalysis traces the $387M Bitget theft (DPRK), taking DPRK 2026 thefts past $1B.", "items": [{"source": "coinshares", "name": "CoinShares", "thesis": "CoinShares (Oct 8): flows cooled after $11.1B inflows; Treasury buybacks of ≥$4B/operation aren't stopping yields; Bessent concedes Treasury can't control the bond market; BTC as fiscal-hedge argument; Sept was worst month for US bonds in 4 years (10y +50bp).", "url": "https://coinshares.com/insights/research-data/market-update-08-10-2026/", "images": []}, {"source": "coinshares", "name": "CoinShares", "thesis": "CoinShares 13F Q2: professional holders 264k BTC; $ value of filer holdings -13% to $15.5B on a -14% BTC price; ETF holdings -6.3%.", "url": "https://coinshares.com/insights/research-data/bitcoin-13f-q2-2026-report/", "images": []}, {"source": "galaxy_digital", "name": "Galaxy Digital", "thesis": "Galaxy: first anniversary of Oct 10, 2025 ($19B liquidations, BTC $122k→low-$106ks) — now looks like a blip.", "url": "https://www.galaxy.com/insights/research/10-10-anniversary-crypto-liquidation-19-billion-bitcoin-binance-hyperliquid-2026", "images": []}, {"source": "galaxy_digital", "name": "Galaxy Digital", "thesis": "Galaxy: OpenAI's 719 math results and the 'Mathpocalypse' debate over AI risk to ECDSA cryptography.", "url": "https://www.galaxy.com/insights/research/openai-math-ai-ecdsa-crypto-security", "images": []}, {"source": "chainalysis", "name": "Chainalysis", "thesis": "Chainalysis: traced $387M Bitget theft (Sept 24) to DPRK; 2026 DPRK thefts now >$1B.", "url": "https://www.chainalysis.com/blog/387m-bitget-theft-2026/", "images": []}, {"source": "chainalysis", "name": "Chainalysis", "thesis": "Chainalysis: East Asia crypto economy — South Korea $449.1B, Japan $228.3B, Hong Kong $192.2B; HK institutional platforms 16% of service inflows.", "url": "https://www.chainalysis.com/blog/eastern-asia-crypto-adoption-2026/", "images": []}]}], "B_calls": [{"source": "goldman_sachs", "name": "Goldman Sachs", "call": "Goldman (Hatzius): base case is a final 25bp Fed hike in December (previously October); markets' three remaining hikes 'not necessary'; one-and-done possible if inflation stays soft — Oct CPI is the key print.", "url": "https://www.goldmansachs.com/insights/videos/cnbc-jan-hatzius-outlook-for-us-economy", "images": [], "category": ["rates"]}, {"source": "ubs", "name": "UBS CIO", "call": "UBS CIO: market pricing of nearly four more 25bp Fed hikes by end-2027 is too aggressive; expects further disinflation over six months.", "url": "https://www.ubs.com/global/en/wealthmanagement/insights/chief-investment-office/house-view/daily/2026/latest-01102026.html", "images": [], "category": ["rates"]}, {"source": "ubs", "name": "UBS CIO", "call": "UBS CIO: US equities can gain further — S&P 500 EPS +25% in 2026, global AI capex +33% to $1.2tr in 2027, Nasdaq 100 EPS +43% (2026) / +28% (2027).", "url": "https://www.ubs.com/global/en/wealthmanagement/insights/chief-investment-office/house-view/daily/2026/latest-07102026.html", "images": [], "category": ["equities", "ai_tech"]}, {"source": "bca_research", "name": "BCA Research", "call": "BCA (Peloso): favour German Bunds and peripheral bonds currency-hedged; US Treasuries and French OATs remain vulnerable to further selling.", "url": "https://www.bcaresearch.com/reports/higher-yields-better-bets-09-10-2026/227133", "images": [], "category": ["rates"]}, {"source": "bca_research", "name": "BCA Research", "call": "BCA (Timper): mild hiking cycle = buyable dip in government bonds and credit; keep inflation-linked bonds for energy-risk protection.", "url": "https://www.bcaresearch.com/reports/global-model-bond-portfolio-q426-mild-hiking-cycle-offers-buyable-dip-09-10-2026/227145", "images": [], "category": ["rates", "credit"]}, {"source": "bca_research", "name": "BCA Research", "call": "BCA (Sima): favour large state-owned banks and onshore utilities in China as defensive plays; no reflation pivot yet.", "url": "https://www.bcaresearch.com/reports/china-five-questions-investors-minds-09-10-2026/227135", "images": [], "category": ["em", "equities"]}, {"source": "gavekal", "name": "Gavekal Research", "call": "Gavekal (Kaletsky): start buying G7 bonds — a contrarian call within Gavekal after five years of bear market.", "url": "https://research.gavekal.com/teaser/reasons-to-start-buying-bonds/", "images": [], "category": ["rates"]}, {"source": "standard_chartered", "name": "Standard Chartered", "call": "Standard Chartered: take tactical profits in semiconductors and Taiwan equities; stay slightly overweight equities; like European regional banks; wait to add high-beta exposure until earnings/macro events pass.", "url": "https://www.sc.com/sg/market-outlook/weekly-market-view-9-10-2026/?mvog=1", "images": [], "category": ["equities"]}, {"source": "amundi", "name": "Amundi", "call": "Amundi: neutral US duration (intermediate), constructive EMU peripherals vs core with steepener, mild positive UK duration; credit mildly constructive (Global IG); cautious US equities strategically, positive Europe/Japan/EM; favour high-carry EM FX; positive gold; Brent to ~$80 by early 2027.", "url": "https://research-center.amundi.com/article/global-investment-views-october-2026", "images": [], "category": ["rates", "equities", "fx"]}, {"source": "goldman_sachs", "name": "Goldman Sachs", "call": "Goldman Research (Mueller-Glissmann): equities preferred to bonds over the next few months; 60/40 better over longer horizons; diversify with alternatives.", "url": "https://www.goldmansachs.com/insights/articles/are-bonds-becoming-a-better-investment-for-portfolios", "images": [], "category": ["equities", "rates"]}, {"source": "goldman_sachs", "name": "Goldman Sachs", "call": "Goldman (Wilson): opportunities in European defence stocks and the energy-independence theme; German-spending beneficiaries and US Q3 earnings also discussed.", "url": "https://www.goldmansachs.com/insights/the-markets/hedge-funds-are-cautious-on-stocks-amid-rates-and-energy-volatility", "images": [], "category": ["equities"]}, {"source": "bny", "name": "BNY Investments", "call": "BNY: move from cash into short-dated global credit, floating-rate credit and ABS rather than extending duration.", "url": "https://www.bny.com/investments/us/en/individual/articles/fixed-income/seeking-yield-beyond-duration-resilience-with-duration-risk-mitigation.html", "images": [], "category": ["credit", "rates"]}, {"source": "bny", "name": "BNY Investments", "call": "BNY: yields likely to climb further after the first hike (avg +43bp over six months historically); levels 'increasingly attractive' but risks skewed higher.", "url": "https://www.bny.com/investments/us/en/individual/articles/markets-and-economy/treasury-yields-push-to-multi-decade-highs--and-history-says-the.html", "images": [], "category": ["rates"]}, {"source": "deutsche_bank", "name": "Deutsche Bank Wealth", "call": "Deutsche Bank Wealth: expects USD to soften medium-term; CNY gradual appreciation; EUR supported by ECB.", "url": "https://wealth.db.com/en/insights/investing-insights/asset-class-insights/central-banks-back-in-the-spotlight.html", "images": [], "category": ["fx"]}, {"source": "deutsche_bank", "name": "Deutsche Bank Wealth", "call": "Deutsche Bank Wealth: gold supported by central-bank demand; silver upside with volatility; copper supported by electrification, AI infrastructure and constrained supply.", "url": "https://wealth.db.com/en/insights/investing-insights/asset-class-insights/supply-disruption-powers-up-prices.html", "images": [], "category": ["commodities"]}, {"source": "pimco", "name": "PIMCO", "call": "PIMCO: elevated yields provide income/downside mitigation; global diversification; be selective in credit and AI-related buildout, seeking compensation for regulatory/legal/midterm political risk.", "url": "https://www.pimco.com/us/en/insights/growth-holds-risks-widen", "images": [], "category": ["rates", "credit"]}, {"source": "bnp_paribas", "name": "BNP Paribas AM", "call": "BNP AM: portfolio managers see opportunities among BBB-rated names as yields rise across the ratings spectrum.", "url": "https://www.bnpparibas-am.com/en/front-of-mind/view-from-the-markets-is-high-yield-credit-flashing-a-warning-sign/", "images": [], "category": ["credit"]}, {"source": "franklin_templeton", "name": "Franklin Templeton", "call": "Franklin Templeton Investment Solutions: 'Risk On, Rates Up' — positive risk stance for growth, yield and diversification.", "url": "https://www.franklintempleton.com/about-us/franklin-templeton-investment-solutions", "images": [], "category": ["equities"]}, {"source": "t_rowe_price", "name": "T. Rowe Price", "call": "T. Rowe Price: stay invested, diversified and active; selectivity across the AI ecosystem as cost of capital rises.", "url": "https://www.troweprice.com/en/us/insights/ai-geopolitical-shifts-and-the-new-cost-of-capital", "images": [], "category": ["equities", "ai_tech"]}, {"source": "bridgewater", "name": "Bridgewater", "call": "Bridgewater (Karniol-Tambour, Milken): most investors are overweight US equities and underweight real assets; modern mercantilism is structural and inflationary; diversify across regions.", "url": "https://www.bridgewater.com/research-and-insights/karen-karniol-tambour-on-investing-in-a-more-fragmented-world", "images": [], "category": ["equities", "commodities"]}, {"source": "kkr", "name": "KKR", "call": "KKR (McVey): global investment cycle broader, more durable and more inflationary than appreciated — AI, defence, infrastructure, energy and supply-chain resilience compete for capital; reinforces 'regime change' thesis.", "url": "https://www.kkr.com/insights/2026-europe-asia-thoughts-from-the-road", "images": [], "category": ["equities"]}, {"source": "bnp_paribas", "name": "BNP Paribas AM", "call": "BNP AM: 10y UST above 5% more likely than below as yields normalise toward nominal GDP growth (6.3%).", "url": "https://www.bnpparibas-am.com/en-us/front-of-mind/view-from-the-markets-is-this-the-new-old-normal-for-government-bond-yields/", "images": [], "category": ["rates"]}], "C_deep_reads": [{"source": "pimco", "name": "PIMCO", "summary": "Seven months into the US–Iran conflict, oil has tracked prior geopolitical shocks (six-month WTI ~25% above end-February) but other assets haven't: IG spreads are flat versus pre-conflict levels while Treasury yields have risen sharply, closer to the 2022 Russia–Ukraine pattern than 1991. PIMCO gives two reasons — the US is far less oil-intensive than in earlier shocks, and the AI capex cycle stabilises growth expectations and risk appetite. Higher yields are supporting credit demand despite tight spreads. Gulf exports have recovered to ~80–90% of pre-conflict and US rigs are rising slowly, but refining/product bottlenecks persist and a renewed disruption could mean slower growth plus renewed inflation.", "url": "https://www.pimco.com/us/en/insights/the-credit-market-lens-an-oil-shock-mostly-like-no-other", "images": [], "title": "The Credit Market Lens: An Oil Shock (Mostly) Like No Other (PIMCO, Lotfi Karoui, Oct 5)"}, {"source": "pimco", "name": "PIMCO", "summary": "Longer-term themes (fragmentation, AI) drive the 6–12 month outlook: baseline is resilient global growth with moderating inflation. Three buffers support it — the AI investment cycle (a capex boom comparable to the 1990s telecom build but faster), consumers and China absorbing higher costs, and incremental central banks. Risks arise if the AI boom fades, the energy shock worsens or financial conditions deteriorate, especially as valuations may not reflect this. Investment takeaways: central-bank commitment supports bonds, high starting yields do more work, diversify globally, be selective in credit and the AI buildout.", "url": "https://www.pimco.com/us/en/insights/growth-holds-risks-widen", "images": [], "title": "Growth Holds, Risks Widen (PIMCO cyclical outlook, Wilding & Balls, Oct 6)"}, {"source": "bny", "name": "BNY Investments", "summary": "10y UST ~5.30% after the September 25bp hike: +55bp in a month and +125bp from February. The move is real-yield driven (10y real 2.90%, highest since 2008; breakeven stable ~2.35%), implying stronger nominal growth rather than an inflation repricing; markets price ~4 further hikes through end-2027. In the last seven tightening cycles the 10y generally rose and curves flattened for 3–6 months after the first hike (avg +43bp within six months); only 2004 and 2016 saw declines, when inflation was benign. Conclusion: current levels look increasingly attractive but risks remain skewed higher; rate-sensitive equity sectors are beginning to suffer.", "url": "https://www.bny.com/investments/us/en/individual/articles/markets-and-economy/treasury-yields-push-to-multi-decade-highs--and-history-says-the.html", "images": [], "title": "Treasury Yields Push to Multi-Decade Highs, and History Says They May Climb Further (BNY, Oct 2)"}, {"source": "amundi", "name": "Amundi", "summary": "Bonds came under pressure in September on inflation worries and hawkish central banks; global government yields averaged close to 4% (highest since 2007) with flattening curves. Brent hit $105 and is seen easing to ~$80 by early 2027; gas/LNG is a separate risk, especially for Europe. Central-bank reaction function needs reassessing for inflation persistence, growth resilience (incl. AI capex) and long-end/credit financial conditions; no prolonged tightening cycle expected. Scrutiny on AI capex monetisation is rising — IPO pipeline and surging US IG issuance are key tests. Positioning: mildly pro-risk multi-asset; cautious US equities, positive Europe/Japan/EM; favour carry, high-carry EM FX and gold.", "url": "https://research-center.amundi.com/article/global-investment-views-october-2026", "images": [], "title": "Global Investment Views – October 2026 (Amundi)"}, {"source": "boe", "name": "Bank of England", "summary": "Taylor focuses on the risk that the energy shock turns into persistent inflation through expectations and second-round effects, arguing no single indicator will reveal the route; the MPC should watch a set of imperfect signposts — the initial energy-price impulse, household and firm inflation expectations, wage/price pass-through, and slack/credibility — and that current restrictive policy guards against persistence. (Collected excerpt covers the framework; the full speech is long and only partly read.)", "url": "https://www.bankofengland.co.uk/speech/2026/september/searching-for-signposts-speech-by-alan-taylor", "images": [], "title": "Searching for Signposts (BoE's Alan Taylor, Dow Lecture, Sept 29)"}, {"source": "boe", "name": "Bank of England", "summary": "Sets out the MPC's four-channel framework for the energy shock — direct (look through), indirect (smaller/slower than expected; look through or tighten), second-round (too early to tell; tighten if needed) and demand effects (smaller than expected; could loosen). No firm guidance on the path, but the reaction function depends on how the shock evolves and propagates; policy is already leaning against persistence and will tighten further if needed.", "url": "https://www.bankofengland.co.uk/speech/2026/september/clare-lombardelli-speech-at-the-sixth-biennial-conference-poland", "images": [], "title": "The Outlook for Inflation (BoE's Clare Lombardelli, Sept 24)"}, {"source": "kkr", "name": "KKR", "summary": "After London and Singapore meetings, McVey now believes the global investment cycle is broader, more durable and probably more inflationary than he appreciated: AI remains key (more confidence in the semiconductor cycle after Asia), but defence, infrastructure, energy and supply-chain resiliency increasingly compete for the same capital, labour and power. It reinforces KKR's 'Regime Change' thesis of structurally higher inflation and the blending of economics, rule of law and national security.", "url": "https://www.kkr.com/insights/2026-europe-asia-thoughts-from-the-road", "images": [], "title": "Thoughts from the Road: Europe and Asia, October 2026 (KKR, Henry McVey)"}, {"source": "brookings", "name": "Brookings", "summary": "AI investment in data centres, power and chips could total $10.3tn over 2025–2032, ~3.63% of US GDP per year — more than past booms in railroads, highways and telecom. Financing is shifting off company balance sheets into joint ventures, private credit and special-purpose vehicles, making risk harder to see. Calling it systemic is premature, but measurement and disclosure should improve while capital structures are still forming.", "url": "https://www.brookings.edu/articles/the-10-trillion-question-financing-the-ai-buildout/", "images": [], "title": "The $10 Trillion Question: Financing the AI Buildout (Brookings BPEA podcast, Van Nieuwerburgh)"}, {"source": "bnp_paribas", "name": "BNP Paribas AM", "summary": "From Aug 4 to Oct 1 the 10y rose 60bp+ and non-tech MSCI ACWI fell 8% while tech gained 9% as earnings momentum overwhelmed discount-rate effects; the oil–yield correlation has broken down but not with non-tech equities. US growth estimates have risen from 1.5% to 2.2%, raising the risk of more hikes than priced. With 10y yields historically above nominal GDP growth (6.3% now) from the 1980s to 2000, the move may be a partial normalisation — making yields above 5% more likely than below — though debt is 110% of GDP vs 44% then and debt worries could spread beyond France.", "url": "https://www.bnpparibas-am.com/en-us/front-of-mind/view-from-the-markets-is-this-the-new-old-normal-for-government-bond-yields/", "images": [], "title": "Is this the new (old) normal for government bond yields? (BNP AM, Daniel Morris, Oct 2)"}, {"source": "boe", "name": "Bank of England", "summary": "The financial system has weathered the latest uncertainty, but lower growth, repeated supply shocks, rising sovereign debt, leveraged markets and rapidly expanding AI-related financing create vulnerabilities that could crystallise together; incidents involving frontier AI underline operational, cyber and financial risks. Policymakers should pursue sustainable growth, credible monetary and fiscal frameworks, and stronger core markets that absorb shocks without amplifying them.", "url": "https://www.bankofengland.co.uk/speech/2026/october/andrew-bailey-speech-at-the-istanbul-economic-forum-central-bank-of-the-republic-of-turkey-istanbul", "images": [], "title": "Financial resilience in an age of repeated shocks (BoE Governor Andrew Bailey, Oct 8)"}], "D_charts": [{"source": "pimco", "name": "PIMCO", "chart": "PIMCO Figures 1–5: six-month WTI vs past supply shocks, flat IG credit spreads versus pre-conflict levels, and the rise in US Treasury yields since the Iran war began — shows why this oil shock hasn't produced the usual credit/growth reaction (source data: Bloomberg, Haver, PIMCO to 30 Sep 2026).", "url": "https://www.pimco.com/us/en/insights/the-credit-market-lens-an-oil-shock-mostly-like-no-other", "images": ["https://www.pimco.com/us/en/-/media/global-assets/insights/economic-and-market-commentary/the-credit-market-lens/10/the-credit-market-lens-an-oil-shock-mostly-like-no-other/figure-1_2026-10-04t23_38_08.webp?rev=f27868eba91d474e88eb59c90e96b841&la=en-US&h=720&w=1280&hash=1139EA64E7F9B78B53286C9BA87FC1C7", "https://www.pimco.com/us/en/-/media/global-assets/insights/economic-and-market-commentary/the-credit-market-lens/10/the-credit-market-lens-an-oil-shock-mostly-like-no-other/figure-2_2026-10-04t23_38_09.webp?rev=a78d59720c394746964530e5554d7036&la=en-US&h=720&w=1280&hash=063BCBBAB6C16591D704CBD96EB3B4B6", "https://www.pimco.com/us/en/-/media/global-assets/insights/economic-and-market-commentary/the-credit- // ---------- helpers ----------
const CAT_VARS = {
  rates: 'var(--cat-rates)',
  growth: 'var(--cat-growth)',
  fx: 'var(--cat-fx)',
  equities: 'var(--cat-equities)',
  credit: 'var(--cat-credit)',
  crypto: 'var(--cat-crypto)',
  energy: 'var(--cat-energy)',
  commodities: 'var(--cat-commodities)',
  geopolitics: 'var(--cat-geopolitics)',
  ai_tech: 'var(--cat-ai_tech)',
  em: 'var(--cat-em)',
};
function catColor(cat) {
  if (!cat) return 'var(--cat-default)';
  return CAT_VARS[String(cat).toLowerCase()] || 'var(--cat-default)';
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }
function renderBold(text) {
  return escapeHtml(text).replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
}
function pill(cat) {
  if (!cat) return '';
  return `<span class="pill" style="background:${catColor(cat)}">${escapeHtml(cat)}</span>`;
}
function pills(cats) {
  if (!cats) return '';
  if (Array.isArray(cats)) return cats.map(pill).join(' ');
  return pill(cats);
}
function externalLink(url, label) {
  if (!url) return '';
  return `<a class="item-link" href="${escapeAttr(url)}" target="_blank" rel="noopener">${label || 'link →'}</a>`;
}
function nameLink(url, name) {
  if (!name) return '';
  if (!url) return `<span class="item-source">${escapeHtml(name)}</span>`;
  return `<a class="item-source" href="${escapeAttr(url)}" target="_blank" rel="noopener">${escapeHtml(name)}</a>`;
}

// ---------- rendering ----------
function renderThumbs(images) {
  if (!images || !images.length) return '';
  return `<div class="thumbs">` + images.map(u =>
    `<img src="${escapeAttr(u)}" class="thumb" loading="lazy" alt="" onclick="openLightbox('${escapeAttr(u)}')">`
  ).join('') + `</div>`;
}

function renderThemeItem(it) {
  return `
    <div class="theme-item">
      <div class="item-head">
        ${nameLink(it.url, it.name || it.source)}
        ${externalLink(it.url)}
      </div>
      <div class="item-text">${renderBold(it.thesis || '')}</div>
      ${renderThumbs(it.images)}
    </div>`;
}

function renderTheme(theme) {
  const items = (theme.items || []).map(renderThemeItem).join('');
  return `
    <div class="theme">
      <div class="theme-head">
        ${pills(theme.category)}
        <div class="theme-title">${escapeHtml(theme.theme || '')}</div>
      </div>
      <div class="theme-stance">
        ${theme.consensus ? `<div class="theme-line consensus"><span class="lbl">Consensus</span>${renderBold(theme.consensus)}</div>` : ''}
        ${theme.divergence ? `<div class="theme-line divergence"><span class="lbl">Divergence</span>${renderBold(theme.divergence)}</div>` : ''}
      </div>
      ${items ? `<div class="theme-items">${items}</div>` : ''}
    </div>`;
}

function renderCall(it) {
  return `
    <div class="item-card">
      <div class="item-head">
        ${pills(it.category)}
        ${nameLink(it.url, it.name || it.source)}
        ${externalLink(it.url)}
      </div>
      <div class="item-text">${renderBold(it.call || '')}</div>
      ${renderThumbs(it.images)}
    </div>`;
}

function renderDeepRead(it) {
  return `
    <div class="item-card">
      <div class="item-head">
        ${nameLink(it.url, it.name || it.source)}
        ${externalLink(it.url, 'read →')}
      </div>
      ${it.title ? `<div class="item-title">${escapeHtml(it.title)}</div>` : ''}
      <div class="item-text">${renderBold(it.summary || '')}</div>
      ${renderThumbs(it.images)}
    </div>`;
}

function renderChart(it) {
  return `
    <div class="item-card">
      <div class="item-head">
        ${nameLink(it.url, it.name || it.source)}
        ${externalLink(it.url)}
      </div>
      <div class="item-text">${renderBold(it.chart || '')}</div>
      ${renderThumbs(it.images)}
    </div>`;
}

function renderHouseView(hv) {
  const name = hv.name || hv.source || '';
  const nameHtml = hv.url
    ? `<a class="hv-name" href="${escapeAttr(hv.url)}" target="_blank" rel="noopener">${escapeHtml(name)}</a>`
    : `<span class="hv-name">${escapeHtml(name)}</span>`;
  return `
    <div class="hv-row">
      ${nameHtml}
      <span class="hv-stance">${renderBold(hv.stance || '')}</span>
    </div>`;
}

function renderSection(letter, name, items, render, extraClass) {
  if (!items || !items.length) return '';
  const body = items.map(render).join('');
  const cls = 'section' + (extraClass ? (' ' + extraClass) : '');
  return `
    <div class="${cls}">
      <div class="section-head" onclick="toggleSection(this)">
        <span class="section-letter">${letter}</span>
        <span class="section-name">${escapeHtml(name)}</span>
        <span class="section-count">${items.length}</span>
        <span class="section-arrow">▸</span>
      </div>
      <div class="section-body">${body}</div>
    </div>`;
}

function renderSummary(text) {
  if (!text) return '';
  const paragraphs = String(text).split(/\n\n+/).filter(Boolean)
    .map(p => `<p>${renderBold(p)}</p>`).join('');
  return `<div class="summary">${paragraphs}</div>`;
}

function renderTopStats(d) {
  const parts = [];
  const p = d.period || {};
  const is = d.input_stats || {};
  const cv = d.coverage || {};
  if (p.from && p.to)
    parts.push(`period <strong>${escapeHtml(p.from)} → ${escapeHtml(p.to)}</strong>`);
  else if (p.lookback_days != null)
    parts.push(`lookback <strong>${p.lookback_days}d</strong>`);
  if (is.total_articles != null) parts.push(`articles <strong>${is.total_articles}</strong>`);
  if (is.sources_present != null) parts.push(`sources <strong>${is.sources_present}</strong>`);
  if (is.after_filter != null) parts.push(`after filter <strong>${is.after_filter}</strong>`);
  if (cv.coverage_pct != null) {
    const pct = (cv.coverage_pct <= 1 ? cv.coverage_pct * 100 : cv.coverage_pct);
    parts.push(`coverage <strong>${pct.toFixed(0)}%</strong>`);
  } else if (cv.sources_covered != null && cv.sources_total != null) {
    parts.push(`coverage <strong>${cv.sources_covered}/${cv.sources_total}</strong>`);
  }
  return parts.join(' | ');
}

function reportDate(d) {
  if (d.period && d.period.to) return d.period.to;
  if (d.collected_at) return String(d.collected_at).slice(0, 10);
  return '';
}

// ---------- interactions ----------
function toggleSection(headEl) { headEl.parentElement.classList.toggle('open'); }
function openLightbox(src) {
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-img').src = '';
}
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && document.getElementById('lightbox').classList.contains('open')) {
    closeLightbox();
  }
});

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = reportDate(d);
  document.getElementById('stats-top').innerHTML = renderTopStats(d);
  const s = d.sections || {};
  const out = [
    renderSummary(d.summary),
    renderSection('A.', 'Debates — Consensus vs Divergence', s.A_debates,    renderTheme),
    renderSection('B.', 'Key Calls & Positioning',           s.B_calls,      renderCall),
    renderSection('C.', 'Notable Deep Reads',                s.C_deep_reads, renderDeepRead,
                  'section-deepreads'),
    renderSection('D.', 'Charts & Data',                     s.D_charts,     renderChart),
    renderSection('E.', 'House Views',                       s.house_views,  renderHouseView),
  ].join('');
  const app = document.getElementById('app');
  app.innerHTML = out || '<div class="empty">No report data.</div>';

  // Auto-open Summary's section view: first two sections open by default.
  document.querySelectorAll('.section').forEach((sec, i) => {
    if (i < 2) sec.classList.add('open');
  });
}

renderReport(REPORT_DATA);
</script>
