, "entities": ["NVIDIA H100", "B200"], "conviction": "medium", "so_what": "If 180B-class models run usefully on ~$1.5K devices, part of private inference demand can shift from datacenter GPUs to edge/consumer hardware.", "quote": "8× H100 server ≈ US$350K", "locator": "Hardware cost (industry estimate)", "quote_verified": true}, {"claim": "On a CPU-only single-socket AMD EPYC server with 16 threads and no GPU, the 4-bit model generates 18.4-21.0 tokens/s with peak memory of 78.8 GB.", "speaker": "VIDRAFT_LAB", "type": "data_point", "entities": ["AMD EPYC"], "conviction": "high", "so_what": "Usable CPU-only inference speeds for a 180B MoE model strengthen the case for commodity CPU/high-RAM servers in on-prem AI.", "quote": "one server CPU (16 threads) generates 18.4–21.0 tokens/s, peak memory 78.8 GB", "locator": "At a glance", "quote_verified": true}, {"claim": "A gaming laptop with an 8 GB RTX 5060 GPU and 32 GB RAM runs the model at only 4.17 tokens/s by streaming experts from NVMe SSD, while an NVIDIA DGX Spark with 128 GB unified memory reaches about 39 tokens/s on a comparable reference build.", "speaker": "VIDRAFT_LAB", "type": "data_point", "entities": ["RTX 5060", "NVIDIA DGX Spark", "Ryzen AI Max+ 395"], "conviction": "high", "so_what": "Laptop runs are feasible but slow; the practical sweet spot is 96-128 GB unified/high-RAM boxes, a tailwind for large-memory mini PCs and DGX Spark-class products.", "quote": "≈ 39 tok/s (same-size, same-format reference build)", "locator": "5. Measured on real devices", "quote_verified": true}]}, {"theme": "Why MoE + memory-mapping makes it possible", "insights": [{"claim": "Darwin-180B is a Mixture-of-Experts model that activates only 10 of 512 experts per token, so roughly 3B of its 180B parameters are active at any moment.", "speaker": "VIDRAFT_LAB", "type": "causal", "entities": ["Mixture-of-Experts", "Darwin-180B"], "conviction": "high", "so_what": "Sparse MoE architectures decouple total parameter count from compute per token, making storage bandwidth and RAM capacity, not GPU FLOPs, the binding constraint for local inference.", "quote": "Of 512 experts, only 10 are used for each token", "locator": "2. Only 3B of 180B", "quote_verified": true}, {"claim": "llama.cpp memory-maps the weights and reads needed experts directly from SSD, which is how a 111 GB model runs on a laptop with only 32 GB of RAM.", "speaker": "VIDRAFT_LAB", "type": "causal", "entities": ["llama.cpp"], "conviction": "high", "so_what": "Fast NVMe storage becomes part of the AI inference memory hierarchy, a potential demand driver for high-capacity SSDs and DRAM in PCs.", "quote": "reads the experts it needs straight from the SSD", "locator": "llama.cpp memory-maps the weights", "quote_verified": true}]}, {"theme": "Graft quantization and quality retention", "insights": [{"claim": "Rather than re-quantizing from scratch, VIDRAFT used Unsloth's UD-Q4_K_XL build of the base model as a template and replaced only the 300 tensors its self-improvement training changed (in Q8_0), leaving every other byte identical.", "speaker": "VIDRAFT_LAB", "type": "framework", "entities": ["Unsloth", "UD-Q4_K_XL", "Q8_0"], "conviction": "high", "so_what": "Fine-tuners can piggyback on community-quantized base builds, lowering cost and time-to-release for derivative open models.", "quote": "We replace only the 300 tensors that our self-improvement training actually changed", "locator": "3. How we compressed it", "quote_verified": true}, {"claim": "On a 2,000-question MMLU-Pro sample, the 4-bit build scored 87.65%, exactly matching the BF16 original, with zero truncated answers.", "speaker": "VIDRAFT_LAB", "type": "data_point", "entities": ["MMLU-Pro"], "conviction": "high", "so_what": "Claimed lossless 4-bit compression (self-reported, single benchmark) implies little accuracy penalty for local deployment of frontier-ish open models.", "quote": "original 87.65% = 4-bit 87.65%", "locator": "At a glance", "quote_verified": true}, {"claim": "Answers from the fine-tuned model were 14.5% shorter on average than the same-format base model build on the same questions, meaning faster completion at equal token speed.", "speaker": "VIDRAFT_LAB", "type": "data_point", "entities": ["Qwen3.8-Flash-Next"], "conviction": "medium", "so_what": "Reasoning-length efficiency is an underappreciated lever on inference cost alongside raw tokens/s.", "quote": "answers are 14.5% shorter on average", "locator": "Zero truncated answers", "quote_verified": true}]}, {"theme": "Recursive self-improvement training and claimed benchmarks", "insights": [{"claim": "Darwin-180B-RSI is built on Alibaba's Qwen3.8-Flash-Next and trained via model-level recursive self-improvement: the model solves verifiable problems, keeps only its verified-correct solutions, and trains on them with no human-written solutions or reasoning traces.", "speaker": "VIDRAFT_LAB", "type": "framework", "entities": ["Qwen3.8-Flash-Next", "Alibaba", "Darwin-180B-RSI"], "conviction": "high", "so_what": "Self-generated verifiable training data reduces dependence on costly human annotation, compressing the advantage of labs with large labeling budgets.", "quote": "No human-written solutions or reasoning traces are used.", "locator": "6. The technology underneath", "quote_verified": true}, {"claim": "Only attention paths and shared experts are trained; the 512 routed experts, router, n-gram embeddings and MTP head are frozen to preserve the base model's knowledge.", "speaker": "VIDRAFT_LAB", "type": "framework", "entities": ["Mixture-of-Experts"], "conviction": "medium", "so_what": "Narrow, targeted fine-tuning of MoE models is cheap and keeps derivative builds compatible with existing quantized base artifacts.", "quote": "Only the attention paths and shared experts are trained.", "locator": "Only the attention paths", "quote_verified": true}, {"claim": "The R3 round gained +1.03 points over the previous round on 1,000 held-out SuperGPQA questions (95% CI [+0.05, +2.00]), a statistically significant but small improvement.", "speaker": "VIDRAFT_LAB", "type": "data_point", "entities": ["SuperGPQA"], "conviction": "medium", "so_what": "Per-round RSI gains are incremental; investors should not extrapolate runaway self-improvement from this evidence.", "quote": "+1.03 points over the previous round on 1,000 SuperGPQA questions", "locator": "The R3 round compressed here", "quote_verified": true}, {"claim": "VIDRAFT claims (self-reported, using majority voting over multiple samples) that the original model ranks #1 on seven Hugging Face leaderboards, including 100 on AIME 2026 and HMMT Feb 2026 and 94.44 on GPQA Diamond.", "speaker": "VIDRAFT_LAB", "type": "data_point", "entities": ["AIME 2026", "HMMT Feb 2026", "GPQA Diamond", "Hugging Face", "MMMU-Pro", "LEXam"], "conviction": "low", "so_what": "Leaderboard claims are self-reported with majority voting, so they warrant skepticism; still, they signal that open-weight derivatives of Chinese base models compete at the top of public benchmarks.", "quote": "self-reported, majority voting over multiple samples", "locator": "Original Darwin-180B-RSI on official", "quote_verified": true}]}, {"theme": "Go-to-market: sovereign/on-prem AI and China distribution", "insights": [{"claim": "VIDRAFT targets organizations that cannot send data to external clouds, such as defense, finance and the public sector, which can now run a top-tier model offline on an in-house server or a single mini PC.", "speaker": "VIDRAFT_LAB", "type": "thesis", "entities": ["VIDRAFT"], "conviction": "medium", "so_what": "Air-gapped local deployment of strong open models erodes cloud API vendors' hold on regulated sectors and boosts on-prem hardware demand.", "quote": "A top-tier model can now run with no internet connection", "locator": "8. Who it is for", "quote_verified": true}, {"claim": "VIDRAFT says its ModelScope organization holds official Research Institution verification alongside Alibaba's Qwen, Shanghai AI Laboratory, Zhipu AI and OpenBMB, and is the only verified Korean AI organization among those it checked, publishing with a Chinese model card for direct download in China.", "speaker": "VIDRAFT_LAB", "type": "anecdote", "entities": ["ModelScope", "VIDRAFT", "Shanghai AI Laboratory", "Zhipu AI", "OpenBMB"], "conviction": "medium", "so_what": "Smaller labs building on Qwen are deliberately distributing into China's ecosystem, illustrating cross-border open-model diffusion despite geopolitical fragmentation.", "quote": "among the Korean AI organizations we checked, VIDRAFT is the only one verified", "locator": "7. Verified research institution", "quote_verified": true}]}], "insight_total": 15, "top_entities": ["POCKET-Darwin-180B", "Darwin-180B-RSI", "VIDRAFT", "Qwen3.8-Flash-Next", "Alibaba", "llama.cpp", "Unsloth", "MMLU-Pro", "NVIDIA DGX Spark", "H100", "ModelScope", "Mixture-of-Experts"], "source_meta": {"author": "VIDRAFT_LAB", "word_count": 1049, "paywalled": false}}, {"record_id": "131a7709bf1f35f9", "source_type": "technology", "source_name": "InfoQ", "source_url": "https://www.infoq.com/news/2026/10/pizza-bot-ai-agents/", "title": "Pizza Bot: Open-Source Inbox for Background AI Agents", "published_date": "2026-10-04", "language": "en", "processed_at": "2026-10-05T11:04:17Z", "processor": "claude-code-sub-opus", "tags": ["Tech", "AI"], "gist": "AWS developers Joseph Dolivo and Igor Fil open-sourced Pizza Bot, an Apache 2.0, self-hosted, local-first 'inbox' for background AI agents that run on schedules or webhooks, delegate to specialist agents, and pause for human approval. It grew from an internal side project ('JoeBot') for CRM logging that non-technical staff adopted, but ships as a community project without AWS support or SLA.", "themes": [{"theme": "Async inbox UX for ambient agents", "insights": [{"claim": "Pizza Bot reframes agent interaction from a live chat session to an email-style inbox where each thread is a unit of work the user returns to, enabling long-running, unattended agent tasks.", "speaker": "Renato Losio", "type": "framework", "entities": ["Pizza Bot"], "conviction": "high", "so_what": "Signals agent UX shifting from synchronous chat to asynchronous task queues, favoring orchestration/notification layers over chat front-ends.", "quote": "a thread is a unit of work you come back to rather than a session you have to attend.", "locator": "You don’t send an email and", "quote_verified": true}, {"claim": "The design rests on four requirements: agents inspect multiple sources, work in the background, request approval before consequential actions, and notify users on completion; work is organized into All, Unread and Action queues plus an Activity panel for delegated specialist agents.", "speaker": "Renato Losio", "type": "framework", "entities": ["Pizza Bot"], "conviction": "medium", "so_what": "Human-in-the-loop approval gates are becoming a standard primitive for agent products.", "quote": null, "locator": "The design is based on four", "quote_verified": false}, {"claim": "Agents can run scheduled or webhook-triggered tasks, delegate to specialized worker agents, and pause for human approval.", "speaker": "Renato Losio", "type": "data_point", "entities": ["Pizza Bot", "AWS"], "conviction": "medium", "so_what": "Event-driven multi-agent delegation is moving into open-source, self-hosted tooling, commoditizing a layer vendors hope to monetize.", "quote": null, "locator": "A team of developers working at", "quote_verified": false}, {"claim": "The authors told Hacker News they were inspired by a LangChain article about 'ambient agents', indicating the concept is propagating from framework vendors into practitioner tools.", "speaker": "Renato Losio", "type": "anecdote", "entities": ["LangChain", "Hacker News"], "conviction": "medium", "so_what": "'Ambient agents' is an emerging category label worth tracking as a product/market theme.", "quote": null, "locator": "On Hacker News, the authors said", "quote_verified": false}]}, {"theme": "Local-first data control", "insights": [{"claim": "Pizza Bot keeps agent state, threads, checkpoints, attachments and logs in a user-controlled local folder, sends data only to the chosen model provider and explicitly enabled MCP servers, and stores credentials in the OS secret store.", "speaker": "Renato Losio", "type": "data_point", "entities": ["Pizza Bot", "MCP"], "conviction": "high", "so_what": "Local-first, model-agnostic agent runtimes reduce lock-in to any single model or cloud vendor.", "quote": null, "locator": "Pizza Bot persists agent state, threads", "quote_verified": false}, {"claim": "The authors caution that enabled MCP servers can act on the user's behalf, flagging third-party tool servers as a trust and security surface.", "speaker": "Renato Losio", "type": "causal", "entities": ["MCP"], "conviction": "medium", "so_what": "MCP server trust is a growing attack surface, supporting demand for agent security/governance tooling.", "quote": "Those servers can act on your behalf, which is worth remembering when you install one.", "locator": "You control what leaves the machine.", "quote_verified": true}, {"claim": "Pizza Bot supports multiple model providers, MCP servers and Agent Skills rather than tying users to one model.", "speaker": "Renato Losio", "type": "data_point", "entities": ["Pizza Bot", "Agent Skills", "MCP"], "conviction": "medium", "so_what": "Multi-provider support from AWS staff reinforces model commoditization at the orchestration layer.", "quote": null, "locator": "Described by the authors as an", "quote_verified": false}]}, {"theme": "Origin, adoption and limits", "insights": [{"claim": "The project began in April 2025 as 'JoeBot', a side project to automate tedious CRM logging, and spread from technical users to non-technical colleagues who wanted access.", "speaker": "Renato Losio", "type": "anecdote", "entities": ["JoeBot", "CRM"], "conviction": "medium", "so_what": "Organic internal pull from non-technical staff suggests real demand for background agents automating back-office work like CRM hygiene.", "quote": "as soon as non-technical folks got wind of it, they wanted in, too.", "locator": "On LinkedIn, Dolivo acknowledges that the", "quote_verified": true}, {"claim": "Hacker News commenters questioned whether the crowded field of similar tools leaves room for Pizza Bot and whether the open-source version can recreate the skills and integrations ecosystem that made the internal version successful.", "speaker": "Renato Losio", "type": "contrarian", "entities": ["Hacker News"], "conviction": "medium", "so_what": "Agent value is in integrations ecosystem, not the shell; open-sourcing the shell without the ecosystem may limit traction.", "quote": null, "locator": "On Hacker News, the authors said", "quote_verified": false}, {"claim": "Pizza Bot is a community project rather than an AWS service, with no AWS support or SLA, leaving operation, backup and updates to developers.", "speaker": "Renato Losio", "type": "data_point", "entities": ["AWS", "Pizza Bot"], "conviction": "high", "so_what": "Not an AWS product launch; enterprise adoption friction remains without support/SLA.", "quote": null, "locator": "Pizza Bot is a community project", "quote_verified": false}]}], "insight_total": 10, "top_entities": ["Pizza Bot", "AWS", "Joseph Dolivo", "Igor Fil", "MCP", "LangChain", "Hacker News", "JoeBot", "Agent Skills"], "source_meta": {"author": "Renato Losio", "word_count": 1070, "paywalled": false}}, {"record_id": "508aec22a5d1877c", "source_type": "technology", "source_name": "InfoQ", "source_url": "https://www.infoq.com/news/2026/10/gitlab-critical-vulnerabilities/", "title": "GitLab Vulnerability Under Active Exploitation Enables Unauthenticated Data Exfiltration", "published_date": "2026-10-03", "language": "en", "processed_at": "2026-10-05T11:04:17Z", "processor": "claude-code-sub-opus", "tags": ["Tech"], "gist": "CVE-2026-85706, a CVSS 10.0 path-traversal flaw in self-managed GitLab CE/EE (18.7–19.3.1), lets unauthenticated attackers read arbitrary server files—including CI/CD variables and runner tokens—if just one public project exists; it was patched Sept 11, probed in the wild within hours, and added to CISA's KEV catalog. Experts stress that patching must be paired with rotating already-exposed secrets and auditing builds.", "themes": [{"theme": "Severity and exploitation", "insights": [{"claim": "CVE-2026-85706 is a CVSS 10.0 path-traversal flaw in the GitLab repository commits API that lets unauthenticated remote attackers read arbitrary files on self-managed GitLab CE/EE servers.", "speaker": "Sergio De Simone", "type": "data_point", "entities": ["GitLab", "CVE-2026-85706"], "conviction": "high", "so_what": "Maximum-severity flaw in core DevOps infrastructure raises software supply-chain risk for self-hosted GitLab customers.", "quote": null, "locator": "CVE-2026-85706 is a critical GitLab", "quote_verified": false}, {"claim": "Affected versions are GitLab CE/EE 18.7 through 19.1.7, 19.2 through 19.2.5, and 19.3 through 19.3.1.", "speaker": "Sergio De Simone", "type": "data_point", "entities": ["GitLab"], "conviction": "high", "so_what": "Broad version span means a large installed base is exposed.", "quote": null, "locator": "The vulnerability, affecting all GitLab CE/EE", "quote_verified": false}, {"claim": "Exploitation only requires that the GitLab instance have at least one public project, with no authentication step after that.", "speaker": "Sergio De Simone", "type": "causal", "entities": ["GitLab", "watchTowr"], "conviction": "high", "so_what": "Low exploitation bar implies widespread compromise of internet-facing instances is plausible.", "quote": "One public project has to exist. After that there is no authentication step.", "locator": "Chief information security officer Parker Brisette", "quote_verified": true}, {"claim": "GitLab patched on September 11; watchTowr reported in-the-wild probes within hours of disclosure, and CISA then added the flaw to its Known Exploited Vulnerabilities catalog.", "speaker": "Sergio De Simone", "type": "data_point", "entities": ["GitLab", "watchTowr", "CISA"], "conviction": "high", "so_what": "Patch-to-exploit windows have collapsed to hours, increasing value of rapid patching and exposure-management tools.", "quote": null, "locator": "The vulnerability was reported by Mohamed", "quote_verified": false}]}, {"theme": "Supply-chain blast radius", "insights": [{"claim": "Because GitLab servers hold CI/CD variables, runner tokens and logged secrets, file-read access can be leveraged to compromise CI/CD pipelines and pivot into other systems GitLab can reach.", "speaker": "Sergio De Simone", "type": "causal", "entities": ["GitLab"], "conviction": "high", "so_what": "Source-control/CI compromise is a high-leverage supply-chain vector, supporting spend on secrets management and CI security.", "quote": "On a GitLab server the arbitrary files are CI/CD variables, runner tokens, and whatever the logs picked up.", "locator": "Chief information security officer Parker Brisette", "quote_verified": true}, {"claim": "Patching does not undo prior theft: deploy tokens, CI variables and SSH keys already copied must be rotated, and teams should check which packages and images builds pulled while old credentials were valid.", "speaker": "Sergio De Simone", "type": "contrarian", "entities": ["GitLab"], "conviction": "high", "so_what": "Incident cost extends well beyond patching to credential rotation and artifact provenance audits.", "quote": "Patching stops new reads. It doesn't revoke the deploy tokens, CI variables, and SSH keys an attacker already copied.", "locator": "Commenting on the disclosure, cybersecurity executive", "quote_verified": true}]}, {"theme": "Remediation", "insights": [{"claim": "watchTowr advises defenders to hunt logs for HTTP POST requests to /api/v4/projects/{id}/repository/commits/ URIs containing file.path parameters to detect exploitation attempts.", "speaker": "Sergio De Simone", "type": "framework", "entities": ["watchTowr", "GitLab"], "conviction": "medium", "so_what": "Concrete IOC enables detection; demand for threat-hunting/log analytics services after such events.", "quote": null, "locator": "In addition to patching any public-facing", "quote_verified": false}, {"claim": "Fixed versions are 19.3.2, 19.2.6 and 19.1.8, and two weeks later GitLab backported the fix to end-of-life versions 19.0.9 and 18.11.12, signaling the severity of the issue.", "speaker": "Sergio De Simone", "type": "data_point", "entities": ["GitLab"], "conviction": "medium", "so_what": "Backporting to EOL releases indicates GitLab sees material customer exposure on old versions.", "quote": null, "locator": "To patch affected systems, self-managed GitLab", "quote_verified": false}]}], "insight_total": 8, "top_entities": ["GitLab", "CVE-2026-85706", "watchTowr", "CISA", "Christopher Houser", "Parker Brisette", "Mohamed Abdelaiz"], "source_meta": {"author": "Sergio De Simone", "word_count": 1035, "paywalled": false}}, {"record_id": "d519e813f1bbb575", "source_type": "technology", "source_name": "InfoQ", "source_url": "https://www.infoq.com/news/2026/10/open-APPA-zero-security-breach/", "title": "New Archestra's OpenAPPA Saturates Two Major Security Benchmarks with a 0% Attack Success Rate", "published_date": "2026-10-03", "language": "en", "processed_at": "2026-10-05T11:04:17Z", "processor": "claude-code-sub-opus", "tags": ["Tech", "AI"], "gist": "Archestra released OpenAPPA, an open-source, deterministic information-flow security engine for LLM agents that runs outside the agent loop, labeling data by audience and trust via a lattice algebra. On Bench-Corp and OWASP AgentThreatBench it reports a 0% attack success rate with 89% task completion, versus 10%/90% for Claude Code's auto mode and 31%/41% for Microsoft FIDES.", "themes": [{"theme": "Critique of model-as-judge agent security", "insights": [{"claim": "Archestra argues that the industry's answer to approval fatigue—a second model judging each tool call, as in Claude Code's auto mode and Codex's auto-review—cannot track data flow across tool calls.", "speaker": "Bruno Couriol", "type": "contrarian", "entities": ["Claude Code", "Codex", "OpenAPPA"], "conviction": "high", "so_what": "Challenges the dominant LLM-classifier approach to agent safety, opening space for deterministic policy-engine vendors.", "quote": "By design, they cannot track data flow across tool calls.", "locator": "The industry’s answer to approval fatigue", "quote_verified": true}, {"claim": "Because classifiers are themselves prompt-injectable, harnesses hide tool outputs from them, so the judge never sees the data it should be policing.", "speaker": "Bruno Couriol", "type": "causal", "entities": ["OpenAPPA"], "conviction": "high", "so_what": "Structural blind spot in classifier-based guardrails is a durable argument for out-of-loop enforcement.", "quote": "harnesses hide tool outputs from them, so the judge never sees the data at all.", "locator": "The industry’s answer to approval fatigue", "quote_verified": true}, {"claim": "Probabilistic judges top out around 99.3% accuracy, which at millions of tool calls still means many breaches.", "speaker": "Bruno Couriol", "type": "data_point", "entities": ["OpenAPPA"], "conviction": "medium", "so_what": "At agent scale, small error rates translate into frequent incidents—favoring deterministic controls for enterprise deployment.", "quote": "even the best top out at 99.3%: at millions of calls, 0.7% is a lot of breaches.", "locator": "The industry’s answer to approval fatigue", "quote_verified": true}, {"claim": "Simple allowlists/denylists fail because agents route around them (e.g., replacing a denied rm -rf with an equivalent Python script), while tightening rules destroys utility.", "speaker": "Bruno Couriol", "type": "causal", "entities": [], "conviction": "medium", "so_what": "The security-utility tradeoff is the core unsolved problem for enterprise agent adoption.", "quote": null, "locator": "On the one hand, agents have", "quote_verified": false}, {"claim": "OpenAPPA frames agent security as two axes: permitting unauthorized flows makes an agent unsafe, and refusing valid work makes it useless.", "speaker": "Bruno Couriol", "type": "framework", "entities": ["OpenAPPA"], "conviction": "high", "so_what": "Benchmarks that score only security are misleading; buyers should demand joint utility/security metrics.", "quote": "Agent security has two axes: an agent that permits unauthorized flows is unsafe, and an agent that refuses valid work is useless.", "locator": "OpenAPPA’s GitHub repository reminds developers", "quote_verified": true}]}, {"theme": "APPA information-flow design", "insights": [{"claim": "OpenAPPA implements the Agentic Permissions Policy Algebra (APPA), a pluggable engine running outside the agent's loop so the model cannot inspect, negotiate with or bypass policy rules, configured via a single appa.toml file.", "speaker": "Bruno Couriol", "type": "framework", "entities": ["OpenAPPA", "APPA", "Archestra"], "conviction": "high", "so_what": "Out-of-band deterministic enforcement is a differentiated architecture in the agent-security market.", "quote": null, "locator": "OpenAPPA implements this approach with a", "quote_verified": false}, {"claim": "Data is jointly labeled by audience and trust, with labels composing monotonically in a lattice so they only become more restrictive: reading restricted records narrows the audience and reading unvetted web pages lowers trust.", "speaker": "Bruno Couriol", "type": "framework", "entities": ["OpenAPPA"], "conviction": "high", "so_what": "Applies classic information-flow control to LLM agents, a formally grounded approach that can be audited.", "quote": null, "locator": "OpenAPPA jointly labels and monitors both", "quote_verified": false}, {"claim": "Each tool contract specifies requires (needed audience/trust), delta (restrictions applied to returned data) and effects (audit trail), so e.g. reading a suspicious web page automatically blocks a later apply_db_migration call requiring trusted data.", "speaker": "Bruno Couriol", "type": "framework", "entities": ["OpenAPPA"], "conviction": "medium", "so_what": "Declarative tool contracts make agent permissions auditable, appealing to regulated enterprises.", "quote": null, "locator": "Each tool contract defines three primary", "quote_verified": false}, {"claim": "Recovery semantics let blocked actions proceed safely: sanitizers (e.g., PII stripping) widen permitted audience, authorities route single actions to humans or verification APIs, and disposable child branches isolate untrusted reads in transient subagents returning schema-attested outputs.", "speaker": "Bruno Couriol", "type": "framework", "entities": ["OpenAPPA"], "conviction": "high", "so_what": "Recovery paths are the mechanism for preserving utility under strict security—key to commercial viability.", "quote": null, "locator": "OpenAPPA additionally has explicit recovery semantics.", "quote_verified": false}]}, {"theme": "Benchmark results", "insights": [{"claim": "On Bench-Corp and OWASP AgentThreatBench, OpenAPPA reports a 0% attack success rate with 89% task completion, versus Claude Code auto mode's 10% attack success at 90% completion and Microsoft FIDES's 31% attack success at 41% completion.", "speaker": "Bruno Couriol", "type": "data_point", "entities": ["OpenAPPA", "Claude Code", "Microsoft FIDES", "Bench-Corp", "AgentThreatBench"], "conviction": "high", "so_what": "If replicated, deterministic IFC beats both frontier-lab classifiers and Microsoft's approach, pressuring incumbents' agent-safety positioning.", "quote": null, "locator": "The Bench-Corp and OWASP AgentThreatBench benchmarks", "quote_verified": false}, {"claim": "Ablations show task completion fell to 35.0% when remedy plans were disabled, indicating recovery strategies drive most of the utility retained under strict policy.", "speaker": "Bruno Couriol", "type": "data_point", "entities": ["OpenAPPA"], "conviction": "medium", "so_what": "Utility under security hinges on recovery design, not just enforcement.", "quote": null, "locator": "The Bench-Corp and OWASP AgentThreatBench benchmarks", "quote_verified": false}, {"claim": "AgentThreatBench operationalizes the OWASP Top 10 for Agentic Applications (2026) and was merged into the UK AI Safety Institute's inspect_evals repository, lending it institutional standing.", "speaker": "Bruno Couriol", "type": "data_point", "entities": ["AgentThreatBench", "OWASP", "UK AI Safety Institute"], "conviction": "medium", "so_what": "Standardized agent-security benchmarks are emerging, which will shape procurement and vendor comparisons.", "quote": null, "locator": "Bench-Corp and AgentThreatBench test explicit policy", "quote_verified": false}, {"claim": "Results are self-reported by the Archestra team and OpenAPPA is still in preview, with the formal algebra published on arXiv.", "speaker": "Bruno Couriol", "type": "data_point", "entities": ["Archestra", "OpenAPPA", "arXiv"], "conviction": "medium", "so_what": "Treat benchmark claims as vendor-reported and early-stage pending independent validation.", "quote": null, "locator": "OpenAPPA is currently a preview.", "quote_verified": false}]}], "insight_total": 13, "top_entities": ["OpenAPPA", "Archestra", "APPA", "Claude Code", "Microsoft FIDES", "Codex", "Bench-Corp", "AgentThreatBench", "OWASP", "UK AI Safety Institute"], "source_meta": {"author": "Bruno Couriol", "word_count": 1447, "paywalled": false}}, {"record_id": "0402c90684891239", "source_type": "technology", "source_name": "SemiWiki", "source_url": "https://semiwiki.com/semiconductor-services/flow-accel/374063-ceo-interview-with-joel-jorgensen-of-flowaccel/", "title": "CEO Interview with Joel Jorgensen of FlowAccel - Semiwiki", "published_date": "2026-10-04", "language": "en", "processed_at": "2026-10-05T11:04:20Z", "processor": "claude-code-sub-opus", "tags": ["Tech", "AI"], "gist": "Promotional SemiWiki CEO interview with ex-Intel engineer Joel Jorgensen, whose consultancy FlowAccel argues that silicon programs slip because of poorly designed workflows (handoffs, validation cycles, workarounds) rather than technical difficulty. He cites a 50% post-silicon validation cycle-time cut and a $400M/yr labor-hour savings opportunity identified at Intel, and says AI will make mapping development flows much cheaper.", "themes": [{"theme": "Workflow, not technology, drives schedule slips", "insights": [{"claim": "FlowAccel's founder argues that time lost between chip-development milestones (stalled handoffs, overlong validation cycles, unowned workarounds) is a workflow problem that teams wrongly treat as a technical problem and throw more engineering at.", "speaker": "Daniel Nenni", "type": "thesis", "entities": ["FlowAccel"], "conviction": "high", "so_what": "Execution efficiency, not headcount, may be an underappreciated lever on semiconductor roadmap delivery and R&D margins.", "quote": "Teams treat these as technical problems and throw more engineering at them. They’re workflow problems.", "locator": "What problems are you solving?", "quote_verified": true}, {"claim": "Jorgensen frames a development organization as a circuit: knowledge flows like current, milestones are registers, and the work between them is logic; poorly designed logic makes programs slip regardless of engineer quality.", "speaker": "Daniel Nenni", "type": "framework", "entities": ["FlowAccel"], "conviction": "high", "so_what": "Offers a lens for diligence on chip-company execution: look at inter-milestone process, not just talent.", "quote": "Milestones are the registers. The work between them is the logic.", "locator": "Knowledge and information flow through", "quote_verified": true}, {"claim": "On one program that was a month late on a five-week tape-in schedule, cutting post-silicon validation cycle time by 50% across ten steppings recovered the delay.", "speaker": "Daniel Nenni", "type": "anecdote", "entities": ["Intel"], "conviction": "high", "so_what": "Validation cycle time is a material, compressible component of chip time-to-market.", "quote": "We cut post-silicon validation cycle time 50% across ten steppings and recovered it.", "locator": "One example from my own career", "quote_verified": true}, {"claim": "Jorgensen's workflow-acceleration work at Intel over eight years identified a $400M-per-year labor-hour savings opportunity and trained 1,700 people in workflow design.", "speaker": "Daniel Nenni", "type": "data_point", "entities": ["Intel"], "conviction": "medium", "so_what": "Suggests large engineering-productivity slack inside big semiconductor R&D organizations.", "quote": "That work delivered a $400M per year labor-hour savings opportunity and trained 1,700 people in workflow design.", "locator": "I started as an analog circuit", "quote_verified": true}]}, {"theme": "Industry pressure on chip engineering orgs", "insights": [{"claim": "In the semiconductor industry usually only the top few companies are profitable, so even in good times leaders worry about survival while delivering the current roadmap and preparing the next.", "speaker": "Daniel Nenni", "type": "thesis", "entities": [], "conviction": "medium", "so_what": "Winner-take-most profitability raises the stakes on execution speed for sub-scale chip companies.", "quote": "In this industry, usually only the top few companies are profitable.", "locator": "What keeps your customers up at night?", "quote_verified": true}, {"claim": "Once a semiconductor business matures, the expectation is more output, faster, without adding headcount.", "speaker": "Daniel Nenni", "type": "causal", "entities": [], "conviction": "medium", "so_what": "Mature chip firms face margin-driven productivity mandates, creating demand for efficiency tools and services.", "quote": "Once a business matures, the expectation is more output, faster, without adding headcount.", "locator": "VPs worry about delivering the roadmap.", "quote_verified": true}, {"claim": "Jorgensen expects AI to speed up change in how chip products get built and to be disruptive until the industry figures out how to use it well.", "speaker": "Daniel Nenni", "type": "prediction", "entities": ["AI"], "conviction": "medium", "so_what": "AI adoption in chip development may cause a transitional period of disruption before productivity gains.", "quote": "It will speed up change and be disruptive until we figure out how to use it well.", "locator": "Now AI is changing how products", "quote_verified": true}]}, {"theme": "Positioning and AI-enabled flow mapping", "insights": [{"claim": "Jorgensen positions FlowAccel against large consulting firms, agile coaches, tool vendors and headcount additions, arguing those top-down canned models do not stick and that he instead starts with how engineers actually work.", "speaker": "Daniel Nenni", "type": "contrarian", "entities": ["FlowAccel"], "conviction": "low", "so_what": "Signals skepticism of generic transformation consulting in specialized semiconductor engineering.", "quote": "There are no one-size-fits-all solutions that stick.", "locator": "Leaders have options. Large consulting firms.", "quote_verified": true}, {"claim": "AI can sharply reduce the engineering time needed to map a development flow, replacing interviews, workshops and whiteboards, so teams reach the real bottleneck sooner.", "speaker": "Daniel Nenni", "type": "prediction", "entities": ["AI"], "conviction": "medium", "so_what": "AI-driven process discovery could lower the cost of engineering-ops consulting and broaden its market.", "quote": "Mapping a development flow has always taken a lot of engineering time: interviews, workshops, whiteboards. AI changes that.", "locator": "Faster ways to see the work.", "quote_verified": true}]}], "insight_total": 9, "top_entities": ["FlowAccel", "Joel Jorgensen", "Intel", "Steven Spear", "High Velocity Edge", "ISSCC"], "source_meta": {"author": "Daniel Nenni", "word_count": 1095, "paywalled": false}}, {"record_id": "68635ade3de0800c", "source_type": "technology", "source_name": "SemiWiki", "source_url": "https://semiwiki.com/eda/374287-ai-eda-agents-can-prove-their-value/", "title": "AI-EDA Agents Can Prove Their Value - Semiwiki", "published_date": "2026-10-04", "language": "en", "processed_at": "2026-10-05T11:04:20Z", "processor": "claude-code-sub-opus", "tags": ["Tech", "AI"], "gist": "Argues focused AI-EDA agent startups (e.g., ChipAgents in timing closure) can win by shortening one expensive engineering feedback loop rather than replacing the EDA stack, but must prove repeatable, trusted-tool-correlated value before incumbents make EDA AI-native. Predicts a two-phase market: startups prove value in narrow loops, then large EDA platforms absorb, partner with, or acquire them.", "themes": [{"theme": "Wedge strategy: one expensive loop at a time", "insights": [{"claim": "An AI-EDA startup does not need to replace the EDA stack to create value; it can enter one expensive engineering loop, shorten it, and work around tools engineers already trust.", "speaker": "Moh Kolb", "type": "thesis", "entities": ["EDA"], "conviction": "high", "so_what": "Point-solution AI-EDA startups have a viable go-to-market without displacing incumbents.", "quote": "A startup does not need to replace the EDA stack to create value.", "locator": "A startup does not need", "quote_verified": true}, {"claim": "In timing closure the design change itself may be quick, but discovering its real impact via synthesis, STA and PPA analysis takes much longer, so AI's opportunity is to cut the cost of the feedback loop rather than to make the change.", "speaker": "Moh Kolb", "type": "causal", "entities": ["ChipAgents", "STA", "PPA"], "conviction": "high", "so_what": "Value capture in AI-EDA lies in reducing iteration latency/compute, a measurable ROI metric.", "quote": "The opportunity for AI is therefore not simply to make another design change.", "locator": "Its recent timing-closure work focuses", "quote_verified": true}, {"claim": "The author expects agentic EDA to enter production one expensive engineering loop at a time (timing closure, verification triage, debug, coverage closure, root-cause analysis), judged by measurable outcomes like fewer iterations and less engineering time rather than autonomous full-chip design.", "speaker": "Moh Kolb", "type": "prediction", "entities": ["EDA"], "conviction": "medium", "so_what": "Expect adoption to be incremental and metric-driven; full autonomous chip design claims are a weaker signal.", "quote": "one expensive engineering loop at a time.", "locator": "And that may be how agentic EDA", "quote_verified": true}, {"claim": "Fast feedback changes the economics of iteration: an agent that rejects poor choices early and reduces the number of full synthesis or STA runs saves engineering time, since the cost of a design decision is the delay to learn whether it worked.", "speaker": "Moh Kolb", "type": "causal", "entities": ["STA"], "conviction": "high", "so_what": "Fewer full-tool runs could reduce EDA compute/license usage per design, a subtle second-order effect on incumbents' metered revenue.", "quote": "The cost is the delay required to discover whether the edit was actually useful.", "locator": "In advanced semiconductor development, the cost", "quote_verified": true}]}, {"theme": "Proving value: repeatability and correlation", "insights": [{"claim": "A successful AI-EDA demo proves capability but not a scalable product; the real test is repeatable convergence across many designs, architectures, process technologies and libraries.", "speaker": "Moh Kolb", "type": "contrarian", "entities": ["EDA"], "conviction": "high", "so_what": "Investors should discount demo-driven AI-EDA claims and ask for breadth of validated designs.", "quote": "A successful demonstration proves capability.", "locator": "The Hard Question Is Repeatability", "quote_verified": true}, {"claim": "The key metric for an AI-EDA agent is how closely and stably its fast estimate predicts trusted synthesis and STA results; if correlation varies sharply by design, block, corner or starting point, the workflow becomes hard to trust.", "speaker": "Moh Kolb", "type": "framework", "entities": ["STA"], "conviction": "high", "so_what": "Correlation with sign-off tools is the diligence metric separating infrastructure from demos.", "quote": "How closely does the fast AI feedback predict the downstream engineering result?", "locator": "Correlation Matters More Than Activity", "quote_verified": true}, {"claim": "Agentic activity (more iterations, analyses, suggestions) is not engineering value; value must show as fewer expensive iterations, faster convergence, better root-cause identification, stronger PPA tradeoffs, lower effort, repeatable results and trusted-tool agreement.", "speaker": "Moh Kolb", "type": "thesis", "entities": ["PPA"], "conviction": "high", "so_what": "Beware vanity metrics like agent counts in AI-EDA pitches.", "quote": "But activity is not the same as engineering value.", "locator": "Agentic systems can generate a lot", "quote_verified": true}, {"claim": "The author proposes customers evaluate AI-EDA agents on accuracy, repeatability, convergence, breadth, tradeoff control, human intervention, integration and productivity rather than how many agents are in the system.", "speaker": "Moh Kolb", "type": "framework", "entities": ["EDA"], "conviction": "medium", "so_what": "Provides a checklist for evaluating AI-EDA vendors' commercial traction.", "quote": null, "locator": "What Should Customers Measure?", "quote_verified": false}]}, {"theme": "Incumbent advantage and the startup window", "insights": [{"claim": "Large EDA companies hold a structural advantage by owning implementation, verification, simulation, timing analysis, physical design, sign-off, IP, design databases and customer workflows, plus long-standing foundry relationships, letting them place AI beside the engines that generate engineering data.", "speaker": "Moh Kolb", "type": "thesis", "entities": ["EDA"], "conviction": "high", "so_what": "Supports incumbent EDA vendors as eventual AI winners via data and integration moats.", "quote": "An incumbent can eventually place AI directly beside the underlying engines that generate the engineering data.", "locator": "The Large EDA Companies Have a Structural", "quote_verified": true}, {"claim": "Standalone AI-EDA startups face the strategic question of why customers should add another platform if similar intelligence becomes native to tools they already use, so they have a limited window to prove value before EDA becomes AI-native.", "speaker": "Moh Kolb", "type": "prediction", "entities": ["EDA"], "conviction": "high", "so_what": "Startup AI-EDA valuations hinge on time-to-proof before incumbents ship native equivalents.", "quote": "prove meaningful engineering value before EDA itself becomes AI-native.", "locator": "The startup window therefore exists here:", "quote_verified": true}, {"claim": "The AI-EDA market may develop in two phases: specialized startups prove value in narrow loops, then larger platforms absorb, reproduce, partner with, or acquire the capabilities that prove important.", "speaker": "Moh Kolb", "type": "prediction", "entities": ["EDA"], "conviction": "medium", "so_what": "Points to M&A as a likely exit path for successful AI-EDA startups.", "quote": "Then larger platforms absorb, reproduce, partner with, or acquire the capabilities that prove important.", "locator": "The Real Competitive Test", "quote_verified": true}, {"claim": "A startup need not beat incumbents everywhere; becoming important enough in one or more workflows can make it a broader platform, an independent layer, a partner, or an acquisition target.", "speaker": "Moh Kolb", "type": "framework", "entities": ["EDA"], "conviction": "medium", "so_what": "Outcome distribution for AI-EDA startups skews toward partnership/acquisition.", "quote": "It only needs to become important enough in one or more workflows that the capability becomes strategic.", "locator": "The startup does not need to beat", "quote_verified": true}]}, {"theme": "Integration over autonomy", "insights": [{"claim": "The AI-EDA companies that create the most value may be those that integrate most naturally with existing flows rather than those claiming the highest autonomy, since keeping established tools as the final reference lowers the trust barrier.", "speaker": "Moh Kolb", "type": "contrarian", "entities": ["EDA"], "conviction": "medium", "so_what": "Favor AI-EDA plays positioned as acceleration layers over full-autonomy narratives.", "quote": "The AI becomes an acceleration layer.", "locator": "Integration May Matter More Than Autonomy", "quote_verified": true}, {"claim": "In ChipAgents' approach, the agent does not replace synthesis or STA or act as sign-off authority; its stack runs from a hardware-focused LLM through specialized agents, EDA interaction and orchestration to trusted synthesis and STA confirmation.", "speaker": "Moh Kolb", "type": "data_point", "entities": ["ChipAgents", "STA"], "conviction": "medium", "so_what": "Illustrates how AI-EDA startups are architected to complement, not displace, incumbent sign-off tools.", "quote": "It does not have to become the sign-off authority.", "locator": "The agent does not have to replace synthesis.", "quote_verified": true}]}], "insight_total": 14, "top_entities": ["ChipAgents", "EDA", "STA", "PPA", "timing closure", "synthesis", "sign-off", "foundry"], "source_meta": {"author": "Moh Kolb", "word_count": 1632, "paywalled": false}}, {"record_id": "87e2b5be67671ceb", "source_type": "technology", "source_name": "SemiWiki", "source_url": "https://semiwiki.com/forum/threads/25996", "title": "As public fears of AI grow, Trump digs in on voluntary safeguards", "published_date": "2026-10-04", "language": "en", "processed_at": "2026-10-05T11:04:20Z", "processor": "claude-code-sub-opus", "tags": ["AI", "Society", "Geopolitics"], "gist": "Commentary on a Reuters report that the Trump administration secured a voluntary AI safety agreement with six tech companies, including OpenAI, Google and Nvidia, calling for internal controls and independent audits but no penalties for noncompliance, while a Reuters/Ipsos poll shows three quarters of Americans worry AI firms have not done enough to prevent harm. The author argues voluntary promises cannot build public trust without public reporting, independent scrutiny and enforceable accountability.", "themes": [{"theme": "Voluntary AI safety deal", "insights": [{"claim": "The Trump administration secured a safety agreement with six technology companies, including OpenAI, Google and Nvidia, calling for internal controls and independent audits but specifying no penalties for noncompliance.", "speaker": "B", "type": "data_point", "entities": ["Trump administration", "OpenAI", "Google", "Nvidia", "Reuters"], "conviction": "high", "so_what": "US federal AI regulatory risk for leading AI firms remains light-touch and non-binding for now.", "quote": "It calls for internal controls and independent audits but specifies no penalties for noncompliance.", "locator": "Reuters reports that his administration", "quote_verified": true}, {"claim": "A Reuters/Ipsos poll found three quarters of Americans worry AI companies have not done enough to prevent serious societal harm.", "speaker": "B", "type": "data_point", "entities": ["Reuters/Ipsos"], "conviction": "high", "so_what": "Widening gap between public concern and light regulation raises tail risk of a political backlash or stricter future rules.", "quote": "three quarters of Americans worry AI companies have not done enough to prevent serious societal harm", "locator": "Reuters reports that his administration", "quote_verified": true}]}, {"theme": "Limits of self he planet would have cooled into a tectonically dead world.", "speaker": "James Dinneen", "type": "causal", "entities": ["uranium", "thorium", "potassium"], "conviction": "high", "so_what": "Radiogenic heat underpins plate tectonics and the geomagnetic field, foundational geoscience context.", "quote": "Without this second source, Earth would have long since cooled off and become a tectonically dead planet.", "locator": "Geoneutrinos are produced in processes", "quote_verified": true}, {"claim": "Best estimates suggest each detector site measures a different mantle flux, potentially the first hint that the mantle is not uniformly mixed, contrary to conventional geochemical assumptions.", "speaker": "Mark Chen", "type": "contrarian", "entities": ["Mark Chen", "SNO+"], "conviction": "exploratory", "so_what": "Could overturn a core geochemistry assumption about how radioactive elements are distributed.", "quote": "It could be that that’s the first hint that the mantle is not uniform", "locator": "Major uncertainties remain in interpreting", "quote_verified": true}, {"claim": "The regions producing the most geoneutrinos sit roughly above the two continent-sized LLSVPs (under Africa and the Pacific), suggesting these deep structures may concentrate certain elements.", "speaker": "Mark Chen", "type": "thesis", "entities": ["LLSVPs", "Africa", "Pacific Ocean", "Mark Chen"], "conviction": "exploratory", "so_what": "Links particle physics data to seismology, potentially explaining origins of deep-Earth structures.", "quote": "It could be that [they] concentrate some kinds of elements.", "locator": "The regions that seem to be producing", "quote_verified": true}, {"claim": "Mantle geoneutrino flux appears very high at Borexino, very low at Kamland, and 'pretty in-between' beneath Canada at SNO+, though uncertainties are large.", "speaker": "James Dinneen", "type": "data_point", "entities": ["Borexino", "Kamland", "SNO+"], "conviction": "medium", "so_what": "Preliminary pattern that JUNO data could confirm or refute.", "quote": null, "locator": "In general terms, the geoneutrino flux", "quote_verified": false}, {"claim": "Geoneutrino flux implies radioactive elements could supply anywhere from a small percentage to half of mantle heat, a discrepancy equal to the output of tens of thousands of nuclear power plants.", "speaker": "James Dinneen", "type": "data_point", "entities": ["mantle"], "conviction": "high", "so_what": "Shows how poorly constrained Earth's basic energy budget remains.", "quote": "a discrepancy equivalent to the output of tens of thousands of nuclear power plants", "locator": "Uncertainty also comes from estimates", "quote_verified": true}]}, {"theme": "Measurement uncertainty and methodology", "insights": [{"claim": "Isolating mantle geoneutrinos requires subtracting high-energy particles, wrong-helicity particles, reactor neutrinos, and crustal geoneutrinos mostly from within a few hundred kilometers of the detector, making each estimate model-dependent.", "speaker": "Ryan Bayes", "type": "framework", "entities": ["Ryan Bayes"], "conviction": "high", "so_what": "Results hinge on local geological models; discrepancies may be artifacts of counting methods.", "quote": "They don’t just show up and say, ‘Hi, I’m a geoneutrino.’", "locator": "The uncertainties associated with each detector", "quote_verified": true}, {"claim": "Researchers cannot yet tell whether flux differences reflect real mantle variation or differences in how experiments count geoneutrinos.", "speaker": "William McDonough", "type": "thesis", "entities": ["William McDonough"], "conviction": "high", "so_what": "Cautions against overinterpreting early signals.", "quote": "Are the Italians right? Are the Japanese right? Are they both right? Or is something wrong?", "locator": "If we take it at face value", "quote_verified": true}, {"claim": "SNO+ faces particular local-modeling difficulty from a 1.8-billion-year-old impact basin around the site.", "speaker" // ---------- helpers ----------
// YouTube-aligned hex colors for tinted insight chips (bg = color+"1a", text = color, border = color+"55").
const TYPE_HEX = {
  thesis: '#6366f1', prediction: '#0ea5e9', framework: '#8b5cf6',
  data_point: '#7c3aed', causal: '#d97706', contrarian: '#dc2626',
  anecdote: '#64748b',
};
const CONV_HEX = { high: '#7c3aed', medium: '#ca8a04', low: '#94a3b8', exploratory: '#94a3b8' };
function typeHex(t) { return TYPE_HEX[String(t || '').toLowerCase()] || '#475569'; }
function convHex(c) { return CONV_HEX[String(c || '').toLowerCase()] || '#64748b'; }

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }

// Tinted chip (YouTube style): faint bg, colored text + border.
function tintChip(text, color) {
  return `<span class="chip" style="background:${color}1a;color:${color};border-color:${color}55">${escapeHtml(text)}</span>`;
}
function tagPills(tags) {
  if (!tags || !tags.length) return '';
  return tags.map(t => `<span class="pill tag">${escapeHtml(t)}</span>`).join(' ');
}

// ---------- rendering ----------
// Insight presentation ported from the YouTube digest: type/conviction tinted
// chips, speaker as a 🗣 chip, and entities as indigo chips — all in the meta row
// directly under the claim. Quote treatment is INTENTIONALLY kept as Concepts'
// verbatim + "✓ verified" (stronger than YouTube's ≈ paraphrase wording).
function renderInsight(ins) {
  if (!ins) return '';
  const cls = 'insight' + (ins.type ? (' ' + String(ins.type).toLowerCase()) : '');
  const meta = [];
  if (ins.type) meta.push(tintChip(ins.type, typeHex(ins.type)));
  if (ins.speaker) meta.push(`<span class="chip chip-spk">🗣 ${escapeHtml(ins.speaker)}</span>`);
  if (ins.conviction) meta.push(tintChip('conviction: ' + ins.conviction, convHex(ins.conviction)));
  (ins.entities || []).slice(0, 12).forEach(e => {
    if (e) meta.push(`<span class="chip chip-ent">${escapeHtml(e)}</span>`);
  });
  let quote = '';
  if (ins.quote) {
    const v = ins.quote_verified
      ? `<span class="vmark">✓ verified</span>`
      : `<span class="vmark no">unverified</span>`;
    quote = `<div class="quote">“${escapeHtml(ins.quote)}”${v}</div>`;
  }
  const so = ins.so_what
    ? `<div class="insight-so"><span class="lbl">so what</span>${escapeHtml(ins.so_what)}</div>` : '';
  return `
    <div class="${cls}">
      <div class="insight-claim">${escapeHtml(ins.claim || '')}</div>
      <div class="insight-meta">${meta.join('')}</div>
      ${so}
      ${quote}
    </div>`;
}

function renderTheme(theme) {
  const insights = (theme.insights || []).map(renderInsight).join('');
  return `
    <div class="theme">
      <div class="theme-title">${escapeHtml(theme.theme || 'Theme')}</div>
      ${insights}
    </div>`;
}

function renderCard(card) {
  if (!card) return '';
  const meta = card.source_meta || {};
  const nameHtml = card.source_url
    ? `<a class="source-name" href="${escapeAttr(card.source_url)}" target="_blank" rel="noopener">${escapeHtml(card.source_name || '')}</a>`
    : `<span class="source-name">${escapeHtml(card.source_name || '')}</span>`;
  const subBits = [];
  if (card.published_date) subBits.push(escapeHtml(card.published_date));
  if (meta.author) subBits.push(escapeHtml(meta.author));
  if (meta.word_count) subBits.push(`${meta.word_count} words`);
  if (meta.paywalled) subBits.push('paywalled');
  const themes = (card.themes || []).map(renderTheme).join('');
  const n = card.insight_total != null ? card.insight_total
            : (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
  return `
    <div class="source">
      <div class="source-head" onclick="toggleSource(this)">
        <div class="source-meta-left">
          <div class="source-name-row">${nameHtml}</div>
          <div class="source-title">${escapeHtml(card.title || '')}</div>
          <div class="source-sub">${subBits.join('  ·  ')}</div>
        </div>
        <span class="source-count">${n} insight${n === 1 ? '' : 's'}</span>
        <span class="source-arrow">▸</span>
      </div>
      <div class="source-body">
        ${card.gist ? `<div class="gist">${escapeHtml(card.gist)}</div>` : ''}
        ${card.tags && card.tags.length ? `<div class="tags">${tagPills(card.tags)}</div>` : ''}
        ${themes || '<div class="empty">No insights.</div>'}
      </div>
    </div>`;
}

function renderTopStats(d) {
  const s = d.stats || {};
  const parts = [];
  if (d.date) parts.push(`date <strong>${escapeHtml(d.date)}</strong>`);
  if (s.lookback_days != null) parts.push(`lookback <strong>${s.lookback_days}d</strong>`);
  if (s.sources != null) parts.push(`sources <strong>${s.sources}</strong>`);
  if (s.cards != null) parts.push(`cards <strong>${s.cards}</strong>`);
  if (s.insights != null) parts.push(`insights <strong>${s.insights}</strong>`);
  if (s.quote_verified_pct != null) parts.push(`quotes verified <strong>${s.quote_verified_pct}%</strong>`);
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSource(headEl) { headEl.parentElement.classList.toggle('open'); }

function insightCount(card) {
  return (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
}

// Build the sort/filter control bar (display only — re-groups REPORT_DATA in place).
function buildControls(d) {
  const cards = d.cards || [];
  const names = [...new Set(cards.map(c => c.source_name || '—'))].sort((a, b) => a.localeCompare(b));
  const opts = names.map(n => `<option value="${escapeAttr(n)}">${escapeHtml(n)}</option>`).join('');
  document.getElementById('controls').innerHTML =
    `<label>Sort
       <select id="sortSel">
         <option value="source">Source A–Z</option>
         <option value="insights">Insight count ▼</option>
       </select></label>
     <label>Source
       <select id="srcSel">
         <option value="__all">All sources (${names.length})</option>
         ${opts}
       </select></label>
     <span class="ctl-btns">
       <button type="button" id="expandAll">Expand all</button>
       <button type="button" id="collapseAll">Collapse all</button>
     </span>`;
  document.getElementById('sortSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('srcSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('expandAll').addEventListener('click', () => setAllGroups(false));
  document.getElementById('collapseAll').addEventListener('click', () => setAllGroups(true));
}

// Group-level collapse: header click toggles one group; the control-bar buttons toggle all.
function toggleGroup(headEl) { headEl.parentElement.classList.toggle('collapsed'); }
function setAllGroups(collapsed) {
  document.querySelectorAll('.group').forEach(g => g.classList.toggle('collapsed', collapsed));
}

// Group cards by source, sort groups (and cards within), optionally filter to one source.
function renderGroups(d) {
  const sortMode = (document.getElementById('sortSel') || {}).value || 'source';
  const srcFilter = (document.getElementById('srcSel') || {}).value || '__all';
  let cards = (d.cards || []).slice();
  if (srcFilter !== '__all') cards = cards.filter(c => (c.source_name || '—') === srcFilter);

  const groups = new Map();
  cards.forEach(c => {
    const k = c.source_name || '—';
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(c);
  });
  let entries = [...groups.entries()].map(([name, cs]) => ({
    name, cards: cs, insights: cs.reduce((a, c) => a + insightCount(c), 0),
  }));
  if (sortMode === 'insights') entries.sort((a, b) => b.insights - a.insights || a.name.localeCompare(b.name));
  else entries.sort((a, b) => a.name.localeCompare(b.name));
  // Within each source group, heaviest cards first.
  entries.forEach(e => e.cards.sort((a, b) => insightCount(b) - insightCount(a)));

  const html = entries.map(e => {
    const head = `<div class="group-head" onclick="toggleGroup(this)">`
      + `<span class="group-name">${escapeHtml(e.name)}</span>`
      + `<span class="group-meta">${e.cards.length} card${e.cards.length === 1 ? '' : 's'} · ${e.insights} insights</span>`
      + `<span class="group-arrow">▾</span></div>`;
    return `<div class="group">${head}<div class="group-body">${e.cards.map(renderCard).join('')}</div></div>`;
  }).join('');

  const app = document.getElementById('app');
  app.innerHTML = html || '<div class="empty">No cards for this source.</div>';
  // Open the first two source cards by default.
  document.querySelectorAll('.source').forEach((sec, i) => { if (i < 2) sec.classList.add('open'); });
}

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  document.getElementById('stats-top').innerHTML = renderTopStats(d);
  buildControls(d);
  renderGroups(d);   // default: grouped, sorted by source A–Z
}

renderReport(REPORT_DATA);
</script>
