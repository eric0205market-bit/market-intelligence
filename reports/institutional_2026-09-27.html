ence-sunshine-despite-very-cloudy-skies", "images": []}, {"source": "oxford_economics", "name": "Oxford Economics", "call": "Cuts 2027 global GDP growth forecast to 2.8% and expects Brent to stay above $100/bbl for roughly six months, pushing major central banks toward more hawkish inflation stances.", "category": ["growth", "energy"], "url": "https://www.oxfordeconomics.com/resource/escalating-oil-supply-disruption-pushes-central-banks-to-a-fork-in-the-road/", "images": []}, {"source": "chainalysis", "name": "Chainalysis", "call": "Finds Latin America's crypto economy grew 9.8% to $593.8bn, with Mexico (+25.5%), Argentina (+15.3%) and Venezuela (+107.2%) driving growth even as Brazil, the region's largest market, contracted 1.6%; stablecoins now represent 32% of cross-border value.", "category": ["crypto", "em"], "url": "https://www.chainalysis.com/blog/latin-america-crypto-adoption-2026/", "images": []}, {"source": "wood_mackenzie", "name": "Wood Mackenzie", "call": "Refinery Supply Model finds a proposed US diesel export ban would cut diesel/gasoil output ~800,000 b/d and lift US East Coast gasoline prices ~15% toward record highs while pushing NW Europe diesel prices up ~27% — directly contradicting the policy's stated goal.", "category": ["energy", "geopolitics"], "url": "https://www.woodmac.com/blogs/energy-pulse/us-considers-diesel-export-restrictions/", "images": []}], "C_deep_reads": [{"source": "oaktree", "name": "Oaktree / Howard Marks", "title": "Shall We Repeal the Laws of Economics – Part III", "summary": "In the third installment of this memo series, Howard Marks argues that recent political attempts to force down long-dated government bond yields are fundamentally misguided. The only sustainable way to bring yields down, he argues, is to address the underlying fundamental forces pushing them higher — persistent deficits, rising term premium, AI-driven capital competition — even where that is politically uncomfortable. Any attempt to override those forces through political pressure on the Fed or Treasury mechanics is, in his framing, ultimately just an attempt to repeal the laws of economics, which historically never works and tends to store up larger problems for later.", "url": "https://www.oaktreecapital.com/insights/memo-podcast/shall-we-repeal-the-laws-of-economics---part-iii-audio", "images": []}, {"source": "standard_chartered", "name": "Standard Chartered", "title": "Earnings above all – Global Market Outlook", "summary": "Standard Chartered's flagship quarterly outlook (Steve Brice, Manpreet Gill, Raymond Cheng) argues strong AI-driven corporate earnings should let markets weather Middle East oil-price risk, since real (inflation-adjusted) oil prices remain below true 'shock' territory as long as nominal Brent stays under $120-150/bbl. The house now expects two more Fed hikes by mid-2027 (plus three BoJ hikes and one more ECB hike), explicitly likening the backdrop to 1990s rate hikes into strong growth rather than the disruptive 2022 inflation shock. It trims China equities to a core holding while keeping Taiwan as its sole regional overweight, prefers corporate and EM credit over duration, expects modest USD weakness and continued gold gains from EM central-bank demand, and lists global semiconductors, power/electrification stocks, US communication services and euro-area/Japan banks among its opportunistic ideas.", "url": "https://www.sc.com/sg/market-outlook/global-market-outlook-25-9-2026/?mvog=1", "images": []}, {"source": "vanguard", "name": "Vanguard", "title": "Implications of rising bond yields", "summary": "Vanguard's Roger Aliaga-Díaz and Roger Hallam attribute 2026's steady rise in global bond yields to four converging forces: resurgent inflation concern from the Middle East conflict, resilient growth from the US AI buildout and European fiscal tailwinds, a hawkish turn across the Fed, ECB and BoJ simultaneously, and rising competition for capital as elevated sovereign deficits collide with a surge in AI-related corporate bond issuance. They note AI now represents roughly 40% of US equity market cap through the hyperscaler supply chain, and warn that a 10-year Treasury yield settling meaningfully above 5% would raise the discount rate enough to threaten both current equity valuations and AI-capex funding, especially for debt-dependent small/mid-caps. On the fixed-income side, Hallam argues today's yields — the highest in a couple of decades across US and global aggregate indices — offer a substantial income cushion, making the case for owning bonds more compelling despite disappointing 2026 year-to-date returns.", "url": "https://corporate.vanguard.com/content/corporatesite/us/en/corp/vemo/implications-of-rising-bond-yields.html", "images": []}, {"source": "deutsche_bank", "name": "Deutsche Bank", "title": "Annual Outlook 2026 | Economic and Market Outlook", "summary": "Deutsche Bank Global CIO Christian Nolting sets a 'broadly constructive' 2026 outlook across ten investment themes, expecting continued US growth support from tax relief and defense/security spending, a European cyclical boost from Germany's EUR500bn infrastructure fund, and double-digit earnings growth across major regions driven by AI capex spillovers into construction, utilities, industrials and materials. Distinctively, and in contrast to nearly every other house in this collection, DB's outlook still calls for three Fed rate cuts by end-2026 rather than further hikes. On markets: continued US yield-curve normalization, positive real returns for 10yr Bunds/Treasuries, USD stability, gold with 'further upside potential,' and oil stabilizing at low levels; it recommends diversifying into IG/HY credit, gold, private equity and infrastructure alongside equities rather than trying to time the market.", "url": "https://wealth.db.com/en/insights/investing-insights/economic-and-market-outlook/cio-annual-outlook-2026-investing-in-tomorrow.html", "images": []}, {"source": "citi_gps", "name": "Citi GPS", "title": "Global Resilience Sunshine Despite Very Cloudy Skies", "summary": "Citi Research, led by Global Chief Economist Nathan Sheets, raises its global growth forecast to 2.6% for 2026 and 2.8% for 2027, arguing the world economy has proven unusually resilient to the Middle East conflict, oil near $100/bbl, and broad central-bank tightening pushing long-term rates higher. The report credits AI investment as a major growth engine — US AI investment reached nearly $300bn last year and accelerated to a $466bn annualized pace in H1 2026 — lifting global manufacturing PMI to its highest level since 2022 and boosting tech exports across Korea, Taiwan and China, even as political support for AI shows signs of softening in some jurisdictions.", "url": "https://www.citigroup.com/global/insights/global-resilience-sunshine-despite-very-cloudy-skies", "images": []}, {"source": "wood_mackenzie", "name": "Wood Mackenzie", "title": "Renewing renewables: the next chapter in the energy transition", "summary": "Wood Mackenzie's flagship Horizons report argues the global renewables industry is entering an 'energy renewal' era as the first generation of wind and solar assets — more than 3.5TW installed globally by end-2025 — ages out. Over 2.5TW of wind and solar capacity will face decommission-versus-repower decisions by the 2040s, with wind capacity over 20 years old rising from ~50GW today to 230GW by 2040 and 440GW by 2050. WoodMac calculates repowering could lift Germany's post-curtailment onshore wind output by 16% by 2050 (equal to roughly a third of Germany's current wind generation) while cutting German power prices 12-19% in the 2040s. Equipment sales in 2050 could be over 60% higher than in 2026 as decommissioning-driven demand reshapes both investment opportunity (buying and repowering prime sites) and OEM revenue, with mature European markets accounting for over 70% of this activity versus roughly 1% in newer Asian markets.", "url": "https://www.woodmac.com/horizons/renewing-renewables-the-next-chapter-in-the-energy-transition/", "images": []}, {"source": "galaxy_digital", "name": "Galaxy Digital", "title": "Inference Market (and Micro) Structure", "summary": "Galaxy Digital's Vikram Singh argues intelligence is commoditizing at a startling pace: no frontier LLM has held the performance lead for more than 100 days since GPT-4, new models ship roughly every 41 days, and open-source models are catching up to frontier labs within months rather than years — leaving labs only about four months to amortize training capex before spend migrates to open-source alternatives. Token consumption is compounding via a Jevons-paradox effect (OpenRouter routed 125x more tokens in a recent week than in January 2025, with open-source models now 75% of volume), and a genuine market microstructure is emerging: inference providers act as market-makers earning a spread on GPU-hour inventory (130% annualized GPU-hour volatility), while OpenRouter functions as an exchange charging a 5.5% take rate and allocating traffic by 1/price², so a provider that halves its price roughly quadruples its flow share. With over 70% of routed tokens now coming from CLIs/agents rather than humans, Singh argues compute futures could emerge to hedge GPU-hour volatility and inference cost of goods sold.", "url": "https://www.galaxy.com/insights/perspectives/inference-market-and-micro-structure", "images": []}, {"source": "brookings", "name": "Brookings Institution", "title": "Financing the AI buildout", "summary": "A Brookings Papers on Economic Activity study by Stijn Van Nieuwerburgh (Columbia) projects AI infrastructure investment — data centers, power, networking, chips — will total $10.3 trillion from 2025-2032, averaging 3.63% of US GDP per year, proportionally larger than the canal, railroad, electrification, highway or telecom investment booms. The paper's central warning is that financing risk is migrating from transparent, on-balance-sheet corporate financing toward opaque off-balance-sheet structures — joint ventures, private credit, securitization, SPVs, lease commitments and loan guarantees — tied to uncertain AI demand and the credit quality of a small number of data-center tenants. While not yet systemic, Van Nieuwerburgh calls for substantially improved measurement and transparency of the industry's evolving capital structure before the next downturn tests it.", "url": "https://www.brookings.edu/articles/financing-the-ai-buildout/", "images": []}, {"source": "carnegie", "name": "Carnegie Endowment for International Peace", "title": "Untangling the Nuclear Knot", "summary": "Carnegie's Tong Zhao argues US-China nuclear relations are increasingly driven by a widening perception gap rather than deliberate strategic design: each side views its own posture as purely defensive and the other's as expansive. China frames its strategy as strictly deterrence-only and rejects nuclear warfighting, reading US debates over nuclear primacy and damage limitation as evidence of a US warfighting orientation, while the US retains a first-use option under extreme circumstances and is focused on deterring Chinese first use amid Beijing's 'unexplained' arsenal expansion. Because near-term arms-control agreements are unlikely, Zhao argues risk reduction instead depends on both sides more rigorously assessing the costs of their own choices rather than defaulting to worst-case reads of the other's intent, laying out recommendations across six issue areas — strategic objectives, no-first-use credibility, escalation management, strategic stability, missile defense/outer space, and regional proliferation risk — to build transparency and restraint.", "url": "https://carnegieendowment.org/research/2026/09/untangling-the-nuclear-knot-a-constructive-agenda-for-managing-chinas-nuclear-relations-with-the-united-states-and-its-allies", "images": []}, {"source": "bnp_paribas", "name": "BNP Paribas", "title": "View from the markets: Never stop", "summary": "In his final weekly note after 26 years in asset management, Chris Iggo (Chair of the Investment Institute, CIO AXA IM Core) argues bonds are 'more attractive than they have been for years,' expecting fixed-income returns to be 'possibly quite strong' over the next year given a four-year bear market in long-duration bonds has already pushed term premiums up substantially. He sees equities as expensive but earnings-cycle-supported, with the AI narrative now central to performance, and worries AI's growing demand for capital, land, compute, water and electricity will raise the marginal cost of provision across the economy. A sustainable bull market, in his closing view, requires a positive geopolitical turn, a reversal of the protectionist trend, and fiscal-policy change to reinforce private-sector 'animal spirits' — absent which markets could face a shock, which he would nonetheless view as a buying opportunity.", "url": "https://viewpoint.bnpparibas-am.com/view-from-the-markets-never-stop/", "images": []}], "D_charts": [{"source": "ecb", "name": "European Central Bank", "chart": "20-chart package underpinning the ECB's defence-spending macro model: projected euro-area defence spending rising from ~1.5% to 2.5% of GDP by 2035, country-level spending paths (Germany >70% of incremental spend), the GDP-multiplier and inflation-impact panel results, and comparisons of EU vs. US/UK defence R&D intensity.", "url": "https://www.ecb.europa.eu/press/economic-bulletin/articles/2026/html/ecb.ebart202606_02~7e74f747b2.en.html", "images": ["https://www.ecb.europa.eu/press/economic-bulletin/articles/2026/html/ebart202606_02/ecb.ebart202606_02.en_img0.png?36195a2165e63bda2aafe7895f02bcce", "https://www.ecb.europa.eu/press/economic-bulletin/articles/2026/html/ebart202606_02/ecb.ebart202606_02.en_img1.png?2727496538418de69a0d8a56e85c7e6f", "https://www.ecb.europa.eu/press/economic-bulletin/articles/2026/html/ebart202606_02/ecb.ebart202606_02.en_img2.png?7676fcae79166cc0f // ---------- helpers ----------
const CAT_VARS = {
  rates: 'var(--cat-rates)',
  growth: 'var(--cat-growth)',
  fx: 'var(--cat-fx)',
  equities: 'var(--cat-equities)',
  credit: 'var(--cat-credit)',
  crypto: 'var(--cat-crypto)',
  energy: 'var(--cat-energy)',
  commodities: 'var(--cat-commodities)',
  geopolitics: 'var(--cat-geopolitics)',
  ai_tech: 'var(--cat-ai_tech)',
  em: 'var(--cat-em)',
};
function catColor(cat) {
  if (!cat) return 'var(--cat-default)';
  return CAT_VARS[String(cat).toLowerCase()] || 'var(--cat-default)';
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }
function renderBold(text) {
  return escapeHtml(text).replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
}
function pill(cat) {
  if (!cat) return '';
  return `<span class="pill" style="background:${catColor(cat)}">${escapeHtml(cat)}</span>`;
}
function pills(cats) {
  if (!cats) return '';
  if (Array.isArray(cats)) return cats.map(pill).join(' ');
  return pill(cats);
}
function externalLink(url, label) {
  if (!url) return '';
  return `<a class="item-link" href="${escapeAttr(url)}" target="_blank" rel="noopener">${label || 'link →'}</a>`;
}
function nameLink(url, name) {
  if (!name) return '';
  if (!url) return `<span class="item-source">${escapeHtml(name)}</span>`;
  return `<a class="item-source" href="${escapeAttr(url)}" target="_blank" rel="noopener">${escapeHtml(name)}</a>`;
}

// ---------- rendering ----------
function renderThumbs(images) {
  if (!images || !images.length) return '';
  return `<div class="thumbs">` + images.map(u =>
    `<img src="${escapeAttr(u)}" class="thumb" loading="lazy" alt="" onclick="openLightbox('${escapeAttr(u)}')">`
  ).join('') + `</div>`;
}

function renderThemeItem(it) {
  return `
    <div class="theme-item">
      <div class="item-head">
        ${nameLink(it.url, it.name || it.source)}
        ${externalLink(it.url)}
      </div>
      <div class="item-text">${renderBold(it.thesis || '')}</div>
      ${renderThumbs(it.images)}
    </div>`;
}

function renderTheme(theme) {
  const items = (theme.items || []).map(renderThemeItem).join('');
  return `
    <div class="theme">
      <div class="theme-head">
        ${pills(theme.category)}
        <div class="theme-title">${escapeHtml(theme.theme || '')}</div>
      </div>
      <div class="theme-stance">
        ${theme.consensus ? `<div class="theme-line consensus"><span class="lbl">Consensus</span>${renderBold(theme.consensus)}</div>` : ''}
        ${theme.divergence ? `<div class="theme-line divergence"><span class="lbl">Divergence</span>${renderBold(theme.divergence)}</div>` : ''}
      </div>
      ${items ? `<div class="theme-items">${items}</div>` : ''}
    </div>`;
}

function renderCall(it) {
  return `
    <div class="item-card">
      <div class="item-head">
        ${pills(it.category)}
        ${nameLink(it.url, it.name || it.source)}
        ${externalLink(it.url)}
      </div>
      <div class="item-text">${renderBold(it.call || '')}</div>
      ${renderThumbs(it.images)}
    </div>`;
}

function renderDeepRead(it) {
  return `
    <div class="item-card">
      <div class="item-head">
        ${nameLink(it.url, it.name || it.source)}
        ${externalLink(it.url, 'read →')}
      </div>
      ${it.title ? `<div class="item-title">${escapeHtml(it.title)}</div>` : ''}
      <div class="item-text">${renderBold(it.summary || '')}</div>
      ${renderThumbs(it.images)}
    </div>`;
}

function renderChart(it) {
  return `
    <div class="item-card">
      <div class="item-head">
        ${nameLink(it.url, it.name || it.source)}
        ${externalLink(it.url)}
      </div>
      <div class="item-text">${renderBold(it.chart || '')}</div>
      ${renderThumbs(it.images)}
    </div>`;
}

function renderHouseView(hv) {
  const name = hv.name || hv.source || '';
  const nameHtml = hv.url
    ? `<a class="hv-name" href="${escapeAttr(hv.url)}" target="_blank" rel="noopener">${escapeHtml(name)}</a>`
    : `<span class="hv-name">${escapeHtml(name)}</span>`;
  return `
    <div class="hv-row">
      ${nameHtml}
      <span class="hv-stance">${renderBold(hv.stance || '')}</span>
    </div>`;
}

function renderSection(letter, name, items, render, extraClass) {
  if (!items || !items.length) return '';
  const body = items.map(render).join('');
  const cls = 'section' + (extraClass ? (' ' + extraClass) : '');
  return `
    <div class="${cls}">
      <div class="section-head" onclick="toggleSection(this)">
        <span class="section-letter">${letter}</span>
        <span class="section-name">${escapeHtml(name)}</span>
        <span class="section-count">${items.length}</span>
        <span class="section-arrow">▸</span>
      </div>
      <div class="section-body">${body}</div>
    </div>`;
}

function renderSummary(text) {
  if (!text) return '';
  const paragraphs = String(text).split(/\n\n+/).filter(Boolean)
    .map(p => `<p>${renderBold(p)}</p>`).join('');
  return `<div class="summary">${paragraphs}</div>`;
}

function renderTopStats(d) {
  const parts = [];
  const p = d.period || {};
  const is = d.input_stats || {};
  const cv = d.coverage || {};
  if (p.from && p.to)
    parts.push(`period <strong>${escapeHtml(p.from)} → ${escapeHtml(p.to)}</strong>`);
  else if (p.lookback_days != null)
    parts.push(`lookback <strong>${p.lookback_days}d</strong>`);
  if (is.total_articles != null) parts.push(`articles <strong>${is.total_articles}</strong>`);
  if (is.sources_present != null) parts.push(`sources <strong>${is.sources_present}</strong>`);
  if (is.after_filter != null) parts.push(`after filter <strong>${is.after_filter}</strong>`);
  if (cv.coverage_pct != null) {
    const pct = (cv.coverage_pct <= 1 ? cv.coverage_pct * 100 : cv.coverage_pct);
    parts.push(`coverage <strong>${pct.toFixed(0)}%</strong>`);
  } else if (cv.sources_covered != null && cv.sources_total != null) {
    parts.push(`coverage <strong>${cv.sources_covered}/${cv.sources_total}</strong>`);
  }
  return parts.join(' | ');
}

function reportDate(d) {
  if (d.period && d.period.to) return d.period.to;
  if (d.collected_at) return String(d.collected_at).slice(0, 10);
  return '';
}

// ---------- interactions ----------
function toggleSection(headEl) { headEl.parentElement.classList.toggle('open'); }
function openLightbox(src) {
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-img').src = '';
}
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && document.getElementById('lightbox').classList.contains('open')) {
    closeLightbox();
  }
});

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = reportDate(d);
  document.getElementById('stats-top').innerHTML = renderTopStats(d);
  const s = d.sections || {};
  const out = [
    renderSummary(d.summary),
    renderSection('A.', 'Debates — Consensus vs Divergence', s.A_debates,    renderTheme),
    renderSection('B.', 'Key Calls & Positioning',           s.B_calls,      renderCall),
    renderSection('C.', 'Notable Deep Reads',                s.C_deep_reads, renderDeepRead,
                  'section-deepreads'),
    renderSection('D.', 'Charts & Data',                     s.D_charts,     renderChart),
    renderSection('E.', 'House Views',                       s.house_views,  renderHouseView),
  ].join('');
  const app = document.getElementById('app');
  app.innerHTML = out || '<div class="empty">No report data.</div>';

  // Auto-open Summary's section view: first two sections open by default.
  document.querySelectorAll('.section').forEach((sec, i) => {
    if (i < 2) sec.classList.add('open');
  });
}

renderReport(REPORT_DATA);
</script>
