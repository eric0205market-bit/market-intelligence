function toggleReport(){
  document.getElementById('reportCard').classList.toggle('open');
  document.getElementById('reportCaret').textContent =
    document.getElementById('reportCard').classList.contains('open') ? '▴' : '▾';
}

function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}

let activeCat = 'all';
let activeUrg = 'all';
let activeSrc = null;

function catColor(cat){ return CATCOLORS[cat] || '#888'; }

function buildFilters(){
  const cats = {};
  ITEMS.forEach(i => cats[i.cat] = (cats[i.cat]||0)+1);
  const catWrap = document.getElementById('catFilters');
  let html = '<button class="pill active" data-cat="all" onclick="setCat(\'all\')">All <span class="count">'+ITEMS.length+'</span></button>';
  Object.keys(cats).sort().forEach(c => {
    html += '<button class="pill" data-cat="'+c+'" onclick="setCat(\''+c+'\')" style="--c:'+catColor(c)+'">'+c+' <span class="count">'+cats[c]+'</span></button>';
  });
  catWrap.innerHTML = html;

  const urgs = {act:0, deep:0, watch:0};
  ITEMS.forEach(i => urgs[i.urgency]++);
  const urgWrap = document.getElementById('urgFilters');
  urgWrap.innerHTML =
    '<button class="pill active" data-urg="all" onclick="setUrg(\'all\')">All <span class="count">'+ITEMS.length+'</span></button>'+
    '<button class="pill" data-urg="act" onclick="setUrg(\'act\')">🔴 Act Now <span class="count">'+urgs.act+'</span></button>'+
    '<button class="pill" data-urg="deep" onclick="setUrg(\'deep\')">🔵 Deep <span class="count">'+urgs.deep+'</span></button>'+
    '<button class="pill" data-urg="watch" onclick="setUrg(\'watch\')">🟡 Watch <span class="count">'+urgs.watch+'</span></button>';
}

function refreshPillStyles(){
  document.querySelectorAll('.pill[data-cat]').forEach(b=>{
    const c = b.getAttribute('data-cat');
    const isActive = c === activeCat;
    b.classList.toggle('active', isActive);
    if(isActive && c !== 'all'){ b.style.background = catColor(c); b.style.borderColor = catColor(c); }
    else if(isActive){ b.style.background = '#333'; b.style.borderColor = '#333'; }
    else { b.style.background = 'transparent'; b.style.borderColor = 'var(--border)'; b.style.color=''; }
  });
  document.querySelectorAll('.pill[data-urg]').forEach(b=>{
    const u = b.getAttribute('data-urg');
    const isActive = u === activeUrg;
    b.classList.toggle('active', isActive);
    b.style.background = isActive ? '#333' : 'transparent';
    b.style.borderColor = isActive ? '#333' : 'var(--border)';
  });
}

function setCat(c){ activeCat = c; activeSrc = null; renderCards(); refreshPillStyles(); }
function setUrg(u){ activeUrg = u; activeSrc = null; renderCards(); refreshPillStyles(); }

function filterBySrc(name){
  activeSrc = name;
  activeCat = 'all';
  activeUrg = 'all';
  renderCards(true);
  refreshPillStyles();
  document.getElementById('cardsWrap').scrollIntoView({behavior:'smooth'});
}

function renderCards(expandMatches){
  const wrap = document.getElementById('cardsWrap');
  let html = '';
  ITEMS.forEach((item, idx) => {
    const catMatch = activeCat === 'all' || item.cat === activeCat;
    const urgMatch = activeUrg === 'all' || item.urgency === activeUrg;
    const srcMatch = !activeSrc || item.source.indexOf(activeSrc) !== -1;
    if(!(catMatch && urgMatch && srcMatch)) return;
    const openCls = (activeSrc && srcMatch) ? ' open' : '';
    const chartIcon = item.charts.count > 0 ? '<span class="chart-icon">'+(item.charts.hot?'🔥':'📊')+'</span>' : '';
    html += '<div class="card'+openCls+'" id="card-'+item.id+'">';
    html += '  <div class="card-header" onclick="toggleCard('+item.id+')">';
    html += '    <span class="idx">'+String(idx+1).padStart(2,'0')+'</span>';
    html += '    <span class="urg">'+(item.urgency==='act'?'🔴':item.urgency==='deep'?'🔵':'🟡')+'</span>';
    html += '    <span class="src-badge" style="background:'+catColor(item.cat)+'">'+item.source.split(' / ')[0]+'</span>';
    html += '    <span class="cat-tag">'+item.cat+'</span>';
    html += '    '+chartIcon;
    html += '    <span class="card-title">'+item.title+'</span>';
    html += '    <span class="caret">▾</span>';
    html += '  </div>';
    html += '  <div class="card-body">';
    html += '    <div class="section-label">The Idea</div>';
    html += '    <div class="idea-text">'+item.idea+'</div>';
    html += '    <div class="section-label">My Angle</div>';
    html += '    <div class="angle-box" style="border-left-color:'+catColor(item.cat)+';">'+item.angle+'</div>';
    html += '    <div class="section-label">Tweets</div>';
    html += '    <div class="tweets">';
    html += '      <div class="tweet-box tweet-a"><div class="tweet-label">TWEET A</div><div class="tweet-text">'+item.tweetA+'</div><button class="copy-btn" onclick="copyTweet('+item.id+',\'a\')">📋 Copy</button></div>';
    html += '      <div class="tweet-box tweet-b"><div class="tweet-label">TWEET B</div><div class="tweet-text">'+item.tweetB+'</div><button class="copy-btn" onclick="copyTweet('+item.id+',\'b\')">📋 Copy</button></div>';
    html += '    </div>';
    html += '    <div class="chart-block'+(item.charts.hot?' hot':'')+'">'+(item.charts.count>0?('📊 '+item.charts.count+' chart(s) — '):'No chart in-email — ')+item.charts.desc+'</div>';
    html += '    <div class="link-row"><a href="'+item.link+'" target="_blank">↗ Read full article</a></div>';
    html += '  </div>';
    html += '</div>';
  });
  wrap.innerHTML = html || '<div class="meta-line" style="padding:20px;">No items match this filter.</div>';
}

function toggleCard(id){
  const el = document.getElementById('card-'+id);
  el.classList.toggle('open');
}

function init(){
  document.getElementById('headerMeta').textContent =
    META.date + ' · ' + META.time + ' · ' + META.itemsExtracted + ' items from ' + META.includedSources.length + ' sources';
  document.getElementById('windowLine').textContent =
    'Window: ' + META.windowStart + ' to ' + META.windowEnd + '. Emails outside this window were not processed. ' +
    META.emailsRead + ' of ' + META.emailsInWindow + ' emails in window read.';

  let incHtml = '';
  META.includedSources.forEach(s => {
    incHtml += '<div style="margin-bottom:4px;"><span class="src-item" onclick="filterBySrc(\''+s.name.replace(/'/g,"\\'")+'\')">'+s.name+'</span> — '+s.items+' item(s)</div>';
  });
  document.getElementById('includedSrc').innerHTML = incHtml;

  document.getElementById('skippedSrc').innerHTML = META.skippedSources.length
    ? META.skippedSources.map(s => '<div>'+s+'</div>').join('')
    : '<div class="meta-line">None — every email in the window contained at least one substantive item.</div>';

  document.getElementById('totalsRow').innerHTML =
    '<div><b>'+META.emailsInWindow+'</b>emails in window</div>'+
    '<div><b>'+META.emailsRead+'</b>emails read</div>'+
    '<div><b>'+META.itemsExtracted+'</b>items extracted</div>'+
    '<div><b>'+META.includedSources.length+'</b>sources</div>';

  buildFilters();
  renderCards();
  refreshPillStyles();
}
init();
</script>
</body>
</html>
