t needs periodic structural audit rather than per-change gating.", "quote": "Each change is reasonable. Together, they change what an address update means at different stages of order fulfillment.", "locator": "Then the business learns", "quote_verified": true}, {"claim": "In a digital retail bank case, growth from a single savings product into loans with automated underwriting, checking accounts requiring debit card printing and mailing, and expanding compliance rules pushed flagged applications into document-request workflows that stretched decision time from minutes into days — while the onboarding team still owned the application form and received change requests directly.", "speaker": "Michael Fischer", "type": "anecdote", "entities": ["digital retail bank", "underwriting", "card fulfillment", "compliance", "account opening"], "conviction": "medium", "so_what": "Shows drift is worse in regulated growth: every new product line adds a decision owner outside the customer-facing team, so fintech scaling stories should be stress-tested on onboarding-time regressions, not just product count.", "quote": "The boundary never moved on paper. The path of change did.", "locator": "We can also consider a software engineering team at a digital retail bank", "quote_verified": true}]}, {"theme": "Cognitive Load as the Leading Indicator", "insights": [{"claim": "The diagnostic signal of broken change locality is not the number of teams involved in a change but the requesting team's inability to tell which decisions matter, who owns them, and what evidence would prove the change safe.", "speaker": "Michael Fischer", "type": "framework", "entities": ["cognitive load", "checkout", "change locality"], "conviction": "high", "so_what": "Corrects a common measurement error — dependency counts and team-touch counts are poor proxies; the sharper question to ask a team is whether they can name the decision owners.", "quote": "the signal is not \"five teams are involved.\" The signal is that checkout cannot tell which decisions matter, who owns them, or what evidence proves the change is safe.", "locator": "Cognitive Load is the Signal", "quote_verified": true}, {"claim": "Four observable symptoms indicate the boundary model no longer matches the structure of change: a modest feature that turns out to touch three systems with unclear ownership, an incident post-mortem where recovery depended on one engineer's memory of a non-obvious dependency, onboarding taking months because safety-critical knowledge is not in code, tests, docs or dashboards, and a 10-line pull request generating a fifty-comment review thread.", "speaker": "Michael Fischer", "type": "data_point", "entities": ["cognitive load", "post-mortems", "onboarding", "code review"], "conviction": "high", "so_what": "These are all measurable from existing telemetry (PR comment ratios, ramp time, estimate variance), making boundary drift trackable as an operational metric rather than a subjective architecture opinion.", "quote": "A 10-line pull request generates a fifty-comment review thread because reviewers cannot agree which behavior is correct.", "locator": "The same signal appears outside this example", "quote_verified": true}]}, {"theme": "Sociotechnical Causes: Technology, Teams, Process, People", "insights": [{"claim": "Shared platforms cause drift when they remove duplication but hide decisions: a shipping platform that centralizes carrier rules, warehouse cutoffs and delivery promises may be the right trade-off, yet the consuming team still needs to know whether 'too late to change' means packed, dispatched, fraud-locked, partner-notified or refund-sensitive.", "speaker": "Michael Fischer", "type": "causal", "entities": ["platform engineering", "shipping platform", "checkout", "carrier rules"], "conviction": "high", "so_what": "Direct warning for internal-platform and IDP investment theses: consolidation that abstracts away decision semantics buys duplication savings while transferring an unpriced comprehension cost onto product teams.", "quote": "When shared platforms remove duplication but hide decisions, this can be a symptom of technology drift.", "locator": "Technology", "quote_verified": true}, {"claim": "Ownership lines that each make sense locally — checkout owning customer experience, warehouse owning physical fulfillment, fraud owning risk, support owning exceptions — can leave no team owning the end-to-end policy that the business actually needs to evolve.", "speaker": "Michael Fischer", "type": "causal", "entities": ["checkout", "warehouse operations", "fraud", "customer support", "team ownership"], "conviction": "high", "so_what": "The gap to hunt for in any org review is the unowned end-to-end policy, which appears in no team's charter and therefore in no team's budget or backlog.", "quote": "In this example, no team clearly owns the end-to-end policy.", "locator": "Team Ownership", "quote_verified": true}, {"claim": "Process artifacts accumulate as fossilized learning that outlives the operating model that produced them: a review step added after a delivery incident, support scripts that quietly become the practical source of exception policy, and refund approvals sitting in a separate workflow all preserve an older model of the product.", "speaker": "Michael Fischer", "type": "causal", "entities": ["release governance", "architecture review", "incident escalation", "customer support"], "conviction": "medium", "so_what": "Support scripts as de facto policy is the most overlooked instance — it means customer-facing promises are being set outside engineering's change control entirely.", "quote": "Support scripts may have become the practical source of exception policy.", "locator": "Process", "quote_verified": true}, {"claim": "When experienced engineers, operations leads and support managers are the only reliable memory of why certain promises are unsafe, the system can look decoupled in its deployment topology while remaining tightly coupled through the tacit knowledge required to reason about it safely.", "speaker": "Michael Fischer", "type": "contrarian", "entities": ["tacit knowledge", "deployment topology", "key person risk"], "conviction": "high", "so_what": "Microservice counts and deployment independence metrics can be entirely satisfied by a system with severe key-person coupling — a real risk for acquirers doing technical diligence on architecture claims.", "quote": "The risk is that relationships and recollection become the only reliable integration layer.", "locator": "People", "quote_verified": true}]}, {"theme": "Restoration Playbook: Redistribute, Expose, Rehearse", "insights": [{"claim": "Redistribution should move repeated mechanics — cutoff calculations, partner status checks, notification delivery, deployment pipelines, infrastructure setup, compliance scaffolding, observability wiring — to a platform or shared service, but must not by default move business policy there, since domain teams need to retain authority over customer promises.", "speaker": "Michael Fischer", "type": "framework", "entities": ["platform engineering", "shared services", "compliance scaffolding", "observability"], "conviction": "high", "so_what": "A clean line for scoping internal platform mandates: mechanics and toil are in scope, customer-promise policy is not — platform teams that cross that line create the very drift they were funded to remove.", "quote": "The platform can own mechanics and toil; product and domain teams still need clear authority over customer promises.", "locator": "Redistribute Repeated Mechanics", "quote_verified": true}, {"claim": "Exposure means making the constraints that govern safe change legible across boundaries — when an order is packed, when fraud can block an address, when a partner needs final instructions, what support can promise — delivered through explicit ownership, API contracts, contract tests, architecture decision records, service catalogs, meaningful events, dashboards or escalation paths.", "speaker": "Michael Fischer", "type": "framework", "entities": ["API contracts", "contract tests", "architecture decision records", "service catalogs", "dashboards"], "conviction": "high", "so_what": "Names the concrete tool categories that address drift (catalogs, contract testing, ADR tooling, event platforms), which is where budget flows once cognitive load is accepted as the bottleneck.", "quote": "The goal is to make the decisions that govern safe change legible to the teams responsible for evolving the capability.", "locator": "Expose Essential Policy", "quote_verified": true}, {"claim": "The pass/fail test for a boundary redesign is rehearsal of the exception paths that previously required expert coordination — can support resolve a known address-change exception from visible policy, can checkout adjust a premium-customer window within guardrails, can the team see when a partner handoff makes the change unsafe — and if every realistic exception still routes to the same experts, locality has not been restored.", "speaker": "Michael Fischer", "type": "framework", "entities": ["exception paths", "incident response", "onboarding", "architecture review"], "conviction": "high", "so_what": "Supplies the missing verification step most re-architectures skip; without it, teams declare victory on structure while the human dependency graph is unchanged.", "quote": "If every realistic exception still depends on the same experts, locality has not been restored.", "locator": "Rehearse Exception Paths", "quote_verified": true}]}, {"theme": "Limits: When Not to Optimize for Locality", "insights": [{"claim": "Reduced cognitive load is not automatically a win — standardization can improve flow while moving too much decision-making away from the teams closest to the domain, and hiding the wrong complexity produces a low-load team that makes unsafe changes.", "speaker": "Michael Fischer", "type": "contrarian", "entities": ["cognitive load", "standardization", "platform engineering"], "conviction": "high", "so_what": "Pushes back on developer-experience pitches sold purely on load reduction; the question to ask is which complexity was hidden, not how much.", "quote": "Low cognitive load is not valuable if the wrong complexity has been hidden.", "locator": "Trade-Offs and Limits", "quote_verified": true}, {"claim": "Some changes are genuinely cross-cutting — shipping promises, fraud controls, refunds, safety, financial reporting and customer communication — and because the business consequence is shared, these should be coordinated explicitly rather than forced back into a single team's boundary.", "speaker": "Michael Fischer", "type": "thesis", "entities": ["fraud controls", "refunds", "financial reporting", "team autonomy"], "conviction": "high", "so_what": "Sets the boundary of the whole thesis: in risk- and consistency-dominated domains (payments, safety, reporting) coordination cost is the correct cost, and autonomy-maximizing architecture is the wrong optimization.", "quote": "Do not optimize for locality when consistency or risk control matters more than local speed.", "locator": "Trade-Offs and Limits", "quote_verified": true}, {"claim": "No structural style or modeling practice guarantees change locality indefinitely, so boundaries must be treated as living hypotheses that are periodically re-tested against delivery friction, incidents, support escalations, review queues and expert dependency.", "speaker": "Michael Fischer", "type": "thesis", "entities": ["Domain-Driven Design", "Team Topologies", "evolutionary architecture", "boundary drift"], "conviction": "high", "so_what": "Implies architecture review is a recurring operational function, not a one-time design event — the buyers for drift-detection tooling are permanent rather than project-based.", "quote": "When even simple changes become negotiations with the entire system, boundary drift has become the dominant cost of changing that capability.", "locator": "Boundaries Are Living Hypotheses", "quote_verified": true}]}], "insight_total": 20, "top_entities": ["change locality", "boundary drift", "evolutionary architecture", "cognitive load", "checkout", "fulfillment", "fraud", "platform engineering", "InfoQ", "Team Topologies", "Domain-Driven Design", "Michael Fischer"], "source_meta": {"author": "Michael Fischer", "word_count": 3247, "paywalled": false}}, {"record_id": "e9c47655257a4a73", "source_type": "technology", "source_name": "Wired", "source_url": "https://www.wired.com/story/smart-tech-for-a-vintage-home/", "title": "An Old-House Owner’s Guide to New Technology", "published_date": "2026-08-03", "language": "en", "processed_at": "2026-08-04T11:13:17Z", "processor": "claude-code-sub-opus", "tags": ["Tech", "Society", "Energy"], "gist": "A WIRED editor documents six months of retrofitting a 1907 Portland Craftsman with smart devices (Ecobee thermostat, Midea U-shaped window AC, Philips 4200 hub-free smart deadbolt, Toto S7A washlet, Feit and Zoiinet lighting, Whisker Litter-Robot 5 Pro, Sebo vacuums, OtO sprinkler, Kohler Aquifer faucet). The through-line is a purchase logic investors can generalize: in old housing stock, the winning products are the ones that let owners defer five-figure structural capex (rewiring, whole-home HVAC, in-ground irrigation) and that work with zero hub, zero electrician, and zero subscription. Aesthetics and unobtrusiveness, not feature count, are the binding constraint on adoption.", "themes": [{"theme": "Retrofit-over-rewire: devices sold as capex deferral", "insights": [{"claim": "In pre-war US housing stock, the highest-value smart-home products are the ones that let an owner postpone a structural renovation, not the ones with the most features — window AC units, plug-in overhead-light sockets and hose-fed sprinklers are all bought explicitly to delay whole-home HVAC, rewiring and in-ground irrigation.", "speaker": "Jordan Michelman", "type": "framework", "entities": ["Midea", "Zoiinet", "OtO", "smart home", "home renovation"], "conviction": "high", "so_what": "The addressable market for these categories is priced against a deferred contractor bill, not against a cheaper gadget — so gross margins can hold well above commodity-electronics levels.", "quote": "At some point we will likely upgrade the air cooling system for the whole house, but these Midea units have made it possible to delay that choice without sacrificing comfort in our sleeping space.", "locator": "A Smart Air Conditioner for Older Windows", "quote_verified": true}, {"claim": "Installing whole-home air conditioning in a 1907 house that had never had it was judged cost-prohibitive on day one, pushing the buyer to two Midea U-shaped window units instead — a substitution that costs roughly $400–$510 per unit versus a full system.", "speaker": "Jordan Michelman", "type": "data_point", "entities": ["Midea", "HVAC", "Amazon"], "conviction": "high", "so_what": "Window/portable AC is taking share from HVAC installs in the old-housing segment; watch unit-volume growth at Midea-type OEMs as a proxy for deferred HVAC capex.", "quote": "Installing a proper whole-home air conditioning system into our home—which had never been done before—proved dauntingly cost-prohibitive as a day one update.", "locator": "A Smart Air Conditioner for Older Windows", "quote_verified": true}, {"claim": "Midea's U-shaped window AC wins on a purely physical constraint of old buildings: it installs with the window open only about six inches versus roughly 20 inches for conventional window units, which matters because century-old sash windows often do not open fully.", "speaker": "Jordan Michelman", "type": "causal", "entities": ["Midea", "window air conditioners"], "conviction": "high", "so_what": "A mechanical form-factor moat beats app features in this category — competitors without the U-shape are structurally excluded from the old-housing installed base.", "quote": "the unit’s U-shaped design makes it so you only have to have your window open around six inches to install, as opposed to the normal 20 inches of most traditional window air conditioners", "locator": "A Smart Air Conditioner for Older Windows", "quote_verified": true}, {"claim": "A ~$22 Zoiinet Bluetooth remote-control light socket paired with a stick-on touch switch adds overhead lighting to a bedroom that only had wall mounts, entirely avoiding an electrician and any contact with the house's wiring.", "speaker": "Jordan Michelman", "type": "anecdote", "entities": ["Zoiinet", "smart lighting", "Amazon"], "conviction": "high", "so_what": "Sub-$25 hardware substituting for a licensed-trade visit is the sharpest price-anchoring dynamic in smart home; the labor arbitrage, not the BOM, sets the willingness to pay.", "quote": "rather than rewiring the room to add in overhead lighting (the bedrooms only came with wall mounts), we were able to install this socket without needing to hire an electrician", "locator": "Smart Lighting", "quote_verified": true}, {"claim": "OtO's app-controlled smart sprinkler is differentiated from ordinary smart hose timers because it can set multiple watering zones from one placement, which an ecological landscape designer says is decisive for a garden still establishing itself.", "speaker": "Jordan Michelman", "type": "causal", "entities": ["OtO", "Blueprint Earth", "smart sprinklers", "Oregon"], "conviction": "medium", "so_what": "Zoning capability without an in-ground system is the feature that lets OtO price at ~$499–$589 rather than at hose-timer economics.", "quote": "A smart hose timer just runs one setting wherever you set the sprinkler down. OtO lets you set different zones from one spot, and that matters, because every part of a garden waters differently while it's establishing.", "locator": "A Smart Sprinkler for the Yard", "quote_verified": true}, {"claim": "Lighting is presented as the single highest-leverage intervention for comfort in an inhabited space, explicitly tied to the work-from-home context, and was solved with ~$13–$16 Feit Electric smart bulbs retrofitted into vintage fixtures rather than any fixture replacement.", "speaker": "Jordan Michelman", "type": "thesis", "entities": ["Feit Electric", "Alexa", "smart lighting", "remote work"], "conviction": "high", "so_what": "Smart bulbs remain the cheapest entry point into the ecosystem and the most common Alexa attach vector — volume leader even as ASPs stay in the low teens.", "quote": "I’m convinced lighting is one of the most important things we can do to make inhabited environments more comfortable, especially if you’ll be working from home.", "locator": "Smart Lighting", "quote_verified": true}]}, {"theme": "No hub, no subscription as the buying filter", "insights": [{"claim": "The Philips 4200 fingerprint smart deadbolt was chosen over rival smart locks specifically because Wi-Fi and Bluetooth are built in, it runs on batteries, needs no hardwiring, and requires no hub, dongle or subscription — total cost about $120 all-in.", "speaker": "Jordan Michelman", "type": "thesis", "entities": ["Philips", "smart locks", "Wi-Fi", "Bluetooth"], "conviction": "high", "so_what": "Recurring-revenue smart-home models are losing the mainstream purchase decision to hub-free one-time-purchase hardware; subscription attach rates in the lock category look structurally capped.", "quote": "the Philips 4200 does not require its own “hub,” dongle, or additional apparatus in order to start working immediately", "locator": "A Smart Lock That Doesn’t Require Hardwiring", "quote_verified": true}, {"claim": "Ecobee's Enhanced thermostat was selected over Google Nest because Nest lacks Ecobee's presence sensors, and Ecobee's radar-based motion detection plus larger touchscreen justified the midrange (~$188–$200) tier over the cheaper Essential model.", "speaker": "Jordan Michelman", "type": "data_point", "entities": ["Ecobee", "Google Nest", "smart thermostats"], "conviction": "high", "so_what": "Sensor presence — not brand or ecosystem — is the swing feature in thermostat share; Google is losing informed buyers on a hardware gap, not on software.", "quote": "which prioritizes the unit’s ease of setup and intuitive interface—this made a strong case for selecting the Ecobee over other similar smart thermostats, like the Google Nest, which lacks the Ecobee’s presence sensors", "locator": "A Smart Thermostat", "quote_verified": true}]}, {"theme": "Utility rebates and resource specs subsidize the upgrade", "insights": [{"claim": "Many US states run smart-thermostat rebate programs through local gas and power utilities, and this household is currently earning about $10 off each monthly bill simply for having one installed — a payback of roughly 20 months on a ~$200 device.", "speaker": "Jordan Michelman", "type": "data_point", "entities": ["Ecobee", "utilities", "smart thermostats", "energy rebates"], "conviction": "high", "so_what": "Utility demand-response budgets are effectively a hidden distribution channel and price subsidy for connected-thermostat OEMs; rebate rollbacks would hit unit economics directly.", "quote": "Many states have a smart thermostat rebate program through local gas and power companies, and right now we’re earning around $10 off each monthly bill for having a smart thermostat in the house.", "locator": "A Smart Thermostat", "quote_verified": true}, {"claim": "Toto's Aurora Washlet+ S7A with the Integravity System uses one gallon per flush against an EPA standard of 1.6 gallons, pairing luxury positioning ($2,554–$3,648) with a measurable water-efficiency claim.", "speaker": "Jordan Michelman", "type": "data_point", "entities": ["Toto", "EPA", "bidets", "water efficiency"], "conviction": "high", "so_what": "Water-efficiency headroom below regulatory minimums is becoming a premium-fixture selling point — relevant as drought-state codes tighten.", "quote": "It also only uses one gallon of water per flush, which is well below the Environmental Protection Agency standard of 1.6 gallons per flush.", "locator": "A 21st Century Bidet", "quote_verified": true}, {"claim": "The OtO sprinkler's built-in solar panel kept it running unplugged for an entire summer on a single initial charge, removing any electrical run to the yard.", "speaker": "Jordan Michelman", "type": "data_point", "entities": ["OtO", "solar", "irrigation"], "conviction": "high", "so_what": "Onboard solar is what makes untethered outdoor smart hardware viable; expect it to become table stakes across yard-tech SKUs.", "quote": "the OtO’s built-in solar panel is great—we’ve left it unplugged all summer after a single full charge to get things started", "locator": "A Smart Sprinkler for the Yard", "quote_verified": true}]}, {"theme": "Aesthetics as the binding adoption constraint", "insights": [{"claim": "The author's stated test for good smart-home tech is that it be subtle, effective and unobtrusive — invisibility, not capability, is what makes a connected device acceptable in a historic-registry home.", "speaker": "Jordan Michelman", "type": "framework", "entities": ["smart home", "home design"], "conviction": "high", "so_what": "Industrial design and disappearing form factors are the real competitive axis in mature smart-home categories; feature-stacking without design loses the premium buyer.", "quote": "To me, this is emblematic smart-home tech: subtle, effective, and unobtrusive.", "locator": "A Smart Lock That Doesn’t Require Hardwiring", "quote_verified": true}, {"claim": "Sebo's retro-styled German upright vacuums ($799–$1,149) are bought partly because they are attractive enough to leave out in the open, inverting the usual out-of-sight appliance logic and solving a real constraint in old homes where closet space is scarce.", "speaker": "Jordan Michelman", "type": "contrarian", "entities": ["Sebo", "vacuums", "home appliances"], "conviction": "medium", "so_what": "A design premium of 3–5x commodity vacuum pricing is sustainable when the product doubles as decor — the same playbook that repriced small kitchen appliances.", "quote": "these are vacuum cleaners so attractive you’ll feel bad about sticking them in your closet", "locator": "A Retro Vacuum", "quote_verified": true}, {"claim": "The buyer knowingly accepted an aesthetic mismatch on the $2,554+ Toto washlet — conceding it looks nothing like 1907 — because the functional gain outweighed period authenticity, showing that vintage-home owners will break their own design rules for a high-enough utility payoff.", "speaker": "Jordan Michelman", "type": "thesis", "entities": ["Toto", "bidets", "home renovation"], "conviction": "high", "so_what": "Bathroom tech has crossed the utility threshold where design objections stop blocking purchase — bullish for premium washlet penetration in the US.", "quote": "Does the Toto S7A “look vintage” in any way? No. Frankly, I think a person in 1907 would be positively astonished by the experience of using this technology", "locator": "A 21st Century Bidet", "quote_verified": true}, {"claim": "Whisker's $899 Litter-Robot 5 Pro is valued less for automation than for odor control that distinguishes between waste types and for physically disappearing into a laundry-room corner, plus app data confirming the pet's routine health behavior.", "speaker": "Jordan Michelman", "type": "anecdote", "entities": ["Whisker", "Litter-Robot", "pet tech"], "conviction": "high", "so_what": "Pet-tech at $899 sells on sensory outcomes and health telemetry, not labor savings — a durable premium tier inside an otherwise commoditized pet-supplies market.", "quote": "the most important aesthetic consideration around why we like the LR5 is its relative unobtrusiveness: It disappears into the corner of our laundry room", "locator": "For Keeping Old Floors Spic-and-Span", "quote_verified": true}]}, {"theme": "Kitchen fixtures and beverage substitution", "insights": [{"claim": "Kohler's $3,375 Aquifer 4-in-1 beverage faucet — filtered, hot and sparkling water with a refillable CO2 cartridge — is displacing packaged sparkling water purchases in this household, with the author explicitly noting savings on restocking La Croix.", "speaker": "Jordan Michelman", "type": "causal", "entities": ["Kohler", "La Croix", "sparkling water", "kitchen fixtures"], "conviction": "medium", "so_what": "At-tap carbonation moves from countertop appliance to permanent plumbing fixture — a slow structural headwind for canned sparkling-water volumes in affluent households.", "quote": "the sparkling water attachment is already saving me money on restocking La Croix", "locator": "A Fancy Faucet System", "quote_verified": true}]}, {"theme": "WIRED's review-to-affiliate commerce loop", "insights": [{"claim": "Nearly every purchase in the piece is sourced to WIRED's own buying guides and named staff reviewers, with retailer links and an affiliate-compensation disclosure attached — the review franchise functions as the demand-generation layer for the commerce revenue.", "speaker": "Jordan Michelman", "type": "framework", "entities": ["Wired", "Amazon", "Home Depot", "affiliate commerce"], "conviction": "medium", "so_what": "Editorial buying guides remain a high-intent funnel for retail affiliate revenue; treat this format as a media monetization proxy rather than independent product signal.", "quote": "we consulted WIRED’s guide to smart sprinklers and went with reviewer Christopher Null’s qualified recommendation around OtO", "locator": "A Smart Sprinkler for the Yard", "quote_verified": true}]}], "insight_total": 17, "top_entities": ["Wired", "Ecobee", "Midea", "Philips", "Toto", "Whisker", "OtO", "Kohler", "Feit Electric", "Sebo", "Zoiinet", "Google Nest"], "source_meta": {"author": "Jordan Michelman", "word_count": 3390, "paywalled": false}}, {"record_id": "ff5c854ed9727268", "source_type": "technology", "source_name": "ServeTheHome", "source_url": "https://www.servethehome.com/asus-showcases-nuc-16-family-powe ke", "Arrow Lake", "Panther Lake"], "conviction": "high", "so_what": "ASUS is a durable design-win channel for Intel's mobile silicon in the small-form-factor segment; divestiture did not kill Intel's volume there.", "quote": null, "locator": "These days, the NUC banner is held", "quote_verified": false}, {"claim": "ASUS is pairing two different Intel families inside one NUC 16 generation — Core Series 3 (Wildcat Lake) for the base box and Core Ultra Series 3 (Panther Lake) for the Pro box — segmenting a single product line by silicon tier rather than by chassis.", "speaker": "Ryan Smith", "type": "framework", "entities": ["ASUS", "NUC 16", "NUC 16 Pro", "Core Series 3", "Wildcat Lake", "Core Ultra Series 3", "Panther Lake", "Computex 2026"], "conviction": "high", "so_what": "Watch whether Wildcat Lake cannibalizes Panther Lake demand at the low end, since both ship in an identical-looking box.", "quote": "which incorporate the tag-team duo of Intel’s Core Series 3 (Wildcat Lake) and Core Ultra Series 3 (Panther Lake) processors", "locator": "At this year’s Computex 2026 trade show", "quote_verified": true}]}, {"theme": "Wildcat Lake is a deliberately thin die", "insights": [{"claim": "Intel's top Wildcat Lake part, the Core 7 350, ships only 6 CPU cores — 2 Cougar Cove P-cores plus 4 Darkmont LPE-cores — with a 2-Xe-core Xe3 iGPU, and ASUS runs it at just a 28W cTDP.", "speaker": "Ryan Smith", "type": "data_point", "entities": ["Intel", "Core 7 350", "Wildcat Lake", "Cougar Cove", "Darkmont", "Xe3", "ASUS"], "conviction": "high", "so_what": "Establishes the floor of Intel's current client stack: a modern-architecture, low-core, low-power die aimed at cost, not performance.", "quote": "it comes with 6 CPU cores, 2 P-cores and 4 LPE-cores based on Cougar Cove and Darkmont, respectively, along with modest Xe3 architecture Intel Graphics iGPU with 2 Xe cores", "locator": "For the fully-equipped mini-PC, ASUS is offering", "quote_verified": true}, {"claim": "Wildcat Lak // ---------- helpers ----------
// YouTube-aligned hex colors for tinted insight chips (bg = color+"1a", text = color, border = color+"55").
const TYPE_HEX = {
  thesis: '#6366f1', prediction: '#0ea5e9', framework: '#8b5cf6',
  data_point: '#7c3aed', causal: '#d97706', contrarian: '#dc2626',
  anecdote: '#64748b',
};
const CONV_HEX = { high: '#7c3aed', medium: '#ca8a04', low: '#94a3b8', exploratory: '#94a3b8' };
function typeHex(t) { return TYPE_HEX[String(t || '').toLowerCase()] || '#475569'; }
function convHex(c) { return CONV_HEX[String(c || '').toLowerCase()] || '#64748b'; }

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }

// Tinted chip (YouTube style): faint bg, colored text + border.
function tintChip(text, color) {
  return `<span class="chip" style="background:${color}1a;color:${color};border-color:${color}55">${escapeHtml(text)}</span>`;
}
function tagPills(tags) {
  if (!tags || !tags.length) return '';
  return tags.map(t => `<span class="pill tag">${escapeHtml(t)}</span>`).join(' ');
}

// ---------- rendering ----------
// Insight presentation ported from the YouTube digest: type/conviction tinted
// chips, speaker as a 🗣 chip, and entities as indigo chips — all in the meta row
// directly under the claim. Quote treatment is INTENTIONALLY kept as Concepts'
// verbatim + "✓ verified" (stronger than YouTube's ≈ paraphrase wording).
function renderInsight(ins) {
  if (!ins) return '';
  const cls = 'insight' + (ins.type ? (' ' + String(ins.type).toLowerCase()) : '');
  const meta = [];
  if (ins.type) meta.push(tintChip(ins.type, typeHex(ins.type)));
  if (ins.speaker) meta.push(`<span class="chip chip-spk">🗣 ${escapeHtml(ins.speaker)}</span>`);
  if (ins.conviction) meta.push(tintChip('conviction: ' + ins.conviction, convHex(ins.conviction)));
  (ins.entities || []).slice(0, 12).forEach(e => {
    if (e) meta.push(`<span class="chip chip-ent">${escapeHtml(e)}</span>`);
  });
  let quote = '';
  if (ins.quote) {
    const v = ins.quote_verified
      ? `<span class="vmark">✓ verified</span>`
      : `<span class="vmark no">unverified</span>`;
    quote = `<div class="quote">“${escapeHtml(ins.quote)}”${v}</div>`;
  }
  const so = ins.so_what
    ? `<div class="insight-so"><span class="lbl">so what</span>${escapeHtml(ins.so_what)}</div>` : '';
  return `
    <div class="${cls}">
      <div class="insight-claim">${escapeHtml(ins.claim || '')}</div>
      <div class="insight-meta">${meta.join('')}</div>
      ${so}
      ${quote}
    </div>`;
}

function renderTheme(theme) {
  const insights = (theme.insights || []).map(renderInsight).join('');
  return `
    <div class="theme">
      <div class="theme-title">${escapeHtml(theme.theme || 'Theme')}</div>
      ${insights}
    </div>`;
}

function renderCard(card) {
  if (!card) return '';
  const meta = card.source_meta || {};
  const nameHtml = card.source_url
    ? `<a class="source-name" href="${escapeAttr(card.source_url)}" target="_blank" rel="noopener">${escapeHtml(card.source_name || '')}</a>`
    : `<span class="source-name">${escapeHtml(card.source_name || '')}</span>`;
  const subBits = [];
  if (card.published_date) subBits.push(escapeHtml(card.published_date));
  if (meta.author) subBits.push(escapeHtml(meta.author));
  if (meta.word_count) subBits.push(`${meta.word_count} words`);
  if (meta.paywalled) subBits.push('paywalled');
  const themes = (card.themes || []).map(renderTheme).join('');
  const n = card.insight_total != null ? card.insight_total
            : (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
  return `
    <div class="source">
      <div class="source-head" onclick="toggleSource(this)">
        <div class="source-meta-left">
          <div class="source-name-row">${nameHtml}</div>
          <div class="source-title">${escapeHtml(card.title || '')}</div>
          <div class="source-sub">${subBits.join('  ·  ')}</div>
        </div>
        <span class="source-count">${n} insight${n === 1 ? '' : 's'}</span>
        <span class="source-arrow">▸</span>
      </div>
      <div class="source-body">
        ${card.gist ? `<div class="gist">${escapeHtml(card.gist)}</div>` : ''}
        ${card.tags && card.tags.length ? `<div class="tags">${tagPills(card.tags)}</div>` : ''}
        ${themes || '<div class="empty">No insights.</div>'}
      </div>
    </div>`;
}

function renderTopStats(d) {
  const s = d.stats || {};
  const parts = [];
  if (d.date) parts.push(`date <strong>${escapeHtml(d.date)}</strong>`);
  if (s.lookback_days != null) parts.push(`lookback <strong>${s.lookback_days}d</strong>`);
  if (s.sources != null) parts.push(`sources <strong>${s.sources}</strong>`);
  if (s.cards != null) parts.push(`cards <strong>${s.cards}</strong>`);
  if (s.insights != null) parts.push(`insights <strong>${s.insights}</strong>`);
  if (s.quote_verified_pct != null) parts.push(`quotes verified <strong>${s.quote_verified_pct}%</strong>`);
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSource(headEl) { headEl.parentElement.classList.toggle('open'); }

function insightCount(card) {
  return (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
}

// Build the sort/filter control bar (display only — re-groups REPORT_DATA in place).
function buildControls(d) {
  const cards = d.cards || [];
  const names = [...new Set(cards.map(c => c.source_name || '—'))].sort((a, b) => a.localeCompare(b));
  const opts = names.map(n => `<option value="${escapeAttr(n)}">${escapeHtml(n)}</option>`).join('');
  document.getElementById('controls').innerHTML =
    `<label>Sort
       <select id="sortSel">
         <option value="source">Source A–Z</option>
         <option value="insights">Insight count ▼</option>
       </select></label>
     <label>Source
       <select id="srcSel">
         <option value="__all">All sources (${names.length})</option>
         ${opts}
       </select></label>
     <span class="ctl-btns">
       <button type="button" id="expandAll">Expand all</button>
       <button type="button" id="collapseAll">Collapse all</button>
     </span>`;
  document.getElementById('sortSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('srcSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('expandAll').addEventListener('click', () => setAllGroups(false));
  document.getElementById('collapseAll').addEventListener('click', () => setAllGroups(true));
}

// Group-level collapse: header click toggles one group; the control-bar buttons toggle all.
function toggleGroup(headEl) { headEl.parentElement.classList.toggle('collapsed'); }
function setAllGroups(collapsed) {
  document.querySelectorAll('.group').forEach(g => g.classList.toggle('collapsed', collapsed));
}

// Group cards by source, sort groups (and cards within), optionally filter to one source.
function renderGroups(d) {
  const sortMode = (document.getElementById('sortSel') || {}).value || 'source';
  const srcFilter = (document.getElementById('srcSel') || {}).value || '__all';
  let cards = (d.cards || []).slice();
  if (srcFilter !== '__all') cards = cards.filter(c => (c.source_name || '—') === srcFilter);

  const groups = new Map();
  cards.forEach(c => {
    const k = c.source_name || '—';
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(c);
  });
  let entries = [...groups.entries()].map(([name, cs]) => ({
    name, cards: cs, insights: cs.reduce((a, c) => a + insightCount(c), 0),
  }));
  if (sortMode === 'insights') entries.sort((a, b) => b.insights - a.insights || a.name.localeCompare(b.name));
  else entries.sort((a, b) => a.name.localeCompare(b.name));
  // Within each source group, heaviest cards first.
  entries.forEach(e => e.cards.sort((a, b) => insightCount(b) - insightCount(a)));

  const html = entries.map(e => {
    const head = `<div class="group-head" onclick="toggleGroup(this)">`
      + `<span class="group-name">${escapeHtml(e.name)}</span>`
      + `<span class="group-meta">${e.cards.length} card${e.cards.length === 1 ? '' : 's'} · ${e.insights} insights</span>`
      + `<span class="group-arrow">▾</span></div>`;
    return `<div class="group">${head}<div class="group-body">${e.cards.map(renderCard).join('')}</div></div>`;
  }).join('');

  const app = document.getElementById('app');
  app.innerHTML = html || '<div class="empty">No cards for this source.</div>';
  // Open the first two source cards by default.
  document.querySelectorAll('.source').forEach((sec, i) => { if (i < 2) sec.classList.add('open'); });
}

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  document.getElementById('stats-top').innerHTML = renderTopStats(d);
  buildControls(d);
  renderGroups(d);   // default: grouped, sorted by source A–Z
}

renderReport(REPORT_DATA);
</script>
