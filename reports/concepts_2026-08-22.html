ss could power new gameplay (AI companions, adaptive NPCs) and, during development, enable QA testing that adapts automatically as the game changes with every commit rather than needing constant re-scripting.", "speaker": "Alexandre Moufarek and Adrian Bolton", "type": "causal", "entities": ["SIMA", "game QA"], "conviction": "medium", "so_what": "Points to a concrete cost-saving use case (automated QA) that game studios could adopt well before consumer-facing AI NPCs are viable — a nearer-term monetization path for DeepMind's game-AI research.", "quote": null, "locator": "During development, when the game changes with every commit", "quote_verified": false}]}, {"theme": "Fenris Creations / EVE Universe as a new research testbed", "insights": [{"claim": "DeepMind's new partnership treats EVE Online — a 20+ year old, single-shard persistent MMO with a real player-driven economy — as uniquely demanding because it requires continual learning, long-context memory, long-horizon planning over weeks to years, and complex multi-agent social and economic dynamics at scale.", "speaker": "Alexandre Moufarek and Adrian Bolton", "type": "framework", "entities": ["EVE Online", "Fenris Creations", "Google DeepMind"], "conviction": "high", "so_what": "These four capabilities (continual learning, long-horizon memory, long-horizon planning, multi-agent dynamics) are the actual bottlenecks DeepMind identifies for frontier agents — a checklist for judging whether other 'agentic AI' announcements address real gaps or just demo narrow tasks.", "quote": null, "locator": "For AI research, this is a golden opportunity", "quote_verified": false}, {"claim": "EVE Online launched in 2003 and has run continuously for more than 20 years with thousands of players sharing one persistent universe and trade networks spanning thousands of star systems.", "speaker": "Alexandre Moufarek and Adrian Bolton", "type": "data_point", "entities": ["EVE Online"], "conviction": "high", "so_what": "Gives a concret calls the new ethos", "quote_verified": false}]}, {"theme": "AI as the new axial technology — expanding awareness", "insights": [{"claim": "The essay's central thesis is that planetary-scale AI computation constitutes a new symbolic competency analogous to written language, enabling a 'self-disclosure' of Earth as one self-regulating organism — a possible 'New AI-xial Age.'", "speaker": "Nathan Gardels", "type": "thesis", "entities": ["AI", "Axial Age"], "conviction": "high", "so_what": "This is the essay's core argument; useful for tracking how mainstream civilizational and philosophical discourse is starting to treat AI's societal impact as comparable in scale to written language or the printing press, not just as an economic technology.", "quote": null, "locator": "Today, a case can be made", "quote_verified": false}, {"claim": "Philosopher of technology Benjamin Bratton argues that climate models are themselves 'a self-disclosure of Earth's intelligence and agency,' since they emerge from supercomputing simulations that let humanity think through and with a computational model of the planet.", "speaker": "Benjamin Bratton", "type": "framework", "entities": ["Benjamin Bratton", "climate models"], "conviction": "high", "so_what": "Reframes climate-model output as a new epistemic organ for civilization, not just a forecasting tool — relevant to how climate-tech and AI-for-climate narratives get pitched to policymakers and capital.", "quote": "The models that we have of climate change are ones that emerge from supercomputing simulations of Earth's past, present and future. This is a self-disclosure of Earth's intelligence and agency, accomplished by thinking through and with a computational model.", "locator": "As the philosopher of technology Benjamin Bratton puts it", "quote_verified": true}, {"claim": "Philosopher of technology Tobias Rees argues a personal AI model with access to someone's full data trail (emails, messages, documents, voice memos, photos) could make that person 'visible to themselves' by surfacing behavioral patterns they cannot see on their own, functioning as an externalized tool for self-reflection.", "speaker": "Tobias Rees", "type": "framework", "entities": ["Tobias Rees", "personal AI"], "conviction": "medium", "so_what": "Describes a concrete, near-term consumer AI use case (personal-data-grounded self-reflection assistant) framed in philosophical terms — a lens for evaluating 'AI life-coach' or personal-agent products beyond their marketing copy.", "quote": "AI can literally give us access to spaces that we, on our own, qua human, cannot discover and cannot access.", "locator": "As Rees describes it", "quote_verified": true}, {"claim": "The essay frames current global crises — AI potentially surpassing human intelligence, synthetic biology capable of creating life in a lab, and biosphere degradation — as three simultaneous, planet-wide challenges defining this axial moment, distinct from the more localized wars that shaped the earlier era.", "speaker": "Nathan Gardels", "type": "data_point", "entities": ["AI", "synthetic biology", "biosphere"], "conviction": "high", "so_what": "A concise three-item risk framework (superintelligence, synthetic biology, ecological collapse) worth using as a checklist when scanning for which 'existential-risk' narratives are converging in elite discourse simultaneously.", "quote": "AI that can be smarter than humans, synthetic biology that can create life in the lab, and the degradation of the biosphere that is the basis of all life on Earth.", "locator": "Collectively, everyone on the planet today faces the same challenges", "quote_verified": true}]}, {"theme": "The contrarian case: AI as epistemic monoculture", "insights": [{"claim": "Researcher Otto Scharmer argues current AI investment is producing an 'epistemic monoculture' — a single computational way of knowing that treats the world as a set of objects — analogous to how industrial agriculture's chemical monocultures were short-term productive but long-term devastating to soil diversity.", "speaker": "Otto Scharmer", "type": "contrarian", "entities": ["Otto Scharmer", "AI investment"], "conviction": "high", "so_what": "A direct counter-narrative to techno-optimist AI framing worth weighing against bullish AI theses — Scharmer's claim is that capital is flowing almost entirely into computational capability with none into human sensemaking capacity, which he calls 'soil depletion at a civilizational scale.'", "quote": "Just as industrial agriculture replaced the diversity of the living soil with chemical fertilizers and crop monocultures — productive in the short term, devastating over time — the current AI moment is producing an epistemic monoculture.", "locator": "In his essay in this upcoming issue", "quote_verified": true}, {"claim": "Scharmer notes that of the trillions of dollars flowing into AI, the human side of the equation — cultivating sensing, relating and sensemaking — receives almost none of it.", "speaker": "Otto Scharmer", "type": "data_point", "entities": ["Otto Scharmer", "AI capex"], "conviction": "high", "so_what": "A pointed capital-allocation critique implying a structural imbalance in AI investment that could eventually show up as an adoption or trust gap rather than a compute-capability gap.", "quote": "the human side of the equation — the cultivation of sensing, relating and sensemaking — receives almost none of it", "locator": "Of the trillions flowing into AI", "quote_verified": true}]}, {"theme": "Loss of human centrality — the darker projection", "insights": [{"claim": "Historian Yuval Noah Harari frames the stakes starkly: 'History began when humans invented gods, and will end when humans become gods' — pointing to generative AI and synthetic biology potentially breaking evolutionary natural selection out of the organic realm for the first time.", "speaker": "Yuval Noah Harari", "type": "prediction", "entities": ["Yuval Noah Harari", "generative AI", "synthetic biology"], "conviction": "medium", "so_what": "A widely-cited framing for the 'AI as successor species' risk narrative that shapes AI-safety and AI-governance discourse and, downstream, regulatory sentiment toward frontier AI labs.", "quote": "History began when humans invented gods, and will end when humans become gods.", "locator": "As the historian Yuval Noah Harari puts it", "quote_verified": true}, {"claim": "Gaia theorist James Lovelock, in his final book 'Novacene,' envisioned a future where a superior AI intelligence organizes civilization into an ecologically efficient but totalitarian 'wasp hive' in which human autonomy is severely diminished.", "speaker": "Nathan Gardels", "type": "prediction", "entities": ["James Lovelock", "Novacene"], "conviction": "medium", "so_what": "An extreme-but-influential scenario (efficient-but-totalitarian AI-run civilization) that frames the tail-risk end of the AI-governance debate — useful shorthand when mapping the range of expert priors on AI's endgame.", "quote": null, "locator": "This is what Gaia theorist James Lovelock seemed to conclude", "quote_verified": false}, {"claim": "Geoffrey Hinton, the 'godfather of neural networks,' argues there is little historical evidence that a lesser intelligence has ever escaped domination by a superior one, drawing a direct parallel between humans' dominance over animals and machines' likely future dominance over humans.", "speaker": "Geoffrey Hinton", "type": "contrarian", "entities": ["Geoffrey Hinton", "neural networks"], "conviction": "high", "so_what": "Coming from one of the field's most credentialed researchers rather than an outside critic, this raises the credibility floor for the 'AI dominance risk' thesis in any downstream policy or investment risk assessment.", "quote": "We were once smarter than animals; now machines will be smarter than us. There is little evidence in history that lesser intelligences were ever able to escape domination by some superior intelligence.", "locator": "The so-called godfather of 'neural networks,' Geoffrey Hinton", "quote_verified": true}]}, {"theme": "What must be preserved going forward", "insights": [{"claim": "Complexity scientist Stuart Kaufmann argues that preserving humanity's role as an active participant — rather than a passive subject — in the ongoing 'co-becoming' of the cosmos is civilization's central task in the era ahead.", "speaker": "Stuart Kaufmann", "type": "thesis", "entities": ["Stuart Kaufmann"], "conviction": "medium", "so_what": "Offers the essay's proposed normative goal for AI governance debates: preserve human agency in co-evolution, not merely human survival or economic relevance.", "quote": null, "locator": "As the complexity scientist Stuart Kaufmann says", "quote_verified": false}, {"claim": "The essay closes on Nobel laureate Ilya Prigogine's observation that the future does not emerge mechanically from the past because present action is shaped by humanity's chosen image of the future, implying the outcome of the AI transition remains genuinely undetermined and contestable.", "speaker": "Nathan Gardels", "type": "framework", "entities": ["Ilya Prigogine"], "conviction": "medium", "so_what": "A useful corrective to deterministic AI-outcome narratives (utopian or dystopian) — argues the trajectory remains a matter of collective choice, not physics.", "quote": null, "locator": "The Nobel laureate Ilya Prigogine once remarked", "quote_verified": false}]}], "insight_total": 16, "top_entities": ["Nathan Gardels", "Karl Jaspers", "Charles Taylor", "Benjamin Bratton", "Tobias Rees", "Otto Scharmer", "Yuval Noah Harari", "Geoffrey Hinton", "James Lovelock", "Stuart Kaufmann", "Jürgen Habermas", "Karen Armstrong"], "source_meta": {"author": "NATHAN GARDELS", "word_count": 2578, "paywalled": false}}, {"record_id": "3d25571a91598d85", "source_type": "concepts", "source_name": "Packy McCormick / Not Boring", "source_url": "https://www.notboring.co/p/weekly-dose-of onsolidation", "insights": [{"claim": "Stripe is acquiring OpenRouter, the leading AI model-routing provider founded by OpenSea founder Alex Atallah, for a reported $7.5 billion per the New York Times; in the same week, Not Boring portfolio companies Merge (with Merge for Workforce, cutting token spend 75x) and Ramp (which bought the domain router.com for its own Router product) both launched competing router offerings.", "speaker": "Packy McCormick", "type": "data_point", "entities": ["Stripe", "OpenRouter", "Alex Atallah", "Merge", "Ramp"], "conviction": "high", "so_what": "AI model-routing is consolidating fast into a distinct infrastructure layer — the Stripe/OpenRouter deal size ($7.5B) is a real valuation marker for the category, and Merge/Ramp's simultaneous launches signal routing is becoming table stakes for AI-adjacent fintech and workflow platforms.", "quote": null, "locator": "(4) Big Week for Routers", "quote_verified": false}, {"claim": "'Return on Tokens' (ROT), a metric flagged earlier by Markie Wagner, is becoming the efficiency benchmark companies optimize for, with routers as the mechanism to get the right AI model at the lowest price automatically.", "speaker": "Packy McCormick", "type": "framework", "entities": ["Return on Tokens", "Markie Wagner"], "conviction": "medium", "so_what": "'Return on Tokens' is a candidate KPI to watch for in AI-native software vendors' investor materials — a sign the market is shifting from raw model-capability comparisons to cost-efficiency-per-token as the competitive axis.", "quote": null, "locator": "In early June, Markie Wagner told us", "quote_verified": false}]}, {"theme": "Drone delivery scale-up", "insights": [{"claim": "Zipline and Uber announced a partnership under which Uber will invest in the drone company to scale deliveries; separately, Amazon is reportedly expanding Prime Air to 500 cities by year-end, and DoorDash launched its own DoorDash Air drone program — all in the same week.", "speaker": "Packy McCormick", "type": "data_point", "entities": ["Zipline", "Uber", "Amazon", "Prime Air", "DoorDash"], "conviction": "high", "so_what": "Multiple large logistics players (Uber, Amazon, DoorDash) simultaneously scaling drone delivery in the same week is a concrete signal that last-mile drone delivery is moving from pilot to scaled rollout — relevant for logistics, drone-hardware and airspace-regulation-exposed names.", "quote": null, "locator": "(5) Big Week for Drones", "quote_verified": false}, {"claim": "Packy McCormick states he is 'incredibly bullish on flight' based on this cluster of drone-delivery news, viewing it as just the beginning.", "speaker": "Packy McCormick", "type": "thesis", "entities": ["drones", "flight"], "conviction": "high", "so_what": "A stated high-conviction bullish call on 'flight' (drones/aerial logistics) as an investable theme, worth tracking against Not Boring Capital's portfolio positioning.", "quote": "I am incredibly bullish on flight and think these bits of news are just the beginning.", "locator": "I am incredibly bullish on flight", "quote_verified": true}]}], "insight_total": 8, "top_entities": ["Merck", "Moderna", "Stripe", "OpenRouter", "Ramp", "Amazon", "Uber", "Zipline", "Generalist"], "source_meta": {"author": "Packy McCormick", "word_count": 979, "paywalled": false}}, {"record_id": "002c270fea1b0783", "source_type": "concepts", "source_name": "World Economic Forum", "source_url": "https://www.weforum.org/stories/energy-transition/how-ai-and-power-systems-are-rewriting-each-others-rules/", "title": "How AI and power systems are rewriting each other's rules", "published_date": "2026-08-21", "language": "en", "processed_at": "2026-08-22T00:00:00Z", "processor": "claude-code-sub-opus", "tags": ["AI", "Energy"], "gist": "The WEF's Innovation Playbook for Future Power Systems frames AI and electricity grids as now mutually rewriting each other's rules: AI is moving into the operating core of power systems (Envision's autonomous industrial energy management), power availability is becoming a binding constraint on AI deployment (Hithium's fast-deploy storage, China's 15th Five-Year Plan coordination), and AI is emerging as the mechanism by which grids sense and recover from shocks in milliseconds rather than minutes — making AI procurement and energy planning decisions that were once made separately now structurally interdependent.", "themes": [{"theme": "AI enters the grid's operating core", "insights": [{"claim": "The IEA estimates data-center electricity consumption could roughly double by 2030, while new transmission lines take years to permit, finance and build and new AI workloads can arrive in months — a persistent mismatch between infrastructure and computational timescales.", "speaker": "World Economic Forum", "type": "causal", "entities": ["International Energy Agency", "data centres"], "conviction": "high", "so_what": "This timescale mismatch (years for grid infrastructure vs. months for AI compute deployment) is the structural bottleneck behind data-center power constraints — a key variable for handicapping AI infrastructure capex timelines and grid-equipment investment theses.", "quote": null, "locator": "The International Energy Agency (IEA) estimates", "quote_verified": false}, {"claim": "Industrial facilities, commercial buildings and distributed storage assets are increasingly running continuous optimization loops that decide in real time whether to generate, store, consume or sell electricity, blurring the traditional line between energy producer and energy consumer.", "speaker": "Lei Zhang", "type": "causal", "entities": ["Envision", "virtual power plants"], "conviction": "high", "so_what": "As industrial energy users become active grid participants, the addressable market for AI-driven energy-management software expands from utilities alone to millions of individual buildings and industrial sites.", "quote": "Industrial facilities that were once passive users of electricity are becoming autonomous energy managers, continuously balancing on-site solar, battery storage and grid interaction without compromising production", "locator": "Take, for example, Envision", "quote_verified": true}, {"claim": "Envision, a Chinese wind-turbine, storage and energy-management-software provider, has deployed an 'AI Power System' for industrial parks that runs continuous generation, storage and consumption optimization at the facility level.", "speaker": "World Economic Forum", "type": "data_point", "entities": ["Envision", "Lei Zhang"], "conviction": "medium", "so_what": "A concrete named vendor and product (Envision's AI Power System) to track as a comparable for the emerging AI-for-grid-edge-optimization category, largely China-based so far.", "quote": null, "locator": "Envision, a Chinese company", "quote_verified": false}]}, {"theme": "Power becomes a binding constraint on AI deployment", "insights": [{"claim": "Hithium's storage strategy pairs long-duration storage at the energy source with a lithium-sodium system at the load side, delivering grid-scale reliability with millisecond response on 1-2 year deployment timelines rather than the conventional 5-10 years.", "speaker": "Dr. Nazar Yi", "type": "data_point", "entities": ["Hithium"], "conviction": "high", "so_what": "A concrete vendor claim (1-2 year deployment vs. 5-10 year conventional) worth benchmarking against other battery/storage providers competing for hyperscaler co-location contracts.", "quote": "AI is scaling faster than power infrastructure can be built. Fast-response storage combined with long-duration flexibility provides the reliability that AI data centre operators require, while enabling co-location of the large renewable capacity that hyperscalers increasingly demand", "locator": "Their approach pairs long-duration storage", "quote_verified": true}, {"claim": "China's energy plans for the 15th Five-Year Plan period (2026-2030) explicitly call for closer coordination between computing, power and renewable-energy infrastructure, linking 'power for AI' with 'AI for power.'", "speaker": "World Economic Forum", "type": "data_point", "entities": ["China", "15th Five-Year Plan"], "conviction": "high", "so_what": "Signals China is formalizing AI-grid co-planning at the national policy level — a policy datapoint for comparing state-directed vs. market-driven AI-energy buildout models.", "quote": null, "locator": "China's new energy plans for the 15th Five-Year Plan", "quote_verified": false}]}, {"theme": "AI as a grid-resilience mechanism", "insights": [{"claim": "As grids carry more variable renewables and face rising extreme-weather and cyber risk, resilience is shifting from a function of reserve capacity to a function of response speed — AI-enabled systems can detect anomalies, reroute flows and coordinate storage in milliseconds, versus the minutes human operators need.", "speaker": "Dr. Nazar Yi", "type": "causal", "entities": ["Hithium"], "conviction": "high", "so_what": "Reframes grid resilience economics: as outage costs for data centers and financial systems rise, millisecond-speed AI-coordinated response becomes cost-justified over pure reserve-capacity buildout — relevant to how utilities budget for grid-hardening capex.", "quote": "In the AI era, resilience is no longer defined by backup power alone. It is the ability of energy storage systems to sense, respond and adapt in real time, keeping critical infrastructure operating even as power systems become more dynamic and uncertain", "locator": "The next step is infrastructure with intelligence stitched through it", "quote_verified": true}, {"claim": "The WEF's Innovation Playbook for Future Power Systems organizes the AI-grid convergence into three themes: AI entering the operating core of power systems, power systems becoming a binding condition for AI deployment, and AI emerging as a mechanism through which grids absorb shocks.", "speaker": "World Economic Forum", "type": "fra // ---------- helpers ----------
// YouTube-aligned hex colors for tinted insight chips (bg = color+"1a", text = color, border = color+"55").
const TYPE_HEX = {
  thesis: '#6366f1', prediction: '#0ea5e9', framework: '#8b5cf6',
  data_point: '#059669', causal: '#d97706', contrarian: '#dc2626',
  anecdote: '#64748b',
};
const CONV_HEX = { high: '#16a34a', medium: '#ca8a04', low: '#94a3b8', exploratory: '#94a3b8' };
function typeHex(t) { return TYPE_HEX[String(t || '').toLowerCase()] || '#475569'; }
function convHex(c) { return CONV_HEX[String(c || '').toLowerCase()] || '#64748b'; }

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }

// Tinted chip (YouTube style): faint bg, colored text + border.
function tintChip(text, color) {
  return `<span class="chip" style="background:${color}1a;color:${color};border-color:${color}55">${escapeHtml(text)}</span>`;
}
function tagPills(tags) {
  if (!tags || !tags.length) return '';
  return tags.map(t => `<span class="pill tag">${escapeHtml(t)}</span>`).join(' ');
}

// ---------- rendering ----------
// Insight presentation ported from the YouTube digest: type/conviction tinted
// chips, speaker as a 🗣 chip, and entities as indigo chips — all in the meta row
// directly under the claim. Quote treatment is INTENTIONALLY kept as Concepts'
// verbatim + "✓ verified" (stronger than YouTube's ≈ paraphrase wording).
function renderInsight(ins) {
  if (!ins) return '';
  const cls = 'insight' + (ins.type ? (' ' + String(ins.type).toLowerCase()) : '');
  const meta = [];
  if (ins.type) meta.push(tintChip(ins.type, typeHex(ins.type)));
  if (ins.speaker) meta.push(`<span class="chip chip-spk">🗣 ${escapeHtml(ins.speaker)}</span>`);
  if (ins.conviction) meta.push(tintChip('conviction: ' + ins.conviction, convHex(ins.conviction)));
  (ins.entities || []).slice(0, 12).forEach(e => {
    if (e) meta.push(`<span class="chip chip-ent">${escapeHtml(e)}</span>`);
  });
  let quote = '';
  if (ins.quote) {
    const v = ins.quote_verified
      ? `<span class="vmark">✓ verified</span>`
      : `<span class="vmark no">unverified</span>`;
    quote = `<div class="quote">“${escapeHtml(ins.quote)}”${v}</div>`;
  }
  const so = ins.so_what
    ? `<div class="insight-so"><span class="lbl">so what</span>${escapeHtml(ins.so_what)}</div>` : '';
  return `
    <div class="${cls}">
      <div class="insight-claim">${escapeHtml(ins.claim || '')}</div>
      <div class="insight-meta">${meta.join('')}</div>
      ${so}
      ${quote}
    </div>`;
}

function renderTheme(theme) {
  const insights = (theme.insights || []).map(renderInsight).join('');
  return `
    <div class="theme">
      <div class="theme-title">${escapeHtml(theme.theme || 'Theme')}</div>
      ${insights}
    </div>`;
}

function renderCard(card) {
  if (!card) return '';
  const meta = card.source_meta || {};
  const nameHtml = card.source_url
    ? `<a class="source-name" href="${escapeAttr(card.source_url)}" target="_blank" rel="noopener">${escapeHtml(card.source_name || '')}</a>`
    : `<span class="source-name">${escapeHtml(card.source_name || '')}</span>`;
  const subBits = [];
  if (card.published_date) subBits.push(escapeHtml(card.published_date));
  if (meta.author) subBits.push(escapeHtml(meta.author));
  if (meta.word_count) subBits.push(`${meta.word_count} words`);
  if (meta.paywalled) subBits.push('paywalled');
  const themes = (card.themes || []).map(renderTheme).join('');
  const n = card.insight_total != null ? card.insight_total
            : (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
  return `
    <div class="source">
      <div class="source-head" onclick="toggleSource(this)">
        <div class="source-meta-left">
          <div class="source-name-row">${nameHtml}</div>
          <div class="source-title">${escapeHtml(card.title || '')}</div>
          <div class="source-sub">${subBits.join('  ·  ')}</div>
        </div>
        <span class="source-count">${n} insight${n === 1 ? '' : 's'}</span>
        <span class="source-arrow">▸</span>
      </div>
      <div class="source-body">
        ${card.gist ? `<div class="gist">${escapeHtml(card.gist)}</div>` : ''}
        ${card.tags && card.tags.length ? `<div class="tags">${tagPills(card.tags)}</div>` : ''}
        ${themes || '<div class="empty">No insights.</div>'}
      </div>
    </div>`;
}

function renderTopStats(d) {
  const s = d.stats || {};
  const parts = [];
  if (d.date) parts.push(`date <strong>${escapeHtml(d.date)}</strong>`);
  if (s.lookback_days != null) parts.push(`lookback <strong>${s.lookback_days}d</strong>`);
  if (s.sources != null) parts.push(`sources <strong>${s.sources}</strong>`);
  if (s.cards != null) parts.push(`cards <strong>${s.cards}</strong>`);
  if (s.insights != null) parts.push(`insights <strong>${s.insights}</strong>`);
  if (s.quote_verified_pct != null) parts.push(`quotes verified <strong>${s.quote_verified_pct}%</strong>`);
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSource(headEl) { headEl.parentElement.classList.toggle('open'); }

function insightCount(card) {
  return (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
}

// Build the sort/filter control bar (display only — re-groups REPORT_DATA in place).
function buildControls(d) {
  const cards = d.cards || [];
  const names = [...new Set(cards.map(c => c.source_name || '—'))].sort((a, b) => a.localeCompare(b));
  const opts = names.map(n => `<option value="${escapeAttr(n)}">${escapeHtml(n)}</option>`).join('');
  document.getElementById('controls').innerHTML =
    `<label>Sort
       <select id="sortSel">
         <option value="source">Source A–Z</option>
         <option value="insights">Insight count ▼</option>
       </select></label>
     <label>Source
       <select id="srcSel">
         <option value="__all">All sources (${names.length})</option>
         ${opts}
       </select></label>
     <span class="ctl-btns">
       <button type="button" id="expandAll">Expand all</button>
       <button type="button" id="collapseAll">Collapse all</button>
     </span>`;
  document.getElementById('sortSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('srcSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('expandAll').addEventListener('click', () => setAllGroups(false));
  document.getElementById('collapseAll').addEventListener('click', () => setAllGroups(true));
}

// Group-level collapse: header click toggles one group; the control-bar buttons toggle all.
function toggleGroup(headEl) { headEl.parentElement.classList.toggle('collapsed'); }
function setAllGroups(collapsed) {
  document.querySelectorAll('.group').forEach(g => g.classList.toggle('collapsed', collapsed));
}

// Group cards by source, sort groups (and cards within), optionally filter to one source.
function renderGroups(d) {
  const sortMode = (document.getElementById('sortSel') || {}).value || 'source';
  const srcFilter = (document.getElementById('srcSel') || {}).value || '__all';
  let cards = (d.cards || []).slice();
  if (srcFilter !== '__all') cards = cards.filter(c => (c.source_name || '—') === srcFilter);

  const groups = new Map();
  cards.forEach(c => {
    const k = c.source_name || '—';
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(c);
  });
  let entries = [...groups.entries()].map(([name, cs]) => ({
    name, cards: cs, insights: cs.reduce((a, c) => a + insightCount(c), 0),
  }));
  if (sortMode === 'insights') entries.sort((a, b) => b.insights - a.insights || a.name.localeCompare(b.name));
  else entries.sort((a, b) => a.name.localeCompare(b.name));
  // Within each source group, heaviest cards first.
  entries.forEach(e => e.cards.sort((a, b) => insightCount(b) - insightCount(a)));

  const html = entries.map(e => {
    const head = `<div class="group-head" onclick="toggleGroup(this)">`
      + `<span class="group-name">${escapeHtml(e.name)}</span>`
      + `<span class="group-meta">${e.cards.length} card${e.cards.length === 1 ? '' : 's'} · ${e.insights} insights</span>`
      + `<span class="group-arrow">▾</span></div>`;
    return `<div class="group">${head}<div class="group-body">${e.cards.map(renderCard).join('')}</div></div>`;
  }).join('');

  const app = document.getElementById('app');
  app.innerHTML = html || '<div class="empty">No cards for this source.</div>';
  // Open the first two source cards by default.
  document.querySelectorAll('.source').forEach((sec, i) => { if (i < 2) sec.classList.add('open'); });
}

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  document.getElementById('stats-top').innerHTML = renderTopStats(d);
  buildControls(d);
  renderGroups(d);   // default: grouped, sorted by source A–Z
}

renderReport(REPORT_DATA);
</script>
