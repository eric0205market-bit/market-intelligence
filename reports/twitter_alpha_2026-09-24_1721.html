<title>Twitter Alpha Intelligence</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root {
  --bg: #faf8f5;
  --surface: #ffffff;
  --border: #e8e3da;
  --border-light: #f0ede4;
  --text: #1a1a1a;
  --text-2: #555;
  --text-3: #8a8a8a;
  --accent: #1a8cd8;
  --red: #d94052;
  --yellow: #fff5b3;
  --yellow-border: #f0d966;

  /* category colors (per spec) */
  --cat-macro: #2563eb;        /* blue */
  --cat-crypto: #8b5cf6;       /* purple */
  --cat-energy: #dc2626;       /* red */
  --cat-tech: #0d9488;         /* teal */
  --cat-ai: #4f46e5;           /* indigo */
  --cat-geopolitics: #dc2626;  /* red */
  --cat-positioning: #15803d;  /* green */
  --cat-regulation: #7c3aed;   /* purple */
  --cat-society: #d97706;      /* amber */
  --cat-em: #059669;           /* green */
  --cat-default: #6b7280;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; line-height: 1.55;
       background: var(--bg); color: var(--text); }
.container { max-width: 960px; margin: 0 auto; padding: 24px 16px 80px; }

/* HEADER */
.header { display: flex; justify-content: space-between; align-items: baseline;
          border-bottom: 2px solid var(--text); padding-bottom: 12px; margin-bottom: 20px; }
.title { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
.subtitle { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-3); }

/* FILTER BAR */
.filter-bar { display: none; background: var(--yellow); border: 1px solid var(--yellow-border);
              border-radius: 6px; padding: 8px 12px; margin-bottom: 16px;
              align-items: center; gap: 10px; font-size: 13px; }
.filter-bar.active { display: flex; }
.filter-bar button { font-family: inherit; font-size: 12px; background: transparent;
                     border: 1px solid var(--text); padding: 3px 10px; border-radius: 4px;
                     cursor: pointer; }
.filter-bar button:hover { background: rgba(0,0,0,0.05); }

/* SUMMARY */
.summary { background: var(--surface); border: 1px solid var(--border);
           border-left: 4px solid var(--red); border-radius: 6px;
           padding: 16px 18px; margin-bottom: 20px; }
.summary p { margin-bottom: 8px; }
.summary p:last-child { margin-bottom: 0; }
.summary strong { font-weight: 600; }

/* SECTIONS */
.section { background: var(--surface); border: 1px solid var(--border);
           border-radius: 6px; margin-bottom: 14px; overflow: hidden; }
.section-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px;
                background: #f3efe6; cursor: pointer; user-select: none;
                font-weight: 600; font-size: 13px; }
.section-head:hover { background: #ebe6dc; }
.section-letter { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
                  color: var(--text-3); min-width: 18px; }
.section-name { flex: 1; }
.section-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
                 color: var(--text-3); }
.section-arrow { font-size: 10px; color: var(--text-3); transition: transform .2s; }
.section.open .section-arrow { transform: rotate(90deg); }
.section-body { display: none; padding: 6px 0; }
.section.open .section-body { display: block; }

/* CLUSTER (Section A) */
.cluster { padding: 14px 16px; border-bottom: 1px solid var(--border-light); }
.cluster:last-child { border-bottom: none; }
.cluster-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
                flex-wrap: wrap; }
.cluster-title { font-weight: 600; font-size: 14px; }
.cluster-desc { color: var(--text-2); font-size: 13px; margin: 0 0 10px 0; }
.cluster-items { display: flex; flex-direction: column; gap: 8px; padding-left: 10px;
                 border-left: 2px solid var(--border-light); }
.cluster-item { font-size: 13px; padding: 6px 8px; border-radius: 4px; }
.cluster-item .item-text { font-size: 13px; margin-top: 4px; }
.cluster-item .item-head { font-size: 12px; }

/* ITEM CARDS (Sections B/C/D) */
.item-card { background: var(--surface); border: 1px solid var(--border);
             border-radius: 6px; padding: 12px 14px; margin: 10px 16px; }
.item-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
             flex-wrap: wrap; }
.item-author { font-weight: 600; color: var(--accent); cursor: pointer; }
.item-author:hover { text-decoration: underline; }
.item-time { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--text-3); }
.item-link { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--accent); text-decoration: none; }
.item-link:hover { text-decoration: underline; }
.item-text { font-size: 13.5px; line-height: 1.6; color: var(--text);
             white-space: pre-wrap; word-wrap: break-word; }
.item-thread { display: inline-block; font-size: 10px; font-weight: 600;
               background: var(--border); color: var(--text-2); padding: 1px 6px;
               border-radius: 3px; text-transform: uppercase; letter-spacing: .04em; }

/* CONTRARIAN (Section C) — red left border + soft red bg */
.section-contrarian .item-card {
  border-left: 4px solid var(--red);
  background: #fdf6f7;
}

/* CATEGORY PILLS */
.pill { display: inline-block; font-family: 'IBM Plex Mono', monospace; font-size: 10px;
        font-weight: 500; padding: 2px 7px; border-radius: 3px; color: #fff;
        text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }

/* IMAGES */
.thumbs { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.thumb { height: 100px; border: 1px solid var(--border); border-radius: 4px;
         cursor: zoom-in; background: #f0ede4; }

/* LIGHTBOX */
.lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85);
            align-items: center; justify-content: center; z-index: 100; cursor: zoom-out; }
.lightbox.open { display: flex; }
.lightbox img { max-width: 92vw; max-height: 92vh;
                box-shadow: 0 8px 40px rgba(0,0,0,.6); }

/* LINKS (Section E) */
.link-row { padding: 8px 16px; border-bottom: 1px solid var(--border-light);
            font-size: 13px; display: flex; gap: 12px; align-items: baseline; }
.link-row:last-child { border-bottom: none; }
.link-author { color: var(--text-3); min-width: 110px; cursor: pointer; }
.link-author:hover { color: var(--accent); }
.link-url { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
            color: var(--accent); text-decoration: none; word-break: break-all; flex: 1; }
.link-url:hover { text-decoration: underline; }
.link-desc { color: var(--text-2); font-size: 12px; }

/* AUTHOR FILTER STATES */
.filterable.match { background: var(--yellow); border-color: var(--yellow-border); }
.section-contrarian .item-card.filterable.match { background: var(--yellow); }
.filterable.dim { opacity: 0.25; }

/* STATS BAR */
.stats { margin-top: 24px; padding: 10px 14px; background: var(--surface);
         border: 1px solid var(--border); border-radius: 6px;
         font-family: 'IBM Plex Mono', monospace; font-size: 11.5px;
         color: var(--text-2); display: flex; gap: 18px; flex-wrap: wrap; }
.stats strong { color: var(--text); font-weight: 600; }

/* EMPTY */
.empty { color: var(--text-3); font-size: 13px; padding: 14px 18px; font-style: italic; }

/* RESPONSIVE */
@media (max-width: 640px) {
  .container { padding: 16px 12px 60px; }
  .item-card { margin: 8px 10px; }
  .link-row { flex-direction: column; gap: 4px; }
  .link-author { min-width: 0; }
  .header { flex-direction: column; align-items: flex-start; gap: 4px; }
}
</style>

const REPORT_DATA = {"report_type": "TWITTER ALPHA INTELLIGENCE", "collected_at": "2026-09-24T17:21:00Z", "input_stats": {"total_tweets": 187, "unique_authors": 68, "tweets_with_images": 39, "after_noise_filter": 76}, "summary": "**Iran/Hormuz:** Reuters reported the US and Iran are discussing a phased deal to reopen the Strait of Hormuz in exchange for lifting the economic blockade, sending a visible bid through SPY/QQQ; traders flagged the pre-midterm timing as politically convenient for Trump, while the Trump-Xi meeting mostly produced symbolic wins (panda diplomacy) — **Andy Constan** noted 21 months of US-China talks have yielded little concrete progress versus the more tangible (if costlier) outcomes with Iran.\n\n**Rates/Macro:** The entire UST curve from 5- to 30-year is now trading above 5%, with 30-year yields at the highest since 2004 and German/French/Japanese long yields also at multi-decade highs; **Mohamed El-Erian** flagged the weakening yen (159/USD) approaching its FX-intervention zone as a fresh source of Treasury pressure, while **Andy Constan** pushed back hard on viral \"scary fiscal math\" threads, arguing the incremental interest-cost impact of a 100bp higher-for-longer path is \"trivial in a $30T GDP\" and that he's positioned for 30-year yields to drift toward 5.75% over the next two months.\n\n**Crypto:** **Ran Neuner**, in a wide-ranging Unchained interview with **Laura Shin**, argued Zcash is \"more useful than Bitcoin,\" that social-trading apps like FOMO will eventually eclipse exchanges like Binance, and that altcoins could outperform BTC by 7x this cycle as protocols finally capture real TradFi-adjacent revenue; **alpha_pls** built a complementary thesis that BTC maturing into a calmer, hard-money store-of-value — rather than a risk-on tech proxy — is the structural setup for the most sustainable altseason yet, while **zeroxkyle** offered the contrarian counterpoint that on-chain speculation is \"permanently cooked\" because AI has made slick-looking scam projects free to produce.\n\n**Positioning:** **rektmando** covered shorts and bought alts into an OI-cleanse low, expecting tourist institutional capital (HFs, family offices, VCs) to chase the best altcoin narratives at premium multiples as prices recover; **Zeneca** reiterated a buy-and-hold-the-winners stance (ZEC, NEAR, VVV, HYPE); **aleabitoreddit** ran detailed capital-structure critiques of $AAOI's repeated ATM dilution and flagged Nebius's ($NBIS) relative outperformance versus Oracle's Project Jupiter execution risk.\n\n**AI/Tech:** Jensen Huang, on the All-In Podcast, argued China's open-source contributions mean the US doesn't need every AI battle won by closed frontier labs — 80% of the $400B deployed into AI-native startups over six months already runs on open models; **Paul Graham** needled the AP style guide's ban on \"anthropomorphizing\" AI language as already-obsolete usage, while **hoeem** circulated BlackRock's seven AI-crypto convergence narratives alongside a warning that many \"AI compute\" tokens have zero value accrual despite real underlying demand.\n\n**Notable:** Meta's VR glasses and \"Muse Charm\" AI pendant launch drew mixed reviews — **Udi Wertheimer** argued Apple's Vision Pro remains technically superior but irrelevant given price and weight — while Ondo's new BlackRock-powered tokenized portfolios barely moved $ONDO, which **Stacy Muur** called out as evidence the market has gone numb to \"institutional adoption\" headlines.", "sections": {"A_events": [{"cluster": "US-Iran Discuss Phased Hormuz Deal", "category": ["geopolitics", "energy", "macro"], "items": [{"author": "Geiger_Capital", "summary": "Flagged the Reuters headline \"US and Iran discuss deal to reopen Hormuz and end US blockade\" with a one-word verdict: \"Good enough... Send it.\"", "tweet_url": "https://x.com/Geiger_Capital/status/2103161376659091645", "images": ["https://pbs.twimg.com/media/HS_uICUW4AA7QvD.jpg"], "type": "tweet"}, {"author": "aleabitoreddit", "summary": "Explained the sudden SPY/QQQ candle: Reuters reported the US and Iran are discussing a phased agreement where Iran reopens Hormuz in exchange for Washington lifting its blockade. Noted a deal before the midterms would benefit Trump by easing Gulf tensions, containing oil prices, and lowering politically sensitive gasoline prices — Trump has said he expects a deal after the November midterms — and argued the White House has an incentive to keep markets strong into the election.", "tweet_url": "https://x.com/aleabitoreddit/status/2103161145934963178", "images": ["https://pbs.twimg.com/media/HS_t6kUa4AAd3_A.jpg", "https://pbs.twimg.com/media/HS_t6kVbYAMoolp.jpg"], "type": "tweet"}, {"author": "Evan_ss6", "summary": "Posted \"END THE WAR\" reacting to the same Hormuz headline, then flagged the concurrent Trump-Xi meeting as a positive catalyst, predicting \"good news next week, maybe the week after\" and telling followers to study the leaders' last meeting for clues.", "tweet_url": "https://x.com/Evan_ss6/status/2103147454199705929", "images": ["https://pbs.twimg.com/media/HS_hdaYXgAAo8l9.jpg"], "type": "thread"}, {"author": "JavierBlas", "summary": "Chart of the day: among industrialized economies, the response to the US-Iran war diverged sharply — Europe released very little oil into the market while the US did the opposite, per IEA data on monthly output changes from January to July.", "tweet_url": "https://x.com/JavierBlas/status/2103141087254884519", "images": ["https://pbs.twimg.com/media/HS_bW3DW4AAVx5M.png"], "type": "tweet"}]}, {"cluster": "UST Curve Blows Out to Multi-Decade Highs", "category": ["macro"], "items": [{"author": "Geiger_Capital", "summary": "Flagged US 30-year yields at the highest since 2004, Japan's 10-year at the highest since 1996, France's 10-year highest since 2008, and Germany's 10-year highest since 2009 — arguing it's \"time for Bessent to put his foot down.\"", "tweet_url": "https://x.com/Geiger_Capital/status/2103118843061182872", "images": ["https://pbs.twimg.com/tweet_video_thumb/HS_HcC8XYAAgHn-.jpg"], "type": "tweet"}, {"author": "elerianm", "summary": "Noted the entire US Treasury curve from 5- to 30-year maturities is now trading above 5% as yields edged higher again this morning, citing an FT chart.", "tweet_url": "https://x.com/elerianm/status/2103144636659450150", "images": ["https://pbs.twimg.com/media/HS_ey-9awAA7khZ.png"], "type": "tweet"}, {"author": "AndreasSteno", "summary": "With yield curves inverting again in several places, said he's \"counting down until we hear recession chatter all over.\"", "tweet_url": "https://x.com/AndreasSteno/status/2103053619712938164", "type": "tweet"}, {"author": "Fullcarry", "summary": "Argued the Fed's removal of forward guidance was bound to cause hiccups as leveraged players (dealers, hedge funds, locals) readjust, but that USTs are now in a \"great place\" with a healthy uncertainty premium built across the curve — framing it as more about Fed-path uncertainty (every meeting a toss-up) than a pure term-premium story.", "tweet_url": "https://x.com/Fullcarry/status/2103114501537288323", "type": "thread"}]}, {"cluster": "Trump-Xi Meeting: Panda Diplomacy, Little Substance", "category": ["geopolitics"], "items": [{"author": "Geiger_Capital", "summary": "Highlighted China's Xi announcing he'll send two giant pandas to the Atlanta Zoo as a gift to the American people, calling the meeting \"already a massive success\" on the strength of panda diplomacy alone.", "tweet_url": "https://x.com/Geiger_Capital/status/2103134130951106590", "images": ["https://pbs.twimg.com/media/HS_VWG7WEAAIG5O.jpg"], "type": "tweet"}, {"author": "dampedspring", "summary": "Andy Constan pushed back on the optimism, asking pointedly whether anything at all had actually been accomplished on US-China trade in the last 21 months — contrasting it with Iran, where \"a bunch of old folks are dead and perhaps nuclear capabilities have been weakened,\" i.e., at least something changed.", "tweet_url": "https://x.com/dampedspring/status/2103137903375261714", "type": "thread"}]}, {"cluster": "Meta Unveils VR Glasses and \"Muse Charm\" AI Pendant", "category": ["tech", "AI"], "items": [{"author": "udiWertheimer", "summary": "Broke down why Meta's glasses are lighter than expected — moving compute to an external puck and stripping dumb components like the outer screen. Argued Apple's Vision Pro remains the technically superior device but is a non-starter given price, weight and \"clumsy look,\" and that Apple should probably let Meta take the early mistakes and answer in ~18 months rather than rush a response.", "tweet_url": "https://x.com/udiWertheimer/status/2103115759304179825", "type": "thread"}, {"author": "santiagoroel", "summary": "Quipped that Meta is \"doing what Apple and Google couldn't\" with the glasses launch.", "tweet_url": "https://x.com/santiagoroel/status/2103036870493917350", "type": "tweet"}, {"author": "cryptopunk7213", "summary": "Speculated Meta's Muse Charm pendant could evolve into a voice-driven \"third device\" beyond phone/laptop, valuable specifically for what it does when you're *not* actively using it — an ambient device that observes and proactively suggests or acts. Separately noted that a single prolific shitposter (comparing to OpenAI's Tibo and SpaceX's Elon) likely drove 30-50% of Muse signups in the last 48 hours.", "tweet_url": "https://x.com/cryptopunk7213/status/2103145151552266702", "type": "thread"}]}, {"cluster": "HYPE Lists on Binance Spot", "category": ["crypto"], "items": [{"author": "sjdedic", "summary": "Asked whether the Binance spot listing marks the top of \"a legendary HYPE run.\"", "tweet_url": "https://x.com/sjdedic/status/2103026461498016255", "type": "tweet"}, {"author": "ViktorDefi", "summary": "Noted Binance has \"clearly lost it to Upbit\" on listing speed, observing no price impact on HYPE from the announcement.", "tweet_url": "https://x.com/ViktorDefi/status/2103061465544483238", "type": "thread"}]}, {"cluster": "Ondo Launches BlackRock-Powered Tokenized Portfolios, Market Shrugs", "category": ["crypto", "regulation"], "items": [{"author": "stacy_muur", "summary": "Pointed out that Ondo partnering with BlackRock to launch \"Ondo Intelligent Portfolios\" (curated onchain investment portfolios) moved $ONDO by barely $0.10 — arguing this news would have sent the token straight to $2 in 2021, evidence that \"institutional adoption\" headlines no longer move price the way they used to.", "tweet_url": "https://x.com/stacy_muur/status/2103163810723070037", "images": ["https://pbs.twimg.com/media/HS_wVv0bAAA0tmd.jpg"], "type": "tweet"}, {"author": "goodalexander", "summary": "Added context on why the market may be pricing this in more calmly than prior Ondo/BlackRock news: Ondo likely had to pay BlackRock for the arrangement, and people now understand that dynamic better than they did previously.", "tweet_url": "https://x.com/goodalexander/status/2103168573778833895", "type": "tweet"}]}, {"cluster": "Record Negative SPX Dealer Gamma, Market Barely Blinks", "category": ["macro", "positioning"], "items": [{"author": "spotgamma", "summary": "Noted yesterday produced the largest negative delta reading in SPX history at -$20bn, yet the index only declined 75bps — the prior most-negative reading (-$18bn on 10/10/25) had coincided with a sharp -2.75% candle. In a separate reply floated that \"the PPT is back,\" since upside vol has been realizing more than downside despite wild recent moves in oil and rates.", "tweet_url": "https://x.com/spotgamma/status/2103110395661832247", "images": ["https://pbs.twimg.com/media/HS--76LXoAApLcM.jpg"], "type": "tweet"}]}, {"cluster": "DTC Explores Tokenizing TradFi Custody Positions", "category": ["crypto", "regulation"], "items": [{"author": "Delphi_Digital", "summary": "Reported that the DTC — which sits at the center of US securities custody and settlement — is developing a service letting approved institutions tokenize positions already held there, convertible back to traditional holdings when needed. Because those securities already sit in DTC's system, institutions could use existing positions for onchain settlement, collateral and lending, opening a path for much larger balances to move onchain via infrastructure the market already trusts; public-chain issuers could eventually draw on DTC's inventory for creation/redemption, giving onchain markets a far larger stock-token supply to work with.", "tweet_url": "https://x.com/Delphi_Digital/status/2103112712817652220", "type": "thread"}]}], "B_insights": [{"author": "dampedspring", "summary": "Andy Constan ran a dense macro/rates thread. First, a definitional point: classic YCC is a zero-rate-lever central bank tool used to fight disinflation, whereas eliminating 10-30yr bond issuance in favor of bills (a \"treasury twist\") is functionally an attempt to control the yield curve even though it isn't textbook YCC — labels should be used with precision. He then rebutted a viral \"scary fiscal math\" thread on rising debt-servicing costs: $7T of bills are already at market rates (no incremental cost from a 100bp move), new debt of $1.8T at 6% adds ~$72bn, and $3T of maturing debt refinancing from ~2.75% to ~5.75% adds ~$90bn — for a total incremental cost of roughly $160bn, which he calls \"trivial in a $30T GDP.\" Separately said he's positioned for 30-year yields to drift toward 5.75% over the next two months, and flagged that manipulating nominal yields via buybacks/supply changes compresses inflation breakevens, making that \"market-based\" inflation gauge more artificially anchored than it looks.", "tweet_url": "https://x.com/dampedspring/status/2103112288324485603", "images": ["https://pbs.twimg.com/media/HS_BevRXYAAUIml.jpg"], "type": "thread", "category": ["macro", "positioning"]}, {"author": "laurashin", "summary": "In an extended Unchained interview, Ran Neuner argued Zcash is \"more useful than Bitcoin\" because private, transparent-free money beats fully traceable money, even if that's heretical to say. He predicted social-trading apps will eventually replace exchanges — not necessarily FOMO itself, but \"a version of FOMO\" combining social networking with trading that's simply more fun than trading on an exchange, which he says is already true today. On the debasement-hedge thesis vs. real-world adoption, he argued BTC validated the core technology (scarce, transferable digital assets) but smart contracts only recently found product-market fit via \"tokenize everything and make it social,\" plus AI agents, which he says are \"pretty screwed\" without smart-contract rails to transact and form agreements with counterparties they don't know. Finally, he projected altcoins could outperform BTC by 7x this cycle, noting alts outperformed BTC by 19x in 2017 and 6x in 2021, and that TOTAL2/TOTAL3 charts show an upward-sloping trend of altcoin technology improving relative to BTC over time.", "tweet_url": "https://x.com/laurashin/status/2103168454564118748", "type": "thread", "category": ["crypto"]}, {"author": "laurashin", "summary": "Separately hosted NEAR's Illia Polosukhin and Mert to unpack why ZEC (+32%) and NEAR (+69%) both ripped this week, framing it as confidential transactions finally making crypto usable for real businesses — a \"Bitcoin DeFi dream, minus Bitcoin.\" Topics covered coffee-shop-level balance visibility as a genuine business risk, privacy as a retention tool rather than just an onboarding hook, NEAR Intents' $206M in TVL, the Zcash counterfeit bug and Ironwood migration, and NEAR's Shield AI/MPC guardrails for managing solver risk ahead of the NU7 upgrade (faster blocks, quantum-proofing, private voting).", "tweet_url": "https://x.com/laurashin/status/2103156240683507749", "type": "thread", "category": ["crypto"]}, {"author": "alpha_pls", "summary": "Argued BTC may be shifting from a risk-on tech proxy (the 2020-era institutional phase) toward behaving as a genuine hard-money store of value — and if that holds, it changes the setup for alts entirely. A calmer BTC that doesn't \"rug every time risk sells off\" would be a real tailwind, and TOTAL2/TOTAL3/OTHERS charts already show alts leading BTC in breaking bullish structure. The core bull case: this cycle's leading alts have real PMF, revenue, expanding TAMs (into TradFi, not just crypto) and buybacks as the standard — unlike prior cycles where tokens were pure speculation. Agentic trading is framed as a free call option on top if it scales over the next two years. Conclusion: markets are underweight good alts, and the old \"alts are all vapor\" mental model no longer applies to today's s-tier tokens.", "tweet_url": "https://x.com/alpha_pls/status/2103151816401621205", "images": ["https://pbs.twimg.com/media/HS_h8fVXwAAFIhY.jpg"], "type": "thread", "category": ["crypto", "positioning"]}, {"author": "zeroxkyle", "summary": "Argued on-chain trading is being permanently distorted by AI-enabled software: AI is great for small, fast-shipping niche projects but hard to integrate at the enterprise level, producing K-shaped outcomes where the largest corporations see limited productivity gains while individual builders ship fast. Applied to on-chain, this creates a \"lemon market\" problem — projects that look polished on the surface (since visual/website effort is now free) may be run by scammers, and it's very hard to tell good from bad. His conclusion: it's better to concentrate risk in names defined by parameters beyond the software itself — team and founder quality above all, since ideas are now cheap to copy (citing the wave of inference-market clones after Orbio's ATH). He also argues alts above $1B market cap are easier to underwrite than sub-$10M microcaps, since reaching that cap already proves something.", "tweet_url": "https://x.com/zeroxkyle/status/2103106542522478806", "type": "tweet", "category": ["crypto", "positioning"]}, {"author": "aleabitoreddit", "summary": "Ran a detailed capital-structure critique of $AAOI: after a $500M ATM in April and $600M in June, the company filed another $600M ATM in August, following $IREN's playbook that he says kept that stock rangebound for half a year. He contrasted this with cleaner financing options peers have used — $AXTI's LTA prepayments, $NVDA/Nebius-style private placements, or convertible notes — arguing $600M of overhead selling pressure makes it hard for the stock to break $100-200 even though he sees the business as operationally very bullish for 2027 (with $471M/month transceiver revenue and 400k ELSFP units/month by 2028, single-digit forward P/E achievable). His core complaint: zero clarity on when the ATM loop ends or how much total funding is actually needed.", "tweet_url": "https://x.com/aleabitoreddit/status/2103151990146801812", "type": "thread", "category": ["tech", "positioning"]}, {"author": "aleabitoreddit", "summary": "Separately flagged Nebius's ($NBIS) relative outperformance as \"wild\" — up 6% even during a broader neocloud sector drop, after reports that Oracle is seeking payment protection on its New Mexico Project Jupiter buildout amid cost-increase risk. Noted he consolidated his 2025 neocloud thesis ($IREN, $CRWV) into Nebius specifically despite pushback at the time, including from institutional short sellers in December, and still sees the market underestimating NBIS's sum-of-parts growth into 2027+. In the same thread he said he'd cut his NBIS position on the move and flagged that $IREN's Mirantis acquisition could materially reshape how the market ranks it against $CRWV/$NBIS/Lambda/Tensorwave once integration completes, calling the software-side M&A the most bullish thing IREN has done.", "tweet_url": "https://x.com/aleabitoreddit/status/2103139052363133062", "images": ["https://pbs.twimg.com/media/HS_Z0jVbgAA9Gu7.jpg", "https://pbs.twimg.com/media/HS_Z0jObsAAq5ql.jpg"], "type": "thread", "category": ["tech", "positioning"]}, {"author": "hooeem", "summary": "Relayed BlackRock's framework of seven AI-crypto convergence narratives — compute-as-money ($PRL, $NOCK), agent payments ($NEAR, $ETH, $LINK), machine-readable assets, machine reserve ($BTC), fast/cheap rails, AI output markets, and verifiable private compute ($NEAR, $NOCK, $PRL, $TAO) — while separately warning followers not to chase every coin that fits the \"AI compute\" narrative: many have zero token value-accrual despite working products, with teams effectively extracting value via emissions, revenue and equity. Called out $RENDER specifically as having real GPU demand but a token that doesn't capture it well, risking heavy bagholding as emissions sell off.", "tweet_url": "https://x.com/hooeem/status/2103089427882950742", "type": "thread", "category": ["crypto", "AI"]}, {"author": "Rewkang", "summary": "Andrew Kang argued the first half of the year was a wake-up call for VCs on two fronts: reduced conviction in SaaS investability, and evidence that \"world of atoms\" companies (robotics) can produce extreme power-law outcomes. He says GPs and LPs across many firms are under pressure to reorient allocation strategy, 2026 is the first year robotics has really registered on VC radar, and he wouldn't be surprised to see annual private robotics investment exceed $100B by next year.", "tweet_url": "https://x.com/Rewkang/status/2103128505332674925", "images": ["https://pbs.twimg.com/media/HS_PszibcAABDKH.jpg", "https://pbs.twimg.com/media/HS_PvDbbgAAens3.jpg"], "type": "tweet", "category": ["tech", "positioning"]}, {"author": "Swedish_uranium", "summary": "Daily Metals Pulse: flash US composite PMI jumped to 58.4, the strongest expansion since July 2021, with input costs at a near-four-year high — keeping further Fed tightening in play. Framatome secured a commercial contract to supply a US reactor with 5%+-enriched fuel from 2028, extending operating cycles from 18 to 24 months. Silver faces a sixth straight annual supply deficit in 2026 per the Silver Institute even as sentiment weakens on rate expectations. Prysmian and Aurubis announced their largest-ever copper supply agreement, explicitly citing grid/electrification/AI-infrastructure demand. Gold remains pressured by rate-hike expectations, though easing oil offers some relief.", "tweet_url": "https://x.com/Swedish_uranium/status/2103017459418599547", "type": "tweet", "category": ["macro", "energy"]}, {"author": "paulg", "summary": "Paul Graham argued using \"think\" to describe LLM behavior is like 16th-century astronomers using heliocentric math without believing it — useful shorthand now, gradual acknowledgment of truth later — and mocked the AP style guide's ban on anthropomorphizing AI language as already behind current educated usage (\"usage is the whole point of a style guide\"). Separately floated that bot-detection/human-verification for websites is a large enough problem to spawn multiple startups (one variant to filter agents out, another to welcome them in an orderly way), and argued AI labs will retain pricing power for as long as they're the only ones whose models can solve genuinely hard problems.", "tweet_url": "https://x.com/paulg/status/2103135915195371973", "type": "thread", "category": ["AI", "tech"]}, {"author": "thedefiedge", "summary": "Highlighted 8 alts up 75%-1,676% this month, nearly all buying back tokens with real revenue tied to onchain stock trading: $STONK (+1,676%, memecoin/RWA hybrid launchpad), $NEAR (+146%, Intents volume >$30B), $RAY (+139%, benefiting from Solana's StonkFun/RWA activity), $ARB (+114%, Robinhood Chain revenue sharing), $VVV (+91%, Venice AI, >$100M annualized revenue funding buybacks), $BP (+90%, Backpack's onchain stock broker pivot), $UNI (+85%, fee switch finally live) and $PONS (+75%, Robinhood Chain launchpad, ~30% supply burned). Cautioned the Altcoin Season Index is only ~55 and just ~25% of top-500 supply sits in profit, so the rotation remains selective — preferring tokens where fundamentals genuinely improved over whatever's green that day.", "tweet_url": "https://x.com/thedefiedge/status/2103071445358145681", "type": "tweet", "category": ["crypto", "positioning"]}, {"author": "marcvanderchijs", "summary": "Argued classic index funds no longer work well because a growing share of constituents will become \"zombie companies\" left behind by AI — already ~45% of companies show negative beta by his read, and he expects 80-90% of all companies to end up as zombies (slower-than-GDP or no growth). His prescription: hold tech/AI-focused ETFs rather than broad indices, since index committees only rotate a handful of names each quarter, far too slow to track the AI-driven divergence; he also pointed to Anthropic's upcoming S-1 as evidence AI revenue growth is real, not just circular financing.", "tweet_url": "https://x.com/marcvanderchijs/status/2102996229978456569", "type": "thread", "category": ["macro", "AI", "tech"]}, {"author": "Delphi_Digital", "summary": "Analyzed FWA/FWAIR's randomized-draw model for NFT distribution: holders deposit NFTs backed by ETH, buyers pay to draw from the pool and can either keep the NFT or cash out against its backing; FWAIR applies the same model to new launches, going live only once every piece is backed. The structural challenge: every listing earns the same base fee share regardless of draw odds, so cheap NFTs can generate outsized returns on little backing, incentivizing depositors to add prizes buyers are unlikely to want to keep. V2's custom pools only let pool owners supply assets, leaving independent depositors stuck with the uncurated main pool — Delphi argues an outside-depositor-accessible curated pool could fix incentive alignment and extend the model beyond NFTs as FWA adds new asset types.", "tweet_url": "https://x.com/Delphi_Digital/status/2103145187480686761", "images": ["https://pbs.twimg.com/media/HS_fZt5agAAcAEx.jpg"], "type": "thread", "category": ["crypto"]}, {"author": "0xSammy", "summary": "Argued RWA liquidity, not tokenization itself, is the real bottleneck for onchain equities, and profiled three Robinhood Chain protocols solving it differently: LONG pairs assets directly against tokenized stocks (rather than ETH/stables) so demand for the paired asset creates stock liquidity, with accumulated stock tokens permanently locked; Standard ($19.6M) deploys its own treasury reserve as active market-making capital rather than waiting on third-party LPs, recycling fees into deeper markets; SHROOM ($15.7M) builds a hub-and-spoke model pairing itself against major stock tokens to create a common routing/liquidity layer across the network, with fees flowing to SHROOM buybacks. His view: this liquidity layer will matter as much as the tokenized assets themselves if RWAs are to handle real institutional flow.", "tweet_url": "https://x.com/0xSammy/status/2103022603212394729", "images": ["https://pbs.twimg.com/media/HS9v6LNWwAAa1Fi.jpg"], "type": "thread", "category": ["crypto"]}, {"author": "hosseeb", "summary": "Haseeb Qureshi highlighted DoubleZero now streaming Hyperliquid data directly over its low-latency fiber network (the same infra class TradFi uses) with no rate limits and no hops, connecting directly to Hypercore — disclosing he's an investor in both $2Z and $HYPE.", "tweet_url": "https://x.com/hosseeb/status/2103135971365847069", "type": "thread", "category": ["crypto", "tech"]}, {"author": "Crypto_McKenna", "summary": "Argued stablecoins and tokenization adoption are the crypto megatrends that matter for the future of the US dollar — exporting treasuries globally and pairing every tokenized asset with USD reinforces dollar demand. Named deficit spending, AI infrastructure buildout, and stablecoin/tokenization as three megatrends not to fade, and separately noted stablecoins remain in their infancy relative to the mainstream adoption (abstraction, frictionless UX, cheap settlement) still to come.", "tweet_url": "https://x.com/Crypto_McKenna/status/2103112772439724356", "type": "tweet", "category": ["crypto", "macro"]}, {"author": "ASvanevik", "summary": "Shared a back-of-envelope estimate from his AI tool \"Astra\": a single 60MW data center could output the equivalent knowledge work of roughly one million knowledge workers.", "tweet_url": "https://x.com/ASvanevik/status/2103080505726091634", "type": "tweet", "category": ["AI", "tech"]}, {"author": "mrjasonchoi", "summary": "Said he barely needs a desktop anymore for 90% of his work between OpenClaw, Dispatch on Claude and Remote on ChatGPT, and separately argued AI agents will find traction first among the high-achieving/high-neuroticism crowd obsessed with spending time only on high-leverage tasks — despite privacy concerns — while the broader public will take longer, especially if it's been culturally taught to fear AI.", "tweet_url": "https://x.com/mrjasonchoi/status/2103025704963342645", "type": "tweet", "category": ["AI", "tech"]}, {"author": "nicbstme", "summary": "Observed that over the past month, most agents and AI apps have started proactively setting reminders, scheduling background tasks and checking back later — \"cron jobs at scale\" — for two reasons: many tasks outlast a single chat session (e.g., checking hourly for a restaurant reservation), and AI products have a retention problem since people forget to reopen the app, whereas a proactive follow-up gives them a reason to return. Notes the concept is simple (a scheduling tool plus a system prompt) but reliably running billions of scheduled jobs at scale is the hard part.", "tweet_url": "https://x.com/nicbstme/status/2103162851439632814", "type": "tweet", "category": ["AI", "tech"]}, {"author": "AviFelman", "summary": "Observed that normie reviews of AI agents keep boiling down to \"it manages my emails and cancels my subscriptions,\" arguing most people still haven't used an agent at all — \"still so early.\"", "tweet_url": "https://x.com/AviFelman/status/2103083508214403564", "type": "thread", "category": ["AI"]}, {"author": "loomdart", "summary": "Compared regulatory fine sizes to make a market-size point: the largest environmental-damage fine ever was BP's $21bn, while Meta was fined $18bn for products deemed too addictive/unsafe for kids — yet the environmental protection technology industry is worth ~$800bn versus barely $10bn for digital mental health, implying the latter is underbuilt relative to the scale of harm being fined.", "tweet_url": "https://x.com/loomdart/status/2103035222556311661", "type": "tweet", "category": ["tech", "society"]}, {"author": "lopp", "summary": "Jameson Lopp warned Deel-using companies are now seeing highly targeted social-engineering phone calls from threat actors posing as Deel employees, likely leveraging data from Deel's June breach — a live operational-security risk for crypto/tech firms using the payroll platform. Separately drew a historical parallel: 30 years ago people dismissed the internet as \"just a faster way to send mail,\" 15 years ago they dismissed bitcoin as \"just for darknet drugs,\" and today people dismiss agentic AI as \"just for vibe coding apps.\"", "tweet_url": "https://x.com/lopp/status/2103156167115772353", "type": "tweet", "category": ["society", "AI", "crypto"]}, {"author": "himgajria", "summary": "Pushed back on \"AI hasn't improved productivity\" crypto-bro skepticism by quoting a case where an AI model searched thousands of existing drugs and ranked an untried combination for a 37-year-old man being sent to hospice — he responded within a week and is now in remission.", "tweet_url": "https://x.com/himgajria/status/2103105648854753565", "type": "tweet", "category": ["AI", "society"]}, {"author": "dylan522p", "summary": "Dylan Patel (SemiAnalysis), replying to a question about OpenAI economics, pointed followers to SemiAnalysis's tokenomics model for the actual underlying numbers rather than public commentary.", "tweet_url": "https://x.com/dylan522p/status/2102989941156540809", "type": "tweet", "category": ["AI", "tech"]}, {"author": "buccocapital", "summary": "Shared a chart/screenshot in reply to Ben Thompson, John Min and Benedict Evans without additional commentary, engaging with their tech/strategy discussion thread.", "tweet_url": "https://x.com/buccocapital/status/2103135933004759444", "images": ["https://pbs.twimg.com/media/HS_W-dmW0AAEObJ.png"], "type": "tweet", "category": ["tech"]}, {"author": "DefiIgnas", "summary": "Flagged that FOMO generated $320k in 7-day fees from its Hyperliquid Builder Code integration, putting it just below Phantom for the #2 spot — read as a sign of FOMO's retail-adoption strength.", "tweet_url": "https://x.com/DefiIgnas/status/2103111719967162849", "images": ["https://pbs.twimg.com/media/HS_A9uKacAAHgHF.jpg"], "type": "thread", "category": ["crypto"]}, {"author": "0xQuit", "summary": "A protocol builder's Ledger hardware wallet factory-reset itself overnight, locking him out of most of his wallets for roughly 10 days mid-deployment of a major protocol (FWAP). Said he'd lean more heavily on GridPlus and likely add a Keystone for portability, and confirmed the team will deploy a fresh S3 contract so affected users can migrate — meaning anyone who already migrated will need to withdraw and redeposit.", "tweet_url": "https://x.com/0xQuit/status/2103128838758633529", "images": ["https://pbs.twimg.com/tweet_video_thumb/HS_RutpW0AAy88a.jpg"], "type": "thread", "category": ["crypto", "society"]}], "C_contrarian": [{"author": "laurashin", "summary": "Ran Neuner's claim that Zcash is \"more useful than Bitcoin\" directly challenges BTC-maximalist orthodoxy — he argues private, non-transparent money is inherently more valuable than money whose full transaction history is publicly visible, even acknowledging \"you're not supposed to say that.\"", "tweet_url": "https://x.com/laurashin/status/2103168454564118748", "type": "thread", "category": ["crypto"]}, {"author": "dampedspring", "summary": "Andy Constan directly rebutted a viral \"scary fiscal math\" thread on rising Treasury debt-servicing costs, walking through the actual bill/new-debt/refinancing math to conclude the incremental cost of higher-for-longer rates is \"trivial in a $30T GDP\" — pushing back against consensus doom framing on US fiscal sustainability.", "tweet_url": "https://x.com/dampedspring/status/2103142494934315340", "type": "thread", "category": ["macro"]}, {"author": "zeroxkyle", "summary": "Argued against the popular \"AI is great for on-chain\" narrative, calling on-chain speculation \"permanently cooked\" — AI-enabled tooling has made it free to produce polished, legitimate-looking projects, turning on-chain into a lemon market where good-looking software no longer signals a good team.", "tweet_url": "https://x.com/zeroxkyle/status/2103106542522478806", "type": "tweet", "category": ["crypto"]}, {"author": "alpha_pls", "summary": "Challenged the common assumption that alts need BTC weakness/correlation breaks to run, arguing instead that a calmer, more hard-money BTC (less prone to dumping alongside risk assets) is actually the bullish setup altcoins have been missing.", "tweet_url": "https://x.com/alpha_pls/status/2103151816401621205", "type": "thread", "category": ["crypto", "positioning"]}, {"author": "udiWertheimer", "summary": "Argued against the instinct to declare Meta's VR glasses an outright win over Apple: Vision Pro remains the technically superior device, but its price, weight and \"clumsy look\" make it commercially irrelevant regardless — and Apple's smartest move may be to deliberately sit out this round and let competitors make the early mistakes.", "tweet_url": "https://x.com/udiWertheimer/status/2103115759304179825", "type": "thread", "category": ["tech"]}], "D_positioning": [{"author": "dampedspring", "summary": "Andy Constan said he's positioned for 30-year Treasury yields to drift toward 5.75% over the next two months, describing current levels as \"not bullish\" but \"not as awful as they were.\"", "tweet_url": "https://x.com/dampedspring/status/2103171944447390055", "type": "tweet", "category": ["macro", "positioning"]}, {"author": "rektmando", "summary": "Covered shorts and rotated into buying the strongest alts after what he called a \"nice OI cleanse,\" expecting BTC to touch $81-82k. Separately argued that as prices recover, tourist institutional capital (hedge funds, family offices, liquid funds, VCs) that left or got washed out over the past 12 months will return to buy the best altcoin stories — and that these names could command higher multiples than the top onchain-native winners.", "tweet_url": "https://x.com/rektmando/status/2103127909078647144", "images": ["https://pbs.twimg.com/media/HS-M0KPWgAAdcAl.png"], "type": "tweet", "category": ["crypto", "positioning"]}, {"author": "Zeneca", "summary": "Reiterated the easiest strategy this bull run is to buy and hold the clear winners (ZEC, NEAR, VVV, HYPE) and accumulate more on dips, doubling down on conviction rather than chasing 100x meme coins in the \"noisy casino,\" where most participants will lose their shirt.", "tweet_url": "https://x.com/Zeneca/status/2103114942933311687", "type": "tweet", "category": ["crypto", "positioning"]}, {"author": "Geiger_Capital", "summary": "Teased a new post going out the next morning on a Latin American stock he considers still trading too low, disclosing he's long both shares and calls.", "tweet_url": "https://x.com/Geiger_Capital/status/2103131668865314972", "type": "tweet", "category": ["EM", "positioning"]}, {"author": "ViktorDefi", "summary": "Called Variational's genesis airdrop (32% of total supply) potentially the biggest airdrop of 2026, following Hyperliquid's playbook — framing it as a second chance for anyone who missed HYPE, while telling one follower he'd \"wait for the dip\" before buying in himself.", "tweet_url": "https://x.com/ViktorDefi/status/2103036489106120939", "type": "thread", "category": ["crypto", "positioning"]}, {"author": "sjde // ---------- helpers ----------
const CAT_VARS = {
  macro: 'var(--cat-macro)',
  crypto: 'var(--cat-crypto)',
  energy: 'var(--cat-energy)',
  tech: 'var(--cat-tech)',
  ai: 'var(--cat-ai)',
  'ai/infra': 'var(--cat-ai)',
  geopolitics: 'var(--cat-geopolitics)',
  positioning: 'var(--cat-positioning)',
  regulation: 'var(--cat-regulation)',
  society: 'var(--cat-society)',
  em: 'var(--cat-em)',
};
function catColor(cat) {
  if (!cat) return 'var(--cat-default)';
  return CAT_VARS[String(cat).toLowerCase()] || 'var(--cat-default)';
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function escapeAttr(s) {
  return escapeHtml(s).replace(/`/g, '&#96;');
}

function renderBold(text) {
  return escapeHtml(text).replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
}

function relativeTime(iso) {
  if (!iso) return '';
  const dt = new Date(iso);
  if (isNaN(dt.getTime())) return '';
  const secs = Math.max(0, (Date.now() - dt.getTime()) / 1000);
  if (secs < 60)   return Math.floor(secs) + 's ago';
  const mins = secs / 60;
  if (mins < 60)   return Math.floor(mins) + 'm ago';
  const hrs  = mins / 60;
  if (hrs < 48)    return Math.floor(hrs) + 'h ago';
  return Math.floor(hrs / 24) + 'd ago';
}

function pill(cat) {
  if (!cat) return '';
  return `<span class="pill" style="background:${catColor(cat)}">${escapeHtml(cat)}</span>`;
}

function authorTag(name, cls = 'item-author') {
  if (!name) return '';
  return `<span class="${cls}" onclick="filterAuthor('${escapeAttr(name)}')">@${escapeHtml(name)}</span>`;
}

// ---------- rendering ----------
function renderThumbs(images) {
  if (!images || !images.length) return '';
  return `<div class="thumbs">` + images.map(u =>
    `<img src="${escapeAttr(u)}" class="thumb" loading="lazy" alt="" onclick="openLightbox('${escapeAttr(u)}')">`
  ).join('') + `</div>`;
}

function renderItem(item) {
  const author = item.author || item.author_username || '';
  const time = relativeTime(item.created_at);
  const thread = item.is_thread ? '<span class="item-thread">thread</span>' : '';
  const link = item.tweet_url
    ? `<a class="item-link" href="${escapeAttr(item.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  return `
    <div class="item-card filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${pill(item.category)}
        ${authorTag(author)}
        ${thread}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      <div class="item-text">${escapeHtml(item.text || '')}</div>
      ${renderThumbs(item.images)}
    </div>`;
}

function renderClusterItem(it) {
  const author = it.author || it.author_username || '';
  const time = relativeTime(it.created_at);
  const link = it.tweet_url
    ? `<a class="item-link" href="${escapeAttr(it.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  return `
    <div class="cluster-item filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${authorTag(author)}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      <div class="item-text">${escapeHtml(it.text || '')}</div>
      ${renderThumbs(it.images)}
    </div>`;
}

function renderCluster(cluster) {
  const itemsHtml = (cluster.items || []).map(renderClusterItem).join('');
  return `
    <div class="cluster">
      <div class="cluster-head">
        ${pill(cluster.category)}
        <div class="cluster-title">${escapeHtml(cluster.title || '')}</div>
      </div>
      ${cluster.description ? `<div class="cluster-desc">${escapeHtml(cluster.description)}</div>` : ''}
      ${itemsHtml ? `<div class="cluster-items">${itemsHtml}</div>` : ''}
    </div>`;
}

function renderLink(l) {
  const author = l.author || l.author_username || '';
  const url = l.url || (l.resolved || l.tco) || '';
  return `
    <div class="link-row filterable" data-author="${escapeAttr(author).toLowerCase()}">
      ${author
        ? authorTag(author, 'link-author')
        : '<span class="link-author">—</span>'}
      <a class="link-url" href="${escapeAttr(url)}" target="_blank" rel="noopener">${escapeHtml(url)}</a>
      ${l.description ? `<span class="link-desc">${escapeHtml(l.description)}</span>` : ''}
    </div>`;
}

function renderSection(letter, name, items, type) {
  if (!items || !items.length) return '';
  let body;
  if (type === 'events') {
    body = items.map(renderCluster).join('');
  } else if (type === 'links') {
    body = items.map(renderLink).join('');
  } else {
    body = items.map(renderItem).join('');
  }
  const cls = type === 'contrarian' ? 'section section-contrarian' : 'section';
  return `
    <div class="${cls}">
      <div class="section-head" onclick="toggleSection(this)">
        <span class="section-letter">${letter}.</span>
        <span class="section-name">${escapeHtml(name)}</span>
        <span class="section-count">${items.length}</span>
        <span class="section-arrow">▸</span>
      </div>
      <div class="section-body">${body}</div>
    </div>`;
}

function renderSummary(text) {
  if (!text) return '';
  const paragraphs = String(text).split(/\n\n+/).filter(Boolean)
    .map(p => `<p>${renderBold(p)}</p>`).join('');
  return `<div class="summary">${paragraphs}</div>`;
}

function renderStats(d) {
  const s = (d && d.stats) || d || {};
  const parts = [];
  if (s.received    != null) parts.push(`received <strong>${s.received}</strong>`);
  if (s.after_filter!= null) parts.push(`after filter <strong>${s.after_filter}</strong>`);
  if (s.authors     != null) parts.push(`authors <strong>${s.authors}</strong>`);
  if (s.coverage    != null) {
    const pct = (s.coverage <= 1 ? s.coverage * 100 : s.coverage);
    parts.push(`coverage <strong>${pct.toFixed(0)}%</strong>`);
  }
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSection(headEl) {
  headEl.parentElement.classList.toggle('open');
}

function openLightbox(src) {
  const img = document.getElementById('lightbox-img');
  img.src = src;
  document.getElementById('lightbox').classList.add('open');
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-img').src = '';
}

let activeFilter = null;
function filterAuthor(name) {
  if (!name) return;
  activeFilter = String(name).toLowerCase();
  document.querySelectorAll('.filterable').forEach(el => {
    const a = (el.dataset.author || '').toLowerCase();
    if (a === activeFilter) {
      el.classList.add('match');
      el.classList.remove('dim');
    } else {
      el.classList.add('dim');
      el.classList.remove('match');
    }
  });
  document.getElementById('filter-name').textContent = '@' + name;
  document.getElementById('filter-bar').classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function clearFilter() {
  activeFilter = null;
  document.querySelectorAll('.filterable').forEach(el => {
    el.classList.remove('match');
    el.classList.remove('dim');
  });
  document.getElementById('filter-bar').classList.remove('active');
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (document.getElementById('lightbox').classList.contains('open')) {
      closeLightbox();
    } else if (activeFilter) {
      clearFilter();
    }
  }
});

// ---------- schema normalization ----------
// Some producer runs emit the "sections" schema documented in the routine
// spec (report_type/input_stats/sections.A_events.../coverage) instead of
// the flat schema this renderer reads (date/events/insights/contrarian/
// positioning/links/stats). Normalize so either shape renders correctly.
function firstOf(v) {
  return Array.isArray(v) ? v[0] : v;
}

function normalizeItem(it) {
  if (!it || typeof it !== 'object') return it;
  return {
    author: it.author || it.author_username,
    text: it.text != null ? it.text : it.summary,
    category: firstOf(it.category),
    tweet_url: firstOf(it.tweet_url),
    images: it.images,
    created_at: it.created_at,
    is_thread: it.is_thread != null ? it.is_thread : (it.type === 'thread'),
  };
}

function normalizeData(d) {
  if (!d || typeof d !== 'object') return {};
  const hasFlat = d.events || d.insights || d.contrarian || d.positioning || d.links || d.stats;
  if (hasFlat) return d;

  const s = d.sections;
  if (!s) return d;

  const out = Object.assign({}, d);
  out.date = d.date || (d.collected_at ? String(d.collected_at).replace('T', ' ').replace('Z', ' UTC') : '');
  if (s.A_events) {
    out.events = s.A_events.map(cl => ({
      title: cl.cluster || cl.title,
      category: firstOf(cl.category),
      description: cl.description,
      items: (cl.items || []).map(normalizeItem),
    }));
  }
  if (s.B_insights) out.insights = s.B_insights.map(normalizeItem);
  if (s.C_contrarian) out.contrarian = s.C_contrarian.map(normalizeItem);
  if (s.D_positioning) out.positioning = s.D_positioning.map(normalizeItem);
  if (s.E_links) {
    out.links = s.E_links.map(l => ({
      author: l.author,
      url: l.url,
      tweet_url: firstOf(l.tweet_url),
      description: l.note || l.description,
    }));
  }
  const stats = d.stats || {};
  out.stats = {
    received: stats.received != null ? stats.received : (d.input_stats && d.input_stats.total_tweets),
    after_filter: stats.after_filter != null ? stats.after_filter : (d.input_stats && d.input_stats.after_noise_filter),
    authors: stats.authors != null ? stats.authors : (d.coverage && d.coverage.authors_total),
    coverage: stats.coverage != null ? stats.coverage : (d.coverage && d.coverage.coverage_pct),
  };
  return out;
}

// ---------- main ----------
function renderReport(d) {
  d = normalizeData(d);
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  const sections = [
    renderSummary(d.summary),
    renderSection('A', 'Events & Reactions',      d.events,                                'events'),
    renderSection('B', 'Alpha & Insights',        d.insights || d.alpha,                   'items'),
    renderSection('C', 'Contrarian Views',        d.contrarian,                            'contrarian'),
    renderSection('D', 'Positioning & Trade Ideas', d.positioning,                         'items'),
    renderSection('E', 'Link Queue',              d.links,                                 'links'),
  ].join('');
  const app = document.getElementById('app');
  app.innerHTML = sections || '<div class="empty">No report data.</div>';

  // Auto-open first two sections.
  document.querySelectorAll('.section').forEach((s, i) => {
    if (i < 2) s.classList.add('open');
  });

  document.getElementById('stats').innerHTML = renderStats(d);
}

renderReport(REPORT_DATA);
