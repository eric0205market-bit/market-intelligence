<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>Institutional Research</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root {
  --bg: #faf8f5;
  --surface: #ffffff;
  --border: #e8e3da;
  --border-light: #f0ede4;
  --text: #1a1a1a;
  --text-2: #555;
  --text-3: #8a8a8a;
  --accent: #7c3aed;          /* purple — institutional report accent */
  --accent-soft: #f3eefc;
  --divergence: #d94052;      /* divergence red */
  --consensus: #15803d;       /* consensus green */
  --yellow: #fff5b3;

  /* category colors (institutional schema: rates, growth, fx, equities,
     credit, crypto, energy, commodities, geopolitics, ai_tech, em) */
  --cat-rates: #2563eb;
  --cat-growth: #d97706;
  --cat-fx: #0891b2;
  --cat-equities: #15803d;
  --cat-credit: #be185d;
  --cat-crypto: #8b5cf6;
  --cat-energy: #dc2626;
  --cat-commodities: #ea580c;
  --cat-geopolitics: #b91c1c;
  --cat-ai_tech: #4f46e5;
  --cat-em: #059669;
  --cat-default: #6b7280;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; line-height: 1.55;
       background: var(--bg); color: var(--text); }
.container { max-width: 980px; margin: 0 auto; padding: 24px 16px 80px; }

/* HEADER */
.header { display: flex; justify-content: space-between; align-items: baseline;
          border-bottom: 2px solid var(--text); padding-bottom: 12px; margin-bottom: 12px; }
.title { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
.subtitle { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-3); }

/* STATS BAR (top: period + coverage) */
.stats-top { margin-bottom: 16px; padding: 8px 12px; background: var(--surface);
             border: 1px solid var(--border); border-radius: 6px;
             font-family: 'IBM Plex Mono', monospace; font-size: 11.5px;
             color: var(--text-2); display: flex; gap: 16px; flex-wrap: wrap; }
.stats-top strong { color: var(--text); font-weight: 600; }

/* SUMMARY */
.summary { background: var(--surface); border: 1px solid var(--border);
           border-left: 4px solid var(--accent); border-radius: 6px;
           padding: 16px 18px; margin-bottom: 20px; }
.summary p { margin-bottom: 10px; }
.summary p:last-child { margin-bottom: 0; }
.summary strong { font-weight: 600; }

/* SECTIONS */
.section { background: var(--surface); border: 1px solid var(--border);
           border-radius: 6px; margin-bottom: 14px; overflow: hidden; }
.section-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px;
                background: #f3efe6; cursor: pointer; user-select: none;
                font-weight: 600; font-size: 13px; }
.section-head:hover { background: #ebe6dc; }
.section-letter { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
                  color: var(--text-3); min-width: 18px; }
.section-name { flex: 1; }
.section-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
                 color: var(--text-3); }
.section-arrow { font-size: 10px; color: var(--text-3); transition: transform .2s; }
.section.open .section-arrow { transform: rotate(90deg); }
.section-body { display: none; padding: 6px 0; }
.section.open .section-body { display: block; }

/* THEME CARD (Section A) */
.theme { padding: 14px 16px; border-bottom: 1px solid var(--border-light); }
.theme:last-child { border-bottom: none; }
.theme-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
              flex-wrap: wrap; }
.theme-title { font-weight: 600; font-size: 14.5px; }
.theme-stance { display: grid; grid-template-columns: 1fr; gap: 6px; margin-bottom: 10px; }
@media (min-width: 720px) { .theme-stance { grid-template-columns: 1fr 1fr; } }
.theme-line { font-size: 13px; padding: 8px 10px; border-radius: 4px;
              border-left: 3px solid var(--border); background: #fafafa; line-height: 1.5; }
.theme-line.consensus { border-left-color: var(--consensus); background: #f0f9f3; }
.theme-line.divergence { border-left-color: var(--divergence); background: #fdf6f7; }
.theme-line .lbl { font-family: 'IBM Plex Mono', monospace; font-size: 10px;
                   text-transform: uppercase; letter-spacing: .06em;
                   color: var(--text-3); display: block; margin-bottom: 2px; }
.theme-items { display: flex; flex-direction: column; gap: 8px; padding-left: 10px;
               border-left: 2px solid var(--border-light); }
.theme-item { font-size: 13px; padding: 6px 8px; border-radius: 4px; }

/* ITEM CARDS (Sections B/C/D) */
.item-card { background: var(--surface); border: 1px solid var(--border);
             border-radius: 6px; padding: 12px 14px; margin: 10px 16px; }
.item-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
             flex-wrap: wrap; }
.item-source { font-weight: 600; color: var(--accent); }
a.item-source { text-decoration: none; }
a.item-source:hover { text-decoration: underline; }
.item-link { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--accent); text-decoration: none; }
.item-link:hover { text-decoration: underline; }
.item-title { font-weight: 600; font-size: 14px; margin: 4px 0 6px; }
.item-text { font-size: 13.5px; line-height: 1.6; color: var(--text);
             white-space: pre-wrap; word-wrap: break-word; }

/* DEEP READS (Section C) — purple left border to mark flagship long-form */
.section-deepreads .item-card { border-left: 4px solid var(--accent); background: var(--accent-soft); }

/* HOUSE VIEWS — compact one-line-per-source list */
.hv-row { display: flex; gap: 10px; align-items: baseline;
          padding: 6px 16px; border-bottom: 1px solid var(--border-light);
          font-size: 13px; }
.hv-row:last-child { border-bottom: none; }
.hv-name { font-weight: 600; color: var(--accent); min-width: 180px;
           text-decoration: none; }
.hv-name:hover { text-decoration: underline; }
.hv-stance { color: var(--text); flex: 1; }

/* CATEGORY PILLS */
.pill { display: inline-block; font-family: 'IBM Plex Mono', monospace; font-size: 10px;
        font-weight: 500; padding: 2px 7px; border-radius: 3px; color: #fff;
        text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }

/* IMAGES */
.thumbs { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.thumb { height: 110px; border: 1px solid var(--border); border-radius: 4px;
         cursor: zoom-in; background: #f0ede4; }

/* LIGHTBOX */
.lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85);
            align-items: center; justify-content: center; z-index: 100; cursor: zoom-out; }
.lightbox.open { display: flex; }
.lightbox img { max-width: 92vw; max-height: 92vh;
                box-shadow: 0 8px 40px rgba(0,0,0,.6); }

/* EMPTY */
.empty { color: var(--text-3); font-size: 13px; padding: 14px 18px; font-style: italic; }

/* RESPONSIVE */
@media (max-width: 640px) {
  .container { padding: 16px 12px 60px; }
  .item-card { margin: 8px 10px; }
  .hv-row { flex-direction: column; gap: 2px; }
  .hv-name { min-width: 0; }
  .header { flex-direction: column; align-items: flex-start; gap: 4px; }
}
</style>
</head>

<script>
const REPORT_DATA = {"report_type": "INSTITUTIONAL RESEARCH", "collected_at": "2026-11-15T03:01:53.000Z", "period": {"lookback_days": 10, "from": "2026-11-05", "to": "2026-11-15"}, "input_stats": {"total_articles": 377, "sources_present": 48, "after_filter": 148}, "summary": "**Fed / Rates:** Street consensus is a **25bp Fed hike in December** after October's hot CPI (headline **0.4%**, core **0.3%** m/m, third firm print in a row), with a second hike in **January–March** (**UBS**, **PIMCO**, **Goldman**, **Standard Chartered**, **Amundi**). Sharpest split is on speed: **Goldman's rates desk** says **50bp** is now in play after Waller's threshold was met, while **UBS** and **CoinShares** argue a 50bp move would signal an open-ended cycle, and **PIMCO** calls the whole episode a *recalibration*, with policy only ~100bp below Taylor versus ~800bp in 2022.\n\n**Equities / Buy the dip?:** Most houses read the **Nov 5 rout** (S&P **-4.4%**, SOX **-12.3%**) as a **positioning reset, not a cycle top** (**UBS**, **Standard Chartered**, **Invesco**, **Yardeni**, which targets S&P **7,900** by year-end). The contrarians: **BCA's Budaghyan** says resist the dip because *a major global market top may already be behind us*, and **Gavekal-IS's** model is outright **risk-off**, cutting equities to **≤20%**.\n\n**AI / Midterms:** The Democratic sweep and Jensen Huang's exit from Nvidia have moved the AI trade from rewarding capex to **demanding monetization**. Houses agree demand is intact (**UBS** AI capex **$1.0tr → $1.4tr → $1.5tr** for 2026-28; **Goldman** sees **$1.8tr** global in 2027). They split on regulation: **BCA** calls the regulatory onslaught *overrated* and **PIMCO** says it *changes the journey, not the destination*, while **Wood Mackenzie** notes **40 of 41** data-centre ballot measures backed restrictions and **Gavekal** is war-gaming a halt scenario.\n\n**Regional rotation:** Houses broadly agree on diversifying **away from US mega-cap tech**. **Citi** downgraded the **US to Neutral** and upgraded **Continental Europe to OW**, **UBS** prefers the **Eurozone, EM and Asia ex-Japan**, and **Standard Chartered** likes **India** as the *anti-AI trade*. **Goldman** is the cautious voice on Europe's economy even while forecasting **STOXX 600 EPS +18%** for 2026.\n\n**Oil / Iran:** Base case is **normalization in 2027**: **Goldman** sees **Brent $78** by end-2027, and **Amundi** expects prices elevated through year-end and easing over H1 2027. The split runs *inside BCA*: its commodity desk says oil is *priced for peace, exposed to war* with risks tilted **higher**, while **Marko Papic's** GeoMacro team is **short oil**, betting the midterm loss forces Trump to de-escalate.\n\n**Duration / Bonds:** Consensus says higher starting yields (**10y ~5%**) have restored bonds as a core holding (**UBS**, **PIMCO**, **Amundi**). **PIMCO's Ivascyn** has duration around **benchmark** and wants to lock in yields. **UBS** and **Amundi** stay cautious on the **long end** because of fiscal supply, and **BCA** says *accumulate bonds on weakness*, favouring **current-account-surplus** countries.\n\n**USD / FX:** **Standard Chartered** reads the USD rally (DXY **103.17**, EUR/USD **1.1046**, USD/JPY **~160**) as **overbought** and is fading USD/JPY toward **155.2** while buying **gold at $3,910**. **BCA** goes further and says **sell the dollar on strength**.\n\n**Crypto:** **CoinShares** sees **BTC in a $60k-$90k range** with no catalyst. Policy is the split: **Delphi** argues a *broken Congress is bullish*, while **Galaxy** flags crypto PACs losing **9 of 12** competitive races and **Warren/Waters** taking the banking gavels.", "sections": {"A_debates": [{"theme": "Rates & Central Banks", "category": ["rates"], "consensus": "Almost every house now treats a December Fed hike as locked in after October CPI (headline 0.4% m/m vs 0.3% consensus; core 0.3% vs 0.2%, with UBS putting the 3-month annualized core rate at 3.75%) and the 165k payrolls beat. UBS's base case is 25bp hikes in December and March. PIMCO moved to 25bp in December and January with risk of March. Goldman Research expects December and March hikes, then a first cut in December 2027 and a 3.25-3.5% terminal rate in 2028. Standard Chartered sees December plus possibly Q1 2027, and Amundi sees December, possibly early 2027, then a hold. Outside the US the same tightening bias holds. The BoE hiked to 4% on 5 November and expects inflation near 5% by mid-2027. Goldman and Amundi both expect an ECB hike in December, and Goldman expects the BoJ to hike in December, March and June to a 2% terminal rate.", "divergence": "The fight is over speed and how far the cycle runs. Goldman's FICC desk (Qubbaj) says Waller's 'core 0.3% puts 50bp on the table' condition was met and the market must now price 50s. PIMCO would switch to 50bp if Williams and Jefferson echo Waller. UBS and CoinShares push back that a 50bp move would signal policy is materially behind and make the hiking open-ended. PIMCO and Goldman also argue it is a short recalibration: Goldman sees more dovish risk in the US than elsewhere because inflation drivers are temporary and the US is most exposed to an AI downturn. BCA ('Fed Can't Let Up Yet') says tariff, energy and chip shocks will keep core above target for months. The Fed's own staff note finds oil-to-core pass-through rose from about 0.01pp to 0.14pp per 10pp oil move after the pandemic, an upside inflation risk that backs the hawks. The BoE committee is split in the open. Mann and Pill have voted for hikes and say the stance is not tight enough. Taylor argues Bank Rate and the OIS curve are already well above his 2.75-3% neutral estimate. Lombardelli sits between them, warning that a low-hire labour market means rising unemployment may ease wages less than usual.", "items": [{"source": "ubs", "name": "UBS", "thesis": "Oct core CPI 0.30% m/m, but the 3-month annualized rate rose to 3.75% (below 2% in August). The 10y rose 11bp to 4.99%. Base case is 25bp hikes in December and March, with at least two more hikes likely and a risk of faster quarter-point moves. Support for 50bp is limited. Favors quality short/medium bonds and is cautious on the longest maturities.", "url": "https://www.ubs.com/global/en/wealthmanagement/insights/chief-investment-office/house-view/daily/2026/latest-11112026.html", "images": []}, {"source": "pimco", "name": "PIMCO", "thesis": "Tiffany Wilding: energy, shipping, chip and tariff pass-through adds roughly 50-60bp to y/y core this year, with an estimated 70-80% of it already done. Core PCE is running ~0.36% m/m and ~3.3% y/y. Forecast is now 25bp in December and January with March risk, and 50bp if Williams/Jefferson echo Waller. Fed funds at 3.75-4.0% is ~100bp below PIMCO's Taylor-rule rate versus ~800bp in early 2022, so this is a recalibration, not a new cycle. Thinner holiday discounting could keep the next prints hot.", "url": "https://www.pimco.com/us/en/insights/inflation-is-sticky-but-this-isnt-2022-all-over-again", "images": []}, {"source": "goldman_sachs", "name": "Goldman Sachs", "thesis": "FICC co-head Qubbaj: the third straight 0.3% core print plus Waller's speech put 50bp hikes back in the distribution, after markets had spent a month removing ~50bp of hikes. Oil down ~15% in November does not mean a 'full refund' in rates. Base case is the 10y staying below its October high near 5.3% because the conditions behind that peak (no forward guidance under Warsh, term premium, AI-capex supply, convexity selling) are unlikely to recur. Warsh has linked rate levels to AI-capex financing, which makes the system self-balancing.", "url": "https://www.goldmansachs.com/insights/the-markets/how-will-higher-than-expected-inflation-data-impact-the-feds-next-rate-decisions", "images": []}, {"source": "goldman_sachs", "name": "Goldman Sachs", "thesis": "Hatzius 2027 outlook: Fed hikes in December and March, a cut in December 2027 and three more in 2028 to 3.25-3.5%. US core PCE falls from 3.2% at end-2026 to 2.4% at end-2027 as tariff effects drop out. ECB's final hike comes in December, then normalization to 2.25% in Q4 2027. BoE's final hike to 4.25% comes in February, with cuts to 3.25% only in 2028. BoJ is the hawkish outlier with hikes in December, March and June to a 2% terminal rate.", "url": "https://www.goldmansachs.com/insights/articles/the-global-economy-is-forecast-to-grow-2-point-8-percent-in-2027-as-oil-prices-decline", "images": []}, {"source": "federal_reserve", "name": "Federal Reserve", "thesis": "Fed staff panel of five advanced economies: oil-to-core pass-through was statistically zero before the pandemic (0.01pp per 10pp oil move) and is now a significant 0.14pp, on top of more inertial core inflation. The authors read this as an upside risk to inflation if persistence holds. This is staff research, not policy.", "url": "https://www.federalreserve.gov/econres/notes/feds-notes/the-effect-of-oil-prices-on-core-inflation-recent-evidence-from-the-advanced-economies-20261109.html", "images": []}, {"source": "bca_research", "name": "BCA Research", "thesis": "Ryan Swift's November allocation is to stick with hawkish Fed trades. A companion chartpack says the economy is not overheating but tariff, energy and chip shocks keep core above target and will not fade in the next few months. Only teasers are available.", "url": "https://www.bcaresearch.com/reports/stick-hawkish-fed-trades-11-11-2026/227450", "images": []}, {"source": "boe", "name": "Bank of England", "thesis": "Bank Rate was raised 25bp to 4% on 5 November, the first hike since August 2023. CPI is 3.5% and expected at ~5% by mid-2027. Bailey: not the first of an inevitable sequence, but unless the Middle East conflict is resolved it is unlikely to be the last. Next decision is 17 December.", "url": "https://www.bankofengland.co.uk/monetary-policy/the-interest-rate-bank-rate", "images": []}, {"source": "boe", "name": "Bank of England", "thesis": "Alan Taylor (dovish dissent on the MPC): Bank Rate and the OIS curve are substantially restrictive against his nominal R* of 2.75-3%. Beyond two years, market rates are tighter than at the August 2023 peak when CPI was 6.8%, and his Taylor-rule estimate falls from 4.2% to 3.5% by 2Q27. He judges the current stance more than sufficient.", "url": "https://www.bankofengland.co.uk/speech/2026/september/searching-for-signposts-speech-by-alan-taylor", "images": []}, {"source": "boe", "name": "Bank of England", "thesis": "Catherine Mann (hawk): the stance is not sufficiently tight, and she voted for 25bp at the last two meetings. The MPC cannot rely on the nominal curve doing the work and must follow through with Bank Rate rises to keep credibility.", "url": "https://www.bankofengland.co.uk/speech/2026/october/catherine-mann-nomura-investor-conference", "images": []}, {"source": "boe", "name": "Bank of England", "thesis": "Clare Lombardelli: the UK labour market is cooling through less hiring rather than more firing, in a 'low gear'. Poor matching means rising unemployment may do less than usual to ease wage pressure. The energy shock has proved larger and more persistent than in July.", "url": "https://www.bankofengland.co.uk/speech/2026/november/clare-lombardelli-speech-at-the-bank-watchers-conference", "images": []}, {"source": "oxford_economics", "name": "Oxford Economics", "thesis": "After the 4% hike, a December move is a coin flip that depends on oil and gas. Oxford Economics forecasts a 4.25% peak with risks skewed up.", "url": "https://www.oxfordeconomics.com/resource/uk-hawkish-monetary-policy-committee-puts-a-december-hike-on-the-table/", "images": []}, {"source": "bnp_paribas", "name": "BNP Paribas AM", "thesis": "Chi Lo: Asia ex-Japan will not follow the Fed in lockstep. Large current-account surpluses (except Indonesia and the Philippines) support FX, and core inflation is at or below target thanks to fuel subsidies. Hikes would only come if the differential causes large, persistent FX depreciation or subsidies are removed.", "url": "https://viewpoint.bnpparibas-am.com/view-from-the-markets-asia-may-not-follow-us-rate-hikes/", "images": []}]}, {"theme": "Bonds & Duration", "category": ["rates", "credit"], "consensus": "Asset managers agree that ~5% 10-year Treasuries have restored bonds as a portfolio core. UBS says higher starting yields have revived the 60/40 and favors quality short and medium maturities. PIMCO's Dan Ivascyn has Income-fund duration around the Bloomberg Agg and calls this a time to lock in yields for years, with better opportunities outside the US where fiscal positions are stronger. Amundi is near-neutral on US duration with a preference for intermediates, and positive on Eurozone (peripherals, steepener) and UK duration. BNY highlights munis at a ~7.9% tax-equivalent yield, the highest since 2008. Goldman expects G4 net sovereign supply to the public to be stable or lower in 2027 in the US, Euro Area and UK, with Japan the exception.", "divergence": "The split is about the long end. UBS and Amundi want to avoid the longest maturities because of fiscal deficits, heavy Treasury issuance and competition for capital from AI-related supply. Amundi adds that the long end will stay under pressure even as the front end reflects hikes. BCA's Budaghyan argues the opposite: accumulate bonds on weakness, favouring current-account-surplus countries. Papic's GeoMacro team is outright long bonds after the Democratic sweep. UBS warns that if inflation stays high, stocks and bonds can fall together, so the 60/40 hedge is not guaranteed. Standard Chartered took profits on TIPS (+4.4%), saying inflation is near a peak, while the Fed staff and BCA inflation work argues for persistence.", "items": [{"source": "ubs", "name": "UBS", "thesis": "Higher yields have restored the 60/40. Bonds offer income, a cushion and upside if growth slows, but diversify equities best when inflation is low or stable. Recommends completion assets such as hedge funds. German 2y yields rose ~17bp on the week, and JGB 10y yields hit their highest since 22 October.", "url": "https://www.ubs.com/us/en/wealth-management/insights/investment-research/insights-display-adp/global/en/wealthmanagement/insights/chief-investment-office/house-view/daily/2026/latest-13112026.html?caasID=CAAS-ActivityStream", "images": []}, {"source": "pimco", "name": "PIMCO", "thesis": "Ivascyn: a 'very exciting time' for income. Income-fund rate exposure is around Agg duration, versus near zero in 2021, and the US curve is finally steep. With a 3-5 year horizon in a high-quality flexible strategy, investors are 'highly likely to earn that yield'. Non-US markets with better fiscal positions are attractive.", "url": "https://www.pimco.com/us/en/resources/video-library/media/a-higher-starting-point", "images": []}, {"source": "amundi", "name": "Amundi", "thesis": "November GIV: higher-for-longer is the dominant narrative. Near-neutral US duration with an intermediate preference. Marginally more positive on Eurozone duration (peripherals over core, steepening bias) and positive on UK duration. More constructive on local- and hard-currency EM debt. Prefers short and medium maturities over the long end.", "url": "https://research-center.amundi.com/article/global-investment-views-november-2026", "images": []}, {"source": "bca_research", "name": "BCA Research", "thesis": "Budaghyan: resist buying the equity dip, sell the USD on strength, and accumulate bonds on weakness, favouring current-account-surplus countries. Teaser only.", "url": "https://www.bcaresearch.com/reports/buy-dip-or-sell-dip-11-11-2026/227518", "images": []}, {"source": "bny", "name": "BNY Investments", "thesis": "Munis are at their highest yields since 2008, near 7.9% tax-equivalent for top-bracket investors. Long AAA munis can beat BB corporates after tax. 72% of munis are rated AA or above versus 10% of US IG, and 10-year default rates are 0.15% versus 10.82% for global corporates.", "url": "https://www.bny.com/investments/us/en/individual/articles/fixed-income/municipal-bonds-are-they-having-a-moment.html", "images": []}, {"source": "goldman_sachs", "name": "Goldman Sachs", "thesis": "G4 net sovereign supply stays elevated in 2027 but is stable or lower to the public in the US, Euro Area and UK. Japan is the only market with modestly higher net supply.", "url": "https://www.goldmansachs.com/insights/goldman-sachs-research/global-markets-daily-g4-net-bond-supply-leveling-out", "images": []}, {"source": "standard_chartered", "name": "Standard Chartered", "thesis": "Closed the bullish US TIPS idea for a +4.4% gain: inflation is near a peak, one-year inflation expectations slumped with oil, and slower AI buildout should ease 'techflation'.", "url": "https://www.sc.com/sg/market-outlook/weekly-market-view-13-11-2026/?mvog=1", "images": []}]}, {"theme": "Growth & Recession", "category": ["growth"], "consensus": "There is no recession call from the major houses. US growth is running hot. Hatzius sees GDP with a 3-handle in Q2-Q4 and the payroll trend back above 100k, with October at 165k vs ~70k consensus and unemployment at 4.1%. He expects 2027 to soften to 2-2.5%. Global 2027 forecasts cluster around 2.8-3.0%: Goldman 2.8% (from 2.7%), Citi 2.7% to 2.8%, Oxford 3.0% (partly revisions). Goldman says energy flips from a headwind to a modest boost in 2027 and AI investment adds ~0.4pp to global growth. Moody's describes a two-speed world in which AI-linked economies race ahead.", "divergence": "The disagreement is over how much of the growth is AI-dependent and what happens if capex stalls. Jason Furman at PIIE, using the Fed's FRB/US model, finds the data-centre buildout has added only ~0.3% to GDP because most equipment is imported. With the AI stock boom the total is ~0.6% of GDP and -0.3pp on unemployment. A reversal would cut ~0.5pp from growth next year, not cause a recession. Goldman sees AI capex as the main US support and the main downside risk, with early AI job effects of 10-15k fewer jobs a month in tech. Gavekal-IS is the bear: its growth/inflation model has swung to risk-off since the Gulf conflict began, and it has revived the 1970s Misery Index as a warning. The Fed's own staff paper finds AI's productivity and labour-market effects small so far. Gavekal's consumer team says the Democratic gains point to cheaper fuel and softer immigration policy that should lift the K-shaped bottom half.", "items": [{"source": "goldman_sachs", "name": "Goldman Sachs", "thesis": "Hatzius: October jobs 'very solid'. The payroll trend is back above 100k, unemployment is stable at 4.1-4.2%, and claims are the lowest in 50+ years. 2027 growth is seen at 2-2.5%. Downside risks: ~50bp tighter financial conditions, Iran and energy hitting real incomes, the AI buildout, and AI already costing ~10-15k tech jobs a month and possibly spreading into services.", "url": "https://www.goldmansachs.com/insights/videos/cnbc-jan-hatzius-us-jobs-report-and-economic-outlook", "images": []}, {"source": "goldman_sachs", "name": "Goldman Sachs", "thesis": "Global GDP 2.8% in 2027 (2.7% in 2026), with the US, Japan and UK above consensus and Europe weaker. China 4.5% (consensus 4.4%) on exports, a 0.1pp drag on the rest of the world and 0.3pp on Germany. Japan's fiscal impulse is +0.7pp. Risks are tilted to the downside: an Iran re-escalation, French and other deficits, and an AI-capex shortfall.", "url": "https://www.goldmansachs.com/insights/articles/the-global-economy-is-forecast-to-grow-2-point-8-percent-in-2027-as-oil-prices-decline", "images": []}, {"source": "peterson_institute", "name": "Peterson Institute (PIIE)", "thesis": "Furman with FRB/US: the data-centre buildout has lifted GDP only ~0.3% because it is mostly imports. With the AI equity boom, ~0.6% of GDP and -0.3pp unemployment. A bust would subtract ~0.5pp next year and ~0.25pp the year after, 'nothing resembling a recession'.", "url": "https://www.piie.com/blogs/realtime-economics/2026/ai-booms-two-engines", "images": []}, {"source": "federal_reserve", "name": "Federal Reserve", "thesis": "Fed staff (FEDS 2026-074): data-centre investment has surged and memory-chip prices are up. AI adoption is broad but shallow. Labour-market and aggregate productivity effects are 'small so far'. The recent productivity pickup predates generative AI.", "url": "https://www.federalreserve.gov/econres/feds/artificial-intelligence-and-the-us-economy-current-evidence.htm", "images": []}, {"source": "oxford_economics", "name": "Oxford Economics", "thesis": "2027 world GDP is revised to 3.0% from 2.8%, partly due to historical Eurozone and China revisions. The midterms and tech sell-off add uncertainty, but there are no substantive forecast changes, with only a modest pick-up after a sluggish 2026.", "url": "https://www.oxfordeconomics.com/resource/world-economic-prospects-preview/", "images": []}, {"source": "gavekal", "name": "Gavekal", "thesis": "The Gavekal-IS inflation/growth model has deteriorated steadily since the late-February Gulf conflict and now says unequivocally risk-off, cutting equity allocations to 20% or less. Teaser only.", "url": "https://research.gavekal.com/teaser/equity-risk-off-what-next/", "images": []}, {"source": "gavekal", "name": "Gavekal", "thesis": "Tan Kai Xian: the K-shaped squeeze is easing. The labour market has tightened, and the Democratic gains point to cheaper gasoline and diesel and softer immigration policy, which helps the lower half of consumers and consumer stocks. The key risk is AI capex stalling.", "url": "https://research.gavekal.com/teaser/christmas-comes-early-for-the-us-consumer/", "images": []}, {"source": "moodys_analytics", "name": "Moody's Analytics", "thesis": "'Shaken, Not Stirred': the global economy runs at two speeds, with economies and sectors plugged into the AI boom racing ahead. Teaser only.", "url": "https://www.economy.com/economicview/analysis/424481/Global-Outlook-Shaken-Not-Stirred", "images": []}]}, {"theme": "Equities: Dip, Top or Rotation", "category": ["equities"], "consensus": "After the sharpest single-day post-midterm drop in more than three decades (S&P -4.36% on 5 November, Nasdaq 100 -6.4%, SOX -12.3% and ~38% below its June high), most sell-side and asset-manager voices call it a positioning reset. UBS sees index gains over 6-12 months and calls the sell-off overdone. Standard Chartered's history work shows all 24 post-2009 one-day drops of 4%+ were followed by positive 3-month returns, and opposition clean sweeps have historically produced the strongest 12-month returns. Yardeni targets S&P 7,900 by year-end from 7,561. UBS notes the S&P averaged +15.5% in the six months after the last 14 midterms. Almost everyone agrees on rotation away from concentrated US tech toward defensives, value, healthcare, financials and non-US markets.", "divergence": "Independents dissent sharply. BCA's Budaghyan says resist buying the dip because a major global market top may already be behind us. Gavekal-IS is risk-off with equities at 20% or less. BCA's own Papic is long equities 'for the time being' but warns the sweep means more regulation and higher taxes. On regional allocation, Citi tactically downgraded the US to Neutral and upgraded Continental Europe to Overweight, and expects global EPS growth to decelerate ~20pp in 2027. Standard Chartered cut equities from Overweight to core but added a tactical US IT position when the VIX topped 25. BNY says pure beta is risky and favors value and defensives. On Europe, Goldman forecasts STOXX 600 EPS of +18% in 2026 and +7% in 2027 but is downbeat on European GDP. Franklin Templeton calls the Europe-as-value-trap consensus 'dated and lazy'.", "items": [{"source": "ubs", "name": "UBS", "thesis": "After the 5 November rout (Nasdaq 100 -6.4%, S&P -4.4%, SOX -12.3% and -38.3% since June), the Nikkei and Kospi fell 6%. UBS reads it as de-risking over data-centre cost and pace, not fundamentals, and sees index gains over 6-12 months. Prefers industrials, health care and financials, with US IT and communication services at Neutral since February. Regional preference: Eurozone, EM, Asia ex-Japan. Reduce single-stock concentration.", "url": "https://www.ubs.com/global/en/wealthmanagement/insights/chief-investment-office/house-view/daily/2026/latest-06112026.html", "images": []}, {"source": "standard_chartered", "name": "Standard Chartered", "thesis": "Cut semis ~5 weeks ago and equities from OW to core two weeks ago, then added tactical US IT with the VIX above 25. OW US financials on a strong economy and high rates. Constructive on US healthcare, with 2027 earnings growth of ~23%. Switzerland and India (~15% 2027 EPS growth, the 'anti-AI trade') are diversifiers. All 24 post-2009 one-day falls of 4%+ had positive 3-month returns and 96% positive 6-month returns.", "url": "https://www.sc.com/sg/market-outlook/weekly-market-view-13-11-2026/?mvog=1", "images": []}, {"source": "citi_gps", "name": "Citi Research", "thesis": "US equities tactically downgraded to Neutral on blue-wave AI-capex risk, and Continental Europe upgraded to Overweight on lower oil sensitivity and AI exposure. Defensives have beaten cyclicals by up to 15pp. Global EPS growth is seen decelerating ~20pp in 2027.", "url": "https://www.citigroup.com/global/insights/markets-edition-reassessing-the-balance-of-risks", "images": []}, {"source": "yardeni_research", "name": "Yardeni Research", "thesis": "The S&P 500 has gone nowhere since early August, around 7,600, with turbulence inside sectors. Yardeni sees buying opportunities and a rally to 7,900 by year-end.", "url": "https://yardeni.com/research/quicktakes/2026/11/14/us-markets-call-below-the-calm-deep-blue-sea", "images": []}, {"source": "bca_research", "name": "BCA Research", "thesis": "Budaghyan: resist buying the dip, because a major global market top may already be behind us. Teaser only.", "url": "https://www.bcaresearch.com/reports/buy-dip-or-sell-dip-11-11-2026/227518", "images": []}, {"source": "bca_research", "name": "BCA Research", "thesis": "Papic: the Democratic sweep complicates the long-term bull market through more regulation and higher taxes, and complicates the Iran war in the short term. Positioned short oil, long bonds and long equities 'for the time being', but the AI capex story is 'tougher to cheerlead'.", "url": "https://www.bcaresearch.com/reports/here-there-and-everywhere-report-november-2026-10-11-2026/227506", "images": []}, {"source": "bny", "name": "BNY Investments", "thesis": "Since the 1950s the S&P's median 12-month excess return after midterms is ~9%, with ~12% in the first six months. Recent House flips are more muted at ~7%. Pure beta is risky this cycle, so favor value over growth and defensives. Texas alone holds ~25% of planned US data-centre capacity.", "url": "https://www.bny.com/investments/us/en/individual/articles/markets-and-economy/washington-realigned-assessing-policy-and-market-implications.html", "images": []}, {"source": "amundi", "name": "Amundi", "thesis": "The market reaction is relief plus rotation, not risk-on: bonds rallied, the dollar weakened and gold rose. Materials, financials, healthcare and staples led, while tech lagged. Small caps beat large-cap tech and Europe benefited. Favor non-US and non-tech equities.", "url": "https://research-center.amundi.com/article/what-democratic-sweep-means-markets", "images": []}, {"source": "goldman_sachs", "name": "Goldman Sachs", "thesis": "STOXX 600 EPS forecast at +18% in 2026 and +7% in 2027 versus euro-area nominal GDP of 3.3% and 2.8%. The euro area is now only ~1/3 of STOXX 600 sales, down from 60%+ in 1990. Financials are 30%+ of EURO STOXX earnings but ~10% of GDP.", "url": "https://www.goldmansachs.com/insights/articles/why-european-companies-are-forecast-to-have-robust-earnings-growth", "images": []}, {"source": "franklin_templeton", "name": "Franklin Templeton", "thesis": "Europe 2037: six converging forces (energy, demographics, debt, defence, tech adoption, reform). Renewables are 48% of power. Debt service is ~1.7-8% of revenues versus ~17% in the US. NATO's 5% target could lift European defence spending toward €800bn by 2030. Calls the value-trap consensus 'dated and lazy'.", "url": "https://www.franklintempleton.com/articles/en/2026/11/consider-this-europe-in-2037", "images": []}, {"source": "ubs", "name": "UBS", "thesis": "After the sweep, the S&P rose 1.6% as gridlock was seen as supportive. The S&P has averaged +15.5% in the six months after each of the last 14 midterms. Markets favor cash-rich platforms over businesses exposed to financing, construction or permitting risk.", "url": "https://www.ubs.com/global/en/wealthmanagement/insights/chief-investment-office/house-view/daily/2026/latest-05112026.html", "images": []}]}, {"theme": "AI & Tech: Capex, Regulation and the Nvidia Shock", "category": ["ai_tech", "equities"], "consensus": "Houses agree underlying AI demand is intact and the market is shifting from rewarding spending to demanding monetization, utilization and balance-sheet strength. UBS forecasts AI capex of $1.0tr in 2026, $1.4tr in 2027 and $1.5tr in 2028, and notes proposed US capacity of ~400GW against its ~90GW-by-2030 assumption. Goldman sees nominal global AI investment rising from $1.1tr to $1.8tr in 2027, front-loaded into H1. Oxford cites consensus hyperscaler capex of $1.17tn in 2027 versus $412bn in 2025. Most favor cash-rich hyperscalers and platforms over capacity-constrained 'picks and shovels', and agree chip export controls will not ease after Jensen Huang's resignation.", "divergence": "The split is over how much the Democratic sweep and state-level backlash will slow the buildout. BCA calls the regulatory onslaught overrated, though some rules will pass and data centres will need their own power. UBS says federal limits face veto constraints and state delays will 'redistribute and extend' the cycle. PIMCO says the outcome changes the journey, not the destination. Gavekal notes Trump will veto anti-AI bills and that lame-duck permitting reform (BAAJA) could be a positive, but is openly debating a slowdown versus a halt. The more cautious side cites Wood Mackenzie's tally that voters backed restrictions on 40 of 41 data-centre ballot measures. Texas, with ~25% of planned capacity (BNY), elected Gina Hinojosa, who wants to extend the approval pause. Amundi and Citi are cutting AI and US-tech exposure. On Nvidia, Gavekal says the biggest risk is a finding of knowing collusion in chip diversion (The Information reports ~240,000 restricted chips) and tighter export controls, possibly by year-end. UBS says it raises key-person and governance risk across the sector.", "items": [{"source": "ubs", "name": "UBS", "thesis": "The rebound (S&P +2.4%, SOX +6.9%) is dip-buying after a positioning reset. AI capex forecast at $1.0tr in 2026, $1.4tr in 2027 and $1.5tr in 2028. Political and physical constraints may delay, relocate or raise the cost of projects but won't eliminate demand. Brent fell 8% on the week to just under $90.", "url": "https://www.ubs.com/global/en/wealthmanagement/insights/chief-investment-office/house-view/daily/2026/latest-10112026.html", "images": []}, {"source": "ubs", "name": "UBS", "thesis": "On the Huang board review: key-person and governance risk deserves more attention given concentrated AI gains. Chip restrictions to China look unlikely to ease. Favors financially strong hyperscalers, selective semis, payment networks and beneficiaries of lower memory costs.", "url": "https://www.ubs.com/us/en/wealth-management/insights/investment-research/insights-display-adp/global/en/wealthmanagement/insights/chief-investment-office/house-view/daily/2026/latest-12112026.html?caasID=CAAS-ActivityStream", "images": []}, {"source": "bca_research", "name": "BCA Research", "thesis": "Gertken and Dyson: fears of AI regulation after the midterms are overblown, but some regulation will pass and data centres will need to generate their own electricity. Teaser only.", "url": "https://www.bcaresearch.com/reports/ai-regulatory-onslaught-overrated-11-11-2026/227521", "images": []}, {"source": "gavekal", "name": "Gavekal", "thesis": "Federal legislation is not the risk because Trump will veto. The lame-duck BAAJA permitting reform could be a positive for capex. Gavekal is internally debating whether state restrictions slow or halt the boom, with scenarios for semis, data-centre operators and frontier labs. Teaser.", "url": "https://research.gavekal.com/teaser/the-ai-supply-chain-post-elections/", "images": []}, {"source": "gavekal", "name": "Gavekal", "thesis": "Kroeber and Khawaja: the key Nvidia risk is a finding of knowing collusion in chip diversion from a Singapore data centre to China. For China, the risk is tighter US export controls on chips and tools, possibly by year-end. The scandal also raises the odds of tougher regulation from the Democratic Congress.", "url": "https://research.gavekal.com/teaser/gkdg-the-nvidia-blast-zone/", "images": []}, {"source": "galaxy_digital", "name": "Galaxy Digital", "thesis": "Huang resigned on 12 November. CFO Colette Kress is interim CEO and Harvey Jones becomes Nvidia's first chairman. Reports link Megaspeed and Alice Huang to ~$7.5bn of chip shipments moving ~240,000 restricted chips into China. Open-weight AI loses its most powerful advocate just as Washington turns hawkish. Huang has been asked to testify on 18 November.", "url": "https://www.galaxy.com/insights/research/jensen-huang-nvidia-resignation-open-weight-ai-hugging-face-china-spy-megaspeed", "images": []}, {"source": "pimco", "name": "PIMCO", "thesis": "The midterms could slow data-centre construction and near-term AI issuance but are unlikely to change the ultimate scale. AI borrowers are ~half of 2026 YTD 15+ year non-financial IG supply.", "url": "https://www.pimco.com/us/en/insights/the-credit-market-lens-where-to-seek-diversification-from-the-ai-investment-theme", "images": []}, {"source": "wood_mackenzie", "name": "Wood Mackenzie", "thesis": "Voters backed restrictions on 40 of 41 data-centre ballot proposals in 13 states. Texas Governor-elect Hinojosa wants to extend Abbott's approval pause until protections exist, but lets projects under construction continue. The Ratepayer Protection Act and GRID Savings Act would make data centres pay for grid costs. BAAJA permitting reform is in play this week.", "url": "https://www.woodmac.com/blogs/energy-pulse/what-the-us-midterm-elections-mean-for-energy/", "images": []}, {"source": "oxford_economics", "name": "Oxford Economics", "thesis": "US data-centre real estate returned 7.1% annualized over 3 years versus 2.1% for all CRE, but only 0.4% in Q3 2026 as costs and the pipeline weigh. Hyperscaler capex consensus is $1.17tn in 2027 versus $412bn in 2025. Development is shifting to secondary markets.", "url": "https://www.oxfordeconomics.com/resource/us-data-center-real-estate-outperforms-as-development-expands-into-new-markets/", "images": []}, {"source": "oxford_economics", "name": "Oxford Economics", "thesis": "Data-centre construction across 25 markets grows 45% to a $212bn peak in 2030, then falls 40% by 2037. The US accounts for 60%+ of growth. Announcements far exceed construction capacity, and the post-midterm risk is mainly state and local.", "url": "https://www.oxfordeconomics.com/resource/global-data-centre-construction-to-peak-in-2030/", "images": []}, {"source": "macquarie", "name": "Macquarie", "thesis": "Speed to power is the binding constraint. Interconnection queues are up 116% from 2020 to 2025, transformer lead times are 144 weeks, and PJM North Illinois PPAs price $38/MWh above the forward curve versus $14 below in ERCOT West. This favors scaled developers and consolidation.", "url": "https://www.macquarie.com/au/en/insights/energy-development-bottlenecks-us-market.html", "images": []}, {"source": "lazard", "name": "Lazard", "thesis": "2026 LCOE+: costs are rising across every technology, but unsubsidized renewables remain the cheapest new build. Storage costs rose, reversing prior declines. In a 'speed-to-power era', value accrues to whoever delivers capacity fastest.", "url": "https://www.lazard.com/research-insights/financial-advisory/levelized-cost-of-energyplus-lcoeplus/", "images": []}, {"source": "chainalysis", "name": "Chainalysis", "thesis": "A shadow market of proxy services gives Chinese users access to restricted US frontier models for distillation. 40% of 100 surveyed proxies accept crypto, mostly stablecoins, and Chinese-linked wallet payments spike after US model launches.", "url": "https://www.chainalysis.com/blog/chinese-ai-proxy-services/", "images": []}]}, {"theme": "Energy & Commodities", "category": ["energy", "commodities", "geopolitics"], "consensus": "Most houses expect energy prices to normalize in 2027 but stay well above pre-war levels, with a lasting geopolitical premium. Goldman sees Brent at $78 by end-2027 and energy turning into a modest growth tailwind. Amundi estimates effective oil supply at ~80% of pre-Iran-war levels and expects prices elevated through year-end, easing in H1 2027, with gas tighter. Brent swung from above $110 in late October (ECB) to just under $90 (UBS, 10 November) on US-Iran diplomacy hopes, then rebounded after Trump said Washington 'does not need a deal' (Standard Chartered, 13 November). Refining is the choke point: ECB data show EU diesel cracks at ~3x pre-conflict levels and seaborne diesel imports down 56%.", "divergence": "BCA is split with itself. Commodity strategist Roukaya Ibrahim says the slide means oil is 'priced for peace, exposed to war': a deal is far from assured, inventories are depleted and risks tilt higher. Papic's GeoMacro team is short oil, betting the midterm rout pressures Trump to wind down the war. Amundi adds a political wrinkle: a weaker president at home may become more interventionist abroad, and another round of strikes is widely expected short term. The BoE's Megan Greene says even if the war ended tomorrow the shock is already protracted, with wholesale gas near triple its January level. Gavekal is costing out a 'frozen conflict'. On food, the World Bank sees its index +10% in 2026 and +7% in 2027 with upside risks from El Niño and Black Sea attacks.", "items": [{"source": "bca_research", "name": "BCA Research", "thesis": "Ibrahim: the recent slide prices in peace, but a swift US-Iran deal is far from assured and depleted inventories leave prices exposed to renewed disruption. Risks tilt higher. Teaser only.", "url": "https://www.bcaresearch.com/reports/oil-priced-peace-exposed-war-13-11-2026/227533", "images": []}, {"source": "goldman_sachs", "name": "Goldman Sachs", "thesis": "Commodity team baseline: continued Middle East supply adaptation brings Brent to $78 by end-2027 with similar LNG normalization. Energy flips from headwind to a modest growth boost, though delayed pass-through still drags on Europe.", "url": "https://www.goldmansachs.com/insights/articles/the-global-economy-is-forecast-to-grow-2-point-8-percent-in-2027-as-oil-prices-decline", "images": []}, {"source": "amundi", "name": "Amundi", "thesis": "Effective oil supply is ~80% of pre-war levels after rerouting. Prices stay elevated through year-end and ease over H1 2027. Gas is tighter with fewer rerouting options. A 'second wave' of energy inflation could be more persistent, so watch wages and services.", "url": "https://research-center.amundi.com/article/global-investment-views-november-2026", "images": []}, {"source": "ecb", "name": "ECB", "thesis": "Brent front-month topped $110 at end-October, ~60% above pre-conflict. Global refinery runs fell sharply. EU seaborne diesel imports were down 56% and petrol 52% by end-September. Diesel cracks are ~3x pre-conflict in Europe. Russia extended fuel export bans to end-January 2027.", "url": "https://www.ecb.europa.eu/press/economic-bulletin/focus/2026/html/ecb.ebbox202607_05~d82730508f.en.html", "images": []}, {"source": "wood_mackenzie", "name": "Wood Mackenzie", "thesis": "Hormuz has been effectively closed since February. Aramco and ADNOC used bypass pipelines to earn ~$35bn more operating cash flow than forecast. QatarEnergy lost 17% of liquefaction capacity and is ~$10bn below plan. The UAE is adding 1.5mb/d to the Fujairah pipeline, and Saudi bypass capacity could reach 10mb/d by 2030. ADNOC's XRG is targeting 47mtpa of LNG by 2035.", "url": "https://www.woodmac.com/blogs/the-edge/middle-east-noc-oil-and-gas-strategies-beyond-the-crisis/", "images": []}, {"source": "boe", "name": "Bank of England", "thesis": "Megan Greene: Hormuz attacks continue and new chokepoints such as Bab el-Mandeb have emerged. Wholesale gas is near triple and oil spot just under double early-January levels. 'Even if the conflict in Iran ends tomorrow, we have already been hit by a protracted energy shock.' She doubts labour-market slack will contain second-round effects.", "url": "https://www.bankofengland.co.uk/speech/2026/october/megan-greene-speech-at-lse-economics-society-london", "images": []}, {"source": "world_bank", "name": "World Bank", "thesis": "The food price index hit a 3-year high in September and is +15% y/y. Grains rose 9% q/q in Q3 (wheat +13%) on Black Sea attacks, drought and a strong El Niño. US wheat output is seen -23%, the lowest since 1970-71. The index is projected +10% in 2026 and +7% in 2027, with maize stocks-to-use at its lowest since 2012-13.", "url": "https://blogs.worldbank.org/en/opendata/food-prices-climb-as-conflicts-and-el-nino-tighten-grain-supplie", "images": []}, {"source": "bridgewater", "name": "Bridgewater", "thesis": "Dan Yergin with Bridgewater calls the Iran war 'the mother of all supply shocks' and discusses the energy-security push and the race to power AI. Podcast teaser.", "url": "https://www.bridgewater.com/research-and-insights/pulitzer-prize-winner-dan-yergin-on-how-the-iran-war-is-reshaping-the-energy-map-and-the-race-to-power-ai", "images": []}, {"source": "invesco", "name": "Invesco", "thesis": "Midstream MLPs (AMZ) rose 4.05% in October and +26.2% total return YTD versus 11.75% for the S&P 500. Midstream has historically done well regardless of which party controls Congress.", "url": "https://www.invesco.com/us/en/insights/latest-steelpath-commentary-on-midstream-energy-infrastructure-industry.html", "images": []}]}, {"theme": "Credit", "category": ["credit"], "consensus": "Credit fundamentals are seen as healthy outside the lowest tier. Vanguard notes S&P 500 Q3 EPS growth of 29% and net leverage of ~2x, the lowest since 2014. GS Asset Management says EM sovereign and corporate credit absorbed the energy shock with 'newfound stability'. Amundi prefers global and EU IG plus higher-quality yield. The common thread is to be selective, because dispersion is rising.", "divergence": "The debate is whether stress at the bottom is a warning. Vanguard says CCC spreads, ~1,000bp and 500bp wider than the year's tights, reflect a narrow, idiosyncratic sell-off: four of 150+ CCC issuers make up 30%+ of CCC spreads, mostly in telecom and media. It also concedes risk has migrated into private credit and leveraged loans, where defaults are rising. The Fed sizes US private credit vehicles at ~$1.9tn, up from $240bn in 2012, with BDCs levered ~1x. The BoE's Bailey flags rapidly growing AI-linked financing as a new systemic exposure. PIMCO's issue is concentration rather than defaults: AI issuers dominate long-dated IG supply, and the obvious diversifiers (IG financials, HY energy) are expensive. PIMCO therefore steers to agency MBS, AAA non-QM and EM debt.", "items": [{"source": "vanguard", "name": "Vanguard", "thesis": "CCC spreads are ~1,000bp, the widest discount to the rest of HY since COVID, but the stress is narrow: four issuers make up 30%+ of CCC spreads, mostly telecom and media. CCCs are under 10% of HY, down more than 50% since pre-GFC. The HY yield is 8.21% (6 November). Private credit and leveraged-loan defaults are rising.", "url": "https://corporate.vanguard.com/content/corporatesite/us/en/corp/articles/beyond-ccc-high-yield-appears-resilient.html", "images": []}, {"source": "pimco", "name": "PIMCO", "thesis": "Lotfi Karoui: AI-related borrowers are ~half of 15y+ non-financial IG issuance YTD. IG financials and HY energy diversify but are expensive. Prefers agency MBS (carry over IG without corporate risk, more resilient than in 2023), AAA non-QM (spreads widened on extension risk, not credit) and EM debt.", "url": "https://www.pimco.com/us/en/insights/the-credit-market-lens-where-to-seek-diversification-from-the-ai-investment-theme", "images": []}, {"source": "goldman_sachs", "name": "Goldman Sachs", "thesis": "Anupam Damani: EM credit is 'unrecognizable, in a good way'. It has 80+ sovereign issuers, deep local markets, credible inflation frameworks and a looser dollar constraint, and weathered the Iran oil shock. Selection matters. Investors increasingly demand a higher risk premium for some DM assets.", "url": "https://www.goldmansachs.com/insights/articles/emerging-market-credit-shows-resilience-amid-energy-shock", "images": []}, {"source": "federal_reserve", "name": "Federal Reserve", "thesis": "US private credit vehicles held ~$1.9tn at end-2025, up from ~$240bn in 2012. PD funds hold $940bn. BDCs are ~80% private loans with debt/equity ~1, versus ~0.25 for PD funds and ~0.05 for interval funds.", "url": "https://www.federalreserve.gov/econres/notes/feds-notes/u-s-private-credit-vehicles-institutional-structure-and-aggregate-balance-sheets-20261109.html", "images": []}, {"source": "boe", "name": "Bank of England", "thesis": "Bailey: the system has been resilient, but sovereign debt, credit markets and valuations could crystallize together. Rapid expansion of AI-related financing creates new exposures, and frontier-AI incidents add operational and cyber risk.", "url": "https://www.bankofengland.co.uk/speech/2026/october/andrew-bailey-speech-at-the-istanbul-economic-forum-central-bank-of-the-republic-of-turkey-istanbul", "images": []}, {"source": "bnp_paribas", "name": "BNP Paribas AM", "thesis": "Corporate bond alpha comes from mispricing across an issuer's curve, liquidity and behavioural dislocations, using a systematic multi-factor approach near benchmark risk.", "url": "https://viewpoint.bnpparibas-am.com/talking-heads-corporate-bonds-finding-alpha-in-an-efficient-market/", "images": []}]}, {"theme": "USD, FX & Gold", "category": ["fx", "commodities"], "consensus": "Near-term, the dollar is being driven by Fed-ECB rate divergence. Standard Chartered has DXY at 103.17, its highest since April 2025, EUR/USD at a 19-month low of 1.1046 after breaking 1.1065-1.1105 support, and USD/JPY at 159.95. Gold is the shared hedge: UBS recorded ~$4,070/oz on 6 November, Standard Chartered opened a long at $3,910, and Amundi holds gold as a core diversifier.", "divergence": "The disagreement is about how long the USD rally lasts. Standard Chartered says DXY is near overbought with resistance at 103.5. It closed its EUR/USD long, sees further EUR downside to 1.0873, and sets a conditional short in USD/JPY at 160.40 targeting 155.2 on intervention risk, citing Japan's Mimura. BCA's Budaghyan says sell the dollar on strength, and BCA's FX desk warns the carry cycle behind G10 returns is near a turning point. Amundi noted the dollar weakened on the blue wave as policy exceptionalism narrowed. On China, PIIE's Gagnon and Agrawal estimate the renminbi is ~20% undervalued and driving a trade surplus already larger, relative to world GDP, than the 2000s China Shock. Fed staff find euro-area gold repatriations have not cut dollar reserve shares.", "items": [{"source": "standard_chartered", "name": "Standard Chartered", "thesis": "DXY rose 0.3% to 103.17, the highest since April 2025, and is nearing overbought with resistance at 103.5. EUR/USD hit a 19-month low of 1.1046, with next support at 1.0873, and the EUR long was closed. USD/JPY at 159.95: Mimura warned moves are 'too fast'. Conditional bearish USD/JPY at 160.40 targets 155.2. Opened bullish XAU/USD at $3,910. US 10y is above 5.10% and 2y at 4.87%.", "url": "https://www.sc.com/sg/market-outlook/daily-navigator-13-11-2026/?mvog=1", "images": []}, {"source": "bca_research", "name": "BCA Research", "thesis": "Carry still leads the G10 scorecard, but diverging growth, inflation and rate signals suggest the cycle is nearing a turning point. BCA is shortening its horizon and watching for rotation opportunities in 2027. Teaser.", "url": "https://www.bcaresearch.com/reports/g10-fx-scorecard-carry-holds-divergences-grow-11-11-2026/227520", "images": []}, {"source": "peterson_institute", "name": "Peterson Institute (PIIE)", "thesis": "Gagnon and Agrawal: the CNY is ~20% undervalued. The REER is ~8% below trend, and the trade surplus relative to world GDP exceeds the 2000s China Shock. Nonmonetary gold imports are ~1.0% of GDP. Europe is pressing Beijing on FX while the US is silent.", "url": "https://www.piie.com/blogs/realtime-economics/2026/chinas-undervalued-currency-driving-its-trade-surplus-higher", "images": []}, {"source": "federal_reserve", "name": "Federal Reserve", "thesis": "Germany, the Netherlands and France moved gold out of the US without cutting dollar reserve shares (Germany >80%), unlike Russia and Turkey. For them, the benefits of dollar assets outweigh sanctions risk.", "url": "https://www.federalreserve.gov/econres/notes/feds-notes/gold-reserve-relocations-are-they-always-bad-news-for-u-s-dollar-reserves-20261109.html", "images": []}]}, {"theme": "Crypto & Digital Assets", "category": ["crypto"], "consensus": "Crypto is trading as a high-beta rates and tech asset. CoinShares sees BTC range-bound at $60-90k with no breakout catalyst while the Fed hikes, whales sell and AI sentiment sours, though it notes BTC's resilience (-2.1% on the week versus -6.6% for blockchain equities). Galaxy had BTC near $75.9k during the 5 November rout. Institutions are slowly adding: CoinShares' survey shows average allocation up to 1.3% from 1.2%, with diversification (40%) replacing speculation (under 9%) as the motive.", "divergence": "The split is over what a Democratic Congress means. Delphi's Hivemind argues 'a broken Congress is bullish' and that stocks almost always rise in the six months after midterms. CoinShares says the CLARITY Act's harder path matters less because GENIUS is law and the SEC and CFTC are acting within existing powers; Bitcoin is insulated while token issuers and exchanges are exposed. Galaxy is the most cautious: crypto and AI PACs lost 9 of 12 competitive races, Sherrod Brown is back, and Warren and Waters are set to chair the banking committees, which brings subpoenas and scrutiny of Trump-linked ventures. CoinShares' contrarian upside case is US bond-market stress, with yields at 6-7% forcing intervention.", "items": [{"source": "coinshares", "name": "CoinShares", "thesis": "October core CPI hit Waller's 50bp threshold and the 10y jumped back toward 5%. CoinShares is sceptical 50bp is sensible given oil is down ~20% from its peak and conditions are tighter. BTC base case is a $60-90k range. Upside tail: Treasury yields at 6-7% forcing aggressive intervention.", "url": "https://coinshares.com/insights/research-data/market-update-13-11-2026/", "images": []}, {"source": "coinshares", "name": "CoinShares", "thesis": "On 5 November the Nasdaq fell 5.5%, Nasdaq 100 6.4% and semis 12%, while BTC fell just over 5% and $1bn+ of leverage was liquidated. Miners repositioned as AI and data-centre plays were hit hardest. CLARITY now faces a harder path but matters less with GENIUS law and agency pathways.", "url": "https://coinshares.com/insights/research-data/market-update-06-11-2026/", "images": []}, {"source": "galaxy_digital", "name": "Galaxy Digital", "thesis": "Democrats flipped 7 Senate and ~35+ House seats. Crypto and AI PACs lost 9 of 12 competitive races, and Sherrod Brown beat Husted despite ~$64m of crypto PAC spending. Warren is likely to chair Senate Banking and Waters House Financial Services. Expect investigations, including into World Liberty Financial.", "url": "https://www.galaxy.com/insights/research/democratic-midterm-wins-crypto-ai-policy", "images": []}, {"source": "delphi_digital", "name": "Delphi Digital", "thesis": "Hivemind panel the day after the midterms: two years of gridlock are good for crypto. They also cover the biggest hedge-fund deleveraging in years, the Binance hack, and the Hyperliquid L2 Elysium launching on 9 November.", "url": "https://members.delphidigital.io/media/a-broken-congress-is-bullish-for-crypto", "images": []}, {"source": "coinshares", "name": "CoinShares", "thesis": "October fund-manager survey: average digital-asset allocation is 1.3% (from 1.2%). Diversification is 40% of motives and speculation under 9%. Altcoin interest is rotating to HYPE, SUI, UNI, AAVE and LINK. Fewer respondents now see the Fed making a policy error.", "url": "https://coinshares.com/insights/research-data/digital-asset-quarterly-fund-manager-survey-10-2026/", "images": []}, {"source": "coinshares", "name": "CoinShares", "thesis": "The blockchain equities index fell 6.6% on the week versus BTC -2.1%. Cipher, IREN and Hut-8 fell ~31%. Texas data-centre oversight could make existing power connections more valuable. Riot signed a $28bn Corsicana lease and IREN's AI cloud revenue rose to $200m.", "url": "https://coinshares.com/insights/research-data/equities-update-09-11-2026/", "images": []}, {"source": "galaxy_digital", "name": "Galaxy Digital", "thesis": "Weekly brief: second-order effects of Huang's ouster on open-weight AI, Aave's governance move to offboard riskier collateral from V3 Core, and a new Ethereum Foundation lawsuit controversy.", "url": "https://www.galaxy.com/insights/research/jensen-huang-nvidia-open-weight-ai-aave-offboard-ethereum-foundation-lawsuit", "images": []}, {"source": "chainalysis", "name": "Chainalysis", "thesis": "Western Europe's crypto economy is $2.08tn (+1.2%), the second largest globally. Regional stablecoin holdings rose 131% versus 52% globally. French self-custodied stablecoin balances rose 192% amid fiscal stress. The UK is $424.5bn (-8%).", "url": "https://www.chainalysis.com/blog/western-europe-crypto-adoption-2026/", "images": []}, {"source": "chainalysis", "name": "Chainalysis", "thesis": "Effective 10 December, FinCEN bars US institutions from dealing with MEXC Global. It cites ~$1.5bn of Russian sanctions-evasion exposure and ~$1bn with 40+ Iranian exchanges.", "url": "https://www.chainalysis.com/blog/fincen-mexc-global-november-2026/", "images": []}, {"source": "ecb", "name": "ECB", "thesis": "ECB consumer survey: euro-area stablecoin exposure is limited but concentrated among crypto investors and dominated by USD tokens. Wider use could raise run and fire-sale spillovers to traditional finance.", "url": "https://www.ecb.europa.eu/press/economic-bulletin/focus/2026/html/ecb.ebbox202607_08~f4ddf0117c.en.html", "images": []}]}, {"theme": "EM, China & Geopolitics", "category": ["em", "geopolitics"], "consensus": "EM is broadly favored as a diversifier from US-tech concentration. UBS prefers EM and Asia ex-Japan, Amundi is more constructive on local and hard-currency EM debt and tactically raised BRL, PIMCO and GSAM like EM debt, and Standard Chartered likes India. Trade keeps defying politics: Gavekal says goods-trade volume is growing at its fastest pace in 15 years (ex post-COVID) on AI equipment and rerouting, with Chinese exports possibly near $4.5trn in 2026. US-China focus now shifts to the APEC leaders' meeting in Shenzhen (18-19 November), the third Trump-Xi encounter this year, where Brookings expects only small steps such as an AI incident-notification channel.", "divergence": "Views on China split. Goldman forecasts 4.5% GDP in 2027 on exports but weak domestic demand. Gavekal notes the CSI 300 fell 8.5% in October, its worst month in over a decade, and is -14% YTD because China trades purely on the US data-centre story, though shrinking new share supply in 2027 is a supportive base. Gavekal's Louis-Vincent Gave argues the US keeps sabotaging summits, as with the spy balloon and the entity-list expansion. Kroeber assesses the risk to the trade truce expiring in January after the Huang affair. In LatAm, Citi says the region has 'room to run' on geopolitical distance, rerouted trade and a weaker dollar, but Lula's surprise re-election sent the real down 10%+, and Amundi is watching Brazil and Indonesia. On US trade policy, Carnegie and PIIE expect the new Congress to try to reclaim tariff powers (66% of voters said tariffs hurt), while Wood Mackenzie notes Trump keeps broad executive leeway on tariffs and Iran.", "items": [{"source": "gavekal", "name": "Gavekal", "thesis": "Tom Miller: goods-trade volume is growing at its fastest pace in 15 years (ex post-COVID) on AI equipment demand and rerouting. The WTO sees faster 2027 growth. Risks are an AI bust and a backlash against Chinese exports, possibly ~$4.5trn in 2026.", "url": "https://research.gavekal.com/teaser/after-trumps-rout-will-global-trade-keep-defying-politics/", "images": []}, {"source": "gavekal", "name": "Gavekal", "thesis": "The CSI 300 fell 8.5% in October, its worst month in over a decade, and is -14% YTD despite National Team support. China's market is tied to US data-centre sentiment. New tradeable share supply shrinks to a decade low in 2027, a favorable base if sentiment turns.", "url": "https://research.gavekal.com/teaser/for-chinese-equities-the-good-news-is-in-short-supply/", "images": []}, {"source": "gavekal", "name": "Gavekal", "thesis": "After the Huang affair and the midterm swing, Kroeber assesses risks to the US-China trade truce expiring in January, Miller asks whether APEC becomes a 'new Yalta', and Holland costs a frozen US-Iran conflict. Teaser.", "url": "https://research.gavekal.com/teaser/geoeconomic-monitor-nothings-fair-in-love-and-war/", "images": []}, {"source": "brookings", "name": "Brookings", "thesis": "For APEC Shenzhen (18-19 November), Brookings scholars expect low-ambition US-China AI risk talks, starting with incident notification, alongside trade and security issues at the third Trump-Xi meeting of 2026.", "url": "https://www.brookings.edu/articles/trump-xi-and-putin-what-to-expect-from-the-apec-summit/", "images": []}, {"source": "citi_gps", "name": "Citi Research", "thesis": "LatAm growth is positive on distance from conflict, trade reconfiguration, commodity prices and a weaker USD. Lula's surprise re-election sent the BRL down 10%+ on fiscal worries. El Niño is a stagflation risk for the Andes in Q4 2026-Q1 2027. Dominican Republic, Guatemala, Costa Rica and Panama are standout credit stories.", "url": "https://www.citigroup.com/global/insights/e92-latin-america-room-to-run-risks-to-watch", "images": []}, {"source": "jpmorgan", "name": "J.P. Morgan", "thesis": "Joyce Chang at the IMF/WB Bangkok meetings: capital is tilting East. ASEAN GDP is ~$4.5tn and up ninefold since 1998. AI data-centre demand drives a manufacturing renaissance in Korea, Taiwan and Japan, with China+1 benefiting India, Vietnam and Malaysia.", "url": "https://www.jpmorgan.com/insights/podcast-hub/making-sense/imf-fall-meetings-asia-ai", "images": []}, {"source": "kkr", "name": "KKR", "thesis": "Japan buyout and exit value nearly tripled from 2022 to 2025 to a record $92.5bn, with more take-privates than IPOs in 2025. Asia's AI infrastructure gap exceeds those of the US and Europe, and private credit is gaining share from banks.", "url": "https://www.kkr.com/insights/asias-private-capital-opportunity", "images": []}, {"source": "carnegie", "name": "Carnegie Endowment", "thesis": "Barbara Weisel: tariffs struck down under IEEPA in February have been recreated via Section 301 (forced labour on 60 economies from July, and excess capacity on 16 economies pending). Urges more targeted tariffs and working with a Congress likely to reassert trade authority.", "url": "https://carnegieendowment.org/emissary/2026/11/midterms-tariffs-trump-trade-policy", "images": []}, {"source": "peterson_institute", "name": "Peterson Institute (PIIE)", "thesis": "Inu Manak: 66% of voters said tariffs hurt the economy. Section 301 now props up 10-12% baseline tariffs. Congress could require votes on tariffs or close the Section 232/301 loopholes.", "url": "https://www.piie.com/blogs/realtime-economics/2026/how-congress-might-take-back-its-trade-powers-and-limit-trumps", "images": []}, {"source": "federal_reserve", "name": "Federal Reserve", "thesis": "Fed note: within both Canada and Mexico, more tariff-exposed sectors lost US export share. A 10pp exposure gap means ~5% (Canada) and ~12% (Mexico) weaker exports. Mexico's aggregate gain came from a machinery surge.", "url": "https://www.federalreserve.gov/econres/notes/feds-notes/a-common-pattern-behind-diverging-fortunes-u-s-tariffs-and-exports-from-canada-and-mexico-20261109.html", "images": []}, {"source": "brookings", "name": "Brookings", "thesis": "Xi's purges are unprecedented post-Mao and aimed at PLA loyalty rather than corruption. Succession is undefined.", "url": "https://www.brookings.edu/articles/why-is-xi-jinping-purging-leaders-of-his-own-party/", "images": []}]}], "B_calls": [{"source": "ubs", "name": "UBS", "call": "Base case: 25bp Fed hikes in December and March, with risk of more or faster tightening. Favor quality short/medium bonds, avoid the longest maturities, hold broad commodities as a diversifier.", "category": ["rates"], "url": "https://www.ubs.com/global/en/wealthmanagement/insights/chief-investment-office/house-view/daily/2026/latest-11112026.html", "images": []}, {"source": "pimco", "name": "PIMCO", "call": "Forecast shifted to 25bp hikes in December and January (risk of March). Would move to 50bp in December if Williams/Jefferson echo Waller.", "category": ["rates"], "url": "https://www.pimco.com/us/en/insights/inflation-is-sticky-but-this-isnt-2022-all-over-again", "images": []}, {"source": "goldman_sachs", "name": "Goldman Sachs", "call": "Fed hikes in December and March, a cut in December 2027, and three more in 2028 to 3.25-3.5%. BoJ hikes in December, March and June to 2%. BoE final hike to 4.25% in February. ECB final hike in December, then to 2.25% in Q4 2027. Brent $78 by end-2027. Global GDP 2.8% in 2027.", "category": ["rates", "growth", "energy"], "url": "https://www.goldmansachs.com/insights/articles/the-global-economy-is-forecast-to-grow-2-point-8-percent-in-2027-as-oil-prices-decline", "images": []}, {"source": "ubs", "name": "UBS", "call": "Sees broad equity index gains over 6-12 months and calls the sell-off overdone. Preferred sectors: industrials, health care, financials, with US IT and communication services at Neutral. Regional preference: Eurozone, EM, Asia ex-Japan.", "category": ["equities"], "url": "https://www.ubs.com/global/en/wealthmanagement/insights/chief-investment-office/house-view/daily/2026/latest-06112026.html", "images": []}, {"source": "standard_chartered", "name": "Standard Chartered", "call": "Equities cut from OW to core. Tactical US IT idea (rotate semis into software and hardware), OW US financials, constructive US healthcare (~23% 2027 EPS growth). Switzerland and India as diversifiers. Closed US TIPS idea at +4.4%.", "category": ["equities", "rates"], "url": "https://www.sc.com/sg/market-outlook/weekly-market-view-13-11-2026/?mvog=1", "images": []}, {"source": "standard_chartered", "name": "Standard Chartered", "call": "FX and gold: opened bullish XAU/USD at $3,910. Closed bullish EUR/USD at 1.1080, with EUR/USD support at 1.0873. Conditional bearish USD/JPY triggered at 160.40, target 155.2. DXY resistance at 103.5.", "category": ["fx", "commodities"], "url": "https://www.sc.com/sg/market-outlook/daily-navigator-13-11-2026/?mvog=1", "images": []}, {"source": "citi_gps", "name": "Citi Research", "call": "US equities tactically downgraded to Neutral and Continental Europe upgraded to Overweight. Global EPS growth seen decelerating ~20pp in 2027.", "category": ["equities"], "url": "https://www.citigroup.com/global/insights/markets-edition-reassessing-the-balance-of-risks", "images": []}, {"source": "bca_research", "name": "BCA Research", "call": "Resist buying the equity dip because a major global top may be in. Sell USD on strength. Accumulate bonds on weakness in current-account-surplus countries.", "category": ["equities", "fx", "rates"], "url": "https://www.bcaresearch.com/reports/buy-dip-or-sell-dip-11-11-2026/227518", "images": []}, {"source": "bca_research", "name": "BCA Research", "call": "Short oil, long bonds, long equities 'for the time being'. AI capex is harder to cheerlead under political headwinds.", "category": ["energy", "rates", "equities"], "url": "https://www.bcaresearch.com/reports/here-there-and-everywhere-report-november-2026-10-11-2026/227506", "images": []}, {"source": "bca_research", "name": "BCA Research", "call": "Stick with hawkish Fed trades (November portfolio allocation summary).", "category": ["rates"], "url": "https://www.bcaresearch.com/reports/stick-hawkish-fed-trades-11-11-2026/227450", "images": []}, {"source": "gavekal", "name": "Gavekal", "call": "Gavekal-IS global allocation model is unequivocally risk-off, so cut equity allocations to 20% or less.", "category": ["equities"], "url": "https://research.gavekal.com/teaser/equity-risk-off-what-next/", "images": []}, {"source": "yardeni_research", "name": "Yardeni Research", "call": "S&P 500 at 7,561.67 is set for a rally to 7,900 by year-end. The midterm chop is a buying opportunity.", "category": ["equities"], "url": "https://yardeni.com/research/quicktakes/2026/11/14/us-markets-call-below-the-calm-deep-blue-sea", "images": []}, {"source": "pimco", "name": "PIMCO", "call": "Income strategies have duration roughly at Agg (versus near zero in 2021). Lock in yields, with preference for high-quality global ex-US opportunities.", "category": ["rates"], "url": "https://www.pimco.com/us/en/resources/video-library/media/a-higher-starting-point", "images": []}, {"source": "pimco", "name": "PIMCO", "call": "Diversify away from AI-heavy IG: overweight agency MBS, AAA non-QM RMBS and EM debt. IG financials and HY energy are too expensive.", "category": ["credit"], "url": "https://www.pimco.com/us/en/insights/the-credit-market-lens-where-to-seek-diversification-from-the-ai-investment-theme", "images": []}, {"source": "amundi", "name": "Amundi", "call": "Mildly risk-on. Near-neutral US duration (intermediates), marginally more positive EZ duration (peripherals, steepener), positive UK duration. More constructive EM debt, tactically positive BRL. Gold as diversifier. Expects the Fed and ECB to hike in December and possibly early 2027.", "category": ["rates", "em", "fx", "equities"], "url": "https://research-center.amundi.com/article/global-investment-views-november-2026", "images": []}, {"source": "bny", "name": "BNY Investments", "call": "Pure beta is risky this cycle. Favor value over growth and defensive sectors.", "category": ["equities"], "url": "https://www.bny.com/investments/us/en/individual/articles/markets-and-economy/washington-realigned-assessing-policy-and-market-implications.html", "images": []}, {"source": "oxford_economics", "name": "Oxford Economics", "call": "BoE Bank Rate to peak at 4.25% with upside risks. December is a coin flip.", "category": ["rates"], "url": "https://www.oxfordeconomics.com/resource/uk-hawkish-monetary-policy-committee-puts-a-december-hike-on-the-table/", "images": []}, {"source": "coinshares", "name": "CoinShares", "call": "BTC expected to range between $60k and $90k until Fed expectations, flows or whale accumulation change.", "category": ["crypto"], "url": "https://coinshares.com/insights/research-data/market-update-13-11-2026/", "images": []}], "C_deep_reads": [{"source": "goldman_sachs", "name": "Goldman Sachs", "title": "The Global Economy Is Forecast to Grow 2.8% in 2027 as Oil Prices Decline (Jan Hatzius, 13 Nov)", "summary": "Goldman's flagship 2027 outlook. Global GDP edges up to 2.8% from 2.7%, with the US, Japan and UK above consensus. GS stays more optimistic than consensus on the US because of resilient investment and more downbeat on Europe as energy costs bite this winter. Three impulses change in 2027. First, energy flips from headwind to modest tailwind as Middle East supply adapts and Brent falls to $78 by end-2027, though delayed pass-through still drags on Europe. Second, fiscal impulses fade except in Japan (+0.7pp), while the Democratic win may reverse some 2025 OBBBA spending cuts. Third, AI investment rises from $1.1tr to $1.8tr, front-loaded into H1, adding 0.4pp to global and 0.6pp to 'true' US growth. GS frames the AI transition in two phases: a capex boom with limited productivity gains now, then reorganization, productivity gains and labour disruption mostly in 2028-29. US core PCE falls from 3.2% to 2.4% by end-2027 as tariffs drop out. The Fed hikes in December and March, then cuts in December 2027 and three more times in 2028 to 3.25-3.5%, with more dovish risk in the US than elsewhere because the US is most exposed to an AI downturn. BoJ is the hawkish outlier with hikes in December, March and June to 2%. China grows 4.5% on exports and a bigger trade surplus, with weak domestic demand that costs Germany 0.3pp. Risks are tilted down: Iran re-escalation, deficits (France), and an AI-capex shortfall from capacity limits, regulation or credit stress.", "url": "https://www.goldmansachs.com/insights/articles/the-global-economy-is-forecast-to-grow-2-point-8-percent-in-2027-as-oil-prices-decline", "images": []}, {"source": "pimco", "name": "PIMCO", "title": "Macro Signposts: Inflation Is Sticky, But This Isn't 2022 All Over Again (Tiffany Wilding, 10 Nov)", "summary": "PIMCO's argument for why this is a recalibration rather than a new 2022. October core CPI was +0.33% and broad, and categories less exposed to energy (shelter, recreation, non-transport services) were also firm, so it is not only an energy story. Cost pass-through from energy, refining margins, freight, chips and tariffs adds ~50-60bp to y/y core this year, but 70-80% of it has likely already passed through if energy follows futures. Wages have not reaccelerated as in 2021-22, and there is no convincing evidence yet of second-round effects. Near term, Iran-related freight costs and thin inventories may reduce holiday discounting and mechanically lift seasonally adjusted goods inflation, reversing in January and February. Core PCE is ~0.36% m/m and ~3.3% y/y. The forecast moves to 25bp hikes in December and January with March risk, and 50bp if Williams and Jefferson reinforce Waller. The key point is that fed funds at 3.75-4.0% sits ~100bp below PIMCO's Taylor-rule rate versus ~800bp in early 2022. The Fed is closing a small gap to stop financial conditions easing, not chasing runaway inflation, and falling oil, fading supply shocks and tighter conditions should bring inflation down in 2027.", "url": "https://www.pimco.com/us/en/insights/inflation-is-sticky-but-this-isnt-2022-all-over-again", "images": []}, {"source": "peterson_institute", "name": "Peterson Institute (PIIE)", "title": "The AI Boom's Two Engines (Jason Furman, PIIE, 9 Nov)", "summary": "Furman uses the Fed's FRB/US model to run a counterfactual of the data-centre buildout, one of the largest peacetime investment expansions in US history. On its own it has raised GDP only ~0.3%, because most equipment is imported and imports neither add to GDP nor lower unemployment. The associated equity boom matters more: together they have added ~0.6% to GDP and cut unemployment ~0.3pp, in an economy already at full employment with above-target inflation. That is why the Fed has had to lean against it with higher rates, a headwind for housing. Because the model is roughly s
