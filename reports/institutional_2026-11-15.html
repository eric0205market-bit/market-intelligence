ymmetric, a bust in which AI stock gains vanish would subtract ~0.5pp from growth next year and ~0.25pp the year after, 'nothing resembling a recession'. Furman flags that the model may understate the downside. The piece usefully counters both 'AI is the whole economy' and 'AI bust means recession', and implies equity wealth effects, not capex, are the bigger macro exposure.", "url": "https://www.piie.com/blogs/realtime-economics/2026/ai-booms-two-engines", "images": []}, {"source": "pimco", "name": "PIMCO", "title": "The Credit Market Lens: Where to Seek Diversification From the AI Investment Theme (Lotfi Karoui, 9 Nov)", "summary": "The midterms could slow data-centre construction and near-term AI bond supply, but they change the journey, not the destination, so concentration persists. AI borrowers already account for nearly half of YTD 15y+ non-financial IG issuance. Treasuries have worked as a hedge since end-September, though less so in early November. The obvious credit diversifiers, IG financials and HY energy, look tight. PIMCO's preferred alternatives: agency MBS, which has handled higher rates and volatility better than in 2023 as REITs buy dips and which offers carry over IG without corporate risk; AAA non-QM RMBS, where spreads widened on extension risk rather than credit risk and new deals are being restructured to speed senior paydowns; and EM debt for a different mix of risks and an opportunity set beyond the index.", "url": "https://www.pimco.com/us/en/insights/the-credit-market-lens-where-to-seek-diversification-from-the-ai-investment-theme", "images": []}, {"source": "amundi", "name": "Amundi", "title": "Global Investment Views – November 2026: Shifts to Quality and Scarcity (Monica Defend et al.)", "summary": "Amundi's monthly CIO framework. A supply-driven world rewards scarce assets: commodities, rare earths, AI infrastructure, defence, aerospace and energy in equities, and low-debt sovereigns in bonds. Five risk lenses. (1) A second-round energy shock: effective oil supply is ~80% of pre-war, with prices elevated to year-end and easing in H1 2027, tighter gas, and second-round effects via wages and services as the risk. (2) Higher for longer: Fed and ECB hikes in December and possibly early 2027, with the long end pressured by deficits and competition for capital. (3) Euro-area fiscal credibility, with the Stability and Growth Pact under its toughest test as sovereign spreads widen. (4) AI dispersion: weak IPOs, project delays and rising AI-linked CDS. (5) EM fragmentation between commodity exporters and importers, watching Brazil and Indonesia. Positioning is mildly risk-on and diversified: neutral US duration (intermediates), positive EZ (peripherals, steepener) and UK duration, constructive EM debt, tactical BRL upgrade, gold, defensives plus quality cyclicals.", "url": "https://research-center.amundi.com/article/global-investment-views-november-2026", "images": []}, {"source": "standard_chartered", "name": "Standard Chartered", "title": "Weekly Market View: Tactical Plays Within a Diversified Allocation (Standard Chartered Wealth, 13 Nov)", "summary": "A clear record of a house trading the rout. It cut semis ~5 weeks ago as breadth narrowed, cut equities from OW to core two weeks ago, then re-risked tactically into diversified US IT when the VIX topped 25. Inside IT it is rotating from semis, hit by data-centre pace worries and Nvidia, toward software and hardware with strong cash flows, which make up 60%+ of the sector. Semis earnings are forecast +65% in 2027, so the pullback improves risk-reward. It is OW US financials on a strong economy and high rates, constructive on US healthcare (~23% 2027 EPS), and likes Switzerland (41% healthcare) and India (the 'anti-AI trade', ~15% EPS growth, light foreign positioning). A quant study of all 24 post-2009 S&P one-day falls of 4% or more found 70% positive 1-month, 100% positive 3-month (+0.5% to +38%) and 96% positive 6-month returns, with weak outcomes clustered in macro-stress periods. On macro, 165k payrolls and hot CPI cement a December hike and possibly Q1, so it locks in TIPS gains at +4.4% because inflation is near a peak.", "url": "https://www.sc.com/sg/market-outlook/weekly-market-view-13-11-2026/?mvog=1", "images": []}, {"source": "wood_mackenzie", "name": "Wood Mackenzie", "title": "What the US Midterm Elections Mean for Energy (Ed Crooks, Wood Mackenzie, 9 Nov)", "summary": "Despite the 'extinction-level' rhetoric, federal energy policy changes little. Trump has the veto, and Democrats lack two-thirds majorities and won't risk raising fuel prices given affordability politics. The action is elsewhere. BAAJA permitting reform, a bipartisan compromise backed by Trump, faces a vote this week, and some Democrats want to wait for a better deal. Ratepayer legislation (the Ratepayer Protection Act passed the House, and the GRID Savings Act would mandate a national rule) would make data centres pay grid costs. Most important are state and local fights: 40 of 41 data-centre ballot measures in 13 states backed restrictions. Texas Governor-elect Hinojosa wants to extend Abbott's approval pause, though projects under construction continue. Wood Mackenzie's Moderated Demand scenario still has strong data-centre load growth, just slower. Immigration reform could ease skills shortages for energy projects.", "url": "https://www.woodmac.com/blogs/energy-pulse/what-the-us-midterm-elections-mean-for-energy/", "images": []}, {"source": "boe", "name": "Bank of England", "title": "Searching for Signposts (Alan Taylor, BoE MPC, 2026 Dow Lecture)", "summary": "The intellectual case for the BoE's dovish wing. Taylor separates direct, indirect and second-round effects of the energy shock. He judges that household and firm expectations may now react more to inflation shocks than before 2022, but warns against reading every rise as a wage-price spiral. His Taylor-rule estimate falls from 4.2% in 4Q25 to 3.5% by 2Q27, unlike peers'. Bank Rate and the OIS curve sit substantially above his nominal R* of 2.75-3%, and beyond two years market rates are more restrictive than at the August 2023 cycle peak when CPI was 6.8%. His conclusion is that the stance is already more than sufficient. With Brent having ranged ~$70-110 since March, the shock is hard to size. Read it against Mann and Pill to understand the committee split ahead of the 17 December decision.", "url": "https://www.bankofengland.co.uk/speech/2026/september/searching-for-signposts-speech-by-alan-taylor", "images": []}, {"source": "galaxy_digital", "name": "Galaxy Digital", "title": "Democrats' Sweeping Victory Alters Landscape for Crypto, AI (Alex Thorn, Galaxy, 6 Nov)", "summary": "The most detailed seat-by-seat read of the midterms for crypto and AI. Democrats gained 7 Senate seats (the biggest presidential-party Senate loss since 2014) and ~35-41 House seats, possibly a 260-seat majority, the largest since 1991-93, plus five governorships and 21 trifectas. Industry-backed candidates lost 9 of 12 competitive races, including the ~$64m crypto PAC effort against Sherrod Brown. Warren is likely to chair Senate Banking and Waters House Financial Services, with oversight chairs promising subpoenas for Big Tech and AI CEOs and scrutiny of Trump-family crypto ventures such as World Liberty Financial. In Texas, Democrats swept statewide offices and Hinojosa beat Abbott 53-46, putting data-centre policy at the centre. Market tape: BTC rallied above $80k on the result, then fell to ~$75.9k with tech on 5 November. The open question is whether Democrats prioritize investigations or governing ahead of 2028.", "url": "https://www.galaxy.com/insights/research/democratic-midterm-wins-crypto-ai-policy", "images": []}], "D_charts": [{"source": "goldman_sachs", "name": "Goldman Sachs", "chart": "Goldman's 2027 forecast panels: real GDP growth by economy versus consensus, the energy price path, the GS forecast table, and developed-market policy-rate paths showing December/March Fed hikes then 2027-28 cuts.", "url": "https://www.goldmansachs.com/insights/articles/the-global-economy-is-forecast-to-grow-2-point-8-percent-in-2027-as-oil-prices-decline", "images": ["https://www.goldmansachs.com/images/insights/articles/the-global-economy-is-forecast-to-grow-2-point-8-percent-in-2027-as-oil-prices-decline/real-gdp-growth-forecasts.png", "https://www.goldmansachs.com/images/insights/articles/the-global-economy-is-forecast-to-grow-2-point-8-percent-in-2027-as-oil-prices-decline/energy-prices-are-set.png", "https://www.goldmansachs.com/images/insights/articles/the-global-economy-is-forecast-to-grow-2-point-8-percent-in-2027-as-oil-prices-decline/gs-research-forecasts.png", "https://www.goldmansachs.com/images/insights/articles/the-global-economy-is-forecast-to-grow-2-point-8-percent-in-2027-as-oil-prices-decline/policy-rates-in-developed-markets.png"]}, {"source": "pimco", "name": "PIMCO", "chart": "AI-related issuers are nearly half of 15y+ non-financial IG supply (Fig. 1). Also shown: the Treasury hedge's recent pattern, agency MBS carry over IG, and AAA non-QM spread widening on extension risk.", "url": "https://www.pimco.com/us/en/insights/the-credit-market-lens-where-to-seek-diversification-from-the-ai-investment-theme", "images": ["https://www.pimco.com/us/en/-/media/global-assets/insights/economic-and-market-commentary/the-credit-market-lens/11/the-credit-market-lens-where-to-seek-diversification-from-the-ai-investment-theme/figure-1_2026-11-08t18_37_38.webp?rev=adf7fd248028499faabb7b28f3925aa8&la=en-US&h=720&w=1280&hash=CC5C19BE412AC532438AB8E1CE1169E6", "https://www.pimco.com/us/en/-/media/global-assets/insights/economic-and-market-commentary/the-credit-market-lens/11/the-credit-market-lens-where-to-seek-diversification-from-the-ai-investment-theme/figure-2_2026-11-08t18_37_38.webp?rev=fbb70e8c16b84a48a5fc495d3b275c0b&la=en-US&h=720&w=1280&hash=537F470A9A773C1C0CD2966A593AD2B7", "https://www.pimco.com/us/en/-/media // ---------- helpers ----------
const CAT_VARS = {
  rates: 'var(--cat-rates)',
  growth: 'var(--cat-growth)',
  fx: 'var(--cat-fx)',
  equities: 'var(--cat-equities)',
  credit: 'var(--cat-credit)',
  crypto: 'var(--cat-crypto)',
  energy: 'var(--cat-energy)',
  commodities: 'var(--cat-commodities)',
  geopolitics: 'var(--cat-geopolitics)',
  ai_tech: 'var(--cat-ai_tech)',
  em: 'var(--cat-em)',
};
function catColor(cat) {
  if (!cat) return 'var(--cat-default)';
  return CAT_VARS[String(cat).toLowerCase()] || 'var(--cat-default)';
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }
function renderBold(text) {
  return escapeHtml(text).replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
}
function pill(cat) {
  if (!cat) return '';
  return `<span class="pill" style="background:${catColor(cat)}">${escapeHtml(cat)}</span>`;
}
function pills(cats) {
  if (!cats) return '';
  if (Array.isArray(cats)) return cats.map(pill).join(' ');
  return pill(cats);
}
function externalLink(url, label) {
  if (!url) return '';
  return `<a class="item-link" href="${escapeAttr(url)}" target="_blank" rel="noopener">${label || 'link →'}</a>`;
}
function nameLink(url, name) {
  if (!name) return '';
  if (!url) return `<span class="item-source">${escapeHtml(name)}</span>`;
  return `<a class="item-source" href="${escapeAttr(url)}" target="_blank" rel="noopener">${escapeHtml(name)}</a>`;
}

// ---------- rendering ----------
function renderThumbs(images) {
  if (!images || !images.length) return '';
  return `<div class="thumbs">` + images.map(u =>
    `<img src="${escapeAttr(u)}" class="thumb" loading="lazy" alt="" onclick="openLightbox('${escapeAttr(u)}')">`
  ).join('') + `</div>`;
}

function renderThemeItem(it) {
  return `
    <div class="theme-item">
      <div class="item-head">
        ${nameLink(it.url, it.name || it.source)}
        ${externalLink(it.url)}
      </div>
      <div class="item-text">${renderBold(it.thesis || '')}</div>
      ${renderThumbs(it.images)}
    </div>`;
}

function renderTheme(theme) {
  const items = (theme.items || []).map(renderThemeItem).join('');
  return `
    <div class="theme">
      <div class="theme-head">
        ${pills(theme.category)}
        <div class="theme-title">${escapeHtml(theme.theme || '')}</div>
      </div>
      <div class="theme-stance">
        ${theme.consensus ? `<div class="theme-line consensus"><span class="lbl">Consensus</span>${renderBold(theme.consensus)}</div>` : ''}
        ${theme.divergence ? `<div class="theme-line divergence"><span class="lbl">Divergence</span>${renderBold(theme.divergence)}</div>` : ''}
      </div>
      ${items ? `<div class="theme-items">${items}</div>` : ''}
    </div>`;
}

function renderCall(it) {
  return `
    <div class="item-card">
      <div class="item-head">
        ${pills(it.category)}
        ${nameLink(it.url, it.name || it.source)}
        ${externalLink(it.url)}
      </div>
      <div class="item-text">${renderBold(it.call || '')}</div>
      ${renderThumbs(it.images)}
    </div>`;
}

function renderDeepRead(it) {
  return `
    <div class="item-card">
      <div class="item-head">
        ${nameLink(it.url, it.name || it.source)}
        ${externalLink(it.url, 'read →')}
      </div>
      ${it.title ? `<div class="item-title">${escapeHtml(it.title)}</div>` : ''}
      <div class="item-text">${renderBold(it.summary || '')}</div>
      ${renderThumbs(it.images)}
    </div>`;
}

function renderChart(it) {
  return `
    <div class="item-card">
      <div class="item-head">
        ${nameLink(it.url, it.name || it.source)}
        ${externalLink(it.url)}
      </div>
      <div class="item-text">${renderBold(it.chart || '')}</div>
      ${renderThumbs(it.images)}
    </div>`;
}

function renderHouseView(hv) {
  const name = hv.name || hv.source || '';
  const nameHtml = hv.url
    ? `<a class="hv-name" href="${escapeAttr(hv.url)}" target="_blank" rel="noopener">${escapeHtml(name)}</a>`
    : `<span class="hv-name">${escapeHtml(name)}</span>`;
  return `
    <div class="hv-row">
      ${nameHtml}
      <span class="hv-stance">${renderBold(hv.stance || '')}</span>
    </div>`;
}

function renderSection(letter, name, items, render, extraClass) {
  if (!items || !items.length) return '';
  const body = items.map(render).join('');
  const cls = 'section' + (extraClass ? (' ' + extraClass) : '');
  return `
    <div class="${cls}">
      <div class="section-head" onclick="toggleSection(this)">
        <span class="section-letter">${letter}</span>
        <span class="section-name">${escapeHtml(name)}</span>
        <span class="section-count">${items.length}</span>
        <span class="section-arrow">▸</span>
      </div>
      <div class="section-body">${body}</div>
    </div>`;
}

function renderSummary(text) {
  if (!text) return '';
  const paragraphs = String(text).split(/\n\n+/).filter(Boolean)
    .map(p => `<p>${renderBold(p)}</p>`).join('');
  return `<div class="summary">${paragraphs}</div>`;
}

function renderTopStats(d) {
  const parts = [];
  const p = d.period || {};
  const is = d.input_stats || {};
  const cv = d.coverage || {};
  if (p.from && p.to)
    parts.push(`period <strong>${escapeHtml(p.from)} → ${escapeHtml(p.to)}</strong>`);
  else if (p.lookback_days != null)
    parts.push(`lookback <strong>${p.lookback_days}d</strong>`);
  if (is.total_articles != null) parts.push(`articles <strong>${is.total_articles}</strong>`);
  if (is.sources_present != null) parts.push(`sources <strong>${is.sources_present}</strong>`);
  if (is.after_filter != null) parts.push(`after filter <strong>${is.after_filter}</strong>`);
  if (cv.coverage_pct != null) {
    const pct = (cv.coverage_pct <= 1 ? cv.coverage_pct * 100 : cv.coverage_pct);
    parts.push(`coverage <strong>${pct.toFixed(0)}%</strong>`);
  } else if (cv.sources_covered != null && cv.sources_total != null) {
    parts.push(`coverage <strong>${cv.sources_covered}/${cv.sources_total}</strong>`);
  }
  return parts.join(' | ');
}

function reportDate(d) {
  if (d.period && d.period.to) return d.period.to;
  if (d.collected_at) return String(d.collected_at).slice(0, 10);
  return '';
}

// ---------- interactions ----------
function toggleSection(headEl) { headEl.parentElement.classList.toggle('open'); }
function openLightbox(src) {
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-img').src = '';
}
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && document.getElementById('lightbox').classList.contains('open')) {
    closeLightbox();
  }
});

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = reportDate(d);
  document.getElementById('stats-top').innerHTML = renderTopStats(d);
  const s = d.sections || {};
  const out = [
    renderSummary(d.summary),
    renderSection('A.', 'Debates — Consensus vs Divergence', s.A_debates,    renderTheme),
    renderSection('B.', 'Key Calls & Positioning',           s.B_calls,      renderCall),
    renderSection('C.', 'Notable Deep Reads',                s.C_deep_reads, renderDeepRead,
                  'section-deepreads'),
    renderSection('D.', 'Charts & Data',                     s.D_charts,     renderChart),
    renderSection('E.', 'House Views',                       s.house_views,  renderHouseView),
  ].join('');
  const app = document.getElementById('app');
  app.innerHTML = out || '<div class="empty">No report data.</div>';

  // Auto-open Summary's section view: first two sections open by default.
  document.querySelectorAll('.section').forEach((sec, i) => {
    if (i < 2) sec.classList.add('open');
  });
}

renderReport(REPORT_DATA);
</script>
</body>
</html>
