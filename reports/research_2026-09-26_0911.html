const META = {
  "date": "2026-09-26",
  "time": "09:11 CEST",
  "windowStart": "2026-09-26 03:11 CEST",
  "windowEnd": "2026-09-26 09:11 CEST",
  "emailsInWindow": 6,
  "emailsRead": 6,
  "itemsExtracted": 18,
  "includedSources": [
    { "name": "Exponential View", "count": 2 },
    { "name": "The Dark Side of the Boom", "count": 8 },
    { "name": "Michael Parekh", "count": 5 },
    { "name": "Kurt Altrichter (Ivory Hill)", "count": 3 }
  ],
  "skippedSources": []
};

const CAT_COLORS = {
  macro: "#e24b4a", credit: "#378add", positioning: "#ef9f27", ai: "#1d9e75", crypto: "#7f77dd",
  geopolitics: "#d85a30", energy: "#f97316", tech: "#06b6d4", gold: "#d4a017", culture: "#ec4899",
  labor: "#8b5cf6", regulation: "#64748b", science: "#14b8a6", venture: "#84cc16"
};
const CAT_LABELS = {
  macro: "macro", credit: "credit", positioning: "positioning", ai: "AI/infra", crypto: "crypto",
  geopolitics: "geopolitics", energy: "energy", tech: "tech", gold: "gold", culture: "culture",
  labor: "labor", regulation: "regulation", science: "science", venture: "venture"
};
const URG_LABELS = { act: "🔴 Act Now", deep: "🔵 Deep", watch: "🟡 Watch" };
const URG_EMOJI = { act: "🔴", deep: "🔵", watch: "🟡" };

let activeCat = "all";
let activeUrg = "all";
let activeSrc = null;

function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}

function toggleCard(id){
  var el = document.getElementById('card-' + id);
  el.classList.toggle('open');
}

function setCat(c){
  activeCat = c;
  activeSrc = null;
  render();
}
function setUrg(u){
  activeUrg = u;
  activeSrc = null;
  render();
}
function filterBySrc(name){
  activeSrc = name;
  render();
  setTimeout(function(){
    ITEMS.forEach(function(item){
      if (item.source.indexOf(name) !== -1) {
        var el = document.getElementById('card-' + item.id);
        if (el) el.classList.add('open');
      }
    });
  }, 0);
}

function renderFilters(){
  var catCounts = {};
  var urgCounts = {};
  ITEMS.forEach(function(i){
    catCounts[i.cat] = (catCounts[i.cat]||0)+1;
    urgCounts[i.urgency] = (urgCounts[i.urgency]||0)+1;
  });

  var catHtml = '<div class="pill' + (activeCat==='all'?' active':'') + '" style="' + (activeCat==='all'?'background:#333;':'') + '" onclick="setCat(\'all\')">All <span class="cnt">' + ITEMS.length + '</span></div>';
  Object.keys(catCounts).forEach(function(c){
    var color = CAT_COLORS[c] || '#666';
    var isActive = activeCat === c;
    catHtml += '<div class="pill' + (isActive?' active':'') + '" style="' + (isActive ? ('background:'+color+';border-color:'+color+';') : ('color:'+color+';border-color:'+color+';')) + '" onclick="setCat(\'' + c + '\')">' + esc(CAT_LABELS[c]||c) + ' <span class="cnt">' + catCounts[c] + '</span></div>';
  });
  document.getElementById('catFilters').innerHTML = catHtml;

  var urgOrder = ['act','deep','watch'];
  var urgHtml = '<div class="pill' + (activeUrg==='all'?' active':'') + '" style="' + (activeUrg==='all'?'background:#333;':'') + '" onclick="setUrg(\'all\')">All <span class="cnt">' + ITEMS.length + '</span></div>';
  urgOrder.forEach(function(u){
    if (!urgCounts[u]) return;
    var isActive = activeUrg === u;
    urgHtml += '<div class="pill' + (isActive?' active':'') + '" style="' + (isActive ? 'background:#333;' : '') + '" onclick="setUrg(\'' + u + '\')">' + URG_LABELS[u] + ' <span class="cnt">' + urgCounts[u] + '</span></div>';
  });
  document.getElementById('urgFilters').innerHTML = urgHtml;
}

function renderCards(){
  var list = ITEMS.filter(function(i){
    if (activeCat !== 'all' && i.cat !== activeCat) return false;
    if (activeUrg !== 'all' && i.urgency !== activeUrg) return false;
    if (activeSrc && i.source.indexOf(activeSrc) === -1) return false;
    return true;
  });

  var html = '';
  list.forEach(function(item){
    var color = CAT_COLORS[item.cat] || '#666';
    var chartIcon = item.charts.hot ? '🔥' : (item.charts.count > 0 ? '📊' : '');
    html += '<div class="card" id="card-' + item.id + '">';
    html += '<div class="card-header" onclick="toggleCard(' + item.id + ')">';
    html += '<span class="idx">' + String(item.id).padStart(2,'0') + '</span>';
    html += '<span>' + URG_EMOJI[item.urgency] + '</span>';
    html += '<span class="badge" style="background:' + color + '">' + esc(item.source.split(' / ')[0]) + '</span>';
    html += '<span class="tag">' + esc(CAT_LABELS[item.cat]||item.cat) + '</span>';
    if (chartIcon) html += '<span class="chartmark">' + chartIcon + '</span>';
    html += '<span class="title">' + esc(item.title) + '</span>';
    html += '</div>';

    html += '<div class="card-body">';
    html += '<div class="label">The Idea</div><div class="idea">' + esc(item.idea) + '</div>';
    html += '<div class="label">My Angle</div><div class="angle" style="border-left:2px solid ' + color + '; background:' + color + '12;">' + esc(item.angle) + '</div>';
    html += '<div class="tweets">';
    html += '<div class="tweet a"><div class="tlabel">TWEET A</div><p>' + esc(item.tweetA) + '</p><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button></div>';
    html += '<div class="tweet b"><div class="tlabel">TWEET B</div><p>' + esc(item.tweetB) + '</p><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div>';
    html += '</div>';
    html += '<div class="chart-box' + (item.charts.hot?' hot':'') + '">' + (item.charts.count>0 ? ('📊 ' + item.charts.count + ' chart(s) — ') : '') + esc(item.charts.desc) + '</div>';
    html += '<div class="linkrow"><a href="' + item.link + '" target="_blank">↗ Read full article</a></div>';
    html += '</div>';
    html += '</div>';
  });
  document.getElementById('cards').innerHTML = html || '<p style="color:var(--muted)">No items match this filter.</p>';
}

function renderReport(){
  var html = '';
  html += '<h4>Time Window</h4><div>' + META.windowStart + ' → ' + META.windowEnd + '. Emails outside this window were not processed.</div>';
  html += '<h4>Emails</h4><div>' + META.emailsInWindow + ' in window · ' + META.emailsRead + ' read · ' + META.itemsExtracted + ' items extracted</div>';
  html += '<h4>Included Sources</h4>';
  META.includedSources.forEach(function(s){
    html += '<div><span class="srcline" onclick="filterBySrc(\'' + esc(s.name).replace(/'/g,"\\'") + '\')">' + esc(s.name) + '</span> — ' + s.count + ' item(s)</div>';
  });
  html += '<h4>Skipped Sources</h4>';
  if (META.skippedSources.length === 0) {
    html += '<div>None — all 6 emails in the window contained substantive analytical content.</div>';
  }
  META.skippedSources.forEach(function(s){
    html += '<div>' + esc(s.name) + ' — ' + esc(s.reason) + '</div>';
  });
  document.getElementById('reportBody').innerHTML = html;
}

function render(){
  renderFilters();
  renderCards();
}

function init(){
  document.getElementById('metaLine').textContent = META.date + ' · ' + META.time + ' · ' + META.itemsExtracted + ' items from ' + META.emailsRead + ' emails';
  render();
  renderReport();
}
init();
</script>
