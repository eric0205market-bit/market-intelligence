<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root {
  --bg: #faf8f5;
  --surface: #ffffff;
  --border: #e8e4df;
  --border-light: #f0ede4;
  --text: #1a1a1a;
  --text-2: #555;
  --text-3: #8a8a8a;
  --accent: #2563eb;
  --accent-bg: #f0f5ff;
  --accent-2: #1d4ed8;
  --tag-text: #0e7490;
  --tag-bg: #e8f4f8;
  --yellow: #fff5b3;
  --yellow-border: #f0d966;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; line-height: 1.55;
       background: var(--bg); color: var(--text); }
.container { max-width: 960px; margin: 0 auto; padding: 24px 16px 80px; }

/* HEADER */
.header { display: flex; justify-content: space-between; align-items: baseline;
          border-bottom: 2px solid var(--accent); padding-bottom: 12px; margin-bottom: 20px; }
.title { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; color: var(--accent); }
.subtitle { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-3); }

/* FILTER BAR */
.filter-bar { display: none; background: var(--yellow); border: 1px solid var(--yellow-border);
              border-radius: 6px; padding: 8px 12px; margin-bottom: 16px;
              align-items: center; gap: 10px; font-size: 13px; }
.filter-bar.active { display: flex; }
.filter-bar button { font-family: inherit; font-size: 12px; background: transparent;
                     border: 1px solid var(--text); padding: 3px 10px; border-radius: 4px;
                     cursor: pointer; }
.filter-bar button:hover { background: rgba(0,0,0,0.05); }

/* SUMMARY */
.summary { background: var(--surface); border: 1px solid var(--border);
           border-left: 4px solid var(--accent); border-radius: 6px;
           padding: 16px 18px; margin-bottom: 20px; }
.summary p { margin-bottom: 8px; }
.summary p:last-child { margin-bottom: 0; }
.summary strong { font-weight: 600; }

/* SECTIONS (top-level collapsible) */
.section { background: var(--surface); border: 1px solid var(--border);
           border-radius: 6px; margin-bottom: 14px; overflow: hidden; }
.section-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px;
                background: var(--accent-bg); cursor: pointer; user-select: none;
                font-weight: 600; font-size: 13px; color: var(--accent-2); }
.section-head:hover { background: #e1ecff; }
.section-letter { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
                  min-width: 18px; }
.section-name { flex: 1; }
.section-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
                 color: var(--text-3); }
.section-arrow { font-size: 10px; transition: transform .2s; }
.section.open .section-arrow { transform: rotate(90deg); }
.section-body { display: none; padding: 6px 0; }
.section.open .section-body { display: block; }

/* TOPIC (nested collapsible inside Topics section) */
.topic { border-bottom: 1px solid var(--border-light); }
.topic:last-child { border-bottom: none; }
.topic-head { display: flex; align-items: center; gap: 10px; padding: 10px 16px;
              background: var(--accent-bg); cursor: pointer; user-select: none;
              font-size: 13px; font-weight: 600; color: var(--accent-2); }
.topic-head:hover { background: #e1ecff; }
.topic-name { flex: 1; }
.topic-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-3); }
.topic-arrow { font-size: 10px; transition: transform .2s; }
.topic.open .topic-arrow { transform: rotate(90deg); }
.topic-body { display: none; padding: 4px 0 6px; }
.topic.open .topic-body { display: block; }

/* ITEM CARDS */
.item-card { background: var(--surface); border: 1px solid var(--border);
             border-radius: 6px; padding: 12px 14px; margin: 10px 16px; }
.item-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
             flex-wrap: wrap; }
.item-author { font-weight: 600; color: var(--accent); cursor: pointer; }
.item-author:hover { text-decoration: underline; }
.item-time { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-3); }
.item-link { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--accent); text-decoration: none; }
.item-link:hover { text-decoration: underline; }
.item-text { font-size: 13.5px; line-height: 1.6; color: var(--text);
             white-space: pre-wrap; word-wrap: break-word; }

/* DATA POINT TAGS */
.data-points { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.dp-tag { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
          background: var(--tag-bg); color: var(--tag-text);
          padding: 2px 7px; border-radius: 4px; }

/* CHARTS (large, NOT thumbnails) */
.charts { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.chart { width: 100%; max-width: 420px; height: auto;
         border: 1px solid var(--border); border-radius: 4px; cursor: zoom-in;
         background: #f0ede4; }

/* LIGHTBOX */
.lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85);
            align-items: center; justify-content: center; z-index: 100; cursor: zoom-out; }
.lightbox.open { display: flex; }
.lightbox img { max-width: 92vw; max-height: 92vh;
                box-shadow: 0 8px 40px rgba(0,0,0,.6); }

/* LINKS */
.link-row { padding: 8px 16px; border-bottom: 1px solid var(--border-light);
            font-size: 13px; display: flex; gap: 12px; align-items: baseline; }
.link-row:last-child { border-bottom: none; }
.link-author { color: var(--text-3); min-width: 110px; cursor: pointer; }
.link-author:hover { color: var(--accent); }
.link-url { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
            color: var(--accent); text-decoration: none; word-break: break-all; flex: 1; }
.link-url:hover { text-decoration: underline; }
.link-desc { color: var(--text-2); font-size: 12px; }

/* AUTHOR FILTER STATES */
.filterable.match { background: var(--yellow); border-color: var(--yellow-border); }
.filterable.dim { opacity: 0.25; }

/* STATS BAR */
.stats { margin-top: 24px; padding: 10px 14px; background: var(--surface);
         border: 1px solid var(--border); border-radius: 6px;
         font-family: 'IBM Plex Mono', monospace; font-size: 11.5px;
         color: var(--text-2); display: flex; gap: 18px; flex-wrap: wrap; }
.stats strong { color: var(--text); font-weight: 600; }

.empty { color: var(--text-3); font-size: 13px; padding: 14px 18px; font-style: italic; }

@media (max-width: 640px) {
  .container { padding: 16px 12px 60px; }
  .item-card { margin: 8px 10px; }
  .link-row { flex-direction: column; gap: 4px; }
  .link-author { min-width: 0; }
  .header { flex-direction: column; align-items: flex-start; gap: 4px; }
  .chart { max-width: 100%; }
}
</style>

<script>
const REPORT_DATA = {"report_type": "TWITTER BANK RESEARCH", "date": "2026-11-15 06:24 UTC", "freshness_gate": "OK    data/twitter/latest/tweets_bank_research.json: collected_at 2026-11-15T06:24:01+00:00 (0.4h old), non-empty | FRESHNESS GATE PASSED.", "collected_at": "2026-11-15T06:24:01Z", "window_days": 4, "input_stats": {"total_tweets": 120, "considered": 120, "kept": 26, "dropped": 94, "deduped": 0}, "summary": "Recurring themes across banks: the Fed hike path after October CPI (BofA adds a third hike Dec/Jan/Mar, matching Deutsche, one more than Goldman; Goldman's Brooks argues against 50bp; Apollo sees more hikes than priced), October core PCE tracking near +0.3% after PPI (Goldman +0.30%, BofA +0.29%) and commodity passthrough to core inflation, 2027 equity outlooks (Goldman 16% SPX return, earnings growth slowing as AI capex peaks, global valuation reset), and positioning/flows (Hartnett record inflows, Goldman Info Tech net selling, JPM retail ETF buying, Nomura down-day vol).\n\nCounts: Goldman 20, BofA 5, JPM 2, Yardeni 2, Apollo/Slok 1, Deutsche 1, Nomura 1 — 26 unique items across 7 banks.", "by_bank_counts": {"Goldman": 20, "BofA": 5, "JPM": 2, "Yardeni": 2, "Apollo/Slok": 1, "Deutsche": 1, "Nomura": 1}, "banks": [{"bank": "Goldman", "theme": "2027 equity outlook (16% SPX, earnings growth halving, AI capex fade), valuation reset & value/growth, core PCE tracking +0.30% and commodity passthrough, Fed hike path, Info Tech net selling, call skew, oil & Asia tech exports", "items": [{"author": "MikeZaccardi", "text": "GS: Value has sharply outperformed Growth across all regions\n\nBut.. value is no longer as cheap, while Growth is no longer as expensive https://t.co/6ZXiru53VN", "tweet_url": "https://x.com/MikeZaccardi/status/2121626963546611744", "images": ["https://pbs.twimg.com/media/HXGIewzXEAAV3Ml.png"], "created_at": "2026-11-14T15:31:00.000Z", "relayers": []}, {"author": "neilsethinew", "text": "Goldman: Although core inflation forecasts (including our own) should already incorporate the delayed passthrough of upstream price changes, consensus forecasts have historically been somewhat conservative in incorporating these shocks. \n\n...Applying the historical response of monthly inflation surprises to realized price increases since the start of the Iran War implies that inflation could surprise consensus expectations to the upside by a cumulative 0.1-0.2pp over the next 9 months (right chart, Exhibit 6), some of which may be realized via an upward surprise from a “January effect” at the start of the year.\n\n...If realized, such surprises could prompt modest further tightening from major central banks in early 2027.", "tweet_url": "https://x.com/neilsethinew/status/2121626712391749911", "images": ["https://pbs.twimg.com/media/HXFwWHuXEAAShwn.png"], "created_at": "2026-11-14T15:30:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "GS: As hyperscaler capex growth slows into 2027, the AI \"picks & shovels\" trade faces a reality check 📉\n\n• IT earnings growth: ~90% (2026) → 45% (2027)\n• Comm Services: 34% → -5%\n• Rising depreciation & interest costs\n\nFading earnings boost from AI capex https://t.co/aRvhQJBTgW", "tweet_url": "https://x.com/MikeZaccardi/status/2121623188001952149", "images": ["https://pbs.twimg.com/media/HXGFDBDWAAAVNvM.png"], "created_at": "2026-11-14T15:16:00.000Z", "relayers": []}, {"author": "neilsethinew", "text": "Goldman: We estimate that higher commodity prices are currently boosting year-over-year core PCE inflation by about 0.5pp, with 90% of the effect driven by higher crude prices and wider refined product spreads (Exhibit 2). \n\nIn our framework, commodity price increases typically complete their passthrough to consumer prices over 6-12 months, which implies that past commodity price increases will continue to boost core inflation by 3bp per month through 2027Q1 and 1-2bp per month in 2027Q2-Q3. \n\nTaken together, we estimate that roughly two-thirds of the cumulative passthrough to core PCE prices is now behind us and that the impact on year-over-year core PCE inflation should peak at 0.6pp in early 2027 before the initial oil price spike drops out of the year-over-year calculation.", "tweet_url": "https://x.com/neilsethinew/status/2121619172635693088", "images": ["https://pbs.twimg.com/media/HXDX4AYWgAAIzsA.png"], "created_at": "2026-11-14T15:00:03.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "GS: Earnings growth poised to more than halve across major markets in 2027... SPX from 36% to 11%\n\n'We expect a slowing in nominal GDP growth rates in 2027 as the AI investment boom peaks' https://t.co/7IGhpaRIq0", "tweet_url": "https://x.com/MikeZaccardi/status/2121615638787444914", "images": ["https://pbs.twimg.com/media/HXF-LlCWMAAqts1.png"], "created_at": "2026-11-14T14:46:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "GS 2027 Equity Outlook 📈 ... 16% SPX return in 27\n\n• Recent AI-driven selloffs have already priced in slower growth\n• Rotations pushed up Defensive & Value valuations\n• Positive equity returns ahead, but with higher volatility\n• Scarcity will put a premium on durable growth https://t.co/KidpZmZXnS", "tweet_url": "https://x.com/MikeZaccardi/status/2121611863850995787", "images": ["https://pbs.twimg.com/media/HXF6v2fXMAAu4jS.jpg"], "created_at": "2026-11-14T14:31:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "Global equity valuations have reset across the board, driven largely by a tech de-rating in the US and North Asia. 📉\n\n• US P/E moderated from ~100th percentile to 18.5x\n• Asia & EM trade well below historical averages\n• Overall P/E & PEG ratios sit near 35-year norms (GS) https://t.co/frqRqFSeUU", "tweet_url": "https://x.com/MikeZaccardi/status/2121608088868274571", "images": ["https://pbs.twimg.com/media/HXF3UHUWIAAfNg_.png"], "created_at": "2026-11-14T14:16:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "Epic upward EPS revisions in 2026... but will that continue through next year? GS https://t.co/7vgQM9eMed", "tweet_url": "https://x.com/MikeZaccardi/status/2121601042542461228", "images": ["https://pbs.twimg.com/media/HXFw5-EWIAExbKu.png"], "created_at": "2026-11-14T13:48:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "Strong breadth... GS: Most equity markets have generated similar returns in the past 12 months\n\nThis reverses the trend that had dominated post financial crisis through to 2025, when the US consistently outperformed other regions https://t.co/0rWd3zrNVm", "tweet_url": "https://x.com/MikeZaccardi/status/2121598438735307120", "images": ["https://pbs.twimg.com/media/HXFuiZDW0AEWh9u.png"], "created_at": "2026-11-14T13:37:39.000Z", "relayers": []}, {"author": "neilsethinew", "text": "Goldman: Info Tech was by far the most $ net sold global (and US) sector again this week – US Info Tech long/short ratio now stands at 1.5 (vs. YTD peak of 2.14 seen in early June), the lowest level on our record (since 2016). https://t.co/8dQcIZ3pOG", "tweet_url": "https://x.com/neilsethinew/status/2121596512484679803", "images": ["https://pbs.twimg.com/media/HXDevypWIAAvmxZ.png"], "created_at": "2026-11-14T13:30:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "No standout DJIA stock YTD.. \n$CVX +44%\n$AMGN +42%\n$KO +42%\n$MRK +40%\n$TRV +39%\n$JNJ +38%\n\n$NVDA 6th worst at -13%\n$GS $CAT up less than 5% @barchart https://t.co/35YLglOFu8", "tweet_url": "https://x.com/MikeZaccardi/status/2121592989805896013", "images": ["https://pbs.twimg.com/media/HXFplNwWoAAeqls.jpg"], "created_at": "2026-11-14T13:16:00.000Z", "relayers": []}, {"author": "dailychartbook", "text": "\"The valuation premium of the largest US companies has narrowed.. tightest in almost 10 years\"\n\nGoldman Sachs via @MikeZaccardi https://t.co/ufOH4Vmopt", "tweet_url": "https://x.com/dailychartbook/status/2121589031993495761", "images": ["https://pbs.twimg.com/media/HXFl-2TXMAEw3d8.jpg"], "created_at": "2026-11-14T13:00:17.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "GS Robin Brooks: The Fed should not hike 50bps on Dec 9th @seekingalpha https://t.co/EcclRtlc1i", "tweet_url": "https://x.com/MikeZaccardi/status/2121583551967625529", "images": ["https://pbs.twimg.com/media/HXFg_5UXgAAZVOd.png"], "created_at": "2026-11-14T12:38:30.000Z", "relayers": []}, {"author": "neilsethinew", "text": "Consistent with JPM's findings on retail not looking to grab upside with options, Goldman says the has been a \"breakdown between SPX call skew (25dc/ATM) vs SPX spot (through Thursday night).\" https://t.co/wsfdd3mU2R", "tweet_url": "https://x.com/neilsethinew/status/2121581414369919006", "images": ["https://pbs.twimg.com/media/HXDdZ9ZWAAAdrKy.jpg"], "created_at": "2026-11-14T12:30:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "GS: DAX and FTSE 100 have delivered similar total returns to the S&P 500 since 2022 https://t.co/7J62oHn7f3", "tweet_url": "https://x.com/MikeZaccardi/status/2121400667969405097", "images": ["https://pbs.twimg.com/media/HXC6qpMXIAELOVE.png"], "created_at": "2026-11-14T00:31:47.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "GS: Our Commodity Strategists Expect Oil Prices to Remain Elevated in the Coming Months Before Moderating Gradually Over the Next Year https://t.co/OrCcpmJ0yV", "tweet_url": "https://x.com/MikeZaccardi/status/2121375235756666998", "images": ["https://pbs.twimg.com/media/HXCjiSgWQAAPXY0.png"], "created_at": "2026-11-13T22:50:44.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "GS: AI Boom.. Tech exports from Asia have surged https://t.co/OpAelAOMRC", "tweet_url": "https://x.com/MikeZaccardi/status/2121322586923512017", "images": ["https://pbs.twimg.com/media/HXBzptUWQAAWuJY.jpg"], "created_at": "2026-11-13T19:21:31.000Z", "relayers": []}, {"author": "neilsethinew", "text": "Goldman Sachs and BofA both trimmed their October core PCE estimates after PPI, as the inputs to the Fed’s preferred inflation gauge were softer than they expected, but both still track it near +0.3%.\n\n▪️ Goldman: core PCE +0.30% m/m (from +0.35% previously), +3.24% y/y, which would be the highest since November 2023. Headline +0.32% m/m, +3.83% y/y.\n▪️ BofA: core PCE +0.29% m/m (from +0.32%), +3.2% y/y (from +3.3%). Headline +0.30% m/m (from +0.34%), +3.8% y/y (from +3.9%).\n▪️ Why softer: airfares fell after sharp increases in August and September (Goldman has domestic airfares −1.8%, seasonally adjusted), and medical care was mixed but weaker on net. Goldman puts PCE medical care services at +0.14%.\n▪️ For reference, September core PCE was +0.32% m/m and +3.12% y/y.\n▪️ BofA: “inflation remains too high and momentum has picked up in recent months.”", "tweet_url": "https://x.com/neilsethinew/status/2121277927434170505", "images": ["https://pbs.twimg.com/media/HXBK2HyWcAAJ63R.jpg"], "created_at": "2026-11-13T16:24:03.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "GS: Core Producer Prices Increase in Line With Expectations and PCE-Relevant PPI Components Softer; \n\nEstimating 0.30% for October Core PCE, corresponding to a year-over-year rate of +3.24%. https://t.co/BY3gb95ZeE", "tweet_url": "https://x.com/MikeZaccardi/status/2121254540603162648", "images": ["https://pbs.twimg.com/media/HXA1w6KWYAAiN7H.png"], "created_at": "2026-11-13T14:51:08.000Z", "relayers": []}, {"author": "neilsethinew", "text": "BofA adds a third hike to its Fed call, now calling for hikes at each of the next three meetings (December, January and March). That’s one more than Goldman, which added a March hike two days ago, and the same path as Deutsche Bank. Unlike Goldman, which sees the first cut in December 2027, BofA has no cuts penciled in for 2027 (or 2028 for that matter).\n\nBofA’s Aditya Bhave (US Economic Weekly) says after October CPI the Fed “no longer has the luxury of hiking at a quarterly pace.” Instead of just pulling March forward, BofA added a hike because “the entire distribution of // ---------- helpers ----------
function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }

function renderBold(text) {
  return escapeHtml(text).replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
}

function relativeTime(iso) {
  if (!iso) return '';
  const dt = new Date(iso);
  if (isNaN(dt.getTime())) return '';
  const secs = Math.max(0, (Date.now() - dt.getTime()) / 1000);
  if (secs < 60)   return Math.floor(secs) + 's ago';
  const mins = secs / 60;
  if (mins < 60)   return Math.floor(mins) + 'm ago';
  const hrs  = mins / 60;
  if (hrs < 48)    return Math.floor(hrs) + 'h ago';
  return Math.floor(hrs / 24) + 'd ago';
}

function authorTag(name, cls = 'item-author') {
  if (!name) return '';
  return `<span class="${cls}" onclick="filterAuthor('${escapeAttr(name)}')">@${escapeHtml(name)}</span>`;
}

// ---------- rendering ----------
function renderCharts(images) {
  if (!images || !images.length) return '';
  return `<div class="charts">` + images.map(u =>
    `<img src="${escapeAttr(u)}" class="chart" loading="lazy" alt="" onclick="openLightbox('${escapeAttr(u)}')">`
  ).join('') + `</div>`;
}

function renderDataPoints(points) {
  if (!points || !points.length) return '';
  return `<div class="data-points">` + points.map(p =>
    `<span class="dp-tag">${escapeHtml(p)}</span>`
  ).join('') + `</div>`;
}

function renderRelayers(item) {
  const r = item.relayers || [];
  if (!r.length) return '';
  // gen_bank_research_report.py already puts this line into data_points.
  if ((item.data_points || []).some(p => String(p).startsWith('also carried by'))) return '';
  return `<div class="data-points"><span class="dp-tag">also carried by: ${
    r.map(a => '@' + escapeHtml(a)).join(', ')}</span></div>`;
}

function renderItem(item, preferText) {
  const author = item.author || item.author_username || '';
  const time = relativeTime(item.created_at);
  const link = item.tweet_url
    ? `<a class="item-link" href="${escapeAttr(item.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  const body = preferText ? (item.text || item.description || '')
                          : (item.description || item.text || '');
  return `
    <div class="item-card filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${authorTag(author)}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      ${body ? `<div class="item-text">${escapeHtml(body)}</div>` : ''}
      ${renderDataPoints(item.data_points)}
      ${renderRelayers(item)}
      ${renderCharts(item.images)}
    </div>`;
}

function renderTopic(topic, idx) {
  const items = (topic.items || []).map(it => renderItem(it, topic._fromBanks)).join('');
  const name = topic.topic || topic.name || `Topic ${idx + 1}`;
  return `
    <div class="topic">
      <div class="topic-head" onclick="toggleTopic(this)">
        <span class="topic-name">${escapeHtml(name)}</span>
        <span class="topic-count">${(topic.items || []).length}</span>
        <span class="topic-arrow">▸</span>
      </div>
      <div class="topic-body">${items || '<div class="empty">No items.</div>'}</div>
    </div>`;
}

function renderLink(l) {
  const author = l.author || l.author_username || '';
  const url = l.url || (l.resolved || l.tco) || '';
  return `
    <div class="link-row filterable" data-author="${escapeAttr(author).toLowerCase()}">
      ${author ? authorTag(author, 'link-author') : '<span class="link-author">—</span>'}
      <a class="link-url" href="${escapeAttr(url)}" target="_blank" rel="noopener">${escapeHtml(url)}</a>
      ${l.description ? `<span class="link-desc">${escapeHtml(l.description)}</span>` : ''}
    </div>`;
}

function renderSection(letter, name, body, count) {
  return `
    <div class="section">
      <div class="section-head" onclick="toggleSection(this)">
        <span class="section-letter">${letter}.</span>
        <span class="section-name">${escapeHtml(name)}</span>
        <span class="section-count">${count}</span>
        <span class="section-arrow">▸</span>
      </div>
      <div class="section-body">${body}</div>
    </div>`;
}

function renderSummary(text) {
  if (!text) return '';
  const paragraphs = String(text).split(/\n\n+/).filter(Boolean)
    .map(p => `<p>${renderBold(p)}</p>`).join('');
  return `<div class="summary">${paragraphs}</div>`;
}

// The bank-research routine emits `banks` [{bank, theme, items[{text,...}]}];
// older reports (and the Data template's schema) use `topics`. Render `banks`
// directly when present, else fall back to `topics`.
function reportGroups(d) {
  if (Array.isArray(d.banks) && d.banks.length) {
    return { label: 'Banks', unit: 'banks', groups: d.banks.map(b => ({
      topic: b.theme ? `${b.bank} — ${b.theme}` : (b.bank || ''),
      items: b.items || [],
      _fromBanks: true,
    })) };
  }
  return { label: 'Topics', unit: 'topics', groups: d.topics || [] };
}

function renderStats(d) {
  const parts = [];
  const cov = d.coverage || {};
  if (cov.authors_covered != null && cov.authors_total != null) {
    const pct = cov.authors_total ? (100 * cov.authors_covered / cov.authors_total) : 0;
    parts.push(`coverage <strong>${cov.authors_covered}/${cov.authors_total}</strong> (${pct.toFixed(0)}%)`);
  }
  const g = reportGroups(d);
  const topicCount = g.groups.length;
  const itemCount = g.groups.reduce((n, t) => n + (t.items || []).length, 0);
  parts.push(`${g.unit} <strong>${topicCount}</strong>`);
  parts.push(`items <strong>${itemCount}</strong>`);
  if ((d.links || []).length) parts.push(`links <strong>${d.links.length}</strong>`);
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSection(el) { el.parentElement.classList.toggle('open'); }
function toggleTopic(el)   { el.parentElement.classList.toggle('open'); }

function openLightbox(src) {
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-img').src = '';
}

let activeFilter = null;
function filterAuthor(name) {
  if (!name) return;
  activeFilter = String(name).toLowerCase();
  document.querySelectorAll('.filterable').forEach(el => {
    const a = (el.dataset.author || '').toLowerCase();
    if (a === activeFilter) { el.classList.add('match'); el.classList.remove('dim'); }
    else                    { el.classList.add('dim'); el.classList.remove('match'); }
  });
  document.getElementById('filter-name').textContent = '@' + name;
  document.getElementById('filter-bar').classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function clearFilter() {
  activeFilter = null;
  document.querySelectorAll('.filterable').forEach(el => {
    el.classList.remove('match'); el.classList.remove('dim');
  });
  document.getElementById('filter-bar').classList.remove('active');
}
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (document.getElementById('lightbox').classList.contains('open')) closeLightbox();
    else if (activeFilter) clearFilter();
  }
});

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';

  const g = reportGroups(d);
  const topicsBody = g.groups.map(renderTopic).join('')
                  || `<div class="empty">No ${g.unit}.</div>`;
  const linksBody = (d.links || []).map(renderLink).join('');

  const sections = [
    renderSummary(d.summary),
    renderSection('A', g.label, topicsBody, g.groups.length),
    linksBody ? renderSection('B', 'Link Queue', linksBody, (d.links || []).length) : '',
  ].join('');

  document.getElementById('app').innerHTML = sections || '<div class="empty">No report data.</div>';

  // Auto-open the main section and the first topic.
  document.querySelectorAll('.section').forEach((s, i) => { if (i === 0) s.classList.add('open'); });
  const firstTopic = document.querySelector('.topic');
  if (firstTopic) firstTopic.classList.add('open');

  document.getElementById('stats').innerHTML = renderStats(d);
}

renderReport(REPORT_DATA);
</script>
</body>
</html>
