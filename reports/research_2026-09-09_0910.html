const ITEMS = [
  {"id":1,"cat":"macro","urgency":"deep","source":"Dark Side of the Boom / Goldman Sachs (Mark Wilson, Jan Scheffel, George Cole)","title":"AI capex is now competing with governments for the world's savings","idea":"Goldman's Macro Call frames the multi-decade climb in bond yields as more than an inflation scare: AI infrastructure borrowing is an added, long-dated claim on capital at a time when sovereign issuance is already exceptional. The investment boom is inflationary today while the productivity payoff stays delayed. Unless fixed-income demand expands fast enough, higher real yields and a wider term premium become the market's clearing mechanism.","angle":"Ties directly into hyperscaler financing costs and duration trades — the Fed cutting the front end doesn't fix a term-premium problem being set by AI capex + fiscal supply.","tweetA":"Every AI data center is now a bond issuer's problem. Goldman's rates desk says AI capex has become a structural claimant on the same savings pool sovereigns are draining — not a cyclical blip. That's why duration keeps losing even as the Fed 'eases.'","tweetB":"Everyone's watching the Fed for the rate cut. Goldman's actual message: the Fed is a passenger. Term premium is being set by AI capex + fiscal issuance, and no 25bp move fixes that equation. $TLT bulls are fighting the wrong central bank.","charts":{"count":0,"hot":false,"desc":"No charts embedded in this email; Goldman's underlying Macro Call video likely has exhibits — worth opening."},"link":"https://thedarksideoftheboom.substack.com/p/the-fed-is-a-passenger-as-ai-capex"},
  {"id":2,"cat":"ai","urgency":"deep","source":"Dark Side of the Boom / Citadel Securities (Nohshad Shah)","title":"OpenAI's heaviest users are pulling away from the median 3x faster than in January","idea":"OpenAI's top-decile enterprise customers now generate 8.3x as many output tokens per active user as firms around the median — up from 2.6x in January. Shah frames this as Jevons paradox applied to intelligence: cheaper compute per task doesn't shrink total compute demand, it expands the number of economically viable tasks faster than the cost falls.","angle":"Direct counter-data to the 'AI usage is saturating' bear case — supports continued compute-demand durability for chip/power names ahead of the AI capex debate.","tweetA":"OpenAI's heaviest enterprise users now burn 8.3x the tokens of the median user, up from 2.6x in January. That's not usage maturing — that's usage compounding. The 'AI demand is plateauing' crowd needs to explain that chart.","tweetB":"Jevons paradox, AI edition: cheaper tokens per task should mean less compute demand. Instead heavy users are pulling away from the median 3x faster than 8 months ago. Compute doesn't get cheap fast enough to outrun what gets unlocked by it being cheap.","charts":{"count":0,"hot":false,"desc":"No charts in the email itself — Citadel's underlying note likely has usage-distribution exhibits worth opening."},"link":"https://thedarksideoftheboom.substack.com/p/the-economics-work-but-the-politics"},
  {"id":3,"cat":"labor","urgency":"deep","source":"Dark Side of the Boom / Citadel Securities (Nohshad Shah)","title":"Generative AI touches just 6% of total US work hours","idea":"45% of US workers use generative AI at work, but only 14% use it every working day, and it touches roughly 6% of total work hours — against a global base of almost 900 million knowledge workers and developers. Shah's point: demand diffusion has barely started, not peaked.","angle":"The real counter to 'AI bubble' framing — if daily-use penetration is only 14% and total hours touched is 6%, the TAM argument for continued infra buildout still has runway, which matters for how durable AI capex spending actually is.","tweetA":"45% of US workers have touched generative AI. Only 14% use it every day. It touches 6% of total work hours. If you're pricing AI infra stocks off 'the technology is already everywhere,' you're off by an order of magnitude on actual usage.","tweetB":"6% of work hours. That's the real AI penetration number hiding behind the 45%-have-tried-it headline. Compare that to how bank analysts are modeling 2027 AI capex depreciation schedules — the usage curve and the capex curve aren't remotely in sync yet.","charts":{"count":0,"hot":false,"desc":"No charts in this email; Charts inside the underlying Citadel note — worth opening."},"link":"https://thedarksideoftheboom.substack.com/p/the-economics-work-but-the-politics"},
  {"id":4,"cat":"geopolitics","urgency":"deep","source":"Dark Side of the Boom / Citadel Securities (Nohshad Shah)","title":"China treats AI as industrial mobilization; the US treats it as a permitting problem","idea":"Shah contrasts China's coordinated mobilization of compute, power, capital and industrial policy around AI as an intergenerational industrial race, against the US where AI is a national-security priority but physical infrastructure still has to clear a political system reluctant to permit power, water and grid expansion.","angle":"Political/permitting risk to the US AI buildout timeline is underpriced relative to the capex numbers everyone models — a structural execution-speed gap between the two AI superpowers.","tweetA":"Beijing treats AI as an intergenerational industrial mobilization. Washington treats it as a national security priority that still has to survive local permitting hearings. Same capex ambition, completely different execution risk — and nobody's pricing that gap into $NVDA multiples.","tweetB":"The AI bear case isn't overbuilding. It's underbuilding — because grid interconnects and permitting move on political time, not GPU-cycle time. Citadel's own macro strategist is flagging this as the real 2026-27 constraint, not compute glut.","charts":{"count":0,"hot":false,"desc":"No charts in this email."},"link":"https://thedarksideoftheboom.substack.com/p/the-economics-work-but-the-politics"},
  {"id":5,"cat":"energy","urgency":"watch","source":"Dark Side of the Boom / Citadel Securities (Nohshad Shah, citing Kpler)","title":"Gulf oil exports are already 65% recovered via the shadow fleet","idea":"Kpler estimates non-Iranian Gulf exports have recovered to around 9mb/d, or 65% of pre-war levels, once ship-to-ship transfers and bypass routes ('dark flows') are included — meaning more oil is reaching the market than visible tanker traffic alone would suggest, even as the Strait of Hormuz remains impaired.","angle":"Complicates the bullish oil narrative — supply is adapting faster than headline disruption implies, which matters for how much geopolitical premium is left to unwind in crude.","tweetA":"9mb/d, 65% of pre-war Gulf export levels — already recovered, per Kpler, once you count the dark-fleet transfers everyone pretends not to see. The 'Hormuz closed, oil to $150' trade is running on a supply picture that's already stealing back.","tweetB":"The sanctions-evasion shadow fleet is now load-bearing for the entire 'geopolitical risk premium in oil' thesis. Every mb/d that moves through dark transfers is a mb/d the bulls have to explain away.","charts":{"count":0,"hot":false,"desc":"No charts in this email."},"link":"https://thedarksideoftheboom.substack.com/p/the-economics-work-but-the-politics"},
  {"id":6,"cat":"ai","urgency":"deep","source":"Only McKinsey Perspectives (citing FT survey + McKinsey State of AI 2026)","title":"80% of workers feel more productive with AI; only 37% of companies see it in earnings","idea":"FT survey of 6,000 digital workers: AI saves individuals 11 hours a week, but only 13% see any organizational performance improvement — some of the gap goes to 'botsitting' AI tools or performative work. McKinsey's own global survey finds 80% report personal productivity gains but only 37% report a positive enterprise earnings contribution; of companies that DO see earnings impact, 75% fully redesigned workflows around AI versus just 25% of the rest, who bolted AI onto existing processes.","angle":"This is the org-level evidence for why AI capex ROI is taking longer to show up in earnings than individual productivity claims suggest — directly relevant to every hyperscaler earnings call debating 'where's the AI revenue.'","tweetA":"11 hours saved per worker per week. 13% of companies see any organizational performance gain. The AI ROI story has an individual-to-enterprise conversion problem, and McKinsey's own data says only the 25% of firms that rebuilt workflows around AI — not bolted it on — are seeing it show up.","tweetB":"80% of employees say AI makes them more productive. 37% of companies say it shows up in earnings. That 43-point gap is exactly why every hyperscaler earnings call has an analyst asking 'where's the AI revenue' and getting a capex slide instead.","charts":{"count":0,"hot":false,"desc":"No charts embedded; McKinsey's linked State of AI survey report has extensive exhibits — worth opening."},"link":"https://www.mckinsey.com/capabilities/quantumblack/our-insights/the-state-of-ai"},
  {"id":7,"cat":"energy","urgency":"act","source":"HFIR (What Changed This Week)","title":"Goldman's Brent target is already $4.50 below where Brent trades","idea":"Goldman's own note assumes Gulf output gradually recovers to pre-war levels by 2027H2 as the base case — treating ongoing Strait of Hormuz tanker attacks almost as an afterthought variable — yet it raised its Dec 2026 Brent target by only $5, to $85, even though Brent February contracts already trade at $89.49. HFIR calls out the sequencing error: modeling a production recovery before establishing whether continued disruption is even the right base case.","angle":"Contrarian flag that US sell-side oil research is behind the tape and internally inconsistent — worth watching for forced upward forecast revisions to catch up with spot/forward pricing.","tweetA":"Goldman's Dec-26 Brent target: $85. Where Brent February contracts trade right now: $89.49. Goldman published a forecast that's already $4.50 below the market before the ink dried. Somebody needs a new spreadsheet.","tweetB":"The sell-side sequencing error nobody's calling out: Goldman models 'Gulf production recovers to pre-war levels' as the base case, THEN treats the actual war as a footnote variable. That's backwards. You solve for the war first, then the barrels.","charts":{"count":0,"hot":false,"desc":"Goldman's underlying report has Exhibits 6-8 on Gulf output recovery and pipeline capacity — worth opening."},"link":"https://www.hfir.com/p/wctw-this-cannot-be-that-obvious"},
  {"id":8,"cat":"macro","urgency":"act","source":"Dark Side of the Boom / Goldman Sachs (Jessica Rindels, Ronnie Walker)","title":"Goldman's August CPI call: hot headline, soft core, Friday is now the Fed's real decision","idea":"Goldman expects core CPI +0.23% MoM in August (above 0.2% consensus, annual rate 2.40%), with headline CPI +0.39% driven by a 2.3% jump in energy prices and airfares up 4.0% on higher jet fuel costs — a hotter headline masking a comparatively contained core, right as the market treats the September Fed decision as close to a coin toss.","angle":"Sets up Friday's CPI print as the actual swing factor for the September Fed decision, more than anything the Fed itself signals this week.","tweetA":"Goldman's call: headline CPI hot on energy, core still soft at 0.23%. If that print lands, watch the market read it as 'transitory energy pass-through' and rally — right into a Fed that's one bad core beat away from a coin-flip hike decision.","tweetB":"Airfares +4.0% in one month, entirely a jet-fuel pass-through from the Hormuz premium. That's your reminder the oil shock isn't just an energy-sector story — it's already inside the core-adjacent CPI components the Fed actually watches.","charts":{"count":0,"hot":false,"desc":"No charts in this email."},"link":"https://thedarksideoftheboom.substack.com/p/august-cpi-preview-goldman-sees-a"},
  {"id":9,"cat":"ai","urgency":"deep","source":"Michael Parekh / AI-RTZ #1204","title":"Anthropic's smaller compute book carries the bigger revenue line","idea":"Anthropic has signed $517B in compute deals over 11 months (14.8GW added since October) versus OpenAI's $750B forecast through 2030 (up from $665B). Yet Anthropic's revenue run-rate already exceeds $65B annualized versus OpenAI's $40B+ — meaning the smaller compute spender has the bigger revenue line. Parekh calls this inversion 'the whole story of this race right now,' ahead of both companies' expected mega-IPOs.","angle":"The inversion is the tradeable signal — for anyone underwriting AI-lab equity risk via cloud/Nvidia exposure ahead of dual IPOs, revenue-per-committed-compute-dollar is diverging sharply between the two leaders.","tweetA":"Anthropic: $517B committed, $65B+ run-rate revenue. OpenAI: $750B committed, $40B+ run-rate revenue. Anthropic is generating more revenue per compute dollar committed than OpenAI — and it's the smaller spender. That inversion is the whole IPO story, not the model benchmarks.","tweetB":"OpenAI's inference costs quadrupled in 2025 and gross margin fell to 33% from a 46% target. Anthropic claims cash-flow breakeven two years earlier than OpenAI's 2030. Two pre-IPO prospectuses are about to tell very different stories about the same industry.","charts":{"count":0,"hot":false,"desc":"No charts embedded; the underlying compute-ledger comparison (dollars vs. gigawatts vs. revenue) is table-based — worth opening for the full breakdown."},"link":"https://michaelparekh.substack.com/p/ai-anthropics-517b-vs-openais-750b"},
  {"id":10,"cat":"ai","urgency":"watch","source":"Michael Parekh / AI-RTZ #1204","title":"Nvidia's OpenAI pledge is 10x its Anthropic check — and the softer number","idea":"Nvidia has invested up to $10B in Anthropic (alongside Microsoft's $5B, tied to a real, already-signed $30B Azure compute commitment) versus a pledged-but-not-committed up to $100B in OpenAI, tied to 10GW of Nvidia systems — 10x the size. Jensen Huang himself called the $100B figure 'never a commitment' and said the current round wouldn't approach it.","angle":"Circular/vendor financing exposure is heavily skewed toward OpenAI — matters for gauging how much of Nvidia's reported bookings are cash-backed commitments versus soft pledges ahead of both IPOs.","tweetA":"Nvidia's OpenAI pledge: up to $100B, 'never a commitment' per Jensen Huang himself. Nvidia's actual Anthropic investment: $10B, tied to a real $30B Azure deal already signed. When you're sizing how much of Nvidia's book is real vendor financing vs. press-release financing, start here.","tweetB":"Bookings become buildings become billings — except one lab's Nvidia number is a signed check and the other's is a letter of intent Huang himself walked back. The $100B OpenAI headline is doing 10x the work of the $10B Anthropic one, and it's the softer number.","charts":{"count":0,"hot":false,"desc":"No charts embedded."},"link":"https://michaelparekh.substack.com/p/ai-anthropics-517b-vs-openais-750b"},
  {"id":11,"cat":"macro","urgency":"act","source":"Bloomberg Points of Return (John Authers, citing Gavekal's Anatole Kaletsky)","title":"The yen just rallied through a strong US jobs report — that's the tell","idea":"Gavekal's Anatole Kaletsky calls the yen 'more undervalued than any major currency in modern history,' and notes last week's rally came despite a strong US payroll report that historically would have weakened it. His read: the yen is finally decoupling from interest-rate differentials and starting to trade on relative fundamentals — current account, fiscal policy, inflation — all of which point to a much stronger yen against the dollar, euro, pound and franc.","angle":"A regime-change call on the world's most crowded carry-funding currency — if correct, this threatens to unwind trillions in yen-funded carry trades across every asset class.","tweetA":"The yen rallied THROUGH a strong US jobs report last week — the exact data point that's weakened it on cue for a decade. Gavekal's Kaletsky says that's the tell: the yen is decoupling from rate differentials for the first time this cycle. If that's real, every yen-funded carry trade just lost its anchor.","tweetB":"'More undervalued than any major currency in modern history' — that's not me, that's Gavekal on the yen. The trade isn't 154 vs 160. It's whether three decades of using Japan as the world's free money machine just ended.","charts":{"count":5,"hot":false,"desc":"Article contains a real effective exchange rate (REER) chart, a Japan FX reserves decline chart, BOJ rate-path forecast, inflation breakeven chart, and a wage growth chart — several worth saving individually."},"link":"https://www.bloomberg.com/opinion/newsletters/2026-09-09/rising-yen-finally-gets-some-respect"},
  {"id":12,"cat":"positioning","urgency":"act","source":"Bloomberg Points of Return (John Authers, citing Mizuho's Masayuki Nakajima, Jesper Koll)","title":"Three separate flows are pushing the yen the same direction at once","idea":"Mizuho shows leveraged funds were at a record short yen position at the start of this month, while August's intervention had already left other investors with vulnerable positions — a mechanical squeeze setup. Simultaneously, Norway's Norges Fund proposed trimming Treasury holdings in a shift likely rotating capital toward Japanese bonds, and Japan's pension 'whales' (per Jesper Koll) face their first forced-selling risk since 2011 as rising JGB yields dent domestic bond books even while overseas holdings stay profitable.","angle":"This move looks positioning-driven, not purely fundamental — squeezes plus sovereign reallocation can run further and faster than fundamentals alone would justify, worth watching for follow-through.","tweetA":"Record short yen positioning + Norway's sovereign wealth fund rotating out of Treasuries into JGBs + Japan's pension whales facing their first forced bond-selling since 2011. Three separate flows, all pointing the same direction on the yen, at the same time. Coincidences don't usually stack like that.","tweetB":"Everyone's asking 'why now' on the yen. Nobody's asking 'who's short.' Mizuho's positioning data says leveraged funds walked into this month maximally short. That's not a currency re-rating, that's a squeeze with a fundamental story bolted on after the fact.","charts":{"count":1,"hot":true,"desc":"🔥 Mizuho's leveraged-funds positioning chart (record short yen entering September) — tells the squeeze story alone, tweet-worthy on its own."},"link":"https://www.bloomberg.com/opinion/newsletters/2026-09-09/rising-yen-finally-gets-some-respect"},
  {"id":13,"cat":"macro","urgency":"deep","source":"Bloomberg Points of Return (John Authers, citing Deutsche Bank's Mark Wall)","title":"Deutsche Bank: the AI buildout is lifting Europe's neutral rate too","idea":"Deutsche Bank's Mark Wall argues the market-implied ECB terminal rate (3% by end of next year, per OIS swaps) can be rationalized because the global AI investment boom is raising the neutral rate (r*) — reinforcing the same upward push from Germany's defense and infrastructure spending — while AI data center demand also structurally props up energy prices.","angle":"Connects two threads usually discussed separately: the same 'AI is inflationary via capital competition' thesis Goldman applied to US Treasuries (item 1) is now being applied to European neutral-rate math by a different bank entirely.","tweetA":"Deutsche Bank's rates strategist just used the AI buildout to justify a 3% ECB terminal rate — the same logic Goldman used for US Treasuries. Two different banks, two different central banks, same underlying claim: AI capex is raising the global cost of capital, not just the US cost of capital.","tweetB":"r* isn't a US-only story anymore. If AI capex is genuinely lifting the neutral rate the way Deutsche Bank claims, every DM central bank's 'terminal rate' conversation this cycle is downstream of how many gigawatts get contracted, not how sticky services inflation is.","charts":{"count":1,"hot":false,"desc":"OIS-implied ECB terminal rate curve (Bloomberg World Interest Rate Probabilities) embedded in the article."},"link":"https://www.bloomberg.com/opinion/newsletters/2026-09-09/rising-yen-finally-gets-some-respect"},
  {"id":14,"cat":"geopolitics","urgency":"deep","source":"Dark Side of the Boom / Barclays (Christian Keller)","title":"China's critical-minerals chokehold is processing, not geology","idea":"Barclays' Christian Keller: China's advantage isn't the deposits — lithium sits in Chile, cobalt in DRC, nickel in Indonesia. It's the refining, separation and downstream manufacturing chain, where China's share tops 95% in parts of the heavy rare earth chain. Barclays expects this concentration to persist through 2030 despite Western industrial policy, because diversification runs into geological and engineering timelines, not political ones.","angle":"The 'critical minerals' trade is really a processing-capacity trade, not a mining trade — most generalist framing of onshoring gets this backwards.","tweetA":"China doesn't need to own the lithium mine. It owns the refinery that turns whatever comes out of ANY mine into something usable — above 95% share in parts of heavy rare earths. Every 'critical minerals onshoring' headline that talks about deposits instead of processing capacity is missing the actual chokepoint.","tweetB":"Barclays' base case: critical mineral supply chains stay heavily concentrated through 2030. That's not a forecasting failure, that's physics — you can't permit, finance and build a processing plant faster than geology and engineering allow, no matter how many subsidies get announced this week.","charts":{"count":4,"hot":true,"desc":"🔥 Four embedded Barclays exhibits: Chinese share of global refining/processing by mineral (>95% in heavy rare earths), the mine-to-magnet value chain map, and a 2030 concentration forecast — the refining-share chart alone is a standalone tweet."},"link":"https://thedarksideoftheboom.substack.com/p/china-owns-the-bottleneck-the-critical"},
  {"id":15,"cat":"venture","urgency":"watch","source":"Dark Side of the Boom / Barclays (Christian Keller)","title":"The critical-minerals investing filter is shifting from reserve size to time-to-production","idea":"Barclays argues the investable premium in critical minerals is migrating from 'who owns the biggest deposit' to 'who can deliver commercial tonnes first,' because governments and industrial buyers are increasingly willing to pay for security of supply rather than the cheapest tonne. A junior miner with a 2033 resource is playing a different game than a company that can deliver into an ex-China chain within a few years.","angle":"Reframes how to screen critical-minerals equities — reserve size is becoming a worse proxy for value than permitting/financing/processing readiness.","tweetA":"The critical-minerals stock-picking mistake everyone's still making: ranking companies by deposit size. Barclays says the market is about to start paying for TIME — whoever gets credible tonnes through the door first, not whoever has the biggest number in the resource statement.","tweetB":"'Buying geopolitical insurance' is Barclays' phrase for Western critical-minerals capex, and insurance is never cheap once everyone needs it simultaneously. That's the setup for a 2027-28 scramble that looks a lot like 2021's shipping/chip crunches — paying up for anything that can actually deliver.","charts":{"count":1,"hot":false,"desc":"Barclays exhibit mapping investable names by financing/processing readiness vs. deposit size."},"link":"https://thedarksideoftheboom.substack.com/p/china-owns-the-bottleneck-the-critical"}
];

const META = {
  date: "2026-09-09",
  time: "09:10 CEST",
  windowStart: "2026-09-09 03:08 CEST",
  windowEnd: "2026-09-09 09:08 CEST",
  emailsInWindow: 10,
  emailsRead: 10,
  itemsExtracted: 15,
  includedSources: [
    "Dark Side of the Boom (Goldman: Wilson/Scheffel/Cole) — 1 item",
    "Dark Side of the Boom (Citadel's Nohshad Shah) — 4 items",
    "Only McKinsey Perspectives (FT + McKinsey State of AI survey) — 1 item",
    "HFIR (What Changed This Week) — 1 item",
    "Dark Side of the Boom (Goldman: Rindels/Walker CPI preview) — 1 item",
    "Michael Parekh / AI-RTZ #1204 — 2 items",
    "Bloomberg Points of Return (John Authers) — 3 items",
    "Dark Side of the Boom (Barclays: Christian Keller) — 2 items"
  ],
  skippedSources: [
    "Prometheus Research (subscriber chat announcement — zero analytical content, just a 'thread started' notice)",
    "Substack Notes digest (a16z / Alec Dejanovic / Michael Burry) — automated 'liked notes' notification, no original analytical content",
    "Rupak Ghose 'Virtu winning the battle but losing the war' (01:04 UTC) — fell just outside the 6-hour window cutoff (01:07:40 UTC), not processed"
  ]
};

let activeCat = "all";
let activeUrg = "all";
let activeSrc = null;

function escAttr(s){ return String(s).replace(/"/g,'&quot;'); }

function buildFilters(){
  const catCounts = {};
  ITEMS.forEach(i => catCounts[i.cat] = (catCounts[i.cat]||0)+1);
  const catRow = document.getElementById('cat-filters');
  let html = '<button class="pill active" data-kind="cat" data-val="all" onclick="setCat(\'all\')">All (' + ITEMS.length + ')</button>';
  Object.keys(CATEGORY_META).forEach(k => {
    if(!catCounts[k]) return;
    html += '<button class="pill" data-kind="cat" data-val="' + k + '" style="--pc:' + CATEGORY_META[k].color + '" onclick="setCat(\'' + k + '\')">' + CATEGORY_META[k].label + ' (' + catCounts[k] + ')</button>';
  });
  catRow.innerHTML = html;

  const urgCounts = {};
  ITEMS.forEach(i => urgCounts[i.urgency] = (urgCounts[i.urgency]||0)+1);
  const urgRow = document.getElementById('urg-filters');
  let uhtml = '<button class="pill active" data-kind="urg" data-val="all" onclick="setUrg(\'all\')">All (' + ITEMS.length + ')</button>';
  Object.keys(URGENCY_META).forEach(k => {
    if(!urgCounts[k]) return;
    uhtml += '<button class="pill" data-kind="urg" data-val="' + k + '" onclick="setUrg(\'' + k + '\')">' + URGENCY_META[k].label + ' (' + urgCounts[k] + ')</button>';
  });
  urgRow.innerHTML = uhtml;
}

function applyPillStyles(){
  document.querySelectorAll('.pill[data-kind="cat"]').forEach(function(btn){
    const val = btn.getAttribute('data-val');
    if(val === 'all') return;
    const color = CATEGORY_META[val].color;
    if(btn.classList.contains('active')){
      btn.style.background = color;
      btn.style.borderColor = color;
    } else {
      btn.style.background = 'transparent';
      btn.style.borderColor = 'var(--border)';
      btn.style.color = 'var(--text)';
    }
  });
}

function setCat(c){
  activeCat = c; activeSrc = null;
  document.querySelectorAll('.pill[data-kind="cat"]').forEach(function(b){
    b.classList.toggle('active', b.getAttribute('data-val') === c);
  });
  applyPillStyles();
  render();
}
function setUrg(u){
  activeUrg = u; activeSrc = null;
  document.querySelectorAll('.pill[data-kind="urg"]').forEach(function(b){
    b.classList.toggle('active', b.getAttribute('data-val') === u);
  });
  render();
}
function filterBySrc(name){
  activeSrc = name;
  activeCat = 'all'; activeUrg = 'all';
  document.querySelectorAll('.pill[data-kind="cat"]').forEach(function(b){ b.classList.toggle('active', b.getAttribute('data-val')==='all'); });
  document.querySelectorAll('.pill[data-kind="urg"]').forEach(function(b){ b.classList.toggle('active', b.getAttribute('data-val')==='all'); });
  applyPillStyles();
  render();
  var el = document.getElementById('cards');
  if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
}

function cardHtml(item, forceOpen){
  const cm = CATEGORY_META[item.cat];
  const um = URGENCY_META[item.urgency];
  const chartFlag = item.charts && item.charts.count > 0 ? (item.charts.hot ? '🔥' : '📊') : '';
  let html = '<div class="card' + (forceOpen ? ' open' : '') + '" id="card-' + item.id + '" style="--accent:' + cm.color + '">';
  html += '<div class="card-header" onclick="toggleCard(' + item.id + ')">';
  html += '<span class="idx">#' + item.id + '</span>';
  html += '<span class="urg">' + um.emoji + '</span>';
  html += '<span class="src-badge" style="background:' + cm.color + '">' + escAttr(cm.label) + '</span>';
  html += '<span class="cat-pill">' + escAttr(item.cat) + '</span>';
  if(chartFlag) html += '<span class="chart-flag">' + chartFlag + '</span>';
  html += '<span class="card-title">' + item.title + '</span>';
  html += '<span class="chevron">▸</span>';
  html += '</div>';

  html += '<div class="card-body">';
  html += '<div class="block-label">The Idea</div><div class="idea-text">' + item.idea + '</div>';
  html += '<div class="block-label">My Angle</div><div class="angle-box">' + item.angle + '</div>';
  html += '<div class="tweets">';
  html += '<div class="tweet-box"><div class="tweet-label a">TWEET A</div><div class="tweet-text">' + item.tweetA + '</div><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button></div>';
  html += '<div class="tweet-box"><div class="tweet-label b">TWEET B</div><div class="tweet-text">' + item.tweetB + '</div><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div>';
  html += '</div>';
  if(item.charts && item.charts.count > 0){
    html += '<div class="chart-box' + (item.charts.hot ? ' hot' : '') + '">' + (item.charts.hot ? '<span class="hot-tag">🔥 CHART WORTH SAVING</span> — ' : '📊 ') + item.charts.count + ' chart(s): ' + item.charts.desc + '</div>';
  }
  html += '<a class="read-link" href="' + item.link + '" target="_blank" rel="noopener" style="color:' + cm.color + '">↗ Read full article</a>';
  html += '</div>';
  html += '</div>';
  return html;
}

function render(){
  const list = ITEMS.filter(function(i){
    if(activeSrc && (!i.source || i.source.indexOf(activeSrc) === -1)) return false;
    if(!activeSrc){
      if(activeCat !== 'all' && i.cat !== activeCat) return false;
      if(activeUrg !== 'all' && i.urgency !== activeUrg) return false;
    }
    return true;
  });
  const container = document.getElementById('cards');
  const empty = document.getElementById('empty-state');
  if(list.length === 0){
    container.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';
  container.innerHTML = list.map(function(i){ return cardHtml(i, !!activeSrc); }).join('');
}

function toggleCard(id){
  const el = document.getElementById('card-' + id);
  if(el) el.classList.toggle('open');
}

function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}

function toggleReport(){
  document.getElementById('report').classList.toggle('open');
  document.getElementById('report-chevron').textContent = document.getElementById('report').classList.contains('open') ? '▾' : '▸';
}

function buildReport(){
  document.getElementById('meta-line').textContent = META.date + '  ·  ' + META.time + '  ·  ' + META.itemsExtracted + ' items from ' + META.emailsRead + ' emails';
  let html = '<h4>Time Window</h4><div>' + META.windowStart + ' → ' + META.windowEnd + '. Emails outside this window were not processed.</div>';
  html += '<div class="totals">Emails in window: ' + META.emailsInWindow + ' &nbsp;·&nbsp; Emails read: ' + META.emailsRead + ' &nbsp;·&nbsp; Items extracted: ' + META.itemsExtracted + '</div>';
  html += '<h4>Included Sources</h4>';
  META.includedSources.forEach(function(s){
    const name = s.split(' — ')[0];
    html += '<div class="skip-item">• <button class="src-link" onclick="filterBySrc(' + "'" + escAttr(name).replace(/'/g,"\\'") + "'" + ')">' + s + '</button></div>';
  });
  html += '<h4>Skipped Sources</h4>';
  META.skippedSources.forEach(function(s){
    html += '<div class="skip-item">• ' + s + '</div>';
  });
  document.getElementById('report-body').innerHTML = html;
}

buildFilters();
applyPillStyles();
render();
buildReport();
</script>
