<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>Twitter Data Intelligence</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root {
  --bg: #faf8f5;
  --surface: #ffffff;
  --border: #e8e4df;
  --border-light: #f0ede4;
  --text: #1a1a1a;
  --text-2: #555;
  --text-3: #8a8a8a;
  --accent: #2563eb;
  --accent-bg: #f0f5ff;
  --accent-2: #1d4ed8;
  --tag-text: #0e7490;
  --tag-bg: #e8f4f8;
  --yellow: #fff5b3;
  --yellow-border: #f0d966;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; line-height: 1.55;
       background: var(--bg); color: var(--text); }
.container { max-width: 960px; margin: 0 auto; padding: 24px 16px 80px; }

/* HEADER */
.header { display: flex; justify-content: space-between; align-items: baseline;
          border-bottom: 2px solid var(--accent); padding-bottom: 12px; margin-bottom: 20px; }
.title { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; color: var(--accent); }
.subtitle { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-3); }

/* FILTER BAR */
.filter-bar { display: none; background: var(--yellow); border: 1px solid var(--yellow-border);
              border-radius: 6px; padding: 8px 12px; margin-bottom: 16px;
              align-items: center; gap: 10px; font-size: 13px; }
.filter-bar.active { display: flex; }
.filter-bar button { font-family: inherit; font-size: 12px; background: transparent;
                     border: 1px solid var(--text); padding: 3px 10px; border-radius: 4px;
                     cursor: pointer; }
.filter-bar button:hover { background: rgba(0,0,0,0.05); }

/* SUMMARY */
.summary { background: var(--surface); border: 1px solid var(--border);
           border-left: 4px solid var(--accent); border-radius: 6px;
           padding: 16px 18px; margin-bottom: 20px; }
.summary p { margin-bottom: 8px; }
.summary p:last-child { margin-bottom: 0; }
.summary strong { font-weight: 600; }

/* SECTIONS (top-level collapsible) */
.section { background: var(--surface); border: 1px solid var(--border);
           border-radius: 6px; margin-bottom: 14px; overflow: hidden; }
.section-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px;
                background: var(--accent-bg); cursor: pointer; user-select: none;
                font-weight: 600; font-size: 13px; color: var(--accent-2); }
.section-head:hover { background: #e1ecff; }
.section-letter { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
                  min-width: 18px; }
.section-name { flex: 1; }
.section-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
                 color: var(--text-3); }
.section-arrow { font-size: 10px; transition: transform .2s; }
.section.open .section-arrow { transform: rotate(90deg); }
.section-body { display: none; padding: 6px 0; }
.section.open .section-body { display: block; }

/* TOPIC (nested collapsible inside Topics section) */
.topic { border-bottom: 1px solid var(--border-light); }
.topic:last-child { border-bottom: none; }
.topic-head { display: flex; align-items: center; gap: 10px; padding: 10px 16px;
              background: var(--accent-bg); cursor: pointer; user-select: none;
              font-size: 13px; font-weight: 600; color: var(--accent-2); }
.topic-head:hover { background: #e1ecff; }
.topic-name { flex: 1; }
.topic-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-3); }
.topic-arrow { font-size: 10px; transition: transform .2s; }
.topic.open .topic-arrow { transform: rotate(90deg); }
.topic-body { display: none; padding: 4px 0 6px; }
.topic.open .topic-body { display: block; }

/* ITEM CARDS */
.item-card { background: var(--surface); border: 1px solid var(--border);
             border-radius: 6px; padding: 12px 14px; margin: 10px 16px; }
.item-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
             flex-wrap: wrap; }
.item-author { font-weight: 600; color: var(--accent); cursor: pointer; }
.item-author:hover { text-decoration: underline; }
.item-time { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-3); }
.item-link { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--accent); text-decoration: none; }
.item-link:hover { text-decoration: underline; }
.item-text { font-size: 13.5px; line-height: 1.6; color: var(--text);
             white-space: pre-wrap; word-wrap: break-word; }

/* DATA POINT TAGS */
.data-points { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.dp-tag { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
          background: var(--tag-bg); color: var(--tag-text);
          padding: 2px 7px; border-radius: 4px; }

/* CHARTS (large, NOT thumbnails) */
.charts { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.chart { width: 100%; max-width: 420px; height: auto;
         border: 1px solid var(--border); border-radius: 4px; cursor: zoom-in;
         background: #f0ede4; }

/* LIGHTBOX */
.lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85);
            align-items: center; justify-content: center; z-index: 100; cursor: zoom-out; }
.lightbox.open { display: flex; }
.lightbox img { max-width: 92vw; max-height: 92vh;
                box-shadow: 0 8px 40px rgba(0,0,0,.6); }

/* LINKS */
.link-row { padding: 8px 16px; border-bottom: 1px solid var(--border-light);
            font-size: 13px; display: flex; gap: 12px; align-items: baseline; }
.link-row:last-child { border-bottom: none; }
.link-author { color: var(--text-3); min-width: 110px; cursor: pointer; }
.link-author:hover { color: var(--accent); }
.link-url { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
            color: var(--accent); text-decoration: none; word-break: break-all; flex: 1; }
.link-url:hover { text-decoration: underline; }
.link-desc { color: var(--text-2); font-size: 12px; }

/* AUTHOR FILTER STATES */
.filterable.match { background: var(--yellow); border-color: var(--yellow-border); }
.filterable.dim { opacity: 0.25; }

/* STATS BAR */
.stats { margin-top: 24px; padding: 10px 14px; background: var(--surface);
         border: 1px solid var(--border); border-radius: 6px;
         font-family: 'IBM Plex Mono', monospace; font-size: 11.5px;
         color: var(--text-2); display: flex; gap: 18px; flex-wrap: wrap; }
.stats strong { color: var(--text); font-weight: 600; }

.empty { color: var(--text-3); font-size: 13px; padding: 14px 18px; font-style: italic; }

@media (max-width: 640px) {
  .container { padding: 16px 12px 60px; }
  .item-card { margin: 8px 10px; }
  .link-row { flex-direction: column; gap: 4px; }
  .link-author { min-width: 0; }
  .header { flex-direction: column; align-items: flex-start; gap: 4px; }
  .chart { max-width: 100%; }
}
</style>
</head>

<script>
const REPORT_DATA = {"report_type":"TWITTER DATA INTELLIGENCE","date":"2026-08-13 05:21 UTC","collected_at":"2026-08-13T05:21:08Z","input_stats":{"total_tweets":105,"unique_authors":25,"tweets_with_images":43,"after_filter":72},"summary":"72 tweets catalogued from 25 accounts across 11 topics. **Key numbers:** Sept Fed rate hike odds fell to 31% after in-line CPI print; US 10yr Treasury auctioned at highest yields since 2007 with real yields near 2008 highs; July federal deficit hit -$432B, highest monthly total in 5+ years; annualized US debt interest expense reached a record $1.38T = 4.2% of GDP (highest since 1997). Institutions sold a record -$21.6B in Nasdaq futures (week of Aug 4); leveraged ETFs hit record 16% of global ETF daily volume; Smart Money Confidence at 0.35 vs Dumb Money at 0.63. SOX FCF and earnings growth both at ~140%, strongest in history. SpaceX $SPCX +40% over 5 days adding $550B in market cap.","topics":[{"topic":"Rates & Monetary Policy","items":[{"author":"zerohedge","description":"After today's in-line CPI print, odds of a Sept rate hike slide to 31%, the lowest in a month and down 16%. SOFR/Polymarket arb opportunity is closing — has been cut in half in the past two weeks.","tweet_url":"https://x.com/zerohedge/status/2087723938109341719","images":["https://pbs.twimg.com/media/HPkVbm_XEAArIR6.jpg","https://pbs.twimg.com/media/HPkVsM4XsAIXQvV.png"],"data_points":["Sept rate hike odds: 31%","Down 16% after CPI","SOFR/Polymarket arb cut in half"],"created_at":"2026-08-13T02:12:29.000Z"},{"author":"lisaabramowicz1","description":"US auctioned 10-year bonds today at the highest yields since 2007. The yield move has been driven by real yields (inflation-adjusted), which are hovering near the highest levels since 2008. Ed Yardeni sees this as reversion to normal rather than investor protest, though the fiscal doom loop makes higher yields more economically problematic than pre-crisis.","tweet_url":"https://x.com/lisaabramowicz1/status/2087691182209941957","images":["https://pbs.twimg.com/media/HPj1XTSXcAANQqU.png","https://pbs.twimg.com/media/HPj3CdEXgAAfVMh.jpg"],"data_points":["10yr yield: highest since 2007","Real yields: near highest since 2008"],"created_at":"2026-08-13T00:02:19.000Z"},{"author":"kurtsaltrichter","description":"Bessent and the BOJ reportedly spending $88 billion to stop the yen from crashing.","tweet_url":"https://x.com/kurtsaltrichter/status/2087722347025273145","images":[],"data_points":["BOJ/Bessent yen defense: $88B"],"created_at":"2026-08-13T02:06:10.000Z"},{"author":"C_Barraud","description":"Japan's government is said to support a faster BOJ rate hike, per Bloomberg.","tweet_url":"https://x.com/C_Barraud/status/2087768876582891656","images":[],"data_points":["Japan govt supports faster BOJ rate hike"],"created_at":"2026-08-13T05:11:03.000Z"},{"author":"zerohedge","description":"Fed's Kent: AI activity means interest rates need to be higher in the short run.","tweet_url":"https://x.com/zerohedge/status/2087702791993049493","images":[],"data_points":["AI → rates need to be higher (Kent/Fed)"],"created_at":"2026-08-13T00:48:27.000Z"}]},{"topic":"Fiscal & Debt Data","items":[{"author":"charliebilello","description":"July: The Federal Government took in $334 billion and spent $766 billion — a $432 billion deficit in just one month.","tweet_url":"https://x.com/charliebilello/status/2087615885028569513","images":["https://pbs.twimg.com/media/HPizcLHW4AA-1ST.png"],"data_points":["July revenue: $334B","July spending: $766B","Monthly deficit: $432B"],"created_at":"2026-08-12T19:03:07.000Z"},{"author":"LizAnnSonders","description":"July US federal budget deficit widened to -$432B vs. -$346B prior, marking the highest monthly total in more than five years. Medicare costs, Social Security, and net interest were the largest expenditures.","tweet_url":"https://x.com/LizAnnSonders/status/2087612603988058226","images":["https://pbs.twimg.com/media/HPiwmZ4WwAA0u-V.jpg"],"data_points":["July deficit: -$432B","vs. -$346B prior","Highest in 5+ years"],"created_at":"2026-08-12T18:50:05.000Z"},{"author":"charliebilello","description":"The Interest Expense on US Public Debt hit $1.37 trillion over the last 12 months, another record high. At current pace it will soon surpass Social Security as the largest federal budget line item.","tweet_url":"https://x.com/charliebilello/status/2087623906991722814","images":["https://pbs.twimg.com/media/HPi1h-sXoAAW8b0.png"],"data_points":["US debt interest expense: $1.37T (12-month record)"],"created_at":"2026-08-12T19:35:00.000Z"},{"author":"KobeissiLetter","description":"Estimated annualized interest expense on US federal debt is up to a record $1.38 trillion — equivalent to 4.2% of GDP, the highest since 1997 (vs. 2.3% in Q4 2020). In the first 9 months of FY2026, interest expense jumped +$78B YoY to $827B. Annualized interest has surged +$900B (+200%) over 5 years.","tweet_url":"https://x.com/KobeissiLetter/status/2087686462544159126","images":["https://pbs.twimg.com/media/HPhqzOiWMAAthl9.jpg"],"data_points":["Annualized interest expense: $1.38T (record)","4.2% of GDP (highest since 1997)","+$900B (+200%) over 5 years","FY2026 YTD interest: $827B"],"created_at":"2026-08-12T23:43:34.000Z"},{"author":"zerohedge","description":"US debt approaching $40 trillion — countdown underway on whether it can hit that level this week.","tweet_url":"https://x.com/zerohedge/status/2087725015768658159","images":["https://pbs.twimg.com/media/HPkW1UJWgAEXA4B.png"],"data_points":["US debt approaching $40T"],"created_at":"2026-08-13T02:16:46.000Z"},{"author":"charliebilello","description":"Price increases over last 7 years across major categories: Eggs +76%, Ground Beef +67%, Gas Utilities +62%, Home Prices +60%, Fuel Oil +56%, Auto Insurance +50%, Electricity +43%, Gasoline +43%, Transportation +42%, Restaurants +39%, Family Health Insurance +38%, Shelter +35%, Groceries +33%, Used Cars +29%, New Cars +22%.","tweet_url":"https://x.com/charliebilello/status/2087581452443513006","images":["https://pbs.twimg.com/media/HPiT6q3WkAAjObp.jpg"],"data_points":["Eggs: +76%","Home prices: +60%","Groceries: +33%","Shelter: +35%","Auto insurance: +50%"],"created_at":"2026-08-12T16:46:18.000Z"},{"author":"charliebilello","description":"Tariffs went up and companies raised prices. Tariffs are now being refunded but companies are keeping the price increases.","tweet_url":"https://x.com/charliebilello/status/2087646719563407406","images":["https://pbs.twimg.com/media/HPjPdQKWIAAlpT2.png"],"data_points":["Tariff refunds not passed to consumers"],"created_at":"2026-08-12T21:05:39.000Z"}]},{"topic":"Fund Flows & Positioning","items":[{"author":"KobeissiLetter","description":"Institutional investors sold -$21.6 billion of Nasdaq futures during the week ending August 4th — the largest weekly sale on record per Goldman Sachs. Short sales accounted for 72% of total. Combined institutional positioning in Nasdaq futures fell to -$5B, turning negative for the first time since May 2025 (vs. +$54B in October 2025). HFs sold -$11.9B, asset managers sold -$7.4B.","tweet_url":"https://x.com/KobeissiLetter/status/2087646086882304184","images":["https://pbs.twimg.com/media/HPjPDSiW4AEm8NB.jpg"],"data_points":["Nasdaq futures sold: -$21.6B (record weekly)","HF sales: -$11.9B","Asset manager sales: -$7.4B","Combined positioning: -$5B (first negative since May 2025)","Short sales: 72% of total"],"created_at":"2026-08-12T21:03:08.000Z"},{"author":"KobeissiLetter","description":"Leveraged ETFs now account for a record 16% of total global ETF daily trading value, despite representing only ~$250B (1%) of the ~$22T global ETF industry. 30-day average volume tripled to ~$70B in June. AI-related long-leveraged ETFs now account for 58% of total long-leveraged exposure (up from 26% in 2022). Memory stocks alone account for 48% of single-stock long-leveraged ETF exposure.","tweet_url":"https://x.com/KobeissiLetter/status/2087592701453853121","images":["https://pbs.twimg.com/media/HPiY9t9XkAEz7Ix.jpg"],"data_points":["Leveraged ETFs: 16% of global ETF daily volume (record)","30-day avg vol: ~$70B in June (3x Jan)","AI long-leveraged: 58% of exposure (vs 26% in 2022)","Memory stocks: 48% of single-stock lev exposure"],"created_at":"2026-08-12T17:31:00.000Z"},{"author":"sentimentrader","description":"Smart Money / Dumb Money Confidence as of August 12: Smart Money Confidence at 0.35 (pessimistic), Dumb Money Confidence at 0.63 (optimistic). Divergence signal.","tweet_url":"https://x.com/sentimentrader/status/2087715435433361794","images":["https://pbs.twimg.com/media/HPkOGYkaAAA-OPd.jpg"],"data_points":["Smart Money Confidence: 0.35 (pessimistic)","Dumb Money Confidence: 0.63 (optimistic)"],"created_at":"2026-08-13T01:38:42.000Z"},{"author":"themarketear","description":"$1 trillion+ of corporate buybacks in the pipeline. Systematics are rebuilding positions. Retail has returned. Chart asks: who is left forced to buy at higher prices?","tweet_url":"https://x.com/themarketear/status/2087653903055593554","images":["https://pbs.twimg.com/media/HPjWHFfWIAAcvlm.jpg"],"data_points":["Buybacks: $1T+ in pipeline","Systematics rebuilding","Retail back"],"created_at":"2026-08-12T21:34:11.000Z"}]},{"topic":"Equities & Market Structure","items":[{"author":"kurtsaltrichter","description":"The S&P 500 got cheaper this year while going up anyway. Forward P/E growth is falling while price growth keeps climbing — earnings doing the heavy lifting while valuations compress. No cheap multiple left to break the fall if earnings disappoint.","tweet_url":"https://x.com/kurtsaltrichter/status/2087709480528076940","images":["https://pbs.twimg.com/media/HPkItZFX0AAc5rx.jpg"],"data_points":["SPX: forward P/E falling while prices rise","Rally driven by earnings, not multiple expansion"],"created_at":"2026-08-13T01:15:02.000Z"},{"author":"kurtsaltrichter","description":"Nearly 90% of S&P 500 companies grew sales last quarter, but only ~45% improved margins. Growing revenue is easy; protecting margins is hard — the gap is where the next earnings miss hides.","tweet_url":"https://x.com/kurtsaltrichter/status/2087691607755669900","images":["https://pbs.twimg.com/media/HPj4dE5XgAIXCbx.jpg"],"data_points":["~90% S&P 500 grew sales","~45% improved margins","Revenue breadth >> margin breadth"],"created_at":"2026-08-13T00:04:01.000Z"},{"author":"kurtsaltrichter","description":"SOX index free cash flow growth and earnings growth are both approaching 140%, moving in lockstep — the strongest in the history of the series. Cash and profits climbing together provide a floor under the chip rally.","tweet_url":"https://x.com/kurtsaltrichter/status/2087679026391318993","images":["https://pbs.twimg.com/media/HPjtAsUWIAAsVgv.jpg"],"data_points":["SOX FCF growth: ~140% (history high)","SOX earnings growth: ~140% (history high)"],"created_at":"2026-08-12T23:14:01.000Z"},{"author":"kurtsaltrichter","description":"$NVDA tagged the daily expected move.","tweet_url":"https://x.com/kurtsaltrichter/status/2087598714550358471","images":["https://pbs.twimg.com/media/HPijpjXXgAARaaU.jpg"],"data_points":["NVDA: tagged daily expected move"],"created_at":"2026-08-12T17:54:53.000Z"},{"author":"themarketear","description":"Memory per rack now at $2 million. Average selling prices (ASPs) rising into 2028 forecast. Double-digit shareholder returns expected. The question: has the memory cycle peaked?","tweet_url":"https://x.com/themarketear/status/2087639731014095342","images":[],"data_points":["Memory per rack: $2M","ASPs rising through 2028","Double-digit shareholder returns forecast"],"created_at":"2026-08-12T20:37:53.000Z"},{"author":"KobeissiLetter","description":"SpaceX $SPCX extends gains to over +10% on the day, now up nearly +40% over the last five trading days. The stock has added +$550 billion in market cap since August 6th.","tweet_url":"https://x.com/KobeissiLetter/status/2087605976585171420","images":["https://pbs.twimg.com/media/HPiqiwnWIAEA2YA.png"],"data_points":["SPCX: +10% today","+40% last 5 days","+$550B market cap since Aug 6"],"created_at":"2026-08-12T18:23:45.000Z"},{"author":"bespokeinvest","description":"SpaceX $SPCX is now up 36.6% over the last week as it approaches a $2 trillion market cap once again.","tweet_url":"https://x.com/bespokeinvest/status/2087619952362537247","images":["https://pbs.twimg.com/media/HPi3QmuXQAArAbv.png"],"data_points":["SPCX: +36.6% past week","Approaching $2T market cap"],"created_at":"2026-08-12T19:19:17.000Z"},{"author":"zerohedge","description":"Market calm commentary: this level of calm in markets is described as either admirable or dangerous.","tweet_url":"https://x.com/zerohedge/status/2087741204733518144","images":[],"data_points":["Market volatility: historically low"],"created_at":"2026-08-13T03:21:06.000Z"}]},{"topic":"Economic Indicators","items":[{"author":"KobeissiLetter","description":"US financial industry shed -14,000 jobs in July to 9.09 million (lowest since July 2022). This marks the 5th consecutive monthly decline totaling -59,000. Since May 2025, financial payrolls dropped -121,000 — the largest drawdown since the 2020 pandemic, and excluding the pandemic, the biggest since 2008. Attributed to accelerating AI adoption.","tweet_url":"https://x.com/KobeissiLetter/status/2087668347374567645","images":["https://pbs.twimg.com/media/HPhrmX-XsAArFqg.jpg"],"data_points":["Financial jobs July: -14K","Total: 9.09M (lowest since Jul 2022)","5th consecutive monthly decline","-121K since May 2025","Biggest drawdown ex-pandemic since 2008"],"created_at":"2026-08-12T22:31:35.000Z"},{"author":"KobeissiLetter","description":"US business insurance prices fell for the first time in 9 years. Commercial P&C premiums dropped -1.2% in Q1 2026, ending a 33-quarter run of increases (first decline since Q3 2017). Despite this reversal, premiums are still up +74% since 2017 (from ~$560B to ~$980B).","tweet_url":"https://x.com/KobeissiLetter/status/2087 // ---------- helpers ----------
function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }

function renderBold(text) {
  return escapeHtml(text).replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
}

function relativeTime(iso) {
  if (!iso) return '';
  const dt = new Date(iso);
  if (isNaN(dt.getTime())) return '';
  const secs = Math.max(0, (Date.now() - dt.getTime()) / 1000);
  if (secs < 60)   return Math.floor(secs) + 's ago';
  const mins = secs / 60;
  if (mins < 60)   return Math.floor(mins) + 'm ago';
  const hrs  = mins / 60;
  if (hrs < 48)    return Math.floor(hrs) + 'h ago';
  return Math.floor(hrs / 24) + 'd ago';
}

function authorTag(name, cls = 'item-author') {
  if (!name) return '';
  return `<span class="${cls}" onclick="filterAuthor('${escapeAttr(name)}')">@${escapeHtml(name)}</span>`;
}

// ---------- rendering ----------
function renderCharts(images) {
  if (!images || !images.length) return '';
  return `<div class="charts">` + images.map(u =>
    `<img src="${escapeAttr(u)}" class="chart" loading="lazy" alt="" onclick="openLightbox('${escapeAttr(u)}')">`
  ).join('') + `</div>`;
}

function renderDataPoints(points) {
  if (!points || !points.length) return '';
  return `<div class="data-points">` + points.map(p =>
    `<span class="dp-tag">${escapeHtml(p)}</span>`
  ).join('') + `</div>`;
}

function renderItem(item) {
  const author = item.author || item.author_username || '';
  const time = relativeTime(item.created_at);
  const link = item.tweet_url
    ? `<a class="item-link" href="${escapeAttr(item.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  const body = item.description || item.text || '';
  return `
    <div class="item-card filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${authorTag(author)}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      ${body ? `<div class="item-text">${escapeHtml(body)}</div>` : ''}
      ${renderDataPoints(item.data_points)}
      ${renderCharts(item.images)}
    </div>`;
}

function renderTopic(topic, idx) {
  const items = (topic.items || []).map(renderItem).join('');
  const name = topic.topic || topic.name || `Topic ${idx + 1}`;
  return `
    <div class="topic">
      <div class="topic-head" onclick="toggleTopic(this)">
        <span class="topic-name">${escapeHtml(name)}</span>
        <span class="topic-count">${(topic.items || []).length}</span>
        <span class="topic-arrow">▸</span>
      </div>
      <div class="topic-body">${items || '<div class="empty">No items.</div>'}</div>
    </div>`;
}

function renderLink(l) {
  const author = l.author || l.author_username || '';
  const url = l.url || (l.resolved || l.tco) || '';
  return `
    <div class="link-row filterable" data-author="${escapeAttr(author).toLowerCase()}">
      ${author ? authorTag(author, 'link-author') : '<span class="link-author">—</span>'}
      <a class="link-url" href="${escapeAttr(url)}" target="_blank" rel="noopener">${escapeHtml(url)}</a>
      ${l.description ? `<span class="link-desc">${escapeHtml(l.description)}</span>` : ''}
    </div>`;
}

function renderSection(letter, name, body, count) {
  return `
    <div class="section">
      <div class="section-head" onclick="toggleSection(this)">
        <span class="section-letter">${letter}.</span>
        <span class="section-name">${escapeHtml(name)}</span>
        <span class="section-count">${count}</span>
        <span class="section-arrow">▸</span>
      </div>
      <div class="section-body">${body}</div>
    </div>`;
}

function renderSummary(text) {
  if (!text) return '';
  const paragraphs = String(text).split(/\n\n+/).filter(Boolean)
    .map(p => `<p>${renderBold(p)}</p>`).join('');
  return `<div class="summary">${paragraphs}</div>`;
}

function renderStats(d) {
  const parts = [];
  const cov = d.coverage || {};
  if (cov.authors_covered != null && cov.authors_total != null) {
    const pct = cov.authors_total ? (100 * cov.authors_covered / cov.authors_total) : 0;
    parts.push(`coverage <strong>${cov.authors_covered}/${cov.authors_total}</strong> (${pct.toFixed(0)}%)`);
  }
  const topicCount = (d.topics || []).length;
  const itemCount = (d.topics || []).reduce((n, t) => n + (t.items || []).length, 0);
  parts.push(`topics <strong>${topicCount}</strong>`);
  parts.push(`items <strong>${itemCount}</strong>`);
  if ((d.links || []).length) parts.push(`links <strong>${d.links.length}</strong>`);
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSection(el) { el.parentElement.classList.toggle('open'); }
function toggleTopic(el)   { el.parentElement.classList.toggle('open'); }

function openLightbox(src) {
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-img').src = '';
}

let activeFilter = null;
function filterAuthor(name) {
  if (!name) return;
  activeFilter = String(name).toLowerCase();
  document.querySelectorAll('.filterable').forEach(el => {
    const a = (el.dataset.author || '').toLowerCase();
    if (a === activeFilter) { el.classList.add('match'); el.classList.remove('dim'); }
    else                    { el.classList.add('dim'); el.classList.remove('match'); }
  });
  document.getElementById('filter-name').textContent = '@' + name;
  document.getElementById('filter-bar').classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function clearFilter() {
  activeFilter = null;
  document.querySelectorAll('.filterable').forEach(el => {
    el.classList.remove('match'); el.classList.remove('dim');
  });
  document.getElementById('filter-bar').classList.remove('active');
}
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (document.getElementById('lightbox').classList.contains('open')) closeLightbox();
    else if (activeFilter) clearFilter();
  }
});

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';

  const topicsBody = (d.topics || []).map(renderTopic).join('')
                  || '<div class="empty">No topics.</div>';
  const linksBody = (d.links || []).map(renderLink).join('');

  const sections = [
    renderSummary(d.summary),
    renderSection('A', 'Topics', topicsBody, (d.topics || []).length),
    linksBody ? renderSection('B', 'Link Queue', linksBody, (d.links || []).length) : '',
  ].join('');

  document.getElementById('app').innerHTML = sections || '<div class="empty">No report data.</div>';

  // Auto-open the main section and the first topic.
  document.querySelectorAll('.section').forEach((s, i) => { if (i === 0) s.classList.add('open'); });
  const firstTopic = document.querySelector('.topic');
  if (firstTopic) firstTopic.classList.add('open');

  document.getElementById('stats').innerHTML = renderStats(d);
}

renderReport(REPORT_DATA);
