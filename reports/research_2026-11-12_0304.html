<script>
const ITEMS = [{"id": 1, "cat": "ai/infra", "urgency": "watch", "source": "P Equity Research", "title": "Marvell buying Lumentum outright, all-stock, fab included", "idea": "The expert-call outline frames Marvell's all-stock purchase of Lumentum as a vertical move that brings an indium phosphide laser fab in-house. The open questions: whether owning Lumentum solves Marvell's optics supply shortage, whether Nvidia and Broadcom keep buying from a rival's subsidiary, whether merchant DSP customers defect, and whether China's regulator blocks it. Both stocks reacted only mildly.", "angle": "If Nvidia and Broadcom start dual-sourcing lasers away from Lumentum, Coherent and the other InP makers gain. A Chinese SAMR review is the deal's real timing risk.", "tweetA": "Marvell buying Lumentum isn't really an optics deal. It's a bet that indium phosphide laser capacity is the scarcest input in AI networking. Nvidia and Broadcom now buy a critical part from a competitor's subsidiary. Someone will start qualifying second sources, and $COHR is the obvious one.", "tweetB": "Paying all stock for a fab tells you where Marvell thinks its own multiple is. When chip designers start buying factories again, the asset-light model has stopped being the winning one. $MRVL $LITE", "charts": {"count": 0, "hot": false, "desc": "No charts in email (paywalled Q&A outline). Charts inside, worth opening."}, "link": "https://pequityresearch.substack.com/p/expert-call-lumentum-and-marvell"}, {"id": 2, "cat": "gold", "urgency": "deep", "source": "Robert Sinn / Goldfinger Capital", "title": "Dan Oliver: gold is a credit-contraction trade, not an inflation trade", "idea": "Myrmikan's Oliver argues gold's purchasing power can rise even while its dollar price falls, and that the current stress is moving through AI investment, private credit and insurers. His bull case rests on the next rescue: debts, deficits and market caps are larger than ever, so the bailout money printing will be too. He openly says he cannot time it, and miners can still collapse first as hedge funds degross.", "angle": "This reframes gold's slide below $4,000: if the credit bust comes first, gold can fall in dollars and still beat everything else. Long gold versus equities is the cleaner way to express it than outright long gold.", "tweetA": "Gold below $4k with 10-year yields near 5% looks like the bull case breaking. Oliver's view is the opposite: gold just has to fall less than what you're being margin-called on. In a credit bust, falling less than everything else counts as the win.", "tweetB": "AI capex, private credit and life insurers are now one chain of liabilities. If one link breaks, the Fed has to backstop all three. Gold is a bet on the size of that backstop, not on CPI.", "charts": {"count": 0, "hot": false, "desc": "No charts in email. Myrmikan's original note likely has charts."}, "link": "https://robertsinn.substack.com/p/dan-oliver-we-are-close-to-the-launch"}, {"id": 3, "cat": "macro", "urgency": "deep", "source": "Robert Sinn / Goldfinger Capital", "title": "Reserve preference vs repayment obligation: why a dollar squeeze can still happen", "idea": "Sinn pushes back on the stronger version of Oliver's thesis. IMF research links financial sanctions to higher central-bank gold allocations, but a July 2026 Fed review still finds the dollar dominant in international debt and loans. A central bank may prefer gold, but a borrower still needs dollars tomorrow. Investors can buy ahead of a 2020-style 'whatever it takes' rescue, yet a leveraged holder facing a margin call can't wait for it.", "angle": "The DXY breakout to its highest since May 2025 (per Innes, same night) fits this: de-dollarization in reserves, re-dollarization in funding stress. Both can be true for months.", "tweetA": "De-dollarization lives on the asset side. The dollar squeeze lives on the liability side. The DXY just had its biggest 2-day jump since June while central banks keep buying gold. That isn't a contradiction, it's both sides of one balance sheet.", "tweetB": "The question I'd ask every gold bull: who is holding gold with borrowed dollars? Those holders sell first in a funding scramble, even if every central bank on earth is a buyer.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://robertsinn.substack.com/p/dan-oliver-we-are-close-to-the-launch"}, {"id": 4, "cat": "gold", "urgency": "deep", "source": "Robert Sinn / Goldfinger Capital", "title": "Miner margin math: revenue down 10%, operating spread up 25%", "idea": "Sinn's worked example: if revenue per ounce falls from $100 to $90 while costs fall from $70 to $52.50, the operating spread rises from $30 to $37.50. Watch gold relative to all-in costs, not gold in dollars. Producers get the windfall. Cash-burning explorers still face dilution and financing risk, though juniors benefit indirectly as producer margins widen.", "angle": "If oil and the energy component of AISC fall faster than gold in a credit bust, producers can grow margins on a lower gold price. Producers over juniors until financing markets reopen.", "tweetA": "A 10% drop in the gold price can mean a 25% rise in miner margins if costs fall faster. Diesel is a big part of AISC. So the gold/oil ratio matters more for $GDX than gold alone does.", "tweetB": "In a liquidation, the market sells miners as leveraged gold. Producers are leveraged to gold minus costs, not to gold, and that spread can widen into a selloff. Juniors with no cash flow don't get that cushion. That's the distinction to trade.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://robertsinn.substack.com/p/dan-oliver-we-are-close-to-the-launch"}, {"id": 5, "cat": "ai/infra", "urgency": "deep", "source": "Herb Greenberg / Red Flag Alerts", "title": "How Nvidia's line went from 'financing is up to customers' to 'selective credit enhancements'", "idea": "Greenberg traces the drift. On the Nov 2025 call: 'our customers' financing is up to them.' The Feb 2026 10-K for the first time disclosed long-term capacity purchase obligations and financial guarantees, while stating 'we have not entered into any financing arrangements.' By the FQ2/27 call in August, CFO Kress pre-empted the term 'circular financing' while announcing 'selective credit enhancements' for nearly 2GW at another frontier lab: 'We're not making loans... we get paid twice.'", "angle": "Greenberg argues the CEO scandal makes the vendor-financing question more pressing. Guarantees are off-balance-sheet credit exposure that rises with AI-lab leverage. Read the Nov 17 10-Q footnotes before the headline numbers.", "tweetA": "'We get paid twice: once on the hardware, again on rental revenue.' That's equity exposure to your own customer's utilization. Nvidia isn't only a chip vendor now. It's a lender to the AI labs that doesn't call itself one. $NVDA", "tweetB": "In nine months the disclosures went from 'no financing arrangements' to credit enhancements on 2GW. Ignore the 10-K language. The thing to watch is how fast the guarantee footnote grows each quarter from here.", "charts": {"count": 0, "hot": false, "desc": "No charts; earnings-call transcript excerpts."}, "link": "https://www.herbgreenberg.com/p/nvidia-he-did-not-have-sexual-relations"}, {"id": 6, "cat": "regulation", "urgency": "watch", "source": "Herb Greenberg / Red Flag Alerts", "title": "'Two ants in the kitchen': the denial-then-admission pattern as a governance signal", "idea": "Nvidia's first statement on the NYT report said Jensen's interactions with Megaspeed's Alice Huang were 'not unusual,' since 'Jensen talks with thousands of customer executives every year.' A week later Huang admitted the affair. Greenberg calls the affair a sideshow but treats the hubris and message control as the real signal: the same 'tell them what you want them to think' playbook was used on circular financing.", "angle": "A company that got caught over-managing one narrative gets less benefit of the doubt on the next one. Expect harder sell-side questions on guarantees at the Nov 17 print.", "tweetA": "A denial followed by an admission within a week costs a company more than the original story. The market now discounts every Nvidia statement, financing disclosures included. Credibility gets used up long before cash does.", "tweetB": "Investors ignore personal scandals when the numbers are good. They stop ignoring them when the scandal shows how management talks about the numbers. That's where Nvidia is now.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.herbgreenberg.com/p/nvidia-he-did-not-have-sexual-relations"}, {"id": 7, "cat": "venture", "urgency": "red", "source": "Michael Parekh / AI Ramblings Daily", "title": "Anthropic IPO: ~$90B raised incl. $26B placement from its own suppliers, pricing Nov 18", "idea": "Per Bloomberg, Anthropic's IPO is multiple times oversubscribed, with roughly $90B raised (up to $90.4B) including a $26B private placement from AMD, Broadcom, Google, Micron, Microsoft, Nvidia and TSMC. It's the biggest listing ever, above SpaceX in June. Ticker ANT on Nasdaq, pricing Wednesday Nov 18, trading Nov 19. The market talked the valuation down from $1.5-2T to $1.0-1.5T; it now sits at $1.4T fully diluted. Amodei does a live event with Jamie Dimon Friday.", "angle": "$90B on $1.4T is about 6.4% float, which is small enough to squeeze. Index-inclusion talk and retail allocations will move it. Watch what the anchor suppliers' participation does to $AMD $MU $AVGO.", "tweetA": "The $26B placement comes from AMD, Broadcom, Micron, Nvidia, TSMC, Google and Microsoft: Anthropic's own suppliers. They're buying the customer so the customer keeps buying from them. Herb Greenberg would call that circular. Underwriters call it anchor demand.", "tweetB": "About $90B raised at a $1.4T valuation is roughly 6% float. A thin float, heavy retail and multiple-times oversubscribed is how you get a first-day pop and then a lockup cliff. Mark the expiry date now. $ANT", "charts": {"count": 0, "hot": false, "desc": "No charts in email. Parekh's AI-RTZ #1267 has 'lots of graphics, charts'."}, "link": "https://michaelparekh.substack.com/p/cleared-for-takeoff-in-ai-anthropic"}, {"id": 8, "cat": "positioning", "urgency": "deep", "source": "Michael Parekh / AI Ramblings Daily", "title": "Amazon's $18B Anthropic stake ~ $250B+; Google's $33B ~ $140B", "idea": "Per the NYT, Amazon and Google together own more than a quarter of Anthropic. Amazon's $18B investment could be worth over $250B, and Google's $33B about $140B, before pricing.", "angle": "That's roughly 14x for Amazon and 4x for Google. The mark-to-market gain could show up as a large non-operating line in AMZN's Q4 and flatter EPS optics. It also makes AMZN partly an Anthropic proxy at a discount.", "tweetA": "Amazon put in $18B and it's now worth $250B+, about 14x, before a single share trades. If you want Anthropic exposure without fighting for an IPO allocation, you can already buy it inside $AMZN.", "tweetB": "Google paid nearly twice what Amazon did and got about 4x instead of 14x. Same company, different entry points. In AI the timing of the check mattered more than its size. $GOOGL $AMZN", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/cleared-for-takeoff-in-ai-anthropic"}, {"id": 9, "cat": "regulation", "urgency": "deep", "source": "Michael Parekh / AI Ramblings Daily", "title": "Seven founders, $18B each, guaranteed 50.1% vote, inside a public benefit corp", "idea": "Per the WSJ, each of Anthropic's seven co-founders holds a stake worth about $18B at the midpoint, and together they hold a guaranteed 50.1% of most shareholder votes. Anthropic lists as a public benefit corporation with equity set aside for a public benefit fund. Parekh contrasts it with Nvidia: after 33 years, Jensen Huang has no super-voting stock and no control over his board.", "angle": "This week shows both sides of founder control. Anthropic's founders can't be removed by a board. Nvidia's board can remove Jensen, and that's exactly what is happening. Governance-focused funds will have to pick which risk they prefer.", "tweetA": "Nvidia's board can fire its founder. Anthropic's board effectively can't fire its founders. The same week tests both models of founder control. Which one would you rather own in a scandal?", "tweetB": "Seven founders controlling 50.1% of the vote in a $1.4T public company is a shareholder-rights fight waiting to happen. The PBC wrapper means 'maximizing shareholder value' isn't even the stated objective. Price the governance discount before Nov 18.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/cleared-for-takeoff-in-ai-anthropic"}, {"id": 10, "cat": "ai/infra", "urgency": "deep", "source": "Michael Parekh / AI Ramblings Daily", "title": "Q3: Anthropic $17B revenue / -$0.5B loss vs OpenAI $10B / -$11B adjusted", "idea": "Per The Information and WSJ, OpenAI's Q3 revenue jumped about 50% QoQ to $10B (2.5x+ YoY), with enterprise now the majority after doubling. Its adjusted operating loss was about $11B, which excludes $2.6B of stock comp. Anthropic did about $17B of revenue in Q3 with a roughly $0.5B loss. OpenAI is raising at $1.25T ahead of a 2027 IPO.", "angle": "On a run-rate basis, Anthropic at $1.4T is about 21x revenue and OpenAI at $1.25T is about 31x, so the near-breakeven company is the cheaper one. Expect OpenAI's private round to be repriced off ANT's trading.", "tweetA": "OpenAI loses $1.10 for every $1 of revenue, about $1.36 if you count stock comp. Anthropic loses 3 cents. Yet the market values OpenAI at 31x run-rate and Anthropic at 21x. Nov 19 is when public investors get to arbitrage that.", "tweetB": "Enterprise is now most of OpenAI's revenue. Both labs are converging on the same customer, and only one of them has shown it can serve that customer profitably. Consumer scale was the moat in 2024. In 2026 it's gross margin.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/cleared-for-takeoff-in-ai-anthropic"}, {"id": 11, "cat": "tech", "urgency": "deep", "source": "Michael Parekh / AI Ramblings Daily", "title": "ChatGPT: ~100M paying out of 1.2B weekly users, ads at a $1B run-rate", "idea": "OpenAI has close to 100 million paying users out of about 1.2 billion weekly users, and ads were running at a $1B annualized pace in August.", "angle": "An 8% paid conversion is very high for consumer software (Spotify-like). Ads at $1B are tiny next to Meta, which Parekh notes is now bigger than Google in online advertising. Ads are OpenAI's lever if the IPO needs a growth story.", "tweetA": "1.2B weekly users and $1B in annualized ads works out to under $1 per user per year. Meta makes about $50 per user. That gap is the bull case for an OpenAI ad business, and the bear case for Google search.", "tweetB": "100M paying of 1.2B weekly is about 8% conversion. Most consumer apps would kill for that. Yet OpenAI still pivoted to enterprise, which tells you the consumer subscriber doesn't cover the compute bill.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/cleared-for-takeoff-in-ai-anthropic"}, {"id": 12, "cat": "regulation", "urgency": "red", "source": "Michael Parekh / AI Ramblings Daily", "title": "Nvidia stalls while chips rip: NDX +3.4%, SOX +6.9%, NVDA -4% then -5.5%", "idea": "Monday: Nasdaq 100 +3.4% (best since late March), chips +6.9% (best since late July), AMD +13%, Broadcom +9%, per Axios. Nvidia fell about 4% Monday and 5.5% Tuesday, briefly dipping below $4T, and a shareholder class action was filed in San Jose. The board hired Wachtell Lipton with a former acting US attorney leading the probe. Politico says the scandal raised the odds of chip export limits in the year-end defense bill. The Democratic Congress takes power Jan 3 promising investigations.", "angle": "Three separate overhangs: the board probe (weeks), NDAA export language (December), and a Democratic Congress (Q1). Pairs like long $AMD/$AVGO, short $NVDA capture all three without betting on AI demand.", "tweetA": "Chips +6.9%, AMD +13%, Nvidia -4%. A 17-point spread in one day between the AI leader and its nearest competitor, on no news about demand. That's what an idiosyncratic risk premium looks like when it gets priced. $NVDA $AMD", "tweetB": "Everyone's watching the board. The bigger exposure is the year-end defense bill. Export limits written into the NDAA would outlast any CEO, and the scandal just gave its sponsors the votes.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/cleared-for-takeoff-in-ai-anthropic"}, {"id": 13, "cat": "tech", "urgency": "watch", "source": "Michael Parekh / AI Ramblings Daily", "title": "Anthropic ships Claude Sheets, Meetings, Whiteboards; third-party apps open inside Claude", "idea": "Per Bloomberg and The Verge, Anthropic announced Claude Sheets (spreadsheet), Claude Meetings (video-call assistant) and Claude Whiteboards, joining documents, slides, design and motion tools plus Claude Code and Cowork. Apps from Adobe, Atlassian and HubSpot now open inside Claude. OpenAI launched verified 'Business Agents' in ChatGPT the same day. Parekh still uses Google Docs as his main suite and finds Gemini there 'one task at a time, not proactive enough.'", "angle": "This is a direct attack on M365 seat economics days before the IPO. If apps open inside Claude, Claude becomes the operating system, and SaaS vendors become plugins. Watch for any pressure on $MSFT Copilot attach rates.", "tweetA": "Adobe, Atlassian and HubSpot apps now open inside Claude. When the AI is the window and the SaaS app is a pane within it, the SaaS vendor has lost the customer relationship. That's how browsers did it to desktop apps. $ADBE $TEAM $HUBS", "tweetB": "Launching an office suite the week of the IPO roadshow tells investors where the next $100B of revenue is supposed to come from: Microsoft's 400M Office seats. $MSFT", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/cleared-for-takeoff-in-ai-anthropic"}, {"id": 14, "cat": "tech", "urgency": "deep", "source": "Michael Parekh / AI Ramblings Daily", "title": "Meta: $145B+ AI infra this year, now bigger than Google in online advertising", "idea": "Parekh notes Meta is spending $145B+ on AI infrastructure this year, with its Muse AI agents integrated into Instagram, WhatsApp, Facebook and advertiser tools, and that Meta is now bigger than Google in online advertising.", "angle": "If Meta has overtaken Google in ads while ChatGPT's ads run at only $1B, AI's first clear monetization winner is the incumbent ad network. That's a useful counterweight to the 'hyperscalers are the cheque writers' rotation.", "tweetA": "Meta passing Google in online ads is a bigger structural shift than most AI headlines this year. AI agents inside WhatsApp and Instagram are winning the ad budget, while AI search is still trying to work out how to show ads. $META $GOOGL", "tweetB": "$145B of capex looks reckless until you notice it bought the #1 spot in global advertising. That's what AI capex earning a return actually looks like.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/cleared-for-takeoff-in-ai-anthropic"}, {"id": 15, "cat": "macro", "urgency": "deep", "source": "Bespoke Investment Group (post-election sectors)", "title": "Since Election Day: twice as many 1%+ days as quiet days; Energy -5.6%", "idea": "Through midday Wednesday, the S&P 500 has had twice as many 1%+ daily moves as sub-1% days since Election Day. Only Staples and Utilities have had more quiet days than big ones. The S&P is up 0.5%+ and seven of 11 sectors are up at least 1%. The losers: Energy (-5.59%), Technology (-1.13%), Industrials (-0.38%). Utilities is up only 0.47%.", "angle": "A Democratic sweep is pricing as negative for energy and AI-power (utilities, industrials), with energy down even as oil rallied on Hormuz. That divergence between the commodity and the equities is the opportunity.", "tweetA": "Oil up 2% on Hormuz risk, yet energy is the worst sector since the election at -5.6%. The market is pricing a Democratic Congress over a physical supply shock. One of those two is mispriced. $XLE", "tweetB": "Utilities and Industrials sitting in the bottom four since the midterms is the AI-power trade getting a political discount. Permits, rate cases and data center backlash all go through Congress now. $XLU $VST $CEG", "charts": {"count": 1, "hot": false, "desc": "Sector rank chart since Election Day close (most sectors gray, movers colored)."}, "link": "https://bespokeinvest.substack.com/p/a-wild-week-post-election-sector"}, {"id": 16, "cat": "positioning", "urgency": "deep", "source": "Bespoke Investment Group (post-election sectors)", "title": "Post-midterm leadership: Comm Services, Discretionary, Financials; Energy never left the cellar", "idea": "Bespoke's daily rank chart shows leadership barely changed despite the chop. Comm Services moved from mid-pack to #1. Discretionary was #1 on day one and is still #2. Financials ended near where it started. Staples went from 7th to 1st on 11/5 and back to 7th. Utilities, Industrials, Tech and Energy have been the bottom four every day, and Energy has stayed dead last.", "angle": "Persistent rankings after a shock usually mean real positioning changes, not noise. The Financials rally under a Democratic Congress is counterintuitive. It might be a rates trade (10y near 5%) more than a political one.", "tweetA": "Financials are a top-3 sector after a Democratic sweep. That isn't a political trade. It's a 10-year near 5% and a steeper curve. The market is telling you the rates regime matters more than who chairs Senate Banking. $XLF $KRE", "tweetB": "Staples went 7th to 1st to 7th in five sessions. When the defensive sector is the most volatile one, nobody actually knows what they're hedging.", "charts": {"count": 1, "hot": true, "desc": "Bump chart of each sector's performance rank vs Election Day close. Shows Staples' 7th-1st-7th round trip and Energy pinned at the bottom."}, "link": "https://bespokeinvest.substack.com/p/a-wild-week-post-election-sector"}, {"id": 17, "cat": "positioning", "urgency": "red", "source": "Bespoke Investment Group (AAPL back on top)", "title": "Apple is #1 again (~$5T); MSFT now only ~$110B behind Nvidia", "idea": "With Nvidia pushing toward 52-week lows about a month after peaking, Apple has reclaimed the top S&P 500 spot at around $5T. It's the first change at the top in about 1.5 years. Microsoft is now about $110B smaller than NVDA, the narrowest gap since 7/1/25. Apple's high-single-digit index weight is in line with readings since 2020.", "angle": "Another 8% after-hours drop in NVDA could put it behind MSFT too. Index weight shifts and the closet-indexer rebalancing that follows would add mechanical selling.", "tweetA": "Nvidia fell 8% after hours. The gap to Microsoft was $110B. At roughly $4T, 8% is about $320B. Nvidia may already be the #3 stock in the S&P 500 when it opens Thursday. $NVDA $MSFT $AAPL", "tweetB": "Apple is the largest company in the world again, and it isn't really an AI trade. In the year of the AI IPOs, the winner on market cap is the company that sat out the capex race.", "charts": {"count": 1, "hot": false, "desc": "Largest S&P 500 member's weight over time; Apple's ~high-single-digit share."}, "link": "https://bespokeinvest.substack.com/p/apple-aapl-back-on-top"}, {"id": 18, "cat": "positioning", "urgency": "deep", "source": "Bespoke Investment Group (AAPL back on top)", "title": "AI megacaps are ~20%+ off highs, worse than the median S&P stock", "idea": "Among megacaps, AAPL and BRK/B are testing 52-week highs and LLY is close. The AI-linked megacaps mostly sit 20% or more below their 52-week highs, further off than the median S&P 500 member. Only MSFT and AMZN are down less than the median stock.", "angle": "Defensive mega-caps (AAPL, BRK, LLY) at highs while AI names sit 20% off: the AI-capex stocks are the cyclicals now, and the quality trade has moved elsewhere.", "tweetA": "Apple, Berkshire and Lilly at highs. The AI giants 20% off theirs. The 'Mag 7' label just stopped working. The megacaps are now a defensive basket and an AI-beta basket, and they trade like it.", "tweetB": "The median S&P stock is closer to its high than most AI megacaps are. For two years, buying the index meant buying AI. This month, owning the equal-weight index meant owning less of the pain. $RSP $SPY", "charts": {"count": 1, "hot": false, "desc": "Megacaps' distance from 52-week highs vs the median S&P 500 member."}, "link": "https://bespokeinvest.substack.com/p/apple-aapl-back-on-top"}, {"id": 19, "cat": "venture", "urgency": "watch", "source": "TWiST Newsletter", "title": "Founders now ship a company.md with their deck for VC screening agents", "idea": "With more VCs handing inbound screening to AI agents, Dragonfly's Haseeb Qureshi notes some founders now send a company.md file, a markdown doc written for AI consumption, alongside the deck and data room. He calls it a 'very positive signal': the founder understands the process, respects his time and isn't afraid of a 'neutral read'.", "angle": "When the first reader is a bot, pitching becomes prompt engineering for the screening model. Expect 'agent SEO' for fundraising, and adversarial attempts to game screening models.", "tweetA": "Bots are the first reader of your pitch now. The founders who send a company.md are writing for the screening model, which makes the deck the second-most important document. The next thing will be prompt injection in data rooms.", "tweetB": "A pitch written to be read by an AI ends up being the honest version, because the model strips out the slide-design theatrics. VC screening agents might do more for founder honesty than any term sheet clause.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://twistartups.substack.com/p/optimize-your-pitch-for-the-human"}, {"id": 20, "cat": "macro", "urgency": "deep", "source": "PA - Global Macro", "title": "NGDP rule says 'hike' in all five G-10 economies; one CB is ~275bps behind (not the Fed)", "idea": "PA formalizes Lars Christensen's reading of Greenspan's implicit nominal-demand target (Greenspan told the FOMC in Nov 1992 the Fed was 'in a sense using a nominal GDP goal'). Backtested on the Fed since 1990, the rule led most major turns by one to three quarters, including May 2021. It never sanctioned any of the seven 2024-25 cuts. Run across the US, UK, euro area, Canada and Australia, it now says hike everywhere. One central bank is about 275bps behind.", "angle": "If the laggard is the ECB, BoC or RBA, that's the front-end short and the FX long. The rule saying the cuts were never justified also supports Warsh-era hikes into 2027.", "tweetA": "Seven Fed cuts in 2024-25 and a nominal-GDP rule that called for none of them. Now the Fed is hiking with the 10-year near 5%. The fastest way out of an inflation problem is to never have cut into it.", "tweetB": "If one G-10 central bank is 275bps behind its own nominal demand and it isn't the Fed, the best rates trade in the world isn't in Treasuries. Find that curve and pay the front end.", "charts": {"count": 0, "hot": false, "desc": "Paywalled; full backtest and five country models below the fold. Charts inside, worth opening."}, "link": "https://www.paperalfa.com/p/hiking-season"}, {"id": 21, "cat": "credit", "urgency": "red", "source": "Stephen Innes / Dark Side of the Boom (AI trade roars back)", "title": "CoreWeave +25%: revenue +168% to $3.66B, backlog $132.5B, but $47B debt and ~$1.1B quarterly interest", "idea": "CoreWeave revenue rose 168% YoY to $3.66B with better margins and higher guidance. Backlog is $132.5B. It carries about $47B of debt and expects $1.05-1.15B of Q4 interest. Bear estimates put next year's funding gap near $33B, realized revenue per MW below bullish assumptions, and new supply making compute less scarce by 2028. The key test: can it get investment-grade, contract-backed financing at the 7-7.5% being discussed? FCF turns positive around 2030 in the optimistic case.", "angle": "Annualized Q4 interest of ~$4.4B on $47B is about a 9.4% blended cost. Refinancing at 7.25% saves about $1B a year. Contract-backed IG paper is the catalyst to watch in credit.", "tweetA": "CoreWeave pays about $1.1B of interest on $3.66B of quarterly revenue. That's roughly 30 cents of every revenue dollar to lenders before a single GPU depreciates. The stock rallied 25%. The bonds are the honest market here. $CRWV", "tweetB": "$4.4B a year of interest on $47B of debt is a 9.4% blended cost. Refinancing at the 7-7.5% IG rate being floated would save about $1B a year, worth more than any guidance beat. The equity call is really a call on that one bond deal.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/the-ai-trade-roars-back-everyones"}, {"id": 22, "cat": "positioning", "urgency": "deep", "source": "Stephen Innes / Dark Side of the Boom (AI trade roars back)", "title": "Cheque receivers beat cheque writers: hyperscalers used as the funding leg", "idea": "UBS's desk saw investors add AI equipment suppliers and infrastructure names while selling hyperscalers to fund the buys. MSFT, GOOGL and AMZN fell about 2% while Nvidia gained ~4%, Tesla 3% and semis rallied. Hedge funds led the semi flows, with long-only accounts also buying. Investors are paying for near-term revenue visibility while doubting the eventual return on AI capex.", "angle": "Long suppliers / short spenders is a crowded pair after one day. If the Anthropic IPO marks up AMZN and GOOGL's stakes, the short leg could squeeze hard.", "tweetA": "Funds are selling Amazon and Google to buy the suppliers. Amazon's Anthropic stake alone could be worth $250B+ at pricing on Nov 18. Shorting the hyperscalers the week their biggest equity holding goes public is a brave trade. $AMZN $GOOGL", "tweetB": "For a year the market rewarded hyperscalers for raising capex. Now it rewards whoever receives the capex. That's the step before investors start asking for return on invested capital. Watch which hyperscaler cuts first.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/the-ai-trade-roars-back-everyones"}, {"id": 23, "cat": "positioning", "urgency": "deep", "source": "Stephen Innes / Dark Side of the Boom (AI trade roars back)", "title": "GS desk: HFs 18% better to buy, long-onlys selling tech; 3 stocks = 32% of tape", "idea": "Goldman's desk activity was about 20% below its two-week average while market-wide volume ran about 13% above its 10-day norm. The floor was 13% better to buy. Hedge funds were 18% better to buy, concentrated in tech and discretionary. Long-onlys were only marginally on the bid and sold tech and discretionary into healthcare, comms and industrials. Just three stocks made up about 32% of tape volume, and GS's retail-favorites basket had its second-best day in three years.", "angle": "Fast money buying while slow money sells into it is a classic bear-market rally setup. If long-only flows don't flip by the Nov 17 NVDA print, fade the rip.", "tweetA": "Hedge funds 18% better to buy tech. Long-onlys selling it. Three stocks were a third of all volume. Rallies like this often end when the people who bought with leverage have to explain the position to their risk manager.", "tweetB": "Retail favorites had their second-best day in three years, Robinhood single-stock buying was the third-highest on record (per Daily Chartbook), and long-onlys were sellers. Retail is buying what the long-onlys are selling.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/the-ai-trade-roars-back-everyones"}, {"id": 24, "cat": "macro", "urgency": "watch", "source": "Stephen Innes / Dark Side of the Boom (AI trade roars back)", "title": "VIX back to ~17, but credit, rates and oil vol haven't come down with it", "idea": "The VIX fell toward 17, back to pre-election levels, as investors unwound protection, and selling of VIX calls knocked VVIX down sharply. Implied and realized vol in equities, credit, rates and oil has not returned to earlier lows, though. Innes warns vol in one asset class can spill into another while positioning is concentrated and diversification relationships are unreliable.", "angle": "A gap between equity vol and rates/credit vol historically closes with equity vol going up. Cheap VIX calls against an elevated MOVE look like an attractive hedge.", "tweetA": "The VIX is back to pre-election levels. Treasury futures point to a 10-year above 5%, the dollar is at an 18-month high and oil is bid on Hormuz. Equity vol is pricing the calm. Every other vol market is pricing the risks. Hedges are cheapest when VIX is the only one relaxed.", "tweetB": "VVIX collapsing on call selling means the market just sold its crash insurance two days after a liquidation. That doesn't mean the risk is gone. It's exactly when you want to own some.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/the-ai-trade-roars-back-everyones"}, {"id": 25, "cat": "macro", "urgency": "red", "source": "Stephen Innes / Dark Side of the Boom (AI trade roars back)", "title": "DXY biggest 2-day jump since June, gold < $4k, BTC 'a tech stock again' at $74k", "idea": "After Tuesday's hot CPI and hawkish Fedspeak, markets price two more 25bp hikes in 2027. With cash Treasuries closed for Veterans Day, futures implied a 3-4bp rise in 10s, back above 5%. The dollar had its largest two-day gain since June and its highest level since May 2025. Gold fell below $4,000 as the dollar-rates link reasserted itself. Bitcoin recovered above $74,000 after testing three-month lows, trading as tech. Oil rose 2%+ on Iran talks souring and Hormuz.", "angle": "The AI rally is happening against tightening financial conditions. Gold and BTC both failed as hedges this week and traded as rates/beta assets. If 10s print above 5% in cash Thursday, watch the long-duration tech names first.", "tweetA": "Gold down on a strong dollar. BTC up as a tech stock. Oil up on Hormuz. Equities up on AI. Each asset is trading on a different story, and that's usually what the start of a regime change looks like.", "tweetB": "A 10-year above 5%, two hikes priced for 2027, and the Nasdaq 100 up 2.3%. AI bulls are betting that earnings growth beats discount rates. That works for $NVDA's cash flows. It doesn't work for companies that have to refinance at 9%.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/the-ai-trade-roars-back-everyones"}, {"id": 26, "cat": "gold", "urgency": "deep", "source": "The Bubble Bubble Report", "title": "Every secular metals bull has a big correction: gold +165% to $5,600, silver +364% to $121, then 2026", "idea": "The author dates the new secular precious-metals bull to gold's March 2024 breakout (silver followed in May 2024). Gold ran from about $2,100 to $5,600 (+165%) and silver from about $26 to $121 (+364%) before both peaked in January 2026. The correction was triggered by Trump's surprise appointment of hawk Kevin Warsh as Fed chair, and extended by the US-Iran war starting in March, which lifted energy, inflation and rate expectations and flipped the Fed from cutting to hiking. The 1970s and 2000s bulls both had similar mid-cycle corrections.", "angle": "Gold at <$4,000 is about 29% off the $5,600 peak, versus a ~45% drawdown in 1974-76. Historical analogs say this is a buy zone. Sinn and Oliver (same evening) say the credit bust has to come first.", "tweetA": "The 1974-76 gold correction was about 45% in the middle of a secular bull. Gold today is about 29% off its $5,600 high. If you believe the 1970s analog, you're either early or you're buying a discount. You need to decide which before the Fed does.", "tweetB": "This correction had a clear trigger: a hawkish Fed chair plus an oil war, which turned cuts into hikes. Gold bulls don't need the Fed to pivot. They need oil to fall. Watch Hormuz, not the FOMC.", "charts": {"count": 2, "hot": false, "desc": "Gold and silver secular charts with March/May 2024 breakouts and the Jan 2026 peaks; comparisons to the 1970s and 2000s corrections."}, "link": "https://thebubblebubble.substack.com/p/every-secular-precious-metals-bull"}, {"id": 27, "cat": "geopolitics", "urgency": "red", "source": "Michael McDonough / The Pressure Point", "title": "Treasury enters Iran's target set: Bessent moved to a military base after threats", "idea": "Per the NYT, Treasury Secretary Bessent moved out of his home onto a military base after Iranian threats, as he leads the campaign to isolate Iran's oil and financial networks. Iranian officials warned the economic 'stranglehold' may provoke retaliation. Iran faces inflation near 90%, a collapsing currency and oil exports near zero. Rubio says 'major combat operations' are no longer needed, and the US is shifting to sanctions and blockade. Indirect talks resumed Nov 6, followed by strikes after a Qeshm Island operation on Nov 7.", "angle": "Sanctions now carry kinetic risk for the people who enforce them. That's a new tail risk for banks, shipping and commodity traders on Iran-adjacent flows, and support for the Hormuz premium in crude.", "tweetA": "Iran's inflation is near 90%, its oil exports are near zero, and the US Treasury Secretary sleeps on a military base. Rubio says combat is over. That sounds like the economic war just became the main front. $USO $BNO", "tweetB": "Bessent goes to the Trump-Xi meeting later this month as a man under Iranian threat, pushing China to stop buying Iranian oil. Iran's last customer may be the real deal on the table.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://pressurepoint.whatsthelatest.ai/archive/the-pressure-point-economic-pressure-turns/"}, {"id": 28, "cat": "geopolitics", "urgency": "watch", "source": "Michael McDonough / The Pressure Point", "title": "Tehran doesn't need sanctions relief if it can make enforcement slower", "idea": "The analysis argues the bigger risk lies outside Washington. Foreign bankers, port officials and shipping executives have far less protection than a cabinet secretary, yet their cooperation decides whether sanctions bite. A credible campaign against those intermediaries raises the private cost of compliance. The US 'Iron Gate' blockade task force depends on neighbors whose cooperation is uncertain, per the NYT. Iran also asked the UN and IAEA to condemn a $20M US bounty for nuclear information.", "angle": "Sanctions effectiveness depends on compliance officers in the Gulf and Asia. If threats rise, expect leakage in Iranian crude flows to China, which caps how much Iranian supply loss oil can actually price.", "tweetA": "A sanctions designation now comes with a personal security risk for the official who signs it. Iran doesn't need to win the sanctions war. It only needs every Gulf banker to hesitate before freezing an account.", "tweetB": "Economic warfare now has a personnel-security budget, and nobody in Congress is counting it. The cost of sanctions just went up while the cost of evading them stayed the same.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://pressurepoint.whatsthelatest.ai/archive/the-pressure-point-economic-pressure-turns/"}, {"id": 29, "cat": "energy", "urgency": "red", "source": "Michael McDonough / The Pressure Point", "title": "Iran claims it struck tanker navigation infrastructure on an Omani island", "idea": "Iran claimed it hit oil-tanker navigation infrastructure on an Omani island, while CENTCOM keeps its blockade of Iranian ports and protects commercial shipping (Fox News). It follows the Nov 7 US strikes on Iranian air defenses and renewed Hormuz concerns that pushed oil up 2%+ on Wednesday.", "angle": "Hitting Oman, the usual mediator, is an escalation in kind: it threatens the neutral side of the strait. Tanker rates and Hormuz war-risk premiums matter more than Brent here.", "tweetA": "Iran says it hit navigation infrastructure on an Omani island. Oman is the country that hosts the US-Iran talks. When you start hitting the mediator, the talks are a cover story. $FRO $DHT", "tweetB": "Energy stocks are the worst sector since the election and Iran is now hitting tanker infrastructure next to Hormuz. The market is pricing a quiet Democratic Congress over a hot strait. I'd take the other side. $XLE", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://pressurepoint.whatsthelatest.ai/archive/the-pressure-point-economic-pressure-turns/"}, {"id": 30, "cat": "labor", "urgency": "watch", "source": "Michael McDonough / The Pressure Point", "title": "Spain's first general strike in 14 years: housing costs and wages", "idea": "Spain held its first general strike in 14 years across several cities, with housing costs and wages driving the walkout (Al Jazeera).", "angle": "Spain has been the eurozone's growth star. A general strike over housing says the growth isn't reaching wages, which pushes toward rent controls, tourist-rental crackdowns and wage settlements. That's a headwind for Spanish REITs and hotel names.", "tweetA": "Spain is the eurozone's best growth story and just had its first general strike in 14 years, over rent. When GDP growth and housing affordability move in opposite directions, the politics follow housing. $EWP", "tweetB": "Housing is the new wage negotiation. Spain, Canada, Australia, the UK: the inflation that people actually protest is rent, not CPI. Central banks targeting CPI are missing the number voters care about.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://pressurepoint.whatsthelatest.ai/archive/the-pressure-point-economic-pressure-turns/"}, {"id": 31, "cat": "regulation", "urgency": "watch", "source": "Michael McDonough / The Pressure Point", "title": "Mississippi Senate seat in play; Hegseth impeachment fails by 7 with 11 Dems absent", "idea": "Mississippi's Senate race is unresolved, with Democrat Scott Colom narrowly ahead of Republican incumbent Cindy Hyde-Smith (CBS). Separately, eleven Democrats missed a procedural vote on impeaching Defense Secretary Hegseth, letting Republicans defeat it by seven votes (Guardian).", "angle": "Every extra Senate seat changes the math on export controls, the Nvidia investigations and defense appropriations next year. A Democratic Mississippi seat would be a strong signal about the midterm's breadth.", "tweetA": "A Democrat leading in Mississippi is the clearest sign of how big the midterm wave was. Every extra Senate seat is another vote for chip export limits and Nvidia subpoenas in January. $NVDA", "tweetB": "Eleven Democrats skipped the Hegseth impeachment vote and it failed by seven. The new majority hasn't even been sworn in and it's already showing it won't always turn out. Price Washington's January agenda accordingly.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://pressurepoint.whatsthelatest.ai/archive/the-pressure-point-economic-pressure-turns/"}, {"id": 32, "cat": "geopolitics", "urgency": "watch", "source": "Michael McDonough / The Pressure Point", "title": "Watch list: next Treasury Iran designations and Bessent on Iranian oil before Trump-Xi", "idea": "Fulcrum's watch items: whether the next Treasury Iran release names more oil intermediaries and whether officials appear under tighter security; whether Tehran explicitly links personal threats, oil restrictions and financial sanctions in the next indirect talks; and whether Bessent presses China on Iranian oil and financial channels before the expected Trump-Xi meeting later this month while publicly talking trade.", "angle": "China is the residual buyer of Iranian crude. A US-China understanding on Iranian oil would be the most bullish oil-supply-loss event of the year, and the most bearish thing for teapot refiners.", "tweetA": "The most important oil event this month might not be OPEC or Hormuz. It might be whether Trump and Xi trade tariffs for Iranian crude. Teapot refiners in Shandong are the ones exposed.", "tweetB": "Watch the sanctions list, not the talks. If Treasury names Chinese intermediaries the week before Trump-Xi, it's a negotiating chip. If it doesn't, the chip has already been traded.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://pressurepoint.whatsthelatest.ai/archive/the-pressure-point-economic-pressure-turns/"}, {"id": 33, "cat": "ai/infra", "urgency": "deep", "source": "Ben Pouladian / BEP Research", "title": "Pouladian: Nvidia without Jensen is the Apple-after-Jobs question", "idea": "Ben Pouladian, a longtime Nvidia bull who has spent time with its executives and supply chain, says the WSJ reports the board is preparing to decide Huang's future after a second reported relationship. He compares it to the uncertainty when Steve Jobs was diagnosed with cancer and later died: could a visionary-founder company continue without him? Apple did. His view: Nvidia's deep bench, ecosystem and products customers rely on are bigger than any one person, though volatility may be ahead.", "angle": "The Apple analogy is the bull counterweight. Note Apple had Tim Cook as a visible operator for years, and Nvidia has no named successor (per Innes). The analogy only works if the board names a credible COO-type quickly.", "tweetA": "Apple survived Jobs because Tim Cook had been running operations in plain sight for a decade. Who is Nvidia's Tim Cook? If nobody can name one, the Apple analogy is wishful thinking. $NVDA", "tweetB": "Apple's stock drew down about 40%+ from its 2012 high in the years right after Jobs, then compounded for a decade. Even if you believe the Apple analogy, it says to buy the second drawdown, not the first.", "charts": {"count": 0, "hot": false, "desc": "Links a short YouTube video comparing Nvidia to Apple post-Jobs."}, "link": "https://newsletter.bepresearch.com/"}, {"id": 34, "cat": "ai/infra", "urgency": "red", "source": "Stephen Innes / Dark Side of the Boom (Nvidia succession)", "title": "NVDA -8% after hours: WSJ says the board is preparing to remove Jensen Huang", "idea": "After Wednesday's close, the WSJ reported Nvidia's board is preparing to consider removing Huang after two reported affairs: one with a woman US intelligence suspects of working for China (Megaspeed's Alice Huang), and one allegedly with VP of healthcare Kimberly Powell (NYT, from former employees, unverified by Reuters). Shares fell about 8% after hours. Huang has said he's skeptical of conventional succession planning. Nvidia's own filings flag dependence on its longtime executives. Earnings are Nov 17. Independent directors said Nov 8 they had no reason to believe secrets were compromised.", "angle": "This is a pure multiple event, not an earnings event. The Nov 17 print might be strong and still not hold if there's no CEO. Straddles are rich, but the board-meeting timing is a binary nobody can model.", "tweetA": "Nvidia reports Nov 17. The Anthropic IPO prices Nov 18. Nvidia's board may fire its founder before either. The AI trade's three biggest catalysts of the quarter are landing in the same week. $NVDA", "tweetB": "Huang said he didn't believe in conventional succession planning. It works until it doesn't, and the board now has to pick a successor under pressure in a week. Even with great results, the market will charge a premium for that.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/nvidias-succession-nightmare-the"}, {"id": 35, "cat": "regulation", "urgency": "watch", "source": "Stephen Innes / Dark Side of the Boom (Nvidia succession)", "title": "Megaspeed and the chip-diversion probe: the scandal becomes a Washington-Beijing problem", "idea": "Megaspeed, the Singapore-based firm tied to Alice Huang, has faced scrutiny over whether advanced Nvidia chips were diverted to Chinese customers. Nothing is established and there's no evidence Huang knowingly disclosed anything, but the probe adds uncertainty that 'cannot be reduced to a quarterly earnings forecast,' alongside intensifying congressional scrutiny on both sides of the Pacific.", "angle": "Even an exonerated Huang leaves Nvidia's Singapore and Southeast Asian distribution channel under a microscope. Watch Singapore's share of Nvidia revenue in the 10-Q. That's where diversion risk shows up.", "tweetA": "Singapore has been one of Nvidia's biggest 'billing' regions for years. Megaspeed is a Singapore company. Any export-compliance crackdown starts with the line item that's been hiding in plain sight.", "tweetB": "The real cost of the scandal isn't the CEO. It's the loss of the benefit of the doubt in Washington. Every Southeast Asia shipment now gets audited as if it were going to Shenzhen.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/nvidias-succession-nightmare-the"}, {"id": 36, "cat": "positioning", "urgency": "deep", "source": "Daily Chartbook / DC Lite #719", "title": "Robinhood single-stock net buying Tuesday: third-highest ever, behind only SpaceX IPO day", "idea": "Per Sherwood's Luke Kawa, Robinhood traders 'fought the Fed' by buying the dip. Net daily single-stock purchases Tuesday were the third highest on record, trailing only June 12 (SpaceX IPO day) and September 23.", "angle": "The #1 day on record was a mega-IPO. The Anthropic IPO lands next week with a big retail allocation. A new #1 is likely, and retail cash buying the dip now is cash that has to be raised later for ANT.", "tweetA": "Record #1 for Robinhood buying was SpaceX IPO day. #3 was this Tuesday, into a hot CPI. Anthropic prices next week with a big retail allocation. Retail is putting cash to work now, and some of it may get sold to fund ANT. $HOOD", "tweetB": "Retail buying at near-record levels the day after a hot CPI with hikes priced for 2027. Either retail has learned the Fed doesn't matter for AI, or this is the last of the dip-buying cash.", "charts": {"count": 1, "hot": false, "desc": "Robinhood net daily single-stock purchases, record days annotated."}, "link": "https://www.dailychartbook.com/p/gpus-are-melting-c564"}, {"id": 37, "cat": "positioning", "urgency": "deep", "source": "Daily Chartbook / DC Lite #719", "title": "SPY could go sideways for 69 sessions at the bottom of its range and the 200DMA would still rise", "idea": "Grant Hawkridge: SPY could trade sideways between $730 and $780 for the next 69 sessions, and its 200-day moving average would keep rising every day, even if every close was at $730.", "angle": "That 200DMA cushion means trend-following CTAs stay long through a lot of chop. It also means a break below $730 would trigger trend signals into a rising average, which is when the forced selling would start.", "tweetA": "The 200-day moving average will rise for 69 straight sessions even if SPY closes at the bottom of its range every day. Trend models stay long whatever happens. That makes $730 the line that matters. Below it, the systematic selling starts.", "tweetB": "A rising 200DMA under a sideways market is the CTA version of a calm VIX: it shows trend, not risk. The longer the range lasts, the bigger the gap between price and trend models when it breaks. $SPY", "charts": {"count": 1, "hot": false, "desc": "SPY vs 200DMA projection under a sideways scenario."}, "link": "https://www.dailychartbook.com/p/gpus-are-melting-c564"}, {"id": 38, "cat": "ai/infra", "urgency": "deep", "source": "Daily Chartbook / DC Lite #719", "title": "Ramp AI Index: top 1% of firms spend a median $10.2K per employee per month on AI", "idea": "Per Ramp's Ara Kharazian, AI spending hit a new peak in October, +1.65% vs September. The top 1% of spenders now spend a median $10.2K per employee per month (+9%). The top 10% spend $801 (roughly flat). The median firm spends $16.32 (+$0.93).", "angle": "That's a 625x gap between the top 1% and the median firm, so AI adoption is power-law, not broad. Revenue for Anthropic and OpenAI is coming from the heavy users. The median company is barely started, which is either a huge runway or a sign adoption has stalled outside the frontier.", "tweetA": "The top 1% of firms spend $10.2K per employee per month on AI, about $122K a year, more than many of those employees earn. The median firm spends $16. AI isn't diffusing across companies. It's concentrating in a few.", "tweetB": "Top 1%: $10,200 a month per head. Median: $16.32. A 625x gap. The bull case for AI labs is the median catching up, but the median only grew 6% last month. The growth is coming from the top 1% spending more.", "charts": {"count": 1, "hot": true, "desc": "Ramp AI Index: spend per employee by firm percentile; top 1% at $10.2K/month vs median $16.32."}, "link": "https://econlab.substack.com/p/ai-index-nov-2026"}, {"id": 39, "cat": "ai/infra", "urgency": "red", "source": "Daily Chartbook / DC Lite #719", "title": "'GPUs are melting': B200 rental at $6.97/hr, H100 $3.06/hr, both all-time highs", "idea": "Per Silicon Data, the on-demand B200 index rose 1.9% to a record $6.97 on Nov 10 and the H100 index 1.7% to a record $3.06. B300 ($7.68), H200 ($3.48) and A100 ($1.59) were unchanged but near all-time highs. 'Recent price surges point to a clear demand inflection.'", "angle": "This undercuts the GPU-residual-value bear case (Innes on CoreWeave). A six-year-old A100 still rents near its all-time high. It supports neocloud collateral values and the IG-financing bid for $CRWV.", "tweetA": "A100s launched in 2020 and still rent at $1.59 an hour, near their all-time high. The bear case on neocloud debt is that old GPUs are worthless. The rental market says they aren't, at least not yet. $CRWV $NBIS", "tweetB": "H100 at $3.06/hr comes to about $26.8K a year at full utilization, roughly a year's payback on purchase price. Rental prices at record highs while Nvidia stock goes to 52-week lows: the demand data and the stock are telling different stories.", "charts": {"count": 1, "hot": true, "desc": "Silicon Data on-demand GPU rental indices (B200, B300, H100, H200, A100), B200 and H100 at new highs."}, "link": "https://x.com/silicondata/status/2120498814591123545"}, {"id": 40, "cat": "positioning", "urgency": "red", "source": "Daily Chartbook / DC Lite #719", "title": "Polymarket odds of Jensen Huang out by Dec 31 spike after the second-affair report", "idea": "Prediction-market odds that Huang resigns or is removed as Nvidia CEO by December 31 spiked after the WSJ broke the second-affair story after hours.", "angle": "Polymarket is now the real-time pricing tool for a corporate governance event. Watch it as a leading indicator for NVDA overnight and pre-market moves before the board meeting.", "tweetA": "There's a liquid market on whether the CEO of the world's most important chip company keeps his job by New Year's, and it moves faster than the stock does after hours. Governance risk has a live price now. $NVDA", "tweetB": "Use the Polymarket odds as a hedge ratio. If removal odds go above 50% and NVDA is only down 8%, either the market thinks Nvidia doesn't need Jensen or the stock hasn't caught up yet.", "charts": {"count": 1, "hot": false, "desc": "Polymarket 'Jensen Huang resignation or removal by Dec 31' odds chart, spiking after hours."}, "link": "https://polymarket.com/event/jensen-huang-announced-resignation-or-removal-by-december-31"}];

var fc='all',fu='all',fs=null;

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '\u2713 Copied';
  setTimeout(function() { btn.textContent = '\ud83d\udccb Copy'; }, 1500);
}

  document.getElementById('cats').innerHTML=h;
  var u='';[['all','All'],['red','\ud83d\udd34 Act Now'],['deep','\ud83d\udd35 Deep'],['watch','\ud83d\udfe1 Watch']].forEach(function(x){

    +'<div class="lbl">The Idea</div><div>'+esc(item.idea)+'</div>'

    +'<div class="tw"><div><div class="lbl" style="color:#378add">TWEET A</div>'+esc(item.tweetA)+'<br>'
    +'<button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">\ud83d\udccb Copy</button></div>'
    +'<div><div class="lbl" style="color:#7f77dd">TWEET B</div>'+esc(item.tweetB)+'<br>'
    +'<button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">\ud83d\udccb Copy</button></div></div>'
    +'<div class="lbl">Charts</div><div class="chart'+(item.charts.hot?' hot':'')+'">'+(item.charts.hot?'\ud83d\udd25 CHART WORTH SAVING \u2014 ':'')+(item.charts.count>0?item.charts.count+' chart(s): ':'')+esc(item.charts.desc||'No chart noted in email text')+'</div>'
    +'<div style="margin-top:10px"><a href="'+item.link+'" target="_blank" rel="noopener">\u2197 Read full article</a></div></div></div>';
  });

}

}
