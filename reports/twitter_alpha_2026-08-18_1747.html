<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Twitter Alpha Intelligence</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root {
  --bg: #faf8f5;
  --surface: #ffffff;
  --border: #e8e3da;
  --border-light: #f0ede4;
  --text: #1a1a1a;
  --text-2: #555;
  --text-3: #8a8a8a;
  --accent: #1a8cd8;
  --red: #d94052;
  --yellow: #fff5b3;
  --yellow-border: #f0d966;

  /* category colors (per spec) */
  --cat-macro: #2563eb;        /* blue */
  --cat-crypto: #8b5cf6;       /* purple */
  --cat-energy: #dc2626;       /* red */
  --cat-tech: #0d9488;         /* teal */
  --cat-ai: #4f46e5;           /* indigo */
  --cat-geopolitics: #dc2626;  /* red */
  --cat-positioning: #15803d;  /* green */
  --cat-regulation: #7c3aed;   /* purple */
  --cat-society: #d97706;      /* amber */
  --cat-em: #059669;           /* green */
  --cat-default: #6b7280;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; line-height: 1.55;
       background: var(--bg); color: var(--text); }
.container { max-width: 960px; margin: 0 auto; padding: 24px 16px 80px; }

/* HEADER */
.header { display: flex; justify-content: space-between; align-items: baseline;
          border-bottom: 2px solid var(--text); padding-bottom: 12px; margin-bottom: 20px; }
.title { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
.subtitle { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-3); }

/* FILTER BAR */
.filter-bar { display: none; background: var(--yellow); border: 1px solid var(--yellow-border);
              border-radius: 6px; padding: 8px 12px; margin-bottom: 16px;
              align-items: center; gap: 10px; font-size: 13px; }
.filter-bar.active { display: flex; }
.filter-bar button { font-family: inherit; font-size: 12px; background: transparent;
                     border: 1px solid var(--text); padding: 3px 10px; border-radius: 4px;
                     cursor: pointer; }
.filter-bar button:hover { background: rgba(0,0,0,0.05); }

/* SUMMARY */
.summary { background: var(--surface); border: 1px solid var(--border);
           border-left: 4px solid var(--red); border-radius: 6px;
           padding: 16px 18px; margin-bottom: 20px; }
.summary p { margin-bottom: 8px; }
.summary p:last-child { margin-bottom: 0; }
.summary strong { font-weight: 600; }

/* SECTIONS */
.section { background: var(--surface); border: 1px solid var(--border);
           border-radius: 6px; margin-bottom: 14px; overflow: hidden; }
.section-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px;
                background: #f3efe6; cursor: pointer; user-select: none;
                font-weight: 600; font-size: 13px; }
.section-head:hover { background: #ebe6dc; }
.section-letter { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
                  color: var(--text-3); min-width: 18px; }
.section-name { flex: 1; }
.section-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
                 color: var(--text-3); }
.section-arrow { font-size: 10px; color: var(--text-3); transition: transform .2s; }
.section.open .section-arrow { transform: rotate(90deg); }
.section-body { display: none; padding: 6px 0; }
.section.open .section-body { display: block; }

/* CLUSTER (Section A) */
.cluster { padding: 14px 16px; border-bottom: 1px solid var(--border-light); }
.cluster:last-child { border-bottom: none; }
.cluster-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
                flex-wrap: wrap; }
.cluster-title { font-weight: 600; font-size: 14px; }
.cluster-desc { color: var(--text-2); font-size: 13px; margin: 0 0 10px 0; }
.cluster-items { display: flex; flex-direction: column; gap: 8px; padding-left: 10px;
                 border-left: 2px solid var(--border-light); }
.cluster-item { font-size: 13px; padding: 6px 8px; border-radius: 4px; }
.cluster-item .item-text { font-size: 13px; margin-top: 4px; }
.cluster-item .item-head { font-size: 12px; }

/* ITEM CARDS (Sections B/C/D) */
.item-card { background: var(--surface); border: 1px solid var(--border);
             border-radius: 6px; padding: 12px 14px; margin: 10px 16px; }
.item-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
             flex-wrap: wrap; }
.item-author { font-weight: 600; color: var(--accent); cursor: pointer; }
.item-author:hover { text-decoration: underline; }
.item-time { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--text-3); }
.item-link { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--accent); text-decoration: none; }
.item-link:hover { text-decoration: underline; }
.item-text { font-size: 13.5px; line-height: 1.6; color: var(--text);
             white-space: pre-wrap; word-wrap: break-word; }
.item-thread { display: inline-block; font-size: 10px; font-weight: 600;
               background: var(--border); color: var(--text-2); padding: 1px 6px;
               border-radius: 3px; text-transform: uppercase; letter-spacing: .04em; }

/* CONTRARIAN (Section C) — red left border + soft red bg */
.section-contrarian .item-card {
  border-left: 4px solid var(--red);
  background: #fdf6f7;
}

/* CATEGORY PILLS */
.pill { display: inline-block; font-family: 'IBM Plex Mono', monospace; font-size: 10px;
        font-weight: 500; padding: 2px 7px; border-radius: 3px; color: #fff;
        text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }

/* IMAGES */
.thumbs { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.thumb { height: 100px; border: 1px solid var(--border); border-radius: 4px;
         cursor: zoom-in; background: #f0ede4; }

/* LIGHTBOX */
.lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85);
            align-items: center; justify-content: center; z-index: 100; cursor: zoom-out; }
.lightbox.open { display: flex; }
.lightbox img { max-width: 92vw; max-height: 92vh;
                box-shadow: 0 8px 40px rgba(0,0,0,.6); }

/* LINKS (Section E) */
.link-row { padding: 8px 16px; border-bottom: 1px solid var(--border-light);
            font-size: 13px; display: flex; gap: 12px; align-items: baseline; }
.link-row:last-child { border-bottom: none; }
.link-author { color: var(--text-3); min-width: 110px; cursor: pointer; }
.link-author:hover { color: var(--accent); }
.link-url { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
            color: var(--accent); text-decoration: none; word-break: break-all; flex: 1; }
.link-url:hover { text-decoration: underline; }
.link-desc { color: var(--text-2); font-size: 12px; }

/* AUTHOR FILTER STATES */
.filterable.match { background: var(--yellow); border-color: var(--yellow-border); }
.section-contrarian .item-card.filterable.match { background: var(--yellow); }
.filterable.dim { opacity: 0.25; }

/* STATS BAR */
.stats { margin-top: 24px; padding: 10px 14px; background: var(--surface);
         border: 1px solid var(--border); border-radius: 6px;
         font-family: 'IBM Plex Mono', monospace; font-size: 11.5px;
         color: var(--text-2); display: flex; gap: 18px; flex-wrap: wrap; }
.stats strong { color: var(--text); font-weight: 600; }

/* EMPTY */
.empty { color: var(--text-3); font-size: 13px; padding: 14px 18px; font-style: italic; }

/* RESPONSIVE */
@media (max-width: 640px) {
  .container { padding: 16px 12px 60px; }
  .item-card { margin: 8px 10px; }
  .link-row { flex-direction: column; gap: 4px; }
  .link-author { min-width: 0; }
  .header { flex-direction: column; align-items: flex-start; gap: 4px; }
}
</style>
</head>

<script>
const REPORT_DATA = {"report_type":"TWITTER ALPHA INTELLIGENCE","collected_at":"2026-08-18T17:20:55Z","input_stats":{"total_tweets":189,"unique_authors":68,"tweets_with_images":41,"after_noise_filter":93},"summary":"**Bonds are the story:** the US 30-year yield hit **5.30%**, its highest since 2007, with **Mohamed El-Erian**, **Peter Boockvar** and **Ed Bradford (Fullcarry)** all flagging a genuine structural buyer-base shift, **Jim Cramer** calling the selloff's \"relentlessness\" unnerving, and **Andreas Steno Larsen** pushing back that a steep curve is actually the mechanism funding the AI buildout, not a warning sign.\n\n**Robotics mania hit a new gear:** Unitree's IPO was **5,526x oversubscribed** per **Bluntz Capital** (long $BOT/$CCXI), with **Geiger Capital**, **Serenity (aleabitoreddit)**, **Citrini** and **0xSammy** all piling onto the embodied-AI thesis from different angles.\n\n**Strategy's STRC cap fight escalated:** **VIKTOR (thedefivillain)** laid out in exhaustive detail why Michael Saylor's $100 ceiling on STRC forces dilutive buy-high-sell-low behavior, while **Andy Constan** separately flagged that MSTR's BTC-plus-cash now exceeds the value of the rest of the balance sheet.\n\n**Geopolitics stayed hot but de-escalated on the surface:** Trump said there are no Iran talks scheduled and the Strait of Hormuz is clear, per **Javier Blas**, and **Delphi Digital**'s Scott Freeman argued the Iran-induced global growth scare is largely behind us.\n\n**Crypto regulation and Ethereum monetary policy both moved:** **Laura Shin**'s DEX in the City covered the CFTC's rare emergency-power use against Kalshi and a fresh **EIP-8363** fight over burning ETH staking issuance to zero, opposed by Aave, Lido, Ether.fi and SharpLink.\n\n**AI-model sentiment soured:** **Raoul Pal**, **Jason Choi** and **Dan Tapiero** all separately reported Claude's quality dropping and rolled back to older versions, even as **Etched** closed a **$700M raise at a $21B valuation** with **Patrick O'Shaughnessy** and **Mike Novogratz** cheering from the sidelines.\n\n**Not everyone is bullish crypto:** **Stacy Muur** asked point-blank whether anything genuinely bullish has happened this cycle, a useful counterweight to **Crypto_McKenna**'s explicit BTC calls and **Aylo**'s cycle-compounding thesis.","sections":{"A_events":[{"cluster":"Iran/Hormuz — Trump Says No Talks Scheduled, Strait Open","category":["geopolitics","energy"],"items":[{"author":"JavierBlas","summary":"Trump posted that there are \"no talks or conversations going on, or scheduled, with Islamic Republic of Iran,\" adding the Strait of Hormuz is open and all water mines have been removed or detonated.","tweet_url":"https://x.com/JavierBlas/status/2089714211525988672","images":[],"type":"tweet"},{"author":"JavierBlas","summary":"Follow-up: many Iranians would reportedly welcome Trump referring to the waters as the \"Persian Gulf\" rather than the \"Arabian Gulf\" — a small but symbolically loaded naming choice.","tweet_url":"https://x.com/JavierBlas/status/2089680648902431050","images":["https://pbs.twimg.com/media/HQAJeX8W0AAzYhR.jpg"],"type":"tweet"},{"author":"jimcramer","summary":"Reacting to the Hormuz statement: \"President says Strait of Hormuz is open. Bonds go positive.\"","tweet_url":"https://x.com/jimcramer/status/2089711644326736339","images":[],"type":"tweet"},{"author":"Delphi_Digital","summary":"Complementary macro read: Delphi strategist Scott Freeman says the firm's ~190-input global growth model is back above 50, \"confirming the Iran-induced growth slowdown was mild and is likely behind us.\"","tweet_url":"https://x.com/Delphi_Digital/status/2089731647960674643","images":[],"type":"thread"}]},{"cluster":"Global Bond Selloff — 30-Year Yield Hits 5.30%, Highest Since 2007","category":["macro"],"items":[{"author":"Geiger_Capital","summary":"US 30-year yield hit 5.30% for the first time since 2007 (\"long end is melting down\"); separately flagged new YTD highs on both the 10-year and 30-year, sarcastically noting \"at least we're back in the Middle East,\" and resurfaced his own debt-crisis writeup as yields keep climbing.","tweet_url":"https://x.com/Geiger_Capital/status/2089710281421180997","images":["https://pbs.twimg.com/media/HQAkUzvWEAEKQNz.jpg"],"type":"tweet"},{"author":"jimcramer","summary":"Called the bond selloff's \"relentlessness... unnerving. We are not seeing any let up,\" then noted \"5.31% isn't that bad for 20-year paper... if there weren't so much behind it,\" and later flagged the \"nice flip in rates... catching everyone offsides... consumer seems strong.\"","tweet_url":"https://x.com/jimcramer/status/2089645312512032918","images":[],"type":"tweet"},{"author":"elerianm","summary":"Said higher bond yields have \"decisively evolved into a global phenomenon,\" driven by massive corporate/government issuance and now spilling across borders; a companion post argued this cycle differs from past ones because G7 economies (France, Japan, UK) are now as exposed as developing markets, and the drivers (issuance supply, oil) are less responsive to central-bank policy than usual.","tweet_url":"https://x.com/elerianm/status/2089696565938061691","images":["https://pbs.twimg.com/media/HQAUrBAXgAA06QH.png"],"type":"tweet"},{"author":"pboockvar","summary":"Shared a chart (via Adam Josephson) showing the bond bear market is global, reflecting how foreign governments and central banks are now treating their US Treasury holdings.","tweet_url":"https://x.com/pboockvar/status/2089684354444271758","images":["https://pbs.twimg.com/media/HQAMybmWIAARzkT.jpg"],"type":"tweet"},{"author":"Fullcarry","summary":"In a reply thread, argued the structural driver is a shift in the Treasury buyer base from price-insensitive to price-sensitive, tax-paying investors — meaning net outflows as rates rise aren't as dire as feared, even though fiscal deficits remain on an unsustainable path.","tweet_url":"https://x.com/Fullcarry/status/2089695321219559477","images":[],"type":"thread"},{"author":"BobEUnlimited","summary":"Posted a chart with the dry observation \"nice timing for macro funds to max out their bond short\" — implying systematic/macro positioning piled into shorts right as the move matured.","tweet_url":"https://x.com/BobEUnlimited/status/2089747973773185178","images":["https://pbs.twimg.com/media/HQBGtQTXIAEUmth.jpg"],"type":"tweet"},{"author":"fejau_inc","summary":"Pushed back on doom framing of the yield spike: \"Normalization not OMG end of dollar hegemony,\" in response to a chart arguing current long-end pricing isn't historically unusual.","tweet_url":"https://x.com/fejau_inc/status/2089723587045511243","images":[],"type":"tweet"},{"author":"qthomp","summary":"One-liner tying the move to policy: \"The next few weeks are going to be Bessent's most difficult challenge yet.\"","tweet_url":"https://x.com/qthomp/status/2089728141023420616","images":[],"type":"tweet"}]},{"cluster":"Robotics Mania — Unitree IPO Oversubscribed 5,526x","category":["tech"],"items":[{"author":"Bluntz_Capital","summary":"Unitree's IPO was 5,526x oversubscribed. Argues demand for robotics exposure vastly exceeds public supply since nearly every serious humanoid company (Figure, Apptronik, 1X) is private, so demand crushes into the few listed proxies — $BOT trades at 2.9x last reported NAV, $CCXI at a 70% premium to trust ahead of its Agility Robotics deal even closing. Long both.","tweet_url":"https://x.com/Bluntz_Capital/status/2089764511993724967","images":[],"type":"tweet"},{"author":"Geiger_Capital","summary":"\"No one is ready for the Robotics bull run. AI is simply the mind. It needs a body to operate in the real world\" — repeated the thesis twice today with a supporting image.","tweet_url":"https://x.com/Geiger_Capital/status/2089695514581143925","images":[],"type":"tweet"},{"author":"aleabitoreddit","summary":"Unitree claims its humanoids now run faster than Usain Bolt and jump higher than any human; with the IPO landing, argues China is leading the hardware race. Distinguishes use cases: $CCXI targets warehouse/logistics automation (Amazon, MercadoLibre), Boston Dynamics is closest peer on capability, Tesla's general-purpose ambitions aren't there yet, and flags component suppliers (Harmonic, LeaderDrive, Schaeffler — working with ~45 humanoid players) as picks-and-shovels exposure.","tweet_url":"https://x.com/aleabitoreddit/status/2089746797300432912","images":["https://pbs.twimg.com/media/HQBFGf1aQAIaETY.jpg","https://pbs.twimg.com/media/HQBFKcra4AA-6yS.jpg","https://pbs.twimg.com/media/HQBN9o3asAA90NH.jpg"],"type":"thread"},{"author":"citrini","summary":"An analyst visiting robotics companies this week sent a photo captioned \"Would you swallow this robot?\" — light color on the pace of on-the-ground robotics diligence happening right now.","tweet_url":"https://x.com/citrini/status/2089744013976826195","images":["https://pbs.twimg.com/media/HQBDGwVW4AA_f7x.jpg"],"type":"tweet"},{"author":"0xSammy","summary":"Long thread arguing robotics is the obvious next innovation cycle: once consumer robots hit affordable price points, the resulting data-collection flywheel drives step-change improvements in embodied AI. Flags the crypto-side angle — tokenized private robotics equities coming onchain, DePIN networks (GEODNET, BitRobotNetwork) repurposing for robotics data, and privacy as an adjacent vertical worth positioning in early.","tweet_url":"https://x.com/0xSammy/status/2089728081044849012","images":[],"type":"thread"}]},{"cluster":"Strategy's STRC Capital Structure Fight — Saylor Doubles Down on the $100 Cap","category":["crypto","positioning"],"items":[{"author":"thedefivillain","summary":"In response to Saylor defending Strategy's policy of capping STRC at $100 (rather than squeezing shorts), argues this is a bad idea: capping at exactly $100 gives short sellers a free trade between $99–$100 with zero drawdown, forces Strategy to sell BTC/MSTR at depressed prices to defend the peg (dilutive, not accretive), and makes the ~10% volatility swings land entirely on the downside ($90–$100) instead of symmetrically ($95–$105). Proposes letting STRC float above $100 (to ~$105) so uncertainty cuts both ways; says he'll write a full article on it. A lengthy follow-up reply thread reiterates the same math against a rebuttal, walking through why buybacks below $100 aren't the real issue — the capped ceiling is.","tweet_url":"https://x.com/thedefivillain/status/2089682512469450936","images":[],"type":"thread"},{"author":"dampedspring","summary":"Separately on the same instrument: notes MSTR's BTC-plus-fiat-cash is currently worth more than the rest of the balance sheet, and argues it's better to sell BTC to buy back STRC (or raise fiat cash) than to keep issuing more stock — though he doesn't think that's the plan.","tweet_url":"https://x.com/dampedspring/status/2089760513601262045","images":["https://pbs.twimg.com/media/HQBSG8mWsAArRF7.png"],"type":"tweet"}]},{"cluster":"Ethereum's EIP-8363 — Researchers Propose Burning Staking Issuance to Zero","category":["crypto","regulation"],"items":[{"author":"laurashin","summary":"Six researchers proposed EIP-8363, which would burn a rising share of validator rewards as the ETH staking ratio climbs so issuance falls toward zero until the market finds equilibrium. Aave, Lido, Ether.fi and SharpLink lined up in opposition within 48 hours. Co-author @jdetychey explained the mechanism is meant to let the market find equilibrium as staking ratio rises; @OisinKyne (who runs an opposing staking company) said his core objection is the curve's path to zero itself. All joined Shin's DEX in the City show to debate it live.","tweet_url":"https://x.com/laurashin/status/2089758196705402910","images":[],"type":"thread"}]},{"cluster":"Prediction Markets & CFTC Emergency Powers — Kalshi vs. New York","category":["regulation"],"items":[{"author":"laurashin","summary":"Covered on DEX in the City: the CFTC's emergency order power has been invoked six times in history — two of them in the last month alone, both for Kalshi — a power historically reserved for market-catastrophe events. Guest Jacob Robinson frames the core dispute as states calling Kalshi's contracts \"bets\" while exchanges insist \"these might look like bets, but they're actually exchanges,\" predicting the fight lands at the Supreme Court; a second guest argues the real question is who's actually harmed — residents, or the tribes/gaming commissions that hold current licensing power. The same episode also covered a new White House memo suggesting private US companies can legally \"hack back\" against cyberattacks, and criticized the EU's new forced AI-content watermarking rules as \"a hammer when you need a scaffold\" that won't stop scam targeting of less tech-savvy users.","tweet_url":"https://x.com/laurashin/status/2089737811444527228","images":["https://pbs.twimg.com/media/HQA9dxsbMAA690L.jpg"],"type":"thread"}]},{"cluster":"Etched Raises $700M at $21B Valuation","category":["tech","AI"],"items":[{"author":"patrick_oshag","summary":"After spending several days onsite, calls Etched's culture the most exciting and energizing business environment he's experienced, endorsing the team behind the raise (Jane Street, Kleiner Perkins, Sequoia, a16z, Peter Thiel, BCV, Blackstone) and its first rack shipment to Jane Street.","tweet_url":"https://x.com/patrick_oshag/status/2089733991431643510","images":[],"type":"tweet"},{"author":"novogratz","summary":"\"In awe of how fast these guys are growing and executing. Glad that Galaxy is along for the ride!\" — confirming Galaxy Digital's participation in the round.","tweet_url":"https://x.com/novogratz/status/2089759183344422931","images":[],"type":"tweet"},{"author":"stevehou","summary":"Congratulated a colleague involved with the deal: \"Unfair advantage... you were born for this moment!\"","tweet_url":"https://x.com/stevehou/status/2089736019818029405","images":[],"type":"tweet"}]},{"cluster":"Claude/Anthropic Model Backlash — Users Say Opus 5 Regressed","category":["AI"],"items":[{"author":"RaoulGMI","summary":"\"I just gave up with Opus 5 and went back to 4.8 which is solid\" — a direct downgrade after finding the newer model worse in practice.","tweet_url":"https://x.com/RaoulGMI/status/2089751018200355202","images":[],"type":"tweet"},{"author":"mrjasonchoi","summary":"Quoting a complaint that Claude has become \"basically unusable\" with users switching to Grok/ChatGPT, adds his own read: \"Claude overcorrected from obsequious servant to condescending overlord. We just want a helpful assistant man.\"","tweet_url":"https://x.com/mrjasonchoi/status/2089571968026849744","images":[],"type":"tweet"},{"author":"DTAPCAP","summary":"Echoed the same sentiment directly at Raoul Pal and Anthropic: \"Surprised it's gotten so bad so quickly.\"","tweet_url":"https://x.com/DTAPCAP/status/2089568967094362623","images":[],"type":"tweet"},{"author":"cryptopunk7213","summary":"Notes a successor model, \"Fable 5.1,\" is already being greyscale-tested for a subset of accounts on Claude Web/Code — likely to launch alongside a new OpenAI model (\"Astra\") given the pace both labs are shipping at.","tweet_url":"https://x.com/cryptopunk7213/status/2089750383778304405","images":[],"type":"tweet"}]}],"B_insights":[{"author":"dampedspring","summary":"Detailed historical explainer on gamma exposure (GEX) and options-driven pinning: Andy Constan traces awareness of concentrated-strike dynamics (one side delta-hedging, the other holding to expiration) back to 1988's Texaco convertible bonds, notes strike-concentration modeling was table stakes at every derivatives desk (Salomon, Hull/Goldman, Morgan Stanley, convert desks) by the late 1980s–90s, and credits \"Lemon\" with popularizing the modern \"GEX\" branding — not inventing the underlying concept. His point: nothing about GEX is new; it's decades-old market microstructure knowledge that got commoditized and packaged with new data tooling.","tweet_url":"https://x.com/dampedspring/status/2089653990292082975","images":[],"type":"tweet"},{"author":"patrick_oshag","summary":"From his interview with Ben Thompson (Stratechery): Thompson argues it would be \"very problematic for the US to win the AI race\" outright — if AI translates into decisive military superiority, the game-theory-optimal Chinese response is to strike TSMC, so total US independence from China (\"who cares if they take Taiwan\") is fantastical thinking. He sees a disconnect between Silicon Valley's rhetoric and this reality. The full 80-minute conversation also covers AI's funding problem, whether Google is becoming Berkshire Hathaway, Nvidia's invisible price cuts, and what survives an AI bubble.","tweet_url":"https://x.com/patrick_oshag/status/2089729033198285001","images":[],"type":"tweet"},{"author":"thedefiedge","summary":"Deep dive on Robinhood Chain: did $3.6M in July revenue (more than Base and Arbitrum combined) and TVL went from $39M to nearly $1B in six weeks — but argues almost everything is \"rented.\" Memecoins are 51% of spot volume vs. 5% for tokenized stocks; ~$600M in stablecoins is mostly fast-rotating Ethena USDe yield capital; and Robinhood is subsidizing everyone's gas for 90 days. The real edge isn't the tech (forkable Arbitrum stack) but distribution — 28M brokerage customers not yet onchain, blocked because stock tokens are illegal to sell to Americans and the SEC hasn't written rules yet (Robinhood has lobbied with a 42-page proposal). Watches daily active accounts (peaked July 16, unlike transaction counts) as the real signal, and leans bullish that Robinhood becomes \"the next Solana\" once the SEC unlocks tokenized equities domestically.","tweet_url":"https://x.com/thedefiedge/status/2089668690233229629","images":["https://pbs.twimg.com/media/HP_-mPhagAEaVeb.jpg"],"type":"tweet"},{"author":"nic_carter","summary":"Argues the \"degrowth left\" applies an impossible standard to AI datacenters: criticized for drawing grid power (\"driving up prices\") and criticized again for going off-grid (\"hoarding scarce turbines\") — the same pattern seen historically with Bitcoin mining. Concedes datacenters can cause some short-term rate-payer price increases in constrained grids (which should signal more capacity build-out) but argues hyperscalers could simply cover those costs, and that water/pollution objections are largely specious versus the more legitimate concern of job displacement, which critics rarely state honestly.","tweet_url":"https://x.com/nic_carter/status/2089736913511239887","images":[],"type":"thread"},{"author":"zriboua","summary":"In a piece on her Substack, argues Turkey is using Syria's realignment to deepen ties with Iraqi factions (KDP, Sunni Arab groups) drifting from Iranian patronage — and that Ankara's upstream control of the Tigris and Euphrates gives it decisive leverage over Iraq's water supply regardless of Baghdad's politics. Separately endorsed a quote on Zimbabwe's Mugabe-era land seizures as a cautionary tale about \"third-worldist\" ideology (\"the beauty of multiculturalism,\" sarcastically, in a related reply), and welcomed news that Saudi textbooks are removing antisemitic/extremist content as \"wonderful.\"","tweet_url":"https://x.com/zriboua/status/2089740055262679321","images":["https://pbs.twimg.com/media/HQA_YQiWEAAQ1ri.jpg"],"type":"tweet"},{"author":"DefiIgnas","summary":"Notes Vitalik predicted Farcaster/Lens wouldn't be deserted within a year — both were, by their own founding teams (Lens effectively dead/merged, Farcaster hunting for a new owner), though Vitalik himself keeps posting on Farcaster. Separately complains about a recurring pattern: strong products whose teams neglect the token (thin CEX/DEX liquidity, no revenue-share roadmap), usually because the token was just a fundraising vehicle with separate equity investors already made whole — in that setup, he says, memecoins end up looking more honest since \"the token and price are the product.\"","tweet_url":"https://x.com/DefiIgnas/status/2089662616721571922","images":["https://pbs.twimg.com/media/HP_5E33acAAaqZI.jpg","https://pbs.twimg.com/media/HP_5FxNa4AAzGq6.jpg"],"type":"thread"},{"author":"Bluntz_Capital","summary":"Thesis: \"the moats in AI were never in the code, they're in the atoms, not the bits\" — every layer of the AI stack (models, IDEs, harnesses, app builders, wrappers) is commoditized software with no moat, so the market is pricing SpaceX at $1.8T purely as a space company when it actually owns the only reusable-rocket business plus Starlink plus a frontier AI lab (post-xAI merger) plus orbital datacenters plus its own chip fab — a full silicon-to-orbit stack no other company, including Google, Microsoft or Anthropic, owns.","tweet_url":"https://x.com/Bluntz_Capital/status/2089692286120816751","images":[],"type":"tweet"},{"author":"alpha_pls","summary":"Argues this is the first crypto cycle where projects compound on real product-market fit and revenue rather than rotating narratives; frames the current moment as roughly five years past crypto's own dot-com crash (2021, echoing 2021-era pets.com-style busts like Pixelmon/metaverse land). Sees tokenization as a mega-trend now driven by institutional \"suits,\" alongside a cypherpunk-ethos revival (Zcash, Bittensor, Venice) and Bitcoin's ongoing bid against government money-printing.","tweet_url":"https://x.com/alpha_pls/status/2089751748051181677","images":["https://pbs.twimg.com/media/HQBJqc-XwAAvppL.png"],"type":"tweet"},{"author":"jvisserlabs","summary":"Ties together two separate lines from Stripe (\"tokens are the new dollars,\" on agentic payments) and Jensen Huang (\"in the AI economy, compute is revenue\") into a single thesis: money → compute → intelligence → output is the new AI economy loop, breaking the old link between economic output and human time, and calls this the start of an \"AI Macro Nexus\" where AI and crypto formally merge into an agentic speed economy.","tweet_url":"https://x.com/jvisserlabs/status/2089715486934130906","images":["https://pbs.twimg.com/media/HQAokjHXIAA0woT.jpg"],"type":"tweet"},{"author":"0xJeff","summary":"Flags a surge in onchain AI gateways, marketplaces and inference providers (AskSurplus, engyai, dphnAI, AskVenice) offering OpenRouter-style speed/reliability at a 50–90% discount. With Stripe already owning onchain onboarding (Privy) and stablecoin rails (Bridge), and reportedly acquiring OpenRouter, wouldn't be surprised if Stripe next targets cheap/efficient onchain AI inference suppliers directly.","tweet_url":"https://x.com/0xJeff/status/2089688560232484987","images":[],"type":"tweet"},{"author":"dgt10011","summary":"On Metaplanet's move to take a controlling stake in Nasdaq-listed Super League Enterprise (renaming it Superplanet as a US Bitcoin treasury vehicle): says the team \"knows exactly what Bitcoin represents\" from the angle of leveraging both the world's largest debtor and creditor nations against an eventual monetary reset.","tweet_url":"https://x.com/dgt10011/status/2089719415994470552","images":[],"type":"tweet"},{"author":"sjdedic","summary":"Recounts a call with the founder of a token with a nine-figure FDV who says a listing manager at an unnamed Tier-1 CEX asked to be bought a new Range Rover in exchange for a listing; the founder refused, and the listing application was rejected shortly after. Says he wouldn't be surprised if this happens at every CEX and calls for the practice to end.","tweet_url":"https://x.com/sjdedic/status/2089700735332045080","images":[],"type":"thread"},{"author":"elerianm","summary":"UK July data shows growing labor-market weakness: payrolls fell 13,000, vacancies dropped to 707,000 (a five-year low), and ex-bonus earnings growth slowed to 2.8% (lowest in six years). The unemployment rate held at 4.9%, but the statistics office flagged data-distortion caveats even on that relative bright spot.","tweet_url":"https://x.com/elerianm/status/2089687523282825692","images":[],"type":"tweet"},{"author":"lopp","summary":"Argues preppers shouldn't limit themselves to analog survival skills — cyber-prepping now belongs in the kit too, including loading hard drives with Wikipedia archives, educational media, and the most powerful open-weight LLMs available for offline use.","tweet_url":"https://x.com/lopp/status/2089760832242487596","images":[],"type":"tweet"},{"author":"GavinSBaker","summary":"Responding to a joke about AI labs, says he genuinely thinks at least two other labs beyond the obvious one believe they might be creating God — a notable admission from a fund manager closely tracking the frontier labs.","tweet_url":"https://x.com/GavinSBaker/status/2089734633868951890","images":[],"type":"tweet"},{"author":"garrytan","summary":"Says his \"GBrain\" project works with any AI harness (Grok, Claude Code, Codex, Hermes Agent, OpenClaw, OpenCode) paired with any Postgres+pgvector-hosted service, framing this interoperability as what it actually means to own an AI agent's memory and skills rather than being locked into one vendor's persistence layer.","tweet_url":"https://x.com/garrytan/status/2089733961492930659","images":[],"type":"tweet"},{"author":"jchervinsky","summary":"Calls pre-IPO perpetuals \"one of crypto's few breakout hits\" and the best available tool for price discovery ahead of an IPO. With the SEC asking how to modernize the IPO process, says his answer (with @tradexyz) is to bring pre-IPO perpetuals onshore in the US.","tweet_url":"https://x.com/jchervinsky/status/2089701989919690942","images":[],"type":"tweet"},{"author":"AndreCronjeTech","summary":"Corrects a DefiLlama treasury figure for a protocol (flyingtulip), noting PUT options shouldn't be counted as treasury assets outright since they're contingent — they may or may not convert to holdings depending on whether the counterparty exercises them. Says he'll submit a PR to fix the numbers.","tweet_url":"https://x.com/AndreCronjeTech/status/2089664929028526267","images":[],"type":"tweet"},{"author":"Matt_Hougan","summary":"Endorsed a thesis that crypto token buybacks are now a matter of \"when,\" not \"if,\" and that after 15+ years of inventing bespoke valuation frameworks, crypto may have simply rediscovered the P/E ratio.","tweet_url":"https://x.com/Matt_Hougan/status/2089721845859615139","images":[],"type":"tweet"}],"C_contrarian":[{"author":"AndreasSteno","summary":"Contrarian to the bond-selloff-as-doom narrative dominating the feed today: says he isn't worried about the rising long end — he's worried about the opposite. Argues a steep curve is precisely the mechanism that pulls private balance sheets in to fund the AI buildout, pointing to Japan as the model.","tweet_url":"https://x.com/AndreasSteno/status/2089753183916572779","images":["https://pbs.twimg.com/media/HQBLcdqWwAAFad8.png"],"type":"tweet"},{"author":"stacy_muur","summary":"Against the cycle-optimism running through much of today's crypto commentary: lists record ETF outflows, projects shutting down, protocol hacks, the endlessly-delayed CLARITY Act, and stalled national crypto reserves, and asks flatly whether anything genuinely bullish has happened in crypto this year.","tweet_url":"https://x.com/stacy_muur/status/2089738340706951308","images":[],"type":"tweet"},{"author":"Pentosh1","summary":"Floats a minority framing against the standard \"risk asset\" treatment of Bitcoin: \"What if BTC is just a risk-off/defensive asset now and trades well when defensives do?\"","tweet_url":"https://x.com/Pentosh1/status/2089738646744092812","images":[],"type":"tweet"},{"author":"himgajria","summary":"Responding to a thesis that GPU compute will become worthless — comparing today's \"GPU barons\" to 1900s carriage barons who built out infrastructure for horse carriages right before the automobile made it obsolete — replies simply: \"When, not if,\" endorsing the minority view that today's compute buildout could itself be stranded capital.","tweet_url":"https://x.com/himgajria/status/2089759838314353021","images":["https://pbs.twimg.com/media/HQBRfmpawAAFME_.jpg"],"type":"tweet"},{"author":"Geiger_Capital","summary":"A Republican critiquing his own party's trajectory: notes Republicans held the White House, Senate, House and Supreme Court with the first popular-vote win in 20+ years on a nationalist platform, then \"immediately threw it all away for a new foreign war in the Middle East\" — flagged alongside 50/50 Senate odds and Democrats on track to take both chambers.","tweet_url":"https://x.com/Geiger_Capital/status/2089748923749409055","images":[],"type":"tweet"}],"D_positioning":[{"author":"Crypto_McKenna","summary":"Explicitly and repeatedly bullish on BTC through the session: \"Incredibly bullish on BTC and the broader market here,\" \"Bitcoin about to scream and the bears are going to get steamrolled,\" and \"Volatility inbound\" — a running long call, not a one-off.","tweet_url":"https://x.com/Crypto_McKenna/status/2089721016213995548","images":[],"type":"tweet"},{"author":"aleabitoreddit","summary":"Lays out live semiconductor/photonics positioning: watching for $AAOI to revisit ~$80 to add more; sees the sharpest recovery pattern in optical names ($LITE/$COHR fastest, $AAOI/$AXTI about halfway, $SIVE/$POET slowest) after AI-semi weakness; also likes neocloud ($NBIS) and memory ($SNDK) exposure given insane demand visibility into 2027 for laser names.","tweet_url":"https://x.com/aleabitoreddit/status/2089690098875130084","images":["https://pbs.twimg.com/media/HQARbaSbMAAZMR1.jpg"],"type":"tweet"},{"author":"_tolks","summary":"Documented an active, high-conviction trading day: called his own book \"the most mentally ill perp book to ever exist\" while running equity shorts alongside HL positions; closed the equity perp shorts after an unexpected -10% single-name move, staying broadly apathetic on coins given how good equity vol has been, while continuing to hold spot BTC/HYPE/LIT/ZEC accumulated since sub-$60k BTC. Separately flagged NOC and LLY holding up unusually well during the equity selloff, and reloaded a range-long trade he'd flagged before.","tweet_url":"https://x.com/_tolks/status/2089710677615063178","images":["https://pbs.twimg.com/media/HQAkTKRWMAA34xi.png"],"type":"thread"},{"author":"spotgamma","summary":"Options positioning data: equity traders remain heavily skewed toward calls across top stocks, based on a scatter of 1-month 25-delta call IV vs. put IV concentrated in the lower-right (call-heavy) quadrant.","tweet_url":"https://x.com/spotgamma/status/2089755584459329611","images":["https://pbs.twimg.com/media/HQBNHDhWEAAm0qa.jpg"],"type":"tweet"},{"author":"dampedspring","summary":"Questioned the scale of a widely-shared chart implying ~$25bn of NQ (Nasdaq futures) net shorts from a specific cohort — running the notional math (42900 × 20 × 29500 ≈ $25.3bn) and asking whether that's actually a big deal in context; confirmed in a follow-up it's \"certainly not naked short.\"","tweet_url":"https://x.com/dampedspring/status/2089746482190491991","images":[],"type":"thread"},{"author":"jimcramer","summary":"Specific trade idea: \"As I told CNBC Investing Club members, another chance to buy Intel right here.\"","tweet_url":"https://x.com/jimcramer/status/2089738902043082797","images":[],"type":"tweet"},{"author":"jimcramer","summary":"Flagged record NDX short interest via a shared chart, adding: \"Could the masses be right? Maybe. But history says the crowd isn't usually that great at the extremes.\"","tweet_url":"https://x.com/jimcramer/status/2089739521977942408","images":[],"type":"tweet"},{"author":"marcvanderchijs","summary":"Flags a new ARK ETF (ARKY) targeting a 17.5% return via Synthetic Equity-Linked Notes across 25–50 companies — a structured-income product built with options/derivatives to replicate note-like exposure, now available fully liquid where it used to require private banking access.","tweet_url":"https://x.com/marcvanderchijs/status/2089710008116339009","images":[],"type":"tweet"},{"author":"mert","summary":"Solana hit an all-time high in onchain transactions today — \"up and to the right,\" with supporting chart.","tweet_url":"https://x.com/mert/status/2089738242023174610","images":["https://pbs.twimg.com/media/HQA9xblXgAAZK6L.jpg"],"type":"tweet"}],"E_links":[{"author":"dampedspring","url":"https://substack.com/@dampedspring/note/p-186249548?r=ljaj6&utm_medium=ios&utm_source=notes-share-action","tweet_url":"https://x.com/dampedspring/status/2089750008123761014","description":"Substack note on private-sector share sales and missed gains"},{"author":"Geiger_Capital","url":"https://www.geigercap.com/p/youre-witnessing-a-global-debt-crisis","tweet_url":"https://x.com/Geiger_Capital/status/2089707936910090575","description":"\"You're Witnessing a Global Debt Crisis\" — resurfaced as yields spike"},{"author":"zriboua","url":"https://americanmind.org/salvo/how-third-worldism-can-destroy-the-west/","tweet_url":"https://x.com/zriboua/status/2089758951554297922","description":"American Mind piece on third-worldism, citing Zimbabwe's land reform collapse"},{"author":"zriboua","url":"https://christopherrufo.com/p/the-return-of-third-worldism-d6a","tweet_url":"https://x.com/zriboua/status/2089754069543891262","description":"Christopher Rufo Q&A on the return of third-worldism"},{"author":"zriboua","url":"https://www.zinebriboua.com/p/the-erdogan-calculation","tweet_url":"https://x.com/zriboua/status/2089740055262679321","description":"\"The Erdogan Calculation\" — Turkey's leverage over Iraq via Syria and water"},{"author":"Delphi_Digital","url":"https://members.delphidigital.io/media/delphis-market-matters-august-2026","tweet_url":"https://x.com/Delphi_Digital/status/2089731647960674643","description":"Delphi's Market Matters — August 2026 episode"},{"author":"Delphi_Digital","url":"https://www.youtube.com/watch?v=W_hZKCnebKk","tweet_url":"https://x.com/Delphi_Digital/st // ---------- helpers ----------
const CAT_VARS = {
  macro: 'var(--cat-macro)',
  crypto: 'var(--cat-crypto)',
  energy: 'var(--cat-energy)',
  tech: 'var(--cat-tech)',
  ai: 'var(--cat-ai)',
  'ai/infra': 'var(--cat-ai)',
  geopolitics: 'var(--cat-geopolitics)',
  positioning: 'var(--cat-positioning)',
  regulation: 'var(--cat-regulation)',
  society: 'var(--cat-society)',
  em: 'var(--cat-em)',
};
function catColor(cat) {
  if (!cat) return 'var(--cat-default)';
  return CAT_VARS[String(cat).toLowerCase()] || 'var(--cat-default)';
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function escapeAttr(s) {
  return escapeHtml(s).replace(/`/g, '&#96;');
}

function renderBold(text) {
  return escapeHtml(text).replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
}

function relativeTime(iso) {
  if (!iso) return '';
  const dt = new Date(iso);
  if (isNaN(dt.getTime())) return '';
  const secs = Math.max(0, (Date.now() - dt.getTime()) / 1000);
  if (secs < 60)   return Math.floor(secs) + 's ago';
  const mins = secs / 60;
  if (mins < 60)   return Math.floor(mins) + 'm ago';
  const hrs  = mins / 60;
  if (hrs < 48)    return Math.floor(hrs) + 'h ago';
  return Math.floor(hrs / 24) + 'd ago';
}

function pill(cat) {
  if (!cat) return '';
  return `<span class="pill" style="background:${catColor(cat)}">${escapeHtml(cat)}</span>`;
}

function authorTag(name, cls = 'item-author') {
  if (!name) return '';
  return `<span class="${cls}" onclick="filterAuthor('${escapeAttr(name)}')">@${escapeHtml(name)}</span>`;
}

// ---------- rendering ----------
function renderThumbs(images) {
  if (!images || !images.length) return '';
  return `<div class="thumbs">` + images.map(u =>
    `<img src="${escapeAttr(u)}" class="thumb" loading="lazy" alt="" onclick="openLightbox('${escapeAttr(u)}')">`
  ).join('') + `</div>`;
}

function renderItem(item) {
  const author = item.author || item.author_username || '';
  const time = relativeTime(item.created_at);
  const thread = item.is_thread ? '<span class="item-thread">thread</span>' : '';
  const link = item.tweet_url
    ? `<a class="item-link" href="${escapeAttr(item.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  return `
    <div class="item-card filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${pill(item.category)}
        ${authorTag(author)}
        ${thread}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      <div class="item-text">${escapeHtml(item.text || '')}</div>
      ${renderThumbs(item.images)}
    </div>`;
}

function renderClusterItem(it) {
  const author = it.author || it.author_username || '';
  const time = relativeTime(it.created_at);
  const link = it.tweet_url
    ? `<a class="item-link" href="${escapeAttr(it.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  return `
    <div class="cluster-item filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${authorTag(author)}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      <div class="item-text">${escapeHtml(it.text || '')}</div>
      ${renderThumbs(it.images)}
    </div>`;
}

function renderCluster(cluster) {
  const itemsHtml = (cluster.items || []).map(renderClusterItem).join('');
  return `
    <div class="cluster">
      <div class="cluster-head">
        ${pill(cluster.category)}
        <div class="cluster-title">${escapeHtml(cluster.title || '')}</div>
      </div>
      ${cluster.description ? `<div class="cluster-desc">${escapeHtml(cluster.description)}</div>` : ''}
      ${itemsHtml ? `<div class="cluster-items">${itemsHtml}</div>` : ''}
    </div>`;
}

function renderLink(l) {
  const author = l.author || l.author_username || '';
  const url = l.url || (l.resolved || l.tco) || '';
  return `
    <div class="link-row filterable" data-author="${escapeAttr(author).toLowerCase()}">
      ${author
        ? authorTag(author, 'link-author')
        : '<span class="link-author">—</span>'}
      <a class="link-url" href="${escapeAttr(url)}" target="_blank" rel="noopener">${escapeHtml(url)}</a>
      ${l.description ? `<span class="link-desc">${escapeHtml(l.description)}</span>` : ''}
    </div>`;
}

function renderSection(letter, name, items, type) {
  if (!items || !items.length) return '';
  let body;
  if (type === 'events') {
    body = items.map(renderCluster).join('');
  } else if (type === 'links') {
    body = items.map(renderLink).join('');
  } else {
    body = items.map(renderItem).join('');
  }
  const cls = type === 'contrarian' ? 'section section-contrarian' : 'section';
  return `
    <div class="${cls}">
      <div class="section-head" onclick="toggleSection(this)">
        <span class="section-letter">${letter}.</span>
        <span class="section-name">${escapeHtml(name)}</span>
        <span class="section-count">${items.length}</span>
        <span class="section-arrow">▸</span>
      </div>
      <div class="section-body">${body}</div>
    </div>`;
}

function renderSummary(text) {
  if (!text) return '';
  const paragraphs = String(text).split(/\n\n+/).filter(Boolean)
    .map(p => `<p>${renderBold(p)}</p>`).join('');
  return `<div class="summary">${paragraphs}</div>`;
}

function renderStats(d) {
  const s = (d && d.stats) || d || {};
  const parts = [];
  if (s.received    != null) parts.push(`received <strong>${s.received}</strong>`);
  if (s.after_filter!= null) parts.push(`after filter <strong>${s.after_filter}</strong>`);
  if (s.authors     != null) parts.push(`authors <strong>${s.authors}</strong>`);
  if (s.coverage    != null) {
    const pct = (s.coverage <= 1 ? s.coverage * 100 : s.coverage);
    parts.push(`coverage <strong>${pct.toFixed(0)}%</strong>`);
  }
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSection(headEl) {
  headEl.parentElement.classList.toggle('open');
}

function openLightbox(src) {
  const img = document.getElementById('lightbox-img');
  img.src = src;
  document.getElementById('lightbox').classList.add('open');
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-img').src = '';
}

let activeFilter = null;
function filterAuthor(name) {
  if (!name) return;
  activeFilter = String(name).toLowerCase();
  document.querySelectorAll('.filterable').forEach(el => {
    const a = (el.dataset.author || '').toLowerCase();
    if (a === activeFilter) {
      el.classList.add('match');
      el.classList.remove('dim');
    } else {
      el.classList.add('dim');
      el.classList.remove('match');
    }
  });
  document.getElementById('filter-name').textContent = '@' + name;
  document.getElementById('filter-bar').classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function clearFilter() {
  activeFilter = null;
  document.querySelectorAll('.filterable').forEach(el => {
    el.classList.remove('match');
    el.classList.remove('dim');
  });
  document.getElementById('filter-bar').classList.remove('active');
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (document.getElementById('lightbox').classList.contains('open')) {
      closeLightbox();
    } else if (activeFilter) {
      clearFilter();
    }
  }
});

// ---------- schema normalization ----------
// Some producer runs emit the "sections" schema documented in the routine
// spec (report_type/input_stats/sections.A_events.../coverage) instead of
// the flat schema this renderer reads (date/events/insights/contrarian/
// positioning/links/stats). Normalize so either shape renders correctly.
function firstOf(v) {
  return Array.isArray(v) ? v[0] : v;
}

function normalizeItem(it) {
  if (!it || typeof it !== 'object') return it;
  return {
    author: it.author || it.author_username,
    text: it.text != null ? it.text : it.summary,
    category: firstOf(it.category),
    tweet_url: firstOf(it.tweet_url),
    images: it.images,
    created_at: it.created_at,
    is_thread: it.is_thread != null ? it.is_thread : (it.type === 'thread'),
  };
}

function normalizeData(d) {
  if (!d || typeof d !== 'object') return {};
  const hasFlat = d.events || d.insights || d.contrarian || d.positioning || d.links || d.stats;
  if (hasFlat) return d;

  const s = d.sections;
  if (!s) return d;

  const out = Object.assign({}, d);
  out.date = d.date || (d.collected_at ? String(d.collected_at).replace('T', ' ').replace('Z', ' UTC') : '');
  if (s.A_events) {
    out.events = s.A_events.map(cl => ({
      title: cl.cluster || cl.title,
      category: firstOf(cl.category),
      description: cl.description,
      items: (cl.items || []).map(normalizeItem),
    }));
  }
  if (s.B_insights) out.insights = s.B_insights.map(normalizeItem);
  if (s.C_contrarian) out.contrarian = s.C_contrarian.map(normalizeItem);
  if (s.D_positioning) out.positioning = s.D_positioning.map(normalizeItem);
  if (s.E_links) {
    out.links = s.E_links.map(l => ({
      author: l.author,
      url: l.url,
      tweet_url: firstOf(l.tweet_url),
      description: l.note || l.description,
    }));
  }
  const stats = d.stats || {};
  out.stats = {
    received: stats.received != null ? stats.received : (d.input_stats && d.input_stats.total_tweets),
    after_filter: stats.after_filter != null ? stats.after_filter : (d.input_stats && d.input_stats.after_noise_filter),
    authors: stats.authors != null ? stats.authors : (d.coverage && d.coverage.authors_total),
    coverage: stats.coverage != null ? stats.coverage : (d.coverage && d.coverage.coverage_pct),
  };
  return out;
}

// ---------- main ----------
function renderReport(d) {
  d = normalizeData(d);
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  const sections = [
    renderSummary(d.summary),
    renderSection('A', 'Events & Reactions',      d.events,                                'events'),
    renderSection('B', 'Alpha & Insights',        d.insights || d.alpha,                   'items'),
    renderSection('C', 'Contrarian Views',        d.contrarian,                            'contrarian'),
    renderSection('D', 'Positioning & Trade Ideas', d.positioning,                         'items'),
    renderSection('E', 'Link Queue',              d.links,                                 'links'),
  ].join('');
  const app = document.getElementById('app');
  app.innerHTML = sections || '<div class="empty">No report data.</div>';

  // Auto-open first two sections.
  document.querySelectorAll('.section').forEach((s, i) => {
    if (i < 2) s.classList.add('open');
  });

  document.getElementById('stats').innerHTML = renderStats(d);
}

renderReport(REPORT_DATA);
</script>
