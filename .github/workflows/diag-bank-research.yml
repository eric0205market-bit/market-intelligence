name: Diagnose Bank Research Query

# Manual-only diagnostic — NOT part of the regular collection pipeline, no
# schedule trigger. Isolates why collect_bank_research.py returns zero
# tweets by testing each BANK_RESEARCH_ACCOUNTS account individually, with
# and without filter:images. Writes nothing to data/ or raw/, no commit
# step — output is the workflow run's log only.

on:
  workflow_dispatch:
    inputs:
      days:
        description: 'Lookback window in days (must match what you are diagnosing)'
        required: false
        default: '5'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run bank-research query diagnostic
        env:
          GETXAPI_KEY: ${{ secrets.GETXAPI_KEY }}
        run: python scripts/diag_bank_research.py --days ${{ github.event.inputs.days || '5' }}
